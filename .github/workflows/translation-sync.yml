name: Auto-Translate Sync

on:
  push:
    branches:
      - master
    paths:
      - 'precis/fr/**/*.qmd'
      - 'precis/fr/**/_quarto.yml'
      - 'precis/ar/**/*.qmd'
      - 'precis/ar/**/_quarto.yml'
      - 'CHANGELOG.md'
  # PAS de déclencheur `pull_request`. Sur une PR, les filtres `paths` sont
  # évalués sur le diff ENTIER de la PR, pas sur le seul nouveau commit : tant
  # que la PR reste ouverte, chaque push relance donc la synchro et ouvre une PR
  # de traduction de plus — y compris pour des commits qui ne touchent pas au
  # français (une correction de CI, une note). Cascade observée le 27/08/2026 :
  # six PR de traduction pour une seule PR de contenu, cinq à fermer à la main.
  #
  # La traduction part donc APRÈS le merge sur master, une fois, sur le texte
  # définitif, dans une PR unique. Contrepartie assumée : le site a brièvement
  # un français plus récent que son arabe.
  workflow_dispatch:
    # Re-synchro manuelle, utile quand un sync a échoué (ex. 503 Gemini) sans
    # nouveau commit FR.
    inputs:
      files:
        description: "Fichiers FR à retraduire (séparés par des espaces). Vide = tous les .qmd FR (hors _glossaire, généré)."
        required: false
        default: ""

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Get changed files
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            INPUT_FILES="${{ github.event.inputs.files }}"
            if [ -n "$INPUT_FILES" ]; then
              # Re-synchro ciblée sur les fichiers fournis.
              CHANGED="$INPUT_FILES"
            else
              # Re-synchro totale : tous les .qmd / _quarto.yml FR, SAUF les
              # _glossaire.qmd (générés par build_glossary.py, pas traduits).
              CHANGED=$(git ls-files | grep -E '^precis/fr/.*\.(qmd|yml)$' | grep -v '_glossaire\.qmd' | tr '\n' ' ' || true)
            fi
          else
            BASE_SHA=${{ github.event.before }}
            HEAD_SHA=${{ github.sha }}
            # Le FR est TOUJOURS la source de vérité ; l'AR est généré, jamais
            # rédigé à la main. On ne propage donc QUE FR→AR, sur push ET en PR.
            # Le sens AR→FR est un piège : une modif AR (PR de config AR-only, ou
            # merge d'une PR auto-translate) y déclencherait une rétro-traduction
            # AR→FR ouvrant une PR parasite qui corromprait la source FR
            # (boucle observée : #31, #35, #37, #44). On filtre le diff au FR.
            PATTERN='precis/fr/.*\.(qmd|yml)$|^CHANGELOG\.md$'
            CHANGED=$(git diff --name-only $BASE_SHA $HEAD_SHA | grep -E "$PATTERN" | tr '\n' ' ' || true)
          fi
          echo "files=$CHANGED" >> $GITHUB_OUTPUT

      - name: Run translation script
        if: steps.changed-files.outputs.files != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # base == head → diff vide. Le script part alors de la traduction
            # existante et la met à jour, sans repartir de zéro : c'est ce qui
            # protège les corrections faites à la main sur l'arabe seul.
            BASE_SHA=${{ github.sha }}
            HEAD_SHA=${{ github.sha }}
          else
            BASE_SHA=${{ github.event.before }}
            HEAD_SHA=${{ github.sha }}
          fi
          echo "Translating files: ${{ steps.changed-files.outputs.files }}"
          uv run --with google-genai python scripts/translate_sync.py $BASE_SHA $HEAD_SHA ${{ steps.changed-files.outputs.files }}

      - name: Open PR with translation changes
        id: open-pr
        if: steps.changed-files.outputs.files != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add precis/
          git add CHANGELOG_ar.md 2>/dev/null || true

          # Rien à propager → on s'arrête proprement.
          if git diff --staged --quiet; then
            echo "No translation changes to commit."
            echo "pr=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # `master` est une branche protégée (require PR) : on ne pousse pas en
          # direct. On dépose la traduction sur une branche dédiée et on ouvre une
          # PR. Une PR créée via GITHUB_TOKEN ne re-déclenche aucun workflow
          # (pas de boucle de traduction) ; le merge humain déploie la version AR.
          BRANCH="auto-translate/${{ github.sha }}"
          git checkout -b "$BRANCH"
          git commit -m "Auto-translate sync (fr -> ar) [skip ci]"
          git push -f origin "$BRANCH"

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "PR déjà ouverte pour $BRANCH."
          else
            gh pr create --base master --head "$BRANCH" \
              --title "Auto-translate sync (AR) — ${{ github.sha }}" \
              --body "Synchronisation automatique FR→AR générée par \`translation-sync\` à partir de ${{ github.sha }}.

          \`master\` étant protégée (require PR), la traduction passe par cette PR. **Merge-la pour déployer la version arabe.**

          Sa création ne déclenche aucun workflow (PR ouverte avec le \`GITHUB_TOKEN\`) : la vérification est donc exécutée par le job qui l'a produite, à l'étape suivante, et son rapport est posté ici en commentaire."
          fi

          # Sorties pour les étapes de contrôle. La borne basse doit précéder le
          # changement FRANÇAIS, et pas seulement le commit de traduction : sinon
          # le diff FR est vide et le Checker AI n'a rien à comparer — c'est le
          # défaut qui le faisait passer au vert sans rien vérifier. Sur un push,
          # cette borne est `github.event.before`. En re-synchro manuelle il n'y
          # a pas de changement FR à valider : le checker le dira honnêtement, et
          # c'est le contrôle de parité — qui compare les fichiers et non les
          # diffs — qui fait alors le travail.
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERIFY_BASE=$(git rev-parse HEAD~1)
          else
            VERIFY_BASE=${{ github.event.before }}
          fi
          {
            echo "pr=$(gh pr view "$BRANCH" --json number -q .number)"
            echo "base=$VERIFY_BASE"
            echo "head=$(git rev-parse HEAD)"
          } >> $GITHUB_OUTPUT

      # Contrôle mécanique, sans appel réseau : citations, ancres, cibles de
      # liens, numéros de textes juridiques, labels de figures, locateurs. Il
      # attrape avec certitude ce que le checker IA peut laisser passer — un
      # numéro de loi réécrit produit un texte idiomatique et plausible, mais qui
      # ne renvoie plus au bon texte. `continue-on-error` pour que le checker IA
      # tourne quand même et que la PR reçoive les deux rapports d'un coup ; le
      # verdict est rendu par l'étape de synthèse en fin de job.
      - name: Check FR/AR parity (deterministic)
        id: parity
        if: steps.open-pr.outputs.pr != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.open-pr.outputs.pr }}
        run: |
          set +e
          # Restreint aux fichiers qui viennent d'être traduits. Sans cela, le
          # contrôle échouerait sur la dette préexistante d'autres chapitres —
          # le corpus arabe mélange aujourd'hui deux conventions de numérotation
          # selon les livres — et bloquerait toute PR de traduction pour des
          # raisons étrangères à son contenu. Pour un audit d'ensemble, lancer
          # le script sans argument en local.
          python3 scripts/check_translation_parity.py ${{ steps.changed-files.outputs.files }} | tee parity.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            { echo "⚠️ **Contrôle de parité FR/AR (déterministe)**"
              echo
              echo "Des jetons qui doivent être identiques dans les deux langues divergent."
              echo "Ce contrôle ne juge pas le sens : il compare les clés de citation, les"
              echo "ancres, les cibles de liens, les **numéros de textes juridiques** et les"
              echo "labels de figures."
              echo
              echo '```'
              cat parity.log
              echo '```'
            } > parity_comment.md
            gh pr comment "$PR_NUMBER" -F parity_comment.md || echo "Commentaire non posté."
          fi
          exit $rc

      # La PR ci-dessus est ouverte avec le GITHUB_TOKEN, ce qui par conception
      # ne déclenche AUCUN workflow : `verify-translation.yml`, qui écoute
      # `pull_request`, ne tourne donc jamais sur le contenu arabe réellement
      # livré. Il tournait uniquement sur la PR FR d'origine, où le diff AR est
      # vide — et où le script se contentait de sauter chaque fichier. La
      # vérification est donc rapatriée ici, dans le job qui produit la
      # traduction, seul endroit où elle porte sur ce qui sera mergé.
      - name: Verify the generated translation
        if: steps.open-pr.outputs.pr != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.open-pr.outputs.pr }}
          BASE_SHA: ${{ steps.open-pr.outputs.base }}
          HEAD_SHA: ${{ steps.open-pr.outputs.head }}
        run: |
          uv run --with google-genai python scripts/verify_translation.py

      # `continue-on-error` sur l'étape de parité laisse le job vert même quand
      # elle échoue : sans ce verdict final, une divergence de numéro de loi
      # passerait inaperçue.
      - name: Gate on the parity check
        if: always() && steps.parity.outcome == 'failure'
        run: |
          echo "Le contrôle de parité FR/AR a échoué : voir son rapport ci-dessus" \
               "et le commentaire posté sur la PR de traduction."
          exit 1
