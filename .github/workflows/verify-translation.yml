name: Verify Translation (Checker AI)

# PORTÉE — à lire avant de se fier au vert de ce workflow.
#
# Il ne couvre PAS les PR `auto-translate/*`. Celles-ci sont ouvertes avec le
# `GITHUB_TOKEN`, ce qui par conception ne déclenche aucun workflow : rien
# n'écoute donc leur `pull_request`. La vérification du contenu arabe réellement
# livré est faite par `translation-sync.yml`, dans le job même qui le produit
# (étape « Verify the generated translation »), et son rapport est posté en
# commentaire sur la PR de traduction.
#
# Ce workflow-ci sert aux PR ordinaires touchant les deux langues. Sur une PR où
# seul le français a bougé, le script saute chaque fichier faute de diff arabe à
# comparer, et le dit explicitement dans son journal : un job vert n'y vaut alors
# PAS validation de la traduction.

on:
  pull_request:
    paths:
      - 'precis/fr/**/*.qmd'
      - 'precis/fr/**/_quarto.yml'
      - 'precis/ar/**/*.qmd'
      - 'precis/ar/**/_quarto.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run verification script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          uv run --with google-genai python scripts/verify_translation.py
