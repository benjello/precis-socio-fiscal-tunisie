name: Verify Translation (Checker AI)

# PORTÉE — à lire avant de se fier au vert de ce workflow.
#
# Il ne couvre PAS les PR `auto-translate/*`. Celles-ci sont ouvertes avec le
# `GITHUB_TOKEN`, ce qui par conception ne déclenche aucun workflow : rien
# n'écoute donc leur `pull_request`. La vérification du contenu arabe réellement
# livré est faite par `translation-sync.yml`, dans le job même qui le produit
# (étape « Verify the generated translation »), et son rapport est posté en
# commentaire sur la PR de traduction.
#
# Ce workflow-ci sert aux PR ordinaires — au premier chef celles qui corrigent
# l'ARABE seul, à la main. Il y fait tourner le contrôle de parité déterministe,
# qui est le seul filet contre une clé de citation, une ancre ou un numéro de
# texte cassés par une retouche humaine.
#
# Le Checker AI, lui, compare deux diffs : sur une PR où une seule langue a
# bougé, il saute chaque fichier et le dit explicitement dans son journal. Un job
# vert ne vaut alors PAS validation de la traduction — c'est le contrôle de
# parité qui aura fait le travail.

# Les `_quarto.yml` NE SONT PLUS ÉCOUTÉS ici. Ils ne sont plus traduits : le fichier
# arabe porte des éléments sans original français — `dir: rtl`, le bloc `language:` des
# libellés d'interface, les titres des parties — et se tient à la main. Ni le Checker AI
# ni le contrôle de parité n'ont donc de paire à comparer, et les garder ici ne
# produirait que du bruit. Le mode de défaillance réel — chapitres qui dérivent, fichier
# malformé — est couvert par `rendre-les-livres.yml`, qui écoute `precis/**` et rend les
# dix livres, l'arabe compris et pour cette raison même.
on:
  pull_request:
    paths:
      - 'precis/fr/**/*.qmd'
      - 'precis/ar/**/*.qmd'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Utile surtout sur une PR corrigeant l'ARABE seul — cas courant, et le
      # seul endroit où une main humaine peut casser une clé de citation, une
      # ancre ou un numéro de texte sans que rien ne le signale. Le contrôle est
      # restreint aux fichiers de la PR : lancé sur tout le dépôt il remonterait
      # la dette préexistante d'autres livres.
      #
      # CONSULTATIF ici, bloquant dans `translation-sync`. La différence est
      # voulue : là-bas l'arabe vient d'être généré en bloc et la parité doit
      # tenir ; ici la PR est humaine, et faire échouer la PR de quelqu'un pour
      # une divergence qu'il n'a pas introduite serait punir la mauvaise
      # personne. Le rapport est là, à lire.
      #
      # ÉTAT DE LA DETTE. Au 27/08/2026, fiscalite, retraites,
      # prestations_sociales et _regime_conventionnel portaient des divergences
      # antérieures. Mesuré le 14/09/2026 : **plus aucune** — 14 paires FR/AR,
      # zéro divergence sur tout le corpus (vérifié aussi par les codes de
      # retour, pas seulement par la sortie). Les synchronisations successives
      # les ont résorbées, la dernière étant la retraduction complète du chapitre
      # des prestations sociales, qui a restitué trois clés de citation et une
      # ancre d'un coup.
      #
      # Le `continue-on-error` est conservé : une dette éteinte peut renaître, et
      # ce job doit rester lisible plutôt que bloquant sur une PR humaine. Si la
      # dette reste nulle durablement, le rendre bloquant deviendra tentant — ou
      # lui donner le `--compare-to` de `translation-sync`, qui ne reproche que
      # les régressions.
      - name: Check FR/AR parity (deterministic)
        continue-on-error: true
        run: |
          # Le CHANGELOG est traduit lui aussi, et sa cible vit à la racine : sans
          # lui, quatre corruptions d'URL y sont passées inaperçues en une journée.
          FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} \
                                       ${{ github.event.pull_request.head.sha }} \
                  | grep -E '^precis/(fr|ar)/.*\.qmd$|^CHANGELOG(_ar)?\.md$' | tr '\n' ' ' || true)
          if [ -z "$FILES" ]; then
            echo "Aucun fichier traduit dans cette PR."
            exit 0
          fi
          echo "Rapport consultatif — une divergence ici peut être antérieure à cette PR."
          python3 scripts/check_translation_parity.py $FILES

      - name: Run verification script
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          uv run --with google-genai python scripts/verify_translation.py
