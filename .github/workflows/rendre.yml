name: Rendre le site

# Workflow APPELÉ — par `deploy.yml` (deux fois : HTML, puis PDF) et par `rendre-les-livres.yml`
# (HTML seul, contrôle de PR). Il rend UN livre par job, en parallèle.
#
#   mode html : rend le HTML de chaque livre, puis assemble le site (avec `publier`, le dépose pour
#               GitHub Pages sous le nom `site-html`) ;
#   mode pdf  : rend le PDF de chaque livre (échec toléré), sans assembler : `deploy.yml` assemble
#               le site final une fois les PDF rendus.
# Le site ne dépend donc pas des PDF, qui sont la partie lente : voir `deploy.yml`.
#
# Avant (build.sh en série) : 53 min pour 13 livres français et 10 arabes, le 3 novembre 2026,
# dont 15 min pour `entreprises_publiques` ; une fusion qui ne touchait qu'un livre les
# reconstruisait tous. Maintenant :
#   - la durée est celle du livre le plus long, plus l'assemblage ;
#   - un livre dont les entrées n'ont pas changé reprend son `public/` du cache, sans rendu.
#
# CLÉ DU CACHE. Elle couvre tout ce qui peut changer le rendu d'un livre : le livre lui-même
# (sauf son `public/`), les fichiers partagés de la langue et de `precis/` (bibliographies,
# style de citation, glossaire, feuilles de style), les séries snapshotées (`_seriescache`),
# les scripts, les dépendances et ce fichier. Un oubli dans cette liste donne un livre
# périmé : ajouter ici tout nouveau fichier partagé. `CACHE_VERSION` invalide tout d'un coup.
#
# Un PDF qui échoue (`fiscalite`, par exemple) laisse le HTML : `build.sh` le dit et rend 0 ;
# le livre est alors mis en cache sans PDF jusqu'au prochain changement de ses entrées.

on:
  workflow_call:
    inputs:
      mode:
        description: "html (HTML puis assemblage du site) ou pdf (PDF seuls)"
        type: string
        default: html
      publier:
        description: "Déposer le site assemblé comme artefact GitHub Pages (mode html)"
        type: boolean
        default: false

  # Lancement à la main, pour essayer un rendu sans rien publier (`publier` reste faux).
  workflow_dispatch:
    inputs:
      mode:
        description: "html (HTML puis assemblage du site) ou pdf (PDF seuls)"
        type: choice
        options: [html, pdf]
        default: html
      publier:
        description: "Déposer le site assemblé comme artefact GitHub Pages (sans le déployer)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CACHE_VERSION: v1

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrice: ${{ steps.liste.outputs.matrice }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Livres à rendre
        id: liste
        run: echo "matrice=$(./build.sh --list-units)" >> "$GITHUB_OUTPUT"

  livre:
    needs: plan
    runs-on: ubuntu-latest
    # Un PDF qui échoue n'arrête rien : le livre garde le PDF du site en ligne.
    continue-on-error: ${{ inputs.mode == 'pdf' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrice) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Livre déjà rendu avec ces entrées ?
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ inputs.mode == 'pdf' && format('precis/{0}/public/*.pdf', matrix.unite) || format('precis/{0}/public', matrix.unite) }}
          key: rendu-${{ env.CACHE_VERSION }}-${{ inputs.mode }}-${{ matrix.unite }}-${{ hashFiles(format('precis/{0}/**', matrix.unite), format('!precis/{0}/public/**', matrix.unite), format('precis/{0}/*.json', matrix.lang), format('precis/{0}/*.bib', matrix.lang), 'precis/*.yml', 'precis/*.csl', 'precis/*.scss', 'precis/*.html', 'precis/*.json', 'precis/*.bib', 'precis/_seriescache/**', 'precis/filtres/**', 'scripts/**', 'pyproject.toml', 'uv.lock', 'build.sh', '.github/workflows/rendre.yml') }}

      - name: Set up Quarto
        if: steps.cache.outputs.cache-hit != 'true'
        uses: quarto-dev/quarto-actions/setup@v2

      # Voir `deploy.yml` avant le 3 novembre 2026 : l'installation de TinyTeX interroge l'API
      # GitHub ; sans jeton, l'appel anonyme est refusé (403) dès que la limitation de débit
      # s'applique. Le PDF est un supplément : l'étape ne doit pas arrêter le rendu du HTML.
      - name: Install TinyTeX for PDF rendering
        if: steps.cache.outputs.cache-hit != 'true' && inputs.mode == 'pdf'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: quarto install tinytex

      - name: Install uv
        if: steps.cache.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v7

      - name: Install Python dependencies via uv
        if: steps.cache.outputs.cache-hit != 'true'
        run: uv sync

      - name: Rendre le livre
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./build.sh --only ${{ matrix.unite }} ${{ inputs.mode == 'pdf' && '--pdf-only' || '--no-pdf' }}

      - name: Garder le livre rendu pour l'assemblage
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.mode == 'pdf' && 'pdf' || 'public' }}-${{ matrix.lang }}-${{ matrix.book }}
          path: ${{ inputs.mode == 'pdf' && format('precis/{0}/public/*.pdf', matrix.unite) || format('precis/{0}/public', matrix.unite) }}
          retention-days: 1
          if-no-files-found: ${{ inputs.mode == 'pdf' && 'ignore' || 'error' }}

  assemblage:
    if: inputs.mode == 'html'
    needs: livre
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python dependencies via uv
        run: uv sync

      - name: Reprendre les livres rendus
        uses: actions/download-artifact@v4
        with:
          pattern: public-*
          path: livres

      # Un site déployé remplace tout le précédent : les PDF du site en ligne sont repris, avec
      # une infobulle « version précédente » sur leur lien, jusqu'au déploiement final.
      - name: Remettre chaque livre à sa place
        run: scripts/placer_livres.sh livres ${{ inputs.publier && '--pdf-en-ligne' || '' }}

      - name: Pages générales et assemblage du site
        run: ./build.sh --assemble --no-pdf

      - name: Déposer le site pour GitHub Pages
        if: inputs.publier
        uses: actions/upload-pages-artifact@v4
        with:
          name: site-html
          path: local_site

      - name: Ce qui a été produit
        if: always()
        run: |
          {
            echo "## Livres rendus"
            echo
            if [ -d local_site ]; then
              find local_site -name index.html | sort | sed 's|^|- |'
            else
              echo "Aucun site assemblé : le rendu a échoué avant l'assemblage."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
