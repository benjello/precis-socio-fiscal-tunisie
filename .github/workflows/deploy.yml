name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # `continue-on-error` — voir #216. Cette étape interroge l'API GitHub SANS JETON
      # pour connaître la dernière version de TinyTeX, et se fait refuser (403) dès que
      # la limitation de débit s'applique. Mesuré le 15/09/2026 : deux échecs sur quatre
      # tentatives en une demi-heure, à quelques minutes d'intervalle.
      #
      # Le PDF est un SUPPLÉMENT ; le site, lui, est en HTML. Sans cette ligne, l'échec
      # de l'installation saute tout ce qui suit — construction et publication comprises
      # — alors que `build.sh` sait déjà se rabattre, livre par livre :
      #
      #     [build] ⚠ $book: PDF failed, HTML OK — deploying HTML only
      #
      # Ce repli était inutilisable : le job mourait avant de l'atteindre. Une dépendance
      # accessoire empêchait donc la publication de l'ensemble.
      - name: Install TinyTeX for PDF rendering
        continue-on-error: true
        run: quarto install tinytex

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python dependencies via uv
        run: uv sync

      - name: Build the site
        run: ./build.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: local_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
