name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Rendu parallèle, un livre par job, avec reprise du cache pour les livres inchangés :
  # voir `rendre.yml`. Le PDF d'un livre qui échoue laisse le HTML (build.sh le dit).
  rendre:
    uses: ./.github/workflows/rendre.yml
    with:
      pdf: true
      publier: true

  deploy:
    needs: rendre
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
