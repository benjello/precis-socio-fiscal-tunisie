name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Voir #216. Cette étape interroge l'API GitHub pour connaître la dernière version
      # de TinyTeX. Sans jeton, l'appel est anonyme et se fait refuser (403) dès que la
      # limitation de débit s'applique : deux échecs sur quatre tentatives en une
      # demi-heure, le 15/09/2026.
      #
      # `GH_TOKEN` traite la CAUSE — la limitation ne frappe que les appels anonymes.
      # `continue-on-error` couvre le cas résiduel. Les deux ne font pas double emploi.
      #
      # Le PDF est un SUPPLÉMENT ; le site, lui, est en HTML. Sans cette ligne, l'échec
      # de l'installation saute tout ce qui suit — construction et publication comprises
      # — alors que `build.sh` sait déjà se rabattre, livre par livre :
      #
      #     [build] ⚠ $book: PDF failed, HTML OK — deploying HTML only
      #
      # Ce repli était inutilisable : le job mourait avant de l'atteindre. Une dépendance
      # accessoire empêchait donc la publication de l'ensemble.
      - name: Install TinyTeX for PDF rendering
        continue-on-error: true
        env:
          # Quarto ne lit QUE `GH_TOKEN` — vérifié dans son bundle (quarto 1.6.39) :
          #     const headers = Deno.env.get("GH_TOKEN")
          #       ? { headers: { Authorization: "Bearer " + Deno.env.get("GH_TOKEN") } }
          #       : undefined;
          # `GITHUB_TOKEN`, le nom que l'on écrirait d'instinct, n'apparaît nulle part
          # dans le bundle : le poser n'aurait aucun effet, et l'étape étant tolérante,
          # l'erreur serait passée inaperçue.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: quarto install tinytex

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python dependencies via uv
        run: uv sync

      - name: Build the site
        run: ./build.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: local_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
