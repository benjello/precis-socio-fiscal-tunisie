name: Conventions de rédaction

# POURQUOI CE CONTRÔLE EXISTE
#
# Le précis documente la loi, jamais le modèle (`docs/conventions-redaction.md`, § 1).
# La règle était suivie de fait dans quatre livres sur cinq — leurs mentions
# d'`openfisca-tunisia` vivent toutes dans des blocs `python` ou des commentaires
# `<!-- TODO -->` — mais le cinquième l'a enfreinte vingt-neuf fois sans que rien ne le
# signale, parce qu'une convention non outillée ne tient que par l'attention de qui écrit.
#
# Le contrôle ne regarde que le texte RENDU : ni les blocs de code, ni les commentaires
# HTML, qui sont la destination prévue pour ce qu'on ne publie pas.

on:
  pull_request:
    paths:
      - 'precis/**/*.qmd'
      - 'precis/**/tables/**'
      - 'precis/glossaire.yml'
      - 'scripts/check_pas_de_modele.py'
      - 'scripts/check_jargon_depouillement.py'
      - 'scripts/recherches.py'
      - 'docs/recherches.yml'
      - 'scripts/build_glossary.py'
  push:
    branches:
      - master
    paths:
      - 'precis/**/*.qmd'
      - 'precis/**/tables/**'
      - 'precis/glossaire.yml'
      - 'scripts/check_pas_de_modele.py'
      - 'scripts/check_jargon_depouillement.py'
      - 'scripts/recherches.py'
      - 'docs/recherches.yml'
      - 'scripts/build_glossary.py'

permissions:
  contents: read

jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync

      - name: Le précis ne parle pas du modèle
        run: uv run python scripts/check_pas_de_modele.py

      # Même principe pour le travail de dépouillement : le texte rendu dit ce qui est
      # connu (« seul l'intitulé est connu ici », « n'est pas établi ici »), jamais
      # comment on l'a cherché (« consulté sur pièce », « lu à l'image », « OCR »).
      # Le constat de travail va dans un <!-- TODO (documentaliste) : … -->.
      - name: Le précis ne parle pas du dépouillement
        run: uv run python scripts/check_jargon_depouillement.py

      # Une recherche infructueuse ne se raconte pas dans le texte : un constat neutre, et
      # une ancre <!-- RECHERCHE r-… --> vers la fiche rejouable de docs/recherches.yml.
      # Ce contrôle ne lit que le dépôt (ni jort_cache ni corpus, absents du runner) :
      # chaque ancre a sa fiche et réciproquement, champs obligatoires, dates ISO.
      - name: Chaque recherche infructueuse a sa fiche
        run: uv run python scripts/recherches.py verifier

      # Le glossaire est ENGENDRÉ à partir de `precis/glossaire.yml`, et l'annexe de
      # chaque livre ne retient que les notions auxquelles il renvoie réellement — sa
      # prose ET ses tableaux engendrés. Deux chemins mènent au même symptôme, un lien
      # mort dans le livre publié : une ancre sans notion correspondante, que le script
      # refuse désormais ; ou une notion que le balayage ne voit pas, ce qui est arrivé
      # aux trois ancres portées par l'en-tête du tableau des âges du livre « Retraites ».
      #
      # Ce job vérifie aussi que les annexes VERSIONNÉES sont à jour : elles sont
      # engendrées, donc un écart signifie qu'un commit les a laissées derrière lui.
      - name: Le glossaire suit le texte rendu
        run: |
          uv run python scripts/build_glossary.py
          if ! git diff --quiet -- 'precis/*/*/_glossaire.qmd' translation_glossary.generated.md; then
            echo "✗ Les annexes de glossaire versionnées ne correspondent plus à leur source."
            echo "  Relancer scripts/build_glossary.py et commiter le résultat."
            git --no-pager diff --stat -- 'precis/*/*/_glossaire.qmd' translation_glossary.generated.md
            exit 1
          fi
