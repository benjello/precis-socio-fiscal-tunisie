name: Bibliographie — pousser vers Zotero

# Zotero est la source canonique, et `sync_biblio.py` n'en descend que la lecture. Les
# références établies au fil de la rédaction ont donc été écrites directement dans les
# `references.json`, où elles sont hors de cette source : la prochaine synchronisation
# descendante les écraserait. Ce workflow fait le chemin inverse.
#
# Rien ne part automatiquement : chaque étape est déclenchée à la main, dans l'ordre.
# Écrire dans une bibliothèque partagée est irréversible sans ménage manuel.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Étape à exécuter"
        required: true
        type: choice
        default: permissions
        options:
          - permissions      # que permet la clé ? à faire en premier
          - verifier         # aller-retour de conversion, hors ligne, sans clé
          - dry-run          # ce qui serait envoyé, sans rien envoyer
          - pousser-un       # une seule référence, pour éprouver le mapping en vrai
          - comparer         # relit dans Zotero la référence poussée et la compare
          - pousser-tout     # le reste
          - ranger           # classe les articles créés dans la collection de leur livre
          - corriger         # écrase dans Zotero la référence indiquée par sa version locale
          - verifier-urls    # recense les fascicules du JORT sans édition homologue
          - descendre        # relance sync_biblio.py et montre le diff, sans rien commiter
      reference:
        description: "Clé de citation à comparer (action « comparer »)"
        required: false
        default: "arrete-1987-01-06-financement-pnafn"

permissions:
  contents: read

jobs:
  biblio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync

      - name: Exécuter
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
        run: |
          case "${{ inputs.action }}" in
            permissions)  uv run python scripts/push_biblio.py --permissions ;;
            verifier)     uv run python scripts/push_biblio.py --verifier ;;
            dry-run)      uv run python scripts/push_biblio.py --dry-run ;;
            pousser-un)   uv run python scripts/push_biblio.py --pousser --limite 1 \
                            --rapport cles-creees.json ;;
            comparer)     uv run python scripts/push_biblio.py \
                            --comparer "${{ inputs.reference }}" ;;
            ranger)       uv run python scripts/push_biblio.py --ranger ;;
            corriger)     uv run python scripts/push_biblio.py \
                            --corriger "${{ inputs.reference }}" ;;
            verifier-urls) uv run python scripts/verifier_urls_jort.py ;;
            descendre)    uv run python scripts/sync_biblio.py --no-check ;;
            pousser-tout) uv run python scripts/push_biblio.py --pousser \
                            --rapport cles-creees.json ;;
          esac

      # La descente réécrit les references.json : ce diff dit si la source canonique
      # reproduit fidèlement ce qui a été poussé. Il n'est PAS commité ici — il mérite
      # sa propre PR relue, une bibliographie étant du contenu et non un artefact.
      - name: Diff de la descente
        if: always() && inputs.action == 'descendre'
        run: |
          git --no-pager diff --stat -- 'precis/*/references.json' 'precis/*/*/references.json'
          {
            echo "## Diff de la synchronisation descendante"
            echo
            echo '```diff'
            git diff -- 'precis/*/references.json' 'precis/*/*/references.json' | head -400
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Conserver la liste des exceptions
        if: always() && inputs.action == 'verifier-urls'
        uses: actions/upload-artifact@v4
        with:
          name: urls-jort
          path: precis/urls-jort.json

      - name: Conserver les fichiers descendus
        if: always() && inputs.action == 'descendre'
        uses: actions/upload-artifact@v4
        with:
          name: references-descendues
          path: precis/**/references.json

      # Les clés Zotero créées sont la seule voie de retour arrière : sans elles, défaire
      # un envoi suppose de retrouver les articles à la main dans la bibliothèque.
      - name: Conserver les clés créées
        if: always() && hashFiles('cles-creees.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: cles-zotero-creees
          path: cles-creees.json
