# Métadonnées du snapshot `precis/fr/prestations_sociales/tables/circulaire_42_annexe_2.md`,
# lues par `scripts/generate_circulaire_42_tables.py`.
#
# CE FICHIER NE PORTE QUE CE QUE LE MODÈLE NE PORTE PAS. Le modèle (openfisca-tunisia,
# `indemnites_familiales_secteur_public.py`) donne, pour chacun des quatre-vingt-un cas :
# le code, la lettre du cas, la situation, la position du père, de la mère, de l'enfant ou du
# tuteur, le bénéficiaire et l'organisme payeur de chaque indemnité, et le libellé de chacune
# de ces valeurs. Il ne porte pas :
#   - les pièces à fournir, colonne « Pièces » de l'annexe 2 (`pieces`, `pieces_par_cas`) ;
#   - les pages du Journal officiel de chaque situation (`situations.<nom>.pages`) ;
#   - les mots qui qualifient un parent dans une situation (« décédé », « divorcée, assure la
#     garde ») : le modèle les porte par la situation, non par la position du parent
#     (`situations.<nom>.pere`, `.mere`) ;
#   - les tournures de l'annexe pour le payeur et pour la garde partagée (`payeurs`,
#     `garde_partagee`) ;
#   - trois cellules où la circulaire dit moins ou plus que la valeur du modèle
#     (`libelles_circulaire`).
# Ce que le modèle porte n'est PAS recopié ici : une position qui change dans le modèle change
# le snapshot à la régénération.

source:
  citation: "[@circulaire-42-1996, annexe 2, p. 2353-2362]"
  jort: "JORT n° 94 du 22 novembre 1996"
  ancre: "r-pf-public-annexe2"

situations:
  parents_en_vie_non_divorces:
    pages: "p. 2353-2355"
  pere_decede:
    pages: "p. 2355-2356"
    pere: "décédé"
  mere_decedee:
    pages: "p. 2356"
    mere: "décédée"
  divorce_garde_pere:
    pages: "p. 2357"
    pere: "divorcé, assure la garde"
    mere: "divorcée"
  divorce_garde_mere:
    pages: "p. 2358-2359"
    pere: "divorcé"
    mere: "divorcée, assure la garde"
  divorce_garde_partagee:
    pages: "p. 2360-2361"
    pere: "divorcé, assure la garde de quelques enfants"
    mere: "divorcée, assure la garde de quelques enfants"
  tutelle:
    pages: "p. 2362"
    enfants: "enfants à charge"

# Mot mis à la place de la position d'un parent que le modèle laisse indifférente (cas 42 et
# 43 : la mère y est seulement « décédée »).
position_indifferente: "position indifférente"

# Tournure du payeur après le bénéficiaire (« servie au père par la CNSS »).
payeurs:
  employeur_du_pere: "par l'employeur du père"
  cnss: "par la CNSS"
  caisse_de_retraite: "par la caisse de retraite"

# Garde partagée (cas 68 à 78) : le modèle code le bénéficiaire G (père ou mère selon la garde
# de l'enfant) ou H (la mère selon la garde, le père n'étant pas servi). `{payeur}` reçoit la
# tournure ci-dessus, précédée d'une espace, ou rien.
garde_partagee:
  G: "servie au père et à la mère{payeur}, en fonction du nombre des enfants dont la garde est assurée"
  H: "servie à la mère en fonction du nombre des enfants dont elle assure la garde et n'est pas servie au père"

# Cellules où la circulaire est plus précise ou plus brève que le modèle. Clé : code du cas,
# puis colonne (`indemnite_familiale` ou `salaire_unique`).
libelles_circulaire:
  19: {indemnite_familiale: "non servie à la mère", salaire_unique: "non servie à la mère"}
  28: {indemnite_familiale: "non servie à la mère", salaire_unique: "non servie à la mère"}
  # Le modèle retient la mère, déduite ; la circulaire ne nomme pas le bénéficiaire.
  34: {indemnite_familiale: "servie par la caisse de retraite"}

pieces:
  jugement_divorce: "copie du jugement de divorce"
  honneur_conjoint_sans_activite: "déclaration sur l'honneur certifiant que le conjoint n'exerce pas une activité professionnelle rémunérée"
  honneur_famille_sans_indemnites: "déclaration sur l'honneur certifiant que la famille ne bénéficie pas des indemnités familiales de la part d'aucune administration"
  honneur_pere_sans_activite: "déclaration sur l'honneur certifiant que le père n'exerce pas d'activité professionnelle rémunérée et n'est pas titulaire d'une pension"
  honneur_mere_sans_activite: "déclaration sur l'honneur certifiant que la mère n'exerce pas une activité professionnelle rémunérée"
  acte_tutelle: "copie de l'acte de tutelle officieuse"
pieces_par_cas:
