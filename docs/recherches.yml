    couverture: 'jort_cache (FTS sur titre et objet, LIKE sans accents, LIKE sur les intitulés arabes après 2008) jusqu''au 10 avril 2026 ; texte des fascicules FR et AR du corpus local de 2024 au n° 56 de 2026, 2025 en partie seulement ; n° 57 à 93 de 2026 téléchargés depuis pist.tn, sauf le n° 58, non consulté. Seconde voie : visas des arrêtés conjoints du 10 juillet 2020 et du 5 août 2026 (éd. ar.) — loi n° 81-6 modifiée en dernier lieu par la loi n° 2007-43. Modificatifs trouvés (1981-2007) : rectificatif, lois n° 89-73, 95-102, 96-66, 97-61 et 2007-43, aucun sur le cœur du régime. Note : docs/notes/cnss-autres-regimes.md, § 3.4, 4 et 12.'
