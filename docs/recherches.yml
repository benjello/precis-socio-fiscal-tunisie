- id: r-ep-pct-dettes-structures-sanitaires
  objet: article ou ligne budgétaire par lesquels l'État prend en charge une partie des dettes des structures sanitaires publiques envers la Pharmacie centrale de Tunisie, 192 MD au titre de la loi de finances complémentaire pour 2021 et jusqu'à 200 MD par an au titre des lois de finances pour 2022 et 2023 (rapport sur les entreprises publiques, édition LF 2025, p. 110)
  ou: [precis/fr/entreprises_publiques/_offices.qmd#sec-ep-ge-pct]
  requetes:
    titres_fts: ['"pharmacie centrale"', '"2021-3"']
    titres_like: ['%pharmacie centrale%', '%finances rectificative pour l''annee 2021%']
    iort_ar: [الصيدلية المركزية, ديون الهياكل الصحية العمومية, قانون المالية التعديلي لسنة 2021]
    plein_texte: [pharmacie centrale, الصيدلية المركزية, الهياكل الصحية العمومية]
    depuis: 2021-11-01
  periode:
    jusqu_au: 2023-12-31
    motif: loi de finances complémentaire pour 2021 et lois de finances pour 2022 et 2023
  passes:
  - date: 2026-10-30
    role: documentaliste
    sources: [jort_cache, corpus_local]
    couverture: 'jort_cache, titres (LIKE français et arabe) : seuls répondent, pour 2021-2023, l''article 62 du décret-loi n° 2021-21 (régime douanier des médicaments importés par la Pharmacie centrale). Corpus local : décret-loi n° 2021-3 (JORT n° 105 de 2021, édition française) — articles 1er à 3 en couche texte, tableaux A à D océrisés (p. 2562-2573), annexe de l''arrêté de répartition du 15 novembre 2021, mission de la santé (p. 2632), lue à l''image et comparée à celle du 23 décembre 2020 (JORT n° 128 de 2020, p. 3292) ; décret-loi n° 2021-21 (JORT n° 119 de 2021, éditions française et arabe, couche texte) ; décret-loi n° 2022-79 (JORT n° 141 de 2022, édition arabe, couche texte). Aucun article ni aucune ligne ne nomme la Pharmacie centrale ni les dettes des structures sanitaires ; les tableaux s''arrêtent à la mission, au programme et à la nature de la dépense. Les « autres dépenses » de la ligne RPE des programmes 1 à 3 de la mission de la santé augmentent de 193,0 MD entre les deux arrêtés de répartition de 2021, sans rattachement établi aux 192 MD.'
    couvert_jusqu_au: 2023-12-31
    resultat: aucun
  a_faire:
  - rapport ou note de présentation du projet de loi de finances complémentaire pour 2021 (ministère des Finances) et documents budgétaires de la mission de la santé 2021-2023 (budget par programme, rapport annuel de performance)
  - tableaux de la mission de la santé des arrêtés de répartition pour 2022 et 2023 (non lus)
- id: r-educ-horaires-primaire-1958-1992
  objet: arrêtés ou décisions fixant, entre la loi n° 58-118 et le décret n° 92-1180, les programmes et l'horaire de l'enseignement primaire, en particulier la répartition de l'horaire entre l'arabe et le français, l'année d'entrée du français (1958, 1976, 1986, 1988, 1989) et la langue du calcul (1978) ; l'art. 21 du décret n° 61-14 du 3 janvier 1961 renvoie ces programmes et horaires à des arrêtés du secrétaire d'État à l'éducation nationale
  ou: [precis/fr/education/_scolaire.qmd#sec-educ-scolaire-cycles-langues]
  requetes:
    titres_fts:
    - horaire* AND (primaire OR base OR etudes)
    - programme* AND (primaire OR scolaire OR "enseignement de base")
    - arabisation
    - '"langue arabe" AND enseignement'
    - '"langue francaise"'
    titres_like:
    - '%horaire%primaire%'
    - '%programme%primaire%'
    - '%enseignement primaire%'
    - '%arabisation%'
    - '%langue francaise%'
    - '%fin d''etudes primaires%'
    iort_ar: [توقيت الدراسة, برامج التعليم الابتدائي, التعليم الابتدائي, تعريب]
    depuis: 1958-11-07
  periode:
    jusqu_au: 1992-06-26
    motif: le décret n° 92-1180 du 22 juin 1992 (JORT n° 41 du 26 juin 1992) fixe par décret l'horaire de l'enseignement de base, langues comprises
  passes:
  - date: 2026-10-30
    role: documentaliste
    sources: [jort_cache, iort, corpus_local]
    couverture: 'jort_cache : FTS (titre, objet, mots-clés) et LIKE non accentués sur les titres, publications de 1956 à 1995 ; miroir iort : intitulés arabes des fichiers de 1972-1980, 1986-1989 et 1993 (le miroir ne porte que 232 arrêtés). Réponses : horaires et programmes du supérieur, examens professionnels, horaires de service des enseignants ; aucun arrêté de programmes ou d''horaire du primaire. Textes lus dans le corpus local (OCR, relu à l''image) : décret n° 61-14 du 3 janvier 1961 (JORT 1961/001, p. 22-24, art. 21 et 24) ; arrêté du 15 avril 1959 sur le certificat de fin d''études primaires (JORT 1959/022, p. 375-377), versé au registre ; arrêté du 31 mai 1963 sur le même certificat (JORT 1963/027, p. 806-807), art. 1er à 14 en OCR seulement, tableaux non relus. Le décret n° 92-1180 ne vise aucun texte d''horaire antérieur (art. 3 : « l''horaire actuel est maintenu pour les autres années »). Titres seuls hors de ces fascicules : pas de plein texte des fascicules de 1958 à 1993, sans couche texte.'
    couvert_jusqu_au: 1992-06-26
    resultat: aucun
  a_faire:
  - lire à l'image les tableaux de l'arrêté du 31 mai 1963 sur le certificat de fin d'études primaires (JORT 1963/027, p. 806-807)
  - chercher les arrêtés de concours d'entrée en première année du secondaire (épreuves d'arabe, de français, de calcul) de 1963 à 1994
  - rejouer en plein texte après océrisation des fascicules du ministère de l'éducation de 1958 à 1991

- id: r-educ-bac-francais-1972-1981
  objet: texte qui, entre 1971 et 1981, retire au français le caractère d'épreuve obligatoire du baccalauréat ou le qualifie de langue étrangère (daté de 1973 par Bouhdiba, 2011)
  ou: [precis/fr/education/_scolaire.qmd#sec-educ-scolaire-cycles-langues]
  requetes:
    titres_fts: [baccalaureat, '"examen du baccalaureat"']
    titres_like: ['%baccalaureat%', '%langue etrangere%']
    iort_ar: [الباكالوريا, البكالوريا]
    depuis: 1971-05-04
  periode:
    jusqu_au: 1981-04-26
    motif: l'arrêté du 16 avril 1981 relatif à l'examen du baccalauréat (JORT n° 28 du 24 avril 1981) refond les épreuves et fait du français une matière à option de la seule section lettres
  passes:
  - date: 2026-10-30
    role: documentaliste
    sources: [jort_cache, iort, corpus_local]
    couverture: 'jort_cache : FTS (titre, objet, mots-clés) et LIKE sur les titres, publications de 1956 à 1995 : aucun texte relatif au baccalauréat de l''enseignement secondaire publié entre l''arrêté du 24 avril 1971 (JORT 1971/020, p. 534) et l''arrêté du 16 avril 1981 (seul le baccalauréat agricole, 1974). Miroir iort, intitulés arabes de 1972-1980 : rien. Lus dans le corpus local (OCR relu à l''image) : arrêtés du 1er avril 1963, du 14 avril 1970 (et rectificatif, JORT 1970/022, p. 472), du 24 avril 1971, du 16 avril 1981 ; le français n''est plus épreuve écrite du baccalauréat dès l''arrêté de 1970. Titres seuls pour 1972-1980 : pas de plein texte, fascicules sans couche texte.'
    couvert_jusqu_au: 1981-04-26
    resultat: aucun
  a_faire:
  - océriser et parcourir les fascicules de mars à juin 1972 à 1980 (période de publication des arrêtés du baccalauréat)
  - chercher une décision ou une circulaire ministérielle de 1973 citée par les rapports

