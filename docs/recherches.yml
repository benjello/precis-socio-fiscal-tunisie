# Registre des recherches infructueuses — docs/conventions-redaction.md, § 2.
#
# Le texte du précis dit le constat, court et neutre (« ce décret n'est pas identifié
# ici »), et porte une ancre cachée <!-- RECHERCHE r-… : … --> qui renvoie à une fiche
# de ce registre. La fiche garde la trace EXÉCUTABLE de la recherche : ce qu'on a
# cherché (requetes), et chaque passe — quand, sur quoi, jusqu'où, avec quel résultat.
#
# Schéma d'une fiche :
#   id        r-… (minuscules, chiffres, points, tirets), unique
#   objet     ce qui est cherché, en une phrase
#   ou        [chemin.qmd#ancre-de-section, …] — là où se trouve l'ancre RECHERCHE
#   requetes  titres_fts   expressions FTS5 sur titre et objet de jort_cache (accents indifférents)
#             titres_like  motifs LIKE sur titre et objet ; accents et casse neutralisés par l'outil
#             iort_ar      termes arabes : intitulés du miroir iort, et titres de jort_cache
#                          (après « ل », l'article perd son alif : للعاملات ne contient pas
#                          العاملات — pour couvrir cette forme, chercher sans l'article)
#             plein_texte  termes cherchés dans le texte des fascicules du corpus local
#             depuis       AAAA-MM-JJ : rien n'est examiné avant (naissance de l'objet)
#   periode   (facultatif) pour un objet BORNÉ dans le temps (« texte antérieur au décret… ») :
#             jusqu_au     AAAA-MM-JJ : rien n'est examiné après ; `lister --perimees` ne
#                          signale plus la fiche dès que sa dernière passe atteint cette date
#             motif        obligatoire : ce qui, dans l'objet, ferme la période (texte, JORT)
#             Pas de borne sans motif tiré de l'objet : un objet qui peut encore paraître
#             (un décret d'application attendu) n'en a pas
#   passes    liste de :
#             date              AAAA-MM-JJ, jour de la passe
#             role              documentaliste, rédacteur…
#             sources           parmi jort_cache, iort, corpus_local, pist, mcp_jort, visas, presse
#             couverture        texte libre : jusqu'où, et les LACUNES (fascicules non lus…)
#             couvert_jusqu_au  AAAA-MM-JJ : date de publication jusqu'à laquelle la passe vaut ;
#                               c'est ce champ que `lister --perimees` et `relancer` utilisent.
#                               Il ne dit rien des TROUS : un fascicule non lu en deçà de cette
#                               date va dans `a_faire`, et `relancer --depuis` y revient
#             resultat          « aucun », ou la clé CSL du texte trouvé
#   a_faire   (facultatif) ce qui reste à parcourir pour lever les lacunes
#   resolu    (facultatif) clé CSL du texte trouvé ; la réserve et l'ancre quittent alors le .qmd
#
# PAS DE COMMENTAIRE DANS LES FICHES : `elargir` et `passe` réécrivent ce fichier sous
# forme canonique et ne conservent que ce bloc d'en-tête.
#
#   uv run python scripts/recherches.py verifier                      # CI : ancres ⇔ fiches
#   uv run python scripts/recherches.py lister [--perimees]
#   uv run python scripts/recherches.py relancer <id> | --perimees [--depuis AAAA-MM-JJ] \
#       [--sans-plein-texte] [--sonder-pist]
#   uv run python scripts/recherches.py elargir <id> --terme "…" [--source titres_like]
#   uv run python scripts/recherches.py passe <id> --resultat aucun --couverture "…" \
#       --couvert-jusqu-au AAAA-MM-JJ --sources jort_cache corpus_local

