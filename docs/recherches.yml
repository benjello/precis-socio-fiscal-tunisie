  - date: 2026-09-24
    role: documentaliste
    sources: [jort_cache, corpus_local, iort, pist, visas]
    couverture: 'Relance du 24 septembre 2026, textes publiés depuis le 1er janvier 2024 : jort_cache mis à jour jusqu''au 18 septembre 2026 (FTS, LIKE, intitulés arabes) ; plein texte du corpus local après le téléchargement du 24 septembre 2026, jusqu''au n° 93 de 2026 (2024 : 145 FR, 156 AR ; 2025 : 151 FR, 154 AR ; 2026 : 87 FR, 88 AR). Complément pist.tn : 2024 n° 123 et 145, 2025 n° 47 (AR), 142 et 143, 2026 n° 66, 69 et 85, inconnus de jort_cache et absents du corpus, téléchargés et parcourus avec la normalisation de l''outil (témoins positifs : JORT n° 149/2024 et 80/2026, éd. ar.). Lacunes : n° 58 de 2026, inconnu de jort_cache, absent du corpus, 404 sur pist.tn dans les deux éditions ; rien après le n° 93 de 2026 (n° 94 : 404). Lus dans une seule édition : en français seulement 2024 n° 9 et 2026 n° 3 ; en arabe seulement 2024 n° 11-13, 75, 94, 109, 112-113, 118, 120, 125, 149, 2025 n° 29, 47, 77, 2026 n° 11 et 13 ; fichier français identique à l''arabe (pist.tn sert le même fichier aux deux adresses) : 2024 n° 8, 130, 145 ; 2025 n° 4, 88, 90, 95, 96, 148 ; 2026 n° 10, 62, 76. Les n° 107 de 2026 et 203 de 2025 que la relance dit absents sont des erreurs de numéro de jort_cache (n° 7 de 2026 et n° 102 de 2025, lus). Terme du plein texte : arabe seul (« 6 لسنة 1981 ») ; complété hors outil par « 81-6 » dans toutes les éditions françaises locales de 2024 à 2026 et les éditions françaises téléchargées, qui couvrent 2024 n° 9 et 2026 n° 3 (seules occurrences : les trois visas ci-dessous ; « 81-69 » au n° 9/2024). Candidats lus au fascicule : arrêtés conjoints des 10 juillet 2024 (n° 86/2024), 29 août 2025 (n° 107/2025) et 5 août 2026 (n° 80/2026), qui visent la loi n° 81-6 modifiée en dernier lieu par la loi n° 2007-43 ; décret n° 2024-503 du 24 octobre 2024, remise des pénalités de retard (n° 130/2024, éd. ar. pp. 5310-5312, seule disponible) : vise la loi sans la modifier ; loi n° 2025-17 (loi de finances pour 2026, n° 148/2025, éd. ar. seule), art. 15 (p. 4233 : augmentation des salaires de 2026 à 2028 étendue aux pensions des retraités, fixée par décret), art. 19 (p. 4233 : TVA des cliniques de la CNSS) et art. 56 (p. 4244 : abattement de 25 % sur les pensions pour l''impôt sur le revenu) ; loi n° 2024-48 (loi de finances pour 2025), art. 20 (n° 149/2024, éd. ar. p. 6423 : exonération des pensions d''orphelins et d''invalidité) ; décret n° 2026-118 (n° 62/2026, éd. ar. p. 1272 : pensions de la fondation Fidaa aux blessés de la révolution). Intitulés du miroir iort : décret n° 2024-386 du 25 juin 2024 (indemnité de sujétions spéciales, JORT n° 79/2024, p. 1740), écarté sur l''intitulé ; décret n° 2025-259 du 22 mai 2025, prorogation du délai de remise des pénalités de retard (n° 60/2025, p. 1289), et loi n° 2025-9 du 21 mai 2025, contrats de travail et interdiction de la sous-traitance (n° 61/2025, p. 1296), lus au fascicule : ne citent ni ne modifient la loi n° 81-6. Décret n° 2026-66 du 30 avril 2026 fixant le SMAG (n° 44/2026, éd. fr. p. 837), art. 5 : la hausse du SMAG « s''applique aux pensions de retraite ainsi qu''au montant des pensions de retraite servies par la Caisse nationale de sécurité sociale » ; clause de revalorisation, non modification de la loi. Aucun ne modifie la loi n° 81-6.'
    couvert_jusqu_au: 2026-09-18
    resultat: aucun
  - date: 2026-09-24
    role: documentaliste
    sources: [jort_cache, corpus_local, iort, visas]
    couverture: 'Élargissement du 24 septembre 2026 : terme français « 81-6 » ajouté au plein texte, requêtes rejouées depuis le 13 février 1981 (elargir ; une relance --depuis 1981-01-01 n''aurait rien ajouté, la loi étant publiée le 13 février 1981). Plein texte réellement exploitable : éditions françaises de 1994 à 1998 et de 2006 à 2026 ; éditions françaises de 1999 à 2005, dont la couche texte est décalée (+29), décodées hors outil et parcourues pour « 81-6 » (10 occurrences, toutes des visas s''arrêtant à la loi n° 89-73 ou n° 97-61) ; éditions arabes depuis 2014 seulement. Lacunes : fascicules de 1981 à 1993 sans couche texte dans les deux éditions (sauf les rares fascicules transcrits en Markdown), éditions arabes de 1994 à 2013 sans texte ou en codage illisible pour l''essentiel, 1999 ar presque entièrement ; absents du corpus local avant 1994 : 1986 n° 82, 84, 86 ; 1990 n° 94 ; 1992 n° 94, 101 ; 1993 n° 90 (ar) ; depuis 1994, fascicules parcourus dans aucune édition : 1995 n° 36 ; 1996 n° 23, 24, 37, 84, 95, 97 (éd. fr. sans couche texte, éd. ar. illisible) ; 2011 n° 62, 73, 90-99 ; 2012 n° 12, 41, 43, 100 ; 2013 n° 47 ; 2015 n° 53 ; 2019 n° 23 ; 2020 n° 23-29, 31-33 ; 2021 n° 45-46 ; 2022 n° 92, 132 ; 2026 n° 58 ; numéros ni dans le corpus local ni dans jort_cache, dont l''existence n''est donc pas établie : 2019 n° 83 ; 2020 n° 4, 30, 39, 86, 96-98, 102, 125 ; 2023 n° 122 ; n° 163/2020, 164/2021, 203/2025 et 107/2026 : erreurs de numéro de jort_cache, non des lacunes ; rien après le n° 93 de 2026. Témoins positifs du plein texte : lois n° 95-102 (JORT n° 96/1995, éd. fr.), 96-66 (n° 60/1996), 97-61 (n° 61/1997) et 2007-43 (n° 51 du 26 juin 2007, éd. fr., art. 3 à 5 : abrogation du paragraphe d) de l''article 64 et suppression du terme « mineur » au début du même article), retrouvées par leur dispositif ; la loi n° 89-73 (JORT n° 60/1989) ne l''est que par jort_cache, l''année 1989 étant sans couche texte. Occurrences lues (121 fenêtres, 1994-2026) : toutes des visas ou des renvois, qui citent comme modificatif la loi n° 89-73, la loi n° 97-61 (encore en 2016) ou, depuis 2016, la loi n° 2007-43, « dont le dernier en date » à partir de 2019 ; homonymes écartés : décret-loi n° 81-6 du 1er septembre 1981 (députés), « annexe n° 81-6 » d''un arrêté du ministre du transport (JORT n° 49/2022), numéro CAS « 77-81-6 » (JORT n° 96/2008), « décret n° 81-6 » erroné du guide des prestations de la CNSS (JORT n° 34/1995). jort_cache (122 intitulés, 1981-2026) : seuls modificatifs de la loi, les lois n° 89-73, 95-102, 96-66 et 97-61 ; miroir iort (307 intitulés) : lois et décrets-lois relus sur l''intitulé, et au texte pour les décrets-lois n° 2011-48 et 2022-49 et les lois n° 2003-8 et 2009-39, qui ne citent pas la loi n° 81-6. Aucun modificatif autre que ceux déjà connus.'
    couvert_jusqu_au: 2026-09-18
    resultat: aucun
  a_faire:
  - 'lire le JORT n° 58 de 2026 : inconnu de jort_cache, absent du corpus local, et pist.tn répond 404 dans les deux éditions (24 septembre 2026) ; le n° 59 commence p. 1129'
  - 'lire les numéros postérieurs au n° 93 de 2026 : jort_cache s''arrête au 18 septembre 2026, et le n° 94 répond 404 sur pist.tn (24 septembre 2026)'
  - 'le plein texte ne couvre pas 1981-1993 (fascicules sans couche texte dans les deux éditions) ni, pour l''essentiel, les éditions arabes de 1994 à 2013 (sans texte ou codage illisible) : pour ces années, seuls les intitulés de jort_cache et du miroir iort et les visas couvrent la fiche ; océriser ou décoder pour étendre (passe du 24 septembre 2026)'
  - 'les éditions françaises de 1999 à 2005 (couche texte décalée de 29 caractères) n''ont été parcourues que par un décodage hors outil (passe du 24 septembre 2026) : à intégrer à recherches.py pour que la relance les couvre'
  - 'fascicules parcourus dans aucune édition depuis 1994 (passe du 24 septembre 2026) : 1995 n° 36 ; 1996 n° 23, 24, 37, 84, 95, 97 ; 2011 n° 62, 73, 90-99 ; 2012 n° 12, 41, 43, 100 ; 2013 n° 47 ; 2015 n° 53 ; 2019 n° 23 ; 2020 n° 23-29, 31-33 ; 2021 n° 45-46 ; 2022 n° 92, 132 ; 2026 n° 58'

