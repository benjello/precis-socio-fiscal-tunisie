 : augmentation des salaires de 2026 à 2028 étendue aux pensions des retraités, fixée par décret), art. 19 (p. 4233 : TVA des cliniques de la CNSS) et art. 56 (p. 4244 : abattement de 25 % sur les pensions pour l''impôt sur le revenu) ; loi n° 2024-48 (loi de finances pour 2025), art. 20 (n° 149/2024, éd. ar. p. 6423 : exonération des pensions d''orphelins et d''invalidité) ; décret n° 2026-118 (n° 62/2026, éd. ar. p. 1272 : pensions de la fondation Fidaa aux blessés de la révolution). Intitulés du miroir iort : décret n° 2024-386 du 25 juin 2024 (indemnité de sujétions spéciales, JORT n° 79/2024, p. 1740), écarté sur l''intitulé ; décret n° 2025-259 du 22 mai 2025, prorogation du délai de remise des pénalités de retard (n° 60/2025, p. 1289), et loi n° 2025-9 du 21 mai 2025, contrats de travail et interdiction de la sous-traitance (n° 61/2025, p. 1296), lus au fascicule : ne citent ni ne modifient la loi n° 81-6. Décret n° 2026-66 du 30 avril 2026 fixant le SMAG (n° 44/2026, éd. fr. p. 837), art. 5 : la hausse du SMAG « s''applique aux pensions de retraite ainsi qu''au montant des pensions de retraite servies par la Caisse nationale de sécurité sociale » ; clause de revalorisation, non modification de la loi. Aucun ne modifie la loi n° 81-6.'
