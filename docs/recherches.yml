  ou: [precis/fr/entreprises_publiques/_restructuration.qmd#sec-ep-banques-publiques]
  requetes:
    titres_fts: [modernisation AND bancaire, '"secteur bancaire"']
    titres_like: ['%modernisation du secteur bancaire%']
    iort_ar: [عصرنة القطاع البنكي, إعادة هيكلة وعصرنة, عصرنة]
    plein_texte: [modernisation du secteur bancaire, عصرنة القطاع البنكي]
    depuis: 2015-01-05
  passes:
  - date: 2026-10-27
    role: documentaliste
    sources: [jort_cache]
    couverture: LIKE sur titres (français et arabe) et FTS (« modernisation AND bancaire », « عصرنة ») de jort_cache, 2015 à la dernière notice indexée (2 octobre 2026) ; seule réponse, l'article 15 de la loi n° 2014-59 ; plein texte du corpus non parcouru
    couvert_jusqu_au: 2026-10-02
    resultat: aucun
  a_faire:
  - plein texte du corpus 2015-2026 (fascicules à intitulé arabe, 2015-2019 surtout)
  - lois de finances 2016-2026 (article sur le fonds)

