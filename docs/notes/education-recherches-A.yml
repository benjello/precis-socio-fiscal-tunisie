    titres_like: ['%montants de la bourse nationale%', '%montants des bourses nationales%', '%مقادير المنحة%', '%مقدار المنحة الوطنية%']
    iort_ar: [مقادير المنحة, مقدار المنحة الوطنية]
    depuis: 2015-12-08
  passes:
  - date: 2026-10-17
    role: documentaliste
    sources: [jort_cache]
    couverture: "jort_cache : intitulés publiés de 2016 au 2 octobre 2026 ; deux réponses, hors sujet (décrets gouvernementaux n° 2019-216 et 2019-345, primes d'enseignants) ; aucun plein texte ; fascicules inconnus de la base (outillage-sources § 1 f) non parcourus"
    couvert_jusqu_au: 2026-10-02
    resultat: aucun
  a_faire: [plein texte des fascicules de 2016 à 2026 sur « montant mensuel de la bourse nationale » et « مقدار المنحة الوطنية », relancer avec --sonder-pist]
