- id: r-loi58-118-art2-obligation
  objet: texte fixant la date à partir de laquelle l'obligation d'assurer aux enfants l'instruction de six à douze ans est imposée à tous les parents (loi n° 58-118 du 4 novembre 1958, art. 2, al. 2)
  ou: [precis/fr/education/_histoire.qmd]
  requetes:
    titres_fts: ['"obligation scolaire"', '"scolarite obligatoire"', '"enseignement obligatoire"']
    titres_like: ['%obligation scolaire%', '%scolarite obligatoire%', '%enseignement obligatoire%', '%obligatoire%enseignement%']
    depuis: 1958-11-07
  periode:
    jusqu_au: 1991-08-08
    motif: la loi n° 91-65 du 29 juillet 1991 (JORT n° 55 du 6 août 1991) institue l'obligation de six à seize ans (art. 7) et met fin progressivement à l'application de la loi n° 58-118 (art. 36)
  passes:
  - date: 2026-10-17
    role: documentaliste
    sources: [jort_cache]
    couverture: 'jort_cache : LIKE non accentués et FTS sur les titres, publications du 7 novembre 1958 au 8 août 1991, sans résultat. Titres seuls : ni plein texte (fascicules de 1958 à 1990 largement sans couche texte), ni miroir iort, ni relance par scripts/recherches.py. Requête voisine sur 1959-1990 (lois et décrets dont le titre porte « enseignement primaire », « enseignement de base », « organisation de l''enseignement ») : décret n° 61-14 du 3 janvier 1961 relatif à l''enseignement primaire (JORT 1961/001, p. 22-24), non lu, qui pourrait régler la question. Note : docs/notes/education-histoire-2026-10-17.md, § 1.1.'
    couvert_jusqu_au: 1991-08-08
    resultat: aucun
  a_faire: [lire le décret n° 61-14 du 3 janvier 1961 relatif à l'enseignement primaire et ses modificatifs (décret n° 63-342), rejouer la fiche en plein texte]

