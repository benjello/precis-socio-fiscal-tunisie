# Registre des dénominateurs au PIB — précis des politiques publiques de la Tunisie
#
# Pour chaque ratio « au PIB » publié dans le précis (français), quel dénominateur il emploie,
# dans quelle base, depuis quelle série, et si le ratio est produit par le précis (interne) ou
# imprimé tel quel par un rapport extérieur (externe). Première brique de la vision compta-nat
# (option B3) ; alimente la section « Quel PIB dans quelle source » de l'annexe PIB.
#
# ÉTABLI le 06/11/2026, à partir de l'inventaire re-vérifié sur le code (chaque entrée lue dans
# le module de figure réellement embarqué, pas seulement sur l'identifiant de série). Source :
# docs/notes/vision-compta-nationale.md, annexe « inventaire des ratios au PIB ».
#
# Contrôle : uv run python scripts/check_registre_denominateurs.py
#
# Champs :
#   id           — numéro de l'inventaire (annexe de la note de vision)
#   fichier      — un ou plusieurs .qmd (chemin depuis la racine du dépôt)
#   grandeur     — ce qui est rapporté au PIB
#   classement   — ok | partiel | externe | a_produire | cadre
#   nature       — interne (le précis calcule le ratio) | externe (imprimé par un rapport)
#   agregat      — pour les internes : pib_nominal | pib_minfin | depenses_etat | (—)
#   base         — par_segments | "2015" | "1997" | "1983" | "1983/1997" | non_dit |
#                  non_precisee_par_la_source | a_produire | mixte | renvoi
#   source_serie — pour les internes : identifiant d'entrepôt figtools quand il est certain,
#                  sinon une description « à préciser » (le check ne fait qu'avertir)
#   source_rapport, annee_rapport — pour les externes
#   note         — précision courte

meta:
  titre: Registre des dénominateurs au PIB
  etabli: "2026-11-06"
  langue: fr
  methode: >-
    Lecture du .qmd et du module de figure réellement embarqué (segment_pib / marque_rupture /
    pib-courant-par-base), pas du seul identifiant de série. Vérifié deux fois (documentaliste
    puis relecture du code). Classement : ok (base explicite, tracé par segments) ; partiel
    (une rupture tracée, une autre non) ; externe (ratio imprimé par un rapport, base non dite
    par la source) ; a_produire (figure annoncée, pas encore codée) ; cadre (phrase de doctrine).
  # 60 entrées pour 57 ratios de l'inventaire : trois ratios mixtes (interne + part imprimée par
  # un rapport) sont scindés en deux entrées — 11/11b, 30/30b, 43/43b ; et le #45 est reclassé
  # « ok » (quatre segments de base tous marqués) au lieu de « ok/partiel ».
  synthese:
    ok: 35
    externe: 17
    partiel: 6
    a_produire: 1
    cadre: 1

