<script>
// Met en forme les légendes des tableaux et des figures (voir legendes.scss) : le numéro
// (« Tableau 2.3 », « جدول 2.3 ») est isolé dans un <span> stylable.
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll("figure.quarto-float > figcaption.quarto-float-caption").forEach(cap => {
    const m = cap.innerHTML.match(/^\s*([^\s<]+(?:&nbsp;|\s)[\d.]+)/);
    if (m) cap.innerHTML = cap.innerHTML.replace(m[1], `<span class="legende-num">${m[1]}</span>`);
  });
});
</script>

<script>
// Références bibliographiques repliables, repliées par défaut. La liste (#refs) est placée
// dans un <details> ; un appel de citation ou une adresse en #ref-… la déplie avant de
// défiler jusqu'à l'entrée. Les infobulles des citations lisent les entrées dans le DOM :
// elles fonctionnent liste repliée.
document.addEventListener("DOMContentLoaded", () => {
  const refs = document.getElementById("refs");
  if (!refs || refs.closest("details")) return;
  // Un livre qui regroupe sa bibliographie dans une annexe « Références » (rémunérations
  // publiques) voit Quarto masquer la liste de fin de chapitre : ne rien replier, sans quoi le
  // bloc s'ouvrirait sur une liste invisible.
  if (getComputedStyle(refs).display === "none") return;
  const n = refs.querySelectorAll(".csl-entry").length;
  if (!n) return;
  // Une page qui n'est faite que de la bibliographie (annexe « Références ») reste dépliée.
  const texte = [...document.querySelectorAll("main p")].filter(p => !refs.contains(p)).length;
  if (texte < 2) return;
  const ar = document.documentElement.dir === "rtl" || document.documentElement.lang === "ar";
  const details = document.createElement("details");
  details.className = "references-repliables";
  const summary = document.createElement("summary");
  summary.textContent = ar ? `المراجع (${n})` : `Références (${n})`;
  details.appendChild(summary);
  refs.parentNode.insertBefore(details, refs);
  details.appendChild(refs);
  const ouvrir = (id) => {
    const cible = id && document.getElementById(id);
    if (cible && details.contains(cible)) {
      details.open = true;
      cible.scrollIntoView();
    }
  };
  ouvrir(decodeURIComponent(location.hash.slice(1)));
  window.addEventListener("hashchange", () => ouvrir(decodeURIComponent(location.hash.slice(1))));
  document.addEventListener("click", (e) => {
    const a = e.target.closest('a[href^="#ref-"]');
    if (a) ouvrir(decodeURIComponent(a.getAttribute("href").slice(1)));
  });
});
</script>

<script>
// Chronologies repliables. Un bloc `.chronologie-repliable` (attribut `titre`) — la longue
// liste des textes d'un dispositif, date par date — est placé dans un <details> replié ; les
// ruptures qu'il détaille restent au premier plan, au-dessus. Un renvoi ou une adresse vers un
// élément du bloc (#tbl-…) le déplie avant de défiler ; l'impression le déplie aussi. Sans
// script, et en PDF, le bloc reste simplement visible.
document.addEventListener("DOMContentLoaded", () => {
  const blocs = [...document.querySelectorAll("div.chronologie-repliable")].map(div => {
    const details = document.createElement("details");
    details.className = "chronologie-repliable";
    const summary = document.createElement("summary");
    summary.textContent = div.dataset.titre || div.getAttribute("titre") || "…";
    details.appendChild(summary);
    div.parentNode.insertBefore(details, div);
    details.appendChild(div);
    return details;
  });
  if (!blocs.length) return;
  const ouvrir = (id) => {
    const cible = id && document.getElementById(id);
    const details = cible && blocs.find(d => d.contains(cible));
    if (details) {
      details.open = true;
      // Une ligne de registre visée (#r-…) est centrée et surlignée, pour qu'on la retrouve
      // dans un tableau de vingt lignes.
      const ligne = cible.closest("tr");
      document.querySelectorAll("tr.ligne-visee").forEach(tr => tr.classList.remove("ligne-visee"));
      if (ligne) {
        ligne.classList.add("ligne-visee");
        ligne.scrollIntoView({ block: "center" });
      } else {
        cible.scrollIntoView();
      }
    }
  };
  ouvrir(decodeURIComponent(location.hash.slice(1)));
  window.addEventListener("hashchange", () => ouvrir(decodeURIComponent(location.hash.slice(1))));
  document.addEventListener("click", (e) => {
    const a = e.target.closest('a[href^="#"]');
    if (a) ouvrir(decodeURIComponent(a.getAttribute("href").slice(1)));
  });
  window.addEventListener("beforeprint", () => blocs.forEach(d => { d.open = true; }));
});
</script>
