  "definition": "جدول ملحق باتفاقية مشتركة قطاعية أو بأحد ملاحقها التعديلية، يضبط الأجر الأساسي لكلّ صنف مهني، ولكلّ درجة إن كان الجدول يتضمّن درجات. وتحيل الاتفاقية المشتركة الإطارية لسنة 1973 جداول الأجور والمنح إلى الاتفاقيات القطاعية (الفصلان 1 و50). ويمكن أن تتضمّن الاتفاقية الواحدة عدّة جداول: فاتفاقية النسيج لسنة 1974 تتضمّن جدولًا للأعوان الخالصين بالساعة حسب الصنف والدرجة، واتفاقية البناء والأشغال العامة لسنة 1975 تضبط للعملة العرضيين أجرًا بالساعة لكلّ صنف، دون درجات.",
  "source": "Arrêté du 29 mai 1973 (convention collective-cadre), art. 1 et 50",
  "terme": "جدول الأجور"
 },
 "indemnite-cherte-de-vie": {
  "autre": "Indemnité de cherté de vie",
  "definition": "منحة أُحدثت بداية من غرّة ماي 1971 بالأمر عدد 164 لسنة 1971 في الصناعة والتجارة والمهن الحرة: 0,020 دينار في الساعة، أي 4 دنانير في الشهر للأجراء الخالصين بالشهر، زيادة على الأجر الأدنى. ولا تدخل في قاعدة المساهمات ولا في احتساب المنافع الاجتماعية. وقد أُدمجت في الأجر الأدنى المضمون لمختلف المهن المضبوط بداية من غرّة جانفي 1974 بالأمر عدد 63 لسنة 1974.",

 "indemnite-complementaire-provisoire": {
  "acronyme": "ICP",
  "autre": "Indemnité complémentaire provisoire",
  "definition": "منحة أُحدثت بداية من غرّة أفريل 1981 بالأمر عدد 437 لسنة 1981، تُصرف زيادة على الأجر الأساسي لأجراء القطاعات غير الفلاحية الخاضعة لمجلة الشغل، وتمّ الترفيع فيها بداية من غرّة فيفري 1982 بالأمر عدد 501 لسنة 1982. وهي منذ سنة 1981 أحد مكوّنات الأجر الأدنى المضمون لمختلف المهن: فالأوامر التي تضبطه، كما في سنتي 1992 و2000، تفصّله إلى أجر أساسي ومنحة إضافية مؤقتة، ويوضّح أمر سنة 2026 أنه يتضمّنها.",

 "indemnite-de-stage": {
  "autre": "Indemnité de stage",
  "definition": "مبلغ تسنده الدولة شهريا، عن طريق الوكالة المكلفة بالتشغيل، للمنتفع بتربص أو بعقد إدماج طيلة مدته. وهي غير المنحة التكميلية التي تلتزم المؤسسة المحتضنة بإسنادها من جهتها. ويُضبط مقدارها لكل برنامج، وتنقّحه الأوامر المتعاقبة.",

 "micro-entreprise": {
  "autre": "Micro-entreprise",
  "definition": "في مسوح المعهد الوطني للإحصاء، مؤسسة غير فلاحية تشغّل أقلّ من ستّة أجراء. وتتناول تقارير مسوح سنوات 2007 و2012 و2016 المؤسسات التي لا تمسك محاسبة؛ وفي سنة 2016 يقتصر الميدان كذلك على المؤسسات التي يقلّ رقم معاملاتها عن مليون دينار. أمّا المؤسسات التي تشغّل ستّة أجراء فأكثر فيشملها مسح آخر للمعهد، هو مسح « التشغيل والأجور ».",

 "ouvriers-de-chantiers": {
  "autre": "Ouvriers de chantiers",
  "definition": "عملة مشغَّلون بالحضائر الجهوية والحضائر الفلاحية التي تموّلها الدولة بعنوان دعم التشغيل. وقد أنهى الأمر الحكومي عدد 436 لسنة 2021 المؤرخ في 17 جوان 2021 العمل بهذه الآلية: فالمباشرون منهم بصفة مستمرة في 20 أكتوبر 2020 يُدمجون، بحسب سنّهم، في الوظيفة العمومية، أو يواصلون نشاطهم إلى سن الستين، أو يغادرون الآلية مع منحة.",

 "politique-active-emploi": {
  "autre": "Politique active de l'emploi",
  "definition": "مجموع البرامج التي تموّل بها الدولة إدماج طالبي الشغل: تربصات وعقود تسند الدولة منحتها، وتكفل بالمساهمات الاجتماعية أو بجزء من الأجر، ودعم لبعث المؤسسات، وحضائر. والمصطلح مستعمل في تقارير المتابعة والدراسات؛ ولا يرد في النصوص إلا في باب تقييم تدخلات الصندوق الوطني للتشغيل.",

 "prise-en-charge-contribution-patronale": {
  "autre": "Prise en charge par le Fonds national de l'emploi de la contribution patronale au régime légal de sécurité sociale",
  "definition": "امتياز يُمنح للمؤسسة المنتدِبة: تُدفع عوضا عنها، لمدة محدودة، مساهمة الأعراف في الضمان الاجتماعي بعنوان أجر المنتدَب الجديد، تتكفل بها الدولة ثم الصندوق الوطني للتشغيل. وقد أُحدث هذا الامتياز في نوفمبر 1997 (القانون عدد 79 لسنة 1997): تتكفل الدولة بالمساهمة لمدة خمس سنوات عند انتداب حاملي شهادات التعليم العالي. ورفع قانون المالية لسنة 2005 المدة إلى سبع سنوات وبنسب تنازلية بالنسبة إلى المنتدبين من سنة 2005 إلى سنة 2009؛ ويوجد إلى جانبه منذ سنة 2004 تكفل الدولة بجزء من الأجر. وأخذ الأمر عدد 349 لسنة 2009 بالجدول نفسه، على حساب الصندوق، للانتدابات الناتجة عن عقد إدماج حاملي شهادات التعليم العالي. وتولّى الصندوق هذا الامتياز في جانفي 2010، وحُدّد أجله بيوم 31 ديسمبر 2014. وتتضمن برامج سنتي 2017 و2019 تكفلا محصورا في سنتين.",
  "source": "Décret n° 2009-349 du 9 février 2009, fixant les programmes du fonds national de l'emploi, les conditions et les modalités de leur bénéfice, art. 15",
  "terme": "تكفل الصندوق الوطني للتشغيل بمساهمة الأعراف في النظام القانوني للضمان الاجتماعي"
 },
 "programme-amal": {
  "autre": "Programme de recherche active d'emploi",
  "definition": "برنامج أحدثه الأمر عدد 621 لسنة 2011 المؤرخ في 23 ماي 2011: منحة شهرية تُسند لمدة أقصاها سنة لطالبي الشغل، وهي أرفع لحاملي شهادات التعليم العالي. وأُلغي ابتداء من غرة جانفي 2012 وعوّضه برنامج آخر بمقتضى الأمر عدد 953 لسنة 2012.",

 "programme-appui-promoteurs": {
  "acronyme": "PAPPE",
  "autre": "Programme d'accompagnement des promoteurs des petites entreprises",
  "definition": "برنامج من برامج الصندوق الوطني للتشغيل أحدثه الأمر عدد 349 لسنة 2009 لفائدة باعثي المؤسسات الصغرى: دورات تأهيل، ومساعدة فنية، ومنحة شهرية خلال المرحلة الأولى لتركيز المشروع. وعوّضه في أكتوبر 2012 «برنامج دعم باعثي المؤسسات الصغرى»، وهي التسمية التي أبقى عليها الأمر الحكومي عدد 542 لسنة 2019؛ وفي جوان 2023 وسّعه الأمر عدد 461 لسنة 2023 ليشمل مؤسسات الاقتصاد الاجتماعي والتضامني والشركات الأهلية.",
  "source": "Décret n° 2009-349 du 9 février 2009, fixant les programmes du fonds national de l'emploi, les conditions et les modalités de leur bénéfice, art. 1er et 34",

 "programme-forsati": {

  "definition": "برنامج من برامج الصندوق الوطني للتشغيل أحدثه الأمر الحكومي عدد 904 لسنة 2016: مرافقة فردية لطالب الشغل نحو مشروع مهني، مدتها اثنا عشر شهرا قابلة للتمديد بستة أشهر، مع منحة شهرية. وأعاده الأمر الحكومي عدد 542 لسنة 2019.",

 "rsna": {
  "acronyme": "RSNA",
  "autre": "Régime des salariés non agricoles",
  "definition": "نظام الضمان الاجتماعي لأجراء القطاع الخاصّ غير الفلاحي، أحدثه القانون عدد 30 لسنة 1960 المؤرّخ في 14 ديسمبر 1960 ويديره الصندوق الوطني للضمان الاجتماعي. ويضبط الفصل 34 من هذا القانون ميدانه بالتعداد: أجراء المؤسسات الصناعية والتجارية والمهن الحرّة والتعاضديات والشركات المدنية والنقابات والجمعيات، وأعوان النقل، وأجراء التجارة والبناء. ويخضع فرعه الخاصّ بجرايات الشيخوخة والعجز والباقين على قيد الحياة للأمر عدد 499 لسنة 1974 المؤرّخ في 27 أفريل 1974، النافذ منذ غرّة جانفي 1974، والذي تحيل إليه أنظمة العملة غير الأجراء والعملة التونسيين بالخارج.",
  "source": "Loi n° 60-30 du 14 décembre 1960",
  "terme": "نظام الأجراء غير الفلاحيين"
 },
 "salaire-brut": {
  "autre": "Salaire brut",
  "definition": "الأجر المستحقّ للعامل قبل أيّ خصم: الأجر الأساسي وتوابعه من منح ومنافع نقدية أو عينية، باستثناء ما يكتسي صبغة استرجاع مصاريف (مجلة الشغل، الفصل 134-2). وتبيّن بطاقة الخلاص مبلغه ثمّ نوع الخصومات المجراة عليه ومبلغها (الفصل 143).",
  "source": "Loi n° 96-62 du 15 juillet 1996, art. 134-2 et 143",
  "terme": "الأجر الخام"
 },
 "salaire-conventionnel": {
  "autre": "Salaire conventionnel",
  "definition": "أجر تضبطه اتفاقية مشتركة أو ملاحقها التعديلية حسب الأصناف المهنية. ومنذ الأمر عدد 247 لسنة 1973 المؤرخ في 26 ماي 1973، يجوز للاتفاقيات المشتركة ضبط الأجور وتوابعها والتصنيفات، على أساس أجر أدنى مضمون لمختلف المهن يُضبط بأمر.",
  "source": "Décret n° 73-247 du 26 mai 1973, art. 1 et 2",
  "terme": "الأجر التعاقدي"
 },
 "salaire-d-entree-conventionnel": {
  "autre": "Salaire d'entrée d'une grille conventionnelle",
  "definition": "الأجر الأساسي لأدنى صنف وأدنى درجة في جدول أجور ملحق باتفاقية مشتركة، دون المنح؛ وهو أسفل الجدول، ويُقارَن بالأجر الأدنى المضمون لمختلف المهن بالساعة في نظام 48 ساعة لقياس ما تضيفه الاتفاقية إلى الأجر الأدنى. وفي قطاع النسيج، هو أجر الساعة للعون الخالص بالساعة من الصنف الأول في درجة الترسيم، وهو معروف من 1974 إلى 2026 ودون انقطاع من 1994 إلى 2026؛ وفي قطاع البناء والأشغال العامة، هو أجر العامل العادي في جدول العملة العرضيين، وهو معروف من 1974 إلى 2024 ودون انقطاع من 1996 إلى 2024.",
  "terme": "أدنى أجر في جدول الأجور"
 },
 "salaire-de-base-conventionnel": {
  "autre": "Salaire de base (grilles conventionnelles)",
  "definition": "المبلغ الذي يضبطه جدول الأجور الملحق باتفاقية مشتركة لصنف ودرجة معيَّنين، دون منح الاتفاقية — وخاصة منحة النقل ومنحة الحضور — التي تُضاف إليه. وفي قطاع النسيج، أُدمجت المنحة الإضافية المؤقتة في الأجور الأساسية بداية من غرّة ماي 1994 (الملحق التعديلي عدد 5). ويقرّ الأمر عدد 68 لسنة 2026 المؤرخ في 30 أفريل 2026 زيادة بـ5 % سنويًا، في سنوات 2026 و2027 و2028، في الأجور الأساسية لكلّ الدرجات بآخر جداول الأجور الملحقة بالاتفاقيات المشتركة القطاعية، وكذلك في منحتي النقل والحضور.",
  "source": "Décret n° 2026-68 du 30 avril 2026, art. 1",
  "terme": "الأجر الأساسي"
 },
 "salaire-declare": {
  "autre": "Salaire déclaré",
  "definition": "الأجر الذي يصرّح به المؤجّر للصندوق الوطني للضمان الاجتماعي عن كلّ أجير، وعليه تُحتسب الاشتراكات. وفي نظام الأجراء غير الفلاحيين، تشمل هذه القاعدة، منذ القانون عدد 101 لسنة 1995 (الفصل 42 جديد من القانون عدد 30 لسنة 1960)، مجموع عناصر الأجر، بما فيها المنح والمنافع، دون سقف. والنشريات الإحصائية السنوية للصندوق، التي تنشر كتلة الأجور المصرّح بها وتوزيعها من سنة 1970 إلى سنة 2018، لا تعرّف هذه العبارة ولا تبيّن إن كان الأجر خامًا أو صافيًا. أمّا المنحة الإضافية المؤقتة، التي أُدرجت في الأجر الأدنى المضمون لمختلف المهن سنة 1981، فقد بقيت حينها خارج قاعدة الاشتراكات، ولا تحتسبها النشرية ضمن الأجور المصرّح بها إلّا بداية من سنة 1988.",
  "terme": "الأجر المصرّح به"
 },
 "salaire-minimum-garanti": {
  "autre": "Salaire minimum garanti",
  "definition": "العتبة الدنيا التي لا يجوز دونها تأجير عامل مكلَّف بأعمال لا تستوجب تأهيلًا مهنيًا (مجلة الشغل، الفصل 134-2، كما أُضيف بالقانون عدد 62 لسنة 1996). ويُضبط بأمر في صيغتين: الأجر الأدنى المضمون لمختلف المهن في القطاعات غير الفلاحية، والأجر الأدنى الفلاحي المضمون.",
  "source": "Loi n° 96-62 du 15 juillet 1996, art. 134-2",
  "terme": "الأجر الأدنى المضمون"
 },
 "salaire-moyen-declare": {
  "autre": "Salaire moyen déclaré",
  "definition": "حاصل قسمة تنشره النشرية الإحصائية السنوية للصندوق الوطني للضمان الاجتماعي بعنوان نظام الأجراء غير الفلاحيين: كتلة الأجور المصرّح بها خلال السنة مقسومة على عدد الأجراء المصرّح بهم مرّة واحدة على الأقلّ خلال السنة، بالدينار في السنة. وتخفّضه السنوات غير الكاملة: ففي سنة 2013 يبلغ 8 495 دينارًا لمجموع الأجراء المصرّح بهم و11 036 دينارًا للمصرّح بهم طيلة الثلاثيات الأربع. وتورده النشريات من سنة 1970 إلى سنة 2018، في طبعتين لا تتّصل سلسلتاهما: طبعة 2006 للفترتين 1970-1999 و2002-2006، وطبعة 2018 للفترة 2000-2018. ولا يُخلط بينه وبين نسبة تطوّر معدّل الأجر التي يستخرجها المعهد الوطني للإحصاء من التصاريح نفسها من سنة 2001 إلى سنة 2025: فهذه النسبة تتابع أجراء مصرّحًا بهم خمس ثلاثيات متتالية ولا تعطي أيّ مستوى للأجر.",
  "source": "CNSS, annuaire statistique 2018, p. 16",
  "terme": "معدّل الأجر السنوي المصرّح به"
 },
 "salaire-net": {
  "autre": "Salaire net",
  "definition": "الأجر الذي يتقاضاه العامل فعلًا بعد إجراء الخصومات على الأجر الخام، من مساهمات اجتماعية محمولة على الأجير وضريبة محجوزة من المورد. وتبيّن بطاقة الخلاص مبلغه (مجلة الشغل، الفصل 143).",
  "source": "Loi n° 96-62 du 15 juillet 1996, art. 143",
  "terme": "الأجر الصافي"
 },
 "salarie-permanent": {
  "autre": "Salarié permanent",
  "definition": "عبارة يستعملها مصدران للمعهد الوطني للإحصاء بمعنيين. ففي نسبة التطوّر الثلاثية للأجور في القطاع الخاصّ غير الفلاحي، هو الأجير المصرّح به لدى الصندوق الوطني للضمان الاجتماعي بصفة متواصلة خلال الثلاثيات الخمس الأخيرة: ويكوّن هؤلاء الأجراء العيّنة الثابتة التي تُحتسب عليها النسبة، حسب الدليل المنهجي الذي نشره المعهد سنة 2026. وفي مسح « التشغيل والأجور » لدى المؤسسات التي تشغّل ستّة أجراء فأكثر، الذي يورد تقريره لسنة 2012 التعريف، هو الأجير الذي يُعدّ جزءًا لا يتجزّأ من المؤسسة، مقابل الأجير الوقتي المنتدب بصفة ظرفية لتدعيم عدد العاملين؛ ولا يقوم هذا التمييز على نوع العقد. أمّا تقارير المسح حول المؤسسات الصغرى (2012 و2016) فلا تعرّف العبارة: وإنّما تقابل بين الأشخاص المشغَّلين بصفة قارّة في المؤسسة والتشغيل الوقتي.",
  "source": "INS, Guide méthodologique du taux d'évolution trimestriel des salaires (2026), § 3",
  "terme": "أجير قارّ"
 },
 "sivp": {
