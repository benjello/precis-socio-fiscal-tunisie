project:
  type: book
  output-dir: public

lang: ar
dir: rtl

book:
  title: "المالية المحلية"
  author: "مهدي بن جلول"
  repo-url: https://github.com/benjello/precis-socio-fiscal-tunisie/
  repo-subdir: precis/ar/finances_locales
  repo-branch: master
  repo-actions: [edit, issue]
  downloads: [pdf]
  chapters:
    - index.qmd
    - _notions.qmd
    # Chapitres à déclarer quand leur traduction sera livrée :
    # - _histoire.qmd
    # - _competences.qmd
    # - _budgets.qmd
    # - _impots_immeubles.qmd
    # - _impots_activite.qmd
    # - _taxes_redevances.qmd
    # - _transferts.qmd
    # - _longue_periode.qmd

  appendices:
    - _glossaire.qmd

language:
  toc-title-document: "المحتويات"
  toc-title-website: "المحتويات"
  title-block-author-single: "الكاتب"
  repo-action-links-edit: "تعديل هذه الصفحة"
  repo-action-links-issue: "الإبلاغ عن مشكلة"
  search-clear-button-title: "مسح"
  search-no-results-text: "لا توجد نتائج"
  search-text-placeholder: "بحث"

bibliography:
  - references.json
  - ../references.json
  - ../references.bib

format:
  html:
    theme: [cosmo, ../../legendes.scss]
    # Les données des infobulles du glossaire (engendrées par build_glossary.py)
    # précèdent le script qui les lit.
    include-after-body:
      - _glossaire.infobulles.html
      - ../../legendes.html
    fig-cap-location: top
    tbl-cap-location: top
    number-depth: 4
    toc: true
    toc-depth: 4
  pdf:
    documentclass: scrreprt
    toc: true
    toc-depth: 4
    number-sections: true
    number-depth: 4

# Libellés des légendes et des renvois : Quarto écrivait « Table 2.3: » en anglais, y
# compris dans les livres arabes. Mise en forme : ../../legendes.scss et legendes.html.
crossref:
  tbl-title: "جدول"
  fig-title: "شكل"
  tbl-prefix: "الجدول"
  fig-prefix: "الشكل"
  title-delim: "\u00a0—"
