 "perequation-financiere": {

  "definition": "تحويل يعوّض الفوارق بين الجماعات المحلية التي تخرج عن سيطرتها — في الوعاء الجبائي أو الحاجيات أو الكلفة —، تطبيقا لمبدأ التضامن. ويكون عموديا إذا موّلت الحكومة المركزية وحدها الصندوق، وأفقيا إذا ساهمت فيه الجماعات التي تفوق طاقتها الجبائية المعدّل.",

 },

 "potentiel-fiscal": {

 "prix-reference-m2": {

 "reserve-fonds-commun": {

 },

  "definition": "الموارد التي تحصل عليها الجماعة المحلية بوسائلها الخاصّة: أداءاتها، الحصرية أو المشتركة، ومعاليم الاستعمال، ومردود أملاكها. ويقابلها ما تحيله الدولة من موارد.",

  "autre": "Souveraineté fiscale",

 },
 "subsidiarite": {
  "autre": "Subsidiarité",

  "terme": "المنحة المشروطة"
 },
 "subvention-forfaitaire": {

  "autre": "Subvention globale",

 "subvention-specifique": {

 },

  "source": "L'économie politique et institutionnelle de la décentralisation en Tunisie : état des lieux, bilan et enjeux, p. 152",
  "terme": "الرسم (بمفهوم المالية العمومية)"
 },
 "taxe-hoteliere": {
  "autre": "Taxe hôtelière",

  "terme": "المعلوم على العقارات المبنية"
 },
 "taxe-terrains-non-batis": {

  "source": "Loi n° 97-11 du 3 février 1997, art. 30-33",
  "terme": "المعلوم على الأراضي غير المبنية"
 },
 "transfert-financier": {
  "autre": "Transfert financier",
  "definition": "موارد يدفعها مستوى من مستويات الحكم إلى مستوى آخر. وهي، حسب الغاية منها، تموّل المهامّ المفوَّضة، أو تحفّز، أو تصلح آثار التجاوز، أو تحقّق التعديل.",
