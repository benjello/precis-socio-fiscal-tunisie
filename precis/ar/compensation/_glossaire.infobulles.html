 "prix-normal-retrocession": {
  "autre": "Prix normal de rétrocession",
  "definition": "السعر الذي يحيل به ديوان الحبوب الحبوبَ التي اشتراها. ويشتمل، في أمر موسم 2025-2026، على السعر الأساسي أو سعر التدخّل، وفرق الإحالة الخام المخوّل للديوان، أي منحة الخزن وفرق الإحالة الصافي ومبلغ تعديل مصاريف النقل والمبلغ المخصّص لحساب «صندوق التجهيز لديوان الحبوب» (الفصل 9)، وعلى المنحة الاستثنائية للتسليم السريع (الفصل 10). والفارق بين هذا السعر وسعر الإحالة المخفّض هو منحة التعويض (الفصل 15).",

 "produits-de-base": {

 "quintile-niveau-de-vie": {

  "definition": "كلّ واحدة من خمس مجموعات متساوية العدد يُتحصّل عليها بترتيب السكّان تصاعديًا حسب مستوى العيش: تضمّ الشريحة الأولى الخُمس الأقلّ دخلًا والشريحة الخامسة الخُمس الأيسر حالًا. وتعتمد دراسة المعهد الوطني للإحصاء ومركز البحوث والدراسات الاجتماعية والبنك الإفريقي للتنمية (2013) هذا التصنيف حسب الدخل أو الإنفاق.",

 "redevance-compensation": {
  "autre": "Redevance de compensation",
  "definition": "أتاوة أحدثها الفصل 63 من قانون المالية لسنة 2013 لفائدة الصندوق العام للتعويض. تُستوجب على رقم معاملات بعض المؤسسات، وعند أوّل تسجيل للسيارات ذات الأسطوانة الكبيرة، وعن كلّ ليلة مقضّاة بالمؤسسات السياحية، وعلى الدخل السنوي الصافي للأشخاص الطبيعيين الذي يفوق 20.000 دينار. وأضاف إليها قانون المالية لسنة 2014 جزءا على السيارات الخاصة والعربات الخاضعة للمعلوم الوحيد التعويضي على النقل بالطرقات (الفصل 76) ألغاه قانون المالية التكميلي لسنة 2014 ابتداء من غرة جانفي 2014 (الفصل 39)، وأعاد صياغة الجزء الموظّف على الدخل (الفصل 77)، وحصر تطبيقه في سنتي 2014 و2015 (الفصل 78).",
  "source": "Loi n° 2012-27 du 29 décembre 2012, art. 63",
  "terme": "أتاوة الدعم"
 },
 "redevance-compensatrice": {
  "autre": "Redevance compensatrice",
  "definition": "اقتطاع يُوظَّف على منتوج لتمويل تعويض الأسعار: لدعم منتوج آخر، أو للتسوية بين سعر التوريد والسعر الداخلي. وقبل إحداث الصندوق العام للتعويض سنة 1970، كان يُوظَّف لفائدة صندوق التعويض: على الزيوت الغذائية غير زيت الزيتون وعلى السكر المورَّد سنة 1956، وعلى البنزين والبترول الأزرق والغازوال سنة 1957، وعلى منتوجات الباب 73 من التعريفة الديوانية سنة 1967. وكانت أتاوة سنة 1957، وقدرها 300 فرنك للهكتولتر، تموّل استرجاعًا لفائدة موزّعي الفيول. كما تنصّ عليه أوامر مواسم الحبوب لفائدة حساب «دعم سوق الحبوب» بميزانية ديوان الحبوب، ومنها، بالنسبة إلى القمح الصلب، الفصل 22 من أمر موسم 1983-1984 في صيغته المنقّحة بالأمر عدد 1274 لسنة 1983 المؤرخ في 28 ديسمبر 1983. ويُميَّز عن أتاوة الدعم المحدثة سنة 2013.",
  "source": "Arrêté du 5 février 1957 (redevance sur les hydrocarbures), art. 1",
  "terme": "الأتاوة التعويضية"
 },
 "revenus-commercialisation-carburants": {

 "separation-commercialisation-hydrocarbures": {
  "autre": "Séparation des opérations de commercialisation des hydrocarbures",
  "definition": "مبدأ اعتُمد في إطار قانون المالية التكميلي لسنة 2015: تتزوّد الشركة التونسية لصناعات التكرير والشركة التونسية للكهرباء والغاز بالسعر العالمي، وتحوّل المؤسسة التونسية للأنشطة البترولية إلى الخزينة محصول بيع النفط الراجع للدولة. فالدعم الذي كان يُحتسب صافيًا من موارد لا تقبضها الدولة صار نفقة من جهة وموردًا من جهة أخرى، ممّا وسّع مجال باب «المحروقات». ولم يرد هذا المبدأ في أيّ فصل من القانون.",

 "structure-des-prix": {
  "autre": "Structure des prix",
  "definition": "تفصيل سعر منتوجات النفط الذي كلّف القانون عدد 45 لسنة 1991 (الفصل 18) الوزير المكلف بالطاقة بوضعه، إلى جانب الأسعار القصوى للبيع للعموم المضبوطة بقرار. ومنذ القرار المؤرخ في 15 جويلية 2016 (الفصل 7) يُعلَم المعنيون بالأمر بالتركيبة الجديدة للأسعار بواسطة قرار داخلي. ولا يعدّد أيّ من النصوص المذكورة عناصرها.",

 "subvention-directe": {

 "subvention-indirecte": {

  "definition": "الجزء من دعم المحروقات الذي لم يكن مدرجًا في أيّ باب من النفقات إلى سنة 2014: وهو الفارق بين السعر العالمي والأسعار التفاضلية التي يُسلَّم بها النفط الخام إلى الشركة التونسية لصناعات التكرير والغاز إلى الشركة التونسية للكهرباء والغاز، أي نقص في موارد راجعة للدولة. وتقرير 21 جويلية 2014 هو الوثيقة الميزانية الوحيدة التي تقدّره، للسنوات 2010-2012.",

 "taxation-des-prix": {
  "autre": "Taxation des prix",
  "definition": "نظام أسعار تضبط فيه الإدارة السعر في جميع مراحل الإنتاج والتوزيع. وقد أخضع الأمر عدد 543 لسنة 1970 المؤرخ في 24 أكتوبر 1970، المتّخذ لتطبيق القانون عدد 26 لسنة 1970 المؤرخ في 19 ماي 1970، للتسعير البضائع والمنتوجات الحساسة وذات الاستهلاك الواسع والخدمات ذات المصلحة العامة المعدودة في الجدول «أ» (الفصل الأول)، ومنها الخبز والدقيق والسميد والكسكسي والعجين الغذائي والزيوت الغذائية والسكر والحليب والمحروقات والكهرباء والماء والغاز. وأبقى الأمر عدد 134 لسنة 1982 المؤرخ في 27 جانفي 1982 على هذا النظام بالنسبة إلى المنتوجات المدرجة بجدوله «ب» (الفصل 4). وتُضبط أسعار المنتوجات الخاضعة للتسعير بقرار من وزير الاقتصاد الوطني. ومنذ سنة 1992 أصبحت حرية الأسعار هي القاعدة، وخضعت المواد الأساسية للمصادقة الإدارية على الأسعار.",
  "source": "Décret n° 70-543 du 24 octobre 1970, art. 1er",
  "terme": "التسعير"
 },
 "taxe-unique-compensation-carburants": {
  "autre": "Taxe unique de compensation sur les produits pétroliers",
  "definition": "معلوم يُستخلص لفائدة الصندوق العام للتعويض، وحّد فيه الأمر عدد 622 لسنة 1970 المؤرخ في 31 ديسمبر 1970 (الفصل 5)، بداية من غرة جانفي 1971، ثلاثة اقتطاعات على المحروقات: المعلوم التعديلي لسنة 1957، والمعلوم التعويضي لسنة 1964، وأربعة صانتيمات إضافية للأداء على الاستهلاك. وما زال الجدول الملحق بالقانون عدد 62 لسنة 1988 المؤرخ في 2 جوان 1988، المتعلق بمراجعة المعلوم على الاستهلاك، يحيل إليه.",

 "taxe-unique-compensation-transports-routiers": {
  "autre": "Taxe unique de compensation de transports routiers",
  "definition": "معلوم أحدثه الفصل 38 من قانون المالية لسنة 1984 بداية من غرة جانفي 1984. يطبّق على عربات النقل المشترك للأشخاص التي تفوق مقاعدها التسعة، وعلى عربات نقل البضائع بالطرقات التي تفوق حمولتها النافعة 300 كيلوغرام، وعلى سيارات اللواج وسيارات التاكسي. يُستخلص شهرياً عن كلّ عربة، ويُخصَّص 40 % من محصوله لحساب خاص في الخزينة أحدثه القانون نفسه لدعم مؤسسات النقل العمومي بالطرقات (الفصل 101). ووظّف قانون المالية لسنة 2014 على العربات الخاضعة له أتاوة دعم تساوي 25 % من مبلغه (الفصل 76)، ثم ألغى قانون المالية التكميلي لسنة 2014 هذا الجزء ابتداء من غرة جانفي 2014 (الفصل 39).",
  "source": "Loi n° 83-113 du 30 décembre 1983, art. 38",
  "terme": "المعلوم الوحيد التعويضي على النقل بالطرقات"
 },
 "tranche-economique": {
  "autre": "Tranche économique",
  "definition": "أولى شرائح تعريفة الكهرباء ذات الجهد المنخفض، أحدثها القرار المؤرخ في 4 جوان 1984 بداية من 31 ماي 1984: وهي الخمسون كيلواط-ساعة الأولى التي يستهلكها كلّ شهر المشتركون في قوّة 1 أو 2 كيلوفولط-أمبير، بسعر دون سعر القسط العادي. ويُعفى من المعلوم لفائدة صندوق الانتقال الطاقي المشتركون في شبكة الجهد المنخفض في الشريحة الاقتصادية الذين لا يتجاوز استهلاكهم الشهري 100 كيلواط-ساعة (قانون المالية لسنة 2019، الفصل 68).",

 "transfert-monetaire": {

  "definition": "دفع شهري في إطار برنامج الأمان الاجتماعي يتكوّن من منحة قاعدية وزيادة عن كلّ طفل متكفَّل به، تُضاعَف بالنسبة إلى الطفل حامل بطاقة إعاقة. وتُراجَع المنحة القاعدية في سنة 2022 ثم سنويًّا إلى سنة 2026، بمفعول يعود إلى غرّة جانفي لكلّ مراجعة.",

 "unite-compensation-produits-base": {
  "autre": "Unité de compensation des produits de base",
  "definition": "هيكل أُحدث بوزارة المالية، تحت سلطة وزير المالية، بمقتضى الأمر عدد 2145 لسنة 2002 المؤرخ في 30 سبتمبر 2002 (الفصل الأول). وتتمثّل مهامه خاصة في «ضبط الحاجيات السنوية لتعويض المواد الأساسية وطرق تمويلها» والمساهمة في تقييم نجاعة برامج وآليات وطرق وإجراءات تعويض المواد الأساسية (الفصل 2). وأُلحقت الوحدة بوزارة التجارة والصناعات التقليدية بمقتضى الأمر عدد 2934 لسنة 2005 المؤرخ في غرة نوفمبر 2005، مع الإبقاء على مهامها.",
