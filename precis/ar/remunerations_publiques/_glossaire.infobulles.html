 "enseignant-chercheur": {

  "definition": "عضو في سلك المدرسين الباحثين التابعين للجامعات، الخاضع لنظام أساسي خصوصي ضُبط تطبيقًا للنظام الأساسي العام للوظيفة العمومية (الأمر عدد 1825 لسنة 1993 المؤرخ في 6 سبتمبر 1993). ويضمّ السلك أربع رتب قارّة: أستاذ التعليم العالي، وأستاذ محاضر، وأستاذ مساعد، ومساعد. ومنذ سنة 1999، تطابق درجات هذه الرتب مستويات التأجير في الصنف الفرعي أ1 من شبكة أجور أعوان الدولة (الأمر عدد 1804 لسنة 1999). ويشمل التأجير كذلك منحًا خاصّة بالسلك، منها منحة التأطير والبحث.",

 "forces-de-securite-interieure": {

 "gratification-exceptionnelle": {
  "autre": "Gratification exceptionnelle",
  "definition": "مكافأة يمكن أن تُمنح لأعوان قوات الأمن الداخلي في شكل ترقية إلى رتبة أعلى أو تدرّج بدرجة أو عدّة درجات أو في شكل منحة جملية، للأعوان الذين أنجزوا طريقة عمل ترتّب عنها تحسّن في نوعية الخدمات، أو جنّبوا الإدارة أضرارًا فادحة، أو تميّزوا بدرجة عالية من الإتقان في أداء مهامهم (القانون عدد 70 لسنة 1982، الفصل 25 رابعا، المضاف بالقانون عدد 58 لسنة 2000). وتُسند مباشرة من قبل رئيس الجمهورية، أو باقتراح من وزير الداخلية بعد أخذ رأي مجلس الشرف للسلك؛ ويمكن لوزير الداخلية أن يمنحها في شكل ترقية أو تدرّج للأعوان الذين يتميّزون بشجاعتهم أو يصابون بجروح خطيرة أثناء مباشرتهم لوظيفتهم.",

 },
 "grille-des-salaires": {
  "autre": "Grille des salaires",
  "definition": "سُلَّمٌ مُلحَق بالأمر عدد 97-1832 المؤرّخ في 16 سبتمبر 1997، يضبط مباشرة بالدينار، منذ غرّة جانفي 1998، المرتبَ الأساسي الشهري لكلّ ثنائي رتبة × درجة. وتتضمّن ثلاثة جداول مستقلّة: الموظفون والأعوان الوقتيون والعملة. وتركيبتها هي تركيبة غرّة أفريل 2007: فالفصل 2 مكرّر، المُدرَج بالأمر عدد 2007-268، يُدمج فيها جزءًا من المنح الخصوصية وينصّ على أنّ الشبكة تُضبَط وفقًا للملاحق، لا محتسَبة انطلاقًا من نقطة استدلالية. ولا تُخلَط بالشبكة الاستدلالية التي كانت سارية إلى 31 ديسمبر 1997، والتي كانت تُسنِد لكلّ خطّة رقمًا قياسيًا يُحوَّل إلى دنانير بأمر مستقلّ.",
  "source": "الأمر عدد 2007-268 المؤرخ في 12 فيفري 2007, art. 2 bis",
  "terme": "شبكة الأجور"
 },
 "indemnite-charge-securite": {

  "source": "Décret n° 2004-1335 du 7 juin 2004, portant attribution de la troisième tranche de l'augmentation globale des taux de l'indemnité de charge de sécurité aux agents des forces de sécurité intérieure relevant du ministère de la justice et des droits de l'Homme bénéficiaires de cette indemnité au titre de l'année 2004",

 "indemnite-de-gestion-et-d-execution": {

  "definition": "منحة أُحدثت لفائدة سلك التعليم العالي بمقتضى الأمر عدد 1405 لسنة 1985 المؤرخ في 8 نوفمبر 1985، وتُصرف للمدرسين الباحثين التابعين للجامعات حسب رتبهم. ويُرفَّع في مقاديرها بأوامر متتالية، منها سنة 2011 ومن 2020 إلى 2021؛ وتُصرف الزيادة العامة في الأجور لسنوات 2026 إلى 2028 للمدرسين الباحثين عن طريقها.",

 "niveau-de-remuneration": {
  "autre": "Niveau de rémunération",
  "definition": "مرتبة في شبكة أجور أعوان الدولة المضبوطة سنة 1997، يقابلها، في كلّ صنف أو صنف فرعي من الرتب، مرتب أساسي بالدينار. وتضبط أوامر المطابقة، الصادرة سلكًا سلكًا سنتي 1999 و2000، مستوى التأجير الموافق لكلّ درجة من درجات كلّ رتبة، وتعوّض الترتيب الاستدلالي السابق. ويُعاد ترتيب العون المرقّى إلى رتبة تنتمي إلى الصنف الأعلى مباشرة في مستوى التأجير الموافق للمرتب الأساسي الذي يفوق مباشرة ما كان يتقاضاه (الأمر عدد 1832 لسنة 1997، الفصل 10، كما نُقّح بالأمر عدد 268 لسنة 2007). وللعسكريين ولأعوان قوات الأمن الداخلي شبكة مستويات خاصّة بهم.",

 "pensions-civiles-militaires": {
  "autre": "Pensions civiles et militaires",
  "definition": "نظام تقاعد مشترك بين الأعوان المدنيين والعسكريين في القطاع العام، يديره الصندوق الوطني للتقاعد والحيطة الاجتماعية: ولا يوجد صندوق عسكري منفصل. يضبط هذا النظامَ القانونُ عدد 85-12 المؤرّخ في 5 مارس 1985 المتعلّق بنظام جرايات التقاعد والباقين على قيد الحياة المدنية والعسكرية في القطاع العام، المنقَّح خاصّةً بالقانون عدد 2019-37. وضمن هذا النظام المشترك، يعرف الشقّ العسكري معاييرَ استثنائية (مدد خدمة وأعمار انتفاع متمايزة حسب الرتبة).",

 "point-indice": {
  "autre": "Valeur du point d'indice",
  "definition": "مفهوم موروث عن النموذج الفرنسي للمسار المهني، غير معمولٍ به في تونس منذ غرّة جانفي 1998. فإلى 31 ديسمبر 1997، كانت أوامر «ضبط المرتّب الجملي السنوي» تقوم بهذا الدور، إذ تحدّد قيمة الرقم القياسي لكلّ خطّة بالدينار. ومنذ ذلك التاريخ، لا ينشر أيّ نصّ «قيمةً للنقطة» تُطبَّق على رقم قياسي لتحديد المرتب الأساسي: فالشبكة المُلحقة بالأمر عدد 97-1832 هي التي تضبط المبالغ مباشرة بالدينار (الفصل 2 مكرّر، المُدرَج بالأمر عدد 2007-268). ولا يزال المصطلح قائمًا في المصطلحات وفي بعض أوامر تصنيف الأسلاك.",
  "terme": "قيمة النقطة الاستدلالية"
 },
 "prime-de-depart-volontaire": {
  "autre": "Prime de départ volontaire",
  "definition": "منحة مغادرة جزافية يتكفّل المشغّل الأصلي بدفعها دفعة واحدة وبصفة فورية للعون العمومي الذي قُبل مطلب مغادرته الاختيارية (القانون عدد 5 لسنة 2018، الفصل 5). وتساوي ستة وثلاثين أجرًا شهريًا صافيًا، باعتماد الأجر الشهري الصافي الأخير أجرًا مرجعيًا، ولا يمكن أن تفوق 50% من الأجور الصافية التي كان سيتقاضاها العون إلى تاريخ بلوغه السنّ القانونية للإحالة على التقاعد. وتُعفى من الضريبة على الدخل ومن الخصم من المورد.",

 "prime-de-risque": {

  "definition": "منحة شهرية تُسند لأعوان سلك المصالح الديوانية. ومنذ غرّة سبتمبر 2013، يُضبط مقدارها بصفة موحّدة بالنسبة إلى كافة الرتب، من الأصناف الفرعية أ1 وأ2 وأ3 إلى الأصناف ب وج ود (الأمر عدد 3798 لسنة 2013، الفصل الأول)؛ ويعوّض هذا المقدار النسب المضبوطة حسب الرتبة سنة 1997. وللعسكريين ولأعوان قوات الأمن الداخلي منحة خطر خاصّة بهم.",

 "promotion": {

  "definition": "ارتقاء الموظّف إلى الرتبة الموالية مباشرةً للرتبة التي هو متحصّل عليها (القانون عدد 83-112، الفصل 28). وتتمّ بطريقتين: المناظرة الداخلية أو الامتحان المهني أو دورة التكوين؛ أو بالاختيار، على أساس قائمة كفاءة تُضبط بعد استشارة اللجنة الإدارية المتناصفة. وخلافًا للترقية في الدرجة التي تتمّ آليًّا حسب الأقدمية، تُدخل الترقية في الرتبة عنصر الانتقاء وطريقة أداء العمل.",
  "source": "القانون عدد 83-112 المؤرخ في 12 ديسمبر 1983 المتعلق بضبط النظام الأساسي العام لأعوان الدولة والجماعات المحلية والمؤسسات العمومية ذات الصبغة الإدارية, art. 28",

 "recrutement-direct": {
  "autre": "Recrutement direct",
  "definition": "انتداب في القطاع العمومي دون مناظرة، استثناءً من صيغة المناظرة الخارجية بالملفات والاختبارات. ويخصّصه القانون عدد 4 لسنة 2012 (الفصل 3) لفرد واحد من كلّ عائلة من عائلات شهداء الثورة، ولمصابي الثورة وللمنتفعين بالعفو العام، أو عند التعذّر لفرد من عائلاتهم. وينصّ عليه القانون عدد 38 لسنة 2020، على دفعات سنوية متتالية، لفائدة العاطلين عن العمل من أصحاب الشهائد العليا منذ عشر سنوات فأكثر، ولأصحاب الشهائد العليا الذين بلغوا 35 سنة فأكثر، ولفرد من كلّ عائلة جميع أفرادها عاطلون عن العمل (الفصول 1 إلى 3).",

 "regime-conventionnel-public": {
  "autre": "Régime conventionnel public",
  "definition": "فئة تحليلية معتمدة في هذا الدليل للمنشآت العمومية غير المالية. ويقوم تأجير أعوان الدواوين والمؤسسات الصناعية والتجارية والشركات ذات رأس المال العمومي الكامل، في إطار القانون عدد 85-78، على أنظمة أساسية خاصة مصادق عليها بأوامر. وينصّ القانون أيضًا على خيار انتقالي بين النظام الأساسي والاتفاقية القطاعية لبعض الشركات ذات رأس المال العمومي الجزئي.",

  "terme": "النظام الاتفاقي العمومي"
 },
 "regime-indiciaire": {
  "autre": "Régime indiciaire",
  "definition": "نظام تأجير أعوان الدولة والجماعات المحلية والمؤسسات العمومية ذات الصبغة الإدارية، الخاضعين للنظام الأساسي العام (القانون عدد 83-112)، يقوم على رتبة ودرجة. ومنذ غرّة جانفي 1998، يقابل كلَّ ثنائي رتبة × درجة مرتبٌ أساسي شهري محدَّد مباشرة بالدينار في الشبكة المُلحقة بالأمر عدد 97-1832؛ ومنذ غرّة أفريل 2007، أُدمج فيه جزء من المنح الخصوصية (الأمر عدد 2007-268، الفصل 2 مكرّر). ويستمدّ النظام اسمه من الآليّة التي كانت سارية إلى 31 ديسمبر 1997، حيث كان رقم قياسي مُسنَد إلى الخطّة يُحوَّل إلى دنانير بأمر مستقلّ؛ ومنذ ذلك التاريخ لا تعمل أيّ «قيمة للنقطة»، ولم تبق النقطة الاستدلالية إلا في المصطلحات وفي بعض أوامر تصنيف الأسلاك.",
  "terme": "النظام الاستدلالي للتأجير"
 },
 "regime-marche-controle": {
  "autre": "Régime de marché contrôlé",
  "definition": "فئة تحليلية معتمدة في هذا الملخّص للمنشآت العمومية المالية: البنوك وشركات التأمين. ويُضبَط تأجير الأعوان فيها بالاتفاقية المشتركة لقطاعهم، وهي مشتركة بين المؤسسات العمومية والخاصة: اتفاقية أعوان البنوك والمؤسسات المالية، المنقَّحة والمصادق عليها في 17 فيفري 2014؛ واتفاقية التأمين، المصادق عليها في 24 ديسمبر 1975 للقطاع بأسره، والمنقَّحة سنة 1983 والمتبوعة بخمسة عشر ملحقًا تعديليًا من سنة 1989 إلى سنة 2022. أمّا تأجير المديرين العامين للبنوك العمومية فيخضع للأمر الحكومي عدد 968 لسنة 2015 المؤرّخ في 6 أوت 2015: يصادق مجلس الإدارة على نظام التأجير بعد أن تحدّد لجنة التأجير عناصره. وأمّا تأجير رؤساء المؤسسات العمومية والشركات ذات الأغلبية العمومية الأخرى فيخضع للأمر الحكومي عدد 2217 لسنة 2015 المؤرّخ في 11 ديسمبر 2015. ولا تسمّي اتفاقية التأمين أيّ شركة.",
  "terme": "نظام السوق الموجَّه"
 },
 "regime-statutaire-autonome": {
  "autre": "Régime statutaire autonome",
  "definition": "فئة معتمدة في هذا الملخّص للأسلاك الخاضعة لنظام أساسي خاصّ بها، متميّز عن النظام الأساسي العام للوظيفة العمومية: القضاة والعسكريون وقوات الأمن الداخلي وأعوان الديوانة. ويتقاضى كلّ سلك مرتّبًا أساسيًا أو أجرًا أساسيًا، مرتّبًا منذ سنتي 1999 و2000 على شبكة مستويات تأجير — شبكة أجور أعوان الدولة بالنسبة إلى القضاة وأعوان الديوانة، وشبكة خاصّة بالعسكريين وبأعوان قوات الأمن الداخلي —، تُضاف إليه منح تُضبط سلكًا سلكًا. وبالنسبة إلى الأسلاك الثلاثة الأولى، ينتج هذا الانفصال عن بند استثناء من مجال التطبيق، لا عن خروج تدريجي: فالفصل الأول من القانون عدد 83-112 المتعلّق بالنظام الأساسي العام يُخرجها من مجال تطبيقه ويحيلها إلى نصوصها الخاصّة — القانون عدد 67-29 (القضاة العدليون)، والقانون عدد 67-20 (العسكريون)، والقانون عدد 82-70 (قوات الأمن الداخلي). أمّا استقلالية أعوان الديوانة فتستند إلى نظامهم الأساسي العام الخاصّ بهم (القانون عدد 95-46 المؤرّخ في 15 ماي 1995).",
  "source": "القانون عدد 83-112 المؤرخ في 12 ديسمبر 1983 المتعلق بضبط النظام الأساسي العام لأعوان الدولة والجماعات المحلية والمؤسسات العمومية ذات الصبغة الإدارية, art. 1er",
  "terme": "النظام الأساسي الخاص"
 },
 "remuneration-dirigeants-entreprises-publiques": {
  "autre": "Rémunération des dirigeants d'entreprises publiques",
  "definition": "تأجير رؤساء المؤسسات والمنشآت العمومية والشركات ذات الأغلبية العمومية، وهي الشركات التي يمتلك المساهمون العموميون والمنشآت العمومية رأس مالها بنسبة لا تقل عن 50 %. ويضبط الأمر الحكومي عدد 2217 لسنة 2015 المؤرّخ في 11 ديسمبر 2015 نظام هذا التأجير: ترتيب المؤسسة في ستة أصناف، وصيغتان للتأجير يختار بينهما رئيس المؤسسة، والامتيازات المسندة له، ومنع إضافة أي منحة أخرى إلى التأجير. ويُستثنى من هذا النظام المديرون العامون للبنوك العمومية، الخاضعون للأمر الحكومي عدد 968 لسنة 2015 المؤرّخ في 6 أوت 2015. وقد ألغى أمر 2015 الأمر عدد 90-1855 (1990) والأمر عدد 2014-12 (2014)، ويفتتح الأمر عدد 78-885 (1978) سلسلة هذه النصوص.",
  "source": "الأمر الحكومي عدد 2217 لسنة 2015 المؤرخ في 11 ديسمبر 2015 المتعلق بضبط نظام تأجير رؤساء المؤسسات والمنشآت العمومية والشركات ذات الأغلبية العمومية",
  "terme": "تأجير رؤساء المؤسسات والمنشآت العمومية"
 },
 "retenue-a-la-source": {
  "autre": "Retenue à la source",
  "definition": "اقتطاع للأداء يقوم به دافع المبلغ لحساب من يقبضه، ويُدفَع المبلغ المخصوم للخزينة ويُحتسَب على الأداء المستوجَب على هذا الأخير، إلّا إذا جعله القانون تحرّريًا أو نهائيًا وغير قابل للإرجاع (المجلة، الفصلان 52 و54). ففي مادة الضريبة على دخل الأشخاص الطبيعيين يقوم به المؤجِّر عند دفع المرتب والمنح الخاضعة للضريبة (مجلة الضريبة على الدخل والضريبة على الشركات، القانون عدد 89-114). وفي مادة الأداء على القيمة المضافة تخصم الدولة والجماعات المحلية والمؤسسات والمنشآت العمومية جزءا من الأداء المفوتر من قبل مزوديها : 50 بالمائة ابتداء من سنة 1998 و25 بالمائة ابتداء من سنة 2016.",
  "source": "Loi n° 89-114 du 30 décembre 1989",
  "terme": "الخصم من المورد"
 },
 "salaire-d-efficience": {
  "autre": "Salaire d'efficience",
  "definition": "أجر يُضبط فوق الأجر الذي يكفي لسدّ الوظيفة، قصد الرفع من جهد العون أو نزاهته: فكلّما ارتفع الأجر، ارتفع ما يخسره العون في صورة عزله، وارتفعت كلفة الخطأ أو الرشوة بالنسبة إليه. ويتوقّف هذا الأثر على احتمال الكشف وعلى العقوبة؛ فإذا كان الكشف نادرًا أو كانت الرشاوى مرتفعة، أصبح الأجر الكفيل بالقضاء على الفساد مرتفعًا جدًّا.",
  "source": "Bureaucratic corruption and the rate of temptation: do wages in the civil service affect corruption, and by how much?",
  "terme": "أجر الكفاءة"
 },
 "service-fait": {
  "autre": "Service fait",
  "definition": "قاعدة مفادها أنّ حقّ العون العمومي في الأجر ينشأ عن الأداء الفعلي للخدمة، لا عن مجرّد صفته كعون. أقرّها النظام الأساسي العام — إذ «للأعوان الحقّ في أجر بعد أداء الخدمة» (القانون عدد 83-112، الفصل 13) — وهي امتداد لمبدإٍ عامّ في المالية العمومية: لا يُصرف أيّ دفع إلّا للدائن الحقيقي المثبت لحقوقه ومقابل خدمة منجزة (مجلة المحاسبة العمومية، الفصل 41).",
  "source": "القانون عدد 83-112 المؤرخ في 12 ديسمبر 1983 المتعلق بضبط النظام الأساسي العام لأعوان الدولة والجماعات المحلية والمؤسسات العمومية ذات الصبغة الإدارية, art. 13",
  "terme": "قاعدة الخدمة المنجزة"
 },
 "service-national": {
  "autre": "Service national",
  "definition": "واجب محمول على كلّ مواطن بلغ من العمر عشرين عامًا، ويبقى ملزمًا بأدائه إلى حين بلوغه سنّ الخامسة والثلاثين، ويهدف إلى إعداد المواطن للدفاع عن حوزة الوطن وإلى المشاركة في التنمية الشاملة للبلاد (القانون عدد 1 لسنة 2004، الفصلان الأول و2). وتتخذ الخدمة الوطنية أحد شكلين: خدمة عسكرية مباشرة، أو خدمة وطنية خارج وحدات القوات المسلحة، لدى وحدات قوات الأمن الداخلي أو في نطاق التعيينات الفردية بالإدارات والمؤسسات أو في إطار التعاون الفني (الفصلان 3 و4). وقد خلفت الخدمة العسكرية التي نظّمها القانون عدد 19 لسنة 1967.",
  "source": "Loi n° 2004-1 du 14 janvier 2004, relative au service national, art. 1er à 4",
  "terme": "الخدمة الوطنية"
 },
 "solde-militaire": {
  "autre": "Solde (militaire)",
  "definition": "أجور العسكريين. يتقاضى الضباط وضباط الصف والعرفاء أجرًا أساسيًا مرتّبًا على شبكة: استدلالية إلى سنة 1997، ثمّ، منذ سنة 1999، شبكة مستويات تأجير خاصّة بالعسكريين وبأعوان قوات الأمن الداخلي. أمّا العسكريون الذين لا تُدفع أجورهم حسب شبكة الوظيفة العمومية — الجنود الذين يواصلون الخدمة بعد المدّة القانونية والمجنّدون — فقد تقاضوا راتبًا يوميًا يُضبط بأمر (الأمر عدد 590 لسنة 1975، ثمّ الأمر عدد 96 لسنة 1979 المؤرخ في 11 جانفي 1979): المجنّدون إلى سنة 2011، حين عُوّض بمنحة شهرية، والجنود إلى سنة 2023، حين أُدرجوا في الشبكة. وتُضاف إلى هذه الأجور منح، منها منحة الكلف العسكرية.",
  "source": "الأمر عدد 79-96 المؤرخ في 11 جانفي 1979 المتعلق بضبط أجور العسكريين الذين لا تدفع أجورهم حسب جدول الأرقام القياسية الخاصة بالوظيفة العمومية وبنظام التموين بالجيش",
  "terme": "أجور العسكريين"
 },
 "statut-particulier": {
  "autre": "Statut particulier",
  "definition": "نصّ يُتَّخذ أو يُصادَق عليه بأمر، يضبط القواعد الخاصّة بسلك أو بأعوان هيكل. ففي الوظيفة العمومية، تفصّل الأنظمة الأساسية الخصوصية النظام الأساسي العام (القانون عدد 83-112) سلكًا سلكًا: شروط الانتداب والترقية والواجبات؛ أمّا الأنظمة الأساسية الخصوصية الاستثنائية الواردة بفصله 2 فتخالف بعض أحكامه دون الخروج عنه. وفي المنشآت العمومية، يُخضع القانون عدد 85-78 الأعوان القارّين للدواوين والمؤسسات الصناعية والتجارية والشركات ذات رأس المال العمومي الكامل لأنظمة أساسية خصوصية مصادق عليها بأمر. ويخضع أعوان مؤسسات الضمان الاجتماعي لنظام أساسي صودق عليه بأمر سنة 1999، ثمّ لنظام أساسي خاصّ صودق عليه بالأمر الرئاسي عدد 2022-76 الذي ألغى سابقه.",
  "terme": "النظام الأساسي الخصوصي"
 },
 "traitement-de-base": {
  "autre": "Traitement de base",
  "definition": "الجزء الرئيسي من أجر العون العمومي الخاضع للنظام الاستدلالي، قبل المنح والمكافآت. ومنذ غرّة جانفي 1998، يُضبَط مبلغه الشهري مباشرة بالدينار، لكلّ ثنائي رتبة × درجة، في شبكة الأجور المُلحقة بالأمر عدد 97-1832، ولا يُحتسب انطلاقًا من قيمة نقطة استدلالية. ومنذ غرّة أفريل 2007، أُدمج فيه جزء من المنح الخصوصية للأسلاك (الأمر عدد 2007-268، الفصل 2 مكرّر).",
  "source": "الأمر عدد 2007-268 المؤرخ في 12 فيفري 2007, art. 2 bis",
  "terme": "المرتب الأساسي"
 }
}
