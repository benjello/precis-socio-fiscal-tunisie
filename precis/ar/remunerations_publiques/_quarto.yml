project:
  type: book
  output-dir: public

lang: ar

# Surcharge des libellés d'interface Quarto en arabe (lang: ar ne les traduit
# pas tous). Customisation propre au livre AR.
language:
  toc-title-document: "المحتويات"
  toc-title-website: "في هذه الصفحة"
  repo-action-links-edit: "تعديل هذه الصفحة"
  repo-action-links-issue: "الإبلاغ عن مشكل"
  repo-action-links-source: "عرض المصدر"

book:
  title: "الأجور في القطاع العام"
  author: "Mahdi Ben Jelloul"
  repo-url: https://github.com/benjello/precis-socio-fiscal-tunisie/
  repo-subdir: precis/ar/remunerations_publiques
  repo-branch: master
  repo-actions: [edit, issue]
  chapters:
    - index.qmd
    - _regime_indiciaire.qmd
    - _regime_statutaire_autonome.qmd
  appendices:
    - _glossaire.qmd
    - _references.qmd

bibliography:
  - references.json
  - ../references.json
  - ../references.bib

format:
  html:
    theme: [cosmo, rtl.scss]
    number-depth: 3
    toc: true
  pdf:
    documentclass: scrreprt
    toc: true
    number-sections: true
