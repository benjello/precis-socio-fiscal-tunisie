 "fonds-foprolos": {
  "autre": "Fonds de promotion du logement pour les salariés",
  "definition": "صندوق أُحدث بالقانون عدد 54 لسنة 1977 المؤرّخ في 3 أوت 1977، وهو متميّز عن مساهمة المؤجّرين التي تموّله، وجعله قانون المالية التكميلي الصادر في اليوم نفسه صندوقًا خاصًّا للخزينة. يهدف إلى مساعدة الأجراء الراغبين في تملّك مسكن، بواسطة قروض، ومنذ 2016 بواسطة هبات أيضًا. ومنذ غرّة جانفي 2026، يساهم كذلك في تمويل بناء المساكن وتهيئة المقاسم الاجتماعية التي تنجزها الشركة الوطنية العقارية للبلاد التونسية وفروعها وشركة النهوض بالمساكن الاجتماعية والوكالة العقارية للسكنى. تتكوّن موارده من المساهمة ومن استرجاع أصل قروضه وفوائضها.",
  "source": "Loi n° 77-54 du 3 août 1977, art. 5-6",
  "terme": "صندوق النهوض بالمسكن لفائدة الأجراء"
 },
 "fonds-solidarite-nationale": {
  "autre": "Fonds de solidarité nationale",
  "definition": "حساب خاص للخزينة يُفتح بدفاتر أمين المال العام للبلاد التونسية لتمويل التدخلات التي يأذن بها الوزير المكلف بالشؤون الاجتماعية لفائدة الفئات الاجتماعية ضعيفة الدخل والتجمعات السكنية التي تفتقر إلى المرافق الأساسية الدنيا، ويتولى الوزير المذكور الإذن بالدفع لمصاريفه. حُذف بمقتضى الفصل 12 من قانون المالية لسنة 2013 وأُحيلت بقايا موارده إلى الصندوق الوطني للتضامن الاجتماعي.",
  "source": "Décret-loi n° 2011-55 du 9 juin 2011, art. 1er (art. 29 nouveau de la loi n° 92-122)",
  "terme": "صندوق التضامن الوطني"
 },
 "fonds-special-tresor": {
  "autre": "Fonds spéciaux du Trésor",
  "definition": "حساب في الخزينة يخصّص له قانون المالية موارد ويضبط تقديراته كلّ سنة في جدول ملحق به. وقد جعل قانون المالية لسنة 1971 (الفصل 48) الصندوق العام للتعويض من هذه الحسابات، وأرجع إليه الأداءات والأتاوات التعويضية.",
  "source": "Loi n° 70-66 du 31 décembre 1970, art. 48",
  "terme": "الحسابات الخاصة في الخزينة"
 },
 "foprolos": {
  "acronyme": "FOPROLOS",
  "autre": "Contribution au fonds de promotion du logement pour les salariés",
  "definition": "اقتطاع محمول على كلّ مؤجّر عمومي أو خاصّ، باستثناء المستغلّين الفلاحيين الخواصّ، أُحدث سنة 1977 بنسبة 2 % من الأجور الخاضعة للمساهمات الاجتماعية، ثمّ خُفّض سنة 1989 إلى 1 % من الأجور والمرتّبات. يموّل صندوقًا يساعد الأجراء على الحصول على مسكن.",
  "source": "Loi n° 77-54 du 3 août 1977, art. 1-2",
  "terme": "المساهمة الراجعة لصندوق النهوض بالمسكن لفائدة الأجراء"
 },
 "incidence-fiscale": {
  "autre": "Incidence fiscale",
  "definition": "توزيع العبء الفعلي للأداء بين الأعوان الاقتصاديين — المشترين والبائعين، والمؤجّرين والأجراء —، وهو غير تعيين الشخص المطالب قانونًا بالأداء. وحسب مراجعة ميرليس (Mirrlees Review، 2011)، يتحمّل الأداءَ من يُنقص من رفاهه، وليس بالضرورة من يدفعه؛ وحسب ألم وأنيز ومودي (2004)، يتوقّف توزيع معلوم نقل الملكية بين المشتري والبائع على مرونة الطلب والعرض.",
  "source": "Tax by Design: The Mirrlees Review, p. 27-28",
  "terme": "توزيع العبء الجبائي"
 },
 "indemnite-de-deces": {
  "autre": "Indemnité de décès",
  "definition": "مبلغ يُسند لذوي الحقّ عند وفاة العامل أو أحد أفراد عائلته، ويُعبَّر عنه بمضاعفات التعويض اليومي: مائة وعشرون مرّة بالنسبة إلى العامل نفسه، ووفق جدول تنازلي حسب السنّ لبقية أفراد الأسرة.",
  "source": "Loi n° 60-30 du 14 décembre 1960, art. 83-87",
  "terme": "منحة الوفاة"
 },
 "indemnite-journaliere": {
  "autre": "Indemnité journalière",
  "definition": "دخل تعويضي يُصرف عن كلّ يوم انقطاع عن العمل ويُحتسب بجزء من الأجر اليومي المتوسّط. يختلف هذا الجزء وتختلف فترة الانتظار باختلاف الفرع: المرض بمقتضى القانون عدد 30 لسنة 1960، وحوادث الشغل بمقتضى القانون عدد 28 لسنة 1994 الذي يرفعه إلى ثلثي الأجر اليومي المعتاد.",
  "source": "Loi n° 60-30 du 14 décembre 1960, art. 77",
  "terme": "التعويض اليومي"
 },
 "indemnite-perte-emploi": {
  "autre": "Protection contre la perte d'emploi",
  "definition": "آلية أقرّها القانون عدد 101 لسنة 1996 لضمان تعويضات الطرد والحقوق القانونية للعمال الذين فقدوا شغلهم لأسباب اقتصادية أو فنية عند توقف المؤسسة عن الدفع. وتُبقي مؤقتًا على المنح العائلية والحق في العلاج، دون أن تُحدث دخلًا بديلًا.",
  "source": "Loi n° 96-101 du 18 novembre 1996, art. 2-9",
  "terme": "الحماية الاجتماعية للعمال الذين يفقدون شغلهم لأسباب اقتصادية أو فنية"
 },
 "location-vente": {
  "autre": "Location-vente",
  "definition": "طريقة لإحالة مسكن بمقتضى عقد كراء مملّك. ومنذ 14 فيفري 2026، يمكن للشركة الوطنية العقارية للبلاد التونسية وفروعها ولشركة النهوض بالمساكن الاجتماعية إحالة المساكن الاجتماعية المموّلة من موارد صندوق النهوض بالمسكن لفائدة الأجراء على هذا النحو؛ ومنذ 20 جوان 2026، لا ينطبق السعر الأقصى للمتر المربع لمساكن الباعثين على هذه الإحالات، وتُضبط معينات الكراء حسب كلفة كل مشروع بمقتضى اتفاقية بين الباعث العمومي والوزارة المكلّفة بالإسكان.",
  "source": "Décret n° 2026-123 du 19 juin 2026, art. 9 bis",
  "terme": "الكراء المملّك"
 },
 "logement-rudimentaire": {
  "autre": "Logement rudimentaire",
  "definition": "مسكن غير صحّي مأهول بصفة دائمة. يعدّ الأمر عدد 438 لسنة 1986 المؤرّخ في 12 أفريل 1986 من المساكن البدائية الأكواخ و«الكيب» و«المعمرات» والبراريك والخيام؛ ويعتمد الأمر عدد 1224 لسنة 2012 المؤرّخ في 10 أوت 2012 المحلاّت المأهولة بصفة دائمة التي لا تستجيب موادّها أو مساحتها أو متانتها للمواصفات الصحية والفنية الدنيا للسكن. وتعويضها هو موضوع البرنامج الوطني لسنة 1986، وأحد تدخّلات الصندوق الوطني لتحسين السكن، والبرنامج الخصوصي للسكن الاجتماعي.",
  "source": "Décret n° 2012-1224 du 10 août 2012, art. 7",
  "terme": "المساكن البدائية"
 },
 "logement-social": {
  "autre": "Logement social",
  "definition": "مسكن موجّه إلى الأسر ذات الدخل الضعيف، يُنجز أو يُموَّل بدعم عمومي. وفي إطار البرنامج الخصوصي للسكن الاجتماعي، يعرّفه الأمر عدد 1224 لسنة 2012 المؤرّخ في 10 أوت 2012 بأنه مسكن فردي قابل للتوسعة لا يتجاوز ثمنه 45 ألف دينار، أو مسكن جماعي لا يتجاوز ثمنه 65 ألف دينار. ومنذ 2026، يمكن للشركة الوطنية العقارية للبلاد التونسية وفروعها ولشركة النهوض بالمساكن الاجتماعية بيع المساكن الاجتماعية المموّلة من صندوق النهوض بالمسكن لفائدة الأجراء بالكراء المملّك أو بالتقسيط.",
  "source": "Décret n° 2012-1224 du 10 août 2012, art. 20",
  "terme": "السكن الاجتماعي"
 },
 "majoration-salaire-unique": {
  "autre": "Majoration pour salaire unique",
  "definition": "زيادة ثلاثية في المنح العائلية أحدثها القانون عدد 36 لسنة 1980 ابتداء من غرّة ماي 1980. تُشترط فيها ثلاثة شروط مجتمعة: وجود أبناء متكفَّل بهم، وحقّ مفتوح في المنح العائلية، وقرين لا يمارس أيّ نشاط مهني، وهو الشرط الذي أخذت منه المنحة تسميتها.",
  "source": "Loi n° 80-36 du 28 mai 1980, art. 65 bis",
  "terme": "منحة الأجر الوحيد"
 },
 "pnafn": {
  "acronyme": "PNAFN",
  "autre": "Programme national d'aide aux familles nécessiteuses",
  "definition": "برنامج مساعدة أجاز قانون المالية التعديلي لسنة 1986 تمويله من قبل هياكل الضمان الاجتماعي. ويعاين القرار المشترك المؤرخ في 10 جويلية 2024 أن منحته الشهرية كانت مضبوطة آنذاك بمائة وثمانين دينارًا، ويجيز الترفيع فيها في حدود التحويل النقدي لبرنامج الأمان الاجتماعي.",
  "source": "Loi n° 86-83 du 1er septembre 1986, art. 13",
  "terme": "البرنامج الوطني لمساعدة العائلات المعوزة"
 },
 "premier-logement": {
  "autre": "Premier logement",
  "definition": "مسكن تقتنيه أسرة لا تملك مسكنًا لسكناها الرئيسية، واسم البرنامج الذي أحدثه قانون المالية لسنة 2017 لفائدة الفئات ذات الدخل المتوسّط. وفي صيغة الأمر الحكومي عدد 161 لسنة 2017 المؤرّخ في 31 جانفي 2017، يكون المسكن جديدًا، يتضمّن غرفتين وقاعة جلوس على الأقل، ينجزه باعث عقاري مصادق عليه، ولا يتجاوز ثمنه 200 ألف دينار؛ ويقرض البرنامج العائلات التي يتراوح دخلها بين 4,5 و10 مرّات الأجر الأدنى المضمون لمختلف المهن جزءًا من التمويل الذاتي بنسبة فائدة ميسّرة. ومنذ 2025، يشمل البرنامج أيضًا بناء مسكن أول. ومنذ 2023، تموّل قروض صندوق النهوض بالمسكن لفائدة الأجراء هي أيضًا مسكنًا أول.",
  "source": "Décret gouvernemental n° 2017-161 du 31 janvier 2017, art. 3, 5-6",
  "terme": "المسكن الأول"
 },
 "prestation-monetaire": {
  "autre": "Prestation monétaire",
  "definition": "منفعة تُسند إلى المنتفع في شكل مبلغ مالي، دفعة واحدة أو بصفة دورية. وهي تقابل غالبًا ما تسمّيه النصوص القانونية منحة أو تعويضًا نقديًّا، دون أن تكون هذه التسميات مترادفة في جميع السياقات. فالفصل 68 من القانون عدد 30 لسنة 1960 يذكر «المنح النقدية»، بينما يميّز الفصلان 11 و12 من القانون الأساسي عدد 10 لسنة 2019 بين «التحويلات المالية المباشرة» و«الدعم المادي».",
  "source": "Loi n° 60-30 du 14 décembre 1960, art. 68",
  "terme": "المنفعة النقدية"
 },
 "prestation-non-monetaire": {
  "autre": "Prestation non monétaire",
  "definition": "منفعة تُسند في صورة سلعة أو علاج أو خدمة أو نفاذ إلى خدمة، لا في شكل مبلغ مالي. وهي تقابل غالبًا ما يسمّى في المصطلح القانوني التقليدي منفعة عينية، دون تطابق مطلق بين العبارتين. فالفصل 68 من القانون عدد 30 لسنة 1960 يقابل «المنح النقدية» بالعلاج في صورة العيادات أو الإيواء، ويميّز الفصل 13 من القانون الأساسي عدد 10 لسنة 2019 «المنافع الصحية» من التحويلات والدعم المادي.",
  "source": "Loi n° 60-30 du 14 décembre 1960, art. 68",
  "terme": "المنفعة غير النقدية"
 },
 "prestations-familiales": {
  "autre": "Prestations familiales",
  "definition": "منافع تُسند بعنوان الأبناء المتكفَّل بهم. ويشمل الفصل 51 من القانون عدد 30 لسنة 1960 المنح العائلية ومنح عطل الولادة ومنح عطل الشبان العاملين. وأضيفت منحة الأجر الوحيد والمساهمة في مصاريف رياض الأطفال بنصوص لاحقة.",
  "source": "Loi n° 60-30 du 14 décembre 1960, art. 51",
  "terme": "المنح العائلية"
 },
 "programme-specifique-logement-social": {
  "autre": "Programme spécifique pour le logement social",
  "definition": "برنامج أحدثه قانون المالية التكميلي لسنة 2012 لفائدة الفئات الاجتماعية محدودة الدخل، لتعويض المساكن البدائية وإنجاز مشاريع سكنية. يموَّل من ميزانية الدولة ومن استخلاص القروض ومن الهبات، وتنجزه المجالس الجهوية والشركات العقارية العمومية وشركة النهوض بالمساكن الاجتماعية ووكالة التهذيب والتجديد العمراني والوكالة العقارية للسكنى وباعثون عقاريون خواص. وفي صيغة الأمر الصادر في أوت 2012، يتوجّه إلى العائلات التي لا تملك مسكنًا ولا يتجاوز دخلها ثلاث مرّات الأجر الأدنى المضمون لمختلف المهن، في ثلاثة أصناف، بتحمّل نصف كلفة تعويض المسكن البدائي أو بمنحة لاقتناء مسكن اجتماعي.",
  "source": "Loi n° 2012-1 du 16 mai 2012, art. 27-32",
  "terme": "البرنامج الخصوصي للسكن الاجتماعي"
 },
 "promoteur-agree": {
  "autre": "Promoteur immobilier agréé",
  "definition": "باعث عقاري متحصّل على مصادقة الإدارة. ومنذ 1977، يقرض صندوق النهوض بالمسكن لفائدة الأجراء لاقتناء مسكن جديد من باعث عقاري مصادق عليه؛ ومنذ 2023، يمكن اقتناء الأرض التي يموّلها من باعث عقاري مصادق عليه أو من الخواص. وينجز المسكنَ في برنامج المسكن الأول باعثٌ عقاري مصادق عليه.",
  "source": "Décret gouvernemental n° 2017-161 du 31 janvier 2017, art. 3",
  "terme": "الباعث العقاري المصادق عليه"
 },
 "quota-regional": {
  "autre": "Quota régional",
  "definition": "تحديد للحصص تنصّ عليه الأوامر المتعلقة ببطاقات العلاج المجاني وبالتعريفة المنخفضة. وتقرّر هذه الأوامر أن يُضبط العدد الجملي للبطاقات وتوزيعها الجهوي بقرار مشترك.",
  "source": "Décret n° 98-1812 du 21 septembre 1998, art. 2",
  "terme": "الحصّة الجهوية"
 },
 "rente-accident-travail": {
  "autre": "Rente d'accident du travail",
  "definition": "دخل دوري يُسند بعنوان العجز الدائم، يُحوَّل إلى رأس مال دون نسبة خمسة عشر بالمائة من العجز ويُرفَّع عند الحاجة إلى مساعدة الغير. ويُسند إيراد للباقين على قيد الحياة لفائدة القرين واليتامى.",
  "source": "Loi n° 94-28 du 21 février 1994, art. 39 et s.",
  "terme": "إيراد حادث الشغل"
 },
 "salaire-journalier-moyen": {
  "autre": "Salaire journalier moyen",
  "definition": "القاعدة المرجعية لاحتساب التعويضات اليومية، تُستخرج من الأجور المقبوضة خلال فترة سابقة للانقطاع عن العمل. وقد أعاد الفصل 88 الجديد من القانون عدد 91 لسنة 1998 صياغة تعريفها.",
  "source": "Loi n° 60-30 du 14 décembre 1960, art. 88-90",
  "terme": "الأجر اليومي المتوسّط"
 },
 "score-eligibilite": {
  "autre": "Score d'éligibilité",
  "definition": "عدد يُحتسب انطلاقًا من متغيّرات قابلة للملاحظة في الأسرة، ويُستعمل للمفاضلة بين المطالبين بالانتفاع ببرنامج الأمان الاجتماعي. وقد عدّد قرار 19 ماي 2020 أبعاده دون أن ينشر معاملات ترجيحه.",
  "source": "Arrêté du ministre des affaires sociales du 19 mai 2020, art. 2",
  "terme": "أنموذج التنقيط"
 },
 "smig": {
  "acronyme": "SMIG",
  "autre": "Salaire minimum interprofessionnel garanti",
  "definition": "الحدّ الأدنى القانوني للأجر بالساعة أو بالشهر المطبَّق على أجراء القطاعات غير الفلاحية الخاضعة لمجلة الشغل. تضبطه الدولة بأمر منذ غرّة جانفي 1974. ويُضبط بالساعة وبالشهر، في نظامين لمدة العمل: نظام عمل 48 ساعة ونظام عمل 40 ساعة في الأسبوع.",
  "source": "Décret gouvernemental n° 2017-668 du 5 juin 2017",
  "terme": "الأجر الأدنى المضمون لمختلف المهن"
 },
 "snit": {
  "acronyme": "SNIT",
  "autre": "Société nationale immobilière de Tunisie",
  "definition": "مؤسسة ذات صبغة تجارية تخضع لأحكام شركات المساهمة، تساهم الدولة برأس مالها، ودخل نظامها الأساسي حيّز التنفيذ بداية من غرّة سبتمبر 1957. تنجز عمليات عقارية لحسابها أو لحساب الدولة أو الجماعات، وتتصرّف في عقارات، وتنجز برامج بناء. ومنذ 14 فيفري 2026، يمكنها هي وفروعها بيع المساكن الاجتماعية المموّلة من موارد صندوق النهوض بالمسكن لفائدة الأجراء بالتقسيط أو بمقتضى عقود الكراء المملّك.",
  "source": "Loi n° 57-19 du 10 septembre 1957, statut, art. 1er-3",
  "terme": "الشركة الوطنية العقارية للبلاد التونسية"
 },
 "sprols": {
