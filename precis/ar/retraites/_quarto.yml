  author: "مهدي بن جلول"
  repo-url: https://github.com/benjello/precis-socio-fiscal-tunisie/
  repo-subdir: precis/ar/retraites
  repo-branch: master
  repo-actions: [edit, issue]

  downloads: [pdf]
  chapters:
    - index.qmd
    - _secteur_public.qmd
    - _secteur_prive.qmd

  appendices:
    - _glossaire.qmd

language:
