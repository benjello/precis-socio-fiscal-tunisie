  "source": "القانون عدد 83-112 المؤرخ في 12 ديسمبر 1983 المتعلق بضبط النظام الأساسي العام لأعوان الدولة والجماعات المحلية والمؤسسات العمومية ذات الصبغة الإدارية",
  "terme": "المؤسسة العمومية ذات الصبغة الإدارية"
 },
 "epic": {
  "acronyme": "EPIC",
  "autre": "Établissement public à caractère industriel et commercial",
  "definition": "مؤسسة عمومية تمارس نشاطًا صناعيًا أو تجاريًا، يخضع أعوانها للقانون عدد 85-78 لا للنظام الأساسي العام للوظيفة العمومية.",

 },
 "fonctions-astreignantes": {
  "autre": "Fonctions astreignantes",
  "definition": "وظائف يضبط قائمتها الأمر عدد 1178 لسنة 1985 المؤرّخ في 24 سبتمبر 1985، تفتح مباشرتها سنًّا استثنائية للإحالة على التقاعد مقترنة بمدّة خدمات بـ35 سنة: 55 سنة في القانون عدد 12 لسنة 1985، و57 سنة منذ القانون عدد 37 لسنة 2019 (الفصل 28). وينتفع الأعوان المعنيّون بترفيع في مدّة الخدمات يساوي الفترة المتبقّية إلى سنّ الستين في صيغة 1985، ثم إلى سنّ 62 سنة بداية من 5 ماي 2019 (الفصل 32).",
  "source": "القانون عدد 85-12 المؤرخ في 5 مارس 1985, art. 28 et 32",
  "terme": "الوظائف المرهقة"
 },
 "forces-de-securite-interieure": {
  "autre": "Forces de sécurité intérieure",
  "definition": "الأسلاك المكلّفة بحفظ النظام والأمن العام، التي تتمتّع بنظام أساسي خاصّ مستقلّ عن النظام الأساسي العام للوظيفة العمومية (القانون عدد 82-70 المؤرّخ في 6 أوت 1982). ويشمل هذا النظام أعوان الأمن الوطني والحرس الوطني والحماية المدنية وكذلك مصالح السجون والإصلاح.",
  "source": "القانون عدد 82-70 المؤرخ في 6 أوت 1982",
  "terme": "قوات الأمن الداخلي"
 },
 "indemnite-caractere-familial": {
  "autre": "Indemnité à caractère familial",
  "definition": "منحة تُسند حسب رتبة الطفل إلى الأعوان العموميين الذين لهم أبناء في الكفالة، وفق نسب شهرية يضبطها أمر، وتُضاف بنفس الشروط إلى جراية التقاعد (القانون عدد 12 لسنة 1985، الفصل 40)، كما كانت تُضاف إليها منذ غرّة ماي 1981 (القانون عدد 70 لسنة 1981، الفصل 4). ويقصر القانون عدد 39 لسنة 1988 الحقّ فيها على الأبناء الثلاثة الأوائل؛ ويضبط الأمر عدد 1906 لسنة 1996 نسبها منذ غرّة نوفمبر 1996.",
  "source": "القانون عدد 85-12 المؤرخ في 5 مارس 1985, art. 40",
  "terme": "المنحة ذات الصبغة العائلية"
 },
 "indemnite-revenu-unique": {
  "autre": "Indemnité de revenu unique",
  "definition": "منحة تُسند إلى العون العمومي الذي له أبناء في الكفالة ولا يتوفّر لأسرته إلّا دخل واحد، وتُضاف إلى جراية التقاعد بنفس الشروط المطبّقة على الأعوان المباشرين (القانون عدد 12 لسنة 1985، الفصل 40)؛ ويعود حقّ المتقاعدين فيها إلى غرّة ماي 1981 (القانون عدد 70 لسنة 1981، الفصلان 4 و5). وحسب دليل تصفية الجرايات للصندوق الوطني للتقاعد والحيطة الاجتماعية (2013)، يُشترط فيها وجود طفل واحد على الأقلّ يفتح الحقّ في المنحة العائلية. وهي متميّزة عن منحة الأجر الوحيد في القطاع الخاص.",
  "source": "القانون عدد 85-12 المؤرخ في 5 مارس 1985, art. 40",
  "terme": "منحة الدخل الوحيد"
 },
 "jouissance-differee": {
  "autre": "Jouissance différée",
  "definition": "تأجيل صرف جراية مكتسَب الحقّ فيها إلى سنّ يضبطها النصّ. في القطاع العمومي، يُؤجَّل الانتفاع بجراية العون المحال على التقاعد بطلب منه أو المسرَّح لعدم الكفاءة المهنية إلى سنّ الخمسين، وبجراية العون المعزول أو المستقيل إلى السنّ القانونية (القانون عدد 12 لسنة 1985، الفصل 41). وفي نظام الأجراء غير الفلاحيين، تفتح حالات الخروج المبكّر المنصوص عليها بالفصل 15 مكرّر الحقّ دون شرط سنّ، لكنّ الجراية لا تُصرف إلّا في سنّ الخمسين (الأمر عدد 1030 لسنة 1982)؛ ومنذ الأمر عدد 2148 لسنة 2007، لا تُصرف جراية الخروج لأسباب شخصية إلّا في سنّ الخامسة والخمسين.",
  "source": "القانون عدد 85-12 المؤرخ في 5 مارس 1985, art. 41",
  "terme": "الانتفاع المؤجَّل بالجراية"
 },
 "limite-calcul-prestations": {
  "autre": "Limite de calcul des prestations",
  "definition": "مبلغ لا تُعتمد الأجور في ما يتجاوزه لاحتساب الأجر المتوسط المرجعي والمنافع. في نظام الأجراء غير الفلاحيين، يساوي ستّة أضعاف الأجر الأدنى المضمون لمختلف المهن محتسبًا على أساس 2400 ساعة في السنة: ضبطه الأمر عدد 499 لسنة 1974 (الفصل 18)، وأعاده الأمر عدد 1455 لسنة 1990 دون تغيير، ثمّ أعاده الأمر عدد 1429 لسنة 1994 (الفصل الأوّل) مع التنصيص على أنّ المقصود هو الأجر الأدنى المضمون لمختلف المهن في نظام 48 ساعة في الأسبوع؛ ويضبطه النظام الفلاحي المحسَّن بستّة أضعاف الأجر الأدنى الفلاحي المضمون محتسبًا على أساس 300 يوم. وليس حدًّا أقصى للمساهمة: فالجزء من الأجر الذي يتجاوزه يمثّل قاعدة النظام التكميلي.",
  "source": "Décret n° 74-499 du 27 avril 1974, art. 18",
  "terme": "الحدّ الأقصى لاحتساب المنافع"
 },
 "mise-a-la-retraite-d-office": {
  "autre": "Mise à la retraite d'office",
  "definition": "إحالة على التقاعد تقرّرها الإدارة لا بطلب من العون. في القطاع العمومي، أضافها القانون عدد 71 لسنة 1988، ابتداءً من غرّة جانفي 1989، إلى حالات الإحالة على التقاعد قبل السنّ القانونية، بعد خمس عشرة سنة من الخدمات الفعلية؛ وباستثناء العسكريين وأعوان قوّات الأمن الداخلي، تُقرَّر بأمر بناءً على تقرير المؤجّر وملاحظات العون. وتفتح الحقّ في جراية فورية الانتفاع. وقد مكّن نفس القانون الأعوان المحالين وجوبًا على التقاعد من الترفيع في مدّة الخدمات المنصوص عليه بالفصل 33، والمساوي للفترة المتبقّية إلى السنّ القانونية، شريطة ألّا يتجاوز مردوده 20 % من أجر التصفية؛ وأبقى القانون عدد 37 لسنة 2019، الذي أعاد صياغة الفصل 33، على هذا السقف. وينتفع العسكريون المحالون وجوبًا على التقاعد أو البالغون السنّ القصوى لرتبتهم بترفيع يساوي الفترة المتبقّية إلى سنّ الستين (القانون عدد 12 لسنة 1985، الفصل 67)، وقد رفع القانون عدد 37 لسنة 2019 هذا الحدّ إلى سنّ الثانية والستين.",
  "source": "القانون عدد 85-12 المؤرخ في 5 مارس 1985, art. 5, 6, 33 et 67",
  "terme": "الإحالة الوجوبية على التقاعد"
 },
 "pension-anciennete": {
  "autre": "Pension d'ancienneté",
  "definition": "جراية من نظام جرايات التقاعد المدني والعسكري الذي أحدثه القانون عدد 18 لسنة 1959. يستحقّها الموظّف المدني بشرط مزدوج هو بلوغ ستّين عامًا من العمر وقضاء ثلاثين عامًا من الخدمات الفعلية، مدنيةً كانت أو عسكرية (الفصل 9، الفقرة 1)؛ ويمكن الحطّ من السنّ بخمسة أعوام على الأكثر بالنسبة إلى الخطط الداخلة ضمن قسم التجوّل، التي تُضبط بأمر (الفصل 10). ويحصل عليها العسكريون دون شرط يتعلّق بالسنّ، بعد ثلاثين عامًا من الخدمات بالنسبة إلى الضبّاط، وخمسة وعشرين عامًا بالنسبة إلى ضبّاط الصفّ، وعشرين عامًا بالنسبة إلى الأنباشية والجنود (الفصل 12). وتُضبط بـ2 % من المرتبات الأساسية عن كلّ سنة قابلة للتصفية (الفصل 22). وقد أعاد القانون عدد 73 لسنة 1973، ثمّ قانون المالية لسنة 1980، الشرط المزدوج المتعلّق بالسنّ والمدّة بنصّه.",
  "source": "Loi n° 59-18 du 5 février 1959, art. 9 § I",
  "terme": "جراية التقاعد بالأقدمية"
 },
 "pension-de-reversion": {
  "autre": "Pension de réversion",
  "definition": "جراية تُسند إلى القرين الباقي على قيد الحياة، تُحتسب بنسبة مئوية من الجراية التي كان ينتفع بها المضمون المتوفّى أو كان بإمكانه الانتفاع بها. وتبلغ 75 % في القطاع العمومي، وتُخفَّض خلال فترة صرف جرايات الأيتام دون أن تنزل عن 50 % (القانون عدد 12 لسنة 1985، الفصل 43)؛ و50 % في نظام الأجراء غير الفلاحيين (الأمر عدد 499 لسنة 1974، الفصل 31)، قابلة للترفيع إلى 75 % بشروط منذ الأمر عدد 188 لسنة 1981؛ و50 % في نظام الأجراء الفلاحيين (القانون عدد 6 لسنة 1981، الفصول 61-63).",
  "source": "القانون عدد 85-12 المؤرخ في 5 مارس 1985, art. 43",
  "terme": "جراية القرين الباقي على قيد الحياة"
 },
 "pension-minimale-garantie": {
  "autre": "Pension minimale garantie",
  "definition": "مبلغ يُعبَّر عنه بجزء من الأجر الأدنى، تُرفَع إليه الجراية إذا أفضى احتسابها إلى مبلغ أدنى منه. ويساوي ثلثي الأجر الأدنى المضمون لمختلف المهن في نظام 2400 ساعة في السنة في القطاع العمومي (القانون عدد 12 لسنة 1985، الفصل 39؛ وقد ورد بنفس المستوى في صيغة 1981 من القانون عدد 18 لسنة 1959)، وكذلك بالنسبة إلى جرايات الشيخوخة والعجز في نظام الأجراء غير الفلاحيين؛ ومنذ 1982، يُطبَّق في هذا النظام نصف الأجر الأدنى المضمون على جرايات التقاعد المبكّر المنصوص عليها بالمطّتين أ) وب) من الفصل 15 مكرّر وعلى الجرايات النسبية (الأمر عدد 1030 لسنة 1982، الفصل 5). ويضبطه النظام الفلاحي المحسَّن بنصف الأجر الأدنى الفلاحي المضمون محتسبًا على أساس 300 يوم.",
  "source": "القانون عدد 85-12 المؤرخ في 5 مارس 1985, art. 39",
  "terme": "الجراية الدنيا المضمونة"
 },
 "pension-proportionnelle": {
  "autre": "Pension proportionnelle",
  "definition": "جراية تُسند، في نظام الأجراء غير الفلاحيين، إلى المضمون الذي يبلغ السنّ المطلوبة دون استيفاء شرط مدّة الانخراط الدنيا، ويعدّ مع ذلك 60 شهرًا من المساهمات على الأقلّ. أحدثها الأمر عدد 1030 لسنة 1982 عوضًا عن منحة الشيخوخة المصروفة في شكل رأس مال، وتُحتسب على أساس الجراية التي كان المضمون سيستحقّها لو استوفى مدّة الانخراط الدنيا، بنسبة الأشهر التي دفع بعنوانها مساهمات. وحدّها الأدنى نصف الأجر الأدنى المضمون لمختلف المهن، وهي قابلة للتحويل إلى القرين الباقي على قيد الحياة.",
  "source": "Décret n° 82-1030 du 15 juillet 1982, art. 3",
  "terme": "الجراية النسبية"
 },
 "pension-proportionnelle-1959": {
  "autre": "Pension proportionnelle (loi n° 59-18)",
  "definition": "جراية يفتحها القانون عدد 18 لسنة 1959، في صيغته الأصلية، للعون العمومي، خارج جراية التقاعد بالأقدمية، في حالات يعدّدها (الفصل 9، الفقرة 2): دون اشتراط السنّ ولا مدّة الخدمة في حالة السقوط البدني؛ ودون اشتراط مدّة الخدمة للعون الذي يبلغ الحدّ العمري لوظيفه، أو ستّين عامًا من العمر، دون أن يكون له الحقّ في جراية التقاعد بالأقدمية؛ وبعد خمسة عشر عامًا من الخدمات في حالة الفصل من أجل حذف الوظائف أو من أجل القصور المهني، وللموظّفات الأمّهات لثلاثة أولاد أحياء لم يتجاوز سنّهم ستّة عشر عامًا؛ وفي سنّ الخمسين وبعد عشرين عامًا من الخدمات، بطلب من العون أو وجوبًا، في حدود عدد من الجرايات يضبطه قانون المالية كلّ سنة. وتُحتسب كجراية التقاعد بالأقدمية، بـ2 % من المرتبات الأساسية عن كلّ سنة قابلة للتصفية (الفصل 22). ثمّ جمع القانون عدد 73 لسنة 1973 هذه الحالات تحت شرط واحد هو خمسة عشر عامًا من الخدمات، ولم يعد قانون المالية لسنة 1980 يذكر العدد المحدّد سنويًا. ولا تختلط بالجراية النسبية في نظام الأجراء غير الفلاحيين، التي أحدثها الأمر عدد 1030 لسنة 1982.",
  "source": "Loi n° 59-18 du 5 février 1959, art. 9 § II",
  "terme": "جراية التقاعد النسبي"
 },
 "pension-temporaire-orphelin": {
  "autre": "Pension temporaire d'orphelin",
  "definition": "جراية تُسند إلى يتيم المضمون المتوفّى إلى حدّ سنّ معيّنة. في القطاع العمومي، تبلغ 10 % من جراية التقاعد عن كلّ يتيم إلى سنّ الحادية والعشرين، ودون شرط سنّ في حالة المرض العضال أو العجز الدائم؛ ويمدّدها القانون عدد 43 لسنة 2007 إلى سنّ الخامسة والعشرين بالنسبة إلى مزاولي التعليم العالي غير المنتفعين بمنحة، ويفتحها دون شرط سنّ للبنت التي لا موارد لها (القانون عدد 12 لسنة 1985، الفصول 45-47). وفي نظام الأجراء غير الفلاحيين، هي جراية جماعية حُدّدت بـ30 % منذ الأمر عدد 188 لسنة 1981؛ وفي نظام الأجراء الفلاحيين، تبلغ 20 %، و30 % لليتيم من الأب والأم (القانون عدد 6 لسنة 1981، الفصلان 64 و65).",
  "source": "القانون عدد 85-12 المؤرخ في 5 مارس 1985, art. 45",
  "terme": "الجراية الوقتية لليتيم"
 },
 "pensions-civiles-militaires": {
  "autre": "Pensions civiles et militaires",
  "definition": "نظام تقاعد مشترك بين الأعوان المدنيين والعسكريين في القطاع العام، يديره الصندوق الوطني للتقاعد والحيطة الاجتماعية: ولا يوجد صندوق عسكري منفصل. يضبط هذا النظامَ القانونُ عدد 85-12 المؤرّخ في 5 مارس 1985 المتعلّق بنظام جرايات التقاعد والباقين على قيد الحياة المدنية والعسكرية في القطاع العام، المنقَّح خاصّةً بالقانون عدد 2019-37. وضمن هذا النظام المشترك، يعرف الشقّ العسكري معاييرَ استثنائية (مدد خدمة وأعمار انتفاع متمايزة حسب الرتبة).",
  "source": "القانون عدد 85-12 المؤرخ في 5 مارس 1985",
  "terme": "الجرايات المدنية والعسكرية"
 },
 "perequation": {
  "autre": "Péréquation des pensions",
  "definition": "آلية لتعديل جرايات القطاع العمومي، تُراجَع بمقتضاها الجراية عند كلّ زيادة في أحد العناصر القارة للمرتب المطابق للرتبة أو الخطّة التي صُفّيت الجراية على أساسها، وكذلك عند إحداث منحة قارّة مرتبطة بتلك الرتبة أو الخطّة (القانون عدد 12 لسنة 1985، الفصل 37). ومنذ غرّة جانفي 2002، يخضع التنظير للمساهمة: جعل قانون المالية لسنة 2002 (الفصل 86) مساهمة المنتفع بالجراية مستوجبة طيلة فترة صرف الجراية وتوابعها، ومساهمة المؤجّر مستوجبة على مدى 36 شهرًا؛ ثمّ أعاد القانون عدد 43 لسنة 2007 صياغة هذه القاعدة، فحمّل المتقاعد كامل المساهمات، باستثناء منابات المؤجّر خلال 36 شهرًا. ويتميّز التنظير عن مراجعة الجراية، وهي إعادة تصفية لها (الفصل 54)، وعن تعديل الجرايات بالرجوع إلى الأجر الأدنى في القطاع الخاص.",
  "source": "القانون عدد 85-12 المؤرخ في 5 مارس 1985, art. 37",
  "terme": "تنظير الجرايات"
 },
 "regime-artistes": {
  "autre": "Régime des artistes, créateurs et intellectuels",
  "definition": "نظام الضمان الاجتماعي للفنانين والمبدعين والمثقفين، أحدثه القانون عدد 104 لسنة 2002 المؤرّخ في 30 ديسمبر 2002، النافذ منذ 5 جانفي 2003، ويديره الصندوق الوطني للضمان الاجتماعي؛ ويشمل خاصّةً جرايات الشيخوخة والعجز والباقين على قيد الحياة (الفصل 1). ويضبط الأمر عدد 894 لسنة 2003 المؤرّخ في 21 أفريل 2003، النافذ منذ 5 ماي 2003، صيغ تطبيقه.",
  "source": "Loi n° 2002-104 du 30 décembre 2002, art. 1",
  "terme": "نظام الضمان الاجتماعي للفنانين والمبدعين والمثقفين"
 },
 "regime-bas-revenus": {
  "autre": "Régime des travailleurs à faibles revenus",
  "definition": "نظام الضمان الاجتماعي الذي أحدثه القانون عدد 32 لسنة 2002 المؤرّخ في 12 مارس 2002، النافذ منذ 21 مارس 2002، لبعض أصناف العملة في القطاعين الفلاحي وغير الفلاحي: عملة المنازل؛ والأشخاص الذين تشغّلهم الدولة والجماعات المحلية والمؤسسات العمومية الإدارية غير المشمولين بأيّ نظام آخر؛ وصغار البحّارة وصغار المجهّزين؛ والفلاحون الذين يستغلّون خمس هكتارات على الأكثر في البعل أو هكتارًا واحدًا في السقوي؛ والحرفيون العاملون بالقطعة (الفصل 1). ولا يمنحه القانون تسمية مختصرة. وتُفتح فيه جراية الشيخوخة في سنّ الخامسة والستين بعد 120 شهرًا من المساهمات؛ ويساوي مبلغها الأدنى 30 % من الأجر الأدنى المضمون لقطاع انتماء المضمون، ويُضاف إليه، عن كلّ ثلاثية إضافية، 0,5 % من الأجر المعتمد لاحتساب الاشتراكات — أي ثلثي هذا الأجر الأدنى —، في حدود 80 % من هذا الأجر (الفصول 7 و13 و14). ويضبط الأمر عدد 916 لسنة 2002 المؤرّخ في 22 أفريل 2002، النافذ منذ 7 ماي 2002، أساليب تطبيقه؛ ووسّعه الأمر الحكومي عدد 379 لسنة 2019 المؤرّخ في 22 أفريل 2019، النافذ منذ 4 ماي 2019، إلى النساء الجامعات للمحار والعملة الموسميين والمتنقّلين المنتمين إلى الوسط الريفي والعاملين في القطاع الفلاحي، بمن في ذلك المرأة المستخدمة في هذا القطاع.",
  "source": "Loi n° 2002-32 du 12 mars 2002, art. 1, 7, 13 et 14",
  "terme": "نظام العملة ذوي الدخل المحدود"
 },
 "regime-complementaire": {
  "autre": "Régime complémentaire",
  "definition": "نظام اختياري لجرايات الشيخوخة والعجز والباقين على قيد الحياة في القطاع الخاصّ، ينظّمه ترتيب صدر بقرار من وزير الشؤون الاجتماعية مؤرّخ في 18 نوفمبر 1978، ينطبق بداية من غرّة جانفي 1974 (الفصل 2). وينخرط فيه المؤجّرون بعقد لدى صندوق تأمين الشيخوخة والعجز والباقين بقيد الحياة بعد وفاة المنتفع بجراية (الترتيب، الفصلان 3 و4)، الذي أُحيلت أنظمته إلى الصندوق الوطني للضمان الاجتماعي سنة 1994. ويقوم على جزء الأجر الذي يتجاوز سقف احتساب المنافع في النظام القانوني، أي على الأجر التفاضلي (الترتيب، الفصلان 1 و6). وهو نظام بالنقاط: تكتسب كلّ فترة اشتراك نقاطًا تساوي المساهمة التعاقدية مقسومةً على الأجر المرجعي للفترة، والجراية هي عدد النقاط مضروبًا في قيمة النقطة (الترتيب، الفصلان 10 و17). وفتح القرار المؤرّخ في 27 جانفي 1997، النافذ منذ 16 فيفري 1997، جراية الباقين على قيد الحياة للقرين الباقي على قيد الحياة، ولم يعد يعلّق الجراية إلّا في حالة الزواج من جديد قبل سنّ 55 سنة.",
  "source": "Arrêté du ministre des affaires sociales du 18 novembre 1978, art. 2 et règlement, art. 1, 3-4, 6, 10 et 17",
  "terme": "النظام التكميلي"
 },
 "regime-conventionnel-retraite": {
  "autre": "Régime conventionnel de retraite",
  "definition": "في القطاع الخاصّ، نظام لجرايات الشيخوخة أو العجز أو البقاء بعد الوفاة يُحدث بالتعاقد خارج النظام القانوني، ولا سيّما في شكل عقد جماعي يبرمه المؤجّرون. ويجيز القانون عدد 30 لسنة 1960 للصندوق القومي للضمان الاجتماعي التصرّف فيه وفق اتّفاقيات خاصّة (الفصل 5)، ويُلزم الهيئات التي تغطّي خطر الشيخوخة بالتصريح بأنظمتها (الفصل 119)؛ ويُحيل القانون عدد 33 لسنة 1960 إلى أمر ضبطَ شروط بقاء هذه الأنظمة خارج النظام العامّ أو إدماجها فيه (الفصل 5). وبصفة مؤقّتة، أبقى الأمر عدد 499 لسنة 1974 على الأنظمة التعاقدية المعمول بها حسب عقد جماعي التي تساوي منافعها على الأقلّ منافع النظام القانوني، ومنح المؤجّرين والأجراء حقّ اختيار لمدّة ثلاثة أشهر للبقاء فيها مع الإعفاء من المساهمة القانونية (الفصول 59-62). وحقّق الأمر عدد 981 لسنة 1976 الإدماج: تُحال الأنظمة التي تمثّل ازدواجًا مع النظام القانوني إلى صندوق تأمين الشيخوخة والعجز والباقين بقيد الحياة، ويصبح ما زاد عليه نظامًا تكميليًا، مع المحافظة على الحقوق المكتسبة (الفصلان 1 و25)؛ ثمّ أحالها الأمر عدد 1477 لسنة 1994 إلى الصندوق القومي للضمان الاجتماعي (الفصل 2). ولا يُخلط بالنظام الاتفاقي العمومي لتأجير المنشآت العمومية.",
  "source": "Décret n° 74-499 du 27 avril 1974, art. 59-62",
  "terme": "النظام التعاقدي"
 },
 "regime-travailleuses-agricoles": {
  "autre": "Régime de sécurité sociale des travailleuses agricoles",
  "definition": "نظام خاصّ للضمان الاجتماعي للعاملات الفلاحيات، أحدثه المرسوم عدد 4 لسنة 2024 المؤرّخ في 22 أكتوبر 2024 المتعلّق بنظام الحماية الاجتماعية للعاملات الفلاحيات، النافذ منذ 28 أكتوبر 2024، ويديره الصندوق الوطني للضمان الاجتماعي؛ ويشمل منافع التأمين على المرض وجرايات الشيخوخة والعجز والباقين على قيد الحياة (الفصول 1 و17 و18). ويغطّي العاملة الفلاحية غير الأجيرة التي تعمل بصفة أساسية ولحسابها الخاصّ، والأجيرة التي تعمل 15 يومًا على الأقلّ في الشهر، بمعدّل 45 يومًا على الأقلّ في الثلاثية أو 180 يومًا في السنة، ما لم يكن مؤجّرها منخرطًا في نظام قانوني يغطّي نفس المخاطر لفائدة جميع أجرائه (الفصل 17). وتتكفّل الدولة باشتراكاتها خلال السنوات الثلاث الأولى من النشاط (الفصلان 20 و23). وتُفتح جراية الشيخوخة في سنّ 65 سنة، أو ابتداءً من 60 سنة، بعد 120 شهرًا من الاشتراكات الفعلية والمصادق عليها (الفصلان 26 و27)؛ ويُحيل المرسوم ضبط نسبها وصيغها إلى أمر (الفصل 33).",
  "source": "Décret-loi n° 2024-4 du 22 octobre 2024, art. 1, 17-18, 20, 23, 26-27 et 33",
  "terme": "نظام الضمان الاجتماعي للعاملات الفلاحيات"
 },
 "rente-compensatrice": {
  "autre": "Rente compensatrice",
  "definition": "إيراد يصرفه الصندوق الوطني للتقاعد والحيطة الاجتماعية، على كاهل المؤجّر، للأعوان العموميين ضحايا حوادث الشغل أو الأمراض المهنية، بعنوان القانون عدد 56 لسنة 1995 المؤرّخ في 28 جوان 1995، الذي يستثني العسكريين وأعوان قوات الأمن الداخلي (الفصل 2). وحسب دليل تصفية الجرايات للصندوق (2013)، يُصرف منذ جانفي 1996 وفق صيغة وحدود مماثلة لصيغة الإيراد العمري للعجز وحدوده.",
  "source": "Manuel de liquidation des pensions & accessoires, p. 88-89",
  "terme": "الإيراد التعويضي"
 },
 "rente-viagere-invalidite": {
  "autre": "Rente viagère d'invalidité",
  "definition": "إيراد يُضاف إلى جراية العون العمومي المحال على التقاعد بسبب العجز. ولا يزال عجز الأعوان العموميين خاضعًا للقانون عدد 18 لسنة 1959، الذي أبقى الفصل 76 من القانون عدد 12 لسنة 1985 على العمل به في هذا الشأن؛ وحسب صيغة الفقرة II من الفصل 26 المنبثقة عن القانون عدد 70 لسنة 1981، يساوي مبلغ الإيراد حاصل ضرب الأجر الخاضع للحجز بعنوان الجراية في نسبة العجز. وتحدّ الفقرة III من الفصل 26 من القانون عدد 18 لسنة 1959 مجموع الإيراد والجراية القابلة للجمع معه: بالمرتبات الأساسية المنصوص عليها بالفصل 21 في صيغة 1959، وبالمرتبات الجملية التابعة للرقم القياسي المعين المبيّنة بالفصل 21 في الصيغة المنبثقة عن المرسوم عدد 1 لسنة 1970. أمّا دليل تصفية الجرايات للصندوق الوطني للتقاعد والحيطة الاجتماعية (2013)، فيحتسب الإيراد على أساس جراية التقاعد ويحدّد مجموع الجراية والإيراد بـ100 % من الأجر المعتمد.",
  "source": "Loi n° 81-70 du 1er août 1981, art. 4 (art. 26 § II de la loi n° 59-18)",
  "terme": "الإيراد العمري للعجز"
 },
 "retraite-anticipee-volontaire": {
  "autre": "Retraite anticipée volontaire",
  "definition": "نظام للخروج المبكّر للأعوان العموميين أُحدث، خارج القانون عدد 12 لسنة 1985، بمقتضى القانون عدد 7 لسنة 1987 المؤرّخ في 6 مارس 1987. وهو متميّز عن الحقّ العامّ في الخروج المبكّر المنصوص عليه بالفصل 30 من القانون عدد 12 لسنة 1985، وعن الإحالة على التقاعد قبل السنّ القانونية التي أحدثها القانون عدد 39 لسنة 2009 المؤرّخ في 8 جويلية 2009، وقد أبقى الفصل 7 من القانون عدد 37 لسنة 2019 كليهما خاضعَين، في ما يتعلّق بالسنّ القانونية، للنصوص السابقة.",
  "source": "Loi n° 87-7 du 6 mars 1987",
  "terme": "التقاعد المبكّر الاختياري"
 },
 "revalorisation-pensions": {
  "autre": "Revalorisation des pensions",
  "definition": "تعديل مبلغ الجرايات المصفّاة في القطاع الخاص بالرجوع إلى الأجر الأدنى. في نظام الأجراء غير الفلاحيين، تحوّلت المراجعة التقديرية لسنة 1974 (الأمر عدد 499 لسنة 1974، الفصل 53) إلى تعديل آلي عند كلّ زيادة في الأجر الأدنى المضمون لمختلف المهن، ابتداءً من غرّة ماي 1980، في شكل مبلغ يساوي الزيادة في الأجر الأدنى بالساعة محتسبة على أساس 200 ساعة في الشهر ومضروبة في نسبة الجراية (الأمر عدد 187 لسنة 1981)، وهي قاعدة طُبّقت إلى غاية 31 ديسمبر 2000؛ ومنذ غرّة جانفي 2001، أصبحت الزيادة نسبةً: تُرفَع الجراية بنسبة تطوّر الأجر الأدنى المضمون لمختلف المهن بالساعة محتسبًا على أساس 48 ساعة في الأسبوع، أي الأجر الأدنى في نظام 48 ساعة في الأسبوع (الأمر عدد 779 لسنة 2001). وتربطه الأنظمة الفلاحية بالأجر الأدنى الفلاحي المضمون (القانون عدد 6 لسنة 1981، الفصل 80). ويقابله في القطاع العمومي تنظير الجرايات.",
  "source": "Décret n° 81-187 du 14 février 1981, art. 1 (art. 53 nouveau)",
  "terme": "تعديل الجرايات"
 },
 "revenu-forfaitaire": {
  "autre": "Revenu forfaitaire",
  "definition": "دخل اصطلاحي، لا دخل فعلي، تقوم عليه الاشتراكات، ومن ثَمّ الجراية، بالنسبة إلى المضمونين الذين لا يُصرَّح بدخلهم الحقيقي. ففي نظام العملة غير الأجراء، هو دخل شريحة الدخل التي يختارها المضمون: تُحتسب جراية سنة 1982 على أساس المعدّل المرجّح للمداخيل التقديرية طيلة الحياة المهنية (الأمر عدد 1359 لسنة 1982، الفصل 19)، ومنذ سنة 1995 تُضبط الشرائح بمضاعفات الأجر الأدنى المضمون لمختلف المهن أو الأجر الأدنى الفلاحي المضمون (الأمر عدد 1166 لسنة 1995، الفصل 7). ويساهم العملة التونسيون بالخارج كذلك على أساس الدخل التقديري لشريحتهم (الأمر عدد 107 لسنة 1989، الفصل 7). وبالنسبة إلى الصيادين البحريين العاملين بالمناب على متن مراكب تقلّ حمولتها عن 30 طنًّا، والصيادين المستقلّين وصغار المجهّزين، كانت قاعدة الاشتراك تساوي الأجر الأدنى المضمون لمختلف المهن الشهري مضروبًا في معامل من 1 إلى 3 حسب الوظيفة على متن المركب (الأمر عدد 546 لسنة 1977، الفصل 3)، من سنة 1977 إلى إحالتهم، بداية من غرّة أكتوبر 1989، إلى النظام المنصوص عليه بالعنوان الثالث من القانون عدد 6 لسنة 1981 (القانون عدد 73 لسنة 1989).",
  "source": "Décret n° 95-1166 du 3 juillet 1995, art. 7",
  "terme": "الدخل التقديري"
 },
 "rsa": {
  "acronyme": "RSA",
  "autre": "Régime des salariés agricoles",
  "definition": "نظام الضمان الاجتماعي للأجراء الفلاحيين، ينظّمه العنوانان الأوّل والثاني من القانون عدد 6 لسنة 1981 المؤرّخ في 12 فيفري 1981، النافذ منذ غرّة جانفي 1981، ويديره الصندوق الوطني للضمان الاجتماعي. وتقوم جرايته على أجر مرجعي جزافي مضاعف للأجر الأدنى الفلاحي المضمون، وتُراجَع عند كلّ صرف بنسبة تطوّر هذا الأجر. وفي سنة 1981، تُسند جراية الباقين على قيد الحياة إلى الأرملة وإلى الأرمل العاجز (الفصل 60)؛ ثمّ فتحها القانون عدد 66 لسنة 1996، النافذ منذ 4 أوت 1996، للقرين الباقي على قيد الحياة، وأعاد القانون عدد 61 لسنة 1997 صياغة حقوق الأيتام بداية من غرّة ماي 1997؛ وراجع القانون عدد 43 لسنة 2007، النافذ منذ 2 جويلية 2007، حقوق البنت.",
  "source": "Loi n° 81-6 du 12 février 1981, titres I et II",
  "terme": "نظام الأجراء الفلاحيين"
 },
 "rsaa": {
  "acronyme": "RSAA",
  "autre": "Régime agricole amélioré",
  "definition": "نظام أُضيف إلى القانون عدد 6 لسنة 1981 في شكل عنوان ثالث بمقتضى القانون عدد 73 لسنة 1989 المؤرّخ في 2 سبتمبر 1989، النافذ منذ غرّة أكتوبر 1989. ويشمل الأجراء المتعاضدين في الشركات والتعاضديات الفلاحية، وأجراء المستغلّين الذين يشغّلون ثلاثين أجيرًا قارًّا على الأقلّ، وبعض الصيادين البحريين وصغار المجهّزين. ويحيل إلى قواعد نظام الأجراء الفلاحيين في ما لم يُخالفها، لكنّه يعتمد الأجور الفعلية في حدود ستّة أضعاف الأجر الأدنى الفلاحي المضمون، ويضبط جراية دنيا تساوي نصف هذا الأجر محتسبًا على أساس 300 يوم.",
  "source": "Loi n° 89-73 du 2 septembre 1989",
  "terme": "النظام الفلاحي المحسَّن"
 },
 "rsna": {
  "acronyme": "RSNA",
  "autre": "Régime des salariés non agricoles",
  "definition": "نظام الضمان الاجتماعي لأجراء القطاع غير الفلاحي، أحدثه القانون عدد 30 لسنة 1960 المؤرّخ في 14 ديسمبر 1960 ويديره الصندوق الوطني للضمان الاجتماعي. ويخضع فرعه الخاصّ بجرايات الشيخوخة والعجز والباقين على قيد الحياة للأمر عدد 499 لسنة 1974 المؤرّخ في 27 أفريل 1974، النافذ منذ غرّة جانفي 1974، والذي تحيل إليه أنظمة العملة غير الأجراء والعملة التونسيين بالخارج.",
  "source": "Loi n° 60-30 du 14 décembre 1960",
  "terme": "نظام الأجراء غير الفلاحيين"
 },
 "rtns": {
  "acronyme": "RTNS",
  "autre": "Régime des travailleurs non salariés",
  "definition": "نظام الضمان الاجتماعي للعملة غير الأجراء في القطاعين الفلاحي وغير الفلاحي، ويديره الصندوق الوطني للضمان الاجتماعي. ويتمتّع غير الأجراء بالتغطية منذ غرّة جويلية 1982 بمقتضى أمرين مؤرّخين في 21 أكتوبر 1982: الأمر عدد 1359 لسنة 1982 المتعلّق بسحب نظام الضمان الاجتماعي على العمّال المستقلّين في القطاع غير الفلاحي، والأمر عدد 1360 لسنة 1982 المتعلّق بنظام الضمان الاجتماعي للمنتجين والعملة المستقلّين في الفلاحة. ثمّ دمجهما الأمر عدد 1166 لسنة 1995 المؤرّخ في 3 جويلية 1995، النافذ منذ 19 جويلية 1995، في نظام واحد وألغاهما، مع المحافظة على انخراط المنخرطين فيهما وتحويل مدّخراتهما (الفصول 34-39). ويقوم النظام على التمديد: إذ يجعل الفصل الأوّل من هذا الأمر فصولًا من القانون عدد 30 لسنة 1960 وفصول الأمر عدد 499 لسنة 1974 المتعلّقة بالعجز والباقين على قيد الحياة وتصفية الجرايات منطبقةً على غير الأجراء. وتقوم الاشتراكات والجرايات على دخل تقديري يُضبط حسب شرائح الدخل، في القطاع غير الفلاحي منذ سنة 1982 وفي القطاعين منذ سنة 1995.",
  "source": "Décret n° 95-1166 du 3 juillet 1995, art. 1 et 34-39",
  "terme": "نظام العملة غير الأجراء"
 },
 "rtte": {
  "acronyme": "RTTE",
  "autre": "Régime des travailleurs tunisiens à l'étranger",
  "definition": "نظام الضمان الاجتماعي للعملة التونسيين بالخارج، أجراء كانوا أو غير أجراء، غير المشمولين باتّفاقية ثنائية، أحدثه الأمر عدد 107 لسنة 1989 المؤرّخ في 10 جانفي 1989، النافذ منذ 19 جانفي 1989. والانخراط فيه اختياري، لكنّه يشمل وجوبًا الجرايات والتأمينات الاجتماعية معًا. ويمدّد إلى هؤلاء العملة فصول الأمر عدد 499 لسنة 1974 المتعلّقة بالعجز والباقين على قيد الحياة وتصفية الجرايات، وتُفوَّض إدارة الجرايات فيه إلى صندوق التأمين على الشيخوخة والعجز والباقين على قيد الحياة. ويضبط بنفسه قواعد جراية الشيخوخة، المأخوذة عن الأمر عدد 1359 لسنة 1982 الخاصّ بالعملة غير الأجراء في القطاع غير الفلاحي، على أساس شرائح دخل محدّدة بمضاعفات الأجر الأدنى المضمون لمختلف المهن.",
  "source": "Décret n° 89-107 du 10 janvier 1989, art. 1-3, 6 et 18-23",
  "terme": "نظام الضمان الاجتماعي للعملة التونسيين بالخارج"
 },
 "salaire-differentiel": {
  "autre": "Salaire différentiel",
  "definition": "الجزء من الأجر الذي يتجاوز السقف الذي يضبطه النظام القانوني لاحتساب المنافع، ويمثّل قاعدة النظام التكميلي لجرايات الشيخوخة والعجز والباقين على قيد الحياة الذي ينظّمه قرار وزير الشؤون الاجتماعية المؤرّخ في 18 نوفمبر 1978 (الترتيب، الفصلان 1 و6). ويبدأ حيث ينتهي سقف ستّة أضعاف الأجر الأدنى المضمون لمختلف المهن، ويتحرّك بتحرّكه.",
  "source": "Arrêté du ministre des affaires sociales du 18 novembre 1978, règlement, art. 1 et 6",
  "terme": "الأجر التفاضلي"
 },
 "salaire-moyen-reference": {
  "autre": "Salaire moyen de référence",
  "definition": "قاعدة احتساب الجراية في أنظمة القطاع الخاص، وتُحتسب معدّلًا للأجور على فترة سابقة لفتح الحقّ. في نظام الأجراء غير الفلاحيين، يُضبط، ابتداءً من غرّة جانفي 1974، على أساس السنوات الثلاث أو الخمس الأخيرة، مع اعتماد الفترة الأفضل، ويُحتسب المعدّل على 36 أو 60 شهرًا (الأمر عدد 499 لسنة 1974، الفصلان 18 و19). ورفع الأمر عدد 1455 لسنة 1990 الفترة إلى السنوات العشر الأخيرة ابتداءً من 23 سبتمبر 1990، دون تنقيح الفصل 19 الذي أبقى المعدّل على 36 أو 60 شهرًا؛ ونصّ على تحيين الأجور وفق جدول يُضبط بقرار. ثمّ ألغى الأمر عدد 1429 لسنة 1994 هذين الفصلين وعوّضهما: تكون الفترة السنوات الخمس ثمّ السبع ثمّ العشر الأخيرة، ويُحتسب المعدّل على 60 ثمّ 84 ثمّ 120 شهرًا، ابتداءً على التوالي من غرّة جويلية 1994 و1995 و1996؛ ويُضبط جدول التحيين سنويًا بقرار، وأوّل قرار عُثر عليه مؤرّخ في 17 نوفمبر 1994. ويحدّه سقف احتساب المنافع. وفي نظام الأجراء الفلاحيين، هو أجر جزافي: الأجر الأدنى الفلاحي المضمون محتسبًا على أساس 300 يوم ومضروبًا في الضارب المتوسط الذي اعتُمد أساسًا لحساب الاشتراكات خلال السنوات الثلاث أو الخمس الأخيرة التي سبقت سنّ استحقاق الجراية (القانون عدد 6 لسنة 1981، الفصل 50).",
  "source": "Décret n° 74-499 du 27 avril 1974, art. 18-19",
  "terme": "الأجر المتوسط المرجعي"
 },
 "securite-sociale-pecheurs": {
  "autre": "Sécurité sociale des pêcheurs",
  "definition": "تمديد أنظمة الضمان الاجتماعي المترتّبة عن القانونين عدد 30 وعدد 33 لسنة 1960 وعن الأمر عدد 499 لسنة 1974 إلى الصيادين البحريين، بمقتضى الأمر عدد 546 لسنة 1977 المؤرّخ في 15 جوان 1977، النافذ منذ 23 جوان 1977؛ ويشمل الصيادين، وأرباب الصيد ولو كانوا مالكين لمراكبهم، والمجهّزين الذين يعملون على متن مركب صيد يتولّون تجهيزه، وصغار المجهّزين (الفصل 1). وليس نظامًا مستقلًّا للجرايات: فجراية الصيادين البحريين هي جراية نظام الأجراء غير الفلاحيين. وتكمن خصوصيته في قاعدة الاشتراك: فبالنسبة إلى الصيادين العاملين بالمناب على متن مراكب تقلّ حمولتها عن 30 طنًّا، والصيادين المستقلّين وصغار المجهّزين، تقوم الاشتراكات على دخل تقديري يساوي الأجر الأدنى المضمون لمختلف المهن الشهري مضروبًا في معامل من 1 إلى 3 حسب الوظيفة على متن المركب (الفصل 3)؛ وعلى متن المراكب التي تبلغ حمولتها 30 طنًّا فأكثر، تقوم على الأجر الفعلي (الفصل 4). وأحال القانون عدد 73 لسنة 1989 الفئة الأولى، بداية من غرّة أكتوبر 1989، إلى النظام المنصوص عليه بالعنوان الثالث من القانون عدد 6 لسنة 1981؛ ومنذ القانون عدد 32 لسنة 2002، يخضع الصيادون العاملون على مراكب لا تتجاوز حمولتها خمسة أطنان لنظام العملة ذوي الدخل المحدود.",
  "source": "Décret n° 77-546 du 15 juin 1977, art. 1, 3 et 4",
  "terme": "الضمان الاجتماعي للصيادين البحريين"
 },
 "smag": {
  "acronyme": "SMAG",
  "autre": "Salaire minimum agricole garanti",
  "definition": "الحدّ الأدنى القانوني للأجر المطبَّق على أجراء القطاع الفلاحي، ويُعبَّر عنه باليوم. ويُعتمد مرجعًا لأنظمة الضمان الاجتماعي في القطاع الفلاحي: فالأجر المرجعي لنظام الأجراء الفلاحيين مضاعف له (القانون عدد 6 لسنة 1981، الفصلان 18 و50)، وتُضبط الجراية الدنيا وسقف الاحتساب وتعديل الجرايات في النظام الفلاحي المحسَّن بالرجوع إليه.",

 "smig": {
  "acronyme": "SMIG",
  "autre": "Salaire minimum interprofessionnel garanti",
  "definition": "الحدّ الأدنى القانوني للأجر بالساعة أو بالشهر المطبَّق على أجراء القطاعات غير الفلاحية الخاضعة لمجلة الشغل. تضبطه الدولة بأمر منذ غرّة جانفي 1974. ويُضبط بالساعة وبالشهر، في نظامين لمدة العمل: نظام عمل 48 ساعة ونظام عمل 40 ساعة في الأسبوع.",

 "solde-de-reforme": {
  "autre": "Solde de réforme",
  "definition": "منفعة خاصّة بالشقّ العسكري من نظام الجرايات المدنية والعسكرية، تنظّمها الفصول 69 إلى 71 من القانون عدد 12 لسنة 1985، ولا يمكن أن يقلّ مبلغها في أيّ حال عن الجراية الدنيا المضمونة (الفصل 70). وحسب دليل تصفية الجرايات للصندوق الوطني للتقاعد والحيطة الاجتماعية (2013)، يُستثنى صاحب منحة إصلاح وحيدة من المنح ذات الصبغة العائلية ومن منحة الدخل الوحيد.",

 "stage-cotisation": {
  "autre": "Stage de cotisation",
  "definition": "المدّة الدنيا من الانخراط ودفع المساهمات المطلوبة قبل إمكان إسناد المنفعة. وهي الحلقة التي تميّز المنفعة المساهماتية عن منفعة المساعدة: إذ يُكتسب الحقّ بماضٍ من المساهمات لا بمستوى الموارد.",

 "taux-de-liquidation": {
  "autre": "Taux de liquidation",
  "definition": "نسبة مئوية تُطبَّق على أجر التصفية أو على الأجر المتوسط المرجعي لضبط مبلغ الجراية، تُكتسب حسب مدّة الخدمات أو المساهمة وتحدّها نسبة قصوى. في القطاع العمومي، تُكتسب بحسب السنوات القابلة للتصفية إلى حدود 90 % (القانون عدد 12 لسنة 1985، الفصل 38)؛ وفي نظام الأجراء غير الفلاحيين، تبلغ 40 % مقابل 120 شهرًا من المساهمات، وتُضاف إليها 2 % عن كلّ سنة إضافية إلى حدود 80 % (الأمر عدد 499 لسنة 1974، الفصل 17)؛ ويطبّق نظام الأجراء الفلاحيين نفس الجدول محتسبًا بالثلاثيات (القانون عدد 6 لسنة 1981، الفصل 49).",
  "source": "القانون عدد 85-12 المؤرخ في 5 مارس 1985, art. 38",
  "terme": "نسبة تصفية الجراية"
 },
 "travaux-penibles-insalubres": {
  "autre": "Travaux pénibles et insalubres",
  "definition": "مهامّ تفتح مباشرتها سنًّا مخفَّضة للإحالة على التقاعد. في القطاع العمومي، يُحال العملة القائمون بها، الذين يضبطهم الأمر عدد 1177 لسنة 1985 المؤرّخ في 24 سبتمبر 1985 في سبعة عشر صنفًا، على التقاعد في سنّ الخامسة والخمسين، ثمّ في سنّ السابعة والخمسين منذ القانون عدد 37 لسنة 2019 (القانون عدد 12 لسنة 1985، الفصل 27)، وينتفعون بترفيع في مدّة الخدمات من سنتين إلى خمس سنوات حسب مدّة الخدمات (الفصل 32). وفي نظام الأجراء غير الفلاحيين، تفتح الأشغال الشاقّة أو غير الصحّية التي تُضبط أصنافها بقرار الحقَّ في التقاعد في سنّ الخامسة والخمسين، مقابل الترفيع في مدّة الانخراط الدنيا (الأمر عدد 499 لسنة 1974، الفصلان 15 و16).",
  "source": "القانون عدد 85-12 المؤرخ في 5 مارس 1985, art. 27",
  "terme": "الأشغال الشاقّة وغير الصحّية"
 },
 "validation-des-services": {
  "autre": "Validation des services",
  "definition": "احتساب فترات لم تُدفع بعنوانها مساهمات، لفتح الحقّ في الجراية ولاحتسابها، مقابل دفع المساهمات المطابقة. في القطاع العمومي، يطلبه العون كتابيًّا في أجل أقصاه سنة من بلوغ السنّ القانونية؛ وتُحتسب المساهمات، المحمولة عليه، على أساس معدّل أجره في تاريخ الانخراط وأجره في تاريخ الطلب، وتُدفع بأقساط لا تتجاوز 20 % من أجره (القانون عدد 12 لسنة 1985، الفصول 14-21). ويُحدث القانون عدد 105 لسنة 1995 المؤرّخ في 14 ديسمبر 1995 نظامًا موحّدًا لإدماج الخدمات مشتركًا بين الأنظمة القانونية. ويقبل النظام الفلاحي المحسَّن إدماج فترات العمل الفلاحي المقضّاة منذ غرّة جانفي 1981، مقابل دفع المساهمات المتخلّدة.",
  "source": "القانون عدد 85-12 المؤرخ في 5 مارس 1985, art. 14-21",
  "terme": "إدماج الخدمات"
 }
