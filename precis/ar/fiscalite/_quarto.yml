project:
  type: book
  output-dir: public

lang: ar
dir: rtl

# Surcharge des libellés d'interface Quarto en arabe (lang: ar ne les traduit
# pas tous). Customisation propre au livre AR.
language:
  section-title-appendices: "ملاحق"

book:
  title: "الجباية"
  author: "Mahdi Ben Jelloul"
  repo-url: https://github.com/benjello/precis-socio-fiscal-tunisie/
  repo-subdir: precis/ar/fiscalite
  repo-branch: master
  repo-actions: [edit, issue]
  downloads: [pdf]
  chapters:
    - index.qmd
    - _impot_revenu.qmd
    - _impot_societes.qmd
    - _impot_fortune.qmd
    - _contributions_conjoncturelles.qmd
    - _patrimoine_immobilier.qmd
    - _timbre_enregistrement.qmd
    - _tva.qmd
    - _droits_consommation.qmd
    - _droits_douane.qmd
    - _taxes_fonds_speciaux.qmd
    - _regimes_incitation.qmd
    - _depenses_fiscales.qmd
  appendices:
    - _tva_tableaux.qmd
    - _glossaire.qmd

bibliography:
  - references.json
  - ../references.json
  - ../references.bib

format:
  html:
    theme: [cosmo, ../../legendes.scss]
    # Les données des infobulles du glossaire (engendrées par scripts/build_glossary.py)
    # précèdent le script qui les lit.
    include-after-body:
      - _glossaire.infobulles.html
      - ../../legendes.html
    fig-cap-location: top
    tbl-cap-location: top
    number-depth: 4
    toc: true
    toc-depth: 4
  pdf:
    documentclass: scrreprt
    toc: true
    toc-depth: 4
    number-sections: true
    number-depth: 4

# Libellés des légendes et des renvois : Quarto écrivait « Table 2.3: » en anglais, y
# compris dans les livres arabes. Mise en forme : ../../legendes.scss et legendes.html.
crossref:
  tbl-title: "جدول"
  fig-title: "شكل"
  tbl-prefix: "الجدول"
  fig-prefix: "الشكل"
  title-delim: "\u00a0—"
