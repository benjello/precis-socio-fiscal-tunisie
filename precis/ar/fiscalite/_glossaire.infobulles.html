  "definition": "ضريبة تصاعدية على الدخل الجملي للأشخاص الطبيعيين، كانت تعلو الضرائب المستقلّة المفروضة على كلّ صنف من أصناف الدخل. وكانت تستند إلى الأمر المؤرّخ في 31 مارس 1932؛ وقد ضبط الفصل 8 من قانون المالية لسنة 1986 آخر جدول لها، وفصّله الأمر عدد 1188 لسنة 1986 المؤرّخ في 12 نوفمبر 1986 في جدول لمبالغ الضريبة. وألغاها الفصل 2 من القانون عدد 114 لسنة 1989 المؤرّخ في 30 ديسمبر 1989، مع الضرائب المفروضة على أصناف الدخل، بالنسبة إلى المداخيل المحقّقة ابتداءً من غرّة جانفي 1990، التي أصبحت تخضع للضريبة على دخل الأشخاص الطبيعيين.",

 "cout-conformite": {
  "autre": "Coût de conformité",
  "definition": "الكلفة التي يتحمّلها المطالب بالأداء للوفاء بواجباته الجبائية، علاوة على الأداء نفسه: الوقت المخصّص، واللجوء إلى مستشار، والإجراءات، ومسك الوثائق. وهي تختلف عن كلفة الاستخلاص التي تتحمّلها الإدارة الجبائية. ويمثّل مجموعهما كلفة تشغيل الأداء.",

 "cout-marginal-fonds-publics": {
  "autre": "Coût marginal des fonds publics",
  "definition": "الكلفة في الرفاه، على المطالبين بالأداء، لكلّ دينار إضافي من المداخيل يوفّره الترفيع في الأداء (marginal cost of public funds، MCPF). وتساوي واحدًا لأداء لا يغيّر أيّ سلوك؛ ويقيس ما يزيد على الواحد الخسارة الصافية في الرفاه لآخر وحدة من المداخيل. وحسب ماتانن وتيرفيو (2022)، تبلغ نحو 1,3 لمعلوم نقل ملكية بنسبة 2 %، في نموذج لسوق السكن في هلسنكي، وتتجاوز 3 عند نسبة 7 %.",

 "demantelement-tarifaire": {

 "demi-decime": {

 "depense-fiscale": {
  "autre": "Dépenses fiscales",
  "definition": "حسب التقرير المرفق بمشروع قانون المالية لسنة 2021، الأحكام القانونية الاستثنائية التي تخرج عن النظام الجبائي المرجعي وتخفّف العبء الجبائي عن صنف من المطالبين بالأداء أو عن بعض العمليات أو الأنشطة، مقابل نقص في موارد الخزينة، وذلك لبلوغ أهداف اقتصادية أو اجتماعية أو ثقافية أو بيئية. ويقتضي القانون الأساسي للميزانية أن يُرفق مشروع قانون المالية بـ«تقرير حول النفقات الجبائية والامتيازات المالية الممنوحة» (الفصل 46).",

 "detournement-creation-commerce": {

 "droit-a-deduction-tva": {
  "autre": "Droit à déduction",
  "definition": "حق الخاضع للأداء في أن يطرح من الأداء على القيمة المضافة الموظف على عملياته الخاضعة الأداء الذي تحملته شراءاته وتوريداته والممتلكات والخدمات اللازمة للاستغلال، بما فيها الأصول الثابتة. ويتم الطرح بصفة جملية، ويؤجل المبلغ الذي لم يتسن طرحه إلى الأشهر الموالية فيكوّن فائض الأداء على القيمة المضافة.",

 "droit-apport": {

  "definition": "معلوم تسجيل نسبي يُستوجب على عقود تأسيس الشركات والتمديد في مدّتها، ويُوظَّف على قيمة الحصص (العدد 55 من التعريفة الملحقة بالأمر الأساسي المتعلق بالتسجيل المؤرخ في 19 أفريل 1912؛ نسبه بالأمر عدد 104 لسنة 1968 وبقانون المالية لسنة 1969). ولم تعد تعريفة مجلة معاليم التسجيل والطابع الجبائي لسنة 1993 تتضمّنه: فعقود الشركات فيها خاضعة لمعلوم قار على العقد.",

 "droit-compensateur-provisoire": {

  "definition": "معلوم مستوجب، إضافة إلى المعاليم الديوانية، عند توريد بعض المواد والمنتجات مهما كان منشؤها، ويُحتسب ويُراقب مثل المعاليم الديوانية. أُحدث في 2 جانفي 1991، وتغيّرت تسميته الفرنسية سنة 1994 دون أن تتغيّر تسميته العربية، وحُذف ابتداء من 31 ديسمبر 1997. وهو غير المعلوم التعويضي الموظّف على الواردات المدعّمة.",

 "droit-consolide": {
  "autre": "Droit consolidé",
  "definition": "نسبة معلوم ديواني مدرجة بقائمة التعهدات التعريفية للبلاد التونسية في إطار الاتفاقات التجارية المتعددة الأطراف، ثم المنظمة العالمية للتجارة، لا يمكن أن تتجاوزها النسبة المطبّقة. وتحتفظ قوانين المالية بهذه النسب عند الترفيع في المعاليم، وقد أخضع قانون المالية لسنة 2005 منتجات فلاحية ونسيجية للنسب المثبتة طبقا لاتفاقات جولة الأوروغواي.",

 "droit-de-consommation": {

  "definition": "أداء غير مباشر يوظَّف عند التوريد كما عند الصنع محليا على منتوجات لا يعرّفها القانون بطبيعتها بل يعيّنها واحدا واحدا بعدد تعريفتها الديوانية في جدول مدرج بملحقه. أحدثه القانون عدد 62 لسنة 1988 المؤرخ في 2 جوان 1988، في نفس يوم إصدار مجلة الأداء على القيمة المضافة. وهو لا يُضاف إلى الأداء على القيمة المضافة فحسب، بل يدخل في قاعدته، إذ يُحتسب هذا الأخير على ثمن يشمل المعلوم على الاستهلاك.",

 "droit-fixe-enregistrement": {

 "droits-actes-transactions": {
  "autre": "Droits sur les actes et transactions",
  "definition": "باب من المداخيل الجبائية بالجدول «أ» لقوانين المالية، تغيّر مجاله سنة 2020. فإلى غاية 2019، يقابله في الجدول عنوان مجموعة، «المعاليم على العقود والمنقولات (التسجيل)»، تضمّ معاليم الطابع الجبائي ومعاليم نقل الملكية ومعاليم التسجيل الأخرى والمعلوم الوحيد على التأمينات. ومنذ 2020، هو سطر (18-02) من الجدول، إلى جانب معاليم الطابع الجبائي (18-01) والمعلوم الوحيد على التأمينات (18-04). مفهوم ميزانياتي لا تعريف قانوني له.",

 "droits-de-douane": {
  "autre": "Droits de douane",
  "definition": "معاليم مستوجبة عند توريد البضائع، بالنسبة التي تضبطها تعريفة المعاليم الديوانية لكل بند تعريفي، ماعدا الاستثناءات المنصوص عليها بصفة صريحة في المعاهدات والاتفاقيات التجارية النافذة المفعول. ولا توجد منذ القانون عدد 113 لسنة 1989 تعريفة للمعاليم الديوانية عند التصدير. وتُحتسب المعاليم على أساس القيمة لدى الديوانة، حسب ما يجري به العمل في تاريخ تسجيل التصريح المفصّل.",

 "droits-enregistrement": {

 "duree-constatation-credit-tva": {
  "autre": "Durée de constatation du crédit de TVA",
  "definition": "عدد التصاريح المتتالية التي يجب أن يظهر بها فائض الأداء على القيمة المضافة قبل إمكانية طلب استرجاعه : اثنا عشر شهرا سنة 1988 بالنسبة إلى الفائض العادي، ثم ستة أشهر منذ سنة 1999. ومنذ سنة 2007 يكفي تصريح شهري واحد بالنسبة إلى التصدير والبيوعات بتوقيف العمل بالأداء والخصم من المورد، وثلاثة أشهر بالنسبة إلى الاستثمار، وستة أشهر في الحالات الأخرى. والعبارة مستمدة من المذكرات العامة للإدارة لا من المجلة.",

 "effet-cascade": {

  "definition": "تراكم أداء يُستخلص في كلّ مرحلة من سلسلة الإنتاج دون خصم الأداء المدفوع في المراحل السابقة، فيتوقّف العبء النهائي على عدد المراحل. وحسب ماثيسون (Matheson، 2011)، يتراكم الأداء على المعاملات الوسيطة بهذه الطريقة بحسب كثافة المعاملات في كلّ قطاع، ويدفع المؤسسات إلى الاندماج العمودي لتفاديه.",

 "effet-de-verrouillage": {
  "autre": "Effet de verrouillage",
  "definition": "الحافز على الاحتفاظ بأصل ارتفعت قيمته لتأجيل الأداء على القيمة الزائدة، الذي لا يُستوجب إلّا عند التفويت. وحسب مراجعة ميرليس (Mirrlees Review، 2011)، ينشأ هذا الأثر عن توظيف الأداء على القيمة الزائدة عند تحقيقها، دون تعديل يجعله معادلًا لتوظيفه كلّما تكوّنت.",
  "source": "Tax by Design: The Mirrlees Review, p. 296",
  "terme": "أثر التجميد"
 },
 "entrepositaire": {
  "autre": "Entrepositaire",
  "definition": "من يمسكون في مخازنهم المشروبات الكحولية والخمور والجعة. وقد أدرج الفصل 2 من القانون عدد 62 لسنة 1988 أرباب المخازن وتجار الجملة لهذه المنتوجات ضمن الخاضعين للمعلوم على الاستهلاك، إلى جانب صانعي الجعة ومعبّئي الخمور وصانعي كلّ المواد الأخرى الخاضعة للمعلوم؛ ثم أُضيف صنف خامس سنة 2008 هو الشركة التونسية للكهرباء والغاز بعنوان الغاز الطبيعي المستعمل وقودا للعربات. ولا يرد المورّد في هذا التعداد مع أنّ استخراج المنتوج من الديوانة يكوّن الحدث المتولد عنه المعلوم: فالأمر يقوم عند التوريد على الاستخلاص لدى الديوانة لا على صفة الخاضع، ولم يعلّق أيّ من النصوص المطَّلع عليها على هذه المسألة. كما نصّ الفصل 4 على أنّ المعلوم لا تأثير له على حساب ربح أرباب المخازن، إذ يُحال إلى حرفائهم بنفس المبلغ الذي وُظّف عليه.",
  "source": "Loi n° 88-62 du 2 juin 1988, art. 2-4",
  "terme": "أرباب المخازن"
 },
 "entreprise-totalement-exportatrice": {
  "autre": "Entreprises totalement exportatrices",
  "definition": "المؤسسات التي تبيع كامل سلعها أو منتجاتها أو تسدي كامل خدماتها خارج البلاد التونسية، والتي تنجز كامل خدماتها بالبلاد التونسية ويتم استعمالها بالخارج (الفصل 69 من مجلة الضريبة على دخل الأشخاص الطبيعيين والضريبة على الشركات، في صيغة القانون عدد 8 لسنة 2017). ويجيز لها الفصل نفسه ترويج جزء من إنتاجها بالسوق المحلية في حدود 30 % من رقم معاملاتها عند التصدير للسنة السابقة. ويعود المفهوم إلى مجلة تشجيع الاستثمارات لسنة 1993 (الفصل 10)؛ وقد ألغي الفصل 69 بقانون المالية لسنة 2019 (الفصل 37).",
  "source": "Loi n° 2017-8 du 14 février 2017, art. 1er (art. 69 nouveau du code de l'IRPP et de l'IS)",
  "terme": "المؤسسات المصدرة كليا"
 },
 "enzel": {
  "autre": "Enzel",
  "definition": "",
  "terme": "الإنزال"
 },
 "evasion-tarifaire": {
  "autre": "Évasion tarifaire",
  "definition": "التفصّي من المعاليم الديوانية بتصريح غير صحيح بالواردات، ولا سيما بالتقليص من الأسعار الأحادية المصرّح بها. ويقاس بالفارق بين الصادرات نحو البلاد التونسية التي تصرّح بها البلدان الشريكة وواردات المنتجات نفسها المصرّح بها لدى الديوانة.",
  "source": "Political Connections and Tariff Evasion: Evidence from Tunisia",
  "terme": "التهرب من المعاليم الديوانية"
 },

  "terme": "الإعفاء"
 },
 "facturation-identique": {
  "autre": "Facturation à l'identique",
  "definition": "واجب محمول على التجار الخاضعين للأداء على القيمة المضافة الذين يروّجون منتوجات خاضعة للمعلوم على الاستهلاك، وهو أن يفوتروا لحرفائهم بنفس المبلغ المعلوم الذي تحمّلوه عند اقتناء نفس المنتوجات، ويكون هذا المعلوم عندئذ قابلا للطرح. أُضيف هذا الواجب إلى الفصل 5 من القانون عدد 62 لسنة 1988 بالفصل 34 من قانون المالية لسنة 1990، فمدّ آلية الخصم إلى ما بعد مرحلة الصنع. وكان الفصل 4 من قانون 1988 قد وضع قاعدة قريبة منها في خصوص المشروبات الكحولية التي تُحال إلى الحرفاء بنفس المبالغ التي وُظّفت عليها.",
  "source": "Loi n° 89-115 du 30 décembre 1989, art. 34",
  "terme": "الفوترة بنفس المبلغ"
 },
 "fait-generateur-droit-consommation": {
  "autre": "Fait générateur du droit de consommation",
  "definition": "الواقعة التي يصبح بها المعلوم على الاستهلاك مستوجبا. ولم يحتفظ الفصل 3 من القانون عدد 62 لسنة 1988 إلا بحالتين: استخراج المنتوج من الديوانة عند التوريد، وتسليم المنتوج في النظام الداخلي. وهي صياغة أضيق من صياغة مجلة الأداء على القيمة المضافة — فلا تسليم للنفس ولا إسداء خدمات ولا أشغال عقارية — لأنّ الأداء موظّف على منتوجات لا على عمليات من كلّ نوع.",
  "source": "Loi n° 88-62 du 2 juin 1988, art. 3",
  "terme": "الحدث المتولد عنه المعلوم على الاستهلاك"
 },

 "fonds-de-commerce": {
  "autre": "Fonds de commerce",
  "definition": "عنصر من مكاسب التاجر. ويخضع نقل ملكيته بمقابل لمعلوم تسجيل نسبي (مجلة معاليم التسجيل والطابع الجبائي، الفصل 20). ويدرج الفصل 88 من قانون المالية لسنة 2026 الأصول التجارية ضمن المكاسب الخاضعة للضريبة على الثروة، إلى جانب العقارات والمنقولات، ويستثني منها الأصول التجارية المستغلة فعليا.",

 "fonds-special-tresor": {
  "autre": "Fonds spéciaux du Trésor",
  "definition": "حساب في الخزينة يخصّص له قانون المالية موارد ويضبط تقديراته كلّ سنة في جدول ملحق به. وقد جعل قانون المالية لسنة 1971 (الفصل 48) الصندوق العام للتعويض من هذه الحسابات، وأرجع إليه الأداءات والأتاوات التعويضية.",
  "source": "Loi n° 70-66 du 31 décembre 1970, art. 48",
  "terme": "الحسابات الخاصة في الخزينة"
 },
 "formalite-enregistrement": {
  "autre": "Formalité de l'enregistrement",
  "definition": "تقديم عقد أو تصريح أو حكم إلى قابض التسجيل الذي يستخلص المعاليم المستوجبة. وتضبط مجلة معاليم التسجيل والطابع الجبائي (الفصول 1 إلى 15) قائمة العقود الخاضعة وجوبا للتسجيل وآجاله؛ ويمكن تقديم العقد غير المدرج بها للتسجيل اختياريا.",
  "source": "Loi n° 93-53 du 17 mai 1993, art. 1 à 15",
  "terme": "إجراء التسجيل"
 },
 "frais-professionnels": {
  "autre": "Frais professionnels",
  "definition": "طرح جزافي يُجرى على المرتبات والأجور لتحديد الدخل الصافي، حُدّد بـ10 % من الباقي بعد طرح الاقتطاعات الاجتماعية الوجوبية. وقد حدّدت الفقرة 2 من الفصل 14 من قانون المالية لسنة 2017 سقفه بـ2000 دينار سنويًّا.",
  "source": "Code de l'IRPP et de l'IS, art. 26, § I",
  "terme": "المصاريف المهنية"
 },
 "gel-credit-tva": {
  "autre": "Gel du crédit de TVA (1998)",
  "definition": "إجراء ظرفي لم يعد ساري المفعول، أقره قانون المالية لسنة 1999 : فائض الأداء على القيمة المضافة الذي تفرزه الوضعية الجبائية في 31 ديسمبر 1998 لا يخول حق الطرح ابتداء من غرة جانفي 1999، ويتم إرجاعه على أساس السدس كل ستة أشهر، شريطة إيداع مطلب الاسترجاع في أجل أقصاه 30 جوان 1999. ويستثنى من التجميد الفائض المتأتي من عمليات التصدير والبيع بتوقيف العمل بالأداء على القيمة المضافة والخصم من المورد المتعلق بالصفقات العمومية ومن استثمارات الإحداث أو التأهيل.",
  "source": "Loi n° 98-111 du 28 décembre 1998, art. 53 à 55",
  "terme": "تجميد فائض الأداء على القيمة المضافة (1998)"
 },
 "habitation-principale": {
  "autre": "Habitation principale",
  "definition": "المسكن الذي يتخذه المطالب بالضريبة مسكنا رئيسيا، ويخرج من الضريبة على الثروة العقارية ثم من الضريبة على الثروة، مع الأثاث المستغل به منذ 2026. لا يعرّفه القانون، وتعتبره الإدارة مهما كانت قيمته أو مساحته بما في ذلك توابعه، ويثبت بشهادة من المصالح المختصة.",
  "source": "Décret-loi n° 2022-79 du 22 décembre 2022, art. 23 § 3",
  "terme": "المسكن الرئيسي"
 },

 "impot-foncier-2014": {
  "autre": "Impôt foncier (2014)",
  "definition": "ضريبة على العقارات التي يمتلكها الأشخاص الطبيعيون، بما في ذلك الحقوق المتعلقة بها، تساوي مرّة ونصف المعلوم على العقارات المبنية أو المعلوم على الأراضي غير المبنية، أُحدثت بالفصل 55 من قانون المالية لسنة 2014، وألغى الفصل 38 من قانون المالية التكميلي لسنة 2014 أحكامها ابتداء من غرّة جانفي 2014.",
  "source": "Loi n° 2013-54 du 30 décembre 2013, art. 55",
  "terme": "الضريبة العقارية (2014)"
 },
 "impot-fortune": {
  "autre": "Impôt sur la fortune",
  "definition": "ضريبة تُستوجب في 1 جانفي من كل سنة على الأشخاص الطبيعيين بعنوان قيمة ما يملكونه من عقارات وأصول تجارية ومنقولات، بما في ذلك مكاسب أبنائهم القصّر الذين في كفالتهم، بعد طرح الديون التي يجيز النص طرحها، إذا بلغت هذه القيمة 3 مليون دينار. أُحدثت بالفصل 88 من قانون المالية لسنة 2026 ابتداء من غرّة جانفي 2026، وألغت الضريبة على الثروة العقارية لسنة 2023 وعوّضتها. لا تندرج في أيّ مجلة، وتخضع في إجراءاتها لمجلة الحقوق والإجراءات الجبائية.",
  "source": "Loi n° 2025-17 du 12 décembre 2025, art. 88",
  "terme": "الضريبة على الثروة"
 },
 "impot-fortune-immobiliere": {
  "autre": "Impôt sur la fortune immobilière",
  "definition": "ضريبة توظَّف في غرّة جانفي من كل سنة، من 2023 إلى 2025، على عقارات الأشخاص الطبيعيين، بما في ذلك عقارات أبنائهم القصّر الذين في كفالتهم، التي تساوي قيمتها بعد طرح الديون التي يجيز النص طرحها أو تفوق 3 مليون دينار، بنسبة 0,5 %. أُحدثت بالفصل 23 من المرسوم عدد 79 لسنة 2022 المتعلق بقانون المالية لسنة 2023، وأُلغيت وعُوّضت بالضريبة على الثروة ابتداء من غرّة جانفي 2026.",
  "source": "Décret-loi n° 2022-79 du 22 décembre 2022, art. 23",
  "terme": "الضريبة على الثروة العقارية"
 },
 "impot-societes": {
  "acronyme": "IS",
  "autre": "Impôt sur les sociétés",
  "definition": "ضريبة مباشرة توظَّف على أرباح الأشخاص المعنويين، تنظّمها مجلة الضريبة على دخل الأشخاص الطبيعيين والضريبة على الشركات الصادرة بالقانون عدد 114 لسنة 1989 المؤرخ في 30 ديسمبر 1989، وتنطبق على الأرباح المحقّقة ابتداء من غرّة جانفي 1990. وهي تتقاسم هذه المجلة مع الضريبة على دخل الأشخاص الطبيعيين وتحيل عليها في جانب من قواعد الأساس. وقد حلّت محلّ الضريبة على أرباح الشركات المنصوص عليها بالفصل 9 من القانون عدد 109 لسنة 1985 المؤرخ في 31 ديسمبر 1985.",
  "source": "Loi n° 89-114 du 30 décembre 1989, art. 1er et 45",
  "terme": "الضريبة على الشركات"
 },
 "impot-transactions": {
  "autre": "Impôt sur les transactions",
  "definition": "أداء يُوظَّف على تبادل مال — سهم أو عقار أو أرض — لا على حيازته ولا على الدخل الذي يدرّه (transactions tax). وحسب مراجعة ميرليس (Mirrlees Review، 2011)، يقلّص هذا الأداء عدد المبادلات المفيدة للطرفين، فلا تبقى الأموال بالضرورة بيد من يمنحها أكبر قيمة؛ ويثقل على المال بقدر تكرّر انتقاله من يد إلى أخرى. ومعلوم نقل ملكية العقارات مثال على ذلك.",
  "source": "Tax by Design: The Mirrlees Review, p. 151-152 et 403",
  "terme": "الأداء على المعاملات"
 },
 "impots-directs": {
  "autre": "Impôts directs",
  "definition": "أداءات توظَّف بصفة دورية على مادة خاضعة للأداء قارّة أو متجدّدة بانتظام، كالدخل أو الربح. وهي في تونس الضريبة على دخل الأشخاص الطبيعيين والضريبة على الشركات، ويُلحق بها المعيار نفسه الضريبة على الثروة المستوجبة كل سنة على المكاسب المملوكة في غرّة جانفي. كان القانون الأساسي للميزانية يعدّدها، دون أن يعرّفها، ضمن موارد الدولة تحت عنوان «الأداءات المباشرة الاعتيادية» ابتداء من سنة 1996، إلى حين صدور القانون الأساسي للميزانية لسنة 2019.",
  "source": "Droit. Axe 4 : Droit fiscal, p. 14-16",
  "terme": "الأداءات المباشرة"
 },
 "impots-indirects": {
  "autre": "Impôts indirects",
  "definition": "أداءات توظَّف على عمليات متقطّعة أو متتالية، بمناسبة إنتاج سلعة أو تبادلها أو استهلاكها. وهي في تونس الأداء على القيمة المضافة والمعلوم على الاستهلاك والمعاليم الديوانية ومعاليم التسجيل والطابع الجبائي. كان القانون الأساسي للميزانية يعدّدها، دون أن يعرّفها، ضمن موارد الدولة تحت عنوان «الأداءات والمعاليم غير المباشرة الاعتيادية» ابتداء من سنة 1996، إلى حين صدور القانون الأساسي للميزانية لسنة 2019.",
  "source": "Droit. Axe 4 : Droit fiscal, p. 14-16",
  "terme": "الأداءات والمعاليم غير المباشرة"
 },
 "imputation-droit-consommation": {
  "autre": "Imputation du droit de consommation",
  "definition": "رخصة تُخوَّل للخاضعين في خصم المعلوم على الاستهلاك الذي أثقل فعلا شراءاتهم لدى خاضعين آخرين ووارداتهم من المواد والمنتوجات التي تدخل كليا في تركيب المنتوج النهائي الخاضع للمعلوم، على أن يؤجَّل طرح المبلغ المتبقّي إلى الأشهر الموالية. وهي آلية قريبة من الطرح في مادة الأداء على القيمة المضافة غير أنّها أضيق منه، إذ تشترط دخول المادة كليا في المنتوج النهائي. وبها يفترق المعلوم على الاستهلاك عن المعاليم النوعية العادية.",
  "source": "Loi n° 88-62 du 2 juin 1988, art. 5",
  "terme": "خصم المعلوم على الاستهلاك"
 },
 "incidence-fiscale": {
  "autre": "Incidence fiscale",
  "definition": "توزيع العبء الفعلي للأداء بين الأعوان الاقتصاديين — المشترين والبائعين، والمؤجّرين والأجراء —، وهو غير تعيين الشخص المطالب قانونًا بالأداء. وحسب مراجعة ميرليس (Mirrlees Review، 2011)، يتحمّل الأداءَ من يُنقص من رفاهه، وليس بالضرورة من يدفعه؛ وحسب ألم وأنيز ومودي (2004)، يتوقّف توزيع معلوم نقل الملكية بين المشتري والبائع على مرونة الطلب والعرض.",
  "source": "Tax by Design: The Mirrlees Review, p. 27-28",
  "terme": "توزيع العبء الجبائي"
 },
 "irpp": {

  "definition": "ضريبة مباشرة تصاعدية على الدخل الصافي الجملي للأشخاص الطبيعيين، تُخصم من المورد على الأجور.",

 "liquidite-marche": {

  "definition": "سهولة شراء سند أو بيعه بسرعة وبكميات كبيرة دون أن تؤثّر العملية تأثيرا ملموسا في سعره. وحسب ماثيسون (Matheson، 2011)، يرفع المعلوم على نقل السندات كلفة كلّ مبادلة ويقلّص سيولة السوق.",

 "minimum-impot": {
  "autre": "Minimum d'impôt",
  "definition": "الحدّ الأدنى من الضريبة السنوية، المحتسَب بنسبة من رقم المعاملات أو من المقابيض الخام، والذي لا يمكن أن تنزل عنه الضريبة المحتسبة حسب الجدول بالنسبة إلى الأنشطة التجارية وغير التجارية (الفقرة II من الفصل 44 من مجلة الضريبة على دخل الأشخاص الطبيعيين والضريبة على الشركات). ولا تُخلط بالضريبة الدنيا المنصوص عليها بالفصل 12 مكرر من القانون عدد 114 لسنة 1989، التي تحدّ من أثر بعض الطروحات وتُحتسب على الأداء المستوجب دون اعتبارها.",
  "source": "Code de l'IRPP et de l'IS, art. 44, § II",
  "terme": "الضريبة الدنيا"
 },
 "minimum-impot-chiffre-affaires": {
  "autre": "Minimum d'impôt sur le chiffre d'affaires",
  "definition": "الحدّ الأدنى للضريبة السنوية، المنصوص عليه بالفقرة II من الفصل 49 من المجلة: نسبة من رقم المعاملات الخام، مع مبلغ أدنى مستوجب حتى في صورة عدم تحقيق رقم معاملات. ولا يُخلط بالضريبة الدنيا المنصوص عليها بالفصل 12 مكرر من القانون عدد 114 لسنة 1989، التي تسقّف الامتيازات الجبائية وتُحتسب على الضريبة النظرية، ولا بتلك المنصوص عليها بالفقرة II من الفصل 44، وهي مقابلها في الضريبة على دخل الأشخاص الطبيعيين.",
  "source": "Code de l'IRPP et de l'IS, art. 49 § II",
  "terme": "الضريبة الدنيا"
 },
 "minimum-perception-douane": {
  "autre": "Minimum légal de perception",
  "definition": "نسبة دنيا من المعاليم الديوانية تستخلص عند التوريد رغم الإعفاءات التي تنصّ عليها بعض القوانين والاتفاقيات. ضبطها قانون المالية لسنة 1987، ويمكن حسب مجلة الديوانة لسنة 2008 توقيف العمل بها بمقتضى أمر مع المعاليم الديوانية (الفصل 6).",
  "source": "Loi n° 86-106 du 31 décembre 1986, art. 27",
  "terme": "الحد الأدنى القانوني للاستخلاص"
 },
 "minimum-perception-enregistrement": {

  "definition": "",
  "source": "Loi n° 2016-78 du 17 décembre 2016, art. 69",
  "terme": "الاستخلاص الأدنى"
 },
 "opcvm": {
  "acronyme": "OPCVM",
  "autre": "Organisme de placement collectif en valeurs mobilières",
  "definition": "مؤسسة توظّف بصفة جماعية في الأوراق المالية ادّخار مساهميها أو حاملي حصصها: شركة استثمار ذات رأس مال متغيّر أو صندوق مشترك للتوظيف. وحسب الإدارة، تخضع مداخيل رؤوس الأموال المنقولة للصناديق المشتركة للتوظيف في الأوراق المالية، ابتداءً من سنة 2002، لخصم من المورد بنسبة 20 بالمائة نهائي وتحرّري (المذكرة العامة عدد 45 لسنة 2002).",
  "source": "Note commune n° 45/2002",
  "terme": "مؤسسة التوظيف الجماعي في الأوراق المالية"
 },
 "option-assujettissement": {
  "autre": "Option pour la qualité d'assujetti",
  "definition": "",
  "source": "Loi n° 88-61 du 2 juin 1988, art. 2 § I-3",
  "terme": "الاختيار للخضوع للأداء"
 },
 "origine-des-marchandises": {
  "autre": "Origine des marchandises",
  "definition": "البلد الذي تُعتبر البضاعة ذات منشأ منه، وعلى أساسه تُستخلص المعاليم عند التوريد. ومع مراعاة التعاريف الواردة بالاتفاقيات التجارية، تعتبر مجلة الديوانة لسنة 2008 ذات منشأ من بلد ما البضائع «المتحصل عليها كليا» بهذا البلد، وتُضبط بأمر، طبقا لقاعدة التحويل الجوهري، قواعد تحديد منشأ بضاعة متحصل عليها باستعمال منتجات موردة من بلد آخر. وتحدّد قواعد المنشأ في الاتفاقيات التفاضلية الواردات التي تنتفع بالنسبة المخفّضة.",
  "source": "Loi n° 2008-34 du 2 juin 2008, art. 21",
  "terme": "منشأ البضائع"
 },
 "perte-seche": {
  "autre": "Perte sèche",
  "definition": "جزء كلفة الأداء على المستهلكين والمنتجين الذي يتجاوز المداخيل التي يوفّرها. وحسب مراجعة ميرليس (Mirrlees Review، 2011)، يُلحق الأداء، برفعه الأسعار وتقليصه الكمّيات المتبادلة، خسائر يتجاوز مجموعها في أغلب الحالات المداخيل المحصّلة؛ ويزداد الفارق بقدر استجابة العرض والطلب للسعر.",
  "source": "Tax by Design: The Mirrlees Review, p. 29",
  "terme": "الخسارة الصافية في الرفاه"
 },
 "plus-value-cession-titres": {
  "autre": "Plus-value de cession de titres",
  "definition": "الربح الذي يحقّقه شخص طبيعي، خارج نشاطه المهني، عند التفويت في أسهم أو منابات اجتماعية: ثمن التفويت مطروحًا منه قيمة الاقتناء، بعد طرح نقصان القيمة من نفس الطبيعة المسجَّل خلال السنة. وتُعدّ منذ سنة 2004 من مداخيل الأوراق المالية، وتخضع للضريبة بنسبة قارّة خارج الجدول (قانون المالية لسنة 2004، الفصول 61 إلى 63).",
  "source": "Loi n° 2003-80 du 29 décembre 2003, art. 61 à 63",
  "terme": "القيمة الزائدة المتأتية من التفويت في السندات"
 },
 "plus-value-immobiliere": {
  "autre": "Plus-value immobilière",
  "definition": "",
  "source": "Code de l'IRPP et de l'IS, art. 27",
  "terme": "القيمة الزائدة العقارية"
 },
 "plus-value-nominale": {
  "autre": "Plus-value nominale",
  "definition": "الفارق بين ثمن تفويت مال وثمن اقتنائه، كلاهما بالدينار الجاري (nominal gain). والقيمة الزائدة الحقيقية (real gain) هي هذا الفارق بعد طرح أثر الارتفاع العامّ للأسعار طيلة مدّة الحيازة. وحسب مراجعة ميرليس (Mirrlees Review، 2011)، تكون النسبة الفعلية لأداء يُوظَّف على القيمة الزائدة الاسمية، دون تعديل بحسب التضخّم، شديدة التأثّر بالتضخّم.",
  "source": "Tax by Design: The Mirrlees Review, p. 325 et 489",
  "terme": "القيمة الزائدة الاسمية"
 },
 "position-tarifaire": {
  "autre": "Position tarifaire",
  "definition": "عدد التعريفة الديوانية الذي يعيّن به الجدول الملحق المنتوجات الخاضعة للمعلوم على الاستهلاك؛ وقد جعله جدول 1988 عنوانا لعموده الأول. ويكون البند كاملا (02-03) أو مستخرَجا يسبقه الرمز «م»، فيحدّد البيان عندئذ الجزء المعنيّ منه وما يُستثنى فيه. وبذلك يُضبط ميدان المعلوم على الاستهلاك بقائمة ديوانية لا بصنف اقتصادي.",
  "source": "Loi n° 88-62 du 2 juin 1988, tableau annexé, colonne « NT »",
  "terme": "البند التعريفي"
 },
 "prime-investissement": {
  "autre": "Prime d'investissement",
  "definition": "منحة تُسند للمشاريع ذات الأهمية الوطنية في حدود ثلث كلفة الاستثمار، بما في ذلك المصاريف الناتجة عن أشغال البنية الأساسية الداخلية؛ ويُضبط سقفها بأمر حكومي (القانون عدد 71 لسنة 2016، الفصل 20). وهي غير المنح الأربع المنصوص عليها بالفصل 19 من القانون نفسه، وكل منها مسمّاة بموضوعها — منحة الترفيع من القيمة المضافة والقدرة التنافسية، ومنحة تطوير القدرة التشغيلية، ومنحة التنمية الجهوية، ومنحة التنمية المستدامة.",
  "source": "Loi n° 2016-71 du 30 septembre 2016, art. 20",
  "terme": "منحة الاستثمار"
 },
 "projet-interet-national": {
  "autre": "Projets d'intérêt national",
  "definition": "مشاريع تُضبط بأمر حكومي بناء على حجمها الاستثماري أو طاقتها التشغيلية واستجابتها على الأقل لأحد الأهداف المنصوص عليها بالفصل الأول من قانون الاستثمار. وتنتفع بطرح الأرباح من قاعدة الضريبة على الشركات في حدود عشر سنوات، وبمنحة استثمار في حدود ثلث كلفة الاستثمار، وبمساهمة الدولة في تحمّل المصاريف الناتجة عن أشغال البنية الأساسية؛ وتُسند هذه الحوافز لكل مشروع بأمر حكومي (القانون عدد 71 لسنة 2016، الفصل 20).",
  "source": "Loi n° 2016-71 du 30 septembre 2016, art. 20",
  "terme": "المشاريع ذات الأهمية الوطنية"
 },
 "promoteur-immobilier": {
  "autre": "Promoteur immobilier",
  "definition": "متدخل عقاري تخضع بعض بيوعاته لأحكام خاصة في مادة الأداء على القيمة المضافة. فقد دخل بيع قطع الأراضي من قبل الباعثين العقاريين في ميدان الأداء سنة 2017، ثم خضعت بيوعاتهم للمساكن للإعفاءات أو للنسب المنصوص عليها بالمجلة.",
  "source": "Loi n° 2016-78 du 17 décembre 2016, art. 20",
  "terme": "الباعث العقاري"
 },
 "prorata-deduction-tva": {
  "autre": "Pourcentage de déduction",
  "definition": "الجزء من الأداء على القيمة المضافة المتحمَّل الذي يمكن للخاضع جزئيا طرحه. وهي حاصل قسمة المقابيض الخاضعة للأداء، مضافا إليها مقابيض التصدير والبيوعات بتوقيف العمل بالأداء، على مجموع المقابيض بما فيها المعفاة أو الخارجة عن ميدان تطبيق الأداء. وتحتسب على أساس السنة السابقة ثم تحدد في آخر كل سنة مدنية باعتبار العناصر المنجزة خلالها.",
  "source": "Loi n° 88-61 du 2 juin 1988, art. 9, § II et III",
  "terme": "النسبة المائوية للطرح"
 },
 "protection-effective": {
  "autre": "Protection effective",
  "definition": "الحماية التي توفّرها بنية المعاليم الديوانية للقيمة المضافة لفرع من فروع الإنتاج، لا لثمن منتوجه، إذ تأخذ في الاعتبار المعاليم الموظّفة على المنتوج والمعاليم الموظّفة على المدخلات الموردة معا. وتنسب نسبتُها الفارقَ بين القيمة المضافة بالأسعار الداخلية والقيمة المضافة بالأسعار العالمية إلى هذه الأخيرة، وتفوق النسبة الاسمية عندما تكون المدخلات أقلّ خضوعا للمعاليم من المنتوج.",
  "source": "République tunisienne. Vers le 21e siècle. Mémorandum économique. Volume II : annexes, annexe 2, p. 16",
  "terme": "الحماية الفعلية"
 },
 "recettes-fiscales": {
  "autre": "Recettes fiscales",
  "definition": "مجموع الضرائب والمعاليم والأداءات التي تستخلصها الدولة، باستثناء المداخيل غير الجبائية. وتميّزها وثائق الميزانية التونسية عن المداخيل غير الجبائية، المتأتّية خاصّةً من أتاوة عبور الغاز.",
  "terme": "المداخيل الجبائية"
 },
 "redevance-prestations-douanieres": {
  "autre": "Redevance de prestations douanières",
  "definition": "أتاوة تستخلصها الديوانة على التصاريح الديوانية إضافة إلى المعاليم. أُحدثت سنة 1988 على أساس القيمة لدى الديوانة، وهي موظّفة منذ 1994 على مبلغ المعاليم والأداءات المستوجبة عند التوريد مع حدّ أدنى للاستخلاص، وتوظَّف إضافة إلى ذلك أتاوة قارة على كل تصريح ديواني بعبور بري للبضائع.",
  "source": "Loi n° 98-111 du 28 décembre 1998, art. 32",
  "terme": "الأتاوة على الخدمات الديوانية"
 },
 "regime-forfaitaire": {
  "autre": "Régime forfaitaire d'imposition",
  "definition": "نظام توظيف الضريبة على المؤسسات الفردية التي تحقّق أرباحًا صناعية وتجارية في إطار مقرّ وحيد، ضمن شروط تتعلّق بالنشاط وبرقم المعاملات: تُضبط فيه الضريبة تقديريًّا على أساس رقم المعاملات السنوي لا على أساس الربح الحقيقي. أُحدث بالفقرة IV من الفصل 44 من المجلة ثمّ نُقل إلى الفصول من 44 مكرّر إلى 44 سادسا.",
  "source": "Code de l'IRPP et de l'IS, art. 44, § IV",
  "terme": "النظام التقديري"
 },
 "regime-forfaitaire-optionnel": {
  "autre": "Régime forfaitaire optionnel",
  "definition": "نظام يُفتح بالاختيار، أُضيف إلى الفصل 44 ثالثا من المجلة بمقتضى الفصل 91 من قانون المالية لسنة 2026، لفائدة المطالبين بالأداء الذين لا يتجاوز رقم معاملاتهم السنوي 100.000 دينار: تُضبط فيه الضريبة جزافيًّا في صنفين (4000 و5000 دينار سنويًّا، مع التخفيض إلى النصف في الأرياف والقرى) وتكون تحرّرية في حدود رقم المعاملات المصرّح به تلقائيًّا.",
  "source": "Loi n° 2025-17 du 12 décembre 2025, art. 91",
  "terme": "النظام التقديري الاختياري"
 },
 "regime-suspensif-tva": {
  "autre": "Régime suspensif de la taxe sur la valeur ajoutée",
  "definition": "نظام يتيح، في الحالات والشروط المنصوص عليها بالمجلة، توريد أموال وخدمات أو اقتناءها محليا دون دفع الأداء على القيمة المضافة عند العملية. وينتفع به خاصة بعض المؤسسات المصدرة بالنسبة إلى اقتناءاتها التي تمنح حق الطرح.",
  "source": "Loi n° 88-61 du 2 juin 1988, art. 11",
  "terme": "نظام توقيف العمل بالأداء على القيمة المضافة"
 },
 "regimes-douaniers-suspensifs": {
  "autre": "Régimes suspensifs et régimes douaniers économiques",
  "definition": "أنظمة تمكّن من خزن البضائع أو تحويلها أو استعمالها أو جولانها مع توقيف العمل بالمعاليم الديوانية والأداءات الداخلية المستوجبة وبكلّ معلوم أو أداء آخر يمكن أن تخضع له. وتعدّ مجلة الديوانة لسنة 2008 منها، مع التصدير المؤقت، سبعة: العبور، والمستودع الديواني، والتحويل تحت مراقبة الديوانة، والتحويل الفعال، والقبول المؤقت، والتحويل غير الفعال، والتصدير المؤقت.",
  "source": "Loi n° 2008-34 du 2 juin 2008, art. 137-138",
  "terme": "الأنظمة التوقيفية والأنظمة الديوانية الاقتصادية"
 },
 "regroupement-seuil": {
  "autre": "Regroupement",
  "definition": "تراكم المشاهدات — المداخيل أو الأثمان المصرّح بها — عند عتبة من عتبات الأداء أو دونها مباشرة. ويصف كليفن (2016) طريقة تقيس بهذا التجمّع الاستجابة للعتبة. وحسب بيست وكليفن (2018)، يجمع تجمّع أثمان البيع دون العتبة بين استجابة حقيقية، في الثمن المتّفق عليه، وتصريح محتمل بأقلّ من الثمن الحقيقي.",
  "source": "Bunching, p. 436",
  "terme": "التجمّع عند العتبة"
 },
 "regularisation-deductions-tva": {
  "autre": "Régularisation des déductions",
  "definition": "تصحيح الطرح الأصلي عند تغيّر الوضعية : تغيّر النسبة المائوية للطرح بأكثر من 5 بالمائة بالنسبة إلى الممتلكات الخاضعة للاستهلاكات، أو التفويت، أو تغيير وجهة الاستعمال، أو توقيف النشاط، أو التخلي عن صفة خاضع. ويُدفع عندئذ الأداء الذي تم طرحه بعد تخفيضه بالخمس عن كل سنة امتلاك بالنسبة إلى التجهيزات والمعدات، وبالعشر بالنسبة إلى البناءات.",
  "source": "Loi n° 88-61 du 2 juin 1988, art. 9, § III et IV",
  "terme": "تعديل الطرح"
 },
 "restitution-credit-tva": {
  "autre": "Restitution du crédit de taxe sur la valeur ajoutée",
  "definition": "إرجاع الخزينة لفائض الأداء على القيمة المضافة الذي لم يتسن طرحه، وينظمه الفصل 15 من المجلة. وباستثناء التصدير والبيوعات بتوقيف العمل بالأداء، كان الإرجاع جزئيا إلى موفى سنة 2006 (20 بالمائة من الفائض سنة 1988 و50 بالمائة سنة 1999)، وأصبح كليا في جميع الحالات منذ غرة جانفي 2007. وتضبط آجاله مجلة الحقوق والإجراءات الجبائية منذ سنة 2002.",
  "source": "Loi n° 2006-80 du 18 décembre 2006, art. 15",
  "terme": "إرجاع فائض الأداء على القيمة المضافة"
 },
 "retenue-a-la-source": {
  "autre": "Retenue à la source",
  "definition": "اقتطاع للأداء يقوم به دافع المبلغ لحساب من يقبضه، ويُدفَع المبلغ المخصوم للخزينة ويُحتسَب على الأداء المستوجَب على هذا الأخير، إلّا إذا جعله القانون تحرّريًا أو نهائيًا وغير قابل للإرجاع (المجلة، الفصلان 52 و54). ففي مادة الضريبة على دخل الأشخاص الطبيعيين يقوم به المؤجِّر عند دفع المرتب والمنح الخاضعة للضريبة (مجلة الضريبة على الدخل والضريبة على الشركات، القانون عدد 89-114). وفي مادة الأداء على القيمة المضافة تخصم الدولة والجماعات المحلية والمؤسسات والمنشآت العمومية جزءا من الأداء المفوتر من قبل مزوديها : 50 بالمائة ابتداء من سنة 1998 و25 بالمائة ابتداء من سنة 2016.",
  "source": "Loi n° 89-114 du 30 décembre 1989",
  "terme": "الخصم من المورد"
 },
 "retenue-definitive-non-restituable": {
  "autre": "Retenue à la source définitive et non restituable",
  "definition": "خصم من المورد لا يُرجَع إلى المستفيد مهما كان نظامه الجبائي، ولو تجاوز الأداء المستوجب عليه أو لم يكن مُطالبًا بأداء. ويصف به المرسوم عدد 30 لسنة 2020 (الفصل 12) الخصم بنسبة 35 بالمائة على مداخيل الإيداعات بأجل التي تفوق نسبة تأجيرها، في غرّة جانفي من السنة، معدل نسبة الفائدة في السوق النقدية ناقص نقطة مائوية.",
  "source": "Décret-loi n° 2020-30 du 10 juin 2020, art. 12",
  "terme": "الخصم من المورد النهائي وغير القابل للإرجاع"
 },
 "retenue-liberatoire": {
  "autre": "Retenue à la source libératoire",
  "definition": "خصم من المورد يُبرئ من الضريبة على الدخل المستوجبة على المبلغ الذي يُوظَّف عليه: لا يدخل هذا الدخل في الدخل الجملي المصرَّح به، ولا يُطرَح الخصم من الأداء المستوجب. وتنصّ عليه مجلة سنة 1990 بالنسبة إلى مداخيل وصولات الإيداع للحامل التي لم يُصرَّح للإدارة بهوية حاملها، وإلى المداخيل الممنوحة للأشخاص غير المقيمين أو غير المستقرّين بالبلاد التونسية (الفصل 52-II)؛ أمّا سائر الخصوم فتُطرَح من الأداء (الفصل 54).",
  "source": "Code de l'IRPP et de l'IS, art. 52-II et 54",
  "terme": "الخصم من المورد التحرري"
 },
 "revenus-capitaux-mobiliers": {
  "autre": "Revenus de capitaux mobiliers",
  "definition": "مداخيل إقراض المال، تندرج مع مداخيل الأوراق المالية في الصنف السادس من الضريبة على الدخل: الفوائض وسائر محاصيل الرقاع والسندات العمومية وسندات القروض القابلة للبيع والشراء، وفوائض الديون وودائع المبالغ المالية والضمانات النقدية، ومحاصيل الحسابات الجارية (مجلة سنة 1990، الفصل 34).",
  "source": "Code de l'IRPP et de l'IS, art. 34",
  "terme": "مداخيل رؤوس الأموال المنقولة"
 },
 "revenus-fonciers": {
  "autre": "Revenus fonciers",
  "definition": "صنف يُعرَّف بصفة تكميلية: تدخل فيه مداخيل العقارات والحقوق العقارية إذا لم تندرج ضمن صنف آخر. ويُضبط الدخل الصافي للعقارات المبنية بصفة جزافية.",
  "source": "Code de l'IRPP et de l'IS, art. 27",
  "terme": "المداخيل العقارية"
 },
 "revenus-valeurs-mobilieres": {
  "autre": "Revenus de valeurs mobilières",
  "definition": "مداخيل يجنيها الشخص بصفته شريكًا أو مساهمًا، تندرج مع مداخيل رؤوس الأموال المنقولة في الصنف السادس من الضريبة على الدخل: الأرباح التي توزّعها الشركات الخاضعة للضريبة على الشركات والمبالغ المعتبرة مداخيل موزّعة، مثل مكافآت الحضور (مجلة سنة 1990، الفصول 29 إلى 33). ومنذ سنة 2004، تشمل أيضًا القيمة الزائدة المتأتية من التفويت في الأسهم والمنابات الاجتماعية (قانون المالية لسنة 2004، الفصل 61).",
  "source": "Code de l'IRPP et de l'IS, art. 29 à 33",
  "terme": "مداخيل الأوراق المالية"
 },
 "seuil-a-changement-de-taux": {
  "autre": "Seuil à changement de taux",
  "definition": "قيمة للوعاء تتغيّر عندها النسبة الحدية للأداء دون أن يتغيّر المبلغ المستوجب عند العتبة نفسها: لا يخضع للنسبة الجديدة إلّا جزء الوعاء الذي يتجاوز العتبة. وحدود الشرائح في جدول تصاعدي عتبات من هذا النوع. ويسمّيها كليفن (2016) (kink).",
  "source": "Bunching, p. 436",
  "terme": "عتبة تغيّر النسبة"
 },
 "seuil-a-saut": {
  "autre": "Seuil à saut",
  "definition": "قيمة للوعاء يرتفع عندها مبلغ الأداء دفعة واحدة، بتغيّر نسبته المتوسطة: فتجاوز العتبة، ولو بقليل، يكفي لزيادة الأداء المستوجب بمقدار هذه القفزة. ويميّز كليفن (2016) هذه العتبة (notch) من عتبة تغيّر النسبة (kink). وفي نموذجه، في غياب الاحتكاكات، تترك العتبة ذات القفزة فوقها مباشرة منطقة خالية لا يختار أيّ مطالب بالأداء أن يتموقع فيها.",
  "source": "Bunching, p. 436 et 441-442",
  "terme": "العتبة ذات القفزة"
 },
 "smig": {
  "acronyme": "SMIG",
  "autre": "Salaire minimum interprofessionnel garanti",
  "definition": "الحدّ الأدنى القانوني للأجر بالساعة أو بالشهر المطبَّق على أجراء القطاعات غير الفلاحية الخاضعة لمجلة الشغل. تضبطه الدولة بأمر منذ غرّة جانفي 1974. ويُضبط بالساعة وبالشهر، في نظامين لمدة العمل: نظام عمل 48 ساعة ونظام عمل 40 ساعة في الأسبوع.",
  "source": "Décret gouvernemental n° 2017-668 du 5 juin 2017",
  "terme": "الأجر الأدنى المضمون لمختلف المهن"
 },
 "sous-declaration": {
  "autre": "Sous-déclaration",
  "definition": "التصريح لدى الإدارة الجبائية بقيمة دون القيمة الحقيقية؛ وفي بيع عقار، التصريح بثمن دون الثمن المتّفق عليه بين الطرفين. وحسب نورغارد (2013، صندوق النقد الدولي)، يحفز معلوم نقل الملكية المرتفع المشتري والبائع على الاتّفاق على التقليل من الثمن، ويحرم التصريح بأقلّ من القيمة الحقيقية الإدارةَ من البيوعات مصدرًا محيَّنًا للمعلومات عن قيم السوق.",
  "source": "Taxing Immovable Property: Revenue Potential and Implementation Challenges, p. 29",
  "terme": "التصريح بأقلّ من القيمة الحقيقية"
 },
 "suspension-droit-consommation": {
  "autre": "Suspension du droit de consommation",
  "definition": "نظام لا يُطلب بمقتضاه المعلوم على الاستهلاك عند عملية كانت لولاه خاضعة له. وقد أحدث الفصل 6 مكرر من القانون عدد 62 لسنة 1988، المضاف بالفصل 22 من قانون المالية لسنة 2018، حالة من حالاته: العربات الصالحة لكل المسالك الموردة من قبل الوكلاء المعتمدين لفائدة وكالات الأسفار.",
  "source": "Loi n° 88-62 du 2 juin 1988, art. 6 bis",
  "terme": "توقيف العمل بالمعلوم على الاستهلاك"
 },
 "systeme-fiscal-de-reference": {
  "autre": "Système fiscal de référence",
  "definition": "حسب التقرير المرفق بمشروع قانون المالية لسنة 2021، الأحكام الأساسية لكل أداء، التي يُعدّ الإجراء الخارج عنها استثنائيا ويُحتسب ضمن النفقات الجبائية. ويعتمد التقرير المقاربة التي يسمّيها قانونية: النظام المرجعي فيها هو مجموع الأحكام الأساسية المنصوص عليها بالقانون العام، ويُضبط بحسب كل صنف من الأداءات.",
  "source": "Rapport sur les dépenses fiscales et les avantages financiers, annexe au projet de loi de finances, rapport annexé au projet de loi de finances pour 2021, section II, § 1",
  "terme": "النظام الجبائي المرجعي"
 },
 "systeme-harmonise": {
  "acronyme": "SH",
  "autre": "Système harmonisé de désignation et de codification des marchandises",
  "definition": "تصنيفة دولية للبضائع ضبطتها الاتفاقية المبرمة ببروكسل في 14 جوان 1983، وصادقت عليها البلاد التونسية سنة 1987. وتتبعها تعريفة المعاليم الديوانية منذ القانون عدد 113 لسنة 1989، وتُبنَّد البضائع حسب مجلة الديوانة لسنة 2008 مع مراعاة القواعد العامة لتفسير التصنيفة التعريفية للنظام المنسق (الفصل 19).",
  "source": "Loi n° 87-2 du 6 février 1987",
  "terme": "النظام المنسق لتعيين وترميز البضائع"
 },

 "tableau-annexe-loi-88-62": {
  "autre": "Tableau annexé à la loi n° 88-62",
  "definition": "قائمة المنتوجات الخاضعة للمعلوم على الاستهلاك، مدرجة بملحق القانون عدد 62 لسنة 1988 المؤرخ في 2 جوان 1988. وهي تحمل في الآن نفسه ميدان التطبيق والنسب: ثلاثة أعمدة — عدد التعريفة الديوانية وبيان المنتوجات ونسبة المعلوم — إضافة إلى إحالات تتضمّن قواعد أصلية. فتنقيح الجدول هو في ذاته تنقيح لميدان التطبيق. وقد أُلغي جدول 1988 وعُوّض بكامله مرّتين، بالفصل 44 من قانون المالية لسنة 2016 ثم بالفصل 45 من قانون المالية لسنة 2018: ولمعرفة الوضع الجاري به العمل تُعتمد النسخة المنقّحة للمجلة لا نصّ 1988.",

 "tarif-autonome": {
  "autre": "Tarif autonome",
  "definition": "التعريفة العادية للمعاليم الديوانية التي يضبطها القانون التونسي، في مقابل النسب المثبتة في إطار المنظمة العالمية للتجارة والنسب التفاضلية الواردة بالاتفاقيات التجارية. وتستعمل قوانين المالية هذه العبارة عند تنقيح هذه النسب.",

 "tarif-des-droits-de-douane": {
  "autre": "Tarif des droits de douane à l'importation",
  "definition": "النص القانوني الذي يضبط، لكل بند من التصنيفة، نسبة المعاليم الديوانية المستوجبة عند التوريد. والتعريفة الجاري بها العمل هي المصادق عليها بالقانون عدد 113 لسنة 1989، وتتكوّن من أحكام تمهيدية ومن جدول النسب، وتنقّحها قوانين المالية. وقد عوّضت تعريفتي قانوني 1959 و1973 اللتين كانتا تشملان أيضا تعريفة عند التصدير.",
  "source": "Loi n° 89-113 du 30 décembre 1989, art. 1",
  "terme": "تعريفة المعاليم الديوانية عند التوريد"
 },
 "tarif-minimum-tarif-general": {
  "autre": "Tarif minimum, tarif général",
  "definition": "عمودا تعريفة المعاليم عند التوريد في قانوني 1959 و1973، وقد بقيا ساريين إلى غاية 31 ديسمبر 1989. وتطبّق التعريفة الدنيا طبقا لأحكام المعاهدات والاتفاقيات والترتيبات الدولية، وتحدَّد التعريفة العامة بثلاثة أضعاف التعريفة الدنيا.",

 "taux-ad-valorem": {
  "autre": "Taux ad valorem",
  "definition": "نسبة تُحتسب مئويا من قيمة، خلافا للنسبة النوعية. فإذا أخضع الجدول الملحق منتوجا لنسبة من القيمة، تكوّنت قاعدة المعلوم على الاستهلاك عند التوريد من القيمة المصرح بها لدى الديوانة، وفي النظام الداخلي من ثمن البيع باعتبار كل المصاريف والمعاليم والأداءات باستثناء المعلوم على الاستهلاك والأداء على القيمة المضافة.",
  "source": "Loi n° 88-62 du 2 juin 1988, art. 4-a",
  "terme": "نسبة من القيمة"
 },

 "taux-marginal": {

  "definition": "نسبة جدول يُطبَّق بالشرائح، وهي نسبة الشريحة التي تقع فيها آخر وحدة من الوعاء (دخل أو نصيب في التركة)، أي النسبة التي تُوظَّف على الدينار الإضافي. تختلف عن النسبة المتوسطة التي تقيس الضريبة الجملية بالنسبة إلى الوعاء.",
  "source": "Code de l'IRPP et de l'IS, art. 44 § I",

 "taux-moyen": {
  "autre": "Taux moyen",
  "definition": "الضريبة الجملية المستوجبة مقيسةً إلى الوعاء (الدخل الصافي الخاضع للضريبة أو النصيب المورَّث). وفي جدول بالشرائح تقلّ عن النسبة الحدية متى جاوز الوعاء الشريحة الأولى. ولا تُعرَّف إذا كان الوعاء معدومًا.",

 "taux-npf": {

  "autre": "Taux de la nation la plus favorisée",
  "definition": "نسبة المعلوم الديواني التي يطبّقها عضو في المنظمة العالمية للتجارة على واردات الأعضاء الآخرين في غياب أي معاملة تفاضلية، أي النسبة العادية. وتحتسب مراجعات السياسات التجارية في إطار الاتفاق العام ثم المنظمة العالمية للتجارة معدّلات التعريفة على أساس هذه النسب، بندا بندا.",

 "taux-specifique": {
  "autre": "Taux spécifique",
  "definition": "نسبة لا تُحتسب من قيمة بل من كمّية — حجم أو وزن —، خلافا للنسبة من القيمة. ويجمع الجدول الملحق بين الأسلوبين منذ 1988: فالمعلوم على الاستهلاك ليس أداء على القيمة ولا معلوما نوعيا خالصا، بل هو مختلط منذ نشأته. والتعريفة النوعية لا تتبع الأسعار، إذ لا تتغيّر إلا بمراجعة الجدول، فيعادل ثباتها الاسمي الطويل تآكلا حقيقيا.",

 "taxe-bieres-vins-boissons-alcoolisees": {
  "autre": "Taxe sur les bières, vins et autres boissons alcoolisées",
  "definition": "أداء أحدثته الفصول من 4 إلى 11 من القانون عدد 2 لسنة 1984 المؤرخ في 21 مارس 1984 والمتعلق بقانون المالية التكميلي لتصرّف سنة 1984، عوضا عن الأداء شبه الجبائي الوحيد على الخمور والجعة والمشروبات الكحولية. وقد ألغى هذه الفصولَ الفصلُ 7 من القانون عدد 62 لسنة 1988 المؤرخ في 2 جوان 1988، فحلّ محلّها المعلوم على الاستهلاك. نظام تاريخي.",

 "taxe-effet-equivalent": {
  "autre": "Taxe d'effet équivalent",
  "definition": "أداء يوظَّف على البضاعة بمناسبة توريدها أو تصديرها دون أن يكون معلوما ديوانيا. ويمنع الاتفاق المؤسس للشراكة لسنة 1995 إحداث أداءات جديدة منها في المبادلات بين الطرفين (الفصل 8)، وتمكّن مجلة الديوانة لسنة 2008 عند التصدير من إرجاع المعاليم الديوانية والأداءات ذات الأثر المماثل المستخلصة عند توريد البضاعة أو توريد المواد الأوّلية الداخلة في تركيبها (الفصل 298).",

 "taxe-forfaitaire-annuelle-tva": {
