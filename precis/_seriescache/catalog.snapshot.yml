    2000, 7 484 en 2020). Les libellés diffèrent d''une planche à l''autre dans la
    source (« travailleurs à faible revenu » côté actifs, « faibles revenus » côté
    pensionnés) et sont canonisés. ANOMALIE DE LA SOURCE en 2000 : les six légendes
    totalisent 1 012 220 quand le total publié est 1 013 483 (écart 0,125 %), et une
    part de 0,32 % du camembert n''a pas de légende. Le bouclage de 2020 est exact.'
  titre_ar: 'الصندوق الوطني للضمان الاجتماعي: المضمونون النشطون وأصحاب الجرايات حسب
    النظام، 2000 و2020'
  unite_ar: أشخاص
  perimetre_ar: ثمانية أنظمة سنة 2020، وستّة سنة 2000
  caveats_ar: 'تاريخان لا سلسلة: لا ينشر الصندوق التوزيع حسب النظام إلّا لسنتَي 2000
