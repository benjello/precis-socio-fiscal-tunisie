    132 du 2 décembre 2022, fascicule absent du corpus et de pist.tn ; adresse et
    empreinte dans la série). AUCUN RACCORD NI INTERPOLATION : série en paliers, une
    ligne par date d''effet lue ; tracé en escalier permis à l''intérieur d''un segment,
    jamais d''un segment à l''autre. Les grilles de 1990-1992 excluent l''indemnité
    complémentaire provisoire (décrets n° 81-437 et n° 82-501) et ne se comparent
    pas au SMIG (`comparable_au_smig` = non, rapport vide) ; non lus : avenants antérieurs
    à 1990, 1993, bâtiment 1991-1995. Conventions d''origine : date d''effet du 1er
    juin 1974 pour les deux (articles 53 et 58), qui est celle de la convention et
    non une date imprimée sur la grille. SALAIRES DE BASE, hors indemnités conventionnelles.
    Régime horaire du textile à confirmer. Aucune case vide. Ce qui reste à contrôler
    est dans `reserve` (grille du textile du 15 juin 2005 « à titre exceptionnel »
    ; avenant n° 16 du bâtiment lu sur une reproduction tierce ; date de notice du
    fascicule du bâtiment de 2011) ; ce que la relecture a lu ou confirmé est dans
    `relecture`. Les assurances (salaire mensuel, régime de 40 heures) sont dans la
    série sœur `conventions-collectives-assurances-salaire`. SMIG : montants de la
    série `smig-smag`, décrets non relus. Deux branches seulement. Ligne du textile
    au 1er janvier 2026 : grille de l''avenant n° 18 ; effet du décret n° 2026-68
    non tranché.'
