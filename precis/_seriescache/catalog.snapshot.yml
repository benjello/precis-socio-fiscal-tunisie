- id: bct-programmes-emploi-dotations
  titre: Dotations des programmes de soutien à l'emploi, 1987-2008 (tableau du Rapport
    annuel de la BCT)
  sources:
  - bct-ra
  build: scripts/extract_bct_programmes_emploi.py:main
  raw:
  - data/raw/bct-archives/109
  output: data/processed/bct-archives/programmes_emploi_dotations.csv
  unite: millions de dinars courants
  perimetre: 'BCT, rapports annuels 1988 à 2008, chapitre « L''emploi et les salaires
    », tableau « Programmes de soutien à l''emploi » (« … et de promotion des revenus
    » de 1988 à 1990) : toutes les lignes du tableau et son total — chantiers nationaux
    et régionaux (PRD, PCRD, PDRI, autres chantiers), aide à la création et à la consolidation
    de l''emploi (PDRI, PRD, PDUI, Fonds de solidarité nationale, FONAPRA, Fonds national
    de l''emploi 21-21), FOPRODI, programmes d''insertion (SIVP 1 et 2, FIAP, CEF)
    ; une ligne par année et par ligne du tableau, avec l''édition retenue et sa page'
  caveats: 'SÉRIE RECONSTITUÉE : chaque édition n''imprime que deux à cinq années
    ; la série est recollée à travers 21 éditions, toutes relues à l''image. ARBITRAGE
    : la dernière édition qui imprime l''année fait foi, ligne par ligne ; les 301
    valeurs écartées sont dans programmes_emploi_dotations_conflits.csv et la transcription
    complète, avec le titre, l''unité, la source et la page de chaque édition, dans
    programmes_emploi_dotations_editions.csv. RELAIS : la BCT cite la direction générale
    des ressources humaines du ministère du Plan (1988-1991), le ministère du Plan
    et du Développement régional « et BCT » (1992-1993), le ministère du Développement
    économique (1994-1995), puis ce ministère et le Commissariat général au développement
    régional (1996-2001), puis les ministères du Développement et de la coopération
    internationale et de l''Emploi (2002-2008). DOTATIONS, NON DÉPENSES CONSTATÉES
    : le tableau ne qualifie pas la grandeur ; la prose parle de « dotation budgétaire
    », d''« enveloppe » allouée ou engagée, de « montant alloué ». RÉVISIONS FORTES
    : chantiers nationaux de 1992 imprimés 23,9, puis 35,1, puis 37,6 ; chantiers
    régionaux de 2003, 29,6 (édition 2003) puis 92,0 (éditions 2004 à 2006, dont la
    prose confirme « 144 MDT en 2003 » pour l''ensemble des chantiers) ; Fonds 21-21
    de 2000, 60,0 puis 58,4. LE TOTAL N''EST PAS LA SOMME DES PROGRAMMES RETENUS :
    (1) il comprend des programmes de développement régional, rural et urbain et des
    fonds d''aide à l''artisanat, non les seuls dispositifs d''emploi ; (2) la série
    arbitrée juxtapose des éditions différentes et ne s''additionne pas dans l''année
    en 1987-1990 (lignes des tableaux de 1988-1990 à côté du total de 1991-1994),
    1992-1994 (lignes propres aux tableaux de 1991-1994 à côté de celles de 1995-1997)
    et 2007 (rubrique d''aide à la création révisée à 119,0 par l''édition 2008, lignes
    de l''édition 2007 qui font 118,2) ; la colonne `derniere_edition` dit si la ligne
    vient de la dernière édition qui imprime l''année, et toute addition se fait dans
    programmes_emploi_dotations_editions.csv, à l''intérieur d''une même édition,
    où le script et le test vérifient chaque rubrique contre toutes ses lignes. TROIS
    STRUCTURES (colonne `structure`) : A, éditions 1988-1990 ; B, éditions 1991-1994
    ; C, éditions 1995-2008 ; leurs totaux ne recouvrent pas le même périmètre (1987
    : 83,8 dans A, 50,8 dans B) et le total change de composition entre 1993 (B) et
    1994 (C). PRD ET PDRI SOUS DEUX RUBRIQUES dans la structure C : l''identifiant
    porte la rubrique, ne pas les additionner sans le vouloir. TOTAL DE 1992 ET 1993
    : les éditions 1995 et 1996 n''en impriment pas ; le total retenu vient de l''édition
    1994 (structure B) alors que les lignes de ces années viennent de la structure
    C. ÉCARTS DE LA SOURCE : dans l''édition 1999, la ligne des chantiers régionaux
    de 1997 et 1998 n''a pas suivi la révision de ses composantes. « - » ET « .. »
    imprimés : case vide, signe gardé dans `mention`. Les éditions 1986 et 1987 n''ont
    pas le tableau, celle de 1985 en a un autre (dépenses directes de l''État, 1983-1985),
    et il disparaît après l''édition 2008.'
  titre_ar: اعتمادات برامج دعم التشغيل، 1987-2008 (جدول التقرير السنوي للبنك المركزي
    التونسي)
  unite_ar: بملايين الدنانير بالأسعار الجارية
  perimetre_ar: 'التقارير السنوية للبنك المركزي التونسي من 1988 إلى 2008، باب التشغيل
    والأجور، جدول «برامج دعم التشغيل»: كلّ أسطر الجدول ومجموعه — الحضائر الوطنية والجهوية،
    المساعدة على إحداث مواطن الشغل ودعمها (برنامج التنمية الريفية المندمجة، البرنامج
    الجهوي للتنمية، برنامج التنمية الحضرية المندمجة، صندوق التضامن الوطني، الصندوق
    الوطني للنهوض بالصناعات التقليدية والمهن الصغرى، الصندوق الوطني للتشغيل 21-21)،
    وبرامج الإدماج في الحياة المهنية (تربّصات الإعداد للحياة المهنية SIVP 1 و2، صندوق
    الإدماج والتأهيل المهني FIAP، عقود التشغيل والتكوين CEF)؛ سطر لكلّ سنة ولكلّ بند،
    مع الطبعة المعتمدة وصفحتها'
  caveats_ar: 'سلسلة معاد تركيبها: لا تطبع كلّ طبعة سوى سنتين إلى خمس سنوات، وقد جُمعت
    عبر 21 طبعة قُرئت كلّها على الصورة. الترجيح: تُعتمد آخر طبعة تطبع السنة، بنداً
    بنداً، وتُدوَّن القيم المستبعدة في ملفّ الاختلافات. البنك المركزي ناقل لا منتج:
    يذكر تحت الجدول وزارة التخطيط ثمّ وزارة التنمية الاقتصادية والمندوبية العامة للتنمية
    الجهوية ثمّ وزارتي التنمية والتعاون الدولي والتشغيل. المبالغ اعتمادات مرصودة لا
    نفقات منجزة. المراجعات كبيرة أحياناً: الحضائر الوطنية لسنة 1992 طُبعت 23,9 ثمّ
    35,1 ثمّ 37,6. المجموع ليس مجموع البرامج المعتمدة: يشمل برامج تنمية جهوية وريفية
    وحضرية، ثمّ إنّ السلسلة المرجَّحة تجمع بين طبعات مختلفة فلا تتطابق مجاميعها داخل
    السنة الواحدة في 1987-1990 و1992-1994 و2007؛ يبيّن العمود derniere_edition هل
    السطر من آخر طبعة تطبع السنة، ولا يُجمع إلا داخل الطبعة الواحدة في ملفّ الطبعات.
    للجدول ثلاث هيئات متعاقبة (العمود structure) لا تتطابق مجاميعها، ويتغيّر تركيب
    المجموع بين 1993 و1994. يرد البرنامج الجهوي للتنمية وبرنامج التنمية الريفية المندمجة
