- id: fonction-publique-salaires-2015-2025
  titre: Salaire mensuel moyen de la fonction publique, 2015-2025 (série raccordée)
  sources:
  - ins-fonction-publique-2021
  - ins-fonction-publique-2025
  build: scripts/extract_ins_fonction_publique_2018_2025.py:composite
  raw:
  - data/raw/ins-fonction-publique-salaires-2010-2021/tab18_0.xlsx
  - data/raw/ins-fonction-publique-2018-2025/La fonction publique - 2018-2025.pdf
  output: data/processed/ins-fonction-publique-2018-2025/salaire_mensuel_evolution_2015_2025.csv
  unite: dinars courants / mois
  perimetre: 'NIVEAUX SEULEMENT, trois indicateurs (brut avec contributions, brut
    sans contributions, net) ; 2015-2017 : tab18 de l''enquête 2010-2021 ; 2018-2025
    : tableau 10 du rapport 2018-2025 ; la colonne `source` le dit ligne à ligne'
  caveats: 'SÉRIE RACCORDÉE. ARBITRAGE : le millésime le plus récent fait foi sur
    2018-2020 ; les valeurs de tab18 écartées sont listées dans la fiche. Chaque indicateur
    est raccordé à lui-même — jamais un brut avec contributions à un brut sans. Le
    raccord laisse une marche d''environ un dinar entre 2017 et 2018 (révision du
    millésime 2025 non reportée sur 2015-2017) : le taux 2017→2018 recalculé sur la
    série vaut 2,8 % pour le brut avec contributions et 2,9 % sans, contre 2,9 % et
    3,0 % publiés ; pour le net il vaut 3,4 %, comme publié. Les taux d''accroissement
    ne sont PAS repris : les lire dans les séries homogènes `fonction-publique-salaires`
    et `fonction-publique-salaires-2018-2025`.'
  titre_ar: متوسط الأجر الشهري في الوظيفة العمومية، 2015-2025 (سلسلة موصولة)
