    000 ou 465 397 enfants à la rentrée de 2022. La date du tableau des indicateurs
    est celle de l''arrêté du rapport, le commentaire en donne souvent une autre :
    les deux sont versées. `qualificatif` (« over », « about ») : une borne n''est
    pas une valeur. ANOMALIES IMPRIMÉES GARDÉES : « 209.60 » ménages (ISR08116, p.
    13) ; 463 903 enfants « under the age of six » (p. 2, coquille pour 6-18 ans)
    ; 868 172 enquêtes sociales répété à l''identique d''un rapport à l''autre. Unités
    non homogènes d''une pièce à l''autre (« ménages » à la Banque, « bénéficiaires
    » au ministère). Série de points, non série annuelle : rien n''est interpolé.
    Pilote des 6-18 ans sur don (2022-2024), puis allocation légale (2026) : rupture
    de nature. Enquêtes de satisfaction (IBM) hors série.'
