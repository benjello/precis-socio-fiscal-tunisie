    و7 484 سنة 2020). وتختلف التسميات بين اللوحتين في المصدر نفسه، فوُحِّدت. خلل داخل
    المصدر سنة 2000: تبلغ الأنظمة الستّة 1 012 220 بينما المجموع المنشور 1 013 483
    (فارق 0,125 %)، وتظهر حصّة 0,32 % من الرسم دون تسمية. أمّا سنة 2020 فالمجموع مطابق.'
  fiche: sources/cnss-donnees-statistiques.md
