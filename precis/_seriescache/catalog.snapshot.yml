- id: cnss-pyramide-smig-2000-2018
  titre: 'CNSS : salariés du RSNA par classe de salaire mensuel déclaré en multiples
    du SMIG, 2000-2018, mesure annuelle et mesure trimestrielle de 2018'
  sources:
