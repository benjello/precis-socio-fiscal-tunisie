    rapprochées par la position (tableau 8 du rapport) ; les quatorze lignes redonnent
    le total du tableau 1 chaque année
  caveats: 'EN AGENTS, non en milliers. NON RACCORDABLE à `ins-ministere-effectifs`
    (2015-2021) : sur les années communes, le rapport 2025 RÉVISE la répartition à
    total inchangé. Environ 9 000 agents passent des « Autres établissements » au
    ministère de l''intérieur (intérieur 2018 : 87,3 milliers dans l''enquête, 96
    286 agents ici ; autres établissements : 55,6 milliers contre 46 892) ; la Présidence
    du gouvernement perd environ 500 agents (2,2 milliers contre 1 684), la Justice
    en gagne environ 400, les Finances en perdent environ 300. L''INS ne commente
    pas ce reclassement. Défense, Éducation, Agriculture et collectivités locales
    concordent à l''arrondi.'
  titre_ar: أعداد أعوان الوظيفة العمومية حسب الوزارة، 2018-2025
  unite_ar: أعوان
  perimetre_ar: الوحدات الأربع عشرة نفسها وبالترتيب نفسه كما في سلسلة 2015-2021، مرتّبة
    حسب الموقع (الجدول 8 من التقرير)؛ ومجموع الأسطر الأربعة عشر يساوي مجموع الجدول
    1 كلّ سنة
  caveats_ar: 'بعدد الأعوان لا بالآلاف. لا تُوصل بسلسلة 2015-2021: في السنوات المشتركة
    يراجع تقرير 2025 التوزيع مع ثبات المجموع. ينتقل نحو 9000 عون من «هياكل أخرى» إلى
    وزارة الداخلية (الداخلية 2018: 87,3 ألفاً في المسح و96286 عوناً هنا؛ الهياكل الأخرى:
    55,6 ألفاً مقابل 46892)؛ وتفقد رئاسة الحكومة نحو 500 عون (2,2 ألف مقابل 1684)،
    وتكسب العدل نحو 400، وتفقد المالية نحو 300. لا يفسّر المعهد الوطني للإحصاء هذا
    التصنيف الجديد. الدفاع والتربية والفلاحة والجماعات المحلية متطابقة بفارق التقريب.'
