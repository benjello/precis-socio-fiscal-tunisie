  unite: dinars courants, tels qu'imprimés ; valeur_md en millions de dinars
  perimetre: 'BCT, Rapport annuel, états financiers de la Banque, note sur les comptes
    du Gouvernement, tableau des « flux des ressources et des emplois des Fonds FOPRODI
    et FONAPRA constatés durant l''exercice », éditions 2017 à 2025 : solde initial,
    ressources (dotations budgétaires, recouvrements), emplois, solde final ; une
    ligne par (fonds, exercice, poste, édition) ; `derniere_edition` marque l''attestation
    la plus récente'
  caveats: 'COMPTABLE, non budgétaire : compte tenu par la BCT pour l''État. PÉRIMÈTRE
    : tout ce que paie le fonds — primes, prises en charge, dotations remboursables
    et participations (les recouvrements en sont les remboursements) ; ce n''est pas
    la seule prime de développement régional, et la série NE S''ADDITIONNE PAS à gbo-avantages-financiers-par-rapport,
    qui recense les mêmes paiements par avantage. Chaque exercice figure dans deux
    éditions (sauf 2016 et 2025) qui s''accordent au dinar ; les deux sont gardées.
    Identités contrôlées : dotations + recouvrements = ressources (un dinar d''écart
    imprimé pour le FOPRODI en 2020) ; solde initial + ressources − emplois = solde
    final ; solde final = solde initial suivant. Tiret ou case vide = 0 (colonne `imprime`).
    RELU À L''IMAGE (neuf tableaux). Les éditions 2015 et 2016 ne portent pas ce tableau
    : AUCUN RACCORD avec bct-programmes-emploi-dotations (FOPRODI 1987-1991, crédits)
    ; 1992-2015 non établi. Montants courants.'
