  - data/raw/ins-fonction-publique-salaires-historiques/Caractéristiques des agents
    de la fonction publique et leurs salaires 2011-2015.pdf
  - data/raw/ins-fonction-publique-salaires-historiques/Caractéristiques des agents
    de la fonction publique et leurs salaires 2012-2016.pdf
  - data/raw/ins-fonction-publique-salaires-historiques/Caractéristiques des agents
    de la fonction publique et leurs salaires 2013-2017.pdf
  - data/raw/ins-fonction-publique-salaires-2010-2021/tab18_0.xlsx
