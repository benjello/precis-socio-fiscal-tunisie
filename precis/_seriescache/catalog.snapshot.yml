  unite: dinars courants par tonne équivalent pétrole (DT/tep), pouvoir calorifique
    supérieur (PCS) sauf pour le rapport de contrôle, qui ne le dit pas
  perimetre: 'quatre familles, une ligne par (famille, année) : `prix_de_cession`
    — prix administré auquel la STEG reçoit le gaz de la SOTUGAT et de l''ETAP, 90,8
    DT/tep fixé le 8 octobre 1993, 1993-2014 ; `rapport_de_controle_2014` — « prix
    moyen d''achat de la tep », rapport du Contrôle général des finances du 21 juillet
    2014, p. 72, 2007-2013 ; `etats_financiers_steg` — « prix moyen annuel d''achat
    de la TEP gaz », états financiers 2014 à 2023 (exercices 2013-2023) ; `observatoire_import_gaz_algerien`
    — « prix d''importation du gaz algérien », Observatoire national de l''énergie,
    2013-2025'
  caveats: 'FAMILLES JAMAIS CHAÎNÉES : filtrer `famille`. LE PRIX DE CESSION EST UN
    PRIX ADMINISTRÉ, non un prix d''achat : 90,8 constant 1993-2014, acte du 8 octobre
    1993 non identifié ; il disparaît en 2015 (colonne `rupture`). LE PRIX MOYEN DE
    LA STEG PORTE SUR TOUTES LES SOURCES (gaz algérien acheté, redevance, gaz national,
    condensats) et son numérateur comprend le fuel et le gazole ; celui de l''Observatoire
    ne porte que sur l''importation du gaz algérien (redevance exclue) : NE PAS LES
    SUPERPOSER COMME UNE MÊME GRANDEUR. Proches de 2018 à 2020 (805,5 contre 863,5
    ; 933,2 contre 977 ; 622,7 contre 626), ils se croisent à partir de 2021 (719,5
    contre 697 ; 1 471,6 contre 1 335 ; 1 423,9 contre 1 321) sans que les notes l''expliquent.
    RUPTURES (colonne `rupture`) : 2007, la STEG comptabilise le gaz à sa valeur économique
    et la subvention indirecte en produit (états financiers 2014, note 11, p. 23)
    ; 2015, fin du prix de cession, subvention budgétaire. Le rapport de contrôle
    (2007-2013) et les états financiers (2013-2023) se recouvrent en 2013 (808 et
    804,4) : deux sources, pas de raccord. Rien avant 1993 ni pour 2024-2025 dans
    les états financiers (non publiés). Dinars courants, aucun PIB. Voir docs/steg-gaz-electricite.md.'
  titre_ar: 'سعر اقتناء الطن المعادل للنفط من الغاز من قبل الشركة التونسية للكهرباء
    والغاز: سعر الإحالة المضبوط (1993-2014) ومتوسط سعر الاقتناء حسب تقرير الرقابة
    لسنة 2014 (2007-2013) وحسب القوائم المالية للشركة (2013-2023) وسعر توريد الغاز
    الجزائري حسب المرصد الوطني للطاقة (2013-2025)'
  unite_ar: بالدينار الجاري للطن المعادل للنفط (د/ط.م.ن)، حسب القدرة الحرارية العليا
  perimetre_ar: 'أربع عائلات لا تُربط: سعر الإحالة (90,8 د/ط.م.ن منذ 8 أكتوبر 1993)،
    متوسط سعر الاقتناء حسب تقرير هيئة الرقابة العامة للمالية (2007-2013) وحسب القوائم
    المالية للشركة (2013-2023)، وسعر توريد الغاز الجزائري حسب المرصد الوطني للطاقة
    (2013-2025)'
  caveats_ar: 'العائلات لا تُربط. سعر الإحالة سعر مضبوط لا سعر اقتناء. متوسط سعر الشركة
    يشمل كل المصادر ولا يوضع على نفس مستوى سعر التوريد الذي يخص الغاز الجزائري المُورَّد.
    قطيعتان: 2007 (احتساب الغاز بقيمته الاقتصادية) و2015 (نهاية سعر الإحالة). بالدينار
    الجاري، دون ناتج محلي إجمالي.'
