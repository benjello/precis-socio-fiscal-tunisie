  base_pib: 1983 / 1997 / 2015 (colonne base) ; année de prix en colonne annee_de_prix
  caveats: 'PLUSIEURS TAUX POUR UNE MÊME ANNÉE : filtrer `source`, `base` et `annee_de_prix`.
    UNE ANNÉE DE PRIX N''EST PAS UNE BASE : un taux en volume dépend de la base des
    comptes et de l''année dont les prix valorisent le volume. Les sources tunisiennes
    s''accordent à quelques dixièmes de point ; la Banque mondiale s''en écarte de
    6 à 22 points en 1962-1965 (signe contraire), de 1 à 2 points en 1986-1990 et
    en 2001. 1970 n''a de taux que de la Banque mondiale. Taux imprimés à une décimale
    quand `mode` = imprimé. Voir docs/pib-croissance-volume.md.'
  titre_ar: نموّ الناتج المحلي الإجمالي بالحجم، كل المصادر، حسب الأساس وسنة الأسعار،
    1961-2025
