    في الجدول 11 بفارق لا يتجاوز 0,2 دينار في السنوات الثماني، والجدول 11 مرجّحاً
    يعطي الأجر الخام دون المساهمات في الجدول 10، وهي تسمية يصرّح بها المعهد. لا تُوصل
    بسلسلة 2015-2020 (الجدول 20 من مسح 2010-2021) وهي أجر خام مع المساهمات، رغم تطابق
    الأعداد حسب الصنف على 2018-2020: أ1 سنة 2018 = 2561,4 هناك و2175,3 هنا. تختلف
