  titre_ar: الأجر الشهري الخام دون المساهمات للموظفين حسب الصنف القانوني، 2018-2025
  unite_ar: دينار جاري / شهر
  perimetre_ar: الموظفون، ستة أصناف قانونية من أ1 إلى د (الجدول 12 من التقرير)؛ بالتسميات
