  unite_ar: بملايين الدنانير الجارية
  perimetre_ar: 'عائلة واحدة، سطر لكل سنة من 2013 إلى 2023: «مشتريات المحروقات» في
    إيضاح «كلفة المبيعات» من القوائم المالية للشركة، مع المصدر والصفحة وطريقة القراءة
    والمقارنات. وهي بسط «متوسط السعر السنوي لاقتناء الطن المعادل للنفط من الغاز» في
    سلسلة سعر اقتناء الغاز.'
  caveats_ar: 'الفاتورة تشمل الفيول والغازوال وليست فاتورة الغاز وحده. الكمية المستنتجة
    (الفاتورة مقسومة على متوسط السعر المنشور) هي «مجموع مشتريات الغاز» في التقارير
    السنوية. 2016 مطبوعة بالوحدة (2093). فارق 2017: 3160,7 حسب جدول القوائم المالية
    2018 بالدينارات الدقيقة، بينما تطبع القوائم المالية 2017 الرقمين 3159,7 و3160,6.
    قطيعة 2015: نهاية سعر الإحالة. بالدينار الجاري ودون ناتج داخلي خام.'
  fiche: docs/steg-gaz-electricite.md
- id: pib-courant-par-base
  titre: PIB aux prix courants, base par base (1983, 1997, 2015), 1986-2025
  sources:
  - ins-cnat-2015
  - ins-pib-base-2015-2010-2020
  - undata-sna
  - minfin-indicateurs-fp
  build: tunisia_data.build.pib:main
  raw:
  - data/raw/ins-publications/comptes-de-la-nation/INS_2021-08-15_donnees_annuelles_base_2015_2010-2020.xlsx
  - data/raw/minfinances/indicateurs_fp_2025.xls
  - data/processed/ins-comptes-nationaux/pib_nominal_editions.csv
  - data/processed/ins-comptes-nationaux/pib_undata.csv
  output: data/processed/ins-comptes-nationaux/pib_courant_par_base.csv
  unite: millions de dinars courants
  perimetre: 'une ligne par (année, base) : base 2015 de 2010 à 2025 (2010-2014 rétropolées
    par l''INS, classeur du 15 août 2021 ; ensuite l''édition la plus récente des
    Comptes de la nation), base 1997 de 1997 à 2017 (1997-2004 rétropolées, connues
    par UNdata ; ensuite les éditions), base 1983 de 1992 à 2009 (UNdata et éditions)
    ; plus les valeurs du PIB du ministère des Finances qui ne se rattachent à aucune
    base (1986-1991 : base 1983 présumée ; 2002-2004 et 2025 : non rattachées). Colonnes
    `source`, `publication`, `retropole`, `provenance`, `repris_par_minfin`'
  base_pib: 1983 / 1997 / 2015 (colonne base)
  caveats: 'TROIS BASES, JAMAIS RACCORDÉES : filtrer `base`, ne jamais tracer d''un
    trait d''une base à l''autre. L''écart entre bases n''est pas constant (voir `pib-courant-recouvrements`).
    `retropole` : oui pour la base 2015 en 2010-2014 et la base 1997 en 1997-2004,
    non pour une année publiée dans une édition de sa base, « non précisé par la source
    » pour la base 1983 et le ministère. Aucune base dite avant 1992 ; rien en base
    1997 après 2017 ni en base 2015 avant 2010. Le classeur de l''INS est hors git.
    Voir docs/pib-courant-par-base.md.'
  titre_ar: الناتج المحلي الإجمالي بالأسعار الجارية حسب الأساس (1983، 1997، 2015)،
    1986-2025
  unite_ar: بملايين الدنانير الجارية
  perimetre_ar: 'سطر لكل سنة وأساس: أساس 2015 من 2010 إلى 2025 (2010-2014 معاد احتسابها
    من المعهد الوطني للإحصاء)، أساس 1997 من 1997 إلى 2017، أساس 1983 من 1992 إلى 2009،
    وقيم ناتج وزارة المالية غير المرتبطة بأي أساس'
  caveats_ar: 'ثلاثة أسس غير موصولة: تُفرز السلسلة حسب العمود base ولا يُرسم خط متصل
    من أساس إلى آخر. الفارق بين الأسس غير ثابت. لا يوجد أساس مذكور قبل 1992، ولا شيء
    على أساس 1997 بعد 2017 ولا على أساس 2015 قبل 2010.'
  fiche: docs/pib-courant-par-base.md
- id: ins-ipim-trimestriel
  titre: Indice des prix de l'immobilier (INS), base 2015 = 100, par type de bien,
    T1 2000 - T4 2025 (méthodologie révisée)
  sources:
  - ins-ipim
  build: scripts/build_ins_ipim.py:main
  raw:
  - data/raw/ins-publications/ipim/series
  output: data/processed/ins-ipim/ipim_trimestriel.csv
  unite: indice 2015 = 100 ; glissements en %
  perimetre: terrains à usage d'habitation, appartements, maisons, ensemble du bâti
    ; prix de transaction enregistrés, national ; édition du T4 2025
  caveats: 'Indices de prix de transaction (ventes enregistrées), par type de bien
    ; pas d''indice général dans cette série. Rupture de méthode : la publication
    a été interrompue en 2022-2023 pour révision, puis reprise au T1 2024 avec toute
    la série recalculée selon la nouvelle méthodologie ; elle ne se raccorde pas à
    la série de l''ancienne méthodologie (au T4 2021, terrains 152,75 contre 147,18,
    appartements 148,48 contre 149,84, maisons 135,81 contre 136,71). Les prix sont
    déclarés et leurs valeurs sont révisables : un même trimestre diffère légèrement
    d''une édition du classeur à l''autre (T1 2000, terrains : 39,909 dans l''édition
    du T4 2025, 39,891 dans celle du T1 2024). Les valeurs données sont celles de
    l''édition du T4 2025.'
  fiche: data/processed/ins-ipim/ipim_trimestriel.csv.yml
