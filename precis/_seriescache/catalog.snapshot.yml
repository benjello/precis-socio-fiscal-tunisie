  build: scripts/extract_ipc_longue.py:main
  raw:
  - data/raw/ins-publications/annuaire-statistique
  output: data/processed/ins-publications/ipc_annuaires_base1970.csv
  unite: indice, base 100 en 1970 (moyenne annuelle)
  perimetre: colonne de base 1970 du tableau « Évolution de l'indice général des prix
    à la consommation familiale selon les différentes bases » des annuaires 1995-2001,
    1998-2002 et 1999-2003 (tableau 13.7) et 2019-2023 (tableau 13.6), une ligne par
    annuaire et par année, telle qu'imprimée
  caveats: 'SÉRIE HOMOGÈNE, SOURCE DE LA PARTIE 1976-2023 DE `ipc-longue-periode`,
    AVEC TOUTES LES LECTURES, Y COMPRIS CELLES QUE LA SÉRIE RACCORDÉE ÉCARTE : la
    colonne `retenu` dit laquelle celle-ci reprend (le plus récent annuaire fait foi).
    Les coquilles et valeurs provisoires sont conservées telles qu''imprimées : l''annuaire
    1995-2001 imprime 108,2 pour 1985 (288,0 dans les suivants) et 645,4, provisoire,
    pour 2001 (640,5 ensuite). LU PAR LE PROGRAMME (pdftotext) ; le script contrôle
    cinq valeurs attendues et le recollement de l''annuaire 2019-2023 aux précédents
    en 1999, 2001 et 2003. Les lectures obtenues commencent en 1976 (annuaire 1995-2001),
    1983 (1998-2002), 1984 (1999-2003) et 1999 (2019-2023) ; avant 1976, la série
    raccordée prend les rapports de la BCT (`bct-cout-de-la-vie`). Les autres annuaires
    présents dans data/raw/ins-publications/annuaire-statistique/ ne sont pas lus.'
  titre_ar: الرقم القياسي العام لأسعار الاستهلاك العائلي، أساس 100 سنة 1970، كما ورد
    في كلّ حوليّة إحصائية للمعهد الوطني للإحصاء، 1976-2023
  unite_ar: رقم قياسي، أساس 100 سنة 1970 (معدّل سنوي)
  perimetre_ar: عمود أساس 1970 من جدول تطوّر الرقم القياسي العام لأسعار الاستهلاك
    العائلي حسب مختلف سنوات الأساس، في حوليّات 1995-2001 و1998-2002 و1999-2003 (الجدول
    13.7) و2019-2023 (الجدول 13.6)، سطر لكلّ حوليّة ولكلّ سنة، كما طُبع
  caveats_ar: 'سلسلة متجانسة هي مصدر الجزء 1976-2023 من السلسلة الطويلة، بكلّ القراءات
    بما فيها المستبعدة: يبيّن العمود `retenu` القيمة المعتمدة (أحدث حوليّة هي المرجع).
    الأخطاء المطبعية والقيم الوقتية محفوظة كما طُبعت: حوليّة 1995-2001 تطبع 108,2
    لسنة 1985 (288,0 في الحوليّات اللاحقة) و645,4 الوقتية لسنة 2001 (ثمّ 640,5). قراءة
    آلية مع مراقبة خمس قيم وتطابق حوليّة 2019-2023 مع سابقاتها.'
  fiche: sources/ins-annuaires-statistiques.md
- id: finances-locales-communes-agregats
  titre: 'Finances des communes : exécution du budget, impôts locaux, FCCL et dotations,
    2008-2023'
  sources:
  - dgct-donnees-ouvertes
  build: uv run --with openpyxl --with xlrd python scripts/build_finances_locales_communes.py
  raw:
  - data/raw/finances_locales/dgct_portail/Données-Financières-Globales.xls
  - data/raw/finances_locales/dgct_portail/fiscaliteslocale.xls
  - data/raw/finances_locales/dgct_portail/fccl.xls
  - data/raw/finances_locales/dgct_portail/Dotation.xls
  - data/raw/finances_locales/dgct_portail/Les-dépenses-ordinaires.xls
  - data/raw/finances_locales/dgct_portail/Ratios-financiers.xls
  output: data/processed/finances_locales/communes_agregats_2008_2023.csv
  unite: millions de dinars courants (MD) ; ratios en fraction
  perimetre: 'communes (budgets, comptabilité publique, réalisations) ; quotes-parts
    FCCL et dotation exceptionnelle aussi pour les conseils régionaux. 2008-2019 :
    agrégats publiés par la DGCT (communes_dgct_agregats_2008_2019.csv) ; 2018-2023
    : somme des 350 budgets par commune. Colonnes source, statut, retenu.'
  caveats: 'DEUX SOURCES, GARDÉES TOUTES DEUX SUR 2018-2019 (colonne `retenu` : DGCT
    jusqu''en 2019, somme des communes ensuite). Les recettes concordent à l''arrondi
    près ; LES DÉPENSES NON (titre 1 : +1,7 MD en 2018, +7,2 MD en 2019 ; titre 2
    : +0,6 et +5,9), écart non expliqué, figé dans les tests. 2021 = SITUATION AU
    25/12/2021, non définitive (droits et redevances 54,8 MD contre 90-114 les autres
    années). 2023 = PROVISOIRE (arrêté au 10/01/2024). IMPÔTS UN À UN (TIB, TNB, TCL,
    taxe hôtelière, marchés) VIDES EN 2020-2021 : fichiers par commune sans détail
    d''article ; rien n''est interpolé. Le FCCL est supprimé au 1er janvier 2018 mais
    la DGCT garde l''intitulé « subventions annuelles » en 2018-2019 : rupture de
    nature ; réserve à 18 % jusqu''en 2017, 15 % ensuite. Les recettes du titre 2
    comprennent l''épargne et les excédents reportés du titre 1 : T1 + T2 n''est pas
    un total consolidé. Recettes fiscales = catégories 1 et 2 (nomenclature 2018-2022),
    qui exclut les catégories 3-4 rangées parmi les recettes fiscales en 2023. PÉRIMÈTRE
    NON CONSTANT : 264 communes en 2012, 350 à partir de 2016-2017. Montants courants.'
  titre_ar: 'مالية البلديات: تنفيذ الميزانية والجباية المحلية والمال المشترك للجماعات
    المحلية والاعتمادات، 2008-2023'
  unite_ar: بملايين الدنانير الجارية؛ النسب كسور
  perimetre_ar: البلديات (ميزانيات، محاسبة عمومية، إنجازات)؛ 2008-2019 مجاميع منشورة
    من الإدارة العامة للجماعات المحلية، و2018-2023 مجموع ميزانيات البلديات الـ350
  caveats_ar: مصدران محفوظان معاً على 2018-2019 (عمود retenu). تتطابق الموارد بعد
    التقريب ولا تتطابق النفقات (فارق غير مفسَّر). 2021 وضعية في 25/12/2021 غير نهائية،
    و2023 وقتية (10/01/2024). الأداءات واحداً واحداً فارغة في 2020-2021 ولا يُستكمل
    شيء. أُلغي المال المشترك في 1 جانفي 2018 مع بقاء التسمية في 2018-2019. موارد العنوان
    الثاني تشمل الفوائض المنقولة من العنوان الأول. عدد البلديات غير ثابت (264 سنة
    2012 ثمّ 350). مبالغ جارية.
  fiche: sources/finances-locales-communes.md
