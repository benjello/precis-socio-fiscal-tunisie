  unite: millions de dinars courants ; indice 100 en 2015 ; % par an
  perimetre: 'cinq variantes (colonne `variante`) : `accolee` (niveaux publiés mis
    bout à bout, 1961-2025), `ins_base_1983` (1992-2009), `ins_base_1997` (1997-2017)
    et `ins_base_2015` (2010-2025), sur la profondeur publiée ou recalculée par l''INS,
    et `enchainee` (indice chaîné sur les taux de `pib-croissance-par-base`, 100 en
    2015, et niveau à la base 2015, 1961-2025) ; `construction` : publiée, rétropolée
    par l''INS, enchaînée par nos soins'
  base_pib: 1983 / 1997 / 2015 (colonnes base et variante)
  caveats: 'SÉRIE CONSTRUITE POUR ILLUSTRATION ; filtrer `variante`. LA VARIANTE ENCHAÎNÉE
    EST UNE CONSTRUCTION DU PRÉCIS, NON UNE DONNÉE DE L''INS : elle préserve la croissance,
    pas les niveaux ni les structures, ne remplace pas une rétropolation et ne doit
    servir de dénominateur à aucun ratio. La variante accolée porte deux taux FAUX
    (`croissance_fausse`) : + 20,34 % en 1997 (croissance + 9,61 %, changement de
    base + 9,79 %) et + 12,72 % en 2010 (croissance + 7,46 %, changement de base +
    4,89 %). Règle d''enchaînement : le taux de l''année est celui de la base la plus
    récente qui porte l''année et la précédente ; les années de jonction 2010 et 1997
    prennent donc leur taux dans l''ancienne base. Voir docs/pib-courant-enchaine.md.'
