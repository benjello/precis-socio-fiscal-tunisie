- id: masse-salariale-ratios
  titre: 'Masse salariale publique : ratios au PIB et aux dépenses, 1990-2025'
  sources:
  - minfin-remunerations
  - minfin-indicateurs-fp
  - ins-cnat-2015
  fetch: tunisia_data.sources.minfinances:download_repartition
  build: tunisia_data.build.masse_salariale:ratios_longs
  raw:
  - data/raw/minfinances/repartition_depenses.xls
  - data/raw/minfinances/indicateurs_fp_2025.xls
  output: data/processed/precis/masse_salariale_ratios_longs_1990_2025.csv
  unite: '% du PIB / % des dépenses (nominal, prix courants)'
  perimetre: masse salariale = budget de l'État (Rémunérations publiques), hors entreprises
    publiques
  titre_ar: 'كتلة الأجور العمومية: النسب إلى الناتج المحلي الإجمالي وإلى النفقات،
    1990-2025'
  unite_ar: '% من الناتج المحلي الإجمالي / % من النفقات (قيم جارية)'
  perimetre_ar: كتلة الأجور = ميزانية الدولة (الأجور العمومية)، باستثناء المنشآت العمومية
  base_pib: 2015
  caveats: docs/hypotheses-series-masse-salariale.md
  fiche: sources/minfinances-indicateurs.md
- id: masse-salariale-reconciliation
  titre: 'Réconciliation masse salariale/PIB : base 2015 vs base 2010 (FMI/BM)'
  sources:
  - minfin-remunerations
  - ins-cnat-2015
  - imf-tunisia-art4-2020
  - wb-tunisia-per-2020
  build: tunisia_data.build.masse_salariale:reconciliation_base
  raw:
  - data/raw/minfinances/repartition_depenses.xls
  output: data/processed/precis/masse_salariale_reconciliation_base.csv
  unite: '% du PIB (nominal)'
  perimetre: administration centrale
  titre_ar: 'مطابقة كتلة الأجور/الناتج المحلي الإجمالي: أساس 2015 مقابل أساس 2010
    (صندوق النقد/البنك الدولي)'
  unite_ar: '% من الناتج المحلي الإجمالي (اسمي)'
  perimetre_ar: الإدارة المركزية
  caveats: docs/reconciliation-masse-salariale-pib.md
  fiche: sources/minfinances-indicateurs.md
- id: fonction-publique-categories
