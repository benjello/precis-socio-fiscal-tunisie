- id: cnss-rsna-taux-equilibre
  titre: 'CNSS, régime des salariés non agricoles : taux de cotisation d''équilibre
    de la branche pensions et sa décomposition, 2000-2017 ; CAVIS (tout le privé),
    1980 et 1985-1991, sans raccord'
  sources:
  - cnss-annuaires-statistiques
  - bm-1993-social-protection
  build: scripts/build_cnss_rsna_taux_equilibre.py:main
  raw:
  - data/processed/caisses/cnss_rsna_annuaires.csv
  - data/processed/caisses/bm1993_caisses.csv
  output: data/processed/caisses/cnss_rsna_taux_equilibre.csv
  unite: taux, millions de dinars, dinars par mois, personnes
  perimetre: 'taux d''équilibre = pensions servies par le RSNA sans régime complémentaire,
    toutes natures ÷ masse salariale déclarée = taux de remplacement apparent (pension
    moyenne ÷ salaire moyen) × ratio pensionnés / cotisants (pensionnés de toutes
    natures, orphelins compris ÷ actifs, non-assujettis compris) ; variante avec régime
    complémentaire à part ; comparé au taux légal de la branche pensions selon deux
    lectures de l''article 5 b) du décret n° 74-499. Colonne `denominateur` : « annuaire
    CNSS : masse salariale déclarée au RSNA » (2000-2017) ; « Banque mondiale 1993
    : CAVIS, ensemble des régimes du privé ; cotisations de pension ÷ taux légal du
    RSNA » (1980 et 1985-1991), avec l''indicateur « pensions ÷ cotisations de pension
    », indépendant de tout taux'
  caveats: 'SÉRIE CALCULÉE. TAUX LÉGAL AMBIGU, EXPOSÉ EN DEUX COLONNES : la quote-part
    du taux global est fixée en vingtièmes (6,25/20e depuis le 1er janvier 1994, décret
    n° 94-1429 ; 7,25/20e depuis le 1er janvier 2003, décret n° 2003-1212) alors que
    le taux global est de 18 % depuis la loi n° 97-4. Lecture « en points » (celle
    de la caisse, qui publie 12,5 %) : 11,50 % puis 12,50 % ; lecture littérale (X/20
    × 18 %) : 10,875 % puis 11,775 %, cotisation propre de 5,25 % comprise. POUR 2000-2002
    AUCUN DOCUMENT DE LA CAISSE LU NE PUBLIE LE TAUX : 11,50 % est déduit du texte.
    DÉCLARÉ ≠ ENCAISSÉ : le dénominateur est la masse déclarée, non les cotisations
    recouvrées. NUMÉRATEUR COMPTABLE (« bilans »), DÉNOMINATEUR DÉCLARATIF. Le travail
    non déclaré est hors champ. La variante avec régime complémentaire ajoute des
    pensions financées par une cotisation facultative sur la tranche au-delà de six
    SMIG. RUPTURE DE 2003 (taxis et louages, décret n° 2002-3018). Le salaire moyen,
    rapporté aux actifs non-assujettis compris, est un peu plus bas que le salaire
    moyen publié. Pensions de l''année rapportées à des effectifs de fin d''année.
    1980 ET 1985-1991 : AUTRE SOURCE, AUTRE PÉRIMÈTRE, SANS RACCORD. Banque mondiale,
    rapport n° 11376-TUN (1993), annexe statistique, tableaux 3 et 5, série bm1993-caisses
    ; rien pour 1981-1984 ni pour 1992-1999. Les grandeurs sont celles de la CAVIS,
    qui servait les pensions de tout le secteur privé (RSNA et régimes conventionnels
    fusionnés ; salariés agricoles depuis 1981 ; régime agricole amélioré et Tunisiens
    à l''étranger depuis 1989 ; indépendants agricoles, date non établie), non du
    seul RSNA. Taux légal du RSNA : 3,75 % (décret n° 74-499, art. 9) + 1,25/20e (art.
    5 b), puis 4,25/20e à compter du 1er janvier 1988 (décret n° 88-1137) ; le taux
    global de la loi n° 60-30 étant de 20 %, les deux lectures coïncident : 5,00 %
    puis 8,00 % (8,00 % publiés au tableau 6 pour 1991). Masse = cotisations de pension
    de la CAVIS ÷ taux du RSNA, « équivalent RSNA », non déclarée : les autres régimes
    cotisant moins (5,25 % ; 7,5 %), τ* est un MAJORANT de 1988 à 1991 ; de 1981 à
    1987 les salariés agricoles cotisent 5,25 % contre 5 % (biais inverse, faible).
    Contrôle codé : la masse tirée des cotisations de la CNSS hors CAVIS (÷ 18,75
    %, puis 15,75 %) vaut 0,83 à 0,97 fois celle-ci, sans saut en 1988 (il valide
    la date et le niveau de la quote-part, non la lecture de la fraction). Régime
    complémentaire : la CAVIS le gérait aussi ; son inclusion dans les montants n''est
    pas connue, et le sens de l''erreur non plus. τ* : 3,2 % (1980), 6,0 % (1985),
    8,7 % (1987), 7,9 % (1991).'
  titre_ar: 'الصندوق الوطني للضمان الاجتماعي، نظام الأجراء في القطاع غير الفلاحي:
    نسبة المساهمة المحقّقة للتوازن في فرع الجرايات ومكوّناتها، 2000-2017؛ وصندوق تأمين
    الشيخوخة والعجز والباقين بقيد الحياة بعد وفاة المنتفع بجراية (كامل القطاع الخاص)،
    1980 و1985-1991، دون ربط'
  unite_ar: نسب، ملايين الدنانير، دنانير شهرياً، أشخاص
  perimetre_ar: 'نسبة التوازن = الجرايات المدفوعة دون النظام التكميلي، بجميع أصنافها
    ÷ كتلة الأجور المصرّح بها = نسبة التعويض الظاهرة (معدّل الجراية ÷ معدّل الأجر)
    × نسبة المنتفعين إلى المساهمين (المنتفعون بجميع الأصناف بمن فيهم الأيتام ÷ النشيطون
    بمن فيهم غير الخاضعين)؛ مع صيغة تشمل النظام التكميلي على حدة؛ وتُقارن بالنسبة
    القانونية لفرع الجرايات حسب قراءتين للفصل 5 (ب) من الأمر عدد 499 لسنة 1974؛ عمود
    المقام: «الكتاب الإحصائي للصندوق: كتلة الأجور المصرّح بها» (2000-2017)، و«البنك
    الدولي 1993: صندوق تأمين الشيخوخة والعجز والباقين بقيد الحياة بعد وفاة المنتفع
    بجراية، كامل القطاع الخاص؛ مساهمات التقاعد ÷ النسبة القانونية لنظام الأجراء غير
    الفلاحيين» (1980 و1985-1991)، مع مؤشّر «الجرايات ÷ مساهمات التقاعد» الذي لا يتوقّف
    على أيّ نسبة'
  caveats_ar: 'سلسلة محسوبة. النسبة القانونية ملتبسة وتُعرض في عمودين: الحصّة من النسبة
    الجملية محدّدة بأجزاء من عشرين (6,25/20 منذ غرّة جانفي 1994، الأمر عدد 1429 لسنة
    1994؛ 7,25/20 منذ غرّة جانفي 2003، الأمر عدد 1212 لسنة 2003)، في حين أنّ النسبة
    الجملية 18 % منذ القانون عدد 4 لسنة 1997. القراءة «بالنقاط» (قراءة الصندوق الذي
    ينشر 12,5 %): 11,50 % ثمّ 12,50 %؛ والقراءة الحرفية (س/20 × 18 %): 10,875 % ثمّ
    11,775 %، بما في ذلك المساهمة الخاصّة بالنظام وقدرها 5,25 %. لسنوات 2000-2002
    لا تنشر أيّ وثيقة مقروءة من وثائق الصندوق هذه النسبة: 11,50 % مستنتجة من النصّ.
    المصرّح به ليس المستخلص: المقام كتلة الأجور المصرّح بها لا الاشتراكات المستخلصة.
    البسط محاسبي (الموازنة) والمقام تصريحي. العمل غير المصرّح به خارج المجال. الصيغة
    التي تشمل النظام التكميلي تضيف جرايات تموّلها مساهمة اختيارية على شريحة الأجر
    التي تتجاوز ستّة أضعاف الأجر الأدنى. انقطاع سنة 2003 (سيارات الأجرة واللواج، الأمر
    عدد 3018 لسنة 2002). معدّل الأجر، محسوباً على النشيطين بمن فيهم غير الخاضعين،
    أدنى بقليل من المعدّل المنشور. جرايات السنة مقسومة على أعداد آخر السنة. سنوات
    1980 و1985-1991: مصدر آخر ومجال أوسع ودون ربط (البنك الدولي، التقرير عدد 11376-TUN
    لسنة 1993)؛ لا معطيات للفترتين 1981-1984 و1992-1999. المعطيات هي معطيات صندوق
    تأمين الشيخوخة والعجز والباقين بقيد الحياة بعد وفاة المنتفع بجراية الذي كان يصرف
    جرايات كامل القطاع الخاص، لا نظام الأجراء غير الفلاحيين وحده، ولا يُعرف إن كانت
    تشمل النظام التكميلي الذي كان يتصرّف فيه أيضاً. النسبة القانونية لهذا النظام:
    3,75 % + 1,25/20 ثمّ 4,25/20 بداية من غرّة جانفي 1988 (الأمر عدد 1137 لسنة 1988)؛
    والنسبة الجملية 20 % فتتطابق القراءتان: 5,00 % ثمّ 8,00 %. الكتلة = مساهمات التقاعد
    ÷ نسبة هذا النظام، وهي كتلة مكافئة لا مصرّح بها؛ نسبة التوازن حدّ أعلى من 1988
    إلى 1991.'
  fiche: sources/cnss-annuaires.md
- id: cnss-regimes-taux-equilibre
  titre: 'CNSS, régimes de pension autres que le RSNA : taux de cotisation d''équilibre
    de la branche pensions et sa décomposition (RSAA, RTNS, RTTE, RACI ; borne inférieure
    pour le RSA), 2000-2017'
  sources:
  - cnss-annuaires-statistiques
  build: scripts/build_cnss_regimes_taux_equilibre.py:main
  raw:
  - data/processed/caisses/cnss_regimes_annuaires.csv
  output: data/processed/caisses/cnss_regimes_taux_equilibre.csv
  unite: taux, millions de dinars, dinars par mois, personnes
  perimetre: 'taux d''équilibre = pensions servies par le régime, toutes natures ÷
    assiette = taux de remplacement apparent (pension moyenne ÷ revenu d''assiette
    moyen) × ratio pensionnés / cotisants ; comparé au taux légal de la branche pensions.
    Assiette : masse salariale déclarée (RSAA, 2000-2017) ; Σ assurés par classe ×
    coefficient × SMIG 48 h × 2 400 h (RTNS non agricole 2005-2017, RTTE 2000-2017,
    RACI 2004-2017) ou × SMAG × 300 j (RTNS agricole 2005-2017) ; RTNS ensemble :
    somme des secteurs (2005-2017), encadrement entre les deux bases (2000-2004) ;
    RSA : borne inférieure sur l''assiette maximale de quatre trimestres de 45 jours
    au SMAG (2000-2017). Aucun taux pour le régime complémentaire, le RTFR ni les
    travailleurs de chantiers.'
  caveats: 'SÉRIE CALCULÉE. ASSIETTES FORFAITAIRES RECONSTITUÉES (RTNS, RTTE, RACI)
    : les classes déclarées ne sont pas des revenus ; l''annuaire ne dit pas si l''effectif
    d''une classe est celui du 31 décembre ou celui des affiliés de l''année ; l''assiette
    suppose quatre trimestres cotisés par assuré compté : elle majore l''assiette
    due si le décompte porte sur les affiliés de l''année, et plus encore l''assiette
    encaissée — τ* est alors sous-estimé. SMIG DU RÉGIME DE 48 HEURES × 2 400 HEURES,
    nommé par les textes : pas d''ambiguïté avec le régime de 40 heures. SMIG OU SMAG
    EN VIGUEUR AU 1er JANVIER (règle écrite pour le RACI, supposée pour le RTNS et
    le RTTE), variante au SMIG moyen de l''année à part : elle abaisse τ* de 3,9 %
    au plus en valeur relative, sauf pour le RTNS agricole (4,7 % en 2011 ; 9,0 %
    en 2012, année des deux paliers du SMAG). SMIG ET SMAG DU 1er AOÛT 2016 FIXÉS
    RÉTROACTIVEMENT PAR DES DÉCRETS DU 5 JUIN 2017. RTNS 2000-2004 : CLASSES DE L''ENSEMBLE
    SEULEMENT, τ* ENCADRÉ (5,9-7,3 % en 2000). RSA : BORNE INFÉRIEURE SEULEMENT (le
    nombre de trimestres déclarés n''est pas publié), valable si chaque salarié a
    au plus un employeur déclarant par trimestre (loi n° 81-6, art. 18) ; elle dépasse
    60 % chaque année, parce que la cotisation porte sur 45 jours de SMAG par trimestre
    au plus quand la pension se calcule sur 300 jours. RSAA : TAUX LÉGAL DE 7,5 %
    PUBLIÉ PAR LA CAISSE, SANS DÉCRET DE RÉPARTITION IDENTIFIÉ ; salaire moyen déclaré
    très bas (666 D par an en 2000) : en 2013, 83,6 % des salariés déclarent un salaire
    mensuel de deux tiers du SMAG ou moins (annuaire 2013, pyramide en SMAG) — déclarations
    partielles ou saisonnières, par déduction ; le remplacement apparent dépasse 100
    % en 2016-2017. RACI : pensionnés plus nombreux que les cotisants jusqu''en 2009
    (pensions transitoires sans cotisation de la loi n° 2002-104, art. 33-34, par
    déduction) : τ* de 168 % en 2004, sans portée actuarielle. RTTE : régime jeune,
    τ* de 0,2 % (2000) à 7,9 % (2017). TAUX LÉGAUX DATÉS (RSA 1er janvier 1981, RSAA
    1er octobre 1989, RTTE 19 janvier 1989, RTNS 19 juillet 1995, RACI 5 janvier 2003)
    ; la caisse ne les publie que pour 2013 et 2017, leur constance sur 2000-2012
    repose sur les textes. S''ARRÊTE EN 2017.'
  titre_ar: 'الصندوق الوطني للضمان الاجتماعي، أنظمة الجرايات غير نظام الأجراء في القطاع
    غير الفلاحي: نسبة المساهمة المحقّقة للتوازن في فرع الجرايات ومكوّناتها (النظام
    الفلاحي المحسّن، العملة غير الأجراء، العملة بالخارج، الفنانون؛ حدّ أدنى لنظام
    الأجراء الفلاحيين)، 2000-2017'
  unite_ar: نسب، ملايين الدنانير، دنانير شهرياً، أشخاص
  perimetre_ar: 'نسبة التوازن = الجرايات المدفوعة بجميع أنواعها ÷ قاعدة الاشتراك =
    نسبة التعويض الظاهرة (معدّل الجراية ÷ معدّل دخل القاعدة) × نسبة المنتفعين إلى
    المساهمين؛ وتُقارن بالنسبة القانونية لفرع الجرايات. القاعدة: كتلة الأجور المصرّح
    بها (النظام المحسّن، 2000-2017)؛ مجموع المضمونين حسب الصنف × الضارب × الأجر الأدنى
    المهني لنظام 48 ساعة × 2 400 ساعة (العملة غير الأجراء في القطاع غير الفلاحي 2005-2017،
    والعملة بالخارج 2000-2017، والفنانون 2004-2017) أو × الأجر الأدنى الفلاحي × 300
    يوم (القطاع الفلاحي 2005-2017)؛ مجموع القطاعين: جمع القاعدتين (2005-2017) وحصر
    بين القاعدتين (2000-2004)؛ الأجراء الفلاحيون: حدّ أدنى على القاعدة القصوى (أربع
    ثلاثيات من 45 يوماً بالأجر الأدنى الفلاحي). لا نسبة للنظام التكميلي ولا لنظام
    الدخل المحدود ولا لعملة الحضائر.'
  caveats_ar: 'سلسلة محسوبة. القواعد الجزافية معاد تكوينها: الأصناف المصرّح بها ليست
    مداخيل، ولا يذكر الكتاب إن كان عدد الصنف عدد 31 ديسمبر أم عدد المنخرطين خلال السنة؛
    والقاعدة تفترض أربع ثلاثيات لكلّ مضمون، فتزيد على القاعدة المستحقّة إن كان العدّ
    للمنخرطين خلال السنة، وأكثر على المستخلصة، فتكون النسبة أدنى من حقيقتها. الأجر
    الأدنى المعتمد هو أجر نظام 48 ساعة × 2 400 ساعة كما تسمّيه النصوص، فلا لبس مع
    نظام 40 ساعة. الأجر الأدنى المعتمد هو النافذ في غرّة جانفي (قاعدة مكتوبة لنظام
    الفنانين، ومفترضة للعملة غير الأجراء والعملة بالخارج)، مع صيغة على معدّل السنة
    تخفّض النسبة بـ3,9 % على الأكثر، باستثناء القطاع الفلاحي (4,7 % سنة 2011 و9,0
    % سنة 2012). الأجران الأدنيان لغرّة أوت 2016 حُدّدا بأمرين مؤرّخين في 5 جوان 2017
    بمفعول رجعي. العملة غير الأجراء 2000-2004: أصناف المجموع فقط، فالنسبة محصورة (5,9-7,3
    % سنة 2000). الأجراء الفلاحيون: حدّ أدنى فقط، صالح إن كان لكلّ أجير مؤجّر واحد
    مصرّح في الثلاثية، يفوق 60 % كلّ سنة، لأنّ الاشتراك على 45 يوماً في الثلاثية على
    الأكثر والجراية على 300 يوم. النظام المحسّن: نسبة 7,5 % ينشرها الصندوق دون أمر
    توزيع معروف؛ معدّل الأجر المصرّح به ضعيف جدّاً (666 د سنة 2000؛ وفي 2013 يصرّح
    83,6 % من الأجراء بأجر شهري لا يتجاوز ثلثي الأجر الأدنى الفلاحي، أي تصاريح جزئية
    أو موسمية استنتاجاً)، فنسبة التعويض الظاهرة تتجاوز 100 % في 2016-2017. الفنانون:
    المنتفعون أكثر من المساهمين حتّى 2009 (جرايات انتقالية دون اشتراك، استنتاجاً)،
    فالنسبة 168 % سنة 2004 بلا دلالة اكتوارية. العملة بالخارج: نظام فتيّ، من 0,2 %
    (2000) إلى 7,9 % (2017). النسب القانونية مؤرّخة (الأجراء الفلاحيون غرّة جانفي
    1981، النظام المحسّن غرّة أكتوبر 1989، العملة بالخارج 19 جانفي 1989، العملة غير
    الأجراء 19 جويلية 1995، الفنانون 5 جانفي 2003)؛ ولا ينشرها الصندوق إلّا لسنتَي
    2013 و2017. تتوقّف السلسلة سنة 2017.'
