    total. Écart maximal : 0,7 % au plus pour les colonnes cohérentes, 7,8 à 11,8
    % pour les autres. Il établit que deux mesures coexistent, non leur définition.
    `smig_de_la_source_egale` compare le SMIG imprimé à la série `smig-smag` du dépôt
    (200 heures au taux horaire du régime de 48 heures, de fin d''année ou en moyenne)
    ; les deux colonnes `seuils_encadres_sans_tolerance_…` refont l''encadrement avec
    le SMIG de la source puis avec le SMIG mensuel de 48 heures.'
