    édition et tableau ; recoupements entre éditions dans population_milieu_communal_recensements_recoupements.csv
  caveats: 'PLUSIEURS LECTURES PAR GRANDEUR : une même valeur est versée autant de
    fois que de publications lues, aucune n''écrase l''autre ; ne pas sommer les lignes
    ; pour une figure, choisir une édition (voir la fiche). DÉFINITION, telle que
    l''INS la donne (volume 3 de 2014, p. 19) : « En Tunisie le milieu urbain est
    assimilé au milieu communal. Une agglomération est classée communale lorsqu''elle
    est érigée officiellement en municipalité. » LE PÉRIMÈTRE BOUGE À CHAQUE RECENSEMENT
    : créations de communes et extensions de périmètres font passer des habitants
    d''un milieu à l''autre (le volume 1 de 2004 cite une création et neuf extensions
    pour 1994-2004) ; aucune série à périmètre constant n''est publiée. RUPTURE DE
    CLASSIFICATION EN 2024 (colonne `classification`) : le Flash Démographie de septembre
    2025 écrit que la classification « urbain ou rural », adoptée « dans le cadre
    du projet DEGURBA », « vient remplacer l''ancienne classification (communal/non
    communal) » ; 8 615 826 urbains et 3 356 339 ruraux ne sont PAS une population
    communale et ne prolongent pas la série 1966-2014 ; aucune ventilation communal/non
    communal de 2024 n''a été trouvée (case vide, `non_publie`). 1956 : total seul,
    ventilation non obtenue (`non_obtenu`). 1966-1994 lus dans les tableaux rétrospectifs
    des publications de 2004 et de 2014, non dans les publications d''origine. AUCUN
    RACCORD, AUCUNE INTERPOLATION, AUCUN TOTAL CALCULÉ (le tableau 7 de 2014 n''en
    imprime pas). ÉCARTS ENTRE ÉDITIONS SIGNALÉS, NON CORRIGÉS : total de 2004, 9
    910 872 (volume de 2004) contre 9 906 563 (Bilan de 2024) ; total de 2014, 10
    982 754 (volume 1, Bilan de 2024) contre 10 982 477 (Flash de 2025) et 10 982,5
    milliers (volume 3) ; milieux de 2014, 7 437 037 et 3 545 717 (volume 1) contre
    7 437,5 et 3 545,0 (volume 3) et 7 437,7 et 3 545,1 (« Recensement en chiffres
    ») ; 2024, urbain + rural = 11 972 165 pour un total de 11 972 169. Dates de référence
    : seules celles de 2004 et de 2024 sont relevées dans les publications lues. Lu
    à l''image le 10 octobre 2026.'
  titre_ar: 'السكان في التعدادات العامة حسب الوسط: المجموع 1956-2024، الوسط البلدي
