  caveats: 'DEUX DATES DANS CETTE SÉRIE : le millésime 2020 ne publie la ventilation
    par régime qu''aux deux extrémités de la période. Le millésime 2019 en publie
    les effectifs de 2019, lisibles à l''image dans les légendes (série cnss-pensions-par-regime),
    et pas seulement les pourcentages. L''attribution d''une légende à son année se
    fait par l''ABSCISSE, jamais par la valeur — un régime peut décroître (salariés
    agricoles : 8 235 en 2000, 7 484 en 2020). Les libellés diffèrent d''une planche
    à l''autre dans la source (« travailleurs à faible revenu » côté actifs, « faibles
    revenus » côté pensionnés) et sont canonisés. ÉCART DE 2000 EXPLIQUÉ : les six
    légendes totalisent 1 012 220 quand le total publié est 1 013 483 ; l''écart,
    1 263, est exactement le nombre de non-assujettis de 2000 (annuaire statistique
    2013, tableau 1), que la planche de 2000 ne légende pas, alors que celle de 2020
    les porte (845). La part de 0,32 % qu''on croyait sans légende est celle des salariés
    agricoles EN 2020 (7 484 / 2 353 743), étiquetée sur le camembert de 2020. Le
    bouclage de 2020 est exact.'
  titre_ar: 'الصندوق الوطني للضمان الاجتماعي: المضمونون النشطون وأصحاب الجرايات حسب
    النظام، 2000 و2020'
  unite_ar: أشخاص
  perimetre_ar: ثمانية أنظمة سنة 2020، وستّة سنة 2000
  caveats_ar: 'تاريخان في هذه السلسلة: لا تنشر نسخة 2020 التوزيع حسب النظام إلّا لسنتَي
