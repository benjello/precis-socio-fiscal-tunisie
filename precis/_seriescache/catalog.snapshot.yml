  caveats_ar: 'لا يبيّن المعهد طريقة حساب نسبته السنوية؛ يُعيدها التسلسل بفارق لا
    يتجاوز 0,22 نقطة من 2010 إلى 2021، فاعتُمد. نسبة 2022 المنشورة (4,6 %) وقتية وسابقة
    لمراجعة ثلاثيات تلك السنة. نسبة 2025 وقتية. الفترة من الثلاثي الأول 2001 إلى الثلاثي
    الأول 2007، البوابة الأولى للمعهد (www.ins.nat.tn، المؤشر 0402040، صفحتان حُيّنتا
    في 06/10/2006 و30/06/2009، وهما النسختان الوحيدتان في أرشيف الواب): (أ) لا تذكر
    هاتان الصفحتان الصندوق الوطني للضمان الاجتماعي («المصدر: المعهد الوطني للإحصاء»)،
    فاستناد سنوات 2001-2006 إلى الأجور المصرّح بها لدى الصندوق مستنتَج من استمرارية
    المؤشر (الرمز نفسه والقيم نفسها في النشرية الشهرية من الثلاثي الثاني 2007 إلى
    الثلاثي الأول 2009، بما في ذلك تعديل 2009)، لا مصرّح به في المصدر؛ (ب) طريقة الفترة
    القديمة غير موثّقة: عيّنة الأجراء القارّين وعتباتها مأخوذة من دليل 2026 ولا يمكن
    إرجاعها إلى 2001، وعنوان صفحة 2006 يذكر «معدّل الأجر»؛ (ج) لا يُعرف هل يبدأ المؤشر
    سنة 2001 أم كان العرض مبتوراً؛ (د) لا توجد نسخة مؤرشفة أخرى (بحث CDX عن الرمز
    0402040 وعن عائلات صفحات المعطيات الظرفية)، والعناوين الأصلية لم تعد تستجيب. الثلاثي
    الثاني 2006: 1,69 في تحيين 2006، و1,45 في تحيين 2009 وهي المعتمدة؛ الثلاثي الأول
    2007 (1,11) غير موجود في أيّ عدد متاح من النشرية.'
