- id: cnrps-taux-equilibre
  titre: 'CNRPS : taux de cotisation d''équilibre du régime de retraite et sa décomposition,
    1980, 1985-1991 et 2000-2023 (2021-2023 estimés ; 1980-1991 sans raccord)'
  sources:
  - cnrps-guides-rapports
  - cnrps-etats-financiers
  - minfin-remunerations
  - minfin-ep-2023
  - minfin-ep-2024
  - minfin-ep-2025
  - bm-1993-social-protection
  build: scripts/build_cnrps_taux_equilibre.py:main
  raw:
  - data/processed/caisses/bm1993_caisses.csv
  - data/processed/caisses/cnrps_pensions.csv
  - data/processed/caisses/cnrps_regime_general_finances.csv
  - data/processed/precis/masse_salariale_ratios_longs_1990_2025.csv
  - data/processed/caisses/cnrps_actifs_tranches_salaire_2010.csv
  - data/processed/caisses/cnrps_minfin_entreprises_publiques.csv
  - data/processed/caisses/cnrps_ratios_charges_produits.csv
  output: data/processed/caisses/cnrps_taux_equilibre.csv
  unite: taux, millions de dinars, dinars par mois, pensions, personnes
  perimetre: 'taux d''équilibre = dépenses de l''ensemble des régimes de retraite
    gérés par la caisse (pensions de toutes natures) ÷ masse des salaires soumis à
    cotisation = taux de remplacement apparent (pension moyenne ÷ salaire moyen) ×
    ratio pensions / cotisants (pensions de toutes natures ÷ affiliés actifs, effectifs
    de fin d''année) ; comparé au taux légal global du régime général (agent + employeur,
    moyenne des douze taux mensuels). Colonne `denominateur` : « cotisations » (2014-2018),
    « cotisations reconstituées » (2019-2020), « masse salariale de l''État (approximation)
    » (2000-2013), « estimation : … » (2021-2023, libellé complet dans la colonne
    ; 2022-2023 sans affiliés actifs, donc sans décomposition), « Banque mondiale
    1993 : cotisations de pension ÷ taux légal (12 %) » (1980 et 1985-1991). Contrôles
    de 2014-2020 : rapport de l''assiette tirée des cotisations à la masse salariale
    de l''État, et taux d''équilibre du seul régime général'
  caveats: 'SÉRIE CALCULÉE. DÉNOMINATEUR APPROCHÉ DE 2000 À 2013 : aucune source lue
    ne donne les cotisations seules avant 2014 ; la masse salariale de l''État (ministère
    des finances, « Rémunérations publiques ») en tient lieu. Sur 2014-2020, l''assiette
    tirée des cotisations vaut 0,997 ; 0,992 ; 1,009 ; 0,977 ; 0,974 ; 0,994 ; 0,952
    fois cette masse, mais par compensation de périmètres, non par identité : la masse
    de l''État comprend les contributions patronales, les primes et les rappels, et
    exclut les collectivités locales et les établissements publics hors budget de
    l''État, affiliés à la caisse ; le taux employeur passant de 8,2 % à 12,5 % entre
    2000 et 2013, rien n''assure que la compensation ait été stable avant 2014. BIAIS
    CHIFFRÉ EN 2010 : l''approximation donne un salaire moyen de 875,2 D par mois,
    quand la caisse publie 979,158 D de salaire brut moyen pour ses actifs (guide
    2000-2010, p. 49, périmètre non précisé, 423 032 personnes), soit −10,6 % ; appliqué
    à tous les affiliés, le chiffre publié donnerait un taux d''équilibre de 22,1
    % au lieu de 24,8 %. Rien n''est corrigé. Le ratio pensions / cotisants ne dépend
    pas du dénominateur ; seuls le taux de remplacement apparent et le taux d''équilibre
    portent l''approximation. 2019-2020 : cotisations RECONSTITUÉES (niveau 2018 +
    hausses publiées arrondies au million) ; 2020 cumule cette reconstitution et le
    plus faible recouvrement (0,952). PÉRIMÈTRES : le numérateur couvre l''ensemble
    des régimes de retraite (régime général, régimes spéciaux, retraites anticipées
    financées par l''État), seule série continue ; le dénominateur de 2014-2020 ne
    couvre que le régime général ; la variante de même périmètre (« taux d''équilibre,
    régime général seul ») est plus basse de 0,9 % (2015) à 2,6 % (2018) selon les
    années de 2014 à 2020. Le numérateur comprend de petites charges autres que des
    pensions : allocations familiales, confondues avec les pensions temporaires d''orphelins
    (1,7 à 2,0 % des dépenses en 2014-2018, borne haute), et remboursements de cotisations
    (0,01 %). Les effectifs comptent des PENSIONS, non des personnes, en fin d''année,
    rapportées à des dépenses annuelles. 2016 atypique : des primes spécifiques créées
    ou revalorisées ont ajouté plus de 110 millions de dinars de cotisations. Le taux
    d''équilibre est une grandeur comptable instantanée : il ne tient compte ni des
    autres recettes du régime (péréquation, bonification, rachats, contributions de
    l''État) ni des réserves. 2021-2023 : ESTIMATIONS, aucune publication de la caisse
    postérieure à 2020 n''ayant été trouvée. Numérateur = total des charges d''exploitation
    de la CAISSE ENTIÈRE (ministère des finances, rapport sur les entreprises publiques,
    LF 2025 ; 2023 provisoire) × part des dépenses du régime de retraite dans ce total,
    moyenne 2019-2020 (0,951 et 0,958) ; recoupé à 1,5 % près par les ratios charges/produits
    de la branche des pensions (ministère des affaires sociales), hors le 120,5 %
    « sans CSS » de 2022, qui contredit les comptes du ministère des finances (+7,4
    %). Dénominateur = masse salariale de l''État × 0,952 (rapport de 2020) ; la variante
    indexée sur les recettes techniques de la caisse, écrite à part, donne 33,9 ;
    32,6 ; 33,4 % contre 33,9 ; 33,3 ; 35,7 % : l''écart de 2023 (2,3 points) est
    la vraie marge d''incertitude, et les deux indexations, rétro-projetées sur 2016-2020,
    se trompent autant. Effectifs : bénéficiaires de pension et affiliés du ministère,
    égaux à ceux de la caisse en 2020 ; affiliés trouvés jusqu''en 2021 seulement
    dans les documents lus. Statut (exécution ou non) des masses salariales 2021-2023
    non établi par la source. La pension moyenne implicite baisse de 2021 à 2022 (1
    333 à 1 328 D), signe de la fragilité de l''estimation. 1980 ET 1985-1991 : AUTRE
    SOURCE, SANS RACCORD. Banque mondiale, rapport n° 11376-TUN (1993), annexe statistique,
    tableaux 3 et 5 (ministère du Plan), série bm1993-caisses ; rien pour 1981-1984
    ni pour 1992-1999. Numérateur = pensions versées, prestations familiales servies
    aux pensionnés comprises (part non publiée : τ* surestimé d''autant, non chiffrable
    ; le numérateur de 2000-2023 les comprend aussi). Dénominateur = cotisations de
    pension ÷ 12 % (5 % agent + 7 % employeur, loi n° 74-101, art. 38-39, puis loi
    n° 85-12, art. 9 et 13 ; 12 % publiés au tableau 6 pour 1991). Jusqu''au 12 septembre
    1985, la retenue de l''agent était plafonnée jusqu''à l''indice 250 au montant
    d''avant 1975 : pour 1980 et 1985, assiette plancher, τ* majorant, salaire moyen
    minorant. Contrôle : en 1990 et 1991, l''assiette vaut 1,020 et 1,000 fois la
    masse salariale de l''État, comme en 2014-2020. Effectifs du tableau 5 (pensions
    ou personnes, non précisé) ; les affiliés actifs bondissent de 61 % de 1980 à
    1985 sans explication de la source. τ* : 8,4 % (1980), 9,9 % (1985) à 12,6 % (1991),
    pour un taux légal de 12 %.'
  titre_ar: 'الصندوق الوطني للتقاعد والحيطة الاجتماعية: نسبة المساهمة المحقّقة للتوازن
    في نظام التقاعد ومكوّناتها، 1980 و1985-1991 و2000-2023 (2021-2023 تقديرات؛ 1980-1991
    دون ربط)'
  unite_ar: نسب، ملايين الدنانير، دنانير شهرياً، جرايات، أشخاص
  perimetre_ar: 'نسبة التوازن = نفقات جميع أنظمة التقاعد التي يتصرّف فيها الصندوق
    (الجرايات بجميع أصنافها) ÷ كتلة الأجور الخاضعة للمساهمة = نسبة التعويض الظاهرة
    (معدّل الجراية ÷ معدّل الأجر) × نسبة الجرايات إلى المساهمين (الجرايات بجميع أصنافها
    ÷ المنخرطين النشيطين، في آخر السنة)؛ تُقارن بالنسبة القانونية الجملية للنظام العام
    (العون + المؤجّر، معدّل النسب الشهرية الاثنتي عشرة). عمود المقام: المساهمات (2014-2018)،
    مساهمات معاد تركيبها (2019-2020)، كتلة أجور الدولة على وجه التقريب (2000-2013)،
    تقدير (2021-2023، دون تفكيك لسنتي 2022 و2023)، البنك الدولي 1993: مساهمات التقاعد
    ÷ النسبة القانونية 12 % (1980 و1985-1991)'
  caveats_ar: 'سلسلة محسوبة. المقام تقريبي من 2000 إلى 2013: لا يتوفّر أيّ مصدر للمساهمات
    وحدها قبل 2014، فتُعتمد كتلة أجور الدولة (وزارة المالية، «الأجور العمومية»). في
    الفترة 2014-2020 تساوي قاعدة المساهمات 0,997 و0,992 و1,009 و0,977 و0,974 و0,994
    و0,952 مرّة هذه الكتلة، لكن بتعادل الفوارق لا بتطابق المجال: تشمل كتلة أجور الدولة
    المساهمات المحمولة على المؤجّر والمنح والمتخلّدات، ولا تشمل الجماعات المحلية والمؤسسات
    العمومية خارج ميزانية الدولة المنخرطة في الصندوق، وقد ارتفعت نسبة مساهمة المؤجّر
    من 8,2 % إلى 12,5 % بين 2000 و2013. سنة 2010: يعطي التقريب معدّل أجر شهري قدره
    875,2 دينارا، في حين ينشر الصندوق 979,158 دينارا لنشيطيه (مجال غير محدّد، 423
    032 شخصا)، أي −10,6 %؛ ولو طُبّق الرقم المنشور على جميع المنخرطين لكانت نسبة التوازن
    22,1 % بدل 24,8 %. لا يُصحَّح شيء. نسبة الجرايات إلى المساهمين لا تتأثّر بالمقام.
    سنتا 2019 و2020: مساهمات معاد تركيبها. البسط يشمل جميع أنظمة التقاعد والمقام النظام
    العام وحده (2014-2020)، والصيغة ذات المجال الواحد أدنى بـ 0,9 % إلى 2,6 %. يشمل
    البسط أعباء صغيرة غير الجرايات (المنح العائلية مع منح الأيتام: 1,7 إلى 2,0 %).
    تُعدّ الجرايات لا الأشخاص. سنة 2016 استثنائية. نسبة التوازن مقدار محاسبي آني لا
    يأخذ في الاعتبار الموارد الأخرى للنظام ولا احتياطياته. السنوات 2021-2023 تقديرات،
    إذ لم يُعثر على أيّ منشور للصندوق بعد 2020: البسط = مجموع أعباء الاستغلال للصندوق
    بأكمله (وزارة المالية، التقرير حول المنشآت العمومية؛ 2023 وقتية) × حصّة نفقات
    نظام التقاعد من هذه الأعباء، معدّل 2019-2020 (0,951 و0,958)؛ ويتطابق مع نسب الأعباء
    إلى المداخيل لفرع الجرايات (وزارة الشؤون الاجتماعية) في حدود 1,5 %، باستثناء نسبة
    120,5 % «دون المساهمة الاجتماعية التضامنية» لسنة 2022. المقام = كتلة أجور الدولة
    × 0,952 (نسبة 2020)؛ والصيغة البديلة المرتبطة بالإيرادات الفنية للصندوق تعطي 33,9
    و32,6 و33,4 % مقابل 33,9 و33,3 و35,7 %: فارق 2023 (2,3 نقطة) هو الهامش الحقيقي
    لعدم اليقين. لم يُعثر على عدد المنخرطين النشيطين بعد سنة 2021 في الوثائق المطّلع
    عليها. انخفاض معدّل الجراية الضمني بين 2021 و2022 (من 1 333 إلى 1 328 دينارا)
    علامة على هشاشة التقدير. سنوات 1980 و1985-1991: مصدر آخر ودون ربط مع سنة 2000
    (البنك الدولي، التقرير عدد 11376-TUN لسنة 1993، الملحق الإحصائي، الجدولان 3 و5)؛
    لا معطيات للفترتين 1981-1984 و1992-1999. البسط يشمل المنح العائلية المسندة إلى
    المتقاعدين (حصّتها غير منشورة، فنسبة التوازن مضخّمة بقدرها). المقام = مساهمات
    التقاعد ÷ 12 % (5 % العون و7 % المؤجّر، القانون عدد 101 لسنة 1974 ثمّ القانون
    عدد 12 لسنة 1985). قبل 12 سبتمبر 1985 كانت مساهمة العون مسقّفة إلى حدود المؤشر
    250: القاعدة حدّ أدنى لسنتي 1980 و1985. مراقبة: قاعدة 1990 و1991 تساوي 1,020 و1,000
    مرّة كتلة أجور الدولة. ارتفع عدد المنخرطين النشيطين بـ 61 % بين 1980 و1985 دون
    تفسير من المصدر.'
  fiche: sources/cnrps-publications.md
