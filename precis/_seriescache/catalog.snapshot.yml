- id: croissances-revenus-prix
  titre: Croissances annuelles des prix, du revenu national et des revenus du travail,
    1963-2025
  sources:
  - bct-ra
  - ins-annuaire
  - ins-cnat-2015
  - undata-sna
  - ins-enpe
  - ins-fonction-publique-2021
  - minfin-remunerations
  - wb-wdi
  - ins-bms
  - ins-guide-salaires-prive-2026
  - ins-portail-2006-salaires-prive
  - ins-portail-2009-salaires-prive
  - wb-2004-employment-strategy-annexes
  - bm-1995-pauvrete-annexes
