  - data/raw/caisses/cnss/2018/tab8-ar.pdf
  output: data/processed/caisses/cnss_cotisations_2000_2020.csv
  unite: millions de dinars courants (MD)
  perimetre: cotisations encaissées par la CNSS, tous régimes — hors CNRPS et, depuis
    2006, hors branches maladie et accidents du travail
  caveats: 'RUPTURE DE CHAMP EN 2006 : à cette date les recettes des branches de l''assurance
    maladie et de la réparation des accidents du travail et des maladies professionnelles
    reviennent à la CNAM, et les cotisations encaissées tombent de 1 351 à 993 MD
    sans qu''aucun taux ait baissé. La série n''est pas homogène de part et d''autre,
    et la note figure sur la planche elle-même. MONTANTS COURANTS, non déflatés :
    une évolution de niveau ne se lit pas sans indice de prix. Les valeurs sont des
    étiquettes de graphique en TEXTE PIVOTÉ, qui se lisent de bas en haut : assemblées
    à l''envers elles rendent des nombres crédibles mais absents du document (1 134
    devient 1 341). Le contrôle est que les 21 valeurs assemblées reconstituent exactement
    l''ensemble lu par le flux, qui ne dépend d''aucun ordre. La datation vient de
    l''abscisse, et 2020 est confirmée par différence entre millésimes : le montant
    présent dans la planche de 2020 et absent de celle de 2019 est celui de 2020.
    NE JAMAIS TRIER : la série recule DEUX fois, en 2006 et en 2020 (3 430 MD après
    3 445) ; un tri croissant effacerait les deux retournements. Le millésime 2019
    n''existe qu''en arabe, la série française du site sautant du tableau 7 au tableau
    9.'
  titre_ar: 'الصندوق الوطني للضمان الاجتماعي: الاشتراكات المستخلصة، كلّ الأنظمة، 2000-2020'
  unite_ar: بملايين الدنانير الجارية
  perimetre_ar: الاشتراكات التي يستخلصها الصندوق الوطني للضمان الاجتماعي، كلّ الأنظمة
    — باستثناء الصندوق الوطني للتقاعد والحيطة الاجتماعية، وباستثناء فرعَي التأمين
    على المرض وحوادث الشغل منذ 2006
  caveats_ar: 'انقطاع في المجال سنة 2006: تنتقل موارد فرعَي التأمين على المرض وجبر
    أضرار حوادث الشغل والأمراض المهنية إلى الصندوق الوطني للتأمين على المرض، فتهبط
    الاشتراكات المستخلصة من 1 351 إلى 993 مليون دينار دون أن تنخفض أيّ نسبة. فالسلسلة
    غير متجانسة على طرفَي هذا التاريخ، والملاحظة مدوّنة على اللوحة نفسها. المبالغ
    بالدينار الجاري دون تصحيح للأسعار. القيم بطاقات رسم بياني بنصّ مُدار تُقرأ من
    الأسفل إلى الأعلى: تركيبها معكوساً يعطي أعداداً معقولة لكنّها غائبة عن الوثيقة.
    والضابط أنّ القيم الإحدى والعشرين المركّبة تُعيد تماماً المجموعة المقروءة من التدفّق،
    وهي لا تتوقّف على أيّ ترتيب. لا تُرتَّب السلسلة أبداً: تتراجع مرّتين، سنة 2006
    وسنة 2020 (3 430 بعد 3 445). ولا توجد نسخة 2019 إلّا بالعربية.'
  fiche: sources/cnss-donnees-statistiques.md
- id: cnss-pensionnes-par-nature
  titre: 'CNSS : titulaires de pensions par nature de pension, 2000 et 2020'
  sources:
  - cnss-chiffres
  build: scripts/extract_cnss_pensionnes_par_nature.py:main
  raw:
  - data/raw/caisses/cnss/2020/07_Répartition_des_pensionnés_selon_la_nature_de_la.pdf
  - data/raw/caisses/cnss/2018/Tab4-fr.pdf
  output: data/processed/caisses/cnss_pensionnes_par_nature.csv
  unite: personnes
  perimetre: titulaires de pensions de la CNSS, quatre natures (retraite, conjoints
    survivants, orphelins, invalidité) — hors CNRPS
  caveats: 'DEUX DATES, PAS UNE SÉRIE : la caisse ne publie cette ventilation qu''aux
    deux extrémités de la période. PIÈGE D''ATTRIBUTION : la planche affiche « Année
    2020 » AVANT « Année 2000 » dans le flux alors que les huit étiquettes d''effectifs
    sortent dans l''ordre inverse ; se fier à l''ordre du flux intervertit les deux
    années et montre les pensions de survie en recul quand elles progressent. L''attribution
    se fait donc par BOUCLAGE : le bloc qui somme à 287 700 est celui de 2000, celui
    qui somme à 904 621 est celui de 2020. Ces deux totaux viennent d''une AUTRE planche
    (série cnss-effectifs) : le contrôle est externe, et il est exact à l''unité.
    Les huit pourcentages recalculés concordent avec les huit pourcentages publiés
    à 0,00 point. Le millésime 2018 redonne la colonne 2000 à l''identique.'
  titre_ar: 'الصندوق الوطني للضمان الاجتماعي: أصحاب الجرايات حسب نوع الجراية، 2000
    و2020'
  unite_ar: أشخاص
  perimetre_ar: أصحاب الجرايات لدى الصندوق الوطني للضمان الاجتماعي، أربعة أنواع (التقاعد
    والبقاء والأيتام والعجز) — باستثناء الصندوق الوطني للتقاعد والحيطة الاجتماعية
  caveats_ar: 'تاريخان لا سلسلة: لا ينشر الصندوق هذا التوزيع إلّا لسنتَي 2000 و2020.
    ومكمن الخطأ في نسبة كلّ كتلة إلى سنتها: تعرض اللوحة «سنة 2020» قبل «سنة 2000»
    في تدفّق النصّ بينما تخرج البطاقات الثماني بالترتيب المعاكس، فالاعتماد على ترتيب
    التدفّق يقلب السنتين ويُظهر جرايات البقاء متراجعةً وهي في ارتفاع. لذلك تُنسب الكتل
    بالمجموع لا بالترتيب: الكتلة التي مجموعها 287 700 هي كتلة سنة 2000، والتي مجموعها
    904 621 هي كتلة سنة 2020. وهذان المجموعان مأخوذان من لوحة أخرى، فالضبط خارجي ومطابق
    إلى الوحدة. كما تطابق النسب الثماني المحتسبة النسب المنشورة بفارق 0,00 نقطة. وتُعيد
    نسخة 2018 عمود سنة 2000 حرفياً.'
  fiche: sources/cnss-donnees-statistiques.md
- id: cnss-pensions-versees
  titre: 'CNSS : pensions versées, 2000-2020'
  sources:
  - cnss-chiffres
  build: scripts/extract_cnss_pensions_versees.py:main
  raw:
  - data/raw/caisses/cnss/2020/12_Évolution_des_dépenses_des_régimes_de_sécurité_s.pdf
  - data/raw/caisses/cnss/2018/Tab9-fr.pdf
  output: data/processed/caisses/cnss_pensions_versees.csv
  unite: millions de dinars courants (MD)
  perimetre: composante « Pensions » des prestations servies par la CNSS — UNE BRANCHE
    DE DÉPENSES, et non le total des dépenses
  caveats: 'CE N''EST PAS LE TOTAL DES DÉPENSES. La planche est un histogramme empilé
    à six composantes dont le total n''est étiqueté que sur quelques colonnes et ne
    boucle pas partout : en 2015 l''étiquette haute affiche 2 250,7 alors que la seule
    composante Pensions de cette colonne vaut déjà 2 346,8. Un total inférieur à l''une
    de ses parts n''est pas un total ; la série des dépenses totales n''est donc pas
    extraite de cette planche. La composante Pensions, elle, est étiquetée sur les
    vingt et une colonnes. PIÈGE DE LECTURE : le chiffre des mille est détaché et
    rendu AU-DESSOUS du reste de l''étiquette (« 079,2 » puis « 1 ») ; assemblé naïvement
    il produit « 11 » ou « 22 », nombres absurdes qui ne lèvent aucune exception.
    Le millésime 2018 redonne les vingt premières années avec ZÉRO désaccord, et 2020
    est exactement l''année qu''il ne porte pas. La croissance monotone est CONSTATÉE,
    jamais imposée : aucun tri n''est appliqué. MONTANTS COURANTS, non déflatés. Comparer
    cette branche aux cotisations tous régimes n''est pas un solde : c''est un taux
    de couverture.'
  titre_ar: 'الصندوق الوطني للضمان الاجتماعي: الجرايات المدفوعة، 2000-2020'
  unite_ar: بملايين الدنانير الجارية
  perimetre_ar: مكوّن «الجرايات» من المنافع التي يصرفها الصندوق الوطني للضمان الاجتماعي
    — فرع إنفاق واحد لا مجموع النفقات
  caveats_ar: 'ليس مجموع النفقات. اللوحة رسم بياني مركَّب من ستّة مكوّنات، ولا يُكتب
    مجموعها إلّا على بعض الأعمدة ولا يستقيم في كلّها: ففي سنة 2015 تُظهر البطاقة العليا
    2 250,7 بينما يبلغ مكوّن الجرايات وحده في العمود نفسه 2 346,8. والمجموع الذي يقلّ
    عن أحد أجزائه ليس مجموعاً، فلم تُستخرج سلسلة النفقات الجملية من هذه اللوحة. أمّا
    مكوّن الجرايات فمكتوب على الأعمدة الواحد والعشرين جميعها. ومكمن الخطأ في القراءة
    أنّ رقم الآلاف منفصل ومرسوم تحت بقيّة البطاقة («079,2» ثمّ «1»)، فتركيبه على البداهة
    يعطي «11» أو «22»، وهي أعداد لا معنى لها ولا تثير أيّ خطأ برمجي. وتُعيد نسخة 2018
    السنوات العشرين الأولى دون أيّ اختلاف، وسنة 2020 هي بالضبط السنة التي لا تحملها.
    والتزايد المطّرد ملاحَظ لا مفروض: لا يُطبَّق أيّ ترتيب. المبالغ بالدينار الجاري
    دون تصحيح للأسعار. ومقابلة هذا الفرع بالاشتراكات في كلّ الأنظمة ليست موازنة بل
    نسبة تغطية.'
  fiche: sources/cnss-donnees-statistiques.md
