  build: scripts/extract_ins_fonction_publique_2018_2025.py:main
  raw:
  - data/raw/ins-fonction-publique-2018-2025/La fonction publique - 2018-2025.pdf
  output: data/processed/ins-fonction-publique-2018-2025/categories_statutaires_evolution.csv
  unite: milliers d'agents
  perimetre: fonctionnaires (hors ouvriers et autres), six catégories statutaires
    A1 à D, plus le total (tableau 6 du rapport)
  caveats: Prolonge `fonction-publique-categories` (2015-2021), qu'elle reproduit
    à l'identique sur 2018-2020 et à l'arrondi en 2021 ; même libellés. Écarts d'arrondi
    de 0,1 millier entre la somme des catégories et le total (2019, 2023), et entre
    ce total et les fonctionnaires du tableau 5 en 2024 (518,2 contre 518,1). La catégorie
    D passe de 28,4 (2023) à 39,8 milliers (2024) sans que le rapport l'explique ;
    le mouvement est contemporain de la baisse de l'unité 1 des ouvriers (48,9 → 35,4
    milliers), rapprochement qui n'est qu'une hypothèse.
  titre_ar: الموظفون حسب الصنف القانوني (أ1-د)، 2018-2025
  unite_ar: بآلاف الأعوان
  perimetre_ar: الموظفون (باستثناء العملة والحالات الأخرى)، ستة أصناف قانونية من أ1
    إلى د، مع المجموع (الجدول 6 من التقرير)
  caveats_ar: تمدّد سلسلة 2015-2021 وتطابقها تماماً على 2018-2020 وبالتقريب سنة 2021،
    بالتسميات نفسها. فوارق تقريب بـ0,1 ألف بين مجموع الأصناف والمجموع (2019، 2023)،
    وبين هذا المجموع وعدد الموظفين في الجدول 5 سنة 2024 (518,2 مقابل 518,1). ينتقل
    الصنف د من 28,4 (2023) إلى 39,8 ألفاً (2024) دون تفسير في التقرير؛ ويتزامن ذلك
    مع انخفاض الوحدة الأولى للعملة (48,9 ← 35,4 ألفاً)، وهو تقريب لا يعدو أن يكون
    فرضية.
