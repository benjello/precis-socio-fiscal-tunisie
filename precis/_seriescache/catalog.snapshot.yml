  unite: salariés déclarés ; % du total imprimé de la colonne (calculé)
  perimetre: régime des salariés non agricoles ; treize classes de la source et trois
    regroupements calculés (moins de 1 SMIG ; 1 à 1,5 ; plus de 1,5) ; édition 2013,
    PDF 37 (2000-2013) ; édition 2018, PDF 27 (2005-2018) et PDF 26 (quatre trimestres
    de 2018) ; une ligne par année, mesure, trimestre, classe et édition
  caveats: 'DEUX MESURES, À NE PAS MÊLER (colonne `mesure`). « annuelle » : tous les
    salariés déclarés au titre de l''année ; la classe basse y est gonflée par les
    années incomplètes, et cette lecture NE MESURE PAS des salariés payés sous le
    SMIG (24,0 % sous 1 SMIG en 2018). « trimestre civil » : effectif déclaré à chaque
    trimestre de 2018 (9,5 % sous 1 SMIG au premier trimestre) ; le titre de la source
    dit « selon le nombre de trimestres déclarés », la lecture par trimestre civil
    est DÉDUITE de ce que les colonnes dépassent l''effectif annuel de la classe ;
    le quatrième trimestre porte vraisemblablement les primes de fin d''année (DÉDUIT
    de la masse salariale et des effectifs à 6 SMIG et plus). Une seule année trimestrielle
    : pas une série. FILTRER SUR `niveau` avant toute somme : les trois regroupements
    calculés s''ajoutent aux treize classes de la source, et le code `1-1.5` existe
    aux deux niveaux. LE MONTANT DU SMIG DE RÉFÉRENCE EST IMPRIMÉ sous la pyramide
    en dinars (« 6 fois SMIG mensuel en D », série `cnss-pyramide-dinars-2000-2018`)
    ; NON PRÉCISÉ PAR LA SOURCE : son régime (40 ou 48 heures), le calcul du salaire
    mensuel déclaré. CONSTAT : ce SMIG vaut 200 heures au taux horaire du régime de
    48 heures (290,200 D en 2013), non le SMIG mensuel de 208 heures (301,808 D),
    et les classes en sont des multiples (encadrement sans tolérance : 111 seuils
    sur 120, contre 40 avec le SMIG mensuel). Un salarié payé toute l''année le SMIG
    mensuel de 48 heures se range donc vers 1,04 SMIG, dans la classe 1 à 1,5 ; au
    SMIG mensuel de 40 heures, vers 0,89, dans la classe 2/3 à 1 : « MOINS DE 1 SMIG
    » NE VEUT PAS DIRE « SOUS LE SALAIRE MINIMUM LÉGAL ». La classe 1 à 1,5 SMIG ne
    permet pas d''isoler le salarié payé au SMIG. Les éditions 2010, 2013 et 2018
    sont identiques sur leurs années communes (contrôle du script) : `serie_2000_2018
    = oui` marque un parcours sans doublon (édition 2013 pour 2000-2004, édition 2018
    ensuite), sans raccord de valeurs. NE PAS MÊLER à l''édition 2006 (`cnss-annuaire-2006-pyramide-smig-brut`),
    autre univers. La pyramide en dinars de l''édition 2018 (PDF 24) imprime 1 149
    959 salariés en 2012, celle en SMIG 1 149 956. Parts calculées, sans arrondi ;
    les parts imprimées (2013, 2018) sont gardées à côté.'
