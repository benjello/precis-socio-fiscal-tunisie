    بسعر الاقتناء). لا كلفة للسنوات 1999 و2005-2007 و2019-2021 ولا استكمال لها. قيم
    الوكالة مقروءة على رسم بياني بهامش ±1 مليم. معطيات 2022-2025 أولية قبل التدقيق.
    بالدينار الجاري.
