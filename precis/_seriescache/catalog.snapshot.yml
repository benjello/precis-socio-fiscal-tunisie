  unite: milliers d'agents
  perimetre: fonction publique (dont/hors collectivités locales)
  caveats: rupture de série collectivités locales 2016→2017 (changement de périmètre/comptage)
  titre_ar: أعداد أعوان الوظيفة العمومية، 2015-2021
