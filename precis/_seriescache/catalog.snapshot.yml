    lus. `total_des_achats_gaz` N''EST PAS LE TOTAL DES PRÉLÈVEMENTS : autre tableau,
    qui compte condensats et gaz gratuits (2019 : 5 804 contre 5 680 ; 2020 : 5 478
    contre 5 393 ; 2021 : 5 765 contre 5 667 ; 2022 : 5 480 contre 5 436 ; 2023 :
    5 315 contre 5 217 ; 2024 : 5 123 contre 4 999) ; ne pas l''ajouter. La redevance
    est la seule part « consommée » du gaz algérien en transit : « redevance totale
    » en 2014, « consommée » ensuite pour la même valeur. 2010 : 375 achats contractuels
    (rapport annuel 2011) pour 376 imprimé en 2010. 2022 n''a pas de rapport annuel
    : colonne 2022 du rapport 2023. LU À L''IMAGE : 2022-2024. Des révisions de ±1
    existent d''une édition à l''autre. Aucun prix. Voir docs/steg-gaz-electricite.md.'
