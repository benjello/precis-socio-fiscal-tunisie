    imprimé pour 2 768,8 en 2013). Elle ne se confond avec la ligne budgétaire versée
    à la STEG qu''en 2015 (858) ; 2016 : aucune. RUPTURE DE 2015 : fin du prix de
    cession, subvention entièrement budgétaire. 2006 est retraité dans le rapport
    annuel 2007 (589,7). Aucune série n''est établie ici pour 2017 et après. Colonne
    `rupture` / `rupture_annee` : 2015. Dinars courants, aucun PIB. Voir docs/steg-gaz-electricite.md.'
