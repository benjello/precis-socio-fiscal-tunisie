    (سلسلة cnss-pensions-par-regime)، لا النسب المائوية وحدها. تُنسب كلّ بطاقة إلى
    سنتها بالإحداثي الأفقي لا بقيمتها، إذ يمكن لنظام أن يتراجع (الأجراء الفلاحيون:
    8 235 سنة 2000 و7 484 سنة 2020). وتختلف التسميات بين اللوحتين في المصدر نفسه،
    فوُحِّدت. فارق سنة 2000 مفسَّر: تبلغ الأنظمة الستّة 1 012 220 بينما المجموع المنشور
    1 013 483، والفارق (1 263) هو بالضبط عدد غير الخاضعين سنة 2000 (الكتاب الإحصائي
    2013، الجدول 1)، ولا تذكرهم لوحة 2000 بينما تذكرهم لوحة 2020 (845). والحصّة 0,32
    % التي ظُنّ أنّها دون تسمية هي حصّة الأجراء الفلاحيين سنة 2020 (7 484 / 2 353
    743)، وهي مكتوبة على رسم سنة 2020. أمّا سنة 2020 فالمجموع مطابق.'
  fiche: sources/cnss-donnees-statistiques.md
