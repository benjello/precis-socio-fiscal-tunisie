  titre_ar: 'الصندوق الوطني للتقاعد والحيطة الاجتماعية والصندوق الوطني للضمان الاجتماعي:
    المنخرطون وأصحاب الجرايات والمؤجّرون حسب التقرير حول المنشآت العمومية، 2016-2019'
  unite_ar: بآلاف الأشخاص
  perimetre_ar: الصندوق الوطني للتقاعد والحيطة الاجتماعية (أعوان الدولة والجماعات
    العمومية) والصندوق الوطني للضمان الاجتماعي
  caveats_ar: 'المصدر الوحيد المعروف لأعداد منخرطي الصندوق الوطني للتقاعد والحيطة
    الاجتماعية، إذ لا ينشر الصندوق أيّ إحصائيات. القيم مقرَّبة إلى الألف. وتتجاور
    التقديرات والإنجازات: يميّزها عمود الوضع، ويذكر عمود النسخة التقرير الذي جاءت
    منه، ويُعتمد الأحدث — فقد أعلنت نسخة قانون المالية 2020 عدد 779 ألف منخرط لسنة
    2018 بينما تُثبت نسخة 2021 عدد 766 ألفاً. النسختان العربيتان (2022 و2023) تعرضان
    الفصل في الجدول عدد 23، ويُقرأ بالهندسة لا بترتيب التدفّق. ولا ترد أرقام الصندوق
    الوطني للضمان الاجتماعي لسنة 2021: العمود فارغ، وتوضّح حاشية التقرير أنّ الصندوق
