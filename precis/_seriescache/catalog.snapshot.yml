- id: fonction-publique-effectifs-2018-2025
  titre: Effectifs de la fonction publique, 2018-2025
  sources:
  - ins-fonction-publique-2025
  build: scripts/extract_ins_fonction_publique_2018_2025.py:main
  raw:
  - data/raw/ins-fonction-publique-2018-2025/La fonction publique - 2018-2025.pdf
  output: data/processed/ins-fonction-publique-2018-2025/effectifs_evolution.csv
  unite: 'agents (taux : %)'
  perimetre: fonction publique, hors collectivités locales, collectivités locales
    et total (tableau 1 du rapport)
  caveats: 'EN AGENTS, et non en milliers comme `fonction-publique-effectifs` (2015-2021),
    qu''elle recoupe à l''arrondi près sur 2018-2021 (652 225 contre 652,2 milliers
    en 2018). COUVERTURE CROISSANTE DES COLLECTIVITÉS LOCALES : le rapport avertit
    que leur évolution « doit être interprétée en tenant compte de l''évolution du
    champ de couverture de la base INSAF », l''intégration progressive de nouvelles
    collectivités ayant amélioré l''exhaustivité du fichier ; la hausse de 21 483
    (2018) à 26 697 agents (2025) mêle donc recrutements et extension du champ. Source
    administrative (base INSAF) ; effectif en décembre, précisé par le rapport pour
    2025.'
  titre_ar: أعداد أعوان الوظيفة العمومية، 2018-2025
  unite_ar: 'أعوان (النسب: %)'
  perimetre_ar: الوظيفة العمومية، باستثناء الجماعات المحلية، والجماعات المحلية، والمجموع
    (الجدول 1 من التقرير)
  caveats_ar: 'بعدد الأعوان لا بالآلاف كما في سلسلة 2015-2021، وتتطابق معها بفارق
    التقريب على 2018-2021 (652225 مقابل 652,2 ألفاً سنة 2018). تغطية متزايدة للجماعات
    المحلية: ينبّه التقرير إلى أنّ تطوّر أعدادها يُقرأ مع مراعاة توسّع مجال تغطية
    قاعدة «إنصاف»، إذ أدّى الإدماج التدريجي لجماعات محلية جديدة إلى تحسين شمول الملف؛
    فالارتفاع من 21483 (2018) إلى 26697 عوناً (2025) يمزج الانتدابات بتوسّع المجال.
    مصدر إداري (قاعدة إنصاف)؛ العدد في شهر ديسمبر كما يحدّده التقرير لسنة 2025.'
  fiche: sources/ins-fonction-publique-2018-2025.md
- id: fonction-publique-categories-2018-2025
  titre: Fonctionnaires par catégorie statutaire (A1-D), 2018-2025
  sources:
  - ins-fonction-publique-2025
  build: scripts/extract_ins_fonction_publique_2018_2025.py:main
  raw:
  - data/raw/ins-fonction-publique-2018-2025/La fonction publique - 2018-2025.pdf
  output: data/processed/ins-fonction-publique-2018-2025/categories_statutaires_evolution.csv
  unite: milliers d'agents
  perimetre: fonctionnaires (hors ouvriers et autres), six catégories statutaires
    A1 à D, plus le total (tableau 6 du rapport)
  caveats: Prolonge `fonction-publique-categories` (2015-2021), qu'elle reproduit
    à l'identique sur 2018-2020 et à l'arrondi en 2021 ; même libellés. Écarts d'arrondi
    de 0,1 millier entre la somme des catégories et le total (2019, 2023), et entre
    ce total et les fonctionnaires du tableau 5 en 2024 (518,2 contre 518,1). La catégorie
    D passe de 28,4 (2023) à 39,8 milliers (2024) sans que le rapport l'explique ;
    le mouvement est contemporain de la baisse de l'unité 1 des ouvriers (48,9 → 35,4
    milliers), rapprochement qui n'est qu'une hypothèse.
  titre_ar: الموظفون حسب الصنف القانوني (أ1-د)، 2018-2025
  unite_ar: بآلاف الأعوان
  perimetre_ar: الموظفون (باستثناء العملة والحالات الأخرى)، ستة أصناف قانونية من أ1
    إلى د، مع المجموع (الجدول 6 من التقرير)
  caveats_ar: تمدّد سلسلة 2015-2021 وتطابقها تماماً على 2018-2020 وبالتقريب سنة 2021،
    بالتسميات نفسها. فوارق تقريب بـ0,1 ألف بين مجموع الأصناف والمجموع (2019، 2023)،
    وبين هذا المجموع وعدد الموظفين في الجدول 5 سنة 2024 (518,2 مقابل 518,1). ينتقل
    الصنف د من 28,4 (2023) إلى 39,8 ألفاً (2024) دون تفسير في التقرير؛ ويتزامن ذلك
    مع انخفاض الوحدة الأولى للعملة (48,9 ← 35,4 ألفاً)، وهو تقريب لا يعدو أن يكون
    فرضية.
