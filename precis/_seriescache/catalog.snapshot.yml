    `famille` et `methode`. AUCUN PIB N''EST DE BASE DITE par ces documents. Périmètres
    : 30 entreprises (FMI), 20 plus grandes (Banque mondiale), source non retrouvée
    pour le Livre blanc (rapport 2010-2014 de l''Unité de suivi). Les ratios du Livre
    blanc sur les subventions (8,9 % du PIB en 2013, 7,5 % en 2014) sont les siens
    : ils ne viennent pas de la Banque mondiale. « Entre 9 et 10 % du PIB » est une
    estimation du gouvernement rapportée par la Banque mondiale. La clé imf-tunisia-art4-2020
    désigne la consultation de 2021 au titre de l''article IV (Country Report No.
    21/44). NON REPRIS, faute de relecture à l''image : passifs éventuels de 14 %
    du PIB et prime salariale de 34 % (Banque mondiale, cette dernière de seconde
    main), test de résistance du FMI. EFFECTIFS : les 117 416 employés de 2010 (Banque
    mondiale 2014, 104 entreprises, BANQUES ET CAISSES SOCIALES COMPRISES, tableau
    qui mêle trois dates) et les 190 000 salariés de la Banque mondiale 2020 (date
    et périmètre non dits) NE SE COMPARENT PAS aux totaux de l''annexe 9 (82 à 88
    entreprises hors banques et caisses : voir entreprises-publiques-effectifs-ensemble)
    ; aucun raccord. « 30 % des emplois du secteur formel » (milieu des années 1980)
    est une phrase du Livre blanc, sans source. LU À L''IMAGE (onze pages), chaque
    citation retrouvée dans la couche texte.'
