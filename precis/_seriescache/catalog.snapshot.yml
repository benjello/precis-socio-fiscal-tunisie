    par l'INS (2010-2022)
  caveats: 'L''INS NE DIT PAS COMMENT IL CALCULE SON TAUX ANNUEL ; le chaînage le
    redonne à 0,22 point près de 2010 à 2021 (écart de −0,02 à +0,22), la moyenne
    annuelle s''en écarte jusqu''à 1,37 point : le chaînage est retenu. 2022 : 5,61
    % contre 4,6 % publié, taux provisoire de l''INS calculé avant la révision des
    trimestres de 2022. Le taux de 2025 est provisoire. PÉRIODE T1 2001 - T1 2007,
    PREMIER PORTAIL DE L''INS (www.ins.nat.tn, indicateur 0402040, pages mises à jour
    le 06/10/2006 et le 30/06/2009, seules captures des archives du web) : (a) ces
    pages ne nomment pas la CNSS (« Source : Institut National de la Statistique (INS)
    ») : l''appui sur les salaires déclarés à la CNSS pour 2001-2006 est DÉDUIT de
    la continuité de l''indicateur (même code, mêmes valeurs que le BMS sur T2 2007
    - T1 2009, redressement de 2009 compris), non affirmé par la source ; (b) la méthode
    de la période ancienne n''est pas documentée : le panel de salariés permanents
    et les seuils viennent du guide de 2026 et ne peuvent être remontés à 2001 ; le
    libellé de 2006 dit « salaire moyen » ; (c) on ignore si l''indicateur commence
    en 2001 ou si l''affichage était tronqué ; (d) aucune autre version archivée (recherche
    CDX sur le code 0402040 et les familles de pages conjoncturelles) ; les URL d''origine
    ne répondent plus. T2 2006 vaut 1,69 dans la mise à jour de 2006, 1,45 dans celle
    de 2009, retenue ; T1 2007 (1,11) n''est dans aucun BMS en ligne.'
  titre_ar: النسبة السنوية لتطوّر الأجور المصرّح بها لدى الصندوق الوطني للضمان الاجتماعي،
