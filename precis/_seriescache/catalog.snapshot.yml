  fiche: sources/ins-fonction-publique-salaires-2010-2021.md
- id: fonction-publique-salaires
  titre: Salaire mensuel moyen de la fonction publique, 2015-2020
  sources:
  - ins-fonction-publique-2021
  build: tunisia_data.build.fonction_publique:salaires
