  perimetre: ensemble des agents de la fonction publique ; salaire brut avec contributions
  caveats: 'SÉRIE COMPOSITE PAR MILLÉSIME INS. Les rapports 2010-2014 à 2013-2017
    publient un « salaire brut moyen mensuel » ; cette série est reprise comme brut
    avec contributions car elle se raccorde à la notion explicitement nommée dans
    tab18. À partir de 2015, la source nomme explicitement le brut avec contributions.
    Arbitrage : le millésime le plus récent fait foi pour chaque année ; les valeurs
    écartées sont conservées dans salaire_brut_contributions_2010_2025_conflits.csv.
    Révisions notables : 2013 (1287,3 → 1299,4), 2014 (1334,3 → 1326,6), 2015 (1388,9
    puis 1461,8), 2016 (1580,7 puis 1644,6), 2017 (1653,5 puis 1668,3), et écarts
    d''environ un dinar entre tab18 et le rapport 2018-2025 sur 2018-2020. Montants
    en dinars courants, non déflatés.'
  titre_ar: متوسط الأجر الشهري الخام مع المساهمات في الوظيفة العمومية، 2010-2025
  unite_ar: دينار جاري / شهر
  perimetre_ar: مجموع أعوان الوظيفة العمومية؛ الأجر الخام مع المساهمات
  caveats_ar: 'سلسلة مركبة حسب طبعات المعهد الوطني للإحصاء. تنشر تقارير 2010-2014
    إلى 2013-2017 «متوسط الأجر الشهري الخام»، وتُستعمل هنا بوصفها أجراً خاماً مع المساهمات
    لأنها تتصل بالمفهوم المسمّى صراحة في الجدول 18. ابتداءً من 2015 تسمّي المصدر صراحة
    الأجر الخام مع المساهمات. التحكيم: يعتمد أحدث إصدار لكل سنة، وتُحفظ القيم المستبعدة
    في ملف salaire_brut_contributions_2010_2025_conflits.csv. مراجعات بارزة: 2013
    (1287,3 ← 1299,4)، 2014 (1334,3 ← 1326,6)، 2015 (1388,9 ثم 1461,8)، 2016 (1580,7
    ثم 1644,6)، 2017 (1653,5 ثم 1668,3)، وفروق بنحو دينار بين الجدول 18 وتقرير 2018-2025
    على 2018-2020. المبالغ بالدينار الجاري دون تصحيح للأسعار.'
