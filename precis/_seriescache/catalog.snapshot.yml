  caveats_ar: 'عدّة نسب للسنة الواحدة: تُفرز حسب المصدر والأساس وسنة الأسعار. سنة
    الأسعار ليست أساسًا: نسبة النموّ بالحجم تتعلق بأساس الحسابات وبالسنة التي تُقوَّم
    بأسعارها الكميات. تتقارب المصادر التونسية، ويبتعد عنها البنك الدولي بـ6 إلى 22
    نقطة في 1962-1965.'
  fiche: docs/pib-croissance-volume.md
