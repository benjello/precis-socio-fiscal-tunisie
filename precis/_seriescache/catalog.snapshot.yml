    (1966-2014)، والسكان الحضريون والريفيون (2024)
  caveats_ar: 'قراءات متعددة للقيمة الواحدة بحسب النشريات، دون أن تعوّض إحداها الأخرى.
    يُعتبر الوسط بلدياً متى أُحدثت به بلدية، فيتغيّر المجال من تعداد إلى آخر بإحداث
    البلديات وتوسيع حدودها. انقطاع في التصنيف سنة 2024: عوّض تصنيف «حضري/ريفي» (مشروع
    DEGURBA) التصنيف القديم «بلدي/غير بلدي»، ولا تُعدّ أرقام 2024 امتداداً للسلسلة.
    توزيع سنة 1956 غير متوفّر. لا ربط ولا استكمال. الفوارق بين النشريات مُشار إليها
    دون تصحيح.'
