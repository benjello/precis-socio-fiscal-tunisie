  perimetre: Tunisie entière, population résidente aux recensements généraux de 1956,
    1966, 1975, 1984, 1994, 2004, 2014 et 2024 ; population totale (1956-2024), population
    du « milieu communal » et du « milieu non communal » (1966-2014), « population
