  unite: milliers d'agents
  perimetre: 'fonction publique civile — quatorze entités : onze ministères, Présidence
    du gouvernement, collectivités locales, autres établissements'
  caveats: série reconstituée par l'INS par-dessus une nomenclature annuelle mouvante
    (l'annexe 2017 replie Défense, Intérieur et collectivités locales dans « Autres
    ministères » ; l'annexe 2018 les renomme « Communes ») ; rupture de périmètre
    des collectivités locales 2016→2017 ; la colonne 2021 porte trois décimales contre
    une pour 2015-2020, d'où de faux petits mouvements 2020→2021 ; hausse de la Défense
    de +35 % entre 2015 et 2018, corroborée par deux publications INS mais non commentée
    par l'INS, sur un champ qui exclut les militaires de carrière ; tout lien avec
    le contexte sécuritaire post-2015 doit être documenté séparément
  titre_ar: أعداد أعوان الوظيفة العمومية حسب الوزارة، 2015-2021
  unite_ar: بآلاف الأعوان
  perimetre_ar: 'الوظيفة العمومية المدنية — أربع عشرة وحدة: إحدى عشرة وزارة، ورئاسة
    الحكومة، والجماعات المحلية، وهياكل أخرى'
  caveats_ar: سلسلة أعاد المعهد الوطني للإحصاء بناءها فوق تسمية سنوية متغيّرة (ملحق
    2017 يدمج الدفاع والداخلية والجماعات المحلية في «وزارات أخرى»، وملحق 2018 يسمّيها
    «البلديات»)؛ انقطاع نطاق الجماعات المحلية 2016→2017؛ عمود 2021 بثلاث منازل عشرية
    مقابل منزلة واحدة لـ2015-2020، ممّا يُحدث تحرّكات طفيفة وهمية بين 2020 و2021؛
    ارتفاع الدفاع بنسبة 35٪ بين 2015 و2018، مؤكَّد لكن دون تفسير، في مجال يستثني العسكريين
    المهنيين
  fiche: sources/ins-fonction-publique-salaires-2010-2021.md
- id: bct-emploi-occupe
  titre: Population active occupée, 2007-2024
  sources:
  - bct-ra
  build: scripts/extract_bct_emploi.py:main
  raw:
  - data/raw/bct-archives/109
  output: data/processed/bct-archives/emploi_occupe.csv
  unite: milliers d'actifs occupés
  perimetre: emploi total en Tunisie, salariés ET non-salariés, tous secteurs — dans
    une économie où l'emploi informel est important
  caveats: 'SÉRIE RECONSTITUÉE : aucun rapport ne la publie d''un seul tenant, chacun
    n''en donnant que quatre à sept millésimes ; elle est recollée à travers 14 rapports.
    ARBITRAGE : le millésime le plus récent fait foi, les valeurs écartées étant consignées
    dans emploi_occupe_conflits.csv plutôt qu''effacées — l''écart entre publications
    est lui-même un fait. Les révisions sont parfois massives : 2015 a été publié
    3.822, puis 3.516, puis 3.401 et 3.402 ; la première valeur est contredite par
    la prose du rapport qui la porte (« la population active occupée a diminué de
    0,4 % »). PAS D''EXTENSION AVANT 2007 : 52 des 66 rapports ne portent pas ce tableau,
    qui n''apparaît pas dans les millésimes anciens. Le repérage se fait PAR LE TITRE
    : la numérotation n''est pas stable (n° 2-6 en 2024, 2-7 en 2011, 2015 et 2017).
    ANNÉE 2020 : le dénominateur s''effondre de 3.566 à 3.433 ; tout ratio bâti dessus
    monte mécaniquement sans qu''aucun numérateur ait bougé.'
  titre_ar: السكان النشيطون المشتغلون، 2007-2024
  unite_ar: بآلاف المشتغلين
  perimetre_ar: التشغيل الإجمالي في تونس، الأجراء وغير الأجراء، كلّ القطاعات — في
    اقتصاد يمثّل فيه التشغيل غير المنظّم حصّة معتبرة
  caveats_ar: 'سلسلة معاد تركيبها: لا ينشرها أيّ تقرير دفعة واحدة، إذ لا يعطي كلّ
    تقرير سوى أربع إلى سبع سنوات؛ وقد جُمعت عبر 14 تقريراً. الترجيح: يُعتمد أحدث تقرير،
    وتُدوَّن القيم المستبعدة في ملفّ الاختلافات بدل محوها. والمراجعات كبيرة أحياناً:
    نُشرت سنة 2015 بقيم 3.822 ثمّ 3.516 ثمّ 3.401 و3.402، والقيمة الأولى يكذّبها نصّ
    التقرير نفسه. لا امتداد قبل 2007: 52 تقريراً من 66 لا تتضمّن هذا الجدول. ويتمّ
    التعرّف بالعنوان لا بالرقم، إذ الترقيم غير ثابت. وفي 2020 ينهار المقام من 3.566
    إلى 3.433، فترتفع كلّ نسبة مبنيّة عليه آلياً دون تغيّر البسط.'
  fiche: sources/bct-archives.md
- id: ins-salaire-par-categorie
  titre: Salaire mensuel brut des fonctionnaires par catégorie statutaire, 2015-2020
  sources:
  - ins-fonction-publique-2021
  build: scripts/clean_ins_fonction_publique.py:clean_salaire_par_categorie
  raw:
  - data/raw/ins-fonction-publique-salaires-2010-2021/tab20_0.xlsx
  output: data/processed/ins-fonction-publique-salaires-2010-2021/salaire_par_categorie.csv
  unite: dinars courants / mois
  perimetre: fonctionnaires de l'État (hors ouvriers et contractuels), six catégories
    statutaires A1 à D
  caveats: 'ÉTIQUETTE CORRIGÉE : le tableau publié nomme sa troisième ligne « Catégorie
    A2 » en français alors que l''arabe y écrit « أ3 » ; le libellé A2 y paraît deux
    fois et A3 jamais. Les lignes sont rapprochées par position et l''étiquette rétablie
    — le CSV s''écarte donc sciemment du libellé publié. Montants en dinars COURANTS,
    non déflatés : une évolution de niveau ne se lit pas sans indice de prix, un rapport
    entre catégories se lit. Moyennes par catégorie, qui recouvrent des corps très
    hétérogènes. Champ : fonctionnaires seuls, d''où un effectif inférieur à celui
    de la fonction publique. La série s''arrête en 2020, non en 2021 comme celles
    des effectifs. BRUT AVEC CONTRIBUTIONS : le tableau par catégorie est seulement
    étiqueté « salaire mensuel brut », mais la pondération par les effectifs de tab8
    montre qu''il série redonne les fonctionnaires de tab19 à 0,05 dinar près (2018
    : 1 943,2), et tab19 pondéré par tab6 redonne le brut AVEC contributions de tab18
    (1 716,5 contre 1 716,6), notion explicitement nommée par l''INS. NE SE PROLONGE
    PAS par `ins-salaire-par-categorie-hors-contributions-2018-2025` (rapport INS
    2018-2025, tableau 12), qui est le brut SANS contributions : A1 2018 = 2 561,4
    ici, 2 175,3 là, pour des effectifs identiques ; le rapport entre les deux varie
    de 1,14 à 1,20 selon la catégorie et l''année, et aucun coefficient ne raccorde
    les deux séries.'
  titre_ar: الأجر الشهري الخام للموظفين حسب الصنف القانوني، 2015-2020
  unite_ar: دينار جاري / شهر
  perimetre_ar: موظفو الدولة (باستثناء العملة والمتعاقدين)، ستة أصناف قانونية من أ1
    إلى د
  caveats_ar: 'تصحيح تسمية: الجدول المنشور يسمّي سطره الثالث «الصنف أ2» بالفرنسية
    بينما يكتب بالعربية «أ3»؛ فيرد أ2 مرّتين ولا يرد أ3 أبداً. تُقابَل الأسطر بالموضع
    وتُصحَّح التسمية، فيبتعد الملفّ عمداً عن التسمية المنشورة. المبالغ بالدينار الجاري
    دون تصحيح للأسعار: لا يُقرأ تطوّر المستوى دون مؤشّر أسعار، بينما تُقرأ النسبة
    بين الأصناف. متوسّطات حسب الصنف تُخفي أسلاكاً شديدة التباين. المجال: الموظفون
    وحدهم، ومن ثمّ عدد أقلّ من مجموع الوظيفة العمومية. تنتهي السلسلة سنة 2020 لا 2021.
    أجر خام مع المساهمات: لا يحمل جدول الأصناف إلا عنوان «الأجر الشهري الخام»، لكن
    ترجيحه بأعداد الجدول 8 يعطي أجر الموظفين في الجدول 19 بفارق لا يتجاوز 0,05 دينار
    (2018: 1943,2)، والجدول 19 مرجّحاً بأعداد الجدول 6 يعطي الأجر الخام مع المساهمات
    في الجدول 18 (1716,5 مقابل 1716,6)، وهي تسمية يصرّح بها المعهد. لا تمتدّ بسلسلة
    2018-2025 (الجدول 12 من تقرير المعهد 2018-2025) لأنّها أجر خام دون المساهمات:
    أ1 سنة 2018 = 2561,4 هنا و2175,3 هناك لأعداد متطابقة؛ وتتراوح النسبة بينهما من
    1,14 إلى 1,20 حسب الصنف والسنة، فلا معامل يصل السلسلتين.'
  fiche: sources/ins-fonction-publique-salaires-2010-2021.md
- id: bct-ipc-base2015
  titre: Indice des prix à la consommation, base 100 = 2015, 2015-2025
  sources:
  - bct-ra
  build: scripts/extract_bct_ipc.py:main
  raw:
  - data/raw/bct-archives/109
  output: data/processed/bct-archives/ipc_base2015.csv
  unite: indice base 100 = 2015
  perimetre: prix à la consommation familiale, ensemble des ménages tunisiens
  caveats: 'EXTRAIT DU RAPPORT ANNUEL, ET NON DU BULLETIN : l''intitulé du BSF («
    base 100 en 2010 ») est périmé et ses valeurs récentes sont en base 2015 — voir
    docs/tables-a-extraire-pdf.md §1. L''ANNÉE DE BASE 2015 = 100 EST POSÉE PAR DÉFINITION,
    non lue : aucun rapport ne tabule son année de base, tous ne publiant que les
    millésimes récents. Série RECONSTITUÉE en recollant huit rapports, de 2018 à 2025
    (ceux de 2021 et de 2025 coupent le libellé sur trois lignes ; ils sont lus depuis
    le 2026-10-08), chacun n''en publiant que trois millésimes ; toutes les années
    communes concordent, et le script LÈVE en cas de divergence — un indice de prix
    ne se révise pas d''une publication à l''autre, contrairement aux effectifs. La
    colonne `rapports_concordants` compte les rapports qui impriment la valeur : 2025
    (186,3) n''en a qu''UN, le Rapport annuel 2025 (tableau 2-1, p. 57), qui reprend
    2024 (176,8) sans le réviser. ÉCART AU TAUX IMPRIMÉ EN 2025 : 186,3 ÷ 176,8 donne
    +5,37 %, soit 5,4 au dixième, quand le même rapport imprime 5,3 % d''inflation
    moyenne ; l''arrondi des deux indices permet 5,32 à 5,43 %, et un taux imprimé
    5,3 recouvre 5,25 à 5,35 % : les deux ne se rejoignent qu''à la limite (5,32 à
    5,35). Le rapport ne dit pas comment il calcule le taux moyen ; écart signalé,
    non expliqué, rien n''est corrigé. S''ARRÊTE EN 2025 : aucune déflation n''est
    possible au-delà, ce qui laisse sans équivalent réel les tranches d''augmentation
    programmées jusqu''en 2028. Déflater une date en cours d''année par l''indice
    ANNUEL MOYEN est une approximation.'
  titre_ar: مؤشر أسعار الاستهلاك، أساس 100 = 2015، 2015-2025
  unite_ar: مؤشر أساس 100 = 2015
  perimetre_ar: أسعار الاستهلاك العائلي، مجموع الأسر التونسية
  caveats_ar: 'مستخرج من التقرير السنوي لا من النشرة: عنوان النشرة («أساس 100 سنة
    2010») متقادم وقيمها الحديثة على أساس 2015. سنة الأساس 2015 = 100 موضوعة بالتعريف
    لا مقروءة، إذ لا يورد أيّ تقرير سنة أساسه. سلسلة معاد تركيبها من ستة تقارير، ينشر
    كلّ منها ثلاث سنوات فقط؛ وتتطابق كلّ السنوات المشتركة، ويتوقّف النصّ البرمجي عند
    أيّ اختلاف لأنّ مؤشّر الأسعار لا يُراجَع بين نشرة وأخرى. تنتهي السلسلة سنة 2025،
    فلا إمكان لأيّ تصحيح للأسعار بعدها. وتصحيح تاريخ داخل السنة بالمؤشّر السنوي المتوسّط
    تقريبٌ.'
  fiche: sources/bct-archives.md
