    de la nation (base 1983 aux prix de 1990, 2001-2008 ; base 1997, 2005-2017, et
    base 2015, 2016-2025, aux prix de l''année précédente), classeur de l''INS du
    15 août 2021 (base 2015, 2010-2020), UNdata tableau 1.2 (séries 10, 20, 30, 100,
    1000, 1961-2023, prix de 1966, 1972, 1980, 1990 ou de l''année précédente), Banque
    mondiale (1962-2025) ; `famille` : INS / institution tunisienne, rapport extérieur
