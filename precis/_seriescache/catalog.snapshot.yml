  output: data/processed/precis/steg_cout_prix_kwh.csv
  unite: millimes courants par kilowattheure (1 000 millimes = 1 dinar), hors taxes
  perimetre: 'une ligne par (famille, année, grandeur) : `cout_de_revient` et `prix_de_vente_moyen`,
    toutes tensions confondues ; familles `esmap` (prix 1994-1999), `aner` (coût 1996-1998),
    `bad_electricite_vi` (2000-2004), `bad_electricite_vii` (prix 2005-2010), `cgf_2014`
    (2008-2012, avec les composantes `cout_combustibles`, `cout_personnel`, `cout_charges_financieres_assurances`,
    `cout_amortissements`, `cout_divers`, dont la somme égale le coût), `steg_observatoire_2013_2018`
    (états financiers de la STEG puis Observatoire), `observatoire_2019_2021` (prix
    seul), `observatoire_2022_2025` ; colonnes `cle` (clés de citation de la ligne),
    `rupture` et `rupture_annee` (2007, sur la première ligne de coût après la rupture)'
  caveats: 'FAMILLES JAMAIS CHAÎNÉES : filtrer `famille` ; tracer par segments. RUPTURE
    DE 2007 : avant, le gaz est valorisé au prix administré de 90,8 DT/tep (ANER,
    BAD) ; à partir de 2008, au prix d''acquisition, soutien indirect compris (rapport
    de contrôle) puis au prix international — aucun chaînage de part et d''autre (états
    financiers 2014, note 11, p. 23). AUCUN COÛT DE REVIENT pour 1999, 2005-2007 et
    2019-2021 : aucune valeur n''est interpolée ; le prix de vente existe en 1999
    (ESMAP), en 2005-2007 (BAD) et en 2019-2021 (Observatoire : 244,0 ; 248,6 ; 244,8,
    famille `observatoire_2019_2021`, prix seul). ANER : LU SUR GRAPHIQUE, à ±1 millime
    ; la source dit le prix de vente inférieur au prix de revient en 1996 et 1997,
    ce que la lecture ne départage pas pour 1997. 2013-2018 : les états financiers
    de la STEG et l''Observatoire ont la même origine (prix de vente identique 2013-2016)
    — une seule source, non deux qui se confirment ; 2016 a deux valeurs du coût (175,7
    imprimé par l''Observatoire, 177,4 calculé d''après les états financiers), la
    seconde marquée `retenu = non`. 2022-2025 : « données provisoires avant audit
    », révisées d''une décimale d''une édition à l''autre. Le « résultat unitaire
    » de l''Observatoire (écart prix de vente moins coût de revient) n''est pas la
    subvention budgétaire. Dinars courants, aucun PIB. Voir docs/steg-gaz-electricite.md.'
  titre_ar: كلفة إنتاج الكيلوواط ساعة ومتوسط سعر بيعه دون احتساب الأداءات لدى الشركة
    التونسية للكهرباء والغاز، حسب عائلة المصدر (1994-2025)
  unite_ar: بالمليم الجاري للكيلوواط ساعة، دون احتساب الأداءات
  perimetre_ar: 'كلفة الإنتاج ومتوسط سعر البيع لكل الجهود، حسب عائلات مصادر لا تُربط:
    ESMAP (الأسعار 1994-1999)، الوكالة الوطنية للطاقات المتجددة (الكلفة 1996-1998،
    مقروءة على رسم بياني)، بنك التنمية الإفريقي (2000-2010)، تقرير هيئة الرقابة العامة
    للمالية (2008-2012)، الشركة ثم المرصد الوطني للطاقة (2013-2018)، المرصد (2022-2025)'
