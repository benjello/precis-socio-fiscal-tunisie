  - data/raw/ins-fonction-publique-salaires-historiques/Caractéristiques des agents
    de la fonction publique et leurs salaires 2011-2015.pdf
  - data/raw/ins-fonction-publique-salaires-historiques/Caractéristiques des agents
    de la fonction publique et leurs salaires 2012-2016.pdf
  - data/raw/ins-fonction-publique-salaires-historiques/Caractéristiques des agents
    de la fonction publique et leurs salaires 2013-2017.pdf
  - data/raw/ins-fonction-publique-salaires-2010-2021/tab18_0.xlsx
  - data/raw/ins-fonction-publique-2018-2025/La fonction publique - 2018-2025.pdf
  output: data/processed/ins-fonction-publique-2018-2025/salaire_brut_contributions_2010_2025.csv
  unite: dinars courants / mois
  perimetre: ensemble des agents de la fonction publique ; salaire brut avec contributions
  caveats: 'SÉRIE COMPOSITE PAR MILLÉSIME INS. Les rapports 2010-2014 à 2013-2017
    publient un « salaire brut moyen mensuel » ; cette série est reprise comme brut
    avec contributions car elle se raccorde à la notion explicitement nommée dans
    tab18. À partir de 2015, la source nomme explicitement le brut avec contributions.
    Arbitrage : le millésime le plus récent fait foi pour chaque année ; les valeurs
    écartées sont conservées dans salaire_brut_contributions_2010_2025_conflits.csv.
    Révisions notables : 2013 (1287,3 → 1299,4), 2014 (1334,3 → 1326,6), 2015 (1388,9
    puis 1461,8), 2016 (1580,7 puis 1644,6), 2017 (1653,5 puis 1668,3), et écarts
    d''environ un dinar entre tab18 et le rapport 2018-2025 sur 2018-2020. Montants
    en dinars courants, non déflatés.'
  titre_ar: متوسط الأجر الشهري الخام مع المساهمات في الوظيفة العمومية، 2010-2025
  unite_ar: دينار جاري / شهر
  perimetre_ar: مجموع أعوان الوظيفة العمومية؛ الأجر الخام مع المساهمات
  caveats_ar: 'سلسلة مركبة حسب طبعات المعهد الوطني للإحصاء. تنشر تقارير 2010-2014
    إلى 2013-2017 «متوسط الأجر الشهري الخام»، وتُستعمل هنا بوصفها أجراً خاماً مع المساهمات
    لأنها تتصل بالمفهوم المسمّى صراحة في الجدول 18. ابتداءً من 2015 تسمّي المصدر صراحة
    الأجر الخام مع المساهمات. التحكيم: يعتمد أحدث إصدار لكل سنة، وتُحفظ القيم المستبعدة
    في ملف salaire_brut_contributions_2010_2025_conflits.csv. مراجعات بارزة: 2013
    (1287,3 ← 1299,4)، 2014 (1334,3 ← 1326,6)، 2015 (1388,9 ثم 1461,8)، 2016 (1580,7
    ثم 1644,6)، 2017 (1653,5 ثم 1668,3)، وفروق بنحو دينار بين الجدول 18 وتقرير 2018-2025
    على 2018-2020. المبالغ بالدينار الجاري دون تصحيح للأسعار.'
  fiche: sources/ins-fonction-publique-2018-2025.md
- id: cnss-retrospective-ressources-emplois
  titre: 'CNSS : ressources, emplois et résultats de gestion par régime et par branche,
    1990-2004 (Rétrospective financière)'
  sources:
  - cnss-retrospective-1990-2004
  build: uv run python -m tunisia_data.scan_tables --config sources/scan/cnss-retrospective-1990-2004.yml
  raw:
  - data/raw/caisses/cnss/retrospective/cnss_retrospective_financiere_1990-2004.pdf
  output: data/processed/caisses/cnss_retrospective_1990_2004.csv
  unite: milliers de dinars courants (« mD »)
  perimetre: 'CNSS, 55 tableaux « Bilans » : RSNA, RC, étudiants, RSA, RSAA, RTNS
    (secteurs non agricole et agricole), RTTE, RTFR, artistes, AT-MP, PST, convention
    tuniso-française, et ensemble des régimes en plusieurs variantes (avec/sans CTF,
    avec/sans RC)'
  caveats: 'SCAN SANS COUCHE TEXTE, valeurs océrisées et contrôlées par les IDENTITÉS
    COMPTABLES (sous-totaux, totaux, résultat = ressources − emplois, ensemble = somme
    des régimes) ; colonne `statut` sur chaque valeur (lu, lu_corrige, deduit_identite,
    masque_reliure). LA RELIURE MASQUE une colonne d''années sur la plupart des tableaux
    (1999 surtout, 2000 sur certains) : 430 cellules sont rétablies par une identité
    à une seule inconnue et 68 par le solveur fragments + identités (chiffres visibles
    lus case par case ; valeur unique compatible avec eux et avec toutes les identités
    ; validé sans erreur sur 771 valeurs connues masquées à l''identique), jamais
    devinées dans la colonne `valeur` ; 360 y restent vides, listées avec leur fragment
    visible dans cnss_retrospective_valeurs_a_retrouver.csv (221 à lire sur l''original,
    le reste s''en déduit). ESTIMATIONS PROVISOIRES : en attendant l''original, ces
    360 cellules (1999 surtout, quelques-unes de 2000) reçoivent une estimation tracée
    (colonnes `estimation`, `methode_estimation`, `incertitude` ; tendance de la ligne,
    candidats compatibles avec les chiffres visibles, mise en cohérence avec les identités
    comptables), et `valeur_ou_estimation` réunit valeurs et estimations pour l''exploitation
    directe : les valeurs 1999 — et certaines de 2000 — de cette colonne sont donc
    pour partie des ESTIMATIONS, à ne pas citer comme données publiées. Estimations
    publiées et versionnées dans cnss_retrospective_estimations.csv, remplacées quand
    l''original est relu. Quatorze identités s''écartent de 2 mD entre valeurs imprimées
    vérifiées à l''image (totaux 2004 de tableaux jumeaux, emplois 1996) : écarts
    de la source, laissés tels quels. Unité : milliers de dinars (les cotisations
    2000-2004 recoupent la série cnss-cotisations, en millions, à 1 % près). Comptabilité
    « Bilans » (droits constatés) : ne pas confondre avec les cotisations encaissées.
    Montants courants, non déflatés.'
  titre_ar: 'الصندوق الوطني للضمان الاجتماعي: الموارد والاستعمالات ونتائج التصرّف
    حسب النظام والفرع، 1990-2004 (الحصيلة المالية الاسترجاعية)'
  unite_ar: آلاف الدنانير الجارية
  perimetre_ar: 'الصندوق الوطني للضمان الاجتماعي، 55 جدولاً «الموازنات»: نظام الأجراء
    غير الفلاحيين، النظام التكميلي، الطلبة، الأجراء الفلاحيون، النظام الفلاحي المحسّن،
    العملة غير الأجراء (القطاع غير الفلاحي والقطاع الفلاحي)، العملة التونسيون بالخارج،
    ذوو الدخل الضعيف، الفنّانون، حوادث الشغل والأمراض المهنية، الحماية الاجتماعية
    للعمّال، الاتفاقية التونسية الفرنسية، ومجموع الأنظمة في عدّة صيغ'
  caveats_ar: 'وثيقة ممسوحة ضوئياً دون طبقة نصّية: قيم مقروءة آلياً ومضبوطة بالمتطابقات
    المحاسبية (المجاميع الفرعية والمجاميع، النتيجة = الموارد − الاستعمالات، المجموع
    = حاصل الأنظمة)، مع عمود «الحالة» لكلّ قيمة. يحجب التجليد عموداً من السنوات في
    أغلب الجداول (1999 خاصّة): تُستعاد 430 خانة بمتطابقة ذات مجهول واحد و68 بالجمع
    بين الأرقام الظاهرة والمتطابقات (قيمة وحيدة)، ولا تُخمَّن أبداً في عمود «القيمة»
    (valeur)؛ وتبقى فيه 360 خانة فارغة مدرجة مع الأرقام الظاهرة منها في قائمة القيم
    الواجب قراءتها في النسخة الورقية (221 منها، والباقي يُستنتج منها). تقديرات مؤقّتة:
    في انتظار النسخة الورقية، تحمل هذه الخانات الـ360 (سنة 1999 خاصّة، وبعض خانات
    سنة 2000) تقديراً موثّقاً (الأعمدة estimation وmethode_estimation وincertitude:
    اتّجاه السطر، والقيم المرشّحة المتوافقة مع الأرقام الظاهرة، والملاءمة مع المتطابقات
    المحاسبية)، ويجمع العمود valeur_ou_estimation القيم والتقديرات للاستعمال المباشر:
    فقيم 1999 — وبعض قيم 2000 — في هذا العمود تقديرات في جزء منها، لا يُستشهد بها
    كبيانات منشورة. التقديرات المنشورة محفوظة في الملف cnss_retrospective_estimations.csv،
    وتُستبدل عند قراءة النسخة الأصلية. أربع عشرة متطابقة تختلف بألفي دينار بين قيم
    مطبوعة تحقّقنا منها بالصورة: فروق في المصدر نفسه. الوحدة ألف دينار، والمحاسبة
    على أساس «الموازنات» لا الاشتراكات المستخلصة. مبالغ جارية.'
  fiche: sources/cnss-retrospective-financiere-1990-2004.md
- id: ins-annuaire-ipc
  titre: Indice général des prix à la consommation familiale, base 100 en 1970, lu
    dans chaque annuaire statistique de l'INS, 1976-2023
  sources:
  - ins-annuaire
  build: scripts/extract_ipc_longue.py:main
  raw:
  - data/raw/ins-publications/annuaire-statistique
  output: data/processed/ins-publications/ipc_annuaires_base1970.csv
  unite: indice, base 100 en 1970 (moyenne annuelle)
  perimetre: colonne de base 1970 du tableau « Évolution de l'indice général des prix
    à la consommation familiale selon les différentes bases » des annuaires 1995-2001,
    1998-2002 et 1999-2003 (tableau 13.7) et 2019-2023 (tableau 13.6), une ligne par
    annuaire et par année, telle qu'imprimée
  caveats: 'SÉRIE HOMOGÈNE, SOURCE DE LA PARTIE 1976-2023 DE `ipc-longue-periode`,
    AVEC TOUTES LES LECTURES, Y COMPRIS CELLES QUE LA SÉRIE RACCORDÉE ÉCARTE : la
    colonne `retenu` dit laquelle celle-ci reprend (le plus récent annuaire fait foi).
    Les coquilles et valeurs provisoires sont conservées telles qu''imprimées : l''annuaire
    1995-2001 imprime 108,2 pour 1985 (288,0 dans les suivants) et 645,4, provisoire,
    pour 2001 (640,5 ensuite). LU PAR LE PROGRAMME (pdftotext) ; le script contrôle
    cinq valeurs attendues et le recollement de l''annuaire 2019-2023 aux précédents
    en 1999, 2001 et 2003. Les lectures obtenues commencent en 1976 (annuaire 1995-2001),
    1983 (1998-2002), 1984 (1999-2003) et 1999 (2019-2023) ; avant 1976, la série
    raccordée prend les rapports de la BCT (`bct-cout-de-la-vie`). Les autres annuaires
    présents dans data/raw/ins-publications/annuaire-statistique/ ne sont pas lus.'
  titre_ar: الرقم القياسي العام لأسعار الاستهلاك العائلي، أساس 100 سنة 1970، كما ورد
    في كلّ حوليّة إحصائية للمعهد الوطني للإحصاء، 1976-2023
  unite_ar: رقم قياسي، أساس 100 سنة 1970 (معدّل سنوي)
  perimetre_ar: عمود أساس 1970 من جدول تطوّر الرقم القياسي العام لأسعار الاستهلاك
    العائلي حسب مختلف سنوات الأساس، في حوليّات 1995-2001 و1998-2002 و1999-2003 (الجدول
    13.7) و2019-2023 (الجدول 13.6)، سطر لكلّ حوليّة ولكلّ سنة، كما طُبع
  caveats_ar: 'سلسلة متجانسة هي مصدر الجزء 1976-2023 من السلسلة الطويلة، بكلّ القراءات
    بما فيها المستبعدة: يبيّن العمود `retenu` القيمة المعتمدة (أحدث حوليّة هي المرجع).
    الأخطاء المطبعية والقيم الوقتية محفوظة كما طُبعت: حوليّة 1995-2001 تطبع 108,2
    لسنة 1985 (288,0 في الحوليّات اللاحقة) و645,4 الوقتية لسنة 2001 (ثمّ 640,5). قراءة
    آلية مع مراقبة خمس قيم وتطابق حوليّة 2019-2023 مع سابقاتها.'
  fiche: sources/ins-annuaires-statistiques.md
- id: finances-locales-communes-agregats
  titre: 'Finances des communes : exécution du budget, impôts locaux, FCCL et dotations,
    2008-2023'
  sources:
  - dgct-donnees-ouvertes
  build: uv run --with openpyxl --with xlrd python scripts/build_finances_locales_communes.py
  raw:
  - data/raw/finances_locales/dgct_portail/Données-Financières-Globales.xls
  - data/raw/finances_locales/dgct_portail/fiscaliteslocale.xls
  - data/raw/finances_locales/dgct_portail/fccl.xls
  - data/raw/finances_locales/dgct_portail/Dotation.xls
  - data/raw/finances_locales/dgct_portail/Les-dépenses-ordinaires.xls
  - data/raw/finances_locales/dgct_portail/Ratios-financiers.xls
  output: data/processed/finances_locales/communes_agregats_2008_2023.csv
  unite: millions de dinars courants (MD) ; ratios en fraction
  perimetre: 'communes (budgets, comptabilité publique, réalisations) ; quotes-parts
    FCCL et dotation exceptionnelle aussi pour les conseils régionaux. 2008-2019 :
    agrégats publiés par la DGCT (communes_dgct_agregats_2008_2019.csv) ; 2018-2023
    : somme des 350 budgets par commune. Colonnes source, statut, retenu.'
  caveats: 'DEUX SOURCES, GARDÉES TOUTES DEUX SUR 2018-2019 (colonne `retenu` : DGCT
    jusqu''en 2019, somme des communes ensuite). Les recettes concordent à l''arrondi
    près ; LES DÉPENSES NON (titre 1 : +1,7 MD en 2018, +7,2 MD en 2019 ; titre 2
    : +0,6 et +5,9), écart non expliqué, figé dans les tests. 2021 = SITUATION AU
    25/12/2021, non définitive (droits et redevances 54,8 MD contre 90-114 les autres
    années). 2023 = PROVISOIRE (arrêté au 10/01/2024). IMPÔTS UN À UN (TIB, TNB, TCL,
    taxe hôtelière, marchés) VIDES EN 2020-2021 : fichiers par commune sans détail
    d''article ; rien n''est interpolé. Le FCCL est supprimé au 1er janvier 2018 mais
    la DGCT garde l''intitulé « subventions annuelles » en 2018-2019 : rupture de
    nature ; réserve à 18 % jusqu''en 2017, 15 % ensuite. Les recettes du titre 2
    comprennent l''épargne et les excédents reportés du titre 1 : T1 + T2 n''est pas
    un total consolidé. Recettes fiscales = catégories 1 et 2 (nomenclature 2018-2022),
    qui exclut les catégories 3-4 rangées parmi les recettes fiscales en 2023. PÉRIMÈTRE
    NON CONSTANT : 264 communes en 2012, 350 à partir de 2016-2017. Montants courants.'
  titre_ar: 'مالية البلديات: تنفيذ الميزانية والجباية المحلية والمال المشترك للجماعات
    المحلية والاعتمادات، 2008-2023'
  unite_ar: بملايين الدنانير الجارية؛ النسب كسور
  perimetre_ar: البلديات (ميزانيات، محاسبة عمومية، إنجازات)؛ 2008-2019 مجاميع منشورة
    من الإدارة العامة للجماعات المحلية، و2018-2023 مجموع ميزانيات البلديات الـ350
  caveats_ar: مصدران محفوظان معاً على 2018-2019 (عمود retenu). تتطابق الموارد بعد
    التقريب ولا تتطابق النفقات (فارق غير مفسَّر). 2021 وضعية في 25/12/2021 غير نهائية،
    و2023 وقتية (10/01/2024). الأداءات واحداً واحداً فارغة في 2020-2021 ولا يُستكمل
    شيء. أُلغي المال المشترك في 1 جانفي 2018 مع بقاء التسمية في 2018-2019. موارد العنوان
    الثاني تشمل الفوائض المنقولة من العنوان الأول. عدد البلديات غير ثابت (264 سنة
    2012 ثمّ 350). مبالغ جارية.
  fiche: sources/finances-locales-communes.md
