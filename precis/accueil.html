<!-- Style de la page d'accueil du précis, partagé par le français et l'arabe.
     Inclus par `include-in-header: ../accueil.html` dans precis/<langue>/index.qmd.
     Propriétés logiques (inline/block) : la mise en page se retourne d'elle-même en RTL. -->
<style>
  .lien-langue {
    text-align: end;
    font-size: 0.95rem;
    margin-block: -0.5rem 1rem;
  }
  .lien-langue a {
    text-decoration: none;
    padding-block: 0.15rem;
    padding-inline: 0.6rem;
    border: 1px solid rgba(0, 0, 0, 0.12);
    border-radius: 999px;
  }
  .lien-langue a:hover,
  .lien-langue a:focus-visible {
    background: rgba(var(--bs-primary-rgb, 13, 110, 253), 0.08);
  }

  .objet-precis {
    font-size: 1.1rem;
    line-height: 1.6;
    margin-block-end: 1.5rem;
  }

  /* Sommaire numéroté des volumes */
  .sommaire-volumes > ol {
    list-style: none;
    counter-reset: volume;
    padding: 0;
    margin-block: 0.5rem 1.5rem;
  }
  .sommaire-volumes > ol > li {
    counter-increment: volume;
    position: relative;
    display: grid;
    grid-template-columns: 3.2rem minmax(0, 1fr);
    column-gap: 0.75rem;
    align-items: baseline;
    padding-block: 0.75rem;
    padding-inline: 0.75rem;
    margin: 0;
    border-block-end: 1px solid rgba(0, 0, 0, 0.12);
    transition: background-color 0.15s ease-in-out;
  }
  .sommaire-volumes > ol > li:first-child {
    border-block-start: 1px solid rgba(0, 0, 0, 0.12);
  }
  .sommaire-volumes > ol > li::before {
    content: counter(volume, upper-roman);
    grid-column: 1;
    grid-row: 1 / span 2;
    text-align: end;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.35rem;
    font-weight: 600;
    color: var(--bs-secondary-color, #6c757d);
    font-variant-numeric: lining-nums;
  }
  .sommaire-volumes > ol > li > p {
    grid-column: 2;
    margin: 0;
  }
  .sommaire-volumes > ol > li > p:first-of-type {
    font-size: 1.2rem;
    font-weight: 600;
  }
  .sommaire-volumes > ol > li > p + p {
    margin-block-start: 0.2rem;
    color: var(--bs-secondary-color, #555);
    line-height: 1.5;
  }
  .sommaire-volumes > ol > li a {
    text-decoration: none;
  }
  /* Toute la ligne du volume est cliquable. */
  .sommaire-volumes > ol > li a::after {
    content: "";
    position: absolute;
    inset: 0;
  }
  .sommaire-volumes > ol > li:hover,
  .sommaire-volumes > ol > li:focus-within {
    background-color: rgba(var(--bs-primary-rgb, 13, 110, 253), 0.06);
  }

  .lecture-precis ul {
    padding-inline-start: 1.25rem;
  }
  .lecture-precis li {
    margin-block-end: 0.35rem;
  }

  @media (max-width: 575.98px) {
    .sommaire-volumes > ol > li {
      grid-template-columns: 2.4rem minmax(0, 1fr);
      column-gap: 0.5rem;
      padding-inline: 0.4rem;
    }
    .sommaire-volumes > ol > li::before {
      font-size: 1.15rem;
    }
    .sommaire-volumes > ol > li > p:first-of-type {
      font-size: 1.1rem;
    }
  }
</style>

<!-- La page d'accueil est rendue seule, hors des `_quarto.yml` qui portent `dir: rtl` pour les
     livres arabes ; le front matter, traduit depuis le français, ne peut pas le porter non plus.
     L'orientation se déduit donc de l'URL. -->
<script>
  if (/\/ar\//.test(location.pathname)) {
    document.documentElement.setAttribute("lang", "ar");
    document.documentElement.setAttribute("dir", "rtl");
  }
</script>
