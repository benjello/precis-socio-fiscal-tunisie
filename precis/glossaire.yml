        سنة 2012، ثم انتهى العمل به في 2 جويلية 2019 بإلغاء الأمر الذي أبقى عليه،
        دون أن يُذكر بالاسم ودون أن يخلفه برنامج آخر؛ وتتواصل العقود الجارية إلى
        نهاية مدتها.
      synonymes: []

