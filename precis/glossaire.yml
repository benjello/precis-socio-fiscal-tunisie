    fr:
      terme: Caisse de compensation des allocations familiales
      definition: >
        Organisme agréé qui sert, sous le régime du décret du 8 juin 1944, les
        allocations familiales des salariés de ses employeurs adhérents, sur
        leurs cotisations. Trois caisses existaient ; la loi n° 58-130 leur
        retire l'agrément et leur substitue une caisse unique (art. 1 et 5).
      synonymes: [caisse d'allocations familiales]
    ar:
      terme: صندوق تعويض المنح العائلية
      definition: >
        هيكل مصادق عليه يصرف، في إطار الأمر المؤرخ في 8 جوان 1944، المنح
        العائلية لأجراء المؤجرين المنخرطين فيه، من مساهماتهم. وكانت هذه
        الصناديق ثلاثة؛ وقد سحب القانون عدد 130 لسنة 1958 المصادقة الممنوحة لها
        وعوّضها بصندوق وحيد (الفصلان 1 و5).
      synonymes: []

  - id: surcompensation
    acronyme: null
    statut: provisoire
    references: []
    source_definition: {ref: decret-1956-11-08-surcompensation, locator: "art. 2"}
    voir_aussi: [caisse-compensation-allocations-familiales]
    fr:
      terme: Surcompensation
      definition: >
        Mécanisme de péréquation entre caisses d'allocations familiales
        organisé par le décret du 8 novembre 1956 : les employeurs des caisses
        dont le rapport des prestations aux salaires est inférieur à celui de
        l'ensemble des caisses acquittent une contribution spéciale, versée à un
        compte du Trésor qui subventionne les caisses dont ce rapport est
        supérieur.
      synonymes: []
    ar:
      terme: الزيادة في تعويض المنح العائلية
      definition: >
        آلية تعديل بين صناديق المنح العائلية نظّمها الأمر المؤرخ في 8 نوفمبر
        1956: يدفع مؤجرو الصناديق التي تقلّ فيها نسبة المنح إلى الأجور عن نسبة
        مجموع الصناديق مساهمة خاصة تُدفع إلى حساب بالخزينة يمنح إعانات للصناديق
        التي تفوق فيها هذه النسبة.
      synonymes: []

