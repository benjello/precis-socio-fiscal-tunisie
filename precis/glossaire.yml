    statut: valide
    references: [decret2023-461]
    source_definition: {ref: decret2019-542, locator: "art. 5-11"}
    # Le décret gouvernemental n° 2019-542 n'a pas d'édition française en ligne. Le seul
    # français lu au JORT est celui du décret n° 2023-461, qui écrit « contrat
    # d'insertion à la vie professionnelle » en regard de « عقد الإعداد للحياة المهنية »,
    # sans sigle. « Initiation » — qui rend « الإعداد » comme dans le stage de 1987 — est
    # l'usage et porte le sigle CIVP : il reste en entrée, « insertion » en synonyme.
    source_traduction: {ref: decret2019-542, locator: "art. 5"}
    voir_aussi: [sivp, cides, caip, contrat-dignite, indemnite-de-stage]
    fr:
      terme: Contrat d'initiation à la vie professionnelle
      definition: >
        Programme du Fonds national de l'emploi fixé en juillet 2019 par le décret
        gouvernemental n° 2019-542 : c'est le stage d'initiation à la vie
        professionnelle, devenu un contrat. Il
        est ouvert aux demandeurs d'un premier emploi, diplômés du supérieur ou non,
        pour douze mois renouvelables une fois, avec une indemnité mensuelle de
        l'État. En juin 2023, le décret n° 2023-461 l'écrit en français « contrat
        d'insertion à la vie professionnelle » et subordonne l'accueil de nouveaux
        bénéficiaires à l'insertion de la moitié de ceux que l'entreprise a
        accueillis les trois années précédentes.
      synonymes: [contrat d'insertion à la vie professionnelle]
    ar:
      terme: عقد الإعداد للحياة المهنية
      definition: >
        برنامج من برامج الصندوق الوطني للتشغيل ضبطه في جويلية 2019 الأمر الحكومي
        عدد 542 لسنة 2019: هو تربص الإعداد للحياة المهنية وقد صار عقدا. ويُفتح
        لطالبي الشغل لأول مرة،
        من حاملي شهادات التعليم العالي ومن غيرهم، لمدة اثني عشر شهرا قابلة
        للتجديد مرة واحدة، مع منحة شهرية تسندها الدولة. وفي جوان 2023 علّق الأمر
        عدد 461 لسنة 2023 قبول منتفعين جدد على إدماج نصف من قبلتهم المؤسسة خلال
        السنوات الثلاث السابقة.
      synonymes: []

  - id: cides
    acronyme: CIDES
    statut: valide
    references: [decret2011-1, decret2012-2369, decret2019-542]
    source_definition: {ref: decret2009-349, locator: "art. 11-19"}
    source_traduction: {ref: decret2009-349, locator: "art. 1er"}
