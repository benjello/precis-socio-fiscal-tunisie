    acronyme: null
    statut: provisoire
    references: [loi-88-61-tva]
    source_definition: {ref: loi-88-61-tva, locator: "tableau A"}
    voir_aussi: [exoneration-tva, tva]
    fr:
      terme: Tableau A du code de la TVA
      definition: >
        Annexe du code énumérant les produits et opérations exonérés de la
        taxe. Toute modification passe par une loi, le plus souvent une loi de
        finances.
      synonymes: []
    ar:
      terme: الجدول « أ »
      definition: ""
      synonymes: []

  - id: tableau-b-tva
    acronyme: null
