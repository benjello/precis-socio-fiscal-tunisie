      definition: >
        صندوق وحيد عُهد إليه بدفع المنح العائلية بمقتضى القانون عدد 130 لسنة
        1958 المؤرخ في 22 نوفمبر 1958، ابتداءً من 15 ديسمبر 1958، عوضًا عن
