      definition: >
        برنامج من برامج الصندوق الوطني للتشغيل أحدثه الأمر الحكومي عدد 904 لسنة
        2016: مرافقة فردية لطالب الشغل نحو مشروع مهني، مدتها اثنا عشر شهرا قابلة
        للتمديد بستة أشهر، مع منحة شهرية. وأعاده الأمر الحكومي عدد 542 لسنة 2019.
      synonymes: []

  - id: programme-appui-promoteurs
    acronyme: PAPPE
    statut: valide
    references: [decret2011-621, decret2012-2369, decret2019-542, decret2023-461]
    source_definition: {ref: decret2009-349, locator: "art. 1er et 34"}
    # Entrée au nom du texte fondateur, lu en regard à l'art. 1er du décret n° 2009-349
    # (arabe à l'image). À partir du décret n° 2012-2369, « programme d'appui aux
    # promoteurs des petites entreprises » ; paire « appui » / « دعم » lue en regard au
    # décret n° 2023-461 (les deux éditions), qui en étend l'intitulé.
    source_traduction: {ref: decret2009-349, locator: "art. 1er"}
    voir_aussi: [fonds-national-emploi, aneti]
    fr:
      terme: Programme d'accompagnement des promoteurs des petites entreprises
      definition: >
        Programme du Fonds national de l'emploi créé par le décret n° 2009-349 pour
        ceux qui créent une petite entreprise : sessions de formation, assistance
        technique et, pendant la première phase d'implantation du projet, une
        indemnité mensuelle. En octobre 2012, le « programme d'appui aux promoteurs
        des petites entreprises » le remplace, nom que garde le décret
        gouvernemental n° 2019-542 ; en juin 2023, le décret n° 2023-461 l'étend aux
        entreprises de l'économie sociale et solidaire et aux sociétés
        communautaires.
      synonymes: [programme d'appui aux promoteurs des petites entreprises]
    ar:
      terme: برنامج مرافقة باعثي المؤسسات الصغرى
      definition: >
        برنامج من برامج الصندوق الوطني للتشغيل أحدثه الأمر عدد 349 لسنة 2009
        لفائدة باعثي المؤسسات الصغرى: دورات تأهيل، ومساعدة فنية، ومنحة شهرية خلال
        المرحلة الأولى لتركيز المشروع. وعوّضه في أكتوبر 2012 «برنامج دعم باعثي
        المؤسسات الصغرى»، وهي التسمية التي أبقى عليها الأمر الحكومي عدد 542 لسنة
        2019؛ وفي جوان 2023 وسّعه الأمر عدد 461 لسنة 2023 ليشمل مؤسسات الاقتصاد
        الاجتماعي والتضامني والشركات الأهلية.
      synonymes: [برنامج دعم باعثي المؤسسات الصغرى]

  - id: programme-amal
    acronyme: null
    statut: valide
    references: [decret2012-953]
    source_definition: {ref: decret2011-621, locator: "art. 40 sexies-40 octies"}
    # Arabe lu à l'image (édition arabe du JORT n° 38 de 2011, art. 40 sexies et
    # 40 octies). « AMAL » est le nom d'usage : il ne figure dans aucune des deux
    # éditions du décret, et sa graphie arabe n'est pas relevée.
    source_traduction: {ref: decret2011-621, locator: "art. 40 octies"}
    voir_aussi: [programme-forsati, indemnite-de-stage]
    fr:
      terme: Programme de recherche active d'emploi
      definition: >
        Programme institué par le décret n° 2011-621 du 23 mai 2011 et connu sous le
        nom d'usage « AMAL » : une indemnité mensuelle servie pendant un an au plus
        aux demandeurs d'emploi, plus élevée pour les diplômés du supérieur. Il est abrogé à compter du 1^er^ janvier 2012 et
        remplacé par un programme d'encouragement à l'emploi (décret n° 2012-953).
      synonymes: [AMAL, programme AMAL]
    ar:
      terme: برنامج البحث النشيط عن شغل
      definition: >
        برنامج أحدثه الأمر عدد 621 لسنة 2011 المؤرخ في 23 ماي 2011: منحة شهرية
        تُسند لمدة أقصاها سنة لطالبي الشغل، وهي أرفع لحاملي شهادات التعليم
        العالي. وأُلغي ابتداء من غرة جانفي 2012 وعوّضه برنامج
        آخر بمقتضى الأمر عدد 953 لسنة 2012.
      synonymes: []

  - id: contrat-emploi-formation
    acronyme: null
    statut: valide
    references: [loi81-75, decret81-1220, loi93-17, decret2009-349]
    source_definition: {ref: decret93-1049, locator: "art. 18-21"}
    # Arabe lu à l'image (édition arabe du JORT n° 36 de 1993, scan océrisé) : intitulé
    # du chapitre II et art. 23. La LF 2000 (art. 17, OCR) écrit dans l'ordre inverse
    # « عقود التكوين والتشغيل ». Les éditions arabes de la loi n° 81-75 et du décret
    # n° 81-1220 ne sont pas lues.
    source_traduction: {ref: decret93-1049, locator: "art. 23"}
    voir_aussi: [sivp, tfp, fonds-formation-apprentissage, salaire-minimum-garanti]
    fr:
      terme: Contrat emploi-formation
      definition: >
        Contrat de stage d'adaptation professionnelle issu de la loi n° 81-75 du
        9 août 1981 sur la promotion de l'emploi des jeunes : l'entreprise accueille
        un jeune pendant un an et reçoit de l'État une subvention, avec une
        exonération de la part patronale des cotisations sociales. Le décret
        n° 93-1049 le reprend, l'employeur versant au stagiaire une bourse égale
        aux deux tiers du salaire minimum garanti en vigueur dans son secteur
        d'activité. Il cesse le 16 février 2009, avec l'abrogation du décret de 1993
        par le décret n° 2009-349, qui ne le nomme pas, ne le compte pas parmi ses
        programmes et ne le fait pas passer au Fonds national de l'emploi.
      synonymes: []
    ar:
      terme: عقد التشغيل والتكوين
      definition: >
        عقد تربص للتأهيل المهني منبثق عن القانون عدد 75 لسنة 1981 المؤرخ في 9 أوت
        1981: تقبل المؤسسة شابا لمدة سنة وتنتفع بمنحة
        من الدولة وبإعفاء من مساهمة الأعراف في الضمان الاجتماعي. وأعاده الأمر عدد
        1049 لسنة 1993، ويسند المشغّل فيه للمتربص منحة تساوي ثلثي الأجر الأدنى
        المضمون المعمول به في قطاع النشاط الذي ينتمي إليه. وانتهى العمل به في
        16 فيفري 2009 بإلغاء أمر سنة 1993 بمقتضى الأمر عدد 349 لسنة 2009، الذي لم
        يذكره بالاسم ولم يجعله من برامجه ولم يحمله على الصندوق الوطني للتشغيل.
      synonymes: []

  - id: ouvriers-de-chantiers
    acronyme: null
    statut: provisoire
    references: []
    # `source_definition` vide : le texte qui institue le mécanisme n'est pas identifié
    # (fiche r-chantiers-regionaux-texte-fondateur). Paire lue à l'intitulé du décret
    # gouvernemental n° 2021-436 : « ouvriers des chantiers régionaux et des chantiers
    # agricoles » / « عملة الحضائر الجهوية والحضائر الفلاحية » ; l'entrée resserre les
    # deux formules, d'où le statut.
    source_traduction: {ref: decret2021-436}
    voir_aussi: [politique-active-emploi, fonds-national-emploi]
    fr:
      terme: Ouvriers de chantiers
      definition: >
        Travailleurs employés sur les chantiers régionaux et les chantiers agricoles
        que l'État finance au titre du soutien à l'emploi. Le décret gouvernemental
        n° 2021-436 du 17 juin 2021 met fin à ce mécanisme : ceux qui étaient en
        exercice continu au 20 octobre 2020 sont, selon leur âge, intégrés dans la
        fonction publique, maintenus en activité jusqu'à 60 ans ou sortis du
        mécanisme avec une allocation.
      synonymes: [ouvriers des chantiers régionaux et des chantiers agricoles]
    ar:
      terme: عملة الحضائر
      definition: >
        عملة مشغَّلون بالحضائر الجهوية والحضائر الفلاحية التي تموّلها الدولة بعنوان
        دعم التشغيل. وقد أنهى الأمر الحكومي عدد 436 لسنة 2021 المؤرخ في 17 جوان
        2021 العمل بهذه الآلية: فالمباشرون منهم بصفة مستمرة في 20 أكتوبر 2020
        يُدمجون، بحسب سنّهم، في الوظيفة العمومية، أو يواصلون نشاطهم إلى سن الستين،
        أو يغادرون الآلية مع منحة.
      synonymes: [عملة الحضائر الجهوية والحضائر الفلاحية]

  - id: indemnite-de-stage
    acronyme: null
    statut: valide
    references: [arrete-2009-03-19-indemnites-fne, decret2019-542]
    source_definition: {ref: decret2009-349, locator: "art. 8 et 45"}
    # Paire lue en regard à l'art. 45 du décret n° 2009-349 (dispositions transitoires ;
    # arabe relu à l'image, p. 582 de l'édition arabe) ; « منحة التربص » aussi au décret
    # gouvernemental n° 2019-542, art. 61. Les articles de fond écrivent « indemnité
    # mensuelle » / « منحة شهرية » (art. 8).
    source_traduction: {ref: decret2009-349, locator: "art. 45"}
    voir_aussi: [sivp, civp, aneti, prise-en-charge-contribution-patronale]
    fr:
      terme: Indemnité de stage
      definition: >
        Somme que l'État verse chaque mois, par l'intermédiaire de l'agence chargée
        de l'emploi, au bénéficiaire d'un stage ou d'un contrat d'insertion, pendant
        toute sa durée. Elle se distingue de l'indemnité complémentaire que
        l'entreprise d'accueil doit verser de son côté. Son montant, fixé par
        programme, est modifié par les décrets successifs.
      synonymes: [indemnité mensuelle]
    ar:
      terme: منحة التربص
      definition: >
        مبلغ تسنده الدولة شهريا، عن طريق الوكالة المكلفة بالتشغيل، للمنتفع بتربص
        أو بعقد إدماج طيلة مدته. وهي غير المنحة التكميلية التي تلتزم المؤسسة
        المحتضنة بإسنادها من جهتها. ويُضبط مقدارها لكل برنامج، وتنقّحه الأوامر
        المتعاقبة.
      synonymes: [منحة شهرية]

  - id: prise-en-charge-contribution-patronale
    acronyme: null
    statut: valide
    references: [loi97-79, lf-2004, lf-2005, decret2010-87, decret2012-2369, decret2017-358, decret2019-542]
    source_definition: {ref: decret2009-349, locator: "art. 15"}
    # Paire lue en regard à l'art. 15 du décret n° 2009-349 (arabe relu à l'image,
    # p. 579 de l'édition arabe) ; l'entrée reprend la formule entière des deux éditions.
    # Même formule arabe, avec « الصندوق » seul, aux art. 9, 13 et 22 du décret
    # gouvernemental n° 2019-542.
    source_traduction: {ref: decret2009-349, locator: "art. 15"}
    voir_aussi: [cotisations-sociales, fonds-national-emploi, cides, civp, contrat-dignite]
    fr:
      terme: Prise en charge par le Fonds national de l'emploi de la contribution patronale au régime légal de sécurité sociale
      definition: >
        Avantage accordé à l'entreprise qui recrute : la part patronale des
        cotisations de sécurité sociale sur le salaire du nouveau recruté est payée
        à sa place, pendant une durée limitée, par l'État puis par le Fonds national
        de l'emploi. La mesure naît en novembre 1997 (loi n° 97-79) : l'État la
        prend à sa charge pendant cinq ans pour le recrutement de diplômés du
        supérieur. La loi de finances pour 2005 la porte à sept ans, à taux
        dégressif, pour les recrutements de 2005 à 2009 ; une prise en charge d'une
        part du salaire existe à côté d'elle depuis 2004. Le décret n° 2009-349
        applique le même barème, à la charge du Fonds, aux recrutements issus d'un
        contrat d'insertion des diplômés. Le Fonds reprend la mesure en janvier
        2010, et son terme est fixé au 31 décembre 2014. Les programmes de 2017 et
        de 2019 comportent une prise en charge limitée à deux ans.
      synonymes: [prise en charge de la contribution patronale, prise en charge des cotisations patronales]
    ar:
      terme: تكفل الصندوق الوطني للتشغيل بمساهمة الأعراف في النظام القانوني للضمان الاجتماعي
      definition: >
        امتياز يُمنح للمؤسسة المنتدِبة: تُدفع عوضا عنها، لمدة محدودة، مساهمة
        الأعراف في الضمان الاجتماعي بعنوان أجر المنتدَب الجديد، تتكفل بها الدولة
        ثم الصندوق الوطني للتشغيل. وقد أُحدث هذا الامتياز في نوفمبر 1997 (القانون
        عدد 79 لسنة 1997): تتكفل الدولة بالمساهمة لمدة خمس سنوات عند انتداب
        حاملي شهادات التعليم العالي. ورفع قانون المالية لسنة 2005 المدة إلى سبع
        سنوات وبنسب تنازلية بالنسبة إلى المنتدبين من سنة 2005 إلى سنة 2009؛
        ويوجد إلى جانبه منذ سنة 2004 تكفل الدولة بجزء من الأجر. وأخذ الأمر عدد
        349 لسنة 2009 بالجدول نفسه، على حساب الصندوق، للانتدابات الناتجة عن عقد
        إدماج حاملي شهادات التعليم العالي. وتولّى الصندوق هذا الامتياز في جانفي
        2010، وحُدّد أجله بيوم 31 ديسمبر 2014. وتتضمن برامج سنتي 2017 و2019
        تكفلا محصورا في سنتين.
      synonymes: []

  # --- Compensation (volume « Prestations sociales », chapitre « La compensation ») ---
  # Passes 1 et 2 du 6 octobre 2026. Les entrées qui portent une `source_traduction`
  # ont un terme arabe lu sur l'édition arabe du texte cité ; les autres non, et
  # restent `provisoire`.
  - id: caisse-generale-compensation
    acronyme: CGC
    statut: valide
    references: [loi70-26, lf-1971, lf-2013, lf-2014]
    source_definition: {ref: loi70-26, locator: "art. 3"}
    # AR : « أحدث صندوق عام للتعويض » (loi n° 70-26, art. 3, éd. arabe) ; forme
    # définie « الصندوق العام للتعويض » dans l'intitulé de l'art. 76 de la LF 2014.
    source_traduction: {ref: loi70-26, locator: "art. 3"}
    voir_aussi: [compensation-des-prix, fonds-special-tresor, redevance-compensation, produits-de-base]
    fr:
      terme: Caisse générale de compensation
      definition: >
        Caisse instituée par l'article 3 de la loi n° 70-26 du 19 mai 1970 pour « agir
        sur les prix des marchandises, produits et services de première nécessité
        notamment au moyen de subvention et de péréquation ». La loi de finances pour
        1971 (art. 48) en fait un fonds spécial du Trésor, auquel reviennent les taxes
        et redevances de compensation ; la redevance de compensation lui est affectée
        depuis 2013.
      synonymes: []
    ar:
      terme: الصندوق العام للتعويض
      definition: >
        صندوق أحدثه الفصل 3 من القانون عدد 26 لسنة 1970 المؤرخ في 19 ماي 1970، «يرمي
        إلى الضغط على أسعار البضائع والمنتجات والخدمات الضرورية خاصة بواسطة منح أو
        إدخال تعديلات على تلك الأسعار». وقد جعله قانون المالية لسنة 1971 (الفصل 48) من
        الحسابات الخاصة في الخزينة، وخُصّصت له أتاوة الدعم منذ سنة 2013.
      synonymes: []

  - id: compensation-des-prix
    acronyme: null
    statut: valide
    references: [loi70-26, minfin-finances-publiques-2008, lf-2013]
    source_definition: {ref: loi70-26, locator: "art. 3"}
    # AR : arbitrage du 6 octobre 2026. Le JORT et les rapports « Finances publiques »
    # rendent la politique par « الدعم » (« نفقات الدعم », rapport 2008, p. 35 imprimée ;
    # « أتاوة الدعم » = redevance de compensation, LF 2013, art. 63) ; « التعويض » ne
    # subsiste que dans le nom de la caisse et dans l'intitulé de chapitres budgétaires.
    # Le terme français est qualifié (« des prix ») pour que la table de traduction
    # n'impose pas « الدعم » aux autres sens de « compensation » (allocations
    # familiales, comptes des caisses).
    source_traduction: {ref: minfin-finances-publiques-2008, locator: "p. 35"}
    voir_aussi: [caisse-generale-compensation, produits-de-base, compensation-carburants, compensation-transport, perequation-des-prix]
    fr:
      terme: Compensation des prix
      definition: >
        Action de l'État sur les prix des produits et services de première nécessité,
        que l'article 3 de la loi n° 70-26 confie à la Caisse générale de compensation
        « notamment au moyen de subvention et de péréquation ». Les rapports du
        ministère des Finances en répartissent la dépense en trois postes : produits
        de base, carburants et transport.
      synonymes: [Compensation, Subvention aux prix]
    ar:
      terme: الدعم
      definition: >
        تدخّل الدولة في أسعار المنتجات والخدمات الضرورية، وقد أسنده الفصل 3 من القانون
        عدد 26 لسنة 1970 إلى الصندوق العام للتعويض «خاصة بواسطة منح أو إدخال تعديلات
        على تلك الأسعار». وتوزّع تقارير وزارة المالية نفقات الدعم على ثلاثة أبواب:
        المواد الأساسية والمحروقات والنقل.
      synonymes: [التعويض]

  - id: produits-de-base
    acronyme: null
    statut: valide
    references: [minfin-finances-publiques-2008, loi70-26]
    source_definition: {ref: minfin-finances-publiques-2008, locator: "p. 35"}
    # AR : « دعم المواد الأساسية » (rapport 2008, p. 35 imprimée, p. 37 du PDF).
    # La loi n° 70-26, art. 3, dit « produits de première nécessité » —
    # « البضائع والمنتجات والخدمات الضرورية » dans l'édition arabe.
    source_traduction: {ref: minfin-finances-publiques-2008, locator: "p. 35"}
    voir_aussi: [compensation-des-prix, caisse-generale-compensation]
    fr:
      terme: Produits de base
      definition: >
        Premier des trois postes entre lesquels les rapports du ministère des Finances
        répartissent la dépense de compensation, avec les carburants et le transport.
        La loi n° 70-26 (art. 3) parle, elle, de « marchandises, produits et services
        de première nécessité ».
      synonymes: [Produits de première nécessité]
    ar:
      terme: المواد الأساسية
      definition: >
        أوّل الأبواب الثلاثة التي توزّع عليها تقارير وزارة المالية نفقات الدعم، مع
        المحروقات والنقل. أمّا القانون عدد 26 لسنة 1970 (الفصل 3) فيتحدّث عن «البضائع
        والمنتجات والخدمات الضرورية».
      synonymes: [المنتجات الضرورية]

  - id: compensation-carburants
    acronyme: null
    statut: valide
    references: [minfin-finances-publiques-2005, minfin-finances-publiques-2008, minfin-compensation-carburants-2014, minfin-projet-lfc-2015]
    source_definition: {ref: minfin-finances-publiques-2008, locator: "p. 35"}
    # AR : « دعم المحروقات » ; le même rapport écrit aussi « دعم منظومة المحروقات
    # و الكهرباء » (p. 7 imprimée) quand il y joint l'électricité.
    source_traduction: {ref: minfin-finances-publiques-2008, locator: "p. 35"}
    voir_aussi: [compensation-des-prix, ajustement-automatique-prix-carburants, subvention-directe, subvention-indirecte, separation-commercialisation-hydrocarbures, etap, steg, stir]
    fr:
      terme: Compensation des carburants
      definition: >
        Poste de la dépense de compensation que les rapports du ministère des Finances
        consacrent aux carburants, à côté des produits de base et du transport ; il
        réunit des transferts à l'ETAP, à la STEG et à la STIR et couvre donc aussi
        l'électricité et le gaz. Son périmètre s'élargit en 2015 : avec la séparation
        des opérations de commercialisation des hydrocarbures, la ligne inclut ce que
        les prix de cession préférentiels laissaient jusque-là hors du budget.
      synonymes: [Subvention des carburants, Subvention énergétique]
    ar:
      terme: دعم المحروقات
      definition: >
        باب من نفقات الدعم تخصّصه تقارير وزارة المالية للمحروقات، إلى جانب المواد
        الأساسية والنقل؛ ويضمّ تحويلات لفائدة المؤسسة التونسية للأنشطة البترولية
        والشركة التونسية للكهرباء والغاز والشركة التونسية لصناعات التكرير، فيشمل كذلك
        الكهرباء والغاز. واتّسع مجاله سنة 2015: فمع فصل عمليات تسويق المحروقات صار
        يتضمّن ما كانت الأسعار التفاضلية تبقيه قبل ذلك خارج الميزانية.
      synonymes: []

  - id: compensation-transport
    acronyme: null
    statut: valide
    references: [minfin-finances-publiques-2008, minfin-finances-publiques-2010, minfin-budget-transport-2013, lf-1984]
    source_definition: {ref: minfin-finances-publiques-2008, locator: "p. 35"}
    # AR : « دعم النقل » dans le tableau, « دعم النقل العمومي » dans le texte de la
    # même page. Composantes (« النقل المدرسي و الجامعي », « النقل بتعريفات منخفضة »,
    # « النقل المجاني لبعض الفئات الخصوصية ») : rapport sur les finances publiques 2010,
    # p. 34 du PDF ; ligne par société : budget du ministère du Transport de 2013.
    source_traduction: {ref: minfin-finances-publiques-2008, locator: "p. 35"}
    voir_aussi: [compensation-des-prix, taxe-unique-compensation-transports-routiers]
    fr:
      terme: Compensation du transport
      definition: >
        Poste de la dépense de compensation que les rapports du ministère des Finances
        consacrent au transport public, à côté des produits de base et des carburants.
        C'est une somme de subventions par société, inscrites au budget du ministère du
        Transport sous le libellé « soutien du transport public », au titre du transport
        scolaire et universitaire surtout, du transport à tarifs réduits et du transport
        gratuit de certaines catégories.
      synonymes: [Subvention du transport public, Soutien du transport public]
    ar:
      terme: دعم النقل
      definition: >
        باب من نفقات الدعم تخصّصه تقارير وزارة المالية للنقل العمومي، إلى جانب المواد
        الأساسية والمحروقات. وهو مجموع منح مرسّمة لكلّ شركة بميزانية وزارة النقل تحت
        عنوان «دعم النقل العمومي»، بعنوان النقل المدرسي والجامعي أساساً، والنقل
        بتعريفات منخفضة والنقل المجاني لبعض الفئات الخصوصية.
      synonymes: [دعم النقل العمومي]

  - id: fonds-special-tresor
    acronyme: null
    statut: provisoire
    references: [lf-1971, lf-2014]
    source_definition: {ref: lf-1971, locator: "art. 48"}
    # AR : attesté au pluriel seulement — « fonds spéciaux du Trésor » en regard de
    # « الحسابات الخاصة في الخزينة » (LF 2014, art. 2 et tableau « B »). Le singulier
    # n'est pas lu, et l'édition arabe de la LF 1971 non plus.
    source_traduction: {ref: lf-2014, locator: "art. 2"}
    voir_aussi: [caisse-generale-compensation]
    fr:
      terme: Fonds spéciaux du Trésor
      definition: >
        Compte du Trésor auquel la loi de finances affecte des recettes et dont elle
        arrête chaque année les prévisions dans un tableau annexé. La loi de finances
        pour 1971 (art. 48) fait de la Caisse générale de compensation un fonds
        spécial du Trésor, auquel reviennent les taxes et redevances de compensation.
      synonymes: [Fonds spécial du Trésor]
    ar:
      terme: الحسابات الخاصة في الخزينة
      definition: >
        حساب في الخزينة يخصّص له قانون المالية موارد ويضبط تقديراته كلّ سنة في جدول
        ملحق به. وقد جعل قانون المالية لسنة 1971 (الفصل 48) الصندوق العام للتعويض من
        هذه الحسابات، وأرجع إليه الأداءات والأتاوات التعويضية.
      synonymes: []

  - id: redevance-compensation
    acronyme: null
    statut: valide
    references: [lf-2013, lf-2014]
    source_definition: {ref: lf-2013, locator: "art. 63"}
    # AR : « أتاوة الدعم المنصوص عليها بهذا الفصل » (LF 2013, art. 63, § II, éd. arabe) ;
    # même terme dans l'arrêté du 10 mai 2024 (JORT n° 61 de 2024).
    source_traduction: {ref: lf-2013, locator: "art. 63"}
    voir_aussi: [caisse-generale-compensation, compensation-des-prix, taxe-unique-compensation-transports-routiers]
    fr:
      terme: Redevance de compensation
      definition: >
        Redevance créée au profit de la Caisse générale de compensation par l'article
        63 de la loi de finances pour 2013. Elle est due sur le chiffre d'affaires de
        certains établissements, sur la première immatriculation des voitures de forte
        cylindrée, par nuitée d'hôtel et sur le revenu annuel net des personnes
        physiques au-delà de 20 000 dinars. La loi de finances pour 2014 l'étend aux
        voitures particulières et aux véhicules soumis à la taxe unique de
        compensation de transports routiers (art. 76), réécrit le volet assis sur le
        revenu (art. 77) et borne ces deux volets aux années 2014 et 2015 (art. 78).
      synonymes: []
    ar:
      terme: أتاوة الدعم
      definition: >
        أتاوة أحدثها الفصل 63 من قانون المالية لسنة 2013 لفائدة الصندوق العام للتعويض.
        تُستوجب على رقم معاملات بعض المؤسسات، وعند أوّل تسجيل للسيارات ذات الأسطوانة
        الكبيرة، وعن كلّ ليلة مقضّاة بالمؤسسات السياحية، وعلى الدخل السنوي الصافي
        للأشخاص الطبيعيين الذي يفوق 20.000 دينار. ووسّعها قانون المالية لسنة 2014 إلى
        السيارات الخاصة والعربات الخاضعة للمعلوم الوحيد التعويضي على النقل بالطرقات
        (الفصل 76)، وأعاد صياغة الجزء الموظّف على الدخل (الفصل 77)، وحصر تطبيق هذين
        الجزأين في سنتي 2014 و2015 (الفصل 78).
      synonymes: []

  - id: taxe-unique-compensation-transports-routiers
    acronyme: null
    statut: valide
    references: [lf-1984, lf-2014]
    source_definition: {ref: lf-1984, locator: "art. 38"}
    # AR : lu en regard du français à l'art. 76 de la LF 2014 ; l'édition arabe de la
    # LF 1984 n'est pas lue.
    source_traduction: {ref: lf-2014, locator: "art. 76"}
    voir_aussi: [compensation-transport, redevance-compensation, taxe-unique-compensation-carburants]
    fr:
      terme: Taxe unique de compensation de transports routiers
      definition: >
        Taxe instituée à compter du 1^er^ janvier 1984 par l'article 38 de la loi de
        finances pour 1984. Elle s'applique aux véhicules de transport en commun de
        personnes de plus de neuf places, aux véhicules de transport routier de
        marchandises d'une charge utile supérieure à 300 kilogrammes, aux voitures de
        louage et aux taxis. Elle est due chaque mois par véhicule, et 40 % de son
        produit sont affectés à la caisse de compensation et de soutien des transports
        routiers, fonds spécial du Trésor créé par la même loi (art. 101). La loi de
        finances pour 2014 met à la charge des
        véhicules qui y sont soumis une redevance de compensation égale à 25 % de son
        montant (art. 76), au titre des années 2014 et 2015 (art. 78).
      synonymes: []
    ar:
      terme: المعلوم الوحيد التعويضي على النقل بالطرقات
      definition: >
        معلوم أحدثه الفصل 38 من قانون المالية لسنة 1984 بداية من غرة جانفي 1984. يطبّق
        على عربات النقل المشترك للأشخاص التي تفوق مقاعدها التسعة، وعلى عربات نقل
        البضائع بالطرقات التي تفوق حمولتها النافعة 300 كيلوغرام، وعلى سيارات اللواج
        وسيارات التاكسي. يُستخلص شهرياً عن كلّ عربة، ويُخصَّص 40 % من محصوله لحساب خاص
        في الخزينة أحدثه القانون نفسه لدعم مؤسسات النقل العمومي بالطرقات (الفصل 101).
        ووظّف قانون المالية لسنة 2014 على العربات الخاضعة له أتاوة
        دعم تساوي 25 % من مبلغه (الفصل 76)، بعنوان سنتي 2014 و2015 (الفصل 78).
      synonymes: [المعلوم التعويضي على النقل]

  - id: ajustement-automatique-prix-carburants
    acronyme: null
    statut: valide
    references: [arrete-2016-07-15-prix-petroliers, arrete-2020-03-31-prix-petroliers, arrete-2021-04-07-prix-petroliers, bct-ra-2009]
    source_definition: {ref: arrete-2016-07-15-prix-petroliers, locator: "art. 5"}
    # AR : « آلية التعديل الأوتوماتيكي لأسعار البنزين الخالي من الرصاص والغازوال… »
    # (arrêté de 2016, art. 5) ; forme générique « الآلية الشهرية للتعديل الأوتوماتيكي
    # لأسعار المحروقات » (arrêté de 2021, art. 7 nouveau). L'édition arabe de l'arrêté
    # de 2020 n'est pas lue.
    source_traduction: {ref: arrete-2021-04-07-prix-petroliers, locator: "art. 1"}
    voir_aussi: [compensation-carburants]
    fr:
      terme: Mécanisme d'ajustement automatique des prix des carburants
      definition: >
        Mécanisme mis en place par l'arrêté du 15 juillet 2016 (art. 5) pour l'essence
        sans plomb, le gasoil ordinaire et le gasoil 50 : une commission fixe
        périodiquement leurs prix de vente au public d'après l'évolution des prix sur
        le marché international. L'ajustement, trimestriel en 2016, devient mensuel
        avec l'arrêté du 31 mars 2020, qui plafonne la variation à chaque ajustement ;
        l'arrêté du 7 avril 2021 porte ce plafond à 5 % du prix en vigueur. Un premier
        mécanisme d'ajustement des prix intérieurs des produits pétroliers, rapporté
        par la Banque centrale, avait été activé le 16 janvier 2009 ; le texte qui
        l'institue n'est pas identifié ici.
      synonymes: [Ajustement automatique des prix]
    ar:
      terme: آلية التعديل الأوتوماتيكي لأسعار المحروقات
      definition: >
        آلية وُضعت بمقتضى القرار المؤرخ في 15 جويلية 2016 (الفصل 5) بالنسبة إلى
        البنزين الخالي من الرصاص والغازوال العادي والغازوال 50: تضبط لجنة دوريًا أسعار
        بيعها للعموم على ضوء تطوّر أسعارها في السوق العالمية. وكان التعديل كلّ ثلاثة
        أشهر سنة 2016، ثمّ صار شهريًا بمقتضى القرار المؤرخ في 31 مارس 2020 الذي وضع
        حدًّا أقصى لقيمة كلّ تعديل؛ ورفع القرار المؤرخ في 7 أفريل 2021 هذا الحدّ إلى 5
        % من سعر البيع الجاري به العمل. وكانت آلية أولى لتعديل الأسعار الداخلية
        للمنتوجات النفطية، ذكرها البنك المركزي، قد فُعّلت في 16 جانفي 2009؛ والنصّ
        المحدث لها غير محدَّد هنا.
      synonymes: []

  - id: perequation-des-prix
    acronyme: null
    statut: provisoire
    references: [loi70-26, minfin-finances-publiques-2008]
    source_definition: {ref: loi70-26, locator: "art. 3"}
    # AR à confirmer : l'édition arabe de la loi n° 70-26, art. 3, ne nomme pas la
    # péréquation, elle la paraphrase (« إدخال تعديلات على تلك الأسعار ») ; le rapport
    # « Finances publiques » 2008 (p. 39 imprimée) écrit que la caisse assure
    # « تعديل أسعار المواد الأساسية و دعمها ». Le rapprochement est du terminologue :
    # pas de `source_traduction`.
    voir_aussi: [compensation-des-prix, caisse-generale-compensation]
    fr:
      terme: Péréquation des prix
      definition: >
        Second des deux instruments, avec la subvention, que l'article 3 de la loi n°
        70-26 du 19 mai 1970 donne à la Caisse générale de compensation pour agir sur
        les prix des produits de première nécessité. La loi ne le définit pas.
      synonymes: []
    ar:
      terme: تعديل الأسعار
      definition: >
        ثاني الوسيلتين، مع المنح، اللتين خوّلهما الفصل 3 من القانون عدد 26 لسنة 1970
        المؤرخ في 19 ماي 1970 للصندوق العام للتعويض قصد الضغط على أسعار المنتجات
        الضرورية. ولا يعرّفه القانون، ويعبّر عنه نصّه العربي بـ«إدخال تعديلات على تلك
        الأسعار».
      synonymes: []

  # --- Compensation, volume IX : carburants et circuit des hydrocarbures (passe du
  # volume réécrit). Les termes arabes tirés du rapport de 2014 et des documents
  # budgétaires de 2015 sont ceux relevés à l'image par le documentaliste
  # (docs/notes/compensation-rupture-2015.md, « Notions à glossaire »).

  - id: subvention-directe
    acronyme: null
    statut: valide
    references: [minfin-compensation-carburants-2014]
    source_definition: {ref: minfin-compensation-carburants-2014, locator: "p. 7-9"}
    source_traduction: {ref: minfin-compensation-carburants-2014, locator: "p. 7-9"}
    voir_aussi: [subvention-indirecte, compensation-carburants, prix-de-cession-preferentiel]
    fr:
      terme: Subvention directe
      definition: >
        Part de la subvention des carburants que le budget de l'État inscrit en
        dépense : la ligne « carburants », faite de transferts à la STEG, à la STIR
        et, à partir de 2011, à l'ETAP. Le rapport du 21 juillet 2014 l'oppose à la
        subvention indirecte.
      synonymes: []
    ar:
      terme: الدعم المباشر
      definition: >
        الجزء من دعم المحروقات الذي تُدرجه ميزانية الدولة ضمن نفقاتها: وهو باب
        «المحروقات» المتكوّن من تحويلات لفائدة الشركة التونسية للكهرباء والغاز والشركة
        التونسية لصناعات التكرير، ثمّ المؤسسة التونسية للأنشطة البترولية بداية من سنة
        2011. ويقابله تقرير 21 جويلية 2014 بالدعم غير المباشر.
      synonymes: []

  - id: subvention-indirecte
    acronyme: null
    statut: valide
    references: [minfin-compensation-carburants-2014]
    source_definition: {ref: minfin-compensation-carburants-2014, locator: "p. 7-9"}
    source_traduction: {ref: minfin-compensation-carburants-2014, locator: "p. 7-9"}
    voir_aussi: [subvention-directe, prix-de-cession-preferentiel, separation-commercialisation-hydrocarbures]
    fr:
      terme: Subvention indirecte
      definition: >
        Part de la subvention des carburants qui n'est inscrite nulle part en dépense
        jusqu'en 2014 : l'écart entre le prix mondial et les prix de cession
        préférentiels auxquels le pétrole brut parvient à la STIR et le gaz à la STEG,
        manque à gagner sur des ressources de l'État. Le rapport du 21 juillet 2014
        est la seule pièce budgétaire qui la chiffre, pour 2010-2012.
      synonymes: []
    ar:
      terme: الدعم غير المباشر
      definition: >
        الجزء من دعم المحروقات الذي لم يكن مدرجًا في أيّ باب من النفقات إلى سنة 2014:
        وهو الفارق بين السعر العالمي والأسعار التفاضلية التي يُسلَّم بها النفط الخام
        إلى الشركة التونسية لصناعات التكرير والغاز إلى الشركة التونسية للكهرباء
        والغاز، أي نقص في موارد راجعة للدولة. وتقرير 21 جويلية 2014 هو الوثيقة
        الميزانية الوحيدة التي تقدّره، للسنوات 2010-2012.
      synonymes: []

  - id: prix-de-cession-preferentiel
    acronyme: null
    statut: valide
    references: [minfin-compensation-carburants-2014, minfin-projet-lfc-2015, loi91-45]
    source_definition: {ref: minfin-compensation-carburants-2014, locator: "p. 7"}
    # AR : le rapport écrit « سعر تفاضلي » (prix préférentiel) ; « de cession » n'y est pas rendu.
    source_traduction: {ref: minfin-compensation-carburants-2014, locator: "p. 7"}
    voir_aussi: [subvention-indirecte, separation-commercialisation-hydrocarbures, etap, stir, steg]
    fr:
      terme: Prix de cession préférentiel
      definition: >
        Prix, fixé par l'administration et inférieur au prix mondial, auquel le
        pétrole brut est cédé à la STIR et le gaz à la STEG jusqu'en 2014 : environ 50
        dinars le baril et 90,8 dinars la tonne équivalent pétrole selon le rapport du
        21 juillet 2014. La loi n° 91-45 (art. 17) veut, elle, que les prix de cession
        soient fixés par une commission, par référence aux prix d'importation.
      synonymes: [Prix de cession]
    ar:
      terme: السعر التفاضلي
      definition: >
        سعر تضبطه الإدارة دون السعر العالمي، يُسلَّم به النفط الخام إلى الشركة
        التونسية لصناعات التكرير والغاز إلى الشركة التونسية للكهرباء والغاز إلى سنة
        2014: نحو 50 دينارًا للبرميل و90,8 دينارًا للطنّ المكافئ نفط حسب تقرير 21
        جويلية 2014. أمّا القانون عدد 45 لسنة 1991 (الفصل 17) فيقتضي أن تضبط لجنة
        أسعار البيع لمعامل التكرير بالرجوع إلى أسعار التوريد.
      synonymes: []

  - id: separation-commercialisation-hydrocarbures
    acronyme: null
    statut: valide
    references: [minfin-resultats-provisoires-2015-12, minfin-projet-lfc-2015, lfc-2015]
    source_definition: {ref: minfin-projet-lfc-2015, locator: "§ 19-20"}
    source_traduction: {ref: minfin-resultats-provisoires-2015-12}
    voir_aussi: [prix-de-cession-preferentiel, subvention-indirecte, revenus-commercialisation-carburants, compensation-carburants]
    fr:
      terme: Séparation des opérations de commercialisation des hydrocarbures
      definition: >
        Principe adopté dans le cadre de la loi de finances complémentaire pour 2015 :
        la STIR et la STEG s'approvisionnent au prix mondial et l'ETAP reverse au
        Trésor le produit de la vente du pétrole de l'État. La subvention, jusque-là
        comptée nette de ressources que l'État ne percevait pas, devient une dépense
        d'un côté et une recette de l'autre, ce qui élargit le périmètre de la ligne «
        carburants ». Aucun article de loi ne porte ce principe.
      synonymes: []
    ar:
      terme: فصل عمليات تسويق المحروقات
      definition: >
        مبدأ اعتُمد في إطار قانون المالية التكميلي لسنة 2015: تتزوّد الشركة التونسية
        لصناعات التكرير والشركة التونسية للكهرباء والغاز بالسعر العالمي، وتحوّل
        المؤسسة التونسية للأنشطة البترولية إلى الخزينة محصول بيع النفط الراجع للدولة.
        فالدعم الذي كان يُحتسب صافيًا من موارد لا تقبضها الدولة صار نفقة من جهة
        وموردًا من جهة أخرى، ممّا وسّع مجال باب «المحروقات». ولم يرد هذا المبدأ في أيّ
        فصل من القانون.
      synonymes: []

  - id: revenus-commercialisation-carburants
    acronyme: null
    statut: provisoire
    references: [minfin-projet-lfc-2015, lfc-2015]
    source_definition: {ref: minfin-projet-lfc-2015, locator: "§ 12-13"}
    # AR : « مداخيل تسويق المحروقات » est relevé par le documentaliste sans page de
    # source (docs/notes/compensation-rupture-2015.md) : pas de `source_traduction`.
    voir_aussi: [separation-commercialisation-hydrocarbures, compensation-carburants]
    fr:
      terme: Revenus de commercialisation des carburants
      definition: >
        Recette non fiscale du budget de l'État, contrepartie de la séparation des
        opérations de commercialisation des hydrocarbures ; la ligne n'existe pas
        avant 2015. La loi de finances complémentaire pour 2015 la prévoit sous
        l'intitulé « Revenus de l'exploitation pétrolière ».
      synonymes: [Revenus de commercialisation]
    ar:
      terme: مداخيل تسويق المحروقات
      definition: >
        مورد غير جبائي لميزانية الدولة يقابل فصل عمليات تسويق المحروقات؛ ولا وجود لهذا
        الباب قبل سنة 2015. وقد قدّره قانون المالية التكميلي لسنة 2015 في جدول موارده.
      synonymes: []

  - id: centimes-additionnels
    acronyme: null
    statut: provisoire
    references: [decret70-622, decret-1957-03-30-credits-provisoires]
    source_definition: {ref: decret70-622, locator: "art. 5"}
    # AR : translittération de l'édition arabe du décret (« والاربعة صانتيمات الاضافية »),
    # lue à l'image par le documentaliste. Provisoire : le contenu de la notion n'est pas établi.
    source_traduction: {ref: decret70-622, locator: "art. 5"}
    voir_aussi: [taxe-unique-compensation-carburants, droit-de-consommation]
    fr:
      terme: Centimes additionnels
      definition: >
        Expression du décret n° 70-622 du 31 décembre 1970 (art. 5), qui consolide
        dans la taxe unique de compensation « les quatre centimes additionnels au
        droit de consommation prévus par le décret du 30 mars 1957 ». L'expression est
        celle du texte ; l'assiette et le taux de ce prélèvement ne sont pas établis
        ici.
      synonymes: []
    ar:
      terme: صانتيمات إضافية
      definition: >
        عبارة وردت في الأمر عدد 622 لسنة 1970 المؤرخ في 31 ديسمبر 1970 (الفصل 5)، الذي
        أدمج في المعلوم الوحيد التعويضي «الاربعة صانتيمات الاضافية» للأداء على
        الاستهلاك المقرّرة بالأمر المؤرخ في 30 مارس 1957. والعبارة هي عبارة النصّ؛
        أمّا قاعدة هذا الاقتطاع ونسبته فغير ثابتتين هنا.
      synonymes: []

  - id: structure-des-prix
    acronyme: null
    statut: valide
    references: [loi91-45, arrete-2016-07-15-prix-petroliers, arrete-2020-03-31-prix-petroliers]
    source_definition: {ref: loi91-45, locator: "art. 18"}
    # AR : « التركيبة الجديدة للأسعار » (arrêté de 2016, art. 7, éd. arabe).
    source_traduction: {ref: arrete-2016-07-15-prix-petroliers, locator: "art. 7"}
    voir_aussi: [arrete-interne, ajustement-automatique-prix-carburants]
    fr:
      terme: Structure des prix
      definition: >
        Décomposition du prix des produits pétroliers que la loi n° 91-45 (art. 18)
        charge le ministre chargé de l'énergie d'établir, à côté des prix plafonds de
        vente au public fixés par arrêté. Depuis l'arrêté du 15 juillet 2016 (art. 7),
        la nouvelle structure des prix est notifiée aux intéressés par arrêté interne.
        Aucun des textes cités n'en énumère les composantes.
      synonymes: []
    ar:
      terme: تركيبة الأسعار
      definition: >
        تفصيل سعر منتوجات النفط الذي كلّف القانون عدد 45 لسنة 1991 (الفصل 18) الوزير
        المكلف بالطاقة بوضعه، إلى جانب الأسعار القصوى للبيع للعموم المضبوطة بقرار.
        ومنذ القرار المؤرخ في 15 جويلية 2016 (الفصل 7) يُعلَم المعنيون بالأمر
        بالتركيبة الجديدة للأسعار بواسطة قرار داخلي. ولا يعدّد أيّ من النصوص المذكورة
        عناصرها.
      synonymes: []

  - id: arrete-interne
    acronyme: null
    statut: valide
    references: [arrete-1992-02-13-prix-cession, arrete-2016-07-15-prix-petroliers, arrete-2020-03-31-prix-petroliers]
    source_definition: {ref: arrete-2016-07-15-prix-petroliers, locator: "art. 7"}
    # AR : « بواسطة قرار داخلي مشترك » (arrêté de 2016, art. 7, éd. arabe).
    source_traduction: {ref: arrete-2016-07-15-prix-petroliers, locator: "art. 7"}
    voir_aussi: [structure-des-prix, ajustement-automatique-prix-carburants]
    fr:
      terme: Arrêté interne
      definition: >
        Acte signé conjointement par le ministre chargé de l'énergie et le ministre
        chargé des finances, par lequel les intéressés sont informés des nouveaux prix
        des produits pétroliers et de leurs modalités d'application (arrêté du 15
        juillet 2016, art. 7 ; arrêté du 31 mars 2020, art. 6). L'arrêté du 13 février
        1992 (art. 6) employait déjà cette voie pour les prix de cession. Il n'est pas
        publié au Journal officiel.
      synonymes: [Arrêté interne conjoint]
    ar:
      terme: قرار داخلي
      definition: >
        قرار مشترك ممضى من الوزير المكلف بالطاقة والوزير المكلف بالمالية، يُعلَم
        بواسطته المعنيون بالأمر بالأسعار الجديدة لمنتوجات النفط وبإجراءات تطبيقها
        (القرار المؤرخ في 15 جويلية 2016، الفصل 7؛ القرار المؤرخ في 31 مارس 2020،
        الفصل 6). وكان القرار المؤرخ في 13 فيفري 1992 (الفصل 6) يعتمد هذه الطريقة في
        أسعار البيع لمعامل التكرير. ولا يُنشر بالرائد الرسمي.
      synonymes: [قرار داخلي مشترك]

  - id: etap
    acronyme: ETAP
    statut: valide
    references: [minfin-compensation-carburants-2014, minfin-finances-publiques-2011]
    source_definition: {ref: minfin-compensation-carburants-2014, locator: "p. 6-9"}
    # AR : nom suivi du sigle latin dans le rapport « Finances publiques » 2011 (annexe sur
    # les carburants, pp. 72-73 du PDF).
    source_traduction: {ref: minfin-finances-publiques-2011}
    voir_aussi: [stir, steg, compensation-carburants]
    fr:
      terme: Entreprise tunisienne d'activités pétrolières
      definition: >
        Entreprise publique qui commercialise le pétrole brut et le gaz revenant à
        l'État. Jusqu'en 2014, elle cède le brut à la STIR à un prix de cession
        préférentiel ; depuis la séparation de 2015, elle reverse au Trésor le produit
        de la vente du pétrole de l'État.
      synonymes: []
    ar:
      terme: المؤسسة التونسية للأنشطة البترولية
      definition: >
        منشأة عمومية تسوّق النفط الخام والغاز الراجعين للدولة. كانت إلى سنة 2014 تسلّم
        النفط الخام إلى الشركة التونسية لصناعات التكرير بسعر تفاضلي؛ ومنذ الفصل
        المعتمد سنة 2015 صارت تحوّل إلى الخزينة محصول بيع النفط الراجع للدولة.
      synonymes: []

  - id: stir
    acronyme: STIR
    statut: valide
    references: [minfin-compensation-carburants-2014, minfin-finances-publiques-2011]
    source_definition: {ref: minfin-compensation-carburants-2014, locator: "p. 6-9"}
    # AR : nom suivi du sigle latin dans le rapport « Finances publiques » 2011 (annexe sur
    # les carburants, pp. 72-73 du PDF).
    source_traduction: {ref: minfin-finances-publiques-2011}
    voir_aussi: [etap, steg, compensation-carburants]
    fr:
      terme: Société tunisienne des industries de raffinage
      definition: >
        Entreprise publique qui achète du pétrole brut, le raffine et importe des
        produits finis. Elle est l'un des bénéficiaires de la ligne budgétaire «
        carburants ».
      synonymes: []
    ar:
      terme: الشركة التونسية لصناعات التكرير
      definition: >
        منشأة عمومية تشتري النفط الخام وتكرّره وتورّد المنتوجات الجاهزة. وهي من
        المنتفعين بباب «المحروقات» في الميزانية.
      synonymes: []

  - id: steg
    acronyme: STEG
    statut: valide
    references: [minfin-compensation-carburants-2014, minfin-finances-publiques-2011]
    source_definition: {ref: minfin-compensation-carburants-2014, locator: "p. 6-9"}
    # AR : nom suivi du sigle latin dans le rapport « Finances publiques » 2011 (annexe sur
    # les carburants, pp. 72-73 du PDF).
    source_traduction: {ref: minfin-finances-publiques-2011}
    voir_aussi: [etap, stir, compensation-carburants]
    fr:
      terme: Société tunisienne de l'électricité et du gaz
      definition: >
        Entreprise publique qui achète du gaz — importé d'Algérie, ou prélevé au titre
        de la redevance due par le gazoduc qui traverse le territoire — pour produire
        l'électricité et distribuer le gaz. Elle est l'un des bénéficiaires de la
        ligne budgétaire « carburants ».
      synonymes: []
    ar:
      terme: الشركة التونسية للكهرباء والغاز
      definition: >
        منشأة عمومية تشتري الغاز — المورّد من الجزائر أو المقتطع بعنوان الأتاوة
        الموظفة على أنبوب الغاز العابر للتراب التونسي — لإنتاج الكهرباء وتوزيع الغاز.
        وهي من المنتفعين بباب «المحروقات» في الميزانية.
      synonymes: []

  # Notions analytiques : aucun terme arabe lu sur un texte officiel. Traduction du
  # terminologue, à faire confirmer par un arabophone ou par une publication arabe
  # de l'INS ; pas de `source_traduction`.
  - id: incidence-des-subventions
    acronyme: null
    statut: provisoire
    references: [ins-cres-bad-2013-subventions]
    source_definition: {ref: ins-cres-bad-2013-subventions}
    voir_aussi: [quintile-niveau-de-vie, ciblage, compensation-des-prix, incidence-fiscale]
    fr:
      terme: Incidence des subventions
      definition: >
        Répartition du bénéfice des subventions entre les ménages selon leur niveau de
        vie. Pour les subventions alimentaires, l'étude de l'INS, du CRES et de la BAD
        (2013) la mesure par le montant reçu par tête dans chaque quintile, à partir
        de l'enquête de consommation de 2010.
      synonymes: [Incidence]
    ar:
      terme: توزيع منافع الدعم
      definition: >
        توزيع الانتفاع بالدعم بين الأسر حسب مستوى عيشها. وتقيسه دراسة المعهد الوطني
        للإحصاء ومركز البحوث والدراسات الاجتماعية والبنك الإفريقي للتنمية (2013)، في
        ما يخصّ دعم المواد الغذائية، بالمبلغ المتحصّل عليه للفرد الواحد في كلّ شريحة
        خُمسية، انطلاقًا من مسح الاستهلاك لسنة 2010.
      synonymes: []

  - id: quintile-niveau-de-vie
    acronyme: null
    statut: provisoire
    references: [ins-cres-bad-2013-subventions]
    source_definition: {ref: ins-cres-bad-2013-subventions}
    voir_aussi: [incidence-des-subventions]
    fr:
      terme: Quintile de niveau de vie
      definition: >
        Chacun des cinq groupes d'effectif égal obtenus en classant la population par
        niveau de vie croissant : le premier quintile réunit le cinquième le plus
        modeste, le cinquième quintile le plus aisé. L'étude de l'INS, du CRES et de
        la BAD (2013) classe ainsi la population selon le revenu ou la dépense.
      synonymes: [Quintile]
    ar:
      terme: الشريحة الخُمسية لمستوى العيش
      definition: >
        كلّ واحدة من خمس مجموعات متساوية العدد يُتحصّل عليها بترتيب السكّان تصاعديًا
        حسب مستوى العيش: تضمّ الشريحة الأولى الخُمس الأقلّ دخلًا والشريحة الخامسة
        الخُمس الأيسر حالًا. وتعتمد دراسة المعهد الوطني للإحصاء ومركز البحوث والدراسات
        الاجتماعية والبنك الإفريقي للتنمية (2013) هذا التصنيف حسب الدخل أو الإنفاق.

  # ── Volume « La fiscalité », chapitre « Les dépenses fiscales et les régimes
  #    d'incitation » (passe 1 du 6 octobre 2026 : termes et sources ; passe 2 du
  #    même jour : définitions, après l'ancrage dans la prose) ──
  # Termes arabes relevés le 6 octobre 2026 sur la couche texte des fascicules
  # arabes du JORT (n° 82 du 7 octobre 2016, n° 15 du 21 février 2017, n° 15 du
  # 19 février 2019), l'article étant donné par `source_traduction`. Le terme arabe
  # est celui que le texte emploie, donc au pluriel quand le texte n'emploie que le
  # pluriel ; le terme français s'y aligne. Les définitions s'en tiennent à ce que
  # dit le texte cité ; quand celui-ci emploie le terme sans le définir (avantages
  # fiscaux, zones de développement régional), la définition dit ce que le texte y
  # attache, et rien de plus. Seul « système fiscal de référence » reste
  # « provisoire » : son arabe ne vient que des rapports du ministère des Finances.
  # « Offshore » et « onshore » sont des mots d'usage, absents des textes de loi lus :
  # pas d'entrée. L'INS emploie « régime off shore » (arabe : نظام غير مقيم, « régime
  # non résident ») dans son Annuaire statistique, tableau 14.2 du commerce extérieur,
  # sans le définir : pas d'entrée non plus tant que la définition statistique n'est
  # pas lue (11 octobre 2026). « Entreprise partiellement exportatrice » n'a pas d'entrée non plus :
  # l'article 22 du code de 1993 vise « les entreprises qui réalisent des
  # opérations d'exportation » sans définir ce terme, et le fascicule arabe de
  # 1993 est un scan sans couche texte.

  - id: depense-fiscale
    acronyme: null
    statut: valide
    references: [gbo-depenses-fiscales, loi-org-2019-15-lob]
    # Définition : rapport annexé au projet de loi de finances pour 2021 (français),
    # « 2. La définition des dépenses fiscales ». La loi organique emploie le terme
    # (art. 46 et 70) sans le définir.
    source_definition: {ref: gbo-depenses-fiscales, locator: "rapport annexé au projet de loi de finances pour 2021, section 1, § 2"}
    # Arabe : « تقرير حول النفقات الجبائية والامتيازات المالية الممنوحة », art. 46.
    # Le singulier « نفقة جبائية » n'est attesté que dans les rapports annexés aux
    # projets de loi de finances pour 2024 et 2025, non au JORT.
    source_traduction: {ref: loi-org-2019-15-lob, locator: "art. 46"}
    voir_aussi: [systeme-fiscal-de-reference, avantage-fiscal, avantage-financier]
    fr:
      terme: Dépenses fiscales
      definition: >
        Au sens du rapport annexé au projet de loi de finances pour 2021,
        dispositions légales qui dérogent au système fiscal de référence et
        allègent la charge fiscale d'une catégorie de contribuables ou de
        certaines opérations ou activités, au prix d'un manque de ressources pour
        le Trésor, afin d'atteindre des objectifs économiques, sociaux, culturels
        ou environnementaux. La loi organique du budget range « un rapport sur les
        dépenses fiscales et les avantages financiers octroyés » parmi les
        documents qui accompagnent le projet de loi de finances (art. 46).
      synonymes: [Dépense fiscale]
    ar:
      terme: النفقات الجبائية
      definition: >
        حسب التقرير المرفق بمشروع قانون المالية لسنة 2021، الأحكام القانونية
        الاستثنائية التي تخرج عن النظام الجبائي المرجعي وتخفّف العبء الجبائي عن
        صنف من المطالبين بالأداء أو عن بعض العمليات أو الأنشطة، مقابل نقص في
        موارد الخزينة، وذلك لبلوغ أهداف اقتصادية أو اجتماعية أو ثقافية أو بيئية.
        ويقتضي القانون الأساسي للميزانية أن يُرفق مشروع قانون المالية بـ«تقرير حول
        النفقات الجبائية والامتيازات المالية الممنوحة» (الفصل 46).
      synonymes: [نفقة جبائية]

  - id: systeme-fiscal-de-reference
    acronyme: null
    # Provisoire : le terme arabe n'est attesté que par les rapports du ministère
    # des Finances, non par un texte publié au Journal officiel.
    statut: provisoire
    references: [gbo-depenses-fiscales]
    # Définition : « Section II : Le régime fiscal de référence », « 1. La notion du
    # régime fiscal de référence ». Le rapport écrit tantôt « système », tantôt
    # « régime » fiscal de référence.
    source_definition: {ref: gbo-depenses-fiscales, locator: "rapport annexé au projet de loi de finances pour 2021, section II, § 1"}
    # Arabe : intitulé de section des rapports arabes du ministère des Finances
    # (« القسم الثاني : النظام الجبائي المرجعي »). Terme d'un rapport officiel, NON du
    # JORT : aucun texte publié au Journal officiel ne l'emploie parmi ceux lus.
    source_traduction: {ref: gbo-depenses-fiscales, locator: "rapports annexés aux projets de loi de finances pour 2024 et 2025, intitulé de la section « النظام الجبائي المرجعي »"}
    voir_aussi: [depense-fiscale]
    fr:
      terme: Système fiscal de référence
      definition: >
        Au sens du rapport annexé au projet de loi de finances pour 2021, les
        dispositions de base de chaque impôt, au regard desquelles une mesure est
        dite dérogatoire et comptée parmi les dépenses fiscales. Le rapport retient
        l'approche qu'il appelle juridique : le régime de référence y est
        « l'ensemble des dispositions essentielles prévues par le droit commun »,
        identifié pour chaque type d'impôt.
      synonymes: [Régime fiscal de référence]
    ar:
      terme: النظام الجبائي المرجعي
      definition: >
        حسب التقرير المرفق بمشروع قانون المالية لسنة 2021، الأحكام الأساسية لكل
        أداء، التي يُعدّ الإجراء الخارج عنها استثنائيا ويُحتسب ضمن النفقات الجبائية.
        ويعتمد التقرير المقاربة التي يسمّيها قانونية: النظام المرجعي فيها هو مجموع
        الأحكام الأساسية المنصوص عليها بالقانون العام، ويُضبط بحسب كل صنف من
        الأداءات.
      synonymes: []

  - id: avantage-fiscal
    acronyme: null
    statut: valide
    references: [loi-avantages-fiscaux-2017]
    # Arabe : intitulé de la loi (« مراجعة منظومة الامتيازات الجبائية ») et titre du
    # chapitre IV nouveau du code (« الامتيازات الجبائية »), art. 1er. Le singulier
    # défini « الامتياز الجبائي » y figure une fois ; l'indéfini n'y figure pas.
    # La loi emploie le terme comme intitulé : la définition décrit le contenu du
    # chapitre IV (titres de ses sections et sous-sections, art. 63 à 67 et 71 lus) :
    # l'art. 71 ne porte qu'une déduction, l'art. 67 applique déduction et taux
    # réduit en même temps — d'où « pour plusieurs régimes », sans ordre de succession.
    source_definition: {ref: loi-avantages-fiscaux-2017, locator: "art. 1er (chapitre IV nouveau du code de l'IRPP et de l'IS, art. 63 à 77)"}
    source_traduction: {ref: loi-avantages-fiscaux-2017, locator: "intitulé et art. 1er"}
    voir_aussi: [depense-fiscale, avantage-financier, entreprise-totalement-exportatrice, zone-developpement-regional]
    fr:
      terme: Avantages fiscaux
      definition: >
        Intitulé du chapitre IV que la loi n° 2017-8 du 14 février 2017 ajoute au
        code de l'impôt sur le revenu des personnes physiques et de l'impôt sur
        les sociétés (articles 63 à 77). Il réunit des avantages au titre de
        l'exploitation — développement régional, développement agricole,
        exportation, activités de soutien et de lutte contre la pollution,
        entreprises nouvellement créées — et des avantages au titre du
        réinvestissement en dehors de l'entreprise. Au titre de l'exploitation,
        ils consistent en une déduction, totale ou partielle, des revenus ou des
        bénéfices de l'assiette de l'impôt et, pour plusieurs régimes, en
        l'imposition des bénéfices au taux réduit de l'impôt sur les sociétés.
      synonymes: [Avantage fiscal]
    ar:
      terme: الامتيازات الجبائية
      definition: >
        عنوان الباب الرابع الذي أضافه القانون عدد 8 لسنة 2017 المؤرخ في 14 فيفري
        2017 إلى مجلة الضريبة على دخل الأشخاص الطبيعيين والضريبة على الشركات
        (الفصول من 63 إلى 77). ويجمع الامتيازات الجبائية بعنوان الاستغلال —
        التنمية الجهوية، والتنمية الفلاحية، والتصدير، وأنشطة المساندة ومقاومة
        التلوث، والمؤسسات جديدة الإحداث — والامتيازات الجبائية بعنوان إعادة
        الاستثمار خارج المؤسسة. وتتمثّل، بعنوان الاستغلال، في طرح كلي أو جزئي
        للمداخيل أو الأرباح من أساس الضريبة، وفي إخضاع الأرباح، بالنسبة إلى عدد
        من الأنظمة، للضريبة على الشركات بالنسبة المنخفضة.
      synonymes: [الامتياز الجبائي]

  - id: avantage-financier
    acronyme: null
    statut: valide
    references: [gbo-depenses-fiscales, loi-org-2019-15-lob, loi-avantages-fiscaux-2017]
    # Définition contrôlée le 6 octobre 2026 sur la page elle-même : le titre
    # « 1.1 Définition des avantages financiers » est à la page 86 de la pagination
    # imprimée (90e page du fichier), la phrase de définition à la page 87 (91e).
    # Le sommaire ne donnait que la page 86.
    source_definition: {ref: gbo-depenses-fiscales, locator: "rapport annexé au projet de loi de finances pour 2021, deuxième partie, section 1, § 1.1 (pages numérotées 86 et 87)"}
    # Arabe : « النفقات الجبائية والامتيازات المالية الممنوحة », art. 46 ; la loi
    # n° 2017-8, art. 18, écrit « الامتيازات الجبائية والمالية ». À ne pas confondre
    # avec les « incitations financières » (الحوافز المالية) de la loi n° 2016-71.
    source_traduction: {ref: loi-org-2019-15-lob, locator: "art. 46"}
    voir_aussi: [depense-fiscale, avantage-fiscal, prime-investissement]
    fr:
      terme: Avantages financiers
      definition: >
        Au sens du rapport annexé au projet de loi de finances pour 2021, toute
        aide financière, ou ayant un effet financier, ou en nature, que l'État
        accorde à titre gratuit ou sans contrepartie équivalente à un acteur du
        secteur commercial et concurrentiel, sous des conditions sélectives, pour
        un intérêt public d'ordre économique, et qui constitue une charge pour le
        Trésor. Le rapport relève que la législation en vigueur n'en donne pas de
        définition. Le terme figure à l'article 46 de la loi organique du budget
        et à l'article 18 de la loi n° 2017-8.
      synonymes: [Avantage financier]
    ar:
      terme: الامتيازات المالية
      definition: >
        حسب التقرير المرفق بمشروع قانون المالية لسنة 2021، كل إعانة مالية، أو لها
        أثر مالي، أو عينية، تمنحها الدولة مجانا أو دون مقابل معادل لفائدة طرف
        ناشط في القطاع التجاري والتنافسي، بشروط انتقائية، لتحقيق مصلحة عامة
        اقتصادية، وتمثّل عبئا على الخزينة. ويلاحظ التقرير أن التشريع الجاري به
        العمل لا يعرّفها. وترد العبارة بالفصل 46 من القانون الأساسي للميزانية
        وبالفصل 18 من القانون عدد 8 لسنة 2017.
      synonymes: []

  - id: entreprise-totalement-exportatrice
    acronyme: null
    statut: valide
    references: [loi-avantages-fiscaux-2017, loi-93-120-code-incitations, loi2018-56-lf2019]
    # Arabe : « تعتبر مؤسسات مصدرة كليا المؤسسات التي… », art. 69 nouveau du code.
    # Le code de 1993 (art. 10) portait la notion avant lui ; son fascicule arabe est
    # un scan sans couche texte, non lu. La définition est celle de l'article 69,
    # datée : l'article est abrogé par la loi de finances pour 2019.
    source_definition: {ref: loi-avantages-fiscaux-2017, locator: "art. 1er (art. 69 nouveau du code de l'IRPP et de l'IS)"}
    source_traduction: {ref: loi-avantages-fiscaux-2017, locator: "art. 1er (art. 69 nouveau du code de l'IRPP et de l'IS)"}
    voir_aussi: [avantage-fiscal, code-incitations-investissements, impot-societes]
    fr:
      terme: Entreprises totalement exportatrices
      definition: >
        Entreprises qui vendent la totalité de leurs marchandises ou de leurs
        produits, ou rendent la totalité de leurs services, à l'étranger, et
        celles qui rendent la totalité de leurs services en Tunisie pour un usage
        à l'étranger (article 69 du code de l'impôt sur le revenu des personnes
        physiques et de l'impôt sur les sociétés, dans la rédaction de la loi
        n° 2017-8). Le même article les autorise à écouler sur le marché local une
        part de leur production dans la limite de 30 % de leur chiffre d'affaires
        à l'export de l'année précédente. La notion vient du code d'incitations
        aux investissements de 1993 (article 10) ; l'article 69 est abrogé par la
        loi de finances pour 2019 (article 37).
      synonymes: [Entreprise totalement exportatrice]
    ar:
      terme: المؤسسات المصدرة كليا
      definition: >
        المؤسسات التي تبيع كامل سلعها أو منتجاتها أو تسدي كامل خدماتها خارج
        البلاد التونسية، والتي تنجز كامل خدماتها بالبلاد التونسية ويتم استعمالها
        بالخارج (الفصل 69 من مجلة الضريبة على دخل الأشخاص الطبيعيين والضريبة على
        الشركات، في صيغة القانون عدد 8 لسنة 2017). ويجيز لها الفصل نفسه ترويج
        جزء من إنتاجها بالسوق المحلية في حدود 30 % من رقم معاملاتها عند التصدير
        للسنة السابقة. ويعود المفهوم إلى مجلة تشجيع الاستثمارات لسنة 1993 (الفصل
        10)؛ وقد ألغي الفصل 69 بقانون المالية لسنة 2019 (الفصل 37).
      synonymes: []

  - id: zone-developpement-regional
    acronyme: null
    statut: valide
    references: [loi-avantages-fiscaux-2017, loi-93-120-code-incitations]
    # Arabe : « بمناطق التنمية الجهوية », art. 63 nouveau du code ; seul le pluriel
    # est attesté. L'article 63 ne définit pas les zones : il en distingue deux
    # groupes et renvoie leur liste à un décret gouvernemental. La définition n'en
    # dit pas plus.
    source_definition: {ref: loi-avantages-fiscaux-2017, locator: "art. 1er (art. 63 nouveau du code de l'IRPP et de l'IS)"}
    source_traduction: {ref: loi-avantages-fiscaux-2017, locator: "art. 1er (art. 63 nouveau du code de l'IRPP et de l'IS)"}
    voir_aussi: [avantage-fiscal, code-incitations-investissements]
    fr:
      terme: Zones de développement régional
      definition: >
        Zones dans lesquelles les revenus ou les bénéfices tirés des
        investissements directs sont totalement déductibles de l'assiette de
        l'impôt sur le revenu des personnes physiques ou de l'impôt sur les
        sociétés : pendant les cinq premières années à partir de l'entrée en
        activité effective dans le premier groupe de zones, pendant les dix
        premières dans le deuxième (article 63 du code, dans la rédaction de la
        loi n° 2017-8). La loi ne les énumère pas : leur liste est fixée par
        décret gouvernemental.
      synonymes: [Zone de développement régional]
    ar:
      terme: مناطق التنمية الجهوية
      definition: >
        المناطق التي تُطرح فيها كليا من أساس الضريبة على دخل الأشخاص الطبيعيين أو
        الضريبة على الشركات المداخيل أو الأرباح المتأتية من الاستثمارات
        المباشرة: خلال الخمس سنوات الأولى ابتداء من تاريخ الدخول طور النشاط
        الفعلي بالنسبة إلى المجموعة الأولى من المناطق، وخلال العشر سنوات الأولى
        بالنسبة إلى المجموعة الثانية (الفصل 63 من المجلة، في صيغة القانون عدد 8
        لسنة 2017). ولا يعدّدها القانون: تُضبط قائمتها بأمر حكومي.
      synonymes: []

  - id: prime-investissement
    acronyme: null
    statut: valide
    references: [loi-2016-71-investissement]
    # Arabe : « منحة استثمار في حدود ثلث كلفة الاستثمار » puis « سقف منحة الاستثمار »,
    # art. 20 (projets d'intérêt national). L'article 19 énumère quatre autres primes
    # (المنح), chacune sous son nom : ce terme ne les désigne pas. Le chapitre ancre
    # pourtant la notion sur ces quatre primes : la définition les distingue donc
    # expressément, pour le lecteur qui arrive par ce lien.
    source_definition: {ref: loi-2016-71-investissement, locator: "art. 20"}
    source_traduction: {ref: loi-2016-71-investissement, locator: "art. 20"}
    voir_aussi: [projet-interet-national, avantage-financier]
    fr:
      terme: Prime d'investissement
      definition: >
        Prime accordée aux projets d'intérêt national dans la limite du tiers du
        coût d'investissement, y compris les dépenses des travaux d'infrastructures
        intra-muros ; son plafond est fixé par décret gouvernemental (loi
        n° 2016-71, article 20). Elle ne se confond pas avec les quatre primes de
        l'article 19 de la même loi, nommées chacune par son objet — augmentation
        de la valeur ajoutée et de la compétitivité, développement de la capacité
        d'employabilité, développement régional, développement durable.
      synonymes: []
    ar:
      terme: منحة الاستثمار
      definition: >
        منحة تُسند للمشاريع ذات الأهمية الوطنية في حدود ثلث كلفة الاستثمار، بما في
        ذلك المصاريف الناتجة عن أشغال البنية الأساسية الداخلية؛ ويُضبط سقفها بأمر
        حكومي (القانون عدد 71 لسنة 2016، الفصل 20). وهي غير المنح الأربع المنصوص
        عليها بالفصل 19 من القانون نفسه، وكل منها مسمّاة بموضوعها — منحة الترفيع
        من القيمة المضافة والقدرة التنافسية، ومنحة تطوير القدرة التشغيلية، ومنحة
        التنمية الجهوية، ومنحة التنمية المستدامة.
      synonymes: []

  - id: projet-interet-national
    acronyme: null
    statut: valide
    references: [loi-2016-71-investissement]
    # Arabe : « تنتفع المشاريع ذات الأهمية الوطنية بالحوافز التالية », art. 20 (quatre
    # occurrences dans la loi, toutes au pluriel défini). Le singulier n'y figure
    # qu'au génitif indéfini (« لكل مشروع ذي أهمية وطنية ») : aucune forme de
    # citation n'en est reconstruite, d'où l'absence de synonyme arabe.
    source_definition: {ref: loi-2016-71-investissement, locator: "art. 20"}
    source_traduction: {ref: loi-2016-71-investissement, locator: "art. 20"}
    voir_aussi: [prime-investissement, avantage-fiscal, impot-societes]
    fr:
      terme: Projets d'intérêt national
      definition: >
        Projets désignés par décret gouvernemental d'après la taille de leur
        investissement ou leur capacité d'employabilité, et qui satisfont à l'un
        au moins des objectifs de l'article premier de la loi de l'investissement.
        Ils bénéficient d'une déduction des bénéfices de l'assiette de l'impôt sur
        les sociétés dans la limite de dix années, d'une prime d'investissement
        dans la limite du tiers du coût d'investissement et de la participation de
        l'État aux dépenses des travaux d'infrastructure ; ces incitations sont
        octroyées à chaque projet par décret gouvernemental (loi n° 2016-71,
        article 20).
      synonymes: [Projet d'intérêt national]
    ar:
      terme: المشاريع ذات الأهمية الوطنية
      definition: >
        مشاريع تُضبط بأمر حكومي بناء على حجمها الاستثماري أو طاقتها التشغيلية
        واستجابتها على الأقل لأحد الأهداف المنصوص عليها بالفصل الأول من قانون
        الاستثمار. وتنتفع بطرح الأرباح من قاعدة الضريبة على الشركات في حدود عشر
        سنوات، وبمنحة استثمار في حدود ثلث كلفة الاستثمار، وبمساهمة الدولة في
        تحمّل المصاريف الناتجة عن أشغال البنية الأساسية؛ وتُسند هذه الحوافز لكل
        مشروع بأمر حكومي (القانون عدد 71 لسنة 2016، الفصل 20).
      synonymes: []

  - id: code-incitations-investissements
    acronyme: null
    statut: valide
    references: [loi-93-120-code-incitations, loi-2016-71-investissement]
    source_definition: {ref: loi-93-120-code-incitations}
    # Arabe : « يلغى العمل بمجلة تشجيع الاستثمارات », art. 27 de la loi n° 2016-71 qui
    # abroge le code. Le terme N'A PAS été lu sur le fascicule arabe de 1993 (JORT
    # n° 99, scan sans couche texte), mais sur ce texte postérieur et sur la loi
    # n° 2017-8 : il est attesté au JORT, par deux lois qui nomment le code.
    # Les lois de 2016 et de 2017 écrivent, en français, « code d'incitation aux
    # investissements » ; le titre de 1993 porte le pluriel.
    source_traduction: {ref: loi-2016-71-investissement, locator: "art. 27"}
    voir_aussi: [avantage-fiscal, entreprise-totalement-exportatrice, zone-developpement-regional]
    fr:
      terme: Code d'incitations aux investissements
      definition: >
        Code promulgué par la loi n° 93-120 du 27 décembre 1993. Il réunit des
        incitations communes à tous les investissements et des régimes propres,
        dont ceux de l'exportation, du développement régional et du développement
        agricole. La loi de l'investissement l'abroge à compter du 1^er^ janvier
        2017, à l'exception de ses articles 14 et 36 et sous réserve de
        dispositions transitoires (loi n° 2016-71, articles 26 à 32).
      synonymes: [Code d'incitation aux investissements]
    ar:
      terme: مجلة تشجيع الاستثمارات
      definition: >
        المجلة الصادرة بمقتضى القانون عدد 120 لسنة 1993 المؤرخ في 27 ديسمبر 1993.
        وتجمع حوافز مشتركة لكل الاستثمارات وأنظمة خاصة، منها أنظمة التصدير
        والتنمية الجهوية والتنمية الفلاحية. وقد ألغى قانون الاستثمار العمل بها
        ابتداء من غرة جانفي 2017، باستثناء فصليها 14 و36 ومع مراعاة أحكام
        انتقالية (القانون عدد 71 لسنة 2016، الفصول من 26 إلى 32).
      synonymes: []

  - id: garantie-etat
    acronyme: null
    statut: provisoire  # AR : « ضمان الدولة », rapport sur la dette publique (annexe n° 7), édition arabe ; définition arabe à écrire par le terminologue
    references: [minfin-dette-2025, loi-org-2019-15-lob]
    source_definition: {ref: minfin-dette-2025, locator: "p. 61"}
    source_traduction: {ref: minfin-dette-2025}
    voir_aussi: [entreprises-publiques, epna]
    fr:
      terme: Garantie de l'État
      definition: >
        Engagement par lequel l'État se substitue à une entreprise ou à un
        établissement public dans ses obligations envers un prêteur, si
        l'emprunteur fait défaut. La loi de finances en fixe chaque année le
        plafond (loi organique du budget n° 2019-15, article 45). On distingue
        les garanties accordées dans l'année et l'encours de la dette garantie.
      synonymes: []
    ar:
      terme: ضمان الدولة
      definition: ""
      synonymes: []

  - id: participation-publique
    acronyme: null
    statut: provisoire  # AR : « المساهمات العمومية », intitulé du relevé arabe de la Direction générale de la privatisation ; édition arabe de la loi n° 89-9 à lire
    references: [loi89-9]
    source_definition: {ref: loi89-9, locator: "art. 8"}
    source_traduction: {ref: dgpv-recettes-annuelles-1987-2009}
    voir_aussi: [entreprises-publiques]
    fr:
      terme: Participation publique
      definition: >
        Participation au capital d'une société détenue par l'État, une
        collectivité locale, un établissement public ou une société dont le
        capital est entièrement détenu par l'État (loi n° 89-9, article 8).
        Une société est une entreprise publique quand ces participations
        dépassent, seules ou ensemble, 50 % de son capital.
      synonymes: [Participations publiques]
    ar:
      terme: مساهمة عمومية
      definition: ""
      synonymes: [المساهمات العمومية]

  # ── Éducation (passe 1 du terminologue, 17 octobre 2026) ─────────────────────
  # Notions des notes docs/notes/education-*-2026-10-17.md. Passe 2 (même jour) :
  # `valide` les notions ancrées dont l'arabe est lu au JORT, avec définition arabe ;
  # restent `provisoire`, sans définition arabe, les formes « AR à confirmer », celles
  # des budgets et PAP (non JORT) et les notions analytiques. « AR lu » : forme relevée à l'image
  # ou dans la couche texte de l'édition arabe du texte cité ; « AR à confirmer » :
  # forme du terminologue ou d'un document non officiel, sans `source_traduction`.

  # Le système scolaire

  - id: enseignement-de-base
    acronyme: null
    statut: valide  # AR lu : loi n° 2002-80 (AR), art. 19-22
    references: [loi91-65, loi2002-80]
    source_definition: {ref: loi2002-80, locator: "art. 19-22"}
    source_traduction: {ref: loi2002-80, locator: "art. 19"}
    voir_aussi: [cycle-primaire, cycle-preparatoire, obligation-scolaire, diplome-fin-enseignement-base]
    fr:
      terme: Enseignement de base
      definition: >
        Enseignement de neuf ans, obligatoire, institué par la loi n° 91-65 sous le nom
        d'école de base, qui comprend un cycle primaire de six ans et un cycle
        préparatoire de trois ans (loi d'orientation n° 2002-80, art. 22). L'année
        préparatoire s'y rattache depuis 2002, hors gratuité et hors obligation.
      synonymes: [École de base]
    ar:
      terme: التعليم الأساسي
      definition: >
        تعليم إجباري مدّته تسع سنوات، أُحدث بالقانون عدد 91-65، ويشمل المرحلة الابتدائية
        ومدّتها ست سنوات والمرحلة الإعدادية ومدّتها ثلاث سنوات (القانون عدد 2002-80،
        الفصل 22). وتُلحق به السنة التحضيرية منذ سنة 2002، دون أن يكون التعليم فيها
        إجباريا ولا مجانيا.
      synonymes: []

  - id: cycle-primaire
    acronyme: null
    statut: valide  # AR lu : loi n° 2002-80 (AR), art. 16, 22 et 30
    references: [loi2002-80]
    source_definition: {ref: loi2002-80, locator: "art. 22"}
    source_traduction: {ref: loi2002-80, locator: "art. 22"}
    voir_aussi: [enseignement-de-base, cycle-preparatoire]
    fr:
      terme: Cycle primaire
      definition: >
        Premier cycle de l'enseignement de base, d'une durée de six ans, dispensé dans
        les écoles primaires.
      synonymes: [Premier cycle de l'enseignement de base]
    ar:
      terme: المرحلة الابتدائية
      definition: >
        المرحلة الأولى من التعليم الأساسي، ومدّتها ست سنوات، وتُؤمَّن بالمدارس
        الابتدائية.
      synonymes: [المرحلة الأولى من التعليم الأساسي]

  - id: cycle-preparatoire
    acronyme: null
    statut: valide  # AR lu : loi n° 2002-80 (AR), art. 22 et 30
    references: [loi2002-80]
    source_definition: {ref: loi2002-80, locator: "art. 22"}
    source_traduction: {ref: loi2002-80, locator: "art. 22"}
    voir_aussi: [enseignement-de-base, cycle-primaire, ecole-preparatoire, annee-preparatoire]
    fr:
      terme: Cycle préparatoire
      definition: >
        Second cycle de l'enseignement de base, d'une durée de trois ans, dispensé dans
        les écoles préparatoires, ou collèges. À distinguer de l'année préparatoire, qui
        précède le cycle primaire.
      synonymes: [Second cycle de l'enseignement de base]
    ar:
      terme: المرحلة الإعدادية
      definition: >
        المرحلة الثانية من التعليم الأساسي، ومدّتها ثلاث سنوات، وتُؤمَّن بالمدارس
        الإعدادية. ولا تُخلط بالسنة التحضيرية التي تسبق المرحلة الابتدائية.
      synonymes: [المرحلة الثانية من التعليم الأساسي]

  - id: annee-preparatoire
    acronyme: null
    statut: valide  # AR lu : loi n° 2002-80 (AR), art. 16-18
    references: [loi2002-80]
    source_definition: {ref: loi2002-80, locator: "art. 16-18"}
    source_traduction: {ref: loi2002-80, locator: "art. 16"}
    voir_aussi: [education-prescolaire, cycle-primaire, cycle-preparatoire]
    fr:
      terme: Année préparatoire
      definition: >
        Dernière année de l'éducation préscolaire, pour les enfants de cinq à six ans,
        qui prépare au cycle primaire ; la loi d'orientation n° 2002-80 la rattache à
        l'enseignement de base sans lui appliquer ni la gratuité ni l'obligation
        scolaire (art. 18).
      synonymes: []
    ar:
      terme: السنة التحضيرية
      definition: >
        السنة الأخيرة من التربية قبل المدرسية، وتهمّ الأطفال من خمس إلى ست سنوات،
        وتُعِدّ للمرحلة الابتدائية. ويُلحقها القانون عدد 2002-80 بالتعليم الأساسي، دون
        أن يكون التعليم فيها إجباريا ولا مجانيا (الفصل 18).
      synonymes: []

  - id: education-prescolaire
    acronyme: null
    statut: valide  # AR lu : loi n° 2002-80 (AR), art. 16
    references: [loi2002-80]
    source_definition: {ref: loi2002-80, locator: "art. 16"}
    source_traduction: {ref: loi2002-80, locator: "art. 16"}
    voir_aussi: [annee-preparatoire]
    fr:
      terme: Éducation préscolaire
      definition: >
        Éducation dispensée aux enfants de trois à six ans dans des établissements et
        espaces spécialisés, avant leur entrée à l'école primaire ; sa dernière année
        est l'année préparatoire.
      synonymes: []
    ar:
      terme: التربية قبل المدرسية
      definition: >
        تربية تُقدَّم للأطفال من ثلاث إلى ست سنوات في مؤسسات وفضاءات مختصة، قبل التحاقهم
        بالمدرسة الابتدائية؛ وسنتها الأخيرة هي السنة التحضيرية.
      synonymes: []

  - id: ecole-preparatoire
    acronyme: null
    statut: valide  # AR lu : loi n° 2002-80 (AR), art. 29-30 (« المدارس الإعدادية »)
    references: [loi91-65, loi2002-80]
    source_definition: {ref: loi2002-80, locator: "art. 30"}
    source_traduction: {ref: loi2002-80, locator: "art. 30"}
    voir_aussi: [cycle-preparatoire, college-pilote]
    fr:
      terme: École préparatoire
      definition: >
        Établissement public où est dispensé le cycle préparatoire, second cycle de
        l'enseignement de base.
      synonymes: [Collège]
    ar:
      terme: المدرسة الإعدادية
      definition: >
        مؤسسة تربوية عمومية تُؤمَّن بها المرحلة الإعدادية، وهي المرحلة الثانية من
        التعليم الأساسي.
      synonymes: []

  - id: college-pilote
    acronyme: null
    statut: valide  # AR lu : loi n° 2008-9 (AR), art. 2 (art. 60 bis) et 3 (« المدارس الإعدادية النموذجية »)
    references: [loi2008-9]
    source_definition: {ref: loi2008-9, locator: "art. 2-3"}
    source_traduction: {ref: loi2008-9, locator: "art. 2"}
    voir_aussi: [ecole-preparatoire, lycee-pilote]
    fr:
      terme: Collège pilote
      definition: >
        École préparatoire à laquelle on accède par un concours ouvert à la fin du cycle
        primaire, ajoutée aux établissements éducatifs publics par la loi n° 2008-9.
      synonymes: [École préparatoire pilote]
    ar:
      terme: المدرسة الإعدادية النموذجية
      definition: >
        مدرسة إعدادية يُلتحق بها بمناظرة تُفتح في نهاية المرحلة الابتدائية، أضافها
        القانون عدد 2008-9 إلى المؤسسات التربوية العمومية.
      synonymes: []

  - id: lycee-pilote
    acronyme: null
    statut: valide  # AR lu : loi n° 2002-80 (AR), art. 29-30 (« المعاهد النموذجية »)
    references: [loi2002-80, loi2008-9]
    source_definition: {ref: loi2002-80, locator: "art. 30"}
    source_traduction: {ref: loi2002-80, locator: "art. 30"}
    voir_aussi: [enseignement-secondaire, college-pilote]
    fr:
      terme: Lycée pilote
      definition: >
        Établissement public d'enseignement secondaire dont le régime d'études est fixé
        par arrêté du ministre chargé de l'éducation. Les collèges pilotes s'y ajoutent
        en 2008.
      synonymes: []
    ar:
      terme: المعهد النموذجي
      definition: >
        مؤسسة تربوية عمومية للتعليم الثانوي يُضبط نظام الدراسة بها بقرار من الوزير
        المكلف بالتربية. وتُضاف إليها المدارس الإعدادية النموذجية سنة 2008.
      synonymes: []

  - id: enseignement-secondaire
    acronyme: null
    statut: valide  # AR lu : loi n° 2002-80 (AR), art. 25-28
    references: [loi2002-80]
    source_definition: {ref: loi2002-80, locator: "art. 25-28"}
    source_traduction: {ref: loi2002-80, locator: "art. 25"}
    voir_aussi: [enseignement-de-base, lycee-pilote]
    fr:
      terme: Enseignement secondaire
      definition: >
        Enseignement du second degré, sanctionné par le baccalauréat : six ans sous la
        loi de 1958, quatre ans depuis 1991. Depuis la loi d'orientation n° 2002-80, il
        est ouvert aux élèves qui ont achevé l'enseignement de base et comprend un an de
        tronc commun puis trois ans dans une filière.
      synonymes: []
    ar:
      terme: التعليم الثانوي
      definition: >
        تعليم يُتوَّج بالبكالوريا، مدّته ست سنوات بمقتضى قانون سنة 1958 وأربع سنوات منذ
        سنة 1991. ومنذ القانون عدد 2002-80، يُفتح للتلاميذ الذين أتمّوا التعليم الأساسي.
      synonymes: []

  - id: enseignement-moyen
    acronyme: null
    statut: provisoire  # AR à confirmer : édition arabe de la loi n° 58-118 non lue ; forme du terminologue
    references: [loi58-118]
    source_definition: {ref: loi58-118, locator: "art. 10-13"}
    voir_aussi: [enseignement-secondaire]
    fr:
      terme: Enseignement moyen
      definition: >
        Enseignement de trois ans créé par la loi n° 58-118, dispensé dans les collèges
        moyens en sections générale, commerciale et industrielle, et sanctionné par le
        brevet d'enseignement moyen.
      synonymes: []
    ar:
      terme: التعليم المتوسط
      definition: ""
      synonymes: []

  - id: diplome-fin-enseignement-base
    acronyme: null
    statut: valide  # AR lu : loi n° 2008-9 (AR), art. 1er (art. 61 nouveau) ; loi n° 2002-80 (AR), art. 25
    references: [loi91-65, loi2002-5, loi2008-9]
    source_definition: {ref: loi2008-9, locator: "art. 1er"}
    source_traduction: {ref: loi2008-9, locator: "art. 1er"}
    voir_aussi: [enseignement-de-base, cycle-preparatoire]
    fr:
      terme: Diplôme de fin de l'enseignement de base
      definition: >
        Diplôme que l'élève peut obtenir, à la fin du cycle préparatoire, par un examen
        national, obligatoire en 1991 et facultatif depuis 2002 ; depuis la loi n°
        2008-9, il est général ou technique.
      synonymes: [Diplôme de fin d'études de l'enseignement de base]
    ar:
      terme: شهادة ختم التعليم الأساسي
      definition: >
        شهادة يمكن للتلميذ الحصول عليها في نهاية المرحلة الإعدادية بامتحان وطني، كان
        إجباريا سنة 1991 وأصبح اختياريا منذ سنة 2002؛ وهي عامة أو تقنية منذ القانون عدد
        2008-9.
      synonymes: [شهادة ختم التعليم الأساسي العام, شهادة ختم التعليم الأساسي التقني]

  - id: obligation-scolaire
    acronyme: null
    # AR lu : loi n° 2017-13 (AR, couche texte), art. 1er, JORT AR n° 22 de 2017
    # (« الأحكام المتعلقة بإجبارية التعليم الأساسي الواردة بالقانون التوجيهي عدد 80 لسنة
    # 2002 ») ; la loi n° 2002-80 (AR), art. 1er et 20, écrit « التعليم إجباري ». Corrige
    # « إجبارية التعليم » de la passe 1 (passe 2, 17 octobre 2026).
    statut: valide
    references: [loi91-65, loi2002-80, loi2017-13]
    source_definition: {ref: loi2002-80, locator: "art. 1er et 20"}
    source_traduction: {ref: loi2017-13, locator: "art. 1er"}
    voir_aussi: [enseignement-de-base, tuteur, gratuite-enseignement]
    fr:
      terme: Obligation scolaire
      definition: >
        Obligation d'enseignement de six à seize ans, imposée par la loi n° 91-65 et
        reprise par la loi d'orientation n° 2002-80, pour tout élève capable de
        poursuivre normalement ses études ; le tuteur qui s'y soustrait est puni d'une
        amende. La Constitution de 2022 lui donne un rang constitutionnel.
      synonymes: []
    ar:
      terme: إجبارية التعليم الأساسي
      definition: >
        إلزام بالتعليم من ست سنوات إلى ست عشرة سنة، فرضه القانون عدد 65 لسنة 1991
        وأعاده القانون التوجيهي عدد 80 لسنة 2002، لكل تلميذ قادر على مواصلة دراسته
        بصفة عادية؛ ويُعاقَب الولي الذي يخالفه بخطية. ويمنحه دستور 2022 مرتبة دستورية.
      synonymes: []

  - id: gratuite-enseignement
    acronyme: null
    # AR à confirmer : le texte arabe écrit « حق التعليم مجانا » (loi n° 2002-80, art. 4) et
    # « التعليم العالي العمومي مجاني » (loi n° 2008-19, art. 7) ; la forme nominale est du
    # terminologue.
    statut: provisoire
    references: [loi2002-80, loi2008-19]
    source_definition: {ref: loi2002-80, locator: "art. 4"}
    voir_aussi: [obligation-scolaire, droits-inscription]
    fr:
      terme: Gratuité de l'enseignement
      definition: >
        Garantie par l'État du droit à l'enseignement sans frais dans les établissements
        éducatifs publics, de principe depuis 1958 ; l'enseignement supérieur public est
        gratuit, sous réserve des droits d'inscription (loi n° 2008-19, art. 7), et la
        Constitution de 2022 garantit l'enseignement public gratuit à toutes ses étapes.
      synonymes: []
    ar:
      terme: مجانية التعليم
      definition: ""
      synonymes: []

  - id: tuteur
    acronyme: null
    statut: valide  # AR lu : loi n° 2002-80 (AR), art. 21
    references: [loi91-65, loi2002-80]
    source_definition: {ref: loi2002-80, locator: "art. 21"}
    source_traduction: {ref: loi2002-80, locator: "art. 21"}
    voir_aussi: [obligation-scolaire]
    fr:
      terme: Tuteur
      definition: >
        Personne responsable de l'élève, passible d'une amende lorsqu'elle s'abstient de
        l'inscrire ou le retire de l'école avant seize ans.
      synonymes: []
    ar:
      terme: الولي
      definition: >
        الشخص المسؤول عن التلميذ، ويُعاقَب بخطية إذا امتنع عن ترسيمه أو سحبه من المدرسة
        قبل بلوغه ست عشرة سنة.
      synonymes: []

  - id: conseil-superieur-education-enseignement
    acronyme: null
    statut: valide  # AR lu : décret-loi n° 2024-2, édition arabe (seule publiée)
    references: [decret-loi2024-2, decret2025-246]
    source_definition: {ref: decret-loi2024-2}
    source_traduction: {ref: decret-loi2024-2}
    voir_aussi: [conseil-superieur-education, fonds-national-reforme-educative]
    fr:
      terme: Conseil supérieur de l'éducation et de l'enseignement
      definition: >
        Instance constitutionnelle prévue par la Constitution de 2022 (art. 135), qui
        donne son avis sur les grands plans nationaux d'éducation, d'enseignement, de
        recherche scientifique, de formation professionnelle et d'emploi ; le décret-loi
        n° 2024-2 l'organise et la dote de la personnalité juridique et de l'autonomie
        financière. À distinguer du Conseil supérieur de l'éducation de 1991 et de 2000.
      synonymes: []
    ar:
      terme: المجلس الأعلى للتربية والتعليم
      definition: >
        هيئة دستورية نصّ عليها دستور سنة 2022 (الفصل 135)، تتولى إبداء الرأي في الخطط
        الوطنية الكبرى في مجال التربية والتعليم والبحث العلمي والتكوين المهني وآفاق
        التشغيل؛ ويضبط المرسوم عدد 2024-2 تنظيمها، وهي تتمتع بالشخصية القانونية
        والاستقلالية المالية.
      synonymes: []

  - id: conseil-superieur-education
    acronyme: null
    statut: provisoire  # AR à confirmer : édition arabe du décret n° 2000-2260 non lue ; forme du terminologue
    references: [loi91-65, decret2000-2260]
    source_definition: {ref: decret2000-2260}
    voir_aussi: [conseil-superieur-education-enseignement]
    fr:
      terme: Conseil supérieur de l'éducation
      definition: >
        Organe consulté sur les questions d'intérêt national relatives à l'éducation
        (loi n° 91-65, art. 2), dont le décret n° 2000-2260 fixe les attributions, la
        composition et le fonctionnement, sous la présidence du Premier ministre. À
        distinguer du Conseil supérieur de l'éducation nationale de 1958 et du Conseil
        supérieur de l'éducation et de l'enseignement de 2022-2024.
      synonymes: []
    ar:
      terme: المجلس الأعلى للتربية
      definition: ""
      synonymes: []

  - id: fonds-national-reforme-educative
    acronyme: null
    statut: valide  # AR lu : loi de finances pour 2024 (AR), art. 15 (« صندوق وطني للإصلاح التربوي »)
    references: [lf-2024]
    source_definition: {ref: lf-2024, locator: "art. 15"}
    source_traduction: {ref: lf-2024, locator: "art. 15"}
    voir_aussi: [conseil-superieur-education-enseignement]
    fr:
      terme: Fonds national de la réforme éducative
      definition: >
        Fonds créé par la loi de finances pour 2024, alimenté par des dons et par une
        part des bénéfices d'établissements éducatifs privés et de certaines sociétés,
        qui finance la réforme du système éducatif ; l'ordonnateur en est le président
        du Conseil supérieur de l'éducation et de l'enseignement (« président du
        Conseil supérieur de l'éducation », dans les termes de la loi), et, jusqu'à sa
        nomination, le ministre de l'Éducation à titre provisoire. Le terme français est
        une traduction : la loi n'a pas d'édition française.
      synonymes: []
    ar:
      terme: الصندوق الوطني للإصلاح التربوي
      definition: >
        صندوق أُحدث بقانون المالية لسنة 2024، تتمثل موارده في الهبات وفي نسبة من أرباح
        المؤسسات التربوية الخاصة وبعض الشركات، ويموّل إصلاح المنظومة التربوية؛ ويكون
        رئيس المجلس الأعلى للتربية والتعليم آمرا بالصرف له (ويسمّيه القانون «رئيس
        المجلس الأعلى للتربية»)، ويتولى وزير التربية ذلك بصفة وقتية إلى حين تعيينه.
      synonymes: []

  # Enseignement supérieur et formation professionnelle

  - id: lmd
    acronyme: LMD
    statut: valide  # AR lu : loi n° 2008-19 (AR), art. 3 ; « أمد » au décret n° 2009-3040 (AR), art. 4
    references: [loi2008-19, decret2008-3123]
    source_definition: {ref: loi2008-19, locator: "art. 3"}
    source_traduction: {ref: loi2008-19, locator: "art. 3"}
    voir_aussi: []
    fr:
      terme: Licence, mastère, doctorat
      definition: >
        Organisation des études supérieures en trois cycles sanctionnés chacun par un
        diplôme : licence en trois ans après le baccalauréat, mastère en deux ans après
        la licence, doctorat en trois ans après le mastère.
      synonymes: [Système LMD]
    ar:
      terme: الإجازة والماجستير والدكتوراه
      definition: >
        تنظيم للدراسات الجامعية في ثلاث مراحل تُتوَّج كل منها بشهادة: الإجازة في ثلاث
        سنوات بعد البكالوريا، والماجستير في سنتين بعد الإجازة، والدكتوراه في ثلاث سنوات
        بعد الماجستير.
      synonymes: [أمد]

  - id: certificat-aptitude-professionnelle
    acronyme: CAP
    statut: valide  # AR lu : loi n° 2008-10 (AR), art. 9
    references: [loi2008-10]
    source_definition: {ref: loi2008-10, locator: "art. 9"}
    source_traduction: {ref: loi2008-10, locator: "art. 9"}
    voir_aussi: [formation-professionnelle-initiale, brevet-technicien-professionnel, certificat-de-competence]
    fr:
      terme: Certificat d'aptitude professionnelle
      definition: >
        Diplôme qui sanctionne le premier niveau de la formation professionnelle
        initiale, ouvert à ceux qui ont achevé la neuvième année de l'enseignement de
        base.
      synonymes: []
    ar:
      terme: شهادة الكفاءة المهنية
      definition: >
        شهادة تُتوِّج المستوى الأول من التكوين المهني الأساسي، ويُفتح التكوين المؤدي
        إليها لمن أتمّ السنة التاسعة من التعليم الأساسي.
      synonymes: []

  - id: brevet-technicien-professionnel
    acronyme: BTP
    statut: valide  # AR lu : loi n° 2008-10 (AR), art. 9
    references: [loi2008-10]
    source_definition: {ref: loi2008-10, locator: "art. 9"}
    source_traduction: {ref: loi2008-10, locator: "art. 9"}
    voir_aussi: [certificat-aptitude-professionnelle, baccalaureat-professionnel, brevet-technicien-superieur]
    fr:
      terme: Brevet de technicien professionnel
      definition: >
        Diplôme qui sanctionne l'une des deux filières du deuxième niveau de la
        formation professionnelle initiale ; l'autre est sanctionnée par le baccalauréat
        professionnel.
      synonymes: []
    ar:
      terme: شهادة مؤهل التقني المهني
      definition: >
        شهادة تُتوِّج أحد صنفي التكوين في المستوى الثاني من التكوين المهني الأساسي،
        ويُتوَّج الصنف الآخر بالبكالوريا المهنية.
      synonymes: []

  - id: baccalaureat-professionnel
    acronyme: null
    statut: valide  # AR lu : loi n° 2008-10 (AR), art. 9 et 12
    references: [loi2008-10]
    source_definition: {ref: loi2008-10, locator: "art. 9 et 12"}
    source_traduction: {ref: loi2008-10, locator: "art. 9"}
    voir_aussi: [brevet-technicien-professionnel, brevet-technicien-superieur]
    fr:
      terme: Baccalauréat professionnel
      definition: >
        Diplôme qui sanctionne l'autre filière du deuxième niveau de la formation
        professionnelle initiale, créé par la loi n° 2008-10 ; il ouvre l'accès au
        marché du travail et à l'enseignement supérieur dans les spécialités
        compatibles.
      synonymes: []
    ar:
      terme: البكالوريا المهنية
      definition: >
        شهادة تُتوِّج الصنف الآخر من التكوين في المستوى الثاني من التكوين المهني
        الأساسي، أحدثها القانون عدد 2008-10، وتفتح باب سوق الشغل والتعليم العالي في
        الاختصاصات الملائمة.
      synonymes: []

  - id: brevet-technicien-superieur
    acronyme: BTS
    statut: valide  # AR lu : loi n° 2008-10 (AR), art. 9
    references: [loi2008-10]
    source_definition: {ref: loi2008-10, locator: "art. 9"}
    source_traduction: {ref: loi2008-10, locator: "art. 9"}
    voir_aussi: [baccalaureat-professionnel, brevet-technicien-professionnel]
    fr:
      terme: Brevet de technicien supérieur
      definition: >
        Diplôme qui sanctionne le troisième niveau de la formation professionnelle
        initiale, ouvert aux titulaires du baccalauréat professionnel ou du
        baccalauréat de l'enseignement secondaire.
      synonymes: []
    ar:
      terme: شهادة مؤهل التقني السامي
      definition: >
        شهادة تُتوِّج المستوى الثالث من التكوين المهني الأساسي، ويُفتح التكوين المؤدي
        إليها لحاملي البكالوريا المهنية أو بكالوريا التعليم الثانوي.
      synonymes: []

  - id: certificat-de-competence
    acronyme: null
    statut: valide  # AR lu : loi n° 2008-10 (AR), art. 13 (« شهادة مهارة »)
    references: [loi2008-10]
    source_definition: {ref: loi2008-10, locator: "art. 13"}
    source_traduction: {ref: loi2008-10, locator: "art. 13"}
    voir_aussi: [certificat-aptitude-professionnelle]
    fr:
      terme: Certificat de compétence
      definition: >
        Certificat qui sanctionne une formation organisée pour ceux qui n'ont pas le
        niveau scolaire requis pour accéder au premier niveau de la formation
        professionnelle.
      synonymes: []
    ar:
      terme: شهادة مهارة
      definition: >
        شهادة تُتوِّج تكوينا يُنظَّم لفائدة من لا يتوفر فيهم المستوى الدراسي المطلوب
        للالتحاق بالمستوى الأول من التكوين المهني.
      synonymes: []

  - id: formation-professionnelle-initiale
    acronyme: null
    statut: valide  # AR lu : loi n° 2017-13 (AR, couche texte et intitulé) ; loi n° 2008-10 (AR), art. 7-8 (« التكوين الأساسي »)
    references: [loi2008-10, loi2017-13]
    source_definition: {ref: loi2008-10, locator: "art. 7-9"}
    source_traduction: {ref: loi2017-13}
    voir_aussi: [formation-en-alternance, apprentissage, certificat-aptitude-professionnelle, tfp, fonds-formation-apprentissage]
    fr:
      terme: Formation professionnelle initiale
      definition: >
        Formation qui fait acquérir les connaissances et compétences nécessaires à
        l'exercice d'un métier, organisée en trois niveaux sanctionnés par des diplômes.
        Depuis la loi n° 2017-13, elle est obligatoire jusqu'à dix-huit ans pour qui ne
        s'est pas inséré dans la vie professionnelle, sauf s'il poursuit sa scolarité.
      synonymes: [Formation initiale]
    ar:
      terme: التكوين المهني الأساسي
      definition: >
        تكوين يُكسب المعارف والكفايات اللازمة لممارسة مهنة، ويُنظَّم في ثلاثة مستويات
        تُتوَّج بشهادات. ومنذ القانون عدد 2017-13، يكون إجباريا إلى سن الثامنة عشرة لكل
        من لم يندمج في الحياة المهنية، ما لم يواصل دراسته.
      synonymes: [التكوين الأساسي]

  - id: formation-en-alternance
    acronyme: null
    statut: valide  # AR lu : loi n° 2008-10 (AR), art. 15
    references: [loi2008-10]
    source_definition: {ref: loi2008-10, locator: "art. 15"}
    source_traduction: {ref: loi2008-10, locator: "art. 15"}
    voir_aussi: [apprentissage, formation-professionnelle-initiale]
    fr:
      terme: Formation en alternance
      definition: >
        Formation organisée dans un cadre contractuel entre les structures de formation
        professionnelle et les entreprises, par périodes alternées ; elle est ouverte
        dès quinze ans.
      synonymes: []
    ar:
      terme: التكوين بالتداول
      definition: >
        تكوين يُنظَّم في إطار تعاقدي بين هياكل التكوين المهني والمؤسسات، على فترات
        متداولة، ويُفتح ابتداء من سن الخامسة عشرة.
      synonymes: []

  - id: apprentissage
    acronyme: null
    statut: valide  # AR lu : loi n° 2008-10 (AR), art. 15 ; même terme dans l'intitulé arabe du fonds (LF 2000, art. 17)
    references: [loi2008-10]
    source_definition: {ref: loi2008-10, locator: "art. 15"}
    source_traduction: {ref: loi2008-10, locator: "art. 15"}
    voir_aussi: [formation-en-alternance, fonds-formation-apprentissage, tfp]
    fr:
      terme: Apprentissage
      definition: >
        Formation organisée dans un cadre contractuel entre l'apprenti et l'entreprise,
        principalement en entreprise, complétée par une formation théorique ; elle est
        ouverte de quinze à vingt ans, sous un contrat écrit visé par l'administration.
      synonymes: []
    ar:
      terme: التدريب المهني
      definition: >
        تكوين يُنظَّم في إطار تعاقدي بين المتدرّب والمؤسسة، ويتمّ أساسا داخل المؤسسة
        ويُستكمل بتكوين نظري، ويُفتح من سن الخامسة عشرة إلى سن العشرين بمقتضى عقد كتابي
        تؤشّر عليه الإدارة.
      synonymes: []

  # Aides scolaires

  - id: bourse-scolaire
    acronyme: null
    statut: valide  # AR lu : décret gouvernemental n° 2016-664 (AR, couche texte), « المنح المدرسية »
    references: [arrete-1966-10-03-bourses-scolaires, decret-71-356-bourses-scolaires, decret-gouv-2016-664-office-services-scolaires]
    source_definition: {ref: decret-71-356-bourses-scolaires, locator: "art. 3"}
    source_traduction: {ref: decret-gouv-2016-664-office-services-scolaires}
    voir_aussi: [fraction-de-bourse, pension-demi-pension, commission-regionale-bourses-scolaires]
    fr:
      terme: Bourse scolaire
      definition: >
        Aide accordée à l'élève de l'enseignement secondaire public dont la famille est
        nécessiteuse, qui couvre une fraction de ses frais de pension ou de
        demi-pension, jamais ses fournitures ; elle n'a pas de montant en dinars. Depuis
        2016, l'office des services scolaires l'attribue.
      synonymes: []
    ar:
      terme: المنحة المدرسية
      definition: >
        منحة تُسند إلى تلميذ التعليم الثانوي العمومي المنتمي إلى عائلة معوزة، وتغطي جزءا
        من المصاريف التي يدفعها بصفته مقيما بالمبيت المدرسي أو منتفعا بالمطعم المدرسي،
        ولا تشمل أبدا مصاريف اللوازم الدراسية؛ وليس لها مقدار بالدينار. ويتولى ديوان
        الخدمات المدرسية إسنادها منذ سنة 2016.
      synonymes: [المنح المدرسية]

  - id: fraction-de-bourse
    acronyme: null
    statut: provisoire  # AR à confirmer : éditions arabes de 1971 et 1974 non lues ; forme du terminologue
    references: [decret-71-356-bourses-scolaires, arrete-1974-08-12-criteres-bourses]
    source_definition: {ref: decret-71-356-bourses-scolaires, locator: "annexe"}
    voir_aussi: [bourse-scolaire]
    fr:
      terme: Fraction de bourse
      definition: >
        Part des frais couverte par la bourse scolaire — quart, demi, trois quarts ou
        bourse complète —, déterminée par le total de points obtenu au barème ; le
        quart de bourse disparaît en 1972.
      synonymes: []
    ar:
      terme: جزء المنحة
      definition: ""
      synonymes: []

  - id: pension-demi-pension
    acronyme: null
    statut: provisoire  # AR à confirmer : « نصف الإقامة » est pressenti par la note, non lu
    references: [arrete-1966-10-03-bourses-scolaires, decret-71-356-bourses-scolaires]
    source_definition: {ref: arrete-1966-10-03-bourses-scolaires, locator: "art. 3"}
    voir_aussi: [bourse-scolaire, foyer-scolaire, cantine-scolaire]
    fr:
      terme: Pension et demi-pension
      definition: >
        Régimes de l'élève interne et de l'élève demi-pensionnaire, dont les frais
        forment l'assiette de la bourse scolaire.
      synonymes: []
    ar:
      terme: الإقامة ونصف الإقامة
      definition: ""
      synonymes: []

  - id: cantine-scolaire
    acronyme: null
    statut: valide  # AR lu : décret gouvernemental n° 2016-664 (AR, couche texte), « المطاعم المدرسية »
    references: [decret-gouv-2016-664-office-services-scolaires, mineducation-pap-2014]
    source_definition: {ref: decret-gouv-2016-664-office-services-scolaires, locator: "art. 2 et 8"}
    source_traduction: {ref: decret-gouv-2016-664-office-services-scolaires, locator: "art. 2"}
    voir_aussi: [office-oeuvres-scolaires, foyer-scolaire]
    fr:
      terme: Cantine scolaire
      definition: >
        Service de restauration des établissements éducatifs publics, géré depuis le 31
        décembre 2016 par l'office des services scolaires.
      synonymes: []
    ar:
      terme: المطعم المدرسي
      definition: >
        مرفق الإطعام بالمؤسسات التربوية العمومية، ويتولى ديوان الخدمات المدرسية التصرف
        فيه منذ 31 ديسمبر 2016.
      synonymes: [المطاعم المدرسية]

  - id: foyer-scolaire
    acronyme: null
    statut: valide  # AR lu : décret gouvernemental n° 2016-664 (AR, couche texte), « المبيتات المدرسية »
    references: [decret-gouv-2016-664-office-services-scolaires]
    source_definition: {ref: decret-gouv-2016-664-office-services-scolaires, locator: "art. 2"}
    source_traduction: {ref: decret-gouv-2016-664-office-services-scolaires, locator: "art. 2"}
    voir_aussi: [office-oeuvres-scolaires, cantine-scolaire, pension-demi-pension]
    fr:
      terme: Foyer scolaire
      definition: >
        Hébergement des élèves internes des établissements éducatifs publics, géré
        depuis le 31 décembre 2016 par l'office des services scolaires.
      synonymes: [Internat]
    ar:
      terme: المبيت المدرسي
      definition: >
        إيواء التلاميذ المقيمين بالمؤسسات التربوية العمومية، ويتولى ديوان الخدمات
        المدرسية التصرف فيه منذ 31 ديسمبر 2016.
      synonymes: [المبيتات المدرسية]

  - id: office-oeuvres-scolaires
    acronyme: null
    # AR lu : décret gouvernemental n° 2016-664 (AR, couche texte et intitulé). Passe 2 :
    # le terme français suit l'arabe, qui fait foi (« office des services scolaires ») ;
    # l'édition française du JORT (« office des œuvres scolaires ») passe en synonyme.
    # L'id reste stable : la prose ancre #g-office-oeuvres-scolaires.
    statut: valide
    references: [decret-gouv-2016-664-office-services-scolaires]
    source_definition: {ref: decret-gouv-2016-664-office-services-scolaires, locator: "art. 1er-2"}
    source_traduction: {ref: decret-gouv-2016-664-office-services-scolaires, locator: "art. 1er"}
    voir_aussi: [cantine-scolaire, foyer-scolaire, bourse-scolaire, office-oeuvres-universitaires]
    fr:
      terme: Office des services scolaires
      definition: >
        Établissement public à caractère administratif créé en 2016, sous la tutelle du
        ministère de l'Éducation, qui gère depuis le 31 décembre 2016 les cantines et
        les foyers des établissements éducatifs publics et attribue les bourses
        scolaires. L'édition française du décret de 2016 le nomme « office des œuvres
        scolaires » ; l'édition arabe, qui fait foi, dit « services ».
      synonymes: [Office des œuvres scolaires]
    ar:
      terme: ديوان الخدمات المدرسية
      definition: >
        مؤسسة عمومية ذات صبغة إدارية أُحدثت سنة 2016 تحت إشراف وزارة التربية، وتتولى منذ
        31 ديسمبر 2016 التصرف في المطاعم المدرسية والمبيتات المدرسية بالمؤسسات التربوية
        العمومية، وإسناد المنح المدرسية.
      synonymes: []

  - id: droits-inscription
    acronyme: null
    # AR lu : loi n° 2002-80 (AR), art. 36 (« رسوم التسجيل … رسوم التأمين والمكتبة ») ;
    # loi n° 2008-19 (AR), art. 7. À ne pas confondre avec les « معاليم التسجيل »,
    # droits d'enregistrement de la fiscalité.
    statut: valide
    references: [decret-92-1185-droits-inscription, decret-2010-1928-droits-inscription, decret-gouv-2019-898-droits-inscription]
    source_definition: {ref: decret-92-1185-droits-inscription, locator: "art. 1"}
    source_traduction: {ref: loi2002-80, locator: "art. 36"}
    voir_aussi: [gratuite-enseignement]
    fr:
      terme: Droits d'inscription
      definition: >
        Droits perçus, à l'inscription, des élèves des établissements d'enseignement
        publics, avec les droits d'assurance et de bibliothèque ; prévus par la loi n°
        91-65, fixés pour les écoles préparatoires et les lycées en 1992, étendus aux
        écoles primaires en 2010.
      synonymes: [Droits d'inscription, d'assurance et de bibliothèque]
    ar:
      terme: رسوم التسجيل
      definition: >
        رسوم تُستخلص من تلاميذ المؤسسات التربوية العمومية عند الترسيم، مع رسوم التأمين
        والمكتبة؛ نصّ عليها القانون عدد 91-65، وضُبطت بالنسبة إلى المدارس الإعدادية
        والمعاهد سنة 1992، ثم شملت المدارس الابتدائية سنة 2010.
      synonymes: [رسوم التسجيل والتأمين والمكتبة]

  - id: orientation-d-office
    acronyme: null
    statut: provisoire  # AR à confirmer : édition arabe du décret n° 72-229 non lue ; forme du terminologue
    references: [decret-72-229-bourses-scolaires]
    source_definition: {ref: decret-72-229-bourses-scolaires, locator: "annexe"}
    voir_aussi: [bourse-scolaire]
    fr:
      terme: Orientation d'office
      definition: >
        Affectation de l'élève, par l'administration, dans un établissement situé hors
        de sa délégation de résidence ; elle lui vaut des points au barème de la bourse
        scolaire depuis 1972.
      synonymes: []
    ar:
      terme: التوجيه الآلي
      definition: ""
      synonymes: []

  - id: commission-regionale-bourses-scolaires
    acronyme: null
