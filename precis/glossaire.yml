      definition: >
        Programme du Fonds national de l'emploi créé par le décret n° 2009-349 pour
        les diplômés du supérieur au chômage depuis plus de trois ans — depuis deux
        ans par une seconde voie ouverte en 2011. Le stage dure un an, avec une
        indemnité mensuelle de l'État ; pour les recrutements de 2009 à 2011,
        l'entreprise qui recrute le stagiaire bénéficie de la prise en charge de la
        contribution patronale. Maintenu à titre transitoire en 2012, il cesse le
        2 juillet 2019 avec l'abrogation du décret qui le maintenait, sans être
        nommé et sans successeur ; les contrats en cours sont menés à leur terme.
      synonymes: []
    ar:
      terme: عقد إدماج حاملي شهادات التعليم العالي
      definition: >
        برنامج من برامج الصندوق الوطني للتشغيل أحدثه الأمر عدد 349 لسنة 2009
        لفائدة حاملي شهادات التعليم العالي الذين تجاوزت فترة بطالتهم ثلاث سنوات،
        وسنتين بصيغة ثانية فُتحت سنة 2011. ويدوم التربص سنة، مع منحة شهرية تسندها
        الدولة؛ وتنتفع المؤسسة التي تنتدب المتربص، بالنسبة إلى انتدابات سنوات
