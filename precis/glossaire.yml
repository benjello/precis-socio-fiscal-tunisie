  - id: tableau-annexe-loi-88-62
    acronyme: null
    statut: valide
    references: [loi-88-62-droit-consommation, lf-2016, lf-2018, dgi-nc-7-2016, dgi-nc-17-2018]
    source_definition: {ref: loi-88-62-droit-consommation, locator: "tableau annexé"}
    source_traduction: {ref: lf-2016}
    voir_aussi: [droit-de-consommation, position-tarifaire]
    fr:
      terme: Tableau annexé à la loi n° 88-62
      definition: >
        Liste des produits soumis au droit de consommation, annexée à la loi
        n° 88-62 du 2 juin 1988. Elle porte à la fois le champ d'application et
        les taux : trois colonnes — numéro du tarif douanier, désignation des
        produits, droit applicable — et des renvois qui ajoutent des règles de
        fond. Modifier le tableau, c'est donc modifier le champ. Celui de 1988
        a été abrogé et remplacé en entier deux fois, par l'article 44 de la
        loi de finances pour 2016 puis par l'article 45 de la loi de finances
        pour 2018 : pour l'état en vigueur, la source est la version
        consolidée du code, et non le texte de 1988.
      synonymes: []
    ar:
      terme: الجدول المدرج بملحق القانون عدد 62 لسنة 1988
      definition: >
        قائمة المنتوجات الخاضعة للمعلوم على الاستهلاك، مدرجة بملحق القانون
        عدد 62 لسنة 1988 المؤرخ في 2 جوان 1988. وهي تحمل في الآن نفسه ميدان
        التطبيق والنسب: ثلاثة أعمدة — عدد التعريفة الديوانية وبيان المنتوجات
        ونسبة المعلوم — إضافة إلى إحالات تتضمّن قواعد أصلية. فتنقيح الجدول هو
        في ذاته تنقيح لميدان التطبيق. وقد أُلغي جدول 1988 وعُوّض بكامله
        مرّتين، بالفصل 44 من قانون المالية لسنة 2016 ثم بالفصل 45 من قانون
        المالية لسنة 2018: ولمعرفة الوضع الجاري به العمل تُعتمد النسخة
        المنقّحة للمجلة لا نصّ 1988.
      synonymes: []

  - id: position-tarifaire
    acronyme: null
    statut: provisoire
    references: [loi-88-62-droit-consommation]
    source_definition: {ref: loi-88-62-droit-consommation, locator: "tableau annexé, colonne « NT »"}
    voir_aussi: [tableau-annexe-loi-88-62, droit-de-consommation]
    fr:
      terme: Position tarifaire
      definition: >
        Numéro du tarif douanier par lequel le tableau annexé désigne les
        produits soumis au droit de consommation ; le tableau de 1988 en fait
        le titre de sa première colonne, « NT ». La position est soit entière
        (02-03), soit extraite et préfixée « Ex », le libellé précisant alors
        quelle partie de la position est retenue et quelles exclusions s'y
        attachent. Le champ du droit de consommation est ainsi défini par une
        liste douanière, et non par une catégorie économique.
      synonymes: [NT, numéro du tarif douanier]
    ar:
      terme: البند التعريفي
      definition: >
        عدد التعريفة الديوانية الذي يعيّن به الجدول الملحق المنتوجات الخاضعة
        للمعلوم على الاستهلاك؛ وقد جعله جدول 1988 عنوانا لعموده الأول. ويكون
        البند كاملا (02-03) أو مستخرَجا يسبقه الرمز «م»، فيحدّد البيان عندئذ
        الجزء المعنيّ منه وما يُستثنى فيه. وبذلك يُضبط ميدان المعلوم على
        الاستهلاك بقائمة ديوانية لا بصنف اقتصادي.
      synonymes: [عدد التعريفة]

  - id: taux-ad-valorem
    acronyme: null
    statut: provisoire
    references: [loi-88-62-droit-consommation, dgi-nc-29-2007]
    source_definition: {ref: loi-88-62-droit-consommation, locator: "art. 4-a"}
    voir_aussi: [assiette-droit-consommation, taux-specifique, valeur-en-douane]
    fr:
      terme: Taux ad valorem
      definition: >
        Taux exprimé en pourcentage d'une valeur, par opposition au taux
        spécifique. Lorsque le tableau annexé soumet un produit à un taux ad
        valorem, l'assiette du droit de consommation est, à l'importation, la
        valeur en douane et, en régime intérieur, le prix de vente tous frais,
        droits et taxes compris, à l'exclusion du droit de consommation
        lui-même et de la taxe sur la valeur ajoutée.
      synonymes: []
    ar:
      terme: نسبة من القيمة
      definition: >
        نسبة تُحتسب مئويا من قيمة، خلافا للنسبة النوعية. فإذا أخضع الجدول
        الملحق منتوجا لنسبة من القيمة، تكوّنت قاعدة المعلوم على الاستهلاك عند
        التوريد من القيمة المصرح بها لدى الديوانة، وفي النظام الداخلي من ثمن
        البيع باعتبار كل المصاريف والمعاليم والأداءات باستثناء المعلوم على
        الاستهلاك والأداء على القيمة المضافة.
      synonymes: []

  - id: taux-specifique
    acronyme: null
    statut: valide
    references: [loi-88-62-droit-consommation]
    source_definition: {ref: loi-88-62-droit-consommation, locator: "art. 4-b"}
    source_traduction: {ref: loi-88-62-droit-consommation, locator: "art. 4-b"}
    voir_aussi: [assiette-droit-consommation, taux-ad-valorem]
    fr:
      terme: Taux spécifique
      definition: >
        Taux assis non sur une valeur mais sur une quantité — volume ou poids
        —, par opposition au taux ad valorem. Le tableau annexé mêle les deux
        techniques dès 1988 : le droit de consommation n'est donc ni une taxe
        ad valorem ni une accise spécifique, mais mixte dès l'origine. Un
        tarif spécifique ne suit pas les prix ; il ne varie qu'à chaque
        révision du tableau, de sorte qu'une longue stabilité nominale y
        équivaut à une érosion réelle.
      synonymes: []
    ar:
      terme: نسبة نوعية
      definition: >
        نسبة لا تُحتسب من قيمة بل من كمّية — حجم أو وزن —، خلافا للنسبة من
        القيمة. ويجمع الجدول الملحق بين الأسلوبين منذ 1988: فالمعلوم على
        الاستهلاك ليس أداء على القيمة ولا معلوما نوعيا خالصا، بل هو مختلط منذ
        نشأته. والتعريفة النوعية لا تتبع الأسعار، إذ لا تتغيّر إلا بمراجعة
        الجدول، فيعادل ثباتها الاسمي الطويل تآكلا حقيقيا.
      synonymes: []

  - id: fait-generateur-droit-consommation
    acronyme: null
    statut: valide
    references: [loi-88-62-droit-consommation]
    source_definition: {ref: loi-88-62-droit-consommation, locator: "art. 3"}
    source_traduction: {ref: loi-88-62-droit-consommation, locator: "art. 3"}
    voir_aussi: [droit-de-consommation, fait-generateur-tva, entrepositaire]
    fr:
      terme: Fait générateur du droit de consommation
      definition: >
        Événement qui rend le droit de consommation exigible. L'article 3 de
        la loi n° 88-62 n'en retient que deux : le dédouanement du produit à
        l'importation, la livraison du produit en régime intérieur. La
        rédaction est plus étroite que celle du code de la taxe sur la valeur
        ajoutée — ni livraison à soi-même, ni prestation de service, ni
        travaux immobiliers —, l'impôt étant assis sur des produits et non sur
        des opérations de toute nature.
      synonymes: []
    ar:
      terme: الحدث المتولد عنه المعلوم على الاستهلاك
      definition: >
        الواقعة التي يصبح بها المعلوم على الاستهلاك مستوجبا. ولم يحتفظ الفصل 3
        من القانون عدد 62 لسنة 1988 إلا بحالتين: استخراج المنتوج من الديوانة
        عند التوريد، وتسليم المنتوج في النظام الداخلي. وهي صياغة أضيق من
        صياغة مجلة الأداء على القيمة المضافة — فلا تسليم للنفس ولا إسداء
        خدمات ولا أشغال عقارية — لأنّ الأداء موظّف على منتوجات لا على عمليات
        من كلّ نوع.
      synonymes: []

  - id: assiette-droit-consommation
    acronyme: null
    statut: valide
    references: [loi-88-62-droit-consommation, dgi-nc-29-2007]
    source_definition: {ref: loi-88-62-droit-consommation, locator: "art. 4"}
    source_traduction: {ref: loi-88-62-droit-consommation, locator: "art. 4"}
    voir_aussi: [droit-de-consommation, taux-ad-valorem, taux-specifique, valeur-en-douane]
    fr:
      terme: Assiette du droit de consommation
      definition: >
        Base sur laquelle le droit de consommation est liquidé. Elle se
        dédouble selon la technique retenue par le tableau annexé : pour les
        produits soumis à un taux ad valorem, la valeur en douane à
        l'importation, ou le prix de vente tous frais, droits et taxes
        compris — droit de consommation et taxe sur la valeur ajoutée exclus —
        en régime intérieur ; pour les produits soumis à un taux spécifique,
        le volume ou le poids. Cette assiette n'inclut pas la taxe sur la
        valeur ajoutée, alors que celle de la taxe inclut le droit de
        consommation : le cumul est une cascade asymétrique.
      synonymes: []
    ar:
      terme: قاعدة المعلوم على الاستهلاك
      definition: >
        القاعدة التي يُحتسب عليها المعلوم على الاستهلاك. وهي تنقسم بحسب
        الأسلوب الذي يعتمده الجدول الملحق: بالنسبة إلى المنتوجات الخاضعة
        لنسبة من القيمة، القيمة المصرح بها لدى الديوانة عند التوريد، أو ثمن
        البيع باعتبار كل المصاريف والمعاليم والأداءات باستثناء المعلوم على
        الاستهلاك والأداء على القيمة المضافة في النظام الداخلي؛ وبالنسبة إلى
        الخاضعة لنسبة نوعية، الحجم أو الوزن. ولا تشمل هذه القاعدة الأداء على
        القيمة المضافة، في حين تشمل قاعدة هذا الأخير المعلوم على الاستهلاك.
      synonymes: []

  - id: imputation-droit-consommation
    acronyme: null
    statut: provisoire
    references: [loi-88-62-droit-consommation, loi-89-115-lf-1990]
    source_definition: {ref: loi-88-62-droit-consommation, locator: "art. 5"}
    voir_aussi: [droit-de-consommation, facturation-identique]
    fr:
      terme: Imputation du droit de consommation
      definition: >
        Faculté reconnue aux assujettis d'imputer sur le droit de
        consommation dû celui qui a grevé leurs acquisitions auprès d'autres
        assujettis et leurs propres importations de matières ou produits
        entrant intégralement dans la composition du produit final soumis ; le
        reliquat non imputé sur un mois est reporté sur les mois suivants. Le
        mécanisme est voisin de la déduction de taxe sur la valeur ajoutée,
        mais plus étroit, puisqu'il suppose l'incorporation intégrale de la
        matière au produit final. C'est par lui que le droit de consommation
        se distingue d'une accise ordinaire.
      synonymes: []
    ar:
      terme: خصم المعلوم على الاستهلاك
      definition: >
        رخصة تُخوَّل للخاضعين في خصم المعلوم على الاستهلاك الذي أثقل فعلا
        شراءاتهم لدى خاضعين آخرين ووارداتهم من المواد والمنتوجات التي تدخل
        كليا في تركيب المنتوج النهائي الخاضع للمعلوم، على أن يؤجَّل طرح
        المبلغ المتبقّي إلى الأشهر الموالية. وهي آلية قريبة من الطرح في مادة
        الأداء على القيمة المضافة غير أنّها أضيق منه، إذ تشترط دخول المادة
        كليا في المنتوج النهائي. وبها يفترق المعلوم على الاستهلاك عن المعاليم
        النوعية العادية.
      synonymes: [طرح المعلوم على الاستهلاك]

  - id: facturation-identique
    acronyme: null
    statut: provisoire
    references: [loi-89-115-lf-1990, loi-88-62-droit-consommation]
    source_definition: {ref: loi-89-115-lf-1990, locator: "art. 34"}
    voir_aussi: [imputation-droit-consommation, droit-de-consommation]
    fr:
      terme: Facturation à l'identique
      definition: >
        Obligation faite aux commerçants assujettis à la taxe sur la valeur
        ajoutée qui commercialisent des produits soumis au droit de
        consommation de facturer à leurs clients le droit supporté lors de
        l'acquisition des mêmes produits, ce droit étant alors déductible.
        Ajoutée à l'article 5 de la loi n° 88-62 par l'article 34 de la loi de
        finances pour 1990, elle prolonge en aval le mécanisme d'imputation.
        L'article 4 de la loi de 1988 posait déjà une règle voisine pour les
        boissons alcoolisées, retransmises aux clients pour les mêmes montants
        supportés.
      synonymes: []
    ar:
      terme: الفوترة بنفس المبلغ
      definition: >
        واجب محمول على التجار الخاضعين للأداء على القيمة المضافة الذين
        يروّجون منتوجات خاضعة للمعلوم على الاستهلاك، وهو أن يفوتروا لحرفائهم
        بنفس المبلغ المعلوم الذي تحمّلوه عند اقتناء نفس المنتوجات، ويكون هذا
        المعلوم عندئذ قابلا للطرح. أُضيف هذا الواجب إلى الفصل 5 من القانون
        عدد 62 لسنة 1988 بالفصل 34 من قانون المالية لسنة 1990، فمدّ آلية
        الخصم إلى ما بعد مرحلة الصنع. وكان الفصل 4 من قانون 1988 قد وضع قاعدة
        قريبة منها في خصوص المشروبات الكحولية التي تُحال إلى الحرفاء بنفس
        المبالغ التي وُظّفت عليها.
      synonymes: []

  - id: entrepositaire
    acronyme: null
    statut: valide
    references: [loi-88-62-droit-consommation, loi-2007-70-lf-2008]
    source_definition: {ref: loi-88-62-droit-consommation, locator: "art. 2-4"}
    source_traduction: {ref: loi-88-62-droit-consommation, locator: "art. 2-4"}
    voir_aussi: [droit-de-consommation, fait-generateur-droit-consommation, suspension-droit-consommation]
    fr:
      terme: Entrepositaire
      definition: >
        Personne qui détient en entrepôt des boissons alcoolisées, des vins ou
        des bières. L'article 2 de la loi n° 88-62 range les entrepositaires
        et les commerçants de gros de ces produits parmi les assujettis au
        droit de consommation, aux côtés des fabricants de bière, des
        embouteilleurs de vin et des fabricants de tout autre produit soumis ;
        une cinquième catégorie a été ajoutée en 2008, la Société tunisienne
        de l'électricité et du gaz, au titre du gaz naturel carburant.
        L'importateur ne figure pas dans cette énumération, alors même que le
        dédouanement est un fait générateur : à l'importation, le dispositif
        tient par la liquidation en douane plutôt que par la qualité
        d'assujetti, et aucun des textes lus ne commente cette articulation.
        L'article 4 neutralise par ailleurs l'effet du droit sur les marges
        des entrepositaires, qui le retransmettent à leurs clients pour les
        mêmes montants.
      synonymes: []
    ar:
      terme: أرباب المخازن
      definition: >
        من يمسكون في مخازنهم المشروبات الكحولية والخمور والجعة. وقد أدرج
        الفصل 2 من القانون عدد 62 لسنة 1988 أرباب المخازن وتجار الجملة لهذه
        المنتوجات ضمن الخاضعين للمعلوم على الاستهلاك، إلى جانب صانعي الجعة
        ومعبّئي الخمور وصانعي كلّ المواد الأخرى الخاضعة للمعلوم؛ ثم أُضيف صنف
        خامس سنة 2008 هو الشركة التونسية للكهرباء والغاز بعنوان الغاز الطبيعي
        المستعمل وقودا للعربات. ولا يرد المورّد في هذا التعداد مع أنّ استخراج
        المنتوج من الديوانة يكوّن الحدث المتولد عنه المعلوم: فالأمر يقوم عند
        التوريد على الاستخلاص لدى الديوانة لا على صفة الخاضع، ولم يعلّق أيّ
        من النصوص المطَّلع عليها على هذه المسألة. كما نصّ الفصل 4 على أنّ
        المعلوم لا تأثير له على حساب ربح أرباب المخازن، إذ يُحال إلى حرفائهم
        بنفس المبلغ الذي وُظّف عليه.
      synonymes: []

  - id: suspension-droit-consommation
    acronyme: null
    statut: valide
    references: [loi-88-62-droit-consommation, lf-2018]
    source_definition: {ref: loi-88-62-droit-consommation, locator: "art. 6 bis"}
    source_traduction: {ref: lf-2018, locator: "art. 22"}
    voir_aussi: [droit-de-consommation, entrepositaire]
    fr:
      terme: Suspension du droit de consommation
      definition: >
        Régime par lequel le droit de consommation n'est pas exigé lors d'une
        opération qui, sans lui, y serait soumise. L'article 6 bis de la loi
        n° 88-62, ajouté par l'article 22 de la loi de finances pour 2018, en
        institue un cas : les véhicules tout terrain importés par les
        concessionnaires au profit des agences de voyages.
      synonymes: []
    ar:
      terme: توقيف العمل بالمعلوم على الاستهلاك
      definition: >
        نظام لا يُطلب بمقتضاه المعلوم على الاستهلاك عند عملية كانت لولاه
        خاضعة له. وقد أحدث الفصل 6 مكرر من القانون عدد 62 لسنة 1988، المضاف
        بالفصل 22 من قانون المالية لسنة 2018، حالة من حالاته: العربات الصالحة
        لكل المسالك الموردة من قبل الوكلاء المعتمدين لفائدة وكالات الأسفار.
      synonymes: []

  - id: valeur-en-douane
    acronyme: null
    statut: provisoire
    references: [loi-88-62-droit-consommation]
    source_definition: {ref: loi-88-62-droit-consommation, locator: "art. 4-a"}
    voir_aussi: [assiette-droit-consommation, taux-ad-valorem]
    fr:
      terme: Valeur en douane
      definition: >
        Valeur retenue au dédouanement, qui sert d'assiette au droit de
        consommation à l'importation pour les produits soumis à un taux ad
        valorem. L'article 4 de la loi n° 88-62 la désigne comme la valeur
        déclarée en douane ; en régime intérieur lui répond le prix de vente
        tous frais, droits et taxes compris.
      synonymes: []
    ar:
      terme: القيمة المصرح بها لدى الديوانة
      definition: >
        القيمة المعتمدة عند الإخراج من الديوانة، وهي قاعدة المعلوم على
        الاستهلاك عند التوريد بالنسبة إلى المنتوجات الخاضعة لنسبة من القيمة.
        وهذه هي العبارة التي استعملها الفصل 4 من القانون عدد 62 لسنة 1988،
        ويقابلها في النظام الداخلي ثمن البيع باعتبار كل المصاريف والمعاليم
        والأداءات.
      synonymes: []

  - id: taxe-unique-compensation-carburants
    acronyme: null
    statut: provisoire
    references: [loi-88-62-droit-consommation]
    source_definition: {ref: loi-88-62-droit-consommation, locator: "tableau annexé, renvoi (2)"}
    voir_aussi: [droit-de-consommation, taxe-bieres-vins-boissons-alcoolisees]
    fr:
      terme: Taxe unique de compensation sur les carburants
      definition: >
        Prélèvement antérieur sur les carburants, auquel le tableau annexé à
        la loi n° 88-62 du 2 juin 1988 renvoie en note (2) lors de
        l'institution du droit de consommation : les personnes qui ne
        supportaient jusque-là que cette taxe restent soumises à elle. Les
        premiers exercices de la série des recettes de « droits de
        consommation » la portent encore, avec la taxe sur les bières, vins et
        autres boissons alcoolisées. Dispositif historique.
      synonymes: []
    ar:
      terme: الأداء الوحيد للتعويض على المحروقات
      definition: >
        معلوم سابق على المحروقات، أحال إليه الجدول المدرج بملحق القانون عدد 62
        لسنة 1988 المؤرخ في 2 جوان 1988 في إحالته عدد (2) عند إحداث المعلوم
        على الاستهلاك: فالأشخاص الذين لم يكونوا يتحمّلون قبل ذلك سوى هذا
        المعلوم يبقون خاضعين له. نظام تاريخي. (التسمية العربية هنا وصفية غير
        مثبتة في نصّ مقروء، وهي في انتظار قراءة الصفحة 856 من العدد العربي
        للرائد الرسمي.)
      synonymes: []

  - id: taxe-bieres-vins-boissons-alcoolisees
    acronyme: null
    statut: valide
    references: [loi-88-62-droit-consommation]
    source_definition: {ref: loi-88-62-droit-consommation, locator: "art. 7"}
    source_traduction: {ref: loi-88-62-droit-consommation, locator: "art. 7"}
    voir_aussi: [droit-de-consommation, taxe-unique-compensation-carburants]
    fr:
      terme: Taxe sur les bières, vins et autres boissons alcoolisées
      definition: >
        Taxe instituée par les articles 4 à 11 de la loi n° 84-2 du 21 mars
        1984, portant loi de finances complémentaire pour la gestion 1984, en
        remplacement de la taxe parafiscale unique sur les vins, bières et
        boissons alcoolisées. Ces articles ont été abrogés par l'article 7 de
        la loi n° 88-62 du 2 juin 1988, qui lui substitue le droit de
        consommation. Dispositif historique.
      synonymes: []
    ar:
      terme: الأداء على الجعة والخمور والمشروبات الكحولية الأخرى
      definition: >
        أداء أحدثته الفصول من 4 إلى 11 من القانون عدد 2 لسنة 1984 المؤرخ في 21
        مارس 1984 والمتعلق بقانون المالية التكميلي لتصرّف سنة 1984، عوضا عن
        الأداء شبه الجبائي الوحيد على الخمور والجعة والمشروبات الكحولية. وقد
        ألغى هذه الفصولَ الفصلُ 7 من القانون عدد 62 لسنة 1988 المؤرخ في 2
        جوان 1988، فحلّ محلّها المعلوم على الاستهلاك. نظام تاريخي.
      synonymes: []

  - id: impot-societes
    acronyme: IS
    statut: valide
    references: [loi-irpp-is-1989, code-irpp-is-1990]
    source_definition: {ref: loi-irpp-is-1989, locator: "art. 1er et 45"}
    source_traduction: {ref: loi-irpp-is-1989, locator: "art. 1er et 45"}
    voir_aussi: [irpp, benefice-imposable, minimum-impot-chiffre-affaires]
    fr:
      terme: Impôt sur les sociétés
      definition: >
        Impôt direct frappant les bénéfices des personnes morales, régi par le
        code de l'impôt sur le revenu des personnes physiques et de l'impôt sur
        les sociétés, promulgué par la loi n° 89-114 du 30 décembre 1989 et
        applicable aux bénéfices réalisés à compter du 1er janvier 1990. Il
        partage ce code avec l'impôt sur le revenu, dont il reprend par renvoi
        une partie des règles d'assiette. Il a remplacé l'impôt sur les
        bénéfices des sociétés de l'article 9 de la loi n° 85-109 du
        31 décembre 1985.
      synonymes: []
    ar:
      terme: الضريبة على الشركات
      definition: >
        ضريبة مباشرة توظَّف على أرباح الأشخاص المعنويين، تنظّمها مجلة الضريبة
        على دخل الأشخاص الطبيعيين والضريبة على الشركات الصادرة بالقانون عدد
        114 لسنة 1989 المؤرخ في 30 ديسمبر 1989، وتنطبق على الأرباح المحقّقة
        ابتداء من غرّة جانفي 1990. وهي تتقاسم هذه المجلة مع الضريبة على دخل
        الأشخاص الطبيعيين وتحيل عليها في جانب من قواعد الأساس. وقد حلّت محلّ
        الضريبة على أرباح الشركات المنصوص عليها بالفصل 9 من القانون عدد 109
        لسنة 1985 المؤرخ في 31 ديسمبر 1985.
      synonymes: []

  - id: impot-fortune
    acronyme: null
    statut: valide
    references: [lf-2026, dgi-nc-13-2026, lf-2023]
    source_definition: {ref: lf-2026, locator: "art. 88"}
    source_traduction: {ref: dgi-nc-13-2026}
    voir_aussi: [impot-fortune-immobiliere, impots-directs, habitation-principale]
    fr:
      terme: Impôt sur la fortune
      definition: >
        Impôt dû au 1er janvier de chaque année par les personnes physiques sur
        la valeur, nette des dettes que le texte admet en déduction, de leurs
        immeubles, fonds de commerce et meubles, y compris ceux de leurs enfants
        mineurs à charge, lorsqu'elle atteint 3 millions de dinars. Institué par
        l'article 88 de la loi de finances pour 2026 à compter du 1er janvier
        2026, il abroge et remplace l'impôt sur la fortune immobilière de 2023.
        Il n'est codifié dans aucun code ; sa procédure relève du code des
        droits et procédures fiscaux.
      synonymes: []
    ar:
      terme: الضريبة على الثروة
      definition: >
        ضريبة تُستوجب في 1 جانفي من كل سنة على الأشخاص الطبيعيين بعنوان قيمة
        ما يملكونه من عقارات وأصول تجارية ومنقولات، بما في ذلك مكاسب أبنائهم
        القصّر الذين في كفالتهم، بعد طرح الديون التي يجيز النص طرحها، إذا بلغت
        هذه القيمة 3 مليون دينار. أُحدثت بالفصل 88 من قانون المالية لسنة 2026
        ابتداء من غرّة جانفي 2026، وألغت الضريبة على الثروة العقارية لسنة 2023
        وعوّضتها. لا تندرج في أيّ مجلة، وتخضع في إجراءاتها لمجلة الحقوق
        والإجراءات الجبائية.
      synonymes: []

  - id: impot-fortune-immobiliere
    acronyme: null
    statut: valide
    references: [lf-2023, dgi-nc-15-2023]
    source_definition: {ref: lf-2023, locator: "art. 23"}
    source_traduction: {ref: lf-2023, locator: "art. 23"}
    voir_aussi: [impot-fortune, habitation-principale]
    fr:
      terme: Impôt sur la fortune immobilière
      definition: >
        Impôt exigible au 1er janvier de chaque année, de 2023 à 2025, sur les
        immeubles des personnes physiques, y compris ceux de leurs enfants
        mineurs sous leur tutelle, dont la valeur, nette des dettes que le texte
        admet en déduction, atteignait 3 millions de dinars ; son taux était de
        0,5 %. Institué par l'article 23 du décret-loi n° 2022-79 portant loi de
        finances pour 2023, il a été abrogé et remplacé, à compter du 1er
        janvier 2026, par l'impôt sur la fortune.
      synonymes: []
    ar:
      terme: الضريبة على الثروة العقارية
      definition: >
        ضريبة توظَّف في غرّة جانفي من كل سنة، من 2023 إلى 2025، على عقارات
        الأشخاص الطبيعيين، بما في ذلك عقارات أبنائهم القصّر الذين في كفالتهم،
        التي تساوي قيمتها بعد طرح الديون التي يجيز النص طرحها أو تفوق 3 مليون
        دينار، بنسبة 0,5 %. أُحدثت بالفصل 23 من المرسوم عدد 79 لسنة 2022
        المتعلق بقانون المالية لسنة 2023، وأُلغيت وعُوّضت بالضريبة على الثروة
        ابتداء من غرّة جانفي 2026.
      synonymes: []

  - id: impot-foncier-2014
    acronyme: null
    statut: valide
    references: [lf-2014, lfc-2014]
    source_definition: {ref: lf-2014, locator: "art. 55"}
    source_traduction: {ref: lf-2014, locator: "art. 55"}
    voir_aussi: [impot-fortune-immobiliere]
    fr:
      terme: Impôt foncier (2014)
      definition: >
        Impôt sur les immeubles détenus par les personnes physiques, droits
        qui s'y rattachent compris, égal à une fois et demie la taxe sur les
        immeubles bâtis ou la taxe sur les immeubles non bâtis, institué par
        l'article 55 de la loi de finances pour 2014. L'article 38 de la loi de
        finances complémentaire pour 2014 en a supprimé les dispositions à
        compter du 1er janvier 2014.
      synonymes: []
    ar:
      terme: الضريبة العقارية (2014)
      definition: >
        ضريبة على العقارات التي يمتلكها الأشخاص الطبيعيون، بما في ذلك الحقوق
        المتعلقة بها، تساوي مرّة ونصف المعلوم على العقارات المبنية أو المعلوم
        على الأراضي غير المبنية، أُحدثت بالفصل 55 من قانون المالية لسنة 2014،
        وألغى الفصل 38 من قانون المالية التكميلي لسنة 2014 أحكامها ابتداء من
        غرّة جانفي 2014.
      synonymes: []

  - id: habitation-principale
    acronyme: null
    statut: valide
    references: [lf-2023, lf-2026, dgi-nc-13-2026]
    source_definition: {ref: lf-2023, locator: "art. 23 § 3"}
    source_traduction: {ref: lf-2023, locator: "art. 23 § 3"}
    voir_aussi: [impot-fortune, impot-fortune-immobiliere]
    fr:
      terme: Habitation principale
      definition: >
        Logement où le redevable a son habitation principale, exclu de l'impôt
        sur la fortune immobilière puis de l'impôt sur la fortune, avec, depuis
        2026, le mobilier qui y est utilisé. La loi ne la définit pas ;
        l'administration l'entend quelle qu'en soit la valeur ou la surface,
        dépendances comprises, la preuve se faisant par une attestation des
        services compétents.
      synonymes: []
    ar:
      terme: المسكن الرئيسي
      definition: >
        المسكن الذي يتخذه المطالب بالضريبة مسكنا رئيسيا، ويخرج من الضريبة على
        الثروة العقارية ثم من الضريبة على الثروة، مع الأثاث المستغل به منذ
        2026. لا يعرّفه القانون، وتعتبره الإدارة مهما كانت قيمته أو مساحته بما
        في ذلك توابعه، ويثبت بشهادة من المصالح المختصة.
      synonymes: []

  - id: fonds-de-commerce
    acronyme: null
    statut: provisoire
    references: [lf-2026]
    source_definition: {ref: lf-2026, locator: "art. 88 § 3"}
    voir_aussi: [impot-fortune]
    fr:
      terme: Fonds de commerce
      definition: >
        Élément du patrimoine que l'article 88 de la loi de finances pour 2026
        range parmi les biens soumis à l'impôt sur la fortune, à côté des
        immeubles et des meubles, et dont il exclut ceux qui sont
        effectivement exploités.
        Le terme français est une traduction ; il reste à confirmer dans un
        texte bilingue du Journal officiel.
      synonymes: []
    ar:
      terme: الأصول التجارية
      definition: >
        عنصر من المكاسب يدرجه الفصل 88 من قانون المالية لسنة 2026 ضمن
        المكاسب الخاضعة للضريبة على الثروة، إلى جانب العقارات والمنقولات،
        ويستثني منه الأصول التجارية المستغلة فعليا.
      synonymes: []

  - id: benefice-imposable
    acronyme: null
    statut: valide
    references: [code-irpp-is-1990]
    source_definition: {ref: code-irpp-is-1990, locator: "art. 49 § I"}
    source_traduction: {ref: code-irpp-is-1990, locator: "art. 49 § I"}
    voir_aussi: [impot-societes, minimum-impot-chiffre-affaires]
    fr:
      terme: Bénéfice imposable
      definition: >
        Assiette de l'impôt sur les sociétés. Le taux lui est appliqué après
        arrondi au dinar inférieur, selon les termes mêmes du paragraphe I de
        l'article 49 du code. À ne pas confondre avec le résultat comptable,
        dont il se déduit par une série de réintégrations et de déductions.
      synonymes: []
    ar:
      terme: الربح الخاضع للضريبة
      definition: >
        أساس الضريبة على الشركات. تُطبَّق عليه النسبة بعد تدويره إلى الدينار
        الأدنى، حسب عبارة الفقرة I من الفصل 49 من المجلة. ولا يُخلط بالنتيجة
        المحاسبية التي يُستخرج منها بجملة من الإدماجات والطروحات.
      synonymes: []

  - id: minimum-impot-chiffre-affaires
    acronyme: null
    statut: valide
    references: [code-irpp-is-1990, lf-2006, lf-2011, lf-2014]
    source_definition: {ref: code-irpp-is-1990, locator: "art. 49 § II"}
    source_traduction: {ref: code-irpp-is-1990, locator: "art. 49 § II"}
    voir_aussi: [impot-societes, benefice-imposable]
    fr:
      terme: Minimum d'impôt sur le chiffre d'affaires
      definition: >
        Plancher de l'impôt annuel, prévu au paragraphe II de l'article 49 du
        code : une fraction du chiffre d'affaires brut, assortie d'un montant
        minimal exigible même en l'absence de chiffre d'affaires. Il ne se
        confond ni avec le minimum d'impôt de l'article 12 bis de la loi
        n° 89-114, qui plafonne les avantages fiscaux et s'assied sur l'impôt
        théorique, ni avec celui de l'article 44 § II, qui en est l'équivalent
        du côté de l'impôt sur le revenu.
      synonymes: [Minimum d'impôt]
    ar:
      terme: الضريبة الدنيا
      definition: >
        الحدّ الأدنى للضريبة السنوية، المنصوص عليه بالفقرة II من الفصل 49 من
        المجلة: نسبة من رقم المعاملات الخام، مع مبلغ أدنى مستوجب حتى في صورة
        عدم تحقيق رقم معاملات. ولا يُخلط بالضريبة الدنيا المنصوص عليها بالفصل
        12 مكرر من القانون عدد 114 لسنة 1989، التي تسقّف الامتيازات الجبائية
        وتُحتسب على الضريبة النظرية، ولا بتلك المنصوص عليها بالفقرة II من
        الفصل 44، وهي مقابلها في الضريبة على دخل الأشخاص الطبيعيين.
      synonymes: [الحد الأدنى للضريبة]

  - id: taux-global
    acronyme: null
    statut: provisoire
    references: [loi97-4]
    source_definition: {ref: loi60-30, locator: "art. 10 et 41"}
    voir_aussi: [cotisations-sociales, cnss, compte-de-compensation]
    fr:
      terme: Taux global de cotisation
      definition: >
        Taux unique fixé par l'article 41 de la loi n° 60-30 pour l'ensemble
        des régimes que cette loi institue, à la charge de l'employeur et du
        travailleur, et non par risque. Sa ventilation par régime est proposée
        par le conseil d'administration de la Caisse nationale de sécurité
        sociale et approuvée par l'autorité de tutelle (art. 10 et 27). Certaines branches
        y sont financées par prélèvement, sans relèvement du prélèvement total :
        l'assurance maladie, la protection sociale des travailleurs et un point
        transféré aux accidents du travail en 1995.
      synonymes: [Taux global]
    ar:
      terme: النسبة الجملية للمساهمات
      definition: >
        نسبة موحّدة يضبطها الفصل 41 من القانون عدد 30 لسنة 1960 لمجموع
        الأنظمة التي يحدثها هذا القانون، محمولة على المؤجر والعامل، لا على
        كل خطر على حدة. ويقترح مجلس إدارة الصندوق الوطني للضمان الاجتماعي
        توزيعها حسب الأنظمة وتصادق عليه سلطة الإشراف (الفصلان 10 و27). وتُموَّل بعض الفروع باقتطاع منها، دون
        الترفيع في الاقتطاع الجملي: التأمين على المرض، والحماية الاجتماعية
        للعمّال، ونقطة حُوّلت إلى حوادث الشغل سنة 1995.
      synonymes: []

  - id: compte-de-compensation
    acronyme: null
    statut: provisoire
    references: [decret2000-1902]
    source_definition: {ref: loi60-30, locator: "art. 22"}
    voir_aussi: [fonds-de-reserve, taux-global, cnss]
    fr:
      terme: Compte de compensation
      definition: >
        Compte que la Caisse nationale de sécurité sociale établit pour chacun
        des régimes qu'elle gère : il porte en recettes la quote-part des
        cotisations réservée au régime et la quote-part des autres recettes qui
        lui revient, en dépenses les charges du régime, dont une quote-part des
        frais de fonctionnement (loi n° 60-30, art. 22). Le décret n° 2000-1902
        le maintient parmi les comptes arrêtés chaque année (art. 9).
      synonymes: []
    ar:
      terme: حساب المقاصّة
      definition: >
        حساب يمسكه الصندوق الوطني للضمان الاجتماعي لكل نظام يتصرّف فيه: يتضمّن
        في المداخيل منابَ المساهمات المخصّص للنظام ومنابَ الموارد الأخرى الراجع
        إليه، وفي المصاريف أعباءَ النظام، ومنها مناب من مصاريف التسيير (القانون
        عدد 30 لسنة 1960، الفصل 22). ويُبقي عليه الأمر عدد 1902 لسنة 2000 ضمن
        الحسابات التي تُختم كل سنة (الفصل 9).
      synonymes: []

  - id: fonds-de-reserve
    acronyme: null
    statut: provisoire
    references: [decret76-3, decret2005-321]
    source_definition: {ref: loi60-30, locator: "art. 23"}
    voir_aussi: [compte-de-compensation, reserve-technique, gestion-financiere-distincte]
    fr:
      terme: Fonds de réserve
      definition: >
        Réserve propre à chaque régime d'une caisse de sécurité sociale, qui
        reçoit ses excédents et supporte ses déficits ; lorsqu'elle tombe sous
        le minimum fixé, le conseil d'administration est tenu de proposer une
        majoration du taux de cotisation ou toute autre mesure de nature à
        rétablir l'équilibre (loi n° 60-30, art. 23, pour la CNSS). La règle
        est reprise pour la CNRPS (décret n° 76-3, art. 13) et pour la CNAM
        (décret n° 2005-321, art. 11).
      synonymes: [Fonds de réserve par régime]
    ar:
      terme: صندوق الاحتياط
      definition: >
        احتياطي خاص بكل نظام من أنظمة صندوق للضمان الاجتماعي، تُرصد فيه فوائضه
        وتُحمَّل عليه عجوزاته؛ وإذا نزل دون الحدّ الأدنى المضبوط، يتعيّن على مجلس
        الإدارة أن يقترح الترفيع في نسبة المساهمة أو أي إجراء آخر من شأنه إعادة
        التوازن (القانون عدد 30 لسنة 1960، الفصل 23، بالنسبة إلى الصندوق الوطني
        للضمان الاجتماعي). وتُعتمد القاعدة نفسها للصندوق الوطني للتقاعد والحيطة
        الاجتماعية (الأمر عدد 3 لسنة 1976، الفصل 13) وللصندوق الوطني للتأمين على
        المرض (الأمر عدد 321 لسنة 2005، الفصل 11).
      synonymes: []

  - id: reserve-technique
    acronyme: null
    statut: provisoire
    references: [loi81-6]
    source_definition: {ref: decret74-499, locator: "art. 10-12"}
    voir_aussi: [fonds-de-reserve, gestion-financiere-distincte]
    fr:
      terme: Réserve technique
      definition: >
        Réserve d'un régime de pensions de la Caisse nationale de sécurité
        sociale, constituée par l'excédent de ses recettes sur ses dépenses,
        placée à moyen ou long terme et comptabilisée à part. Le régime des
        salariés non agricoles la reçoit en 1974, et le régime agricole en
        1981, avec une dotation initiale prélevée sur les excédents des autres
        régimes de la caisse (décret n° 74-499, art. 10-12 ; loi n° 81-6,
        art. 7).
      synonymes: [Réserve technique initiale]
    ar:
      terme: الاحتياطي الفنّي
      definition: >
        احتياطي نظام للجرايات بالصندوق الوطني للضمان الاجتماعي، يتكوّن من فائض
        مداخيله على مصاريفه، ويُوظَّف على المدى المتوسط أو الطويل ويُمسك له حساب
        منفصل. وقد تلقّاه نظام الأجراء غير الفلاحيين سنة 1974 والنظام الفلاحي
        سنة 1981، مع اعتماد أوّلي يُقتطع من فوائض الأنظمة الأخرى للصندوق (الأمر
        عدد 499 لسنة 1974، الفصول 10 إلى 12؛ القانون عدد 6 لسنة 1981، الفصل 7).
      synonymes: []

  - id: gestion-financiere-distincte
    acronyme: null
    statut: provisoire
    references: [loi81-6, loi89-73]
    source_definition: {ref: decret74-499, locator: "art. 7"}
    voir_aussi: [reserve-technique, compte-de-compensation, fonds-de-reserve]
    fr:
      terme: Gestion financière distincte
      definition: >
        Règle selon laquelle un régime géré par la Caisse nationale de sécurité
        sociale tient ses recettes, ses dépenses et ses réserves à part, « dans
        le cadre de l'organisation financière générale » de la caisse. Elle est
        posée pour les pensions du secteur non agricole (décret n° 74-499,
        art. 7), puis pour les régimes agricoles (loi n° 81-6, art. 6) et le
        régime agricole amélioré (loi n° 89-73).
      synonymes: []
    ar:
      terme: التصرّف المالي المستقلّ
      definition: >
        قاعدة يمسك بموجبها نظامٌ يتصرّف فيه الصندوق الوطني للضمان الاجتماعي
        مداخيلَه ومصاريفه واحتياطاته على حدة، «في إطار التنظيم المالي العام»
        للصندوق. وقد وُضعت لجرايات القطاع غير الفلاحي (الأمر عدد 499 لسنة 1974،
        الفصل 7)، ثم للأنظمة الفلاحية (القانون عدد 6 لسنة 1981، الفصل 6) وللنظام
        الفلاحي المحسّن (القانون عدد 73 لسنة 1989).
      synonymes: []

  - id: controleur-d-etat
    acronyme: null
    statut: provisoire
    references: [decret2005-321]
    source_definition: {ref: decret2000-1902, locator: "art. 18"}
    voir_aussi: [contrat-programme, epna]
    fr:
      terme: Contrôleur d'État
      definition: >
        Agent placé auprès d'une caisse de sécurité sociale pour le compte de
        l'État (décret n° 2000-1902, art. 18, pour la CNSS ; décret
        n° 2005-321, pour la CNAM). La loi n° 60-30 prévoyait, auprès de la CNSS, un
        contrôleur technique et un contrôleur financier (art. 29-33), et le
        décret n° 76-3 un contrôleur financier auprès de la CNRPS.
      synonymes: []
    ar:
      terme: مراقب الدولة
      definition: >
        عون يوضع لدى صندوق للضمان الاجتماعي لحساب الدولة (الأمر عدد 1902 لسنة
        2000، الفصل 18، بالنسبة إلى الصندوق الوطني للضمان الاجتماعي؛ الأمر عدد
        321 لسنة 2005، بالنسبة إلى الصندوق الوطني للتأمين على المرض). وكان القانون عدد 30 لسنة 1960 ينصّ لدى الصندوق
        الوطني للضمان الاجتماعي على مراقب فنّي ومراقب مالي (الفصول 29 إلى 33)،
        والأمر عدد 3 لسنة 1976 على مراقب مالي لدى الصندوق الوطني للتقاعد والحيطة
        الاجتماعية.
      synonymes: []

  - id: contrat-programme
    acronyme: null
    statut: provisoire
    references: [decret2005-321]
    source_definition: {ref: decret2000-1902, locator: "art. 3 et 12"}
    voir_aussi: [controleur-d-etat, epna, entreprises-publiques]
    fr:
      terme: Contrat-programme
      definition: >
        Engagement pluriannuel arrêté par le conseil d'administration d'une
        caisse de sécurité sociale et approuvé par le ministère de tutelle
        (décret n° 2000-1902, art. 3 et 12, pour la CNSS ; décret n° 2005-321,
        pour la CNAM), instrument de la tutelle des entreprises publiques.
      synonymes: []
    ar:
      terme: عقد البرنامج
      definition: >
        التزام متعدّد السنوات يضبطه مجلس إدارة صندوق للضمان الاجتماعي وتصادق
        عليه وزارة الإشراف (الأمر عدد 1902 لسنة 2000، الفصلان 3 و12، بالنسبة إلى
        الصندوق الوطني للضمان الاجتماعي؛ الأمر عدد 321 لسنة 2005، بالنسبة إلى
        الصندوق الوطني للتأمين على المرض)، وهو أداة من أدوات الإشراف على المنشآت
        العمومية.
      synonymes: []

  - id: compte-diversification-securite-sociale
    acronyme: null
    statut: valide
    references: [lf-2018]
    source_definition: {ref: dl2021-21-lf2022, locator: "art. 12"}
    source_traduction: {ref: dl2021-21-lf2022, locator: "art. 12"}
    voir_aussi: [css, cnss, cnrps, cnam]
    fr:
      terme: Compte de diversification des sources de sécurité sociale
      definition: >
        Compte spécial du Trésor ouvert par l'article 12 du décret-loi
        n° 2021-21 (loi de finances pour 2022) pour financer les caisses de
        sécurité sociale. Il est alimenté par le produit de la contribution
        sociale de solidarité, d'autres recettes pouvant lui être affectées ;
        le ministre chargé de la sécurité sociale en est l'ordonnateur, et ses
        recettes sont réparties entre les caisses selon des critères fixés par
        son arrêté.
      synonymes: []
    ar:
      terme: حساب تنويع مصادر الضمان الاجتماعي
      definition: >
        حساب خاص في الخزينة فتحه الفصل 12 من المرسوم عدد 21 لسنة 2021 (قانون
        المالية لسنة 2022) لتمويل صناديق الضمان الاجتماعي. تتأتّى موارده من
        عائدات المساهمة الاجتماعية التضامنية، ويمكن أن تُخصَّص له موارد أخرى؛
        ويتولّى الوزير المكلّف بالضمان الاجتماعي الأمر بصرف نفقاته، وتُوزَّع
        موارده على الصناديق حسب معايير تُضبط بقرار منه.
      synonymes: []

  - id: tfp
    acronyme: TFP
    statut: valide
    references: [decret-1956-01-12-formation-professionnelle, decret66-527]
    source_definition: {ref: loi-88-145-lf-1989, locator: "art. 29-30"}
    source_traduction: {ref: loi-88-145-lf-1989, locator: "art. 29-30"}
    voir_aussi: [foprolos, avance-tfp]
    fr:
      terme: Taxe de formation professionnelle
      definition: >
        Prélèvement à la charge de l'employeur, institué en 1956, assis
        depuis 1989 sur les salaires et rétributions versés, au taux de 1 %
        dans les industries manufacturières et de 2 % dans les autres
        secteurs. Son produit alimente depuis 2000 un fonds spécial du Trésor
        consacré à la formation professionnelle.
      synonymes: []
    ar:
      terme: الأداء على التكوين المهني
      definition: >
        أداء محمول على المؤجّر، أُحدث سنة 1956، ويُوظَّف منذ سنة 1989 على
        الأجور والمرتّبات المدفوعة بنسبة 1 % في الصناعات المعملية و2 % في
        القطاعات الأخرى. يموّل محصوله منذ سنة 2000 صندوقًا خاصًّا في الخزينة
        مخصَّصًا للتكوين المهني.
      synonymes: []

  - id: foprolos
    acronyme: FOPROLOS
    statut: valide
    references: [loi77-54]
    source_definition: {ref: loi77-54, locator: "art. 1-2"}
    source_traduction: {ref: loi-88-145-lf-1989, locator: "art. 35"}
    voir_aussi: [tfp]
    fr:
      terme: Contribution au fonds de promotion du logement pour les salariés
      definition: >
        Prélèvement dû par tout employeur, public ou privé, à l'exception des
        exploitants agricoles privés, institué en 1977 au taux de 2 % des
        salaires soumis à cotisation sociale, ramené en 1989 à 1 % des
        salaires et rétributions. Il alimente un fonds qui finance l'accès
        des salariés au logement.
      synonymes: [Contribution au FOPROLOS]
    ar:
      terme: المساهمة الراجعة لصندوق النهوض بالمسكن لفائدة الأجراء
      definition: >
        اقتطاع محمول على كلّ مؤجّر عمومي أو خاصّ، باستثناء المستغلّين
        الفلاحيين الخواصّ، أُحدث سنة 1977 بنسبة 2 % من الأجور الخاضعة
        للمساهمات الاجتماعية، ثمّ خُفّض سنة 1989 إلى 1 % من الأجور
        والمرتّبات. يموّل صندوقًا يساعد الأجراء على الحصول على مسكن.
      synonymes: []

  - id: avance-tfp
    acronyme: null
    statut: provisoire
    references: [decret2009-292]
    source_definition: {ref: loi2007-69, locator: "art. 27"}
    voir_aussi: [tfp]
    fr:
      terme: Avance sur la taxe de formation professionnelle
      definition: >
        Crédit d'impôt ouvert depuis 2009 aux entreprises qui forment leur
        personnel, imputable sur la taxe de formation professionnelle dans la
        limite de 60 % de la taxe due au titre de l'année précédente, lorsque
        celle-ci atteint au moins 1 000 dinars.
      synonymes: []
    ar:
      terme: التسبقة على الأداء على التكوين المهني
      definition: >
        قرض جبائي مفتوح منذ سنة 2009 للمؤسسات التي تكوّن أعوانها، يُطرح من
        الأداء على التكوين المهني في حدود 60 % من الأداء المستوجب بعنوان السنة
        السابقة، إذا بلغ هذا الأداء 1000 دينار على الأقلّ.
      synonymes: []

  # ── Volume « Les finances locales », chapitre « Les notions » (4 octobre 2026) ──
  # Définitions tirées de Dafflon et Gilbert (AFD, 2018). Termes arabes PROVISOIRES :
  # aucun texte bilingue ne met en regard ces notions doctrinales et leurs termes
  # arabes. Quand un terme figure dans la loi organique n° 2018-29 (code des
  # collectivités locales), édition arabe du JORT n° 39 du 15 mai 2018, l'article est
  # indiqué en commentaire : il atteste le terme arabe, non sa mise en regard avec la
  # notion française (édition française de ce JORT non identifiée).

  - id: decentralisation
    acronyme: null
    statut: provisoire  # AR : اللامركزية, CCL 2018 (AR), art. 1
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 17"}
    voir_aussi: [deconcentration, delegation-competences, devolution-competences]
    fr:
      terme: Décentralisation
      definition: >
        Transfert d'autorité et de responsabilités — compétences, tâches et
        fonctions — du gouvernement central vers des gouvernements et des
        autorités de niveau intermédiaire ou local, ou vers des organismes
        presque autonomes. Elle prend deux formes, la délégation et la
        dévolution ; la déconcentration, qui laisse les compétences au centre,
        n'en est pas une.
      synonymes: []
    ar:
      terme: اللامركزية
      definition: >
        نقل السلطة والمسؤوليات — من صلاحيات ومهامّ ووظائف — من الحكومة
        المركزية إلى حكومات وسلط من المستوى الوسيط أو المحلي، أو إلى هياكل شبه
        مستقلّة. وتتّخذ شكلين، التفويض والإسناد؛ أمّا عدم التركيز، الذي يُبقي
        الصلاحيات بيد المركز، فليس منها.
      synonymes: []

  - id: deconcentration
    acronyme: null
    statut: provisoire  # AR : اللامحورية (« الإدارات اللامحورية »), CCL 2018 (AR), chapitre des districts
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 17"}
    voir_aussi: [decentralisation]
    fr:
      terme: Déconcentration
      definition: >
        Organisation dans laquelle l'État central conserve ses responsabilités
        et ses compétences, mais les fait exécuter par des antennes régionales
        ou locales qui lui sont hiérarchiquement subordonnées, sans marge de
        manœuvre.
      synonymes: []
    ar:
      terme: اللامحورية
      definition: >
        تنظيم تحتفظ فيه الدولة المركزية بمسؤولياتها وصلاحياتها، وتعهد
        بتنفيذها إلى فروع جهوية أو محلية تخضع لها خضوعا تسلسليا، دون هامش
        تصرّف.
      synonymes: [عدم التركيز]

  - id: delegation-competences
    acronyme: null
    statut: provisoire  # AR non attesté dans un texte
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 17-18"}
    voir_aussi: [decentralisation, devolution-competences]
    fr:
      terme: Délégation de compétences
      definition: >
        Transfert de compétences aux collectivités assorti de normes ou de
        standards fixés par l'échelon central, que la collectivité doit
        respecter ; elle ne choisit que les modalités de mise en œuvre et
        supporte, en principe, le coût de ce qu'elle offre au-delà de la norme.
      synonymes: [Délégation]
    ar:
      terme: تفويض الصلاحيات
      definition: >
        نقل صلاحيات إلى الجماعات المحلية مع معايير أو مقاييس يضبطها المستوى
        المركزي وتلتزم الجماعة باحترامها؛ ولا تختار إلّا طرق التنفيذ، وتتحمّل
        مبدئيا كلفة ما تقدّمه زيادة على المعيار.
      synonymes: [التفويض]

  - id: devolution-competences
    acronyme: null
    statut: provisoire  # AR non attesté ; le CCL 2018 (AR), art. 14, dit « الصلاحيات الذاتية » (compétences propres)
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 17"}
    voir_aussi: [decentralisation, delegation-competences, ressources-propres]
    fr:
      terme: Dévolution de compétences
      definition: >
        Attribution aux collectivités de compétences propres, exercées avec les
        pleins pouvoirs et sans tutelle d'un échelon supérieur, ce qui suppose
        qu'elles disposent de ressources propres, notamment fiscales, à hauteur
        de ces compétences.
      synonymes: [Dévolution]
    ar:
      terme: إسناد الصلاحيات الذاتية
      definition: >
        إسناد صلاحيات ذاتية إلى الجماعات المحلية تمارسها بكامل السلطة ودون
        إشراف مستوى أعلى، وهو ما يفترض أن تتوفّر لها موارد ذاتية، ولا سيما
        جبائية، في حدود تلك الصلاحيات.
      synonymes: []

  - id: collectivite-locale
    acronyme: null
    statut: provisoire  # AR : الجماعة المحلية, CCL 2018 (AR), art. 2
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 16-18"}
    voir_aussi: [libre-administration, decentralisation]
    fr:
      terme: Collectivité locale
      definition: >
        Entité publique territoriale qui exerce, par des organes élus et sur un
        budget propre, une part des affaires publiques au profit de ses
        résidents.
      synonymes: [Collectivité territoriale]
    ar:
      terme: الجماعة المحلية
      definition: >
        ذات عمومية ترابية تمارس، بواسطة هياكل منتخبة وبميزانية خاصة بها،
        جانبا من الشؤون العمومية لفائدة متساكنيها.
      synonymes: []

  - id: libre-administration
    acronyme: null
    statut: provisoire  # AR : التدبير الحر, CCL 2018 (AR), art. 4
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 16 et 18"}
    voir_aussi: [collectivite-locale, tutelle]
    fr:
      terme: Libre administration
      definition: >
        Droit et capacité effective, pour les collectivités, de régler et de
        gérer une part importante des affaires publiques au profit de leurs
        résidents, par des conseils élus au suffrage direct et universel ; il
        limite la tutelle de l'État central.
      synonymes: []
    ar:
      terme: التدبير الحر
      definition: >
        حقّ الجماعات المحلية وقدرتها الفعلية على تنظيم جانب هامّ من الشؤون
        العمومية وتسييره لفائدة متساكنيها، بواسطة مجالس منتخبة بالاقتراع العامّ
        المباشر؛ ويحدّ من إشراف الدولة المركزية.
      synonymes: []

  - id: subsidiarite
    acronyme: null
    statut: provisoire  # AR : مبدأ التفريع, CCL 2018 (AR), art. 15
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 16 et 19-20"}
    voir_aussi: [decentralisation]
    fr:
      terme: Subsidiarité
      definition: >
        Principe selon lequel l'exercice des responsabilités publiques incombe,
        de façon générale, aux autorités les plus proches des citoyens et les
        plus à même de les remplir, compte tenu de l'ampleur et de la nature de
        la tâche et des exigences d'efficacité et d'économie.
      synonymes: [Principe de subsidiarité]
    ar:
      terme: التفريع
      definition: >
        مبدأ يُسند بمقتضاه ممارسة المسؤوليات العمومية، بصفة عامة، إلى السلط
        الأقرب إلى المواطنين والأقدر على القيام بها، مع مراعاة حجم المهمّة
        وطبيعتها ومقتضيات النجاعة والاقتصاد.
      synonymes: [مبدأ التفريع]

  - id: patrimoine-financier
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 64"}
    voir_aussi: [ressources-propres]
    fr:
      terme: Patrimoine financier
      definition: >
        Capitaux et immeubles qu'une collectivité détient à titre privé, qui ne
        sont pas nécessaires à la production des services et pourraient être
        vendus ; il s'oppose au patrimoine administratif, qui sert à produire
        les services et n'a pas de valeur de marché.
      synonymes: []
    ar:
      terme: الملك المالي
      definition: >
        رؤوس الأموال والعقارات التي تملكها جماعة محلية ملكية خاصة، والتي لا
        تحتاجها لإنتاج الخدمات ويمكن التفويت فيها؛ ويقابله الملك الإداري الذي
        يُستعمل لإنتاج الخدمات ولا قيمة سوقية له.
      synonymes: []

  - id: desequilibre-vertical
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 65 et 197"}
    voir_aussi: [transfert-financier, perequation-financiere]
    fr:
      terme: Déséquilibre vertical
      definition: >
        Discordance, commune à toutes les collectivités, entre les ressources
        qui leur sont attribuées et les tâches qui leur sont confiées ; elle
        tient à la répartition entre niveaux de gouvernement, à la différence
        des déséquilibres propres à une collectivité.
      synonymes: [Déséquilibre fiscal vertical]
    ar:
      terme: الاختلال العمودي
      definition: >
        عدم تطابق، يشمل جميع الجماعات المحلية، بين الموارد المسندة إليها
        والمهامّ الموكولة إليها؛ ويرجع إلى توزيع الموارد والمهامّ بين مستويات
        الحكم، خلافا للاختلالات الخاصّة بجماعة بعينها.
      synonymes: []

  - id: discipline-budgetaire
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 81"}
    voir_aussi: [regle-d-or]
    fr:
      terme: Discipline budgétaire
      definition: >
        Situation dans laquelle une loi impose aux collectivités des règles
        contraignantes sur le résultat de leur budget et de leurs comptes ; elle
        se distingue de la responsabilité budgétaire, attitude spontanément
        prudente des élus qui visent l'équilibre sans règle extérieure.
      synonymes: []
    ar:
      terme: الانضباط في الميزانية
      definition: >
        وضع يفرض فيه القانون على الجماعات المحلية قواعد ملزمة تتعلّق بنتيجة
        ميزانيتها وحساباتها؛ ويتميّز عن المسؤولية في الميزانية، وهي سلوك حذر
        تلقائي من المنتخبين يرمي إلى التوازن دون قاعدة خارجية.
      synonymes: []

  - id: regle-d-or
    acronyme: null
    statut: provisoire  # AR non attesté ; le CCL 2018 (AR), art. 126, dit « قاعدة التوازن الحقيقي للميزانية » (équilibre réel)
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 28 et 82"}
    voir_aussi: [discipline-budgetaire, emprunt, capacite-emprunt]
    fr:
      terme: Règle d'or
      definition: >
        Règle d'équilibre budgétaire qui, dans la forme dite « revisitée »,
        combine l'équilibre du compte de fonctionnement, service de la dette
        compris, et le financement des investissements selon l'utilisation :
        seuls les investissements peuvent être financés par l'emprunt, remboursé
        sur leur durée d'utilisation, au rythme de leur amortissement.
      synonymes: [Règle d'or revisitée]
    ar:
      terme: القاعدة الذهبية
      definition: >
        قاعدة توازن الميزانية التي تجمع، في صيغتها «المُراجَعة»، بين توازن حساب
        التصرّف بما في ذلك خدمة الدين، وتمويل الاستثمارات حسب استعمالها: فلا
        يُموَّل بالاقتراض إلّا الاستثمار، ويُسدَّد القرض على مدّة استعماله وبنسق
        استهلاكه.
      synonymes: []

  - id: emprunt
    acronyme: null
    statut: provisoire  # AR : الاقتراض, CCL 2018 (AR), titre des ressources d'emprunt
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 28 et 66"}
    voir_aussi: [regle-d-or, capacite-emprunt]
    fr:
      terme: Emprunt
      definition: >
        Pour une collectivité, moyen de paiement des investissements et non
        revenu : il devra être remboursé par un excédent de recettes ou par
        l'impôt futur.
      synonymes: []
    ar:
      terme: الاقتراض
      definition: >
        وسيلة لخلاص الاستثمارات وليس دخلا بالنسبة إلى الجماعة المحلية: إذ
        يتعيّن تسديده من فائض في المداخيل أو من الأداءات المستقبلية.
      synonymes: []

  - id: epargne-nette
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 83"}
    voir_aussi: [capacite-emprunt, regle-d-or]
    fr:
      terme: Épargne nette
      definition: >
        Excédent du compte de fonctionnement après paiement des intérêts de la
        dette et de l'amortissement des investissements existants.
      synonymes: []
    ar:
      terme: الادّخار الصافي
      definition: >
        فائض حساب التصرّف بعد دفع فوائد الدين واستهلاك الاستثمارات القائمة.
      synonymes: []

  - id: capacite-emprunt
    acronyme: null
    statut: provisoire  # AR : طاقة التداين, CCL 2018 (AR), art. 150 (critère de répartition)
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 82-83"}
    voir_aussi: [emprunt, epargne-nette, regle-d-or]
    fr:
      terme: Capacité d'emprunt
      definition: >
        Nouvel emprunt que le compte de fonctionnement d'une collectivité peut
        supporter : l'épargne nette, diminuée des coûts récurrents qu'entraîne
        l'investissement et augmentée des recettes qu'il procure, rapportée à la
        somme du taux d'intérêt et du taux d'amortissement.
      synonymes: [Capacité d'endettement]
    ar:
      terme: طاقة التداين
      definition: >
        القرض الجديد الذي يستطيع حساب التصرّف لجماعة محلية تحمّله: الادّخار
        الصافي، مطروحا منه الكلفة المتكرّرة التي يستوجبها الاستثمار ومضافا إليه
        ما يدرّه من مداخيل، مقسوما على مجموع نسبة الفائدة ونسبة الاستهلاك.
      synonymes: [طاقة الاقتراض]

  - id: tutelle
    acronyme: null
    statut: provisoire  # AR non attesté ; « الرقابة » et « مراقبة لاحقة », CCL 2018 (AR), art. 198
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 18-19"}
    voir_aussi: [libre-administration]
    fr:
      terme: Tutelle
      definition: >
        Contrôle qu'exerce l'échelon central sur les décisions des
        collectivités. Il porte sur la légalité de la décision, c'est-à-dire le
        respect de la procédure, ou sur son opportunité, c'est-à-dire son objet,
        son contenu et sa priorité ; il s'exerce a priori ou a posteriori.
      synonymes: [Contrôle de tutelle]
    ar:
      terme: سلطة الإشراف
      definition: >
        الرقابة التي يمارسها المستوى المركزي على قرارات الجماعات المحلية.
        وتتعلّق بشرعية القرار، أي احترام الإجراءات، أو بملاءمته، أي موضوعه
        ومضمونه وأولويته؛ وتُمارَس مسبقا أو لاحقا.
      synonymes: [الإشراف]

  - id: ressources-propres
    acronyme: null
    statut: provisoire  # AR : الموارد الذاتية, CCL 2018 (AR), art. 131-132
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 65 et 68"}
    voir_aussi: [autonomie-financiere, impot-local, redevance-utilisation, patrimoine-financier]
    fr:
      terme: Ressources propres
      definition: >
        Ressources qu'une collectivité obtient par ses propres moyens : ses
        impôts, exclusifs ou partagés, ses redevances d'utilisation et le
        rendement de son patrimoine. Elles s'opposent aux ressources transférées
        par l'État.
      synonymes: [Recettes propres]
    ar:
      terme: الموارد الذاتية
      definition: >
        الموارد التي تحصل عليها الجماعة المحلية بوسائلها الخاصّة: أداءاتها،
        الحصرية أو المشتركة، ومعاليم الاستعمال، ومردود أملاكها. ويقابلها ما
        تحيله الدولة من موارد.
      synonymes: []

  - id: impot-local
    acronyme: null
    statut: provisoire  # AR : الأداءات المحلية, CCL 2018 (AR), art. 132
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 152"}
    voir_aussi: [taxe-finances-publiques, redevance-utilisation, ressources-propres]
    fr:
      terme: Impôt local
      definition: >
        Prélèvement obligatoire perçu au profit d'une collectivité, sans
        contrepartie pour le contribuable et sans affectation : son produit va
        au compte général de la collectivité. C'est la définition de l'impôt en
        finances publiques, appliquée à la collectivité locale.
      synonymes: [Impôt]
    ar:
      terme: الأداء المحلي
      definition: >
        اقتطاع إجباري يُوظَّف لفائدة جماعة محلية، دون مقابل للمطالب بالأداء
        ودون تخصيص: إذ يدخل محصوله في الحساب العامّ للجماعة. وهو تعريف الأداء
        في المالية العمومية منزَّلا على الجماعة المحلية.
      synonymes: [الأداء]

  - id: taxe-finances-publiques
    acronyme: null
    statut: provisoire  # AR à confirmer : le CCL 2018 (AR), art. 132, énumère « المعاليم والرسوم » sans les définir
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 152"}
    voir_aussi: [impot-local, redevance-utilisation]
    fr:
      terme: Taxe (au sens des finances publiques)
      definition: >
        Prélèvement obligatoire qu'une collectivité perçoit comme fournisseur
        exclusif de l'accès à un service ; il n'est dû que par celui qui demande
        l'accès, va au budget général sans affectation, et son montant ne dépend
        ni du volume ni du coût de la prestation. Les textes emploient souvent
        « taxe » dans un autre sens.
      synonymes: []
    ar:
      terme: الرسم (بمفهوم المالية العمومية)
      definition: >
        اقتطاع إجباري تستخلصه جماعة محلية بصفتها المزوّد الوحيد لخدمة ما؛ ولا
        يُستوجب إلّا على من يطلب الانتفاع بها، ويدخل في الميزانية العامّة دون
        تخصيص، ولا يرتبط مبلغه بحجم الخدمة ولا بكلفتها. وكثيرا ما تستعمل النصوص
        اللفظ في معنى آخر.
      synonymes: []

  - id: redevance-utilisation
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 152-153"}
    voir_aussi: [impot-local, taxe-finances-publiques]
    fr:
      terme: Redevance d'utilisation
      definition: >
        Prix d'un service rendu, proportionné à l'avantage que l'usager en
        retire, affecté à la tâche qu'il finance et plafonné à son coût total ;
        un excédent durable serait un impôt déguisé.
      synonymes: [Paiement des usagers, Contribution causale]
    ar:
      terme: معلوم الاستعمال
      definition: >
        ثمن خدمة مسداة، يتناسب مع المنفعة التي يجنيها المنتفع منها، ويُخصَّص
        للمهمّة التي يموّلها ولا يتجاوز كلفتها الجملية؛ وكلّ فائض دائم يُعدّ
        أداءً مقنّعا.
      synonymes: [الإتاوة]

  - id: autonomie-budgetaire
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 68"}
    voir_aussi: [autonomie-financiere, devolution-competences]
    fr:
      terme: Autonomie budgétaire
      definition: >
        Capacité d'une collectivité de décider seule des catégories, de la
        quantité et de la qualité des prestations qu'elle offre à ses
        résidents ; elle porte sur les dépenses, et les compétences dévolues en
        sont le véritable espace.
      synonymes: []
    ar:
      terme: الاستقلالية في الميزانية
      definition: >
        قدرة الجماعة المحلية على أن تقرّر وحدها أصناف الخدمات التي تسديها
        لمتساكنيها وكمّيتها وجودتها؛ وهي تتعلّق بالنفقات، ومجالها الحقيقي
        الصلاحيات المُسندة.
      synonymes: []

  - id: autonomie-financiere
    acronyme: null
    statut: provisoire  # AR : « الاستقلالية الإدارية والمالية », CCL 2018 (AR), art. 2 et 38
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 68"}
    voir_aussi: [autonomie-budgetaire, souverainete-fiscale, ressources-propres, taux-autonomie-financiere]
    fr:
      terme: Autonomie financière
      definition: >
        Situation d'une collectivité qui obtient par ses propres moyens les
        ressources dont elle a besoin, sans dépendre d'autres collectivités ;
        elle prend en compte toutes les ressources propres. L'autonomie
        fiscale, plus étroite, ne prend en compte que les impôts et les taxes.
      synonymes: [Autonomie fiscale]
    ar:
      terme: الاستقلالية المالية
      definition: >
        وضع الجماعة المحلية التي تحصل بوسائلها الخاصّة على ما تحتاجه من موارد،
        دون أن تتبع جماعات أخرى؛ وتشمل جميع الموارد الذاتية. أمّا الاستقلالية
        الجبائية، وهي أضيق، فلا تشمل إلّا الأداءات والرسوم.
      synonymes: [الاستقلالية الجبائية]

  - id: souverainete-fiscale
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 68 et 153-154"}
    voir_aussi: [flexibilite-fiscale, autonomie-financiere]
    fr:
      terme: Souveraineté fiscale
      definition: >
        Pouvoir d'une collectivité de définir le cercle des assujettis,
        l'assiette, le mode de calcul et le barème des taux d'un impôt. Elle
        est totale si la collectivité fixe tous ces éléments, partielle si elle
        n'en fixe qu'une partie ; la fiscalité obligatoire ne lui en laisse
        aucun.
      synonymes: []
    ar:
      terme: السيادة الجبائية
      definition: >
        سلطة الجماعة المحلية في ضبط دائرة الخاضعين للأداء ووعائه وطريقة
        احتسابه وجدول نسبه. وتكون تامّة إذا ضبطت الجماعة كلّ هذه العناصر، وجزئية
        إذا لم تضبط إلّا بعضها؛ أمّا الجباية الإلزامية فلا تترك لها أيّا منها.
      synonymes: []

  - id: flexibilite-fiscale
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 68 et 154"}
    voir_aussi: [souverainete-fiscale, impot-partage]
    fr:
      terme: Flexibilité fiscale
      definition: >
        Régime dans lequel une collectivité ne décide que du taux ou du
        coefficient d'un impôt, les autres éléments étant identiques pour toutes
        les collectivités ; les systèmes de centimes additionnels en relèvent.
      synonymes: []
    ar:
      terme: المرونة الجبائية
      definition: >
        نظام لا تقرّر فيه الجماعة المحلية إلّا نسبة الأداء أو معامله، وتكون
        بقية العناصر واحدة لكلّ الجماعات؛ وتندرج فيه أنظمة الأجزاء الإضافية.
      synonymes: []

  - id: impot-exclusif
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 153"}
    voir_aussi: [impot-partage, part-aux-recettes]
    fr:
      terme: Impôt exclusif
      definition: >
        Impôt dont un seul niveau de gouvernement exploite l'assiette et perçoit
        l'intégralité du produit.
      synonymes: []
    ar:
      terme: الأداء الحصري
      definition: >
        أداء ينفرد مستوى واحد من مستويات الحكم باستغلال وعائه وبقبض كامل
        محصوله.
      synonymes: []

  - id: impot-partage
    acronyme: null
    statut: provisoire  # AR à confirmer : le CCL 2018 (AR), art. 132, parle des « الأداءات التي تتقاسمها الدولة مع الجماعات المحلية »
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 153-154"}
    voir_aussi: [impot-exclusif, part-aux-recettes, flexibilite-fiscale]
    fr:
      terme: Impôt partagé
      definition: >
        Impôt dont plusieurs échelons de gouvernement exploitent la même
        assiette, chacun pouvant, le cas échéant, choisir son taux.
      synonymes: []
    ar:
      terme: الأداء المشترك
      definition: >
        أداء تستغلّ عدّة مستويات من الحكم وعاءه نفسه، ويمكن لكلّ منها، عند
        الاقتضاء، أن يختار نسبته.
      synonymes: [الأداء المتقاسَم]

  - id: part-aux-recettes
    acronyme: null
    statut: provisoire  # AR à confirmer : « مناب الجماعة المحلية من محصول الأداءات », CCL 2018 (AR), art. 132
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 154"}
    voir_aussi: [impot-partage, perequation-ressources]
    fr:
      terme: Part aux recettes
      definition: >
        Fraction fixe du produit d'un impôt dont l'échelon supérieur fixe
        l'assiette et le taux et qu'il encaisse, attribuée aux collectivités ;
        elle se répartit entre elles selon l'origine du produit ou selon une clé
        de répartition, qui peut viser à réduire les écarts de potentiel fiscal.
      synonymes: [Partage de l'impôt]
    ar:
      terme: المناب من محصول الأداءات
      definition: >
        جزء قارّ من محصول أداء يضبط المستوى الأعلى وعاءه ونسبته ويستخلصه، يُسنَد
        إلى الجماعات المحلية؛ ويُوزَّع بينها حسب مصدر المحصول أو حسب مفتاح توزيع
        قد يرمي إلى الحدّ من الفوارق في الطاقة الجبائية.
      synonymes: []

  - id: transfert-financier
    acronyme: null
    statut: provisoire  # AR : « تحويلات », CCL 2018 (AR), art. 52 et 150
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 195-198"}
    voir_aussi: [subvention-globale, subvention-specifique, perequation-financiere, desequilibre-vertical]
    fr:
      terme: Transfert financier
      definition: >
        Ressource versée par un niveau de gouvernement à un autre. Selon leur
        objectif, les transferts financent les tâches déléguées, incitent,
        corrigent les effets de débordement ou assurent la péréquation.
      synonymes: [Transfert]
    ar:
      terme: التحويلات المالية
      definition: >
        موارد يدفعها مستوى من مستويات الحكم إلى مستوى آخر. وهي، حسب الغاية منها،
        تموّل المهامّ المفوَّضة، أو تحفّز، أو تصلح آثار التجاوز، أو تحقّق التعديل.
      synonymes: [التحويلات]

  - id: subvention-globale
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 201"}
    voir_aussi: [subvention-specifique, transfert-financier]
    fr:
      terme: Subvention globale
      definition: >
        Transfert dont le montant est à la libre disposition de la collectivité
        qui le reçoit.
      synonymes: [Dotation globale]
    ar:
      terme: المنحة الشاملة
      definition: >
        تحويل يكون مبلغه على ذمّة الجماعة التي تتلقّاه تتصرّف فيه بحرية.
      synonymes: []

  - id: subvention-specifique
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 201-202"}
    voir_aussi: [subvention-globale, transfert-financier]
    fr:
      terme: Subvention spécifique
      definition: >
        Transfert affecté à une tâche ou à une dépense désignée par la
        collectivité qui le verse.
      synonymes: [Subvention affectée]
    ar:
      terme: المنحة الخصوصية
      definition: >
        تحويل مخصَّص لمهمّة أو لنفقة تعيّنها الجماعة التي تدفعه.
      synonymes: [المنحة المخصَّصة]

  - id: subvention-conditionnelle
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 202"}
    voir_aussi: [subvention-forfaitaire]
    fr:
      terme: Subvention conditionnelle
      definition: >
        Transfert dont le montant varie avec la dépense subventionnée, ou avec
        la part que la collectivité bénéficiaire est prête à y consacrer.
      synonymes: [Subvention proportionnelle]
    ar:
      terme: المنحة المشروطة
      definition: >
        تحويل يتغيّر مبلغه بتغيّر النفقة المدعومة، أو بتغيّر الجزء الذي تكون
        الجماعة المنتفعة مستعدّة لتخصيصه لها.
      synonymes: [المنحة النسبية]

  - id: subvention-forfaitaire
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 202"}
    voir_aussi: [subvention-conditionnelle]
    fr:
      terme: Subvention forfaitaire
      definition: >
        Transfert d'un montant fixe, indépendant de la participation de la
        collectivité bénéficiaire.
      synonymes: [Subvention non conditionnelle]
    ar:
      terme: المنحة الجزافية
      definition: >
        تحويل بمبلغ قارّ لا يرتبط بمساهمة الجماعة المنتفعة.
      synonymes: []

  - id: subvention-rationnee
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 203"}
    voir_aussi: [subvention-conditionnelle]
    fr:
      terme: Subvention rationnée
      definition: >
        Transfert puisé dans une enveloppe limitée, dit à guichet fermé, ce qui
        oblige à fixer des critères de sélection des demandes. La subvention non
        rationnée, à guichet ouvert, est due dès que ses conditions sont
        remplies, quelle que soit la situation financière de celui qui la verse.
      synonymes: [Subvention à guichet fermé]
    ar:
      terme: المنحة المحدودة
      definition: >
        تحويل يُصرَف من اعتماد محدود، ويقتضي لذلك ضبط مقاييس لانتقاء المطالب.
        أمّا المنحة غير المحدودة فتُستحَقّ بمجرّد توفّر شروطها، مهما كانت الوضعية
        المالية للجهة التي تدفعها.
      synonymes: []

  - id: perequation-financiere
    acronyme: null
    statut: provisoire  # AR à confirmer : le CCL 2018 (AR), art. 38-39, emploie « التعديل » et « التسوية » ; la mise en regard avec « péréquation » n'est pas attestée
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 20-21 et 252"}
    voir_aussi: [perequation-ressources, perequation-besoins, potentiel-fiscal, transfert-financier]
    fr:
      terme: Péréquation financière
      definition: >
        Transfert qui compense les disparités entre collectivités échappant à
        leur contrôle — d'assiette fiscale, de besoins ou de coûts —, en
        application du principe de solidarité. Elle est verticale lorsque le
        fonds est doté par le seul gouvernement central, horizontale lorsque les
        collectivités au potentiel fiscal supérieur à la moyenne y contribuent.
      synonymes: [Péréquation entre collectivités]
    ar:
      terme: التعديل المالي
      definition: >
        تحويل يعوّض الفوارق بين الجماعات المحلية التي تخرج عن سيطرتها — في
        الوعاء الجبائي أو الحاجيات أو الكلفة —، تطبيقا لمبدأ التضامن. ويكون
        عموديا إذا موّلت الحكومة المركزية وحدها الصندوق، وأفقيا إذا ساهمت فيه
        الجماعات التي تفوق طاقتها الجبائية المعدّل.
      synonymes: [التعديل]

  - id: perequation-ressources
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 201 et 252"}
    voir_aussi: [perequation-financiere, potentiel-fiscal, perequation-besoins]
    fr:
      terme: Péréquation des ressources
      definition: >
        Péréquation qui réduit les écarts de potentiel fiscal, en donnant
        davantage aux collectivités dont la base d'imposition est inférieure à
        la moyenne.
      synonymes: []
    ar:
      terme: تعديل الموارد
      definition: >
        تعديل يحدّ من الفوارق في الطاقة الجبائية، بمنح قسط أوفر للجماعات التي
        يقلّ وعاؤها الجبائي عن المعدّل.
      synonymes: []

  - id: perequation-besoins
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 201 et 252"}
    voir_aussi: [perequation-financiere, perequation-ressources]
    fr:
      terme: Péréquation des besoins
      definition: >
        Péréquation qui compense les écarts de besoins ou de coûts par rapport à
        la norme, selon des critères démographiques, géographiques ou
        topographiques liés à la dépense.
      synonymes: [Péréquation des charges, Péréquation des coûts]
    ar:
      terme: تعديل الحاجيات
      definition: >
        تعديل يعوّض الفوارق في الحاجيات أو في الكلفة مقارنة بالمعيار، حسب مقاييس
        ديمغرافية أو جغرافية أو طبوغرافية مرتبطة بالنفقة.
      synonymes: [تعديل الأعباء]

  - id: taux-autonomie-financiere
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 68"}
    voir_aussi: [autonomie-financiere, ressources-propres]
    fr:
      terme: Taux d'autonomie financière
      definition: >
        Part des recettes propres d'une collectivité dans le total des
        ressources dont elle peut disposer, hors emprunt.
      synonymes: []
    ar:
      terme: نسبة الاستقلالية المالية
      definition: >
        حصّة الموارد الذاتية للجماعة المحلية من مجموع الموارد التي تتصرّف فيها،
        باستثناء الاقتراض.
      synonymes: []

  - id: potentiel-fiscal
    acronyme: null
    statut: provisoire  # AR : الطاقة الجبائية, CCL 2018 (AR), art. 150 (critère de répartition)
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 252"}
    voir_aussi: [effort-fiscal, perequation-ressources]
    fr:
      terme: Potentiel fiscal
      definition: >
        Produit fiscal qu'une collectivité collecterait si elle appliquait à ses
        bases d'imposition le taux moyen national.
      synonymes: [Richesse fiscale, Capacité fiscale]
    ar:
      terme: الطاقة الجبائية
      definition: >
        المحصول الجبائي الذي تستخلصه جماعة محلية لو طبّقت على أوعيتها الجبائية
        النسبة المتوسّطة الوطنية.
      synonymes: []

  - id: effort-fiscal
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 251-252"}
    voir_aussi: [potentiel-fiscal]
    fr:
      terme: Effort fiscal
      definition: >
        Taux qu'une collectivité applique à ses propres bases d'imposition ; le
        taux moyen national est l'effort fiscal moyen. Un produit fiscal élevé
        n'est pas nécessairement le signe d'un effort élevé.
      synonymes: []
    ar:
      terme: المجهود الجبائي
      definition: >
        النسبة التي تطبّقها جماعة محلية على أوعيتها الجبائية؛ والنسبة المتوسّطة
        الوطنية هي المجهود الجبائي المتوسّط. ولا يدلّ ارتفاع المحصول الجبائي
        بالضرورة على مجهود مرتفع.
      synonymes: []

  - id: taux-de-facturation
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 79"}
    voir_aussi: [taux-de-recouvrement, potentiel-fiscal]
    fr:
      terme: Taux de facturation
      definition: >
        Rapport entre le montant effectivement facturé au titre d'un impôt et le
        produit que rapporterait sa base exploitée de manière efficace.
      synonymes: []
    ar:
      terme: نسبة الإصدار
      definition: >
        النسبة بين المبلغ المُصدَر فعلا بعنوان أداء ما والمحصول الذي يدرّه وعاؤه
        لو استُغلّ استغلالا ناجعا.
      synonymes: []

  - id: taux-de-recouvrement
    acronyme: null
    statut: provisoire  # AR : « الاستخلاص », CCL 2018 (AR), passim ; « نسبة الاستخلاص » non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 79"}
    voir_aussi: [taux-de-facturation]
    fr:
      terme: Taux de recouvrement
      definition: >
        Rapport entre le montant effectivement encaissé au titre d'un impôt et
        le montant facturé.
      synonymes: []
    ar:
      terme: نسبة الاستخلاص
      definition: >
        النسبة بين المبلغ المستخلَص فعلا بعنوان أداء ما والمبلغ المُصدَر.
      synonymes: []

  - id: code-fiscalite-locale
    acronyme: null
    statut: valide
    references: [loi97-11]
    source_definition: {ref: loi97-11, locator: "art. 1-3"}
    source_traduction: {ref: loi97-11, locator: "art. 1"}
    voir_aussi: [taxe-immeubles-batis, taxe-terrains-non-batis, taxe-etablissements, taxe-hoteliere]
    fr:
      terme: Code de la fiscalité locale
      definition: >
        Code promulgué par la loi n° 97-11 du 3 février 1997 et entré en
        vigueur le 1er janvier 1997, qui régit les droits et redevances perçus
        au profit des collectivités locales. Il compte huit chapitres, un par
        prélèvement : taxe sur les immeubles bâtis, taxe sur les terrains non
        bâtis, taxe sur les établissements à caractère industriel, commercial
        ou professionnel, taxe hôtelière, taxe sur les spectacles, contribution
        des propriétaires riverains, droit de licence sur les débits de
        boissons, et taxes et redevances diverses.
      synonymes: []
    ar:
      terme: مجلة الجباية المحلية
      definition: >
        مجلة صدرت بالقانون عدد 11 لسنة 1997 المؤرخ في 3 فيفري 1997 ودخلت حيّز
        التنفيذ ابتداء من غرّة جانفي 1997، تنظّم المعاليم المستوجبة لفائدة
        الجماعات المحلية. وتتضمّن ثمانية أبواب، باب لكلّ معلوم: المعلوم على
        العقارات المبنية، والمعلوم على الأراضي غير المبنية، والمعلوم على
        المؤسسات ذات الصبغة الصناعية أو التجارية أو المهنية، والمعلوم على النزل،
        والمعلوم على العروض، ومساهمة المالكين الأجوار، ومعلوم الإجازة الموظف على
        محلات بيع المشروبات، ومعاليم مختلفة.
      synonymes: []

  - id: taxe-immeubles-batis
    acronyme: TIB
    statut: valide
    references: [loi97-11, decret2017-397]
    source_definition: {ref: loi97-11, locator: "art. 1-5"}
    source_traduction: {ref: loi97-11, locator: "art. 1"}
    voir_aussi: [prix-reference-m2, taxe-terrains-non-batis, code-fiscalite-locale]
    fr:
      terme: Taxe sur les immeubles bâtis
      definition: >
        Taxe annuelle, due au 1er janvier par le propriétaire d'un immeuble bâti
        situé dans une zone relevant d'une collectivité locale, sauf si
        l'immeuble est affecté à une activité soumise à la taxe sur les
        établissements ou à la taxe hôtelière. Son assiette est égale à 2 % du
        prix de référence du mètre carré couvert multiplié par la superficie
        couverte ; son taux, de 8 à 14 %, croît avec le nombre de services dont
        bénéficie l'immeuble.
      synonymes: []
    ar:
      terme: المعلوم على العقارات المبنية
      definition: >
        معلوم سنوي يُستوجب في غرّة جانفي على مالك العقار المبني الكائن بمنطقة
        راجعة بالنظر إلى جماعة محلية، ما لم يكن العقار مخصّصا لنشاط خاضع للمعلوم
        على المؤسسات أو للمعلوم على النزل. وتساوي قاعدته 2 بالمائة من الثمن
        المرجعي للمتر المربع المبني مضروبا في المساحة المغطاة، وتتراوح نسبته بين
        8 و14 بالمائة حسب عدد الخدمات التي ينتفع بها العقار.
      synonymes: []

  - id: taxe-terrains-non-batis
    acronyme: TNB
    statut: valide
    references: [loi97-11, decret2017-396]
    source_definition: {ref: loi97-11, locator: "art. 30-33"}
    source_traduction: {ref: loi97-11, locator: "art. 30"}
    voir_aussi: [taxe-immeubles-batis, code-fiscalite-locale]
    fr:
      terme: Taxe sur les terrains non bâtis
      definition: >
        Taxe annuelle due par le propriétaire d'un terrain non bâti situé dans
        une zone relevant d'une collectivité locale, au taux de 0,3 % de la
        valeur vénale réelle du terrain ou, à défaut, selon un tarif au mètre
        carré fixé par décret pour chaque zone du plan d'aménagement urbain,
        selon sa densité.
      synonymes: []
    ar:
      terme: المعلوم على الأراضي غير المبنية
      definition: >
        معلوم سنوي يُستوجب على مالك الأرض غير المبنية الكائنة بمنطقة راجعة
        بالنظر إلى جماعة محلية، بنسبة 0,3 بالمائة من القيمة التجارية الحقيقية
        للأرض، أو، عند تعذّر ذلك، حسب معلوم بالمتر المربع يُضبط بأمر لكلّ منطقة
        من مناطق مثال التهيئة العمرانية حسب كثافتها العمرانية.
      synonymes: []

  - id: taxe-etablissements
    acronyme: TCL
    statut: valide
    references: [loi97-11, decret2017-395]
    source_definition: {ref: loi97-11, locator: "art. 35-38"}
    source_traduction: {ref: loi97-11, locator: "art. 35"}
    voir_aussi: [taxe-hoteliere, taxe-immeubles-batis, code-fiscalite-locale]
    fr:
      terme: Taxe sur les établissements à caractère industriel, commercial ou professionnel
      definition: >
        Taxe due au profit des collectivités locales par les personnes soumises
        à l'impôt sur le revenu au titre des bénéfices industriels et commerciaux
        ou des bénéfices non commerciaux et par les personnes morales soumises à
        l'impôt sur les sociétés, même exonérées de ces impôts. Assise à
        l'origine sur le chiffre d'affaires brut local, au taux de 0,2 %, elle
        ne peut être inférieure à un minimum calculé sur la superficie couverte
        des locaux exploités.
      synonymes: [Taxe sur les établissements]
    ar:
      terme: المعلوم على المؤسسات ذات الصبغة الصناعية أو التجارية أو المهنية
      definition: >
        معلوم يُستوجب لفائدة الجماعات المحلية على الأشخاص الخاضعين للضريبة على
        الدخل بعنوان الأرباح الصناعية والتجارية أو الأرباح غير التجارية وعلى
        الأشخاص المعنويين الخاضعين للضريبة على الشركات، ولو كانوا معفيين منهما.
        ويُوظَّف في الأصل على رقم المعاملات المحلي الخام بنسبة 0,2 بالمائة، ولا
        يمكن أن يقلّ عن حدّ أدنى يُحتسب على أساس المساحة المغطاة للمحلات
        المستغلّة.
      synonymes: []

  - id: taxe-hoteliere
    acronyme: null
    statut: valide
    references: [loi97-11]
    source_definition: {ref: loi97-11, locator: "art. 41-43"}
    source_traduction: {ref: loi97-11, locator: "art. 41"}
    voir_aussi: [taxe-etablissements, code-fiscalite-locale]
    fr:
      terme: Taxe hôtelière
      definition: >
        Taxe due au profit des collectivités locales par les exploitants des
        établissements touristiques, au taux de 2 % de leur chiffre d'affaires
        brut global. Ces établissements sont exonérés de la taxe sur les
        établissements à caractère industriel, commercial ou professionnel et
        de la taxe sur les immeubles bâtis.
      synonymes: []
    ar:
      terme: المعلوم على النزل
      definition: >
        معلوم يُستوجب لفائدة الجماعات المحلية على مستغلّي المؤسسات السياحية،
        بنسبة 2 بالمائة من رقم معاملاتهم الجملي الخام. وتُعفى هذه المؤسسات من
        المعلوم على المؤسسات ذات الصبغة الصناعية أو التجارية أو المهنية ومن
        المعلوم على العقارات المبنية.
      synonymes: []

  - id: prix-reference-m2
    acronyme: null
    statut: valide
    references: [loi97-11, decret97-431, decret2007-1185, decret2017-397]
    source_definition: {ref: loi97-11, locator: "art. 4"}
    source_traduction: {ref: loi97-11, locator: "art. 4"}
    voir_aussi: [taxe-immeubles-batis]
    fr:
      terme: Prix de référence du mètre carré couvert
      definition: >
        Prix au mètre carré de superficie couverte sur lequel est calculée
        l'assiette de la taxe sur les immeubles bâtis. Un décret en fixe, pour
        chacune des quatre catégories de superficie couverte, un minimum et un
        maximum ; dans ces limites, la collectivité locale le fixe par arrêté
        motivé, selon les services rendus.
      synonymes: []
    ar:
      terme: الثمن المرجعي للمتر المربع المبني
      definition: >
        ثمن للمتر المربع من المساحة المغطاة تُحتسب على أساسه قاعدة المعلوم على
        العقارات المبنية. ويضبط أمر حدّه الأدنى وحدّه الأقصى لكلّ صنف من أصناف
        المساحة المغطاة الأربعة، وتضبطه الجماعة المحلية في حدودهما بقرار معلّل
        حسب الخدمات المسداة.
      synonymes: []

  - id: contribution-fnah
    acronyme: null
    statut: provisoire  # FR : intitulé repris de la note documentaire (LF 2005, art. 13), à relire sur pièce ; AR : LF 2019, art. 72 ; LF 2024, art. 59
    references: [lf-2005, loi2018-56-lf2019]
    source_definition: {ref: lf-2005, locator: "art. 13"}
    source_traduction: {ref: loi2018-56-lf2019, locator: "art. 72"}
    voir_aussi: [taxe-immeubles-batis]
    fr:
      terme: Contribution au profit du Fonds national d'amélioration de l'habitat
      definition: >
        Contribution due par les redevables de la taxe sur les immeubles bâtis
        pour les immeubles d'habitation, égale à 4 % de l'assiette de cette
        taxe et recouvrée selon ses règles, au profit du Fonds national
        d'amélioration de l'habitat, fonds spécial du Trésor.
      synonymes: []
    ar:
      terme: المساهمة لفائدة الصندوق الوطني لتحسين السكن
      definition: >
        مساهمة يدفعها الخاضعون للمعلوم على العقارات المبنية بعنوان العقارات
        المعدّة للسكنى، تساوي 4 بالمائة من قاعدة هذا المعلوم وتُستخلص حسب
        قواعده، لفائدة الصندوق الوطني لتحسين السكن، وهو صندوق خاص للخزينة.
      synonymes: []

  - id: fonds-commun-collectivites-locales
    acronyme: FCCL
    statut: valide
    references: [loi75-36, lf-2007, lf-2018]
    source_definition: {ref: loi75-36, locator: "art. 1-3"}
    source_traduction: {ref: loi75-36, locator: "art. 1"}
    voir_aussi: [reserve-fonds-commun, cpscl, transfert-financier, perequation-financiere]
    fr:
      terme: Fonds commun des collectivités locales
      definition: >
        Fonds spécial du Trésor institué par la loi n° 75-36 du 14 mai 1975, à
        compter du 1er janvier 1976, qui répartit entre les conseils de
        gouvernorat, puis conseils régionaux, et les communes une dotation
        annuelle globale, selon des critères fixés par la loi ; une part en est
        mise en réserve. Alimenté d'abord par des parts d'impôts d'État, puis à
        partir de 1987 par une subvention du budget de l'État, il est supprimé
        par la loi de finances pour 2018.
      synonymes: []
    ar:
      terme: المال المشترك للجماعات المحلية
      definition: >
        مال خاص بالخزينة أحدثه القانون عدد 36 لسنة 1975 المؤرخ في 14 ماي 1975
        بداية من غرة جانفي 1976، يوزّع على مجالس الولايات ثمّ المجالس الجهوية
        وعلى البلديات اعتمادا سنويا جمليا وفق مقاييس يضبطها القانون، ويُرصد جزء
        منه مدّخرا. موّل في البداية بمناب من أداءات الدولة، ثمّ بداية من سنة
        1987 بمنحة من ميزانية الدولة، وحُذف بقانون المالية لسنة 2018.
      synonymes: []

  - id: reserve-fonds-commun
    acronyme: null
    statut: valide
    references: [loi75-36, loi91-98-lf1992, lf-2007, lf-2014]
    source_definition: {ref: loi75-36, locator: "art. 3"}
    source_traduction: {ref: loi75-36, locator: "art. 3"}
    voir_aussi: [fonds-commun-collectivites-locales, cpscl]
    fr:
      terme: Réserve du fonds commun
      definition: >
        Part des ressources du fonds commun des collectivités locales qui n'est
        pas répartie selon les critères généraux, appelée « solde » par la loi
        de 1975 : 25 % jusqu'en 2006, puis 18 % à partir de 2007. Ses parts
        étaient fixées par la loi jusqu'en 1991, puis attribuées par décret
        entre la commune de Tunis, les communes sièges de gouvernorat, la caisse
        de prêts et de soutien et d'autres bénéficiaires.
      synonymes: [Solde du fonds commun]
    ar:
      terme: مدّخر المال المشترك
      definition: >
        جزء من موارد المال المشترك للجماعات المحلية لا يوزّع حسب المقاييس
        العامّة: 25 بالمائة إلى سنة 2006، ثمّ 18 بالمائة بداية من سنة 2007.
        ضبط القانون أقساطه إلى سنة 1991، ثمّ صار يُسند بأمر بين بلدية تونس
        والبلديات مراكز الولايات وصندوق القروض ومساعدة الجماعات المحلية وغيرها.
      synonymes: []

  - id: cpscl
    acronyme: CPSCL
    statut: valide
    references: [loi75-37, cpscl-etats-financiers]
    source_definition: {ref: loi75-37, locator: "art. 1-4"}
    source_traduction: {ref: lf-2007, locator: "art. 11"}
    voir_aussi: [fonds-commun-collectivites-locales, emprunt]
    fr:
      terme: Caisse des prêts et de soutien des collectivités locales
      definition: >
        Caisse dotée de la personnalité civile et de l'autonomie financière,
        issue en 1976 de la transformation de la caisse des prêts aux communes
        de 1902 par la loi n° 75-37 du 14 mai 1975. Elle consent aux
        collectivités locales des prêts d'investissement, des subventions et
        des bonifications d'intérêts, sur une part du fonds commun, les
        remboursements de ses prêts et ses emprunts.
      synonymes: []
    ar:
      terme: صندوق القروض ومساعدة الجماعات المحلية
      definition: >
        صندوق يتمتّع بالشخصية المدنية والاستقلال المالي، نشأ سنة 1976 عن تحويل
        صندوق القروض للبلديات المحدث سنة 1902 بمقتضى القانون عدد 37 لسنة 1975
        المؤرخ في 14 ماي 1975. يسند إلى الجماعات المحلية قروض استثمار ومنحا
        وتخفيضات في الفوائض، من مناب من المال المشترك ومن استخلاص قروضه
        ومن اقتراضاته.

  - id: competences-propres
    acronyme: null
    statut: provisoire  # AR : الصلاحيات الذاتية, CCL 2018 (AR), art. 13-14 ; FR : traduction citée par Hammami, Dafflon et Gilbert (2021, p. 26-27), non officielle
    references: [hammami-dafflon-gilbert-2021]
    source_definition: {ref: loi-org-2018-29-ccl, locator: "art. 13-14"}
    voir_aussi: [competences-partagees, competences-transferees, devolution-competences]
    fr:
      terme: Compétences propres
      definition: >
        Dans le code des collectivités locales de 2018, compétences que la
        collectivité exerce seule et de façon exclusive, sous réserve des cas
        prévus par le code.
      synonymes: [Attributions propres]
    ar:
      terme: الصلاحيات الذاتية
      definition: >
        في مجلة الجماعات المحلية لسنة 2018، الصلاحيات التي تنفرد الجماعة
        المحلية بمباشرتها بصفة حصرية، مع مراعاة الحالات التي تنص عليها المجلة.
      synonymes: []

  - id: competences-partagees
    acronyme: null
    statut: provisoire  # AR : الصلاحيات المشتركة, CCL 2018 (AR), art. 13 ; FR : traduction citée par Hammami, Dafflon et Gilbert (2021)
    references: [hammami-dafflon-gilbert-2021]
    source_definition: {ref: loi-org-2018-29-ccl, locator: "art. 13 et 15"}
    voir_aussi: [competences-propres, competences-transferees, subsidiarite]
    fr:
      terme: Compétences partagées
      definition: >
        Dans le code des collectivités locales de 2018, compétences que la
        collectivité exerce avec l'autorité centrale, en coordination et en
        coopération avec elle, selon des conditions renvoyées à une loi.
      synonymes: []
    ar:
      terme: الصلاحيات المشتركة
      definition: >
        في مجلة الجماعات المحلية لسنة 2018، الصلاحيات التي تباشرها الجماعة
        المحلية مع السلطة المركزية بالتنسيق والتعاون معها، وفق شروط يضبطها
        القانون.
      synonymes: []

  - id: competences-transferees
    acronyme: null
    statut: provisoire  # AR : الصلاحيات المنقولة, CCL 2018 (AR), art. 13 et 16 ; la Constitution de 2014 (art. 134) dit « déléguées » dans la traduction reproduite par Dafflon et Gilbert
    references: [hammami-dafflon-gilbert-2021]
    source_definition: {ref: loi-org-2018-29-ccl, locator: "art. 13 et 16"}
    voir_aussi: [competences-propres, competences-partagees, delegation-competences]
    fr:
      terme: Compétences transférées
      definition: >
        Dans le code des collectivités locales de 2018, compétences que
        l'autorité centrale transfère à la collectivité par la loi, avec les
        crédits et les moyens proportionnés aux charges qu'elles entraînent.
      synonymes: [Compétences déléguées]
    ar:
      terme: الصلاحيات المنقولة
      definition: >
        في مجلة الجماعات المحلية لسنة 2018، الصلاحيات التي تنقلها السلطة
        المركزية إلى الجماعة المحلية بمقتضى القانون، مع الاعتمادات والوسائل
        الملائمة للأعباء المترتبة عنها.
      synonymes: []

  - id: pouvoir-reglementaire-local
    acronyme: null
    statut: provisoire  # AR : السلطة الترتيبية, CCL 2018 (AR), art. 25-28 ; FR : notre traduction
    references: []
    source_definition: {ref: loi-org-2018-29-ccl, locator: "art. 25-28"}
    voir_aussi: [competences-propres]
    fr:
      terme: Pouvoir réglementaire local
      definition: >
        Pouvoir du conseil d'une collectivité locale de prendre des règlements
        dans les limites de son territoire et de ses compétences ; il peut en
        déléguer une part à son président.
      synonymes: []
    ar:
      terme: السلطة الترتيبية
      definition: >
        سلطة مجلس الجماعة المحلية في اتخاذ التراتيب في حدود ترابها
        وصلاحياتها، وله أن يفوّض جزءا منها إلى رئيسه.
      synonymes: []

  - id: district
    acronyme: null
    statut: provisoire  # FR et AR : loi organique n° 2025-4, art. 1 (« conseils de districts », « مجالس الأقاليم ») ; CCL 2018 (AR), art. 2 et 356 (abrogé le 18 mars 2025) ; regroupement de gouvernorats : décret n° 2023-589, art. 1
    references: [loi-org-2018-29-ccl, decret2023-589]
    source_definition: {ref: decret2023-589, locator: "art. 1"}
    source_traduction: {ref: loi-org2025-4, locator: "art. 1"}
    voir_aussi: [collectivite-locale, conseil-local]
    fr:
      terme: District
      definition: >
        Collectivité locale regroupant plusieurs gouvernorats, chargée de
        l'intégration et de la complémentarité du développement entre les zones
        qui la composent ; son conseil est élu par les membres d'autres conseils.
      synonymes: []
    ar:
      terme: الإقليم
      definition: >
        جماعة محلية تجمع عدة ولايات، تتولى تحقيق الاندماج والتكامل في
        التنمية بين المناطق المكونة لها، وينتخب مجلسها أعضاء مجالس أخرى.
      synonymes: []

  - id: conseil-local
    acronyme: null
    statut: valide  # FR et AR : loi organique n° 2025-4, art. 1 et 7 (« conseil local », « المجلس المحلي »)
    references: [decretloi2023-10]
    source_definition: {ref: loi-org2025-4, locator: "art. 1 et 7"}
    source_traduction: {ref: loi-org2025-4, locator: "art. 1"}
    voir_aussi: [district, collectivite-locale]
    fr:
      terme: Conseil local
      definition: >
        Conseil élu au niveau de la délégation, considéré comme une collectivité
        locale, qui délibère sur les projets de plans de développement locaux.
      synonymes: []
    ar:
      terme: المجلس المحلي
      definition: >
        مجلس منتخب على مستوى المعتمدية، يعتبر جماعة محلية، ويتداول في مشاريع
        مخططات التنمية المحلية.
      synonymes: []

  - id: conseil-superieur-collectivites-locales
    acronyme: null
    statut: provisoire  # AR : المجلس الأعلى للجماعات المحلية, CCL 2018 (AR), art. 47-60 ; FR : notre traduction (« Haut Conseil » chez Dafflon et Gilbert)
    references: []
    source_definition: {ref: loi-org-2018-29-ccl, locator: "art. 47-60"}
    voir_aussi: [haute-instance-finances-locales]
    fr:
      terme: Conseil supérieur des collectivités locales
      definition: >
        Instance nationale formée de présidents de collectivités, consultée
        obligatoirement sur les projets de loi qui intéressent les collectivités
        locales, notamment leurs finances.
      synonymes: [Haut Conseil des collectivités locales]
    ar:
      terme: المجلس الأعلى للجماعات المحلية
      definition: >
        هيئة وطنية تتكوّن من رؤساء جماعات محلية، يُستشار وجوبا في مشاريع
        القوانين المتعلقة بالجماعات المحلية، ولا سيما بماليتها.
      synonymes: []

  - id: haute-instance-finances-locales
    acronyme: null
    statut: provisoire  # AR : الهيئة العليا للمالية المحلية, CCL 2018 (AR), art. 61-65 ; FR : notre traduction
    references: []
    source_definition: {ref: loi-org-2018-29-ccl, locator: "art. 61-65"}
    voir_aussi: [conseil-superieur-collectivites-locales]
    fr:
      terme: Haute instance des finances locales
      definition: >
        Instance placée sous la supervision du Conseil supérieur des
        collectivités locales, qui propose les ressources transférables aux
        collectivités et leurs critères de répartition, évalue le coût des
        transferts de compétences et suit l'endettement local.
      synonymes: []
    ar:
      terme: الهيئة العليا للمالية المحلية
      definition: >
        هيئة تعمل تحت إشراف المجلس الأعلى للجماعات المحلية، تقترح الموارد
        القابلة للتحويل إلى الجماعات المحلية ومقاييس توزيعها، وتقيّم كلفة نقل
        الصلاحيات وتتابع المديونية المحلية.
      synonymes: []

  - id: delegation-speciale
    acronyme: null
    statut: provisoire  # FR : loi n° 75-33, art. 13 ; AR : النيابة الخصوصية, relevé dans des arrêtés du JORT n° 39 de 2018, non dans la loi
    references: [decret2011-384]
    source_definition: {ref: loi75-33, locator: "art. 13"}
    voir_aussi: [collectivite-locale, tutelle]
    fr:
      terme: Délégation spéciale
      definition: >
        Organe nommé par décret qui remplit les fonctions d'un conseil
        municipal dissous ou démissionnaire, ou celles du conseil d'une
        commune nouvellement créée, jusqu'à l'élection d'un nouveau conseil.
      synonymes: []
    ar:
      terme: النيابة الخصوصية
      definition: >
        هيئة تُعيَّن بأمر لتتولى مهام مجلس بلدي منحلّ أو مستقيل، أو مجلس
        بلدية محدثة، إلى حين انتخاب مجلس جديد.
      synonymes: []

  - id: depenses-obligatoires
    acronyme: null
    statut: provisoire  # FR : loi n° 75-35, art. 10 ; AR : النفقات الإجبارية, CCL 2018 (AR), art. 160 (« وجوبية » à l'art. 174)
    references: []
    source_definition: {ref: loi75-35, locator: "art. 10"}
    voir_aussi: [equilibre-reel, tutelle]
    fr:
      terme: Dépenses obligatoires
      definition: >
        Dépenses que la loi impose d'inscrire au budget d'une collectivité
        locale, telles que la rémunération du personnel ou les annuités
        d'emprunt ; elles peuvent être inscrites d'office.
      synonymes: []
    ar:
      terme: النفقات الإجبارية
      definition: >
        نفقات يفرض القانون ترسيمها بميزانية الجماعة المحلية، مثل تأجير
        الأعوان أو أقساط القروض، ويمكن ترسيمها وجوبا.
      synonymes: [النفقات الوجوبية]

  - id: equilibre-reel
    acronyme: null
    statut: provisoire  # FR : loi n° 75-35, art. 16 ; AR : التوازن الحقيقي للميزانية, CCL 2018 (AR), art. 126
    references: [dafflon-gilbert-2018]
    source_definition: {ref: loi75-35, locator: "art. 16"}
    voir_aussi: [regle-d-or, depenses-obligatoires]
    fr:
      terme: Équilibre réel
      definition: >
        Exigence que les autorisations de dépenses et les prévisions de
        recettes du budget local soient présentées et votées en équilibre,
        compte tenu des engagements antérieurs ; la loi ne la définit pas
        davantage.
      synonymes: []
    ar:
      terme: التوازن الحقيقي للميزانية
      definition: >
        وجوب تقديم ترخيصات النفقات وتقديرات الموارد بميزانية الجماعة المحلية
        والمصادقة عليها في توازن، مع اعتبار التعهدات السابقة.
      synonymes: []

  - id: ordonnateur
    acronyme: null
    statut: valide  # FR et AR : loi organique n° 2025-4, art. 5 (« ordonnateur », « آمر قبض وصرف »)
    references: [loi-org2007-65]
    source_definition: {ref: loi-org2025-4, locator: "art. 5"}
    source_traduction: {ref: loi-org2025-4, locator: "art. 5"}
    voir_aussi: [comptable-public]
    fr:
      terme: Ordonnateur
      definition: >
        Autorité qui ordonne les recettes et les dépenses d'un budget ; pour une
        collectivité locale et pour les conseils locaux, régionaux et de
        districts, son président.
      synonymes: []
    ar:
      terme: آمر قبض وصرف
      definition: >
        السلطة التي تأذن بقبض الموارد وصرف النفقات في ميزانية ما؛ وهي بالنسبة
        إلى الجماعة المحلية وإلى المجالس المحلية والجهوية ومجالس الأقاليم
        رئيسها.
      synonymes: [آمر الصرف]

  - id: comptable-public
    acronyme: null
    statut: provisoire  # AR : محاسب الجماعة المحلية, CCL 2018 (AR), art. 129 et 184 ; FR : notre traduction
    references: []
    source_definition: {ref: loi-org-2018-29-ccl, locator: "art. 129 et 186"}
    voir_aussi: [ordonnateur]
    fr:
      terme: Comptable public
      definition: >
        Agent de l'État chargé seul des encaissements et des paiements d'une
        collectivité locale ; il contrôle la légalité des dépenses, non leur
        opportunité.
      synonymes: [Comptable de la collectivité locale]
    ar:
      terme: محاسب الجماعة المحلية
      definition: >
        عون عمومي للدولة يتولى وحده عمليات القبض والصرف للجماعة المحلية،
        ويراقب شرعية النفقات دون ملاءمتها.
      synonymes: [المحاسب العمومي]

  - id: compte-financier
    acronyme: null
    statut: provisoire  # FR : loi n° 75-35, art. 25 ; AR : الحساب المالي, CCL 2018 (AR), art. 195-196
    references: []
    source_definition: {ref: loi75-35, locator: "art. 25"}
    voir_aussi: [comptable-public]
    fr:
      terme: Compte financier
      definition: >
        Document qui retrace l'exécution du budget d'une collectivité locale
        à la clôture de l'exercice, arrêté par son conseil.
      synonymes: []
    ar:
      terme: الحساب المالي
      definition: >
        وثيقة تبيّن تنفيذ ميزانية الجماعة المحلية عند ختم السنة المالية،
        ويختمها مجلسها.
      synonymes: []

  - id: faute-de-gestion
    acronyme: null
    statut: provisoire  # FR : loi organique n° 2007-65 (art. 23 bis nouveau de la loi n° 75-35) ; AR : خطأ تصرّف, CCL 2018 (AR), art. 183
    references: []
    source_definition: {ref: loi-org2007-65, locator: "art. 1"}
    voir_aussi: [ordonnateur]
    fr:
      terme: Faute de gestion
      definition: >
        Manquement d'un ordonnateur aux règles d'exécution du budget local,
        notamment l'engagement de dépenses au-delà des recettes réalisées ;
        il engage sa responsabilité.
      synonymes: []
    ar:
      terme: خطأ التصرّف
      definition: >
        إخلال آمر الصرف بقواعد تنفيذ ميزانية الجماعة المحلية، ولا سيما
        الالتزام بنفقات تتجاوز الموارد المحققة، ويترتب عنه قيام مسؤوليته.
      synonymes: []

  - id: salaire-minimum-garanti
    acronyme: null
    statut: provisoire
    references: [loi66-27]
    source_definition: {ref: loi96-62, locator: "art. 134-2"}
    voir_aussi: [smig, smag, salaire-conventionnel]
    fr:
      terme: Salaire minimum garanti
      definition: >
        Seuil au-dessous duquel il n'est pas possible de rémunérer un travailleur
        chargé de travaux ne nécessitant pas de qualification professionnelle
        (code du travail, art. 134-2, issu de la loi n° 96-62). Il est fixé par
        décret, sous deux formes : le salaire minimum interprofessionnel garanti
        (SMIG) pour les secteurs non agricoles et le salaire minimum agricole
        garanti (SMAG).
      synonymes: [salaire minimum légal]
    ar:
      terme: الأجر الأدنى المضمون
      definition: >
        العتبة الدنيا التي لا يجوز دونها تأجير عامل مكلَّف بأعمال لا تستوجب
        تأهيلًا مهنيًا (مجلة الشغل، الفصل 134-2، كما أُضيف بالقانون عدد 62 لسنة
        1996). ويُضبط بأمر في صيغتين: الأجر الأدنى المضمون لمختلف المهن في
        القطاعات غير الفلاحية، والأجر الأدنى الفلاحي المضمون.
      synonymes: []

  - id: salaire-conventionnel
    acronyme: null
    statut: provisoire
    references: [arrete-1973-05-29-convention-cadre]
    source_definition: {ref: decret73-247, locator: "art. 1 et 2"}
    voir_aussi: [salaire-minimum-garanti, convention-collective-sectorielle, convention-collective-cadre]
    fr:
      terme: Salaire conventionnel
      definition: >
        Salaire fixé, par catégorie professionnelle, par une convention collective
        ou par ses avenants. Depuis le décret n° 73-247 du 26 mai 1973, les
        conventions collectives peuvent fixer les salaires, leurs accessoires et
        les classifications, sur la base d'un salaire minimum interprofessionnel
        garanti fixé par décret.
      synonymes: []
    ar:
      terme: الأجر التعاقدي
      definition: >
        أجر تضبطه اتفاقية مشتركة أو ملاحقها التعديلية حسب الأصناف المهنية. ومنذ
        الأمر عدد 247 لسنة 1973 المؤرخ في 26 ماي 1973، يجوز للاتفاقيات المشتركة
        ضبط الأجور وتوابعها والتصنيفات، على أساس أجر أدنى مضمون لمختلف المهن يُضبط
        بأمر.
      synonymes: []

  - id: convention-collective-cadre
    acronyme: null
    statut: provisoire
    references: [loi66-27]
    source_definition: {ref: arrete-1973-05-29-convention-cadre}
    voir_aussi: [convention-collective-sectorielle, agrement-convention-collective, salaire-conventionnel]
    fr:
      terme: Convention collective cadre
      definition: >
        Convention conclue le 20 mars 1973 entre l'Union tunisienne de
        l'industrie, du commerce et de l'artisanat et l'Union générale tunisienne
        du travail, approuvée par arrêté du 29 mai 1973 et rendue obligatoire pour
        toutes les activités non agricoles. Elle sert de base à chaque convention
        de branche, qui en fixe les grilles de salaires et les indemnités.
      synonymes: [convention-cadre]
    ar:
      terme: الاتفاقية المشتركة الإطارية
      definition: >
        اتفاقية أُبرمت في 20 مارس 1973 بين الاتحاد التونسي للصناعة والتجارة
        والصناعات التقليدية والاتحاد العام التونسي للشغل، وصودق عليها بقرار مؤرخ في
        29 ماي 1973 وجُعلت إلزامية في جميع الأنشطة غير الفلاحية. وهي أساس كلّ
        اتفاقية قطاعية تضبط سلالم الأجور والمنح.
      synonymes: []

  - id: agrement-convention-collective
    acronyme: null
    statut: provisoire
    references: []
    source_definition: {ref: loi66-27, locator: "art. 37 et 38"}
    voir_aussi: [convention-collective-sectorielle, convention-collective-cadre]
    fr:
      terme: Agrément d'une convention collective
      definition: >
        Arrêté par lequel, après avis de la commission consultative des
        conventions collectives, une convention est rendue
        applicable à tous les employeurs et à tous les travailleurs de la branche
        qu'elle vise, signataires ou non (code du travail de 1966, art. 37 et 38).
      synonymes: []
    ar:
      terme: المصادقة على الاتفاقية المشتركة
      definition: >
        قرار تُجعل به اتفاقيةٌ، بعد رأي اللجنة الاستشارية للاتفاقيات المشتركة،
        منطبقةً على جميع المؤجرين وجميع العمال في القطاع الذي
        تشمله، موقّعين كانوا أم لا (مجلة الشغل لسنة 1966، الفصلان 37 و38).
      synonymes: []

  - id: indemnite-complementaire-provisoire
    acronyme: ICP
    statut: provisoire
    references: [decret82-501, decret2026-67]
    source_definition: {ref: decret81-437}
    voir_aussi: [smig]
    fr:
      terme: Indemnité complémentaire provisoire
      definition: >
        Indemnité instituée le 1er avril 1981 par le décret n° 81-437, servie en
        sus du salaire de base des salariés des secteurs non agricoles régis par le
        code du travail, et majorée au 1er février 1982 par le décret n° 82-501.
        Elle fait partie du SMIG, que les décrets successifs décomposent en salaire
        de base et indemnité complémentaire provisoire.
      synonymes: []
    ar:
      terme: المنحة التكميلية الوقتية
      definition: >
        منحة أُحدثت بداية من غرّة أفريل 1981 بالأمر عدد 437 لسنة 1981، تُصرف
        زيادة على الأجر الأساسي لأجراء القطاعات غير الفلاحية الخاضعة لمجلة الشغل،
        وتمّ الترفيع فيها بداية من غرّة فيفري 1982 بالأمر عدد 501 لسنة 1982. وهي
        جزء من الأجر الأدنى المضمون الذي تفصّله الأوامر المتعاقبة إلى أجر أساسي
        ومنحة تكميلية وقتية.
      synonymes: []

  - id: commission-nationale-smig
    acronyme: null
    statut: provisoire
    references: [decret74-63]
    source_definition: {ref: decret74-493}
    voir_aussi: [smig, smag]
    fr:
      terme: Commission nationale du salaire minimum garanti
      definition: >
        Commission instituée par le décret n° 74-493 du 20 avril 1974, où
        siègent l'État, le Parti socialiste destourien, l'Union tunisienne de
        l'industrie, du commerce et de l'artisanat, l'Union nationale des
        agriculteurs et l'Union générale tunisienne du travail. Le SMIG peut
        varier après son avis (décret n° 74-63, art. 4) ; le SMIG et le SMAG sont
        déterminés par décret.
      synonymes: []
    ar:
      terme: اللجنة الوطنية للأجر الأدنى المضمون
      definition: >
        لجنة أُحدثت بالأمر عدد 493 لسنة 1974 المؤرخ في 20 أفريل 1974، تضمّ الدولة
        والحزب الاشتراكي الدستوري والاتحاد التونسي للصناعة والتجارة والصناعات
        التقليدية والاتحاد القومي للفلاحين والاتحاد العام التونسي للشغل. ويمكن
        تعديل الأجر الأدنى بعد رأيها (الأمر عدد 63 لسنة 1974، الفصل 4)؛ ويُضبط
        الأجر الأدنى المضمون لمختلف المهن والأجر الأدنى الفلاحي المضمون بأمر.
      synonymes: []

  - id: salaire-brut
    acronyme: null
    statut: provisoire
    references: [oit-cist12-1973-salaires]
    source_definition: {ref: loi96-62, locator: "art. 134-2 et 143"}
    voir_aussi: [salaire-net, cout-du-travail]
    fr:
      terme: Salaire brut
      definition: >
        Rémunération due au travailleur avant toute retenue : salaire de base et
        accessoires, indemnités et avantages en espèces ou en nature, à
        l'exception des remboursements de frais (code du travail, art. 134-2).
        Le bulletin de paie en indique le montant, puis la nature et le montant
        des retenues opérées sur lui (art. 143). La statistique internationale
        retient la même notion : la rémunération totale avant les retenues de
        l'employeur au titre des impôts et des cotisations du salarié.
      synonymes: [rémunération brute]
    ar:
      terme: الأجر الخام
      definition: >
        الأجر المستحقّ للعامل قبل أيّ خصم: الأجر الأساسي وتوابعه من منح ومنافع
        نقدية أو عينية، باستثناء ما يكتسي صبغة استرجاع مصاريف (مجلة الشغل، الفصل
        134-2). وتبيّن بطاقة الخلاص مبلغه ثمّ نوع الخصومات المجراة عليه ومبلغها
        (الفصل 143).
      synonymes: []

  - id: salaire-net
    acronyme: null
    statut: provisoire
    references: []
    source_definition: {ref: loi96-62, locator: "art. 143"}
    voir_aussi: [salaire-brut, cout-du-travail]
    fr:
      terme: Salaire net
      definition: >
        Rémunération effectivement perçue par le travailleur, une fois opérées
        sur la rémunération brute les retenues — cotisations sociales du salarié,
        impôt retenu à la source. Le bulletin de paie en porte le montant (code du
        travail, art. 143).
      synonymes: [rémunération nette]
    ar:
      terme: الأجر الصافي
      definition: >
        الأجر الذي يتقاضاه العامل فعلًا بعد إجراء الخصومات على الأجر الخام، من
        مساهمات اجتماعية محمولة على الأجير وضريبة محجوزة من المورد. وتبيّن بطاقة
        الخلاص مبلغه (مجلة الشغل، الفصل 143).
      synonymes: []

  - id: cout-du-travail
    acronyme: null
    statut: provisoire
    references: []
    source_definition: {ref: oit-cist11-1966-cout-travail, locator: "§ 3"}
    voir_aussi: [salaire-brut, salaire-net, taux-global]
    fr:
      terme: Coût du travail
      definition: >
        Coût supporté par l'employeur pour l'emploi de main-d'œuvre : la
        rémunération du travail, y compris le temps payé non travaillé, les primes
        et les avantages en nature, augmentée des dépenses de sécurité sociale de
        l'employeur, des frais de formation, des services sociaux et des impôts
        assis sur l'emploi ou les salaires (résolution de la onzième Conférence
        internationale des statisticiens du travail, 1966, § 3).
      synonymes: []
    ar:
      terme: كلفة العمل
      definition: >
        الكلفة التي يتحمّلها المؤجر لتشغيل اليد العاملة: أجر العمل، بما في ذلك
        الوقت المدفوع غير المعمول والمنح والمنافع العينية، تُضاف إليه نفقات
        الضمان الاجتماعي المحمولة على المؤجر ونفقات التكوين والخدمات الاجتماعية
        والأداءات الموظَّفة على التشغيل أو على الأجور (قرار المؤتمر الدولي الحادي
        عشر لخبراء إحصاءات العمل، 1966، الفقرة 3).
      synonymes: []

  - id: emploi-informel
    acronyme: null
    statut: provisoire
    references: []
    source_definition: {ref: oit-cist21-2023-informel, locator: "§ 56"}
    voir_aussi: [cout-du-travail]
    fr:
      terme: Emploi informel
      definition: >
        Toute activité exercée pour produire des biens ou fournir des services
        contre rémunération ou profit qui n'est pas couverte, en droit ou en
        pratique, par les dispositifs formels : droit commercial, déclaration des
        activités économiques, impôt sur le revenu, législation du travail,
        sécurité sociale (résolution de la vingt et unième Conférence
        internationale des statisticiens du travail, 2023, § 56). Elle comprend
        notamment les salariés dont la relation d'emploi n'est pas, en pratique,
        formellement reconnue par l'employeur ou ne donne pas un accès effectif à
        ces dispositifs.
      synonymes: [travail informel]
    ar:
      terme: التشغيل غير المنظّم
      definition: >
        كلّ نشاط يُمارَس لإنتاج سلع أو تقديم خدمات مقابل أجر أو ربح ولا تشمله،
        قانونًا أو فعلًا، الترتيبات الرسمية: القانون التجاري، والتصريح بالأنشطة
        الاقتصادية، والضريبة على الدخل، وتشريع الشغل، والضمان الاجتماعي (قرار
        المؤتمر الدولي الحادي والعشرين لخبراء إحصاءات العمل، 2023، الفقرة 56).
      synonymes: []

