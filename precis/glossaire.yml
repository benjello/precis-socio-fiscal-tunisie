      synonymes: []
    ar:
      terme: منحة الإدماج الجامعي
      definition: >
        منحة تُصرف دفعة واحدة للناجح الجديد في البكالوريا المرسَّم بمؤسسة عمومية للتعليم
        العالي، في حدود سقف الدخل المعتمد للمنحة الوطنية؛ أحدثها الأمر عدد 2018-927،
        ويضبط قرار 4 ديسمبر 2018 شروط إسنادها ومقدارها.
      synonymes: []

  - id: bourse-specifique
    acronyme: null
    # AR lu : décret n° 2009-3040 (AR), art. 3 (« منحة خصوصية », relu à l'image, JORT AR
    # n° 84 de 2009, p. 3817) ; arrêté du 5 mars 2019. Forme partagée avec
    # `indemnite-specifique` (attestée) et `subvention-specifique` (non attestée) : gardée,
    # car lue deux fois ; la définition arabe lève l'homonymie.
    statut: valide
    references: [decret2001-2438, decret2009-3040-bourses-prets, arrete-2009-10-26-bourses-prets, arrete-2019-03-05-bourses-etranger]
    source_definition: {ref: decret2009-3040-bourses-prets, locator: "art. 3"}
    source_traduction: {ref: decret2009-3040-bourses-prets, locator: "art. 3"}
    voir_aussi: [bourse-nationale, bourse-alternance]
    fr:
      terme: Bourse spécifique
      definition: >
        Bourse nationale d'études à l'étranger composée de deux éléments, un élément
        fixe et un élément complémentaire servi sous forme de prêt ; elle va aux
        domaines de formation prioritaires et oblige, depuis 2001, à exercer trois ans
        au moins en Tunisie.
      synonymes: []
    ar:
      terme: المنحة الخصوصية
      definition: >
        منحة وطنية للدراسات الجامعية بالخارج تتكوّن من عنصرين متكاملين: عنصر قار وعنصر
        تكميلي في شكل قرض، وتُسند في مجالات التكوين ذات الأولوية، ويلتزم المنتفع بها منذ
        سنة 2001 بالعمل ثلاث سنوات على الأقل بالبلاد التونسية. ولا تُخلط بالمنحة
        الخصوصية التي تُضاف إلى المرتب الأساسي في الوظيفة العمومية.
      synonymes: []

  - id: bourse-alternance
    acronyme: null
    statut: valide  # AR lu : décret n° 2009-3040 (AR), art. 3 (« منحة تداول ») ; relu à l'image, JORT AR n° 84 de 2009, p. 3817
    references: [decret2001-2438, arrete-2009-10-26-bourses-prets, arrete-2019-03-05-bourses-etranger]
