  - id: crva
    acronyme: CRVA
    statut: valide
    references: [decret2001-1722, lf-2005, decret2012-2369, decret2019-542, decret2023-461]
    source_definition: {ref: decret2009-349, locator: "art. 25-28"}
    # Arabe lu à l'image : intitulé de la section 4 et art. 25, p. 581 de l'édition arabe.
    source_traduction: {ref: decret2009-349, locator: "art. 25"}
    voir_aussi: [caip, indemnite-perte-emploi]
    fr:
      terme: Contrat de réinsertion dans la vie active
      definition: >
        Programme du Fonds national de l'emploi, créé deux fois. Il naît sous ce nom
        avec le décret n° 2009-349, pour
        les travailleurs qui ont perdu leur emploi pour des raisons économiques ou
        techniques, permanents ou comptant trois ans d'ancienneté : il dure alors un
        an, comprend une adaptation de 200 heures au plus à un poste identifié dans
        une entreprise privée et donne lieu à une indemnité mensuelle de l'État.
        Deux dispositifs le précèdent, sans lien établi avec lui : un système de
        contrats de formation aux fins de réinsertion, institué en 2001, et un
        « contrat de réinsertion dans la vie professionnelle », créé par la loi de
        finances pour 2005. Maintenu à titre transitoire en 2012, il cesse le
        2 juillet 2019 avec l'abrogation du décret qui le maintenait, sans être
        nommé. En juin 2023, le décret n° 2023-461 le recrée, pour les personnes
        ayant perdu leur emploi dans une entreprise du secteur privé et pour douze
        mois au plus.
      synonymes: []
    ar:
      terme: عقد إعادة الإدماج في الحياة النشيطة
      definition: >
        برنامج من برامج الصندوق الوطني للتشغيل أُحدث مرتين. أحدثه بهذه التسمية
        الأمر عدد 349 لسنة 2009
        لفائدة العمال الذين فقدوا شغلهم لأسباب اقتصادية أو فنية، من القارّين أو
        ممن لهم أقدمية ثلاث سنوات: يدوم حينئذ سنة، ويتضمن تأهيلا لا يتجاوز 200 ساعة
        لموطن عمل مشخّص مسبقا بمؤسسة خاصة، مع منحة شهرية تسندها الدولة. وسبقته
        آليتان لم تثبت صلتهما به: نظام عقود تكوين لإعادة الإدماج أُحدث سنة 2001،
        وعقد لإعادة الإدماج في الحياة المهنية أحدثه قانون المالية لسنة 2005.
        وأُبقي عليه بصفة انتقالية سنة 2012، ثم انتهى العمل به في 2 جويلية 2019
        بإلغاء الأمر الذي أبقى عليه، دون أن يُذكر بالاسم. وفي جوان 2023 أعاد
        إحداثه الأمر عدد 461 لسنة 2023، لفائدة من فقدوا شغلهم بمؤسسات القطاع
        الخاص ولمدة أقصاها اثنا عشر شهرا.
      synonymes: []

