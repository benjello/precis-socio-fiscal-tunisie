    statut: valide
    references: []
    voir_aussi: [masse-salariale, recettes-fiscales, administrations-publiques]
    fr:
      terme: Produit intérieur brut
      definition: >
        Valeur totale des biens et services produits sur le territoire au cours
        d'une période. Sert de dénominateur aux ratios de finances publiques du
        précis : masse salariale, rendement de l'impôt, recettes fiscales.
      synonymes: [PIB]
    ar:
      terme: الناتج المحلي الإجمالي
      definition: >
        القيمة الجملية للسلع والخدمات المنتَجة داخل التراب الوطني خلال فترة
        معيّنة. ويُتّخذ مقامًا لنسب المالية العمومية في هذا الملخّص: كتلة الأجور
        ومردود الضريبة والمداخيل الجبائية.
      synonymes: []

  - id: recettes-fiscales
    acronyme: null
    statut: valide
    references: []
    voir_aussi: [pib, irpp, css, cotisations-sociales]
    fr:
      terme: Recettes fiscales
      definition: >
        Ensemble des impôts, droits et taxes perçus par l'État, à l'exclusion
        des recettes non fiscales. Les documents budgétaires tunisiens les
        distinguent des recettes non fiscales, qui proviennent notamment de la
        redevance de transit du gaz.
      synonymes: []
    ar:
      terme: المداخيل الجبائية
      definition: >
        مجموع الضرائب والمعاليم والأداءات التي تستخلصها الدولة، باستثناء
        المداخيل غير الجبائية. وتميّزها وثائق الميزانية التونسية عن المداخيل غير
        الجبائية، المتأتّية خاصّةً من أتاوة عبور الغاز.
      synonymes: []

  - id: tva
    acronyme: TVA
    statut: provisoire
    references: [loi-88-61-tva, dgelf-code-tva-2023]
    source_definition: {ref: loi-88-61-tva}
    voir_aussi: [assujetti, fait-generateur-tva, exoneration-tva, taux-normal-tva, taux-reduit-tva, droit-de-consommation]
    fr:
      terme: Taxe sur la valeur ajoutée
      definition: >
        Impôt indirect général sur la dépense, institué par la loi n° 88-61 du
        2 juin 1988 portant promulgation du code de la taxe sur la valeur
        ajoutée, applicable à compter du 1er juillet 1988. Il frappe les
        opérations et non les personnes, et se substitue aux taxes sur le
        chiffre d'affaires antérieures.
      synonymes: [TVA]
    ar:
      terme: الأداء على القيمة المضافة
      definition: ""
      synonymes: []

  - id: assujetti
