    ar:
      terme: منحة التداول
      definition: >
        منحة وطنية للدراسات الجامعية بالخارج تُصرف لإقامة لا تتجاوز ستة أشهر في السنة.
      synonymes: []

  - id: allocation-supplementaire
    acronyme: null
    statut: valide  # AR lu : décret n° 2009-3040 (AR), art. 3 (« منحة التكلفة الإضافية ») ; relu à l'image, JORT AR n° 84 de 2009, p. 3817
    references: [arrete-1986-07-28-bourses-prets, arrete-1997-08-18-bourses-montants, decret2009-3040-bourses-prets]
    source_definition: {ref: decret2009-3040-bourses-prets, locator: "art. 3"}
