# Glossaire bilingue — source unique de vérité (FR ⇄ AR)
#
# Fichier global partagé par tous les précis. Chaque entrée est identifiée par
# un `id` (slug stable) qui sert d'ancre commune `#g-<id>` dans les deux langues.
#
# À partir de ce fichier, `scripts/build_glossary.py` génère :
#   - l'annexe glossaire FR et AR de chaque précis ;
#   - `translation_glossary.generated.md`, table FR↔AR injectée dans le pipeline
#     de traduction (translate_sync.py / verify_translation.py) pour garantir la
#     bijection des termes et éviter les divergences.
#
# Champs : id, acronyme, statut (valide | provisoire), references (clés CSL),
# voir_aussi (slugs), fr/ar { terme, definition, synonymes }.
# NE PAS modifier les fichiers générés à la main : éditez ce glossaire.

entries:
  - id: precis-socio-fiscal
    acronyme: null
    statut: valide
    references: []
    voir_aussi: []
    fr:
      terme: Précis socio-fiscal
      definition: >
        Ouvrage de synthèse documentant l'évolution de la législation sociale
        et fiscale tunisienne depuis l'indépendance, dans son contexte
        historique et politique.
      synonymes: []
    ar:
      terme: الملخّص الاجتماعي والجبائي
      definition: >
        مُصنَّف توليفي يوثّق تطوّر التشريع الاجتماعي والجبائي التونسي منذ
        الاستقلال، في سياقه التاريخي والسياسي.
      synonymes: []

  - id: secteur-public
    acronyme: null
    statut: valide
    references: []
    voir_aussi: [fonction-publique, emploi-public, administrations-publiques, entreprises-publiques]
    fr:
      terme: Secteur public
      definition: >
        Ensemble des organisations contrôlées ou détenues par l'État :
        administrations publiques (État, collectivités locales, sécurité
        sociale) et entreprises publiques. Notion plus large que la fonction
        publique et que l'emploi public.
      synonymes: []
    ar:
      terme: القطاع العام
      definition: >
        مجموع المنظمات التي تسيطر عليها الدولة أو تملكها: الإدارات العمومية
        (الدولة، الجماعات المحلية، الضمان الاجتماعي) والمنشآت العمومية. مفهوم
        أوسع من الوظيفة العمومية ومن التشغيل العمومي.
      synonymes: []

  - id: fonction-publique
    acronyme: null
    statut: valide
    references: [loi83-112]
    source_definition: {ref: loi83-112, locator: "art. 1"}
    source_traduction: {ref: loi83-112, locator: "art. 1"}
    voir_aussi: [emploi-public, secteur-public, epa]
    fr:
      terme: Fonction publique
      definition: >
        Au sens strict, ensemble des agents de l'État, des collectivités
        locales et des établissements publics à caractère administratif, régis
        par le statut général (loi n°83-112).
      synonymes: []
    ar:
      terme: الوظيفة العمومية
      definition: >
        بالمعنى الضيّق، مجموع أعوان الدولة والجماعات المحلية والمؤسسات العمومية
        ذات الصبغة الإدارية، الخاضعين للنظام الأساسي العام (القانون عدد 83-112).
      synonymes: []

  - id: emploi-public
    acronyme: null
    statut: provisoire
    references: []
    voir_aussi: [fonction-publique, secteur-public]
    fr:
      terme: Emploi public
      definition: >
        Concept statistique recouvrant la fonction publique et une partie des
        agents des établissements et entreprises publics ; intermédiaire entre
        la fonction publique et le secteur public.
      synonymes: []
    ar:
      terme: التشغيل العمومي
      definition: >
        مفهوم إحصائي يشمل الوظيفة العمومية وجزءًا من أعوان المؤسسات والمنشآت
        العمومية؛ وسيط بين الوظيفة العمومية والقطاع العام.
      synonymes: []

  - id: administrations-publiques
    acronyme: null
    statut: provisoire
    references: [sna2008, imfgfsm2014]
    source_definition: {ref: sna2008}
    voir_aussi: [entreprises-publiques, secteur-public, fonds-de-securite-sociale, masse-salariale]
    fr:
      terme: Administrations publiques
      definition: >
        Sous-secteur des comptes nationaux (General Government) regroupant
        l'administration centrale, les administrations locales et les fonds de
        sécurité sociale, financés principalement par des prélèvements
        obligatoires.
      synonymes: []
    ar:
      terme: الإدارات العمومية
      definition: >
        قطاع فرعي في الحسابات الوطنية يضمّ الإدارة المركزية والإدارات المحلية
        وصناديق الضمان الاجتماعي، ويُموَّل أساسًا من الاقتطاعات الإجبارية.
      synonymes: []

  - id: entreprises-publiques
    acronyme: null
    statut: provisoire
    references: [loi89-9, sna2008]
    source_definition: {ref: loi89-9, locator: "art. 8"}
    source_traduction: {ref: loi89-9}
    voir_aussi: [administrations-publiques, epna, epic]
    fr:
      terme: Entreprises publiques
      definition: >
        Sous-secteur des comptes nationaux (Public Corporations) regroupant les
        unités contrôlées par l'État qui produisent des biens et services
        marchands ; au sens juridique, périmètre défini par la loi n°89-9.
      synonymes: []
    ar:
      terme: المنشآت العمومية
      definition: >
        قطاع فرعي في الحسابات الوطنية يضمّ الوحدات التي تسيطر عليها الدولة
        وتنتج سلعًا وخدمات سوقية؛ وبالمعنى القانوني، نطاق يحدّده القانون عدد 89-9.
      synonymes: []

  - id: epa
    acronyme: EPA
    statut: provisoire
    references: [loi83-112]
    source_definition: {ref: loi83-112}
    source_traduction: {ref: loi83-112}
    voir_aussi: [epna, epic, fonction-publique]
    fr:
      terme: Établissement public à caractère administratif
      definition: >
        Organisme public doté de la personnalité morale et de l'autonomie
        financière, exerçant une mission administrative ; son personnel relève
        généralement de la fonction publique.
      synonymes: [EPA]
    ar:
      terme: المؤسسة العمومية ذات الصبغة الإدارية
      definition: >
        هيكل عمومي يتمتّع بالشخصية المعنوية والاستقلال المالي، يمارس مهمّة
        إدارية؛ وينتمي أعوانه عمومًا إلى الوظيفة العمومية.
      synonymes: []

  - id: epna
    acronyme: EPNA
    statut: provisoire
    references: [loi89-9]
    source_definition: {ref: loi89-9, locator: "art. 8"}
    source_traduction: {ref: loi89-9}
    voir_aussi: [epa, epic, entreprises-publiques]
    fr:
      terme: Établissement public à caractère non administratif
      definition: >
        Organisme public doté de la personnalité morale et de l'autonomie de
        gestion, exerçant une activité technique, économique ou sociale ;
        certains EPNA sont, par décret, considérés comme entreprises publiques.
      synonymes: [EPNA]
    ar:
      terme: المؤسسة العمومية التي لا تكتسي صبغة إدارية
      definition: >
        هيكل عمومي يتمتّع بالشخصية المعنوية واستقلالية التصرّف، يمارس نشاطًا
        فنّيًا أو اقتصاديًا أو اجتماعيًا؛ وتُعتبر بعض هذه المؤسسات، بمقتضى أمر،
        منشآت عمومية.
      synonymes: []

  - id: epic
    acronyme: EPIC
    statut: provisoire
    references: [loi85-78]
    source_definition: {ref: loi85-78}
    source_traduction: {ref: loi85-78}
    voir_aussi: [epna, entreprises-publiques, regime-conventionnel-public]
    fr:
      terme: Établissement public à caractère industriel et commercial
      definition: >
        Établissement public exerçant une activité industrielle ou
        commerciale, dont les agents relèvent de la loi n°85-78 et non du statut
        général de la fonction publique.
      synonymes: [EPIC]
    ar:
      terme: المؤسسة العمومية ذات الصبغة الصناعية والتجارية
      definition: >
        مؤسسة عمومية تمارس نشاطًا صناعيًا أو تجاريًا، يخضع أعوانها للقانون عدد
        85-78 لا للنظام الأساسي العام للوظيفة العمومية.
      synonymes: []

  - id: regime-indiciaire
    acronyme: null
    statut: provisoire
    references: [loi83-112, decret-97-1832, decret-2007-268]
    voir_aussi: [grille-des-salaires, traitement-de-base, point-indice, grade, echelon, fonction-publique]
    fr:
      terme: Régime indiciaire
      definition: >
        Régime de rémunération de la fonction publique, des collectivités
        locales et d'une partie des établissements publics à caractère
        administratif, fondé sur un grade et un échelon. En droit positif
        tunisien, à chaque couple grade × échelon correspond un traitement de
        base mensuel fixé directement en dinars par les grilles annexées aux
        décrets (décret n°97-1832, décret n°2007-268) ; le « point d'indice »,
        hérité du modèle français de carrière, subsiste dans le vocabulaire
        mais n'opère pas comme paramètre multiplicateur.
      synonymes: []
    ar:
      terme: النظام الاستدلالي للتأجير
      definition: >
        نظام تأجير الوظيفة العمومية والجماعات المحلية وجزء من المؤسسات العمومية
        ذات الصبغة الإدارية، يقوم على رتبة ودرجة. وفي القانون الوضعي التونسي،
        يقابل كلَّ ثنائي رتبة × درجة مرتبٌ أساسي شهري محدَّد مباشرة بالدينار في
        الشبكات المُلحقة بالأوامر (الأمر عدد 97-1832 والأمر عدد 2007-268)؛ أمّا
        «النقطة الاستدلالية» الموروثة عن النموذج الفرنسي للمسار المهني فلا تزال
        قائمة في المصطلحات لكنّها لا تعمل كمُعامِل ضربٍ.
      synonymes: []

  - id: regime-statutaire-autonome
    acronyme: null
    statut: provisoire
    references: [loi83-112, loi67-29, loi67-20, loi82-70]
    source_definition: {ref: loi83-112, locator: "art. 1er"}
    voir_aussi: [regime-indiciaire, fonction-publique, forces-de-securite-interieure, statut-particulier, magistrat, solde-militaire, pensions-civiles-militaires]
    fr:
      terme: Régime statutaire autonome
      definition: >
        Régime de rémunération propre à des corps dotés d'un statut spécial
        (magistrats, militaires, forces de sécurité intérieure), détaché du
        statut commun de la fonction publique. Ce détachement procède d'une
        clause d'exclusion de champ, et non d'une sortie progressive : l'article
        premier de la loi n°83-112 portant statut général écarte ces corps de
        son champ d'application
        et les renvoie à leurs textes propres — loi n°67-29 (magistrats de
        l'ordre judiciaire), loi n°67-20 (militaires), loi n°82-70 (forces de
        sécurité intérieure). Le corps des agents des douanes relève, lui, d'un
        statut séparé encore (loi n°95-46).
      synonymes: [statut spécial]
    ar:
      terme: النظام الأساسي الخاص
      definition: >
        نظام تأجير خاصّ بأسلاك تتمتّع بنظام أساسي خاصّ (القضاة، العسكريون، قوات
        الأمن الداخلي)، منفصل عن النظام الأساسي العام للوظيفة العمومية. وهذا
        الانفصال ناتج عن بند استثناء من مجال التطبيق، لا عن خروج تدريجي: فالفصل
        الأول من القانون عدد 83-112 المتعلّق بالنظام الأساسي العام يُخرج هذه
        الأسلاك من مجال تطبيقه
        ويحيلها إلى نصوصها الخاصّة — القانون عدد 67-29 (القضاة العدليون)،
        والقانون عدد 67-20 (العسكريون)، والقانون عدد 82-70 (قوات الأمن الداخلي).
        أمّا سلك أعوان الديوانة فيخضع لنظام أساسي منفصل آخر (القانون عدد 95-46).
      synonymes: []

  - id: magistrat
    acronyme: null
    statut: valide
    references: [loi67-29, loi72-40, decret-loi-70-6]
    source_definition: {ref: loi67-29}
    source_traduction: {ref: loi67-29}
    voir_aussi: [regime-statutaire-autonome, pensions-civiles-militaires]
    fr:
      terme: Magistrat
      definition: >
        Membre d'un corps de magistrats doté d'un statut propre, distinct du
        statut général de la fonction publique. Le droit tunisien connaît trois
        statuts distincts : les magistrats de l'ordre judiciaire (loi n°67-29 du
        14 juillet 1967), les magistrats du Tribunal administratif (loi n°72-40
        du 1ᵉʳ juin 1972) et les membres de la Cour des comptes (décret-loi
        n°70-6 du 26 septembre 1970). Le barème de rémunération de chaque corps
        relève de ses dispositions statutaires propres.
      synonymes: []
    ar:
      terme: القاضي
      definition: >
        عضو في سلك من أسلاك القضاة يتمتّع بنظام أساسي خاصّ به، متميّز عن النظام
        الأساسي العام للوظيفة العمومية. ويعرف القانون التونسي ثلاثة أنظمة
        أساسية متمايزة: قضاة القضاء العدلي (القانون عدد 67-29 المؤرّخ في 14
        جويلية 1967)، وقضاة المحكمة الإدارية (القانون عدد 72-40 المؤرّخ في غرّة
        جوان 1972)، وأعضاء دائرة المحاسبات (المرسوم عدد 70-6 المؤرّخ في 26
        سبتمبر 1970). ويخضع سُلَّم تأجير كلّ سلك لأحكامه الأساسية الخاصّة.
      synonymes: []

  - id: solde-militaire
    acronyme: null
    statut: provisoire  # équivalent AR à valider par un locuteur — cf. issue #53

    references: [decret-79-96, decret-67-158]
    source_definition: {ref: decret-79-96}
    voir_aussi: [regime-statutaire-autonome, traitement-de-base, regime-indiciaire]
    fr:
      terme: Solde (militaire)
      definition: >
        Rémunération de base des militaires, équivalent du traitement de base de
        la fonction publique mais établi hors de la grille indiciaire de droit
        commun. Le décret n°79-96 du 11 janvier 1979 fixe la solde des
        militaires « non classés dans la grille des salaires mensuels de la
        fonction publique » ; l'intitulé même atteste que la rémunération
        militaire n'est pas adossée à la grille indiciaire. À cette solde
        s'ajoutent des indemnités liées aux sujétions du service.
      synonymes: []
    ar:
      terme: المرتّب العسكري
      definition: >
        الأجر الأساسي للعسكريين، المقابل للمرتّب الأساسي في الوظيفة العمومية لكن
        المضبوط خارج الشبكة الاستدلالية للقانون العام. يضبط الأمر عدد 79-96
        المؤرّخ في 11 جانفي 1979 مرتّب العسكريين «غير المصنّفين في شبكة الأجور
        الشهرية للوظيفة العمومية»؛ ويشهد العنوان ذاته على أنّ التأجير العسكري لا
        يستند إلى الشبكة الاستدلالية. وتُضاف إلى هذا المرتّب منحٌ مرتبطة بأعباء
        الخدمة.
      synonymes: []

  - id: pensions-civiles-militaires
    acronyme: null
    statut: provisoire  # équivalent AR à valider par un locuteur — cf. issue #54

    references: [loi85-12, loi2019-37]
    source_definition: {ref: loi85-12}
    voir_aussi: [cnrps, regime-statutaire-autonome, solde-militaire, cotisations-sociales]
    fr:
      terme: Pensions civiles et militaires
      definition: >
        Régime de retraite commun aux agents civils et militaires du secteur
        public, géré par la Caisse nationale de retraite et de prévoyance
        sociale (CNRPS) : il n'existe pas de caisse militaire distincte. Ce
        régime est fixé par la loi n°85-12 du 5 mars 1985 portant régime des
        pensions civiles et militaires de retraite et des survivants dans le
        secteur public, modifiée notamment par la loi n°2019-37. Au sein de ce
        régime commun, le volet militaire connaît des paramètres dérogatoires
        (durées de services et âges de jouissance différenciés selon le grade).
      synonymes: []
    ar:
      terme: الجرايات المدنية والعسكرية
      definition: >
        نظام تقاعد مشترك بين الأعوان المدنيين والعسكريين في القطاع العام، يديره
        الصندوق الوطني للتقاعد والحيطة الاجتماعية: ولا يوجد صندوق عسكري منفصل.
        يضبط هذا النظامَ القانونُ عدد 85-12 المؤرّخ في 5 مارس 1985 المتعلّق
        بنظام جرايات التقاعد والباقين على قيد الحياة المدنية والعسكرية في القطاع
        العام، المنقَّح خاصّةً بالقانون عدد 2019-37. وضمن هذا النظام المشترك،
        يعرف الشقّ العسكري معاييرَ استثنائية (مدد خدمة وأعمار انتفاع متمايزة حسب
        الرتبة).
      synonymes: []

  - id: statut-particulier
    acronyme: null
    statut: provisoire
    references: [loi83-112, decret-statut-caisses-2022]
    voir_aussi: [fonction-publique, regime-statutaire-autonome, cnss, cnrps, cnam]
    fr:
      terme: Statut particulier
      definition: >
        Statut dérogatoire applicable à une catégorie d'agents publics, fixé par
        un texte propre (souvent un décret) par opposition au statut général de
        la fonction publique (loi n°83-112). Le statut particulier des agents des
        caisses sociales (CNSS, CNRPS, CNAM), adopté par décret en 2022, en est
        un exemple : un régime sui generis, ni statut général ni convention
        collective de droit commun.
      synonymes: []
    ar:
      terme: النظام الأساسي الخصوصي
      definition: >
        نظام استثنائي يُطبَّق على صنف من الأعوان العموميين، يُضبَط بنصّ خاصّ (أمر
        في الغالب) خلافًا للنظام الأساسي العام للوظيفة العمومية (القانون عدد
        83-112). ومن أمثلته النظام الأساسي الخصوصي لأعوان صناديق الضمان الاجتماعي
        (CNSS وCNRPS وCNAM) المعتمَد بأمر سنة 2022: نظام ذو طبيعة خاصّة، لا هو
        نظام أساسي عام ولا اتفاقية مشتركة عامة.
      synonymes: []

  - id: forces-de-securite-interieure
    acronyme: null
    statut: provisoire
    references: [loi82-70]
    source_definition: {ref: loi82-70}
    voir_aussi: [regime-statutaire-autonome, statut-particulier, pensions-civiles-militaires]
    fr:
      terme: Forces de sécurité intérieure
      definition: >
        Corps chargés du maintien de l'ordre et de la sécurité publique, dotés
        d'un statut spécial distinct du statut général de la fonction publique
        (loi n°82-70 du 6 août 1982). Ce statut couvre les agents de la sûreté
        nationale, de la garde nationale, de la protection civile ainsi que des
        services des prisons et de la rééducation.
      synonymes: []
    ar:
      terme: قوات الأمن الداخلي
      definition: >
        الأسلاك المكلّفة بحفظ النظام والأمن العام، التي تتمتّع بنظام أساسي خاصّ
        مستقلّ عن النظام الأساسي العام للوظيفة العمومية (القانون عدد 82-70
        المؤرّخ في 6 أوت 1982). ويشمل هذا النظام أعوان الأمن الوطني والحرس
        الوطني والحماية المدنية وكذلك مصالح السجون والإصلاح.
      synonymes: []

  - id: convention-collective-sectorielle
    acronyme: null
    statut: provisoire
    references: [loi85-78]
    voir_aussi: [regime-conventionnel-public, convention-collective-banques, entreprises-publiques, epic]
    fr:
      terme: Convention collective sectorielle
      definition: >
        Accord négocié entre employeurs et organisations syndicales, fixant les
        conditions d'emploi et de rémunération (classification des emplois,
        grilles, primes) pour un secteur d'activité donné. Dans le secteur public
        non administratif, elle constitue le fondement du régime conventionnel
        (code du travail ; loi n°85-78).
      synonymes: []
    ar:
      terme: الاتفاقية المشتركة القطاعية
      definition: >
        اتفاق متفاوَض عليه بين الأعراف والمنظمات النقابية، يضبط شروط الشغل
        والتأجير (تصنيف المواطن الشغلية والسلالم والمنح) لقطاع نشاط معيَّن. وفي
        القطاع العام غير الإداري، تُشكّل أساس النظام الاتفاقي (مجلة الشغل؛ القانون
        عدد 85-78).
      synonymes: []

  - id: convention-collective-banques
    acronyme: null
    statut: valide
    references: [cc-banques-2014, loi2016-48]
    source_definition: {ref: cc-banques-2014}
    source_traduction: {ref: cc-banques-2014}
    voir_aussi: [convention-collective-sectorielle, regime-marche-controle, cnss]
    fr:
      terme: Convention collective sectorielle des banques et établissements financiers
      definition: >
        Convention collective de droit commun du travail régissant la
        classification des emplois et la rémunération des agents des banques et
        établissements financiers, publics comme privés, agréée par arrêté du
        ministre des Affaires sociales en application du Code du travail. Sa
        lignée remonte à un agrément de 1975 ; la version en vigueur est la
        convention révisée agréée par arrêté du 17 février 2014, complétée par
        des avenants successifs. Une convention sectorielle unique couvrant
        indistinctement banques publiques et privées est la marque documentaire
        de l'autonomie salariale « proche du privé » du régime de marché
        contrôlé.
      synonymes: [convention collective des banques]
    ar:
      terme: الاتفاقية المشتركة القطاعية لأعوان البنوك والمؤسسات المالية
      definition: >
        اتفاقية مشتركة من القانون العام للشغل تضبط تصنيف المواطن الشغلية وتأجير
        أعوان البنوك والمؤسسات المالية، العمومية منها والخاصة، مصادَق عليها بقرار
        من وزير الشؤون الاجتماعية تطبيقًا لمجلة الشغل. تعود نشأتها إلى مصادقة سنة
        1975؛ والنسخة السارية هي الاتفاقية المنقَّحة المصادَق عليها بقرار مؤرَّخ
        في 17 فيفري 2014، المستكمَلة بملاحق متتالية. ووجودُ اتفاقية قطاعية وحيدة
        تشمل دون تمييز البنوك العمومية والخاصة هو العلامة الوثائقية على
        الاستقلالية الأجرية «القريبة من القطاع الخاص» لنظام السوق الموجَّه.
      synonymes: []

  - id: remuneration-dirigeants-entreprises-publiques
    acronyme: null
    statut: valide
    references: [decret2015-2217, decret90-1855]
    source_definition: {ref: decret2015-2217}
    source_traduction: {ref: decret2015-2217}
    voir_aussi: [regime-marche-controle, entreprises-publiques, regime-conventionnel-public]
    fr:
      terme: Rémunération des dirigeants d'entreprises publiques
      definition: >
        Rémunération des chefs d'établissements et entreprises publics et de
        sociétés à majorité publique — y compris les banques à majorité publique
        — encadrée et plafonnée par voie réglementaire au titre des prérogatives
        de l'État actionnaire. Le texte en vigueur est le décret n°2015-2217 du
        11 décembre 2015 fixant les taux des éléments de cette rémunération ; il
        s'inscrit dans une chaîne réglementaire continue (décrets n°78-885,
        n°90-1855, n°2014-12). Ce plafonnement constitue le versant « contrôle »
        du régime de marché contrôlé, par contraste avec l'autonomie
        conventionnelle de marché des agents.
      synonymes: []
    ar:
      terme: تأجير رؤساء المؤسسات والمنشآت العمومية
      definition: >
        تأجير رؤساء المؤسسات والمنشآت العمومية والشركات ذات الأغلبية العمومية —
        بما في ذلك البنوك ذات الأغلبية العمومية — المضبوط والمسقَّف عن طريق
        التنظيم بعنوان صلاحيات الدولة المساهمة. والنصّ الساري هو الأمر الحكومي
        عدد 2015-2217 المؤرّخ في 11 ديسمبر 2015 الذي يضبط نسب عناصر هذا التأجير؛
        وهو يندرج ضمن سلسلة تنظيمية متّصلة (الأوامر عدد 78-885 وعدد 90-1855 وعدد
        2014-12). ويشكّل هذا التسقيف الشقَّ «الرقابي» من نظام السوق الموجَّه، في
        مقابل الاستقلالية الاتفاقية السوقية لأعوانها.
      synonymes: []

  - id: regime-conventionnel-public
    acronyme: null
    statut: provisoire
    references: [loi85-78, loi89-9]
    source_definition: {ref: loi85-78}
    voir_aussi: [entreprises-publiques, epic, convention-collective-sectorielle, statut-particulier]
    fr:
      terme: Régime conventionnel public
      definition: >
        Régime de rémunération des entreprises publiques non financières, fondé
        sur des conventions collectives, une négociation salariale et une
        classification des emplois.
      synonymes: []
    ar:
      terme: النظام الاتفاقي العمومي
      definition: >
        نظام تأجير المنشآت العمومية غير المالية، يقوم على الاتفاقيات المشتركة
        والتفاوض الأجري وتصنيف المواطن الشغلية.
      synonymes: []

  - id: regime-marche-controle
    acronyme: null
    statut: provisoire
    references: [loi89-9]
    voir_aussi: [entreprises-publiques, convention-collective-banques, remuneration-dirigeants-entreprises-publiques, regime-conventionnel-public, cnss]
    fr:
      terme: Régime de marché contrôlé
      definition: >
        Régime de rémunération des entreprises publiques financières (banques,
        assurances et institutions financières à capital public) et de certaines
        filiales, caractérisé par un double trait. Côté agents, l'autonomie
        salariale est forte : leur rémunération relève d'une convention
        collective sectorielle de droit commun commune aux établissements
        publics et privés, ce qui aligne les rémunérations de base sur le secteur
        financier privé. Côté dirigeants, l'État exerce ses prérogatives
        d'actionnaire et la rémunération des chefs d'entreprise est plafonnée par
        voie réglementaire. C'est cette articulation — autonomie conventionnelle
        de marché pour les agents, plafonnement réglementaire pour les dirigeants
        — qui justifie le qualificatif de « marché contrôlé ».
      synonymes: []
    ar:
      terme: نظام السوق الموجَّه
      definition: >
        نظام تأجير المنشآت العمومية المالية (البنوك والتأمين والمؤسسات المالية
        ذات رأس المال العمومي) وبعض الفروع، يتميّز بسمة مزدوجة. فمن جهة الأعوان،
        تكون الاستقلالية الأجرية مرتفعة: إذ يخضع تأجيرهم لاتفاقية مشتركة قطاعية
        من القانون العام مشتركة بين المؤسسات العمومية والخاصة، ممّا يحاذي الأجور
        الأساسية بالقطاع المالي الخاص. ومن جهة الرؤساء، تمارس الدولة صلاحياتها
        بوصفها مساهمة ويُسقَّف تأجير رؤساء المؤسسات عن طريق التنظيم. وهذا
        التمفصُل — استقلالية اتفاقية سوقية للأعوان وتسقيف تنظيمي للرؤساء — هو ما
        يبرّر وصف «السوق الموجَّه».
      synonymes: []

  - id: point-indice
    acronyme: null
    statut: provisoire
    references: [decret-2007-268]
    voir_aussi: [regime-indiciaire, traitement-de-base, grille-des-salaires, chiffre-indiciaire]
    fr:
      terme: Valeur du point d'indice
      definition: >
        Notion héritée du modèle français de carrière, NON OPÉRANTE en droit
        positif tunisien actuel. À la différence du système français, aucun
        texte en vigueur ne publie de « valeur du point » qui, multipliée par
        un indice, déterminerait le traitement de base : ce sont les grilles
        annexées aux décrets qui fixent les montants directement en dinars
        (cf. décret n°2007-268, art. 2 bis). Le terme subsiste dans le
        vocabulaire et dans certains décrets de classement.
      synonymes: [point d'indice]
    ar:
      terme: قيمة النقطة الاستدلالية
      definition: >
        مفهوم موروث عن النموذج الفرنسي للمسار المهني، غير معمولٍ به في القانون
        الوضعي التونسي الحالي. فخلافًا للنظام الفرنسي، لا ينشر أيّ نصّ ساري
        المفعول «قيمةً للنقطة» تُضرب في رقم استدلالي لتحديد المرتب الأساسي: بل
        إنّ الشبكات المُلحقة بالأوامر هي التي تضبط المبالغ مباشرة بالدينار
        (انظر الأمر عدد 2007-268، الفصل 2 مكرّر). ولا يزال المصطلح قائمًا في
        المصطلحات وفي بعض أوامر التصنيف.
      synonymes: []

  - id: traitement-de-base
    acronyme: null
    statut: valide
    references: [decret-97-1832, decret-2007-268]
    source_definition: {ref: decret-2007-268, locator: "art. 2 bis"}
    source_traduction: {ref: decret-2007-268}
    voir_aussi: [regime-indiciaire, grille-des-salaires, point-indice, grade, echelon]
    fr:
      terme: Traitement de base
      definition: >
        Part principale de la rémunération d'un agent public du régime
        indiciaire, avant indemnités et primes. En droit positif tunisien, son
        montant mensuel est fixé directement en dinars, pour chaque couple
        grade × échelon, par les grilles annexées aux décrets (décret
        n°97-1832, puis décret n°2007-268, art. 2 bis), et non calculé à partir
        d'une valeur du point d'indice.
      synonymes: []
    ar:
      terme: المرتب الأساسي
      definition: >
        الجزء الرئيسي من أجر العون العمومي الخاضع للنظام الاستدلالي، قبل المنح
        والمكافآت. وفي القانون الوضعي التونسي، يُضبَط مبلغه الشهري مباشرة
        بالدينار، لكلّ ثنائي رتبة × درجة، في الشبكات المُلحقة بالأوامر (الأمر
        عدد 97-1832 ثمّ الأمر عدد 2007-268، الفصل 2 مكرّر)، ولا يُحتسب انطلاقًا
        من قيمة نقطة استدلالية.
      synonymes: [الأجر الأساسي]

  - id: grade
    acronyme: null
    statut: valide
    references: [decret-99-12]
    source_definition: {ref: decret-99-12}
    voir_aussi: [echelon, categorie-de-grade, regime-indiciaire, traitement-de-base]
    fr:
      terme: Grade
      definition: >
        Position d'un agent dans la hiérarchie d'un corps, déterminant ses
        fonctions et, combinée à l'échelon, son traitement de base ; les grades
        sont organisés en catégories par le décret n°99-12. L'avancement de
        grade traduit une promotion.
      synonymes: []
    ar:
      terme: الرتبة
      definition: >
        موقع العون في التدرّج الهرمي للسلك، يحدّد وظائفه ويحدّد، مقترنًا
        بالدرجة، مرتبه الأساسي؛ وتُنظَّم الرتب في أصناف بمقتضى الأمر عدد 99-12.
        ويعبّر الترقّي في الرتبة عن ترقية.
      synonymes: []

  - id: echelon
    acronyme: null
    statut: valide
    references: [decret-2007-268]
    source_definition: {ref: decret-2007-268}
    voir_aussi: [grade, regime-indiciaire, traitement-de-base]
    fr:
      terme: Échelon
      definition: >
        Subdivision d'un grade traduisant l'ancienneté ; l'avancement
        d'échelon, par ancienneté, fait progresser l'agent dans son grade et
        relève le traitement de base correspondant au couple grade × échelon
        dans la grille.
      synonymes: []
    ar:
      terme: الدرجة
      definition: >
        تقسيم فرعي للرتبة يعبّر عن الأقدمية؛ ويُمكّن الترقّي في الدرجة، حسب
        الأقدمية، العونَ من التقدّم داخل رتبته ويرفع المرتب الأساسي المقابل
        لثنائي رتبة × درجة في الشبكة.
      synonymes: []

  - id: avancement-echelon
    acronyme: null
    statut: provisoire  # équivalent AR (الترقّي في الدرجة) à valider par un locuteur — cf. issue #77
    references: [loi83-112]
    source_definition: {ref: loi83-112, locator: "art. 23-24"}
    voir_aussi: [regime-indiciaire, echelon, grade, traitement-de-base]
    fr:
      terme: Avancement d'échelon
      definition: >
        Progression d'un agent à l'échelon immédiatement supérieur de son grade.
        Dans le régime indiciaire, l'avancement d'échelon est automatique : il
        s'opère selon les cadences fixées par les statuts particuliers de chaque
        corps (loi n°83-112 portant statut général, art. 23 et 24).
      synonymes: []
    ar:
      terme: الترقّي في الدرجة
      definition: >
        تقدّم العون إلى الدرجة الأعلى مباشرةً ضمن رتبته. وفي النظام الاستدلالي
        للتأجير، يكون الترقّي في الدرجة آليًّا: إذ يتمّ وفق الإيقاعات التي تضبطها
        الأنظمة
        الأساسية الخاصّة بكلّ سلك (القانون عدد 83-112 المتعلّق بالنظام الأساسي
        العام، الفصلان 23 و24).
      synonymes: []

  - id: categorie-de-grade
    acronyme: null
    statut: valide
    references: [decret-99-12, decret-2003-2338]
    source_definition: {ref: decret-99-12}
    source_traduction: {ref: decret-99-12}
    voir_aussi: [grade, echelon, regime-indiciaire, grille-des-salaires]
    fr:
      terme: Catégorie de grade
      definition: >
        Classement hiérarchique des grades de la fonction publique fixé par le
        décret n°99-12 du 4 janvier 1999 (modifié), qui répartit les grades en
        quatre catégories A, B, C et D selon le niveau de diplôme exigé au
        recrutement par concours externe ; ce classement sert de support à la
        grille de traitement de base.
        La catégorie A (art. 2) comprend trois sous-catégories : A1, recrutement
        au niveau du mastère au moins, ou du diplôme national d'ingénieur, ou
        équivalent (les anciens diplômes de troisième cycle — DEA/DESS —
        antérieurs à la réforme LMD restent admis ; sous-catégorie réécrite par
        le décret n°2003-2338 du 11 novembre 2003) (usuellement conception,
        cadres supérieurs) ; A2, niveau de la maîtrise au moins ou équivalent ; A3,
        niveau du premier cycle de l'enseignement supérieur au moins ou
        équivalent (A2 et A3 usuellement encadrement). La catégorie B (art. 3)
        correspond au baccalauréat au moins ou équivalent (usuellement
        maîtrise). La catégorie C (art. 4) correspond au cycle primaire achevé
        et à la 6ᵉ année secondaire au moins, ou au diplôme de fin d'études de
        l'enseignement de base et à la 3ᵉ année secondaire. La catégorie D
        (art. 5) correspond au cycle primaire achevé et à la 3ᵉ année secondaire
        au moins, ou au diplôme de fin d'études de l'enseignement de base (C et D
        usuellement exécution). Les diplômes de formation homologués au niveau
        requis sont admis dans chaque catégorie.
      synonymes: []
    ar:
      terme: صنف الرتبة
      definition: >
        تصنيف هرمي لرتب الوظيفة العمومية يُضبَط بمقتضى الأمر عدد 99-12 المؤرّخ في
        4 جانفي 1999 (المنقَّح)، يوزّع الرتب على أربعة أصناف A وB وC وD حسب مستوى
        الشهادة المطلوبة عند الانتداب عن طريق المناظرة الخارجية؛ ويُتّخذ هذا
        التصنيف أساسًا لشبكة المرتّب الأساسي.
        يشمل الصنف A (الفصل 2) ثلاثة أصناف فرعية: A1، الانتداب في مستوى الماجستير
        على الأقلّ، أو الشهادة الوطنية للمهندس، أو ما يعادلها (مع قبول شهادات
        الدراسات العليا في المرحلة الثالثة — الدراسات المعمّقة والدراسات المعمّقة
        المتخصّصة — السابقة لإصلاح نظام «إجازة-ماجستير-دكتوراه»؛ صنف فرعي أُعيدت
        صياغته بمقتضى الأمر عدد 2003-2338 المؤرّخ في 11 نوفمبر 2003) (عادةً
        التصوّر والإطارات العليا)؛ A2، مستوى الأستاذية على الأقلّ أو ما
        يعادلها؛ A3، مستوى المرحلة الأولى من التعليم العالي على الأقلّ أو ما
        يعادلها (A2 وA3 عادةً التأطير). ويقابل الصنف B (الفصل 3) شهادة الباكالوريا
        على الأقلّ أو ما يعادلها (عادةً الكفاءة). ويقابل الصنف C (الفصل 4) إتمام
        المرحلة الابتدائية والسنة السادسة من التعليم الثانوي على الأقلّ، أو شهادة
        ختم التعليم الأساسي والسنة الثالثة من التعليم الثانوي. ويقابل الصنف D
        (الفصل 5) إتمام المرحلة الابتدائية والسنة الثالثة من التعليم الثانوي على
        الأقلّ، أو شهادة ختم التعليم الأساسي (C وD عادةً التنفيذ). وتُقبل في كلّ
        صنف شهادات التكوين المعادَلة للمستوى المطلوب.
      synonymes: []

  - id: grille-des-salaires
    acronyme: null
    statut: valide
    references: [decret-97-1832, decret-2007-268]
    source_definition: {ref: decret-2007-268, locator: "art. 2 bis"}
    source_traduction: {ref: decret-2007-268, locator: "art. 2 bis"}
    voir_aussi: [traitement-de-base, regime-indiciaire, grade, echelon, point-indice]
    fr:
      terme: Grille des salaires
      definition: >
        Barème, annexé aux décrets, fixant directement en dinars le traitement
        de base mensuel pour chaque couple grade × échelon. En droit positif
        tunisien, l'article 2 bis du décret n°2007-268 dispose que « la grille
        des salaires […] est fixée conformément aux annexes ci-jointes » : les
        montants sont arrêtés en annexes, et non calculés à partir d'un point
        d'indice.
      synonymes: [grille indiciaire]
    ar:
      terme: شبكة الأجور
      definition: >
        سُلَّمٌ مُلحَق بالأوامر، يضبط مباشرة بالدينار المرتبَ الأساسي الشهري
        لكلّ ثنائي رتبة × درجة. وفي القانون الوضعي التونسي، ينصّ الفصل 2 مكرّر
        من الأمر عدد 2007-268 على أنّ «شبكة الأجور […] تُضبَط وفقًا للملاحق
        المصاحبة»: فالمبالغ محدَّدة في الملاحق، لا محتسَبة انطلاقًا من نقطة
        استدلالية.
      synonymes: [الشبكة الاستدلالية]

  - id: echelonnement-indiciaire
    acronyme: null
    statut: provisoire
    references: [decret-60-328, decret-73-316, decret-99-12]
    voir_aussi: [categorie-de-grade, grade, echelon, regime-indiciaire, chiffre-indiciaire]
    fr:
      terme: Échelonnement indiciaire
      definition: >
        Classement hiérarchique des grades d'un corps les uns par rapport aux
        autres. Il était fixé, corps par corps, par une longue série de décrets
        « relatifs au classement hiérarchique et à l'échelonnement indiciaire »,
        qui attribuaient à chaque grade son chiffre indiciaire (au moins depuis
        le décret n°60-328 de 1960). Depuis 1998, ce classement situe chaque
        grade dans la grille de traitement de base sans recourir à une valeur du
        point d'indice.
      synonymes: [classement hiérarchique]
    ar:
      terme: التدرّج القياسي
      definition: >
        ترتيبٌ هرمي لرتب السلك بعضها بالنسبة إلى بعض. وقد كانت تضبطه، سلكًا
        سلكًا، سلسلةٌ طويلة من الأوامر «المتعلقة بالتصنيف الهرمي والتدرّج
        القياسي» التي تُسنِد لكلّ رتبة رقمها القياسي (منذ الأمر عدد 60-328
        لسنة 1960 على الأقلّ). ومنذ سنة 1998، يحدّد هذا الترتيب موقع كلّ رتبة
        في شبكة المرتّب الأساسي دون اللجوء إلى قيمة نقطة استدلالية.
      synonymes: [التصنيف الهرمي]

  - id: indemnite-specifique
    acronyme: null
    statut: provisoire
    references: [decret-2007-267]
    voir_aussi: [prime-de-rendement, traitement-de-base, regime-indiciaire]
    fr:
      terme: Indemnité spécifique
      definition: >
        Indemnité propre à chaque corps, s'ajoutant au traitement de base. La
        recomposition de 2007 (décret n°2007-267) a transféré une partie des
        indemnités spécifiques de corps vers le traitement de base, à effet du
        1ᵉʳ avril 2007.
      synonymes: []
    ar:
      terme: المنحة الخصوصية
      definition: >
        منحة خاصّة بكلّ سلك، تُضاف إلى المرتب الأساسي. وقد أحالت إعادة التركيب
        سنة 2007 (الأمر عدد 2007-267) جزءًا من المنح الخصوصية للأسلاك إلى
        المرتّب الأساسي، ابتداءً من غرّة أفريل 2007.
      synonymes: []

  - id: prime-de-rendement
    acronyme: null
    statut: provisoire
    references: []
    voir_aussi: [indemnite-specifique, traitement-de-base, regime-indiciaire]
    fr:
      terme: Prime de rendement
      definition: >
        Composante indemnitaire de la rémunération du régime indiciaire,
        s'ajoutant au traitement de base et aux indemnités spécifiques ; ces
        composantes sont souvent exclusives les unes des autres.
      synonymes: []
    ar:
      terme: منحة المردودية
      definition: >
        مكوّن مِنَحي من أجر النظام الاستدلالي، يُضاف إلى المرتب الأساسي وإلى
        المنح الخصوصية؛ وكثيرًا ما تكون هذه المكوّنات متنافية فيما بينها.
      synonymes: []

  - id: retenue-a-la-source
    acronyme: null
    statut: valide
    references: [loi-irpp-is-1989]
    source_definition: {ref: loi-irpp-is-1989}
    voir_aussi: [irpp, css, traitement-de-base]
    fr:
      terme: Retenue à la source
      definition: >
        Prélèvement de l'impôt opéré par l'employeur, lors du paiement du
        traitement et des indemnités imposables, au titre de l'impôt sur le
        revenu des personnes physiques (code de l'IRPP et de l'IS, loi
        n°89-114). Le montant retenu est reversé au Trésor et imputé sur
        l'impôt dû par l'agent.
      synonymes: []
    ar:
      terme: الخصم من المورد
      definition: >
        اقتطاع للضريبة يقوم به المؤجِّر، عند دفع المرتب والمنح الخاضعة للضريبة،
        بعنوان الضريبة على دخل الأشخاص الطبيعيين (مجلة الضريبة على الدخل
        والضريبة على الشركات، القانون عدد 89-114). ويُدفَع المبلغ المخصوم
        للخزينة ويُحتسَب على الضريبة المستوجَبة على العون.
      synonymes: []

  - id: masse-salariale
    acronyme: null
    statut: provisoire
    references: [imf-tunisia-art4-2020, wb-tunisia-per-2020]
    voir_aussi: [secteur-public, fonction-publique, administrations-publiques, fonds-de-securite-sociale, emploi-public]
    fr:
      terme: Masse salariale
      definition: >
        Total des rémunérations versées aux agents, charges sociales
        comprises. Sa mesure dépend étroitement du périmètre retenu —
        administration centrale, fonction publique, ou secteur public
        consolidé (administration centrale, collectivités locales, entreprises
        publiques et organismes de sécurité sociale) — et du dénominateur
        auquel on la rapporte : % du PIB, % des recettes ou % des dépenses
        de l'État. En Tunisie, seul l'agrégat d'administration centrale fait
        l'objet d'un suivi régulier ; aucun agrégat consolidé n'est
        publiquement documenté.
      synonymes: []
    ar:
      terme: كتلة الأجور
      definition: >
        مجموع الأجور المدفوعة للأعوان، بما في ذلك الأعباء الاجتماعية. يتوقّف
        قياسها بشكل وثيق على النطاق المعتمَد — الإدارة المركزية، أو الوظيفة
        العمومية، أو القطاع العام المُدمَج (الإدارة المركزية والجماعات المحلية
        والمنشآت العمومية وهياكل الضمان الاجتماعي) — وعلى المقام الذي تُنسب
        إليه: نسبة من الناتج المحلّي الإجمالي، أو من المداخيل، أو من نفقات
        الدولة. وفي تونس، لا يخضع للمتابعة المنتظمة سوى مجمَّع الإدارة المركزية؛
        ولا يوجد مجمَّع مُدمَج موثَّق علنًا.
      synonymes: []

  - id: fonds-de-securite-sociale
    acronyme: null
    statut: provisoire
    references: [sna2008, imfgfsm2014]
    source_definition: {ref: sna2008}
    voir_aussi: [administrations-publiques, cnss, cnrps, cnam]
    fr:
      terme: Fonds de sécurité sociale
      definition: >
        Sous-secteur des administrations publiques (comptes nationaux, SNA
        2008 / GFSM 2014) regroupant les unités gérant des régimes de sécurité
        sociale obligatoires. En Tunisie, les caisses sociales (CNSS, CNRPS,
        CNAM) y sont rattachées économiquement bien qu'elles soient
        juridiquement des EPNA.
      synonymes: []
    ar:
      terme: صناديق الضمان الاجتماعي
      definition: >
        قطاع فرعي من الإدارات العمومية (الحسابات الوطنية، SNA 2008 / GFSM
        2014) يضمّ الوحدات التي تدير أنظمة الضمان الاجتماعي الإجبارية. وفي
        تونس، تُرتبط صناديق الضمان الاجتماعي (CNSS وCNRPS وCNAM) بهذا القطاع
        اقتصاديًا رغم كونها قانونيًا مؤسسات عمومية لا تكتسي صبغة إدارية.
      synonymes: []

  - id: cotisations-sociales
    acronyme: null
    statut: valide
    references: []
    source_definition: {ref: loi60-30}
    voir_aussi: [cnss, cnrps, cnam]
    fr:
      terme: Cotisations sociales
      definition: >
        Prélèvements obligatoires assis sur les salaires, finançant les régimes
        de sécurité sociale (retraite, maladie, prestations familiales).
      synonymes: []
    ar:
      terme: المساهمات الاجتماعية
      definition: >
        اقتطاعات إجبارية على الأجور، تموّل أنظمة الضمان الاجتماعي (التقاعد،
        المرض، المنح العائلية).
      synonymes: []

  - id: css
    acronyme: CSS
    statut: valide
    references: [lf-2018]
    source_definition: {ref: lf-2018, locator: "art. 53"}
    voir_aussi: [irpp, cotisations-sociales, retenue-a-la-source]
    fr:
      terme: Contribution sociale de solidarité
      definition: >
        Prélèvement additionnel à l'impôt sur le revenu, affecté au financement
        des régimes de sécurité sociale.
      synonymes: [CSS]
    ar:
      terme: المساهمة الاجتماعية التضامنية
      definition: >
        اقتطاع إضافي على الضريبة على الدخل، مخصَّص لتمويل أنظمة الضمان
        الاجتماعي.
      synonymes: []

  - id: irpp
    acronyme: IRPP
    statut: valide
    references: [loi-irpp-is-1989]
    source_definition: {ref: loi-irpp-is-1989}
    voir_aussi: [bareme-irpp, taux-marginal, assiette-fiscale, css, retenue-a-la-source, revenu-annuel-net, regime-forfaitaire]
    fr:
      terme: Impôt sur le revenu des personnes physiques
      definition: >
        Impôt direct et progressif frappant le revenu net global des personnes
        physiques, retenu à la source sur les salaires (code de l'IRPP et de
        l'IS, loi n°89-114).
      synonymes: [IRPP]
    ar:
      terme: الضريبة على دخل الأشخاص الطبيعيين
      definition: >
        ضريبة مباشرة تصاعدية على الدخل الصافي الجملي للأشخاص الطبيعيين، تُخصم من
        المورد على الأجور.
      synonymes: []

  - id: assiette-fiscale
    acronyme: null
    statut: valide
    references: []
    source_definition: {ref: code-irpp-is-1990, locator: "art. 8"}
    voir_aussi: [irpp, taux-marginal]
    fr:
      terme: Assiette fiscale
      definition: >
        Base de calcul de l'impôt, c'est-à-dire le montant sur lequel s'applique
        le taux d'imposition après déductions et abattements.
      synonymes: []
    ar:
      terme: الوعاء الضريبي
      definition: >
        قاعدة احتساب الضريبة، أي المبلغ الذي تُطبَّق عليه نسبة الضريبة بعد
        الطرحات والتخفيضات.
      synonymes: []

  - id: taux-marginal
    acronyme: null
    statut: valide
    references: []
    source_definition: {ref: code-irpp-is-1990, locator: "art. 44 § I"}
    voir_aussi: [irpp, assiette-fiscale, bareme-irpp, tranche-de-revenu, taux-effectif-limite-superieure]
    fr:
      terme: Taux marginal
      definition: >
        Taux d'imposition applicable à la dernière tranche de revenu ; dans un
        barème progressif, il s'applique à l'euro (au dinar) supplémentaire.
      synonymes: []
    ar:
      terme: النسبة الحدية
      definition: >
        نسبة الضريبة المطبَّقة على آخر شريحة من الدخل؛ في جدول تصاعدي، تُطبَّق
        على الدينار الإضافي.
      synonymes: []

  - id: smig
    acronyme: SMIG
    statut: valide
    references: []
    source_definition: {ref: decret-2017-668-smig}
    voir_aussi: [condition-de-ressources]
    fr:
      terme: Salaire minimum interprofessionnel garanti
      definition: >
        Rémunération horaire ou mensuelle minimale légale applicable aux
        salariés des secteurs non agricoles.
      synonymes: [SMIG]
    ar:
      terme: الأجر الأدنى المضمون لمختلف المهن
      definition: >
        الحدّ الأدنى القانوني للأجر بالساعة أو بالشهر المطبَّق على أجراء
        القطاعات غير الفلاحية.
      synonymes: []

  - id: cnss
    acronyme: CNSS
    statut: valide
    references: []
    source_definition: {ref: loi60-30}
    voir_aussi: [cnrps, cnam, cotisations-sociales]
    fr:
      terme: Caisse nationale de sécurité sociale
      definition: >
        Organisme gérant les régimes de sécurité sociale des travailleurs du
        secteur privé ; établissement public à caractère non administratif sous
        tutelle du ministère des Affaires sociales.
      synonymes: [CNSS]
    ar:
      terme: الصندوق الوطني للضمان الاجتماعي
      definition: >
        هيكل يدير أنظمة الضمان الاجتماعي لعمّال القطاع الخاص؛ مؤسسة عمومية لا
        تكتسي صبغة إدارية تحت إشراف وزارة الشؤون الاجتماعية.
      synonymes: []

  - id: cnrps
    acronyme: CNRPS
    statut: valide
    references: [loi85-12]
    source_definition: {ref: loi85-12}
    voir_aussi: [cnss, cnam, cotisations-sociales, regime-indiciaire, pensions-civiles-militaires]
    fr:
      terme: Caisse nationale de retraite et de prévoyance sociale
      definition: >
        Organisme gérant les régimes de retraite et de prévoyance du secteur
        public ; établissement public à caractère non administratif sous tutelle
        du ministère des Affaires sociales.
      synonymes: [CNRPS]
    ar:
      terme: الصندوق الوطني للتقاعد والحيطة الاجتماعية
      definition: >
        هيكل يدير أنظمة التقاعد والحيطة الاجتماعية للقطاع العام؛ مؤسسة عمومية لا
        تكتسي صبغة إدارية تحت إشراف وزارة الشؤون الاجتماعية.
      synonymes: []

  - id: cnam
    acronyme: CNAM
    statut: valide
    references: []
    source_definition: {ref: loi2004-71, locator: "art. 7"}
    voir_aussi: [cnss, cnrps]
    fr:
      terme: Caisse nationale d'assurance maladie
      definition: >
        Organisme gérant le régime unifié d'assurance maladie (créé en 2004) ;
        établissement public à caractère non administratif sous tutelle du
        ministère des Affaires sociales.
      synonymes: [CNAM]
    ar:
      terme: الصندوق الوطني للتأمين على المرض
      definition: >
        هيكل يدير النظام الموحَّد للتأمين على المرض (أُحدث سنة 2004)؛ مؤسسة
        عمومية لا تكتسي صبغة إدارية تحت إشراف وزارة الشؤون الاجتماعية.
      synonymes: []

  - id: service-fait
    acronyme: null
    statut: valide
    references: [loi83-112, loi73-81]
    source_definition: {ref: loi83-112, locator: "art. 13"}
    source_traduction: {ref: loi83-112}
    voir_aussi: [traitement-de-base, regime-indiciaire, masse-salariale]
    fr:
      terme: Service fait
      definition: >
        Règle selon laquelle le droit à rémunération de l'agent public naît de
        l'exécution effective du service, et non de sa seule qualité d'agent.
        Posée par le statut général — les agents « ont droit, après service
        fait, à une rémunération » (loi n°83-112, art. 13) —, elle prolonge un
        principe général des finances publiques : aucun paiement ne peut être
        effectué qu'au véritable créancier justifiant de ses droits et pour
        l'acquittement d'un service fait (Code de la comptabilité publique,
        art. 41).
      synonymes: []
    ar:
      terme: قاعدة الخدمة المنجزة
      definition: >
        قاعدة مفادها أنّ حقّ العون العمومي في الأجر ينشأ عن الأداء الفعلي
        للخدمة، لا عن مجرّد صفته كعون. أقرّها النظام الأساسي العام — إذ
        «للأعوان الحقّ في أجر بعد أداء الخدمة» (القانون عدد 83-112، الفصل 13)
        — وهي امتداد لمبدإٍ عامّ في المالية العمومية: لا يُصرف أيّ دفع إلّا
        للدائن الحقيقي المثبت لحقوقه ومقابل خدمة منجزة (مجلة المحاسبة
        العمومية، الفصل 41).
      synonymes: [أداء الخدمة]

  - id: chiffre-indiciaire
    acronyme: null
    statut: provisoire
    references: [decret-73-316, decret-79-93, decret-60-328]
    voir_aussi: [point-indice, echelonnement-indiciaire, regime-indiciaire, traitement-de-base]
    fr:
      terme: Chiffre indiciaire
      definition: >
        Nombre affecté à chaque emploi ou grade dans le système de rémunération
        en vigueur avant 1998, et à partir duquel le traitement était calculé.
        Les décrets de « classement hiérarchique et échelonnement indiciaire »
        attribuaient l'indice, tandis que des décrets « fixant le traitement
        global annuel » lui donnaient sa valeur en dinars. Ce mécanisme de
        conversion a disparu avec le décret n°97-1832, sans que le régime cesse
        d'être appelé « indiciaire ».
      synonymes: [indice]
    ar:
      terme: الرقم القياسي
      definition: >
        عددٌ يُسنَد إلى كلّ خطّة أو رتبة في نظام التأجير الذي كان ساريًا قبل
        سنة 1998، ويُحتسَب على أساسه المرتّب. فأوامر «التصنيف الهرمي والتدرّج
        القياسي» كانت تُسنِد الرقم، في حين أنّ أوامر «ضبط المرتّب الجملي
        السنوي» كانت تحدّد قيمته بالدينار. وقد زالت آليّة التحويل هذه بمقتضى
        الأمر عدد 97-1832، دون أن يكفّ النظام عن تسميته «استدلاليًّا».
      synonymes: []

  - id: indemnite-compensatrice
    acronyme: null
    statut: valide
    references: [decret-97-1832, decret-97-2127]
    source_definition: {ref: decret-97-1832, locator: "art. 6"}
    source_traduction: {ref: decret-97-2127}
    voir_aussi: [traitement-de-base, indemnite-specifique, chiffre-indiciaire, promotion]
    fr:
      terme: Indemnité compensatrice
      definition: >
        Différentiel alloué lors du passage du calcul indiciaire à la grille en
        dinars de 1998, égal à l'écart entre l'ancienne rémunération de base de
        l'agent et l'échelon de la nouvelle grille auquel il est reclassé
        (décret n°97-1832, art. 6). Ce n'est pas un complément pérenne : elle est
        maintenue lors des avancements d'échelon mais cesse d'être servie en cas
        de promotion, de changement de grille ou au terme du dépassement du
        dernier échelon du grade, l'agent étant alors rangé au traitement
        immédiatement supérieur à la somme de son traitement et de son indemnité
        (décret n°97-2127, art. 1 et 2).
      synonymes: []
    ar:
      terme: المنحة التعويضية
      definition: >
        فارقٌ يُسنَد عند الانتقال من الاحتساب الاستدلالي إلى الشبكة المحرَّرة
        بالدينار لسنة 1998، يساوي الفرق بين الأجر الأساسي القديم للعون والدرجة
        التي أُعيد ترتيبه فيها ضمن الشبكة الجديدة (الأمر عدد 97-1832، الفصل 6).
        وهي ليست مكمّلًا دائمًا: إذ تُحافَظ عليها عند الترقية في الدرجة، لكنّها
        تنقطع عند الترقية في الرتبة أو عند تغيير الشبكة أو عند انتهاء مدّة
        تجاوز الدرجة الأخيرة من الرتبة، فيُرتَّب العون حينئذٍ في المرتّب
        الموالي مباشرةً لمجموع مرتّبه ومنحته (الأمر عدد 97-2127، الفصلان 1 و2).
      synonymes: []

  - id: agent-temporaire
    acronyme: null
    statut: provisoire
    references: [decret-73-316]
    voir_aussi: [fonction-publique, ouvrier-de-l-etat, chiffre-indiciaire]
    fr:
      terme: Agent temporaire
      definition: >
        Catégorie d'agents publics distincte des fonctionnaires titulaires et
        des ouvriers, dotée avant 1998 de sa propre chaîne de textes de
        classement et de rémunération (décret n°73-316), et faisant l'objet
        d'une grille distincte dans les barèmes postérieurs.
      synonymes: []
    ar:
      terme: العون الوقتي
      definition: >
        صنفٌ من الأعوان العموميين متميّز عن الموظفين المرسَّمين وعن العملة،
        كانت له قبل سنة 1998 سلسلة نصوص خاصّة به في التصنيف والتأجير (الأمر
        عدد 73-316)، وله شبكة مستقلّة في السلالم اللاحقة.
      synonymes: [الأعوان الوقتيون]

  - id: ouvrier-de-l-etat
    acronyme: null
    statut: provisoire
    references: [decret-73-384, decret-79-94]
    voir_aussi: [agent-temporaire, fonction-publique, chiffre-indiciaire]
    fr:
      terme: Ouvrier de l'État
      definition: >
        Agent public relevant du statut du personnel ouvrier de l'État, des
        collectivités publiques locales et des établissements publics à
        caractère administratif (décret n°73-384). Distincts des fonctionnaires
        depuis le statut des ouvriers permanents de 1956, les ouvriers ont
        toujours été rémunérés sur une grille propre ; ils sont classés par
        « unités » et apparaissent à ce titre dans les accords salariaux.
      synonymes: [personnel ouvrier]
    ar:
      terme: عامل الدولة
      definition: >
        عونٌ عمومي يخضع للنظام الأساسي لعملة الدولة والجماعات العمومية المحلية
        والمؤسسات العمومية ذات الصبغة الإدارية (الأمر عدد 73-384). وقد ظلّ
        العملة، المتميّزون عن الموظفين منذ النظام الأساسي لعملة الدولة
        القارّين لسنة 1956، يُؤجَّرون وفق شبكة خاصّة بهم؛ ويُصنَّفون في
        «وحدات» ويردون بهذه الصفة في الاتفاقيات الأجرية.
      synonymes: [العملة]

  - id: promotion
    acronyme: null
    statut: valide
    references: [loi83-112, loi97-83, decret-2007-268]
    source_definition: {ref: loi83-112, locator: "art. 28"}
    source_traduction: {ref: loi83-112}
    voir_aussi: [avancement-echelon, grade, echelon, traitement-de-base]
    fr:
      terme: Promotion
      definition: >
        Accession du fonctionnaire au grade immédiatement supérieur à celui
        dont il est titulaire (loi n°83-112, art. 28). Elle emprunte deux
        voies : le concours interne, l'examen professionnel ou le cycle de
        formation ; ou le choix, sur liste d'aptitude établie après
        consultation de la commission administrative paritaire. À la différence
        de l'avancement d'échelon, automatique et lié à l'ancienneté, la
        promotion fait intervenir la sélection et la manière de servir.
      synonymes: [avancement de grade]
    ar:
      terme: الترقية
      definition: >
        ارتقاء الموظّف إلى الرتبة الموالية مباشرةً للرتبة التي هو متحصّل عليها
        (القانون عدد 83-112، الفصل 28). وتتمّ بطريقتين: المناظرة الداخلية أو
        الامتحان المهني أو دورة التكوين؛ أو بالاختيار، على أساس قائمة كفاءة
        تُضبط بعد استشارة اللجنة الإدارية المتناصفة. وخلافًا للترقية في الدرجة
        التي تتمّ آليًّا حسب الأقدمية، تُدخل الترقية في الرتبة عنصر الانتقاء
        وطريقة أداء العمل.
      synonymes: [الترقية في الرتبة]

  - id: bareme-irpp
    acronyme: null
    statut: valide
    references: [code-irpp-is-1990, lf-2017, lf-2025]
    source_definition: {ref: code-irpp-is-1990, locator: "art. 44, § I"}
    source_traduction: {ref: lf-2017, locator: "art. 14"}
    voir_aussi: [irpp, tranche-de-revenu, taux-marginal, taux-effectif-limite-superieure, revenu-annuel-net]
    fr:
      terme: Barème de l'impôt sur le revenu
      definition: >
        Tableau qui associe à chaque tranche de revenu annuel net un taux
        d'imposition et selon lequel est liquidé l'impôt sur le revenu des
        personnes physiques. Il figure au paragraphe I de l'article 44 du code
        de l'IRPP et de l'IS et publie, à côté du taux de chaque tranche, le
        taux effectif à la limite supérieure de celle-ci.
      synonymes: [barème progressif]
    ar:
      terme: جدول الضريبة على الدخل
      definition: >
        جدول يُسند إلى كلّ شريحة من الدخل السنوي الصافي نسبةً للضريبة، وعلى
        أساسه تُحتسب الضريبة على دخل الأشخاص الطبيعيين. ويرد بالفقرة I من
        الفصل 44 من مجلة الضريبة على دخل الأشخاص الطبيعيين والضريبة على
        الشركات، ويُبيّن إلى جانب نسبة كلّ شريحة النسبة الفعلية في الحدّ
        الأقصى لتلك الشريحة.
      synonymes: []

  - id: tranche-de-revenu
    acronyme: null
    statut: valide
    references: [code-irpp-is-1990, lf-2017]
    source_definition: {ref: code-irpp-is-1990, locator: "art. 44, § I"}
    source_traduction: {ref: lf-2017, locator: "art. 14"}
    voir_aussi: [bareme-irpp, taux-marginal, taux-effectif-limite-superieure]
    fr:
      terme: Tranche
      definition: >
        Segment du revenu annuel net délimité par deux seuils exprimés en
        dinars, auquel le barème applique un taux d'imposition propre. Le
        barème étant progressif, chaque tranche n'est imposée qu'à hauteur de
        la fraction de revenu qu'elle contient.
      synonymes: [tranche de revenu, tranche d'imposition]
    ar:
      terme: شريحة
      definition: >
        جزء من الدخل السنوي الصافي محدّد بعتبتين بالدينار، يُطبّق عليه الجدول
        نسبةً خاصّة به. ولمّا كان الجدول تصاعديًّا، فإنّ كلّ شريحة لا تُوظّف
        عليها الضريبة إلاّ في حدود الجزء من الدخل الذي تشمله.
      synonymes: [شريحة من الدخل]

  - id: taux-effectif-limite-superieure
    acronyme: null
    statut: valide
    references: [code-irpp-is-1990, lf-2017, lf-2025]
    source_definition: {ref: code-irpp-is-1990, locator: "art. 44, § I"}
    source_traduction: {ref: lf-2017, locator: "art. 14"}
    voir_aussi: [bareme-irpp, taux-marginal, tranche-de-revenu]
    fr:
      terme: Taux effectif à la limite supérieure
      definition: >
        Rapport de l'impôt total dû au revenu, calculé au seuil supérieur d'une
        tranche. Il mesure la charge réellement supportée, par différence avec
        le taux marginal de la tranche. Particularité rare : cette colonne
        figure dans le texte de loi lui-même, au barème de l'article 44 § I.
      synonymes: [taux effectif]
    ar:
      terme: النسبة الفعلية في الحدّ الأقصى
      definition: >
        نسبة جملة الضريبة المستوجَبة إلى الدخل، محتسبةً عند الحدّ الأعلى
        للشريحة. وهي تقيس العبء المتحمَّل فعليًّا، خلافًا للنسبة الحدية
        للشريحة. ومن الخصائص النادرة أنّ هذا العمود يرد في نصّ القانون ذاته،
        ضمن جدول الفقرة I من الفصل 44.
      synonymes: []

  - id: revenu-annuel-net
    acronyme: null
    statut: valide
    references: [code-irpp-is-1990, lf-2014]
    source_definition: {ref: code-irpp-is-1990, locator: "art. 1"}
    source_traduction: {ref: lf-2014, locator: "art. 73"}
    voir_aussi: [bareme-irpp, assiette-fiscale, irpp, frais-professionnels]
    fr:
      terme: Revenu annuel net
      definition: >
        Revenu net global du contribuable pour une année donnée, après
        déduction des charges admises et application des abattements
        catégoriels et des déductions pour situation et charges de famille.
        C'est la grandeur à laquelle s'applique le barème de l'article 44 § I.
      synonymes: [revenu net global]
    ar:
      terme: الدخل السنوي الصافي
      definition: >
        الدخل الصافي الجملي للمطالب بالأداء بعنوان سنة معيّنة، بعد طرح الأعباء
        المقبولة وتطبيق الطرحات الصنفية والتخفيضات بعنوان الحالة والأعباء
        العائلية. وهو المقدار الذي يُطبَّق عليه جدول الفقرة I من الفصل 44.
      synonymes: []

  - id: minimum-impot
    acronyme: null
    statut: valide
    references: [code-irpp-is-1990, lf-2014]
    source_definition: {ref: code-irpp-is-1990, locator: "art. 44, § II"}
    source_traduction: {ref: lf-2014, locator: "art. 48"}
    voir_aussi: [irpp, bareme-irpp, regime-forfaitaire]
    fr:
      terme: Minimum d'impôt
      definition: >
        Montant plancher d'impôt annuel, calculé en pourcentage du chiffre
        d'affaires ou des recettes brutes, en deçà duquel l'impôt liquidé selon
        le barème ne peut descendre pour les activités commerciales et non
        commerciales (article 44 § II du code de l'IRPP et de l'IS).
      synonymes: []
    ar:
      terme: الضريبة الدنيا
      definition: >
        الحدّ الأدنى من الضريبة السنوية، المحتسَب بنسبة من رقم المعاملات أو من
        المقابيض الخام، والذي لا يمكن أن تنزل عنه الضريبة المحتسبة حسب الجدول
        بالنسبة إلى الأنشطة التجارية وغير التجارية (الفقرة II من الفصل 44 من
        مجلة الضريبة على دخل الأشخاص الطبيعيين والضريبة على الشركات).
      synonymes: []

  - id: regime-forfaitaire
    acronyme: null
    statut: valide
    references: [code-irpp-is-1990, lf-1993, lf-2014]
    source_definition: {ref: code-irpp-is-1990, locator: "art. 44, § IV"}
    source_traduction: {ref: lf-2014, locator: "art. 45"}
    voir_aussi: [regime-estimatif-optionnel, minimum-impot, irpp]
    fr:
      terme: Régime forfaitaire d'imposition
      definition: >
        Régime d'imposition des entreprises individuelles réalisant des
        bénéfices industriels et commerciaux dans un établissement unique, sous
        conditions d'activité et de chiffre d'affaires : l'impôt y est
        déterminé forfaitairement à partir du chiffre d'affaires annuel, et non
        du bénéfice réel. Institué au § IV de l'article 44 du code, il a été
        transféré aux articles 44 bis à 44 sexies.
      synonymes: [régime forfaitaire]
    ar:
      terme: النظام التقديري
      definition: >
        نظام توظيف الضريبة على المؤسسات الفردية التي تحقّق أرباحًا صناعية
        وتجارية في إطار مقرّ وحيد، ضمن شروط تتعلّق بالنشاط وبرقم المعاملات:
        تُضبط فيه الضريبة تقديريًّا على أساس رقم المعاملات السنوي لا على أساس
        الربح الحقيقي. أُحدث بالفقرة IV من الفصل 44 من المجلة ثمّ نُقل إلى
        الفصول من 44 مكرّر إلى 44 سادسا.
      synonymes: [نظام الضريبة التقديرية]

  - id: regime-estimatif-optionnel
    acronyme: null
    statut: provisoire
    references: [lf-2026]
    source_definition: {ref: lf-2026, locator: "art. 91"}
    voir_aussi: [regime-forfaitaire, irpp, minimum-impot]
    fr:
      terme: Régime estimatif optionnel
      definition: >
        Régime ouvert sur option, ajouté à l'article 44 ter du code par
        l'article 91 de la loi de finances pour 2026, aux contribuables dont le
        chiffre d'affaires annuel n'excède pas 100 000 dinars : l'impôt y est
        forfaitisé en deux classes (4 000 et 5 000 dinars par an, réduits de
        moitié dans les campagnes et villages) et libératoire dans la limite du
        chiffre d'affaires déclaré spontanément. Terme français provisoire :
        seul le texte arabe du JORT est publié à ce jour.
      synonymes: []
    ar:
      terme: النظام التقديري الاختياري
      definition: >
        نظام يُفتح بالاختيار، أُضيف إلى الفصل 44 ثالثا من المجلة بمقتضى الفصل
        91 من قانون المالية لسنة 2026، لفائدة المطالبين بالأداء الذين لا
        يتجاوز رقم معاملاتهم السنوي 100.000 دينار: تُضبط فيه الضريبة جزافيًّا
        في صنفين (4000 و5000 دينار سنويًّا، مع التخفيض إلى النصف في الأرياف
        والقرى) وتكون تحرّرية في حدود رقم المعاملات المصرّح به تلقائيًّا.
      synonymes: [نظام الضريبة التقديرية الاختيارية]

  - id: retribution-provisoire-accidentelle
    acronyme: null
    statut: valide
    references: [code-irpp-is-1990, lf-2017]
    source_definition: {ref: code-irpp-is-1990, locator: "art. 53, § II"}
    source_traduction: {ref: lf-2017, locator: "art. 14"}
    voir_aussi: [retenue-a-la-source, irpp, assiette-fiscale]
    fr:
      terme: Rétribution provisoire ou accidentelle
      definition: >
        Somme servie par l'employeur en sus du traitement et des indemnités
        régulières, soumise à une retenue à la source à taux propre sur son
        montant net. Depuis l'article 14 § 3 de la loi de finances pour 2017,
        le taux est de 20 % et la retenue n'est pas due lorsque le salaire
        annuel global net ne dépasse pas 5 000 dinars.
      synonymes: []
    ar:
      terme: الأجر الوقتي أو العرضي
      definition: >
        مبلغ يمنحه المؤجِّر علاوة على المرتب والمنح المنتظمة، ويخضع لخصم من
        المورد بنسبة خاصّة من مبلغه الصافي. ومنذ الفقرة 3 من الفصل 14 من قانون
        المالية لسنة 2017، حُدّدت النسبة بـ20 % ولا يُستوجب الخصم إذا كان
        الأجر السنوي الجملي الصافي لا يتجاوز 5000 دينار.
      synonymes: []

  - id: frais-professionnels
    acronyme: null
    statut: provisoire
    references: [code-irpp-is-1990, lf-2017]
    source_definition: {ref: code-irpp-is-1990, locator: "art. 26, § I"}
    voir_aussi: [revenu-annuel-net, assiette-fiscale, abattement-pensions]
    fr:
      terme: Frais professionnels
      definition: >
        Déduction forfaitaire opérée sur les traitements et salaires pour la
        détermination du revenu net, fixée à 10 % du reliquat après déduction
        des retenues sociales obligatoires. L'article 14 § 2 de la loi de
        finances pour 2017 en a plafonné le montant à 2 000 dinars par an.
      synonymes: [abattement de 10 % pour frais professionnels]
    ar:
      terme: المصاريف المهنية
      definition: >
        طرح جزافي يُجرى على المرتبات والأجور لتحديد الدخل الصافي، حُدّد بـ10 %
        من الباقي بعد طرح الاقتطاعات الاجتماعية الوجوبية. وقد حدّدت الفقرة 2
        من الفصل 14 من قانون المالية لسنة 2017 سقفه بـ2000 دينار سنويًّا.
      synonymes: []

  - id: abattement-pensions
    acronyme: null
    statut: valide
    references: [code-irpp-is-1990, lf-2026]
    source_definition: {ref: code-irpp-is-1990, locator: "art. 26, § II"}
    source_traduction: {ref: lf-2026, locator: "art. 56"}
    voir_aussi: [frais-professionnels, revenu-annuel-net, assiette-fiscale, irpp]
    fr:
      terme: Abattement sur les pensions et rentes viagères
      definition: >
        Réduction appliquée au montant brut des pensions et rentes viagères
        pour leur imposition, fixée à 25 % par le paragraphe II de l'article 26
        du code. L'article 56 de la loi de finances pour 2026 le porte
        progressivement à 30 % pour les revenus de 2027, 40 % pour 2028 et
        50 % pour 2029.
      synonymes: []
    ar:
      terme: الطرح بعنوان الجرايات والإيرادات العمرية
      definition: >
        تخفيض يُطبَّق على المبلغ الخام للجرايات والإيرادات العمرية بغرض توظيف
        الضريبة عليها، حُدّد بـ25 % بالفقرة II من الفصل 26 من المجلة. ويرفعه
        الفصل 56 من قانون المالية لسنة 2026 تدريجيًّا إلى 30 % بالنسبة إلى
        مداخيل 2027 و40 % بالنسبة إلى 2028 و50 % بالنسبة إلى 2029.
      synonymes: []

  # ------------------------------------------------------------------ prestations
  # Notions du livre « Prestations sociales ». Termes arabes repris des dossiers
  # documentaires (docs/notes/prestations-contributif.md §11 et
  # docs/notes/prestations-assistance.md §9), où chacun est rattaché à son texte.

  - id: prestations-familiales
    acronyme: null
    statut: valide
    references: [loi60-30, loi88-38]
    source_definition: {ref: loi60-30, locator: "art. 51"}
    voir_aussi: [allocation-familiale, majoration-salaire-unique, contribution-frais-creche, cnss]
    fr:
      terme: Prestations familiales
      definition: >
        Ensemble des trois prestations servies par les caisses au titre des enfants à
        charge : l'allocation familiale, la majoration pour salaire unique et la
        contribution aux frais de crèche. L'article 51 de la loi n° 60-30 en fixe la
        liste ; leur ouverture suppose une affiliation et un droit ouvert, non une
        condition de ressources.
      synonymes: []
    ar:
      terme: المنح العائلية
      definition: >
        مجموع المنح الثلاث التي تسندها الصناديق بعنوان الأبناء المتكفَّل بهم: المنحة
        العائلية ومنحة الأجر الوحيد والمساهمة في مصاريف رياض الأطفال. يضبط الفصل 51 من
        القانون عدد 30 لسنة 1960 قائمتها، ويتوقّف فتح الحقّ فيها على الانخراط لا على شرط
        الموارد.
      synonymes: []

  - id: allocation-familiale
    acronyme: null
    statut: valide
    references: [loi60-30, loi75-82, loi86-75, loi88-38]
    source_definition: {ref: loi60-30, locator: "art. 61"}
    voir_aussi: [prestations-familiales, enfant-a-charge, allocation-familiale-non-contributive]
    fr:
      terme: Allocation familiale
      definition: >
        Prestation trimestrielle servie par rang d'enfant, calculée en pourcentage d'une
        rémunération trimestrielle bornée. Le taux unique de 15 % de 1960 devient un
        barème dégressif par rang en 1976, et le nombre de rangs servis passe de quatre
        à trois en 1989.
      synonymes: []
    ar:
      terme: المنحة العائلية
      definition: >
        منحة ثلاثية تُسند حسب رتبة الطفل وتُحتسب بنسبة مئوية من أجر ثلاثي محدود بسقف.
        تحوّلت النسبة الموحّدة البالغة 15 % سنة 1960 إلى جدول تنازلي حسب الرتبة سنة
        1976، وانخفض عدد الرتب المشمولة من أربع إلى ثلاث سنة 1989.
      synonymes: []

  - id: majoration-salaire-unique
    acronyme: null
    statut: valide
    references: [loi80-36]
    source_definition: {ref: loi80-36, locator: "art. 65 bis"}
    voir_aussi: [prestations-familiales, allocation-familiale]
    fr:
      terme: Majoration pour salaire unique
      definition: >
        Majoration trimestrielle des prestations familiales, créée par la loi n° 80-36
        avec effet au 1^er^ mai 1980. Trois conditions cumulatives : des enfants à
        charge, un droit ouvert aux allocations familiales, et un conjoint n'exerçant
        aucune activité professionnelle — c'est cette dernière qui donne au dispositif
        son nom.
      synonymes: []
    ar:
      terme: منحة الأجر الوحيد
      definition: >
        زيادة ثلاثية في المنح العائلية أحدثها القانون عدد 36 لسنة 1980 ابتداء من غرّة
        ماي 1980. تُشترط فيها ثلاثة شروط مجتمعة: وجود أبناء متكفَّل بهم، وحقّ مفتوح في
        المنح العائلية، وقرين لا يمارس أيّ نشاط مهني، وهو الشرط الذي أخذت منه المنحة
        تسميتها.
      synonymes: []

  - id: contribution-frais-creche
    acronyme: null
    statut: valide
    references: [loi94-88, decret95-114]
    source_definition: {ref: loi94-88, locator: "art. 2-4"}
    voir_aussi: [prestations-familiales, smig]
    fr:
      terme: Contribution aux frais de crèche
      definition: >
        Contribution mensuelle versée directement à la crèche au titre des enfants de
        deux à trente-six mois des assurées sociales dont le revenu ne dépasse pas un
        plafond exprimé en multiples du salaire minimum. C'est le seul dispositif du
        bloc contributif dont le champ soit explicitement genré : la loi vise « les
        assurées sociales », le décret « la mère bénéficiaire ».
      synonymes: []
    ar:
      terme: المساهمة في مصاريف رياض الأطفال
      definition: >
        مساهمة شهرية تُدفع مباشرة إلى روضة الأطفال بعنوان أبناء المضمونات اجتماعيًّا
        الذين تتراوح أعمارهم بين شهرين وستّة وثلاثين شهرًا، شرط ألّا يتجاوز دخل الأمّ
        سقفًا محدّدًا بمضاعفات الأجر الأدنى. وهي الترتيب الوحيد في الصنف المساهماتي الذي
        يقتصر ميدانه صراحة على النساء.
      synonymes: []

  - id: indemnite-journaliere
    acronyme: null
    statut: valide
    references: [loi60-30, loi94-28]
    source_definition: {ref: loi60-30, locator: "art. 77"}
    voir_aussi: [carence, stage-cotisation, accident-du-travail, salaire-journalier-moyen]
    fr:
      terme: Indemnité journalière
      definition: >
        Revenu de remplacement versé par jour d'arrêt de travail, calculé en fraction du
        salaire journalier moyen. Sa fraction et son délai de carence varient selon la
        branche : maladie au titre de la loi n° 60-30, accident du travail au titre de
        la loi n° 94-28, qui la porte aux deux tiers de la rémunération quotidienne
        habituelle.
      synonymes: []
    ar:
      terme: التعويض اليومي
      definition: >
        دخل تعويضي يُصرف عن كلّ يوم انقطاع عن العمل ويُحتسب بجزء من الأجر اليومي
        المتوسّط. يختلف هذا الجزء وتختلف فترة الانتظار باختلاف الفرع: المرض بمقتضى
        القانون عدد 30 لسنة 1960، وحوادث الشغل بمقتضى القانون عدد 28 لسنة 1994 الذي
        يرفعه إلى ثلثي الأجر اليومي المعتاد.
      synonymes: []

  - id: carence
    acronyme: null
    statut: valide
    references: [loi60-30, loi94-28]
    source_definition: {ref: loi60-30, locator: "art. 72"}
    voir_aussi: [indemnite-journaliere, stage-cotisation]
    fr:
      terme: Délai de carence
      definition: >
        Nombre de jours d'arrêt non indemnisés à l'ouverture du droit. Il est de vingt
        jours en maladie ordinaire et de trois jours pour les affections de longue durée
        sous la loi n° 60-30 ; de trois jours en accident du travail, sauf
        hospitalisation ou gravité prouvée.
      synonymes: []
    ar:
      terme: فترة الانتظار
      definition: >
        عدد أيّام الانقطاع غير المشمولة بالتعويض عند فتح الحقّ. وهي عشرون يومًا في المرض
        العادي وثلاثة أيّام في الأمراض طويلة المدى بمقتضى القانون عدد 30 لسنة 1960،
        وثلاثة أيّام في حوادث الشغل ما لم يقع الإيواء بالمستشفى أو تثبت الخطورة.
      synonymes: []

  - id: stage-cotisation
    acronyme: null
    statut: valide
    references: [loi60-30, decret95-1166]
    source_definition: {ref: loi60-30, locator: "art. 71 et 78"}
    voir_aussi: [indemnite-journaliere, cotisations-sociales, carence]
    fr:
      terme: Stage de cotisation
      definition: >
        Durée minimale d'affiliation et de cotisation exigée avant qu'une prestation
        puisse être servie. C'est le maillon qui distingue une prestation contributive
        d'une prestation d'assistance : le droit s'achète par un passé de cotisations,
        non par un niveau de ressources.
      synonymes: []
    ar:
      terme: مدة الانخراط الدنيا
      definition: >
        المدّة الدنيا من الانخراط ودفع المساهمات المطلوبة قبل إمكان إسناد المنفعة. وهي
        الحلقة التي تميّز المنفعة المساهماتية عن منفعة المساعدة: إذ يُكتسب الحقّ بماضٍ
        من المساهمات لا بمستوى الموارد.
      synonymes: []

  - id: indemnite-de-deces
    acronyme: null
    statut: valide
    references: [loi60-30]
    source_definition: {ref: loi60-30, locator: "art. 83-87"}
    voir_aussi: [capital-deces, ayant-droit]
    fr:
      terme: Indemnité de décès
      definition: >
        Somme versée aux ayants droit au décès du travailleur ou d'un membre de sa
        famille, exprimée en multiples de l'indemnité journalière : cent vingt fois pour
        le travailleur lui-même, et selon un barème dégressif par âge pour les autres
        membres du foyer.
      synonymes: []
    ar:
      terme: منحة الوفاة
      definition: >
        مبلغ يُسند لذوي الحقّ عند وفاة العامل أو أحد أفراد عائلته، ويُعبَّر عنه بمضاعفات
        التعويض اليومي: مائة وعشرون مرّة بالنسبة إلى العامل نفسه، ووفق جدول تنازلي حسب
        السنّ لبقية أفراد الأسرة.
      synonymes: []

  - id: capital-deces
    acronyme: null
    statut: valide
    references: [decret93-308]
    source_definition: {ref: decret93-308}
    voir_aussi: [indemnite-de-deces, cnrps, ayant-droit]
    fr:
      terme: Capital-décès
      definition: >
        Équivalent du secteur public de l'indemnité de décès, servi par la Caisse
        nationale de retraite et de prévoyance sociale. Il s'exprime en pourcentage de
        la rémunération annuelle de référence, décroissant avec l'âge du retraité au
        décès.
      synonymes: []
    ar:
      terme: رأس مال الوفاة
      definition: >
        نظير منحة الوفاة في القطاع العام، يُسنده الصندوق الوطني للتقاعد والحيطة
        الاجتماعية. ويُعبَّر عنه بنسبة مئوية من الأجر السنوي المرجعي تتناقص مع تقدّم سنّ
        المتقاعد عند الوفاة.
      synonymes: []

  - id: accident-du-travail
    acronyme: null
    statut: valide
    references: [loi94-28]
    source_definition: {ref: loi94-28, locator: "art. 3"}
    voir_aussi: [rente-accident-travail, indemnite-journaliere, cnam]
    fr:
      terme: Accident du travail
      definition: >
        Fait générateur de la branche de réparation régie par la loi n° 94-28 : soins
        servis dès l'information de la caisse, indemnité journalière pendant
        l'incapacité temporaire, puis rente ou capital en cas d'incapacité permanente.
      synonymes: []
    ar:
      terme: حادث شغل
      definition: >
        الواقعة المنشئة لفرع جبر الضرر الذي ينظّمه القانون عدد 28 لسنة 1994: إسداء
        العلاج بمجرّد إعلام الصندوق، وتعويض يومي طيلة العجز الوقتي، ثمّ إيراد أو رأس مال
        عند العجز الدائم.
      synonymes: []

  - id: rente-accident-travail
    acronyme: null
    statut: valide
    references: [loi94-28]
    source_definition: {ref: loi94-28, locator: "art. 39 et s."}
    voir_aussi: [accident-du-travail, ayant-droit]
    fr:
      terme: Rente d'accident du travail
      definition: >
        Revenu périodique servi au titre d'une incapacité permanente, converti en
        capital en dessous de quinze pour cent d'incapacité et majoré en cas de recours
        à une tierce personne. Une rente de survivants est servie au conjoint et aux
        orphelins.
      synonymes: []
    ar:
      terme: إيراد حادث الشغل
      definition: >
        دخل دوري يُسند بعنوان العجز الدائم، يُحوَّل إلى رأس مال دون نسبة خمسة عشر
        بالمائة من العجز ويُرفَّع عند الحاجة إلى مساعدة الغير. ويُسند إيراد للباقين على
        قيد الحياة لفائدة القرين واليتامى.
      synonymes: []

  - id: ayant-droit
    acronyme: null
    statut: valide
    references: [loi2004-71]
    source_definition: {ref: loi2004-71, locator: "art. 4"}
    voir_aussi: [assure-social, indemnite-de-deces, capital-deces]
    fr:
      terme: Ayant droit
      definition: >
        Personne qui tient son droit à prestations de son lien avec un assuré social, et
        non d'une affiliation propre : conjoint, enfants à charge, et selon les cas
        ascendants.
      synonymes: []
    ar:
      terme: ذو الحقّ
      definition: >
        الشخص الذي يستمدّ حقّه في المنافع من صلته بمضمون اجتماعي لا من انخراط خاصّ به:
        القرين والأبناء المتكفَّل بهم، والأصول في بعض الحالات.
      synonymes: []

  - id: assure-social
    acronyme: null
    statut: valide
    references: [loi2004-71]
    source_definition: {ref: loi2004-71, locator: "art. 4"}
    voir_aussi: [ayant-droit, cnss, cnrps, cnam]
    fr:
      terme: Assuré social
      definition: >
        Personne affiliée à l'un des régimes de sécurité sociale à raison de son
        activité, et qui ouvre de ce fait des droits pour elle-même et pour ses ayants
        droit.
      synonymes: []
    ar:
      terme: المضمون الاجتماعي
      definition: >
        الشخص المنخرط في أحد أنظمة الضمان الاجتماعي بحكم نشاطه، والذي يفتح بذلك حقوقًا
        لنفسه ولذوي حقّه.
      synonymes: []

  - id: enfant-a-charge
    acronyme: null
    statut: valide
    references: [loi60-30, loi96-65]
    source_definition: {ref: loi60-30, locator: "art. 53"}
    voir_aussi: [allocation-familiale, prestations-familiales]
    fr:
      terme: Enfant à charge
      definition: >
        Notion qui commande l'ouverture des prestations familiales. Les bornes d'âge de
        l'article 53 de la loi n° 60-30 ont été relevées par la loi n° 96-65 : seize ans
        sans condition, vingt et un ans en cas de scolarité, sans limite en cas
        d'infirmité ou de maladie incurable.
      synonymes: []
    ar:
      terme: الطفل المتكفَّل به
      definition: >
        مفهوم يتحكّم في فتح الحقّ في المنح العائلية. وقد رفع القانون عدد 65 لسنة 1996
        حدود السنّ الواردة بالفصل 53 من القانون عدد 30 لسنة 1960: ستّة عشر عامًا دون
        شرط، وواحد وعشرون عامًا في صورة الدراسة، ودون تحديد في صورة العجز أو المرض
        العضال.
      synonymes: []

  - id: indemnite-perte-emploi
    acronyme: null
    statut: valide
    references: [loi96-101]
    source_definition: {ref: loi96-101}
    voir_aussi: [assure-social, cnss]
    fr:
      terme: Indemnité pour perte d'emploi
      definition: >
        Prestation servie au salarié privé de son emploi pour un motif économique ou
        technique. Elle n'est ouverte qu'à une partie des régimes, ce qui en fait la
        branche la plus inégalement distribuée du système contributif tunisien.
      synonymes: []
    ar:
      terme: منحة فقدان الشغل
      definition: >
        منفعة تُسند إلى الأجير الذي فقد شغله لسبب اقتصادي أو فنّي. ولا تُفتح إلّا في بعض
        الأنظمة، ممّا يجعلها الفرع الأكثر تفاوتًا في التوزيع داخل المنظومة المساهماتية
        التونسية.
      synonymes: []

  - id: pnafn
    acronyme: PNAFN
    statut: valide
    references: [loi-86-83-lfr-1986, arrete-2024-07-10-allocation-pauvres]
    source_definition: {ref: arrete-2024-07-10-allocation-pauvres, locator: "art. 1"}
    voir_aussi: [amen-social, amg1, condition-de-ressources]
    fr:
      terme: Programme national d'aide aux familles nécessiteuses
      definition: >
        Programme d'assistance servant une allocation mensuelle aux familles sans
        ressources, apparu en 1986. Aucun texte publié ne le crée, n'en fixe l'objet ni
        l'éligibilité : il n'apparaît au *Journal officiel* qu'en qualité d'objet de
        dépense, et son montant n'a été énoncé par un texte qu'en 2024.
      synonymes: []
    ar:
      terme: البرنامج الوطني لمساعدة العائلات المعوزة
      definition: >
        برنامج مساعدة يُسند منحة شهرية إلى العائلات المعوزة، ظهر سنة 1986. ولا يوجد نصّ
        منشور يُحدثه أو يضبط موضوعه أو شروط الانتفاع به: إذ لا يرد بالرائد الرسمي إلّا
        بوصفه بابًا من أبواب الإنفاق، ولم يُصرَّح بمقداره في نصّ إلّا سنة 2024.
      synonymes: []

  - id: amen-social
    acronyme: null
    statut: valide
    references: [loi-amen-social-2019, decret-gouv-2020-317-amen]
    source_definition: {ref: loi-amen-social-2019, locator: "art. 1"}
    voir_aussi: [pnafn, transfert-monetaire, score-eligibilite, categories-pauvres]
    fr:
      terme: AMEN social
      definition: >
        Programme institué par la loi organique n° 2019-10, qui refonde l'assistance
        autour d'un ciblage par score, d'un transfert monétaire permanent et d'un accès
        aux soins. Il se superpose au programme national d'aide aux familles
        nécessiteuses sans l'abroger.
      synonymes: []
    ar:
      terme: برنامج الأمان الاجتماعي
      definition: >
        برنامج أحدثه القانون الأساسي عدد 10 لسنة 2019، أعاد بناء المساعدة الاجتماعية حول
        الاستهداف بالتنقيط والتحويل النقدي القارّ والنفاذ إلى العلاج. وهو يتراكب مع
        البرنامج الوطني لمساعدة العائلات المعوزة دون أن يلغيه.
      synonymes: []

  - id: categories-pauvres
    acronyme: null
    statut: valide
    references: [loi-amen-social-2019, decret-gouv-2020-317-amen]
    source_definition: {ref: loi-amen-social-2019, locator: "art. 2"}
    voir_aussi: [categories-revenu-limite, amen-social, score-eligibilite]
    fr:
      terme: Catégories pauvres
      definition: >
        Catégorie légale de bénéficiaires de l'AMEN social, définie par la loi organique
        n° 2019-10 à partir d'un revenu inférieur au seuil de pauvreté ou d'une
        situation de privation multidimensionnelle. Elle ouvre le transfert monétaire
        permanent.
      synonymes: []
    ar:
      terme: الفئات الفقيرة
      definition: >
        صنف قانوني من المنتفعين ببرنامج الأمان الاجتماعي، عرّفه القانون الأساسي عدد 10
        لسنة 2019 انطلاقًا من دخل دون خطّ الفقر أو من وضعية حرمان متعدّد الأبعاد. ويفتح
        هذا الصنف الحقّ في التحويل النقدي القارّ.
      synonymes: []

  - id: categories-revenu-limite
    acronyme: null
    statut: valide
    references: [loi-amen-social-2019]
    source_definition: {ref: loi-amen-social-2019, locator: "art. 2"}
    voir_aussi: [categories-pauvres, amen-social, amg2]
    fr:
      terme: Catégories à revenu limité
      definition: >
        Seconde catégorie légale de l'AMEN social, au-dessus des catégories pauvres.
        Elle n'ouvre pas le transfert monétaire permanent mais donne accès aux soins à
        tarif réduit et, depuis 2022, à l'allocation familiale non contributive.
      synonymes: []
    ar:
      terme: الفئات محدودة الدخل
      definition: >
        الصنف القانوني الثاني في برنامج الأمان الاجتماعي، ويأتي فوق الفئات الفقيرة. ولا
        يفتح الحقّ في التحويل النقدي القارّ، لكنّه يخوّل النفاذ إلى العلاج بالتعريفة
        المنخفضة، ومنذ سنة 2022 إلى المنحة العائلية غير المساهماتية.
      synonymes: []

  - id: condition-de-ressources
    acronyme: null
    statut: valide
    references: [decret-gouv-2020-317-amen, decret-98-409-amg2]
    source_definition: {ref: decret-gouv-2020-317-amen, locator: "art. 5"}
    voir_aussi: [ciblage, score-eligibilite, smig, amg2]
    fr:
      terme: Condition de ressources
      definition: >
        Plafond de revenu, exprimé en multiples du salaire minimum et modulé par la
        taille du ménage, dont le franchissement ferme le droit à une prestation
        d'assistance. C'est le pendant, côté non contributif, du stage de cotisation.
      synonymes: []
    ar:
      terme: شرط الموارد
      definition: >
        سقف للدخل يُعبَّر عنه بمضاعفات الأجر الأدنى ويتغيّر بحسب حجم الأسرة، ويُغلق
        تجاوزُه الحقَّ في منفعة المساعدة. وهو المقابل، في الجانب غير المساهماتي، لمدّة
        الانخراط الدنيا.
      synonymes: []

  - id: ciblage
    acronyme: null
    statut: valide
    references: [loi-amen-social-2019]
    source_definition: {ref: loi-amen-social-2019, locator: "art. 9"}
    voir_aussi: [score-eligibilite, condition-de-ressources, amen-social]
    fr:
      terme: Ciblage
      definition: >
        Opération consistant à sélectionner les bénéficiaires d'une prestation
        d'assistance parmi les demandeurs, par condition de ressources, par score ou par
        contingentement. En Tunisie, les trois techniques coexistent.
      synonymes: []
    ar:
      terme: الاستهداف
      definition: >
        عملية اختيار المنتفعين بمنفعة المساعدة من بين المطالبين بها، إمّا بشرط الموارد
        أو بالتنقيط أو بتحديد حصص. وتتعايش هذه التقنيات الثلاث في تونس.
      synonymes: []

  - id: score-eligibilite
    acronyme: null
    statut: valide
    references: [arrete-2020-05-19-scoring]
    source_definition: {ref: arrete-2020-05-19-scoring, locator: "art. 2"}
    voir_aussi: [ciblage, amen-social, condition-de-ressources]
    fr:
      terme: Score d'éligibilité
      definition: >
        Note calculée à partir de variables observables du ménage — le *proxy means
        test* — servant à départager les demandeurs de l'AMEN social. L'arrêté du 19 mai
        2020 en énumère les dimensions mais **non les pondérations**, qui ne sont pas
        publiées.
      synonymes: []
    ar:
      terme: أنموذج التنقيط
      definition: >
        عدد يُحتسب انطلاقًا من متغيّرات قابلة للملاحظة في الأسرة، ويُستعمل للمفاضلة بين
        المطالبين بالانتفاع ببرنامج الأمان الاجتماعي. وقد عدّد قرار 19 ماي 2020 أبعاده
        دون أن ينشر معاملات ترجيحه.
      synonymes: []

  - id: transfert-monetaire
    acronyme: null
    statut: valide
    references: [loi-amen-social-2019, arrete-2020-05-19-transferts]
    source_definition: {ref: arrete-2020-05-19-transferts, locator: "art. 2"}
    voir_aussi: [amen-social, categories-pauvres, allocation-familiale-non-contributive]
    fr:
      terme: Transfert monétaire direct
      definition: >
        Versement mensuel de l'AMEN social, composé d'une allocation de base et d'un
        supplément par enfant à charge, doublé pour l'enfant titulaire d'une carte de
        handicap. La base est revalorisée chaque année, avec effet rétroactif au 1^er^
        janvier.
      synonymes: []
    ar:
      terme: التحويل النقدي المباشر
      definition: >
        دفع شهري في إطار برنامج الأمان الاجتماعي يتكوّن من منحة قاعدية وزيادة عن كلّ طفل
        متكفَّل به، تُضاعَف بالنسبة إلى الطفل حامل بطاقة إعاقة. وتُراجَع المنحة القاعدية
        سنويًّا بمفعول رجعي إلى غرّة جانفي.
      synonymes: []

  - id: allocation-familiale-non-contributive
    acronyme: null
    statut: valide
    references: [decret-loi-2022-8-allocation-familiale, arrete-2022-04-01-allocation-familiale]
    source_definition: {ref: arrete-2022-04-01-allocation-familiale, locator: "art. 2-3"}
    voir_aussi: [allocation-familiale, transfert-monetaire, amen-social]
    fr:
      terme: Allocation familiale non contributive
      definition: >
        Allocation mensuelle servie au titre des enfants de moins de six ans des
        catégories pauvres et à revenu limité, créée en 2022. Elle est servie sans
        plafonnement du nombre d'enfants, et exclut expressément les affiliés à un
        régime de sécurité sociale : c'est la règle de non-cumul avec l'allocation
        familiale contributive.
      synonymes: []
    ar:
      terme: المنحة العائلية غير المساهماتية
      definition: >
        منحة شهرية تُسند بعنوان الأبناء دون سنّ ستّ سنوات في الفئات الفقيرة ومحدودة
        الدخل، أُحدثت سنة 2022. وتُسند دون تحديد لعدد الأبناء، وتستثني صراحة المنخرطين
        في أحد أنظمة الضمان الاجتماعي، وهي قاعدة منع الجمع مع المنحة العائلية
        المساهماتية.
      synonymes: []

  - id: amg1
    acronyme: AMG1
    statut: valide
    references: [loi-87-29-amg, decret-98-1812-amg1]
    source_definition: {ref: decret-98-1812-amg1, locator: "art. 2"}
    voir_aussi: [amg2, pnafn, quota-regional]
    fr:
      terme: Carte de soins gratuits
      definition: >
        Titre ouvrant la gratuité des soins dans les structures publiques, attribué aux
        familles sans ressources et, de droit, aux bénéficiaires du programme national
        d'aide aux familles nécessiteuses. Son attribution est contingentée par des
        quotas régionaux non publiés.
      synonymes: []
    ar:
      terme: بطاقة العلاج المجاني
      definition: >
        سند يخوّل مجّانية العلاج بالهياكل الصحّية العمومية، ويُسند إلى العائلات المعوزة،
        وبقوّة القانون إلى المنتفعين بالبرنامج الوطني لمساعدة العائلات المعوزة. ويخضع
        إسناده إلى حصص جهوية غير منشورة.
      synonymes: []

  - id: amg2
    acronyme: AMG2
    statut: valide
    references: [decret-98-409-amg2]
    source_definition: {ref: decret-98-409-amg2, locator: "art. 2 et 10"}
    voir_aussi: [amg1, condition-de-ressources, categories-revenu-limite, smig]
    fr:
      terme: Carte de soins à tarifs réduits
      definition: >
        Titre ouvrant l'accès aux soins publics à tarif réduit, moyennant un droit
        annuel d'affiliation, sous une condition de ressources exprimée en multiples du
        salaire minimum et modulée par la taille de la famille.
      synonymes: []
    ar:
      terme: بطاقة العلاج بالتعريفة المنخفضة
      definition: >
        سند يخوّل النفاذ إلى العلاج العمومي بتعريفة منخفضة مقابل معلوم انخراط سنوي، وذلك
        ضمن شرط موارد يُعبَّر عنه بمضاعفات الأجر الأدنى ويتغيّر بحسب حجم العائلة.
      synonymes: []

  - id: appui-financier-occasionnel
    acronyme: null
    statut: valide
    references: [loi-amen-social-2019, arrete-2022-12-08-appui-occasionnel]
    source_definition: {ref: arrete-2022-12-08-appui-occasionnel}
    voir_aussi: [amen-social, transfert-monetaire]
    fr:
      terme: Appui financier occasionnel
      definition: >
        Aides ponctuelles servies aux bénéficiaires de l'AMEN social à des occasions
        déterminées — mois de Ramadan, fêtes religieuses, rentrée scolaire et
        universitaire — par opposition au transfert monétaire permanent.
      synonymes: []
    ar:
      terme: الدعم المادي الظرفي
      definition: >
        مساعدات ظرفية تُسند إلى المنتفعين ببرنامج الأمان الاجتماعي في مناسبات محدّدة،
        كشهر رمضان والأعياد الدينية والعودة المدرسية والجامعية، خلافًا للتحويل النقدي
        القارّ.
      synonymes: []

  - id: quota-regional
    acronyme: null
    statut: valide
    references: [decret-98-1812-amg1, decret-98-409-amg2]
    source_definition: {ref: decret-98-1812-amg1, locator: "art. 2"}
    voir_aussi: [amg1, amg2, ciblage]
    fr:
      terme: Quota régional
      definition: >
        Contingent de cartes de soins réparti entre gouvernorats, qui borne le nombre de
        bénéficiaires indépendamment du nombre de ménages éligibles. Aucun arrêté fixant
        ces quotas n'a été retrouvé : c'est l'un des trois paramètres décisifs de
        l'assistance tunisienne à ne pas être publié.
      synonymes: []
    ar:
      terme: الحصّة الجهوية
      definition: >
        حصّة من بطاقات العلاج تُوزَّع بين الولايات وتحدّ من عدد المنتفعين بصرف النظر عن
        عدد الأسر المستوفية للشروط. ولم يُعثر على أيّ قرار يضبط هذه الحصص، وهي أحد ثلاثة
        معايير حاسمة في المساعدة الاجتماعية التونسية لم تُنشر.
      synonymes: []

  - id: salaire-journalier-moyen
    acronyme: null
    statut: valide
    references: [loi60-30, loi98-91]
    source_definition: {ref: loi60-30, locator: "art. 88-90"}
    voir_aussi: [indemnite-journaliere, carence]
    fr:
      terme: Salaire journalier moyen
      definition: >
        Assiette de référence des indemnités journalières, reconstituée à partir des
        rémunérations d'une période antérieure à l'arrêt. Sa définition a été réécrite par
        l'article 88 nouveau de la loi n° 98-91.
      synonymes: []
    ar:
      terme: الأجر اليومي المتوسّط
      definition: >
        القاعدة المرجعية لاحتساب التعويضات اليومية، تُستخرج من الأجور المقبوضة خلال فترة سابقة
        للانقطاع عن العمل. وقد أعاد الفصل 88 الجديد من القانون عدد 91 لسنة 1998 صياغة تعريفها.
      synonymes: []

  # ------------------------------------------------------------------- fiscalité
  # Notions auxquelles le chapitre IRPP renvoyait sans qu'elles existent au glossaire.

  - id: bic
    acronyme: BIC
    statut: valide
    references: [code-irpp-is-1990]
    source_definition: {ref: code-irpp-is-1990, locator: "art. 9"}
    voir_aussi: [bnc, assiette-fiscale, regime-forfaitaire]
    fr:
      terme: Bénéfices industriels et commerciaux
      definition: >
        Catégorie de revenus définie par renvoi aux professions commerciales, industrielles,
        artisanales et assimilées. C'est la catégorie de droit commun des revenus d'activité
        indépendante non salariée, dont les bénéfices non commerciaux se distinguent.
      synonymes: [BIC]
    ar:
      terme: الأرباح الصناعية والتجارية
      definition: >
        صنف من المداخيل يُعرَّف بالإحالة على المهن التجارية والصناعية والحرفية وما ماثلها. وهو
        الصنف العامّ لمداخيل النشاط المستقلّ غير الأجير، وتتميّز عنه الأرباح غير التجارية.
      synonymes: []

  - id: bnc
    acronyme: BNC
    statut: valide
    references: [code-irpp-is-1990]
    source_definition: {ref: code-irpp-is-1990, locator: "art. 21"}
    voir_aussi: [bic, abattement-forfaitaire, assiette-fiscale]
    fr:
      terme: Bénéfices des professions non commerciales
      definition: >
        Catégorie couvrant les professions libérales, les charges et offices et les revenus
        d'activités lucratives non rangés ailleurs. Un régime forfaitaire y impose une
        fraction des recettes brutes, le complément valant abattement forfaitaire implicite.
      synonymes: [BNC]
    ar:
      terme: الأرباح غير التجارية
      definition: >
        صنف يشمل المهن الحرّة والخطط والوظائف ومداخيل الأنشطة المدرّة للربح غير المصنّفة في
        مكان آخر. ويُخضع نظام جزافي جزءًا من المقابيض الخام للضريبة، ويقوم الباقي مقام طرح
        جزافي ضمني.
      synonymes: []

  - id: abattement-forfaitaire
    acronyme: null
    statut: valide
    references: [code-irpp-is-1990]
    source_definition: {ref: code-irpp-is-1990, locator: "art. 22"}
    voir_aussi: [bnc, frais-professionnels, assiette-fiscale]
    fr:
      terme: Abattement forfaitaire
      definition: >
        Fraction du revenu brut retranchée de l'assiette sans justification de dépense réelle,
        par opposition à la déduction des frais engagés. Il peut être explicite, comme la
        déduction pour frais professionnels, ou implicite, quand le texte n'impose qu'une part
        des recettes brutes.
      synonymes: []
    ar:
      terme: الطرح الجزافي
      definition: >
        جزء من الدخل الخام يُطرح من القاعدة الخاضعة للضريبة دون إثبات مصاريف حقيقية، خلافًا
        لطرح المصاريف المنجزة فعلًا. وقد يكون صريحًا كطرح المصاريف المهنية، أو ضمنيًّا حين لا
        يُخضع النصّ للضريبة إلّا جزءًا من المقابيض الخام.
      synonymes: []

  - id: revenus-fonciers
    acronyme: null
    statut: valide
    references: [code-irpp-is-1990]
    source_definition: {ref: code-irpp-is-1990, locator: "art. 27"}
    voir_aussi: [assiette-fiscale, abattement-forfaitaire]
    fr:
      terme: Revenus fonciers
      definition: >
        Catégorie définie par subsidiarité : y entrent les revenus des immeubles et des droits
        immobiliers lorsqu'ils ne relèvent pas d'une autre catégorie. Le revenu net des
        propriétés bâties se détermine forfaitairement.
      synonymes: []
    ar:
      terme: المداخيل العقارية
      definition: >
        صنف يُعرَّف بصفة تكميلية: تدخل فيه مداخيل العقارات والحقوق العقارية إذا لم تندرج ضمن
        صنف آخر. ويُضبط الدخل الصافي للعقارات المبنية بصفة جزافية.
      synonymes: []

  - id: deductions-communes
    acronyme: null
    statut: valide
    references: [code-irpp-is-1990]
    source_definition: {ref: code-irpp-is-1990, locator: "art. 39"}
    voir_aussi: [assiette-fiscale, revenu-annuel-net, bareme-irpp]
    fr:
      terme: Déductions communes
      definition: >
        Déductions opérées sur le revenu global, après détermination des revenus catégoriels
        et avant application du barème : intérêts de l'épargne, primes d'assurance-vie,
        situation et charges de famille. Elles ne se rattachent à aucune catégorie particulière.
      synonymes: []
    ar:
      terme: الطروحات المشتركة
      definition: >
        طروحات تُجرى على الدخل الجملي بعد ضبط المداخيل الصنفية وقبل تطبيق الجدول: فوائد
        الادّخار وأقساط التأمين على الحياة والحالة والأعباء العائلية. ولا ترتبط بأيّ صنف بعينه.
      synonymes: []

  # -------------------------------------------------------------------- retraites
  # Notions du livre « Retraites ». Termes arabes repris du § 7 de
  # docs/notes/retraites-dossier.md (et du § 13 de docs/notes/prestations-contributif.md
  # pour les sigles de régimes), où chacun est rattaché à son texte. Les termes
  # dont l'équivalent arabe n'est pas attesté sur le JORT arabe restent
  # « provisoire » et renvoient à l'issue de validation.

  # --- Secteur public

  - id: allocation-de-vieillesse
    acronyme: null
    statut: valide
    references: [loi81-6, decret74-499]
    source_definition: {ref: loi85-12, locator: "art. 42"}
    voir_aussi: [pension-proportionnelle, pension-minimale-garantie, smig]
    fr:
      terme: Allocation de vieillesse
      definition: >
        Prestation servie à l'assuré dont la carrière est trop courte pour ouvrir
        droit à pension. Dans le secteur public, l'agent qui compte au moins cinq
        années d'ancienneté sans atteindre la durée de services requise choisit entre
        le remboursement de ses contributions et une allocation égale à la moitié du
        SMIG du régime de 2 400 heures par an (loi n° 85-12, art. 42). Dans le régime
        des salariés non agricoles, elle était versée en capital à partir de 60 mois
        de cotisations, jusqu'à son remplacement par la pension proportionnelle en
        1982 ; le régime des salariés agricoles la conserve en capital à partir de
        20 trimestres (loi n° 81-6, art. 70-73).
      synonymes: []
    ar:
      terme: منحة الشيخوخة
      definition: >
        منحة تُسند إلى المضمون الذي تكون مسيرته المهنية أقصر من أن تفتح له الحقّ في
        جراية. في القطاع العمومي، يختار العون الذي يعدّ خمس سنوات أقدمية على الأقلّ
        دون بلوغ مدّة الخدمات المطلوبة بين استرجاع مساهماته ومنحة تساوي نصف الأجر
        الأدنى المضمون لمختلف المهن في نظام 2400 ساعة في السنة (القانون عدد 12 لسنة
        1985، الفصل 42). وفي نظام الأجراء غير الفلاحيين، كانت تُصرف في شكل رأس مال
        ابتداءً من 60 شهرًا من المساهمات، إلى أن عُوِّضت بالجراية النسبية سنة 1982؛
        ويحتفظ بها نظام الأجراء الفلاحيين في شكل رأس مال ابتداءً من 20 ثلاثية
        (القانون عدد 6 لسنة 1981، الفصول 70-73).
      synonymes: []

  - id: annuite-liquidable
    acronyme: null
    statut: provisoire  # équivalent AR à valider par un locuteur — cf. issue #151
    references: []
    source_definition: {ref: loi85-12, locator: "art. 35 et 38"}
    voir_aussi: [taux-de-liquidation, bonification]
    fr:
      terme: Annuité liquidable
      definition: >
        Année de services prise en compte pour la liquidation de la pension, qui
        rapporte un pourcentage de la rémunération de liquidation. Dans le régime des
        pensions civiles et militaires, chacune rapporte 2 % pour les dix premières
        années, 3 % pour les dix suivantes et 2 % au-delà de vingt, dans la limite de
        90 % ; toute période inférieure à une année est comptée par trimestres
        (loi n° 85-12, art. 35 et 38).
      synonymes: [Annuité]
    ar:
      terme: السنة القابلة للتصفية
      definition: >
        سنة خدمة تُعتمد في تصفية الجراية وتُكسب نسبة مئوية من أجر التصفية. في نظام
        الجرايات المدنية والعسكرية، تُكسب كلّ سنة 2 % عن السنوات العشر الأولى، و3 % عن
        السنوات العشر الموالية، و2 % عمّا زاد على عشرين سنة، في حدود 90 %؛ وتُحتسب كلّ
        فترة تقلّ عن سنة بالثلاثيات (القانون عدد 12 لسنة 1985، الفصلان 35 و38).
      synonymes: []

  - id: augmentation-optionnelle-age
    acronyme: null
    statut: provisoire  # équivalent AR à valider par un locuteur — cf. issue #151
    references: [loi85-12, loi2009-20]
    source_definition: {ref: loi2019-37, locator: "art. 3 (art. 71 bis et 71 ter)"}
    voir_aussi: [taux-de-liquidation, pensions-civiles-militaires]
    fr:
      terme: Augmentation optionnelle de l'âge de mise à la retraite
      definition: >
        Faculté ouverte à l'agent public, par le titre II bis que la loi n° 2019-37
        insère dans la loi n° 85-12, de rester en activité d'un à trois ans au-delà
        de l'âge légal, sur demande écrite présentée six mois avant cet âge ; pour
        les enseignants du supérieur de l'article 29 bis, la prolongation peut
        atteindre cinq ans et l'âge de 70 ans. L'option est définitive et
        irrévocable. Chaque année supplémentaire rapporte 2 % au taux de
        liquidation, et chaque trimestre 0,50 %.
      synonymes: []
    ar:
      terme: الترفيع الاختياري في سنّ الإحالة على التقاعد
      definition: >
        إمكانية مخوَّلة للعون العمومي، بمقتضى العنوان الثاني مكرّر الذي أدرجه القانون
        عدد 37 لسنة 2019 في القانون عدد 12 لسنة 1985، للبقاء في حالة مباشرة من سنة
        إلى ثلاث سنوات بعد السنّ القانونية، بطلب كتابي يُقدَّم ستّة أشهر قبل بلوغها؛
        ويمكن أن يبلغ التمديد خمس سنوات وسنّ السبعين بالنسبة إلى مدرّسي التعليم العالي
        المشمولين بالفصل 29 مكرّر. والاختيار نهائي ولا رجوع فيه. وتُكسب كلّ سنة
        إضافية 2 % من نسبة التصفية، وكلّ ثلاثية 0,50 %.
      synonymes: [الترفيع الاختياري في سنّ التقاعد]

  - id: bonification
    acronyme: null
    statut: provisoire  # équivalent AR à valider par un locuteur — cf. issue #151
    references: [loi2019-37]
    source_definition: {ref: loi85-12, locator: "art. 32-33"}
    voir_aussi: [annuite-liquidable, travaux-penibles-insalubres, cadres-actifs, fonctions-astreignantes, mise-a-la-retraite-d-office]
    fr:
      terme: Bonification
      definition: >
        Période ajoutée à la durée des services effectifs pour le calcul de la
        pension. La loi n° 85-12 en accorde, selon la durée des services, aux
        ouvriers des travaux pénibles et insalubres, aux agents des cadres actifs et
        à ceux qui exercent des fonctions astreignantes (art. 32), ainsi qu'aux
        militaires et agents des forces de sécurité intérieure blessés en service,
        aux agents atteints d'une invalidité de 80 % au moins et aux agents mis à la
        retraite pour suppression d'emplois (art. 33). Son effet reste borné par le
        plafond du taux de liquidation.
      synonymes: []
    ar:
      terme: الترفيع في مدّة الخدمات
      definition: >
        فترة تُضاف إلى مدّة الخدمات الفعلية لاحتساب الجراية. يمنحها القانون عدد 12 لسنة
        1985، حسب مدّة الخدمات، للعملة القائمين بالأشغال الشاقّة وغير الصحّية ولأعوان
        الأسلاك النشيطة وللأعوان المباشرين لوظائف مرهقة (الفصل 32)، وكذلك للعسكريين
        وأعوان قوات الأمن الداخلي المصابين أثناء الخدمة، وللأعوان المصابين بعجز لا
        تقلّ نسبته عن 80 %، وللأعوان المحالين على التقاعد بسبب حذف الخطط (الفصل 33).
        ويبقى أثره محدودًا بسقف نسبة التصفية.
      synonymes: [التمتيع الاستثنائي]

  - id: cadres-actifs
    acronyme: null
    statut: valide
    references: [loi2019-37]
    source_definition: {ref: loi85-12, locator: "art. 29"}
    voir_aussi: [bonification, fonctions-astreignantes, travaux-penibles-insalubres, forces-de-securite-interieure]
    fr:
      terme: Cadres actifs
      definition: >
        Agents publics classés en partie active par des décrets propres à chaque
        corps, qui bénéficient d'un âge de mise à la retraite dérogatoire : 55 ans
        dans la loi n° 85-12, 57 ans depuis la loi n° 2019-37 (art. 29). Ils
        bénéficient d'une bonification égale à la période restant à courir jusqu'à
        60 ans, dans la limite de deux à cinq ans selon la durée des services
        (art. 32).
      synonymes: []
    ar:
      terme: الأسلاك النشيطة
      definition: >
        أعوان عموميون مصنَّفون ضمن الأسلاك النشيطة بمقتضى أوامر خاصّة بكلّ سلك،
        ينتفعون بسنّ استثنائية للإحالة على التقاعد: 55 سنة في القانون عدد 12 لسنة
        1985، و57 سنة منذ القانون عدد 37 لسنة 2019 (الفصل 29). وينتفعون بترفيع في مدّة
        الخدمات يساوي الفترة المتبقّية إلى سنّ الستين، في حدود سنتين إلى خمس سنوات حسب
        مدّة الخدمات (الفصل 32).
      synonymes: []

  - id: elements-permanents-remuneration
    acronyme: null
    statut: provisoire  # équivalent AR à valider par un locuteur — cf. issue #151
    references: [decret85-980, decret85-1176]
    source_definition: {ref: loi85-12, locator: "art. 10"}
    voir_aussi: [perequation, pensions-civiles-militaires, traitement-de-base]
    fr:
      terme: Éléments permanents de la rémunération
      definition: >
        Éléments de la rémunération, en espèces ou en nature, qui forment à la fois
        l'assiette de la contribution au régime des pensions civiles et militaires et
        la rémunération sur laquelle la pension est liquidée (loi n° 85-12, art. 10).
        Leur liste est fixée par le décret n° 85-980 pour les agents de l'État, des
        collectivités locales et des établissements publics à caractère
        administratif, et par le décret n° 85-1176 pour ceux des établissements
        publics à caractère industriel et commercial et des sociétés nationales.
        Toute augmentation de l'un d'eux entraîne la péréquation des pensions
        (art. 37).
      synonymes: []
    ar:
      terme: العناصر القارّة للأجر
      definition: >
        عناصر التأجير، نقدًا أو عينًا، التي تمثّل في الآن نفسه قاعدة المساهمة في نظام
        الجرايات المدنية والعسكرية والأجرَ الذي تُصفّى على أساسه الجراية (القانون عدد
        12 لسنة 1985، الفصل 10). ويضبط قائمتها الأمر عدد 980 لسنة 1985 بالنسبة إلى
        أعوان الدولة والجماعات المحلية والمؤسسات العمومية ذات الصبغة الإدارية، والأمر
        عدد 1176 لسنة 1985 بالنسبة إلى أعوان المؤسسات العمومية ذات الصبغة الصناعية
        والتجارية والشركات الوطنية. وتُفضي كلّ زيادة في أحدها إلى تنظير الجرايات
        (الفصل 37).
      synonymes: [العناصر القارّة للتأجير]

  - id: fonctions-astreignantes
    acronyme: null
    statut: provisoire  # équivalent AR à valider par un locuteur — cf. issue #151
    references: [decret85-1178, loi2019-37]
    source_definition: {ref: loi85-12, locator: "art. 28"}
    voir_aussi: [bonification, cadres-actifs, travaux-penibles-insalubres]
    fr:
      terme: Fonctions astreignantes
      definition: >
        Fonctions dont la liste est fixée par le décret n° 85-1178 du 24 septembre
        1985 et dont l'exercice ouvre un âge de mise à la retraite dérogatoire,
        cumulé avec une durée de 35 ans de services : 55 ans dans la loi n° 85-12,
        57 ans depuis la loi n° 2019-37 (art. 28). Les agents concernés bénéficient
        d'une bonification égale à la période restant à courir jusqu'à 60 ans
        (art. 32).
      synonymes: []
    ar:
      terme: الوظائف المرهقة
      definition: >
        وظائف يضبط قائمتها الأمر عدد 1178 لسنة 1985 المؤرّخ في 24 سبتمبر 1985، تفتح
        مباشرتها سنًّا استثنائية للإحالة على التقاعد مقترنة بمدّة خدمات بـ35 سنة: 55 سنة
        في القانون عدد 12 لسنة 1985، و57 سنة منذ القانون عدد 37 لسنة 2019 (الفصل 28).
        وينتفع الأعوان المعنيّون بترفيع في مدّة الخدمات يساوي الفترة المتبقّية إلى سنّ
        الستين (الفصل 32).
      synonymes: []

  - id: indemnite-caractere-familial
    acronyme: null
    statut: valide
    references: [loi88-39, decret96-1906, loi81-70]
    source_definition: {ref: loi85-12, locator: "art. 40"}
    voir_aussi: [indemnite-revenu-unique, allocation-familiale, pensions-civiles-militaires]
    fr:
      terme: Indemnité à caractère familial
      definition: >
        Indemnité servie par rang d'enfant aux agents publics chargés de famille,
        selon des taux mensuels fixés par décret, et qui s'ajoute dans les mêmes
        conditions à la pension de retraite (loi n° 85-12, art. 40), comme elle
        s'ajoutait déjà depuis le 1^er^ mai 1981 (loi n° 81-70, art. 4). La loi
        n° 88-39 en limite le droit aux trois premiers enfants ; le décret
        n° 96-1906 en fixe les taux depuis le 1^er^ novembre 1996.
      synonymes: [Indemnité familiale]
    ar:
      terme: المنحة ذات الصبغة العائلية
      definition: >
        منحة تُسند حسب رتبة الطفل إلى الأعوان العموميين الذين لهم أبناء في الكفالة، وفق
        نسب شهرية يضبطها أمر، وتُضاف بنفس الشروط إلى جراية التقاعد (القانون عدد 12 لسنة
        1985، الفصل 40)، كما كانت تُضاف إليها منذ غرّة ماي 1981 (القانون عدد 70 لسنة
        1981، الفصل 4). ويقصر القانون عدد 39 لسنة 1988 الحقّ فيها على الأبناء الثلاثة
        الأوائل؛ ويضبط الأمر عدد 1906 لسنة 1996 نسبها منذ غرّة نوفمبر 1996.
      synonymes: [المنحة العائلية]

  - id: indemnite-revenu-unique
    acronyme: null
    statut: valide
    references: [loi81-70, cnrps-manuel-liquidation-2013]
    source_definition: {ref: loi85-12, locator: "art. 40"}
    voir_aussi: [indemnite-caractere-familial, majoration-salaire-unique]
    fr:
      terme: Indemnité de revenu unique
      definition: >
        Indemnité servie à l'agent public chargé de famille dont le ménage ne dispose
        que d'un seul revenu, et qui s'ajoute à la pension de retraite dans les mêmes
        conditions que pour les agents en activité (loi n° 85-12, art. 40) ; le
        droit des retraités date du 1^er^ mai 1981 (loi n° 81-70, art. 4-5). Selon le
        manuel de liquidation de la CNRPS (2013), elle suppose au moins un enfant
        ouvrant droit à l'indemnité familiale. Elle est distincte de la majoration
        pour salaire unique du secteur privé.
      synonymes: [Indemnité pour revenu unique]
    ar:
      terme: منحة الدخل الوحيد
      definition: >
        منحة تُسند إلى العون العمومي الذي له أبناء في الكفالة ولا يتوفّر لأسرته إلّا دخل
        واحد، وتُضاف إلى جراية التقاعد بنفس الشروط المطبّقة على الأعوان المباشرين
        (القانون عدد 12 لسنة 1985، الفصل 40)؛ ويعود حقّ المتقاعدين فيها إلى غرّة ماي
        1981 (القانون عدد 70 لسنة 1981، الفصلان 4 و5). وحسب دليل تصفية الجرايات للصندوق
        الوطني للتقاعد والحيطة الاجتماعية (2013)، يُشترط فيها وجود طفل واحد على الأقلّ
        يفتح الحقّ في المنحة العائلية. وهي متميّزة عن منحة الأجر الوحيد في القطاع الخاص.
      synonymes: []

  - id: jouissance-differee
    acronyme: null
    statut: provisoire  # équivalent AR à valider par un locuteur — cf. issue #151
    references: [decret82-1030, decret2007-2148]
    source_definition: {ref: loi85-12, locator: "art. 41"}
    voir_aussi: [retraite-anticipee-volontaire, decote]
    fr:
      terme: Jouissance différée
      definition: >
        Report, jusqu'à un âge fixé par le texte, du service d'une pension dont le
        droit est acquis. Dans le secteur public, la pension de l'agent mis à la
        retraite sur sa demande ou licencié pour insuffisance professionnelle est
        différée jusqu'à 50 ans, celle de l'agent révoqué ou démissionnaire jusqu'à
        l'âge légal (loi n° 85-12, art. 41). Dans le régime des salariés non
        agricoles, les départs anticipés de l'article 15 bis ouvrent le droit sans
        condition d'âge, mais la pension n'est servie qu'à 50 ans (décret
        n° 82-1030) ; depuis le décret n° 2007-2148, le départ pour convenance
        personnelle n'est servi qu'à 55 ans.
      synonymes: []
    ar:
      terme: الانتفاع المؤجَّل بالجراية
      definition: >
        تأجيل صرف جراية مكتسَب الحقّ فيها إلى سنّ يضبطها النصّ. في القطاع العمومي،
        يُؤجَّل الانتفاع بجراية العون المحال على التقاعد بطلب منه أو المسرَّح لعدم
        الكفاءة المهنية إلى سنّ الخمسين، وبجراية العون المعزول أو المستقيل إلى السنّ
        القانونية (القانون عدد 12 لسنة 1985، الفصل 41). وفي نظام الأجراء غير
        الفلاحيين، تفتح حالات الخروج المبكّر المنصوص عليها بالفصل 15 مكرّر الحقّ دون شرط
        سنّ، لكنّ الجراية لا تُصرف إلّا في سنّ الخمسين (الأمر عدد 1030 لسنة 1982)؛ ومنذ
        الأمر عدد 2148 لسنة 2007، لا تُصرف جراية الخروج لأسباب شخصية إلّا في سنّ الخامسة
        والخمسين.
      synonymes: [التمتّع المؤجَّل]

  - id: mise-a-la-retraite-d-office
    acronyme: null
    statut: provisoire  # équivalent AR à valider par un locuteur — cf. issue #151
    references: [loi2019-37]
    source_definition: {ref: loi85-12, locator: "art. 33 et 67"}
    voir_aussi: [bonification, solde-de-reforme]
    fr:
      terme: Mise à la retraite d'office
      definition: >
        Mise à la retraite prononcée par l'administration, et non à la demande de
        l'agent. La loi n° 85-12 en tire des effets sur le calcul de la pension : les
        militaires mis à la retraite d'office ou atteints par la limite d'âge de leur
        grade bénéficient d'une bonification égale à la période restant à courir
        jusqu'à 60 ans, repère porté à 62 ans par la loi n° 2019-37 (art. 67), et
        l'article 33 (nouveau) issu de la même loi plafonne à un rendement de 20 % de
        la rémunération de liquidation la bonification des agents mis à la retraite
        d'office.
      synonymes: []
    ar:
      terme: الإحالة الوجوبية على التقاعد
      definition: >
        إحالة على التقاعد تقرّرها الإدارة لا بطلب من العون. ويرتّب عليها القانون عدد 12
        لسنة 1985 آثارًا في احتساب الجراية: ينتفع العسكريون المحالون وجوبًا على التقاعد
        أو البالغون السنّ القصوى لرتبتهم بترفيع في مدّة الخدمات يساوي الفترة المتبقّية
        إلى سنّ الستين، وقد رفع القانون عدد 37 لسنة 2019 هذا الحدّ إلى سنّ الثانية
        والستين (الفصل 67)، ويحدّد الفصل 33 (جديد) المنبثق عن نفس القانون مردود الترفيع
        في مدّة خدمات الأعوان المحالين وجوبًا على التقاعد بـ20 % من أجر التصفية.
      synonymes: []

  - id: pension-de-reversion
    acronyme: null
    statut: provisoire  # équivalent AR à valider par un locuteur — cf. issue #151
    references: [decret74-499, decret81-188, loi81-6, loi81-70]
    source_definition: {ref: loi85-12, locator: "art. 43"}
    voir_aussi: [pension-temporaire-orphelin, capital-deces]
    fr:
      terme: Pension de réversion
      definition: >
        Pension servie au conjoint survivant, calculée en pourcentage de la pension
        dont bénéficiait ou aurait pu bénéficier l'assuré décédé. Elle est de 75 %
        dans le secteur public, réduite pendant le service de pensions d'orphelins
        sans descendre au-dessous de 50 % (loi n° 85-12, art. 43) ; de 50 % dans le
        régime des salariés non agricoles (décret n° 74-499, art. 31), majorable
        jusqu'à 75 % sous condition depuis le décret n° 81-188 ; et de 50 % dans le
        régime des salariés agricoles (loi n° 81-6, art. 61-63).
      synonymes: [Pension de conjoint survivant, Pension de veuve]
    ar:
      terme: جراية القرين الباقي على قيد الحياة
      definition: >
        جراية تُسند إلى القرين الباقي على قيد الحياة، تُحتسب بنسبة مئوية من الجراية التي
        كان ينتفع بها المضمون المتوفّى أو كان بإمكانه الانتفاع بها. وتبلغ 75 % في القطاع
        العمومي، وتُخفَّض خلال فترة صرف جرايات الأيتام دون أن تنزل عن 50 % (القانون عدد
        12 لسنة 1985، الفصل 43)؛ و50 % في نظام الأجراء غير الفلاحيين (الأمر عدد 499
        لسنة 1974، الفصل 31)، قابلة للترفيع إلى 75 % بشروط منذ الأمر عدد 188 لسنة 1981؛
        و50 % في نظام الأجراء الفلاحيين (القانون عدد 6 لسنة 1981، الفصول 61-63).
      synonymes: [جراية البقاء, جراية الأرملة]

  - id: pension-minimale-garantie
    acronyme: null
    statut: valide
    references: [loi81-70, decret74-499, decret82-1030, loi89-73]
    source_definition: {ref: loi85-12, locator: "art. 39"}
    voir_aussi: [smig, smag, allocation-de-vieillesse, pension-proportionnelle, solde-de-reforme]
    fr:
      terme: Pension minimale garantie
      definition: >
        Montant, exprimé en fraction du salaire minimum, auquel la pension est portée
        lorsque son calcul donne un résultat inférieur. Il est des deux tiers du SMIG
        du régime de 2 400 heures par an dans le secteur public (loi n° 85-12,
        art. 39 ; déjà dans la rédaction de 1981 de la loi n° 59-18) et, pour les
        pensions de vieillesse et d'invalidité, dans le régime des salariés non
        agricoles ; depuis 1982, la moitié du SMIG s'applique dans ce régime aux
        retraites anticipées des tirets a) et b) de l'article 15 bis et aux pensions
        proportionnelles (décret n° 82-1030, art. 5). Le régime agricole amélioré le
        fixe à la moitié du SMAG rapporté à 300 jours.
      synonymes: [Pension minimum garantie, Minimum garanti]
    ar:
      terme: الجراية الدنيا المضمونة
      definition: >
        مبلغ يُعبَّر عنه بجزء من الأجر الأدنى، تُرفَع إليه الجراية إذا أفضى احتسابها إلى
        مبلغ أدنى منه. ويساوي ثلثي الأجر الأدنى المضمون لمختلف المهن في نظام 2400 ساعة في
        السنة في القطاع العمومي (القانون عدد 12 لسنة 1985، الفصل 39؛ وقد ورد بنفس المستوى
        في صيغة 1981 من القانون عدد 18 لسنة 1959)، وكذلك بالنسبة إلى جرايات الشيخوخة
        والعجز في نظام الأجراء غير الفلاحيين؛ ومنذ 1982، يُطبَّق في هذا النظام نصف الأجر
        الأدنى المضمون على جرايات التقاعد المبكّر المنصوص عليها بالمطّتين أ) وب) من الفصل
        15 مكرّر وعلى الجرايات النسبية (الأمر عدد 1030 لسنة 1982، الفصل 5). ويضبطه النظام
        الفلاحي المحسَّن بنصف الأجر الأدنى الفلاحي المضمون محتسبًا على أساس 300 يوم.
      synonymes: []

  - id: pension-temporaire-orphelin
    acronyme: null
    statut: provisoire  # équivalent AR à valider par un locuteur — cf. issue #151
    references: [loi2007-43, decret74-499, decret81-188, decret97-1927, loi81-6]
    source_definition: {ref: loi85-12, locator: "art. 45"}
    voir_aussi: [pension-de-reversion]
    fr:
      terme: Pension temporaire d'orphelin
      definition: >
        Pension servie à l'orphelin de l'assuré décédé jusqu'à un âge limite. Dans le
        secteur public, elle est de 10 % de la pension de retraite par orphelin
        jusqu'à 21 ans, sans condition d'âge en cas de maladie incurable ou
        d'invalidité permanente ; la loi n° 2007-43 la prolonge jusqu'à 25 ans pour
        les études supérieures sans bourse et l'ouvre sans condition d'âge à la fille
        sans ressources (loi n° 85-12, art. 45-47). Dans le régime des salariés non
        agricoles, elle est collective et fixée à 30 % depuis le décret n° 81-188 ;
        dans le régime des salariés agricoles, elle est de 20 %, ou de 30 % pour
        l'orphelin de père et de mère (loi n° 81-6, art. 64-65).
      synonymes: [Pension d'orphelin]
    ar:
      terme: الجراية الوقتية لليتيم
      definition: >
        جراية تُسند إلى يتيم المضمون المتوفّى إلى حدّ سنّ معيّنة. في القطاع العمومي، تبلغ
        10 % من جراية التقاعد عن كلّ يتيم إلى سنّ الحادية والعشرين، ودون شرط سنّ في حالة
        المرض العضال أو العجز الدائم؛ ويمدّدها القانون عدد 43 لسنة 2007 إلى سنّ الخامسة
        والعشرين بالنسبة إلى مزاولي التعليم العالي غير المنتفعين بمنحة، ويفتحها دون شرط
        سنّ للبنت التي لا موارد لها (القانون عدد 12 لسنة 1985، الفصول 45-47). وفي نظام
        الأجراء غير الفلاحيين، هي جراية جماعية حُدّدت بـ30 % منذ الأمر عدد 188 لسنة
        1981؛ وفي نظام الأجراء الفلاحيين، تبلغ 20 %، و30 % لليتيم من الأب والأم (القانون
        عدد 6 لسنة 1981، الفصلان 64 و65).
      synonymes: [جراية الأيتام]

  - id: perequation
    acronyme: null
    statut: provisoire  # équivalent AR à valider par un locuteur — cf. issue #151
    references: [loi2007-43, cnrps-manuel-liquidation-2013]
    source_definition: {ref: loi85-12, locator: "art. 37"}
    voir_aussi: [elements-permanents-remuneration, revalorisation-pensions, pensions-civiles-militaires]
    fr:
      terme: Péréquation des pensions
      definition: >
        Mécanisme de revalorisation des pensions du secteur public : la pension est
        réajustée lors de toute augmentation de l'un des éléments permanents de la
        rémunération du grade ou de la fonction sur la base desquels elle a été
        liquidée, ainsi que lors de l'institution d'une indemnité permanente attachée
        à ce grade ou à cette fonction (loi n° 85-12, art. 37). Depuis la loi
        n° 2007-43, les contributions afférentes à la péréquation sont à la charge du
        retraité, à l'exception de la quote-part de l'employeur pendant 36 mois. Elle
        se distingue de la révision de la pension, qui est une reliquidation
        (art. 54), et de la revalorisation par référence au salaire minimum du
        secteur privé.
      synonymes: [Péréquation]
    ar:
      terme: تنظير الجرايات
      definition: >
        آلية لتعديل جرايات القطاع العمومي، تُراجَع بمقتضاها الجراية عند كلّ زيادة في أحد
        العناصر القارّة للأجر المطابق للرتبة أو الخطّة التي صُفّيت الجراية على أساسها،
        وكذلك عند إحداث منحة قارّة مرتبطة بتلك الرتبة أو الخطّة (القانون عدد 12 لسنة
        1985، الفصل 37). ومنذ القانون عدد 43 لسنة 2007، يتحمّل المتقاعد المساهمات
        المستوجبة بعنوان التنظير، باستثناء منابات المؤجّر خلال 36 شهرًا. ويتميّز التنظير
        عن مراجعة الجراية، وهي إعادة تصفية لها (الفصل 54)، وعن تعديل الجرايات بالرجوع
        إلى الأجر الأدنى في القطاع الخاص.
      synonymes: [تسوية الجرايات, إحالة الجرايات]

  - id: rente-compensatrice
    acronyme: null
    statut: provisoire  # équivalent AR à valider par un locuteur — cf. issue #151
    references: [loi95-56]
    source_definition: {ref: cnrps-manuel-liquidation-2013, locator: "p. 88-89"}
    voir_aussi: [rente-viagere-invalidite, rente-accident-travail, accident-du-travail]
    fr:
      terme: Rente compensatrice
      definition: >
        Rente servie par la CNRPS, à la charge de l'employeur, aux agents publics
        victimes d'un accident du travail ou d'une maladie professionnelle, au titre
        de la loi n° 95-56 du 28 juin 1995, dont les militaires et les agents des
        forces de sécurité intérieure sont exclus (art. 2). Selon le manuel de
        liquidation de la caisse (2013), elle est servie depuis janvier 1996 avec une
        formule et des bornes identiques à celles de la rente viagère d'invalidité.
      synonymes: []
    ar:
      terme: الإيراد التعويضي
      definition: >
        إيراد يصرفه الصندوق الوطني للتقاعد والحيطة الاجتماعية، على كاهل المؤجّر، للأعوان
        العموميين ضحايا حوادث الشغل أو الأمراض المهنية، بعنوان القانون عدد 56 لسنة 1995
        المؤرّخ في 28 جوان 1995، الذي يستثني العسكريين وأعوان قوات الأمن الداخلي
        (الفصل 2). وحسب دليل تصفية الجرايات للصندوق (2013)، يُصرف منذ جانفي 1996 وفق صيغة
        وحدود مماثلة لصيغة الإيراد العمري للعجز وحدوده.
      synonymes: []

  - id: rente-viagere-invalidite
    acronyme: null
    statut: valide
    references: [loi59-18, loi85-12, cnrps-manuel-liquidation-2013]
    source_definition: {ref: loi81-70, locator: "art. 4 (art. 26 § II de la loi n° 59-18)"}
    voir_aussi: [rente-compensatrice, bonification, pension-de-reversion]
    fr:
      terme: Rente viagère d'invalidité
      definition: >
        Rente qui s'ajoute à la pension de l'agent public admis à la retraite pour
        invalidité. L'invalidité des agents publics reste régie par la loi n° 59-18,
        maintenue sur ce point par l'article 76 de la loi n° 85-12 ; dans la
        rédaction de l'article 26 § II issue de la loi n° 81-70, le montant de la
        rente est égal au produit de la rémunération soumise à retenue pour pension
        par le taux de l'invalidité. Le manuel de liquidation de la CNRPS (2013) la
        calcule, lui, sur la pension de retraite, et plafonne le total de la pension
        et de la rente à 100 % de la rémunération de base.
      synonymes: [Rente viagère pour invalidité]
    ar:
      terme: الإيراد العمري للعجز
      definition: >
        إيراد يُضاف إلى جراية العون العمومي المحال على التقاعد بسبب العجز. ولا يزال عجز
        الأعوان العموميين خاضعًا للقانون عدد 18 لسنة 1959، الذي أبقى الفصل 76 من القانون
        عدد 12 لسنة 1985 على العمل به في هذا الشأن؛ وحسب صيغة الفقرة II من الفصل 26
        المنبثقة عن القانون عدد 70 لسنة 1981، يساوي مبلغ الإيراد حاصل ضرب الأجر الخاضع
        للحجز بعنوان الجراية في نسبة العجز. أمّا دليل تصفية الجرايات للصندوق الوطني
        للتقاعد والحيطة الاجتماعية (2013)، فيحتسبه على أساس جراية التقاعد ويحدّد مجموع
        الجراية والإيراد بـ100 % من الأجر المعتمد.
      synonymes: []

  - id: retraite-anticipee-volontaire
    acronyme: null
    statut: provisoire  # équivalent AR à valider par un locuteur — cf. issue #151
    references: [loi85-12, loi2009-39]
    source_definition: {ref: loi87-7}
    voir_aussi: [jouissance-differee, pensions-civiles-militaires]
    fr:
      terme: Retraite anticipée volontaire
      definition: >
        Système de départ anticipé des agents publics institué, hors de la loi
        n° 85-12, par la loi n° 87-7 du 6 mars 1987. Il est distinct du droit général
        au départ anticipé de l'article 30 de la loi n° 85-12 et de la mise à la
        retraite avant l'âge légal instituée par la loi n° 2009-39 du 8 juillet 2009,
        que l'article 7 de la loi n° 2019-37 maintient l'un et l'autre sous l'empire
        des textes antérieurs pour l'âge légal.
      synonymes: []
    ar:
      terme: التقاعد المبكّر الاختياري
      definition: >
        نظام للخروج المبكّر للأعوان العموميين أُحدث، خارج القانون عدد 12 لسنة 1985،
        بمقتضى القانون عدد 7 لسنة 1987 المؤرّخ في 6 مارس 1987. وهو متميّز عن الحقّ العامّ
        في الخروج المبكّر المنصوص عليه بالفصل 30 من القانون عدد 12 لسنة 1985، وعن الإحالة
        على التقاعد قبل السنّ القانونية التي أحدثها القانون عدد 39 لسنة 2009 المؤرّخ في 8
        جويلية 2009، وقد أبقى الفصل 7 من القانون عدد 37 لسنة 2019 كليهما خاضعَين، في ما
        يتعلّق بالسنّ القانونية، للنصوص السابقة.
      synonymes: []

  - id: solde-de-reforme
    acronyme: null
    statut: provisoire  # équivalent AR à valider par un locuteur — cf. issue #151
    references: [cnrps-manuel-liquidation-2013]
    source_definition: {ref: loi85-12, locator: "art. 69-71"}
    voir_aussi: [pension-minimale-garantie, solde-militaire, pensions-civiles-militaires]
    fr:
      terme: Solde de réforme
      definition: >
        Prestation propre au volet militaire du régime des pensions civiles et
        militaires, organisée par les articles 69 à 71 de la loi n° 85-12, dont le
        montant ne peut jamais être inférieur à la pension minimale garantie
        (art. 70). Selon le manuel de liquidation de la CNRPS (2013), le titulaire
        d'une seule solde de réforme est exclu des indemnités à caractère familial et
        de l'indemnité de revenu unique.
      synonymes: []
    ar:
      terme: منحة الإصلاح
      definition: >
        منفعة خاصّة بالشقّ العسكري من نظام الجرايات المدنية والعسكرية، تنظّمها الفصول 69
        إلى 71 من القانون عدد 12 لسنة 1985، ولا يمكن أن يقلّ مبلغها في أيّ حال عن الجراية
        الدنيا المضمونة (الفصل 70). وحسب دليل تصفية الجرايات للصندوق الوطني للتقاعد
        والحيطة الاجتماعية (2013)، يُستثنى صاحب منحة إصلاح وحيدة من المنح ذات الصبغة
        العائلية ومن منحة الدخل الوحيد.
      synonymes: []

  - id: taux-de-liquidation
    acronyme: null
    statut: valide
    references: [decret74-499, loi81-6, loi2002-32]
    source_definition: {ref: loi85-12, locator: "art. 38"}
    voir_aussi: [annuite-liquidable, bonification, salaire-moyen-reference, decote]
    fr:
      terme: Taux de liquidation
      definition: >
        Pourcentage appliqué à la rémunération de liquidation ou au salaire de
        référence pour obtenir le montant de la pension, acquis en fonction de la
        durée de services ou de cotisation et borné par un plafond. Dans le secteur
        public, il s'acquiert par annuités jusqu'à 90 % (loi n° 85-12, art. 38) ; dans
        le régime des salariés non agricoles, il est de 40 % pour 120 mois de
        cotisations, majoré de 2 % par année supplémentaire jusqu'à 80 % (décret
        n° 74-499, art. 17) ; le régime des salariés agricoles applique le même
        barème exprimé en trimestres (loi n° 81-6, art. 49).
      synonymes: []
    ar:
      terme: نسبة تصفية الجراية
      definition: >
        نسبة مئوية تُطبَّق على أجر التصفية أو على الأجر المتوسط المرجعي لضبط مبلغ
        الجراية، تُكتسب حسب مدّة الخدمات أو المساهمة وتحدّها نسبة قصوى. في القطاع
        العمومي، تُكتسب بحسب السنوات القابلة للتصفية إلى حدود 90 % (القانون عدد 12 لسنة
        1985، الفصل 38)؛ وفي نظام الأجراء غير الفلاحيين، تبلغ 40 % مقابل 120 شهرًا من
        المساهمات، وتُضاف إليها 2 % عن كلّ سنة إضافية إلى حدود 80 % (الأمر عدد 499 لسنة
        1974، الفصل 17)؛ ويطبّق نظام الأجراء الفلاحيين نفس الجدول محتسبًا بالثلاثيات
        (القانون عدد 6 لسنة 1981، الفصل 49).
      synonymes: [نسبة التصفية]

  - id: travaux-penibles-insalubres
    acronyme: null
    statut: provisoire  # équivalent AR à valider par un locuteur — cf. issue #151
    references: [decret85-1177, loi2019-37, decret74-499]
    source_definition: {ref: loi85-12, locator: "art. 27"}
    voir_aussi: [bonification, fonctions-astreignantes, cadres-actifs]
    fr:
      terme: Travaux pénibles et insalubres
      definition: >
        Tâches dont l'accomplissement ouvre un âge de mise à la retraite abaissé. Dans
        le secteur public, les ouvriers qui les accomplissent, désignés par le décret
        n° 85-1177 du 24 septembre 1985 en dix-sept catégories, partent à 55 ans, puis
        à 57 ans depuis la loi n° 2019-37 (loi n° 85-12, art. 27), et bénéficient
        d'une bonification de deux à cinq ans selon la durée des services (art. 32).
        Dans le régime des salariés non agricoles, les travaux pénibles ou insalubres
        dont les catégories sont fixées par arrêté ouvrent la retraite à 55 ans,
        moyennant une majoration du stage (décret n° 74-499, art. 15-16).
      synonymes: [Tâches pénibles et insalubres]
    ar:
      terme: الأشغال الشاقّة وغير الصحّية
      definition: >
        مهامّ تفتح مباشرتها سنًّا مخفَّضة للإحالة على التقاعد. في القطاع العمومي، يُحال
        العملة القائمون بها، الذين يضبطهم الأمر عدد 1177 لسنة 1985 المؤرّخ في 24 سبتمبر
        1985 في سبعة عشر صنفًا، على التقاعد في سنّ الخامسة والخمسين، ثمّ في سنّ السابعة
        والخمسين منذ القانون عدد 37 لسنة 2019 (القانون عدد 12 لسنة 1985، الفصل 27)،
        وينتفعون بترفيع في مدّة الخدمات من سنتين إلى خمس سنوات حسب مدّة الخدمات (الفصل
        32). وفي نظام الأجراء غير الفلاحيين، تفتح الأشغال الشاقّة أو غير الصحّية التي
        تُضبط أصنافها بقرار الحقَّ في التقاعد في سنّ الخامسة والخمسين، مقابل الترفيع في
        مدّة الانخراط الدنيا (الأمر عدد 499 لسنة 1974، الفصلان 15 و16).
      synonymes: []

  - id: validation-des-services
    acronyme: null
    statut: provisoire  # équivalent AR à valider par un locuteur — cf. issue #151
    references: [loi95-105, loi89-73]
    source_definition: {ref: loi85-12, locator: "art. 14-21"}
    voir_aussi: [coordination-des-regimes, pensions-civiles-militaires, rsaa]
    fr:
      terme: Validation des services
      definition: >
        Prise en compte, pour le droit à pension et son calcul, de périodes qui n'ont
        pas donné lieu à cotisation, moyennant le versement des contributions
        correspondantes. Dans le secteur public, l'agent la demande par écrit dans un
        délai maximum d'un an à partir de l'âge légal ; les contributions, à sa
        charge, sont assises sur la moyenne entre sa rémunération à la date
        d'adhésion et celle à la date de la demande, et payables par tranches
        n'excédant pas 20 % de sa rémunération (loi n° 85-12, art. 14-21). La loi
        n° 95-105 du 14 décembre 1995 institue un système unique de validation commun
        aux régimes légaux. Le régime agricole amélioré admet la validation des
        périodes d'emploi agricole accomplies depuis le 1^er^ janvier 1981, moyennant
        cotisations arriérées.
      synonymes: [Validation]
    ar:
      terme: إدماج الخدمات
      definition: >
        احتساب فترات لم تُدفع بعنوانها مساهمات، لفتح الحقّ في الجراية ولاحتسابها، مقابل
        دفع المساهمات المطابقة. في القطاع العمومي، يطلبه العون كتابيًّا في أجل أقصاه سنة
        من بلوغ السنّ القانونية؛ وتُحتسب المساهمات، المحمولة عليه، على أساس معدّل أجره في
        تاريخ الانخراط وأجره في تاريخ الطلب، وتُدفع بأقساط لا تتجاوز 20 % من أجره (القانون
        عدد 12 لسنة 1985، الفصول 14-21). ويُحدث القانون عدد 105 لسنة 1995 المؤرّخ في 14
        ديسمبر 1995 نظامًا موحّدًا لإدماج الخدمات مشتركًا بين الأنظمة القانونية. ويقبل
        النظام الفلاحي المحسَّن إدماج فترات العمل الفلاحي المقضّاة منذ غرّة جانفي 1981،
        مقابل دفع المساهمات المتخلّدة.
      synonymes: []

  # --- Secteur privé

  - id: decote
    acronyme: null
    statut: provisoire  # équivalent AR à valider par un locuteur — cf. issue #151
    references: [decret2007-2148]
    source_definition: {ref: decret82-1030, locator: "art. 1 (art. 15 bis et 17, al. 3)"}
    voir_aussi: [jouissance-differee, taux-de-liquidation]
    fr:
      terme: Décote
      definition: >
        Réduction appliquée à la pension en cas de départ anticipé, proportionnelle
        au temps restant à courir jusqu'à l'âge de droit commun. Dans le régime des
        salariés non agricoles, le départ pour convenance personnelle ouvert par le
        décret n° 82-1030 après 360 mois de cotisations supporte une décote de 0,5 %
        par trimestre restant à courir jusqu'à 60 ans ; le décret n° 2007-2148
        maintient ce taux, par trimestre restant à courir jusqu'à l'âge normal de la
        retraite, et porte à 55 ans l'entrée en jouissance (art. 15 ter).
      synonymes: []
    ar:
      terme: التخفيض في الجراية
      definition: >
        تخفيض يُطبَّق على الجراية في حالة الخروج المبكّر، بحسب المدّة المتبقّية إلى سنّ
        التقاعد العادية. في نظام الأجراء غير الفلاحيين، يُطبَّق على الخروج لأسباب شخصية،
        الذي فتحه الأمر عدد 1030 لسنة 1982 بعد 360 شهرًا من المساهمات، تخفيض بـ0,5 % عن
        كلّ ثلاثية متبقّية إلى سنّ الستين؛ ويحافظ الأمر عدد 2148 لسنة 2007 على هذه النسبة
        عن كلّ ثلاثية متبقّية إلى السنّ العادية للتقاعد، ويؤجّل الانتفاع بالجراية إلى سنّ
        الخامسة والخمسين (الفصل 15 ثالثًا).
      synonymes: []

  - id: limite-calcul-prestations
    acronyme: null
    statut: provisoire  # équivalent AR à valider par un locuteur — cf. issue #151
    references: [decret90-1455, loi89-73, arrete-1978-11-18-retraite-complementaire]
    source_definition: {ref: decret74-499, locator: "art. 18"}
    voir_aussi: [salaire-moyen-reference, salaire-differentiel, smig, smag]
    fr:
      terme: Limite de calcul des prestations
      definition: >
        Montant au-delà duquel les salaires ne sont pas pris en compte pour le calcul
        du salaire de référence et des prestations. Dans le régime des salariés non
        agricoles, elle est de six fois le SMIG rapporté à 2 400 heures par an
        (décret n° 74-499, art. 18, repris à l'identique par le décret n° 90-1455) ;
        le régime agricole amélioré la fixe à six fois le SMAG rapporté à 300 jours.
        Ce n'est pas un plafond de cotisation : la fraction du salaire qui l'excède
        forme l'assiette du régime complémentaire.
      synonymes: [Limite de prise en compte des salaires]
    ar:
      terme: سقف احتساب المنافع
      definition: >
        مبلغ لا تُعتمد الأجور في ما يتجاوزه لاحتساب الأجر المتوسط المرجعي والمنافع. في
        نظام الأجراء غير الفلاحيين، يساوي ستّة أضعاف الأجر الأدنى المضمون لمختلف المهن
        محتسبًا على أساس 2400 ساعة في السنة (الأمر عدد 499 لسنة 1974، الفصل 18، وقد
        أعاده الأمر عدد 1455 لسنة 1990 دون تغيير)؛ ويضبطه النظام الفلاحي المحسَّن بستّة
        أضعاف الأجر الأدنى الفلاحي المضمون محتسبًا على أساس 300 يوم. وليس سقفًا للمساهمة:
        فالجزء من الأجر الذي يتجاوزه يمثّل قاعدة النظام التكميلي.
      synonymes: []

  - id: pension-proportionnelle
    acronyme: null
    statut: valide
    references: [decret74-499, decret2007-2148]
    source_definition: {ref: decret82-1030, locator: "art. 3"}
    voir_aussi: [allocation-de-vieillesse, pension-minimale-garantie, stage-cotisation]
    fr:
      terme: Pension proportionnelle
      definition: >
        Pension servie, dans le régime des salariés non agricoles, à l'assuré qui
        atteint l'âge requis sans remplir la condition de stage mais compte au moins
        60 mois de cotisations. Instituée par le décret n° 82-1030 en remplacement de
        l'allocation de vieillesse en capital, elle est calculée sur la base de la
        pension à laquelle l'assuré aurait eu droit s'il avait accompli le stage, au
        prorata des mois cotisés. Son minimum est la moitié du SMIG, et elle est
        réversible.
      synonymes: []
    ar:
      terme: الجراية النسبية
      definition: >
        جراية تُسند، في نظام الأجراء غير الفلاحيين، إلى المضمون الذي يبلغ السنّ المطلوبة
        دون استيفاء شرط مدّة الانخراط الدنيا، ويعدّ مع ذلك 60 شهرًا من المساهمات على
        الأقلّ. أحدثها الأمر عدد 1030 لسنة 1982 عوضًا عن منحة الشيخوخة المصروفة في شكل
        رأس مال، وتُحتسب على أساس الجراية التي كان المضمون سيستحقّها لو استوفى مدّة
        الانخراط الدنيا، بنسبة الأشهر التي دفع بعنوانها مساهمات. وحدّها الأدنى نصف الأجر
        الأدنى المضمون لمختلف المهن، وهي قابلة للتحويل إلى القرين الباقي على قيد الحياة.
      synonymes: []

  - id: revalorisation-pensions
    acronyme: null
    statut: valide
    references: [decret74-499, decret2001-779, loi81-6, loi89-73]
    source_definition: {ref: decret81-187, locator: "art. 1 (art. 53 nouveau)"}
    voir_aussi: [perequation, smig, smag]
    fr:
      terme: Revalorisation des pensions
      definition: >
        Ajustement du montant des pensions liquidées du secteur privé par référence au
        salaire minimum. Dans le régime des salariés non agricoles, la révision
        discrétionnaire de 1974 (décret n° 74-499, art. 53) devient automatique à
        chaque augmentation du SMIG, avec effet au 1^er^ mai 1980, sous la forme d'une
        somme égale à la hausse du SMIG horaire rapportée à 200 heures et affectée du
        taux de la pension (décret n° 81-187) ; depuis le 1^er^ janvier 2001, la
        pension est augmentée du taux de variation du SMIG (décret n° 2001-779). Les
        régimes agricoles la rattachent au SMAG (loi n° 81-6, art. 80). Son
        équivalent dans le secteur public est la péréquation.
      synonymes: [Revalorisation]
    ar:
      terme: تعديل الجرايات
      definition: >
        تعديل مبلغ الجرايات المصفّاة في القطاع الخاص بالرجوع إلى الأجر الأدنى. في نظام
        الأجراء غير الفلاحيين، تحوّلت المراجعة التقديرية لسنة 1974 (الأمر عدد 499 لسنة
        1974، الفصل 53) إلى تعديل آلي عند كلّ زيادة في الأجر الأدنى المضمون لمختلف المهن،
        ابتداءً من غرّة ماي 1980، في شكل مبلغ يساوي الزيادة في الأجر الأدنى بالساعة محتسبة
        على أساس 200 ساعة ومضروبة في نسبة الجراية (الأمر عدد 187 لسنة 1981)؛ ومنذ غرّة
        جانفي 2001، تُرفَع الجراية بنسبة تطوّر الأجر الأدنى المضمون (الأمر عدد 779 لسنة
        2001). وتربطه الأنظمة الفلاحية بالأجر الأدنى الفلاحي المضمون (القانون عدد 6 لسنة
        1981، الفصل 80). ويقابله في القطاع العمومي تنظير الجرايات.
      synonymes: [الترفيع في الجرايات, التعديل الآلي للجرايات]

  - id: salaire-differentiel
    acronyme: null
    statut: provisoire  # équivalent AR à valider par un locuteur — cf. issue #151
    references: []
    source_definition: {ref: arrete-1978-11-18-retraite-complementaire, locator: "règlement, art. 1 et 6"}
    voir_aussi: [limite-calcul-prestations]
    fr:
      terme: Salaire différentiel
      definition: >
        Fraction du salaire qui excède la limite fixée par le régime légal pour le
        calcul des prestations, et qui forme l'assiette du régime complémentaire de
        pension de vieillesse, d'invalidité et de survivants organisé par l'arrêté du
        ministre des affaires sociales du 18 novembre 1978 (règlement, art. 1 et 6).
        Il commence là où s'arrête la limite de six fois le SMIG et se déplace avec
        elle.
      synonymes: []
    ar:
      terme: الأجر التفاضلي
      definition: >
        الجزء من الأجر الذي يتجاوز السقف الذي يضبطه النظام القانوني لاحتساب المنافع،
        ويمثّل قاعدة النظام التكميلي لجرايات الشيخوخة والعجز والباقين على قيد الحياة الذي
        ينظّمه قرار وزير الشؤون الاجتماعية المؤرّخ في 18 نوفمبر 1978 (الترتيب، الفصلان 1
        و6). ويبدأ حيث ينتهي سقف ستّة أضعاف الأجر الأدنى المضمون لمختلف المهن، ويتحرّك
        بتحرّكه.
      synonymes: []

  - id: salaire-moyen-reference
    acronyme: null
    statut: provisoire  # équivalent AR à valider par un locuteur — cf. issue #151
    references: [decret90-1455, loi81-6, loi89-73]
    source_definition: {ref: decret74-499, locator: "art. 18-19"}
    voir_aussi: [limite-calcul-prestations, taux-de-liquidation, smag]
    fr:
      terme: Salaire moyen de référence
      definition: >
        Assiette de la pension dans les régimes du secteur privé, calculée comme une
        moyenne de salaires sur une période qui précède l'ouverture du droit. Dans le
        régime des salariés non agricoles, il est établi sur les trois ou cinq
        dernières années, la période la plus avantageuse étant retenue (décret
        n° 74-499, art. 18-19), puis, depuis le décret n° 90-1455, sur les dix
        dernières années, avec des salaires actualisés selon un barème fixé par
        arrêté ; il est borné par la limite de calcul des prestations. Dans le régime
        des salariés agricoles, il est forfaitaire : le SMAG rapporté à 300 jours,
        affecté du coefficient de qualification, sur les trois ou cinq dernières
        années (loi n° 81-6, art. 50).
      synonymes: [Salaire de référence]
    ar:
      terme: الأجر المتوسط المرجعي
      definition: >
        قاعدة احتساب الجراية في أنظمة القطاع الخاص، وتُحتسب معدّلًا للأجور على فترة سابقة
        لفتح الحقّ. في نظام الأجراء غير الفلاحيين، يُضبط على أساس السنوات الثلاث أو الخمس
        الأخيرة، مع اعتماد الفترة الأفضل (الأمر عدد 499 لسنة 1974، الفصلان 18 و19)، ثمّ،
        منذ الأمر عدد 1455 لسنة 1990، على أساس السنوات العشر الأخيرة، مع تحيين الأجور
        وفق جدول يُضبط بقرار؛ ويحدّه سقف احتساب المنافع. وفي نظام الأجراء الفلاحيين، هو
        أجر جزافي: الأجر الأدنى الفلاحي المضمون محتسبًا على أساس 300 يوم ومضروبًا في
        ضارب التأهيل، على السنوات الثلاث أو الخمس الأخيرة (القانون عدد 6 لسنة 1981،
        الفصل 50).
      synonymes: [الأجر المرجعي]

  - id: smag
    acronyme: SMAG
    statut: valide
    references: []
    source_definition: {ref: loi81-6, locator: "art. 18 et 50"}
    voir_aussi: [smig, rsa, rsaa]
    fr:
      terme: Salaire minimum agricole garanti
      definition: >
        Salaire minimum légal applicable aux salariés du secteur agricole, exprimé
        par journée de travail. Il sert de référence aux régimes agricoles de
        sécurité sociale : le salaire de référence du régime des salariés agricoles
        en est un multiple (loi n° 81-6, art. 18 et 50), et la pension minimale, la
        limite de calcul et la revalorisation du régime agricole amélioré
        s'expriment par rapport à lui.
      synonymes: [SMAG]
    ar:
      terme: الأجر الأدنى الفلاحي المضمون
      definition: >
        الحدّ الأدنى القانوني للأجر المطبَّق على أجراء القطاع الفلاحي، ويُعبَّر عنه
        باليوم. ويُعتمد مرجعًا لأنظمة الضمان الاجتماعي في القطاع الفلاحي: فالأجر
        المرجعي لنظام الأجراء الفلاحيين مضاعف له (القانون عدد 6 لسنة 1981، الفصلان 18
        و50)، وتُضبط الجراية الدنيا وسقف الاحتساب وتعديل الجرايات في النظام الفلاحي
        المحسَّن بالرجوع إليه.
      synonymes: []

  - id: rsna
    acronyme: RSNA
    statut: valide
    references: [decret74-499, loi60-33]
    source_definition: {ref: loi60-30}
    voir_aussi: [cnss, rsa, rtns, rtte]
    fr:
      terme: Régime des salariés non agricoles
      definition: >
        Régime de sécurité sociale des salariés du secteur non agricole, institué par
        la loi n° 60-30 du 14 décembre 1960 et géré par la CNSS. Sa branche des
        pensions de vieillesse, d'invalidité et de survivants est régie par le décret
        n° 74-499 du 27 avril 1974, en vigueur au 1^er^ janvier 1974, auquel
        renvoient les régimes des travailleurs non salariés et des Tunisiens à
        l'étranger.
      synonymes: []
    ar:
      terme: نظام الأجراء غير الفلاحيين
      definition: >
        نظام الضمان الاجتماعي لأجراء القطاع غير الفلاحي، أحدثه القانون عدد 30 لسنة 1960
        المؤرّخ في 14 ديسمبر 1960 ويديره الصندوق الوطني للضمان الاجتماعي. ويخضع فرعه
        الخاصّ بجرايات الشيخوخة والعجز والباقين على قيد الحياة للأمر عدد 499 لسنة 1974
        المؤرّخ في 27 أفريل 1974، النافذ منذ غرّة جانفي 1974، والذي تحيل إليه أنظمة
        العملة غير الأجراء والعملة التونسيين بالخارج.
      synonymes: []

  - id: rsa
    acronyme: RSA
    statut: valide
    references: []
    source_definition: {ref: loi81-6, locator: "titres I et II"}
    voir_aussi: [rsaa, smag, cnss]
    fr:
      terme: Régime des salariés agricoles
      definition: >
        Régime de sécurité sociale des salariés agricoles, organisé par les titres I
        et II de la loi n° 81-6 du 12 février 1981, en vigueur au 1^er^ janvier 1981,
        et géré par la CNSS. Sa pension repose sur un salaire de référence
        forfaitaire, multiple du SMAG, et elle est révisée à chaque paiement
        proportionnellement à la variation du SMAG.
      synonymes: []
    ar:
      terme: نظام الأجراء الفلاحيين
      definition: >
        نظام الضمان الاجتماعي للأجراء الفلاحيين، ينظّمه العنوانان الأوّل والثاني من
        القانون عدد 6 لسنة 1981 المؤرّخ في 12 فيفري 1981، النافذ منذ غرّة جانفي 1981،
        ويديره الصندوق الوطني للضمان الاجتماعي. وتقوم جرايته على أجر مرجعي جزافي مضاعف
        للأجر الأدنى الفلاحي المضمون، وتُراجَع عند كلّ صرف بنسبة تطوّر هذا الأجر.
      synonymes: []

  - id: rsaa
    acronyme: RSAA
    statut: provisoire  # équivalent AR à valider par un locuteur — cf. issue #151
    references: [loi81-6]
    source_definition: {ref: loi89-73}
    voir_aussi: [rsa, smag, limite-calcul-prestations]
    fr:
      terme: Régime agricole amélioré
      definition: >
        Régime ajouté à la loi n° 81-6 sous la forme d'un titre III par la loi
        n° 89-73 du 2 septembre 1989, en vigueur au 1^er^ octobre 1989. Il s'applique
        aux coopérateurs salariés des sociétés et coopératives agricoles, aux
        salariés des exploitants employant au moins trente salariés permanents et à
        certains pêcheurs et petits armateurs. Il renvoie aux règles du régime des
        salariés agricoles dans la mesure où il n'y déroge pas, mais retient des
        salaires réels, bornés à six fois le SMAG, et fixe une pension minimale égale
        à la moitié du SMAG rapporté à 300 jours.
      synonymes: [Régime des salariés agricoles amélioré]
    ar:
      terme: النظام الفلاحي المحسَّن
      definition: >
        نظام أُضيف إلى القانون عدد 6 لسنة 1981 في شكل عنوان ثالث بمقتضى القانون عدد 73
        لسنة 1989 المؤرّخ في 2 سبتمبر 1989، النافذ منذ غرّة أكتوبر 1989. ويشمل الأجراء
        المتعاضدين في الشركات والتعاضديات الفلاحية، وأجراء المستغلّين الذين يشغّلون ثلاثين
        أجيرًا قارًّا على الأقلّ، وبعض البحّارة وصغار المجهّزين. ويحيل إلى قواعد نظام
        الأجراء الفلاحيين في ما لم يُخالفها، لكنّه يعتمد الأجور الفعلية في حدود ستّة أضعاف
        الأجر الأدنى الفلاحي المضمون، ويضبط جراية دنيا تساوي نصف هذا الأجر محتسبًا على
        أساس 300 يوم.
      synonymes: []

  - id: rtns
    acronyme: RTNS
    statut: provisoire  # équivalent AR à valider par un locuteur — cf. issue #151
    references: [decret74-499]
    source_definition: {ref: decret95-1166, locator: "art. 1"}
    voir_aussi: [rsna, rtte, cnss]
    fr:
      terme: Régime des travailleurs non salariés
      definition: >
        Régime de sécurité sociale des travailleurs non salariés des secteurs
        agricole et non agricole, institué par le décret n° 95-1166 du 3 juillet 1995
        et géré par la CNSS. Il procède par extension : son article premier rend
        applicables aux non-salariés des articles de la loi n° 60-30 et les articles
        du décret n° 74-499 relatifs à l'invalidité, aux survivants et à la
        liquidation des pensions.
      synonymes: []
    ar:
      terme: نظام العملة غير الأجراء
      definition: >
        نظام الضمان الاجتماعي للعملة غير الأجراء في القطاعين الفلاحي وغير الفلاحي، أحدثه
        الأمر عدد 1166 لسنة 1995 المؤرّخ في 3 جويلية 1995 ويديره الصندوق الوطني للضمان
        الاجتماعي. ويقوم على التمديد: إذ يجعل فصله الأوّل فصولًا من القانون عدد 30 لسنة
        1960 وفصول الأمر عدد 499 لسنة 1974 المتعلّقة بالعجز والباقين على قيد الحياة
        وتصفية الجرايات منطبقةً على غير الأجراء.
      synonymes: []

  - id: rtte
    acronyme: RTTE
    statut: valide
    references: [decret74-499]
    source_definition: {ref: decret89-107, locator: "art. 1"}
    voir_aussi: [rsna, rtns, cnss]
    fr:
      terme: Régime des travailleurs tunisiens à l'étranger
      definition: >
        Régime de sécurité sociale des travailleurs tunisiens à l'étranger, salariés
        ou non, qui ne sont pas couverts par une convention bilatérale, institué par
        le décret n° 89-107 du 10 janvier 1989. L'adhésion y est volontaire, mais
        couvre obligatoirement les pensions en même temps que les assurances
        sociales. Il étend à ces travailleurs les articles du décret n° 74-499
        relatifs à l'invalidité, aux survivants et à la liquidation, et la gestion
        des pensions en est déléguée à la Caisse d'assurance vieillesse, d'invalidité
        et de survivants (CAVIS).
      synonymes: []
    ar:
      terme: نظام الضمان الاجتماعي للعملة التونسيين بالخارج
      definition: >
        نظام الضمان الاجتماعي للعملة التونسيين بالخارج، أجراء كانوا أو غير أجراء، غير
        المشمولين باتّفاقية ثنائية، أحدثه الأمر عدد 107 لسنة 1989 المؤرّخ في 10 جانفي
        1989. والانخراط فيه اختياري، لكنّه يشمل وجوبًا الجرايات والتأمينات الاجتماعية
        معًا. ويمدّد إلى هؤلاء العملة فصول الأمر عدد 499 لسنة 1974 المتعلّقة بالعجز
        والباقين على قيد الحياة وتصفية الجرايات، وتُفوَّض إدارة الجرايات فيه إلى صندوق
        التأمين على الشيخوخة والعجز والباقين على قيد الحياة.
      synonymes: [نظام العملة التونسيين بالخارج]

  - id: regime-artistes
    acronyme: null
    statut: valide
    references: [decret2003-894, loi2007-43]
    source_definition: {ref: loi2002-104, locator: "art. 1"}
    voir_aussi: [cnss, rtns]
    fr:
      terme: Régime des artistes, créateurs et intellectuels
      definition: >
        Régime de sécurité sociale des artistes, créateurs et intellectuels, créé par
        la loi n° 2002-104 du 30 décembre 2002 et géré par la CNSS ; il comprend
        notamment les pensions de vieillesse, d'invalidité et de survivants (art. 1).
        Le décret n° 2003-894 du 21 avril 2003 en fixe les modalités d'application.
      synonymes: []
    ar:
      terme: نظام الضمان الاجتماعي للفنانين والمبدعين والمثقفين
      definition: >
        نظام الضمان الاجتماعي للفنانين والمبدعين والمثقفين، أحدثه القانون عدد 104 لسنة
        2002 المؤرّخ في 30 ديسمبر 2002 ويديره الصندوق الوطني للضمان الاجتماعي؛ ويشمل
        خاصّةً جرايات الشيخوخة والعجز والباقين على قيد الحياة (الفصل 1). ويضبط الأمر عدد
        894 لسنة 2003 المؤرّخ في 21 أفريل 2003 صيغ تطبيقه.
      synonymes: [نظام الفنانين والمبدعين والمثقفين]

  - id: regime-bas-revenus
    acronyme: null
    statut: valide  # correspondance avec la loi n° 2002-32 attestée ; terme AR à confirmer — cf. issue #151
    references: []
    source_definition: {ref: loi2002-32, locator: "art. 1"}
    voir_aussi: [cnss, rsna, rsa]
    fr:
      terme: Régime des travailleurs à faibles revenus
      definition: >
        Régime de sécurité sociale institué par la loi n° 2002-32 du 12 mars 2002 pour
        certaines catégories de travailleurs des secteurs agricole et non agricole :
        les employés de maison ; les personnes employées par l'État, les collectivités
        locales et les établissements publics administratifs qui ne sont couvertes par
        aucun autre régime ; les petits pêcheurs et petits armateurs ; les
        agriculteurs exploitant au plus cinq hectares en sec ou un hectare en irrigué ;
        les artisans travaillant à la pièce (art. 1). La loi ne lui donne pas de nom
        abrégé. La pension de vieillesse y est ouverte à 65 ans après 120 mois de
        cotisations, pour un montant minimum de 30 % du salaire minimum garanti du
        secteur, dans la limite de 80 % (art. 13-14).
      synonymes: [Régime des bas revenus]
    ar:
      terme: نظام العملة ذوي الدخل الضعيف
      definition: >
        نظام الضمان الاجتماعي الذي أحدثه القانون عدد 32 لسنة 2002 المؤرّخ في 12 مارس 2002
        لبعض أصناف العملة في القطاعين الفلاحي وغير الفلاحي: عملة المنازل؛ والأشخاص الذين
        تشغّلهم الدولة والجماعات المحلية والمؤسسات العمومية الإدارية غير المشمولين بأيّ
        نظام آخر؛ وصغار البحّارة وصغار المجهّزين؛ والفلاحون الذين يستغلّون خمس هكتارات على
        الأكثر في البعل أو هكتارًا واحدًا في السقوي؛ والحرفيون العاملون بالقطعة (الفصل 1).
        ولا يمنحه القانون تسمية مختصرة. وتُفتح فيه جراية الشيخوخة في سنّ الخامسة والستين بعد
        120 شهرًا من المساهمات، بمبلغ أدنى يساوي 30 % من الأجر الأدنى المضمون لقطاع
        انتماء المضمون، في حدود 80 % (الفصلان 13 و14).
      synonymes: [نظام ذوي الدخل الضعيف]

  # --- Index

  - id: coordination-des-regimes
    acronyme: null
    statut: provisoire  # équivalent AR à valider par un locuteur — cf. issue #151
    references: [loi2003-8, decret2003-1128, cnrps-manuel-liquidation-2013]
    source_definition: {ref: loi88-84}
    voir_aussi: [validation-des-services, cnrps, cnss]
    fr:
      terme: Coordination des régimes
      definition: >
        Ensemble des règles qui fixent les droits à pension de la personne ayant
        relevé de plusieurs régimes légaux d'assurance vieillesse, d'invalidité et de
        survivants. Elle fait l'objet de la loi n° 88-84 du 16 juillet 1988, puis de
        la loi n° 2003-8 du 21 janvier 2003, portant liquidation des droits des
        personnes bénéficiant de la couverture de plusieurs régimes légaux, et du
        décret n° 2003-1128 du 19 mai 2003.
      synonymes: []
    ar:
      terme: التنسيق بين أنظمة الضمان الاجتماعي
      definition: >
        مجموع القواعد التي تضبط حقوق الشخص الذي انتمى إلى عدّة أنظمة قانونية للتأمين على
        الشيخوخة والعجز والباقين على قيد الحياة في الجراية. وهو موضوع القانون عدد 84 لسنة
        1988 المؤرّخ في 16 جويلية 1988، ثمّ القانون عدد 8 لسنة 2003 المؤرّخ في 21 جانفي
        2003 المتعلّق بتصفية حقوق الأشخاص المنتفعين بتغطية عدّة أنظمة قانونية، والأمر عدد
        1128 لسنة 2003 المؤرّخ في 19 ماي 2003.
      synonymes: [التنسيق بين الأنظمة]
