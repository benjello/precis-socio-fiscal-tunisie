    voir_aussi: [tva, option-assujettissement, chiffre-affaires-imposable]
    fr:
      terme: Assujetti
      definition: >
        Personne qui réalise des opérations soumises à la taxe sur la valeur
        ajoutée et qui est, à ce titre, redevable de la taxe et titulaire du
        droit à déduction. L'article 2 du code en fixe la liste.
      synonymes: []
    ar:
      terme: الخاضع للأداء
      definition: ""
      synonymes: []

  - id: option-assujettissement
    acronyme: null
