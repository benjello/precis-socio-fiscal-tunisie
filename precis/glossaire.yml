      definition: >
        Régime obligatoire institué par un décret du 12 avril 1951 en faveur
        des personnels de l'État et des collectivités publiques, qui couvre les
        interventions chirurgicales, la longue maladie et le décès. Géré d'abord
        par la Société de prévoyance des fonctionnaires et employés tunisiens,
        il est confié en 1959 à la Caisse de prévoyance sociale (loi n° 59-45,
        art. 1).
      synonymes: []
    ar:
      terme: نظام الحيطة
      definition: >
        نظام إجباري أُحدث بأمر مؤرخ في 12 أفريل 1951 لفائدة أعوان الدولة
        والجماعات العمومية، يغطي العمليات الجراحية والأمراض الطويلة الأمد
        والوفاة. تصرّفت فيه أولًا الجمعية الاحتياطية للموظفين والمستخدمين
        التونسيين، ثم عُهد به سنة 1959 إلى صندوق الحيطة الاجتماعية (القانون
        عدد 45 لسنة 1959، الفصل 1).
      synonymes: [نظام احتياطي]

  - id: caisse-compensation-allocations-familiales
    acronyme: null
