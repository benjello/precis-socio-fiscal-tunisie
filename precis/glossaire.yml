# Glossaire bilingue — source unique de vérité (FR ⇄ AR)
#
# Fichier global partagé par tous les précis. Chaque entrée est identifiée par
# un `id` (slug stable) qui sert d'ancre commune `#g-<id>` dans les deux langues.
#
# À partir de ce fichier, `scripts/build_glossary.py` génère :
#   - l'annexe glossaire FR et AR de chaque précis ;
#   - `translation_glossary.generated.md`, table FR↔AR injectée dans le pipeline
#     de traduction (translate_sync.py / verify_translation.py) pour garantir la
#     bijection des termes et éviter les divergences.
#
# Champs : id, acronyme, statut (valide | provisoire), references (clés CSL),
# voir_aussi (slugs), fr/ar { terme, definition, synonymes }.
# NE PAS modifier les fichiers générés à la main : éditez ce glossaire.

entries:
  - id: precis-socio-fiscal
    acronyme: null
    statut: valide
    references: []
    voir_aussi: []
    fr:
      terme: Précis socio-fiscal
      definition: >
        Ouvrage de synthèse documentant l'évolution de la législation sociale
        et fiscale tunisienne depuis l'indépendance, dans son contexte
        historique et politique.
      synonymes: []
    ar:
      terme: الملخّص الاجتماعي والجبائي
      definition: >
        مُصنَّف توليفي يوثّق تطوّر التشريع الاجتماعي والجبائي التونسي منذ
        الاستقلال، في سياقه التاريخي والسياسي.
      synonymes: []

  - id: secteur-public
    acronyme: null
    statut: valide
    references: []
    voir_aussi: [fonction-publique, emploi-public, administrations-publiques, entreprises-publiques]
    fr:
      terme: Secteur public
      definition: >
        Ensemble des organisations contrôlées ou détenues par l'État :
        administrations publiques (État, collectivités locales, sécurité
        sociale) et entreprises publiques. Notion plus large que la fonction
        publique et que l'emploi public.
      synonymes: []
    ar:
      terme: القطاع العام
      definition: >
        مجموع المنظمات التي تسيطر عليها الدولة أو تملكها: الإدارات العمومية
        (الدولة، الجماعات المحلية، الضمان الاجتماعي) والمنشآت العمومية. مفهوم
        أوسع من الوظيفة العمومية ومن التشغيل العمومي.
      synonymes: []

  - id: fonction-publique
    acronyme: null
    statut: valide
    references: [loi83-112]
    source_definition: {ref: loi83-112, locator: "art. 1"}
    source_traduction: {ref: loi83-112, locator: "art. 1"}
    voir_aussi: [emploi-public, secteur-public, epa]
    fr:
      terme: Fonction publique
      definition: >
        Au sens strict, ensemble des agents de l'État, des collectivités
        locales et des établissements publics à caractère administratif, régis
        par le statut général (loi n°83-112).
      synonymes: []
    ar:
      terme: الوظيفة العمومية
      definition: >
        بالمعنى الضيّق، مجموع أعوان الدولة والجماعات المحلية والمؤسسات العمومية
        ذات الصبغة الإدارية، الخاضعين للنظام الأساسي العام (القانون عدد 83-112).
      synonymes: []

  - id: emploi-public
    acronyme: null
    statut: provisoire
    references: []
    voir_aussi: [fonction-publique, secteur-public]
    fr:
      terme: Emploi public
      definition: >
        Concept statistique recouvrant la fonction publique et une partie des
        agents des établissements et entreprises publics ; intermédiaire entre
        la fonction publique et le secteur public.
      synonymes: []
    ar:
      terme: التشغيل العمومي
      definition: >
        مفهوم إحصائي يشمل الوظيفة العمومية وجزءًا من أعوان المؤسسات والمنشآت
        العمومية؛ وسيط بين الوظيفة العمومية والقطاع العام.
      synonymes: []

  - id: administrations-publiques
    acronyme: null
    statut: provisoire
    references: [sna2008, imfgfsm2014]
    source_definition: {ref: sna2008}
    voir_aussi: [entreprises-publiques, secteur-public, fonds-de-securite-sociale, masse-salariale]
    fr:
      terme: Administrations publiques
      definition: >
        Sous-secteur des comptes nationaux (General Government) regroupant
        l'administration centrale, les administrations locales et les fonds de
        sécurité sociale, financés principalement par des prélèvements
        obligatoires.
      synonymes: []
    ar:
      terme: الإدارات العمومية
      definition: >
        قطاع فرعي في الحسابات الوطنية يضمّ الإدارة المركزية والإدارات المحلية
        وصناديق الضمان الاجتماعي، ويُموَّل أساسًا من الاقتطاعات الإجبارية.
      synonymes: []

  - id: entreprises-publiques
    acronyme: null
    statut: provisoire
    references: [loi89-9, sna2008]
    source_definition: {ref: loi89-9, locator: "art. 8"}
    source_traduction: {ref: loi89-9}
    voir_aussi: [administrations-publiques, epna, epic]
    fr:
      terme: Entreprises publiques
      definition: >
        Sous-secteur des comptes nationaux (Public Corporations) regroupant les
        unités contrôlées par l'État qui produisent des biens et services
        marchands ; au sens juridique, périmètre défini par la loi n°89-9.
      synonymes: []
    ar:
      terme: المنشآت العمومية
      definition: >
        قطاع فرعي في الحسابات الوطنية يضمّ الوحدات التي تسيطر عليها الدولة
        وتنتج سلعًا وخدمات سوقية؛ وبالمعنى القانوني، نطاق يحدّده القانون عدد 89-9.
      synonymes: []

  - id: epa
    acronyme: EPA
    statut: provisoire
    references: [loi83-112]
    source_definition: {ref: loi83-112}
    source_traduction: {ref: loi83-112}
    voir_aussi: [epna, epic, fonction-publique]
    fr:
      terme: Établissement public à caractère administratif
      definition: >
        Organisme public doté de la personnalité morale et de l'autonomie
        financière, exerçant une mission administrative ; son personnel relève
        généralement de la fonction publique.
      synonymes: [EPA]
    ar:
      terme: المؤسسة العمومية ذات الصبغة الإدارية
      definition: >
        هيكل عمومي يتمتّع بالشخصية المعنوية والاستقلال المالي، يمارس مهمّة
        إدارية؛ وينتمي أعوانه عمومًا إلى الوظيفة العمومية.
      synonymes: []

  - id: epna
    acronyme: EPNA
    statut: provisoire
    references: [loi89-9]
    source_definition: {ref: loi89-9, locator: "art. 8"}
    source_traduction: {ref: loi89-9}
    voir_aussi: [epa, epic, entreprises-publiques]
    fr:
      terme: Établissement public à caractère non administratif
      definition: >
        Organisme public doté de la personnalité morale et de l'autonomie de
        gestion, exerçant une activité technique, économique ou sociale ;
        certains EPNA sont, par décret, considérés comme entreprises publiques.
      synonymes: [EPNA]
    ar:
      terme: المؤسسة العمومية التي لا تكتسي صبغة إدارية
      definition: >
        هيكل عمومي يتمتّع بالشخصية المعنوية واستقلالية التصرّف، يمارس نشاطًا
        فنّيًا أو اقتصاديًا أو اجتماعيًا؛ وتُعتبر بعض هذه المؤسسات، بمقتضى أمر،
        منشآت عمومية.
      synonymes: []

  - id: epic
    acronyme: EPIC
    statut: provisoire
    references: [loi85-78]
    source_definition: {ref: loi85-78}
    source_traduction: {ref: loi85-78}
    voir_aussi: [epna, entreprises-publiques, regime-conventionnel-public]
    fr:
      terme: Établissement public à caractère industriel et commercial
      definition: >
        Établissement public exerçant une activité industrielle ou
        commerciale, dont les agents relèvent de la loi n°85-78 et non du statut
        général de la fonction publique.
      synonymes: [EPIC]
    ar:
      terme: المؤسسة العمومية ذات الصبغة الصناعية والتجارية
      definition: >
        مؤسسة عمومية تمارس نشاطًا صناعيًا أو تجاريًا، يخضع أعوانها للقانون عدد
        85-78 لا للنظام الأساسي العام للوظيفة العمومية.
      synonymes: []

  - id: regime-indiciaire
    acronyme: null
    statut: provisoire
    references: [loi83-112, decret-97-1832, decret-2007-268]
    voir_aussi: [grille-des-salaires, traitement-de-base, point-indice, grade, echelon, fonction-publique]
    fr:
      terme: Régime indiciaire
      definition: >
        Régime de rémunération de la fonction publique, des collectivités
        locales et d'une partie des établissements publics à caractère
        administratif, fondé sur un grade et un échelon. En droit positif
        tunisien, à chaque couple grade × échelon correspond un traitement de
        base mensuel fixé directement en dinars par les grilles annexées aux
        décrets (décret n°97-1832, décret n°2007-268) ; le « point d'indice »,
        hérité du modèle français de carrière, subsiste dans le vocabulaire
        mais n'opère pas comme paramètre multiplicateur.
      synonymes: []
    ar:
      terme: النظام الاستدلالي للتأجير
      definition: >
        نظام تأجير الوظيفة العمومية والجماعات المحلية وجزء من المؤسسات العمومية
        ذات الصبغة الإدارية، يقوم على رتبة ودرجة. وفي القانون الوضعي التونسي،
        يقابل كلَّ ثنائي رتبة × درجة مرتبٌ أساسي شهري محدَّد مباشرة بالدينار في
        الشبكات المُلحقة بالأوامر (الأمر عدد 97-1832 والأمر عدد 2007-268)؛ أمّا
        «النقطة الاستدلالية» الموروثة عن النموذج الفرنسي للمسار المهني فلا تزال
        قائمة في المصطلحات لكنّها لا تعمل كمُعامِل ضربٍ.
      synonymes: []

  - id: regime-statutaire-autonome
    acronyme: null
    statut: provisoire
    references: [loi83-112, loi67-29, loi67-20, loi82-70]
    source_definition: {ref: loi83-112, locator: "art. 1er"}
    voir_aussi: [regime-indiciaire, fonction-publique, forces-de-securite-interieure, statut-particulier, magistrat, solde-militaire, pensions-civiles-militaires]
    fr:
      terme: Régime statutaire autonome
      definition: >
        Régime de rémunération propre à des corps dotés d'un statut spécial
        (magistrats, militaires, forces de sécurité intérieure), détaché du
        statut commun de la fonction publique. Ce détachement procède d'une
        clause d'exclusion de champ, et non d'une sortie progressive : l'article
        premier de la loi n°83-112 portant statut général écarte ces corps de
        son champ d'application
        et les renvoie à leurs textes propres — loi n°67-29 (magistrats de
        l'ordre judiciaire), loi n°67-20 (militaires), loi n°82-70 (forces de
        sécurité intérieure). Le corps des agents des douanes relève, lui, d'un
        statut séparé encore (loi n°95-46).
      synonymes: [statut spécial]
    ar:
      terme: النظام الأساسي الخاص
      definition: >
        نظام تأجير خاصّ بأسلاك تتمتّع بنظام أساسي خاصّ (القضاة، العسكريون، قوات
        الأمن الداخلي)، منفصل عن النظام الأساسي العام للوظيفة العمومية. وهذا
        الانفصال ناتج عن بند استثناء من مجال التطبيق، لا عن خروج تدريجي: فالفصل
        الأول من القانون عدد 83-112 المتعلّق بالنظام الأساسي العام يُخرج هذه
        الأسلاك من مجال تطبيقه
        ويحيلها إلى نصوصها الخاصّة — القانون عدد 67-29 (القضاة العدليون)،
        والقانون عدد 67-20 (العسكريون)، والقانون عدد 82-70 (قوات الأمن الداخلي).
        أمّا سلك أعوان الديوانة فيخضع لنظام أساسي منفصل آخر (القانون عدد 95-46).
      synonymes: []

  - id: magistrat
    acronyme: null
    statut: valide
    references: [loi67-29, loi72-40, decret-loi-70-6]
    source_definition: {ref: loi67-29}
    source_traduction: {ref: loi67-29}
    voir_aussi: [regime-statutaire-autonome, pensions-civiles-militaires]
    fr:
      terme: Magistrat
      definition: >
        Membre d'un corps de magistrats doté d'un statut propre, distinct du
        statut général de la fonction publique. Le droit tunisien connaît trois
        statuts distincts : les magistrats de l'ordre judiciaire (loi n°67-29 du
        14 juillet 1967), les magistrats du Tribunal administratif (loi n°72-40
        du 1ᵉʳ juin 1972) et les membres de la Cour des comptes (décret-loi
        n°70-6 du 26 septembre 1970). Le barème de rémunération de chaque corps
        relève de ses dispositions statutaires propres.
      synonymes: []
    ar:
      terme: القاضي
      definition: >
        عضو في سلك من أسلاك القضاة يتمتّع بنظام أساسي خاصّ به، متميّز عن النظام
        الأساسي العام للوظيفة العمومية. ويعرف القانون التونسي ثلاثة أنظمة
        أساسية متمايزة: قضاة القضاء العدلي (القانون عدد 67-29 المؤرّخ في 14
        جويلية 1967)، وقضاة المحكمة الإدارية (القانون عدد 72-40 المؤرّخ في غرّة
        جوان 1972)، وأعضاء دائرة المحاسبات (المرسوم عدد 70-6 المؤرّخ في 26
        سبتمبر 1970). ويخضع سُلَّم تأجير كلّ سلك لأحكامه الأساسية الخاصّة.
      synonymes: []

  - id: solde-militaire
    acronyme: null
    statut: provisoire  # équivalent AR à valider par un locuteur — cf. issue #53

    references: [decret-79-96, decret-67-158]
    source_definition: {ref: decret-79-96}
    voir_aussi: [regime-statutaire-autonome, traitement-de-base, regime-indiciaire]
    fr:
      terme: Solde (militaire)
      definition: >
        Rémunération de base des militaires, équivalent du traitement de base de
        la fonction publique mais établi hors de la grille indiciaire de droit
        commun. Le décret n°79-96 du 11 janvier 1979 fixe la solde des
        militaires « non classés dans la grille des salaires mensuels de la
        fonction publique » ; l'intitulé même atteste que la rémunération
        militaire n'est pas adossée à la grille indiciaire. À cette solde
        s'ajoutent des indemnités liées aux sujétions du service.
      synonymes: []
    ar:
      terme: المرتّب العسكري
      definition: >
        الأجر الأساسي للعسكريين، المقابل للمرتّب الأساسي في الوظيفة العمومية لكن
        المضبوط خارج الشبكة الاستدلالية للقانون العام. يضبط الأمر عدد 79-96
        المؤرّخ في 11 جانفي 1979 مرتّب العسكريين «غير المصنّفين في شبكة الأجور
        الشهرية للوظيفة العمومية»؛ ويشهد العنوان ذاته على أنّ التأجير العسكري لا
        يستند إلى الشبكة الاستدلالية. وتُضاف إلى هذا المرتّب منحٌ مرتبطة بأعباء
        الخدمة.
      synonymes: []

  - id: pensions-civiles-militaires
    acronyme: null
    statut: provisoire  # équivalent AR à valider par un locuteur — cf. issue #54

    references: [loi85-12, loi2019-37]
    source_definition: {ref: loi85-12}
    voir_aussi: [cnrps, regime-statutaire-autonome, solde-militaire, cotisations-sociales]
    fr:
      terme: Pensions civiles et militaires
      definition: >
        Régime de retraite commun aux agents civils et militaires du secteur
        public, géré par la Caisse nationale de retraite et de prévoyance
        sociale (CNRPS) : il n'existe pas de caisse militaire distincte. Ce
        régime est fixé par la loi n°85-12 du 5 mars 1985 portant régime des
        pensions civiles et militaires de retraite et des survivants dans le
        secteur public, modifiée notamment par la loi n°2019-37. Au sein de ce
        régime commun, le volet militaire connaît des paramètres dérogatoires
        (durées de services et âges de jouissance différenciés selon le grade).
      synonymes: []
    ar:
      terme: الجرايات المدنية والعسكرية
      definition: >
        نظام تقاعد مشترك بين الأعوان المدنيين والعسكريين في القطاع العام، يديره
        الصندوق الوطني للتقاعد والحيطة الاجتماعية: ولا يوجد صندوق عسكري منفصل.
        يضبط هذا النظامَ القانونُ عدد 85-12 المؤرّخ في 5 مارس 1985 المتعلّق
        بنظام جرايات التقاعد والباقين على قيد الحياة المدنية والعسكرية في القطاع
        العام، المنقَّح خاصّةً بالقانون عدد 2019-37. وضمن هذا النظام المشترك،
        يعرف الشقّ العسكري معاييرَ استثنائية (مدد خدمة وأعمار انتفاع متمايزة حسب
        الرتبة).
      synonymes: []

  - id: statut-particulier
    acronyme: null
    statut: provisoire
    references: [loi83-112, decret-statut-caisses-2022]
    voir_aussi: [fonction-publique, regime-statutaire-autonome, cnss, cnrps, cnam]
    fr:
      terme: Statut particulier
      definition: >
        Statut dérogatoire applicable à une catégorie d'agents publics, fixé par
        un texte propre (souvent un décret) par opposition au statut général de
        la fonction publique (loi n°83-112). Le statut particulier des agents des
        caisses sociales (CNSS, CNRPS, CNAM), adopté par décret en 2022, en est
        un exemple : un régime sui generis, ni statut général ni convention
        collective de droit commun.
      synonymes: []
    ar:
      terme: النظام الأساسي الخصوصي
      definition: >
        نظام استثنائي يُطبَّق على صنف من الأعوان العموميين، يُضبَط بنصّ خاصّ (أمر
        في الغالب) خلافًا للنظام الأساسي العام للوظيفة العمومية (القانون عدد
        83-112). ومن أمثلته النظام الأساسي الخصوصي لأعوان صناديق الضمان الاجتماعي
        (CNSS وCNRPS وCNAM) المعتمَد بأمر سنة 2022: نظام ذو طبيعة خاصّة، لا هو
        نظام أساسي عام ولا اتفاقية مشتركة عامة.
      synonymes: []

  - id: forces-de-securite-interieure
    acronyme: null
    statut: provisoire
    references: [loi82-70]
    source_definition: {ref: loi82-70}
    voir_aussi: [regime-statutaire-autonome, statut-particulier, pensions-civiles-militaires]
    fr:
      terme: Forces de sécurité intérieure
      definition: >
        Corps chargés du maintien de l'ordre et de la sécurité publique, dotés
        d'un statut spécial distinct du statut général de la fonction publique
        (loi n°82-70 du 6 août 1982). Ce statut couvre les agents de la sûreté
        nationale, de la garde nationale, de la protection civile ainsi que des
        services des prisons et de la rééducation.
      synonymes: []
    ar:
      terme: قوات الأمن الداخلي
      definition: >
        الأسلاك المكلّفة بحفظ النظام والأمن العام، التي تتمتّع بنظام أساسي خاصّ
        مستقلّ عن النظام الأساسي العام للوظيفة العمومية (القانون عدد 82-70
        المؤرّخ في 6 أوت 1982). ويشمل هذا النظام أعوان الأمن الوطني والحرس
        الوطني والحماية المدنية وكذلك مصالح السجون والإصلاح.
      synonymes: []

  - id: convention-collective-sectorielle
    acronyme: null
    statut: provisoire
    references: [loi85-78]
    voir_aussi: [regime-conventionnel-public, convention-collective-banques, entreprises-publiques, epic]
    fr:
      terme: Convention collective sectorielle
      definition: >
        Accord négocié entre employeurs et organisations syndicales, fixant les
        conditions d'emploi et de rémunération (classification des emplois,
        grilles, primes) pour un secteur d'activité donné. L'article 2 de la loi
        n° 85-78 permettait, à titre transitoire, à certaines sociétés à capital
        partiellement public de choisir entre le régime statutaire et les conventions
        collectives du secteur.
      synonymes: []
    ar:
      terme: الاتفاقية المشتركة القطاعية
      definition: >
        اتفاق متفاوَض عليه بين الأعراف والمنظمات النقابية، يضبط شروط الشغل
        والتأجير (تصنيف المواطن الشغلية والسلالم والمنح) لقطاع نشاط معيَّن. وقد
        أتاح الفصل 2 من القانون عدد 85-78، بصفة انتقالية، لبعض الشركات ذات رأس
        المال العمومي الجزئي الاختيار بين النظام الأساسي والاتفاقيات المشتركة للقطاع.
      synonymes: []

  - id: convention-collective-banques
    acronyme: null
    statut: valide
    references: [cc-banques-2014, loi2016-48]
    source_definition: {ref: cc-banques-2014}
    source_traduction: {ref: cc-banques-2014}
    voir_aussi: [convention-collective-sectorielle, regime-marche-controle, cnss]
    fr:
      terme: Convention collective sectorielle des banques et établissements financiers
      definition: >
        Convention collective de droit commun du travail régissant la
        classification des emplois et la rémunération des agents des banques et
        établissements financiers, publics comme privés, agréée par arrêté du
        ministre des Affaires sociales en application du Code du travail. Sa
        lignée remonte à un agrément de 1975 ; la version en vigueur est la
        convention révisée agréée par arrêté du 17 février 2014, complétée par
        des avenants successifs. Son champ commun aux banques publiques et privées
        établit l'unité du cadre conventionnel, sans permettre à lui seul de comparer
        leurs niveaux effectifs de rémunération.
      synonymes: [convention collective des banques]
    ar:
      terme: الاتفاقية المشتركة القطاعية لأعوان البنوك والمؤسسات المالية
      definition: >
        اتفاقية مشتركة من القانون العام للشغل تضبط تصنيف المواطن الشغلية وتأجير
        أعوان البنوك والمؤسسات المالية، العمومية منها والخاصة، مصادَق عليها بقرار
        من وزير الشؤون الاجتماعية تطبيقًا لمجلة الشغل. تعود نشأتها إلى مصادقة سنة
        1975؛ والنسخة السارية هي الاتفاقية المنقَّحة المصادَق عليها بقرار مؤرَّخ
        في 17 فيفري 2014، المستكمَلة بملاحق متتالية. ويثبت شمولها المشترك للبنوك
        العمومية والخاصة وحدة الإطار الاتفاقي، دون أن يسمح بمفرده بمقارنة مستويات
        التأجير الفعلية بينها.
      synonymes: []

  - id: remuneration-dirigeants-entreprises-publiques
    acronyme: null
    statut: valide
    references: [decret2015-2217, decret90-1855]
    source_definition: {ref: decret2015-2217}
    source_traduction: {ref: decret2015-2217}
    voir_aussi: [regime-marche-controle, entreprises-publiques, regime-conventionnel-public]
    fr:
      terme: Rémunération des dirigeants d'entreprises publiques
      definition: >
        Rémunération des chefs d'établissements et entreprises publics et de
        sociétés à majorité publique, encadrée et plafonnée par voie réglementaire
        au titre des prérogatives de l'État actionnaire. Le texte en vigueur est le décret n°2015-2217 du
        11 décembre 2015 fixant les taux des éléments de cette rémunération ; il
        s'inscrit dans une chaîne réglementaire continue (décrets n°78-885,
        n°90-1855, n°2014-12). Ce plafonnement constitue le versant « contrôle »
        du régime de marché contrôlé, par contraste avec l'autonomie
        conventionnelle de marché des agents.
      synonymes: []
    ar:
      terme: تأجير رؤساء المؤسسات والمنشآت العمومية
      definition: >
        تأجير رؤساء المؤسسات والمنشآت العمومية والشركات ذات الأغلبية العمومية —
        المضبوط والمسقَّف عن طريق التنظيم بعنوان صلاحيات الدولة المساهمة. والنصّ الساري هو الأمر الحكومي
        عدد 2015-2217 المؤرّخ في 11 ديسمبر 2015 الذي يضبط نسب عناصر هذا التأجير؛
        وهو يندرج ضمن سلسلة تنظيمية متّصلة (الأوامر عدد 78-885 وعدد 90-1855 وعدد
        2014-12). ويشكّل هذا التسقيف الشقَّ «الرقابي» من نظام السوق الموجَّه، في
        مقابل الاستقلالية الاتفاقية السوقية لأعوانها.
      synonymes: []

  - id: regime-conventionnel-public
    acronyme: null
    statut: provisoire
    references: [loi85-78, loi89-9]
    source_definition: {ref: loi85-78, locator: "art. 1-2 et 75"}
    voir_aussi: [entreprises-publiques, epic, convention-collective-sectorielle, statut-particulier]
    fr:
      terme: Régime conventionnel public
      definition: >
        Catégorie d'analyse retenue dans ce précis pour les entreprises publiques
        non financières. La loi n° 85-78 régit les agents permanents des offices,
        des établissements industriels et commerciaux et des sociétés à capital
        entièrement public par des statuts particuliers approuvés par décret. Elle
        prévoit aussi, à titre transitoire, une option entre statut et convention
        sectorielle pour certaines sociétés à capital partiellement public.
      synonymes: []
    ar:
      terme: النظام الاتفاقي العمومي
      definition: >
        فئة تحليلية معتمدة في هذا الدليل للمنشآت العمومية غير المالية. ويقوم تأجير
        أعوان الدواوين والمؤسسات الصناعية والتجارية والشركات ذات رأس المال العمومي
        الكامل، في إطار القانون عدد 85-78، على أنظمة أساسية خاصة مصادق عليها بأوامر.
        وينصّ القانون أيضًا على خيار انتقالي بين النظام الأساسي والاتفاقية القطاعية
        لبعض الشركات ذات رأس المال العمومي الجزئي.
      synonymes: []

  - id: regime-marche-controle
    acronyme: null
    statut: provisoire
    references: [loi89-9]
    voir_aussi: [entreprises-publiques, convention-collective-banques, remuneration-dirigeants-entreprises-publiques, regime-conventionnel-public, cnss]
    fr:
      terme: Régime de marché contrôlé
      definition: >
        Catégorie d'analyse retenue dans ce précis pour les entreprises publiques
        financières, documentée principalement pour les banques. Les agents des banques
        publiques et privées sont couverts par une même convention collective
        sectorielle ; la rémunération des dirigeants des entreprises publiques relève
        par ailleurs d'un encadrement réglementaire. Le cas des assurances et des autres
        institutions financières publiques reste à établir.
      synonymes: []
    ar:
      terme: نظام السوق الموجَّه
      definition: >
        فئة تحليلية معتمدة في هذا الدليل للمنشآت العمومية المالية، وهي موثقة أساسًا
        بالنسبة إلى البنوك. ويخضع أعوان البنوك العمومية والخاصة لاتفاقية مشتركة
        قطاعية واحدة، فيما يخضع تأجير رؤساء المنشآت العمومية لتأطير ترتيبي. ويبقى
        وضع شركات التأمين وسائر المؤسسات المالية العمومية بحاجة إلى إثبات.
      synonymes: []

  - id: point-indice
    acronyme: null
    statut: provisoire
    references: [decret-2007-268]
    voir_aussi: [regime-indiciaire, traitement-de-base, grille-des-salaires, chiffre-indiciaire]
    fr:
      terme: Valeur du point d'indice
      definition: >
        Notion héritée du modèle français de carrière, NON OPÉRANTE en droit
        positif tunisien actuel. À la différence du système français, aucun
        texte en vigueur ne publie de « valeur du point » qui, multipliée par
        un indice, déterminerait le traitement de base : ce sont les grilles
        annexées aux décrets qui fixent les montants directement en dinars
        (cf. décret n°2007-268, art. 2 bis). Le terme subsiste dans le
        vocabulaire et dans certains décrets de classement.
      synonymes: [point d'indice]
    ar:
      terme: قيمة النقطة الاستدلالية
      definition: >
        مفهوم موروث عن النموذج الفرنسي للمسار المهني، غير معمولٍ به في القانون
        الوضعي التونسي الحالي. فخلافًا للنظام الفرنسي، لا ينشر أيّ نصّ ساري
        المفعول «قيمةً للنقطة» تُضرب في رقم استدلالي لتحديد المرتب الأساسي: بل
        إنّ الشبكات المُلحقة بالأوامر هي التي تضبط المبالغ مباشرة بالدينار
        (انظر الأمر عدد 2007-268، الفصل 2 مكرّر). ولا يزال المصطلح قائمًا في
        المصطلحات وفي بعض أوامر التصنيف.
      synonymes: []

  - id: traitement-de-base
    acronyme: null
    statut: valide
    references: [decret-97-1832, decret-2007-268]
    source_definition: {ref: decret-2007-268, locator: "art. 2 bis"}
    source_traduction: {ref: decret-2007-268}
    voir_aussi: [regime-indiciaire, grille-des-salaires, point-indice, grade, echelon]
    fr:
      terme: Traitement de base
      definition: >
        Part principale de la rémunération d'un agent public du régime
        indiciaire, avant indemnités et primes. En droit positif tunisien, son
        montant mensuel est fixé directement en dinars, pour chaque couple
        grade × échelon, par les grilles annexées aux décrets (décret
        n°97-1832, puis décret n°2007-268, art. 2 bis), et non calculé à partir
        d'une valeur du point d'indice.
      synonymes: []
    ar:
      terme: المرتب الأساسي
      definition: >
        الجزء الرئيسي من أجر العون العمومي الخاضع للنظام الاستدلالي، قبل المنح
        والمكافآت. وفي القانون الوضعي التونسي، يُضبَط مبلغه الشهري مباشرة
        بالدينار، لكلّ ثنائي رتبة × درجة، في الشبكات المُلحقة بالأوامر (الأمر
        عدد 97-1832 ثمّ الأمر عدد 2007-268، الفصل 2 مكرّر)، ولا يُحتسب انطلاقًا
        من قيمة نقطة استدلالية.
      synonymes: [الأجر الأساسي]

  - id: grade
    acronyme: null
    statut: valide
    references: [decret-99-12]
    source_definition: {ref: decret-99-12}
    voir_aussi: [echelon, categorie-de-grade, regime-indiciaire, traitement-de-base]
    fr:
      terme: Grade
      definition: >
        Position d'un agent dans la hiérarchie d'un corps, déterminant ses
        fonctions et, combinée à l'échelon, son traitement de base ; les grades
        sont organisés en catégories par le décret n°99-12. L'avancement de
        grade traduit une promotion.
      synonymes: []
    ar:
      terme: الرتبة
      definition: >
        موقع العون في التدرّج الهرمي للسلك، يحدّد وظائفه ويحدّد، مقترنًا
        بالدرجة، مرتبه الأساسي؛ وتُنظَّم الرتب في أصناف بمقتضى الأمر عدد 99-12.
        ويعبّر الترقّي في الرتبة عن ترقية.
      synonymes: []

  - id: echelon
    acronyme: null
    statut: valide
    references: [decret-2007-268]
    source_definition: {ref: decret-2007-268}
    voir_aussi: [grade, regime-indiciaire, traitement-de-base]
    fr:
      terme: Échelon
      definition: >
        Subdivision d'un grade traduisant l'ancienneté ; l'avancement
        d'échelon, par ancienneté, fait progresser l'agent dans son grade et
        relève le traitement de base correspondant au couple grade × échelon
        dans la grille.
      synonymes: []
    ar:
      terme: الدرجة
      definition: >
        تقسيم فرعي للرتبة يعبّر عن الأقدمية؛ ويُمكّن الترقّي في الدرجة، حسب
        الأقدمية، العونَ من التقدّم داخل رتبته ويرفع المرتب الأساسي المقابل
        لثنائي رتبة × درجة في الشبكة.
      synonymes: []

  - id: avancement-echelon
    acronyme: null
    statut: provisoire  # équivalent AR (الترقّي في الدرجة) à valider par un locuteur — cf. issue #77
    references: [loi83-112]
    source_definition: {ref: loi83-112, locator: "art. 23-24"}
    voir_aussi: [regime-indiciaire, echelon, grade, traitement-de-base]
    fr:
      terme: Avancement d'échelon
      definition: >
        Progression d'un agent à l'échelon immédiatement supérieur de son grade.
        Dans le régime indiciaire, l'avancement d'échelon est automatique : il
        s'opère selon les cadences fixées par les statuts particuliers de chaque
        corps (loi n°83-112 portant statut général, art. 23 et 24).
      synonymes: []
    ar:
      terme: الترقّي في الدرجة
      definition: >
        تقدّم العون إلى الدرجة الأعلى مباشرةً ضمن رتبته. وفي النظام الاستدلالي
        للتأجير، يكون الترقّي في الدرجة آليًّا: إذ يتمّ وفق الإيقاعات التي تضبطها
        الأنظمة
        الأساسية الخاصّة بكلّ سلك (القانون عدد 83-112 المتعلّق بالنظام الأساسي
        العام، الفصلان 23 و24).
      synonymes: []

  - id: categorie-de-grade
    acronyme: null
    statut: valide
    references: [decret-99-12, decret-2003-2338]
    source_definition: {ref: decret-99-12}
    source_traduction: {ref: decret-99-12}
    voir_aussi: [grade, echelon, regime-indiciaire, grille-des-salaires]
    fr:
      terme: Catégorie de grade
      definition: >
        Classement hiérarchique des grades de la fonction publique fixé par le
        décret n°99-12 du 4 janvier 1999 (modifié), qui répartit les grades en
        quatre catégories A, B, C et D selon le niveau de diplôme exigé au
        recrutement par concours externe ; ce classement sert de support à la
        grille de traitement de base.
        La catégorie A (art. 2) comprend trois sous-catégories : A1, recrutement
        au niveau du mastère au moins, ou du diplôme national d'ingénieur, ou
        équivalent (les anciens diplômes de troisième cycle — DEA/DESS —
        antérieurs à la réforme LMD restent admis ; sous-catégorie réécrite par
        le décret n°2003-2338 du 11 novembre 2003) (usuellement conception,
        cadres supérieurs) ; A2, niveau de la maîtrise au moins ou équivalent ; A3,
        niveau du premier cycle de l'enseignement supérieur au moins ou
        équivalent (A2 et A3 usuellement encadrement). La catégorie B (art. 3)
        correspond au baccalauréat au moins ou équivalent (usuellement
        maîtrise). La catégorie C (art. 4) correspond au cycle primaire achevé
        et à la 6ᵉ année secondaire au moins, ou au diplôme de fin d'études de
        l'enseignement de base et à la 3ᵉ année secondaire. La catégorie D
        (art. 5) correspond au cycle primaire achevé et à la 3ᵉ année secondaire
        au moins, ou au diplôme de fin d'études de l'enseignement de base (C et D
        usuellement exécution). Les diplômes de formation homologués au niveau
        requis sont admis dans chaque catégorie.
      synonymes: []
    ar:
      terme: صنف الرتبة
      definition: >
        تصنيف هرمي لرتب الوظيفة العمومية يُضبَط بمقتضى الأمر عدد 99-12 المؤرّخ في
        4 جانفي 1999 (المنقَّح)، يوزّع الرتب على أربعة أصناف A وB وC وD حسب مستوى
        الشهادة المطلوبة عند الانتداب عن طريق المناظرة الخارجية؛ ويُتّخذ هذا
        التصنيف أساسًا لشبكة المرتّب الأساسي.
        يشمل الصنف A (الفصل 2) ثلاثة أصناف فرعية: A1، الانتداب في مستوى الماجستير
        على الأقلّ، أو الشهادة الوطنية للمهندس، أو ما يعادلها (مع قبول شهادات
        الدراسات العليا في المرحلة الثالثة — الدراسات المعمّقة والدراسات المعمّقة
        المتخصّصة — السابقة لإصلاح نظام «إجازة-ماجستير-دكتوراه»؛ صنف فرعي أُعيدت
        صياغته بمقتضى الأمر عدد 2003-2338 المؤرّخ في 11 نوفمبر 2003) (عادةً
        التصوّر والإطارات العليا)؛ A2، مستوى الأستاذية على الأقلّ أو ما
        يعادلها؛ A3، مستوى المرحلة الأولى من التعليم العالي على الأقلّ أو ما
        يعادلها (A2 وA3 عادةً التأطير). ويقابل الصنف B (الفصل 3) شهادة الباكالوريا
        على الأقلّ أو ما يعادلها (عادةً الكفاءة). ويقابل الصنف C (الفصل 4) إتمام
        المرحلة الابتدائية والسنة السادسة من التعليم الثانوي على الأقلّ، أو شهادة
        ختم التعليم الأساسي والسنة الثالثة من التعليم الثانوي. ويقابل الصنف D
        (الفصل 5) إتمام المرحلة الابتدائية والسنة الثالثة من التعليم الثانوي على
        الأقلّ، أو شهادة ختم التعليم الأساسي (C وD عادةً التنفيذ). وتُقبل في كلّ
        صنف شهادات التكوين المعادَلة للمستوى المطلوب.
      synonymes: []

  - id: grille-des-salaires
    acronyme: null
    statut: valide
    references: [decret-97-1832, decret-2007-268]
    source_definition: {ref: decret-2007-268, locator: "art. 2 bis"}
    source_traduction: {ref: decret-2007-268, locator: "art. 2 bis"}
    voir_aussi: [traitement-de-base, regime-indiciaire, grade, echelon, point-indice]
    fr:
      terme: Grille des salaires
      definition: >
        Barème, annexé aux décrets, fixant directement en dinars le traitement
        de base mensuel pour chaque couple grade × échelon. En droit positif
        tunisien, l'article 2 bis du décret n°2007-268 dispose que « la grille
        des salaires […] est fixée conformément aux annexes ci-jointes » : les
        montants sont arrêtés en annexes, et non calculés à partir d'un point
        d'indice.
      synonymes: [grille indiciaire]
    ar:
      terme: شبكة الأجور
      definition: >
        سُلَّمٌ مُلحَق بالأوامر، يضبط مباشرة بالدينار المرتبَ الأساسي الشهري
        لكلّ ثنائي رتبة × درجة. وفي القانون الوضعي التونسي، ينصّ الفصل 2 مكرّر
        من الأمر عدد 2007-268 على أنّ «شبكة الأجور […] تُضبَط وفقًا للملاحق
        المصاحبة»: فالمبالغ محدَّدة في الملاحق، لا محتسَبة انطلاقًا من نقطة
        استدلالية.
      synonymes: [الشبكة الاستدلالية]

  - id: echelonnement-indiciaire
    acronyme: null
    statut: provisoire
    references: [decret-60-328, decret-73-316, decret-99-12]
    voir_aussi: [categorie-de-grade, grade, echelon, regime-indiciaire, chiffre-indiciaire]
    fr:
      terme: Échelonnement indiciaire
      definition: >
        Classement hiérarchique des grades d'un corps les uns par rapport aux
        autres. Il était fixé, corps par corps, par une longue série de décrets
        « relatifs au classement hiérarchique et à l'échelonnement indiciaire »,
        qui attribuaient à chaque grade son chiffre indiciaire (au moins depuis
        le décret n°60-328 de 1960). Depuis 1998, ce classement situe chaque
        grade dans la grille de traitement de base sans recourir à une valeur du
        point d'indice.
      synonymes: [classement hiérarchique]
    ar:
      terme: التدرّج القياسي
      definition: >
        ترتيبٌ هرمي لرتب السلك بعضها بالنسبة إلى بعض. وقد كانت تضبطه، سلكًا
        سلكًا، سلسلةٌ طويلة من الأوامر «المتعلقة بالتصنيف الهرمي والتدرّج
        القياسي» التي تُسنِد لكلّ رتبة رقمها القياسي (منذ الأمر عدد 60-328
        لسنة 1960 على الأقلّ). ومنذ سنة 1998، يحدّد هذا الترتيب موقع كلّ رتبة
        في شبكة المرتّب الأساسي دون اللجوء إلى قيمة نقطة استدلالية.
      synonymes: [التصنيف الهرمي]

  - id: indemnite-specifique
    acronyme: null
    statut: provisoire
    references: [decret-2007-267]
    voir_aussi: [prime-de-rendement, traitement-de-base, regime-indiciaire]
    fr:
      terme: Indemnité spécifique
      definition: >
        Indemnité propre à chaque corps, s'ajoutant au traitement de base. La
        recomposition de 2007 (décret n°2007-267) a transféré une partie des
        indemnités spécifiques de corps vers le traitement de base, à effet du
        1ᵉʳ avril 2007.
      synonymes: []
    ar:
      terme: المنحة الخصوصية
      definition: >
        منحة خاصّة بكلّ سلك، تُضاف إلى المرتب الأساسي. وقد أحالت إعادة التركيب
        سنة 2007 (الأمر عدد 2007-267) جزءًا من المنح الخصوصية للأسلاك إلى
        المرتّب الأساسي، ابتداءً من غرّة أفريل 2007.
      synonymes: []

  - id: prime-de-rendement
