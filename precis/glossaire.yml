    source_definition: {ref: loi2001-123-lf2002, locator: "art. 82 à 84"}
    voir_aussi: [tableau-b-tva, taux-reduit-tva]
    fr:
      terme: Tableau B bis du code de la TVA
      definition: >
        Annexe créée par la loi de finances pour 2002, qui portait un taux
        intermédiaire, et abrogée par la loi de finances pour 2017. Dispositif
        historique : il ne s'applique plus.
      synonymes: []
    ar:
      terme: الجدول « ب مكرر »
