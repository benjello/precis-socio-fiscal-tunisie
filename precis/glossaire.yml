      definition: >
        Complément ajouté à la bourse nationale en Tunisie pour couvrir les frais de
        fournitures scolaires, égal à une mensualité de la bourse.
      synonymes: []
    ar:
      terme: منحة التكلفة الإضافية
      definition: >
        منحة تُضاف إلى المنحة الوطنية للدراسات الجامعية بالبلاد التونسية، مخصّصة لتغطية
