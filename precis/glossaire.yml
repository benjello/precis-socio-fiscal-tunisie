        au 1er janvier 2007 par l'article 13 de la loi n° 2006-80. Dispositif
        historique.
      synonymes: []
    ar:
      terme: الجدول « ج »
      definition: ""
      synonymes: []

  - id: taux-normal-tva
    acronyme: null
    statut: provisoire
    references: [loi-88-61-tva]
    source_definition: {ref: loi-88-61-tva, locator: "art. 7 § 1"}
    voir_aussi: [tva, taux-reduit-tva, taux-majore-tva]
    fr:
      terme: Taux normal de la TVA
      definition: >
        Taux de droit commun, applicable à toute opération imposable qu'un
        texte ne range pas ailleurs. Fixé à 17 % en 1988, porté à 18 % puis à
        19 %.
      synonymes: []
    ar:
      terme: النسبة العادية
      definition: ""
      synonymes: []

  - id: taux-reduit-tva
    acronyme: null
    statut: provisoire
    references: [loi-88-61-tva, decret-98-952-fiscalite-petrole-electricite]
    source_definition: {ref: loi-88-61-tva, locator: "art. 7 § 2"}
    voir_aussi: [tableau-b-tva, taux-normal-tva, tva]
    fr:
      terme: Taux réduit de la TVA
      definition: >
        Taux inférieur au taux normal, applicable aux produits et services que
        le tableau B énumère. L'article 8 du code borne à l'année civile toute
        réduction accordée par décret, d'où des reconductions annuelles.
      synonymes: []
    ar:
      terme: النسبة المخفضة
      definition: ""
      synonymes: []

  - id: taux-majore-tva
    acronyme: null
    statut: provisoire
    references: [loi-88-61-tva, loi-2006-80-reduction-taux]
    source_definition: {ref: loi-88-61-tva, locator: "art. 7"}
    voir_aussi: [tableau-c-tva, taux-normal-tva]
    fr:
      terme: Taux majoré de la TVA
      definition: >
        Taux supérieur au taux normal, appliqué aux produits du tableau C de
        1988 à 2006. Supprimé au 1er janvier 2007. Dispositif historique.
      synonymes: []
    ar:
      terme: النسبة المرتفعة
      definition: ""
      synonymes: []

  - id: livraison-a-soi-meme
    acronyme: null
    statut: provisoire
    references: [loi-88-61-tva]
    source_definition: {ref: loi-88-61-tva, locator: "art. 1er § II-9 et 10 ; art. 5 § 4"}
    voir_aussi: [fait-generateur-tva, tva]
    fr:
      terme: Livraison à soi-même
      definition: >
        Opération par laquelle un assujetti utilise pour ses propres besoins un
        bien qu'il a produit. Elle est imposable, afin de ne pas avantager
        celui qui produit sur celui qui achète.
      synonymes: []
    ar:
      terme: التسليم للنفس
      definition: ""
      synonymes: []

  - id: commercant-grossiste
    acronyme: null
    statut: provisoire
    references: [loi-88-61-tva, lf-1996, decret-89-1222-calendrier-tva-gros]
    source_definition: {ref: loi-88-61-tva, locator: "art. 1er § II-3"}
    voir_aussi: [tva, assujetti, calendrier-application-tva]
    fr:
      terme: Commerçant grossiste
      definition: >
        Commerçant vendant à d'autres commerçants pour la revente. Le commerce
        de gros entre dans le champ de la taxe en 1989, le commerce de détail
        en 1996 seulement.
      synonymes: []
    ar:
      terme: تاجر جملة
      definition: ""
      synonymes: []

  - id: chiffre-affaires-imposable
    acronyme: null
    statut: provisoire
    references: [loi-88-61-tva]
    source_definition: {ref: loi-88-61-tva, locator: "art. 6"}
    voir_aussi: [tva, assujetti, fait-generateur-tva]
    fr:
      terme: Chiffre d'affaires imposable
      definition: >
        Assiette de la taxe : montant des opérations imposables, tous frais et
        droits compris, à l'exclusion de la taxe elle-même.
      synonymes: []
    ar:
      terme: رقم المعاملات الخاضع
      definition: ""
      synonymes: []

  - id: calendrier-application-tva
    acronyme: null
    statut: provisoire
    references: [decret-88-1109-calendrier-tva, decret-89-1222-calendrier-tva-gros]
    source_definition: {ref: decret-88-1109-calendrier-tva}
    voir_aussi: [tva, commercant-grossiste]
    fr:
      terme: Calendrier d'application de la TVA
      definition: >
        Entrée en vigueur échelonnée du code de 1988 : application au
        1er juillet 1988, extension au commerce de gros en 1989, au commerce
        de détail en 1996. Deux décrets l'organisent.
      synonymes: []
    ar:
      terme: روزنامة تطبيق الأداء على القيمة المضافة
      definition: ""
      synonymes: []

  - id: taxe-forfaitaire-annuelle-tva
    acronyme: null
    statut: valide
    references: [loi-89-115-lf-1990, lf-1993]
    source_definition: {ref: loi-89-115-lf-1990, locator: "art. 24 et 25"}
    source_traduction: {ref: loi-89-115-lf-1990, locator: "art. 24 et 25"}
    voir_aussi: [tva, droit-forfaitaire-simplifie-tva, regime-forfaitaire]
    fr:
      terme: Taxe forfaitaire annuelle
      definition: >
        Régime historique institué par la loi de finances pour 1990 pour
        certaines entreprises individuelles à établissement unique dont le
        chiffre d'affaires ne dépassait pas les plafonds prévus. La taxe était
        fixée annuellement par un barème selon l'activité et le chiffre
        d'affaires. Elle a été abrogée par la loi de finances pour 1993.
      synonymes: []
    ar:
      terme: الأداء السنوي التقديري
      definition: >
        نظام تاريخي أحدثه قانون المالية لسنة 1990 لبعض المؤسسات الفردية ذات
        المحل الواحد التي لا يتجاوز رقم معاملاتها السقوف المنصوص عليها. وكان
        الأداء يضبط سنويا حسب جدول يراعي نوع النشاط ورقم المعاملات. وألغاه
        قانون المالية لسنة 1993.
      synonymes: []

  - id: droit-forfaitaire-simplifie-tva
    acronyme: null
    statut: valide
    references: [loi-89-115-lf-1990, lf-1993]
    source_definition: {ref: loi-89-115-lf-1990, locator: "art. 26"}
    source_traduction: {ref: loi-89-115-lf-1990, locator: "art. 26"}
    voir_aussi: [tva, taxe-forfaitaire-annuelle-tva, regime-forfaitaire]
    fr:
      terme: Droit forfaitaire simplifié
      definition: >
        Régime historique institué par la loi de finances pour 1990 pour
        certains petits professionnels et artisans. Son montant dépendait du
        nombre de salariés et de la zone d'activité, avec des barèmes propres
        aux cafés de première catégorie et aux coiffeurs pour hommes. Il a été
        abrogé par la loi de finances pour 1993.
      synonymes: []
    ar:
      terme: الأداء التقديري المبسط
      definition: >
        نظام تاريخي أحدثه قانون المالية لسنة 1990 لبعض صغار المهنيين
        والحرفيين. وكان مبلغه يحدد حسب عدد العملة ومنطقة النشاط، مع جداول خاصة
        بمقاهي الصنف الأول وحلاقي الرجال. وألغاه قانون المالية لسنة 1993.
      synonymes: []

  - id: taxe-forfaitaire-mensuelle-transports
    acronyme: null
    statut: valide
    references: [lf-1998]
    source_definition: {ref: lf-1998, locator: "art. 29"}
    source_traduction: {ref: lf-1998, locator: "art. 29"}
    voir_aussi: [tva, regime-forfaitaire]
    fr:
      terme: Taxe forfaitaire mensuelle sur la valeur ajoutée
      definition: >
        Taxe mensuelle applicable aux opérations de transport terrestre, sauf
        le transport de personnes par voiture de louage ou taxi. Elle est
        calculée selon la charge utile ou le nombre de places offertes et
        s'impute sur la TVA due par les assujettis relevant du régime réel.
      synonymes: []
    ar:
      terme: أداء تقديري شهري على القيمة المضافة
      definition: >
        أداء شهري يوظف على عمليات النقل البري، باستثناء نقل الأشخاص بواسطة
        سيارات الأجرة لواج وتاكسي. ويحدد حسب الحمولة النافعة أو عدد المقاعد
        المعروضة، ويطرح من الأداء على القيمة المضافة المستوجب من قبل الخاضعين
        حسب النظام الحقيقي.
      synonymes: []

  - id: commercant-detaillant-assujetti
    acronyme: null
    statut: valide
    references: [lf-1996, loi-88-61-tva]
    source_definition: {ref: lf-1996, locator: "art. 43"}
    source_traduction: {ref: lf-1996, locator: "art. 43"}
    voir_aussi: [tva, assujetti, commercant-grossiste, chiffre-affaires-imposable]
    fr:
      terme: Commerçant détaillant assujetti à la taxe sur la valeur ajoutée
      definition: >
        Commerçant qui vend des produits en l'état et dont le chiffre
        d'affaires annuel global atteint le seuil prévu par le code. Ces ventes
        sont entrées dans le champ de la TVA le 1er juillet 1996, sous réserve
        des exonérations particulières au stade du détail.
      synonymes: []
    ar:
      terme: تاجر التفصيل الخاضع للأداء على القيمة المضافة
      definition: >
        تاجر يبيع المنتوجات على حالتها ويبلغ رقم معاملاته السنوي الجملي الحد
        المنصوص عليه بالمجلة. ودخلت هذه البيوعات في ميدان تطبيق الأداء على
        القيمة المضافة في غرة جويلية 1996، مع مراعاة الإعفاءات الخاصة بمرحلة
        البيع بالتفصيل.
      synonymes: []

  - id: tva-sur-marge
    acronyme: null
    statut: provisoire
    references: [lf-1991, lf-2016, dgelf-code-tva-2023]
    source_definition: {ref: lf-2016, locator: "art. 33"}
    source_traduction: {ref: lf-1991, locator: "art. 34"}
    voir_aussi: [tva, assujetti, chiffre-affaires-imposable]
    fr:
      terme: TVA sur la marge
      definition: >
        Mode de liquidation applicable aux ventes, par des commerçants
        assujettis, de produits acquis auprès de personnes non assujetties : la
        TVA est calculée sur la différence entre le prix de vente et le prix
        d'achat. Introduit en 1991 pour les achats auprès des forfaitaires, son
        champ a été étendu en 2016 à tout vendeur non assujetti.
      synonymes: []
    ar:
      terme: احتساب الأداء على القيمة المضافة على الفارق بين ثمن البيع وثمن الشراء
      definition: >
        طريقة لاحتساب الأداء بالنسبة إلى بيوعات التجار الخاضعين للأداء على
        القيمة المضافة والمتعلقة بمنتوجات اقتنوها من غير الخاضعين، إذ يحتسب
        الأداء على الفارق بين ثمن البيع وثمن الشراء. أحدثت سنة 1991 للشراءات من
        الخاضعين للنظام التقديري ووسع مجالها سنة 2016 إلى كل بائع غير خاضع.
      synonymes: []

  - id: regime-suspensif-tva
    acronyme: null
    statut: valide
    references: [loi-88-61-tva, loi-avantages-fiscaux-2017]
    source_definition: {ref: loi-88-61-tva, locator: "art. 11"}
    source_traduction: {ref: loi-avantages-fiscaux-2017, locator: "art. 3"}
    voir_aussi: [tva, assujetti, credit-tva]
    fr:
      terme: Régime suspensif de la taxe sur la valeur ajoutée
      definition: >
        Régime permettant, dans les cas et conditions prévus par le code,
        d'importer ou d'acquérir localement des biens et services sans paiement
        de la TVA lors de l'opération. Il bénéficie notamment à certaines
        entreprises exportatrices pour leurs acquisitions ouvrant droit à
        déduction.
      synonymes: []
    ar:
      terme: نظام توقيف العمل بالأداء على القيمة المضافة
      definition: >
        نظام يتيح، في الحالات والشروط المنصوص عليها بالمجلة، توريد أموال وخدمات
        أو اقتناءها محليا دون دفع الأداء على القيمة المضافة عند العملية. وينتفع
        به خاصة بعض المؤسسات المصدرة بالنسبة إلى اقتناءاتها التي تمنح حق الطرح.
      synonymes: []

  - id: credit-tva
    acronyme: null
    statut: valide
    references: [loi-88-61-tva, loi-2006-80-reduction-taux]
    source_definition: {ref: loi-2006-80-reduction-taux, locator: "art. 15"}
    source_traduction: {ref: loi-2006-80-reduction-taux, locator: "art. 15"}
    voir_aussi: [tva, regime-suspensif-tva]
    fr:
      terme: Crédit de taxe sur la valeur ajoutée
      definition: >
        Excédent de TVA déductible qui n'a pas pu être entièrement imputé sur
        la TVA due au titre des opérations taxables. Il est reportable ou
        restituable dans les cas et selon les conditions prévus par l'article
        15 du code.
      synonymes: []
    ar:
      terme: فائض الأداء على القيمة المضافة
      definition: >
        مبلغ الأداء على القيمة المضافة القابل للطرح الذي لم يتسن طرحه بالكامل
        من الأداء الموظف على العمليات الخاضعة. ويمكن تأجيل طرحه أو إرجاعه في
        الحالات ووفق الشروط المنصوص عليها بالفصل 15 من المجلة.
      synonymes: []

  # --- Déduction, crédit et restitution (6 octobre 2026) ---
  # Termes arabes relevés au JORT arabe : n° 39/1988 (loi n° 88-61), n° 104/1998
  # p. 2566 (loi n° 98-111, lu à l'image), n° 64/2000 p. 2071 (loi n° 2000-82, lu
  # à l'image), n° 101/2006 p. 5056 (loi n° 2006-80), recoupés avec l'édition
  # arabe 2025 du code. Les formes composées restent « provisoire ».
  - id: droit-a-deduction-tva
    acronyme: null
    statut: valide
    references: [loi-88-61-tva]
    source_definition: {ref: loi-88-61-tva, locator: "art. 9"}
    source_traduction: {ref: loi-88-61-tva, locator: "art. 11"}
    voir_aussi: [tva, assujetti, credit-tva, prorata-deduction-tva]
    fr:
      terme: Droit à déduction
      definition: >
        Droit, pour l'assujetti, de retrancher de la TVA due sur ses opérations
        taxables celle qui a grevé ses achats, ses importations et les biens et
        services nécessaires à son exploitation, immobilisations comprises.
        L'imputation est globale ; ce qui n'a pu être imputé est reporté sur
        les mois suivants et forme le crédit de TVA.
      synonymes: [déduction de la TVA]
    ar:
      terme: حق الطرح
      definition: >
        حق الخاضع للأداء في أن يطرح من الأداء على القيمة المضافة الموظف على
        عملياته الخاضعة الأداء الذي تحملته شراءاته وتوريداته والممتلكات
        والخدمات اللازمة للاستغلال، بما فيها الأصول الثابتة. ويتم الطرح بصفة
        جملية، ويؤجل المبلغ الذي لم يتسن طرحه إلى الأشهر الموالية فيكوّن
        فائض الأداء على القيمة المضافة.
      synonymes: []

  - id: prorata-deduction-tva
    acronyme: null
    statut: valide
    references: [loi-88-61-tva]
    source_definition: {ref: loi-88-61-tva, locator: "art. 9, § II et III"}
    source_traduction: {ref: loi-88-61-tva, locator: "art. 9, § III"}
    voir_aussi: [droit-a-deduction-tva, assujetti-partiel-tva, regularisation-deductions-tva]
    fr:
      terme: Pourcentage de déduction
      definition: >
        Fraction de la TVA d'amont que l'assujetti partiel peut déduire :
        rapport entre les recettes soumises à la taxe, augmentées de celles de
        l'exportation et des ventes en suspension, et l'ensemble des recettes,
        exonérées ou hors champ comprises. Calculé sur l'année précédente, il
        est arrêté en fin d'année civile sur les éléments de l'année.
      synonymes: [prorata de déduction]
    ar:
      terme: النسبة المائوية للطرح
      definition: >
        الجزء من الأداء على القيمة المضافة المتحمَّل الذي يمكن للخاضع جزئيا
        طرحه. وهي حاصل قسمة المقابيض الخاضعة للأداء، مضافا إليها مقابيض
        التصدير والبيوعات بتوقيف العمل بالأداء، على مجموع المقابيض بما فيها
        المعفاة أو الخارجة عن ميدان تطبيق الأداء. وتحتسب على أساس السنة
        السابقة ثم تحدد في آخر كل سنة مدنية باعتبار العناصر المنجزة خلالها.
      synonymes: []

  - id: assujetti-partiel-tva
    acronyme: null
    statut: valide
    references: [loi-88-61-tva]
    source_definition: {ref: loi-88-61-tva, locator: "art. 9, § II et III"}
    source_traduction: {ref: loi-88-61-tva, locator: "art. 9, § III"}
    voir_aussi: [assujetti, prorata-deduction-tva, exoneration-tva]
    fr:
      terme: Assujetti partiel
      definition: >
        Assujetti qui n'acquitte pas la TVA sur la totalité de ses affaires,
        une partie de ses recettes étant exonérée ou située hors du champ de
        la taxe. Il ne déduit la taxe d'amont qu'à hauteur de son pourcentage
        de déduction.
      synonymes: []
    ar:
      terme: الخاضع جزئيا للأداء على القيمة المضافة
      definition: >
        خاضع لا يدفع الأداء على القيمة المضافة على مجمل معاملاته، لأن جزءا من
        مقابيضه معفى أو خارج عن ميدان تطبيق الأداء. ولا يطرح الأداء المتحمَّل
        إلا في حدود النسبة المائوية للطرح.
      synonymes: []

  # Arabe composé : le code dit « التعديل » (art. 9, § III et IV), sans
  # complément. Pas de source_traduction tant que la forme n'est pas tranchée.
  - id: regularisation-deductions-tva
    acronyme: null
    statut: provisoire
    references: [loi-88-61-tva]
    source_definition: {ref: loi-88-61-tva, locator: "art. 9, § III et IV"}
    voir_aussi: [droit-a-deduction-tva, prorata-deduction-tva]
    fr:
      terme: Régularisation des déductions
      definition: >
        Correction de la déduction initiale lorsque la situation change :
        variation de plus de cinq centièmes du pourcentage de déduction pour
        les biens amortissables, cession, changement d'affectation, cessation
        d'activité ou abandon de la qualité d'assujetti. La taxe déduite est
        alors reversée, diminuée d'un cinquième par année de détention pour
        les équipements et le matériel, et d'un dixième pour les bâtiments.
      synonymes: []
    ar:
      terme: تعديل الطرح
      definition: >
        تصحيح الطرح الأصلي عند تغيّر الوضعية : تغيّر النسبة المائوية للطرح
        بأكثر من 5 بالمائة بالنسبة إلى الممتلكات الخاضعة للاستهلاكات، أو
        التفويت، أو تغيير وجهة الاستعمال، أو توقيف النشاط، أو التخلي عن صفة
        خاضع. ويُدفع عندئذ الأداء الذي تم طرحه بعد تخفيضه بالخمس عن كل سنة
        امتلاك بالنسبة إلى التجهيزات والمعدات، وبالعشر بالنسبة إلى البناءات.
      synonymes: [التعديل]

  - id: restitution-credit-tva
    acronyme: null
    statut: valide
    references: [loi-88-61-tva, loi-2006-80-reduction-taux, loi-2000-82-cdpf]
    source_definition: {ref: loi-2006-80-reduction-taux, locator: "art. 15"}
    source_traduction: {ref: loi-2006-80-reduction-taux, locator: "art. 15"}
    voir_aussi: [credit-tva, avance-restitution-credit-tva, duree-constatation-credit-tva, gel-credit-tva, code-droits-procedures-fiscaux]
    fr:
      terme: Restitution du crédit de taxe sur la valeur ajoutée
      definition: >
        Remboursement par le Trésor du crédit de TVA que l'imputation n'a pu
        absorber, organisé par l'article 15 du code. Hors exportation et ventes
        en suspension, elle a été partielle jusqu'en 2006 (20 % du crédit en
        1988, 50 % en 1999) ; elle est intégrale dans tous les cas depuis le
        1er janvier 2007. Ses délais relèvent du code des droits et procédures
        fiscaux depuis 2002.
      synonymes: [remboursement du crédit de TVA]
    ar:
      terme: إرجاع فائض الأداء على القيمة المضافة
      definition: >
        إرجاع الخزينة لفائض الأداء على القيمة المضافة الذي لم يتسن طرحه،
        وينظمه الفصل 15 من المجلة. وباستثناء التصدير والبيوعات بتوقيف العمل
        بالأداء، كان الإرجاع جزئيا إلى موفى سنة 2006 (20 بالمائة من الفائض
        سنة 1988 و50 بالمائة سنة 1999)، وأصبح كليا في جميع الحالات منذ غرة
        جانفي 2007. وتضبط آجاله مجلة الحقوق والإجراءات الجبائية منذ سنة 2002.
      synonymes: [استرجاع فائض الأداء على القيمة المضافة]

  # Arabe composé : le texte dit « تدفع تسبقة منه بنسبة … من المبلغ الجملي
  # للفائض » ; seul le mot « تسبقة » est attesté comme tel.
  - id: avance-restitution-credit-tva
    acronyme: null
    statut: provisoire
    references: [lf-1999, loi-2006-80-reduction-taux, lf-2010]
    source_definition: {ref: lf-1999, locator: "art. 56"}
    voir_aussi: [restitution-credit-tva, credit-tva]
    fr:
      terme: Avance sur restitution du crédit de TVA
      definition: >
        Fraction du crédit de TVA versée à l'entreprise sans contrôle
        préalable, avant l'instruction de sa demande de restitution. Créée au
        1er janvier 1999 au taux de 15 % du montant global du crédit, elle a
        été portée, pour les entreprises dont les comptes sont certifiés, à
        25 % en 2005, 35 % en 2006 et 50 % en 2010.
      synonymes: []
    ar:
      terme: تسبقة من فائض الأداء على القيمة المضافة
      definition: >
        جزء من فائض الأداء على القيمة المضافة يُدفع للمؤسسة دون مراقبة مسبقة،
        قبل البت في مطلب الاسترجاع. أحدثت في غرة جانفي 1999 بنسبة 15 بالمائة
        من المبلغ الجملي للفائض، ثم رُفعت بالنسبة إلى المؤسسات المصادق على
        حساباتها إلى 25 بالمائة سنة 2005 و35 بالمائة سنة 2006 و50 بالمائة
        سنة 2010.
      synonymes: [تسبقة]

  # Notion de la doctrine administrative, sans terme dans le code ni au JORT
  # arabe : l'arabe est une PROPOSITION descriptive, à faire valider.
  - id: duree-constatation-credit-tva
    acronyme: null
    statut: provisoire
    references: [dgi-nc-14-2007, loi-2006-80-reduction-taux]
    source_definition: {ref: dgi-nc-14-2007}
    voir_aussi: [restitution-credit-tva, credit-tva]
    fr:
      terme: Durée de constatation du crédit de TVA
      definition: >
        Nombre de déclarations consécutives sur lesquelles le crédit de TVA
        doit apparaître avant que sa restitution puisse être demandée : douze
        mois en 1988 pour le crédit de droit commun, six mois depuis 1999.
        Depuis 2007, une seule déclaration mensuelle suffit pour l'exportation,
        les ventes en suspension et la retenue à la source, trois mois pour
        l'investissement, six mois dans les autres cas. Le terme vient de la
        doctrine administrative, non du code.
      synonymes: []
    ar:
      terme: مدة تسجيل فائض الأداء على القيمة المضافة بالتصاريح
      definition: >
        عدد التصاريح المتتالية التي يجب أن يظهر بها فائض الأداء على القيمة
        المضافة قبل إمكانية طلب استرجاعه : اثنا عشر شهرا سنة 1988 بالنسبة إلى
        الفائض العادي، ثم ستة أشهر منذ سنة 1999. ومنذ سنة 2007 يكفي تصريح
        شهري واحد بالنسبة إلى التصدير والبيوعات بتوقيف العمل بالأداء والخصم
        من المورد، وثلاثة أشهر بالنسبة إلى الاستثمار، وستة أشهر في الحالات
        الأخرى. والعبارة مستمدة من المذكرات العامة للإدارة لا من المجلة.
      synonymes: []

  - id: gel-credit-tva
    acronyme: null
    statut: valide
    references: [lf-1999]
    source_definition: {ref: lf-1999, locator: "art. 53 à 55"}
    source_traduction: {ref: lf-1999, locator: "art. 53"}
    voir_aussi: [credit-tva, restitution-credit-tva]
    fr:
      terme: Gel du crédit de TVA (1998)
      definition: >
        Mesure ponctuelle de la loi de finances pour 1999, qui n'est plus en
        vigueur : le crédit de TVA dégagé au 31 décembre 1998 cesse d'ouvrir
        droit à déduction à partir du 1er janvier 1999 et devient une créance
        remboursée par sixièmes semestriels, à condition d'avoir été demandée
        avant le 30 juin 1999. En sont exclus les crédits de l'exportation, des
        ventes en suspension, de la retenue à la source sur les marchés publics
        et des investissements de création et de mise à niveau.
      synonymes: []
    ar:
      terme: تجميد فائض الأداء على القيمة المضافة (1998)
      definition: >
        إجراء ظرفي لم يعد ساري المفعول، أقره قانون المالية لسنة 1999 : فائض
        الأداء على القيمة المضافة الذي تفرزه الوضعية الجبائية في 31 ديسمبر
        1998 لا يخول حق الطرح ابتداء من غرة جانفي 1999، ويتم إرجاعه على أساس
        السدس كل ستة أشهر، شريطة إيداع مطلب الاسترجاع في أجل أقصاه 30 جوان
        1999. ويستثنى من التجميد الفائض المتأتي من عمليات التصدير والبيع
        بتوقيف العمل بالأداء على القيمة المضافة والخصم من المورد المتعلق
        بالصفقات العمومية ومن استثمارات الإحداث أو التأهيل.
      synonymes: []

  - id: code-droits-procedures-fiscaux
    acronyme: CDPF
    statut: valide
    references: [loi-2000-82-cdpf]
    source_definition: {ref: loi-2000-82-cdpf}
    source_traduction: {ref: loi-2000-82-cdpf, locator: "art. 1"}
    voir_aussi: [restitution-credit-tva]
    fr:
      terme: Code des droits et procédures fiscaux
      definition: >
        Code promulgué par la loi n° 2000-82 du 9 août 2000 et entré en vigueur
        le 1er janvier 2002, qui réunit les droits et obligations du
        contribuable et les procédures de contrôle et de contentieux fiscaux.
        Il fixe notamment, depuis 2002, les délais de restitution du crédit de
        TVA.
      synonymes: []
    ar:
      terme: مجلة الحقوق والإجراءات الجبائية
      definition: >
        مجلة صدرت بالقانون عدد 82 لسنة 2000 المؤرخ في 9 أوت 2000 ودخلت حيز
        التنفيذ في غرة جانفي 2002، تضبط حقوق المطالب بالأداء وواجباته
        والإجراءات المتعلقة بها في مستوى المراقبة والنزاعات الجبائية. وتضبط
        خاصة، منذ سنة 2002، آجال إرجاع فائض الأداء على القيمة المضافة.
      synonymes: []

  - id: promoteur-immobilier
    acronyme: null
    statut: valide
    references: [lf-2017, lf-2018, lf-2025]
    source_definition: {ref: lf-2017, locator: "art. 20"}
    source_traduction: {ref: lf-2017, locator: "art. 20"}
    voir_aussi: [tva, exoneration-tva, taux-reduit-tva]
    fr:
      terme: Promoteur immobilier
      definition: >
        Opérateur immobilier dont certaines ventes relèvent de règles propres
        de TVA. Les ventes de lots de terrain par les promoteurs immobiliers
        entrent dans le champ de la taxe en 2017 ; leurs ventes de logements
        relèvent ensuite des exonérations ou des taux prévus par le code.
      synonymes: []
    ar:
      terme: الباعث العقاري
      definition: >
        متدخل عقاري تخضع بعض بيوعاته لأحكام خاصة في مادة الأداء على القيمة
        المضافة. فقد دخل بيع قطع الأراضي من قبل الباعثين العقاريين في ميدان
        الأداء سنة 2017، ثم خضعت بيوعاتهم للمساكن للإعفاءات أو للنسب المنصوص
        عليها بالمجلة.
      synonymes: []

  - id: droit-de-consommation
    acronyme: null
    statut: valide
    references: [dgelf-code-tva-2023, decret-98-952-fiscalite-petrole-electricite, dgi-nc-29-2007, loi-88-61-tva]
    source_definition: {ref: loi-88-62-droit-consommation, locator: "art. 1er"}
    source_traduction: {ref: loi-88-62-droit-consommation, locator: "art. 1er"}
    voir_aussi: [tva, taux-reduit-tva, tableau-annexe-loi-88-62, position-tarifaire, assiette-droit-consommation, fait-generateur-droit-consommation, suspension-droit-consommation]
    fr:
      terme: Droit de consommation
      definition: >
        Impôt indirect frappant, à l'importation comme à la fabrication locale,
        des produits que la loi ne définit pas par leur nature mais désigne un
        à un par leur position tarifaire, dans un tableau qui lui est annexé.
        Institué par la loi n° 88-62 du 2 juin 1988, le même jour que le code
        de la TVA. Il ne se superpose pas simplement à la taxe sur la valeur
        ajoutée : il entre dans l'assiette de celle-ci, la TVA se liquidant sur
        un prix droit de consommation compris.
      synonymes: []
    ar:
      terme: المعلوم على الاستهلاك
      definition: >
        أداء غير مباشر يوظَّف عند التوريد كما عند الصنع محليا على منتوجات لا
        يعرّفها القانون بطبيعتها بل يعيّنها واحدا واحدا بعدد تعريفتها
        الديوانية في جدول مدرج بملحقه. أحدثه القانون عدد 62 لسنة 1988 المؤرخ
        في 2 جوان 1988، في نفس يوم إصدار مجلة الأداء على القيمة المضافة. وهو
        لا يُضاف إلى الأداء على القيمة المضافة فحسب، بل يدخل في قاعدته، إذ
        يُحتسب هذا الأخير على ثمن يشمل المعلوم على الاستهلاك.
      synonymes: []

  - id: impots-directs
    acronyme: null
    statut: valide
    references: [loi-67-53-lob, loi-org-96-103-lob, lf-2014, minfin-recettes-fiscales]
    source_definition: {ref: zakraoui-ena-droit-fiscal, locator: "p. 14-16"}
    source_traduction: {ref: loi2018-56-lf2019, locator: "tableau A"}
    voir_aussi: [impots-indirects, irpp, impot-societes, impot-fortune]
    fr:
      terme: Impôts directs
      definition: >
        Impôts qui atteignent, avec une certaine périodicité, une matière
        imposable stable ou régulièrement renouvelée, comme un revenu ou un
        bénéfice. En Tunisie, l'impôt sur le revenu des personnes physiques et
        l'impôt sur les sociétés ; le même critère y rattache l'impôt sur la
        fortune, dû chaque année sur le patrimoine détenu au 1er janvier. La
        loi organique du budget les énumérait,
        sans les définir, parmi les recettes de l'État, sous l'intitulé
        « impôts directs ordinaires » à partir de 1996, jusqu'à la loi
        organique du budget de 2019.
      synonymes: [impôts directs ordinaires, imposition directe]
    ar:
      terme: الأداءات المباشرة
      definition: >
        أداءات توظَّف بصفة دورية على مادة خاضعة للأداء قارّة أو متجدّدة
        بانتظام، كالدخل أو الربح. وهي في تونس الضريبة على دخل الأشخاص
        الطبيعيين والضريبة على الشركات، ويُلحق بها المعيار نفسه الضريبة على
        الثروة المستوجبة كل سنة على المكاسب المملوكة في غرّة جانفي. كان
        القانون الأساسي للميزانية
        يعدّدها، دون أن يعرّفها، ضمن موارد الدولة تحت عنوان «الأداءات
        المباشرة الاعتيادية» ابتداء من سنة 1996، إلى حين صدور القانون
        الأساسي للميزانية لسنة 2019.
      synonymes: [الأداءات المباشرة الاعتيادية]

  - id: impots-indirects
    acronyme: null
    statut: valide
    references: [loi-67-53-lob, loi-org-96-103-lob, lf-2014, minfin-recettes-fiscales]
    source_definition: {ref: zakraoui-ena-droit-fiscal, locator: "p. 14-16"}
    source_traduction: {ref: loi2018-56-lf2019, locator: "tableau A"}
    voir_aussi: [impots-directs, tva, droit-de-consommation]
    fr:
      terme: Impôts indirects
      definition: >
        Impôts qui frappent des opérations intermittentes ou successives, à
        l'occasion de la production, de l'échange ou de la consommation d'un
        bien. En Tunisie, la taxe sur la valeur ajoutée, les droits de
        consommation, les droits de douane, les droits d'enregistrement et le
        timbre. La loi organique du budget les énumérait, sans les définir,
        parmi les recettes de l'État, sous l'intitulé « impôts et
        taxes indirects ordinaires » à partir de 1996, jusqu'à la loi
        organique du budget de 2019.
      synonymes: [impôts et taxes indirects ordinaires, imposition indirecte]
    ar:
      terme: الأداءات والمعاليم غير المباشرة
      definition: >
        أداءات توظَّف على عمليات متقطّعة أو متتالية، بمناسبة إنتاج سلعة أو
        تبادلها أو استهلاكها. وهي في تونس الأداء على القيمة المضافة والمعلوم
        على الاستهلاك والمعاليم الديوانية ومعاليم التسجيل والطابع الجبائي. كان
        القانون الأساسي للميزانية يعدّدها، دون أن يعرّفها، ضمن موارد
        الدولة تحت عنوان «الأداءات والمعاليم غير المباشرة الاعتيادية» ابتداء
        من سنة 1996، إلى حين صدور القانون الأساسي للميزانية لسنة 2019.
      synonymes: [الأداءات والمعاليم غير المباشرة الاعتيادية]

  - id: taxe-a-la-production
    acronyme: null
    statut: provisoire
    references: [loi-88-61-tva]
    source_definition: {ref: loi-88-61-tva, locator: "art. 2"}
    voir_aussi: [tva, taxe-prestations-de-service]
    fr:
      terme: Taxe à la production
      definition: >
        Taxe sur le chiffre d'affaires antérieure à la TVA, abrogée par
        l'article 2 de la loi n° 88-61. Les recettes qu'elle produisait
        figurent avant 1988 sous la rubrique « TVA » des statistiques du
        ministère des Finances. Dispositif historique.
      synonymes: []
    ar:
      terme: الأداء على الإنتاج
      definition: ""
      synonymes: []

  - id: taxe-prestations-de-service
    acronyme: null
    statut: provisoire
    references: [loi-88-61-tva]
    source_definition: {ref: loi-88-61-tva, locator: "art. 2"}
    voir_aussi: [tva, taxe-a-la-production]
    fr:
      terme: Taxe sur les prestations de service
      definition: >
        Taxe sur le chiffre d'affaires antérieure à la TVA, frappant les
        services, abrogée par l'article 2 de la loi n° 88-61. Dispositif
        historique.
      synonymes: []
    ar:
      terme: الأداء على الخدمات
      definition: ""
      synonymes: []

  - id: tableau-annexe-loi-88-62
    acronyme: null
    statut: valide
    references: [loi-88-62-droit-consommation, lf-2016, lf-2018, dgi-nc-7-2016, dgi-nc-17-2018]
    source_definition: {ref: loi-88-62-droit-consommation, locator: "tableau annexé"}
    source_traduction: {ref: lf-2016}
    voir_aussi: [droit-de-consommation, position-tarifaire]
    fr:
      terme: Tableau annexé à la loi n° 88-62
      definition: >
        Liste des produits soumis au droit de consommation, annexée à la loi
        n° 88-62 du 2 juin 1988. Elle porte à la fois le champ d'application et
        les taux : trois colonnes — numéro du tarif douanier, désignation des
        produits, droit applicable — et des renvois qui ajoutent des règles de
        fond. Modifier le tableau, c'est donc modifier le champ. Celui de 1988
        a été abrogé et remplacé en entier deux fois, par l'article 44 de la
        loi de finances pour 2016 puis par l'article 45 de la loi de finances
        pour 2018 : pour l'état en vigueur, la source est la version
        consolidée du code, et non le texte de 1988.
      synonymes: []
    ar:
      terme: الجدول المدرج بملحق القانون عدد 62 لسنة 1988
      definition: >
        قائمة المنتوجات الخاضعة للمعلوم على الاستهلاك، مدرجة بملحق القانون
        عدد 62 لسنة 1988 المؤرخ في 2 جوان 1988. وهي تحمل في الآن نفسه ميدان
        التطبيق والنسب: ثلاثة أعمدة — عدد التعريفة الديوانية وبيان المنتوجات
        ونسبة المعلوم — إضافة إلى إحالات تتضمّن قواعد أصلية. فتنقيح الجدول هو
        في ذاته تنقيح لميدان التطبيق. وقد أُلغي جدول 1988 وعُوّض بكامله
        مرّتين، بالفصل 44 من قانون المالية لسنة 2016 ثم بالفصل 45 من قانون
        المالية لسنة 2018: ولمعرفة الوضع الجاري به العمل تُعتمد النسخة
        المنقّحة للمجلة لا نصّ 1988.
      synonymes: []

  - id: position-tarifaire
    acronyme: null
    statut: provisoire
    references: [loi-88-62-droit-consommation]
    source_definition: {ref: loi-88-62-droit-consommation, locator: "tableau annexé, colonne « NT »"}
    voir_aussi: [tableau-annexe-loi-88-62, droit-de-consommation]
    fr:
      terme: Position tarifaire
      definition: >
        Numéro du tarif douanier par lequel le tableau annexé désigne les
        produits soumis au droit de consommation ; le tableau de 1988 en fait
        le titre de sa première colonne, « NT ». La position est soit entière
        (02-03), soit extraite et préfixée « Ex », le libellé précisant alors
        quelle partie de la position est retenue et quelles exclusions s'y
        attachent. Le champ du droit de consommation est ainsi défini par une
        liste douanière, et non par une catégorie économique.
      synonymes: [NT, numéro du tarif douanier]
    ar:
      terme: البند التعريفي
      definition: >
        عدد التعريفة الديوانية الذي يعيّن به الجدول الملحق المنتوجات الخاضعة
        للمعلوم على الاستهلاك؛ وقد جعله جدول 1988 عنوانا لعموده الأول. ويكون
        البند كاملا (02-03) أو مستخرَجا يسبقه الرمز «م»، فيحدّد البيان عندئذ
        الجزء المعنيّ منه وما يُستثنى فيه. وبذلك يُضبط ميدان المعلوم على
        الاستهلاك بقائمة ديوانية لا بصنف اقتصادي.
      synonymes: [عدد التعريفة]

  - id: taux-ad-valorem
    acronyme: null
    statut: provisoire
    references: [loi-88-62-droit-consommation, dgi-nc-29-2007]
    source_definition: {ref: loi-88-62-droit-consommation, locator: "art. 4-a"}
    voir_aussi: [assiette-droit-consommation, taux-specifique, valeur-en-douane]
    fr:
      terme: Taux ad valorem
      definition: >
        Taux exprimé en pourcentage d'une valeur, par opposition au taux
        spécifique. Lorsque le tableau annexé soumet un produit à un taux ad
        valorem, l'assiette du droit de consommation est, à l'importation, la
        valeur en douane et, en régime intérieur, le prix de vente tous frais,
        droits et taxes compris, à l'exclusion du droit de consommation
        lui-même et de la taxe sur la valeur ajoutée.
      synonymes: []
    ar:
      terme: نسبة من القيمة
      definition: >
        نسبة تُحتسب مئويا من قيمة، خلافا للنسبة النوعية. فإذا أخضع الجدول
        الملحق منتوجا لنسبة من القيمة، تكوّنت قاعدة المعلوم على الاستهلاك عند
        التوريد من القيمة المصرح بها لدى الديوانة، وفي النظام الداخلي من ثمن
        البيع باعتبار كل المصاريف والمعاليم والأداءات باستثناء المعلوم على
        الاستهلاك والأداء على القيمة المضافة.
      synonymes: []

  - id: taux-specifique
    acronyme: null
    statut: valide
    references: [loi-88-62-droit-consommation]
    source_definition: {ref: loi-88-62-droit-consommation, locator: "art. 4-b"}
    source_traduction: {ref: loi-88-62-droit-consommation, locator: "art. 4-b"}
    voir_aussi: [assiette-droit-consommation, taux-ad-valorem]
    fr:
      terme: Taux spécifique
      definition: >
        Taux assis non sur une valeur mais sur une quantité — volume ou poids
        —, par opposition au taux ad valorem. Le tableau annexé mêle les deux
        techniques dès 1988 : le droit de consommation n'est donc ni une taxe
        ad valorem ni une accise spécifique, mais mixte dès l'origine. Un
        tarif spécifique ne suit pas les prix ; il ne varie qu'à chaque
        révision du tableau, de sorte qu'une longue stabilité nominale y
        équivaut à une érosion réelle.
      synonymes: []
    ar:
      terme: نسبة نوعية
      definition: >
        نسبة لا تُحتسب من قيمة بل من كمّية — حجم أو وزن —، خلافا للنسبة من
        القيمة. ويجمع الجدول الملحق بين الأسلوبين منذ 1988: فالمعلوم على
        الاستهلاك ليس أداء على القيمة ولا معلوما نوعيا خالصا، بل هو مختلط منذ
        نشأته. والتعريفة النوعية لا تتبع الأسعار، إذ لا تتغيّر إلا بمراجعة
        الجدول، فيعادل ثباتها الاسمي الطويل تآكلا حقيقيا.
      synonymes: []

  - id: fait-generateur-droit-consommation
    acronyme: null
    statut: valide
    references: [loi-88-62-droit-consommation]
    source_definition: {ref: loi-88-62-droit-consommation, locator: "art. 3"}
    source_traduction: {ref: loi-88-62-droit-consommation, locator: "art. 3"}
    voir_aussi: [droit-de-consommation, fait-generateur-tva, entrepositaire]
    fr:
      terme: Fait générateur du droit de consommation
      definition: >
        Événement qui rend le droit de consommation exigible. L'article 3 de
        la loi n° 88-62 n'en retient que deux : le dédouanement du produit à
        l'importation, la livraison du produit en régime intérieur. La
        rédaction est plus étroite que celle du code de la taxe sur la valeur
        ajoutée — ni livraison à soi-même, ni prestation de service, ni
        travaux immobiliers —, l'impôt étant assis sur des produits et non sur
        des opérations de toute nature.
      synonymes: []
    ar:
      terme: الحدث المتولد عنه المعلوم على الاستهلاك
      definition: >
        الواقعة التي يصبح بها المعلوم على الاستهلاك مستوجبا. ولم يحتفظ الفصل 3
        من القانون عدد 62 لسنة 1988 إلا بحالتين: استخراج المنتوج من الديوانة
        عند التوريد، وتسليم المنتوج في النظام الداخلي. وهي صياغة أضيق من
        صياغة مجلة الأداء على القيمة المضافة — فلا تسليم للنفس ولا إسداء
        خدمات ولا أشغال عقارية — لأنّ الأداء موظّف على منتوجات لا على عمليات
        من كلّ نوع.
      synonymes: []

  - id: assiette-droit-consommation
    acronyme: null
    statut: valide
    references: [loi-88-62-droit-consommation, dgi-nc-29-2007]
    source_definition: {ref: loi-88-62-droit-consommation, locator: "art. 4"}
    source_traduction: {ref: loi-88-62-droit-consommation, locator: "art. 4"}
    voir_aussi: [droit-de-consommation, taux-ad-valorem, taux-specifique, valeur-en-douane]
    fr:
      terme: Assiette du droit de consommation
      definition: >
        Base sur laquelle le droit de consommation est liquidé. Elle se
        dédouble selon la technique retenue par le tableau annexé : pour les
        produits soumis à un taux ad valorem, la valeur en douane à
        l'importation, ou le prix de vente tous frais, droits et taxes
        compris — droit de consommation et taxe sur la valeur ajoutée exclus —
        en régime intérieur ; pour les produits soumis à un taux spécifique,
        le volume ou le poids. Cette assiette n'inclut pas la taxe sur la
        valeur ajoutée, alors que celle de la taxe inclut le droit de
        consommation : le cumul est une cascade asymétrique.
      synonymes: []
    ar:
      terme: قاعدة المعلوم على الاستهلاك
      definition: >
        القاعدة التي يُحتسب عليها المعلوم على الاستهلاك. وهي تنقسم بحسب
        الأسلوب الذي يعتمده الجدول الملحق: بالنسبة إلى المنتوجات الخاضعة
        لنسبة من القيمة، القيمة المصرح بها لدى الديوانة عند التوريد، أو ثمن
        البيع باعتبار كل المصاريف والمعاليم والأداءات باستثناء المعلوم على
        الاستهلاك والأداء على القيمة المضافة في النظام الداخلي؛ وبالنسبة إلى
        الخاضعة لنسبة نوعية، الحجم أو الوزن. ولا تشمل هذه القاعدة الأداء على
        القيمة المضافة، في حين تشمل قاعدة هذا الأخير المعلوم على الاستهلاك.
      synonymes: []

  - id: imputation-droit-consommation
    acronyme: null
    statut: provisoire
    references: [loi-88-62-droit-consommation, loi-89-115-lf-1990]
    source_definition: {ref: loi-88-62-droit-consommation, locator: "art. 5"}
    voir_aussi: [droit-de-consommation, facturation-identique]
    fr:
      terme: Imputation du droit de consommation
      definition: >
        Faculté reconnue aux assujettis d'imputer sur le droit de
        consommation dû celui qui a grevé leurs acquisitions auprès d'autres
        assujettis et leurs propres importations de matières ou produits
        entrant intégralement dans la composition du produit final soumis ; le
        reliquat non imputé sur un mois est reporté sur les mois suivants. Le
        mécanisme est voisin de la déduction de taxe sur la valeur ajoutée,
        mais plus étroit, puisqu'il suppose l'incorporation intégrale de la
        matière au produit final. C'est par lui que le droit de consommation
        se distingue d'une accise ordinaire.
      synonymes: []
    ar:
      terme: خصم المعلوم على الاستهلاك
      definition: >
        رخصة تُخوَّل للخاضعين في خصم المعلوم على الاستهلاك الذي أثقل فعلا
        شراءاتهم لدى خاضعين آخرين ووارداتهم من المواد والمنتوجات التي تدخل
        كليا في تركيب المنتوج النهائي الخاضع للمعلوم، على أن يؤجَّل طرح
        المبلغ المتبقّي إلى الأشهر الموالية. وهي آلية قريبة من الطرح في مادة
        الأداء على القيمة المضافة غير أنّها أضيق منه، إذ تشترط دخول المادة
        كليا في المنتوج النهائي. وبها يفترق المعلوم على الاستهلاك عن المعاليم
        النوعية العادية.
      synonymes: [طرح المعلوم على الاستهلاك]

  - id: facturation-identique
    acronyme: null
    statut: provisoire
    references: [loi-89-115-lf-1990, loi-88-62-droit-consommation]
    source_definition: {ref: loi-89-115-lf-1990, locator: "art. 34"}
    voir_aussi: [imputation-droit-consommation, droit-de-consommation]
    fr:
      terme: Facturation à l'identique
      definition: >
        Obligation faite aux commerçants assujettis à la taxe sur la valeur
        ajoutée qui commercialisent des produits soumis au droit de
        consommation de facturer à leurs clients le droit supporté lors de
        l'acquisition des mêmes produits, ce droit étant alors déductible.
        Ajoutée à l'article 5 de la loi n° 88-62 par l'article 34 de la loi de
        finances pour 1990, elle prolonge en aval le mécanisme d'imputation.
        L'article 4 de la loi de 1988 posait déjà une règle voisine pour les
        boissons alcoolisées, retransmises aux clients pour les mêmes montants
        supportés.
      synonymes: []
    ar:
      terme: الفوترة بنفس المبلغ
      definition: >
        واجب محمول على التجار الخاضعين للأداء على القيمة المضافة الذين
        يروّجون منتوجات خاضعة للمعلوم على الاستهلاك، وهو أن يفوتروا لحرفائهم
        بنفس المبلغ المعلوم الذي تحمّلوه عند اقتناء نفس المنتوجات، ويكون هذا
        المعلوم عندئذ قابلا للطرح. أُضيف هذا الواجب إلى الفصل 5 من القانون
        عدد 62 لسنة 1988 بالفصل 34 من قانون المالية لسنة 1990، فمدّ آلية
        الخصم إلى ما بعد مرحلة الصنع. وكان الفصل 4 من قانون 1988 قد وضع قاعدة
        قريبة منها في خصوص المشروبات الكحولية التي تُحال إلى الحرفاء بنفس
        المبالغ التي وُظّفت عليها.
      synonymes: []

  - id: entrepositaire
    acronyme: null
    statut: valide
    references: [loi-88-62-droit-consommation, loi-2007-70-lf-2008]
    source_definition: {ref: loi-88-62-droit-consommation, locator: "art. 2-4"}
    source_traduction: {ref: loi-88-62-droit-consommation, locator: "art. 2-4"}
    voir_aussi: [droit-de-consommation, fait-generateur-droit-consommation, suspension-droit-consommation]
    fr:
      terme: Entrepositaire
      definition: >
        Personne qui détient en entrepôt des boissons alcoolisées, des vins ou
        des bières. L'article 2 de la loi n° 88-62 range les entrepositaires
        et les commerçants de gros de ces produits parmi les assujettis au
        droit de consommation, aux côtés des fabricants de bière, des
        embouteilleurs de vin et des fabricants de tout autre produit soumis ;
        une cinquième catégorie a été ajoutée en 2008, la Société tunisienne
        de l'électricité et du gaz, au titre du gaz naturel carburant.
        L'importateur ne figure pas dans cette énumération, alors même que le
        dédouanement est un fait générateur : à l'importation, le dispositif
        tient par la liquidation en douane plutôt que par la qualité
        d'assujetti, et aucun des textes lus ne commente cette articulation.
        L'article 4 neutralise par ailleurs l'effet du droit sur les marges
        des entrepositaires, qui le retransmettent à leurs clients pour les
        mêmes montants.
      synonymes: []
    ar:
      terme: أرباب المخازن
      definition: >
        من يمسكون في مخازنهم المشروبات الكحولية والخمور والجعة. وقد أدرج
        الفصل 2 من القانون عدد 62 لسنة 1988 أرباب المخازن وتجار الجملة لهذه
        المنتوجات ضمن الخاضعين للمعلوم على الاستهلاك، إلى جانب صانعي الجعة
        ومعبّئي الخمور وصانعي كلّ المواد الأخرى الخاضعة للمعلوم؛ ثم أُضيف صنف
        خامس سنة 2008 هو الشركة التونسية للكهرباء والغاز بعنوان الغاز الطبيعي
        المستعمل وقودا للعربات. ولا يرد المورّد في هذا التعداد مع أنّ استخراج
        المنتوج من الديوانة يكوّن الحدث المتولد عنه المعلوم: فالأمر يقوم عند
        التوريد على الاستخلاص لدى الديوانة لا على صفة الخاضع، ولم يعلّق أيّ
        من النصوص المطَّلع عليها على هذه المسألة. كما نصّ الفصل 4 على أنّ
        المعلوم لا تأثير له على حساب ربح أرباب المخازن، إذ يُحال إلى حرفائهم
        بنفس المبلغ الذي وُظّف عليه.
      synonymes: []

  - id: suspension-droit-consommation
    acronyme: null
    statut: valide
    references: [loi-88-62-droit-consommation, lf-2018]
    source_definition: {ref: loi-88-62-droit-consommation, locator: "art. 6 bis"}
    source_traduction: {ref: lf-2018, locator: "art. 22"}
    voir_aussi: [droit-de-consommation, entrepositaire]
    fr:
      terme: Suspension du droit de consommation
      definition: >
        Régime par lequel le droit de consommation n'est pas exigé lors d'une
        opération qui, sans lui, y serait soumise. L'article 6 bis de la loi
        n° 88-62, ajouté par l'article 22 de la loi de finances pour 2018, en
        institue un cas : les véhicules tout terrain importés par les
        concessionnaires au profit des agences de voyages.
      synonymes: []
    ar:
      terme: توقيف العمل بالمعلوم على الاستهلاك
      definition: >
        نظام لا يُطلب بمقتضاه المعلوم على الاستهلاك عند عملية كانت لولاه
        خاضعة له. وقد أحدث الفصل 6 مكرر من القانون عدد 62 لسنة 1988، المضاف
        بالفصل 22 من قانون المالية لسنة 2018، حالة من حالاته: العربات الصالحة
        لكل المسالك الموردة من قبل الوكلاء المعتمدين لفائدة وكالات الأسفار.
      synonymes: []

  - id: valeur-en-douane
    acronyme: null
    statut: provisoire
    references: [loi-88-62-droit-consommation]
    source_definition: {ref: loi-88-62-droit-consommation, locator: "art. 4-a"}
    voir_aussi: [assiette-droit-consommation, taux-ad-valorem]
    fr:
      terme: Valeur en douane
      definition: >
        Valeur retenue au dédouanement, qui sert d'assiette au droit de
        consommation à l'importation pour les produits soumis à un taux ad
        valorem. L'article 4 de la loi n° 88-62 la désigne comme la valeur
        déclarée en douane ; en régime intérieur lui répond le prix de vente
        tous frais, droits et taxes compris.
      synonymes: []
    ar:
      terme: القيمة المصرح بها لدى الديوانة
      definition: >
        القيمة المعتمدة عند الإخراج من الديوانة، وهي قاعدة المعلوم على
        الاستهلاك عند التوريد بالنسبة إلى المنتوجات الخاضعة لنسبة من القيمة.
        وهذه هي العبارة التي استعملها الفصل 4 من القانون عدد 62 لسنة 1988،
        ويقابلها في النظام الداخلي ثمن البيع باعتبار كل المصاريف والمعاليم
        والأداءات.
      synonymes: []

  - id: taxe-unique-compensation-carburants
    acronyme: null
    statut: provisoire
    references: [decret70-622]
    source_definition: {ref: decret70-622, locator: "art. 5"}
    # AR : l'édition arabe du décret n° 70-622, art. 5, écrit « معلوم وحيد تعويضي
    # يستخلص لفائدة الصندوق العام للتعويضات » (lue à l'image par le documentaliste,
    # docs/notes/compensation-avant-1970-et-plans.md). Le complément « على منتوجات
    # النفط » est ajouté ici pour distinguer cette taxe de celle des transports
    # routiers : il n'est pas dans le texte, d'où le statut provisoire.
    source_traduction: {ref: decret70-622, locator: "art. 5"}
    voir_aussi: [caisse-generale-compensation, centimes-additionnels, taxe-unique-compensation-transports-routiers, droit-de-consommation]
    fr:
      terme: Taxe unique de compensation sur les produits pétroliers
      definition: >
        Taxe perçue au profit de la Caisse générale de compensation, en laquelle le
        décret n° 70-622 du 31 décembre 1970 (art. 5) consolide, à compter du 1^er^
        janvier 1971, trois prélèvements sur les carburants : la taxe de péréquation
        de 1957, la taxe de compensation de 1964 et quatre centimes additionnels au
        droit de consommation. Le tableau annexé à la loi n° 88-62 du 2 juin 1988, qui
        refond le droit de consommation, y renvoie encore.
      synonymes: [Taxe unique de compensation sur les carburants]
    ar:
      terme: المعلوم الوحيد التعويضي على منتوجات النفط
      definition: >
        معلوم يُستخلص لفائدة الصندوق العام للتعويض، وحّد فيه الأمر عدد 622 لسنة 1970
        المؤرخ في 31 ديسمبر 1970 (الفصل 5)، بداية من غرة جانفي 1971، ثلاثة اقتطاعات
        على المحروقات: المعلوم التعديلي لسنة 1957، والمعلوم التعويضي لسنة 1964، وأربعة
        صانتيمات إضافية للأداء على الاستهلاك. وما زال الجدول الملحق بالقانون عدد 62
        لسنة 1988 المؤرخ في 2 جوان 1988، المتعلق بمراجعة المعلوم على الاستهلاك، يحيل
        إليه.
      synonymes: [المعلوم الوحيد التعويضي]

  - id: taxe-bieres-vins-boissons-alcoolisees
    acronyme: null
    statut: valide
    references: [loi-88-62-droit-consommation]
    source_definition: {ref: loi-88-62-droit-consommation, locator: "art. 7"}
    source_traduction: {ref: loi-88-62-droit-consommation, locator: "art. 7"}
    voir_aussi: [droit-de-consommation, taxe-unique-compensation-carburants]
    fr:
      terme: Taxe sur les bières, vins et autres boissons alcoolisées
      definition: >
        Taxe instituée par les articles 4 à 11 de la loi n° 84-2 du 21 mars
        1984, portant loi de finances complémentaire pour la gestion 1984, en
        remplacement de la taxe parafiscale unique sur les vins, bières et
        boissons alcoolisées. Ces articles ont été abrogés par l'article 7 de
        la loi n° 88-62 du 2 juin 1988, qui lui substitue le droit de
        consommation. Dispositif historique.
      synonymes: []
    ar:
      terme: الأداء على الجعة والخمور والمشروبات الكحولية الأخرى
      definition: >
        أداء أحدثته الفصول من 4 إلى 11 من القانون عدد 2 لسنة 1984 المؤرخ في 21
        مارس 1984 والمتعلق بقانون المالية التكميلي لتصرّف سنة 1984، عوضا عن
        الأداء شبه الجبائي الوحيد على الخمور والجعة والمشروبات الكحولية. وقد
        ألغى هذه الفصولَ الفصلُ 7 من القانون عدد 62 لسنة 1988 المؤرخ في 2
        جوان 1988، فحلّ محلّها المعلوم على الاستهلاك. نظام تاريخي.
      synonymes: []

  - id: impot-societes
    acronyme: IS
    statut: valide
    references: [loi-irpp-is-1989, code-irpp-is-1990]
    source_definition: {ref: loi-irpp-is-1989, locator: "art. 1er et 45"}
    source_traduction: {ref: loi-irpp-is-1989, locator: "art. 1er et 45"}
    voir_aussi: [irpp, benefice-imposable, minimum-impot-chiffre-affaires]
    fr:
      terme: Impôt sur les sociétés
      definition: >
        Impôt direct frappant les bénéfices des personnes morales, régi par le
        code de l'impôt sur le revenu des personnes physiques et de l'impôt sur
        les sociétés, promulgué par la loi n° 89-114 du 30 décembre 1989 et
        applicable aux bénéfices réalisés à compter du 1er janvier 1990. Il
        partage ce code avec l'impôt sur le revenu, dont il reprend par renvoi
        une partie des règles d'assiette. Il a remplacé l'impôt sur les
        bénéfices des sociétés de l'article 9 de la loi n° 85-109 du
        31 décembre 1985.
      synonymes: []
    ar:
      terme: الضريبة على الشركات
      definition: >
        ضريبة مباشرة توظَّف على أرباح الأشخاص المعنويين، تنظّمها مجلة الضريبة
        على دخل الأشخاص الطبيعيين والضريبة على الشركات الصادرة بالقانون عدد
        114 لسنة 1989 المؤرخ في 30 ديسمبر 1989، وتنطبق على الأرباح المحقّقة
        ابتداء من غرّة جانفي 1990. وهي تتقاسم هذه المجلة مع الضريبة على دخل
        الأشخاص الطبيعيين وتحيل عليها في جانب من قواعد الأساس. وقد حلّت محلّ
        الضريبة على أرباح الشركات المنصوص عليها بالفصل 9 من القانون عدد 109
        لسنة 1985 المؤرخ في 31 ديسمبر 1985.
      synonymes: []

  - id: impot-fortune
    acronyme: null
    statut: valide
    references: [lf-2026, dgi-nc-13-2026, lf-2023]
    source_definition: {ref: lf-2026, locator: "art. 88"}
    source_traduction: {ref: dgi-nc-13-2026}
    voir_aussi: [impot-fortune-immobiliere, impots-directs, habitation-principale]
    fr:
      terme: Impôt sur la fortune
      definition: >
        Impôt dû au 1er janvier de chaque année par les personnes physiques sur
        la valeur, nette des dettes que le texte admet en déduction, de leurs
        immeubles, fonds de commerce et meubles, y compris ceux de leurs enfants
        mineurs à charge, lorsqu'elle atteint 3 millions de dinars. Institué par
        l'article 88 de la loi de finances pour 2026 à compter du 1er janvier
        2026, il abroge et remplace l'impôt sur la fortune immobilière de 2023.
        Il n'est codifié dans aucun code ; sa procédure relève du code des
        droits et procédures fiscaux.
      synonymes: []
    ar:
      terme: الضريبة على الثروة
      definition: >
        ضريبة تُستوجب في 1 جانفي من كل سنة على الأشخاص الطبيعيين بعنوان قيمة
        ما يملكونه من عقارات وأصول تجارية ومنقولات، بما في ذلك مكاسب أبنائهم
        القصّر الذين في كفالتهم، بعد طرح الديون التي يجيز النص طرحها، إذا بلغت
        هذه القيمة 3 مليون دينار. أُحدثت بالفصل 88 من قانون المالية لسنة 2026
        ابتداء من غرّة جانفي 2026، وألغت الضريبة على الثروة العقارية لسنة 2023
        وعوّضتها. لا تندرج في أيّ مجلة، وتخضع في إجراءاتها لمجلة الحقوق
        والإجراءات الجبائية.
      synonymes: []

  - id: impot-fortune-immobiliere
    acronyme: null
    statut: valide
    references: [lf-2023, dgi-nc-15-2023]
    source_definition: {ref: lf-2023, locator: "art. 23"}
    source_traduction: {ref: lf-2023, locator: "art. 23"}
    voir_aussi: [impot-fortune, habitation-principale]
    fr:
      terme: Impôt sur la fortune immobilière
      definition: >
        Impôt exigible au 1er janvier de chaque année, de 2023 à 2025, sur les
        immeubles des personnes physiques, y compris ceux de leurs enfants
        mineurs sous leur tutelle, dont la valeur, nette des dettes que le texte
        admet en déduction, atteignait 3 millions de dinars ; son taux était de
        0,5 %. Institué par l'article 23 du décret-loi n° 2022-79 portant loi de
        finances pour 2023, il a été abrogé et remplacé, à compter du 1er
        janvier 2026, par l'impôt sur la fortune.
      synonymes: []
    ar:
      terme: الضريبة على الثروة العقارية
      definition: >
        ضريبة توظَّف في غرّة جانفي من كل سنة، من 2023 إلى 2025، على عقارات
        الأشخاص الطبيعيين، بما في ذلك عقارات أبنائهم القصّر الذين في كفالتهم،
        التي تساوي قيمتها بعد طرح الديون التي يجيز النص طرحها أو تفوق 3 مليون
        دينار، بنسبة 0,5 %. أُحدثت بالفصل 23 من المرسوم عدد 79 لسنة 2022
        المتعلق بقانون المالية لسنة 2023، وأُلغيت وعُوّضت بالضريبة على الثروة
        ابتداء من غرّة جانفي 2026.
      synonymes: []

  - id: impot-foncier-2014
    acronyme: null
    statut: valide
    references: [lf-2014, lfc-2014]
    source_definition: {ref: lf-2014, locator: "art. 55"}
    source_traduction: {ref: lf-2014, locator: "art. 55"}
    voir_aussi: [impot-fortune-immobiliere]
    fr:
      terme: Impôt foncier (2014)
      definition: >
        Impôt sur les immeubles détenus par les personnes physiques, droits
        qui s'y rattachent compris, égal à une fois et demie la taxe sur les
        immeubles bâtis ou la taxe sur les immeubles non bâtis, institué par
        l'article 55 de la loi de finances pour 2014. L'article 38 de la loi de
        finances complémentaire pour 2014 en a supprimé les dispositions à
        compter du 1er janvier 2014.
      synonymes: []
    ar:
      terme: الضريبة العقارية (2014)
      definition: >
        ضريبة على العقارات التي يمتلكها الأشخاص الطبيعيون، بما في ذلك الحقوق
        المتعلقة بها، تساوي مرّة ونصف المعلوم على العقارات المبنية أو المعلوم
        على الأراضي غير المبنية، أُحدثت بالفصل 55 من قانون المالية لسنة 2014،
        وألغى الفصل 38 من قانون المالية التكميلي لسنة 2014 أحكامها ابتداء من
        غرّة جانفي 2014.
      synonymes: []

  - id: habitation-principale
    acronyme: null
    statut: valide
    references: [lf-2023, lf-2026, dgi-nc-13-2026]
    source_definition: {ref: lf-2023, locator: "art. 23 § 3"}
    source_traduction: {ref: lf-2023, locator: "art. 23 § 3"}
    voir_aussi: [impot-fortune, impot-fortune-immobiliere]
    fr:
      terme: Habitation principale
      definition: >
        Logement où le redevable a son habitation principale, exclu de l'impôt
        sur la fortune immobilière puis de l'impôt sur la fortune, avec, depuis
        2026, le mobilier qui y est utilisé. La loi ne la définit pas ;
        l'administration l'entend quelle qu'en soit la valeur ou la surface,
        dépendances comprises, la preuve se faisant par une attestation des
        services compétents.
      synonymes: []
    ar:
      terme: المسكن الرئيسي
      definition: >
        المسكن الذي يتخذه المطالب بالضريبة مسكنا رئيسيا، ويخرج من الضريبة على
        الثروة العقارية ثم من الضريبة على الثروة، مع الأثاث المستغل به منذ
        2026. لا يعرّفه القانون، وتعتبره الإدارة مهما كانت قيمته أو مساحته بما
        في ذلك توابعه، ويثبت بشهادة من المصالح المختصة.
      synonymes: []

  - id: fonds-de-commerce
    acronyme: null
    statut: provisoire
    references: [lf-2026]
    source_definition: {ref: lf-2026, locator: "art. 88 § 3"}
    voir_aussi: [impot-fortune]
    fr:
      terme: Fonds de commerce
      definition: >
        Élément du patrimoine que l'article 88 de la loi de finances pour 2026
        range parmi les biens soumis à l'impôt sur la fortune, à côté des
        immeubles et des meubles, et dont il exclut ceux qui sont
        effectivement exploités.
        Le terme français est une traduction ; il reste à confirmer dans un
        texte bilingue du Journal officiel.
      synonymes: []
    ar:
      terme: الأصول التجارية
      definition: >
        عنصر من المكاسب يدرجه الفصل 88 من قانون المالية لسنة 2026 ضمن
        المكاسب الخاضعة للضريبة على الثروة، إلى جانب العقارات والمنقولات،
        ويستثني منه الأصول التجارية المستغلة فعليا.
      synonymes: []

  - id: benefice-imposable
    acronyme: null
    statut: valide
    references: [code-irpp-is-1990]
    source_definition: {ref: code-irpp-is-1990, locator: "art. 49 § I"}
    source_traduction: {ref: code-irpp-is-1990, locator: "art. 49 § I"}
    voir_aussi: [impot-societes, minimum-impot-chiffre-affaires]
    fr:
      terme: Bénéfice imposable
      definition: >
        Assiette de l'impôt sur les sociétés. Le taux lui est appliqué après
        arrondi au dinar inférieur, selon les termes mêmes du paragraphe I de
        l'article 49 du code. À ne pas confondre avec le résultat comptable,
        dont il se déduit par une série de réintégrations et de déductions.
      synonymes: []
    ar:
      terme: الربح الخاضع للضريبة
      definition: >
        أساس الضريبة على الشركات. تُطبَّق عليه النسبة بعد تدويره إلى الدينار
        الأدنى، حسب عبارة الفقرة I من الفصل 49 من المجلة. ولا يُخلط بالنتيجة
        المحاسبية التي يُستخرج منها بجملة من الإدماجات والطروحات.
      synonymes: []

  - id: minimum-impot-chiffre-affaires
    acronyme: null
    statut: valide
    references: [code-irpp-is-1990, lf-2006, lf-2011, lf-2014]
    source_definition: {ref: code-irpp-is-1990, locator: "art. 49 § II"}
    source_traduction: {ref: code-irpp-is-1990, locator: "art. 49 § II"}
    voir_aussi: [impot-societes, benefice-imposable]
    fr:
      terme: Minimum d'impôt sur le chiffre d'affaires
      definition: >
        Plancher de l'impôt annuel, prévu au paragraphe II de l'article 49 du
        code : une fraction du chiffre d'affaires brut, assortie d'un montant
        minimal exigible même en l'absence de chiffre d'affaires. Il ne se
        confond ni avec le minimum d'impôt de l'article 12 bis de la loi
        n° 89-114, qui plafonne les avantages fiscaux et s'assied sur l'impôt
        théorique, ni avec celui de l'article 44 § II, qui en est l'équivalent
        du côté de l'impôt sur le revenu.
      synonymes: [Minimum d'impôt]
    ar:
      terme: الضريبة الدنيا
      definition: >
        الحدّ الأدنى للضريبة السنوية، المنصوص عليه بالفقرة II من الفصل 49 من
        المجلة: نسبة من رقم المعاملات الخام، مع مبلغ أدنى مستوجب حتى في صورة
        عدم تحقيق رقم معاملات. ولا يُخلط بالضريبة الدنيا المنصوص عليها بالفصل
        12 مكرر من القانون عدد 114 لسنة 1989، التي تسقّف الامتيازات الجبائية
        وتُحتسب على الضريبة النظرية، ولا بتلك المنصوص عليها بالفقرة II من
        الفصل 44، وهي مقابلها في الضريبة على دخل الأشخاص الطبيعيين.
      synonymes: [الحد الأدنى للضريبة]

  - id: taux-global
    acronyme: null
    statut: provisoire
    references: [loi97-4]
    source_definition: {ref: loi60-30, locator: "art. 10 et 41"}
    voir_aussi: [cotisations-sociales, cnss, compte-de-compensation]
    fr:
      terme: Taux global de cotisation
      definition: >
        Taux unique fixé par l'article 41 de la loi n° 60-30 pour l'ensemble
        des régimes que cette loi institue, à la charge de l'employeur et du
        travailleur, et non par risque. Sa ventilation par régime est proposée
        par le conseil d'administration de la Caisse nationale de sécurité
        sociale et approuvée par l'autorité de tutelle (art. 10 et 27). Certaines branches
        y sont financées par prélèvement, sans relèvement du prélèvement total :
        l'assurance maladie, la protection sociale des travailleurs et un point
        transféré aux accidents du travail en 1995.
      synonymes: [Taux global]
    ar:
      terme: النسبة الجملية للمساهمات
      definition: >
        نسبة موحّدة يضبطها الفصل 41 من القانون عدد 30 لسنة 1960 لمجموع
        الأنظمة التي يحدثها هذا القانون، محمولة على المؤجر والعامل، لا على
        كل خطر على حدة. ويقترح مجلس إدارة الصندوق الوطني للضمان الاجتماعي
        توزيعها حسب الأنظمة وتصادق عليه سلطة الإشراف (الفصلان 10 و27). وتُموَّل بعض الفروع باقتطاع منها، دون
        الترفيع في الاقتطاع الجملي: التأمين على المرض، والحماية الاجتماعية
        للعمّال، ونقطة حُوّلت إلى حوادث الشغل سنة 1995.
      synonymes: []

  - id: compte-de-compensation
    acronyme: null
    statut: provisoire
    references: [decret2000-1902]
    source_definition: {ref: loi60-30, locator: "art. 22"}
    voir_aussi: [fonds-de-reserve, taux-global, cnss]
    fr:
      terme: Compte de compensation
      definition: >
        Compte que la Caisse nationale de sécurité sociale établit pour chacun
        des régimes qu'elle gère : il porte en recettes la quote-part des
        cotisations réservée au régime et la quote-part des autres recettes qui
        lui revient, en dépenses les charges du régime, dont une quote-part des
        frais de fonctionnement (loi n° 60-30, art. 22). Le décret n° 2000-1902
        le maintient parmi les comptes arrêtés chaque année (art. 9).
      synonymes: []
    ar:
      terme: حساب المقاصّة
      definition: >
        حساب يمسكه الصندوق الوطني للضمان الاجتماعي لكل نظام يتصرّف فيه: يتضمّن
        في المداخيل منابَ المساهمات المخصّص للنظام ومنابَ الموارد الأخرى الراجع
        إليه، وفي المصاريف أعباءَ النظام، ومنها مناب من مصاريف التسيير (القانون
        عدد 30 لسنة 1960، الفصل 22). ويُبقي عليه الأمر عدد 1902 لسنة 2000 ضمن
        الحسابات التي تُختم كل سنة (الفصل 9).
      synonymes: []

  - id: fonds-de-reserve
    acronyme: null
    statut: provisoire
    references: [decret76-3, decret2005-321]
    source_definition: {ref: loi60-30, locator: "art. 23"}
    voir_aussi: [compte-de-compensation, reserve-technique, gestion-financiere-distincte]
    fr:
      terme: Fonds de réserve
      definition: >
        Réserve propre à chaque régime d'une caisse de sécurité sociale, qui
        reçoit ses excédents et supporte ses déficits ; lorsqu'elle tombe sous
        le minimum fixé, le conseil d'administration est tenu de proposer une
        majoration du taux de cotisation ou toute autre mesure de nature à
        rétablir l'équilibre (loi n° 60-30, art. 23, pour la CNSS). La règle
        est reprise pour la CNRPS (décret n° 76-3, art. 13) et pour la CNAM
        (décret n° 2005-321, art. 11).
      synonymes: [Fonds de réserve par régime]
    ar:
      terme: صندوق الاحتياط
      definition: >
        احتياطي خاص بكل نظام من أنظمة صندوق للضمان الاجتماعي، تُرصد فيه فوائضه
        وتُحمَّل عليه عجوزاته؛ وإذا نزل دون الحدّ الأدنى المضبوط، يتعيّن على مجلس
        الإدارة أن يقترح الترفيع في نسبة المساهمة أو أي إجراء آخر من شأنه إعادة
        التوازن (القانون عدد 30 لسنة 1960، الفصل 23، بالنسبة إلى الصندوق الوطني
        للضمان الاجتماعي). وتُعتمد القاعدة نفسها للصندوق الوطني للتقاعد والحيطة
        الاجتماعية (الأمر عدد 3 لسنة 1976، الفصل 13) وللصندوق الوطني للتأمين على
        المرض (الأمر عدد 321 لسنة 2005، الفصل 11).
      synonymes: []

  - id: reserve-technique
    acronyme: null
    statut: provisoire
    references: [loi81-6]
    source_definition: {ref: decret74-499, locator: "art. 10-12"}
    voir_aussi: [fonds-de-reserve, gestion-financiere-distincte]
    fr:
      terme: Réserve technique
      definition: >
        Réserve d'un régime de pensions de la Caisse nationale de sécurité
        sociale, constituée par l'excédent de ses recettes sur ses dépenses,
        placée à moyen ou long terme et comptabilisée à part. Le régime des
        salariés non agricoles la reçoit en 1974, et le régime agricole en
        1981, avec une dotation initiale prélevée sur les excédents des autres
        régimes de la caisse (décret n° 74-499, art. 10-12 ; loi n° 81-6,
        art. 7).
      synonymes: [Réserve technique initiale]
    ar:
      terme: الاحتياطي الفنّي
      definition: >
        احتياطي نظام للجرايات بالصندوق الوطني للضمان الاجتماعي، يتكوّن من فائض
        مداخيله على مصاريفه، ويُوظَّف على المدى المتوسط أو الطويل ويُمسك له حساب
        منفصل. وقد تلقّاه نظام الأجراء غير الفلاحيين سنة 1974 والنظام الفلاحي
        سنة 1981، مع اعتماد أوّلي يُقتطع من فوائض الأنظمة الأخرى للصندوق (الأمر
        عدد 499 لسنة 1974، الفصول 10 إلى 12؛ القانون عدد 6 لسنة 1981، الفصل 7).
      synonymes: []

  - id: gestion-financiere-distincte
    acronyme: null
    statut: provisoire
    references: [loi81-6, loi89-73]
    source_definition: {ref: decret74-499, locator: "art. 7"}
    voir_aussi: [reserve-technique, compte-de-compensation, fonds-de-reserve]
    fr:
      terme: Gestion financière distincte
      definition: >
        Règle selon laquelle un régime géré par la Caisse nationale de sécurité
        sociale tient ses recettes, ses dépenses et ses réserves à part, « dans
        le cadre de l'organisation financière générale » de la caisse. Elle est
        posée pour les pensions du secteur non agricole (décret n° 74-499,
        art. 7), puis pour les régimes agricoles (loi n° 81-6, art. 6) et le
        régime agricole amélioré (loi n° 89-73).
      synonymes: []
    ar:
      terme: التصرّف المالي المستقلّ
      definition: >
        قاعدة يمسك بموجبها نظامٌ يتصرّف فيه الصندوق الوطني للضمان الاجتماعي
        مداخيلَه ومصاريفه واحتياطاته على حدة، «في إطار التنظيم المالي العام»
        للصندوق. وقد وُضعت لجرايات القطاع غير الفلاحي (الأمر عدد 499 لسنة 1974،
        الفصل 7)، ثم للأنظمة الفلاحية (القانون عدد 6 لسنة 1981، الفصل 6) وللنظام
        الفلاحي المحسّن (القانون عدد 73 لسنة 1989).
      synonymes: []

  - id: controleur-d-etat
    acronyme: null
    statut: provisoire
    references: [decret2005-321]
    source_definition: {ref: decret2000-1902, locator: "art. 18"}
    voir_aussi: [contrat-programme, epna]
    fr:
      terme: Contrôleur d'État
      definition: >
        Agent placé auprès d'une caisse de sécurité sociale pour le compte de
        l'État (décret n° 2000-1902, art. 18, pour la CNSS ; décret
        n° 2005-321, pour la CNAM). La loi n° 60-30 prévoyait, auprès de la CNSS, un
        contrôleur technique et un contrôleur financier (art. 29-33), et le
        décret n° 76-3 un contrôleur financier auprès de la CNRPS.
      synonymes: []
    ar:
      terme: مراقب الدولة
      definition: >
        عون يوضع لدى صندوق للضمان الاجتماعي لحساب الدولة (الأمر عدد 1902 لسنة
        2000، الفصل 18، بالنسبة إلى الصندوق الوطني للضمان الاجتماعي؛ الأمر عدد
        321 لسنة 2005، بالنسبة إلى الصندوق الوطني للتأمين على المرض). وكان القانون عدد 30 لسنة 1960 ينصّ لدى الصندوق
        الوطني للضمان الاجتماعي على مراقب فنّي ومراقب مالي (الفصول 29 إلى 33)،
        والأمر عدد 3 لسنة 1976 على مراقب مالي لدى الصندوق الوطني للتقاعد والحيطة
        الاجتماعية.
      synonymes: []

  - id: contrat-programme
    acronyme: null
    statut: provisoire
    references: [decret2005-321]
    source_definition: {ref: decret2000-1902, locator: "art. 3 et 12"}
    voir_aussi: [controleur-d-etat, epna, entreprises-publiques]
    fr:
      terme: Contrat-programme
      definition: >
        Engagement pluriannuel arrêté par le conseil d'administration d'une
        caisse de sécurité sociale et approuvé par le ministère de tutelle
        (décret n° 2000-1902, art. 3 et 12, pour la CNSS ; décret n° 2005-321,
        pour la CNAM), instrument de la tutelle des entreprises publiques.
      synonymes: []
    ar:
      terme: عقد البرنامج
      definition: >
        التزام متعدّد السنوات يضبطه مجلس إدارة صندوق للضمان الاجتماعي وتصادق
        عليه وزارة الإشراف (الأمر عدد 1902 لسنة 2000، الفصلان 3 و12، بالنسبة إلى
        الصندوق الوطني للضمان الاجتماعي؛ الأمر عدد 321 لسنة 2005، بالنسبة إلى
        الصندوق الوطني للتأمين على المرض)، وهو أداة من أدوات الإشراف على المنشآت
        العمومية.
      synonymes: []

  - id: compte-diversification-securite-sociale
    acronyme: null
    statut: valide
    references: [lf-2018]
    source_definition: {ref: dl2021-21-lf2022, locator: "art. 12"}
    source_traduction: {ref: dl2021-21-lf2022, locator: "art. 12"}
    voir_aussi: [css, cnss, cnrps, cnam]
    fr:
      terme: Compte de diversification des sources de sécurité sociale
      definition: >
        Compte spécial du Trésor ouvert par l'article 12 du décret-loi
        n° 2021-21 (loi de finances pour 2022) pour financer les caisses de
        sécurité sociale. Il est alimenté par le produit de la contribution
        sociale de solidarité, d'autres recettes pouvant lui être affectées ;
        le ministre chargé de la sécurité sociale en est l'ordonnateur, et ses
        recettes sont réparties entre les caisses selon des critères fixés par
        son arrêté.
      synonymes: []
    ar:
      terme: حساب تنويع مصادر الضمان الاجتماعي
      definition: >
        حساب خاص في الخزينة فتحه الفصل 12 من المرسوم عدد 21 لسنة 2021 (قانون
        المالية لسنة 2022) لتمويل صناديق الضمان الاجتماعي. تتأتّى موارده من
        عائدات المساهمة الاجتماعية التضامنية، ويمكن أن تُخصَّص له موارد أخرى؛
        ويتولّى الوزير المكلّف بالضمان الاجتماعي الأمر بصرف نفقاته، وتُوزَّع
        موارده على الصناديق حسب معايير تُضبط بقرار منه.
      synonymes: []

  - id: tfp
    acronyme: TFP
    statut: valide
    references: [decret-1956-01-12-formation-professionnelle, decret66-527]
    source_definition: {ref: loi-88-145-lf-1989, locator: "art. 29-30"}
    source_traduction: {ref: loi-88-145-lf-1989, locator: "art. 29-30"}
    voir_aussi: [foprolos, avance-tfp]
    fr:
      terme: Taxe de formation professionnelle
      definition: >
        Prélèvement à la charge de l'employeur, institué en 1956, assis
        depuis 1989 sur les salaires et rétributions versés, au taux de 1 %
        dans les industries manufacturières et de 2 % dans les autres
        secteurs. Son produit alimente depuis 2000 un fonds spécial du Trésor
        consacré à la formation professionnelle.
      synonymes: []
    ar:
      terme: الأداء على التكوين المهني
      definition: >
        أداء محمول على المؤجّر، أُحدث سنة 1956، ويُوظَّف منذ سنة 1989 على
        الأجور والمرتّبات المدفوعة بنسبة 1 % في الصناعات المعملية و2 % في
        القطاعات الأخرى. يموّل محصوله منذ سنة 2000 صندوقًا خاصًّا في الخزينة
        مخصَّصًا للتكوين المهني.
      synonymes: []

  - id: foprolos
    acronyme: FOPROLOS
    statut: valide
    references: [loi77-54]
    source_definition: {ref: loi77-54, locator: "art. 1-2"}
    source_traduction: {ref: loi-88-145-lf-1989, locator: "art. 35"}
    voir_aussi: [tfp, fonds-foprolos]
    fr:
      terme: Contribution au fonds de promotion du logement pour les salariés
      definition: >
        Prélèvement dû par tout employeur, public ou privé, à l'exception des
        exploitants agricoles privés, institué en 1977 au taux de 2 % des
        salaires soumis à cotisation sociale, ramené en 1989 à 1 % des
        salaires et rétributions. Il alimente un fonds qui finance l'accès
        des salariés au logement.
      synonymes: [Contribution au FOPROLOS]
    ar:
      terme: المساهمة الراجعة لصندوق النهوض بالمسكن لفائدة الأجراء
      definition: >
        اقتطاع محمول على كلّ مؤجّر عمومي أو خاصّ، باستثناء المستغلّين
        الفلاحيين الخواصّ، أُحدث سنة 1977 بنسبة 2 % من الأجور الخاضعة
        للمساهمات الاجتماعية، ثمّ خُفّض سنة 1989 إلى 1 % من الأجور
        والمرتّبات. يموّل صندوقًا يساعد الأجراء على الحصول على مسكن.
      synonymes: []

  # --- Logement social (livre prestations_sociales, chapitre _logement_social.qmd) ---
  # Passe 1 (termes, sources) et passe 2 (définitions) du terminologue, 23/10/2026.

  - id: fonds-foprolos
    acronyme: null
    statut: valide  # AR lu dans la LF 2026, art. 21 (rubrique, éd. AR), la loi n° 2026-1 et le décret n° 2026-123 (éd. AR)
    references: [loi77-60-lfc1977, lf-2026, decret2026-123]
    source_definition: {ref: loi77-54, locator: "art. 5-6"}
    source_traduction: {ref: lf-2026, locator: "art. 21"}
    voir_aussi: [foprolos, fonds-special-tresor, premier-logement, logement-social]
    fr:
      terme: Fonds de promotion du logement pour les salariés
      definition: >
        Fonds créé par la loi n° 77-54 du 3 août 1977, distinct de la
        contribution des employeurs qui l'alimente ; la loi de finances
        complémentaire du même jour en fait un fonds spécial du Trésor. Il est
        destiné à venir en aide aux salariés qui veulent accéder à la propriété
        d'un logement, par des prêts et, depuis 2016, des dons. Depuis le
        1er janvier 2026, il contribue aussi au financement de la construction
        de logements et de l'aménagement de lots sociaux par la SNIT et ses
        filiales, la SPROLS et l'AFH. Ses ressources sont la contribution,
        l'amortissement et les intérêts de ses prêts.
      synonymes: [Fonds FOPROLOS]
    ar:
      terme: صندوق النهوض بالمسكن لفائدة الأجراء
      definition: >
        صندوق أُحدث بالقانون عدد 54 لسنة 1977 المؤرّخ في 3 أوت 1977، وهو متميّز
        عن مساهمة المؤجّرين التي تموّله، وجعله قانون المالية التكميلي الصادر في
        اليوم نفسه صندوقًا خاصًّا للخزينة. يهدف إلى مساعدة الأجراء الراغبين في
        تملّك مسكن، بواسطة قروض، ومنذ 2016 بواسطة هبات أيضًا. ومنذ غرّة جانفي
        2026، يساهم كذلك في تمويل بناء المساكن وتهيئة المقاسم الاجتماعية التي
        تنجزها الشركة الوطنية العقارية للبلاد التونسية وفروعها وشركة النهوض
        بالمساكن الاجتماعية والوكالة العقارية للسكنى. تتكوّن موارده من المساهمة
        ومن استرجاع أصل قروضه وفوائضها.
      synonymes: []

  - id: snit
    acronyme: SNIT
    statut: valide  # AR lu dans la loi n° 2026-1 (éd. AR)
    references: [loi2026-1]
    source_definition: {ref: loi57-19, locator: "statut, art. 1er-3"}
    source_traduction: {ref: loi2026-1}
    voir_aussi: [sprols, afh, fonds-foprolos]
    fr:
      terme: Société nationale immobilière de Tunisie
      definition: >
        Entreprise à caractère commercial régie par le droit des sociétés
        anonymes, dont le capital est apporté par l'État et dont les statuts
        sont en vigueur depuis le 1er septembre 1957. Elle réalise des
        opérations immobilières pour son compte, celui de l'État ou des
        collectivités, gère des immeubles et conduit des programmes de
        construction. Depuis le 14 février 2026, elle et ses filiales peuvent
        vendre les logements sociaux financés par le fonds de promotion du
        logement pour les salariés par paiement échelonné ou en location-vente.
      synonymes: []
    ar:
      terme: الشركة الوطنية العقارية للبلاد التونسية
      definition: >
        مؤسسة ذات صبغة تجارية تخضع لأحكام شركات المساهمة، تساهم الدولة برأس
        مالها، ودخل نظامها الأساسي حيّز التنفيذ بداية من غرّة سبتمبر 1957. تنجز
        عمليات عقارية لحسابها أو لحساب الدولة أو الجماعات، وتتصرّف في عقارات،
        وتنجز برامج بناء. ومنذ 14 فيفري 2026، يمكنها هي وفروعها بيع المساكن
        الاجتماعية المموّلة من موارد صندوق النهوض بالمسكن لفائدة الأجراء
        بالتقسيط أو بمقتضى عقود الكراء المملّك.
      synonymes: []

  - id: sprols
    acronyme: SPROLS
    statut: valide  # AR lu dans le JORT AR n° 19/2026 (intitulé de la loi n° 2026-2)
    references: [loi2026-2, decret2010-3170]
    source_definition: {ref: loi77-53, locator: "art. 1er-4"}
    source_traduction: {ref: loi2026-2}
    voir_aussi: [snit, afh, fonds-foprolos, cnss, cavis]
    fr:
      terme: Société de promotion des logements sociaux
      definition: >
        Établissement public à caractère industriel et commercial créé par la
        loi n° 77-53 du 3 août 1977 pour « promouvoir la construction de
        logements au profit des assurés sociaux ». Elle réalise et gère les
        programmes immobiliers de la Caisse nationale de sécurité sociale et de
        la Caisse d'assurance vieillesse, invalidité et survivants, qui ont
        apporté son capital initial, et loue des logements aux assurés sociaux.
        Placée à l'origine sous la tutelle des Affaires sociales, elle relève
        de l'Équipement depuis 2010. Depuis le 14 février 2026, elle peut
        vendre les logements sociaux financés par le fonds de promotion du
        logement pour les salariés par paiement échelonné ou en location-vente.
      synonymes: []
    ar:
      terme: شركة النهوض بالمساكن الاجتماعية
      definition: >
        مؤسسة عمومية ذات صبغة صناعية وتجارية أُحدثت بالقانون عدد 53 لسنة 1977
        المؤرّخ في 3 أوت 1977 للنهوض ببناء المساكن لفائدة المضمونين
        الاجتماعيين. تنجز البرامج العقارية للصندوق الوطني للضمان الاجتماعي
        ولصندوق تأمين الشيخوخة والعجز والباقين بقيد الحياة بعد وفاة المنتفع
        بجراية وتتصرّف فيها، وقد ساهم الصندوقان في رأس مالها الأصلي، وتؤجّر
        مساكن للمضمونين الاجتماعيين. كانت في الأصل تحت إشراف وزارة الشؤون
        الاجتماعية، وأصبحت منذ 2010 تحت إشراف وزارة التجهيز. ومنذ 14 فيفري 2026،
        يمكنها بيع المساكن الاجتماعية المموّلة من موارد صندوق النهوض بالمسكن
        لفائدة الأجراء بالتقسيط أو بمقتضى عقود الكراء المملّك.
      synonymes: []

  - id: afh
    acronyme: AFH
    statut: provisoire  # statut et missions (décrets n° 74-33 et 2021-327, non versés) non lus : la définition se borne aux rôles que donnent la LFC 2012 et la LF 2026 ; AR relevé dans les intitulés AR du JORT, sans clé pour l'éd. AR
    references: [lfc-2012, decret2026-123]
    source_definition: {ref: lf-2026, locator: "art. 21"}
    voir_aussi: [snit, sprols, fonds-foprolos]
    fr:
      terme: Agence foncière d'habitation
      definition: >
        Organisme public du logement qui compte parmi les réalisateurs du
        programme spécifique pour le logement social créé en 2012. Depuis le
        1er janvier 2026, le fonds de promotion du logement pour les salariés
        contribue au financement des logements et des lots sociaux qu'elle
        réalise, jusqu'à la totalité du coût et sans intérêt depuis le
        20 juin 2026.
      synonymes: []
    ar:
      terme: الوكالة العقارية للسكنى
      definition: >
        هيكل عمومي في مجال السكن، من بين الهياكل المكلّفة بإنجاز البرنامج
        الخصوصي للسكن الاجتماعي المحدث سنة 2012. ومنذ غرّة جانفي 2026، يساهم
        صندوق النهوض بالمسكن لفائدة الأجراء في تمويل المساكن والمقاسم
        الاجتماعية التي تنجزها، بنسبة قد تبلغ كامل الكلفة ودون فائدة منذ
        20 جوان 2026.
      synonymes: []

  - id: fnah
    acronyme: FNAH
    statut: valide  # AR repris de la LF 2019, art. 72 (éd. AR), comme contribution-fnah
    references: [decret86-438, lfc-2012, lf-2025]
    source_definition: {ref: loi2004-77, locator: "art. 1er-4"}
    source_traduction: {ref: loi2018-56-lf2019, locator: "art. 72"}
    voir_aussi: [contribution-fnah, logement-rudimentaire, fonds-special-tresor]
    fr:
      terme: Fonds national d'amélioration de l'habitat
      definition: >
        Fonds qui finance, par des prêts et des subventions, l'éradication des
        logements rudimentaires dans le cadre d'un programme national,
        l'entretien et la réhabilitation des logements par les propriétaires
        privés et, depuis 2012, par les occupants privés, des opérations des
        collectivités locales, la réhabilitation et la rénovation urbaine
        confiées à des organismes, et la réparation des logements après une
        catastrophe ; ces emplois sont fixés par la loi n° 2004-77 du
        2 août 2004. Sa gestion est confiée par convention à une banque. Fonds
        spécial du Trésor, il est alimenté depuis 2005 par une contribution
        adossée à la taxe sur les immeubles bâtis.
      synonymes: []
    ar:
      terme: الصندوق الوطني لتحسين السكن
      definition: >
        صندوق يموّل، بواسطة قروض ومنح، إزالة المساكن البدائية في إطار برنامج
        وطني، وصيانة المساكن وتعهّدها من قبل المالكين الخواص، ومنذ 2012 من قبل
        الشاغلين الخواص أيضًا، وعمليات الجماعات المحلية، وإعادة التأهيل
        والتجديد العمراني الموكولين إلى هياكل، وإصلاح المساكن إثر الكوارث؛
        وقد ضبط هذه التدخّلات القانون عدد 77 لسنة 2004 المؤرّخ في 2 أوت 2004.
        يُعهد بالتصرّف فيه بمقتضى اتفاقية إلى بنك. وهو صندوق خاص للخزينة، يموَّل
        منذ 2005 بمساهمة مرتبطة بالمعلوم على العقارات المبنية.
      synonymes: []

  - id: logement-rudimentaire
    acronyme: null
    statut: provisoire  # AR : المساكن البدائية non retrouvé dans une édition AR du JORT (décrets n° 86-438 et 2012-1224 non lus en AR)
    references: [decret86-438, loi2004-77]
    source_definition: {ref: decret2012-1224, locator: "art. 7"}
    voir_aussi: [fnah, programme-specifique-logement-social]
    fr:
      terme: Logement rudimentaire
      definition: >
        Habitation insalubre occupée en permanence. Le décret n° 86-438 du
        12 avril 1986 range parmi les logements rudimentaires « les gourbis,
        les kibs, les maamras, les baraques et les tentes » ; le décret
        n° 2012-1224 du 10 août 2012 retient les locaux habités en permanence
        dont les matériaux, la surface ou la solidité « ne répondent pas aux
        normes sanitaires et techniques minimales d'habitabilité ». Leur
        remplacement est l'objet du programme national de 1986, d'un emploi du
        Fonds national d'amélioration de l'habitat et du programme spécifique
        pour le logement social.
      synonymes: []
    ar:
      terme: المساكن البدائية
      definition: >
        مسكن غير صحّي مأهول بصفة دائمة. يعدّ الأمر عدد 438 لسنة 1986 المؤرّخ في
        12 أفريل 1986 من المساكن البدائية الأكواخ و«الكيب» و«المعمرات»
        والبراريك والخيام؛ ويعتمد الأمر عدد 1224 لسنة 2012 المؤرّخ في 10 أوت
        2012 المحلاّت المأهولة بصفة دائمة التي لا تستجيب موادّها أو مساحتها أو
        متانتها للمواصفات الصحية والفنية الدنيا للسكن. وتعويضها هو موضوع
        البرنامج الوطني لسنة 1986، وأحد تدخّلات الصندوق الوطني لتحسين السكن،
        والبرنامج الخصوصي للسكن الاجتماعي.
      synonymes: []

  - id: logement-social
    acronyme: null
    statut: provisoire  # AR relevé dans les intitulés AR du JORT, à confirmer sur l'éd. AR du décret n° 2012-1224 ; plafonds de 2012, décrets modificatifs n° 2013-3289, 2014-4251, 2015-460, 2023-538 non lus
    references: [lfc-2012, loi2026-1]
    source_definition: {ref: decret2012-1224, locator: "art. 20"}
    voir_aussi: [programme-specifique-logement-social, fonds-foprolos, premier-logement]
    fr:
      terme: Logement social
      definition: >
        Logement destiné aux ménages à faible revenu et produit ou financé
        avec une aide publique. Dans le programme spécifique pour le logement
        social, le décret n° 2012-1224 du 10 août 2012 le définit comme un
        logement individuel extensible d'un prix de 45 000 D au plus, ou un
        logement collectif de 65 000 D au plus. Depuis 2026, la SNIT, ses
        filiales et la SPROLS peuvent vendre en location-vente ou à
        tempérament les logements sociaux financés par le fonds de promotion
        du logement pour les salariés.
      synonymes: []
    ar:
      terme: السكن الاجتماعي
      definition: >
        مسكن موجّه إلى الأسر ذات الدخل الضعيف، يُنجز أو يُموَّل بدعم عمومي. وفي
        إطار البرنامج الخصوصي للسكن الاجتماعي، يعرّفه الأمر عدد 1224 لسنة 2012
        المؤرّخ في 10 أوت 2012 بأنه مسكن فردي قابل للتوسعة لا يتجاوز ثمنه
        45 ألف دينار، أو مسكن جماعي لا يتجاوز ثمنه 65 ألف دينار. ومنذ 2026،
        يمكن للشركة الوطنية العقارية للبلاد التونسية وفروعها ولشركة النهوض
        بالمساكن الاجتماعية بيع المساكن الاجتماعية المموّلة من صندوق النهوض
        بالمسكن لفائدة الأجراء بالكراء المملّك أو بالتقسيط.
      synonymes: []

  - id: programme-specifique-logement-social
    acronyme: null
    statut: provisoire  # AR relevé dans 14 intitulés AR du JORT, à confirmer sur l'éd. AR de la LFC 2012 ; décrets modificatifs du décret n° 2012-1224 non lus
    references: [decret2012-1224, lf-2022]
    source_definition: {ref: lfc-2012, locator: "art. 27-32"}
    voir_aussi: [logement-social, logement-rudimentaire, afh, sprols]
    fr:
      terme: Programme spécifique pour le logement social
      definition: >
        Programme créé par la loi de finances complémentaire pour 2012 « au
        profit des catégories sociales à faible revenu », pour remplacer les
        logements rudimentaires et réaliser des projets d'habitation. Il est
        financé par le budget de l'État, le recouvrement des prêts et des dons,
        et réalisé par les conseils régionaux, les sociétés immobilières
        publiques, la SPROLS, l'Agence de réhabilitation et de rénovation
        urbaine, l'AFH et des promoteurs privés. Dans la rédaction du décret
        d'août 2012, il s'adresse aux familles sans logement dont le revenu ne
        dépasse pas 3 SMIG, en trois catégories, par une prise en charge de la
        moitié du coût de remplacement d'un logement rudimentaire ou une
        subvention à l'achat d'un logement social.
      synonymes: []
    ar:
      terme: البرنامج الخصوصي للسكن الاجتماعي
      definition: >
        برنامج أحدثه قانون المالية التكميلي لسنة 2012 لفائدة الفئات الاجتماعية
        محدودة الدخل، لتعويض المساكن البدائية وإنجاز مشاريع سكنية. يموَّل من
        ميزانية الدولة ومن استخلاص القروض ومن الهبات، وتنجزه المجالس الجهوية
        والشركات العقارية العمومية وشركة النهوض بالمساكن الاجتماعية ووكالة
        التهذيب والتجديد العمراني والوكالة العقارية للسكنى وباعثون عقاريون
        خواص. وفي صيغة الأمر الصادر في أوت 2012، يتوجّه إلى العائلات التي لا
        تملك مسكنًا ولا يتجاوز دخلها ثلاث مرّات الأجر الأدنى المضمون لمختلف
        المهن، في ثلاثة أصناف، بتحمّل نصف كلفة تعويض المسكن البدائي أو بمنحة
        لاقتناء مسكن اجتماعي.
      synonymes: []

  - id: premier-logement
    acronyme: null
    statut: valide  # AR lu dans la LF 2025, art. 25 (éd. AR : « مسكن أول ») ; modificatifs n° 2017-391 et 2019-39 du décret n° 2017-161 non lus ; « promoteur agréé » rendu par باعث عقاري مصادق عليه, forme AR non attestée (voir promoteur-agree)
    references: [lf-2017, lf-2025, decret2023-127]
    source_definition: {ref: decret2017-161, locator: "art. 3, 5-6"}
    source_traduction: {ref: lf-2025, locator: "art. 25"}
    voir_aussi: [logement-social, fonds-foprolos, promoteur-agree]
    fr:
      terme: Premier logement
      definition: >
        Logement qu'un ménage sans logement acquiert pour son habitation
        principale, et nom du programme créé par la loi de finances pour 2017
        au profit des catégories à revenu moyen. Dans la rédaction du décret
        n° 2017-161 du 31 janvier 2017, le logement est neuf, compte au moins
        deux chambres et un salon, est réalisé par un promoteur agréé et coûte
        200 000 D au plus ; le programme prête aux familles dont le revenu est
        compris entre 4,5 et 10 SMIG une partie de l'autofinancement, à un taux
        bonifié. Depuis 2025, le programme couvre aussi la construction d'un
        premier logement. Depuis 2023, les prêts du fonds de promotion du
        logement pour les salariés financent eux aussi un premier logement.
      synonymes: []
    ar:
      terme: المسكن الأول
      definition: >
        مسكن تقتنيه أسرة لا تملك مسكنًا لسكناها الرئيسية، واسم البرنامج الذي
        أحدثه قانون المالية لسنة 2017 لفائدة الفئات ذات الدخل المتوسّط. وفي صيغة
        الأمر الحكومي عدد 161 لسنة 2017 المؤرّخ في 31 جانفي 2017، يكون المسكن
        جديدًا، يتضمّن غرفتين وقاعة جلوس على الأقل، ينجزه باعث عقاري مصادق عليه، ولا يتجاوز
        ثمنه 200 ألف دينار؛ ويقرض البرنامج العائلات التي يتراوح دخلها بين 4,5
        و10 مرّات الأجر الأدنى المضمون لمختلف المهن جزءًا من التمويل الذاتي بنسبة
        فائدة ميسّرة. ومنذ 2025، يشمل البرنامج أيضًا بناء مسكن أول. ومنذ 2023،
        تموّل قروض صندوق النهوض بالمسكن لفائدة الأجراء هي أيضًا مسكنًا أول.
      synonymes: []

  - id: location-vente
    acronyme: null
    statut: provisoire  # AR lu dans le décret n° 2026-123, art. 9 bis (éd. AR) ; aucun texte versé ne définit le contrat lui-même : la définition s'en tient à l'usage qu'en font les lois n° 2026-1 et 2026-2 et le décret n° 2026-123
    references: [loi2026-1, loi2026-2]
    source_definition: {ref: decret2026-123, locator: "art. 9 bis"}
    source_traduction: {ref: decret2026-123, locator: "art. 9 bis"}
    voir_aussi: [vente-a-temperament, snit, sprols]
    fr:
      terme: Location-vente
      definition: >
        Mode de cession d'un logement par contrat de location-vente. Depuis le
        14 février 2026, la SNIT et ses filiales et la SPROLS peuvent céder
        ainsi les logements sociaux financés par le fonds de promotion du
        logement pour les salariés ; depuis le 20 juin 2026, le prix plafond
        au mètre carré des logements de promoteur ne s'applique pas à ces
        cessions, et les loyers sont fixés selon le coût de chaque projet par
        convention entre l'opérateur et le ministère chargé de l'habitat.
      synonymes: []
    ar:
      terme: الكراء المملّك
      definition: >
        طريقة لإحالة مسكن بمقتضى عقد كراء مملّك. ومنذ 14 فيفري 2026، يمكن
        للشركة الوطنية العقارية للبلاد التونسية وفروعها ولشركة النهوض بالمساكن
        الاجتماعية إحالة المساكن الاجتماعية المموّلة من موارد صندوق النهوض
        بالمسكن لفائدة الأجراء على هذا النحو؛ ومنذ 20 جوان 2026، لا ينطبق السعر
        الأقصى للمتر المربع لمساكن الباعثين على هذه الإحالات، وتُضبط معينات
        الكراء حسب كلفة كل مشروع بمقتضى اتفاقية بين الباعث العمومي والوزارة
        المكلّفة بالإسكان.
      synonymes: []

  - id: vente-a-temperament
    acronyme: null
    statut: provisoire  # AR « البيع بالتقسيط » cité par la note documentaire (§ 1.3) et le registre comme texte de l'art. 9 bis du décret n° 2026-123 (éd. AR) ; aucun texte versé ne définit le contrat lui-même
    references: [loi2026-1, loi2026-2]
    source_definition: {ref: loi2026-1}
    source_traduction: {ref: decret2026-123, locator: "art. 9 bis"}
    voir_aussi: [location-vente, snit, sprols]
    fr:
      terme: Vente à tempérament
      definition: >
        Vente dont le prix est payé par versements échelonnés ; les lois
        n° 2026-1 et 2026-2 du 13 février 2026 parlent de vente « par paiement
        échelonné ». Depuis le 14 février 2026, la SNIT et ses filiales et la
        SPROLS peuvent vendre ainsi les logements sociaux financés par le fonds
        de promotion du logement pour les salariés ; depuis le 20 juin 2026, le
        prix plafond au mètre carré des logements de promoteur ne s'applique
        pas à ces ventes, et les mensualités sont fixées selon le coût de
        chaque projet par convention entre l'opérateur et le ministère chargé
        de l'habitat.
      synonymes: [Paiement échelonné]
    ar:
      terme: البيع بالتقسيط
      definition: >
        بيع يُدفع ثمنه على أقساط. ومنذ 14 فيفري 2026، يمكن للشركة الوطنية
        العقارية للبلاد التونسية وفروعها ولشركة النهوض بالمساكن الاجتماعية بيع
        المساكن الاجتماعية المموّلة من موارد صندوق النهوض بالمسكن لفائدة الأجراء
        على هذا النحو؛ ومنذ 20 جوان 2026، لا ينطبق السعر الأقصى للمتر المربع
        لمساكن الباعثين على هذه البيوعات، وتُضبط الأقساط الشهرية حسب كلفة كل
        مشروع بمقتضى اتفاقية بين الباعث العمومي والوزارة المكلّفة بالإسكان.
      synonymes: []

  - id: epargne-logement
    acronyme: null
    statut: provisoire  # loi n° 73-24 non versée ni lue ; AR relevé dans un fascicule AR de 2001 (Ja0822001), à vérifier sur la loi n° 73-24
    references: [decret77-965]
    source_definition: {ref: decret77-964, locator: "art. 1er et 3"}
    voir_aussi: [fonds-foprolos]
    fr:
      terme: Épargne-logement
      definition: >
        Régime institué par la loi n° 73-24 du 7 mai 1973, qui exige de
        l'acquéreur d'un logement une épargne préalable. Le décret n° 77-964
        du 24 novembre 1977 le modifie et prévoit des prêts « pour parfaire
        l'épargne exigée » ; le décret n° 77-965 du même jour ouvre aux
        salariés gagnant de 1,5 à 3 SMIG un prêt du fonds de promotion du
        logement pour les salariés qui complète cette épargne.
      synonymes: []
    ar:
      terme: الادخار السكني
      definition: >
        نظام أُحدث بالقانون عدد 24 لسنة 1973 المؤرّخ في 7 ماي 1973، يشترط على
        مقتني المسكن ادّخارًا مسبقًا. نقّحه الأمر عدد 964 لسنة 1977 المؤرّخ في
        24 نوفمبر 1977 وأقرّ قروضًا لاستكمال الادخار المطلوب؛ وفتح الأمر عدد 965
        لسنة 1977 الصادر في اليوم نفسه للأجراء الذين يتراوح أجرهم بين 1,5 و3
        مرّات الأجر الأدنى المضمون لمختلف المهن قرضًا من صندوق النهوض بالمسكن
        لفائدة الأجراء يكمّل هذا الادخار.
      synonymes: []

  - id: promoteur-agree
    acronyme: null
    statut: provisoire  # AR non attesté (الباعث العقاري المصادق عليه proposé ; à relever sur l'éd. AR des décrets n° 2016-1126 ou 2023-127) ; régime de l'agrément non versé ; le chapitre ancre encore #g-promoteur-immobilier (l. 64)
    references: [decret77-965, decret2016-1126, decret2023-127]
    source_definition: {ref: decret2017-161, locator: "art. 3"}
    voir_aussi: [promoteur-immobilier, premier-logement, fonds-foprolos]
    fr:
      terme: Promoteur immobilier agréé
      definition: >
        Promoteur immobilier titulaire de l'agrément de l'administration.
        Depuis 1977, le fonds de promotion du logement pour les salariés prête
        pour l'achat d'un logement neuf à un promoteur agréé ; depuis 2023, le
        terrain qu'il finance peut être acheté à un promoteur agréé « ou du
        privé ». Le logement du programme du premier logement est réalisé par
        un promoteur agréé.
      synonymes: [Promoteur agréé]
    ar:
      terme: الباعث العقاري المصادق عليه
      definition: >
        باعث عقاري متحصّل على مصادقة الإدارة. ومنذ 1977، يقرض صندوق النهوض
        بالمسكن لفائدة الأجراء لاقتناء مسكن جديد من باعث عقاري مصادق عليه؛ ومنذ
        2023، يمكن اقتناء الأرض التي يموّلها من باعث عقاري مصادق عليه أو من
        الخواص. وينجز المسكنَ في برنامج المسكن الأول باعثٌ عقاري مصادق عليه.
      synonymes: []

  # Notions économiques (docs/notes/eco-logement-social.md, § 7) : termes AR proposés, non attestés.

  - id: elasticite-offre-logement
    acronyme: null
    statut: provisoire  # notion analytique ; AR proposé, non attesté
    references: []
    source_definition: {ref: glaeser-gyourko-2018-housing-supply, locator: "p. 13"}
    voir_aussi: [eviction-logement, incidence-fiscale, aide-a-la-personne]
    fr:
      terme: Élasticité de l'offre de logement
      definition: >
        Variation en pourcentage de la quantité de logements offerts quand
        leur prix augmente de 1 %. Selon Glaeser et Gyourko (2018), l'offre est
        rigide là où le foncier est rare et les règles d'urbanisme strictes :
        le prix s'y écarte du coût de construction, et une aide à la demande se
        reporte dans les prix plutôt que d'accroître le parc.
      synonymes: []
    ar:
      terme: مرونة عرض المساكن
      definition: >
        التغيّر بالنسبة المائوية في كمية المساكن المعروضة عند ارتفاع ثمنها بنسبة
        1 %. وحسب غليزر وغيوركو (2018)، يكون العرض جامدًا حيث تندر الأراضي وتشتدّ
        قواعد التعمير: يبتعد الثمن عندئذ عن كلفة البناء، وينعكس الدعم الموجّه إلى
        الطلب على الأسعار بدل أن يزيد في عدد المساكن.
      synonymes: []

  - id: eviction-logement
    acronyme: null
    statut: provisoire  # notion analytique ; AR proposé, non attesté
    references: []
    source_definition: {ref: sinai-waldfogel-2005-crowd-out}
    voir_aussi: [elasticite-offre-logement, aide-a-la-pierre]
    fr:
      terme: Éviction de la construction privée
      definition: >
        Remplacement, par un logement aidé ou produit par la puissance
        publique, d'un logement que le marché aurait produit ; seule la part
        des logements aidés qui ne remplace pas une production privée accroît
        le parc. Sinai et Waldfogel (2005) estiment qu'aux États-Unis trois
        logements aidés en remplacent en moyenne deux, et que l'éviction est
        plus faible là où la demande non satisfaite est forte.
      synonymes: [Effet d'éviction]
    ar:
      terme: مزاحمة البناء الخاص
      definition: >
        تعويض مسكن كانت السوق ستنتجه بمسكن مدعوم أو تنتجه السلطة العمومية؛ ولا
        يزيد في عدد المساكن إلا الجزء من المساكن المدعومة الذي لا يعوّض إنتاجًا
        خاصًّا. ويقدّر سيناي ووالدفوغل (2005) أن ثلاثة مساكن مدعومة تعوّض في
        المعدّل مسكنين في الولايات المتحدة، وأن المزاحمة تكون أضعف حيث يكون الطلب
        غير الملبّى قويًّا.
      synonymes: []

  - id: aide-a-la-pierre
    acronyme: null
    statut: provisoire  # notion analytique ; AR proposé, non attesté
    references: []
    source_definition: {ref: fack-2005-aides-logement}
    voir_aussi: [aide-a-la-personne, eviction-logement]
    fr:
      terme: Aide à la pierre
      definition: >
        Aide publique attachée au logement plutôt qu'au ménage : subvention,
        prêt à taux réduit ou financement accordé pour construire, acheter ou
        réhabiliter des logements, ou logement produit par un organisme public.
        Elle s'oppose à l'aide à la personne.
      synonymes: [Aide à l'offre]
    ar:
      terme: الدعم الموجّه إلى البناء
      definition: >
        دعم عمومي مرتبط بالمسكن لا بالأسرة: منحة أو قرض بنسبة فائدة منخفضة أو
        تمويل يُسند لبناء مساكن أو اقتنائها أو تهذيبها، أو مسكن ينتجه هيكل
        عمومي. ويقابله الدعم الموجّه إلى الأسر.
      synonymes: []

  - id: aide-a-la-personne
    acronyme: null
    statut: provisoire  # notion analytique ; AR proposé, non attesté
    references: []
    source_definition: {ref: fack-2005-aides-logement, locator: "p. 17"}
    voir_aussi: [aide-a-la-pierre, incidence-fiscale, elasticite-offre-logement]
    fr:
      terme: Aide à la personne
      definition: >
        Aide publique au logement versée au ménage, selon ses ressources, pour
        alléger son loyer ou ses charges de logement, et qui le suit quel que
        soit le logement occupé. Elle s'oppose à l'aide à la pierre. Fack
        (2005) estime qu'en France, de 1973 à 2002, 50 à 80 % des aides à la
        personne perçues par les locataires à bas revenus sont absorbés par la
        hausse de leurs loyers.
      synonymes: [Aide à la demande]
    ar:
      terme: الدعم الموجّه إلى الأسر
      definition: >
        دعم عمومي للسكن يُسند إلى الأسرة حسب مواردها لتخفيف معين كرائها أو
        أعباء سكنها، ويتبعها أيًّا كان المسكن الذي تشغله. ويقابله الدعم الموجّه
        إلى البناء. ويقدّر فاك (2005) أن ما بين 50 و80 % من هذا الدعم الذي
        يتقاضاه المتسوّغون ذوو الدخل الضعيف في فرنسا، من 1973 إلى 2002، قد
        استوعبه ارتفاع معينات كرائهم.
      synonymes: []

  - id: element-de-subvention
    acronyme: null
    statut: provisoire  # notion analytique ; AR proposé (usage des institutions financières internationales), non attesté au JORT ; définition générique : ONU-Habitat (p. 63) emploie la notion sans la définir
    references: [zaafrane-2014-habitat]
    source_definition: {ref: onu-habitat-2011-tunisia-housing-profile, locator: "p. 63"}
    voir_aussi: [premier-logement, fonds-foprolos]
    fr:
      terme: Élément de subvention d'un prêt bonifié
      definition: >
        Part d'un prêt à taux réduit qui équivaut à un don : différence entre
        le montant prêté et la valeur actualisée, au taux du marché, des
        remboursements dus au taux bonifié. ONU-Habitat (2011) juge celui des
        prêts au logement tunisiens « difficult to calculate ».
      synonymes: []
    ar:
      terme: عنصر المنحة في القرض الميسّر
      definition: >
        جزء من القرض بنسبة فائدة منخفضة يعادل هبة: الفرق بين المبلغ المقرَض
        والقيمة الحالية، محسوبة بنسبة فائدة السوق، للأقساط المستحقّة بالنسبة
        الميسّرة. ويرى موئل الأمم المتحدة (2011) أن احتساب هذا العنصر في قروض
        السكن التونسية عسير.
      synonymes: []

  - id: avance-tfp
    acronyme: null
    statut: provisoire
    references: [decret2009-292]
    source_definition: {ref: loi2007-69, locator: "art. 27"}
    voir_aussi: [tfp]
    fr:
      terme: Avance sur la taxe de formation professionnelle
      definition: >
        Crédit d'impôt ouvert depuis 2009 aux entreprises qui forment leur
        personnel, imputable sur la taxe de formation professionnelle dans la
        limite de 60 % de la taxe due au titre de l'année précédente, lorsque
        celle-ci atteint au moins 1 000 dinars.
      synonymes: []
    ar:
      terme: التسبقة على الأداء على التكوين المهني
      definition: >
        قرض جبائي مفتوح منذ سنة 2009 للمؤسسات التي تكوّن أعوانها، يُطرح من
        الأداء على التكوين المهني في حدود 60 % من الأداء المستوجب بعنوان السنة
        السابقة، إذا بلغ هذا الأداء 1000 دينار على الأقلّ.
      synonymes: []

  # ── Volume « Les finances locales », chapitre « Les notions » (4 octobre 2026) ──
  # Définitions tirées de Dafflon et Gilbert (AFD, 2018). Termes arabes PROVISOIRES :
  # aucun texte bilingue ne met en regard ces notions doctrinales et leurs termes
  # arabes. Quand un terme figure dans la loi organique n° 2018-29 (code des
  # collectivités locales), édition arabe du JORT n° 39 du 15 mai 2018, l'article est
  # indiqué en commentaire : il atteste le terme arabe, non sa mise en regard avec la
  # notion française (édition française de ce JORT non identifiée).

  - id: decentralisation
    acronyme: null
    statut: provisoire  # AR : اللامركزية, CCL 2018 (AR), art. 1
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 17"}
    voir_aussi: [deconcentration, delegation-competences, devolution-competences]
    fr:
      terme: Décentralisation
      definition: >
        Transfert d'autorité et de responsabilités — compétences, tâches et
        fonctions — du gouvernement central vers des gouvernements et des
        autorités de niveau intermédiaire ou local, ou vers des organismes
        presque autonomes. Elle prend deux formes, la délégation et la
        dévolution ; la déconcentration, qui laisse les compétences au centre,
        n'en est pas une.
      synonymes: []
    ar:
      terme: اللامركزية
      definition: >
        نقل السلطة والمسؤوليات — من صلاحيات ومهامّ ووظائف — من الحكومة
        المركزية إلى حكومات وسلط من المستوى الوسيط أو المحلي، أو إلى هياكل شبه
        مستقلّة. وتتّخذ شكلين، التفويض والإسناد؛ أمّا عدم التركيز، الذي يُبقي
        الصلاحيات بيد المركز، فليس منها.
      synonymes: []

  - id: deconcentration
    acronyme: null
    statut: provisoire  # AR : اللامحورية (« الإدارات اللامحورية »), CCL 2018 (AR), chapitre des districts
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 17"}
    voir_aussi: [decentralisation]
    fr:
      terme: Déconcentration
      definition: >
        Organisation dans laquelle l'État central conserve ses responsabilités
        et ses compétences, mais les fait exécuter par des antennes régionales
        ou locales qui lui sont hiérarchiquement subordonnées, sans marge de
        manœuvre.
      synonymes: []
    ar:
      terme: اللامحورية
      definition: >
        تنظيم تحتفظ فيه الدولة المركزية بمسؤولياتها وصلاحياتها، وتعهد
        بتنفيذها إلى فروع جهوية أو محلية تخضع لها خضوعا تسلسليا، دون هامش
        تصرّف.
      synonymes: [عدم التركيز]

  - id: delegation-competences
    acronyme: null
    statut: provisoire  # AR non attesté dans un texte
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 17-18"}
    voir_aussi: [decentralisation, devolution-competences]
    fr:
      terme: Délégation de compétences
      definition: >
        Transfert de compétences aux collectivités assorti de normes ou de
        standards fixés par l'échelon central, que la collectivité doit
        respecter ; elle ne choisit que les modalités de mise en œuvre et
        supporte, en principe, le coût de ce qu'elle offre au-delà de la norme.
      synonymes: [Délégation]
    ar:
      terme: تفويض الصلاحيات
      definition: >
        نقل صلاحيات إلى الجماعات المحلية مع معايير أو مقاييس يضبطها المستوى
        المركزي وتلتزم الجماعة باحترامها؛ ولا تختار إلّا طرق التنفيذ، وتتحمّل
        مبدئيا كلفة ما تقدّمه زيادة على المعيار.
      synonymes: [التفويض]

  - id: devolution-competences
    acronyme: null
    statut: provisoire  # AR non attesté ; le CCL 2018 (AR), art. 14, dit « الصلاحيات الذاتية » (compétences propres)
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 17"}
    voir_aussi: [decentralisation, delegation-competences, ressources-propres]
    fr:
      terme: Dévolution de compétences
      definition: >
        Attribution aux collectivités de compétences propres, exercées avec les
        pleins pouvoirs et sans tutelle d'un échelon supérieur, ce qui suppose
        qu'elles disposent de ressources propres, notamment fiscales, à hauteur
        de ces compétences.
      synonymes: [Dévolution]
    ar:
      terme: إسناد الصلاحيات الذاتية
      definition: >
        إسناد صلاحيات ذاتية إلى الجماعات المحلية تمارسها بكامل السلطة ودون
        إشراف مستوى أعلى، وهو ما يفترض أن تتوفّر لها موارد ذاتية، ولا سيما
        جبائية، في حدود تلك الصلاحيات.
      synonymes: []

  - id: collectivite-locale
    acronyme: null
    statut: provisoire  # AR : الجماعة المحلية, CCL 2018 (AR), art. 2
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 16-18"}
    voir_aussi: [libre-administration, decentralisation]
    fr:
      terme: Collectivité locale
      definition: >
        Entité publique territoriale qui exerce, par des organes élus et sur un
        budget propre, une part des affaires publiques au profit de ses
        résidents.
      synonymes: [Collectivité territoriale]
    ar:
      terme: الجماعة المحلية
      definition: >
        ذات عمومية ترابية تمارس، بواسطة هياكل منتخبة وبميزانية خاصة بها،
        جانبا من الشؤون العمومية لفائدة متساكنيها.
      synonymes: []

  - id: libre-administration
    acronyme: null
    statut: provisoire  # AR : التدبير الحر, CCL 2018 (AR), art. 4
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 16 et 18"}
    voir_aussi: [collectivite-locale, tutelle]
    fr:
      terme: Libre administration
      definition: >
        Droit et capacité effective, pour les collectivités, de régler et de
        gérer une part importante des affaires publiques au profit de leurs
        résidents, par des conseils élus au suffrage direct et universel ; il
        limite la tutelle de l'État central.
      synonymes: []
    ar:
      terme: التدبير الحر
      definition: >
        حقّ الجماعات المحلية وقدرتها الفعلية على تنظيم جانب هامّ من الشؤون
        العمومية وتسييره لفائدة متساكنيها، بواسطة مجالس منتخبة بالاقتراع العامّ
        المباشر؛ ويحدّ من إشراف الدولة المركزية.
      synonymes: []

  - id: subsidiarite
    acronyme: null
    statut: provisoire  # AR : مبدأ التفريع, CCL 2018 (AR), art. 15
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 16 et 19-20"}
    voir_aussi: [decentralisation]
    fr:
      terme: Subsidiarité
      definition: >
        Principe selon lequel l'exercice des responsabilités publiques incombe,
        de façon générale, aux autorités les plus proches des citoyens et les
        plus à même de les remplir, compte tenu de l'ampleur et de la nature de
        la tâche et des exigences d'efficacité et d'économie.
      synonymes: [Principe de subsidiarité]
    ar:
      terme: التفريع
      definition: >
        مبدأ يُسند بمقتضاه ممارسة المسؤوليات العمومية، بصفة عامة، إلى السلط
        الأقرب إلى المواطنين والأقدر على القيام بها، مع مراعاة حجم المهمّة
        وطبيعتها ومقتضيات النجاعة والاقتصاد.
      synonymes: [مبدأ التفريع]

  - id: patrimoine-financier
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 64"}
    voir_aussi: [ressources-propres]
    fr:
      terme: Patrimoine financier
      definition: >
        Capitaux et immeubles qu'une collectivité détient à titre privé, qui ne
        sont pas nécessaires à la production des services et pourraient être
        vendus ; il s'oppose au patrimoine administratif, qui sert à produire
        les services et n'a pas de valeur de marché.
      synonymes: []
    ar:
      terme: الملك المالي
      definition: >
        رؤوس الأموال والعقارات التي تملكها جماعة محلية ملكية خاصة، والتي لا
        تحتاجها لإنتاج الخدمات ويمكن التفويت فيها؛ ويقابله الملك الإداري الذي
        يُستعمل لإنتاج الخدمات ولا قيمة سوقية له.
      synonymes: []

  - id: desequilibre-vertical
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 65 et 197"}
    voir_aussi: [transfert-financier, perequation-financiere]
    fr:
      terme: Déséquilibre vertical
      definition: >
        Discordance, commune à toutes les collectivités, entre les ressources
        qui leur sont attribuées et les tâches qui leur sont confiées ; elle
        tient à la répartition entre niveaux de gouvernement, à la différence
        des déséquilibres propres à une collectivité.
      synonymes: [Déséquilibre fiscal vertical]
    ar:
      terme: الاختلال العمودي
      definition: >
        عدم تطابق، يشمل جميع الجماعات المحلية، بين الموارد المسندة إليها
        والمهامّ الموكولة إليها؛ ويرجع إلى توزيع الموارد والمهامّ بين مستويات
        الحكم، خلافا للاختلالات الخاصّة بجماعة بعينها.
      synonymes: []

  - id: discipline-budgetaire
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 81"}
    voir_aussi: [regle-d-or]
    fr:
      terme: Discipline budgétaire
      definition: >
        Situation dans laquelle une loi impose aux collectivités des règles
        contraignantes sur le résultat de leur budget et de leurs comptes ; elle
        se distingue de la responsabilité budgétaire, attitude spontanément
        prudente des élus qui visent l'équilibre sans règle extérieure.
      synonymes: []
    ar:
      terme: الانضباط في الميزانية
      definition: >
        وضع يفرض فيه القانون على الجماعات المحلية قواعد ملزمة تتعلّق بنتيجة
        ميزانيتها وحساباتها؛ ويتميّز عن المسؤولية في الميزانية، وهي سلوك حذر
        تلقائي من المنتخبين يرمي إلى التوازن دون قاعدة خارجية.
      synonymes: []

  - id: regle-d-or
    acronyme: null
    statut: provisoire  # AR non attesté ; le CCL 2018 (AR), art. 126, dit « قاعدة التوازن الحقيقي للميزانية » (équilibre réel)
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 28 et 82"}
    voir_aussi: [discipline-budgetaire, emprunt, capacite-emprunt]
    fr:
      terme: Règle d'or
      definition: >
        Règle d'équilibre budgétaire qui, dans la forme dite « revisitée »,
        combine l'équilibre du compte de fonctionnement, service de la dette
        compris, et le financement des investissements selon l'utilisation :
        seuls les investissements peuvent être financés par l'emprunt, remboursé
        sur leur durée d'utilisation, au rythme de leur amortissement.
      synonymes: [Règle d'or revisitée]
    ar:
      terme: القاعدة الذهبية
      definition: >
        قاعدة توازن الميزانية التي تجمع، في صيغتها «المُراجَعة»، بين توازن حساب
        التصرّف بما في ذلك خدمة الدين، وتمويل الاستثمارات حسب استعمالها: فلا
        يُموَّل بالاقتراض إلّا الاستثمار، ويُسدَّد القرض على مدّة استعماله وبنسق
        استهلاكه.
      synonymes: []

  - id: emprunt
    acronyme: null
    statut: provisoire  # AR : الاقتراض, CCL 2018 (AR), titre des ressources d'emprunt
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 28 et 66"}
    voir_aussi: [regle-d-or, capacite-emprunt]
    fr:
      terme: Emprunt
      definition: >
        Pour une collectivité, moyen de paiement des investissements et non
        revenu : il devra être remboursé par un excédent de recettes ou par
        l'impôt futur.
      synonymes: []
    ar:
      terme: الاقتراض
      definition: >
        وسيلة لخلاص الاستثمارات وليس دخلا بالنسبة إلى الجماعة المحلية: إذ
        يتعيّن تسديده من فائض في المداخيل أو من الأداءات المستقبلية.
      synonymes: []

  - id: epargne-nette
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 83"}
    voir_aussi: [capacite-emprunt, regle-d-or]
    fr:
      terme: Épargne nette
      definition: >
        Excédent du compte de fonctionnement après paiement des intérêts de la
        dette et de l'amortissement des investissements existants.
      synonymes: []
    ar:
      terme: الادّخار الصافي
      definition: >
        فائض حساب التصرّف بعد دفع فوائد الدين واستهلاك الاستثمارات القائمة.
      synonymes: []

  - id: capacite-emprunt
    acronyme: null
    statut: provisoire  # AR : طاقة التداين, CCL 2018 (AR), art. 150 (critère de répartition)
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 82-83"}
    voir_aussi: [emprunt, epargne-nette, regle-d-or]
    fr:
      terme: Capacité d'emprunt
      definition: >
        Nouvel emprunt que le compte de fonctionnement d'une collectivité peut
        supporter : l'épargne nette, diminuée des coûts récurrents qu'entraîne
        l'investissement et augmentée des recettes qu'il procure, rapportée à la
        somme du taux d'intérêt et du taux d'amortissement.
      synonymes: [Capacité d'endettement]
    ar:
      terme: طاقة التداين
      definition: >
        القرض الجديد الذي يستطيع حساب التصرّف لجماعة محلية تحمّله: الادّخار
        الصافي، مطروحا منه الكلفة المتكرّرة التي يستوجبها الاستثمار ومضافا إليه
        ما يدرّه من مداخيل، مقسوما على مجموع نسبة الفائدة ونسبة الاستهلاك.
      synonymes: [طاقة الاقتراض]

  - id: tutelle
    acronyme: null
    statut: provisoire  # AR non attesté ; « الرقابة » et « مراقبة لاحقة », CCL 2018 (AR), art. 198
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 18-19"}
    voir_aussi: [libre-administration]
    fr:
      terme: Tutelle
      definition: >
        Contrôle qu'exerce l'échelon central sur les décisions des
        collectivités. Il porte sur la légalité de la décision, c'est-à-dire le
        respect de la procédure, ou sur son opportunité, c'est-à-dire son objet,
        son contenu et sa priorité ; il s'exerce a priori ou a posteriori.
      synonymes: [Contrôle de tutelle]
    ar:
      terme: سلطة الإشراف
      definition: >
        الرقابة التي يمارسها المستوى المركزي على قرارات الجماعات المحلية.
        وتتعلّق بشرعية القرار، أي احترام الإجراءات، أو بملاءمته، أي موضوعه
        ومضمونه وأولويته؛ وتُمارَس مسبقا أو لاحقا.
      synonymes: [الإشراف]

  - id: ressources-propres
    acronyme: null
    statut: provisoire  # AR : الموارد الذاتية, CCL 2018 (AR), art. 131-132
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 65 et 68"}
    voir_aussi: [autonomie-financiere, impot-local, redevance-utilisation, patrimoine-financier]
    fr:
      terme: Ressources propres
      definition: >
        Ressources qu'une collectivité obtient par ses propres moyens : ses
        impôts, exclusifs ou partagés, ses redevances d'utilisation et le
        rendement de son patrimoine. Elles s'opposent aux ressources transférées
        par l'État.
      synonymes: [Recettes propres]
    ar:
      terme: الموارد الذاتية
      definition: >
        الموارد التي تحصل عليها الجماعة المحلية بوسائلها الخاصّة: أداءاتها،
        الحصرية أو المشتركة، ومعاليم الاستعمال، ومردود أملاكها. ويقابلها ما
        تحيله الدولة من موارد.
      synonymes: []

  - id: impot-local
    acronyme: null
    statut: provisoire  # AR : الأداءات المحلية, CCL 2018 (AR), art. 132
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 152"}
    voir_aussi: [taxe-finances-publiques, redevance-utilisation, ressources-propres]
    fr:
      terme: Impôt local
      definition: >
        Prélèvement obligatoire perçu au profit d'une collectivité, sans
        contrepartie pour le contribuable et sans affectation : son produit va
        au compte général de la collectivité. C'est la définition de l'impôt en
        finances publiques, appliquée à la collectivité locale.
      synonymes: [Impôt]
    ar:
      terme: الأداء المحلي
      definition: >
        اقتطاع إجباري يُوظَّف لفائدة جماعة محلية، دون مقابل للمطالب بالأداء
        ودون تخصيص: إذ يدخل محصوله في الحساب العامّ للجماعة. وهو تعريف الأداء
        في المالية العمومية منزَّلا على الجماعة المحلية.
      synonymes: [الأداء]

  - id: taxe-finances-publiques
    acronyme: null
    statut: provisoire  # AR à confirmer : le CCL 2018 (AR), art. 132, énumère « المعاليم والرسوم » sans les définir
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 152"}
    voir_aussi: [impot-local, redevance-utilisation]
    fr:
      terme: Taxe (au sens des finances publiques)
      definition: >
        Prélèvement obligatoire qu'une collectivité perçoit comme fournisseur
        exclusif de l'accès à un service ; il n'est dû que par celui qui demande
        l'accès, va au budget général sans affectation, et son montant ne dépend
        ni du volume ni du coût de la prestation. Les textes emploient souvent
        « taxe » dans un autre sens.
      synonymes: []
    ar:
      terme: الرسم (بمفهوم المالية العمومية)
      definition: >
        اقتطاع إجباري تستخلصه جماعة محلية بصفتها المزوّد الوحيد لخدمة ما؛ ولا
        يُستوجب إلّا على من يطلب الانتفاع بها، ويدخل في الميزانية العامّة دون
        تخصيص، ولا يرتبط مبلغه بحجم الخدمة ولا بكلفتها. وكثيرا ما تستعمل النصوص
        اللفظ في معنى آخر.
      synonymes: []

  - id: redevance-utilisation
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 152-153"}
    voir_aussi: [impot-local, taxe-finances-publiques]
    fr:
      terme: Redevance d'utilisation
      definition: >
        Prix d'un service rendu, proportionné à l'avantage que l'usager en
        retire, affecté à la tâche qu'il finance et plafonné à son coût total ;
        un excédent durable serait un impôt déguisé.
      synonymes: [Paiement des usagers, Contribution causale]
    ar:
      terme: معلوم الاستعمال
      definition: >
        ثمن خدمة مسداة، يتناسب مع المنفعة التي يجنيها المنتفع منها، ويُخصَّص
        للمهمّة التي يموّلها ولا يتجاوز كلفتها الجملية؛ وكلّ فائض دائم يُعدّ
        أداءً مقنّعا.
      synonymes: [الإتاوة]

  - id: autonomie-budgetaire
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 68"}
    voir_aussi: [autonomie-financiere, devolution-competences]
    fr:
      terme: Autonomie budgétaire
      definition: >
        Capacité d'une collectivité de décider seule des catégories, de la
        quantité et de la qualité des prestations qu'elle offre à ses
        résidents ; elle porte sur les dépenses, et les compétences dévolues en
        sont le véritable espace.
      synonymes: []
    ar:
      terme: الاستقلالية في الميزانية
      definition: >
        قدرة الجماعة المحلية على أن تقرّر وحدها أصناف الخدمات التي تسديها
        لمتساكنيها وكمّيتها وجودتها؛ وهي تتعلّق بالنفقات، ومجالها الحقيقي
        الصلاحيات المُسندة.
      synonymes: []

  - id: autonomie-financiere
    acronyme: null
    statut: provisoire  # AR : « الاستقلالية الإدارية والمالية », CCL 2018 (AR), art. 2 et 38
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 68"}
    voir_aussi: [autonomie-budgetaire, souverainete-fiscale, ressources-propres, taux-autonomie-financiere]
    fr:
      terme: Autonomie financière
      definition: >
        Situation d'une collectivité qui obtient par ses propres moyens les
        ressources dont elle a besoin, sans dépendre d'autres collectivités ;
        elle prend en compte toutes les ressources propres. L'autonomie
        fiscale, plus étroite, ne prend en compte que les impôts et les taxes.
      synonymes: [Autonomie fiscale]
    ar:
      terme: الاستقلالية المالية
      definition: >
        وضع الجماعة المحلية التي تحصل بوسائلها الخاصّة على ما تحتاجه من موارد،
        دون أن تتبع جماعات أخرى؛ وتشمل جميع الموارد الذاتية. أمّا الاستقلالية
        الجبائية، وهي أضيق، فلا تشمل إلّا الأداءات والرسوم.
      synonymes: [الاستقلالية الجبائية]

  - id: souverainete-fiscale
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 68 et 153-154"}
    voir_aussi: [flexibilite-fiscale, autonomie-financiere]
    fr:
      terme: Souveraineté fiscale
      definition: >
        Pouvoir d'une collectivité de définir le cercle des assujettis,
        l'assiette, le mode de calcul et le barème des taux d'un impôt. Elle
        est totale si la collectivité fixe tous ces éléments, partielle si elle
        n'en fixe qu'une partie ; la fiscalité obligatoire ne lui en laisse
        aucun.
      synonymes: []
    ar:
      terme: السيادة الجبائية
      definition: >
        سلطة الجماعة المحلية في ضبط دائرة الخاضعين للأداء ووعائه وطريقة
        احتسابه وجدول نسبه. وتكون تامّة إذا ضبطت الجماعة كلّ هذه العناصر، وجزئية
        إذا لم تضبط إلّا بعضها؛ أمّا الجباية الإلزامية فلا تترك لها أيّا منها.
      synonymes: []

  - id: flexibilite-fiscale
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 68 et 154"}
    voir_aussi: [souverainete-fiscale, impot-partage]
    fr:
      terme: Flexibilité fiscale
      definition: >
        Régime dans lequel une collectivité ne décide que du taux ou du
        coefficient d'un impôt, les autres éléments étant identiques pour toutes
        les collectivités ; les systèmes de centimes additionnels en relèvent.
      synonymes: []
    ar:
      terme: المرونة الجبائية
      definition: >
        نظام لا تقرّر فيه الجماعة المحلية إلّا نسبة الأداء أو معامله، وتكون
        بقية العناصر واحدة لكلّ الجماعات؛ وتندرج فيه أنظمة الأجزاء الإضافية.
      synonymes: []

  - id: impot-exclusif
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 153"}
    voir_aussi: [impot-partage, part-aux-recettes]
    fr:
      terme: Impôt exclusif
      definition: >
        Impôt dont un seul niveau de gouvernement exploite l'assiette et perçoit
        l'intégralité du produit.
      synonymes: []
    ar:
      terme: الأداء الحصري
      definition: >
        أداء ينفرد مستوى واحد من مستويات الحكم باستغلال وعائه وبقبض كامل
        محصوله.
      synonymes: []

  - id: impot-partage
    acronyme: null
    statut: provisoire  # AR à confirmer : le CCL 2018 (AR), art. 132, parle des « الأداءات التي تتقاسمها الدولة مع الجماعات المحلية »
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 153-154"}
    voir_aussi: [impot-exclusif, part-aux-recettes, flexibilite-fiscale]
    fr:
      terme: Impôt partagé
      definition: >
        Impôt dont plusieurs échelons de gouvernement exploitent la même
        assiette, chacun pouvant, le cas échéant, choisir son taux.
      synonymes: []
    ar:
      terme: الأداء المشترك
      definition: >
        أداء تستغلّ عدّة مستويات من الحكم وعاءه نفسه، ويمكن لكلّ منها، عند
        الاقتضاء، أن يختار نسبته.
      synonymes: [الأداء المتقاسَم]

  - id: part-aux-recettes
    acronyme: null
    statut: provisoire  # AR à confirmer : « مناب الجماعة المحلية من محصول الأداءات », CCL 2018 (AR), art. 132
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 154"}
    voir_aussi: [impot-partage, perequation-ressources]
    fr:
      terme: Part aux recettes
      definition: >
        Fraction fixe du produit d'un impôt dont l'échelon supérieur fixe
        l'assiette et le taux et qu'il encaisse, attribuée aux collectivités ;
        elle se répartit entre elles selon l'origine du produit ou selon une clé
        de répartition, qui peut viser à réduire les écarts de potentiel fiscal.
      synonymes: [Partage de l'impôt]
    ar:
      terme: المناب من محصول الأداءات
      definition: >
        جزء قارّ من محصول أداء يضبط المستوى الأعلى وعاءه ونسبته ويستخلصه، يُسنَد
        إلى الجماعات المحلية؛ ويُوزَّع بينها حسب مصدر المحصول أو حسب مفتاح توزيع
        قد يرمي إلى الحدّ من الفوارق في الطاقة الجبائية.
      synonymes: []

  - id: transfert-financier
    acronyme: null
    statut: provisoire  # AR : « تحويلات », CCL 2018 (AR), art. 52 et 150
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 195-198"}
    voir_aussi: [subvention-globale, subvention-specifique, perequation-financiere, desequilibre-vertical]
    fr:
      terme: Transfert financier
      definition: >
        Ressource versée par un niveau de gouvernement à un autre. Selon leur
        objectif, les transferts financent les tâches déléguées, incitent,
        corrigent les effets de débordement ou assurent la péréquation.
      synonymes: [Transfert]
    ar:
      terme: التحويلات المالية
      definition: >
        موارد يدفعها مستوى من مستويات الحكم إلى مستوى آخر. وهي، حسب الغاية منها،
        تموّل المهامّ المفوَّضة، أو تحفّز، أو تصلح آثار التجاوز، أو تحقّق التعديل.
      synonymes: [التحويلات]

  - id: subvention-globale
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 201"}
    voir_aussi: [subvention-specifique, transfert-financier]
    fr:
      terme: Subvention globale
      definition: >
        Transfert dont le montant est à la libre disposition de la collectivité
        qui le reçoit.
      synonymes: [Dotation globale]
    ar:
      terme: المنحة الشاملة
      definition: >
        تحويل يكون مبلغه على ذمّة الجماعة التي تتلقّاه تتصرّف فيه بحرية.
      synonymes: []

  - id: subvention-specifique
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 201-202"}
    voir_aussi: [subvention-globale, transfert-financier]
    fr:
      terme: Subvention spécifique
      definition: >
        Transfert affecté à une tâche ou à une dépense désignée par la
        collectivité qui le verse.
      synonymes: [Subvention affectée]
    ar:
      terme: المنحة الخصوصية
      definition: >
        تحويل مخصَّص لمهمّة أو لنفقة تعيّنها الجماعة التي تدفعه.
      synonymes: [المنحة المخصَّصة]

  - id: subvention-conditionnelle
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 202"}
    voir_aussi: [subvention-forfaitaire]
    fr:
      terme: Subvention conditionnelle
      definition: >
        Transfert dont le montant varie avec la dépense subventionnée, ou avec
        la part que la collectivité bénéficiaire est prête à y consacrer.
      synonymes: [Subvention proportionnelle]
    ar:
      terme: المنحة المشروطة
      definition: >
        تحويل يتغيّر مبلغه بتغيّر النفقة المدعومة، أو بتغيّر الجزء الذي تكون
        الجماعة المنتفعة مستعدّة لتخصيصه لها.
      synonymes: [المنحة النسبية]

  - id: subvention-forfaitaire
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 202"}
    voir_aussi: [subvention-conditionnelle]
    fr:
      terme: Subvention forfaitaire
      definition: >
        Transfert d'un montant fixe, indépendant de la participation de la
        collectivité bénéficiaire.
      synonymes: [Subvention non conditionnelle]
    ar:
      terme: المنحة الجزافية
      definition: >
        تحويل بمبلغ قارّ لا يرتبط بمساهمة الجماعة المنتفعة.
      synonymes: []

  - id: subvention-rationnee
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 203"}
    voir_aussi: [subvention-conditionnelle]
    fr:
      terme: Subvention rationnée
      definition: >
        Transfert puisé dans une enveloppe limitée, dit à guichet fermé, ce qui
        oblige à fixer des critères de sélection des demandes. La subvention non
        rationnée, à guichet ouvert, est due dès que ses conditions sont
        remplies, quelle que soit la situation financière de celui qui la verse.
      synonymes: [Subvention à guichet fermé]
    ar:
      terme: المنحة المحدودة
      definition: >
        تحويل يُصرَف من اعتماد محدود، ويقتضي لذلك ضبط مقاييس لانتقاء المطالب.
        أمّا المنحة غير المحدودة فتُستحَقّ بمجرّد توفّر شروطها، مهما كانت الوضعية
        المالية للجهة التي تدفعها.
      synonymes: []

  - id: perequation-financiere
    acronyme: null
    statut: provisoire  # AR à confirmer : le CCL 2018 (AR), art. 38-39, emploie « التعديل » et « التسوية » ; la mise en regard avec « péréquation » n'est pas attestée
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 20-21 et 252"}
    voir_aussi: [perequation-ressources, perequation-besoins, potentiel-fiscal, transfert-financier]
    fr:
      terme: Péréquation financière
      definition: >
        Transfert qui compense les disparités entre collectivités échappant à
        leur contrôle — d'assiette fiscale, de besoins ou de coûts —, en
        application du principe de solidarité. Elle est verticale lorsque le
        fonds est doté par le seul gouvernement central, horizontale lorsque les
        collectivités au potentiel fiscal supérieur à la moyenne y contribuent.
      synonymes: [Péréquation entre collectivités]
    ar:
      terme: التعديل المالي
      definition: >
        تحويل يعوّض الفوارق بين الجماعات المحلية التي تخرج عن سيطرتها — في
        الوعاء الجبائي أو الحاجيات أو الكلفة —، تطبيقا لمبدأ التضامن. ويكون
        عموديا إذا موّلت الحكومة المركزية وحدها الصندوق، وأفقيا إذا ساهمت فيه
        الجماعات التي تفوق طاقتها الجبائية المعدّل.
      synonymes: [التعديل]

  - id: perequation-ressources
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 201 et 252"}
    voir_aussi: [perequation-financiere, potentiel-fiscal, perequation-besoins]
    fr:
      terme: Péréquation des ressources
      definition: >
        Péréquation qui réduit les écarts de potentiel fiscal, en donnant
        davantage aux collectivités dont la base d'imposition est inférieure à
        la moyenne.
      synonymes: []
    ar:
      terme: تعديل الموارد
      definition: >
        تعديل يحدّ من الفوارق في الطاقة الجبائية، بمنح قسط أوفر للجماعات التي
        يقلّ وعاؤها الجبائي عن المعدّل.
      synonymes: []

  - id: perequation-besoins
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 201 et 252"}
    voir_aussi: [perequation-financiere, perequation-ressources]
    fr:
      terme: Péréquation des besoins
      definition: >
        Péréquation qui compense les écarts de besoins ou de coûts par rapport à
        la norme, selon des critères démographiques, géographiques ou
        topographiques liés à la dépense.
      synonymes: [Péréquation des charges, Péréquation des coûts]
    ar:
      terme: تعديل الحاجيات
      definition: >
        تعديل يعوّض الفوارق في الحاجيات أو في الكلفة مقارنة بالمعيار، حسب مقاييس
        ديمغرافية أو جغرافية أو طبوغرافية مرتبطة بالنفقة.
      synonymes: [تعديل الأعباء]

  - id: taux-autonomie-financiere
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 68"}
    voir_aussi: [autonomie-financiere, ressources-propres]
    fr:
      terme: Taux d'autonomie financière
      definition: >
        Part des recettes propres d'une collectivité dans le total des
        ressources dont elle peut disposer, hors emprunt.
      synonymes: []
    ar:
      terme: نسبة الاستقلالية المالية
      definition: >
        حصّة الموارد الذاتية للجماعة المحلية من مجموع الموارد التي تتصرّف فيها،
        باستثناء الاقتراض.
      synonymes: []

  - id: potentiel-fiscal
    acronyme: null
    statut: provisoire  # AR : الطاقة الجبائية, CCL 2018 (AR), art. 150 (critère de répartition)
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 252"}
    voir_aussi: [effort-fiscal, perequation-ressources]
    fr:
      terme: Potentiel fiscal
      definition: >
        Produit fiscal qu'une collectivité collecterait si elle appliquait à ses
        bases d'imposition le taux moyen national.
      synonymes: [Richesse fiscale, Capacité fiscale]
    ar:
      terme: الطاقة الجبائية
      definition: >
        المحصول الجبائي الذي تستخلصه جماعة محلية لو طبّقت على أوعيتها الجبائية
        النسبة المتوسّطة الوطنية.
      synonymes: []

  - id: effort-fiscal
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 251-252"}
    voir_aussi: [potentiel-fiscal]
    fr:
      terme: Effort fiscal
      definition: >
        Taux qu'une collectivité applique à ses propres bases d'imposition ; le
        taux moyen national est l'effort fiscal moyen. Un produit fiscal élevé
        n'est pas nécessairement le signe d'un effort élevé.
      synonymes: []
    ar:
      terme: المجهود الجبائي
      definition: >
        النسبة التي تطبّقها جماعة محلية على أوعيتها الجبائية؛ والنسبة المتوسّطة
        الوطنية هي المجهود الجبائي المتوسّط. ولا يدلّ ارتفاع المحصول الجبائي
        بالضرورة على مجهود مرتفع.
      synonymes: []

  - id: taux-de-facturation
    acronyme: null
    statut: provisoire  # AR non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 79"}
    voir_aussi: [taux-de-recouvrement, potentiel-fiscal]
    fr:
      terme: Taux de facturation
      definition: >
        Rapport entre le montant effectivement facturé au titre d'un impôt et le
        produit que rapporterait sa base exploitée de manière efficace.
      synonymes: []
    ar:
      terme: نسبة الإصدار
      definition: >
        النسبة بين المبلغ المُصدَر فعلا بعنوان أداء ما والمحصول الذي يدرّه وعاؤه
        لو استُغلّ استغلالا ناجعا.
      synonymes: []

  - id: taux-de-recouvrement
    acronyme: null
    statut: provisoire  # AR : « الاستخلاص », CCL 2018 (AR), passim ; « نسبة الاستخلاص » non attesté
    references: []
    source_definition: {ref: dafflon-gilbert-2018, locator: "p. 79"}
    voir_aussi: [taux-de-facturation]
    fr:
      terme: Taux de recouvrement
      definition: >
        Rapport entre le montant effectivement encaissé au titre d'un impôt et
        le montant facturé.
      synonymes: []
    ar:
      terme: نسبة الاستخلاص
      definition: >
        النسبة بين المبلغ المستخلَص فعلا بعنوان أداء ما والمبلغ المُصدَر.
      synonymes: []

  - id: code-fiscalite-locale
    acronyme: null
    statut: valide
    references: [loi97-11]
    source_definition: {ref: loi97-11, locator: "art. 1-3"}
    source_traduction: {ref: loi97-11, locator: "art. 1"}
    voir_aussi: [taxe-immeubles-batis, taxe-terrains-non-batis, taxe-etablissements, taxe-hoteliere]
    fr:
      terme: Code de la fiscalité locale
      definition: >
        Code promulgué par la loi n° 97-11 du 3 février 1997 et entré en
        vigueur le 1er janvier 1997, qui régit les droits et redevances perçus
        au profit des collectivités locales. Il compte huit chapitres, un par
        prélèvement : taxe sur les immeubles bâtis, taxe sur les terrains non
        bâtis, taxe sur les établissements à caractère industriel, commercial
        ou professionnel, taxe hôtelière, taxe sur les spectacles, contribution
        des propriétaires riverains, droit de licence sur les débits de
        boissons, et taxes et redevances diverses.
      synonymes: []
    ar:
      terme: مجلة الجباية المحلية
      definition: >
        مجلة صدرت بالقانون عدد 11 لسنة 1997 المؤرخ في 3 فيفري 1997 ودخلت حيّز
        التنفيذ ابتداء من غرّة جانفي 1997، تنظّم المعاليم المستوجبة لفائدة
        الجماعات المحلية. وتتضمّن ثمانية أبواب، باب لكلّ معلوم: المعلوم على
        العقارات المبنية، والمعلوم على الأراضي غير المبنية، والمعلوم على
        المؤسسات ذات الصبغة الصناعية أو التجارية أو المهنية، والمعلوم على النزل،
        والمعلوم على العروض، ومساهمة المالكين الأجوار، ومعلوم الإجازة الموظف على
        محلات بيع المشروبات، ومعاليم مختلفة.
      synonymes: []

  - id: taxe-immeubles-batis
    acronyme: TIB
    statut: valide
    references: [loi97-11, decret2017-397]
    source_definition: {ref: loi97-11, locator: "art. 1-5"}
    source_traduction: {ref: loi97-11, locator: "art. 1"}
    voir_aussi: [prix-reference-m2, taxe-terrains-non-batis, code-fiscalite-locale]
    fr:
      terme: Taxe sur les immeubles bâtis
      definition: >
        Taxe annuelle, due au 1er janvier par le propriétaire d'un immeuble bâti
        situé dans une zone relevant d'une collectivité locale, sauf si
        l'immeuble est affecté à une activité soumise à la taxe sur les
        établissements ou à la taxe hôtelière. Son assiette est égale à 2 % du
        prix de référence du mètre carré couvert multiplié par la superficie
        couverte ; son taux, de 8 à 14 %, croît avec le nombre de services dont
        bénéficie l'immeuble.
      synonymes: []
    ar:
      terme: المعلوم على العقارات المبنية
      definition: >
        معلوم سنوي يُستوجب في غرّة جانفي على مالك العقار المبني الكائن بمنطقة
        راجعة بالنظر إلى جماعة محلية، ما لم يكن العقار مخصّصا لنشاط خاضع للمعلوم
        على المؤسسات أو للمعلوم على النزل. وتساوي قاعدته 2 بالمائة من الثمن
        المرجعي للمتر المربع المبني مضروبا في المساحة المغطاة، وتتراوح نسبته بين
        8 و14 بالمائة حسب عدد الخدمات التي ينتفع بها العقار.
      synonymes: []

  - id: taxe-terrains-non-batis
    acronyme: TNB
    statut: valide
    references: [loi97-11, decret2017-396]
    source_definition: {ref: loi97-11, locator: "art. 30-33"}
    source_traduction: {ref: loi97-11, locator: "art. 30"}
    voir_aussi: [taxe-immeubles-batis, code-fiscalite-locale]
    fr:
      terme: Taxe sur les terrains non bâtis
      definition: >
        Taxe annuelle due par le propriétaire d'un terrain non bâti situé dans
        une zone relevant d'une collectivité locale, au taux de 0,3 % de la
        valeur vénale réelle du terrain ou, à défaut, selon un tarif au mètre
        carré fixé par décret pour chaque zone du plan d'aménagement urbain,
        selon sa densité.
      synonymes: []
    ar:
      terme: المعلوم على الأراضي غير المبنية
      definition: >
        معلوم سنوي يُستوجب على مالك الأرض غير المبنية الكائنة بمنطقة راجعة
        بالنظر إلى جماعة محلية، بنسبة 0,3 بالمائة من القيمة التجارية الحقيقية
        للأرض، أو، عند تعذّر ذلك، حسب معلوم بالمتر المربع يُضبط بأمر لكلّ منطقة
        من مناطق مثال التهيئة العمرانية حسب كثافتها العمرانية.
      synonymes: []

  - id: taxe-etablissements
    acronyme: TCL
    statut: valide
    references: [loi97-11, decret2017-395]
    source_definition: {ref: loi97-11, locator: "art. 35-38"}
    source_traduction: {ref: loi97-11, locator: "art. 35"}
    voir_aussi: [taxe-hoteliere, taxe-immeubles-batis, code-fiscalite-locale]
    fr:
      terme: Taxe sur les établissements à caractère industriel, commercial ou professionnel
      definition: >
        Taxe due au profit des collectivités locales par les personnes soumises
        à l'impôt sur le revenu au titre des bénéfices industriels et commerciaux
        ou des bénéfices non commerciaux et par les personnes morales soumises à
        l'impôt sur les sociétés, même exonérées de ces impôts. Assise à
        l'origine sur le chiffre d'affaires brut local, au taux de 0,2 %, elle
        ne peut être inférieure à un minimum calculé sur la superficie couverte
        des locaux exploités.
      synonymes: [Taxe sur les établissements]
    ar:
      terme: المعلوم على المؤسسات ذات الصبغة الصناعية أو التجارية أو المهنية
      definition: >
        معلوم يُستوجب لفائدة الجماعات المحلية على الأشخاص الخاضعين للضريبة على
        الدخل بعنوان الأرباح الصناعية والتجارية أو الأرباح غير التجارية وعلى
        الأشخاص المعنويين الخاضعين للضريبة على الشركات، ولو كانوا معفيين منهما.
        ويُوظَّف في الأصل على رقم المعاملات المحلي الخام بنسبة 0,2 بالمائة، ولا
        يمكن أن يقلّ عن حدّ أدنى يُحتسب على أساس المساحة المغطاة للمحلات
        المستغلّة.
      synonymes: []

  - id: taxe-hoteliere
    acronyme: null
    statut: valide
    references: [loi97-11]
    source_definition: {ref: loi97-11, locator: "art. 41-43"}
    source_traduction: {ref: loi97-11, locator: "art. 41"}
    voir_aussi: [taxe-etablissements, code-fiscalite-locale]
    fr:
      terme: Taxe hôtelière
      definition: >
        Taxe due au profit des collectivités locales par les exploitants des
        établissements touristiques, au taux de 2 % de leur chiffre d'affaires
        brut global. Ces établissements sont exonérés de la taxe sur les
        établissements à caractère industriel, commercial ou professionnel et
        de la taxe sur les immeubles bâtis.
      synonymes: []
    ar:
      terme: المعلوم على النزل
      definition: >
        معلوم يُستوجب لفائدة الجماعات المحلية على مستغلّي المؤسسات السياحية،
        بنسبة 2 بالمائة من رقم معاملاتهم الجملي الخام. وتُعفى هذه المؤسسات من
        المعلوم على المؤسسات ذات الصبغة الصناعية أو التجارية أو المهنية ومن
        المعلوم على العقارات المبنية.
      synonymes: []

  - id: prix-reference-m2
    acronyme: null
    statut: valide
    references: [loi97-11, decret97-431, decret2007-1185, decret2017-397]
    source_definition: {ref: loi97-11, locator: "art. 4"}
    source_traduction: {ref: loi97-11, locator: "art. 4"}
    voir_aussi: [taxe-immeubles-batis]
    fr:
      terme: Prix de référence du mètre carré couvert
      definition: >
        Prix au mètre carré de superficie couverte sur lequel est calculée
        l'assiette de la taxe sur les immeubles bâtis. Un décret en fixe, pour
        chacune des quatre catégories de superficie couverte, un minimum et un
        maximum ; dans ces limites, la collectivité locale le fixe par arrêté
        motivé, selon les services rendus.
      synonymes: []
    ar:
      terme: الثمن المرجعي للمتر المربع المبني
      definition: >
        ثمن للمتر المربع من المساحة المغطاة تُحتسب على أساسه قاعدة المعلوم على
        العقارات المبنية. ويضبط أمر حدّه الأدنى وحدّه الأقصى لكلّ صنف من أصناف
        المساحة المغطاة الأربعة، وتضبطه الجماعة المحلية في حدودهما بقرار معلّل
        حسب الخدمات المسداة.
      synonymes: []

  - id: contribution-fnah
    acronyme: null
    statut: provisoire  # FR : intitulé repris de la note documentaire (LF 2005, art. 13), à relire sur pièce ; AR : LF 2019, art. 72 ; LF 2024, art. 59
    references: [lf-2005, loi2018-56-lf2019]
    source_definition: {ref: lf-2005, locator: "art. 13"}
    source_traduction: {ref: loi2018-56-lf2019, locator: "art. 72"}
    voir_aussi: [taxe-immeubles-batis, fnah]
    fr:
      terme: Contribution au profit du Fonds national d'amélioration de l'habitat
      definition: >
        Contribution due par les redevables de la taxe sur les immeubles bâtis
        pour les immeubles d'habitation, égale à 4 % de l'assiette de cette
        taxe et recouvrée selon ses règles, au profit du Fonds national
        d'amélioration de l'habitat, fonds spécial du Trésor.
      synonymes: []
    ar:
      terme: المساهمة لفائدة الصندوق الوطني لتحسين السكن
      definition: >
        مساهمة يدفعها الخاضعون للمعلوم على العقارات المبنية بعنوان العقارات
        المعدّة للسكنى، تساوي 4 بالمائة من قاعدة هذا المعلوم وتُستخلص حسب
        قواعده، لفائدة الصندوق الوطني لتحسين السكن، وهو صندوق خاص للخزينة.
      synonymes: []

  - id: fonds-commun-collectivites-locales
    acronyme: FCCL
    statut: valide
    references: [loi75-36, lf-2007, lf-2018]
    source_definition: {ref: loi75-36, locator: "art. 1-3"}
    source_traduction: {ref: loi75-36, locator: "art. 1"}
    voir_aussi: [reserve-fonds-commun, cpscl, transfert-financier, perequation-financiere]
    fr:
      terme: Fonds commun des collectivités locales
      definition: >
        Fonds spécial du Trésor institué par la loi n° 75-36 du 14 mai 1975, à
        compter du 1er janvier 1976, qui répartit entre les conseils de
        gouvernorat, puis conseils régionaux, et les communes une dotation
        annuelle globale, selon des critères fixés par la loi ; une part en est
        mise en réserve. Alimenté d'abord par des parts d'impôts d'État, puis à
        partir de 1987 par une subvention du budget de l'État, il est supprimé
        par la loi de finances pour 2018.
      synonymes: []
    ar:
      terme: المال المشترك للجماعات المحلية
      definition: >
        مال خاص بالخزينة أحدثه القانون عدد 36 لسنة 1975 المؤرخ في 14 ماي 1975
        بداية من غرة جانفي 1976، يوزّع على مجالس الولايات ثمّ المجالس الجهوية
        وعلى البلديات اعتمادا سنويا جمليا وفق مقاييس يضبطها القانون، ويُرصد جزء
        منه مدّخرا. موّل في البداية بمناب من أداءات الدولة، ثمّ بداية من سنة
        1987 بمنحة من ميزانية الدولة، وحُذف بقانون المالية لسنة 2018.
      synonymes: []

  - id: reserve-fonds-commun
    acronyme: null
    statut: valide
    references: [loi75-36, loi91-98-lf1992, lf-2007, lf-2014]
    source_definition: {ref: loi75-36, locator: "art. 3"}
    source_traduction: {ref: loi75-36, locator: "art. 3"}
    voir_aussi: [fonds-commun-collectivites-locales, cpscl]
    fr:
      terme: Réserve du fonds commun
      definition: >
        Part des ressources du fonds commun des collectivités locales qui n'est
        pas répartie selon les critères généraux, appelée « solde » par la loi
        de 1975 : 25 % jusqu'en 2006, puis 18 % à partir de 2007. Ses parts
        étaient fixées par la loi jusqu'en 1991, puis attribuées par décret
        entre la commune de Tunis, les communes sièges de gouvernorat, la caisse
        de prêts et de soutien et d'autres bénéficiaires.
      synonymes: [Solde du fonds commun]
    ar:
      terme: مدّخر المال المشترك
      definition: >
        جزء من موارد المال المشترك للجماعات المحلية لا يوزّع حسب المقاييس
        العامّة: 25 بالمائة إلى سنة 2006، ثمّ 18 بالمائة بداية من سنة 2007.
        ضبط القانون أقساطه إلى سنة 1991، ثمّ صار يُسند بأمر بين بلدية تونس
        والبلديات مراكز الولايات وصندوق القروض ومساعدة الجماعات المحلية وغيرها.
      synonymes: []

  - id: cpscl
    acronyme: CPSCL
    statut: valide
    references: [loi75-37, cpscl-etats-financiers]
    source_definition: {ref: loi75-37, locator: "art. 1-4"}
    source_traduction: {ref: lf-2007, locator: "art. 11"}
    voir_aussi: [fonds-commun-collectivites-locales, emprunt]
    fr:
      terme: Caisse des prêts et de soutien des collectivités locales
      definition: >
        Caisse dotée de la personnalité civile et de l'autonomie financière,
        issue en 1976 de la transformation de la caisse des prêts aux communes
        de 1902 par la loi n° 75-37 du 14 mai 1975. Elle consent aux
        collectivités locales des prêts d'investissement, des subventions et
        des bonifications d'intérêts, sur une part du fonds commun, les
        remboursements de ses prêts et ses emprunts.
      synonymes: []
    ar:
      terme: صندوق القروض ومساعدة الجماعات المحلية
      definition: >
        صندوق يتمتّع بالشخصية المدنية والاستقلال المالي، نشأ سنة 1976 عن تحويل
        صندوق القروض للبلديات المحدث سنة 1902 بمقتضى القانون عدد 37 لسنة 1975
        المؤرخ في 14 ماي 1975. يسند إلى الجماعات المحلية قروض استثمار ومنحا
        وتخفيضات في الفوائض، من مناب من المال المشترك ومن استخلاص قروضه
        ومن اقتراضاته.

  - id: competences-propres
    acronyme: null
    statut: provisoire  # AR : الصلاحيات الذاتية, CCL 2018 (AR), art. 13-14 ; FR : traduction citée par Hammami, Dafflon et Gilbert (2021, p. 26-27), non officielle
    references: [hammami-dafflon-gilbert-2021]
    source_definition: {ref: loi-org-2018-29-ccl, locator: "art. 13-14"}
    voir_aussi: [competences-partagees, competences-transferees, devolution-competences]
    fr:
      terme: Compétences propres
      definition: >
        Dans le code des collectivités locales de 2018, compétences que la
        collectivité exerce seule et de façon exclusive, sous réserve des cas
        prévus par le code.
      synonymes: [Attributions propres]
    ar:
      terme: الصلاحيات الذاتية
      definition: >
        في مجلة الجماعات المحلية لسنة 2018، الصلاحيات التي تنفرد الجماعة
        المحلية بمباشرتها بصفة حصرية، مع مراعاة الحالات التي تنص عليها المجلة.
      synonymes: []

  - id: competences-partagees
    acronyme: null
    statut: provisoire  # AR : الصلاحيات المشتركة, CCL 2018 (AR), art. 13 ; FR : traduction citée par Hammami, Dafflon et Gilbert (2021)
    references: [hammami-dafflon-gilbert-2021]
    source_definition: {ref: loi-org-2018-29-ccl, locator: "art. 13 et 15"}
    voir_aussi: [competences-propres, competences-transferees, subsidiarite]
    fr:
      terme: Compétences partagées
      definition: >
        Dans le code des collectivités locales de 2018, compétences que la
        collectivité exerce avec l'autorité centrale, en coordination et en
        coopération avec elle, selon des conditions renvoyées à une loi.
      synonymes: []
    ar:
      terme: الصلاحيات المشتركة
      definition: >
        في مجلة الجماعات المحلية لسنة 2018، الصلاحيات التي تباشرها الجماعة
        المحلية مع السلطة المركزية بالتنسيق والتعاون معها، وفق شروط يضبطها
        القانون.
      synonymes: []

  - id: competences-transferees
    acronyme: null
    statut: provisoire  # AR : الصلاحيات المنقولة, CCL 2018 (AR), art. 13 et 16 ; la Constitution de 2014 (art. 134) dit « déléguées » dans la traduction reproduite par Dafflon et Gilbert
    references: [hammami-dafflon-gilbert-2021]
    source_definition: {ref: loi-org-2018-29-ccl, locator: "art. 13 et 16"}
    voir_aussi: [competences-propres, competences-partagees, delegation-competences]
    fr:
      terme: Compétences transférées
      definition: >
        Dans le code des collectivités locales de 2018, compétences que
        l'autorité centrale transfère à la collectivité par la loi, avec les
        crédits et les moyens proportionnés aux charges qu'elles entraînent.
      synonymes: [Compétences déléguées]
    ar:
      terme: الصلاحيات المنقولة
      definition: >
        في مجلة الجماعات المحلية لسنة 2018، الصلاحيات التي تنقلها السلطة
        المركزية إلى الجماعة المحلية بمقتضى القانون، مع الاعتمادات والوسائل
        الملائمة للأعباء المترتبة عنها.
      synonymes: []

  - id: pouvoir-reglementaire-local
    acronyme: null
    statut: provisoire  # AR : السلطة الترتيبية, CCL 2018 (AR), art. 25-28 ; FR : notre traduction
    references: []
    source_definition: {ref: loi-org-2018-29-ccl, locator: "art. 25-28"}
    voir_aussi: [competences-propres]
    fr:
      terme: Pouvoir réglementaire local
      definition: >
        Pouvoir du conseil d'une collectivité locale de prendre des règlements
        dans les limites de son territoire et de ses compétences ; il peut en
        déléguer une part à son président.
      synonymes: []
    ar:
      terme: السلطة الترتيبية
      definition: >
        سلطة مجلس الجماعة المحلية في اتخاذ التراتيب في حدود ترابها
        وصلاحياتها، وله أن يفوّض جزءا منها إلى رئيسه.
      synonymes: []

  - id: district
    acronyme: null
    statut: provisoire  # FR et AR : loi organique n° 2025-4, art. 1 (« conseils de districts », « مجالس الأقاليم ») ; CCL 2018 (AR), art. 2 et 356 (abrogé le 18 mars 2025) ; regroupement de gouvernorats : décret n° 2023-589, art. 1
    references: [loi-org-2018-29-ccl, decret2023-589]
    source_definition: {ref: decret2023-589, locator: "art. 1"}
    source_traduction: {ref: loi-org2025-4, locator: "art. 1"}
    voir_aussi: [collectivite-locale, conseil-local]
    fr:
      terme: District
      definition: >
        Collectivité locale regroupant plusieurs gouvernorats, chargée de
        l'intégration et de la complémentarité du développement entre les zones
        qui la composent ; son conseil est élu par les membres d'autres conseils.
      synonymes: []
    ar:
      terme: الإقليم
      definition: >
        جماعة محلية تجمع عدة ولايات، تتولى تحقيق الاندماج والتكامل في
        التنمية بين المناطق المكونة لها، وينتخب مجلسها أعضاء مجالس أخرى.
      synonymes: []

  - id: conseil-local
    acronyme: null
    statut: valide  # FR et AR : loi organique n° 2025-4, art. 1 et 7 (« conseil local », « المجلس المحلي »)
    references: [decretloi2023-10]
    source_definition: {ref: loi-org2025-4, locator: "art. 1 et 7"}
    source_traduction: {ref: loi-org2025-4, locator: "art. 1"}
    voir_aussi: [district, collectivite-locale]
    fr:
      terme: Conseil local
      definition: >
        Conseil élu au niveau de la délégation, considéré comme une collectivité
        locale, qui délibère sur les projets de plans de développement locaux.
      synonymes: []
    ar:
      terme: المجلس المحلي
      definition: >
        مجلس منتخب على مستوى المعتمدية، يعتبر جماعة محلية، ويتداول في مشاريع
        مخططات التنمية المحلية.
      synonymes: []

  - id: conseil-superieur-collectivites-locales
    acronyme: null
    statut: provisoire  # AR : المجلس الأعلى للجماعات المحلية, CCL 2018 (AR), art. 47-60 ; FR : notre traduction (« Haut Conseil » chez Dafflon et Gilbert)
    references: []
    source_definition: {ref: loi-org-2018-29-ccl, locator: "art. 47-60"}
    voir_aussi: [haute-instance-finances-locales]
    fr:
      terme: Conseil supérieur des collectivités locales
      definition: >
        Instance nationale formée de présidents de collectivités, consultée
        obligatoirement sur les projets de loi qui intéressent les collectivités
        locales, notamment leurs finances.
      synonymes: [Haut Conseil des collectivités locales]
    ar:
      terme: المجلس الأعلى للجماعات المحلية
      definition: >
        هيئة وطنية تتكوّن من رؤساء جماعات محلية، يُستشار وجوبا في مشاريع
        القوانين المتعلقة بالجماعات المحلية، ولا سيما بماليتها.
      synonymes: []

  - id: haute-instance-finances-locales
    acronyme: null
    statut: provisoire  # AR : الهيئة العليا للمالية المحلية, CCL 2018 (AR), art. 61-65 ; FR : notre traduction
    references: []
    source_definition: {ref: loi-org-2018-29-ccl, locator: "art. 61-65"}
    voir_aussi: [conseil-superieur-collectivites-locales]
    fr:
      terme: Haute instance des finances locales
      definition: >
        Instance placée sous la supervision du Conseil supérieur des
        collectivités locales, qui propose les ressources transférables aux
        collectivités et leurs critères de répartition, évalue le coût des
        transferts de compétences et suit l'endettement local.
      synonymes: []
    ar:
      terme: الهيئة العليا للمالية المحلية
      definition: >
        هيئة تعمل تحت إشراف المجلس الأعلى للجماعات المحلية، تقترح الموارد
        القابلة للتحويل إلى الجماعات المحلية ومقاييس توزيعها، وتقيّم كلفة نقل
        الصلاحيات وتتابع المديونية المحلية.
      synonymes: []

  - id: delegation-speciale
    acronyme: null
    statut: provisoire  # FR : loi n° 75-33, art. 13 ; AR : النيابة الخصوصية, relevé dans des arrêtés du JORT n° 39 de 2018, non dans la loi
    references: [decret2011-384]
    source_definition: {ref: loi75-33, locator: "art. 13"}
    voir_aussi: [collectivite-locale, tutelle]
    fr:
      terme: Délégation spéciale
      definition: >
        Organe nommé par décret qui remplit les fonctions d'un conseil
        municipal dissous ou démissionnaire, ou celles du conseil d'une
        commune nouvellement créée, jusqu'à l'élection d'un nouveau conseil.
      synonymes: []
    ar:
      terme: النيابة الخصوصية
      definition: >
        هيئة تُعيَّن بأمر لتتولى مهام مجلس بلدي منحلّ أو مستقيل، أو مجلس
        بلدية محدثة، إلى حين انتخاب مجلس جديد.
      synonymes: []

  - id: depenses-obligatoires
    acronyme: null
    statut: provisoire  # FR : loi n° 75-35, art. 10 ; AR : النفقات الإجبارية, CCL 2018 (AR), art. 160 (« وجوبية » à l'art. 174)
    references: []
    source_definition: {ref: loi75-35, locator: "art. 10"}
    voir_aussi: [equilibre-reel, tutelle]
    fr:
      terme: Dépenses obligatoires
      definition: >
        Dépenses que la loi impose d'inscrire au budget d'une collectivité
        locale, telles que la rémunération du personnel ou les annuités
        d'emprunt ; elles peuvent être inscrites d'office.
      synonymes: []
    ar:
      terme: النفقات الإجبارية
      definition: >
        نفقات يفرض القانون ترسيمها بميزانية الجماعة المحلية، مثل تأجير
        الأعوان أو أقساط القروض، ويمكن ترسيمها وجوبا.
      synonymes: [النفقات الوجوبية]

  - id: equilibre-reel
    acronyme: null
    statut: provisoire  # FR : loi n° 75-35, art. 16 ; AR : التوازن الحقيقي للميزانية, CCL 2018 (AR), art. 126
    references: [dafflon-gilbert-2018]
    source_definition: {ref: loi75-35, locator: "art. 16"}
    voir_aussi: [regle-d-or, depenses-obligatoires]
    fr:
      terme: Équilibre réel
      definition: >
        Exigence que les autorisations de dépenses et les prévisions de
        recettes du budget local soient présentées et votées en équilibre,
        compte tenu des engagements antérieurs ; la loi ne la définit pas
        davantage.
      synonymes: []
    ar:
      terme: التوازن الحقيقي للميزانية
      definition: >
        وجوب تقديم ترخيصات النفقات وتقديرات الموارد بميزانية الجماعة المحلية
        والمصادقة عليها في توازن، مع اعتبار التعهدات السابقة.
      synonymes: []

  - id: ordonnateur
    acronyme: null
    statut: valide  # FR et AR : loi organique n° 2025-4, art. 5 (« ordonnateur », « آمر قبض وصرف »)
    references: [loi-org2007-65]
    source_definition: {ref: loi-org2025-4, locator: "art. 5"}
    source_traduction: {ref: loi-org2025-4, locator: "art. 5"}
    voir_aussi: [comptable-public]
    fr:
      terme: Ordonnateur
      definition: >
        Autorité qui ordonne les recettes et les dépenses d'un budget ; pour une
        collectivité locale et pour les conseils locaux, régionaux et de
        districts, son président.
      synonymes: []
    ar:
      terme: آمر قبض وصرف
      definition: >
        السلطة التي تأذن بقبض الموارد وصرف النفقات في ميزانية ما؛ وهي بالنسبة
        إلى الجماعة المحلية وإلى المجالس المحلية والجهوية ومجالس الأقاليم
        رئيسها.
      synonymes: [آمر الصرف]

  - id: comptable-public
    acronyme: null
    statut: provisoire  # AR : محاسب الجماعة المحلية, CCL 2018 (AR), art. 129 et 184 ; FR : notre traduction
    references: []
    source_definition: {ref: loi-org-2018-29-ccl, locator: "art. 129 et 186"}
    voir_aussi: [ordonnateur]
    fr:
      terme: Comptable public
      definition: >
        Agent de l'État chargé seul des encaissements et des paiements d'une
        collectivité locale ; il contrôle la légalité des dépenses, non leur
        opportunité.
      synonymes: [Comptable de la collectivité locale]
    ar:
      terme: محاسب الجماعة المحلية
      definition: >
        عون عمومي للدولة يتولى وحده عمليات القبض والصرف للجماعة المحلية،
        ويراقب شرعية النفقات دون ملاءمتها.
      synonymes: [المحاسب العمومي]

  - id: compte-financier
    acronyme: null
    statut: provisoire  # FR : loi n° 75-35, art. 25 ; AR : الحساب المالي, CCL 2018 (AR), art. 195-196
    references: []
    source_definition: {ref: loi75-35, locator: "art. 25"}
    voir_aussi: [comptable-public]
    fr:
      terme: Compte financier
      definition: >
        Document qui retrace l'exécution du budget d'une collectivité locale
        à la clôture de l'exercice, arrêté par son conseil.
      synonymes: []
    ar:
      terme: الحساب المالي
      definition: >
        وثيقة تبيّن تنفيذ ميزانية الجماعة المحلية عند ختم السنة المالية،
        ويختمها مجلسها.
      synonymes: []

  - id: faute-de-gestion
    acronyme: null
    statut: provisoire  # FR : loi organique n° 2007-65 (art. 23 bis nouveau de la loi n° 75-35) ; AR : خطأ تصرّف, CCL 2018 (AR), art. 183
    references: []
    source_definition: {ref: loi-org2007-65, locator: "art. 1"}
    voir_aussi: [ordonnateur]
    fr:
      terme: Faute de gestion
      definition: >
        Manquement d'un ordonnateur aux règles d'exécution du budget local,
        notamment l'engagement de dépenses au-delà des recettes réalisées ;
        il engage sa responsabilité.
      synonymes: []
    ar:
      terme: خطأ التصرّف
      definition: >
        إخلال آمر الصرف بقواعد تنفيذ ميزانية الجماعة المحلية، ولا سيما
        الالتزام بنفقات تتجاوز الموارد المحققة، ويترتب عنه قيام مسؤوليته.
      synonymes: []

  - id: salaire-minimum-garanti
    acronyme: null
    statut: provisoire
    references: [loi66-27]
    source_definition: {ref: loi96-62, locator: "art. 134-2"}
    voir_aussi: [smig, smag, salaire-conventionnel]
    fr:
      terme: Salaire minimum garanti
      definition: >
        Seuil au-dessous duquel il n'est pas possible de rémunérer un travailleur
        chargé de travaux ne nécessitant pas de qualification professionnelle
        (code du travail, art. 134-2, issu de la loi n° 96-62). Il est fixé par
        décret, sous deux formes : le salaire minimum interprofessionnel garanti
        (SMIG) pour les secteurs non agricoles et le salaire minimum agricole
        garanti (SMAG).
      synonymes: [salaire minimum légal]
    ar:
      terme: الأجر الأدنى المضمون
      definition: >
        العتبة الدنيا التي لا يجوز دونها تأجير عامل مكلَّف بأعمال لا تستوجب
        تأهيلًا مهنيًا (مجلة الشغل، الفصل 134-2، كما أُضيف بالقانون عدد 62 لسنة
        1996). ويُضبط بأمر في صيغتين: الأجر الأدنى المضمون لمختلف المهن في
        القطاعات غير الفلاحية، والأجر الأدنى الفلاحي المضمون.
      synonymes: []

  - id: salaire-conventionnel
    acronyme: null
    statut: provisoire
    references: [arrete-1973-05-29-convention-cadre]
    source_definition: {ref: decret73-247, locator: "art. 1 et 2"}
    voir_aussi: [salaire-minimum-garanti, convention-collective-sectorielle, convention-collective-cadre, grille-de-salaires-conventionnelle]
    fr:
      terme: Salaire conventionnel
      definition: >
        Salaire fixé, par catégorie professionnelle, par une convention collective
        ou par ses avenants. Depuis le décret n° 73-247 du 26 mai 1973, les
        conventions collectives peuvent fixer les salaires, leurs accessoires et
        les classifications, sur la base d'un salaire minimum interprofessionnel
        garanti fixé par décret.
      synonymes: []
    ar:
      terme: الأجر التعاقدي
      definition: >
        أجر تضبطه اتفاقية مشتركة أو ملاحقها التعديلية حسب الأصناف المهنية. ومنذ
        الأمر عدد 247 لسنة 1973 المؤرخ في 26 ماي 1973، يجوز للاتفاقيات المشتركة
        ضبط الأجور وتوابعها والتصنيفات، على أساس أجر أدنى مضمون لمختلف المهن يُضبط
        بأمر.
      synonymes: []

  - id: convention-collective-cadre
    acronyme: null
    statut: provisoire
    references: [loi66-27]
    source_definition: {ref: arrete-1973-05-29-convention-cadre}
    voir_aussi: [convention-collective-sectorielle, agrement-convention-collective, salaire-conventionnel]
    fr:
      terme: Convention collective cadre
      definition: >
        Convention conclue le 20 mars 1973 entre l'Union tunisienne de
        l'industrie, du commerce et de l'artisanat et l'Union générale tunisienne
        du travail, approuvée par arrêté du 29 mai 1973 et rendue obligatoire pour
        toutes les activités non agricoles. Elle sert de base à chaque convention
        de branche, qui en fixe les grilles de salaires et les indemnités.
      synonymes: [convention-cadre]
    ar:
      terme: الاتفاقية المشتركة الإطارية
      definition: >
        اتفاقية أُبرمت في 20 مارس 1973 بين الاتحاد التونسي للصناعة والتجارة
        والصناعات التقليدية والاتحاد العام التونسي للشغل، وصودق عليها بقرار مؤرخ في
        29 ماي 1973 وجُعلت إلزامية في جميع الأنشطة غير الفلاحية. وهي أساس كلّ
        اتفاقية قطاعية تضبط سلالم الأجور والمنح.
      synonymes: []

  - id: agrement-convention-collective
    acronyme: null
    statut: provisoire
    references: []
    source_definition: {ref: loi66-27, locator: "art. 37 et 38"}
    voir_aussi: [convention-collective-sectorielle, convention-collective-cadre, avenant-convention-collective]
    fr:
      terme: Agrément d'une convention collective
      definition: >
        Arrêté par lequel, après avis de la commission consultative des
        conventions collectives, une convention est rendue
        applicable à tous les employeurs et à tous les travailleurs de la branche
        qu'elle vise, signataires ou non (code du travail de 1966, art. 37 et 38).
        Les avenants d'une convention sont agréés de la même façon. Les intitulés
        du Journal officiel disent tantôt « agrément », tantôt « approbation ».
      synonymes: [arrêté d'agrément, approbation d'une convention collective]
    ar:
      terme: المصادقة على الاتفاقية المشتركة
      definition: >
        قرار تُجعل به اتفاقيةٌ، بعد رأي اللجنة الاستشارية للاتفاقيات المشتركة،
        منطبقةً على جميع المؤجرين وجميع العمال في القطاع الذي
        تشمله، موقّعين كانوا أم لا (مجلة الشغل لسنة 1966، الفصلان 37 و38).
        وتتمّ المصادقة على الملاحق التعديلية للاتفاقية بالطريقة نفسها. وتستعمل
        عناوين الرائد الرسمي في نصّها الفرنسي تارة لفظ « agrément » وتارة لفظ
        « approbation ».
      synonymes: [قرار المصادقة]

  - id: avenant-convention-collective
    acronyme: null
    statut: valide
    references: [loi66-27, arretes-1996-07-24-avenants-quarante-conventions]
    source_definition: {ref: avenant18-textile-2024}
    source_traduction: {ref: avenant18-textile-2024}
    voir_aussi: [convention-collective-sectorielle, agrement-convention-collective, grille-de-salaires-conventionnelle]
    fr:
      terme: Avenant à une convention collective
      definition: >
        Accord qui révise une convention collective, en particulier ses grilles de
        salaires et ses indemnités. Agréé par arrêté comme la convention, il
        s'impose à toute la branche. Ainsi l'avenant n° 18 à la convention du
        textile, signé le 29 février 2024 et agréé le 8 avril 2024, fixe les
        grilles des 1er janvier 2024, 2025 et 2026. Depuis 1996, les grilles des
        avenants ne paraissent plus que dans l'édition arabe du Journal officiel.
      synonymes: [avenant]
    ar:
      terme: الملحق التعديلي
      definition: >
        اتفاق ينقّح اتفاقية مشتركة، وخاصة جداول الأجور والمنح الواردة بها. وتتمّ
        المصادقة عليه بقرار شأنه شأن الاتفاقية، فيصبح منطبقًا على كامل القطاع.
        ومثال ذلك الملحق التعديلي عدد 18 للاتفاقية المشتركة القطاعية للنسيج،
        الممضى في 29 فيفري 2024 والمصادق عليه في 8 أفريل 2024، الذي يضبط جداول
        الأجور في غرّة جانفي 2024 و2025 و2026. ومنذ سنة 1996، لم تعد جداول
        أجور الملاحق التعديلية تُنشر إلا في النسخة العربية من الرائد الرسمي.
      synonymes: []

  - id: grille-de-salaires-conventionnelle
    acronyme: null
    statut: provisoire
    references: [convention-textile-1974, convention-btp-1975]
    source_definition: {ref: arrete-1973-05-29-convention-cadre, locator: "art. 1 et 50"}
    voir_aussi: [salaire-conventionnel, salaire-de-base-conventionnel, salaire-d-entree-conventionnel, avenant-convention-collective, convention-collective-sectorielle]
    fr:
      terme: Grille de salaires conventionnelle
      definition: >
        Tableau annexé à une convention collective de branche ou à l'un de ses
        avenants, qui donne le salaire de base de chaque catégorie professionnelle
        et, quand la grille en comporte, de chaque échelon. La convention
        collective cadre de 1973 renvoie les grilles de salaires et les indemnités
        aux conventions de branche (art. 1 et 50). Une convention peut porter
        plusieurs grilles : celle du textile de 1974 porte une grille des agents
        payés à l'heure, par catégorie et par échelon ; celle du bâtiment et des
        travaux publics de 1975 donne au personnel occasionnel un salaire horaire
        par catégorie, sans échelon.
      synonymes: [grille conventionnelle]
    ar:
      terme: جدول الأجور
      definition: >
        جدول ملحق باتفاقية مشتركة قطاعية أو بأحد ملاحقها التعديلية، يضبط الأجر
        الأساسي لكلّ صنف مهني، ولكلّ درجة إن كان الجدول يتضمّن درجات. وتحيل
        الاتفاقية المشتركة الإطارية لسنة 1973 جداول الأجور والمنح إلى الاتفاقيات
        القطاعية (الفصلان 1 و50). ويمكن أن تتضمّن الاتفاقية الواحدة عدّة جداول:
        فاتفاقية النسيج لسنة 1974 تتضمّن جدولًا للأعوان الخالصين بالساعة حسب الصنف
        والدرجة، واتفاقية البناء والأشغال العامة لسنة 1975 تضبط للعملة العرضيين
        أجرًا بالساعة لكلّ صنف، دون درجات.
      synonymes: [شبكات الأجور]

  - id: salaire-de-base-conventionnel
    acronyme: null
    statut: provisoire
    references: [avenant5-textile-1994]
    source_definition: {ref: decret2026-68, locator: "art. 1"}
    voir_aussi: [grille-de-salaires-conventionnelle, salaire-conventionnel, indemnite-complementaire-provisoire]
    fr:
      terme: Salaire de base (grilles conventionnelles)
      definition: >
        Montant qu'une grille de salaires conventionnelle inscrit pour une
        catégorie et un échelon, hors les indemnités de la convention —
        de transport et de présence notamment —, qui s'y ajoutent. Dans le
        textile, l'indemnité complémentaire provisoire est intégrée aux salaires
        de base à compter du 1er mai 1994 (avenant n° 5). Le décret n° 2026-68 du
        30 avril 2026 applique une hausse de 5 % par an, en 2026, 2027 et 2028,
        aux salaires de base de tous les échelons des dernières grilles annexées
        aux conventions sectorielles, ainsi qu'aux indemnités de transport et de
        présence.
      synonymes: []
    ar:
      terme: الأجر الأساسي
      definition: >
        المبلغ الذي يضبطه جدول الأجور الملحق باتفاقية مشتركة لصنف ودرجة
        معيَّنين، دون منح الاتفاقية — وخاصة منحة النقل ومنحة الحضور — التي
        تُضاف إليه. وفي قطاع النسيج، أُدمجت المنحة الإضافية المؤقتة في الأجور
        الأساسية بداية من غرّة ماي 1994 (الملحق التعديلي عدد 5). ويقرّ الأمر عدد
        68 لسنة 2026 المؤرخ في 30 أفريل 2026 زيادة بـ5 % سنويًا، في سنوات 2026
        و2027 و2028، في الأجور الأساسية لكلّ الدرجات بآخر جداول الأجور الملحقة
        بالاتفاقيات المشتركة القطاعية، وكذلك في منحتي النقل والحضور.
      synonymes: []

  - id: salaire-d-entree-conventionnel
    acronyme: null
    statut: provisoire
    references: [convention-textile-1974, convention-btp-1975, avenant18-textile-2024, avenant16-btp-2022]
    voir_aussi: [grille-de-salaires-conventionnelle, salaire-de-base-conventionnel, smig]
    fr:
      terme: Salaire d'entrée d'une grille conventionnelle
      definition: >
        Salaire de base de la catégorie et de l'échelon les plus bas d'une grille
        de salaires conventionnelle, hors indemnités ; c'est le bas de la grille,
        que l'on rapporte au SMIG horaire du régime de 48 heures pour mesurer ce
        qu'une convention ajoute au salaire minimum. Dans le textile, c'est le
        salaire horaire de l'agent payé à l'heure de la catégorie I, à l'échelon
        de confirmation, connu de 1974 à 2026 et sans interruption de 1994 à
        2026 ; dans le bâtiment et les travaux publics, celui du manœuvre
        ordinaire, dans la grille du personnel occasionnel, connu de 1974 à 2024
        et sans interruption de 1996 à 2024.
      synonymes: [salaire d'entrée, bas de grille]
    ar:
      terme: أدنى أجر في جدول الأجور
      definition: >
        الأجر الأساسي لأدنى صنف وأدنى درجة في جدول أجور ملحق باتفاقية مشتركة،
        دون المنح؛ وهو أسفل الجدول، ويُقارَن بالأجر الأدنى المضمون لمختلف المهن
        بالساعة في نظام 48 ساعة لقياس ما تضيفه الاتفاقية إلى الأجر الأدنى. وفي
        قطاع النسيج، هو أجر الساعة للعون الخالص بالساعة من الصنف الأول في درجة
        الترسيم، وهو معروف من 1974 إلى 2026 ودون انقطاع من 1994 إلى 2026؛ وفي
        قطاع البناء والأشغال العامة، هو أجر العامل العادي في جدول العملة
        العرضيين، وهو معروف من 1974 إلى 2024 ودون انقطاع من 1996 إلى 2024.
      synonymes: []

  - id: taux-de-couverture-negociation-collective
    acronyme: null
    statut: provisoire
    references: []
    source_definition: {ref: oit-ilostat-couverture-negociation-collective}
    voir_aussi: [convention-collective-sectorielle, agrement-convention-collective]
    fr:
      terme: Taux de couverture de la négociation collective
      definition: >
        Part des salariés que couvre une convention collective, en pourcentage du
        nombre de salariés. L'Organisation internationale du travail la publie
        pour la Tunisie dans sa base ILOSTAT, de 2010 à 2019, sans l'année 2015,
        sous l'intitulé « Collective bargaining coverage rate (%) » ; elle
        déclare pour source des fichiers administratifs, sans en préciser le
        producteur national ni la méthode, et ne publie ni le numérateur ni le
        dénominateur. Le taux porte sur les salariés pris ensemble : il ne mesure
        pas la part des salariés du secteur privé qu'une convention sectorielle
        couvre.
      synonymes: [taux de couverture conventionnelle]
    ar:
      terme: نسبة تغطية المفاوضة الجماعية
      definition: >
        نسبة الأجراء الذين تشملهم اتفاقية مشتركة، من مجموع عدد الأجراء. وتنشرها
        منظمة العمل الدولية بالنسبة إلى تونس في قاعدة بياناتها ILOSTAT، من سنة
        2010 إلى سنة 2019 باستثناء سنة 2015، تحت عنوان « Collective bargaining
        coverage rate (%) »؛ وتصرّح بأنّ مصدرها سجلات إدارية، دون تحديد الجهة
        الوطنية المنتجة لها ولا المنهجية، ولا تنشر البسط ولا المقام. وتتعلّق هذه
        النسبة بالأجراء مجتمعين: فهي لا تقيس نسبة أجراء القطاع الخاص الذين
        تشملهم اتفاقية مشتركة قطاعية.
      synonymes: []

  - id: indemnite-complementaire-provisoire
    acronyme: ICP
    statut: valide
    references: [decret82-501, decret2026-67]
    source_definition: {ref: decret81-437, locator: "art. 3"}
    source_traduction: {ref: decret81-437}
    voir_aussi: [smig]
    fr:
      terme: Indemnité complémentaire provisoire
      definition: >
        Indemnité instituée le 1er avril 1981 par le décret n° 81-437, servie en
        sus du salaire de base des salariés des secteurs non agricoles régis par le
        code du travail, et majorée au 1er février 1982 par le décret n° 82-501.
        Depuis 1981, elle est une composante du SMIG : les décrets qui le fixent,
        ainsi en 1992 et en 2000, le décomposent en salaire de base et indemnité
        complémentaire provisoire, et celui de 2026 précise encore qu'il la
        comprend.
      synonymes: []
    ar:
      terme: المنحة الإضافية المؤقتة
      definition: >
        منحة أُحدثت بداية من غرّة أفريل 1981 بالأمر عدد 437 لسنة 1981، تُصرف
        زيادة على الأجر الأساسي لأجراء القطاعات غير الفلاحية الخاضعة لمجلة الشغل،
        وتمّ الترفيع فيها بداية من غرّة فيفري 1982 بالأمر عدد 501 لسنة 1982. وهي
        منذ سنة 1981 أحد مكوّنات الأجر الأدنى المضمون لمختلف المهن: فالأوامر التي
        تضبطه، كما في سنتي 1992 و2000، تفصّله إلى أجر أساسي ومنحة إضافية مؤقتة،
        ويوضّح أمر سنة 2026 أنه يتضمّنها.
      synonymes: []

  - id: indemnite-cherte-de-vie
    acronyme: null
    statut: provisoire
    references: [decret74-63]
    source_definition: {ref: decret71-164, locator: "art. 2 et 5"}
    voir_aussi: [smig, indemnite-complementaire-provisoire]
    fr:
      terme: Indemnité de cherté de vie
      definition: >
        Indemnité instituée le 1er mai 1971 par le décret n° 71-164 dans
        l'industrie, le commerce et les professions libérales : 0,020 dinar
        l'heure, soit 4 dinars par mois pour les salariés payés au mois, en sus
        du salaire minimum. Elle n'entre ni dans l'assiette des cotisations ni
        dans le calcul des prestations sociales. Le SMIG fixé au 1er janvier 1974
        par le décret n° 74-63 l'intègre.
      synonymes: []
    ar:
      terme: منحة لغلو المعاش
      definition: >
        منحة أُحدثت بداية من غرّة ماي 1971 بالأمر عدد 164 لسنة 1971 في الصناعة
        والتجارة والمهن الحرة: 0,020 دينار في الساعة، أي 4 دنانير في الشهر
        للأجراء الخالصين بالشهر، زيادة على الأجر الأدنى. ولا تدخل في قاعدة
        المساهمات ولا في احتساب المنافع الاجتماعية. وقد أُدمجت في الأجر الأدنى
        المضمون لمختلف المهن المضبوط بداية من غرّة جانفي 1974 بالأمر عدد 63
        لسنة 1974.
      synonymes: []

  - id: commission-nationale-smig
    acronyme: null
    statut: provisoire
    references: [decret74-63]
    source_definition: {ref: decret74-493}
    voir_aussi: [smig, smag]
    fr:
      terme: Commission nationale du salaire minimum garanti
      definition: >
        Commission instituée par le décret n° 74-493 du 20 avril 1974. À son
        institution, en 1974, y siègent l'État, le Parti socialiste destourien,
        l'Union tunisienne de l'industrie, du commerce et de l'artisanat, l'Union
        nationale des agriculteurs et l'Union générale tunisienne du travail. Le
        même décret pose que le SMIG et le SMAG sont déterminés par décret. En
        1974, le décret n° 74-63 (art. 4) prévoit que le SMIG varie selon le coût
        de la vie, par arrêté, après avis de la commission.
      synonymes: []
    ar:
      terme: اللجنة الوطنية للأجر الأدنى المضمون
      definition: >
        لجنة أُحدثت بالأمر عدد 493 لسنة 1974 المؤرخ في 20 أفريل 1974. وتضمّ عند
        إحداثها سنة 1974 الدولة والحزب الاشتراكي الدستوري والاتحاد التونسي
        للصناعة والتجارة والصناعات التقليدية والاتحاد القومي للفلاحين والاتحاد
        العام التونسي للشغل. وينصّ الأمر نفسه على أن الأجر الأدنى المضمون لمختلف
        المهن والأجر الأدنى الفلاحي المضمون يُضبطان بأمر. وفي سنة 1974، ينصّ الأمر
        عدد 63 لسنة 1974 (الفصل 4) على تعديل الأجر الأدنى المضمون لمختلف المهن
        بحسب كلفة المعيشة، بقرار، بعد أخذ رأي اللجنة.
      synonymes: []

  - id: salaire-declare
    acronyme: null
    # AR : « الأجور المصرح بها » — CNSS, annuaire statistique 2010 (édition arabe),
    # table des matières et tableaux du titre III (« كتلة الأجور المصرح بها »,
    # « هرم الأجور المصرح بها للصندوق الوطني للضمان الاجتماعي ») ; même libellé dans
    # l'édition arabe 2013. Aucune clé bibliographique pour une édition arabe : pas de
    # source_traduction. Statut provisoire : la définition de l'assiette (art. 42 de la
    # loi n° 60-30) n'est pas établie sur texte ; pas de source_definition.
    statut: provisoire
    references: [cnss-annuaire-2006, cnss-annuaire-2018]
    voir_aussi: [salaire-moyen-declare, assiette-cotisations, cnss, rsna, indemnite-complementaire-provisoire, salaire-brut]
    fr:
      terme: Salaire déclaré
      definition: >
        Salaire qu'un employeur déclare à la CNSS pour un salarié, et sur lequel
        les cotisations sont calculées. Dans le régime des salariés non agricoles,
        cette assiette comprend, depuis la loi n° 95-101 (article 42 nouveau de la
        loi n° 60-30), l'ensemble des éléments du salaire, primes et avantages
        compris, sans plafond. Les annuaires statistiques de la CNSS, qui publient la masse
        et la distribution des salaires déclarés de 1970 à 2018, ne définissent pas
        le terme et ne le disent ni brut ni net. L'indemnité complémentaire
        provisoire, entrée dans le SMIG en 1981, reste alors hors de l'assiette des
        cotisations ; l'annuaire la compte dans les salaires déclarés à partir de
        1988.
      synonymes: [salaire déclaré à la CNSS]
    ar:
      terme: الأجر المصرّح به
      definition: >
        الأجر الذي يصرّح به المؤجّر للصندوق الوطني للضمان الاجتماعي عن كلّ أجير،
        وعليه تُحتسب الاشتراكات. وفي نظام الأجراء غير الفلاحيين، تشمل هذه
        القاعدة، منذ القانون عدد 101 لسنة 1995 (الفصل 42 جديد من القانون عدد 30
        لسنة 1960)، مجموع عناصر الأجر، بما فيها المنح والمنافع، دون سقف. والنشريات
        الإحصائية السنوية للصندوق، التي تنشر كتلة الأجور المصرّح بها وتوزيعها من
        سنة 1970 إلى سنة 2018، لا تعرّف هذه العبارة ولا تبيّن إن كان الأجر خامًا
        أو صافيًا. أمّا المنحة الإضافية المؤقتة، التي أُدرجت في الأجر الأدنى
        المضمون لمختلف المهن سنة 1981، فقد بقيت حينها خارج قاعدة الاشتراكات، ولا
        تحتسبها النشرية ضمن الأجور المصرّح بها إلّا بداية من سنة 1988.
      synonymes: [الأجور المصرّح بها]

  - id: salaire-moyen-declare
    acronyme: null
    # AR attesté : « معدل الأجر السنوي المصرح به » — CNSS, annuaire statistique 2010
    # (édition arabe), table des matières et tableau « تطور عدد المؤجرين النشيطين،
    # الأجراء المصرح بهم، كتلة الأجور ومعدل الأجر » ; même libellé dans l'édition arabe
    # 2013. Aucune clé bibliographique pour une édition arabe : pas de source_traduction.
    statut: valide
    references: [cnss-annuaire-2006, cnss-annuaire-2013, ins-guide-salaires-prive-2026]
    source_definition: {ref: cnss-annuaire-2018, locator: "p. 16"}
    voir_aussi: [salaire-declare, salarie-permanent, rsna, cnss]
    fr:
      terme: Salaire moyen déclaré
      definition: >
        Quotient que l'annuaire statistique de la CNSS imprime pour le régime des
        salariés non agricoles : la masse des salaires déclarés de l'année divisée
        par le nombre de salariés déclarés au moins une fois dans l'année, en
        dinars par an. Les années incomplètes l'abaissent : en 2013, il est de
        8 495 dinars pour l'ensemble des salariés déclarés et de 11 036 dinars pour
        ceux qui le sont les quatre trimestres. Les annuaires le donnent de 1970 à
        2018, dans deux éditions qui ne se raccordent pas : celle de 2006 pour
        1970-1999 et 2002-2006, celle de 2018 pour 2000-2018. Il ne se confond pas
        avec le taux d'évolution du salaire moyen que l'INS tire des mêmes
        déclarations de 2001 à 2025 : ce taux suit des salariés déclarés cinq
        trimestres de suite et ne donne aucun niveau.
      synonymes: [salaire annuel moyen déclaré]
    ar:
      terme: معدّل الأجر السنوي المصرّح به
      definition: >
        حاصل قسمة تنشره النشرية الإحصائية السنوية للصندوق الوطني للضمان الاجتماعي
        بعنوان نظام الأجراء غير الفلاحيين: كتلة الأجور المصرّح بها خلال السنة
        مقسومة على عدد الأجراء المصرّح بهم مرّة واحدة على الأقلّ خلال السنة،
        بالدينار في السنة. وتخفّضه السنوات غير الكاملة: ففي سنة 2013 يبلغ
        8 495 دينارًا لمجموع الأجراء المصرّح بهم و11 036 دينارًا للمصرّح بهم طيلة
        الثلاثيات الأربع. وتورده النشريات من سنة 1970 إلى سنة 2018، في طبعتين لا
        تتّصل سلسلتاهما: طبعة 2006 للفترتين 1970-1999 و2002-2006، وطبعة 2018
        للفترة 2000-2018. ولا يُخلط بينه وبين نسبة تطوّر معدّل الأجر التي يستخرجها
        المعهد الوطني للإحصاء من التصاريح نفسها من سنة 2001 إلى سنة 2025: فهذه
        النسبة تتابع أجراء مصرّحًا بهم خمس ثلاثيات متتالية ولا تعطي أيّ مستوى
        للأجر.
      synonymes: []

  - id: salarie-permanent
    acronyme: null
    # AR provisoire : aucun texte arabe de l'INS lu (le guide de 2026 et les rapports de
    # l'enquête « Emploi et salaires » consultés sont en français).
    statut: provisoire
    references: [ins-ees-2012, ins-micro-entreprises-2012, ins-micro-entreprises-2016]
    source_definition: {ref: ins-guide-salaires-prive-2026, locator: "§ 3"}
    voir_aussi: [salaire-moyen-declare, micro-entreprise, salaire-declare]
    fr:
      terme: Salarié permanent
      definition: >
        Terme que deux sources de l'INS emploient en deux sens. Pour le taux
        d'évolution trimestriel des salaires du secteur privé non agricole, c'est
        le salarié déclaré à la CNSS de manière continue au cours des cinq derniers
        trimestres : ces salariés forment l'échantillon fixe sur lequel le taux est
        calculé, selon le guide méthodologique que l'INS publie en 2026. Dans
        l'enquête « Emploi et salaires » auprès des entreprises de six salariés et
        plus, dont le rapport de 2012 donne la définition, c'est le salarié qui
        fait partie intégrante de l'entreprise, par opposition à l'occasionnel,
        recruté à titre temporaire pour renforcer l'effectif ; la distinction ne
        repose pas sur le type de contrat. Les rapports de l'enquête sur les
        micro-entreprises (2012, 2016) ne définissent pas le terme : ils opposent
        les personnes employées de façon permanente dans l'entreprise à l'emploi
        occasionnel.
      synonymes: [permanent]
    ar:
      terme: أجير قارّ
      definition: >
        عبارة يستعملها مصدران للمعهد الوطني للإحصاء بمعنيين. ففي نسبة التطوّر
        الثلاثية للأجور في القطاع الخاصّ غير الفلاحي، هو الأجير المصرّح به لدى
        الصندوق الوطني للضمان الاجتماعي بصفة متواصلة خلال الثلاثيات الخمس الأخيرة:
        ويكوّن هؤلاء الأجراء العيّنة الثابتة التي تُحتسب عليها النسبة، حسب الدليل
        المنهجي الذي نشره المعهد سنة 2026. وفي مسح « التشغيل والأجور » لدى
        المؤسسات التي تشغّل ستّة أجراء فأكثر، الذي يورد تقريره لسنة 2012 التعريف،
        هو الأجير الذي يُعدّ جزءًا لا يتجزّأ من المؤسسة، مقابل الأجير الوقتي
        المنتدب بصفة ظرفية لتدعيم عدد العاملين؛ ولا يقوم هذا التمييز على نوع
        العقد. أمّا تقارير المسح حول المؤسسات الصغرى (2012 و2016) فلا تعرّف
        العبارة: وإنّما تقابل بين الأشخاص المشغَّلين بصفة قارّة في المؤسسة والتشغيل
        الوقتي.
      synonymes: []

  - id: micro-entreprise
    acronyme: null
    # AR provisoire : aucun rapport arabe de l'enquête de l'INS lu.
    statut: provisoire
    references: [ins-micro-entreprises-2007, ins-micro-entreprises-2012]
    source_definition: {ref: ins-micro-entreprises-2016, locator: "p. 9-10"}
    voir_aussi: [salarie-permanent, emploi-informel]
    fr:
      terme: Micro-entreprise
      definition: >
        Dans les enquêtes de l'INS, entreprise non agricole employant moins de six
        salariés. Les rapports des enquêtes de 2007, 2012 et 2016 portent sur celles
        qui ne tiennent pas de comptabilité ; en 2016, le champ est en outre limité
        aux entreprises dont le chiffre d'affaires est inférieur à un million de
        dinars. Les entreprises de six salariés et plus relèvent d'une autre
        enquête de l'INS, l'enquête « Emploi et salaires ».
      synonymes: []
    ar:
      terme: مؤسسة صغرى
      definition: >
        في مسوح المعهد الوطني للإحصاء، مؤسسة غير فلاحية تشغّل أقلّ من ستّة أجراء.
        وتتناول تقارير مسوح سنوات 2007 و2012 و2016 المؤسسات التي لا تمسك محاسبة؛
        وفي سنة 2016 يقتصر الميدان كذلك على المؤسسات التي يقلّ رقم معاملاتها عن
        مليون دينار. أمّا المؤسسات التي تشغّل ستّة أجراء فأكثر فيشملها مسح آخر
        للمعهد، هو مسح « التشغيل والأجور ».
      synonymes: []

  - id: smig-reference-cnss
    acronyme: null
    # Notion analytique du précis : l'annuaire ne nomme pas ce montant. AR provisoire.
    # Pour mémoire, l'annuaire arabe 2010 de la CNSS intitule sa pyramide « حسب الأجر
    # الأدنى المضمون مهنيا في القطاع غير الفلاحي », là où le JORT écrit « الأجر الأدنى
    # المضمون لمختلف المهن » (terme du glossaire, entrée `smig`).
    statut: provisoire
    references: [cnss-annuaire-2013]
    source_definition: {ref: cnss-annuaire-2018, locator: "p. 24-27"}
    voir_aussi: [smig, salaire-declare, salaire-minimum-garanti]
    fr:
      terme: SMIG de référence de la CNSS
      definition: >
        Montant que l'annuaire statistique de la CNSS imprime sous sa pyramide des
        salaires déclarés en dinars, et qui sert d'unité à sa pyramide exprimée en
        SMIG, de 2000 à 2018. Il vaut 200 heures au taux horaire du SMIG du régime
        de 48 heures — 290,200 dinars en 2013 —, ce que l'annuaire n'écrit pas et
        que les montants établissent. Il est inférieur au SMIG mensuel de ce
        régime, qui compte 208 heures, soit 301,808 dinars en 2013 : un salaire
        déclaré inférieur à un SMIG de référence n'est pas pour autant inférieur au
        salaire minimum légal.
      synonymes: [SMIG de référence]
    ar:
      terme: الأجر الأدنى المرجعي المعتمد لدى الصندوق الوطني للضمان الاجتماعي
      definition: >
        المبلغ الذي تورده النشرية الإحصائية السنوية للصندوق الوطني للضمان
        الاجتماعي أسفل هرم الأجور المصرّح بها بالدينار، وتتّخذه وحدةً لهرمها
        المعبَّر عنه بالأجر الأدنى، من سنة 2000 إلى سنة 2018. ويساوي 200 ساعة
        بأجر الساعة للأجر الأدنى المضمون لمختلف المهن في نظام عمل 48 ساعة، أي
        290,200 دينارًا سنة 2013، وهو ما لا تذكره النشرية وتثبته المبالغ. وهو
        أقلّ من الأجر الأدنى الشهري لهذا النظام، المحتسب على 208 ساعات، أي
        301,808 دينارًا سنة 2013: فالأجر المصرّح به الذي يقلّ عن أجر أدنى مرجعي
        واحد ليس بالضرورة أقلّ من الأجر الأدنى القانوني.
      synonymes: []

  - id: salaire-brut
    acronyme: null
    statut: provisoire
    references: [oit-cist12-1973-salaires]
    source_definition: {ref: loi96-62, locator: "art. 134-2 et 143"}
    voir_aussi: [salaire-net, cout-du-travail]
    fr:
      terme: Salaire brut
      definition: >
        Rémunération due au travailleur avant toute retenue : salaire de base et
        accessoires, indemnités et avantages en espèces ou en nature, à
        l'exception des remboursements de frais (code du travail, art. 134-2).
        Le bulletin de paie en indique le montant, puis la nature et le montant
        des retenues opérées sur lui (art. 143). La statistique internationale
        retient la même notion : la rémunération totale avant les retenues de
        l'employeur au titre des impôts et des cotisations du salarié.
      synonymes: [rémunération brute]
    ar:
      terme: الأجر الخام
      definition: >
        الأجر المستحقّ للعامل قبل أيّ خصم: الأجر الأساسي وتوابعه من منح ومنافع
        نقدية أو عينية، باستثناء ما يكتسي صبغة استرجاع مصاريف (مجلة الشغل، الفصل
        134-2). وتبيّن بطاقة الخلاص مبلغه ثمّ نوع الخصومات المجراة عليه ومبلغها
        (الفصل 143).
      synonymes: []

  - id: salaire-net
    acronyme: null
    statut: provisoire
    references: []
    source_definition: {ref: loi96-62, locator: "art. 143"}
    voir_aussi: [salaire-brut, cout-du-travail]
    fr:
      terme: Salaire net
      definition: >
        Rémunération effectivement perçue par le travailleur, une fois opérées
        sur la rémunération brute les retenues — cotisations sociales du salarié,
        impôt retenu à la source. Le bulletin de paie en porte le montant (code du
        travail, art. 143).
      synonymes: [rémunération nette]
    ar:
      terme: الأجر الصافي
      definition: >
        الأجر الذي يتقاضاه العامل فعلًا بعد إجراء الخصومات على الأجر الخام، من
        مساهمات اجتماعية محمولة على الأجير وضريبة محجوزة من المورد. وتبيّن بطاقة
        الخلاص مبلغه (مجلة الشغل، الفصل 143).
      synonymes: []

  - id: cout-du-travail
    acronyme: null
    statut: provisoire
    references: []
    source_definition: {ref: oit-cist11-1966-cout-travail, locator: "§ 3"}
    voir_aussi: [salaire-brut, salaire-net, taux-global]
    fr:
      terme: Coût du travail
      definition: >
        Coût supporté par l'employeur pour l'emploi de main-d'œuvre : la
        rémunération du travail, y compris le temps payé non travaillé, les primes
        et les avantages en nature, augmentée des dépenses de sécurité sociale de
        l'employeur, des frais de formation, des services sociaux et des impôts
        assis sur l'emploi ou les salaires (résolution de la onzième Conférence
        internationale des statisticiens du travail, 1966, § 3).
      synonymes: []
    ar:
      terme: كلفة العمل
      definition: >
        الكلفة التي يتحمّلها المؤجر لتشغيل اليد العاملة: أجر العمل، بما في ذلك
        الوقت المدفوع غير المعمول والمنح والمنافع العينية، تُضاف إليه نفقات
        الضمان الاجتماعي المحمولة على المؤجر ونفقات التكوين والخدمات الاجتماعية
        والأداءات الموظَّفة على التشغيل أو على الأجور (قرار المؤتمر الدولي الحادي
        عشر لخبراء إحصاءات العمل، 1966، الفقرة 3).
      synonymes: []

  # --- Temps de travail et congés (volume marché du travail) — passe 1 : termes ---
  # Termes AR lus dans l'édition arabe du JORT. Code du travail de 1966 : JORT ar.
  # n° 21 des 10-13 mai 1966, lu à l'image. Loi n° 96-62 : JORT ar. n° 59 du
  # 23 juillet 1996, lu à l'image. Lois n° 2021-37, 2024-44 et 2025-9 : couche texte.

  - id: duree-legale-travail
    acronyme: null
    # AR : « مدة الشغل », intitulé du titre VI du code (p. 873, image) ; art. 79 :
    # « مدة الشغل الذي يقع القيام به فعليا ». « مدة العمل » : loi n° 96-62, art. 83
    # nouveau (p. 1636, image) ; loi n° 2021-37, art. 13 (couche texte). Aucun
    # équivalent attesté de « légale » : terme sans qualificatif.
    statut: provisoire
    references: [loi66-27, loi96-62]
    source_definition: {ref: loi66-27, locator: "art. 79"}
    source_traduction: {ref: loi66-27, locator: "art. 79"}
    voir_aussi: [regime-horaire, heures-supplementaires, travail-temps-partiel]
    fr:
      terme: Durée légale du travail
      definition: >
        Durée maximale du travail effectif fixée par le code du
        travail : 48 heures par semaine dans les activités non
        agricoles, ou une limitation équivalente sur une période d'un
        an au plus. Depuis 1996, une convention collective ou un texte
        réglementaire peut la ramener jusqu'à 40 heures (code du
        travail, art. 79, rédaction de la loi n° 96-62). Les heures
        faites au-delà sont des heures supplémentaires.
      synonymes: [durée du travail, durée du travail effectif]
    ar:
      terme: مدة الشغل
      definition: >
        المدة القصوى للشغل الفعلي التي تضبطها مجلة الشغل: ثمان وأربعون
        ساعة في الأسبوع في الأنشطة غير الفلاحية، أو تحديد معادل لها
        على فترة لا تتجاوز سنة. ومنذ 1996 يمكن التخفيض فيها إلى أربعين
        ساعة بمقتضى اتفاقية مشتركة أو نص ترتيبي (مجلة الشغل، الفصل 79،
        كما نقّح بالقانون عدد 62 لسنة 1996). والساعات المنجزة بعدها
        ساعات إضافية.
      synonymes: [مدة العمل]

  - id: regime-horaire
    acronyme: null
    # FR : « régime de travail à plein temps de 48 heures par semaine », loi n° 96-62,
    # art. 90 nouveau (éd. fr., couche texte). AR : « نظام عمل كامل الوقت 48 ساعة في
    # الأسبوع », même article (p. 1636, image) ; 1966 : « نظام اسبوع الثمان والاربعين
    # ساعة », art. 90 (p. 874, image).
    statut: valide
    references: [loi96-62, loi66-27]
    source_definition: {ref: loi96-62, locator: "art. 90"}
    source_traduction: {ref: loi96-62, locator: "art. 90"}
    voir_aussi: [duree-legale-travail, heures-supplementaires]
    fr:
      terme: Régime de travail à plein temps
      definition: >
        Durée hebdomadaire normale applicable dans une entreprise ou
        une branche, qui sert de seuil aux heures supplémentaires :
        régime de 48 heures par semaine, fixé par le code, ou régime
        réduit, de 40 heures au moins, fixé par convention collective
        ou par texte réglementaire (code du travail, art. 79 et 90,
        rédaction de la loi n° 96-62). La majoration des heures
        supplémentaires et le montant du salaire minimum dépendent du
        régime.
      synonymes: [régime horaire, régime de 48 heures, régime de 40 heures]
    ar:
      terme: نظام عمل كامل الوقت
      definition: >
        المدة الأسبوعية العادية المطبقة في مؤسسة أو قطاع، وهي العتبة
        التي تُحتسب بعدها الساعات الإضافية: نظام ثمان وأربعين ساعة في
        الأسبوع الذي تضبطه المجلة، أو نظام أقل لا يقل عن أربعين ساعة
        تضبطه اتفاقية مشتركة أو نص ترتيبي (مجلة الشغل، الفصلان 79 و90،
        كما نقّحا بالقانون عدد 62 لسنة 1996). ويتوقف على النظام مقدار
        الزيادة في أجر الساعات الإضافية ومبلغ الأجر الأدنى.
      synonymes: [نظام أسبوع الثمان والأربعين ساعة]

  - id: heures-supplementaires
    acronyme: null
    # AR : « الساعات الزائدة », intitulé de la section II du titre VI du code
    # (p. 874, image) ; « ساعات عمل زائدة », loi n° 96-62, art. 90 nouveau (p. 1636,
    # image). « الساعات الإضافية » : loi n° 2021-37, art. 13 (couche texte) et
    # convention cadre agricole de 2015, art. 12 (selon la note documentaire).
    # Terme principal الساعات الإضافية : décision du propriétaire du 20/10/2026.
    statut: valide
    references: [loi66-27, loi96-62, loi2021-37]
    source_definition: {ref: loi96-62, locator: "art. 90"}
    source_traduction: {ref: loi2021-37, locator: "art. 13"}
    voir_aussi: [duree-legale-travail, regime-horaire]
    fr:
      terme: Heures supplémentaires
      definition: >
        Heures de travail effectuées au-delà de la durée normale du
        régime applicable. Depuis 1996, elles sont majorées de 75 % du
        salaire de base horaire dans le régime de 48 heures ; dans un
        régime inférieur, de 25 % jusqu'à 48 heures et de 50 % au-delà
        ; pour le salarié à temps partiel, de 50 % (code du travail,
        art. 90, rédaction de la loi n° 96-62).
      synonymes: []
    ar:
      terme: الساعات الإضافية
      definition: >
        ساعات العمل المنجزة بعد المدة العادية للنظام المطبق. ومنذ 1996
        يُزاد في أجرها بنسبة 75 بالمائة من الأجر الأساسي للساعة في
        نظام ثمان وأربعين ساعة، وفي نظام أقل بنسبة 25 بالمائة إلى حدود
        ثمان وأربعين ساعة و50 بالمائة بعدها، وللعامل لوقت جزئي بنسبة
        50 بالمائة (مجلة الشغل، الفصل 90، كما نقّح بالقانون عدد 62
        لسنة 1996).
      synonymes: [الساعات الزائدة]

  - id: conge-annuel-paye
    acronyme: null
    # AR : titre IX du code « الرخص السنوية الخالصة » ; art. 112 : « رخصة خالصة
    # الأجر » (p. 876, image). « الراحة السنوية » : loi n° 2021-37, art. 14 ;
    # « عطلة الاستراحة السنوية » : loi n° 2024-44, art. 4 (couche texte).
    statut: provisoire
    references: [loi66-27, loi96-62]
    source_definition: {ref: loi66-27, locator: "art. 112"}
    source_traduction: {ref: loi66-27, locator: "art. 112"}
    voir_aussi: [indemnite-compensatrice-conge, jours-feries-chomes-payes]
    fr:
      terme: Congé annuel payé
      definition: >
        Congé auquel le salarié a droit chaque année, après un mois de
        travail effectif chez le même employeur : un jour ouvrable par
        mois de travail, au plus 12 jours ouvrables, davantage pour
        les jeunes salariés, plus un jour ouvrable par cinq ans
        d'ancienneté, au plus 18 jours ouvrables (code du travail,
        art. 112 à 115). Depuis 1996, l'indemnité de congé est égale
        au salaire et aux indemnités habituellement perçus (art. 119,
        rédaction de la loi n° 96-62).
      synonymes: [congé payé]
    ar:
      terme: الرخصة السنوية الخالصة الأجر
      definition: >
        رخصة يستحقها الأجير كل سنة بعد شهر من العمل الفعلي لدى نفس
        المؤجر: يوم عمل عن كل شهر عمل، في حدود اثني عشر يوم عمل، وأكثر
        للأجراء الشبان، يُضاف إليها يوم عمل عن كل خمس سنوات أقدمية في
        حدود ثمانية عشر يوم عمل (مجلة الشغل، الفصول من 112 إلى 115).
        ومنذ 1996 تساوي منحة الرخصة الأجر والمنح التي يتقاضاها الأجير
        عادة (الفصل 119، كما نقّح بالقانون عدد 62 لسنة 1996).
      synonymes: [الراحة السنوية, عطلة الاستراحة السنوية]

  - id: indemnite-compensatrice-conge
    acronyme: null
    # AR non attesté comme locution : l'art. 120 du code dit que le travailleur
    # « يتقاضى في مقابل الجزء الذي لم يتمتع به من الرخصة منحة تعويض » (p. 877,
    # image). Terme construit sur cette tournure, à confirmer. À ne pas confondre
    # avec `indemnite-compensatrice` (المنحة التعويضية, rémunérations publiques).
    statut: provisoire
    references: [loi66-27]
    source_definition: {ref: loi66-27, locator: "art. 120"}
    voir_aussi: [conge-annuel-paye, indemnite-compensatrice]
    fr:
      terme: Indemnité compensatrice de congé payé
      definition: >
        Somme versée au salarié dont le contrat prend fin avant qu'il
        ait pris tout son congé annuel payé, pour la fraction de congé
        non prise. Elle n'est pas due en cas de faute lourde du
        salarié (code du travail, art. 120).
      synonymes: [indemnité compensatrice de congé]
    ar:
      terme: منحة التعويض عن الرخصة
      definition: >
        مبلغ يُصرف للأجير الذي ينتهي عقده قبل أن يتمتع بكامل رخصته
        السنوية الخالصة الأجر، مقابل الجزء الذي لم يتمتع به منها. ولا
        يُستحق في صورة الخطأ الفادح من الأجير (مجلة الشغل، الفصل 120).
      synonymes: []

  - id: jours-feries-chomes-payes
    acronyme: null
    # AR : « أيام الأعياد التي يبطل فيها العمل مع خلاص الأجر », intitulé de la loi
    # n° 88-55 (sommaire du JORT ar. n° 37 du 3 juin 1988, p. 806, image ; miroir
    # iort ; texte de la loi non lu). « أيام عطلة خالصة الأجر » : art. 445 nouveau,
    # loi n° 91-15 (JORT ar. n° 17 de 1991, p. 381, image). « أيام الأعياد والعطل
    # الخالصة » : intitulé du titre VIII du code (p. 876, image).
    statut: valide
    references: [loi66-27, loi63-55, loi88-55, loi91-15, dl2011-51, dl2021-11]
    source_definition: {ref: loi66-27, locator: "art. 445"}
    source_traduction: {ref: loi88-55}
    voir_aussi: [conge-annuel-paye, repos-hebdomadaire]
    fr:
      terme: Jours fériés chômés et payés
      definition: >
        Jours pendant lesquels le travail est suspendu sans perte de
        salaire. Le code du travail en donne la liste (art. 445) : six
        jours depuis 1991, liste dans sa rédaction du décret-loi
        n° 2021-11, en vigueur depuis le 15 décembre 2021. La convention
        collective cadre en ajoute pour les activités non agricoles.
        Le salarié qui travaille un jour férié dans une activité
        continue reçoit, en plus de son salaire, une indemnité égale à
        celui-ci (art. 109).
      synonymes: [jours fériés payés]
    ar:
      terme: أيام الأعياد التي يبطل فيها العمل مع خلاص الأجر
      definition: >
        أيام يتوقف فيها العمل دون نقص في الأجر. وتضبط مجلة الشغل
        قائمتها (الفصل 445): ستة أيام منذ 1991، والقائمة كما نقّحها
        المرسوم عدد 11 لسنة 2021 النافذ منذ 15 ديسمبر 2021. وتضيف إليها الاتفاقية
        المشتركة الإطارية أيامًا في الأنشطة غير الفلاحية. ويتقاضى
        الأجير الذي يعمل يوم عيد في نشاط مستمر منحة تساوي أجره زيادة
        على هذا الأجر (الفصل 109).
      synonymes: [أيام عطلة خالصة الأجر, أيام الأعياد والعطل الخالصة]

  - id: repos-hebdomadaire
    acronyme: null
    # AR : intitulé du titre VII du code « الراحة الأسبوعية » ; art. 95 (p. 874,
    # image) ; loi n° 2025-9 (couche texte) ; loi n° 2021-37, art. 14 : « راحة
    # أسبوعية ».
    statut: valide
    references: [loi66-27, loi96-62]
    source_definition: {ref: loi66-27, locator: "art. 95"}
    source_traduction: {ref: loi66-27, locator: "art. 95"}
    voir_aussi: [jours-feries-chomes-payes, duree-legale-travail]
    fr:
      terme: Repos hebdomadaire
      definition: >
        Repos de 24 heures consécutives auquel le salarié a droit
        chaque semaine, le vendredi, le samedi ou le dimanche (code du
        travail, art. 95). Depuis 1996, un autre jour peut être fixé
        par accord ou par autorisation du gouverneur (art. 95,
        rédaction de la loi n° 96-62).
      synonymes: []
    ar:
      terme: الراحة الأسبوعية
      definition: >
        راحة مدتها أربع وعشرون ساعة متتالية يستحقها الأجير كل أسبوع،
        يوم الجمعة أو السبت أو الأحد (مجلة الشغل، الفصل 95). ومنذ 1996
        يمكن تعيين يوم آخر بالاتفاق أو بترخيص من الوالي (الفصل 95، كما
        نقّح بالقانون عدد 62 لسنة 1996).
      synonymes: []

  - id: travail-temps-partiel
    acronyme: null
    # AR : « العمل لوقت جزئي », loi n° 96-62, art. 94-2 (p. 1636, image) ; loi
    # n° 2025-9, art. 94-2 nouveau, al. 1 (couche texte).
    statut: valide
    references: [loi96-62, loi2025-9]
    source_definition: {ref: loi96-62, locator: "art. 94-2"}
    source_traduction: {ref: loi96-62, locator: "art. 94-2"}
    voir_aussi: [regime-horaire, heures-supplementaires]
    fr:
      terme: Travail à temps partiel
      definition: >
        Travail dont la durée ne dépasse pas 70 % de la durée normale
        du travail de l'entreprise, régi depuis 1996 par une section
        du code du travail (art. 94-2 à 94-14, ajoutés par la loi n°
        96-62). Les heures supplémentaires du salarié à temps partiel
        ne dépassent pas le tiers de la durée de son contrat et sont
        majorées de 50 % (art. 90 et 94-6). La loi n° 2025-9 a récrit
        l'alinéa qui le définit sans changer cette limite.
      synonymes: [temps partiel]
    ar:
      terme: العمل لوقت جزئي
      definition: >
        عمل لا تتجاوز مدته 70 بالمائة من المدة العادية للعمل في
        المؤسسة، تنظمه منذ 1996 الفصول من 94-2 إلى 94-14 من مجلة الشغل،
        المضافة بالقانون عدد 62 لسنة 1996. ولا تتجاوز الساعات
        الإضافية للعامل لوقت جزئي ثلث مدة عقده، ويُزاد في أجرها بنسبة
        50 بالمائة (الفصلان 90 و94-6). وأعاد القانون عدد 9 لسنة 2025
        صياغة الفقرة التي تعرّفه دون تغيير هذا الحد.
      synonymes: []

  - id: travail-de-nuit
    acronyme: null
    # AR : « العمل الليلي », loi n° 2025-9 (couche texte). L'art. 66 nouveau (loi
    # n° 96-62, p. 1635, image) n'emploie pas le substantif : « تشغيل ... ليلا خلال
    # فترة اثنتي عشرة ساعة » ; l'art. 68-2 dit « الفترة الليلية ».
    statut: valide
    references: [loi96-62, loi2025-9]
    source_definition: {ref: loi96-62, locator: "art. 66"}
    source_traduction: {ref: loi2025-9}
    voir_aussi: [duree-legale-travail]
    fr:
      terme: Travail de nuit
      definition: >
        Travail effectué pendant la période de nuit. Depuis 1996, il
        est interdit aux femmes et aux moins de 18 ans pendant une
        période de 12 heures consécutives comprenant l'intervalle de
        22 heures à 6 heures (code du travail, art. 66, rédaction de
        la loi n° 96-62). Le code ne le majore pas ; les conventions
        de branche peuvent le faire.
      synonymes: []
    ar:
      terme: العمل الليلي
      definition: >
        العمل المنجز خلال الفترة الليلية. ومنذ 1996 يُمنع تشغيل النساء
        ومن سنّهم دون الثامنة عشرة ليلًا خلال فترة اثنتي عشرة ساعة
        متتالية تشمل الفترة الممتدة من الساعة العاشرة ليلًا إلى الساعة
        السادسة صباحًا (مجلة الشغل، الفصل 66، كما نقّح بالقانون عدد 62
        لسنة 1996). ولا تنص المجلة على زيادة في أجره، ويمكن للاتفاقيات
        القطاعية أن تنص عليها.
      synonymes: []

  - id: conge-paternite
    acronyme: null
    # AR : « عطلة الأبوة », loi n° 2024-44, art. 2 (définition) et 5 (couche texte) ;
    # loi n° 2021-37, art. 15 : « عطلة أبوة ».
    statut: valide
    references: [loi2024-44, loi66-27]
    source_definition: {ref: loi2024-44, locator: "art. 2"}
    source_traduction: {ref: loi2024-44, locator: "art. 2"}
    voir_aussi: [conge-annuel-paye]
    fr:
      terme: Congé de paternité
      definition: >
        Congé accordé au père à la naissance d'un enfant. Depuis le 13
        août 2024, il est de sept jours à plein traitement, dix en cas
        de naissances multiples, d'enfant handicapé ou prématuré,
        trois en cas d'enfant mort-né, à prendre dans les trente jours
        (loi n° 2024-44, art. 2 et 5). Le code du travail accordait
        auparavant un jour.
      synonymes: []
    ar:
      terme: عطلة الأبوة
      definition: >
        عطلة تُمنح للأب عند ولادة طفل. ومنذ 13 أوت 2024 مدتها سبعة
        أيام بأجر كامل، وعشرة أيام في صورة الولادات المتعددة أو ولادة
        طفل ذي إعاقة أو قبل الأوان، وثلاثة أيام في صورة ولادة طفل ميت،
        تُؤخذ خلال الثلاثين يومًا (القانون عدد 44 لسنة 2024، الفصلان 2
        و5). وكانت مجلة الشغل تمنح قبل ذلك يومًا واحدًا.
      synonymes: []

  - id: travail-domestique
    acronyme: null
    # AR : « العمل المنزلي », intitulé et art. 3 (définition) de la loi n° 2021-37
    # (couche texte). Notion distincte de `employes-de-maison` (catégorie de
    # cotisants du décret n° 95-538).
    statut: valide
    references: [loi2021-37]
    source_definition: {ref: loi2021-37, locator: "art. 3"}
    source_traduction: {ref: loi2021-37, locator: "art. 3"}
    voir_aussi: [employes-de-maison]
    fr:
      terme: Travail domestique
      definition: >
        Travaux liés au domicile ou à la famille qu'une personne
        accomplit de manière continue et habituelle pour un ou
        plusieurs employeurs (loi n° 2021-37, art. 3). Depuis le 30
        janvier 2022, cette loi en fixe la durée — 48 heures par
        semaine —, les congés et le salaire, qui ne peut être
        inférieur au salaire minimum du régime de 48 heures ; le code
        du travail s'applique en ce qu'elle ne contredit pas (art. 4,
        11, 13 et 14).
      synonymes: []
    ar:
      terme: العمل المنزلي
      definition: >
        الأعمال المرتبطة بالمنزل أو بالأسرة التي يؤديها شخص بصفة
        مستمرة واعتيادية لفائدة مؤجر أو أكثر (القانون عدد 37 لسنة
        2021، الفصل 3). ومنذ 30 جانفي 2022 يضبط هذا القانون مدة العمل،
        وهي ثمان وأربعون ساعة في الأسبوع، والعطل والأجر الذي لا يقل عن
        الأجر الأدنى لنظام ثمان وأربعين ساعة، وتنطبق مجلة الشغل في ما
        لا يتعارض معه (الفصول 4 و11 و13 و14).
      synonymes: []

  - id: emploi-informel
    acronyme: null
    statut: provisoire
    references: []
    source_definition: {ref: oit-cist21-2023-informel, locator: "§ 56"}
    voir_aussi: [cout-du-travail]
    fr:
      terme: Emploi informel
      definition: >
        Toute activité exercée pour produire des biens ou fournir des services
        contre rémunération ou profit qui n'est pas couverte, en droit ou en
        pratique, par les dispositifs formels : droit commercial, déclaration des
        activités économiques, impôt sur le revenu, législation du travail,
        sécurité sociale (résolution de la vingt et unième Conférence
        internationale des statisticiens du travail, 2023, § 56). Elle comprend
        notamment les salariés dont la relation d'emploi n'est pas, en pratique,
        formellement reconnue par l'employeur ou ne donne pas un accès effectif à
        ces dispositifs.
      synonymes: [travail informel]
    ar:
      terme: التشغيل غير المنظّم
      definition: >
        كلّ نشاط يُمارَس لإنتاج سلع أو تقديم خدمات مقابل أجر أو ربح ولا تشمله،
        قانونًا أو فعلًا، الترتيبات الرسمية: القانون التجاري، والتصريح بالأنشطة
        الاقتصادية، والضريبة على الدخل، وتشريع الشغل، والضمان الاجتماعي (قرار
        المؤتمر الدولي الحادي والعشرين لخبراء إحصاءات العمل، 2023، الفقرة 56).
      synonymes: []

  # --- Politiques de l'emploi (volume « Le marché du travail », chapitre « Les politiques
  # de l'emploi ») ---
  # Passes 1 et 2 du 6 octobre 2026. Les entrées `valide` ont un terme arabe lu sur
  # l'édition arabe du texte cité en `source_traduction` : couche texte pour les fascicules
  # de 2017, 2019 et 2023 ; OCR relu à l'image pour ceux de 1993 (n° 36), 1999 (n° 105),
  # 2009 (n° 12), 2010 (n° 7) et 2011 (n° 38), dont la couche texte arabe est absente ou
  # inexploitable. L'entrée porte le nom du texte fondateur ; les appellations
  # ultérieures sont en synonymes et datées dans la définition.
  - id: fonds-national-emploi
    acronyme: FNE
    statut: valide
    references: [lf-2001, lf-2003, dl2011-16, decret2009-349, decret2012-2369, decret2019-542]
    source_definition: {ref: lf-2000, locator: "art. 13-14"}
    # Arabe : LF 2000, art. 13 (OCR) et intitulé de l'art. 15 (image) ; décret
    # n° 2009-349, art. 1er (image) ; décret gouvernemental n° 2019-542, art. 1er.
    source_traduction: {ref: lf-2000, locator: "art. 15"}
    voir_aussi: [fonds-special-tresor, fonds-formation-apprentissage, aneti, politique-active-emploi]
    fr:
      terme: Fonds national de l'emploi
      definition: >
        Compte spécial du Trésor créé par la loi de finances pour 2000 pour financer
        les opérations qui développent la qualification des demandeurs d'emploi et
        leurs possibilités d'emploi. Il est alimenté par des dons, par une part des
        produits de privatisation et, depuis 2001, par des taxes affectées ; son
        ordonnateur, d'abord celui de la présidence de la République, est depuis 2011
        le ministre chargé de l'emploi (décret-loi n° 2011-16). Depuis février 2009,
        il finance seul les programmes que fixent les décrets successifs (décret
        n° 2009-349, puis décrets de 2012 et de 2019) ; de 2003 à février 2009, le
        fonds qui paie les stages d'initiation à la vie professionnelle et le contrat
        emploi-formation n'est pas établi. Les rapports de la Banque centrale le
        nomment « Fonds national de l'emploi 21-21 ».
      synonymes: [Fonds 21-21]
    ar:
      terme: الصندوق الوطني للتشغيل
      definition: >
        حساب خاص في الخزينة أحدثه قانون المالية لسنة 2000 لتمويل العمليات التي
        ترفع من مؤهلات طالبي الشغل وتوفّر إمكانيات التشغيل. وتتأتّى موارده من
        الهبات ومن قسط من العائدات المتأتية من عمليات التخصيص، ومنذ سنة 2001 من
        معاليم مخصّصة له؛ وكان يأذن بدفع مصاريفه آمر الصرف لرئاسة الجمهورية ثم
        صار ذلك منذ سنة 2011 إلى الوزير المكلف بالتشغيل
        (المرسوم عدد 16 لسنة 2011). ومنذ فيفري 2009 صار يموّل وحده البرامج التي
        تضبطها الأوامر المتعاقبة (الأمر عدد 349 لسنة 2009 ثم أمرا سنتي 2012
        و2019)؛ أما من سنة 2003 إلى فيفري 2009 فالصندوق الذي يتحمّل نفقات تربصات
        الإعداد للحياة المهنية وعقد التشغيل والتكوين غير ثابت. وتسمّيه تقارير
        البنك المركزي «الصندوق الوطني للتشغيل 21-21».
      synonymes: []

  - id: fonds-formation-apprentissage
    acronyme: null
    statut: valide
    references: [lf-2003, lf-2018]
    source_definition: {ref: lf-2000, locator: "art. 17-18"}
    # Paire lue à l'image dans les deux éditions de la LF 2000, art. 17 (JORT n° 105 de
    # 1999). Le tableau des fonds spéciaux de la LF 2018 (JORT n° 101 de 2017) écrit en
    # français « fonds de promotion de la formation et de l'apprentissage
    # professionnel », en regard du même terme arabe.
    source_traduction: {ref: lf-2000, locator: "art. 17"}
    voir_aussi: [tfp, fonds-special-tresor, fonds-national-emploi, contrat-emploi-formation, sivp]
    fr:
      terme: Fonds de promotion de la formation professionnelle et de l'apprentissage
      definition: >
        Compte spécial du Trésor créé par la loi de finances pour 2000, dont
        l'ordonnateur est le ministre chargé de la formation professionnelle et dont
        la ressource est le produit de la taxe de formation professionnelle net des
        ristournes. Il finance la formation initiale et continue et l'apprentissage ;
        de 2000 à 2002, il finance aussi les stages d'initiation à la vie
        professionnelle et les contrats emploi-formation, que la loi de finances
        pour 2003 ne nomme plus parmi ses dépenses. De 2003 à février 2009, le fonds
        qui les paie n'est pas établi ; en février 2009, seul le stage des diplômés
        du supérieur passe au Fonds national de l'emploi, et le contrat
        emploi-formation cesse. La loi de finances pour 2018 l'intitule « fonds de
        promotion de la formation et de l'apprentissage professionnel ».
      synonymes: [Fonds de promotion de la formation et de l'apprentissage professionnel]
    ar:
      terme: صندوق النهوض بالتكوين والتدريب المهني
      definition: >
        حساب خاص في الخزينة أحدثه قانون المالية لسنة 2000، يأذن بدفع مصاريفه
        الوزير المكلف بالتكوين المهني، ومورده موارد الأداء على التكوين المهني
        صافية من العائدات. ويموّل التكوين الأساسي والمستمر والتدريب المهني؛ وموّل كذلك من
        سنة 2000 إلى سنة 2002 تربصات الإعداد للحياة المهنية وعقود التشغيل
        والتكوين، ولم يعد قانون المالية لسنة 2003 يذكرها ضمن نفقاته. ومن سنة 2003
        إلى فيفري 2009 الصندوق الذي يتحمّل نفقاتها غير ثابت؛ وفي فيفري 2009 لم
        يُحمل على الصندوق الوطني للتشغيل سوى تربص حاملي شهادات التعليم العالي،
        وانتهى العمل بعقد التشغيل والتكوين. ويرد في قانون المالية لسنة 2018
        بالتسمية العربية نفسها.
      synonymes: []

  - id: aneti
    acronyme: ANETI
    statut: valide
    references: [loi93-11]
    source_definition: {ref: decret2003-564}
    # Arabe lu au décret n° 2009-349, art. 1er (image) et au décret gouvernemental
    # n° 2019-542, art. 7 (couche texte) ; l'édition arabe du décret n° 2003-564 n'est
    # pas lue, et seul l'intitulé de ce décret est connu.
    source_traduction: {ref: decret2009-349, locator: "art. 1er"}
    voir_aussi: [fonds-national-emploi, politique-active-emploi, indemnite-de-stage]
    fr:
      terme: Agence nationale pour l'emploi et le travail indépendant
      definition: >
        Établissement public chargé du placement des demandeurs d'emploi et de la
        gestion des programmes d'emploi. C'est le nom que prend en 2003 l'Agence
        tunisienne de l'emploi, créée par la loi n° 93-11 du 17 février 1993. Elle
        reçoit du Fonds national de l'emploi les crédits des programmes et verse
        leurs indemnités aux bénéficiaires.
      synonymes: []
    ar:
      terme: الوكالة الوطنية للتشغيل والعمل المستقل
      definition: >
        مؤسسة عمومية مكلفة بتوظيف طالبي الشغل وبالتصرف في برامج التشغيل. وهي
        التسمية التي اتخذتها سنة 2003 الوكالة التونسية للتشغيل المحدثة بالقانون
        عدد 11 لسنة 1993 المؤرخ في 17 فيفري 1993. وتُحوَّل إليها من الصندوق الوطني
        للتشغيل اعتمادات البرامج، وتسند منحها إلى المنتفعين.
      synonymes: []

  - id: politique-active-emploi
    acronyme: null
    statut: provisoire
    references: [decret2012-2369, oneq-suivi-pae-2012]
    # `source_definition` vide : notion d'analyse, qu'aucun texte ne définit. Français :
    # « politique active de l'emploi », décret n° 2012-2369, art. 24 (comité d'évaluation
    # des interventions du fonds). Arabe : même clause, décret gouvernemental n° 2019-542,
    # art. 53 (couche texte) — deux textes différents, la paire n'est pas lue en regard,
    # d'où le statut. « Programmes actifs d'emploi » est le terme de l'ONEQ ; son
    # équivalent arabe n'est pas relevé.
    source_traduction: {ref: decret2019-542, locator: "art. 53"}
    voir_aussi: [fonds-national-emploi, aneti, ouvriers-de-chantiers]
    fr:
      terme: Politique active de l'emploi
      definition: >
        Ensemble des programmes par lesquels l'État finance l'insertion des
        demandeurs d'emploi : stages et contrats dont il verse l'indemnité, prise en
        charge de cotisations ou d'une part du salaire, appui à la création
        d'entreprise, chantiers. Le terme est celui des rapports de suivi et des
        études ; les textes ne l'emploient qu'à propos de l'évaluation des
        interventions du Fonds national de l'emploi.
      synonymes: [politiques actives de l'emploi, programmes actifs d'emploi]
    ar:
      terme: السياسة النشيطة للتشغيل
      definition: >
        مجموع البرامج التي تموّل بها الدولة إدماج طالبي الشغل: تربصات وعقود تسند
        الدولة منحتها، وتكفل بالمساهمات الاجتماعية أو بجزء من الأجر، ودعم لبعث
        المؤسسات، وحضائر. والمصطلح مستعمل في تقارير المتابعة والدراسات؛ ولا يرد في
        النصوص إلا في باب تقييم تدخلات الصندوق الوطني للتشغيل.
      synonymes: []

  - id: sivp
    acronyme: SIVP
    statut: valide
    references: [decret88-715, decret93-1049, decret2009-349]
    source_definition: {ref: decret87-1190, locator: "art. 1"}
    # Arabe au singulier : décret n° 2009-349, art. 1er (image). Le décret gouvernemental
    # n° 2019-542 (art. 61) ne l'écrit qu'au pluriel, « تربصات الإعداد للحياة المهنية ».
    # L'édition arabe du décret n° 87-1190 n'est pas lue.
    source_traduction: {ref: decret2009-349, locator: "art. 1er"}
    voir_aussi: [civp, cides, indemnite-de-stage, fonds-formation-apprentissage, fonds-national-emploi]
    fr:
      terme: Stage d'initiation à la vie professionnelle
      definition: >
        Stage en entreprise ou dans le secteur public pendant lequel l'État verse au
        stagiaire une indemnité mensuelle. Institué pour les diplômés du supérieur
        par le décret n° 87-1190 du 26 août 1987, il est étendu en 1988 aux diplômés
        du second cycle secondaire, puis réservé de nouveau aux diplômés du supérieur
        par le décret n° 2009-349, qui en fait un programme du Fonds national de
        l'emploi ; le stage du niveau secondaire cesse alors. En juillet 2019, le
        décret gouvernemental n° 2019-542 en fait un contrat, ouvert aussi à ceux
        qui ne sont pas diplômés du supérieur : le contrat d'initiation à la vie
        professionnelle.
      synonymes: []
    ar:
      terme: تربص الإعداد للحياة المهنية
      definition: >
        تربص بمؤسسة أو بالقطاع العمومي تسند الدولة خلاله منحة شهرية للمتربص. أُحدث
        لفائدة حاملي شهادات التعليم العالي بالأمر عدد 1190 لسنة 1987 المؤرخ في
        26 أوت 1987، ثم شمل سنة 1988 حاملي شهادات المرحلة الثانية من التعليم
        الثانوي، وعاد الأمر عدد 349 لسنة 2009 فخصّ به حاملي شهادات التعليم العالي
        وجعله من برامج الصندوق الوطني للتشغيل، وانتهى حينئذ العمل بتربص مستوى
        التعليم الثانوي. وفي جويلية 2019 جعله الأمر الحكومي عدد 542 لسنة 2019
        عقدا مفتوحا كذلك لغير حاملي شهادات التعليم العالي: عقد الإعداد للحياة
        المهنية.
      synonymes: []

