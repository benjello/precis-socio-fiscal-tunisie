    fr:
      terme: Taxe forfaitaire annuelle
      definition: >
        Régime historique institué par la loi de finances pour 1990 pour
        certaines entreprises individuelles à établissement unique dont le
        chiffre d'affaires ne dépassait pas les plafonds prévus. La taxe était
        fixée annuellement par un barème selon l'activité et le chiffre
        d'affaires. Elle a été abrogée par la loi de finances pour 1993.
      synonymes: []
    ar:
      terme: الأداء السنوي التقديري
      definition: >
        نظام تاريخي أحدثه قانون المالية لسنة 1990 لبعض المؤسسات الفردية ذات
        المحل الواحد التي لا يتجاوز رقم معاملاتها السقوف المنصوص عليها. وكان
        الأداء يضبط سنويا حسب جدول يراعي نوع النشاط ورقم المعاملات. وألغاه
        قانون المالية لسنة 1993.
      synonymes: []

  - id: droit-forfaitaire-simplifie-tva
    acronyme: null
