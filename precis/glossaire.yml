  - id: spfet
    acronyme: null
    statut: valide
    references: [loi59-19, bertrand-1953-securite-sociale-2]
    source_definition: {ref: loi59-18, locator: "art. 1"}
    source_traduction: {ref: loi59-18, locator: "art. 1"}
    voir_aussi: [cnrps, regime-de-prevoyance]
    fr:
      terme: Société de prévoyance des fonctionnaires et employés tunisiens
      definition: >
        Organisme qui sert, sous le Protectorat, les pensions de retraite des
        fonctionnaires de l'État et des collectivités publiques et gère leur
        régime de prévoyance. La loi n° 59-18 du 5 février 1959 dispose qu'elle
        prend l'appellation de Caisse nationale de retraites (art. 1), l'une des
        deux caisses réunies en 1976 dans la CNRPS.
      synonymes: []
    ar:
      terme: الجمعية الاحتياطية للموظفين والمستخدمين التونسيين
      definition: >
        هيكل يصرف، في عهد الحماية، جرايات التقاعد لموظفي الدولة والجماعات
        العمومية ويتصرّف في نظام الحيطة الخاص بهم. وينصّ القانون عدد 18 لسنة
        1959 المؤرخ في 5 فيفري 1959 على أنه يُطلق عليها اسم الصندوق القومي
        للتقاعد (الفصل 1)، وهو أحد الصندوقين اللذين جُمعا سنة 1976 في الصندوق
        الوطني للتقاعد والحيطة الاجتماعية.
