    references: [loi-88-61-tva]
    source_definition: {ref: loi-88-61-tva, locator: "art. 2 § I-3"}
    voir_aussi: [assujetti, tva]
    fr:
      terme: Option pour la qualité d'assujetti
      definition: >
        Faculté ouverte à certaines personnes placées hors du champ de la taxe
        de s'y soumettre volontairement, afin notamment d'exercer le droit à
        déduction.
      synonymes: []
    ar:
      terme: الاختيار للخضوع للأداء
      definition: ""
      synonymes: []

  - id: fait-generateur-tva
    acronyme: null
    statut: provisoire
    references: [loi-88-61-tva]
    source_definition: {ref: loi-88-61-tva, locator: "art. 5"}
    voir_aussi: [tva, livraison-a-soi-meme, chiffre-affaires-imposable]
    fr:
      terme: Fait générateur de la TVA
      definition: >
        Événement qui rend la taxe exigible : la livraison pour les biens,
        l'encaissement du prix pour les services, le dédouanement à
        l'importation. À distinguer de la date à laquelle la taxe est payée.
      synonymes: []
    ar:
      terme: الحدث المنشئ للأداء
      definition: ""
      synonymes: []

  - id: territorialite-tva
    acronyme: null
    statut: provisoire
    references: [loi-88-61-tva]
    source_definition: {ref: loi-88-61-tva, locator: "art. 3"}
    voir_aussi: [tva, fait-generateur-tva]
    fr:
      terme: Territorialité de la TVA
      definition: >
        Règle qui soumet à la taxe les affaires faites en Tunisie. Une vente y
        est réputée faite lorsque la livraison y a lieu ; un service, lorsqu'il
        y est exploité ou utilisé.
      synonymes: []
    ar:
      terme: مبدأ الإقليمية
      definition: ""
      synonymes: []

  - id: exoneration-tva
    acronyme: null
    statut: provisoire
    references: [loi-88-61-tva]
    source_definition: {ref: loi-88-61-tva, locator: "art. 4"}
    voir_aussi: [tva, tableau-a-tva, assujetti]
    fr:
      terme: Exonération de TVA
      definition: >
        Dispense de taxe accordée à une opération qui entre pourtant dans le
        champ d'application. Elle se distingue du hors-champ, qui n'y entre
        pas, et prive en principe du droit à déduction.
      synonymes: []
    ar:
      terme: الإعفاء
      definition: ""
      synonymes: []

