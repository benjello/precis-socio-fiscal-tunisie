      definition: ""
      synonymes: []

  - id: hebergement-universitaire
    acronyme: null
    statut: provisoire  # AR : forme des budgets du ministère de l'enseignement supérieur (note aides universitaires, § 7), non JORT
    references: [arrete-2016-01-18-hebergement, arrete-1974-06-20-reglement-centres-universitaires]
