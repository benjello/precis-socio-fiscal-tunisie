      definition: >
        Rémunération horaire ou mensuelle minimale légale applicable aux
        salariés des secteurs non agricoles régis par le code du travail. L'État
        le fixe par décret depuis le 1er janvier 1974. Il est fixé à l'heure et au
        mois, pour deux régimes de durée du travail : 48 heures et 40 heures par
        semaine.
      synonymes: [SMIG]
    ar:
