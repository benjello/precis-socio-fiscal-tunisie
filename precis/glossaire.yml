    voir_aussi: [taux-reduit-tva, tva, tableau-b-bis-tva]
    fr:
      terme: Tableau B du code de la TVA
      definition: >
        Annexe du code énumérant les produits et services soumis au taux
        réduit. L'électricité et les carburants y figuraient en 1988 ; ils en
        sont sortis par l'article 40 de la loi n° 95-109.
      synonymes: []
    ar:
      terme: الجدول « ب »
      definition: ""
      synonymes: []

