      definition: >
        الحدّ الأدنى القانوني للأجر بالساعة أو بالشهر المطبَّق على أجراء
        القطاعات غير الفلاحية الخاضعة لمجلة الشغل. تضبطه الدولة بأمر منذ غرّة
        جانفي 1974. ويُضبط بالساعة وبالشهر، في نظامين لمدة العمل: نظام عمل
        48 ساعة ونظام عمل 40 ساعة في الأسبوع.
      synonymes: []

