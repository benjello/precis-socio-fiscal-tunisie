# Glossaire bilingue — source unique de vérité (FR ⇄ AR)
#
# Fichier global partagé par tous les précis. Chaque entrée est identifiée par
# un `id` (slug stable) qui sert d'ancre commune `#g-<id>` dans les deux langues.
#
# À partir de ce fichier, `scripts/build_glossary.py` génère :
#   - l'annexe glossaire FR et AR de chaque précis ;
#   - `translation_glossary.generated.md`, table FR↔AR injectée dans le pipeline
#     de traduction (translate_sync.py / verify_translation.py) pour garantir la
#     bijection des termes et éviter les divergences.
#
# Champs : id, acronyme, statut (valide | provisoire), references (clés CSL),
# voir_aussi (slugs), fr/ar { terme, definition, synonymes }.
# NE PAS modifier les fichiers générés à la main : éditez ce glossaire.

entries:
  - id: precis-socio-fiscal
    acronyme: null
    statut: valide
    references: []
    voir_aussi: []
    fr:
      terme: Précis socio-fiscal
      definition: >
        Ouvrage de synthèse documentant l'évolution de la législation sociale
        et fiscale tunisienne depuis l'indépendance, dans son contexte
        historique et politique.
      synonymes: []
    ar:
      terme: الملخّص الاجتماعي والجبائي
      definition: >
        مُصنَّف توليفي يوثّق تطوّر التشريع الاجتماعي والجبائي التونسي منذ
        الاستقلال، في سياقه التاريخي والسياسي.
      synonymes: []

  - id: secteur-public
    acronyme: null
    statut: valide
    references: []
    voir_aussi: [fonction-publique, emploi-public, administrations-publiques, entreprises-publiques]
    fr:
      terme: Secteur public
      definition: >
        Ensemble des organisations contrôlées ou détenues par l'État :
        administrations publiques (État, collectivités locales, sécurité
        sociale) et entreprises publiques. Notion plus large que la fonction
        publique et que l'emploi public.
      synonymes: []
    ar:
      terme: القطاع العام
      definition: >
        مجموع المنظمات التي تسيطر عليها الدولة أو تملكها: الإدارات العمومية
        (الدولة، الجماعات المحلية، الضمان الاجتماعي) والمنشآت العمومية. مفهوم
        أوسع من الوظيفة العمومية ومن التشغيل العمومي.
      synonymes: []

  - id: fonction-publique
    acronyme: null
    statut: valide
    references: [loi83-112]
    source_definition: {ref: loi83-112, locator: "art. 1"}
    source_traduction: {ref: loi83-112, locator: "art. 1"}
    voir_aussi: [emploi-public, secteur-public, epa]
    fr:
      terme: Fonction publique
      definition: >
        Au sens strict, ensemble des agents de l'État, des collectivités
        locales et des établissements publics à caractère administratif, régis
        par le statut général (loi n°83-112).
      synonymes: []
    ar:
      terme: الوظيفة العمومية
      definition: >
        بالمعنى الضيّق، مجموع أعوان الدولة والجماعات المحلية والمؤسسات العمومية
        ذات الصبغة الإدارية، الخاضعين للنظام الأساسي العام (القانون عدد 83-112).
      synonymes: []

  - id: emploi-public
    acronyme: null
    statut: provisoire
    references: []
    voir_aussi: [fonction-publique, secteur-public]
    fr:
      terme: Emploi public
      definition: >
        Concept statistique recouvrant la fonction publique et une partie des
        agents des établissements et entreprises publics ; intermédiaire entre
        la fonction publique et le secteur public.
      synonymes: []
    ar:
      terme: التشغيل العمومي
      definition: >
        مفهوم إحصائي يشمل الوظيفة العمومية وجزءًا من أعوان المؤسسات والمنشآت
        العمومية؛ وسيط بين الوظيفة العمومية والقطاع العام.
      synonymes: []

  - id: administrations-publiques
    acronyme: null
    statut: provisoire
    references: [sna2008, imfgfsm2014]
    source_definition: {ref: sna2008}
    voir_aussi: [entreprises-publiques, secteur-public, fonds-de-securite-sociale, masse-salariale]
    fr:
      terme: Administrations publiques
      definition: >
        Sous-secteur des comptes nationaux (General Government) regroupant
        l'administration centrale, les administrations locales et les fonds de
        sécurité sociale, financés principalement par des prélèvements
        obligatoires.
      synonymes: []
    ar:
      terme: الإدارات العمومية
      definition: >
        قطاع فرعي في الحسابات الوطنية يضمّ الإدارة المركزية والإدارات المحلية
        وصناديق الضمان الاجتماعي، ويُموَّل أساسًا من الاقتطاعات الإجبارية.
      synonymes: []

  - id: entreprises-publiques
    acronyme: null
    statut: provisoire
    references: [loi89-9, sna2008]
    source_definition: {ref: loi89-9, locator: "art. 8"}
    source_traduction: {ref: loi89-9}
    voir_aussi: [administrations-publiques, epna, epic]
    fr:
      terme: Entreprises publiques
      definition: >
        Sous-secteur des comptes nationaux (Public Corporations) regroupant les
        unités contrôlées par l'État qui produisent des biens et services
        marchands ; au sens juridique, périmètre défini par la loi n°89-9.
      synonymes: []
    ar:
      terme: المنشآت العمومية
      definition: >
        قطاع فرعي في الحسابات الوطنية يضمّ الوحدات التي تسيطر عليها الدولة
        وتنتج سلعًا وخدمات سوقية؛ وبالمعنى القانوني، نطاق يحدّده القانون عدد 89-9.
      synonymes: []

  - id: epa
    acronyme: EPA
    statut: provisoire
    references: [loi83-112]
    source_definition: {ref: loi83-112}
    source_traduction: {ref: loi83-112}
    voir_aussi: [epna, epic, fonction-publique]
    fr:
      terme: Établissement public à caractère administratif
      definition: >
        Organisme public doté de la personnalité morale et de l'autonomie
        financière, exerçant une mission administrative ; son personnel relève
        du statut général de la fonction publique, dont l'article premier vise
        l'ensemble de ces établissements (loi n°83-112).
      synonymes: [EPA]
    ar:
      terme: المؤسسة العمومية ذات الصبغة الإدارية
      definition: >
        هيكل عمومي يتمتّع بالشخصية المعنوية والاستقلال المالي، يمارس مهمّة
        إدارية؛ ويخضع أعوانه للنظام الأساسي العام للوظيفة العمومية، الذي يشمل
        فصله الأول جميع هذه المؤسسات (القانون عدد 83-112).
      synonymes: []

  - id: epna
    acronyme: EPNA
    statut: provisoire
    references: [loi89-9]
    source_definition: {ref: loi89-9, locator: "art. 8"}
    source_traduction: {ref: loi89-9}
    voir_aussi: [epa, epic, entreprises-publiques]
    fr:
      terme: Établissement public à caractère non administratif
      definition: >
        Organisme public doté de la personnalité morale et de l'autonomie de
        gestion, exerçant une activité technique, économique ou sociale ;
        certains EPNA sont, par décret, considérés comme entreprises publiques.
      synonymes: [EPNA]
    ar:
      terme: المؤسسة العمومية التي لا تكتسي صبغة إدارية
      definition: >
        هيكل عمومي يتمتّع بالشخصية المعنوية واستقلالية التصرّف، يمارس نشاطًا
        فنّيًا أو اقتصاديًا أو اجتماعيًا؛ وتُعتبر بعض هذه المؤسسات، بمقتضى أمر،
        منشآت عمومية.
      synonymes: []

  - id: epic
    acronyme: EPIC
    statut: provisoire
    references: [loi85-78]
    source_definition: {ref: loi85-78}
    source_traduction: {ref: loi85-78}
    voir_aussi: [epna, entreprises-publiques, regime-conventionnel-public]
    fr:
      terme: Établissement public à caractère industriel et commercial
      definition: >
        Établissement public exerçant une activité industrielle ou
        commerciale, dont les agents relèvent de la loi n°85-78 et non du statut
        général de la fonction publique.
      synonymes: [EPIC]
    ar:
      terme: المؤسسة العمومية ذات الصبغة الصناعية والتجارية
      definition: >
        مؤسسة عمومية تمارس نشاطًا صناعيًا أو تجاريًا، يخضع أعوانها للقانون عدد
        85-78 لا للنظام الأساسي العام للوظيفة العمومية.
      synonymes: []

  - id: regime-indiciaire
    acronyme: null
    statut: provisoire
    references: [loi83-112, decret-97-1832, decret-2007-268]
    voir_aussi: [grille-des-salaires, traitement-de-base, point-indice, grade, echelon, fonction-publique]
    fr:
      terme: Régime indiciaire
      definition: >
        Régime de rémunération des agents de l'État, des collectivités locales
        et des établissements publics à caractère administratif, régis par le
        statut général (loi n°83-112), fondé sur un grade et un échelon. Depuis
        le 1er janvier 1998, à chaque couple grade × échelon correspond un
        traitement de base mensuel fixé directement en dinars par la grille
        annexée au décret n°97-1832 ; depuis le 1er avril 2007, une partie des
        indemnités spécifiques y est intégrée (décret n°2007-268, art. 2 bis).
        Le régime doit son nom au mécanisme en vigueur jusqu'au 31 décembre
        1997, où un chiffre indiciaire attaché à l'emploi était converti en
        dinars par un décret distinct ; depuis, aucune « valeur du point »
        n'opère, et le point d'indice ne subsiste que dans le vocabulaire et
        dans certains décrets de classement des corps.
      synonymes: []
    ar:
      terme: النظام الاستدلالي للتأجير
      definition: >
        نظام تأجير أعوان الدولة والجماعات المحلية والمؤسسات العمومية ذات الصبغة
        الإدارية، الخاضعين للنظام الأساسي العام (القانون عدد 83-112)، يقوم على
        رتبة ودرجة. ومنذ غرّة جانفي 1998، يقابل كلَّ ثنائي رتبة × درجة مرتبٌ
        أساسي شهري محدَّد مباشرة بالدينار في الشبكة المُلحقة بالأمر عدد 97-1832؛
        ومنذ غرّة أفريل 2007، أُدمج فيه جزء من المنح الخصوصية (الأمر عدد
        2007-268، الفصل 2 مكرّر). ويستمدّ النظام اسمه من الآليّة التي كانت سارية
        إلى 31 ديسمبر 1997، حيث كان رقم قياسي مُسنَد إلى الخطّة يُحوَّل إلى
        دنانير بأمر مستقلّ؛ ومنذ ذلك التاريخ لا تعمل أيّ «قيمة للنقطة»، ولم تبق
        النقطة الاستدلالية إلا في المصطلحات وفي بعض أوامر تصنيف الأسلاك.
      synonymes: []

  - id: regime-statutaire-autonome
    acronyme: null
    statut: provisoire
    references: [loi83-112, loi67-29, loi67-20, loi82-70, loi95-46]
    source_definition: {ref: loi83-112, locator: "art. 1er"}
    voir_aussi: [regime-indiciaire, fonction-publique, forces-de-securite-interieure, statut-particulier, magistrat, solde-militaire, pensions-civiles-militaires]
    fr:
      terme: Régime statutaire autonome
      definition: >
        Catégorie retenue dans ce précis pour les corps régis par un statut
        propre, distinct du statut général de la fonction publique : magistrats,
        militaires, forces de sécurité intérieure et agents des douanes. Chaque
        corps reçoit un traitement ou une solde de base, complété d'indemnités,
        sur des grilles qui lui sont propres. Pour les trois premiers, le
        détachement procède d'une clause d'exclusion de champ, et non d'une
        sortie progressive : l'article premier de la loi n°83-112 portant statut
        général les écarte de son champ d'application et les renvoie à leurs
        textes propres — loi n°67-29 (magistrats de l'ordre judiciaire), loi
        n°67-20 (militaires), loi n°82-70 (forces de sécurité intérieure).
        L'autonomie des agents des douanes repose sur leur statut général
        propre (loi n°95-46 du 15 mai 1995).
      synonymes: [statut spécial]
    ar:
      terme: النظام الأساسي الخاص
      definition: >
        فئة معتمدة في هذا الملخّص للأسلاك الخاضعة لنظام أساسي خاصّ بها، متميّز
        عن النظام الأساسي العام للوظيفة العمومية: القضاة والعسكريون وقوات الأمن
        الداخلي وأعوان الديوانة. ويتقاضى كلّ سلك مرتّبًا أساسيًا تُضاف إليه منح،
        وفق شبكات خاصّة به. وبالنسبة إلى الأسلاك الثلاثة الأولى، ينتج هذا
        الانفصال عن بند استثناء من مجال التطبيق، لا عن خروج تدريجي: فالفصل
        الأول من القانون عدد 83-112 المتعلّق بالنظام الأساسي العام يُخرجها من
        مجال تطبيقه ويحيلها إلى نصوصها الخاصّة — القانون عدد 67-29 (القضاة
        العدليون)، والقانون عدد 67-20 (العسكريون)، والقانون عدد 82-70 (قوات
        الأمن الداخلي). أمّا استقلالية أعوان الديوانة فتستند إلى نظامهم الأساسي
        العام الخاصّ بهم (القانون عدد 95-46 المؤرّخ في 15 ماي 1995).
      synonymes: []

  - id: magistrat
    acronyme: null
    statut: valide
    references: [loi67-29, loi72-40, decret-loi-70-6]
    source_definition: {ref: loi67-29}
    source_traduction: {ref: loi67-29}
    voir_aussi: [regime-statutaire-autonome, pensions-civiles-militaires]
    fr:
      terme: Magistrat
      definition: >
        Membre d'un corps de magistrats doté d'un statut propre, distinct du
        statut général de la fonction publique. Le droit tunisien connaît trois
        statuts distincts : les magistrats de l'ordre judiciaire (loi n°67-29 du
        14 juillet 1967), les magistrats du Tribunal administratif (loi n°72-40
        du 1ᵉʳ juin 1972) et les membres de la Cour des comptes (décret-loi
        n°70-6 du 26 septembre 1970). Le barème de rémunération de chaque corps
        relève de ses dispositions statutaires propres.
      synonymes: []
    ar:
      terme: القاضي
      definition: >
        عضو في سلك من أسلاك القضاة يتمتّع بنظام أساسي خاصّ به، متميّز عن النظام
        الأساسي العام للوظيفة العمومية. ويعرف القانون التونسي ثلاثة أنظمة
        أساسية متمايزة: قضاة القضاء العدلي (القانون عدد 67-29 المؤرّخ في 14
        جويلية 1967)، وقضاة المحكمة الإدارية (القانون عدد 72-40 المؤرّخ في غرّة
        جوان 1972)، وأعضاء دائرة المحاسبات (المرسوم عدد 70-6 المؤرّخ في 26
        سبتمبر 1970). ويخضع سُلَّم تأجير كلّ سلك لأحكامه الأساسية الخاصّة.
      synonymes: []

  - id: solde-militaire
    acronyme: null
    statut: provisoire  # équivalent AR à valider par un locuteur — cf. issue #53

    references: [decret-79-96, decret-67-158]
    source_definition: {ref: decret-79-96}
    voir_aussi: [regime-statutaire-autonome, traitement-de-base, regime-indiciaire]
    fr:
      terme: Solde (militaire)
      definition: >
        Rémunération de base des militaires, équivalent du traitement de base de
        la fonction publique mais établi hors de la grille de droit commun. Le
        décret n°79-96 du 11 janvier 1979 fixe la solde des militaires non
        classés dans la grille de la fonction publique, ainsi que le régime de
        l'alimentation dans l'armée ; il est modifié à plusieurs reprises, de
        1987 à 2010. À cette solde s'ajoutent des indemnités liées aux
        sujétions du service ; celles des personnels de l'armée de terre sont
        fixées par le décret n°67-158 du 31 mai 1967.
      synonymes: []
    ar:
      terme: المرتّب العسكري
      definition: >
        الأجر الأساسي للعسكريين، المقابل للمرتّب الأساسي في الوظيفة العمومية لكن
        المضبوط خارج شبكة القانون العام. يضبط الأمر عدد 79-96 المؤرّخ في 11
        جانفي 1979 مرتّب العسكريين غير المصنّفين في شبكة الوظيفة العمومية،
        وكذلك نظام التغذية في الجيش؛ وقد نُقّح عدّة مرّات، من سنة 1987 إلى سنة
        2010. وتُضاف إلى هذا المرتّب منحٌ مرتبطة بأعباء الخدمة؛ ويضبط الأمر عدد
        67-158 المؤرّخ في 31 ماي 1967 منح أعوان جيش البرّ.
      synonymes: []

  - id: pensions-civiles-militaires
    acronyme: null
    statut: provisoire  # équivalent AR à valider par un locuteur — cf. issue #54

    references: [loi85-12, loi2019-37]
    source_definition: {ref: loi85-12}
    voir_aussi: [cnrps, regime-statutaire-autonome, solde-militaire, cotisations-sociales]
    fr:
      terme: Pensions civiles et militaires
      definition: >
        Régime de retraite commun aux agents civils et militaires du secteur
        public, géré par la Caisse nationale de retraite et de prévoyance
        sociale (CNRPS) : il n'existe pas de caisse militaire distincte. Ce
        régime est fixé par la loi n°85-12 du 5 mars 1985 portant régime des
        pensions civiles et militaires de retraite et des survivants dans le
        secteur public, modifiée notamment par la loi n°2019-37. Au sein de ce
        régime commun, le volet militaire connaît des paramètres dérogatoires
        (durées de services et âges de jouissance différenciés selon le grade).
      synonymes: []
    ar:
      terme: الجرايات المدنية والعسكرية
      definition: >
        نظام تقاعد مشترك بين الأعوان المدنيين والعسكريين في القطاع العام، يديره
        الصندوق الوطني للتقاعد والحيطة الاجتماعية: ولا يوجد صندوق عسكري منفصل.
        يضبط هذا النظامَ القانونُ عدد 85-12 المؤرّخ في 5 مارس 1985 المتعلّق
        بنظام جرايات التقاعد والباقين على قيد الحياة المدنية والعسكرية في القطاع
        العام، المنقَّح خاصّةً بالقانون عدد 2019-37. وضمن هذا النظام المشترك،
        يعرف الشقّ العسكري معاييرَ استثنائية (مدد خدمة وأعمار انتفاع متمايزة حسب
        الرتبة).
      synonymes: []

  - id: statut-particulier
    acronyme: null
    statut: provisoire
    references: [loi83-112, loi85-78, decret-statut-caisses-1999, decret-statut-caisses-2022]
    voir_aussi: [fonction-publique, regime-statutaire-autonome, regime-conventionnel-public, cnss, cnrps, cnam]
    fr:
      terme: Statut particulier
      definition: >
        Texte, pris ou approuvé par décret, qui fixe les règles propres à un
        corps ou au personnel d'un organisme. Dans la fonction publique, les
        statuts particuliers déclinent corps par corps le statut général (loi
        n°83-112) : conditions de recrutement, d'avancement et obligations ;
        les statuts particuliers dérogatoires de son article 2 dérogent à
        certaines de ses dispositions sans en sortir. Dans les entreprises
        publiques, la loi n°85-78 régit les agents permanents des offices, des
        établissements industriels et commerciaux et des sociétés à capital
        entièrement public par des statuts particuliers approuvés par décret.
        Le personnel des organismes de sécurité sociale relève d'un statut
        approuvé par décret en 1999, puis d'un statut particulier approuvé par
        le décret présidentiel n°2022-76, qui abroge le précédent.
      synonymes: []
    ar:
      terme: النظام الأساسي الخصوصي
      definition: >
        نصّ يُتَّخذ أو يُصادَق عليه بأمر، يضبط القواعد الخاصّة بسلك أو بأعوان
        هيكل. ففي الوظيفة العمومية، تفصّل الأنظمة الأساسية الخصوصية النظام
        الأساسي العام (القانون عدد 83-112) سلكًا سلكًا: شروط الانتداب والترقية
        والواجبات؛ أمّا الأنظمة الأساسية الخصوصية الاستثنائية الواردة بفصله 2
        فتخالف بعض أحكامه دون الخروج عنه. وفي المنشآت العمومية، يُخضع القانون
        عدد 85-78 الأعوان القارّين للدواوين والمؤسسات الصناعية والتجارية
        والشركات ذات رأس المال العمومي الكامل لأنظمة أساسية خصوصية مصادق عليها
        بأمر. ويخضع أعوان مؤسسات الضمان الاجتماعي لنظام أساسي صودق عليه بأمر
        سنة 1999، ثمّ لنظام أساسي خاصّ صودق عليه بالأمر الرئاسي عدد 2022-76
        الذي ألغى سابقه.
      synonymes: []

  - id: forces-de-securite-interieure
    acronyme: null
    statut: provisoire
    references: [loi82-70]
    source_definition: {ref: loi82-70}
    voir_aussi: [regime-statutaire-autonome, statut-particulier, pensions-civiles-militaires]
    fr:
      terme: Forces de sécurité intérieure
      definition: >
        Corps chargés du maintien de l'ordre et de la sécurité publique, dotés
        d'un statut spécial distinct du statut général de la fonction publique
        (loi n°82-70 du 6 août 1982). Ce statut couvre les agents de la sûreté
        nationale, de la garde nationale, de la protection civile ainsi que des
        services des prisons et de la rééducation.
      synonymes: []
    ar:
      terme: قوات الأمن الداخلي
      definition: >
        الأسلاك المكلّفة بحفظ النظام والأمن العام، التي تتمتّع بنظام أساسي خاصّ
        مستقلّ عن النظام الأساسي العام للوظيفة العمومية (القانون عدد 82-70
        المؤرّخ في 6 أوت 1982). ويشمل هذا النظام أعوان الأمن الوطني والحرس
        الوطني والحماية المدنية وكذلك مصالح السجون والإصلاح.
      synonymes: []

  - id: convention-collective-sectorielle
    acronyme: null
    statut: provisoire
    references: [loi85-78]
    voir_aussi: [convention-collective-cadre, agrement-convention-collective, avenant-convention-collective, grille-de-salaires-conventionnelle, regime-conventionnel-public, convention-collective-banques, entreprises-publiques, epic]
    fr:
      terme: Convention collective sectorielle
      definition: >
        Accord négocié entre organisations d'employeurs et de salariés, fixant les
        conditions d'emploi et de rémunération (classification des emplois,
        grilles de salaires, indemnités) pour une branche d'activité donnée.
        Agréée par arrêté, elle s'impose à tous les employeurs et à tous les
        travailleurs de la branche. De 1969 à 2025, d'après les intitulés des
        arrêtés publiés au Journal officiel, 61 conventions sectorielles sont
        agréées dans 56 branches, et une cinquante-septième branche n'est connue
        que par ses avenants ; ce décompte est une borne basse. L'article 2 de la
        loi n° 85-78 permettait, à titre transitoire, à certaines sociétés à
        capital partiellement public de choisir entre le régime statutaire et les
        conventions collectives du secteur.
      synonymes: [convention de branche, convention collective nationale]
    ar:
      terme: الاتفاقية المشتركة القطاعية
      definition: >
        اتفاق متفاوَض عليه بين منظمات المؤجرين ومنظمات الأجراء، يضبط شروط الشغل
        والتأجير (تصنيف المواطن الشغلية وجداول الأجور والمنح) لقطاع نشاط معيَّن.
        وبالمصادقة عليها بقرار تصبح منطبقة على جميع المؤجرين وجميع العمال في
        القطاع. ومن سنة 1969 إلى سنة 2025، وحسب عناوين القرارات المنشورة بالرائد
        الرسمي، تمّت المصادقة على 61 اتفاقية مشتركة قطاعية في 56 قطاعًا، ولا يُعرف
        قطاع سابع وخمسون إلا من خلال ملاحقه التعديلية؛ وهذا العدد حدّ أدنى. وقد
        أتاح الفصل 2 من القانون عدد 85-78، بصفة انتقالية، لبعض الشركات ذات رأس
        المال العمومي الجزئي الاختيار بين النظام الأساسي والاتفاقيات المشتركة للقطاع.
      synonymes: [الاتفاقية المشتركة القومية]

  - id: convention-collective-banques
    acronyme: null
    statut: valide
    references: [cc-banques-2014, loi2016-48]
    source_definition: {ref: cc-banques-2014}
    source_traduction: {ref: cc-banques-2014}
    voir_aussi: [convention-collective-sectorielle, regime-marche-controle, cnss]
    fr:
      terme: Convention collective sectorielle des banques et établissements financiers
      definition: >
        Convention collective de droit commun du travail régissant la
        classification des emplois et la rémunération des agents des banques et
        établissements financiers, publics comme privés, agréée par arrêté du
        ministre des Affaires sociales en application du Code du travail. Sa
        lignée remonte à un agrément de 1975 ; la convention révisée est agréée
        par arrêté du 17 février 2014, puis complétée par des avenants jusqu'à
        l'avenant n°5, de 2022. Son champ commun aux banques publiques et privées
        établit l'unité du cadre conventionnel, sans permettre à lui seul de comparer
        leurs niveaux effectifs de rémunération.
      synonymes: [convention collective des banques]
    ar:
      terme: الاتفاقية المشتركة القطاعية لأعوان البنوك والمؤسسات المالية
      definition: >
        اتفاقية مشتركة من القانون العام للشغل تضبط تصنيف المواطن الشغلية وتأجير
        أعوان البنوك والمؤسسات المالية، العمومية منها والخاصة، مصادَق عليها بقرار
        من وزير الشؤون الاجتماعية تطبيقًا لمجلة الشغل. تعود نشأتها إلى مصادقة سنة
        1975؛ وقد صودق على الاتفاقية المنقَّحة بقرار مؤرَّخ في 17 فيفري 2014،
        ثمّ استُكملت بملاحق تعديلية إلى الملحق عدد 5 لسنة 2022. ويثبت شمولها المشترك للبنوك
        العمومية والخاصة وحدة الإطار الاتفاقي، دون أن يسمح بمفرده بمقارنة مستويات
        التأجير الفعلية بينها.
      synonymes: []

  - id: convention-collective-assurances
    acronyme: null
    statut: valide
    references: [cc-assurances-1975, cc-assurances-1983, cc-assurances-avenant5-1999, cc-assurances-avenant15-2022]
    source_definition: {ref: cc-assurances-texte-1975}
    source_traduction: {ref: cc-assurances-avenant7-2007}
    voir_aussi: [convention-collective-sectorielle, convention-collective-banques, regime-marche-controle, grille-de-salaires-conventionnelle, avenant-convention-collective]
    fr:
      terme: Convention collective sectorielle des assurances
      definition: >
        Convention collective de branche qui régit la classification et la
        rémunération des agents des sociétés d'assurance, publiques et privées
        confondues. Agréée par arrêté du 24 décembre 1975, elle prend effet au
        1er janvier 1975 et vaut pour « l'ensemble du secteur des Assurances
        exerçant en Tunisie » ; sa révision est agréée le 23 août 1983, et
        quinze avenants suivent, de 1989 à 2022. D'abord dite « nationale »,
        elle est dite « sectorielle » depuis l'avenant n° 7, agréé le 24 mai
        2007. Sa grille donne un salaire mensuel pour 40 heures par semaine,
        sur 21 échelles — en 7 catégories, puis en 5 depuis 1983 — et 12
        échelons d'ancienneté, 14 depuis le 1er juin 1999.
      synonymes: [convention collective nationale des assurances, convention collective des assurances]
    ar:
      terme: الاتفاقية المشتركة القطاعية للتأمين
      definition: >
        اتفاقية مشتركة قطاعية تضبط تصنيف وتأجير أعوان شركات التأمين، العمومية
        منها والخاصة. صودق عليها بقرار مؤرَّخ في 24 ديسمبر 1975، وبدأ العمل بها
        في غرّة جانفي 1975، وهي تنطبق على كامل قطاع التأمين بالبلاد التونسية؛
        وصودق على تنقيحها في 23 أوت 1983، وتلاها خمسة عشر ملحقًا تعديليًا من سنة
        1989 إلى سنة 2022. وكانت تُسمّى «القومية» ثمّ صارت تُسمّى «القطاعية» منذ
        الملحق التعديلي عدد 7 المصادق عليه في 24 ماي 2007. ويضبط جدول أجورها
        أجرًا شهريًا لنظام 40 ساعة في الأسبوع، على 21 سلّمًا — في 7 أصناف ثمّ في
        5 منذ سنة 1983 — و12 درجة أقدمية، صارت 14 منذ غرّة جوان 1999.
      synonymes: [الاتفاقية المشتركة القومية للتأمين]

  - id: remuneration-dirigeants-entreprises-publiques
    acronyme: null
    statut: valide
    references: [decret2015-2217, decret90-1855]
    source_definition: {ref: decret2015-2217}
    source_traduction: {ref: decret2015-2217}
    voir_aussi: [regime-marche-controle, entreprises-publiques, regime-conventionnel-public]
    fr:
      terme: Rémunération des dirigeants d'entreprises publiques
      definition: >
        Rémunération des chefs d'établissements et entreprises publics et de
        sociétés à majorité publique, encadrée et plafonnée par voie réglementaire
        au titre des prérogatives de l'État actionnaire. Le décret n°2015-2217 du
        11 décembre 2015 fixe les taux des éléments de cette rémunération, à la
        suite des décrets n°78-885 (1978), n°90-1855 (1990) et n°2014-12
        (2014). Ce plafonnement constitue le versant « contrôle »
        du régime de marché contrôlé, par contraste avec l'autonomie
        conventionnelle de marché des agents.
      synonymes: []
    ar:
      terme: تأجير رؤساء المؤسسات والمنشآت العمومية
      definition: >
        تأجير رؤساء المؤسسات والمنشآت العمومية والشركات ذات الأغلبية العمومية —
        المضبوط والمسقَّف عن طريق التنظيم بعنوان صلاحيات الدولة المساهمة. ويضبط الأمر الحكومي
        عدد 2015-2217 المؤرّخ في 11 ديسمبر 2015 نسب عناصر هذا التأجير، إثر
        الأوامر عدد 78-885 (1978) وعدد 90-1855 (1990) وعدد 2014-12
        (2014). ويشكّل هذا التسقيف الشقَّ «الرقابي» من نظام السوق الموجَّه، في
        مقابل الاستقلالية الاتفاقية السوقية لأعوانها.
      synonymes: []

  - id: regime-conventionnel-public
    acronyme: null
    statut: provisoire
    references: [loi85-78, loi89-9]
    source_definition: {ref: loi85-78, locator: "art. 1-2 et 75"}
    voir_aussi: [entreprises-publiques, epic, convention-collective-sectorielle, statut-particulier]
    fr:
      terme: Régime conventionnel public
      definition: >
        Catégorie d'analyse retenue dans ce précis pour les entreprises publiques
        non financières. La loi n° 85-78 régit les agents permanents des offices,
        des établissements industriels et commerciaux et des sociétés à capital
        entièrement public par des statuts particuliers approuvés par décret. Elle
        prévoit aussi, à titre transitoire, une option entre statut et convention
        sectorielle pour certaines sociétés à capital partiellement public.
      synonymes: []
    ar:
      terme: النظام الاتفاقي العمومي
      definition: >
        فئة تحليلية معتمدة في هذا الدليل للمنشآت العمومية غير المالية. ويقوم تأجير
        أعوان الدواوين والمؤسسات الصناعية والتجارية والشركات ذات رأس المال العمومي
        الكامل، في إطار القانون عدد 85-78، على أنظمة أساسية خاصة مصادق عليها بأوامر.
        وينصّ القانون أيضًا على خيار انتقالي بين النظام الأساسي والاتفاقية القطاعية
        لبعض الشركات ذات رأس المال العمومي الجزئي.
      synonymes: []

  - id: regime-marche-controle
    acronyme: null
    statut: provisoire
    references: [loi89-9, cc-banques-2014, cc-assurances-1975, decret2015-2217]
    voir_aussi: [entreprises-publiques, convention-collective-banques, convention-collective-assurances, remuneration-dirigeants-entreprises-publiques, regime-conventionnel-public, cnss]
    fr:
      terme: Régime de marché contrôlé
      definition: >
        Catégorie d'analyse retenue dans ce précis pour les entreprises publiques
        financières : banques et sociétés d'assurance. La rémunération des agents
        s'y fixe par la convention collective de leur branche, commune aux
        établissements publics et privés : celle des banques et établissements
        financiers, révisée et agréée le 17 février 2014 ; celle des assurances,
        agréée le 24 décembre 1975 pour le secteur entier, révisée en 1983 et
        suivie de quinze avenants de 1989 à 2022. La rémunération des dirigeants
        est, elle, encadrée par décret (décret n°2015-2217 du 11 décembre 2015).
        La convention des assurances ne nomme aucune société.
      synonymes: []
    ar:
      terme: نظام السوق الموجَّه
      definition: >
        فئة تحليلية معتمدة في هذا الملخّص للمنشآت العمومية المالية: البنوك وشركات
        التأمين. ويُضبَط تأجير الأعوان فيها بالاتفاقية المشتركة لقطاعهم، وهي
        مشتركة بين المؤسسات العمومية والخاصة: اتفاقية أعوان البنوك والمؤسسات
        المالية، المنقَّحة والمصادق عليها في 17 فيفري 2014؛ واتفاقية التأمين،
        المصادق عليها في 24 ديسمبر 1975 للقطاع بأسره، والمنقَّحة سنة 1983
        والمتبوعة بخمسة عشر ملحقًا تعديليًا من سنة 1989 إلى سنة 2022. أمّا تأجير
        رؤساء المنشآت فيؤطَّر بأمر (الأمر الحكومي عدد 2015-2217 المؤرّخ في 11
        ديسمبر 2015). ولا تسمّي اتفاقية التأمين أيّ شركة.
      synonymes: []

  - id: point-indice
    acronyme: null
    statut: provisoire
    references: [decret-97-1832, decret-2007-268]
    voir_aussi: [regime-indiciaire, traitement-de-base, grille-des-salaires, chiffre-indiciaire]
    fr:
      terme: Valeur du point d'indice
      definition: >
        Notion héritée du modèle français de carrière, qui n'opère pas en
        Tunisie depuis le 1er janvier 1998. Jusqu'au 31 décembre 1997, des
        décrets « fixant le traitement global annuel » tenaient ce rôle, en
        donnant sa valeur en dinars au chiffre indiciaire de chaque emploi.
        Depuis, aucun texte ne publie de « valeur du point » qui, appliquée à
        un indice, déterminerait le traitement de base : la grille annexée au
        décret n°97-1832 fixe les montants directement en dinars (art. 2 bis,
        inséré par le décret n°2007-268). Le terme subsiste dans le vocabulaire
        et dans certains décrets de classement des corps.
      synonymes: [point d'indice]
    ar:
      terme: قيمة النقطة الاستدلالية
      definition: >
        مفهوم موروث عن النموذج الفرنسي للمسار المهني، غير معمولٍ به في تونس
        منذ غرّة جانفي 1998. فإلى 31 ديسمبر 1997، كانت أوامر «ضبط المرتّب
        الجملي السنوي» تقوم بهذا الدور، إذ تحدّد قيمة الرقم القياسي لكلّ خطّة
        بالدينار. ومنذ ذلك التاريخ، لا ينشر أيّ نصّ «قيمةً للنقطة» تُطبَّق على
        رقم قياسي لتحديد المرتب الأساسي: فالشبكة المُلحقة بالأمر عدد 97-1832
        هي التي تضبط المبالغ مباشرة بالدينار (الفصل 2 مكرّر، المُدرَج بالأمر
        عدد 2007-268). ولا يزال المصطلح قائمًا في المصطلحات وفي بعض أوامر
        تصنيف الأسلاك.
      synonymes: []

  - id: traitement-de-base
    acronyme: null
    statut: valide
    references: [decret-97-1832, decret-2007-268]
    source_definition: {ref: decret-2007-268, locator: "art. 2 bis"}
    source_traduction: {ref: decret-2007-268}
    voir_aussi: [regime-indiciaire, grille-des-salaires, point-indice, grade, echelon]
    fr:
      terme: Traitement de base
      definition: >
        Part principale de la rémunération d'un agent public du régime
        indiciaire, avant indemnités et primes. Depuis le 1er janvier 1998, son
        montant mensuel est fixé directement en dinars, pour chaque couple
        grade × échelon, par la grille des salaires annexée au décret
        n°97-1832, et non calculé à partir d'une valeur du point d'indice.
        Depuis le 1er avril 2007, une partie des indemnités spécifiques de
        corps y est intégrée (décret n°2007-268, art. 2 bis).
      synonymes: []
    ar:
      terme: المرتب الأساسي
      definition: >
        الجزء الرئيسي من أجر العون العمومي الخاضع للنظام الاستدلالي، قبل المنح
        والمكافآت. ومنذ غرّة جانفي 1998، يُضبَط مبلغه الشهري مباشرة بالدينار،
        لكلّ ثنائي رتبة × درجة، في شبكة الأجور المُلحقة بالأمر عدد 97-1832،
        ولا يُحتسب انطلاقًا من قيمة نقطة استدلالية. ومنذ غرّة أفريل 2007، أُدمج
        فيه جزء من المنح الخصوصية للأسلاك (الأمر عدد 2007-268، الفصل 2 مكرّر).
      synonymes: []

  - id: grade
    acronyme: null
    statut: valide
    references: [decret-99-12]
    source_definition: {ref: decret-99-12}
    voir_aussi: [echelon, categorie-de-grade, regime-indiciaire, traitement-de-base]
    fr:
      terme: Grade
      definition: >
        Position d'un agent dans la hiérarchie d'un corps, déterminant ses
        fonctions et, combinée à l'échelon, son traitement de base ; les grades
        sont organisés en catégories par le décret n°99-12. L'avancement de
        grade traduit une promotion.
      synonymes: []
    ar:
      terme: الرتبة
      definition: >
        موقع العون في التدرّج الهرمي للسلك، يحدّد وظائفه ويحدّد، مقترنًا
        بالدرجة، مرتبه الأساسي؛ وتُنظَّم الرتب في أصناف بمقتضى الأمر عدد 99-12.
        ويعبّر الترقّي في الرتبة عن ترقية.
      synonymes: []

  - id: echelon
    acronyme: null
    statut: valide
    references: [decret-2007-268]
    source_definition: {ref: decret-2007-268}
    voir_aussi: [grade, regime-indiciaire, traitement-de-base]
    fr:
      terme: Échelon
      definition: >
        Subdivision d'un grade traduisant l'ancienneté ; l'avancement
        d'échelon, par ancienneté, fait progresser l'agent dans son grade et
        relève le traitement de base correspondant au couple grade × échelon
        dans la grille.
      synonymes: []
    ar:
      terme: الدرجة
      definition: >
        تقسيم فرعي للرتبة يعبّر عن الأقدمية؛ ويُمكّن الترقّي في الدرجة، حسب
        الأقدمية، العونَ من التقدّم داخل رتبته ويرفع المرتب الأساسي المقابل
        لثنائي رتبة × درجة في الشبكة.
      synonymes: []

  - id: avancement-echelon
    acronyme: null
    statut: provisoire  # équivalent AR (الترقّي في الدرجة) à valider par un locuteur — cf. issue #77
    references: [loi83-112]
    source_definition: {ref: loi83-112, locator: "art. 23-24"}
    voir_aussi: [regime-indiciaire, echelon, grade, traitement-de-base]
    fr:
      terme: Avancement d'échelon
      definition: >
        Progression d'un agent à l'échelon immédiatement supérieur de son grade.
        Dans le régime indiciaire, l'avancement d'échelon est automatique : il
        s'opère selon les cadences fixées par les statuts particuliers de chaque
        corps (loi n°83-112 portant statut général, art. 23 et 24).
      synonymes: []
    ar:
      terme: الترقّي في الدرجة
      definition: >
        تقدّم العون إلى الدرجة الأعلى مباشرةً ضمن رتبته. وفي النظام الاستدلالي
        للتأجير، يكون الترقّي في الدرجة آليًّا: إذ يتمّ وفق الإيقاعات التي تضبطها
        الأنظمة
        الأساسية الخاصّة بكلّ سلك (القانون عدد 83-112 المتعلّق بالنظام الأساسي
        العام، الفصلان 23 و24).
      synonymes: []

  - id: categorie-de-grade
    acronyme: null
    statut: valide
    references: [decret-99-12, decret-2003-2338]
    source_definition: {ref: decret-99-12}
    source_traduction: {ref: decret-99-12}
    voir_aussi: [grade, echelon, regime-indiciaire, grille-des-salaires]
    fr:
      terme: Catégorie de grade
      definition: >
        Classement hiérarchique des grades de la fonction publique fixé par le
        décret n°99-12 du 4 janvier 1999 (modifié), qui répartit les grades en
        quatre catégories A, B, C et D selon le niveau de diplôme exigé au
        recrutement par concours externe ; ce classement sert de support à la
        grille de traitement de base. La catégorie A étant subdivisée en trois
        sous-catégories, les grades se rangent en six catégories, de A1 à D ;
        les augmentations générales des salaires sont fixées selon elles depuis
        le 1er janvier 2016.
        La catégorie A (art. 2) comprend trois sous-catégories : A1, recrutement
        au niveau du mastère au moins, ou du diplôme national d'ingénieur, ou
        équivalent (les anciens diplômes de troisième cycle — DEA/DESS —
        antérieurs à la réforme LMD restent admis ; sous-catégorie réécrite par
        le décret n°2003-2338 du 11 novembre 2003) (usuellement conception,
        cadres supérieurs) ; A2, niveau de la maîtrise au moins ou équivalent ; A3,
        niveau du premier cycle de l'enseignement supérieur au moins ou
        équivalent (A2 et A3 usuellement encadrement). La catégorie B (art. 3)
        correspond au baccalauréat au moins ou équivalent (usuellement
        maîtrise). La catégorie C (art. 4) correspond au cycle primaire achevé
        et à la 6ᵉ année secondaire au moins, ou au diplôme de fin d'études de
        l'enseignement de base et à la 3ᵉ année secondaire. La catégorie D
        (art. 5) correspond au cycle primaire achevé et à la 3ᵉ année secondaire
        au moins, ou au diplôme de fin d'études de l'enseignement de base (C et D
        usuellement exécution). Les diplômes de formation homologués au niveau
        requis sont admis dans chaque catégorie.
      synonymes: []
    ar:
      terme: صنف الرتبة
      definition: >
        تصنيف هرمي لرتب الوظيفة العمومية يُضبَط بمقتضى الأمر عدد 99-12 المؤرّخ في
        4 جانفي 1999 (المنقَّح)، يوزّع الرتب على أربعة أصناف A وB وC وD حسب مستوى
        الشهادة المطلوبة عند الانتداب عن طريق المناظرة الخارجية؛ ويُتّخذ هذا
        التصنيف أساسًا لشبكة المرتّب الأساسي. ولمّا كان الصنف A مقسَّمًا إلى
        ثلاثة أصناف فرعية، فإنّ الرتب تتوزّع على ستّة أصناف، من A1 إلى D؛ وتُضبَط
        الزيادات العامة في الأجور حسبها منذ غرّة جانفي 2016.
        يشمل الصنف A (الفصل 2) ثلاثة أصناف فرعية: A1، الانتداب في مستوى الماجستير
        على الأقلّ، أو الشهادة الوطنية للمهندس، أو ما يعادلها (مع قبول شهادات
        الدراسات العليا في المرحلة الثالثة — الدراسات المعمّقة والدراسات المعمّقة
        المتخصّصة — السابقة لإصلاح نظام «إجازة-ماجستير-دكتوراه»؛ صنف فرعي أُعيدت
        صياغته بمقتضى الأمر عدد 2003-2338 المؤرّخ في 11 نوفمبر 2003) (عادةً
        التصوّر والإطارات العليا)؛ A2، مستوى الأستاذية على الأقلّ أو ما
        يعادلها؛ A3، مستوى المرحلة الأولى من التعليم العالي على الأقلّ أو ما
        يعادلها (A2 وA3 عادةً التأطير). ويقابل الصنف B (الفصل 3) شهادة الباكالوريا
        على الأقلّ أو ما يعادلها (عادةً الكفاءة). ويقابل الصنف C (الفصل 4) إتمام
        المرحلة الابتدائية والسنة السادسة من التعليم الثانوي على الأقلّ، أو شهادة
        ختم التعليم الأساسي والسنة الثالثة من التعليم الثانوي. ويقابل الصنف D
        (الفصل 5) إتمام المرحلة الابتدائية والسنة الثالثة من التعليم الثانوي على
        الأقلّ، أو شهادة ختم التعليم الأساسي (C وD عادةً التنفيذ). وتُقبل في كلّ
        صنف شهادات التكوين المعادَلة للمستوى المطلوب.
      synonymes: []

  - id: grille-des-salaires
    acronyme: null
    statut: valide
    references: [decret-97-1832, decret-2007-268]
    source_definition: {ref: decret-2007-268, locator: "art. 2 bis"}
    source_traduction: {ref: decret-2007-268, locator: "art. 2 bis"}
    voir_aussi: [traitement-de-base, regime-indiciaire, grade, echelon, point-indice]
    fr:
      terme: Grille des salaires
      definition: >
        Barème annexé au décret n°97-1832 du 16 septembre 1997, qui fixe
        directement en dinars, depuis le 1er janvier 1998, le traitement de
        base mensuel pour chaque couple grade × échelon. Elle comprend trois
        tableaux distincts : fonctionnaires, agents temporaires et ouvriers.
        Sa composition est celle du 1er avril 2007 : l'article 2 bis, inséré
        par le décret n°2007-268, y intègre une partie des indemnités
        spécifiques et dispose que la grille est fixée conformément aux
        annexes, et non calculée à partir d'un point d'indice. Elle ne se
        confond pas avec la grille indiciaire en vigueur jusqu'au 31 décembre
        1997, qui attribuait à chaque emploi un chiffre indiciaire converti en
        dinars par un décret distinct.
      synonymes: []
    ar:
      terme: شبكة الأجور
      definition: >
        سُلَّمٌ مُلحَق بالأمر عدد 97-1832 المؤرّخ في 16 سبتمبر 1997، يضبط مباشرة
        بالدينار، منذ غرّة جانفي 1998، المرتبَ الأساسي الشهري لكلّ ثنائي رتبة ×
        درجة. وتتضمّن ثلاثة جداول مستقلّة: الموظفون والأعوان الوقتيون والعملة.
        وتركيبتها هي تركيبة غرّة أفريل 2007: فالفصل 2 مكرّر، المُدرَج بالأمر
        عدد 2007-268، يُدمج فيها جزءًا من المنح الخصوصية وينصّ على أنّ الشبكة
        تُضبَط وفقًا للملاحق، لا محتسَبة انطلاقًا من نقطة استدلالية. ولا تُخلَط
        بالشبكة الاستدلالية التي كانت سارية إلى 31 ديسمبر 1997، والتي كانت
        تُسنِد لكلّ خطّة رقمًا قياسيًا يُحوَّل إلى دنانير بأمر مستقلّ.
      synonymes: []

  - id: echelonnement-indiciaire
    acronyme: null
    statut: provisoire
    references: [decret-60-328, decret-73-316, decret-99-12]
    voir_aussi: [categorie-de-grade, grade, echelon, regime-indiciaire, chiffre-indiciaire]
    fr:
      terme: Échelonnement indiciaire
      definition: >
        Classement hiérarchique des grades d'un corps les uns par rapport aux
        autres. Il était fixé, corps par corps, par une longue série de décrets
        « relatifs au classement hiérarchique et à l'échelonnement indiciaire »,
        qui attribuaient à chaque grade son chiffre indiciaire (au moins depuis
        le décret n°60-328 de 1960). Depuis 1998, ce classement situe chaque
        grade dans la grille de traitement de base sans recourir à une valeur du
        point d'indice.
      synonymes: [classement hiérarchique]
    ar:
      terme: التدرّج القياسي
      definition: >
        ترتيبٌ هرمي لرتب السلك بعضها بالنسبة إلى بعض. وقد كانت تضبطه، سلكًا
        سلكًا، سلسلةٌ طويلة من الأوامر «المتعلقة بالتصنيف الهرمي والتدرّج
        القياسي» التي تُسنِد لكلّ رتبة رقمها القياسي (منذ الأمر عدد 60-328
        لسنة 1960 على الأقلّ). ومنذ سنة 1998، يحدّد هذا الترتيب موقع كلّ رتبة
        في شبكة المرتّب الأساسي دون اللجوء إلى قيمة نقطة استدلالية.
      synonymes: [التصنيف الهرمي]

  - id: indemnite-specifique
    acronyme: null
    statut: provisoire
    references: [decret-2007-267]
    voir_aussi: [prime-de-rendement, traitement-de-base, regime-indiciaire]
    fr:
      terme: Indemnité spécifique
      definition: >
        Indemnité propre à chaque corps, s'ajoutant au traitement de base. La
        recomposition de 2007 (décret n°2007-267) a transféré une partie des
        indemnités spécifiques de corps vers le traitement de base, à effet du
        1ᵉʳ avril 2007.
      synonymes: []
    ar:
      terme: المنحة الخصوصية
      definition: >
        منحة خاصّة بكلّ سلك، تُضاف إلى المرتب الأساسي. وقد أحالت إعادة التركيب
        سنة 2007 (الأمر عدد 2007-267) جزءًا من المنح الخصوصية للأسلاك إلى
        المرتّب الأساسي، ابتداءً من غرّة أفريل 2007.
      synonymes: []

  - id: prime-de-rendement
    acronyme: null
    statut: provisoire
    references: []
    voir_aussi: [indemnite-specifique, traitement-de-base, regime-indiciaire]
    fr:
      terme: Prime de rendement
      definition: >
        Composante indemnitaire de la rémunération du régime indiciaire,
        s'ajoutant au traitement de base et aux indemnités spécifiques ; ces
        composantes sont souvent exclusives les unes des autres.
      synonymes: []
    ar:
      terme: منحة المردودية
      definition: >
        مكوّن مِنَحي من أجر النظام الاستدلالي، يُضاف إلى المرتب الأساسي وإلى
        المنح الخصوصية؛ وكثيرًا ما تكون هذه المكوّنات متنافية فيما بينها.
      synonymes: []

  - id: augmentation-generale-des-salaires
    acronyme: null
    statut: valide
    references: [decret2016-1, decret-2022-797, decret2026-63, decret91-246, decret2026-64]
    source_definition: {ref: decret2016-1}
    source_traduction: {ref: decret-2022-797}
    voir_aussi: [regime-indiciaire, categorie-de-grade, indemnite-de-gestion-et-d-execution, indemnite-specifique, entreprises-publiques, regime-conventionnel-public]
    fr:
      terme: Augmentation générale des salaires
      definition: >
        Relèvement de la rémunération des agents publics, négocié par cycles
        entre l'Union générale tunisienne du travail (UGTT) et le gouvernement
        et fixé par décret, en dinars par mois et non en pourcentage ; un accord
        salarial n'a d'effet qu'une fois repris par décret. Dans la fonction
        publique, de 1993 à 2013, la majoration porte sur l'indemnité propre à
        chaque corps ; à compter du 1er janvier 2016, l'augmentation est fixée
        par catégorie, de A1 à D, et pour les ouvriers (décret gouvernemental
        n°2016-1) ; le programme de 2026 à 2028 est fixé par le décret
        n°2026-63. Pour les agents des entreprises publiques, un décret
        approuve, de 1991 à 2013, des augmentations dont il ne publie pas le
        montant ; le décret n°2026-64 en fixe lui-même le programme et les
        montants, par corps.
      synonymes: [augmentation des salaires]
    ar:
      terme: الزيادة العامة في الأجور
      definition: >
        ترفيع في أجور الأعوان العموميين، يُتفاوَض عليه على دورات بين الاتحاد
        العام التونسي للشغل والحكومة ويُضبَط بأمر، بالدينار في الشهر لا بنسبة
        مائوية؛ ولا يكون للاتفاق الأجري أثر إلا بعد إقراره بأمر. ففي الوظيفة
        العمومية، كان الترفيع من سنة 1993 إلى سنة 2013 يُجرى على المنحة الخاصّة
        بكلّ سلك؛ وابتداءً من غرّة جانفي 2016، تُضبَط الزيادة حسب الصنف، من A1
        إلى D، وللعملة (الأمر الحكومي عدد 2016-1)؛ ويضبط الأمر عدد 2026-63
        برنامج سنوات 2026 و2027 و2028. أمّا أعوان المنشآت العمومية، فقد كان أمرٌ
        يصادق، من سنة 1991 إلى سنة 2013، على زيادات لا ينشر مقاديرها؛ ثمّ ضبط
        الأمر عدد 2026-64 بنفسه برنامجها ومقاديرها حسب السلك.
      synonymes: [الزيادة في الأجور]

  # Terme arabe relevé sur l'intitulé arabe du décret n°2011-2281 du 21 septembre
  # 2011 (jort_cache.db) ; ce décret n'a pas de clé : pas de source_traduction, et
  # l'entrée reste provisoire.
  - id: indemnite-de-gestion-et-d-execution
    acronyme: null
    statut: provisoire
    references: [decret93-2062, decret2012-2959]
    source_definition: {ref: decret93-2062}
    voir_aussi: [augmentation-generale-des-salaires, indemnite-specifique, regime-indiciaire]
    fr:
      terme: Indemnité de gestion et d'exécution
      definition: >
        Indemnité du corps administratif commun et des grades équivalents de la
        fonction publique, instituée par le décret n°82-505 du 16 mars 1982. De
        1993 à 2013, les augmentations des salaires de ses bénéficiaires prennent
        la forme d'une majoration de cette indemnité : par cycles de trois ans
        de 1993 à 2010, chaque tranche prenant effet au 1er juillet ; puis par
        deux tranches de 35 dinars, au 1er juillet 2012 et au 1er janvier 2013
        (décret n°2012-2959). Les autres corps reçoivent leur majoration sur
        leur indemnité propre, par des décrets parallèles.
      synonymes: []
    ar:
      terme: منحة التصرف والتنفيذ
      definition: >
        منحة السلك الإداري المشترك والرتب المماثلة في الوظيفة العمومية، أُحدثت
        بالأمر عدد 82-505 المؤرّخ في 16 مارس 1982. ومن سنة 1993 إلى سنة 2013،
        اتّخذت الزيادات في أجور المنتفعين بها شكل ترفيع في هذه المنحة: على
        دورات بثلاث سنوات من 1993 إلى 2010، يبدأ مفعول كلّ قسط منها في غرّة
        جويلية؛ ثمّ بقسطين بـ35 دينارًا في غرّة جويلية 2012 وغرّة جانفي 2013
        (الأمر عدد 2012-2959). أمّا بقية الأسلاك فيُرفَّع لها في منحها الخاصّة
        بأوامر موازية.
      synonymes: []

  - id: retenue-a-la-source
    acronyme: null
    statut: valide
    references: [loi-irpp-is-1989, lf-2016, code-irpp-is-1990]
    source_definition: {ref: loi-irpp-is-1989}
    voir_aussi: [irpp, css, traitement-de-base, tva, credit-tva, retenue-liberatoire, retenue-definitive-non-restituable]
    fr:
      terme: Retenue à la source
      definition: >
        Prélèvement de l'impôt opéré par celui qui paie une somme, pour le
        compte de celui qui la reçoit ; le montant retenu est reversé au Trésor
        et imputé sur l'impôt dû par ce dernier, sauf quand la loi la rend
        libératoire ou définitive et non restituable (code, art. 52 et 54). En matière d'impôt sur le
        revenu des personnes physiques, l'employeur l'opère lors du paiement du
        traitement et des indemnités imposables (code de l'IRPP et de l'IS, loi
        n°89-114). En matière de taxe sur la valeur ajoutée, l'État, les
        collectivités locales, les entreprises et les établissements publics
        retiennent une part de la taxe facturée par leurs fournisseurs : 50 % à
        compter de 1998, 25 % à compter de 2016.
      synonymes: []
    ar:
      terme: الخصم من المورد
      definition: >
        اقتطاع للأداء يقوم به دافع المبلغ لحساب من يقبضه، ويُدفَع المبلغ
        المخصوم للخزينة ويُحتسَب على الأداء المستوجَب على هذا الأخير، إلّا إذا
        جعله القانون تحرّريًا أو نهائيًا وغير قابل للإرجاع (المجلة، الفصلان 52
        و54). ففي مادة
        الضريبة على دخل الأشخاص الطبيعيين يقوم به المؤجِّر عند دفع المرتب
        والمنح الخاضعة للضريبة (مجلة الضريبة على الدخل والضريبة على الشركات،
        القانون عدد 89-114). وفي مادة الأداء على القيمة المضافة تخصم الدولة
        والجماعات المحلية والمؤسسات والمنشآت العمومية جزءا من الأداء المفوتر
        من قبل مزوديها : 50 بالمائة ابتداء من سنة 1998 و25 بالمائة ابتداء من
        سنة 2016.
      synonymes: []

  - id: masse-salariale
    acronyme: null
    statut: provisoire
    references: [imf-tunisia-art4-2020, wb-tunisia-per-2020]
    voir_aussi: [secteur-public, fonction-publique, administrations-publiques, fonds-de-securite-sociale, emploi-public]
    fr:
      terme: Masse salariale
      definition: >
        Total des rémunérations versées aux agents, charges sociales
        comprises. Sa mesure dépend étroitement du périmètre retenu —
        administration centrale, fonction publique, ou secteur public
        consolidé (administration centrale, collectivités locales, entreprises
        publiques et organismes de sécurité sociale) — et du dénominateur
        auquel on la rapporte : % du PIB, % des recettes ou % des dépenses
        de l'État. En Tunisie, seul l'agrégat d'administration centrale fait
        l'objet d'un suivi régulier ; aucun agrégat consolidé n'est
        publiquement documenté.
      synonymes: []
    ar:
      terme: كتلة الأجور
      definition: >
        مجموع الأجور المدفوعة للأعوان، بما في ذلك الأعباء الاجتماعية. يتوقّف
        قياسها بشكل وثيق على النطاق المعتمَد — الإدارة المركزية، أو الوظيفة
        العمومية، أو القطاع العام المُدمَج (الإدارة المركزية والجماعات المحلية
        والمنشآت العمومية وهياكل الضمان الاجتماعي) — وعلى المقام الذي تُنسب
        إليه: نسبة من الناتج المحلّي الإجمالي، أو من المداخيل، أو من نفقات
        الدولة. وفي تونس، لا يخضع للمتابعة المنتظمة سوى مجمَّع الإدارة المركزية؛
        ولا يوجد مجمَّع مُدمَج موثَّق علنًا.
      synonymes: []

  - id: fonds-de-securite-sociale
    acronyme: null
    statut: provisoire
    references: [sna2008, imfgfsm2014]
    source_definition: {ref: sna2008}
    voir_aussi: [administrations-publiques, cnss, cnrps, cnam]
    fr:
      terme: Fonds de sécurité sociale
      definition: >
        Sous-secteur des administrations publiques (comptes nationaux, SNA
        2008 / GFSM 2014) regroupant les unités gérant des régimes de sécurité
        sociale obligatoires. En Tunisie, les caisses sociales (CNSS, CNRPS,
        CNAM) y sont rattachées économiquement bien qu'elles soient
        juridiquement des EPNA.
      synonymes: []
    ar:
      terme: صناديق الضمان الاجتماعي
      definition: >
        قطاع فرعي من الإدارات العمومية (الحسابات الوطنية، SNA 2008 / GFSM
        2014) يضمّ الوحدات التي تدير أنظمة الضمان الاجتماعي الإجبارية. وفي
        تونس، تُرتبط صناديق الضمان الاجتماعي (CNSS وCNRPS وCNAM) بهذا القطاع
        اقتصاديًا رغم كونها قانونيًا مؤسسات عمومية لا تكتسي صبغة إدارية.
      synonymes: []

  - id: cotisations-sociales
    acronyme: null
    statut: valide
    references: []
    source_definition: {ref: loi60-30}
    voir_aussi: [cnss, cnrps, cnam]
    fr:
      terme: Cotisations sociales
      definition: >
        Prélèvements obligatoires assis sur les salaires, finançant les régimes
        de sécurité sociale (retraite, maladie, prestations familiales).
      synonymes: []
    ar:
      terme: المساهمات الاجتماعية
      definition: >
        اقتطاعات إجبارية على الأجور، تموّل أنظمة الضمان الاجتماعي (التقاعد،
        المرض، المنح العائلية).
      synonymes: []

  - id: css
    acronyme: CSS
    statut: valide
    references: [lf-2018]
    source_definition: {ref: lf-2018, locator: "art. 53"}
    voir_aussi: [irpp, cotisations-sociales, retenue-a-la-source, compte-diversification-securite-sociale]
    fr:
      terme: Contribution sociale de solidarité
      definition: >
        Contribution instituée « au profit des caisses sociales » par la loi de
        finances pour 2018 (art. 53), due par les personnes physiques soumises
        au barème de l'impôt sur le revenu et par les entreprises soumises à
        l'impôt sur les sociétés, y compris celles qui en sont exonérées. Depuis
        2022, son produit alimente le compte de diversification des sources de
        sécurité sociale.
      synonymes: [CSS]
    ar:
      terme: المساهمة الاجتماعية التضامنية
      definition: >
        مساهمة أحدثها قانون المالية لسنة 2018 (الفصل 53) «لفائدة الصناديق
        الاجتماعية»، يدفعها الأشخاص الطبيعيون الخاضعون لجدول الضريبة على الدخل
        والمؤسسات الخاضعة للضريبة على الشركات، بما فيها المعفاة منها. ومنذ سنة
        2022، تُرصد عائداتها في حساب تنويع مصادر الضمان الاجتماعي.
      synonymes: []

  - id: irpp
    acronyme: IRPP
    statut: valide
    references: [loi-irpp-is-1989]
    source_definition: {ref: loi-irpp-is-1989}
    voir_aussi: [bareme-irpp, taux-marginal, assiette-fiscale, css, retenue-a-la-source, revenu-annuel-net, regime-forfaitaire]
    fr:
      terme: Impôt sur le revenu des personnes physiques
      definition: >
        Impôt direct et progressif frappant le revenu net global des personnes
        physiques, retenu à la source sur les salaires (code de l'IRPP et de
        l'IS, loi n°89-114).
      synonymes: [IRPP]
    ar:
      terme: الضريبة على دخل الأشخاص الطبيعيين
      definition: >
        ضريبة مباشرة تصاعدية على الدخل الصافي الجملي للأشخاص الطبيعيين، تُخصم من
        المورد على الأجور.
      synonymes: []

  - id: contribution-personnelle-etat
    acronyme: CPE
    statut: valide
    references: [lf-1986, decret86-1188, loi-irpp-is-1989]
    source_definition: {ref: loi-irpp-is-1989, locator: "art. 2"}
    source_traduction: {ref: decret86-1188, locator: "art. 1er"}
    voir_aussi: [irpp, bareme-irpp, taux-marginal]
    fr:
      terme: Contribution personnelle d'État
      definition: >
        Impôt progressif sur le revenu global des personnes physiques, qui
        surmontait les impôts distincts frappant chaque catégorie de revenu, dits
        cédulaires. Elle procédait du décret du 31 mars 1932 ; son dernier barème,
        fixé par l'article 8 de la loi de finances pour 1986, a été détaillé en
        table de cotes d'impôt par le décret n° 86-1188 du 12 novembre 1986.
        L'article 2 de la loi n° 89-114 du 30 décembre 1989 la supprime, avec les
        impôts cédulaires, pour les revenus réalisés à compter du 1^er^ janvier
        1990, que frappe désormais l'impôt sur le revenu des personnes physiques.
      synonymes: [CPE]
    ar:
      terme: الضريبة الشخصية للدولة
      definition: >
        ضريبة تصاعدية على الدخل الجملي للأشخاص الطبيعيين، كانت تعلو الضرائب
        المستقلّة المفروضة على كلّ صنف من أصناف الدخل. وكانت تستند إلى الأمر
        المؤرّخ في 31 مارس 1932؛ وقد ضبط الفصل 8 من قانون المالية لسنة 1986 آخر
        جدول لها، وفصّله الأمر عدد 1188 لسنة 1986 المؤرّخ في 12 نوفمبر 1986 في
        جدول لمبالغ الضريبة. وألغاها الفصل 2 من القانون عدد 114 لسنة 1989 المؤرّخ
        في 30 ديسمبر 1989، مع الضرائب المفروضة على أصناف الدخل، بالنسبة إلى
        المداخيل المحقّقة ابتداءً من غرّة جانفي 1990، التي أصبحت تخضع للضريبة على
        دخل الأشخاص الطبيعيين.
      synonymes: []

  - id: assiette-fiscale
