    voir_aussi: [office-oeuvres-universitaires, hebergement-universitaire, restauration-universitaire, bourse-nationale]
    fr:
      terme: Œuvres universitaires
      definition: >
        Services rendus aux étudiants — hébergement, restauration, bourses —, qui
        forment un programme du budget du ministère de l'enseignement supérieur.
      synonymes: [Services universitaires]
    ar:
      terme: الخدمات الجامعية
      definition: ""
      synonymes: []

  - id: bourse-integration-universitaire
    acronyme: null
    statut: valide  # AR lu par le documentaliste au décret n° 2018-927 ; intitulé arabe de l'arrêté du 4 décembre 2018
    references: [decret2018-927, arrete-2018-12-04-bourse-integration]
