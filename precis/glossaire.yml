      synonymes: []

  - id: tableau-c-tva
    acronyme: null
    statut: provisoire
    references: [loi-88-61-tva, loi-2006-80-reduction-taux]
    source_definition: {ref: loi-88-61-tva, locator: "tableau C"}
    voir_aussi: [taux-majore-tva, tva]
    fr:
      terme: Tableau C du code de la TVA
      definition: >
        Annexe du code énumérant les produits soumis au taux majoré. Supprimée
        au 1er janvier 2007 par l'article 13 de la loi n° 2006-80. Dispositif
        historique.
      synonymes: []
    ar:
      terme: الجدول « ج »
      definition: ""
      synonymes: []

  - id: taux-normal-tva
    acronyme: null
    statut: provisoire
    references: [loi-88-61-tva]
    source_definition: {ref: loi-88-61-tva, locator: "art. 7 § 1"}
    voir_aussi: [tva, taux-reduit-tva, taux-majore-tva]
    fr:
      terme: Taux normal de la TVA
      definition: >
        Taux de droit commun, applicable à toute opération imposable qu'un
        texte ne range pas ailleurs. Fixé à 17 % en 1988, porté à 18 % puis à
        19 %.
      synonymes: []
    ar:
      terme: النسبة العادية
      definition: ""
      synonymes: []

  - id: taux-reduit-tva
    acronyme: null
    statut: provisoire
    references: [loi-88-61-tva, decret-98-952-fiscalite-petrole-electricite]
    source_definition: {ref: loi-88-61-tva, locator: "art. 7 § 2"}
    voir_aussi: [tableau-b-tva, taux-normal-tva, tva]
    fr:
      terme: Taux réduit de la TVA
      definition: >
        Taux inférieur au taux normal, applicable aux produits et services que
        le tableau B énumère. L'article 8 du code borne à l'année civile toute
        réduction accordée par décret, d'où des reconductions annuelles.
      synonymes: []
    ar:
      terme: النسبة المخفضة
      definition: ""
      synonymes: []

  - id: taux-majore-tva
    acronyme: null
    statut: provisoire
