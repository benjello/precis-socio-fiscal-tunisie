    source_traduction: {ref: decret2018-927}
    voir_aussi: [bourse-nationale]
    fr:
      terme: Bourse d'intégration universitaire
      definition: >
        Bourse versée en une seule tranche au nouveau bachelier inscrit dans
        l'enseignement supérieur public, sous le plafond de revenu de la bourse
        nationale ; créée par le décret n° 2018-927, l'arrêté du 4 décembre 2018 en fixe
