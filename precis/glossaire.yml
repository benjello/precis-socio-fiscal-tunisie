    references: [decret-71-356-bourses-scolaires]
    source_definition: {ref: decret-71-356-bourses-scolaires, locator: "art. 9-11"}
    voir_aussi: [bourse-scolaire]
    fr:
      terme: Commission régionale des bourses scolaires
      definition: >
        Commission instituée dans chaque gouvernorat, sur la proposition de laquelle le
        ministre accorde les bourses scolaires, dans la limite des crédits.
      synonymes: []
    ar:
      terme: اللجنة الجهوية للمنح المدرسية
      definition: ""
      synonymes: []

  # Aides universitaires

  - id: bourse-nationale
    acronyme: null
    statut: valide  # AR lu : décret n° 2009-3040 (AR), art. 3-5
    references: [decret57-78-bourse-nationale, decret71-361-bourses, decret86-688-bourses-prets, decret2009-3040-bourses-prets, arrete-2015-12-04-bourses-montants]
    source_definition: {ref: decret2009-3040-bourses-prets, locator: "art. 3-4"}
    source_traduction: {ref: decret2009-3040-bourses-prets, locator: "art. 3"}
    voir_aussi: [pret-universitaire, allocation-supplementaire, bourse-specifique, condition-de-ressources, smig]
    fr:
      terme: Bourse nationale d'études universitaires
      definition: >
        Bourse mensuelle accordée par l'État, dans la limite des crédits ouverts chaque
        année, aux étudiants et élèves de l'enseignement supérieur, en Tunisie ou à
        l'étranger, sous condition de ressources des parents ; en Tunisie, elle est
        servie dix mois et exclut les bénéficiaires d'un présalaire.
      synonymes: [Bourse nationale, Bourse nationale d'études supérieures]
    ar:
      terme: المنحة الوطنية للدراسات الجامعية
      definition: >
        منحة شهرية تسندها الدولة، في حدود الاعتمادات المرصودة سنويا، لطلبة وتلاميذ
        التعليم العالي بالبلاد التونسية أو بالخارج، بشرط ألا يتجاوز دخل أوليائهم سقفا
        محددا؛ وتُصرف بالبلاد التونسية على عشرة أشهر، ولا ينتفع بها الذين يتقاضون مرتبا
        قبليا.
      synonymes: [المنح الوطنية]

  - id: pret-universitaire
    acronyme: null
    statut: valide  # AR lu : décret n° 2009-3040 (AR), art. 1er et 7-8
    references: [decret86-688-bourses-prets, decret2009-3040-bourses-prets, decret99-1544-prets-caisses]
    source_definition: {ref: decret86-688-bourses-prets, locator: "art. 1er et 8"}
    source_traduction: {ref: decret2009-3040-bourses-prets, locator: "art. 7"}
    voir_aussi: [bourse-nationale]
    fr:
      terme: Prêt universitaire
      definition: >
        Aide servie sous forme de prêt, dans la limite des crédits, à l'étudiant qui ne
        bénéficie pas de la bourse nationale ; elle est remboursable sur dix ans.
      synonymes: []
    ar:
      terme: القرض الجامعي
      definition: >
        إعانة تُسند في شكل قرض، في حدود الاعتمادات المرصودة، للطالب الذي لا ينتفع
        بالمنحة الوطنية، وتُسدَّد على عشر سنوات.
      synonymes: [القروض الجامعية]

  - id: office-oeuvres-universitaires
    acronyme: null
    # AR lu par le documentaliste aux visas des décrets n° 2018-927 et 2019-806 (note
    # aides universitaires, § 7) et à l'image (décret n° 2009-3040, JORT AR n° 84 de 2009,
    # p. 3816). Le français garde « œuvres universitaires », terme des lois de 1988 et du
    # texte rendu, alors que l'office scolaire suit l'arabe : asymétrie à trancher.
    statut: valide
    references: [loi70-9-onou, loi88-135-oou-nord, loi88-136-oou-centre, loi88-137-oou-sud, decret2014-4200-oou]
    source_definition: {ref: loi88-135-oou-nord, locator: "art. 1er-2"}
    source_traduction: {ref: decret2018-927}
    voir_aussi: [epa, oeuvres-universitaires, hebergement-universitaire, restauration-universitaire, office-oeuvres-scolaires]
    fr:
      terme: Office des œuvres universitaires
      definition: >
        Établissement public qui loge et nourrit les étudiants de l'enseignement public
        ; trois offices, pour le Nord, le Centre et le Sud, remplacent en 1988 l'office
        national créé en 1970.
      synonymes: []
    ar:
      terme: ديوان الخدمات الجامعية
      definition: >
        مؤسسة عمومية تتولى إيواء طلبة التعليم العالي العمومي وإطعامهم؛ وقد أُحدثت سنة
        1988 ثلاثة دواوين: ديوان الخدمات الجامعية للشمال، وديوان الخدمات الجامعية للوسط،
        وديوان الخدمات الجامعية للجنوب، خلفا لديوان وطني أُحدث سنة 1970.
      synonymes: []

  - id: oeuvres-universitaires
    acronyme: null
    statut: provisoire  # AR : intitulé du programme 3 du PAP 2014 de l'enseignement supérieur (texte arabe, non JORT)
    references: [mesrs-pap-2014]
