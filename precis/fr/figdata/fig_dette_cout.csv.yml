caveats: [SÉRIE RACCORDÉE PAR SEGMENTS, NON CHAÎNÉE : la colonne `source` distingue les segments ; BM-GFS (déclarations tunisiennes au FMI, 1972-2012) et MdF-exécution (bulletins nationaux). Sur une année commune, l'exécution MdF l'emporte. Le TROU éventuel entre 2012 et le premier bulletin MdF versé reste VIDE (non inventé) ; il se comble en versant d'autres bulletins de décembre. Les définitions des deux sources peuvent différer légèrement (périmètre, traitement des opérations) : ne pas lire une rupture de segment comme une variation économique. Voir docs/finances-publiques-indicateurs.md., SÉRIE ASSEMBLÉE DE PLUSIEURS BULLETINS de décembre ; sur une année commune, l'édition la plus RÉCENTE l'emporte (valeurs les plus révisées, colonne `edition`). Chaque édition tabule ~5 années d'exécution ; les colonnes LF/LFC et les périodes partielles (End November/October, End January) sont écartées. Le « solde budgétaire » N'EST PAS le déficit « normes internationales » de finances-publiques-indicateurs (définitions différentes). Le solde PRIMAIRE = solde budgétaire + charge d'intérêt. Pour un ratio au PIB, employer le PIB implicite de finances-publiques-indicateurs. Recoupement 2012 : 1 267,6 MDT (MdF) vs 1 272,1 MDT (GFS/BM). Chiffres provisoires révisés entre éditions. Avant 2012, voir finances-publiques-gfs. Voir docs/finances-publiques-indicateurs.md., DÉFINITION DU DÉFICIT reprise du tableau : « déficit selon les normes internationales, hors privatisation, dons extérieurs et revenus confisqués, Y COMPRIS le recouvrement du principal de la dette et les prêts » — ce n'est PAS le solde budgétaire brut ni le solde primaire ; la charge d'intérêt n'est pas isolée ici (elle l'est dans les Résultats d'exécution du budget). Périmètre ADMINISTRATION CENTRALE (≠ administrations publiques du WEO). Derniers exercices PROVISOIRES, révisés d'une édition à l'autre. Les ratios étaient stockés en fractions dans le XLS, remis en pourcent. PIB IMPLICITE : `dette_MDT`/`dette_pct_pib`×100 redonne le PIB employé par le ministère (dénominateur interne cohérent, hors ruptures de base INS). Voir docs/finances-publiques-indicateurs.md.]
