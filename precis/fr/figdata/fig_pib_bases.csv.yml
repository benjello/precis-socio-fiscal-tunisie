caveats: [SÉRIE CONSTRUITE POUR ILLUSTRATION ; filtrer `variante`. LA VARIANTE ENCHAÎNÉE EST UNE CONSTRUCTION DU PRÉCIS, NON UNE DONNÉE DE L'INS : elle préserve la croissance, pas les niveaux ni les structures, ne remplace pas une rétropolation et ne doit servir de dénominateur à aucun ratio. La variante accolée porte deux taux FAUX (`croissance_fausse`) : + 20,34 % en 1997 (croissance + 9,61 %, changement de base + 9,79 %) et + 12,72 % en 2010 (croissance + 7,46 %, changement de base + 4,89 %). Règle d'enchaînement : le taux de l'année est celui de la base la plus récente qui porte l'année et la précédente ; les années de jonction 2010 et 1997 prennent donc leur taux dans l'ancienne base. Voir docs/pib-courant-enchaine.md., SÉRIE CONSTRUITE POUR ILLUSTRATION. Plusieurs taux pour une même année : filtrer `base`. Sur les années connues dans deux bases, les taux diffèrent de 0,2 à 0,4 point en moyenne (1,32 point au plus, en 2007) alors que les niveaux diffèrent de 5 à 10 %. Avant 1992, aucune base n'est dite : taux de la Banque mondiale. Pour un seul taux par année, voir `cnat-pib-nominal-croissance` et `croissances-revenus-prix`. Voir docs/pib-croissance-par-base.md., Écarts OBSERVÉS, jamais extrapolés : de + 9,25 à + 10,91 % (1983 → 1997), de + 4,89 à + 6,12 % (1997 → 2015). Ils ne sont pas constants : ne pas en tirer un coefficient de passage pour d'autres années. Aucune année n'est connue à la fois en base 1983 et en base 2015. Voir docs/pib-courant-par-base.md.]
