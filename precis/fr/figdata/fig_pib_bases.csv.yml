caveats: [Trois constructions à ne pas confondre. Publié : le niveau figure dans une publication de l'INS, ou dans les chiffres que l'INS a transmis aux Nations unies. Rétropolé par l'INS : recalculé par l'INS dans une base plus récente, pour 1997-2004 en base 1997 et pour 2010-2014 en base 2015. Enchaîné par nos soins : construction du précis à fin d'illustration, non une donnée de l'INS ; elle préserve les taux de croissance, pas les niveaux ni les structures, ne remplace pas une rétropolation et ne sert de dénominateur à aucun ratio. La série accolée porte deux taux faux, aux années où elle change de base : 1997 et 2010. Avant 1992, les niveaux sont ceux de la Banque mondiale, dont la base n'est pas dite., Série construite à fin d'illustration à partir de niveaux publiés ou rétropolés par l'INS : chaque taux rapporte deux niveaux de la même base. Une année connue dans deux bases a deux taux, qui diffèrent de 0,2 à 0,4 point en moyenne, alors que les niveaux diffèrent de 5 à 10 %. De 1962 à 1992, aucune base n'est dite., Écarts observés, de + 9,25 à + 10,91 % entre la base 1983 et la base 1997, de + 4,89 à + 6,12 % entre la base 1997 et la base 2015 : ils ne sont pas constants et ne donnent pas de coefficient de passage pour d'autres années. Aucune année n'est connue à la fois en base 1983 et en base 2015.]
