caveats: [Une année a plusieurs taux, selon la source, la base et l'année de prix. L'année de prix n'est pas une base : c'est l'année dont les prix valorisent le volume — 1966, 1972, 1980 ou 1990 dans les séries anciennes, l'année précédente dans les bases 1997 et 2015. Les sources tunisiennes s'accordent à quelques dixièmes de point ; la Banque mondiale s'en écarte de 6 à 22 points de 1962 à 1965. L'année 1970 n'a de taux que de la Banque mondiale. Les séries antérieures à 1993 ne disent pas leur base., Enchaîné par nos soins : construction du précis à fin d'illustration, non une donnée de l'INS. L'indice chaîne des taux de sept combinaisons de base et d'année de prix ; il préserve les taux de croissance, pas les niveaux ni les structures, ne remplace pas une rétropolation, n'a pas de niveau en dinars et ne sert de dénominateur à aucun ratio., Trois constructions à ne pas confondre. Publié : le niveau figure dans une publication de l'INS, ou dans les chiffres que l'INS a transmis aux Nations unies. Rétropolé par l'INS : recalculé par l'INS dans une base plus récente, pour 1997-2004 en base 1997 et pour 2010-2014 en base 2015. Enchaîné par nos soins : construction du précis à fin d'illustration, non une donnée de l'INS ; elle préserve les taux de croissance, pas les niveaux ni les structures, ne remplace pas une rétropolation et ne sert de dénominateur à aucun ratio. La série accolée porte deux taux faux, aux années où elle change de base : 1997 et 2010. Avant 1992, les niveaux sont ceux de la Banque mondiale, dont la base n'est pas dite.]
