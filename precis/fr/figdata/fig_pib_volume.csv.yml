caveats: [PLUSIEURS TAUX POUR UNE MÊME ANNÉE : filtrer `source`, `base` et `annee_de_prix`. UNE ANNÉE DE PRIX N'EST PAS UNE BASE : un taux en volume dépend de la base des comptes et de l'année dont les prix valorisent le volume. Les sources tunisiennes s'accordent à quelques dixièmes de point ; la Banque mondiale s'en écarte de 6 à 22 points en 1962-1965 (signe contraire), de 1 à 2 points en 1986-1990 et en 2001. 1970 n'a de taux que de la Banque mondiale. Taux imprimés à une décimale quand `mode` = imprimé. Voir docs/pib-croissance-volume.md., SÉRIE CONSTRUITE POUR ILLUSTRATION : CONSTRUCTION DU PRÉCIS, NON UNE DONNÉE DE L'INS. L'indice chaîne des taux de sept combinaisons de base et d'année de prix (colonne `jonction`) ; il préserve la croissance, pas les niveaux ni les structures, et ne remplace pas une rétropolation. Le taux de 1970 est celui de la Banque mondiale, faute de taux d'origine tunisienne. Voir docs/pib-croissance-volume.md., SÉRIE CONSTRUITE POUR ILLUSTRATION ; filtrer `variante`. LA VARIANTE ENCHAÎNÉE EST UNE CONSTRUCTION DU PRÉCIS, NON UNE DONNÉE DE L'INS : elle préserve la croissance, pas les niveaux ni les structures, ne remplace pas une rétropolation et ne doit servir de dénominateur à aucun ratio. La variante accolée porte deux taux FAUX (`croissance_fausse`) : + 20,34 % en 1997 (croissance + 9,61 %, changement de base + 9,79 %) et + 12,72 % en 2010 (croissance + 7,46 %, changement de base + 4,89 %). Règle d'enchaînement : le taux de l'année est celui de la base la plus récente qui porte l'année et la précédente ; les années de jonction 2010 et 1997 prennent donc leur taux dans l'ancienne base. Voir docs/pib-courant-enchaine.md.]
