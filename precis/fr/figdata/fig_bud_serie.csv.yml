caveats: [CE N'EST PAS UN TOTAL DE L'ÉTAT : le budget d'équipement, puis de développement, est à part et sa structure change d'une loi à l'autre (non lu). Montant VOTÉ du seul budget ordinaire (titre I), jamais une réalisation ; il peut comprendre une contribution au budget d'équipement (3 MD en 1961) et la loi ne dit pas, à ces articles, s'il comprend le service de la dette. NE SE RACCORDE PAS à denominateurs-depenses-etat-pib (dépenses de l'État hors service de la dette, réalisation, depuis 1986) : concepts différents, jamais chaînés. La loi de finances pour 1983 fixe en outre un budget général de 1 753 MD (954 courantes, 799 d'investissement) : non versé, sans équivalent les années voisines. 1959-60 : le chiffre des crédits est effacé à l'image, seules les recettes sont lues. Non lus : budget ordinaire de 1958-59 (en francs, fixé par décret du 29 juin 1957, fascicule absent du corpus local), gestion 1960 (aucune notice), lois de finances complémentaires. Recettes et crédits égaux chaque année lue : l'égalité contrôle la lecture. Fascicules scannés : lecture à l'image ou océrisation concordante (colonne lecture)., LE PIB N'EST JAMAIS CHAÎNÉ : segment_pib change en 1986, 1992, 1997, 2002, 2005, 2010 et 2025 ; une part du PIB se trace par segments. 1984-1985 : PIB de la Banque mondiale, bases accolées non raccordées ; 1986-1991 : PIB du ministère des Finances, base 1983 PRÉSUMÉE ; 2002-2004 et 2025 : valeur propre au ministère, rattachée à aucune base ; 2010-2014 : base 2015 rétropolée par l'INS. Les dépenses de l'État sont des RÉALISATIONS : rapportée à elles, une prévision de loi de finances donne un ordre de grandeur, non une exécution. AUCUNE DÉPENSE DE L'ÉTAT AVANT 1986.]
