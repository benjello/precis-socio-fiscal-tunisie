caveats: [EXÉCUTION BUDGÉTAIRE, PAS UN COMPTE NATIONAL ; NON RACCORDÉE AUX SÉRIES DEPUIS 1986 (loi de règlement de 1986 et suivantes non lues). Présentation changeante, jamais chaînée (colonne presentation) : budget unique d'exercice en 1954-55 et 1955-56 (droits et produits, droits acquis, exercices clos) ; budget général par gestion de 1956-57 à 1961, qui mêle services ordinaires, extraordinaires et à destination spéciale ; titre I seul pour 1962, 1963 et 1964, le titre II de ces trois années étant réglé en un seul agrégat triennal (loi n° 83-88, gestion « 1962-64 », jamais réparti par année) ; titres I et II, établissements publics et fonds spéciaux de 1965 à 1985, postes diplomatiques à partir de 1980. Gestion 1960 de neuf mois (imprimé) ; les bornes des gestions à cheval sur deux années ne sont pas imprimées dans ces lois. Les recouvrements de 1956-57 à 1961 comprennent des avances du Trésor pour l'équipement (poste dont_avance_tresor), ceux du titre I de 1968 et suivantes parfois un prélèvement sur les ressources de trésorerie. Signes des différences pas toujours imprimés : comparer en valeur absolue. Tableaux annexés non transcrits (pour 1954-1964, « publiés ultérieurement »). Quatre écarts d'impression laissés tels quels (fiche). Lecture : 825 montants à l'image, 923 par OCR confirmé par au moins une identité imprimée.]
