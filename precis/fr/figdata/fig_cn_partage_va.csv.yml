caveats: [Permet la part des salaires / taux de marge des SOCIÉTÉS NON FINANCIÈRES (rem_snf/VA_snf et son complément) — l'indicateur de Cotis (2009) et d'Askenazy-Cette-Sylvain, qui évite le revenu mixte (logé chez les ménages). Pour les ménages, `revenu_exploitation` = revenu mixte (travail indépendant + capital), à ne pas lire comme du capital pur. LES NIVEAUX NE SE COMPARENT PAS ENTRE BASES : filtrer `base`. Garde-fou : VA = rémunération + revenu d'exploitation vérifié à 1 MD près par secteur. Ancres : SNF 2021 VA 42 847,9 / rémun 23 704,4 / EBE 19 143,5 ; APU rémun 21 710,6 ; ménages revenu mixte 39 961,6. Réserve de comparaison internationale des NIVEAUX (définition VA au prix de base, impôts sur la production) : voir docs/cnat-approche-revenus.md., LES NIVEAUX NE SE COMPARENT PAS D'UNE BASE À L'AUTRE (base 2015 ≈ +6 % sur base 1997) : filtrer `base`, tracer la part du PIB PAR SEGMENTS, ne jamais chaîner. REVENU MIXTE : `revenu_exploitation` mêle l'excédent des sociétés et le revenu mixte des entreprises individuelles (ménages) — la part des salaires (≈ 36 % en 2005 à 43 % en 2024) SOUS-ESTIME le travail (le travail des indépendants est compté en capital) ; pour un partage corrigé, calculer sur la seule VA des sociétés (par secteur institutionnel, présent dans le tableau, à extraire) ou imputer le revenu mixte. Garde-fou de construction : identité PIB = rémunération + impôts − subventions + revenu d'exploitation vérifiée à 0,1 MD près. Ancres contrôlées : rémunération 2021=55 588,7 ; 2015=35 572,6 ; 2020=50 242,1 ; PIB 2012=70 354,5. Ni la BCT ni les CSV cnat-consolide/* ne donnent ce découpage en niveaux. Voir docs/cnat-approche-revenus.md., UNdata relaie les comptes de l'INS : sur le recouvrement 2005-2009 (base 1997), la rémunération est IDENTIQUE au dixième à celle des éditions INS (contrôle intégré) ; 2010-2011 divergent légèrement (millésime d'édition différent, UNdata étant une version antérieure). LES NIVEAUX NE SE COMPARENT PAS ENTRE BASES : filtrer `base`. Le capital (B.2g) INCLUT le revenu mixte des indépendants : la part des salaires est la mesure « économie entière » (naïve), pas le partage propre des sociétés (limité à 2005+, éditions INS). Valeurs UNdata en dinars, converties en millions (÷10^6). Compte de génération absent des fichiers 1990-1991, 2012-2014 et 2024 (comblés par l'INS pour 2012-2014). Voir docs/cnat-approche-revenus.md.]
