caveats: [DÉFINITION DU DÉFICIT reprise du tableau : « déficit selon les normes internationales, hors privatisation, dons extérieurs et revenus confisqués, Y COMPRIS le recouvrement du principal de la dette et les prêts » — ce n'est PAS le solde budgétaire brut ni le solde primaire ; la charge d'intérêt n'est pas isolée ici (elle l'est dans les Résultats d'exécution du budget). Périmètre ADMINISTRATION CENTRALE (≠ administrations publiques du WEO). Derniers exercices PROVISOIRES, révisés d'une édition à l'autre. Les ratios étaient stockés en fractions dans le XLS, remis en pourcent. PIB IMPLICITE : `dette_MDT`/`dette_pct_pib`×100 redonne le PIB employé par le ministère (dénominateur interne cohérent, hors ruptures de base INS). Voir docs/finances-publiques-indicateurs.md., IDENTITÉ : variation_MDT = effet_change_MDT + effet_volume_MDT. L'effet-change mesure la réévaluation en dinars de la dette libellée en devises quand le change bouge, SANS emprunt nouveau ; l'effet-volume, les tirages nets. Fenêtre 2020-2024 (rapport BCT 2024). Dette extérieure à long terme.]
