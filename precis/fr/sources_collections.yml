# Table de REGROUPEMENT SÉMANTIQUE pour l'annexe engendrée « Les sources de
# données chiffrées » (precis/fr/annexe-sources.qmd, engendrée par
# precis/fr/figures/annexe_sources.py).
#
# POURQUOI CETTE TABLE. La normalisation algorithmique du radical de titre
# (voir `_radical`) regroupe les séries dont les titres ne diffèrent que par
# l'année. Elle ne sait PAS, en revanche, reconnaître que des intitulés très
# différents désignent la même source/série/collection (numéros écrits en
# lettres, formulations variées, sujet commun). Cette table le dit EXPLICITEMENT,
# source par source, CONSTRUITE EN LISANT LES INTITULÉS. Elle est versionnée :
# un humain la relit et la corrige.
#
# RÈGLE D'OR. On ne regroupe que des documents qui sont la MÊME source ou la même
# série/collection. Des documents réellement distincts (volumes différents d'un
# même recensement, exercices différents d'une même série d'états financiers) sont
# regroupés SOUS UNE collection mais restent LISTÉS un par un (champ `label`), pour
# ne pas masquer la distinction. Au moindre doute, on ne met pas la clé ici.
#
# FORMAT. Chaque collection :
#   titre        : libellé affiché de la collection (lu dans les titres, non inventé).
#   producteur   : producteur affiché (forme canonique).
#   nature       : "éditions" (série périodique) ou "documents" (dossier de pièces).
#   cles         : soit une liste de clés (l'étiquette par membre est alors déduite :
#                  ordinal en lettres du titre, sinon année) ; soit une liste d'objets
#                  {cle, label} quand il faut nommer la pièce (volume, exercice…).
#
# CHAQUE CLÉ LISTÉE ICI CONSERVE SON ANCRE `#src-<clé>` dans l'entrée condensée.
# Une clé non citée par une figure (absente de l'annexe) est simplement ignorée.

collections:
  # — Cour de discipline financière : série numérotée EN LETTRES (1er … 21e). —
  - titre: "Rapports annuels de la Cour de discipline financière"
    producteur: "Cour de discipline financière"
    nature: "éditions"
    cles:
      - cdf-rapport-01
      - cdf-rapport-02
      - cdf-rapport-03
      - cdf-rapport-04
      - cdf-rapport-05
      - cdf-rapport-06
      - cdf-rapport-07
      - cdf-rapport-08
      - cdf-rapport-09
      - cdf-rapport-10
      - cdf-rapport-11
      - cdf-rapport-12
      - cdf-rapport-13
      - cdf-rapport-14
      - cdf-rapport-15
      - cdf-rapport-16
      - cdf-rapport-17
      - cdf-rapport-18
      - cdf-rapport-19
      - cdf-rapport-20
      - cdf-rapport-21

