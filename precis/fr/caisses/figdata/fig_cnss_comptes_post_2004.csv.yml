caveats: [LE SOLDE TECHNIQUE (produits − charges) N'EST PAS LE RÉSULTAT DE L'EXERCICE : il est égal à la « marge brute (résultat technique) » des états financiers (2018 : 3 079 699 − 3 411 951 = −332 252 mD), et le résultat en diffère de 40 à 340 MD selon les années (frais de gestion, provisions, placements). Ne JAMAIS déduire le résultat de ces R−D — le résultat est dans `cnss-resultat-exercice`. PRODUITS TECHNIQUES : planche 11 « La CNSS en chiffres » (reprise de `cnss-cotisations`, sans ré-extraction) ; cette planche dite « cotisations » est en fait la série des produits techniques (2017 : 2 794 MD = EF 2 794 297 mD, et non les cotisations hors T.O. 2 774 188 mD). Complets 2000-2020, plus 2021 (مداخيل du rapport EP LF 2024). CHARGES TECHNIQUES : prestations servies hors gestion ; la planche 12 (barres empilées) n'a de total lisible en couche texte que pour les deux dernières années de chaque millésime, donc les charges sont renseignées par points sourcés (annuaires « dépenses techniques », états financiers, récapitulatif budget) pour 2009, 2010, 2012, 2013, 2015, 2016, 2017, 2018, 2019, 2020 ; TROUS HONNÊTES 2000-2008, 2011, 2014 (cases vides, jamais interpolées). RUPTURE DE CHAMP 2006 (CNAM) : produits 1 351 → 993 MD sans baisse de taux ; les deux tronçons ne sont pas homogènes. MONTANTS COURANTS, non déflatés. Carte des périmètres et identités : sources/cnss-concordance-perimetres-post-2004.md., SÉRIE LACUNAIRE PAR CONSTRUCTION : la CNSS ne publie pas de résultat annuel continu. Une ligne par (année, source), colonne `retenu` (arbitrage « réalisé le plus récent », les variantes écartées restent, retenu=False) et `statut` (realise / budget / provisoire). LE RÉSULTAT N'EST PAS LE SOLDE TECHNIQUE produits − charges (`cnss-produits-charges-techniques`) : il tient compte des frais de gestion, provisions, placements, polycliniques et facturation CNAM, et s'en écarte de 40 à 340 MD. TROUS HONNÊTES 2005-2008, 2011, 2014 : lignes présentes, valeur VIDE, jamais interpolées (annuaires absents de l'entrepôt, Wayback hors ligne au 10 novembre 2026). AVERTISSEMENT sur 2009-2010 et 2015 : issus d'une « موازنة الصندوق » (budget), pas d'un bilan — fragiles. 2019 = −667 MD lu en couche texte des tableaux arabes EP LF 2022 (p. 46) et LF 2023 (p. 78), confirmé par deux éditions (CNSS 2018/2019/2020 = −530/−667/−1071) ; la prévision LF 2021 était −700, à ne pas confondre. 2020 = −1 091,5 (Bilan 2020 et EP LF 2024), −1071 des EP LF 2022/2023 écarté. 2023 provisoire. Carte des périmètres : sources/cnss-concordance-perimetres-post-2004.md., LE PIB DU MINISTÈRE (`pib_minfin_MDT`) N'EST PAS D'UNE SEULE BASE : base 1983 jusqu'en 1996 (présumée avant 1992), base 1997 en 1997-2001 et 2005-2009, valeurs propres au ministère en 2002-2004 et 2025, base 2015 de l'INS de 2010 à 2024 (rétropolée par l'INS pour 2010-2014). RUPTURES DE SÉRIE (colonne `rupture`) : 1997 (niveau + 9,8 %), 2002, 2005, 2010 (niveau + 4,9 %), 2025. Tracer toute part du PIB par segments (`segment_pib`), jamais d'un trait continu. `pib_cnat_MDT` est le PIB de la série `masse-salariale-ratios` : il n'est celui des Comptes de la nation que pour 2010-2024, et ses valeurs ont changé en octobre 2026 : 2012-2014 (base 1997 → base 2015 rétropolée : 70 354,4 → 73 895,4 ; 75 144,1 → 79 096,6 ; 80 865,5 → 85 345,7) et 2023-2024 (dernière édition des Comptes de la nation : 149 733,8 → 149 793,6 ; 159 760,6 → 159 852,7) ; il est égal à `pib_minfin_MDT` de 1990 à 2025, sauf 2023-2024 où le ministère garde l'édition 2020-2024. Voir sources/minfinances-recettes-fiscales.md.]
