caveats: [SCAN SANS COUCHE TEXTE, valeurs océrisées et contrôlées par les IDENTITÉS COMPTABLES (sous-totaux, totaux, résultat = ressources − emplois, ensemble = somme des régimes) ; colonne `statut` sur chaque valeur (lu, lu_corrige, deduit_identite, masque_reliure). LA RELIURE MASQUE une colonne d'années sur la plupart des tableaux (1999 surtout, 2000 sur certains) : 430 cellules sont rétablies par une identité à une seule inconnue et 68 par le solveur fragments + identités (chiffres visibles lus case par case ; valeur unique compatible avec eux et avec toutes les identités ; validé sans erreur sur 771 valeurs connues masquées à l'identique), jamais devinées dans la colonne `valeur` ; 360 y restent vides, listées avec leur fragment visible dans cnss_retrospective_valeurs_a_retrouver.csv (221 à lire sur l'original, le reste s'en déduit). ESTIMATIONS PROVISOIRES : en attendant l'original, ces 360 cellules (1999 surtout, quelques-unes de 2000) reçoivent une estimation tracée (colonnes `estimation`, `methode_estimation`, `incertitude` ; tendance de la ligne, candidats compatibles avec les chiffres visibles, mise en cohérence avec les identités comptables), et `valeur_ou_estimation` réunit valeurs et estimations pour l'exploitation directe : les valeurs 1999 — et certaines de 2000 — de cette colonne sont donc pour partie des ESTIMATIONS, à ne pas citer comme données publiées. Estimations publiées et versionnées dans cnss_retrospective_estimations.csv, remplacées quand l'original est relu. Quatorze identités s'écartent de 2 mD entre valeurs imprimées vérifiées à l'image (totaux 2004 de tableaux jumeaux, emplois 1996) : écarts de la source, laissés tels quels. Unité : milliers de dinars (les cotisations 2000-2004 recoupent la série cnss-cotisations, en millions, à 1 % près). Comptabilité « Bilans » (droits constatés) : ne pas confondre avec les cotisations encaissées. Montants courants, non déflatés., sources/minfinances-recettes-fiscales.md]
