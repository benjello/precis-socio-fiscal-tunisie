caveats: [SCAN SANS COUCHE TEXTE, valeurs océrisées et contrôlées par les IDENTITÉS COMPTABLES (sous-totaux, totaux, résultat = ressources − emplois, ensemble = somme des régimes) ; colonne `statut` sur chaque valeur (lu, lu_corrige, deduit_identite, masque_reliure). LA RELIURE MASQUE une colonne d'années sur la plupart des tableaux (1999 surtout, 2000 sur certains) : 430 cellules sont rétablies par une identité à une seule inconnue et 68 par le solveur fragments + identités (chiffres visibles lus case par case ; valeur unique compatible avec eux et avec toutes les identités ; validé sans erreur sur 771 valeurs connues masquées à l'identique), jamais devinées dans la colonne `valeur` ; 360 y restent vides, listées avec leur fragment visible dans cnss_retrospective_valeurs_a_retrouver.csv (221 à lire sur l'original, le reste s'en déduit). ESTIMATIONS PROVISOIRES : en attendant l'original, ces 360 cellules (1999 surtout, quelques-unes de 2000) reçoivent une estimation tracée (colonnes `estimation`, `methode_estimation`, `incertitude` ; tendance de la ligne, candidats compatibles avec les chiffres visibles, mise en cohérence avec les identités comptables), et `valeur_ou_estimation` réunit valeurs et estimations pour l'exploitation directe : les valeurs 1999 — et certaines de 2000 — de cette colonne sont donc pour partie des ESTIMATIONS, à ne pas citer comme données publiées. Estimations publiées et versionnées dans cnss_retrospective_estimations.csv, remplacées quand l'original est relu. Quatorze identités s'écartent de 2 mD entre valeurs imprimées vérifiées à l'image (totaux 2004 de tableaux jumeaux, emplois 1996) : écarts de la source, laissés tels quels. Unité : milliers de dinars (les cotisations 2000-2004 recoupent la série cnss-cotisations, en millions, à 1 % près). Comptabilité « Bilans » (droits constatés) : ne pas confondre avec les cotisations encaissées. Montants courants, non déflatés., LE PIB DU MINISTÈRE (`pib_minfin_MDT`) N'EST PAS D'UNE SEULE BASE : base 1983 jusqu'en 1996 (présumée avant 1992), base 1997 en 1997-2001 et 2005-2009, valeurs propres au ministère en 2002-2004 et 2025, base 2015 de l'INS de 2010 à 2024 (rétropolée par l'INS pour 2010-2014). RUPTURES DE SÉRIE (colonne `rupture`) : 1997 (niveau + 9,8 %), 2002, 2005, 2010 (niveau + 4,9 %), 2025. Tracer toute part du PIB par segments (`segment_pib`), jamais d'un trait continu. `pib_cnat_MDT` est le PIB de la série `masse-salariale-ratios` : il n'est celui des Comptes de la nation que pour 2010-2024, et ses valeurs ont changé en octobre 2026 : 2012-2014 (base 1997 → base 2015 rétropolée : 70 354,4 → 73 895,4 ; 75 144,1 → 79 096,6 ; 80 865,5 → 85 345,7) et 2023-2024 (dernière édition des Comptes de la nation : 149 733,8 → 149 793,6 ; 159 760,6 → 159 852,7) ; il est égal à `pib_minfin_MDT` de 1990 à 2025, sauf 2023-2024 où le ministère garde l'édition 2020-2024. Voir sources/minfinances-recettes-fiscales.md.]
