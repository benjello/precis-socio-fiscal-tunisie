caveats: [PRÉVISIONS DE LOI DE FINANCES, JAMAIS DES RÉALISATIONS : les lois de règlement s'arrêtent au titre et n'exposent pas la ligne des caisses (réalisations absentes du JORT, report au backlog). RUPTURE DE PÉRIMÈTRE 1994->1995 PORTÉE, NON LISSÉE : le total détaillé 37,0 MD de 1994 saute à l'agrégat 57,0 MD en 1995 ; les composantes (avant 1995) et l'agrégat (1995+) ne sont jamais raccordés en silence (colonne segment_perimetre), la source ne décompose pas le saut. total_caisses_md exclut la ligne voisine 62-12 « transferts fonds spéciaux » (recette d'ordre, non caisse) ; les codes de ligne sont instables (62-12 sert selon l'année à la contribution familles nécessiteuses ou aux transferts fonds spéciaux) — le suivi se fait par libellé, pas par code. Plateau 57,0 MD de 1995 à 2003, 62,5 MD en 2004-2005. Forfaits hospitaliers déjà inscrits en 1985 (antériorité 1975-1984 non versée). TABLEAUX A SCANNÉS SANS COUCHE TEXTE : lecture à l'image, non océrisés en masse., LE PIB DU MINISTÈRE (`pib_minfin_MDT`) N'EST PAS D'UNE SEULE BASE : base 1983 jusqu'en 1996 (présumée avant 1992), base 1997 en 1997-2001 et 2005-2009, valeurs propres au ministère en 2002-2004 et 2025, base 2015 de l'INS de 2010 à 2024 (rétropolée par l'INS pour 2010-2014). RUPTURES DE SÉRIE (colonne `rupture`) : 1997 (niveau + 9,8 %), 2002, 2005, 2010 (niveau + 4,9 %), 2025. Tracer toute part du PIB par segments (`segment_pib`), jamais d'un trait continu. `pib_cnat_MDT` est le PIB de la série `masse-salariale-ratios` : il n'est celui des Comptes de la nation que pour 2010-2024, et ses valeurs ont changé en octobre 2026 : 2012-2014 (base 1997 → base 2015 rétropolée : 70 354,4 → 73 895,4 ; 75 144,1 → 79 096,6 ; 80 865,5 → 85 345,7) et 2023-2024 (dernière édition des Comptes de la nation : 149 733,8 → 149 793,6 ; 159 760,6 → 159 852,7) ; il est égal à `pib_minfin_MDT` de 1990 à 2025, sauf 2023-2024 où le ministère garde l'édition 2020-2024. Voir sources/minfinances-recettes-fiscales.md.]
