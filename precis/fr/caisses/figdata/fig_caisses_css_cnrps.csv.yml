caveats: [SÉRIE DE CONTRÔLE, PAS DE NIVEAU. PLUSIEURS LIGNES RETENUES PAR ANNÉE quand les définitions diffèrent (2020, 2022, 2023) : filtrer sur la colonne css en plus de retenu. AVEC OU SANS CSS : rarement dit et contradictoire (colonnes css et base_css) ; 2020 vaut 114,26 / 114,76 (RAP 2020 et 2022) ou 103 / 104 avec la CSS (RAP 2021) ; 2023 : 109,5 / 109,6 avec CSS, 116,4 / 116,8 sans (RAP 2023, p. 30), le tableau mêlant les deux. Contrôle : branche pensions 2019 = 122,09 = dépenses ÷ recettes du régime dans cnrps-pensions, donc sans CSS. RAP 2018 : 126,2 / 128 réalisés provisoires, 121,4 / 123,3 prévus. CSS RETENUE (annexe 9 la plus récente) : 200, 450, 460, 500, 195, 420 MD de 2018 à 2023 ; pour 2020, 450 (allocation budgétaire du RAP 2020, non attribuée à la CNRPS) et 500 (renvoi ambigu du RAP 2021) sont gardées et écartées. Le cumul 2018-2022 imprimé (2 150 MD) ne concorde pas avec la somme annuelle (1 805). Projections 2024-2030 (−1 403 à −4 213 MD) et prévisions 2024-2027 étiquetées comme telles., LES ASSURÉS SONT CEUX DE LA CAISSE (égaux à l'unité aux affiliés actifs de cnrps-pensions). LE « DÉFICIT PENSION » NE CONCORDE PAS avec recettes − dépenses du régime de cnrps-pensions (2015 : −408,6 contre −351,8 ; 2019 : −1 184,8 contre −1 015,7 ; 2017 : −747,4 contre −793,2), sans définition publiée. LES « PENSIONNÉS » NE CORRESPONDENT À AUCUN DÉCOMPTE DE LA CAISSE (2020 : 363 563, contre 271 581 pensions de retraite et 398 627 de toutes natures). 2020 provisoire. Document de programmation d'un projet de coopération, non une publication statistique.]
