caveats: [CHAQUE EXERCICE EST PUBLIÉ DEUX FOIS (colonne N, puis colonne N-1 de l'édition suivante) : édition la plus récente RETENUE, l'autre gardée (`retenu`). 17 RETRAITEMENTS entre éditions (reclassements vers les opérations pour compte en 2006, prêts nets/bruts en 2007, opérations spéciales en 2009-2010), listés dans cpscl_doublons_ecarts.csv et figés dans les tests ; la Banque mondiale (PforR 2014, tabl. 2.11) cite les valeurs de l'édition de l'exercice, non les retraitées. TROIS COQUILLES CORRIGÉES ET TRACÉES (`lecture = corrige`, valeur imprimée gardée) et deux incohérences internes laissées telles quelles (édition 2010, flux de financement ; flux d'exploitation 2018, écart de 90 000 DT). Signes de la page : décaissements et provisions négatifs. PAS DE LIGNE « ENCOURS » : créances = prêts en cours de remboursement et de réalisation + bloc courant (annuités, impayés, provisions, intérêts courus) ; aucune somme calculée. Changement de présentation du passif en 2012. Chute des impayés en 2007 (67,2 → 16,9 MD) avec apparition d'une provision sur créances rééchelonnées. Flux de trésorerie de la caisse, non recoupés avec les budgets des communes.]
