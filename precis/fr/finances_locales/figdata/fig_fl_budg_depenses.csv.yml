caveats: [DEUX SOURCES, GARDÉES TOUTES DEUX SUR 2018-2019 (colonne `retenu` : DGCT jusqu'en 2019, somme des communes ensuite). Les recettes concordent à l'arrondi près ; LES DÉPENSES NON (titre 1 : +1,7 MD en 2018, +7,2 MD en 2019 ; titre 2 : +0,6 et +5,9), écart non expliqué, figé dans les tests. 2021 = SITUATION AU 25/12/2021, non définitive (droits et redevances 54,8 MD contre 90-114 les autres années). 2023 = PROVISOIRE (arrêté au 10/01/2024). IMPÔTS UN À UN (TIB, TNB, TCL, taxe hôtelière, marchés) VIDES EN 2020-2021 : fichiers par commune sans détail d'article ; rien n'est interpolé. Le FCCL est supprimé au 1er janvier 2018 mais la DGCT garde l'intitulé « subventions annuelles » en 2018-2019 : rupture de nature ; réserve à 18 % jusqu'en 2017, 15 % ensuite. Les recettes du titre 2 comprennent l'épargne et les excédents reportés du titre 1 : T1 + T2 n'est pas un total consolidé. Recettes fiscales = catégories 1 et 2 (nomenclature 2018-2022), qui exclut les catégories 3-4 rangées parmi les recettes fiscales en 2023. PÉRIMÈTRE NON CONSTANT : 264 communes en 2012, 350 à partir de 2016-2017. Montants courants., SÉRIES SÉPARÉES, JAMAIS FUSIONNÉES entre elles ni avec la série DGCT : périmètres et nomenclatures différents, sources primaires tunisiennes non publiées. Valeurs SAISIES depuis la page indiquée, lues à l'image pour 1992 (couche OCR fautive : 2 561 et non 2 661) et 1997. LA LIGNE TL/TIB MANQUE AU TABLEAU IMPRIMÉ DE 1997 : résidus des totaux publiés comme `residu_calcule`, jamais comme TL. FCCL 1990 : 82 (1992) contre 50,8 (1997), vraisemblablement fonds total contre quote-part des communes (indices : 63 % des transferts aux communes, 47 % des budgets de fonctionnement en 1988) — NON TRANCHÉ. 1990-1991 de 1992 probablement estimations de mission. PAD 2014 contre DGCT 2008-2012 : recettes T1 concordantes, écarts de 10-14 MD sur dépenses T1 et ressources T2 ; dépenses T2 2012 dépassent de 10 MD investissements + remboursement.]
