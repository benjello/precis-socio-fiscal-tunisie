 "logement-rudimentaire": {
  "autre": "المساكن البدائية",
  "definition": "Habitation insalubre occupée en permanence. Le décret n° 86-438 du 12 avril 1986 range parmi les logements rudimentaires « les gourbis, les kibs, les maamras, les baraques et les tentes » ; le décret n° 2012-1224 du 10 août 2012 retient les locaux habités en permanence dont les matériaux, la surface ou la solidité « ne répondent pas aux normes sanitaires et techniques minimales d'habitabilité ». Leur remplacement est l'objet du programme national de 1986, d'un emploi du Fonds national d'amélioration de l'habitat et du programme spécifique pour le logement social.",
  "source": "Décret n° 2012-1224 du 10 août 2012, art. 7",
  "terme": "Logement rudimentaire"
 },
 "logement-social": {
  "autre": "السكن الاجتماعي",
  "definition": "Logement destiné aux ménages à faible revenu et produit ou financé avec une aide publique. Dans le programme spécifique pour le logement social, le décret n° 2012-1224 du 10 août 2012 le définit comme un logement individuel extensible d'un prix de 45 000 D au plus, ou un logement collectif de 65 000 D au plus. Depuis 2026, la SNIT, ses filiales et la SPROLS peuvent vendre en location-vente ou à tempérament les logements sociaux financés par le fonds de promotion du logement pour les salariés.",
  "source": "Décret n° 2012-1224 du 10 août 2012, art. 20",
  "terme": "Logement social"
 },
 "majoration-salaire-unique": {
  "autre": "منحة الأجر الوحيد",
  "definition": "Majoration trimestrielle des prestations familiales, créée par la loi n° 80-36 avec effet au 1er mai 1980. Trois conditions cumulatives : des enfants à charge, un droit ouvert aux allocations familiales, et un conjoint n'exerçant aucune activité professionnelle — c'est cette dernière qui donne au dispositif son nom.",
  "source": "Loi n° 80-36 du 28 mai 1980, art. 65 bis",
  "terme": "Majoration pour salaire unique"
 },
 "pnafn": {
  "acronyme": "PNAFN",
  "autre": "البرنامج الوطني لمساعدة العائلات المعوزة",
  "definition": "Programme d'assistance dont la loi de finances rectificative de 1986 autorise le financement par les organismes de sécurité sociale. L'arrêté conjoint du 10 juillet 2024 constate que son allocation mensuelle est alors fixée à 180 dinars et autorise son relèvement dans la limite du transfert monétaire de l'Amen social.",
  "source": "Loi n° 86-83 du 1er septembre 1986, art. 13",
  "terme": "Programme national d'aide aux familles nécessiteuses"
 },
 "premier-logement": {
  "autre": "المسكن الأول",
  "definition": "Logement qu'un ménage sans logement acquiert pour son habitation principale, et nom du programme créé par la loi de finances pour 2017 au profit des catégories à revenu moyen. Dans la rédaction du décret n° 2017-161 du 31 janvier 2017, le logement est neuf, compte au moins deux chambres et un salon, est réalisé par un promoteur agréé et coûte 200 000 D au plus ; le programme prête aux familles dont le revenu est compris entre 4,5 et 10 SMIG une partie de l'autofinancement, à un taux bonifié. Depuis 2025, le programme couvre aussi la construction d'un premier logement. Depuis 2023, les prêts du fonds de promotion du logement pour les salariés financent eux aussi un premier logement.",
  "source": "Décret gouvernemental n° 2017-161 du 31 janvier 2017, art. 3, 5-6",
  "terme": "Premier logement"
 },
 "prestation-monetaire": {
  "autre": "المنفعة النقدية",
  "definition": "Prestation qui procure directement une somme d'argent au bénéficiaire, par un versement ponctuel ou périodique. Elle correspond souvent à ce que les textes juridiques appellent une indemnité ou une prestation en espèces, sans remplacer la dénomination propre de chaque indemnité, allocation ou transfert. La loi n° 60-30 vise ainsi les « indemnités en espèces », tandis que la loi organique n° 2019-10 nomme « transferts financiers directs » les transferts monétaires mensuels et les distingue du « soutien financier » occasionnel.",
  "source": "Loi n° 60-30 du 14 décembre 1960, art. 68",
  "terme": "Prestation monétaire"
 },
 "prestation-non-monetaire": {
  "autre": "المنفعة غير النقدية",
  "definition": "Prestation fournie sous forme de bien, de soin, de service ou d'accès à un service, et non par le versement d'une somme. Elle correspond à la catégorie traditionnellement appelée prestation en nature, sans que les deux expressions soient toujours interchangeables. La loi n° 60-30 oppose aux indemnités en espèces l'octroi des soins, et la loi organique n° 2019-10 distingue les transferts et soutiens financiers des prestations de soins.",
  "source": "Loi n° 60-30 du 14 décembre 1960, art. 68",
  "terme": "Prestation non monétaire"
 },
 "prestations-familiales": {
  "autre": "المنح العائلية",
  "definition": "Prestations servies au titre des enfants à charge. L'article 51 de la loi n° 60-30 comprend les allocations familiales, les allocations pour congés de naissance et les allocations pour congés de jeunes travailleurs. La majoration pour salaire unique et la contribution aux frais de crèche ont été ajoutées par des textes ultérieurs.",
  "source": "Loi n° 60-30 du 14 décembre 1960, art. 51",
  "terme": "Prestations familiales"
 },
 "programme-specifique-logement-social": {
  "autre": "البرنامج الخصوصي للسكن الاجتماعي",
  "definition": "Programme créé par la loi de finances complémentaire pour 2012 « au profit des catégories sociales à faible revenu », pour remplacer les logements rudimentaires et réaliser des projets d'habitation. Il est financé par le budget de l'État, le recouvrement des prêts et des dons, et réalisé par les conseils régionaux, les sociétés immobilières publiques, la SPROLS, l'Agence de réhabilitation et de rénovation urbaine, l'AFH et des promoteurs privés. Dans la rédaction du décret d'août 2012, il s'adresse aux familles sans logement dont le revenu ne dépasse pas 3 SMIG, en trois catégories, par une prise en charge de la moitié du coût de remplacement d'un logement rudimentaire ou une subvention à l'achat d'un logement social.",
  "source": "Loi n° 2012-1 du 16 mai 2012, art. 27-32",
  "terme": "Programme spécifique pour le logement social"
 },
 "promoteur-agree": {
  "autre": "الباعث العقاري المصادق عليه",
  "definition": "Promoteur immobilier titulaire de l'agrément de l'administration. Depuis 1977, le fonds de promotion du logement pour les salariés prête pour l'achat d'un logement neuf à un promoteur agréé ; depuis 2023, le terrain qu'il finance peut être acheté à un promoteur agréé « ou du privé ». Le logement du programme du premier logement est réalisé par un promoteur agréé.",
  "source": "Décret gouvernemental n° 2017-161 du 31 janvier 2017, art. 3",
  "terme": "Promoteur immobilier agréé"
 },
 "quota-regional": {
  "autre": "الحصّة الجهوية",
  "definition": "Contingentement prévu par les décrets relatifs aux cartes de soins gratuits et à tarifs réduits. Ces décrets disposent que le nombre global de cartes et sa répartition régionale sont fixés par arrêté conjoint.",
  "source": "Décret n° 98-1812 du 21 septembre 1998, art. 2",
  "terme": "Quota régional"
 },
 "regime-conventionnel-soins": {
  "autre": "النظام التعاقدي (التغطية الصحية)",
  "definition": "Couverture de la maladie ordinaire et de l'accouchement que l'employeur assure à ses salariés et à leurs ayants droit par un contrat d'assurance de groupe ou une mutuelle approuvée, et qui lui vaut, depuis le 1er octobre 1996, une réduction de deux points du taux global de cotisation à la CNSS. La caisse ne prend plus alors en charge que les interventions chirurgicales de plus de 50 points et les maladies de longue durée. L'employeur finance le régime pour moitié au moins, et la participation du salarié est limitée à 20 % des frais calculés sur les tarifs officiels.",
  "source": "Décret n° 97-1645 du 25 août 1997, art. 1-3",
  "terme": "Régime conventionnel d'entreprise"
 },
 "rente-accident-travail": {
  "autre": "إيراد حادث الشغل",
  "definition": "Revenu périodique servi au titre d'une incapacité permanente, converti en capital en dessous de quinze pour cent d'incapacité et majoré en cas de recours à une tierce personne. Une rente de survivants est servie au conjoint et aux orphelins.",
  "source": "Loi n° 94-28 du 21 février 1994, art. 39 et s.",
  "terme": "Rente d'accident du travail"
 },
 "salaire-journalier-moyen": {
  "autre": "الأجر اليومي المتوسّط",
  "definition": "Assiette de référence des indemnités journalières, reconstituée à partir des rémunérations d'une période antérieure à l'arrêt. Sa définition a été réécrite par l'article 88 nouveau de la loi n° 98-91.",
  "source": "Loi n° 60-30 du 14 décembre 1960, art. 88-90",
  "terme": "Salaire journalier moyen"
 },
 "score-eligibilite": {
  "autre": "أنموذج التنقيط",
  "definition": "Note calculée à partir de variables observables du ménage — le proxy means test — servant à départager les demandeurs de l'Amen social. L'arrêté du 19 mai 2020 en énumère les dimensions sans fixer les pondérations.",
  "source": "Arrêté du ministre des affaires sociales du 19 mai 2020, art. 2",
  "terme": "Score d'éligibilité"
 },
 "smig": {
  "acronyme": "SMIG",
  "autre": "الأجر الأدنى المضمون لمختلف المهن",
  "definition": "Rémunération horaire ou mensuelle minimale légale applicable aux salariés des secteurs non agricoles régis par le code du travail. L'État le fixe par décret depuis le 1er janvier 1974. Il est fixé à l'heure et au mois, pour deux régimes de durée du travail : 48 heures et 40 heures par semaine.",
  "source": "Décret gouvernemental n° 2017-668 du 5 juin 2017",
  "terme": "Salaire minimum interprofessionnel garanti"
 },
 "snit": {
  "acronyme": "SNIT",
  "autre": "الشركة الوطنية العقارية للبلاد التونسية",
  "definition": "Entreprise à caractère commercial régie par le droit des sociétés anonymes, dont le capital est apporté par l'État et dont les statuts sont en vigueur depuis le 1er septembre 1957. Elle réalise des opérations immobilières pour son compte, celui de l'État ou des collectivités, gère des immeubles et conduit des programmes de construction. Depuis le 18 février 2026, elle et ses filiales peuvent vendre les logements sociaux financés par le fonds de promotion du logement pour les salariés par paiement échelonné ou en location-vente.",
  "source": "Loi n° 57-19 du 10 septembre 1957, statut, art. 1er-3",
  "terme": "Société nationale immobilière de Tunisie"
 },
 "sprols": {
  "acronyme": "SPROLS",
  "autre": "شركة النهوض بالمساكن الاجتماعية",
  "definition": "Établissement public à caractère industriel et commercial créé par la loi n° 77-53 du 3 août 1977 pour « promouvoir la construction de logements au profit des assurés sociaux ». Elle réalise et gère les programmes immobiliers de la Caisse nationale de sécurité sociale et de la Caisse d'assurance vieillesse, invalidité et survivants, qui ont apporté son capital initial, et loue des logements aux assurés sociaux. Placée à l'origine sous la tutelle des Affaires sociales, elle relève de l'Équipement depuis 2010. Depuis le 18 février 2026, elle peut vendre les logements sociaux financés par le fonds de promotion du logement pour les salariés par paiement échelonné ou en location-vente.",
  "source": "Loi n° 77-53 du 3 août 1977, art. 1er-4",
  "terme": "Société de promotion des logements sociaux"
 },
 "stage-cotisation": {
  "autre": "مدة الانخراط الدنيا",
  "definition": "Durée minimale d'affiliation et de cotisation exigée avant qu'une prestation puisse être servie. C'est le maillon qui distingue une prestation contributive d'une prestation d'assistance : le droit s'achète par un passé de cotisations, non par un niveau de ressources.",
  "source": "Loi n° 60-30 du 14 décembre 1960, art. 71 et 78",
  "terme": "Stage de cotisation"
 },
 "systeme-de-remboursement": {
  "autre": "نظام استرجاع المصاريف",
  "definition": "Modalité de prise en charge des soins du régime de base d'assurance maladie : l'assuré se soigne auprès des prestataires conventionnés des secteurs public et privé, paie les frais, puis en obtient le remboursement par la CNAM dans la limite des taux de prise en charge applicables (décret n° 2007-1367, art. 2).",
  "source": "Décret n° 2007-1367 du 11 juin 2007, art. 2",
  "terme": "Système de remboursement"
 },
 "ticket-moderateur": {
  "autre": "المعلوم التعديلي",
  "definition": "Part des frais de soins qui reste à la charge du bénéficiaire dans le régime de base d'assurance maladie : l'écart entre le montant dû pour les soins, calculé sur les tarifs conventionnels, et le montant que la CNAM prend en charge (décret n° 2007-1367, art. 2). Dans la filière publique, il est plafonné chaque année.",
  "source": "Décret n° 2007-1367 du 11 juin 2007, art. 2",
  "terme": "Ticket modérateur"
 },
 "tmm": {
  "acronyme": "TMM",
  "autre": "معدل نسبة الفائدة في السوق النقدية",
  "definition": "Taux d'intérêt moyen du marché monétaire tunisien, publié par la Banque centrale de Tunisie. Le décret-loi n° 2020-30 (art. 12) en fait un seuil fiscal : les revenus des dépôts à terme dont le taux de rémunération dépasse, au 1er janvier de l'année, le TMM diminué d'un point supportent une retenue de 35 %, définitive et non restituable.",
  "terme": "Taux moyen du marché monétaire"
 },
 "transfert-monetaire": {
  "autre": "التحويل النقدي المباشر",
  "definition": "Versement mensuel de l'Amen social, composé d'une allocation de base et d'un supplément par enfant à charge, doublé pour l'enfant titulaire d'une carte de handicap. La base a été revalorisée en 2022 puis chaque année jusqu'en 2026, avec effet au 1er janvier pour chacune de ces revalorisations.",
  "source": "Arrêté conjoint du ministre des affaires sociales et du ministre des finances du 19 mai 2020, art. 2",
  "terme": "Transfert monétaire direct"
 },
 "unite-de-gestion-par-objectifs": {
  "autre": "وحدة تصرف حسب الأهداف",
  "definition": "Structure temporaire créée au sein d'un ministère pour réaliser un projet défini, sous l'autorité du ministre. Celle du ministère des affaires sociales, créée en 2014, réalise le projet de banque de données sur les familles nécessiteuses et à revenu limité.",
  "source": "Décret n° 2014-1526 du 30 avril 2014, art. 1",
  "terme": "Unité de gestion par objectifs"
 },
 "vente-a-temperament": {
  "autre": "البيع بالتقسيط",
  "definition": "Vente dont le prix est payé par versements échelonnés ; les lois n° 2026-1 et 2026-2 du 13 février 2026 parlent de vente « par paiement échelonné ». Depuis le 18 février 2026, la SNIT et ses filiales et la SPROLS peuvent vendre ainsi les logements sociaux financés par le fonds de promotion du logement pour les salariés ; depuis le 20 juin 2026, le prix plafond au mètre carré des logements de promoteur ne s'applique pas à ces ventes, et les mensualités sont fixées selon le coût de chaque projet par convention entre l'opérateur et le ministère chargé de l'habitat.",
  "source": "Loi n° 2026-1 du 13 février 2026",
  "terme": "Vente à tempérament"
 }
}
</script>
