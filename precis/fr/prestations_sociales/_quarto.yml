project:
  type: book
  output-dir: public

lang: fr

book:
  title: "Prestations sociales"
  author: "Mahdi Ben Jelloul"
  repo-url: https://github.com/benjello/precis-socio-fiscal-tunisie/
  repo-subdir: precis/fr/prestations_sociales
  repo-branch: master
  repo-actions: [edit, issue]
  downloads: [pdf]
  chapters:
    - index.qmd

bibliography:
  - references.json
  - ../references.json
  - ../references.bib

format:
  html:
    theme: cosmo
    number-depth: 4
    toc: true
    toc-depth: 4
  pdf:
    documentclass: scrreprt
    toc: true
    toc-depth: 4
    number-sections: true
    number-depth: 4 
