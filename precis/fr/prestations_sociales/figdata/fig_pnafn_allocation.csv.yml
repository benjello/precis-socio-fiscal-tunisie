caveats: [Les dates de tous les paliers et les montants antérieurs à 180 dinars restent à fiabiliser. Le montant de 180 dinars est constaté par l'arrêté conjoint du 10 juillet 2024 à la date de sa publication. Le pouvoir d'achat est calculé avec l'indice annuel moyen des prix à la consommation., LU À L'IMAGE (400 dpi), chaque étiquette au-dessus de sa barre ; l'appariement est confirmé par le texte de la pièce (180/379 = 47,5 % pour « 47 percent » en 2018 ; 180/429 = 42,0 % pour « 42 percent » en 2021). QUINZE ANNÉES IRRÉGULIÈRES : ni 1988-1989, ni 1991-1994, ni 2016-2017 ; RIEN N'EST INTERPOLÉ, et un palier lu une année ne dit pas depuis quand il vaut. CHIFFRES DE SECONDE MAIN SUR LE DROIT : la source dite est « Institut National de la Statistique and MoSA data », AUCUN TEXTE N'EST CITÉ ; à ne pas prendre pour un barème légal (la figure donne 15 D en 1990 et 25,8 D en 1995). Régime du salaire minimum non dit (40 ou 48 heures). La courbe du rapport transfert / salaire minimum n'a pas d'étiquettes : NON LUE ; le rapport ne figure qu'au fichier des recoupements, calculé. PPIAF000292 écrit 7,9 % en 1987, les étiquettes donnent 7,7 / 105 = 7,3 % : non tranché. La figure 3 de PPIAF000292 (1987-2025) est sans étiquettes : non lue., DEUX INDICES RACCORDÉS EN 1970 : l'indice du coût de la vie en base 100 en 1962 (131,6 en 1970) est ramené à la base 1970. Les valeurs 1962-1975 sont RELEVÉES À LA MAIN dans les rapports de la BCT, dont la couche texte est une océrisation abîmée (« 12S,O » pour 125,0) ; chacune est recoupée par la variation énoncée en prose, et la source de chaque valeur est dans la colonne `source`. L'annuaire 1995-2001 imprime 108,2 pour 1985 au lieu de 288,0 : ligne écartée, valeur prise dans l'annuaire 1998-2002. Le plus récent annuaire fait foi (2001 : 640,5 au lieu de 645,4 provisoire). Au-delà de 2003, employer `bct-ipc-base2015`., EXTRAIT DU RAPPORT ANNUEL, ET NON DU BULLETIN : l'intitulé du BSF (« base 100 en 2010 ») est périmé et ses valeurs récentes sont en base 2015 — voir docs/tables-a-extraire-pdf.md §1. L'ANNÉE DE BASE 2015 = 100 EST POSÉE PAR DÉFINITION, non lue : aucun rapport ne tabule son année de base, tous ne publiant que les millésimes récents. Série RECONSTITUÉE en recollant huit rapports, de 2018 à 2025 (ceux de 2021 et de 2025 coupent le libellé sur trois lignes ; ils sont lus depuis le 2026-10-08), chacun n'en publiant que trois millésimes ; toutes les années communes concordent, et le script LÈVE en cas de divergence — un indice de prix ne se révise pas d'une publication à l'autre, contrairement aux effectifs. La colonne `rapports_concordants` compte les rapports qui impriment la valeur : 2025 (186,3) n'en a qu'UN, le Rapport annuel 2025 (tableau 2-1, p. 57), qui reprend 2024 (176,8) sans le réviser. ÉCART AU TAUX IMPRIMÉ EN 2025 : 186,3 ÷ 176,8 donne +5,37 %, soit 5,4 au dixième, quand le même rapport imprime 5,3 % d'inflation moyenne ; l'arrondi des deux indices permet 5,32 à 5,43 %, et un taux imprimé 5,3 recouvre 5,25 à 5,35 % : les deux ne se rejoignent qu'à la limite (5,32 à 5,35). Le rapport ne dit pas comment il calcule le taux moyen ; écart signalé, non expliqué, rien n'est corrigé. S'ARRÊTE EN 2025 : aucune déflation n'est possible au-delà, ce qui laisse sans équivalent réel les tranches d'augmentation programmées jusqu'en 2028. Déflater une date en cours d'année par l'indice ANNUEL MOYEN est une approximation.]
