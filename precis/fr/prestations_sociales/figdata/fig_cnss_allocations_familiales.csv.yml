caveats: [SCAN SANS COUCHE TEXTE, valeurs océrisées et contrôlées par les IDENTITÉS COMPTABLES (sous-totaux, totaux, résultat = ressources − emplois, ensemble = somme des régimes) ; colonne `statut` sur chaque valeur (lu, lu_corrige, deduit_identite, masque_reliure). LA RELIURE MASQUE une colonne d'années sur la plupart des tableaux (1999 surtout, 2000 sur certains) : 430 cellules sont rétablies par une identité à une seule inconnue et 68 par le solveur fragments + identités (chiffres visibles lus case par case ; valeur unique compatible avec eux et avec toutes les identités ; validé sans erreur sur 771 valeurs connues masquées à l'identique), jamais devinées dans la colonne `valeur` ; 360 y restent vides, listées avec leur fragment visible dans cnss_retrospective_valeurs_a_retrouver.csv (221 à lire sur l'original, le reste s'en déduit). ESTIMATIONS PROVISOIRES : en attendant l'original, ces 360 cellules (1999 surtout, quelques-unes de 2000) reçoivent une estimation tracée (colonnes `estimation`, `methode_estimation`, `incertitude` ; tendance de la ligne, candidats compatibles avec les chiffres visibles, mise en cohérence avec les identités comptables), et `valeur_ou_estimation` réunit valeurs et estimations pour l'exploitation directe : les valeurs 1999 — et certaines de 2000 — de cette colonne sont donc pour partie des ESTIMATIONS, à ne pas citer comme données publiées. Estimations publiées et versionnées dans cnss_retrospective_estimations.csv, remplacées quand l'original est relu. Quatorze identités s'écartent de 2 mD entre valeurs imprimées vérifiées à l'image (totaux 2004 de tableaux jumeaux, emplois 1996) : écarts de la source, laissés tels quels. Unité : milliers de dinars (les cotisations 2000-2004 recoupent la série cnss-cotisations, en millions, à 1 % près). Comptabilité « Bilans » (droits constatés) : ne pas confondre avec les cotisations encaissées. Montants courants, non déflatés., DEUX INDICES RACCORDÉS EN 1970 : l'indice du coût de la vie en base 100 en 1962 (131,6 en 1970) est ramené à la base 1970. Les valeurs 1962-1975 sont RELEVÉES À LA MAIN dans les rapports de la BCT, dont la couche texte est une océrisation abîmée (« 12S,O » pour 125,0) ; chacune est recoupée par la variation énoncée en prose, et la source de chaque valeur est dans la colonne `source`. L'annuaire 1995-2001 imprime 108,2 pour 1985 au lieu de 288,0 : ligne écartée, valeur prise dans l'annuaire 1998-2002. Le plus récent annuaire fait foi (2001 : 640,5 au lieu de 645,4 provisoire). Au-delà de 2003, employer `bct-ipc-base2015`., EXTRAIT DU RAPPORT ANNUEL, ET NON DU BULLETIN : l'intitulé du BSF (« base 100 en 2010 ») est périmé et ses valeurs récentes sont en base 2015 — voir docs/tables-a-extraire-pdf.md §1. L'ANNÉE DE BASE 2015 = 100 EST POSÉE PAR DÉFINITION, non lue : aucun rapport ne tabule son année de base, tous ne publiant que les millésimes récents. Série RECONSTITUÉE en recollant huit rapports, de 2018 à 2025 (ceux de 2021 et de 2025 coupent le libellé sur trois lignes ; ils sont lus depuis le 2026-10-08), chacun n'en publiant que trois millésimes ; toutes les années communes concordent, et le script LÈVE en cas de divergence — un indice de prix ne se révise pas d'une publication à l'autre, contrairement aux effectifs. La colonne `rapports_concordants` compte les rapports qui impriment la valeur : 2025 (186,3) n'en a qu'UN, le Rapport annuel 2025 (tableau 2-1, p. 57), qui reprend 2024 (176,8) sans le réviser. ÉCART AU TAUX IMPRIMÉ EN 2025 : 186,3 ÷ 176,8 donne +5,37 %, soit 5,4 au dixième, quand le même rapport imprime 5,3 % d'inflation moyenne ; l'arrondi des deux indices permet 5,32 à 5,43 %, et un taux imprimé 5,3 recouvre 5,25 à 5,35 % : les deux ne se rejoignent qu'à la limite (5,32 à 5,35). Le rapport ne dit pas comment il calcule le taux moyen ; écart signalé, non expliqué, rien n'est corrigé. S'ARRÊTE EN 2025 : aucune déflation n'est possible au-delà, ce qui laisse sans équivalent réel les tranches d'augmentation programmées jusqu'en 2028. Déflater une date en cours d'année par l'indice ANNUEL MOYEN est une approximation., sources/minfinances-recettes-fiscales.md]
