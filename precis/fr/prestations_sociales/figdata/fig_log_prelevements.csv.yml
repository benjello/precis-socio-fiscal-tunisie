caveats: [Montants fixés par les textes, non les sommes effectivement prélevées. Une année marquée « aucun prélèvement » est une année dont la loi de finances (et la loi de finances complémentaire, s'il y en a une) a été lue et ne contient aucune disposition de ce type ; une année sans marque n'est pas lue. Les années 1991 à 1994 sont lues sur l'image des fascicules, les autres sur leur texte ; 2023 à 2025 dans l'édition arabe. Un transfert global de l'ensemble des fonds spéciaux du Trésor n'est pas un montant du fonds., LE PIB N'EST JAMAIS CHAÎNÉ : segment_pib change en 1986, 1992, 1997, 2002, 2005, 2010 et 2025 ; une part du PIB se trace par segments. 1984-1985 : PIB de la Banque mondiale, bases accolées non raccordées ; 1986-1991 : PIB du ministère des Finances, base 1983 PRÉSUMÉE ; 2002-2004 et 2025 : valeur propre au ministère, rattachée à aucune base ; 2010-2014 : base 2015 rétropolée par l'INS. Les dépenses de l'État sont des RÉALISATIONS : rapportée à elles, une prévision de loi de finances donne un ordre de grandeur, non une exécution. AUCUNE DÉPENSE DE L'ÉTAT AVANT 1986., TROIS BASES, JAMAIS RACCORDÉES : filtrer `base`, ne jamais tracer d'un trait d'une base à l'autre. L'écart entre bases n'est pas constant (voir `pib-courant-recouvrements`). `retropole` : oui pour la base 2015 en 2010-2014 et la base 1997 en 1997-2004, non pour une année publiée dans une édition de sa base, « non précisé par la source » pour la base 1983 et le ministère. Aucune base dite avant 1992 ; rien en base 1997 après 2017 ni en base 2015 avant 2010. Le classeur de l'INS est hors git. Voir docs/pib-courant-par-base.md.]
