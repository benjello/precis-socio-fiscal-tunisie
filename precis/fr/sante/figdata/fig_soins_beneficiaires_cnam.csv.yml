caveats: [Note du CRES qui reprend le rapport du Conseil national de l'assurance maladie sans décrire de méthode. Valeurs du graphe en millions, arrondies à trois décimales ; le texte de la même page donne 6 940 135 bénéficiaires en 2013, « soit 64 % de la population totale ». Lu à l'image (rendu à 150 ppp) et recoupé sur la couche texte. Unité différente de celle des affiliés de la CNAM (cnam-affilies-filieres-2008-2021), qui ne comptent pas les ayants droit : les deux séries ne s'additionnent ni ne se superposent., DEUX RUPTURES DE DÉFINITION. En 2019, la CNAM compte les affiliés ouvrant droit aux soins durant l'année en cours (note * du tableau) : la hausse de la filière publique entre 2018 et 2019 vient de ce changement. En 2010, les étudiants ne sont plus les porteurs de cartes de soins valides mais les inscrits dans l'enseignement supérieur (note **) : de 30 620 à 351 280, ce qui fait l'essentiel de la hausse du total entre 2009 et 2010. Affiliés seulement, sans les ayants droit : à ne pas comparer aux bénéficiaires (cnam-beneficiaires-cres-2008-2013). Droits ouverts et choix de filière, non consultations réalisées. Sous-totaux et total imprimés contrôlés à l'extraction.]
