project:
  type: book
  output-dir: public

lang: fr

book:
  title: "L'informel : définitions et mesures"
  author: "Mahdi Ben Jelloul"
  repo-url: https://github.com/benjello/precis-socio-fiscal-tunisie/
  repo-subdir: precis/fr/informel
  repo-branch: master
  repo-actions: [edit, issue]
  downloads: [pdf]
  page-footer:
    center: "[Accueil](../index.html) · [À propos et contribuer](../a-propos.html) · [Le PIB et ses changements de base](../annexe-pib.html) · [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/deed.fr)"
  chapters:
    - index.qmd
    - _definitions.qmd
    - _mesures.qmd
    - _estimations.qmd
    - _couverture.qmd
  appendices:
    - _glossaire.qmd

bibliography:
  - references.json
  - ../references.json
  - ../references.bib
csl: ../precis.csl

format:
  html:
    theme: [cosmo, ../../legendes.scss]
    css: schema-informel.css
    include-after-body:
      - _glossaire.infobulles.html
      - ../../legendes.html
    fig-cap-location: top
    tbl-cap-location: top
    number-depth: 4
    toc: true
    toc-depth: 4
  pdf:
    documentclass: scrreprt
    toc: true
    toc-depth: 4
    number-sections: true
    number-depth: 4

crossref:
  tbl-title: "Tableau"
  fig-title: "Figure"
  tbl-prefix: "tableau"
  fig-prefix: "figure"
  title-delim: "\u00a0—"
