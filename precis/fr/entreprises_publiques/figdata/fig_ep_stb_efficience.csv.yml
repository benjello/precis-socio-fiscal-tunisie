caveats: [COMPTES DE L'ENTREPRISE, PAS UNE SOURCE BUDGÉTAIRE. Toutes les grandeurs brutes sont LUES À L'IMAGE des états financiers (pdftoppm puis lecture), après qu'une construction antérieure sur une couche générée se soit révélée fausse (résultat net mal lu, frais de personnel reclassés). CHAÎNAGE N/N-1 vérifié (valeur d'une année = colonne comparative de l'EF suivant) ; les retraitements entre éditions sont signalés dans les remarques des fichiers raw, non corrigés. CONTRÔLE À L'IDENTIQUE : le coefficient d'exploitation calculé concorde au dixième avec le `bq_coefficient_exploitation` des fiches du ministère des Finances sur 2018-2023 (toutes les banques, y compris STB 2020 désormais résolu). RÉSULTAT POUR ROA/ROE = résultat APRÈS modifications comptables (ce que retient le ministère ; = résultat net quand il n'y a pas de ligne de modifications). ROE EN CASE VIDE QUAND LES CAPITAUX PROPRES SONT ≤ 0 (le ratio explose à fonds propres impairés ; on lit alors le ROA). BILAN (total actifs, capitaux propres) non lu toutes les années → ROA/ROE sur 2000 et 2008-2024 selon la banque ; coefficient d'exploitation sur toute la période. BH antérieur à 2016 : EF en dinars (convertis en MD). Quelques exercices (BH 2004/2006/2007/2018, BTE 2005/2007/2018) absents en individuel, repris de la colonne comparative de l'EF suivant.]
