caveats: [DEUX ÉDITIONS, LE FICHIER NE CHOISIT PAS : 1998 vaut 481 394 puis 456 650, 1999 vaut 68 859 puis 43 495,2 ; écarts de moins de 150 en 2004 et 2005 (`divergence_entre_editions`). Seule l'édition de 2010 retrouve la page officielle par plan (voir privatisation-recettes-par-plan). UNE OPÉRATION FAIT LA MOITIÉ DU TOTAL : 2006, 3 110,5 MD. Recettes en dinars courants, toutes natures de cession confondues (actions, actifs, concessions, offres publiques) ; le classeur ne donne AUCUN DÉTAIL PAR OPÉRATION. Rien après 2009. NON TRANSCRIT : les feuilles par mode de cession (1994-2003) et par secteur (1994-1998), d'un millésime antérieur qui contredit la feuille principale (2002 : 817 123 contre 817 531 ; 2003 : 36 826 contre 35 469). LU PAR PROGRAMME, cellule par cellule., Mêmes dénominateurs que le volume « La compensation ». Les bases du PIB ne sont pas raccordées : la part du PIB se lit par segment, chaque changement de base est une rupture du seul dénominateur. Dépenses de l'État non disponibles de 1988 à 1990. Un encours rapporté aux dépenses ou au PIB de l'année rapporte un stock à un flux.]
