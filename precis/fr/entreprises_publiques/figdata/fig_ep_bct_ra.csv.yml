caveats: [RUPTURE DE PÉRIMÈTRE, NON CHAÎNÉE : 1983-1988, « recettes des participations financières » / « revenus des participations » qui comprennent les revenus pétroliers ; 1993-2016, revenus pétroliers sur une ligne à part. Changements de libellé sans changement de valeur : « revenus des participations et (des) EPIC » (rapports 1995-2000), « revenus des participations » (rapports 2001-2016 ; 1999 et 2000 lus dans les rapports 2000 et 2001 : 167,0 / 167,1 et 273,8 / 273,8), « excédents » (rapport 2008). Rapport 2007 : ligne « excédent + recouvrement prêts », non versée. Rapports 1986, 1987, 1989 à 1994 non exploités (couche texte chiffrée, tableau non localisé). Révisions d'un rapport à l'autre gardées (1999 : 167,0 puis 167,1 ; 2009 : 803,8 puis 788,6 ; 2012 : 767,8 puis 757,5 ; 2013 : 1 070,7 provisoire puis 1 070,0). De 2003 à 2016 sauf 2011, la dernière lecture égale le total de la Cour des comptes moins les autres profits du Trésor ; 2011 : 1 457,5 contre 1 566,8. Versement de la Banque centrale : par année budgétaire, à ne pas confondre avec la part par exercice (bct-part-etat-benefices)., Mêmes dénominateurs que le volume « La compensation ». Les bases du PIB ne sont pas raccordées : la part du PIB se lit par segment, chaque changement de base est une rupture du seul dénominateur. Dépenses de l'État non disponibles de 1988 à 1990. Un encours rapporté aux dépenses ou au PIB de l'année rapporte un stock à un flux.]
