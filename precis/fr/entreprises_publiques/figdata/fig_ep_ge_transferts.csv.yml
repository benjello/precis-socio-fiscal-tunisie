caveats: [LES ÉDITIONS SE CONTREDISENT ET LE FICHIER NE CHOISIT PAS : STIR 2019, 1 296 (LF 2021, LF 2022) puis 1 905,3 (LF 2023) ; STIR 2018, 1 500 puis 1 846,1 ; Office des céréales 2019, 1 324,1 puis 1 800,2 ; 2021, 213,5 (provisoire) puis 1 687,5 ; ONAS 2018, 59,4 puis 155,9. Les révisions vont presque toutes à la hausse : la subvention d'une année est soldée les années suivantes. La CPSCL figure en 2017-2020 (LF 2021, LF 2022) puis est ramenée à zéro (LF 2023 : financements destinés aux collectivités, non une subvention de l'État). La CNSS, absente de la LF 2023, entre en LF 2024 (1 321,6 en 2020). LIGNES NULLES NON TRANSCRITES (banques, ETAP, etc.) : une entité absente d'une édition y est imprimée à zéro ou n'est pas dans l'échantillon — consulter le rapport avant de conclure. `statut` provisoire pour la dernière année de chaque édition. Contenu de la ligne non détaillé : elle ne concorde ni avec la subvention d'exploitation des comptes, ni avec les interventions de l'annexe 8 (transport-transferts-par-entreprise) — AUCUN RACCORD. Somme des lignes = total imprimé (contrôlé, écarts d'un dixième déclarés) ; le total de 2022 est 14 560,6, quand le tableau d'ensemble imprime 14 506,6. Mêmes identifiants d'entité que la série du transport (transtu, sncft). LU À L'IMAGE.]
