caveats: [TROIS GRANDEURS À NE PAS CONFONDRE : plafond (paramètre légal), garanties accordées (flux), encours garanti (stock). `periode` distingue l'année, le premier semestre (« -S1 », flux) et la fin juin (« -06 », encours estimé) : NE PAS TRACER UN SEMESTRE COMME UNE ANNÉE. AUCUNE ÉDITION PRÉFÉRÉE : 2019 et 2020 figurent dans les deux annexes 7, d'accord sur l'encours ; trois divergences gardées (`divergence_entre_editions`) — garanties de 2020, 4 603,4 (annexe 7 ; annexe 8 LF 2022 et LF 2023) et 4 603,7 (annexe 8 LF 2024) ; plafond de 2020 après loi de finances rectificative, 7 500 (traduction française de l'annexe 8 LF 2021) et 7 000 (éditions arabes) — NON TRANCHÉ, le texte de la loi rectificative n'a pas été lu ; encours de 2020 en % du PIB, 14,70 (LF 2022) puis 14,4 (LF 2025), PIB révisé sans que la base soit dite. Plafond de 2019 : 4 500 en loi initiale, 4 790 après loi complémentaire. Écarts imprimés déclarés : extérieur + intérieur dépasse le total de 0,1 au premier semestre 2024 ; les trois banques font 1 357,3 pour un total imprimé de 1 357,7 en 2019. Les garanties de l'audit des banques sont données pour un an au titre des engagements de l'année écoulée. LU À L'IMAGE. Rien avant 2016 ; plafonds des lois de finances antérieures non dépouillés., Mêmes dénominateurs que le volume « La compensation ». Les bases du PIB ne sont pas raccordées : la part du PIB se lit par segment, chaque changement de base est une rupture du seul dénominateur. Dépenses de l'État non disponibles de 1988 à 1990. Un encours rapporté aux dépenses ou au PIB de l'année rapporte un stock à un flux.]
