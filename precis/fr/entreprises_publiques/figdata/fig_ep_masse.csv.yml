caveats: [SEUL EFFECTIF TOTAL PUBLIÉ PAR LE MINISTÈRE, ET IL N'EST PAS CELUI DE TOUTES LES ENTREPRISES PUBLIQUES : le rapport en recense 111 à 115, en écarte celles sans états financiers, et laisse à part 7 établissements financiers et 3 caisses ; le nombre d'entreprises couvertes change à chaque édition (colonne nombre_entreprises : 84, 86, 88, 85) — QUATRE POINTS, QUATRE PÉRIMÈTRES, AUCUNE SÉRIE : ne pas relier 2018 à 2022 sans dire la rupture. AUCUN TOTAL POUR 2021 (l'édition LF 2024 porte sur 2020, l'édition LF 2025 sur 2022), ni avant 2018 : l'édition LF 2020 ne donne qu'une part (les 23 entreprises de son échantillon emploient 75,3 % des agents de 87), non reprise. Édition LF 2022 : la ligne dit « 82 entreprises », une note précise que le nombre d'agents en couvre 84. Édition LF 2023 : le titre dit 79, la ligne 86. Édition LF 2024 : effectifs imprimés avec une décimale (81 889,5 ; 96 305,5), et la somme des 40 fiches de la même édition fait 86 182 (`ecart_somme_des_fiches`). CONTRÔLES : la part imprimée se retrouve aux huit tableaux ; la somme des 40 fiches redonne le total des 40 pour 2019 et 2022 (agents et charges) ; les charges de l'ensemble recoupent le tableau des agrégats pour 2020 et 2022 (`recoupe_agregats`). Pour un effectif total AVEC banques et caisses, ajouter les lignes correspondantes de entreprises-publiques-effectifs-par-entreprise est un calcul du lecteur, à présenter comme tel. LU À L'IMAGE., CINQ ÉCHANTILLONS (colonne `echantillon`), JAMAIS UNE SÉRIE 2017-2022 D'UN TRAIT : la variation n'est à périmètre constant qu'entre les deux exercices d'une même édition. Les exercices 2018 à 2021 sont donnés deux fois et divergent — résultat net de 2019, − 711,5 (77 entreprises) puis − 177,9 (81). LES PRODUITS D'EXPLOITATION CONTIENNENT LES SUBVENTIONS D'EXPLOITATION : le résultat d'exploitation positif de 2021 et 2022 est un résultat après compensation. Comptes sous-jacents pour partie provisoires ou tirés de « documents d'orientation ». `signe_restitue` : les éditions LF 2023 et LF 2025 impriment les sommes de pertes sans signe. TABLEAU DE LA LF 2022 INCOHÉRENT, tel qu'imprimé : résultat d'exploitation de − 408,4 (2018) et − 1 255,4 (2019) alors que positifs + négatifs font − 608,4 et − 1 017,0, et produits − charges − 408,4 et − 1 035,2 ; ses résultats nets, eux, se somment. LF 2025 : 466 imprimé pour 465,4 (2021). Écarts déclarés dans le script. Ni valeur ajoutée, ni total de bilan, ni effectif total publiés. LU À L'IMAGE., Mêmes dénominateurs que le volume « La compensation ». Les bases du PIB ne sont pas raccordées : la part du PIB se lit par segment, chaque changement de base est une rupture du seul dénominateur. Dépenses de l'État non disponibles de 1988 à 1990. Un encours rapporté aux dépenses ou au PIB de l'année rapporte un stock à un flux.]
