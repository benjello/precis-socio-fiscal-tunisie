caveats: [AUCUN RACCORD : un exercice figure dans une à quatre éditions ; toutes les valeurs sont gardées, `divergence_effectif_entre_editions` signale les 90 lignes qui diffèrent (Société générale d'entreprises de matériel et de travaux, SOMATRA-GET, en 2020 : 212 puis 1 194 agents ; Tunisair en 2017 : 3 765 puis 3 565 ; RNTA en 2018 : 1 336 puis 1 130 ; CTN en 2018 : 1 195 puis 734). `statut` : le dernier exercice de chaque édition est le plus souvent provisoire, estimé ou probable — NE PAS le tracer comme une réalisation ; Tunisair n'a que des chiffres provisoires pour 2021-2023, la Transtu des chiffres probables. LES BANQUES, LE SECTEUR FINANCIER ET LES CAISSES SOCIALES NE SONT PAS DANS L'ÉCHANTILLON DES 40 : filtrer sur `categorie` avant toute somme. Le nombre d'agents n'est pas défini par le rapport (permanents, contractuels, équivalents temps plein : non dit) ; la hausse de la CPG en 2019 (6 098 puis 7 421) y est attribuée au programme de recrutement. PREUVES DE LECTURE : 391 variations imprimées d'un exercice à l'autre (éditions LF 2024 et LF 2025) redonnent la différence des niveaux, douze écarts d'arrondi ou d'impression déclarés (dont Groupe chimique, LF 2024 : −278 imprimé pour −287) ; la somme des 40 fiches redonne exactement la ligne « total des 40 » pour 2019 et 2022. ÉDITION LF 2023 NON DÉPOUILLÉE (exercices 2019-2021, déjà couverts par deux autres éditions) ; charges de personnel des éditions françaises non reprises ; édition arabe de la LF 2020 non relue. LU À L'IMAGE (pages rendues à 150 dpi et tournées), valeurs recoupées avec la couche texte.]
