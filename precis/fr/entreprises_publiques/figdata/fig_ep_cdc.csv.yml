caveats: [CE NE SONT NI DES TRANSFERTS DU BUDGET AUX ENTREPRISES PUBLIQUES (les rapports de clôture ne ventilent pas la dépense par entreprise bénéficiaire ; voir l'annexe 8 des lois de finances depuis 2016), NI UN ENCOURS DE DETTE GARANTIE (la Cour écrit chaque année que le compte général ne porte pas la situation des prêts rétrocédés ni des prêts garantis). `transferts_ep_profits_tresor` est un FLUX DES ENTREPRISES VERS LE BUDGET, qui comprend la part du budget dans les profits de la Banque centrale et les autres profits du Trésor. `garantie_principal_paye` est la dette garantie REMBOURSÉE PAR L'ÉTAT : ses lignes ne sont pas toutes des entreprises publiques (art. 24 de la loi de finances de 1999, Caisse des prêts et de soutien des collectivités locales, crédits agricoles, Office des céréales). Écart imprimé déclaré : 2014, lignes 174 131 665 contre un total imprimé de 174 131 165 (rapports 2014 et 2015). Libellé divergent : le montant de 47 000 000 dinars de 2013 est celui de la Société tunisienne de banque dans le rapport 2013 et celui de la société tunisienne de sidérurgie dans le rapport 2014. Recettes de privatisation 2012 : 1 105 MD (table du déficit structurel, rapport 2012) et 900 MD pour la seule cession de 35 % de Tunisie Télécom (rapport 2016) ; 2013 : 1 070,402 MD et 1 000 MD ; la licence mobile de 2016 est une recette distincte. Gestion 2010 : le rapport de clôture de 2010 n'est pas au catalogue de la Cour ; les valeurs de 2010 viennent de la colonne de comparaison du rapport 2011. Les intérêts de 2012 à 2014 sont lus à la couche texte, recoupés d'un rapport à l'autre. Montants courants ; aucune part du PIB dans la série (le précis les calcule avec les dénominateurs de la compensation, PIB en base 2015 pour 2010-2016)., Mêmes dénominateurs que le volume « La compensation ». Les bases du PIB ne sont pas raccordées : la part du PIB se lit par segment, chaque changement de base est une rupture du seul dénominateur. Dépenses de l'État non disponibles de 1988 à 1990. Un encours rapporté aux dépenses ou au PIB de l'année rapporte un stock à un flux.]
