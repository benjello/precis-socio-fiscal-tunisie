caveats: [CINQ ÉCHANTILLONS (colonne `echantillon`), JAMAIS UNE SÉRIE 2017-2022 D'UN TRAIT : la variation n'est à périmètre constant qu'entre les deux exercices d'une même édition. Les exercices 2018 à 2021 sont donnés deux fois et divergent — résultat net de 2019, − 711,5 (77 entreprises) puis − 177,9 (81). LES PRODUITS D'EXPLOITATION CONTIENNENT LES SUBVENTIONS D'EXPLOITATION : le résultat d'exploitation positif de 2021 et 2022 est un résultat après compensation. Comptes sous-jacents pour partie provisoires ou tirés de « documents d'orientation ». `signe_restitue` : les éditions LF 2023 et LF 2025 impriment les sommes de pertes sans signe. TABLEAU DE LA LF 2022 INCOHÉRENT, tel qu'imprimé : résultat d'exploitation de − 408,4 (2018) et − 1 255,4 (2019) alors que positifs + négatifs font − 608,4 et − 1 017,0, et produits − charges − 408,4 et − 1 035,2 ; ses résultats nets, eux, se somment. LF 2025 : 466 imprimé pour 465,4 (2021). Écarts déclarés dans le script. Ni valeur ajoutée, ni total de bilan, ni effectif total publiés. LU À L'IMAGE., Mêmes dénominateurs que le volume « La compensation ». Les bases du PIB ne sont pas raccordées : la part du PIB se lit par segment, chaque changement de base est une rupture du seul dénominateur. Dépenses de l'État non disponibles de 1988 à 1990. Un encours rapporté aux dépenses ou au PIB de l'année rapporte un stock à un flux.]
