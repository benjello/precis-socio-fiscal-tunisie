caveats: [CE TOTAL N'EST PAS « LE COÛT DES ENTREPRISES PUBLIQUES » : il réunit caisses sociales, établissements d'enseignement et de culture, et — dans le secteur économique — LA COMPENSATION (produits de base, carburants, électricité, transport), que le rapport y classe d'après le ministère de tutelle ; le « hors compensation » demande les annexes par établissement, non transcrites. DEUX PÉRIMÈTRES (colonne `perimetre`) : l'édition LF 2020 donne 2016-2018 dans un périmètre que la LF 2021 révise (2017 : 6 161,8 puis 6 852,6 MD) ; 2016 N'EXISTE QUE DANS L'ANCIEN — ne pas le chaîner à 2017. `etat` sépare loi de finances et réalisations : l'exécution dépasse la loi de 18 à 39 % de 2020 à 2023. Toutes les éditions gardées ; révisions mineures de 2018 à 2021. RESTAURATIONS (six, `restauration`) : groupes de trois chiffres imprimés dans l'ordre inverse — « 389 730 » pour 730 389 (rémunération 2016), « 451 895 », « 361 137 » et « 107 652 » (LF 2019), « 315 349 », et « 352 548 » pour 548 352 (LF 2023) —, chacune prouvée par la somme de sa colonne ; les deux de la loi de finances 2019 le sont ensemble, par une seule somme. ÉCARTS IMPRIMÉS NON RÉSOLUS (`ecart_somme_milliers`) : 2023 par nature, les quatre lignes font 17 081,9 MD pour un total de 17 104,8 (22 977 milliers manquent, LF 2025) ; LF 2021, secteurs de 2017 (1 692) et sources de 2017 et 2019 (99 et 91). LU À L'IMAGE. Ratios au budget et au PIB du rapport non repris (base non dite)., TROIS GRANDEURS À NE PAS CONFONDRE : plafond (paramètre légal), garanties accordées (flux), encours garanti (stock). `periode` distingue l'année, le premier semestre (« -S1 », flux) et la fin juin (« -06 », encours estimé) : NE PAS TRACER UN SEMESTRE COMME UNE ANNÉE. AUCUNE ÉDITION PRÉFÉRÉE : 2019 et 2020 figurent dans les deux annexes 7, d'accord sur l'encours ; trois divergences gardées (`divergence_entre_editions`) — garanties de 2020, 4 603,4 (annexe 7 ; annexe 8 LF 2022 et LF 2023) et 4 603,7 (annexe 8 LF 2024) ; plafond de 2020 après loi de finances rectificative, 7 500 (traduction française de l'annexe 8 LF 2021) et 7 000 (éditions arabes) — NON TRANCHÉ, le texte de la loi rectificative n'a pas été lu ; encours de 2020 en % du PIB, 14,70 (LF 2022) puis 14,4 (LF 2025), PIB révisé sans que la base soit dite. Plafond de 2019 : 4 500 en loi initiale, 4 790 après loi complémentaire. Écarts imprimés déclarés : extérieur + intérieur dépasse le total de 0,1 au premier semestre 2024 ; les trois banques font 1 357,3 pour un total imprimé de 1 357,7 en 2019. Les garanties de l'audit des banques sont données pour un an au titre des engagements de l'année écoulée. LU À L'IMAGE. Rien avant 2016 ; plafonds des lois de finances antérieures non dépouillés., DONNÉES DÉCLARÉES PAR LES ENTREPRISES : le ministère dit n'assumer aucune responsabilité quant à leur fiabilité. LA CRÉANCE DE LA STEG AU TITRE DU COMPLÉMENT DE SUBVENTION (3 423,1 fin 2022, 3 151,6 fin 2023) EST CALCULÉE PAR LA SOCIÉTÉ ET N'EST NI CONFIRMÉE NI CONVENUE AVEC LE MINISTÈRE (ligne `steg_complement_subvention_non_confirme`, mention gardée en `remarque`) ; elle est comprise dans les totaux de 2022 et 2023. Deux petites lignes des dettes ont une légende dont le français et l'arabe se contredisent (redevances / dividendes) : identifiants neutres, à ne pas nommer. Une seule édition : aucune révision observable ; les années 2021 et 2022 y sont déjà mises à jour par rapport à l'édition LF 2024. Composition lue sur les tableaux de données des graphiques ; la somme des cinq lignes de dettes est inférieure de 0,1 au total. AUCUN RACCORD avec les arriérés croisés du FMI à juin 2020 (30 entreprises ; voir entreprises-publiques-etudes-rapportees). LU À L'IMAGE., CHAQUE EXERCICE EST RÉVISÉ PAR L'ÉDITION SUIVANTE, À LA HAUSSE : 2019, 230 puis 263,8 ; 2020, 67,1 puis 98,3 ; 2021, 140,1 puis 145,4 — le fichier garde tout (`edition`, `divergence_entre_editions`). `etat` = « partiel » pour le dernier exercice de chaque édition, que le rapport dit non définitif (25 pour 2020, 37,2 pour 2021, 99,3 pour 2022, 195,6 pour 2023) : NE PAS LE TRACER COMME UN EXERCICE ARRÊTÉ. Chiffres de PROSE, pas de tableau. Le nombre d'entreprises distributrices de 2018 est 7 (LF 2021) puis 8 (LF 2022). Ce n'est pas le total des versements des entreprises au budget (voir entreprises-publiques-versements-transferts). LU À L'IMAGE, y compris 2019 et 2020.]
