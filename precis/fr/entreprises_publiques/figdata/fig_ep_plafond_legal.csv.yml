caveats: [Le plafond est un maximum légal annuel, non un montant de garanties accordées ni un encours. 1958-59 est imprimé en francs et ne figure pas sur la figure. Les lois de finances complémentaires dont l'index n'indique pas d'article sur la garantie n'ont pas été lues en entier : celles de 1969 à 1991 le sont par leur seul index, celles de 1995 à 2015 ne modifient pas le plafond. Les parts du PIB et des dépenses de l'État sont des ordres de grandeur : le numérateur est un plafond voté, les dénominateurs sont décrits sous « plafond-garantie-denominateurs »., Le PIB d'avant 1992 n'a pas de base dite ; les passages de 1991 à 1992, de 1996 à 1997 et de 2009 à 2010 sont des ruptures de série, et aucune conversion n'est faite (voir l'annexe sur le PIB) ; la base 1997 est recalculée par l'INS de 1997 à 2004, la base 2015 de 2010 à 2014. Les dépenses de l'État hors service de la dette ne sont portées qu'à partir de 1986 (avant, voir le budget ordinaire voté) ; aucun PIB avant 1961 : l'année financière 1959-60 n'a pas de part du PIB. Le numérateur est un plafond voté, le dénominateur un budget voté jusqu'en 1986 et des dépenses réalisées ensuite., Montant voté du seul budget ordinaire (titre I), qui peut comprendre une contribution au budget d'équipement et le service de la dette ; le budget d'équipement et de développement n'est pas compris. Il ne se raccorde pas aux dépenses de l'État hors service de la dette, en réalisation, de 1986 à 2015 : les deux séries se recouvrent en 1986 et ne sont jamais chaînées. Pour 1959-60, le chiffre des crédits est illisible : seules les recettes sont lues.]
