caveats: [Le plafond est un maximum légal annuel, non un montant de garanties accordées ni un encours. 1958-59 est imprimé en francs et ne figure pas sur la figure. Les lois de finances complémentaires dont l'index n'indique pas d'article sur la garantie n'ont pas été lues en entier. Les parts du PIB et des dépenses de l'État sont des ordres de grandeur : le numérateur est un plafond voté, les dénominateurs sont décrits sous « plafond-garantie-denominateurs »., Le PIB d'avant 1992 n'a pas de base dite ; le passage de 1991 à 1992 est une rupture de série, dont le niveau n'est pas connu, et aucune conversion n'est faite (voir l'annexe sur le PIB). Aucune dépense de l'État n'est portée avant 1986 ; aucun PIB avant 1961. L'année financière 1959-60 n'a donc aucune part. Le numérateur est un plafond voté, le dénominateur des dépenses un montant réalisé.]
