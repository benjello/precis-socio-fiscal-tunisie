caveats: [UN PLAFOND VOTÉ, NON UN MONTANT DE GARANTIES ACCORDÉES NI UN ENCOURS. 1958-59 est imprimé en francs (7 milliards) : valeur_md vide, aucune conversion. AUCUNE LIGNE POUR 1960 (aucune notice) ; le décret du 29 juin 1957 (1957-58) est absent du corpus local. LOIS DE FINANCES COMPLÉMENTAIRES de 1969 à 1991 lues par leur seul index (n° 69-60, 73-72, 80-1, 82-27, 83-81, 84-2, 86-83, 88-60, 89-88, 91-23) : un relèvement en cours de gestion peut manquer ; celles de 1995 à 2015 ont été cherchées dans le texte et ne modifient pas le plafond ; aucune loi de finances complémentaire pour 2015 n'est indexée. La loi n° 88-145 fixe un montant unique pour 1988 et 1989 (deux lignes). Libellé changé en 1996 (« législation en vigueur ») et en 2013 (prêts ou émissions de sukuk) : colonne remarque. La garantie propre aux dettes des offices des céréales et de l'huile de 1997 (980 MD, art. 17) n'entre pas dans la série. Lecture à l'image ou par océrisation (fascicules scannés), couche texte déchiffrée pour 1999-2004. Gestion 1985 : numéro d'article mal imprimé, 54 retenu. Plafond de 2016 à 2024 : série garanties-etat (annexes du ministère des Finances), jamais chaînée à celle-ci. Les parts du PIB et des dépenses de l'État sont calculées par le précis (dénominateurs : denominateurs-depenses-etat-pib depuis 1986)., Le PIB d'avant 1992 n'a pas de base dite ; les passages de 1991 à 1992, de 1996 à 1997 et de 2009 à 2010 sont des ruptures de série, et aucune conversion n'est faite (voir l'annexe sur le PIB) ; la base 1997 est recalculée par l'INS de 1997 à 2004, la base 2015 de 2010 à 2014. Les dépenses de l'État hors service de la dette ne sont portées qu'à partir de 1986 (avant, voir le budget ordinaire voté) ; aucun PIB avant 1961 : l'année financière 1959-60 n'a pas de part du PIB. Le numérateur est un plafond voté, le dénominateur un budget voté jusqu'en 1986 et des dépenses réalisées ensuite., Montant voté du seul budget ordinaire (titre I), qui peut comprendre une contribution au budget d'équipement et le service de la dette ; le budget d'équipement et de développement n'est pas compris. Il ne se raccorde pas aux dépenses de l'État hors service de la dette, en réalisation, de 1986 à 2015 : les deux séries se recouvrent en 1986 et ne sont jamais chaînées. Pour 1959-60, le chiffre des crédits est illisible : seules les recettes sont lues.]
