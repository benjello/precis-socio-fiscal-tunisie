caveats: [DONNÉES DÉCLARÉES PAR LES ENTREPRISES : le ministère dit n'assumer aucune responsabilité quant à leur fiabilité. LA CRÉANCE DE LA STEG AU TITRE DU COMPLÉMENT DE SUBVENTION (3 423,1 fin 2022, 3 151,6 fin 2023) EST CALCULÉE PAR LA SOCIÉTÉ ET N'EST NI CONFIRMÉE NI CONVENUE AVEC LE MINISTÈRE (ligne `steg_complement_subvention_non_confirme`, mention gardée en `remarque`) ; elle est comprise dans les totaux de 2022 et 2023. Deux petites lignes des dettes ont une légende dont le français et l'arabe se contredisent (redevances / dividendes) : identifiants neutres, à ne pas nommer. Une seule édition : aucune révision observable ; les années 2021 et 2022 y sont déjà mises à jour par rapport à l'édition LF 2024. Composition lue sur les tableaux de données des graphiques ; la somme des cinq lignes de dettes est inférieure de 0,1 au total. AUCUN RACCORD avec les arriérés croisés du FMI à juin 2020 (30 entreprises ; voir entreprises-publiques-etudes-rapportees). LU À L'IMAGE., Mêmes dénominateurs que le volume « La compensation ». Les bases du PIB ne sont pas raccordées : la part du PIB se lit par segment, chaque changement de base est une rupture du seul dénominateur. Dépenses de l'État non disponibles de 1988 à 1990. Un encours rapporté aux dépenses ou au PIB de l'année rapporte un stock à un flux.]
