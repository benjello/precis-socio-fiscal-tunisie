caveats: [LE PREMIER RAPPORT DONNE 1986-1989 EN UN BLOC pour les affaires tranchées (20) et les condamnations (6) ; ses saisines sont données par année (1987 : 67 ; 1988 : 5 ; 1989 : 12), 1986 non dite. Saisines de 1992 non dites. LES AFFAIRES EN COURS CHANGENT DEUX FOIS DE DÉFINITION (colonne definition) : 1990-2000, charge totale de fin d'année, affaires tranchées dans l'année comprises ; 2001-2004, affaires en instruction ; 2005-2009, affaires en instruction et affaires instruites (somme calculée). Les trois segments ne se chaînent pas. LES AFFAIRES TRANCHÉES ne se comparent pas de part et d'autre de 2001 : les classements de l'article 15 bis sont comptés de 1988 à 2001, puis les rapports n'en parlent plus. Condamnations d'entreprises publiques : décompte fait sur les résumés d'arrêts, 1986-1998 seulement, qui range parmi elles les sociétés régionales de transport ; de 1999 à 2009 les rapports ne donnent que des catégories de parties lésées. Aucun rapport n'est connu après le vingt et unième (activité 2009) ; la Cour des comptes reprend les fautes de gestion au 1er janvier 2020. LU À L'IMAGE (pages de chiffres).]
