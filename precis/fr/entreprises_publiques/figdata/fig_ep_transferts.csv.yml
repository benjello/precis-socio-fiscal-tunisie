caveats: [CE TOTAL N'EST PAS « LE COÛT DES ENTREPRISES PUBLIQUES » : il réunit caisses sociales, établissements d'enseignement et de culture, et — dans le secteur économique — LA COMPENSATION (produits de base, carburants, électricité, transport), que le rapport y classe d'après le ministère de tutelle ; le « hors compensation » demande les annexes par établissement, non transcrites. DEUX PÉRIMÈTRES (colonne `perimetre`) : l'édition LF 2020 donne 2016-2018 dans un périmètre que la LF 2021 révise (2017 : 6 161,8 puis 6 852,6 MD) ; 2016 N'EXISTE QUE DANS L'ANCIEN — ne pas le chaîner à 2017. `etat` sépare loi de finances et réalisations : l'exécution dépasse la loi de 18 à 39 % de 2020 à 2023. Toutes les éditions gardées ; révisions mineures de 2018 à 2021. RESTAURATIONS (six, `restauration`) : groupes de trois chiffres imprimés dans l'ordre inverse — « 389 730 » pour 730 389 (rémunération 2016), « 451 895 », « 361 137 » et « 107 652 » (LF 2019), « 315 349 », et « 352 548 » pour 548 352 (LF 2023) —, chacune prouvée par la somme de sa colonne ; les deux de la loi de finances 2019 le sont ensemble, par une seule somme. ÉCARTS IMPRIMÉS NON RÉSOLUS (`ecart_somme_milliers`) : 2023 par nature, les quatre lignes font 17 081,9 MD pour un total de 17 104,8 (22 977 milliers manquent, LF 2025) ; LF 2021, secteurs de 2017 (1 692) et sources de 2017 et 2019 (99 et 91). LU À L'IMAGE. Ratios au budget et au PIB du rapport non repris (base non dite).]
