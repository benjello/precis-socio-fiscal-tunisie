# Manifeste du relevé « plafond de la garantie de l'État fixé par la loi de finances,
# 1958-59 à 1994 ».
#
# Fichier lu par figures/listes.py. Il transcrit, pour chaque loi de finances, l'article
# « octroi de la garantie de l'État » (montant maximal dans la limite duquel le ministre chargé
# des finances est autorisé à accorder la garantie du Trésor, puis de l'État), et les lois qui
# modifient ce montant en cours de gestion. Source de la transcription :
# docs/notes/entreprises-publiques-plafond-garanties-2026-10-23.md.
#
# LECTURE du fascicule français du corpus local (édition française du Journal officiel) pour les
# trente-huit lois : reconnaissance de caractères sur la page de l'article, relue à l'image pour
# les gestions 1963, 1966, 1969, 1975, 1979 et 1985. La page est celle où l'article est imprimé,
# relevée sur l'en-tête ou le pied de la page, ou déduite des pages voisines du même fascicule.
# GESTION 1985 : le numéro de l'article est mal imprimé (« 51 » ou « 54 » à l'image) ; 54 d'après
# la suite des articles 53 et 55.
# UNE LIGNE PAR MONTANT FIXÉ : la loi de finances de l'année, puis la loi qui change ce montant
# (plafond_avant_md porte alors le montant remplacé). L'article 18 de la loi n° 88-145 fixe un
# montant unique « pour l'année 1988 et l'année 1989 » : il a donc deux lignes.
# PLAFOND_IMPRIME : 1958-59 est imprimé en francs ; la ligne est donnée telle qu'imprimée et n'entre pas dans la figure, qui est en millions de dinars.
# NON LUS : l'arrêté ou décret de 1957-58 (fascicule absent du corpus local) ; gestion 1960 ;
# lois de finances complémentaires dont l'index ne détaille pas les articles (n° 69-60,
# 73-72, 80-1, 82-27, 83-81, 84-2, 86-83, 88-60, 89-88, 91-23) : lues par leur seul index.

format: long
cle_de_ligne: [gestion, loi, article]

colonnes:
  gestion: gestion budgétaire sur laquelle porte le montant (« année financière » 1958-59 et 1959-60 ; gestion 1961 et suivantes)
  loi: numéro de la loi qui porte l'article
  date: date de la loi (jort_cache)
  jort_numero: numéro du fascicule du Journal officiel
  article: numéro de l'article de la loi
  page: page du Journal officiel, édition française
  plafond_md: montant maximal fixé, en millions de dinars courants
  plafond_avant_md: montant remplacé, pour une loi qui modifie un montant déjà fixé
  plafond_imprime: montant tel qu'imprimé quand il n'est pas en dinars
  nature: fixation par la loi de finances de l'année, ou modification du montant
  cle: clé de citation de la loi

