# Manifeste du relevé « rapports annuels et états financiers du secteur financier non coté : BFPME, BTS, CPSCL ».
#
# Catalogue des documents trouvés en ligne, gratuitement : une ligne par document (entreprise, exercice, nature). Les copies locales
# vivent sous tunisia-data/data/raw/entreprises-publiques/rapports-entreprises/<sigle>/ (hors git, un fichier par document, nom
# <exercice>_<nature>.pdf) ; le chemin est dans la colonne fichier. Les notices de references.json (ra-, es-, bvmt-ef-) sont
# engendrées par `scripts/notices_rapports_finance.py`. Le Registre national des entreprises (payant) n'est pas consulté.
#
# NATURES. rapport_annuel : rapport annuel de l'entreprise ; rapport_activite : rapport d'activité (CPSCL) ; etats_financiers : états
# financiers publiés par l'entreprise ; etats_financiers_bourse : états financiers individuels de la page « Hors Cote » de la Bourse de
# Tunis, avec le rapport des commissaires aux comptes. Les états de la BTS publiés sur son site pour 2021 à 2025 ne portent pas le rapport
# des commissaires ; la Bourse en porte une autre version, avec le rapport.
#
# RAPPORT_CAC. « oui, p. N » : le rapport des commissaires aux comptes commence à la page N du PDF ; « oui, extrait p. 2 » : un extrait du rapport
# du réviseur des comptes (CPSCL) ; « arabe, non lu » : document en arabe, rapport non lu ; « non lu » : document non lu ; « non » : pas de rapport.
#
# LACUNES CONSIGNÉES. BFPME : exercices 2021 et 2025 et exercices avant 2016 absents de la page de la Bourse ; le site de la banque
# annonce trois rapports annuels d'activité (2020, 2022, 2023) dont les liens sont vides. BTS : états financiers et rapports de 2011 à 2015
# annoncés par des captures de l'Internet Archive, voir les lignes de nature « aucun » s'il y en a. CPSCL : un extrait seulement du rapport du réviseur.
# Aucune des trois entreprises n'est sans document.

format: long
cle_de_ligne: [sigle, exercice, nature]

colonnes:
  sigle: sigle de l'entreprise
  exercice: exercice (31 décembre)
  nature: rapport_annuel, rapport_activite, etats_financiers, etats_financiers_bourse, ou aucun (entreprise sans document ; adresses essayées en url_origine)
  url_origine: adresse du document sur le site de l'éditeur ou de la Bourse de Tunis
  url_archive: capture de l'Internet Archive, si elle existe
  fichier: chemin de la copie locale sous tunisia-data/data/raw/entreprises-publiques/rapports-entreprises/
  octets: taille du fichier
  sha256: somme de contrôle du fichier
  consultation: date de la consultation (aaaa-mm-jj)
  rapport_cac: présence et page du rapport des commissaires aux comptes dans le document

sources: [bts.com.tn/infos-financiers, tunis-stockexchange.com/publications-societes (types BFPME 3204 et BTS 3208), cpscl.com.tn/upload/telechargement, web.archive.org]
