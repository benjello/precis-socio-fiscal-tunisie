# Manifeste du relevé « opinion des commissaires aux comptes de la STB et motifs de réserve ».
#
# Fichier lu par figures/cotees.py (tableau de la sous-section « La STB, opinion des commissaires aux comptes »).
# Préparé par scripts/opinions_cac.py (lecture du texte des rapports annuels, colonne par colonne), puis relu à la
# main sur la page du PDF : le motif est une reformulation courte de l'intitulé du rapport, sans qualification.
# Tunisair (groupe TUNISAIR) : états financiers individuels de la Bourse de Tunis, exercices 2002 à 2004, 2006 à 2010 et 2012 à 2022 ;
# l'opinion de chaque exercice est le rapport général des commissaires aux comptes, relu à la main (2007 et 2008 : PDF numérisés, lus par
# reconnaissance de caractères puis relus sur l'image) ; 2000, 2001, 2005 et 2011 sans rapport sur la page de la Bourse. Les observations
# (continuité d'exploitation, avions présidentiels, OACA) ne sont pas des motifs de réserve et ne figurent pas dans ce relevé.
# Les rapports lus sont les rapports annuels de 2011, 2013, 2014, 2015, 2016, 2017, 2018 et 2019 (comptes individuels) ;
# les autres exercices n'ont pas de rapport récupéré. La page est celle du PDF, non la page imprimée.

format: long
cle_de_ligne: [groupe, exercice, rang]

colonnes:
  groupe: entreprise
  exercice: exercice (31 décembre)
  opinion: opinion des commissaires aux comptes
  rang: numéro du motif dans le rapport
  motif: motif de la réserve, en une ligne
  page_pdf: page du PDF où il figure
  source: clé de la notice du rapport
  themes: "thèmes du motif, séparés par un point-virgule (suspens : comptes de suspens et soldes figés ; hors_bilan : engagements hors bilan non exhaustifs ; garanties : garanties reçues ; si : système d'information et comptabilité multidevises ; provisions : provisions et risques d'exercices antérieurs ; notation : notation ou états financiers des relations ; ecarts : écarts entre engagements comptables et base de gestion ou BCT ; immobilisations : inventaire physique ; fonds_social : compte « réserves pour fonds social » ; avocats : confirmations des avocats ; retraites : indemnités de départ à la retraite ; fonds_etat : fonds budgétaires confiés par l'État ; produits : produits identifiés par client ; thèmes de Tunisair, tous préfixés tunisair_ : tunisair_tiers : clients, fournisseurs et comptes d'attente non justifiés, recettes commerciales, autres actifs et passifs courants ; tunisair_provisions : provisions et risques non constatés (redressement de la CNSS, retenues à la source, pénalités, retraite, litiges, filiales à combler) ; tunisair_flotte : avions destinés à la vente, moteurs vendus ou en maintenance, méthode des composants, grandes visites ; tunisair_fonds_social : fonds social, prêts au personnel et paie ; tunisair_redevances : redevances aéroportuaires collectées comptabilisées en produits ; tunisair_banques : rapprochements bancaires, caisses, virements internes ; tunisair_immobilisations : inventaire physique des immobilisations ; tunisair_informatique : système d'information et prestations de la filiale AISA ; tunisair_filiales : comptes réciproques avec les filiales et créances sur le groupe ; tunisair_oaca : dettes et concessions tarifaires envers l'Office de l'aviation civile et des aéroports ; tunisair_stocks : stocks techniques ; tunisair_hors_bilan : engagements hors bilan ; tunisair_limitations : limitation des travaux (avocats sans réponse, corrections comptables sans support) ; tunisair_presentation : erreurs de présentation du bilan et du tableau des flux)"

