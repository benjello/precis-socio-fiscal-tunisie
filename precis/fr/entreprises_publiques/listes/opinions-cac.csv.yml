# Manifeste du relevé « opinion des commissaires aux comptes de la STB et motifs de réserve ».
#
# Fichier lu par figures/cotees.py (tableau de la sous-section « La STB, opinion des commissaires aux comptes »).
# Préparé par scripts/opinions_cac.py (lecture du texte des rapports annuels, colonne par colonne), puis relu à la
# main sur la page du PDF : le motif est une reformulation courte de l'intitulé du rapport, sans qualification.
# Les rapports lus sont les rapports annuels de 2011, 2013, 2014, 2015, 2016, 2017, 2018 et 2019 (comptes individuels) ;
# les autres exercices n'ont pas de rapport récupéré. La page est celle du PDF, non la page imprimée.

format: long
cle_de_ligne: [groupe, exercice, rang]

colonnes:
  groupe: entreprise
  exercice: exercice (31 décembre)
  opinion: opinion des commissaires aux comptes
  rang: numéro du motif dans le rapport
  motif: motif de la réserve, en une ligne
  page_pdf: page du PDF où il figure
  source: clé de la notice du rapport
  themes: "thèmes du motif, séparés par un point-virgule (suspens : comptes de suspens et soldes figés ; hors_bilan : engagements hors bilan non exhaustifs ; garanties : garanties reçues ; si : système d'information et comptabilité multidevises ; provisions : provisions et risques d'exercices antérieurs ; notation : notation ou états financiers des relations ; ecarts : écarts entre engagements comptables et base de gestion ou BCT ; immobilisations : inventaire physique ; fonds_social : compte « réserves pour fonds social » ; avocats : confirmations des avocats ; retraites : indemnités de départ à la retraite ; fonds_etat : fonds budgétaires confiés par l'État ; produits : produits identifiés par client)"

sources: [ra-stb-2011, ra-stb-2013, ra-stb-2014, ra-stb-2015, ra-stb-2016, ra-stb-2017, ra-stb-2018, ra-stb-2019, bvmt-ef-stb-2012-individuel, bvmt-ef-stb-2020-individuel, bvmt-ef-stb-2021-individuel, bvmt-ef-stb-2022-individuel, bvmt-ef-stb-2023-individuel, bvmt-ef-stb-2024-individuel, bvmt-ef-stb-2025-individuel, bvmt-ef-bh-2011-individuel, bvmt-ef-bh-2012-individuel, bvmt-ef-bh-2013-individuel, bvmt-ef-bh-2014-individuel, bvmt-ef-bh-2015-individuel, bvmt-ef-bh-2016-individuel, bvmt-ef-bh-2017-individuel, bvmt-ef-bh-2019-individuel, bvmt-ef-bh-2020-individuel, bvmt-ef-bh-2021-individuel, bvmt-ef-bh-2022-individuel, bvmt-ef-bh-2023-individuel, bvmt-ef-bh-2024-individuel, bvmt-ef-bna-2011-individuel, bvmt-ef-bna-2012-individuel, bvmt-ef-bna-2013-individuel, bvmt-ef-bna-2014-individuel, bvmt-ef-bna-2015-individuel, bvmt-ef-bna-2016-individuel, bvmt-ef-bna-2017-individuel, bvmt-ef-bna-2019-individuel, bvmt-ef-bna-2020-individuel, bvmt-ef-bna-2021-individuel, bvmt-ef-bna-2022-individuel, bvmt-ef-bna-2023-individuel, bvmt-ef-bna-2024-individuel]
