# Manifeste du relevé « opinion des commissaires aux comptes de la STB et motifs de réserve ».
#
# Fichier lu par figures/cotees.py (tableau de la sous-section « La STB, opinion des commissaires aux comptes »).
# Préparé par scripts/opinions_cac.py (lecture du texte des rapports annuels, colonne par colonne), puis relu à la
# main sur la page du PDF : le motif est une reformulation courte de l'intitulé du rapport, sans qualification.
# Les rapports lus sont les rapports annuels de 2011, 2013, 2014, 2015, 2016, 2017, 2018 et 2019 (comptes individuels) ;
# les autres exercices n'ont pas de rapport récupéré. La page est celle du PDF, non la page imprimée.
# STAR (assureur) : états individuels de la Bourse de Tunis, 2002 à 2005, 2007 à 2009 et 2011 à 2024 (21 exercices).
# Pas de rapport dans les PDF de 2006 et de 2010 (états financiers sans rapport des commissaires aux comptes) ;
# 2000 : l'état de résultat seul ; 2001 : aucun document sur la page de la Bourse. Le document « 2016_consolide » de la
# Bourse contient les états individuels (total du bilan 1 031,8 MD) : la STAR ne consolide qu'à partir de 2021.
# Pour un exercice sans réserve, le motif résume les paragraphes d'observation ; les « questions clés de l'audit »
# (créances sur assurés, provisions techniques, de 2017 à 2024) ne sont pas relevées.

# TUNISRE (Tunis Re, réassureur) : dix-sept exercices, 2009 à 2025, tous sans réserve ; la ligne de chaque exercice reprend les paragraphes d'observation et,
# de 2017 à 2024, les questions clés de l'audit. Les rapports de 2010, 2011, 2012 et 2014 sont des images sans couche texte, lus à l'écran.

# BTE (groupe « BTE ») : 17 exercices lus sur les états individuels de la page de la Bourse de Tunis, relus à la main sur la
# page du PDF. Seul 2024 a une réserve (thème « suspens ») ; les autres exercices sont « sans réserve », avec le contenu du
# paragraphe d'observation quand il y en a. Le rapport de 2013 est une image (pages 19 à 26) : lu par reconnaissance optique,
# pages 20 et 21 relues sur l'image. Exercices sans rapport lu : 2005 (la Bourse porte le fichier de 2004), 2007 (la Bourse
# porte les états consolidés), 2016 (le fichier ne contient pas le rapport des commissaires aux comptes), 2018 (pas d'états
# individuels sur la page). Pour 2023, la page citée est celle de l'incertitude sur la continuité (p. 43) ; l'observation est p. 46.

# Tunisair (groupe TUNISAIR) : états financiers individuels de la Bourse de Tunis, exercices 2002 à 2004, 2006 à 2010 et 2012 à 2022 ;
# l'opinion de chaque exercice est le rapport général des commissaires aux comptes, relu à la main (2007 et 2008 : PDF numérisés, lus par
# reconnaissance de caractères puis relus sur l'image) ; 2000, 2001, 2005 et 2011 sans rapport sur la page de la Bourse. Les paragraphes
# d'observations et les sections sur la continuité d'exploitation ne sont pas des motifs de réserve et ne figurent pas dans ce relevé.

# les autres exercices n'ont pas de rapport récupéré. Groupe CIMBIZ (Les Ciments de Bizerte) : états financiers individuels de la Bourse de Tunis, 2009 à 2024 ; l'opinion est sans réserve sauf en 2023 (une réserve) ; les paragraphes d'observation et l'incertitude sur la continuité de l'exploitation sont résumés dans la colonne motif des lignes sans réserve, sans thème ; aucun thème propre n'est ajouté, la réserve de 2023 relève du thème « immobilisations » ; les exercices 2012, 2013 et, pour le rapport, 2022 sont des PDF numérisés lus à l'image. La page est celle du PDF, non la page imprimée.

# SOTUMAG : états financiers individuels de la Bourse (2002, 2006, 2016 à 2024), rapport général lu à la main ; 2016, 2017 et 2020 sont des scans, lus par reconnaissance de caractères puis relus ; pas d'états de 2025 sur la page de la Bourse.

# BFPME, BTS et CPSCL (entreprises sans page de cotation : pas de délai de publication, la figure n'a pas de courbe des délais).
# BFPME : exercice 2005 dans le rapport annuel de 2005 (capture de l'Internet Archive de l'ancien site) ; exercices 2006 à 2015 et 2021 dans les
# extraits du Bulletin officiel du Conseil du marché financier publiés sur le site du CMF (2006 : en arabe, lu sur le texte du PDF et relu sur
# l'image ; 2013 : scan, lu par reconnaissance de caractères, relu sur l'image) ; exercices 2016 à 2020 et 2022 à 2024 dans les états financiers de la
# page « BFPME (Hors Cote) » de la Bourse de Tunis (l'exercice 2021 : Bulletin officiel du CMF du 5 septembre 2023, pages 283 à 292). Le fichier de 2010 du CMF s'intitule « PME_EFD311210 ». En 2007, les deux co-commissaires donnent des
# opinions divergentes : les lignes sont celles du co-commissaire qui émet des réserves, la première dit l'opinion de l'autre. Le fichier que la Bourse
# intitule « au 19/07/2024 » contient les états de l'exercice 2022. Les paragraphes d'observation ne sont pas des lignes du relevé.
# BTS : exercices 2006 à 2009, 2011 à 2013 dans les extraits du Bulletin officiel du CMF (CMF) ; 2014 et 2015 dans les états financiers de la page « BTS
# (Hors Cote) » de la Bourse ; 2016 et 2017 dans le rapport annuel (la couche texte de l'édition 2016 confond des chiffres : les nombres cités sont relus
# sur l'image) ; 2018 à 2025 dans les états financiers de la Bourse. L'exercice 2010 n'a pas de document. Réserves de 2006 à 2009 et de 2011 à 2014 ;
# sans réserve de 2015 à 2025, la ligne résume alors les observations et les questions clés de l'audit. Pour 2013, le relevé suit le rapport du 7 octobre 2014 (cinq réserves) ; le rapport initial du 26 août 2014, publié au Bulletin officiel du 8 septembre 2014 (cmf-efr-bts-2013, page 49), comptait une sixième réserve, levée ensuite à la demande de la Banque centrale : elle n'est pas une ligne du relevé.
# CPSCL : les 19 documents des états financiers (2006 à 2024) de la caisse portent, page 2, un extrait du rapport général du réviseur
# des comptes (l'extrait, non le rapport entier) ; tous sans réserve. Le site de la caisse intitule ces documents « états financiers … et extrait du rapport du commissaire aux comptes ».

# STEG (groupe STEG) : rapport général de l'auditeur externe (réviseur légal) : exercices 2005 à 2012, lu dans les rapports annuels de la STEG (images ; 2006 en arabe), tous sans réserve sauf 2012 (opinion « à l'exception de ce qui a été cité précédemment ») ; le rapport de 2013 manque (ni état financier en ligne, ni rapport dans le rapport annuel de 2013) ; exercices 2014 à 2021, joint aux états financiers de la STEG, tous « avec réserves » ; les états de 2022 et de 2023 ne contiennent pas de rapport. Les copies de 2014 à 2018 et de 2020 sont des images : lues par reconnaissance optique, montants relus à l'écran. Dans la copie de 2017, une page du rapport manque (après « Paragraphes d'observations » p. 51, p. 52 commence au milieu du paragraphe sur DEWCO). Le « rang » suit les réserves que le rapport compte (2014 et 2015 : deux réserves, dont l'une réunit les points 3-1-1 à 3-1-3). Les paragraphes d'observation ne sont pas relevés ici.
# ETAP (groupe ETAP) : rapports financiers du site de l'ETAP, 2003 à 2018 (avec le rapport annuel de 2016, dont le rapport du réviseur légal ne figure pas dans l'extrait « rapport financier » de 2016). Pas de rapport des commissaires aux comptes dans les extraits de 2019 à 2024, ni de rapport financier en ligne pour 2004 et 2006. La première page du rapport de 2011 date le bilan « au 31 décembre 2012 » : erreur de plume, les montants et l'opinion sont ceux de 2011.
# SOTRAPIL (groupe SOTRAPIL, société cotée) : états financiers annuels de la page de la société à la Bourse de Tunis, 2002 à 2022, 2024 et 2025 ; 2000 (bilan seul) et 2011 (états sans rapport) n'ont pas de rapport ; 2023 n'est pas sur la page. Tous « sans réserve » ; le motif résume les observations. Les rapports de 2018 à 2025 sont en arabe. Le texte de 2010 a des chiffres brouillés dans la couche texte : relus sur l'image.
# FOULADH (Société tunisienne de sidérurgie El Fouladh, non cotée) : états financiers de 2013 à 2018 et de 2020 à 2024 (onze exercices) du site du Conseil du marché financier (copie de la Bourse de Tunis, page « hors cote », pour 2017, 2018 et 2020 à 2023) ; 2019 : aucun document en ligne. Les rapports généraux des commissaires aux comptes sont en arabe : ils sont lus sur la couche texte (2013, 2014, 2020, 2022 à 2024) ou sur l'image (2015 à 2018, 2021 : PDF numérisés ou à polices non décodables) et chaque nombre est relevé deux fois. 2013 à 2018 et 2020 à 2023 sont avec réserves (de six à neuf motifs par exercice, numérotés comme dans le rapport, sans les paragraphes d'observation) ; 2024 est sans réserve, avec un paragraphe d'observation. Les observations placées après l'opinion (stocks hors inventaire de 2017 à 2022 sauf 2019, indemnités de départ à la retraite, ferraille de fonte, détournements) ne sont pas des motifs de réserve et ne figurent pas dans ce relevé, sauf en 2024. La page est celle du PDF, non la page imprimée. Pas de page de la Bourse avec date de publication : pas de courbe des délais.
# TTN (Tunisie Trade Net) : rapport général des commissaires aux comptes joint aux états financiers 2023, 2024 et 2025 publiés sur le site de la société (rapports en arabe ; 2023 : scan lu à l'écran, 2024 et 2025 : relus sur l'image). Les trois exercices sont sans réserve ; les paragraphes d'observation et le manquement signalé à l'assemblée (article 270 du code des sociétés commerciales) sont résumés dans la colonne motif, sans thème. La page est celle du PDF. Exercices 2017 à 2022 : aucun rapport des commissaires aux comptes en ligne.
# TT (Tunisie Télécom, société anonyme non cotée) : pas de page à la Bourse, donc pas de délai de publication. Seul document en ligne avec
# des rapports de commissaires aux comptes : le document de référence de 2010 déposé au CMF (notice es-tt-2009), qui reproduit le rapport
# général de 2009 (images, lues par reconnaissance de caractères puis relues sur l'image, p. 209-214) et, pour 2007 et 2008, l'opinion
# sur les comptes individuels citée dans le chapitre de présentation (p. 16-19). Les rapports des commissaires aux comptes sur les comptes
# consolidés, en normes IFRS, et sur la période de neuf mois close le 30 septembre 2010 ne sont pas relevés (autre périmètre, autre nature).
# Les exercices 2004 à 2006 et 2010 et suivants n'ont pas de rapport en ligne. Un motif est un point de la liste « notre audit a été limité par »
# dont l'opinion dit « sous réserve des conséquences des ajustements ». Les paragraphes d'observation ne sont pas des motifs de réserve et ne
# figurent pas dans ce relevé.

format: long
cle_de_ligne: [groupe, exercice, rang]

colonnes:
  groupe: entreprise
  exercice: exercice (31 décembre)
  opinion: opinion des commissaires aux comptes
  rang: numéro du motif dans le rapport
  motif: motif de la réserve, en une ligne
  page_pdf: page du PDF où il figure
  source: clé de la notice du rapport
  themes: "thèmes du motif, séparés par un point-virgule (suspens : comptes de suspens et soldes figés ; hors_bilan : engagements hors bilan non exhaustifs ; garanties : garanties reçues ; si : système d'information et comptabilité multidevises ; provisions : provisions et risques d'exercices antérieurs ; notation : notation ou états financiers des relations ; ecarts : écarts entre engagements comptables et base de gestion ou BCT ; immobilisations : inventaire physique ; fonds_social : compte « réserves pour fonds social » ; avocats : confirmations des avocats ; retraites : indemnités de départ à la retraite ; fonds_etat : fonds budgétaires confiés par l'État ; produits : produits identifiés par client ; star_provisions_techniques : insuffisance des provisions techniques de l'assureur ; star_ecarts_comptes : écarts entre soldes comptables et extra-comptables (cessionnaires, primes, points de vente) ; star_exercices_anterieurs : opérations d'exercices antérieurs portées dans le résultat de l'exercice ; thèmes de Tunisair, tous préfixés tunisair_ : tunisair_tiers : clients, fournisseurs et comptes d'attente non justifiés, recettes commerciales, autres actifs et passifs courants ; tunisair_provisions : provisions et risques non constatés (redressement de la CNSS, retenues à la source, pénalités, retraite, litiges, filiales à combler) ; tunisair_flotte : avions destinés à la vente, moteurs vendus ou en maintenance, méthode des composants, grandes visites ; tunisair_fonds_social : fonds social, prêts au personnel et paie ; tunisair_redevances : redevances aéroportuaires collectées comptabilisées en produits ; tunisair_banques : rapprochements bancaires, caisses, virements internes ; tunisair_immobilisations : inventaire physique des immobilisations ; tunisair_informatique : système d'information et prestations de la filiale AISA ; tunisair_filiales : comptes réciproques avec les filiales et créances sur le groupe ; tunisair_oaca : dettes et concessions tarifaires envers l'Office de l'aviation civile et des aéroports ; tunisair_stocks : stocks techniques ; tunisair_hors_bilan : engagements hors bilan ; tunisair_limitations : limitation des travaux (avocats sans réponse, corrections comptables sans support) ; tunisair_presentation : erreurs de présentation du bilan et du tableau des flux ; sotumag_chambres_froides : chambres froides de la SOTUMAG louées comme boxes d'emballage ; sotumag_pharmacies : rubrique « Pharmacies et laboratoires conventionnés » de la SOTUMAG ; thèmes de la BFPME, préfixés bfpme_ : bfpme_fonds_exterieurs : fonds du Fonds suisse et du Qatari Friendship Fund comptabilisés parmi les capitaux propres ; bfpme_sotugar_interets : intérêts de trésorerie dus par la SOTUGAR comptabilisés sans contrôle ; bfpme_commissions : commissions d'étude et de gestion constatées en résultat à la notification de l'approbation du financement et non à la signature du contrat de prêt ; thèmes de la STEG, préfixés steg_ : steg_modification_comptable : ajustement des capitaux propres d'ouverture de 67 millions de dinars en 2012 ; steg_amortissements : coût de démantèlement amorti sur une durée supérieure à celle des immobilisations ; steg_clients_avances : rubrique « Clients, avances reçues » ; steg_subventions : subventions à recevoir de l'État portées en modifications comptables ; STEG, thèmes communs : immobilisations pour l'inventaire physique, les titres de propriété et le patrimoine transféré, si pour les déficiences du système d'information ; thèmes de l'ETAP, préfixés etap_ : etap_cost_oil : Cost Oil de la concession Bir Ben Tartar ; etap_restitution_sites : provisions pour obligations de restitution des sites ; etap_gpl_hasdrubal : factures du GPL Hasdrubal ; thèmes d'El Fouladh, tous préfixés fouladh_ : fouladh_continuite : pertes, fonds propres négatifs, arriérés envers la CNSS, la STEG et le fisc, retard du programme d'assainissement financier ; fouladh_stocks : stocks non couverts par l'inventaire physique ; fouladh_clients : soldes clients non justifiés, écarts avec l'application commerciale, pas de grand livre auxiliaire ni de balance âgée ; fouladh_personnel : prêts et avances au personnel sans justificatifs ; fouladh_autres_actifs : autres actifs courants non justifiés ; fouladh_fournisseurs : avances aux fournisseurs et comptes débiteurs des fournisseurs non justifiés, soldes fournisseurs non confirmés ; fouladh_banques : rapprochements bancaires, transferts internes et comptes de liaison en suspens ; fouladh_passifs : autres passifs courants non justifiés ou en attente de régularisation ; El Fouladh utilise aussi immobilisations, retraites et provisions ; thèmes de Tunisie Télécom, tous préfixés tt_ : tt_immeubles : situation juridique et comptable des immeubles apportés par l'État à la création de la société ; tt_clients : absence de comptabilité auxiliaire des clients, encaissements non identifiés, fiabilité des provisions ; tt_charges : rattachement des charges à la période, prise en compte des factures fournisseurs ; tt_passifs_abonnes : avances sur consommation et redevances perçues d'avance sans situation par abonné ; tt_prepaye : passage du chiffre d'affaires prépayé à la méthode de la consommation, ajustement préalable ; tt_confirmations : confirmations de soldes non reçues des fournisseurs, avocats, banques, assurances et opérateurs)"

