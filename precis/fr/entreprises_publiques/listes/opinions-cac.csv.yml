# Manifeste du relevé « opinion des commissaires aux comptes de la STB et motifs de réserve ».
#
# Fichier lu par figures/cotees.py (tableau de la sous-section « La STB, opinion des commissaires aux comptes »).
# Préparé par scripts/opinions_cac.py (lecture du texte des rapports annuels, colonne par colonne), puis relu à la
# main sur la page du PDF : le motif est une reformulation courte de l'intitulé du rapport, sans qualification.
# Les rapports lus sont les rapports annuels de 2011, 2013, 2014, 2015, 2016, 2017, 2018 et 2019 (comptes individuels) ;
# les autres exercices n'ont pas de rapport récupéré. La page est celle du PDF, non la page imprimée.
# STAR (assureur) : états individuels de la Bourse de Tunis, 2002 à 2005, 2007 à 2009 et 2011 à 2024 (21 exercices).
# Pas de rapport dans les PDF de 2006 et de 2010 (états financiers sans rapport des commissaires aux comptes) ;
# 2000 : l'état de résultat seul ; 2001 : aucun document sur la page de la Bourse. Le document « 2016_consolide » de la
# Bourse contient les états individuels (total du bilan 1 031,8 MD) : la STAR ne consolide qu'à partir de 2021.
# Pour un exercice sans réserve, le motif résume les paragraphes d'observation ; les « questions clés de l'audit »
# (créances sur assurés, provisions techniques, de 2017 à 2024) ne sont pas relevées.

# TUNISRE (Tunis Re, réassureur) : dix-sept exercices, 2009 à 2025, tous sans réserve ; la ligne de chaque exercice reprend les paragraphes d'observation et,
# de 2017 à 2024, les questions clés de l'audit. Les rapports de 2010, 2011, 2012 et 2014 sont des images sans couche texte, lus à l'écran.

# BTE (groupe « BTE ») : 17 exercices lus sur les états individuels de la page de la Bourse de Tunis, relus à la main sur la
# page du PDF. Seul 2024 a une réserve (thème « suspens ») ; les autres exercices sont « sans réserve », avec le contenu du
# paragraphe d'observation quand il y en a. Le rapport de 2013 est une image (pages 19 à 26) : lu par reconnaissance optique,
# pages 20 et 21 relues sur l'image. Exercices sans rapport lu : 2005 (la Bourse porte le fichier de 2004), 2007 (la Bourse
# porte les états consolidés), 2016 (le fichier ne contient pas le rapport des commissaires aux comptes), 2018 (pas d'états
# individuels sur la page). Pour 2023, la page citée est celle de l'incertitude sur la continuité (p. 43) ; l'observation est p. 46.

# Tunisair (groupe TUNISAIR) : états financiers individuels de la Bourse de Tunis, exercices 2002 à 2004, 2006 à 2010 et 2012 à 2022 ;
# l'opinion de chaque exercice est le rapport général des commissaires aux comptes, relu à la main (2007 et 2008 : PDF numérisés, lus par
# reconnaissance de caractères puis relus sur l'image) ; 2000, 2001, 2005 et 2011 sans rapport sur la page de la Bourse. Les paragraphes
# d'observations et les sections sur la continuité d'exploitation ne sont pas des motifs de réserve et ne figurent pas dans ce relevé.

# les autres exercices n'ont pas de rapport récupéré. Groupe CIMBIZ (Les Ciments de Bizerte) : états financiers individuels de la Bourse de Tunis, 2009 à 2024 ; l'opinion est sans réserve sauf en 2023 (une réserve) ; les paragraphes d'observation et l'incertitude sur la continuité de l'exploitation sont résumés dans la colonne motif des lignes sans réserve, sans thème ; aucun thème propre n'est ajouté, la réserve de 2023 relève du thème « immobilisations » ; les exercices 2012, 2013 et, pour le rapport, 2022 sont des PDF numérisés lus à l'image. La page est celle du PDF, non la page imprimée.

# SOTUMAG : états financiers individuels de la Bourse (2002, 2006, 2016 à 2024), rapport général lu à la main ; 2016, 2017 et 2020 sont des scans, lus par reconnaissance de caractères puis relus ; pas d'états de 2025 sur la page de la Bourse.

# STEG (groupe STEG) : rapport général de l'auditeur externe (réviseur légal) joint aux états financiers de la STEG, exercices 2014 à 2021, tous « avec réserves » ; les états de 2022 et de 2023 ne contiennent pas de rapport. Les copies de 2014 à 2018 et de 2020 sont des images : lues par reconnaissance optique, montants relus à l'écran. Dans la copie de 2017, une page du rapport manque (après « Paragraphes d'observations » p. 51, p. 52 commence au milieu du paragraphe sur DEWCO). Le « rang » suit les réserves que le rapport compte (2014 et 2015 : deux réserves, dont l'une réunit les points 3-1-1 à 3-1-3). Les paragraphes d'observation ne sont pas relevés ici.
# ETAP (groupe ETAP) : rapports financiers du site de l'ETAP, 2003 à 2018 (avec le rapport annuel de 2016, dont le rapport du réviseur légal ne figure pas dans l'extrait « rapport financier » de 2016). Pas de rapport des commissaires aux comptes dans les extraits de 2019 à 2024, ni de rapport financier en ligne pour 2004 et 2006. La première page du rapport de 2011 date le bilan « au 31 décembre 2012 » : erreur de plume, les montants et l'opinion sont ceux de 2011.
# SOTRAPIL (groupe SOTRAPIL, société cotée) : états financiers annuels de la page de la société à la Bourse de Tunis, 2002 à 2022, 2024 et 2025 ; 2000 (bilan seul) et 2011 (états sans rapport) n'ont pas de rapport ; 2023 n'est pas sur la page. Tous « sans réserve » ; le motif résume les observations. Les rapports de 2018 à 2025 sont en arabe. Le texte de 2010 a des chiffres brouillés dans la couche texte : relus sur l'image.

format: long
cle_de_ligne: [groupe, exercice, rang]

colonnes:
  groupe: entreprise
  exercice: exercice (31 décembre)
  opinion: opinion des commissaires aux comptes
  rang: numéro du motif dans le rapport
  motif: motif de la réserve, en une ligne
  page_pdf: page du PDF où il figure
  source: clé de la notice du rapport
  themes: "thèmes du motif, séparés par un point-virgule (suspens : comptes de suspens et soldes figés ; hors_bilan : engagements hors bilan non exhaustifs ; garanties : garanties reçues ; si : système d'information et comptabilité multidevises ; provisions : provisions et risques d'exercices antérieurs ; notation : notation ou états financiers des relations ; ecarts : écarts entre engagements comptables et base de gestion ou BCT ; immobilisations : inventaire physique ; fonds_social : compte « réserves pour fonds social » ; avocats : confirmations des avocats ; retraites : indemnités de départ à la retraite ; fonds_etat : fonds budgétaires confiés par l'État ; produits : produits identifiés par client ; star_provisions_techniques : insuffisance des provisions techniques de l'assureur ; star_ecarts_comptes : écarts entre soldes comptables et extra-comptables (cessionnaires, primes, points de vente) ; star_exercices_anterieurs : opérations d'exercices antérieurs portées dans le résultat de l'exercice ; thèmes de Tunisair, tous préfixés tunisair_ : tunisair_tiers : clients, fournisseurs et comptes d'attente non justifiés, recettes commerciales, autres actifs et passifs courants ; tunisair_provisions : provisions et risques non constatés (redressement de la CNSS, retenues à la source, pénalités, retraite, litiges, filiales à combler) ; tunisair_flotte : avions destinés à la vente, moteurs vendus ou en maintenance, méthode des composants, grandes visites ; tunisair_fonds_social : fonds social, prêts au personnel et paie ; tunisair_redevances : redevances aéroportuaires collectées comptabilisées en produits ; tunisair_banques : rapprochements bancaires, caisses, virements internes ; tunisair_immobilisations : inventaire physique des immobilisations ; tunisair_informatique : système d'information et prestations de la filiale AISA ; tunisair_filiales : comptes réciproques avec les filiales et créances sur le groupe ; tunisair_oaca : dettes et concessions tarifaires envers l'Office de l'aviation civile et des aéroports ; tunisair_stocks : stocks techniques ; tunisair_hors_bilan : engagements hors bilan ; tunisair_limitations : limitation des travaux (avocats sans réponse, corrections comptables sans support) ; tunisair_presentation : erreurs de présentation du bilan et du tableau des flux ; sotumag_chambres_froides : chambres froides de la SOTUMAG louées comme boxes d'emballage ; sotumag_pharmacies : rubrique « Pharmacies et laboratoires conventionnés » de la SOTUMAG ; thèmes de la STEG, préfixés steg_ : steg_amortissements : coût de démantèlement amorti sur une durée supérieure à celle des immobilisations ; steg_clients_avances : rubrique « Clients, avances reçues » ; steg_subventions : subventions à recevoir de l'État portées en modifications comptables ; STEG, thèmes communs : immobilisations pour l'inventaire physique, les titres de propriété et le patrimoine transféré, si pour les déficiences du système d'information ; thèmes de l'ETAP, préfixés etap_ : etap_cost_oil : Cost Oil de la concession Bir Ben Tartar ; etap_restitution_sites : provisions pour obligations de restitution des sites ; etap_gpl_hasdrubal : factures du GPL Hasdrubal)"

