# Manifeste du relevé « arriérés croisés des entreprises publiques tunisiennes, 2019 et 2020 » (FMI, Departmental
# Paper 2021/019, annexe 4, figure 4.1).
#
# Relevé à l'image de la page 116 du fichier (page imprimée 103), figure rendue à 300 dpi et relue flèche par flèche.
# Le document est un schéma : les montants sont les étiquettes des flèches. Aucun fichier n'en tire encore une
# figure ni un tableau du livre.
#
# CE QUE LE DOCUMENT IMPRIME : quinze montants en pourcentage du PIB, entre des blocs (État, énergie = STIR, STEG, ETAP,
# SNDP ; agriculture = Office national des céréales et Office national de l'huile ; autres entreprises publiques ;
# fonds de sécurité sociale = CNSS/CNRPS, Caisse nationale d'assurance maladie, PCT ; « Other »). Légende de la
# note : flèches orange = arriérés de l'État envers les entreprises publiques ; flèches violettes = arriérés des
# entreprises envers d'autres entités. Une flèche part du débiteur et pointe vers le créancier : c'est ainsi que
# `debiteur` et `creancier` sont remplis. Note du FMI : les données État-entreprises sont de juin 2020, toutes les
# autres de 2019 « as included in the 2020 budget annex, and information from CNAM and PCT ».
# CE QU'IL N'IMPRIME PAS : aucun montant par entreprise (STEG, STIR, ETAP, SNDP sont groupées), aucun montant en dinars,
# aucun PIB de référence ni base du PIB. La flèche à quatre pointes du bloc énergie (2,5) ne distingue pas créancier et débiteur.
# La période des flèches entre l'État et les fonds de sécurité sociale et de la chaîne CNSS/CNRPS, CNAM, PCT n'est pas
# tranchée par la note : colonne `annee` vide, statut `imprime_periode_incertaine` (TODO).
# Ne se lit pas comme un total : les blocs se chevauchent (l'énergie compte ses arriérés internes à part).

format: long
cle_de_ligne: [creancier, debiteur, annee]

colonnes:
  creancier: bloc vers lequel pointe la flèche
  debiteur: bloc d'où part la flèche
  annee: 2020-06 (juin 2020, arriérés État-entreprises), 2019, ou vide si la note ne tranche pas
  montant: montant imprimé, en chaîne
  unite: unité imprimée (Percent of GDP)
  document: clé de la notice (imf-dp-2021-019)
  page_pdf: page du fichier
  page_imprimee: numéro imprimé
  statut: imprime ou imprime_periode_incertaine
  citation: titre de la figure et flèche lue
  note: couleur de la flèche et réserve de lecture

sources: [imf-dp-2021-019]
