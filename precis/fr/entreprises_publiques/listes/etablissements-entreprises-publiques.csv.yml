# Manifeste du relevé « établissements publics à caractère non administratif considérés
# comme entreprises publiques, 1997-2007 ».
#
# Fichier lu par figures/listes.py. Il transcrit la liste fixée par le décret n° 97-564,
# complétée par le décret n° 98-752, refaite par les décrets n° 99-2378, n° 2002-2199 et
# n° 2004-2265, puis modifiée par les décrets n° 2006-2579, n° 2007-1865 et n° 2007-2560.
# Source de la transcription : docs/notes/entreprises-publiques-liste-2026-10-13.md, § 2.
#
# LES NOMBRES SONT COMPTÉS SUR LES LISTES : 41, 42, 44, 44, 44, 43, 45 et 46. Les états de
# 2006 et de juillet 2007 sont l'état de 2004 après chaque décret modificatif.
# APRÈS OCTOBRE 2007 aucun décret ne modifie la liste : les établissements classés par leur
# propre décret (2019, 2023, 2024) ne sont pas dans ce relevé.

format: long
cle_de_ligne: [rang, liste]

colonnes:
  rang: ordre de première apparition dans les listes
  etablissement: nom imprimé dans la première liste où l'établissement figure
  liste: état de la liste (1997, 1998, 1999, 2002, 2004, 2006 ; 2007-07 pour juillet 2007 ; 2007 pour octobre 2007)
  present: oui si l'établissement figure sur la liste
  nom_dans_la_liste: nom imprimé quand il change
  texte: clé de citation du décret qui fixe cet état

sources:
  - decret97-564
  - decret98-752
  - decret99-2378
  - decret2002-2199
  - decret2004-2265
  - decret2006-2579
  - decret2007-1865
  - decret2007-2560
