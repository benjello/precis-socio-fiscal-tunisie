# Manifeste du relevé « périmètre de consolidation de la STB, de la BH et de la BNA, exercice par exercice ».
#
# Fichier lu par figures/cotees.py (tableau du chapitre « Les sociétés cotées »). Engendré par
# `scripts/perimetres_groupes_bancaires.py` à partir du texte des rapports annuels de gestion et des
# états financiers consolidés de chaque banque, publiés sur sa page à la Bourse de Tunis ou gardés par
# l'Internet Archive de son site (copies locales sous tunisia-data, hors git).
#
# CE QUE CHAQUE RAPPORT IMPRIME : la STB donne les pourcentages de contrôle et d'intérêt de ses
# sociétés consolidées, mère comprise, sans la méthode dans le tableau du rapport annuel ; la BNA
# donne méthode, contrôle et intérêt de ses entités consolidées, mère comprise ; la BH ne donne que
# le pourcentage d'intérêt et la méthode, mère comprise. Pour la BH, les rapports annuels de gestion
# (exercices 2016 à 2023) impriment le pourcentage d'intérêt de l'exercice ET de l'exercice précédent
# dans deux colonnes, mais une seule méthode (celle de l'exercice, reportée sur l'exercice précédent).
# Le pourcentage de contrôle est la part des droits de vote, le pourcentage d'intérêt la part du
# capital détenue directement et indirectement : ce n'est PAS la part directe de la banque, que la
# Bourse donne par ailleurs (BH Bank détient 41,64 % de BH Leasing, pour 57,05 % d'intérêt du groupe).
# Couverture : STB 2010-2021, BNA 2007/2020/2021, BH 2016/2017 et 2021-2023 (les exercices BH 2018-2020
# ne sont pas repris : leurs seuls états consolidés locaux sont en mise en page multicolonne illisible).

format: long
cle_de_ligne: [groupe, exercice, entite]

colonnes:
  groupe: banque qui consolide
  exercice: exercice (31 décembre)
  source: clé de la notice du rapport lu
  entite: entité, telle que le rapport l'imprime
  methode: intégration globale, mise en équivalence, ou « mère » ; vide pour la STB, dont le tableau ne la donne pas
  controle_pct: pourcentage de contrôle (droits de vote) ; vide pour la BH, dont le rapport ne le donne pas
  interet_pct: pourcentage d'intérêt (part du capital, directe et indirecte)
  pays: pays de l'entité quand le rapport le donne

sources: [bvmt-ra-stb-2021, bvmt-ra-bh-2021, bvmt-ra-bna-2021, ra-stb-2011, ra-stb-2013, ra-stb-2014, ra-stb-2015, ra-stb-2017, ra-stb-2018, bvmt-ef-stb-2019-consolide, ra-bna-2007, ra-bna-2020, ra-bh-2017, ra-bh-2022, ra-bh-2023]
