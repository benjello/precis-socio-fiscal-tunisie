# Manifeste du relevé « périmètre de consolidation de la STB, de la BH et de la BNA au 31 décembre 2021 ».
#
# Fichier lu par figures/cotees.py (tableau du chapitre « Les sociétés cotées »). Engendré par
# `scripts/perimetres_groupes_bancaires.py` à partir du texte du rapport annuel de gestion 2021 de
# chaque banque, publié sur sa page à la Bourse de Tunis (copies locales sous tunisia-data, hors git).
#
# CE QUE CHAQUE RAPPORT IMPRIME : la STB donne les pourcentages de contrôle et d'intérêt de ses
# 22 sociétés consolidées, mère comprise (pages 96 et 97), sans la méthode dans ce tableau ; la BNA
# donne méthode, contrôle et intérêt de ses 22 entités consolidées, mère comprise (page 127) ; la BH
# ne donne que le pourcentage d'intérêt et la méthode de ses 11 entités, mère comprise (page 240).
# Le pourcentage de contrôle est la part des droits de vote, le pourcentage d'intérêt la part du
# capital détenue directement et indirectement : ce n'est PAS la part directe de la banque, que la
# Bourse donne par ailleurs (BH Bank détient 41,64 % de BH Leasing, pour 57,05 % d'intérêt du groupe).
# Exercice 2021 : c'est le dernier rapport annuel de gestion que la Bourse met en ligne pour ces banques.
#
# TUNISAIR : périmètre du groupe Tunisair, exercices 2006 et 2009 à 2022, d'après les états financiers consolidés de la
# page de la société à la Bourse de Tunis (`scripts/perimetres_tunisair.py`). Le tableau ne donne que les droits de vote
# (colonne controle_pct ; interet_pct est vide), la méthode (intégration globale, proportionnelle ou mise en équivalence) et
# l'activité ; les noms de la plupart des sociétés y sont des logos, rangés par activité et relus sur l'image. Aucune ligne
# pour la société mère, ni pour Mauritania Airways (exclue du périmètre depuis 2011) ni pour AISA (exclue depuis 2018) : le
# rapport dit pourquoi. Pas d'états consolidés pour 2007 et 2008 sur la page de la Bourse.

format: long
cle_de_ligne: [groupe, exercice, entite]

colonnes:
  groupe: banque qui consolide
  exercice: exercice (31 décembre)
  source: clé de la notice du rapport lu
  entite: entité, telle que le rapport l'imprime
  methode: intégration globale, mise en équivalence, ou « mère » ; vide pour la STB, dont le tableau ne la donne pas
  controle_pct: pourcentage de contrôle (droits de vote) ; vide pour la BH, dont le rapport ne le donne pas
  interet_pct: pourcentage d'intérêt (part du capital, directe et indirecte)
  pays: pays de l'entité quand le rapport le donne

sources: [bvmt-ra-stb-2021, bvmt-ra-bh-2021, bvmt-ra-bna-2021, ra-stb-2011, ra-stb-2013, ra-stb-2014, ra-stb-2015, ra-stb-2017, ra-stb-2018, bvmt-ef-stb-2019-consolide, ra-bna-2007, ra-bna-2020, ra-bh-2017, ra-bh-2019, ra-bh-2021, ra-bh-2022, bvmt-ef-tunisair-2006-consolide, bvmt-ef-tunisair-2009-consolide, bvmt-ef-tunisair-2010-consolide, bvmt-ef-tunisair-2011-consolide, bvmt-ef-tunisair-2012-consolide, bvmt-ef-tunisair-2013-consolide, bvmt-ef-tunisair-2014-consolide, bvmt-ef-tunisair-2015-consolide, bvmt-ef-tunisair-2016-consolide, bvmt-ef-tunisair-2017-consolide, bvmt-ef-tunisair-2018-consolide, bvmt-ef-tunisair-2019-consolide, bvmt-ef-tunisair-2020-consolide, bvmt-ef-tunisair-2021-consolide, bvmt-ef-tunisair-2022-consolide]
