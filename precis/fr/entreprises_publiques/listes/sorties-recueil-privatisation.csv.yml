# Manifeste du relevé « sorties du tableau de tutelle rapprochées du Recueil des opérations
# depuis 1998 de la Direction générale de la privatisation ».
#
# Fichier lu par figures/listes.py (tableau des opérations de l'annexe). Il ne porte AUCUN
# CHIFFRE : il dit, pour une entreprise qui figure sur une liste du tableau de tutelle et plus
# sur la suivante, sous quel secteur et quel sigle le recueil la range. Années, modes et
# produits sont lus dans la série `privatisation-recueil-operations` de tunisia-data.
#
# UNE OPÉRATION N'EST PAS UNE SORTIE : le recueil ne dit ni la part de l'État après
# l'opération, ni la date à laquelle l'entreprise cesse d'être publique. `position` dit
# seulement où tombe la première année de cession : entre les deux listes, ou avant la
# première (l'entreprise figure encore sur la liste qui suit l'opération).
# RAPPROCHEMENT « nom seul » : le recueil imprime « Société Tunisienne de Motoculture » (sigle
# SONAM) pour la Société nationale de motoculture, et « Bâtiment » pour la Société le bâtiment.
# NON RETENU : « Parc La Soukra », concession de 2003 à la « Société Montazah Carthage » —
# rien ne le relie à la Société Soukra des loisirs, sortie entre 2002 et 2005.
# NOMS VOISINS ÉCARTÉS (seconde passe par mots-clés sur société, sigle, mode et acquéreur, pour
# les quinze sorties sans opération et les six noms absents du rapport pour 2021) : « Société
# Immobilière et Touristique de Tunisie » (SITT, 1999), rangée au tourisme, face à la Société
# immobilière de Tunisie ; « Société Immobilière de l'Union du Bâtiment » (SIUB, 2002) ;
# « Star Immobilière » (2002). Aucun texte ne les relie à une ligne du tableau de tutelle.
# ANNÉE ÉGALE À CELLE D'UN DÉCRET : Enfidha et Jebel Ouest (1998, décret du 25 mai 1998), Union
# internationale de banques et Publi-promotion (2002, décret du 7 octobre 2002). Le recueil ne
# donne que l'année ; `position` les range « entre les deux listes », bornes comprises.

format: large
cle_de_ligne: [rang]

colonnes:
  rang: rang de l'entreprise dans entreprises-publiques-listes.csv
  entreprise: nom retenu dans ce relevé
  liste_avant: dernière liste du tableau de tutelle où l'entreprise figure
  liste_apres: première liste où elle ne figure plus (2010 pour l'état de fin 2010)
  secteur_recueil: page du recueil (colonne secteur de la série)
  sigle_recueil: sigle imprimé au recueil (colonne sigle de la série)
  rapprochement: « nom et sigle » ou « nom seul »
  position: « entre les deux listes » ou « avant la première liste »

sources:
  - dgpv-recueil-operations
  - decret98-1172
  - decret2002-2200
  - decret2005-910
  - decret2007-2561
