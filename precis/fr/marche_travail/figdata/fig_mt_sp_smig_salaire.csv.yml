caveats: [SÉRIE CALCULÉE, LIVRÉE PAR SEGMENTS (colonne `segment`), SANS RACCORD NI CORRECTION : ne jamais tracer d'un trait continu ni comparer les niveaux de part et d'autre d'une rupture. DEUX MILLÉSIMES SUR 2002-2006, LES DEUX GARDÉS, une ligne par édition (2002 : 4 525 D et rapport de 1,89 dans l'édition 2006 ; 3 856 D et 1,61 dans l'édition 2018 ; 2006 : 4 926 et 4 954 D) ; l'écart n'est expliqué par aucune note de la source. RUPTURES : 1981, l'indemnité complémentaire provisoire entre dans le SMIG mais reste hors de l'assiette des cotisations (décret n° 81-437, art. 7), d'où un rapport abaissé par construction de 1981 à 1987 ; 1988, l'annuaire signale l'inclusion de l'ICP et de « MIT » (sigle non précisé par la source), salaire moyen + 34,9 % ; 2000 et 2001 masquées par le pli du scan de l'édition 2006, non reconstituées ; 2003, taxis et louages ; 1974, à l'intérieur du premier segment, le SMIG intègre l'indemnité de cherté de vie (décret n° 74-63), rapport de 2,06 en 1973 et de 1,54 en 1974. BIAIS DU DÉNOMINATEUR : tout salarié déclaré au moins une fois dans l'année est compté, le salaire mensuel et le rapport sont tirés vers le bas par les années incomplètes. Édition 2006 lue à l'image. SMIG : montants par date d'effet de la série `smig-smag` de ce dépôt (décrets tels que le précis socio-fiscal les réunit, non relus ici) ; avant 1974, conversion du minimum horaire ; indemnité de cherté de vie de 1971-1973 et indemnités spéciales de 1989 et de 1991 non comprises. S'ARRÊTE EN 2018 : aucun annuaire postérieur., Avant le 1er mai 1968, minimum de la première zone seulement. De 1971 à 1973, l'indemnité de cherté de vie de 0,020 D l'heure, servie en sus du minimum et hors assiette sociale, n'est pas comprise ; le SMIG l'intègre le 1er janvier 1974. Avant 1974, les montants mensuels sont la conversion du minimum horaire. Les indemnités spéciales de 1989 et de 1991 ne sont pas comprises.]
