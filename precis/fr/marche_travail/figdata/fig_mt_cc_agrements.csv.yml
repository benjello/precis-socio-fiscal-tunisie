caveats: [Borne basse : un décompte de textes, non de salariés. Un intitulé qui s'écarte de la formule usuelle n'est pas compté. De 1996 à 2012, l'édition française ne publie qu'un avis collectif par fascicule — « agréments d'avenants à quarante conventions collectives nationales » le 24 juillet 1996 —, et les avenants ne sont pas comptés un par un. En 2022, 4 intitulés pour 35 arrêtés dans l'édition française. Les deux décomptes des avenants ne s'additionnent pas. Une année à zéro n'établit pas qu'aucun avenant n'a paru.]
