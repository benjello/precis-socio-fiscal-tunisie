caveats: [Aucun raccord ni interpolation : une année sans grille établie n'a pas de ligne (textile, 1996-2010 ; bâtiment, 1991-1995, 1999-2010 et après le 1er mai 2019). Les grilles de 1990 à 1992 excluent l'indemnité complémentaire provisoire et n'ont pas de rapport au SMIG. La date d'effet des conventions de 1974 et de 1975 n'est pas établie : leur rapport retient le SMIG de 0,130 dinar. Salaires de base, hors indemnités conventionnelles. Deux branches seulement. Montants ou dates d'effet à confirmer : textile, 2011 et 2015 à 2020., Avant le 1er mai 1968, minimum de la première zone seulement. De 1971 à 1973, l'indemnité de cherté de vie de 0,020 D l'heure, servie en sus du minimum et hors assiette sociale, n'est pas comprise ; le SMIG l'intègre le 1er janvier 1974. Avant 1974, les montants mensuels sont la conversion du minimum horaire. Les indemnités spéciales de 1989 et de 1991 ne sont pas comprises.]
