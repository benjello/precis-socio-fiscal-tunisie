caveats: [Trois origines : l'édition française du Journal officiel (conventions d'origine, avenants de 1990, de 1994 pour le textile et de 1996 pour le bâtiment), son édition arabe ensuite, et, pour l'avenant n° 16 du bâtiment (grilles du 1er décembre 2021, du 1er janvier 2023 et du 1er janvier 2024), une reproduction par un site tiers des pages 3709 à 3714 de l'édition arabe du n° 132 du 2 décembre 2022. Aucun raccord ni interpolation : une ligne par date d'effet, la grille valant jusqu'à la suivante du même segment. Les grilles de 1990 à 1992 excluent l'indemnité complémentaire provisoire et n'ont pas de rapport au SMIG ; les grilles antérieures à 1990, celles de 1993 et celles du bâtiment de 1991 à 1995 ne sont pas établies. La date d'effet des conventions de 1974 et de 1975 n'est pas établie : leur rapport retient le SMIG de 0,130 dinar. Salaires de base, hors indemnités conventionnelles. Deux branches seulement. Montants ou dates d'effet à confirmer : textile, 2011 et 2015 à 2020 ; le haut de la grille manque à quelques dates., Avant le 1er mai 1968, minimum de la première zone seulement. De 1971 à 1973, l'indemnité de cherté de vie de 0,020 D l'heure, servie en sus du minimum et hors assiette sociale, n'est pas comprise ; le SMIG l'intègre le 1er janvier 1974. Avant 1974, les montants mensuels sont la conversion du minimum horaire. Les indemnités spéciales de 1989 et de 1991 ne sont pas comprises.]
