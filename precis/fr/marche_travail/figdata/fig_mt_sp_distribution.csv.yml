caveats: [DEUX MESURES, À NE PAS MÊLER (colonne `mesure`). « annuelle » : tous les salariés déclarés au titre de l'année ; la classe basse y est gonflée par les années incomplètes, et cette lecture NE MESURE PAS des salariés payés sous le SMIG (24,0 % sous 1 SMIG en 2018). « trimestre civil » : effectif déclaré à chaque trimestre de 2018 (9,5 % sous 1 SMIG au premier trimestre) ; le titre de la source dit « selon le nombre de trimestres déclarés », la lecture par trimestre civil est DÉDUITE de ce que les colonnes dépassent l'effectif annuel de la classe ; le quatrième trimestre porte vraisemblablement les primes de fin d'année (DÉDUIT de la masse salariale et des effectifs à 6 SMIG et plus). Une seule année trimestrielle : pas une série. FILTRER SUR `niveau` avant toute somme : les trois regroupements calculés s'ajoutent aux treize classes de la source, et le code `1-1.5` existe aux deux niveaux. NON PRÉCISÉ PAR LA SOURCE : SMIG de référence (40 ou 48 heures), calcul du salaire mensuel déclaré. La classe 1 à 1,5 SMIG ne permet pas d'isoler le salarié payé au SMIG. Les éditions 2010, 2013 et 2018 sont identiques sur leurs années communes (contrôle du script) : `serie_2000_2018 = oui` marque un parcours sans doublon (édition 2013 pour 2000-2004, édition 2018 ensuite), sans raccord de valeurs. NE PAS MÊLER à l'édition 2006 (`cnss-annuaire-2006-pyramide-smig-brut`), autre univers. La pyramide en dinars de l'édition 2018 (PDF 24) imprime 1 149 959 salariés en 2012, celle en SMIG 1 149 956. Parts calculées, sans arrondi ; les parts imprimées (2013, 2018) sont gardées à côté.]
