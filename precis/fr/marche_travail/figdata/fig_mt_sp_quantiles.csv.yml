caveats: [SÉRIE DÉRIVÉE, NON PUBLIÉE PAR LA SOURCE. Interpolation linéaire dans la classe (répartition uniforme supposée) ; erreur bornée par `largeur_D` (20 à 40 D dans l'édition 2013, 50 D ensuite). VIDE quand le quantile tombe dans une classe ouverte : neuvième décile de 2014 à 2018, premier décile annuel de 2017 et 2018. LES COLONNES N'ONT PAS TOUTES LA MÊME DÉFINITION DU SALAIRE MENSUEL (`definition_deduite`, `coherent_avec_pyramide_smig`) : une tendance ne se lit qu'à définition et grille égales — 2000-2009 puis 2011-2013 (édition 2013) ; 2010-2016 (éditions 2016 à 2018) ; trimestres de 2017 et 2018. BIAIS DES ANNÉES INCOMPLÈTES dans la mesure annuelle ÷ 12 : en 2013, médiane de 468,1 D pour l'ensemble, 590,2 D pour les déclarés quatre trimestres. Dinars courants : aucune déflation ici., UNE SEULE ANNÉE. Seule édition où les colonnes sont le NOMBRE DE TRIMESTRES DÉCLARÉS (partition : 123 341 + 110 687 + 124 069 + 800 558 = 1 158 655) ; les tableaux de même titre des éditions 2016 à 2018 sont par trimestre civil. Déclarés quatre trimestres : 800 558 salariés, 8 834 648 773 D. LE SALAIRE MOYEN PAR NOMBRE DE TRIMESTRES N'EST PAS IMPRIMÉ : `salaire_annuel_moyen_calcule_D` est masse ÷ effectif (11 035,61 D pour quatre trimestres). DÉFAUT DE LA SOURCE AU PDF 36 (classes en SMIG), gardé : aucune ligne ne se somme à sa colonne TOTAL (1,5 à 2 SMIG : −94 185 ; 2 à 2,5 : +94 084), alors que les colonnes et les masses bouclent ; n'utiliser ces deux lignes qu'avec cette réserve. Le PDF 35 (dinars) boucle en lignes et en colonnes. Salaire mensuel = masse annuelle ÷ 12, vérifié dans les 285 cellules du PDF 35 : non écrit par la source., DEUX INDICES RACCORDÉS EN 1970 : l'indice du coût de la vie en base 100 en 1962 (131,6 en 1970) est ramené à la base 1970. Les valeurs 1962-1975 sont RELEVÉES À LA MAIN dans les rapports de la BCT, dont la couche texte est une océrisation abîmée (« 12S,O » pour 125,0) ; chacune est recoupée par la variation énoncée en prose, et la source de chaque valeur est dans la colonne `source`. L'annuaire 1995-2001 imprime 108,2 pour 1985 au lieu de 288,0 : ligne écartée, valeur prise dans l'annuaire 1998-2002. Le plus récent annuaire fait foi (2001 : 640,5 au lieu de 645,4 provisoire). Au-delà de 2003, employer `bct-ipc-base2015`., EXTRAIT DU RAPPORT ANNUEL, ET NON DU BULLETIN : l'intitulé du BSF (« base 100 en 2010 ») est périmé et ses valeurs récentes sont en base 2015 — voir docs/tables-a-extraire-pdf.md §1. L'ANNÉE DE BASE 2015 = 100 EST POSÉE PAR DÉFINITION, non lue : aucun rapport ne tabule son année de base, tous ne publiant que les millésimes récents. Série RECONSTITUÉE en recollant six rapports, chacun n'en publiant que trois millésimes ; toutes les années communes concordent, et le script LÈVE en cas de divergence — un indice de prix ne se révise pas d'une publication à l'autre, contrairement aux effectifs. S'ARRÊTE EN 2024 : aucune déflation n'est possible au-delà, ce qui laisse sans équivalent réel les tranches d'augmentation programmées jusqu'en 2028. Déflater une date en cours d'année par l'indice ANNUEL MOYEN est une approximation.]
