caveats: [Avant le 1er mai 1968, minimum de la première zone seulement. De 1971 à 1973, les montants comprennent l'indemnité de cherté de vie de 0,020 D l'heure, servie hors assiette sociale et intégrée au SMIG le 1er janvier 1974. Avant 1974, les montants mensuels sont la conversion du minimum horaire. Les indemnités spéciales de 1989 et de 1991 ne sont pas comprises. Le SMAG de 1969 et de 1977 est daté du 1er novembre 1969 et du 1er mai 1977, quand les textes fixent le 1er octobre 1969 et le 1er février 1977., DEUX INDICES RACCORDÉS EN 1970 : l'indice du coût de la vie en base 100 en 1962 (131,6 en 1970) est ramené à la base 1970. Les valeurs 1962-1975 sont RELEVÉES À LA MAIN dans les rapports de la BCT, dont la couche texte est une océrisation abîmée (« 12S,O » pour 125,0) ; chacune est recoupée par la variation énoncée en prose, et la source de chaque valeur est dans la colonne `source`. L'annuaire 1995-2001 imprime 108,2 pour 1985 au lieu de 288,0 : ligne écartée, valeur prise dans l'annuaire 1998-2002. Le plus récent annuaire fait foi (2001 : 640,5 au lieu de 645,4 provisoire). Au-delà de 2003, employer `bct-ipc-base2015`.]
