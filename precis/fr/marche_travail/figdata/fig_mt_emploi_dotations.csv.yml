caveats: [Série reconstituée : chaque édition du Rapport annuel n'imprime que deux à cinq années ; la série réunit 21 éditions, et la dernière édition qui imprime une année fait foi, ligne par ligne. La Banque centrale relaie des chiffres qu'elle ne produit pas : elle cite la direction générale des ressources humaines du ministère du Plan (1988-1991), le ministère du Plan et du Développement régional (1992-1993), le ministère du Développement économique (1994-1995), ce ministère et le Commissariat général au développement régional (1996-2001), puis les ministères du Développement et de la coopération internationale et de l'Emploi (2002-2008). Dotations, non dépenses constatées : le tableau ne qualifie pas la grandeur ; le texte des rapports parle de « dotation budgétaire », d'« enveloppe » ou de « montant alloué ». Le total comprend des programmes de développement régional, rural et urbain et des fonds d'aide à l'artisanat : il n'est pas la somme des programmes tracés. Trois présentations du tableau se succèdent (éditions 1988-1990, 1991-1994, 1995-2008), dont les totaux ne couvrent pas le même périmètre (1987 : 83,8 dans la première, 50,8 dans la deuxième) ; le total de 1992 et de 1993 vient de l'édition 1994, les lignes de ces deux années des éditions 1995 et 1996. Révisions : chantiers nationaux de 1992 imprimés 23,9, puis 35,1, puis 37,6 ; chantiers régionaux de 2003, 29,6 (édition 2003) puis 92,0 (éditions 2004 à 2006), sans explication de la source ; Fonds 21-21 de 2000, 60,0 puis 58,4.]
