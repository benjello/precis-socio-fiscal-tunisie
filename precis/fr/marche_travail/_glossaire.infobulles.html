 "gratification-fin-service": {
  "autre": "مكافأة نهاية الخدمة",
  "definition": "Somme due par l'employeur au travailleur lié par un contrat à durée indéterminée et licencié après la période d'essai, sauf faute grave. Depuis le 1er mai 1966, elle est d'un jour de salaire par mois de service effectif dans l'entreprise, plafonnée à trois mois de salaire sauf disposition plus favorable ; depuis le 1er mars 1994, elle se calcule sur le salaire perçu au moment du licenciement, avantages compris hors remboursements de frais (art. 22). Elle s'ajoute à l'indemnité de préavis et aux dommages-intérêts pour rupture abusive (art. 23). Elle s'appelait « indemnité de licenciement » jusqu'à la loi n° 94-29, qui l'a renommée (art. 2).",
  "source": "Loi n° 94-29 du 21 février 1994, art. 1er (art. 22 du code du travail) et art. 2",
  "terme": "Gratification de fin de service"
 },
 "grille-de-salaires-conventionnelle": {
  "autre": "جدول الأجور",
  "definition": "Tableau annexé à une convention collective de branche ou à l'un de ses avenants, qui donne le salaire de base de chaque catégorie professionnelle et, quand la grille en comporte, de chaque échelon. La convention collective cadre de 1973 renvoie les grilles de salaires et les indemnités aux conventions de branche (art. 1 et 50). Une convention peut porter plusieurs grilles : celle du textile de 1974 porte une grille des agents payés à l'heure, par catégorie et par échelon ; celle du bâtiment et des travaux publics de 1975 donne au personnel occasionnel un salaire horaire par catégorie, sans échelon.",
  "source": "Arrêté du 29 mai 1973 (convention collective-cadre), art. 1 et 50",
  "terme": "Grille de salaires conventionnelle"
 },
 "heures-supplementaires": {
  "autre": "الساعات الإضافية",
  "definition": "Heures de travail effectuées au-delà de la durée normale du régime applicable. Depuis 1996, elles sont majorées de 75 % du salaire de base horaire dans le régime de 48 heures ; dans un régime inférieur, de 25 % jusqu'à 48 heures et de 50 % au-delà ; pour le salarié à temps partiel, de 50 % (code du travail, art. 90, rédaction de la loi n° 96-62).",
  "source": "Loi n° 96-62 du 15 juillet 1996, art. 90",
  "terme": "Heures supplémentaires"
 },
 "indemnite-cherte-de-vie": {
  "autre": "منحة لغلو المعاش",
  "definition": "Indemnité instituée le 1er mai 1971 par le décret n° 71-164 dans l'industrie, le commerce et les professions libérales : 0,020 dinar l'heure, soit 4 dinars par mois pour les salariés payés au mois, en sus du salaire minimum. Elle n'entre ni dans l'assiette des cotisations ni dans le calcul des prestations sociales. Le SMIG fixé au 1er janvier 1974 par le décret n° 74-63 l'intègre.",
  "source": "Décret n° 71-164 du 3 mai 1971, art. 2 et 5",
  "terme": "Indemnité de cherté de vie"
 },
 "indemnite-compensatrice-conge": {
  "autre": "منحة التعويض عن الرخصة",
  "definition": "Somme versée au salarié dont le contrat prend fin avant qu'il ait pris tout son congé annuel payé, pour la fraction de congé non prise. Elle n'est pas due en cas de faute lourde du salarié (code du travail, art. 120).",
  "source": "Loi n° 66-27 du 30 avril 1966, art. 120",
  "terme": "Indemnité compensatrice de congé payé"
 },
 "indemnite-complementaire-provisoire": {
  "acronyme": "ICP",
  "autre": "المنحة الإضافية المؤقتة",
  "definition": "Indemnité instituée le 1er avril 1981 par le décret n° 81-437, servie en sus du salaire de base des salariés des secteurs non agricoles régis par le code du travail, et majorée au 1er février 1982 par le décret n° 82-501. Depuis 1981, elle est une composante du SMIG : les décrets qui le fixent, ainsi en 1992 et en 2000, le décomposent en salaire de base et indemnité complémentaire provisoire, et celui de 2026 précise encore qu'il la comprend.",
  "source": "Décret n° 81-437 du 7 avril 1981, art. 3",
  "terme": "Indemnité complémentaire provisoire"
 },
 "indemnite-de-stage": {
  "autre": "منحة التربص",
  "definition": "Somme que l'État verse chaque mois, par l'intermédiaire de l'agence chargée de l'emploi, au bénéficiaire d'un stage ou d'un contrat d'insertion, pendant toute sa durée. Elle se distingue de l'indemnité complémentaire que l'entreprise d'accueil doit verser de son côté. Son montant, fixé par programme, est modifié par les décrets successifs.",
  "source": "Décret n° 2009-349 du 9 février 2009, fixant les programmes du fonds national de l'emploi, les conditions et les modalités de leur bénéfice, art. 8 et 45",
  "terme": "Indemnité de stage"
 },
 "indemnite-perte-emploi": {
  "autre": "الحماية الاجتماعية للعمال الذين يفقدون شغلهم لأسباب اقتصادية أو فنية",
  "definition": "Mécanisme de la loi n° 96-101 qui garantit, en cas de cessation de paiement de l'entreprise, les indemnités de licenciement et les droits légaux des travailleurs ayant perdu leur emploi pour des raisons économiques ou technologiques. Il maintient temporairement les prestations familiales et le droit aux soins, sans créer de revenu de remplacement.",
  "source": "Loi n° 96-101 du 18 novembre 1996, art. 2-9",
  "terme": "Protection contre la perte d'emploi"
 },
 "jours-feries-chomes-payes": {
  "autre": "أيام الأعياد التي يبطل فيها العمل مع خلاص الأجر",
  "definition": "Jours pendant lesquels le travail est suspendu sans perte de salaire. Le code du travail en donne la liste (art. 445) : six jours depuis 1991, liste dans sa rédaction du décret-loi n° 2021-11, en vigueur depuis le 15 décembre 2021. La convention collective cadre en ajoute pour les activités non agricoles. Le salarié qui travaille un jour férié dans une activité continue reçoit, en plus de son salaire, une indemnité égale à celui-ci (art. 109).",
  "source": "Loi n° 66-27 du 30 avril 1966, art. 445",
  "terme": "Jours fériés chômés et payés"
 },
 "licenciement-abusif": {
  "autre": "الطرد التعسفي",
  "definition": "Licenciement intervenu sans cause réelle et sérieuse ou sans respect des procédures légales, réglementaires ou conventionnelles (art. 14 ter, depuis le 1er mars 1994), ou licenciement pour raisons économiques sans l'avis préalable de la commission de contrôle du licenciement, sauf force majeure ou accord des parties (art. 21-12, depuis le 31 juillet 1996). Il ouvre droit à des dommages-intérêts, distincts de l'indemnité de préavis et de la gratification de fin de service (art. 23) : depuis le 1er mars 1994, d'un à deux mois de salaire par année d'ancienneté, dans la limite de trois années de salaire, ou d'un à quatre mois de salaire quand la cause est réelle et sérieuse mais la procédure non respectée (art. 23 bis). La rupture abusive par l'une ou l'autre partie relève de l'article 23.",
  "source": "Loi n° 94-29 du 21 février 1994, art. 1er (art. 14 ter, 23 et 23 bis du code du travail)",
  "terme": "Licenciement abusif"
 },
 "licenciement-economique": {
  "autre": "الطرد أو الإيقاف عن العمل لأسباب اقتصادية أو فنية",
  "definition": "Licenciement ou mise en chômage de tout ou partie du personnel permanent pour des raisons économiques ou technologiques. Depuis le 31 juillet 1996, l'employeur le notifie au préalable à l'inspection du travail, qui enquête et tente la conciliation dans les quinze jours ; à défaut de conciliation, le dossier est soumis à la commission régionale ou centrale de contrôle du licenciement (art. 21 à 21-3). Les travailleurs licenciés ont une priorité de réembauchage pendant un an (art. 21-13).",
  "source": "Loi n° 96-62 du 15 juillet 1996, art. 1er (art. 21 à 21-3 du code du travail)",
  "terme": "Licenciement ou mise en chômage pour raisons économiques ou technologiques"
 },
 "micro-entreprise": {
  "autre": "مؤسسة صغرى",
  "definition": "Dans les enquêtes de l'INS, entreprise non agricole employant moins de six salariés. Les rapports des enquêtes de 2007, 2012 et 2016 portent sur celles qui ne tiennent pas de comptabilité ; en 2016, le champ est en outre limité aux entreprises dont le chiffre d'affaires est inférieur à un million de dinars. Les entreprises de six salariés et plus relèvent d'une autre enquête de l'INS, l'enquête « Emploi et salaires ».",
  "source": "INS, enquête sur les micro-entreprises 2016, p. 9-10",
  "terme": "Micro-entreprise"
 },
 "ouvriers-de-chantiers": {
  "autre": "عملة الحضائر",
  "definition": "Travailleurs employés sur les chantiers régionaux et les chantiers agricoles que l'État finance au titre du soutien à l'emploi. Le décret gouvernemental n° 2021-436 du 17 juin 2021 met fin à ce mécanisme : ceux qui étaient en exercice continu au 20 octobre 2020 sont, selon leur âge, intégrés dans la fonction publique, maintenus en activité jusqu'à 60 ans ou sortis du mécanisme avec une allocation.",
  "terme": "Ouvriers de chantiers"
 },
 "periode-essai": {
  "autre": "فترة التجربة",
  "definition": "Période, au début d'un contrat de travail, pendant laquelle chaque partie peut y mettre fin ; la gratification de fin de service n'est due qu'au salarié licencié après son expiration (art. 22 du code du travail). Depuis le 24 mai 2025, elle dure six mois au plus, renouvelable une fois pour la même durée ; la partie qui y met fin en informe l'autre, par un moyen laissant une trace écrite, quinze jours avant son expiration ; elle est interdite dans un contrat à durée déterminée (art. 6-3 et 6-4).",
  "source": "Loi n° 2025-9 du 21 mai 2025, art. 1er (art. 6-3 nouveau du code du travail)",
  "terme": "Période d'essai"
 },
 "politique-active-emploi": {
  "autre": "السياسة النشيطة للتشغيل",
  "definition": "Ensemble des programmes par lesquels l'État finance l'insertion des demandeurs d'emploi : stages et contrats dont il verse l'indemnité, prise en charge de cotisations ou d'une part du salaire, appui à la création d'entreprise, chantiers. Le terme est celui des rapports de suivi et des études ; les textes ne l'emploient qu'à propos de l'évaluation des interventions du Fonds national de l'emploi.",
  "terme": "Politique active de l'emploi"
 },
 "preavis": {
  "autre": "أجل الإعلام",
  "definition": "Délai entre la notification de la rupture d'un contrat à durée indéterminée et la rupture elle-même ; le contrat prend fin à son expiration. Depuis le 1er mars 1994, il est d'un mois et notifié par lettre recommandée à l'autre partie, sauf disposition plus avantageuse pour le travailleur (accord, convention collective, usage) ; le travailleur peut s'absenter pendant toute la seconde moitié du délai pour chercher un emploi, sans perte de salaire, et l'employeur indique dans la lettre de préavis les causes du licenciement (art. 14, 14 bis et 14 ter). Son inobservation ouvre droit à une indemnité, distincte des dommages-intérêts pour rupture abusive (art. 23).",
  "source": "Loi n° 94-29 du 21 février 1994, art. 1er (art. 14, 14 bis et 14 ter du code du travail)",
  "terme": "Préavis"
 },
 "priorite-reembauchage": {
  "autre": "حق الأولوية في التشغيل",
  "definition": "Droit du travailleur dont l'emploi a été supprimé pour des raisons économiques d'être réembauché en priorité, aux mêmes conditions de rémunération, si l'entreprise recrute dans sa catégorie professionnelle. Le droit dure un an à compter du licenciement ; les travailleurs sont réembauchés selon leur ancienneté, majorée d'un an par enfant de moins de seize ans, et l'employeur en informe par écrit l'inspection du travail (art. 21-13, depuis le 31 juillet 1996 ; art. 9 du code de 1966 auparavant).",
  "source": "Loi n° 96-62 du 15 juillet 1996, art. 1er (art. 21-13 du code du travail)",
  "terme": "Priorité de réembauchage"
 },
 "prise-en-charge-contribution-patronale": {
  "autre": "تكفل الصندوق الوطني للتشغيل بمساهمة الأعراف في النظام القانوني للضمان الاجتماعي",
  "definition": "Avantage accordé à l'entreprise qui recrute : la part patronale des cotisations de sécurité sociale sur le salaire du nouveau recruté est payée à sa place, pendant une durée limitée, par l'État puis par le Fonds national de l'emploi. La mesure naît en novembre 1997 (loi n° 97-79) : l'État la prend à sa charge pendant cinq ans pour le recrutement de diplômés du supérieur. La loi de finances pour 2005 la porte à sept ans, à taux dégressif, pour les recrutements de 2005 à 2009 ; une prise en charge d'une part du salaire existe à côté d'elle depuis 2004. Le décret n° 2009-349 applique le même barème, à la charge du Fonds, aux recrutements issus d'un contrat d'insertion des diplômés. Le Fonds reprend la mesure en janvier 2010, et son terme est fixé au 31 décembre 2014. Les programmes de 2017 et de 2019 comportent une prise en charge limitée à deux ans.",
  "source": "Décret n° 2009-349 du 9 février 2009, fixant les programmes du fonds national de l'emploi, les conditions et les modalités de leur bénéfice, art. 15",
  "terme": "Prise en charge par le Fonds national de l'emploi de la contribution patronale au régime légal de sécurité sociale"
 },
 "programme-amal": {
  "autre": "برنامج البحث النشيط عن شغل",
  "definition": "Programme institué par le décret n° 2011-621 du 23 mai 2011 et connu sous le nom d'usage « AMAL » : une indemnité mensuelle servie pendant un an au plus aux demandeurs d'emploi, plus élevée pour les diplômés du supérieur. Il est abrogé à compter du 1er janvier 2012 et remplacé par un programme d'encouragement à l'emploi (décret n° 2012-953).",
  "source": "Décret n° 2011-621 du 23 mai 2011, modifiant et complétant le décret n° 2009-349 du 9 février 2009, art. 40 sexies-40 octies",
  "terme": "Programme de recherche active d'emploi"
 },
 "programme-appui-promoteurs": {
  "acronyme": "PAPPE",
  "autre": "برنامج مرافقة باعثي المؤسسات الصغرى",
  "definition": "Programme du Fonds national de l'emploi créé par le décret n° 2009-349 pour ceux qui créent une petite entreprise : sessions de formation, assistance technique et, pendant la première phase d'implantation du projet, une indemnité mensuelle. En octobre 2012, le « programme d'appui aux promoteurs des petites entreprises » le remplace, nom que garde le décret gouvernemental n° 2019-542 ; en juin 2023, le décret n° 2023-461 l'étend aux entreprises de l'économie sociale et solidaire et aux sociétés communautaires.",
  "source": "Décret n° 2009-349 du 9 février 2009, fixant les programmes du fonds national de l'emploi, les conditions et les modalités de leur bénéfice, art. 1er et 34",
  "terme": "Programme d'accompagnement des promoteurs des petites entreprises"
 },
 "programme-forsati": {
  "autre": "برنامج \"فرصتي\"",
  "definition": "Programme du Fonds national de l'emploi créé par le décret gouvernemental n° 2016-904 : un accompagnement individuel du demandeur d'emploi vers un projet professionnel, de douze mois prorogeables de six, assorti d'une indemnité mensuelle. Le décret gouvernemental n° 2019-542 le reprend.",
  "source": "Décret gouvernemental n° 2016-904 du 27 juillet 2016, complétant le décret n° 2012-2369 du 16 octobre 2012, art. 23 bis-23 octies",
  "terme": "Programme « FORSATI »"
 },
 "regime-horaire": {
  "autre": "نظام عمل كامل الوقت",
  "definition": "Durée hebdomadaire normale applicable dans une entreprise ou une branche, qui sert de seuil aux heures supplémentaires : régime de 48 heures par semaine, fixé par le code, ou régime réduit, de 40 heures au moins, fixé par convention collective ou par texte réglementaire (code du travail, art. 79 et 90, rédaction de la loi n° 96-62). La majoration des heures supplémentaires et le montant du salaire minimum dépendent du régime.",
  "source": "Loi n° 96-62 du 15 juillet 1996, art. 90",
  "terme": "Régime de travail à plein temps"
 },
 "repos-hebdomadaire": {
  "autre": "الراحة الأسبوعية",
  "definition": "Repos de 24 heures consécutives auquel le salarié a droit chaque semaine, le vendredi, le samedi ou le dimanche (code du travail, art. 95). Depuis 1996, un autre jour peut être fixé par accord ou par autorisation du gouverneur (art. 95, rédaction de la loi n° 96-62).",
  "source": "Loi n° 66-27 du 30 avril 1966, art. 95",
  "terme": "Repos hebdomadaire"
 },
 "rsna": {
  "acronyme": "RSNA",
  "autre": "نظام الأجراء غير الفلاحيين",
  "definition": "Régime de sécurité sociale des salariés du secteur privé non agricole, institué par la loi n° 60-30 du 14 décembre 1960 et géré par la CNSS. L'article 34 de cette loi en fixe le champ par énumération : salariés des établissements industriels et commerciaux, des professions libérales, des coopératives, des sociétés civiles, des syndicats et des associations, personnels des transports, salariés du commerce et du bâtiment. Sa branche des pensions de vieillesse, d'invalidité et de survivants est régie par le décret n° 74-499 du 27 avril 1974, en vigueur au 1er janvier 1974, auquel renvoient les régimes des travailleurs non salariés et des Tunisiens à l'étranger.",
  "source": "Loi n° 60-30 du 14 décembre 1960",
  "terme": "Régime des salariés non agricoles"
 },
 "salaire-brut": {
  "autre": "الأجر الخام",
  "definition": "Rémunération due au travailleur avant toute retenue : salaire de base et accessoires, indemnités et avantages en espèces ou en nature, à l'exception des remboursements de frais (code du travail, art. 134-2). Le bulletin de paie en indique le montant, puis la nature et le montant des retenues opérées sur lui (art. 143). La statistique internationale retient la même notion : la rémunération totale avant les retenues de l'employeur au titre des impôts et des cotisations du salarié.",
  "source": "Loi n° 96-62 du 15 juillet 1996, art. 134-2 et 143",
  "terme": "Salaire brut"
 },
 "salaire-conventionnel": {
  "autre": "الأجر التعاقدي",
  "definition": "Salaire fixé, par catégorie professionnelle, par une convention collective ou par ses avenants. Depuis le décret n° 73-247 du 26 mai 1973, les conventions collectives peuvent fixer les salaires, leurs accessoires et les classifications, sur la base d'un salaire minimum interprofessionnel garanti fixé par décret.",
  "source": "Décret n° 73-247 du 26 mai 1973, art. 1 et 2",
  "terme": "Salaire conventionnel"
 },
 "salaire-d-entree-conventionnel": {
  "autre": "أدنى أجر في جدول الأجور",
  "definition": "Salaire de base de la catégorie et de l'échelon les plus bas d'une grille de salaires conventionnelle, hors indemnités ; c'est le bas de la grille, que l'on rapporte au SMIG horaire du régime de 48 heures pour mesurer ce qu'une convention ajoute au salaire minimum. Dans le textile, c'est le salaire horaire de l'agent payé à l'heure de la catégorie I, à l'échelon de confirmation, connu de 1974 à 2026 et sans interruption de 1994 à 2026 ; dans le bâtiment et les travaux publics, celui du manœuvre ordinaire, dans la grille du personnel occasionnel, connu de 1974 à 2024 et sans interruption de 1996 à 2024.",
  "terme": "Salaire d'entrée d'une grille conventionnelle"
 },
 "salaire-de-base-conventionnel": {
  "autre": "الأجر الأساسي",
  "definition": "Montant qu'une grille de salaires conventionnelle inscrit pour une catégorie et un échelon, hors les indemnités de la convention — de transport et de présence notamment —, qui s'y ajoutent. Dans le textile, l'indemnité complémentaire provisoire est intégrée aux salaires de base à compter du 1er mai 1994 (avenant n° 5). Le décret n° 2026-68 du 30 avril 2026 applique une hausse de 5 % par an, en 2026, 2027 et 2028, aux salaires de base de tous les échelons des dernières grilles annexées aux conventions sectorielles, ainsi qu'aux indemnités de transport et de présence.",
  "source": "Décret n° 2026-68 du 30 avril 2026, art. 1",
  "terme": "Salaire de base (grilles conventionnelles)"
 },
 "salaire-declare": {
  "autre": "الأجر المصرّح به",
  "definition": "Salaire qu'un employeur déclare à la CNSS pour un salarié, et sur lequel les cotisations sont calculées. Dans le régime des salariés non agricoles, cette assiette comprend, depuis la loi n° 95-101 (article 42 nouveau de la loi n° 60-30), l'ensemble des éléments du salaire, primes et avantages compris, sans plafond. Les annuaires statistiques de la CNSS, qui publient la masse et la distribution des salaires déclarés de 1970 à 2018, ne définissent pas le terme et ne le disent ni brut ni net. L'indemnité complémentaire provisoire, entrée dans le SMIG en 1981, reste alors hors de l'assiette des cotisations ; l'annuaire la compte dans les salaires déclarés à partir de 1988.",
  "terme": "Salaire déclaré"
 },
 "salaire-minimum-garanti": {
  "autre": "الأجر الأدنى المضمون",
  "definition": "Seuil au-dessous duquel il n'est pas possible de rémunérer un travailleur chargé de travaux ne nécessitant pas de qualification professionnelle (code du travail, art. 134-2, issu de la loi n° 96-62). Il est fixé par décret, sous deux formes : le salaire minimum interprofessionnel garanti (SMIG) pour les secteurs non agricoles et le salaire minimum agricole garanti (SMAG).",
  "source": "Loi n° 96-62 du 15 juillet 1996, art. 134-2",
  "terme": "Salaire minimum garanti"
 },
 "salaire-moyen-declare": {
  "autre": "معدّل الأجر السنوي المصرّح به",
  "definition": "Quotient que l'annuaire statistique de la CNSS imprime pour le régime des salariés non agricoles : la masse des salaires déclarés de l'année divisée par le nombre de salariés déclarés au moins une fois dans l'année, en dinars par an. Les années incomplètes l'abaissent : en 2013, il est de 8 495 dinars pour l'ensemble des salariés déclarés et de 11 036 dinars pour ceux qui le sont les quatre trimestres. Les annuaires le donnent de 1970 à 2018, dans deux éditions qui ne se raccordent pas : celle de 2006 pour 1970-1999 et 2002-2006, celle de 2018 pour 2000-2018. Il ne se confond pas avec le taux d'évolution du salaire moyen que l'INS tire des mêmes déclarations de 2001 à 2025 : ce taux suit des salariés déclarés cinq trimestres de suite et ne donne aucun niveau.",
  "source": "CNSS, annuaire statistique 2018, p. 16",
  "terme": "Salaire moyen déclaré"
 },
 "salaire-net": {
  "autre": "الأجر الصافي",
  "definition": "Rémunération effectivement perçue par le travailleur, une fois opérées sur la rémunération brute les retenues — cotisations sociales du salarié, impôt retenu à la source. Le bulletin de paie en porte le montant (code du travail, art. 143).",
  "source": "Loi n° 96-62 du 15 juillet 1996, art. 143",
  "terme": "Salaire net"
 },
 "salarie-permanent": {
  "autre": "أجير قارّ",
  "definition": "Terme que deux sources de l'INS emploient en deux sens. Pour le taux d'évolution trimestriel des salaires du secteur privé non agricole, c'est le salarié déclaré à la CNSS de manière continue au cours des cinq derniers trimestres : ces salariés forment l'échantillon fixe sur lequel le taux est calculé, selon le guide méthodologique que l'INS publie en 2026. Dans l'enquête « Emploi et salaires » auprès des entreprises de six salariés et plus, dont le rapport de 2012 donne la définition, c'est le salarié qui fait partie intégrante de l'entreprise, par opposition à l'occasionnel, recruté à titre temporaire pour renforcer l'effectif ; la distinction ne repose pas sur le type de contrat. Les rapports de l'enquête sur les micro-entreprises (2012, 2016) ne définissent pas le terme : ils opposent les personnes employées de façon permanente dans l'entreprise à l'emploi occasionnel.",
  "source": "INS, Guide méthodologique du taux d'évolution trimestriel des salaires (2026), § 3",
  "terme": "Salarié permanent"
 },
 "sivp": {
  "acronyme": "SIVP",
  "autre": "تربص الإعداد للحياة المهنية",
  "definition": "Stage en entreprise ou dans le secteur public pendant lequel l'État verse au stagiaire une indemnité mensuelle. Institué pour les diplômés du supérieur par le décret n° 87-1190 du 26 août 1987, il est étendu en 1988 aux diplômés du second cycle secondaire, puis réservé de nouveau aux diplômés du supérieur par le décret n° 2009-349, qui en fait un programme du Fonds national de l'emploi ; le stage du niveau secondaire cesse alors. En juillet 2019, le décret gouvernemental n° 2019-542 en fait un contrat, ouvert aussi à ceux qui ne sont pas diplômés du supérieur : le contrat d'initiation à la vie professionnelle.",
  "source": "Décret n° 87-1190 du 26 août 1987, portant organisation d'un système de stages d'initiation à la vie professionnelle pour les diplômés du supérieur, art. 1",
  "terme": "Stage d'initiation à la vie professionnelle"
 },
 "smag": {
  "acronyme": "SMAG",
  "autre": "الأجر الأدنى الفلاحي المضمون",
  "definition": "Salaire minimum légal applicable aux salariés du secteur agricole, exprimé par journée de travail. Il sert de référence aux régimes agricoles de sécurité sociale : le salaire de référence du régime des salariés agricoles en est un multiple (loi n° 81-6, art. 18 et 50), et la pension minimale, la limite de calcul et la revalorisation du régime agricole amélioré s'expriment par rapport à lui.",
  "source": "Loi n° 81-6 du 12 février 1981, art. 18 et 50",
  "terme": "Salaire minimum agricole garanti"
 },
 "smig": {
  "acronyme": "SMIG",
  "autre": "الأجر الأدنى المضمون لمختلف المهن",
  "definition": "Rémunération horaire ou mensuelle minimale légale applicable aux salariés des secteurs non agricoles régis par le code du travail. L'État le fixe par décret depuis le 1er janvier 1974. Il est fixé à l'heure et au mois, pour deux régimes de durée du travail : 48 heures et 40 heures par semaine.",
  "source": "Décret gouvernemental n° 2017-668 du 5 juin 2017",
  "terme": "Salaire minimum interprofessionnel garanti"
 },
 "smig-reference-cnss": {
  "autre": "الأجر الأدنى المرجعي المعتمد لدى الصندوق الوطني للضمان الاجتماعي",
  "definition": "Montant que l'annuaire statistique de la CNSS imprime sous sa pyramide des salaires déclarés en dinars, et qui sert d'unité à sa pyramide exprimée en SMIG, de 2000 à 2018. Il vaut 200 heures au taux horaire du SMIG du régime de 48 heures — 290,200 dinars en 2013 —, ce que l'annuaire n'écrit pas et que les montants établissent. Il est inférieur au SMIG mensuel de ce régime, qui compte 208 heures, soit 301,808 dinars en 2013 : un salaire déclaré inférieur à un SMIG de référence n'est pas pour autant inférieur au salaire minimum légal.",
  "source": "CNSS, annuaire statistique 2018, p. 24-27",
  "terme": "SMIG de référence de la CNSS"
 },
 "sous-traitance-main-oeuvre": {
  "autre": "مناولة اليد العاملة",
  "definition": "Tout contrat ou accord entre une entreprise de location de main-d'œuvre et une entreprise bénéficiaire, par lequel la main-d'œuvre est louée et mise à la disposition de l'entreprise bénéficiaire par l'entreprise de location ; les activités de gardiennage et de nettoyage en relèvent. Elle est interdite depuis le 24 mai 2025 (art. 28 du code du travail).",
  "source": "Loi n° 2025-9 du 21 mai 2025, art. 2 (art. 28 nouveau du code du travail)",
  "terme": "Sous-traitance de main-d'œuvre"
 },
 "taux-de-couverture-negociation-collective": {
  "autre": "نسبة تغطية المفاوضة الجماعية",
  "definition": "Part des salariés que couvre une convention collective, en pourcentage du nombre de salariés. L'Organisation internationale du travail la publie pour la Tunisie dans sa base ILOSTAT, de 2010 à 2019, sans l'année 2015, sous l'intitulé « Collective bargaining coverage rate (%) » ; elle déclare pour source des fichiers administratifs, sans en préciser le producteur national ni la méthode, et ne publie ni le numérateur ni le dénominateur. Le taux porte sur les salariés pris ensemble : il ne mesure pas la part des salariés du secteur privé qu'une convention sectorielle couvre.",

 "tfp": {

  "autre": "الأداء على التكوين المهني",
  "definition": "Prélèvement à la charge de l'employeur, institué en 1956, assis depuis 1989 sur les salaires et rétributions versés, au taux de 1 % dans les industries manufacturières et de 2 % dans les autres secteurs. Son produit alimente depuis 2000 un fonds spécial du Trésor consacré à la formation professionnelle.",
  "source": "Loi n° 88-145 du 31 décembre 1988, art. 29-30",

 },
 "titularisation": {
  "autre": "ترسيم",
  "definition": "Intégration d'un salarié dans le personnel permanent de l'employeur. À l'entrée en vigueur de la loi n° 2025-9, le 24 mai 2025, les salariés de la sous-traitance de main-d'œuvre interdite et les agents employés de façon permanente par les offices, établissements et entreprises publics à caractère industriel, commercial et agricole sont réputés titularisés auprès de l'entreprise bénéficiaire, avec reprise de leur ancienneté (art. 8) ; le salarié dont le contrat à durée déterminée a été rompu entre le 6 mars 2024 et cette date est titularisé de plein droit si la relation de travail a duré quatre ans ou plus (art. 9).",
  "source": "Loi n° 2025-9 du 21 mai 2025, art. 8 et 9",
  "terme": "Titularisation"
 },
 "travail-de-nuit": {
  "autre": "العمل الليلي",
  "definition": "Travail effectué pendant la période de nuit. Depuis 1996, il est interdit aux femmes et aux moins de 18 ans pendant une période de 12 heures consécutives comprenant l'intervalle de 22 heures à 6 heures (code du travail, art. 66, rédaction de la loi n° 96-62). Le code ne le majore pas ; les conventions de branche peuvent le faire.",
  "source": "Loi n° 96-62 du 15 juillet 1996, art. 66",
  "terme": "Travail de nuit"
 },
 "travail-domestique": {
  "autre": "العمل المنزلي",
  "definition": "Travaux liés au domicile ou à la famille qu'une personne accomplit de manière continue et habituelle pour un ou plusieurs employeurs (loi n° 2021-37, art. 3). Depuis le 30 janvier 2022, cette loi en fixe la durée — 48 heures par semaine —, les congés et le salaire, qui ne peut être inférieur au salaire minimum du régime de 48 heures ; le code du travail s'applique en ce qu'elle ne contredit pas (art. 4, 11, 13 et 14).",
  "source": "Loi n° 2021-37 du 16 juillet 2021, art. 3",
  "terme": "Travail domestique"

 "travail-temps-partiel": {

  "definition": "Travail dont la durée ne dépasse pas 70 % de la durée normale du travail de l'entreprise, régi depuis 1996 par une section du code du travail (art. 94-2 à 94-14, ajoutés par la loi n° 96-62). Les heures supplémentaires du salarié à temps partiel ne dépassent pas le tiers de la durée de son contrat et sont majorées de 50 % (art. 90 et 94-6). La loi n° 2025-9 a récrit l'alinéa qui le définit sans changer cette limite.",
  "source": "Loi n° 96-62 du 15 juillet 1996, art. 94-2",
  "terme": "Travail à temps partiel"
 },
 "zone-franche-economique": {
  "autre": "منطقة اقتصادية حرة",
  "definition": "Zone du territoire tunisien créée par décret, délimitée et aménagée pour les activités autorisées, soustraite au régime douanier, où les investissements relèvent du régime d'encouragement de la loi n° 92-81 (art. 1er et 2). Depuis le 26 juillet 2001, la loi n° 92-81 les nomme « parcs d'activités économiques » (loi n° 2001-76, art. 1er) : « zone franche économique » n'est plus leur dénomination légale. Du 9 août 1992 au 24 mai 2025, les contrats de travail qui y étaient conclus étaient réputés à durée déterminée (art. 23, abrogé par la loi n° 2025-9, art. 5).",
