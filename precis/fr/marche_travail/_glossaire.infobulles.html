  "definition": "Programme du Fonds national de l'emploi créé par le décret n° 2009-349 pour ceux qui créent une petite entreprise : sessions de formation, assistance technique et, pendant la première phase d'implantation du projet, une indemnité mensuelle. En octobre 2012, le « programme d'appui aux promoteurs des petites entreprises » le remplace, nom que garde le décret gouvernemental n° 2019-542 ; en juin 2023, le décret n° 2023-461 l'étend aux entreprises de l'économie sociale et solidaire et aux sociétés communautaires.",
  "source": "Décret n° 2009-349 du 9 février 2009, fixant les programmes du fonds national de l'emploi, les conditions et les modalités de leur bénéfice, art. 1er et 34",
  "terme": "Programme d'accompagnement des promoteurs des petites entreprises"
 },
 "programme-forsati": {
  "autre": "برنامج \"فرصتي\"",
  "definition": "Programme du Fonds national de l'emploi créé par le décret gouvernemental n° 2016-904 : un accompagnement individuel du demandeur d'emploi vers un projet professionnel, de douze mois prorogeables de six, assorti d'une indemnité mensuelle. Le décret gouvernemental n° 2019-542 le reprend.",
  "source": "Décret gouvernemental n° 2016-904 du 27 juillet 2016, complétant le décret n° 2012-2369 du 16 octobre 2012, art. 23 bis-23 octies",
  "terme": "Programme « FORSATI »"
 },
 "rsna": {
  "acronyme": "RSNA",
  "autre": "نظام الأجراء غير الفلاحيين",
  "definition": "Régime de sécurité sociale des salariés du secteur privé non agricole, institué par la loi n° 60-30 du 14 décembre 1960 et géré par la CNSS. L'article 34 de cette loi en fixe le champ par énumération : salariés des établissements industriels et commerciaux, des professions libérales, des coopératives, des sociétés civiles, des syndicats et des associations, personnels des transports, salariés du commerce et du bâtiment. Sa branche des pensions de vieillesse, d'invalidité et de survivants est régie par le décret n° 74-499 du 27 avril 1974, en vigueur au 1er janvier 1974, auquel renvoient les régimes des travailleurs non salariés et des Tunisiens à l'étranger.",
  "source": "Loi n° 60-30 du 14 décembre 1960",
  "terme": "Régime des salariés non agricoles"
 },
 "salaire-brut": {
  "autre": "الأجر الخام",
  "definition": "Rémunération due au travailleur avant toute retenue : salaire de base et accessoires, indemnités et avantages en espèces ou en nature, à l'exception des remboursements de frais (code du travail, art. 134-2). Le bulletin de paie en indique le montant, puis la nature et le montant des retenues opérées sur lui (art. 143). La statistique internationale retient la même notion : la rémunération totale avant les retenues de l'employeur au titre des impôts et des cotisations du salarié.",
  "source": "Loi n° 96-62 du 15 juillet 1996, art. 134-2 et 143",
  "terme": "Salaire brut"
 },
 "salaire-conventionnel": {
  "autre": "الأجر التعاقدي",
  "definition": "Salaire fixé, par catégorie professionnelle, par une convention collective ou par ses avenants. Depuis le décret n° 73-247 du 26 mai 1973, les conventions collectives peuvent fixer les salaires, leurs accessoires et les classifications, sur la base d'un salaire minimum interprofessionnel garanti fixé par décret.",
  "source": "Décret n° 73-247 du 26 mai 1973, art. 1 et 2",
  "terme": "Salaire conventionnel"
 },
 "salaire-d-entree-conventionnel": {
  "autre": "أدنى أجر في جدول الأجور",
  "definition": "Salaire de base de la catégorie et de l'échelon les plus bas d'une grille de salaires conventionnelle, hors indemnités ; c'est le bas de la grille, que l'on rapporte au SMIG horaire du régime de 48 heures pour mesurer ce qu'une convention ajoute au salaire minimum. Dans le textile, c'est le salaire horaire de l'agent payé à l'heure de la catégorie I, à l'échelon de confirmation, connu de 1974 à 2026 et sans interruption de 1994 à 2026 ; dans le bâtiment et les travaux publics, celui du manœuvre ordinaire, dans la grille du personnel occasionnel, connu de 1975 à 2024 et sans interruption de 1996 à 2024.",
  "terme": "Salaire d'entrée d'une grille conventionnelle"
 },
 "salaire-de-base-conventionnel": {
  "autre": "الأجر الأساسي",
  "definition": "Montant qu'une grille de salaires conventionnelle inscrit pour une catégorie et un échelon, hors les indemnités de la convention — de transport et de présence notamment —, qui s'y ajoutent. Dans le textile, l'indemnité complémentaire provisoire est intégrée aux salaires de base à compter du 1er mai 1994 (avenant n° 5). Le décret n° 2026-68 du 30 avril 2026 applique une hausse de 5 % par an, en 2026, 2027 et 2028, aux salaires de base de tous les échelons des dernières grilles annexées aux conventions sectorielles, ainsi qu'aux indemnités de transport et de présence.",
  "source": "Décret n° 2026-68 du 30 avril 2026, art. 1",
  "terme": "Salaire de base (grilles conventionnelles)"
 },
 "salaire-declare": {
  "autre": "الأجر المصرّح به",
  "definition": "Salaire qu'un employeur déclare à la CNSS pour un salarié, et sur lequel les cotisations sont calculées. Dans le régime des salariés non agricoles, cette assiette comprend, depuis la loi n° 95-101 (article 42 nouveau de la loi n° 60-30), l'ensemble des éléments du salaire, primes et avantages compris, sans plafond. Les annuaires statistiques de la CNSS, qui publient la masse et la distribution des salaires déclarés de 1970 à 2018, ne définissent pas le terme et ne le disent ni brut ni net. L'indemnité complémentaire provisoire, entrée dans le SMIG en 1981, reste alors hors de l'assiette des cotisations ; l'annuaire la compte dans les salaires déclarés à partir de 1988.",
  "terme": "Salaire déclaré"
 },
 "salaire-minimum-garanti": {
  "autre": "الأجر الأدنى المضمون",
  "definition": "Seuil au-dessous duquel il n'est pas possible de rémunérer un travailleur chargé de travaux ne nécessitant pas de qualification professionnelle (code du travail, art. 134-2, issu de la loi n° 96-62). Il est fixé par décret, sous deux formes : le salaire minimum interprofessionnel garanti (SMIG) pour les secteurs non agricoles et le salaire minimum agricole garanti (SMAG).",
  "source": "Loi n° 96-62 du 15 juillet 1996, art. 134-2",
  "terme": "Salaire minimum garanti"
 },
 "salaire-moyen-declare": {
  "autre": "معدّل الأجر السنوي المصرّح به",
  "definition": "Quotient que l'annuaire statistique de la CNSS imprime pour le régime des salariés non agricoles : la masse des salaires déclarés de l'année divisée par le nombre de salariés déclarés au moins une fois dans l'année, en dinars par an. Les années incomplètes l'abaissent : en 2013, il est de 8 495 dinars pour l'ensemble des salariés déclarés et de 11 036 dinars pour ceux qui le sont les quatre trimestres. Les annuaires le donnent de 1970 à 2018, dans deux éditions qui ne se raccordent pas : celle de 2006 pour 1970-1999 et 2002-2006, celle de 2018 pour 2000-2018. Il ne se confond pas avec le taux d'évolution du salaire moyen que l'INS tire des mêmes déclarations de 2001 à 2025 : ce taux suit des salariés déclarés cinq trimestres de suite et ne donne aucun niveau.",
  "source": "CNSS, annuaire statistique 2018, p. 16",
  "terme": "Salaire moyen déclaré"
 },
 "salaire-net": {
  "autre": "الأجر الصافي",
  "definition": "Rémunération effectivement perçue par le travailleur, une fois opérées sur la rémunération brute les retenues — cotisations sociales du salarié, impôt retenu à la source. Le bulletin de paie en porte le montant (code du travail, art. 143).",
  "source": "Loi n° 96-62 du 15 juillet 1996, art. 143",
  "terme": "Salaire net"
 },
 "salarie-permanent": {
  "autre": "أجير قارّ",
  "definition": "Terme que deux sources de l'INS emploient en deux sens. Pour le taux d'évolution trimestriel des salaires du secteur privé non agricole, c'est le salarié déclaré à la CNSS de manière continue au cours des cinq derniers trimestres : ces salariés forment l'échantillon fixe sur lequel le taux est calculé, selon le guide méthodologique que l'INS publie en 2026. Dans l'enquête « Emploi et salaires » auprès des entreprises de six salariés et plus, dont le rapport de 2012 donne la définition, c'est le salarié qui fait partie intégrante de l'entreprise, par opposition à l'occasionnel, recruté à titre temporaire pour renforcer l'effectif ; la distinction ne repose pas sur le type de contrat. Les rapports de l'enquête sur les micro-entreprises (2012, 2016) ne définissent pas le terme : ils opposent les personnes employées de façon permanente dans l'entreprise à l'emploi occasionnel.",
  "source": "INS, Guide méthodologique du taux d'évolution trimestriel des salaires (2026), § 3",
  "terme": "Salarié permanent"
 },
 "sivp": {
  "acronyme": "SIVP",
  "autre": "تربص الإعداد للحياة المهنية",
  "definition": "Stage en entreprise ou dans le secteur public pendant lequel l'État verse au stagiaire une indemnité mensuelle. Institué pour les diplômés du supérieur par le décret n° 87-1190 du 26 août 1987, il est étendu en 1988 aux diplômés du second cycle secondaire, puis réservé de nouveau aux diplômés du supérieur par le décret n° 2009-349, qui en fait un programme du Fonds national de l'emploi ; le stage du niveau secondaire cesse alors. En juillet 2019, le décret gouvernemental n° 2019-542 en fait un contrat, ouvert aussi à ceux qui ne sont pas diplômés du supérieur : le contrat d'initiation à la vie professionnelle.",
  "source": "Décret n° 87-1190 du 26 août 1987, portant organisation d'un système de stages d'initiation à la vie professionnelle pour les diplômés du supérieur, art. 1",
  "terme": "Stage d'initiation à la vie professionnelle"
 },
 "smag": {
  "acronyme": "SMAG",
  "autre": "الأجر الأدنى الفلاحي المضمون",
  "definition": "Salaire minimum légal applicable aux salariés du secteur agricole, exprimé par journée de travail. Il sert de référence aux régimes agricoles de sécurité sociale : le salaire de référence du régime des salariés agricoles en est un multiple (loi n° 81-6, art. 18 et 50), et la pension minimale, la limite de calcul et la revalorisation du régime agricole amélioré s'expriment par rapport à lui.",
  "source": "Loi n° 81-6 du 12 février 1981, art. 18 et 50",
  "terme": "Salaire minimum agricole garanti"
 },
 "smig": {
  "acronyme": "SMIG",
  "autre": "الأجر الأدنى المضمون لمختلف المهن",
  "definition": "Rémunération horaire ou mensuelle minimale légale applicable aux salariés des secteurs non agricoles régis par le code du travail. L'État le fixe par décret depuis le 1er janvier 1974. Il est fixé à l'heure et au mois, pour deux régimes de durée du travail : 48 heures et 40 heures par semaine.",
  "source": "Décret gouvernemental n° 2017-668 du 5 juin 2017",
  "terme": "Salaire minimum interprofessionnel garanti"
 },
 "smig-reference-cnss": {
  "autre": "الأجر الأدنى المرجعي المعتمد لدى الصندوق الوطني للضمان الاجتماعي",
  "definition": "Montant que l'annuaire statistique de la CNSS imprime sous sa pyramide des salaires déclarés en dinars, et qui sert d'unité à sa pyramide exprimée en SMIG, de 2000 à 2018. Il vaut 200 heures au taux horaire du SMIG du régime de 48 heures — 290,200 dinars en 2013 —, ce que l'annuaire n'écrit pas et que les montants établissent. Il est inférieur au SMIG mensuel de ce régime, qui compte 208 heures, soit 301,808 dinars en 2013 : un salaire déclaré inférieur à un SMIG de référence n'est pas pour autant inférieur au salaire minimum légal.",
  "source": "CNSS, annuaire statistique 2018, p. 24-27",
  "terme": "SMIG de référence de la CNSS"
 },
 "taux-de-couverture-negociation-collective": {
  "autre": "نسبة تغطية المفاوضة الجماعية",
  "definition": "Part des salariés que couvre une convention collective, en pourcentage du nombre de salariés. L'Organisation internationale du travail la publie pour la Tunisie dans sa base ILOSTAT, de 2010 à 2019, sans l'année 2015, sous l'intitulé « Collective bargaining coverage rate (%) » ; elle déclare pour source des fichiers administratifs, sans en préciser le producteur national ni la méthode, et ne publie ni le numérateur ni le dénominateur. Le taux porte sur les salariés pris ensemble : il ne mesure pas la part des salariés du secteur privé qu'une convention sectorielle couvre.",
  "source": "Collective bargaining coverage rate (%) — Annual (ILR_CBCT_NOC_RT_A), Tunisia",
  "terme": "Taux de couverture de la négociation collective"
 },
 "tfp": {
  "acronyme": "TFP",
  "autre": "الأداء على التكوين المهني",
  "definition": "Prélèvement à la charge de l'employeur, institué en 1956, assis depuis 1989 sur les salaires et rétributions versés, au taux de 1 % dans les industries manufacturières et de 2 % dans les autres secteurs. Son produit alimente depuis 2000 un fonds spécial du Trésor consacré à la formation professionnelle.",
  "source": "Loi n° 88-145 du 31 décembre 1988, art. 29-30",
  "terme": "Taxe de formation professionnelle"
 }
}
