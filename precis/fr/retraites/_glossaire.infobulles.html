 "pension-proportionnelle": {
  "autre": "الجراية النسبية",
  "definition": "Pension servie, dans le régime des salariés non agricoles, à l'assuré qui atteint l'âge requis sans remplir la condition de stage mais compte au moins 60 mois de cotisations. Instituée par le décret n° 82-1030 en remplacement de l'allocation de vieillesse en capital, elle est calculée sur la base de la pension à laquelle l'assuré aurait eu droit s'il avait accompli le stage, au prorata des mois cotisés. Son minimum est la moitié du SMIG, et elle est réversible.",
  "source": "Décret n° 82-1030 du 15 juillet 1982, art. 3",
  "terme": "Pension proportionnelle"
 },
 "pension-proportionnelle-1959": {
  "autre": "جراية التقاعد النسبي",
  "definition": "Pension que la loi n° 59-18, dans sa rédaction initiale, ouvre à l'agent public, hors de la pension d'ancienneté, dans des cas qu'elle énumère (art. 9 § II) : sans condition d'âge ni de durée en cas d'invalidité ; sans condition de durée pour l'agent qui atteint la limite d'âge de son emploi, ou soixante ans, sans droit à la pension d'ancienneté ; après quinze ans de services en cas de licenciement pour suppression d'emplois ou pour insuffisance professionnelle, et pour les femmes mères de trois enfants vivants de moins de seize ans ; à cinquante ans et après vingt ans de services, sur demande ou d'office, dans la limite d'un nombre de pensions fixé chaque année par la loi de finances. Elle est calculée comme la pension d'ancienneté, à 2 % des émoluments de base par annuité liquidable (art. 22). La loi n° 73-71 regroupe ensuite ces cas sous une même condition de quinze ans, et la loi de finances pour 1980 ne mentionne plus le contingent. Elle ne se confond pas avec la pension proportionnelle du régime des salariés non agricoles, instituée par le décret n° 82-1030.",
  "source": "Loi n° 59-18 du 5 février 1959, art. 9 § II",
  "terme": "Pension proportionnelle (loi n° 59-18)"
 },
 "pension-temporaire-orphelin": {
  "autre": "الجراية الوقتية لليتيم",
  "definition": "Pension servie à l'orphelin de l'assuré décédé jusqu'à un âge limite. Dans le secteur public, elle est de 10 % de la pension de retraite par orphelin jusqu'à 21 ans, sans condition d'âge en cas de maladie incurable ou d'invalidité permanente ; la loi n° 2007-43 la prolonge jusqu'à 25 ans pour les études supérieures sans bourse et l'ouvre sans condition d'âge à la fille sans ressources (loi n° 85-12, art. 45-47). Dans le régime des salariés non agricoles, elle est collective et fixée à 30 % depuis le décret n° 81-188 ; dans le régime des salariés agricoles, elle est de 20 %, ou de 30 % pour l'orphelin de père et de mère (loi n° 81-6, art. 64-65).",
  "source": "Loi n° 85-12 du 5 mars 1985, art. 45",
  "terme": "Pension temporaire d'orphelin"
 },
 "pensions-civiles-militaires": {
  "autre": "الجرايات المدنية والعسكرية",
  "definition": "Régime de retraite commun aux agents civils et militaires du secteur public, géré par la Caisse nationale de retraite et de prévoyance sociale (CNRPS) : il n'existe pas de caisse militaire distincte. Ce régime est fixé par la loi n°85-12 du 5 mars 1985 portant régime des pensions civiles et militaires de retraite et des survivants dans le secteur public, modifiée notamment par la loi n°2019-37. Au sein de ce régime commun, le volet militaire connaît des paramètres dérogatoires (durées de services et âges de jouissance différenciés selon le grade).",
  "source": "Loi n° 85-12 du 5 mars 1985",
  "terme": "Pensions civiles et militaires"
 },
 "perequation": {
  "autre": "تنظير الجرايات",
  "definition": "Mécanisme de revalorisation des pensions du secteur public : la pension est réajustée lors de toute augmentation de l'un des éléments permanents de la rémunération du grade ou de la fonction sur la base desquels elle a été liquidée, ainsi que lors de l'institution d'une indemnité permanente attachée à ce grade ou à cette fonction (loi n° 85-12, art. 37). Depuis le 1er janvier 2002, la péréquation donne lieu à contribution : la loi de finances pour 2002 (art. 86) rend la contribution du retraité due pendant toute la période de service de la pension et de ses accessoires, et celle de l'employeur sur une période de 36 mois ; la loi n° 2007-43 reformule la règle, en mettant à la charge du retraité la totalité des contributions, à l'exception de la quote-part de l'employeur pendant 36 mois. Elle se distingue de la révision de la pension, qui est une reliquidation (art. 54), et de la revalorisation par référence au salaire minimum du secteur privé.",
  "source": "Loi n° 85-12 du 5 mars 1985, art. 37",
  "terme": "Péréquation des pensions"
 },
 "regime-artistes": {
  "autre": "نظام الضمان الاجتماعي للفنانين والمبدعين والمثقفين",
  "definition": "Régime de sécurité sociale des artistes, créateurs et intellectuels, créé par la loi n° 2002-104 du 30 décembre 2002, exécutoire le 5 janvier 2003, et géré par la CNSS ; il comprend notamment les pensions de vieillesse, d'invalidité et de survivants (art. 1). Le décret n° 2003-894 du 21 avril 2003, exécutoire le 5 mai 2003, en fixe les modalités d'application.",
  "source": "Loi n° 2002-104 du 30 décembre 2002, art. 1",
  "terme": "Régime des artistes, créateurs et intellectuels"
 },
 "regime-bas-revenus": {
  "autre": "نظام العملة ذوي الدخل المحدود",
  "definition": "Régime de sécurité sociale institué par la loi n° 2002-32 du 12 mars 2002, exécutoire le 21 mars 2002, pour certaines catégories de travailleurs des secteurs agricole et non agricole : les employés de maison ; les personnes employées par l'État, les collectivités locales et les établissements publics administratifs qui ne sont couvertes par aucun autre régime ; les petits pêcheurs et petits armateurs ; les agriculteurs exploitant au plus cinq hectares en sec ou un hectare en irrigué ; les artisans travaillant à la pièce (art. 1). La loi ne lui donne pas de nom abrégé. La pension de vieillesse y est ouverte à 65 ans après 120 mois de cotisations ; son montant minimum est de 30 % du salaire minimum garanti du secteur, majoré, par trimestre supplémentaire, de 0,5 % du salaire ayant servi au calcul des cotisations — les deux tiers de ce salaire minimum —, dans la limite de 80 % de ce salaire (art. 7, 13 et 14). Le décret n° 2002-916 du 22 avril 2002, exécutoire le 7 mai 2002, en fixe les modalités d'application ; le décret gouvernemental n° 2019-379 du 22 avril 2019, exécutoire le 4 mai 2019, l'étend aux femmes récoltant les huîtres et aux ouvriers saisonniers et mobiles du milieu rural travaillant dans le secteur agricole, y compris la femme employée dans ce secteur.",
  "source": "Loi n° 2002-32 du 12 mars 2002, art. 1, 7, 13 et 14",
  "terme": "Régime des travailleurs à faibles revenus"
 },
 "regime-complementaire": {
  "autre": "النظام التكميلي",
  "definition": "Régime facultatif de pension de vieillesse, d'invalidité et de survivants du secteur privé, organisé par un règlement publié par arrêté du ministre des affaires sociales du 18 novembre 1978, applicable à compter du 1er janvier 1974 (art. 2). Les employeurs y adhèrent par contrat auprès de la CAVIS (règlement, art. 3-4), dont les régimes ont été transférés à la CNSS en 1994. Il porte sur la fraction du salaire qui excède la limite de calcul des prestations du régime légal, c'est-à-dire sur le salaire différentiel (règlement, art. 1 et 6). C'est un régime par points : chaque période de cotisation acquiert des points égaux à la cotisation contractuelle divisée par le salaire de référence de la période, et la pension est le nombre de points multiplié par la valeur du point (règlement, art. 10 et 17). L'arrêté du 27 janvier 1997, exécutoire le 16 février 1997, ouvre la pension de réversion au conjoint survivant et ne suspend plus la pension qu'en cas de remariage avant 55 ans.",
  "source": "Arrêté du ministre des affaires sociales du 18 novembre 1978, art. 2 et règlement, art. 1, 3-4, 6, 10 et 17",
  "terme": "Régime complémentaire"
 },
 "regime-conventionnel-retraite": {
  "autre": "النظام التعاقدي",
  "definition": "Dans le secteur privé, régime de pensions de vieillesse, d'invalidité ou de survie institué par convention hors du régime légal, notamment sous la forme d'un contrat groupe souscrit par des employeurs. La loi n° 60-30 permet à la CNSS d'en gérer selon des conventions particulières (art. 5) et oblige les organismes qui couvrent la vieillesse à déclarer leurs régimes (art. 119) ; la loi n° 60-33 renvoie à un décret le soin de dire s'ils subsistent hors du régime général ou fusionnent avec lui (art. 5). À titre provisoire, le décret n° 74-499 maintient ceux qui sont gérés en contrat groupe et dont les avantages sont au moins équivalents à ceux du régime légal, et ouvre aux employeurs et aux salariés un droit d'option de trois mois pour y rester, avec dispense de la cotisation légale (art. 59-62). Le décret n° 76-981 réalise la fusion : les régimes qui font double emploi avec le régime légal sont transférés à la CAVIS, la fraction qui l'excède y devenant régime complémentaire, et les droits acquis sont maintenus (art. 1 et 25) ; le décret n° 94-1477 les transfère à la CNSS (art. 2). Ne se confond pas avec le régime conventionnel public de rémunération des entreprises publiques.",
  "source": "Décret n° 74-499 du 27 avril 1974, art. 59-62",
  "terme": "Régime conventionnel de retraite"
 },
 "regime-travailleuses-agricoles": {
  "autre": "نظام الضمان الاجتماعي للعاملات الفلاحيات",
  "definition": "Régime spécifique de sécurité sociale des travailleuses agricoles, institué par le décret-loi n° 2024-4 du 22 octobre 2024, relatif au régime de protection sociale des travailleuses agricoles, exécutoire le 28 octobre 2024, et géré par la CNSS ; il comporte les prestations de l'assurance maladie et les pensions de vieillesse, d'invalidité et de survivants (art. 1, 17 et 18). Il couvre la travailleuse agricole non salariée, à titre principal et pour son propre compte, et la salariée qui travaille au moins 15 jours par mois, en moyenne au moins 45 jours par trimestre ou 180 jours par an, sauf si son employeur est affilié à un régime légal couvrant les mêmes risques pour tous ses employés (art. 17). L'État prend en charge ses cotisations pendant les trois premières années d'activité (art. 20 et 23). La pension de vieillesse est ouverte à 65 ans, ou dès 60 ans, après 120 mois de cotisations effectives et validées (art. 26-27) ; ses taux et ses modalités sont renvoyés à un décret (art. 33).",
  "source": "Décret-loi n° 2024-4 du 22 octobre 2024, art. 1, 17-18, 20, 23, 26-27 et 33",
  "terme": "Régime de sécurité sociale des travailleuses agricoles"
 },
 "rente-compensatrice": {
  "autre": "الإيراد التعويضي",
  "definition": "Rente servie par la CNRPS, à la charge de l'employeur, aux agents publics victimes d'un accident du travail ou d'une maladie professionnelle, au titre de la loi n° 95-56 du 28 juin 1995, dont les militaires et les agents des forces de sécurité intérieure sont exclus (art. 2). Selon le manuel de liquidation de la caisse (2013), elle est servie depuis janvier 1996 avec une formule et des bornes identiques à celles de la rente viagère d'invalidité.",
  "source": "Manuel de liquidation des pensions & accessoires, p. 88-89",
  "terme": "Rente compensatrice"
 },
 "rente-viagere-invalidite": {
  "autre": "الإيراد العمري للعجز",
  "definition": "Rente qui s'ajoute à la pension de l'agent public admis à la retraite pour invalidité. L'invalidité des agents publics reste régie par la loi n° 59-18, maintenue sur ce point par l'article 76 de la loi n° 85-12 ; dans la rédaction de l'article 26 § II issue de la loi n° 81-70, le montant de la rente est égal au produit de la rémunération soumise à retenue pour pension par le taux de l'invalidité. L'article 26 § III de la loi n° 59-18 plafonne le total de la rente et de la pension cumulable : aux émoluments de base de l'article 21 dans la rédaction de 1959, aux émoluments globaux indiciaires visés à l'article 21 dans la rédaction issue du décret-loi n° 70-1. Le manuel de liquidation de la CNRPS (2013) calcule la rente, lui, sur la pension de retraite, et plafonne le total de la pension et de la rente à 100 % de la rémunération de base.",
  "source": "Loi n° 81-70 du 1er août 1981, art. 4 (art. 26 § II de la loi n° 59-18)",
  "terme": "Rente viagère d'invalidité"
 },
 "retraite-anticipee-volontaire": {
  "autre": "التقاعد المبكّر الاختياري",
  "definition": "Système de départ anticipé des agents publics institué, hors de la loi n° 85-12, par la loi n° 87-7 du 6 mars 1987. Il est distinct du droit général au départ anticipé de l'article 30 de la loi n° 85-12 et de la mise à la retraite avant l'âge légal instituée par la loi n° 2009-39 du 8 juillet 2009, que l'article 7 de la loi n° 2019-37 maintient l'un et l'autre sous l'empire des textes antérieurs pour l'âge légal.",
  "source": "Loi n° 87-7 du 6 mars 1987",
  "terme": "Retraite anticipée volontaire"
 },
 "revalorisation-pensions": {
  "autre": "تعديل الجرايات",
  "definition": "Ajustement du montant des pensions liquidées du secteur privé par référence au salaire minimum. Dans le régime des salariés non agricoles, la révision discrétionnaire de 1974 (décret n° 74-499, art. 53) devient automatique à chaque augmentation du SMIG, avec effet au 1er mai 1980, sous la forme d'une somme égale à la hausse du SMIG horaire rapportée à 200 heures par mois et affectée du taux de la pension (décret n° 81-187), règle appliquée jusqu'au 31 décembre 2000 ; depuis le 1er janvier 2001, la majoration est un taux : la pension est augmentée du taux de variation du SMIG horaire rapporté à 48 heures par semaine, soit le SMIG du régime de 48 heures (décret n° 2001-779). Les régimes agricoles la rattachent au SMAG (loi n° 81-6, art. 80). Son équivalent dans le secteur public est la péréquation.",
  "source": "Décret n° 81-187 du 14 février 1981, art. 1 (art. 53 nouveau)",
  "terme": "Revalorisation des pensions"
 },
 "revenu-forfaitaire": {
  "autre": "الدخل التقديري",
  "definition": "Revenu conventionnel, et non constaté, sur lequel reposent les cotisations, et par suite la pension, des assurés dont le revenu réel n'est pas déclaré. Dans le régime des travailleurs non salariés, c'est le revenu de la classe de revenus choisie par l'assuré : la pension de 1982 se calcule sur la moyenne pondérée des revenus forfaitaires de la carrière (décret n° 82-1359, art. 19), et, depuis 1995, les classes sont des multiples du SMIG ou du SMAG (décret n° 95-1166, art. 7). Les travailleurs tunisiens à l'étranger cotisent de même sur le revenu forfaitaire de leur classe (décret n° 89-107, art. 7). Pour les pêcheurs à la part embarqués sur des bateaux de moins de 30 tonneaux, les pêcheurs indépendants et les petits armateurs, l'assiette était égale au SMIG mensuel affecté d'un coefficient de 1 à 3 selon la fonction à bord (décret n° 77-546, art. 3), de 1977 à leur passage au régime agricole amélioré au 1er octobre 1989 (loi n° 89-73).",
  "source": "Décret n° 95-1166 du 3 juillet 1995, art. 7",
  "terme": "Revenu forfaitaire"
 },
 "rsa": {
  "acronyme": "RSA",
  "autre": "نظام الأجراء الفلاحيين",
  "definition": "Régime de sécurité sociale des salariés agricoles, organisé par les titres I et II de la loi n° 81-6 du 12 février 1981, en vigueur au 1er janvier 1981, et géré par la CNSS. Sa pension repose sur un salaire de référence forfaitaire, multiple du SMAG, et elle est révisée à chaque paiement proportionnellement à la variation du SMAG. En 1981, la pension de survivant va à la veuve et au veuf invalide (art. 60) ; la loi n° 96-66, exécutoire le 4 août 1996, l'ouvre au conjoint survivant, et la loi n° 97-61 réécrit les droits des orphelins avec effet au 1er mai 1997 ; la loi n° 2007-43, exécutoire le 2 juillet 2007, révise ceux de la fille.",
  "source": "Loi n° 81-6 du 12 février 1981, titres I et II",
  "terme": "Régime des salariés agricoles"
 },
 "rsaa": {
  "acronyme": "RSAA",
  "autre": "النظام الفلاحي المحسَّن",
  "definition": "Régime ajouté à la loi n° 81-6 sous la forme d'un titre III par la loi n° 89-73 du 2 septembre 1989, en vigueur au 1er octobre 1989. Il s'applique aux coopérateurs salariés des sociétés et coopératives agricoles, aux salariés des exploitants employant au moins trente salariés permanents et à certains pêcheurs et petits armateurs. Il renvoie aux règles du régime des salariés agricoles dans la mesure où il n'y déroge pas, mais retient des salaires réels, bornés à six fois le SMAG, et fixe une pension minimale égale à la moitié du SMAG rapporté à 300 jours.",
  "source": "Loi n° 89-73 du 2 septembre 1989",
  "terme": "Régime agricole amélioré"
 },
 "rsna": {
  "acronyme": "RSNA",
  "autre": "نظام الأجراء غير الفلاحيين",
  "definition": "Régime de sécurité sociale des salariés du secteur privé non agricole, institué par la loi n° 60-30 du 14 décembre 1960 et géré par la CNSS. L'article 34 de cette loi en fixe le champ par énumération : salariés des établissements industriels et commerciaux, des professions libérales, des coopératives, des sociétés civiles, des syndicats et des associations, personnels des transports, salariés du commerce et du bâtiment. Sa branche des pensions de vieillesse, d'invalidité et de survivants est régie par le décret n° 74-499 du 27 avril 1974, en vigueur au 1er janvier 1974, auquel renvoient les régimes des travailleurs non salariés et des Tunisiens à l'étranger.",
  "source": "Loi n° 60-30 du 14 décembre 1960",
  "terme": "Régime des salariés non agricoles"
 },
 "rtns": {
  "acronyme": "RTNS",
  "autre": "نظام العملة غير الأجراء",
  "definition": "Régime de sécurité sociale des travailleurs non salariés des secteurs agricole et non agricole, géré par la CNSS. Les non-salariés sont couverts depuis le 1er juillet 1982 par deux décrets du 21 octobre 1982 : le décret n° 82-1359, pour les travailleurs indépendants du secteur non agricole, et le décret n° 82-1360, pour les exploitants et travailleurs indépendants de l'agriculture. Le décret n° 95-1166 du 3 juillet 1995, exécutoire le 19 juillet 1995, les fusionne en un régime unique et les abroge, en conservant leurs affiliés et en transférant leurs réserves (art. 34-39). Le régime procède par extension : l'article premier de ce décret rend applicables aux non-salariés des articles de la loi n° 60-30 et les articles du décret n° 74-499 relatifs à l'invalidité, aux survivants et à la liquidation des pensions. Les cotisations et les pensions reposent sur un revenu forfaitaire fixé par classes de revenus, dans le secteur non agricole depuis 1982 et dans les deux secteurs depuis 1995.",
  "source": "Décret n° 95-1166 du 3 juillet 1995, art. 1 et 34-39",
  "terme": "Régime des travailleurs non salariés"
 },
 "rtte": {
  "acronyme": "RTTE",
  "autre": "نظام الضمان الاجتماعي للعملة التونسيين بالخارج",
  "definition": "Régime de sécurité sociale des travailleurs tunisiens à l'étranger, salariés ou non, qui ne sont pas couverts par une convention bilatérale, institué par le décret n° 89-107 du 10 janvier 1989, obligatoire le 19 janvier 1989. L'adhésion y est volontaire, mais couvre obligatoirement les pensions en même temps que les assurances sociales. Il étend à ces travailleurs les articles du décret n° 74-499 relatifs à l'invalidité, aux survivants et à la liquidation, et la gestion des pensions en est déléguée à la Caisse d'assurance vieillesse, d'invalidité et de survivants (CAVIS). Il fixe lui-même les règles de la pension de vieillesse, reprises du décret n° 82-1359 des non-salariés non agricoles, sur une assiette de classes de revenus exprimées en multiples du SMIG.",
  "source": "Décret n° 89-107 du 10 janvier 1989, art. 1-3, 6 et 18-23",
  "terme": "Régime des travailleurs tunisiens à l'étranger"
 },
 "salaire-differentiel": {
  "autre": "الأجر التفاضلي",
  "definition": "Fraction du salaire qui excède la limite fixée par le régime légal pour le calcul des prestations, et qui forme l'assiette du régime complémentaire de pension de vieillesse, d'invalidité et de survivants organisé par l'arrêté du ministre des affaires sociales du 18 novembre 1978 (règlement, art. 1 et 6). Il commence là où s'arrête la limite de six fois le SMIG et se déplace avec elle.",
  "source": "Arrêté du ministre des affaires sociales du 18 novembre 1978, règlement, art. 1 et 6",
  "terme": "Salaire différentiel"
 },
 "salaire-moyen-reference": {
  "autre": "الأجر المتوسط المرجعي",
  "definition": "Assiette de la pension dans les régimes du secteur privé, calculée comme une moyenne de salaires sur une période qui précède l'ouverture du droit. Dans le régime des salariés non agricoles, il est établi, à compter du 1er janvier 1974, sur les trois ou cinq dernières années, la période la plus avantageuse étant retenue, et la moyenne porte sur 36 ou 60 mois (décret n° 74-499, art. 18-19). Le décret n° 90-1455 porte la période aux dix dernières années à compter du 23 septembre 1990, sans modifier l'article 19, qui maintient la moyenne sur 36 ou 60 mois ; il prévoit l'actualisation des salaires selon un barème fixé par arrêté. Le décret n° 94-1429 abroge et remplace ces deux articles : la période est de cinq, sept puis dix dernières années, et la moyenne porte sur 60, 84 puis 120 mois, à compter respectivement des 1er juillet 1994, 1995 et 1996 ; le barème d'actualisation est fixé chaque année par arrêté, le premier arrêté retrouvé datant du 17 novembre 1994. Le salaire de référence est borné par la limite de calcul des prestations. Dans le régime des salariés agricoles, il est forfaitaire : le SMAG rapporté à 300 jours, affecté du coefficient multiplicateur moyen ayant servi de base au calcul des cotisations au cours des trois ou cinq dernières années précédant l'âge d'ouverture du droit (loi n° 81-6, art. 50).",
  "source": "Décret n° 74-499 du 27 avril 1974, art. 18-19",
  "terme": "Salaire moyen de référence"
 },
 "securite-sociale-pecheurs": {
  "autre": "الضمان الاجتماعي للصيادين البحريين",
  "definition": "Extension aux pêcheurs, par le décret n° 77-546 du 15 juin 1977, obligatoire le 23 juin 1977, des régimes de sécurité sociale issus des lois n° 60-30 et 60-33 et du décret n° 74-499 : elle vise les pêcheurs, les patrons pêcheurs même propriétaires de leur barque, les armateurs travaillant sur un bateau de pêche dont ils assurent l'équipement, et les petits armateurs (art. 1). Ce n'est pas un régime de pension distinct : la pension des pêcheurs est celle du régime des salariés non agricoles. Sa particularité est l'assiette : pour les pêcheurs à la part embarqués sur des bateaux de moins de 30 tonneaux, les pêcheurs indépendants et les petits armateurs, les cotisations reposent sur un revenu forfaitaire égal au SMIG mensuel affecté d'un coefficient de 1 à 3 selon la fonction à bord (art. 3) ; sur les bateaux de 30 tonneaux et plus, sur le salaire réel (art. 4). La loi n° 89-73 fait passer les premiers au régime agricole amélioré au 1er octobre 1989 et, depuis la loi n° 2002-32, les pêcheurs des bateaux de cinq tonneaux au plus relèvent du régime des travailleurs à faibles revenus.",
  "source": "Décret n° 77-546 du 15 juin 1977, art. 1, 3 et 4",
  "terme": "Sécurité sociale des pêcheurs"
 },
 "smag": {
  "acronyme": "SMAG",
  "autre": "الأجر الأدنى الفلاحي المضمون",
  "definition": "Salaire minimum légal applicable aux salariés du secteur agricole, exprimé par journée de travail. Il sert de référence aux régimes agricoles de sécurité sociale : le salaire de référence du régime des salariés agricoles en est un multiple (loi n° 81-6, art. 18 et 50), et la pension minimale, la limite de calcul et la revalorisation du régime agricole amélioré s'expriment par rapport à lui.",
  "source": "Loi n° 81-6 du 12 février 1981, art. 18 et 50",
  "terme": "Salaire minimum agricole garanti"
 },
 "smig": {
