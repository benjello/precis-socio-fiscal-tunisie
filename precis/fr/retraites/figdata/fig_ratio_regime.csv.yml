caveats: [DEUX DATES, PAS UNE SÉRIE : la caisse ne publie la ventilation par régime qu'aux deux extrémités de la période ; le millésime 2019 n'en donne que les pourcentages. L'attribution d'une légende à son année se fait par l'ABSCISSE, jamais par la valeur — un régime peut décroître (salariés agricoles : 8 235 en 2000, 7 484 en 2020). Les libellés diffèrent d'une planche à l'autre dans la source (« travailleurs à faible revenu » côté actifs, « faibles revenus » côté pensionnés) et sont canonisés. ANOMALIE DE LA SOURCE en 2000 : les six légendes totalisent 1 012 220 quand le total publié est 1 013 483 (écart 0,125 %), et une part de 0,32 % du camembert n'a pas de légende. Le bouclage de 2020 est exact.]
