caveats: [Aucun arrêté retrouvé pour 2016, 2017 et 2019. Les barèmes de 2013 à 2015 sont recalculés, et celui de 2018 revient au calcul antérieur. Le barème de 1996 est lu sur un scan, celui de 2024 sur l'image insérée dans le fascicule., SÉRIE COMPOSITE DÉRIVÉE : chacune de ses sources existe aussi comme série homogène, avec son entrée du catalogue, et l'inventaire indicateur → source → série homogène est dans docs/croissances-revenus-prix.md, section « Séries homogènes sous-jacentes ». Elle sert à comparer au barème d'actualisation des salaires des pensions, qui n'est pas ici (il est fixé par arrêté et publié au Journal officiel, comme le SMIG). Chaque taux vient d'une seule série, édition ou rapport ; les années où la mesure change sont omises (salariés 2004-2005 : recensement) ou marquées (2011 : passage de l'enquête de mai à la moyenne des trimestres ; 1970 : raccord des bases de l'indice des prix). La rémunération hors État par salarié hors fonction publique retranche la seule masse salariale de l'État (les entreprises publiques restent dedans) et s'appuie sur la part des salariés MODÉLISÉE par le BIT. BRUT ET SUPERBRUT : les salaires et traitements bruts (D.11) excluent les charges sociales des employeurs que la rémunération des salariés (D.1) comprend ; ils ne commencent qu'en 2002, UNdata ne les portant pas. Le ministère des finances ne publie pas sa masse salariale hors contributions patronales : les indicateurs bruts « hors » retranchent donc l'administration centrale des comptes de la nation (État et établissements publics à compétence nationale, hôpitaux compris), lue dans la même édition, et non la masse salariale du ministère ; leur pendant superbrut sur ce périmètre est fourni pour la comparaison. PIB NOMINAL, RUPTURES DE BASE CORRIGÉES : la série de la Banque mondiale (WDI NY.GDP.MKTP.CN) accole les bases des comptes de l'INS sans les raccorder, d'où « +20,33 % » en 1997 (1996 en base 1983, 1997 en base 1997) et « +12,72 % » en 2010 (2009 en base 1997, 2010 dans une valeur rétropolée, 2010-2014 plus hauts de 4,9 à 5,5 % que la base 1997 des éditions INS). Le taux vient donc de la Banque mondiale de 1962 à 1992 seulement ; de 1993 à 2001, d'UNdata (données INS transmises à l'ONU, tableau 4.1, compte de production), dans la plus récente série SCN qui porte l'année et la précédente (1993-1997 : série 30, base 1983 ; 1998-2001 : série 100, base 1997) ; de 2002 à 2025, des éditions INS des comptes de la nation, la plus récente qui porte l'année et la précédente (2002-2005 : base 1983 ; 2006-2015 : base 1997 ; 2016-2025 : base 2015 ; 2025 provisoire). 1997 passe à +9,61 %, 2010 à +7,46 % ; la colonne `note` donne le taux d'origine. DEUX INDICATEURS « TELS QUE PUBLIÉS » : « PIB nominal, Banque mondiale (WDI, tel que publié) » et « PIB nominal par habitant, Banque mondiale (WDI, tel que publié) » donnent, pour comparaison, les taux de la série de la Banque mondiale sur 1962-2025 sans aucune correction ; ils contiennent les ruptures de base de 1997 et 2010 et ne doivent pas servir de mesure de la croissance ces années-là. Les révisions entre éditions déplacent aussi d'autres années de quelques dixièmes (2025 : +7,38 % au lieu de +7,86 %, la Banque mondiale portant pour 2025 un niveau que l'édition 2021-2025 n'imprime pas). Avant 1993, les bases de la série de la Banque mondiale n'ont pas été vérifiées sur une source de même base. Le PIB par habitant divise le taux du PIB par la croissance de la population, seule à venir de la Banque mondiale (SP.POP.TOTL) avec la part des salariés. SALAIRES DÉCLARÉS À LA CNSS, DEUX MESURES QUI NE SE RACCORDENT PAS : le taux de l'INS (2008-2025) suit un PANEL de salariés permanents, déclarés sans interruption sur cinq trimestres, avec le quatrième trimestre ajusté pour les primes et les évolutions individuelles hors de [-5 % ; +10 %] exclues : c'est la progression du salaire de ceux qui restent en place, qui ignore les effets d'entrée, de sortie et de composition, contrairement à un salaire moyen ; son taux annuel chaîne les quatre taux trimestriels (quatrième trimestre sur quatrième trimestre), définition que les taux annuels publiés par l'INS en 2010-2021 confirment à 0,22 point près, et chaque trimestre est pris dans l'édition la plus récente (valeurs révisées, 2025 provisoire). Le salaire annuel moyen de la Banque mondiale (1995-2000) est une moyenne sur TOUS les salariés déclarés dans l'année, années incomplètes et temps partiel compris : son niveau est inutilisable (moins que le SMIG), seule sa croissance, imprimée par le rapport, l'est. PÉRIODE T1 2001 - T1 2007, PREMIER PORTAIL DE L'INS (www.ins.nat.tn, indicateur 0402040, pages mises à jour le 06/10/2006 et le 30/06/2009, seules captures des archives du web) : (a) ces pages ne nomment pas la CNSS (« Source : Institut National de la Statistique (INS) ») : l'appui sur les salaires déclarés à la CNSS pour 2001-2006 est DÉDUIT de la continuité de l'indicateur (même code, mêmes valeurs que le BMS sur T2 2007 - T1 2009, redressement de 2009 compris), non affirmé par la source ; (b) la méthode de la période ancienne n'est pas documentée : le panel de salariés permanents et les seuils viennent du guide de 2026 et ne peuvent être remontés à 2001 ; le libellé de 2006 dit « salaire moyen » ; (c) on ignore si l'indicateur commence en 2001 ou si l'affichage était tronqué ; (d) aucune autre version archivée (recherche CDX sur le code 0402040 et les familles de pages conjoncturelles) ; les URL d'origine ne répondent plus. T2 2006 vaut 1,69 dans la mise à jour de 2006, 1,45 dans celle de 2009, retenue ; T1 2007 (1,11) n'est dans aucun BMS en ligne. SALAIRES DES ANNÉES 1960 À 2007, SOURCES ANCIENNES, AUCUNE RACCORDÉE À UNE AUTRE : chaque taux est pris entre deux années d'un même rapport. MASSE DÉCLARÉE À LA CNSS (BCT) : tous les salariés déclarés, sa croissance mêle salaires et affiliation ; RUPTURE D'ASSIETTE EN 1961, le plafond de 500 D par an et par salarié en deçà duquel les salaires étaient déclarés jusqu'en 1960 étant supprimé (1960 : Caisse centrale des prestations sociales) ; le RA 1969 imprime des taux (14,1 % et 14,8 %) que ses niveaux contredisent (14,48 % et 14,34 %), taux des niveaux retenus ; 1965 et 1970 révisés par le rapport suivant ; pas de taux en 1962, 1972 et 1973 (rubrique absente des RA 1962, 1972 et 1973) ni après 1975. SALAIRE MOYEN DÉCLARÉ (BCT) : l'effectif change quatre fois de libellé, et de définition en 1971 (moyenne trimestrielle des effectifs déclarés) ; c'est le salaire moyen d'une population qui s'élargit, non celui d'une carrière. SALAIRE MOYEN HORS AGRICULTURE ET HORS ADMINISTRATION : deux millésimes des données du Plan, Banque mondiale 1995 (salariés estimés et lissés ; en 1992 et 1993, masse imprimée supérieure de 0,3 et 3,7 MD à ses composantes) et FMI 97/57 (années discontinues, 1994 provisoire), divergents dès 1986, non raccordés. SECTEURS PRODUCTIFS NON AGRICOLES (BCT, 1999-2007) : taux imprimés seuls, les niveaux étant révisés d'un rapport à l'autre ; taux de 2006 imprimé par le RA 2007 ; les rapports ne disent ni la source ni la méthode.]
