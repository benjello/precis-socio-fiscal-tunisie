# Table PRODUCTEUR → MINISTÈRE / INSTITUTION DE TUTELLE, axe de premier niveau de l'annexe
# engendrée « Les sources de données chiffrées » (precis/fr/annexe-sources.qmd, engendrée par
# precis/fr/figures/annexe_sources.py).
#
# POURQUOI. L'annexe est classée par ministère (ou institution) de tutelle du producteur, puis
# — à l'intérieur de chaque tutelle — par producteur, puis par collection/source. Cet axe
# remplace l'ancien classement « par type de source ».
#
# COMMENT. Pour chaque source, on lit son producteur (`publisher`, à défaut l'auteur) et on
# cherche, DANS L'ORDRE des buckets ci-dessous, le premier dont une sous-chaîne `producteurs`
# apparaît dans le producteur (comparaison sans accents, insensible à la casse). La première
# qui correspond l'emporte. Si AUCUNE ne correspond, la source tombe dans « Autres / non
# rattaché » : on NE DEVINE JAMAIS une tutelle incertaine.
#
# SOURCÉ / ASSUMÉ (décisions du propriétaire, documentées ici et non dans le texte publié) :
#   - Banques publiques (STB, BNA, BH, BTE) et Bourse de Tunis → Ministère des Finances.
#   - BCT, Cour des comptes, Cour de discipline financière et INS → Institutions indépendantes.
#   - STEG, ETAP → Industrie/Énergie ; Tunisair, Sotrapil → Transport ; CNSS/CNAM/CNRPS/CRES →
#     Affaires sociales ; Direction générale de la privatisation (Premier ministère) → Présidence.
#   - ASSUMÉ, à confirmer : « Agence de promotion de l'industrie » (API) → Industrie.
#   - LAISSÉS en « Autres / non rattaché » faute de tutelle certaine parmi ces buckets :
#     assureurs publics (STAR, Tunis Re — supervision Finances mais non listés), Ciments de
#     Bizerte (Industrie/Mines, non listé), SOTUMAG (Commerce), Tunisie Telecom (Technologies),
#     CPSCL et Portail des collectivités locales (Intérieur), FIPA (Investissement), ministères
#     de l'Éducation / du Développement, centres d'études privés, presse. À rattacher à la main
#     si une tutelle est retenue.
#
# L'ORDRE des buckets est l'ordre d'affichage. « Autres / non rattaché » reste le dernier
# (défaut). Ajouter un producteur = ajouter une sous-chaîne discriminante au bon bucket, ici et
# à un seul endroit.

tutelles:
  - nom: "Ministère des Finances"
    producteurs:
      - "ministere des finances"
      - "ministere de l'economie"          # Économie / Économie et Finances / Économie-Finances-Appui
      - "controle general des finances"
      - "societe tunisienne de banque"     # STB (banque publique)
      - "banque nationale agricole"        # BNA
      - "banque de l'habitat"              # BH
      - "banque de tunisie et des emirats" # BTE
      - "bourse de tunis"                  # Bourse / marché financier

  - nom: "Ministère de l'Industrie, des Mines et de l'Énergie"
    producteurs:
      - "ministere de l'industrie"
      - "societe tunisienne de l'electricite"           # STEG
      - "entreprise tunisienne d'activites petrolieres" # ETAP
      - "societe tunisienne des industries de raffinage" # STIR
      - "societe nationale de distribution des petroles" # SNDP (Agil)
      - "agence de promotion de l'industrie"            # API (assumé)

  - nom: "Ministère du Transport"
    producteurs:
      - "societe tunisienne de l'air"                   # Tunisair
      - "societe de transport des hydrocarbures"        # Sotrapil
      - "societe nationale des chemins de fer"          # SNCFT
      - "office de la marine marchande et des ports"    # OMMP
      - "tunisie autoroutes"
      - "societe des transports de tunis"               # Transtu

  - nom: "Ministère des Affaires sociales"
    producteurs:
      - "caisse nationale de securite sociale"               # CNSS
      - "caisse nationale d'assurance maladie"               # CNAM
      - "caisse nationale de retraite et de prevoyance sociale" # CNRPS
      - "centre de recherches et d'etudes sociales"          # CRES
      - "ministere des affaires sociales"

  - nom: "Ministère de l'Agriculture et de l'Équipement"
    producteurs:
      - "ministere de l'agriculture"
      - "societe nationale d'exploitation et de distribution des eaux" # SONEDE
      - "office national de l'assainissement"                # ONAS
      - "office des cereales"
      - "ministere de l'equipement"

  - nom: "Présidence du gouvernement"
    producteurs:
      - "premier ministere"                 # dont Direction générale de la privatisation
      - "presidence du gouvernement"
      - "unite de suivi de la productivite"

  - nom: "Institutions indépendantes"
    producteurs:
      - "banque centrale de tunisie"        # BCT
      - "cour des comptes"
      - "cour de discipline financiere"
      - "institut national de la statistique" # INS

  - nom: "Organisations internationales"
    producteurs:
      - "banque mondiale"
      - "world bank"
      - "banque internationale pour la reconstruction"
      - "fonds monetaire international"
      - "banque africaine de developpement"
      - "agence francaise de developpement"
      - "organisation de cooperation et de developpement"   # OCDE
      - "organisation mondiale du commerce"
      - "gatt"
      - "organisation internationale du travail"            # BIT / ILO
      - "organisation mondiale de la sante"                 # OMS
      - "unicef"
      - "united nations"

  - nom: "Autres / non rattaché"
    producteurs: []   # défaut : tutelle non établie — jamais devinée
