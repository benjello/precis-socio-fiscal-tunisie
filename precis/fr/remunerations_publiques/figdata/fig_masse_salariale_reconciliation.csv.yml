caveats: [Le PIB n'est pas d'une seule base : base 1983 jusqu'en 1996 (présumée pour 1990-1991) ; base 1997 rétropolée par l'INS en 1997-2001 ; valeurs propres au ministère des Finances en 2002-2004 et en 2025, dont la source ne précise pas la base ; base 1997 en 2005-2009 ; base 2015 de l'INS de 2010 à 2024, rétropolée par l'INS pour 2010-2014. Ruptures de série en 1997, 2002, 2005, 2010 et 2025 : la part du PIB se lit à l'intérieur d'un segment, les bases n'étant ni chaînées ni raccordées. La part dans les dépenses de l'État ne dépend d'aucune base., Écarts observés entre les deux bases, de + 4,89 à + 6,12 % : ils ne sont pas constants et ne donnent pas de coefficient de passage pour d'autres années. La base 2015 est rétropolée par l'INS pour 2010-2014., Le PIB « aux prix de 2010 » du FMI est, pour ses niveaux aux prix courants, celui de la base 1997 de l'INS : il n'existe pas de PIB aux prix courants « en base 2010 ». La base du PIB employé par la Banque mondiale n'est pas précisée ici. L'INS n'a publié aucun PIB en base 1997 après 2017.]
