caveats: [série reconstituée par l'INS par-dessus une nomenclature annuelle mouvante (l'annexe 2017 replie Défense, Intérieur et collectivités locales dans « Autres ministères » ; l'annexe 2018 les renomme « Communes ») ; rupture de périmètre des collectivités locales 2016→2017 ; la colonne 2021 porte trois décimales contre une pour 2015-2020, d'où de faux petits mouvements 2020→2021 ; hausse de la Défense de +35 % entre 2015 et 2018, corroborée par deux publications INS mais non commentée par l'INS, sur un champ qui exclut les militaires de carrière ; tout lien avec le contexte sécuritaire post-2015 doit être documenté séparément, EN AGENTS, non en milliers. NON RACCORDABLE à `ins-ministere-effectifs` (2015-2021) : sur les années communes, le rapport 2025 RÉVISE la répartition à total inchangé. Environ 9 000 agents passent des « Autres établissements » au ministère de l'intérieur (intérieur 2018 : 87,3 milliers dans l'enquête, 96 286 agents ici ; autres établissements : 55,6 milliers contre 46 892) ; la Présidence du gouvernement perd environ 500 agents (2,2 milliers contre 1 684), la Justice en gagne environ 400, les Finances en perdent environ 300. L'INS ne commente pas ce reclassement. Défense, Éducation, Agriculture et collectivités locales concordent à l'arrondi.]
