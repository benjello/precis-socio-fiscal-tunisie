caveats: [SÉRIE COMPOSITE PAR MILLÉSIME INS. Les rapports 2010-2014 à 2013-2017 publient un « salaire brut moyen mensuel » ; cette série est reprise comme brut avec contributions car elle se raccorde à la notion explicitement nommée dans tab18. À partir de 2015, la source nomme explicitement le brut avec contributions. Arbitrage : le millésime le plus récent fait foi pour chaque année ; les valeurs écartées sont conservées dans salaire_brut_contributions_2010_2025_conflits.csv. Révisions notables : 2013 (1287,3 → 1299,4), 2014 (1334,3 → 1326,6), 2015 (1388,9 puis 1461,8), 2016 (1580,7 puis 1644,6), 2017 (1653,5 puis 1668,3), et écarts d'environ un dinar entre tab18 et le rapport 2018-2025 sur 2018-2020. Montants en dinars courants, non déflatés., SÉRIE RACCORDÉE. ARBITRAGE : le millésime le plus récent fait foi sur 2018-2020 ; les valeurs de tab18 écartées sont listées dans la fiche. Chaque indicateur est raccordé à lui-même — jamais un brut avec contributions à un brut sans. Le raccord laisse une marche d'environ un dinar entre 2017 et 2018 (révision du millésime 2025 non reportée sur 2015-2017) : le taux 2017→2018 recalculé sur la série vaut 2,8 % pour le brut avec contributions et 2,9 % sans, contre 2,9 % et 3,0 % publiés ; pour le net il vaut 3,4 %, comme publié. Les taux d'accroissement ne sont PAS repris : les lire dans les séries homogènes `fonction-publique-salaires` et `fonction-publique-salaires-2018-2025`.]
