caveats: [BRUT HORS CONTRIBUTIONS — INFÉRENCE, l'INS ne le dit pas : le tableau est étiqueté « salaire mensuel brut moyen ». Chaîne de preuve : pondérée par les effectifs du tableau 6, la série redonne les fonctionnaires du tableau 11 à 0,2 dinar près les huit années, et le tableau 11 pondéré redonne le brut SANS contributions du tableau 10. NON RACCORDABLE à `ins-salaire-par-categorie` (tab20 de l'enquête 2010-2021), qui est le brut AVEC contributions, pour des effectifs par catégorie pourtant identiques sur 2018-2020 : A1 2018 = 2 561,4 là-bas, 2 175,3 ici. Le rapport tab20/tab12 varie selon la catégorie (2018 : A1 et A2 1,177 ; A3 1,163 ; B 1,164 ; C 1,178 ; D 1,141) et selon l'année (1,16 à 1,20) : aucun coefficient ne raccorde les deux séries. Dinars courants ; moyennes de corps hétérogènes., ÉTIQUETTE CORRIGÉE : le tableau publié nomme sa troisième ligne « Catégorie A2 » en français alors que l'arabe y écrit « أ3 » ; le libellé A2 y paraît deux fois et A3 jamais. Les lignes sont rapprochées par position et l'étiquette rétablie — le CSV s'écarte donc sciemment du libellé publié. Montants en dinars COURANTS, non déflatés : une évolution de niveau ne se lit pas sans indice de prix, un rapport entre catégories se lit. Moyennes par catégorie, qui recouvrent des corps très hétérogènes. Champ : fonctionnaires seuls, d'où un effectif inférieur à celui de la fonction publique. La série s'arrête en 2020, non en 2021 comme celles des effectifs. BRUT AVEC CONTRIBUTIONS — INFÉRENCE, l'INS ne le dit pas (le tableau est étiqueté « salaire mensuel brut ») : pondérée par les effectifs de tab8, la série redonne les fonctionnaires de tab19 à 0,05 dinar près (2018 : 1 943,2), et tab19 pondéré par tab6 redonne le brut AVEC contributions de tab18 (1 716,5 contre 1 716,6). NE SE PROLONGE PAS par `ins-salaire-par-categorie-hors-contributions-2018-2025` (rapport INS 2018-2025, tableau 12), qui est le brut SANS contributions : A1 2018 = 2 561,4 ici, 2 175,3 là, pour des effectifs identiques ; le rapport entre les deux varie de 1,14 à 1,20 selon la catégorie et l'année, et aucun coefficient ne raccorde les deux séries.]
