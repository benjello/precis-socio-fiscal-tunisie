  "definition": "Indemnité propre aux agents des forces de sécurité intérieure, attribuée par un décret du 1er février 1992 avec trois autres indemnités du même corps : l'indemnité de risque, l'indemnité de commandement et de responsabilité et l'indemnité de logement. Pour les agents relevant du ministère de la justice, ses montants sont augmentés par tranches en 2004, puis de 2005 à 2007 (décrets n° 2004-1335 et 2005-3168).",
  "source": "Décret n° 2004-1335 du 7 juin 2004",
  "terme": "Indemnité de charge de sécurité"
 },
 "indemnite-charges-militaires": {
  "autre": "منحة الكلف العسكرية",
  "definition": "Indemnité servie aux officiers, sous-officiers et hommes de troupe des armées de terre, de l'air et de la mer. Instituée pour l'armée de terre par le décret n° 67-158 du 31 mai 1967, puis pour les deux autres armées en 1968, elle est annuelle et son taux dépend du grade et de la situation de famille. Depuis le 1er octobre 2013, elle est majorée d'un montant mensuel uniforme pour tous les grades (décret n° 2013-3797).",
  "source": "Décret n° 67-158 du 31 mai 1967, art. 1er",
  "terme": "Indemnité pour charges militaires"
 },
 "indemnite-compensatrice": {
  "autre": "المنحة التعويضية",
  "definition": "Différentiel alloué lors du passage du calcul indiciaire à la grille en dinars de 1998, égal à l'écart entre l'ancienne rémunération de base de l'agent et l'échelon de la nouvelle grille auquel il est reclassé (décret n°97-1832, art. 6). Ce n'est pas un complément pérenne : elle est maintenue lors des avancements d'échelon mais cesse d'être servie en cas de promotion, de changement de grille ou au terme du dépassement du dernier échelon du grade, l'agent étant alors rangé au traitement immédiatement supérieur à la somme de son traitement et de son indemnité (décret n°97-2127, art. 1 et 2).",
  "source": "Décret n° 97-1832 du 16 septembre 1997, art. 6",
  "terme": "Indemnité compensatrice"
 },
 "indemnite-complementaire-de-responsabilite": {
  "autre": "المنحة التكميلية بعنوان المسؤولية",
  "definition": "Indemnité mensuelle de la première modalité de rémunération d'un chef d'entreprise publique, versée en plus du salaire que le dirigeant percevait légalement juste avant sa nomination. Son montant dépend de la catégorie de l'entreprise ; le décret de 2015 n'en donne aucun pour la catégorie exceptionnelle. Elle se distingue de l'indemnité provisoire pour remboursement des frais liés à la responsabilité du décret n°2014-12.",
  "source": "Décret gouvernemental n° 2015-2217 du 11 décembre 2015, art. 3",
  "terme": "Indemnité complémentaire de responsabilité"
 },
 "indemnite-de-gestion-et-d-execution": {
  "autre": "منحة التصرف والتنفيذ",
  "definition": "Indemnité du corps administratif commun et des grades équivalents de la fonction publique, instituée par le décret n°82-505 du 16 mars 1982. De 1993 à 2013, les augmentations des salaires de ses bénéficiaires prennent la forme d'une majoration de cette indemnité : par cycles de trois ans de 1993 à 2010, chaque tranche prenant effet au 1er juillet ; puis par deux tranches de 35 dinars, au 1er juillet 2012 et au 1er janvier 2013 (décret n°2012-2959). Les autres corps reçoivent leur majoration sur leur indemnité propre, par des décrets parallèles.",
  "source": "Décret n° 93-2062 du 11 octobre 1993",
  "terme": "Indemnité de gestion et d'exécution"
 },
 "indemnite-de-magistrature": {
  "autre": "منحة القضاء",
  "definition": "Indemnité attribuée aux magistrats selon leur grade, qui s'ajoute au traitement de base. Le décret n° 85-814 du 7 juin 1985 l'attribue aux magistrats de l'ordre judiciaire ; les magistrats du Tribunal administratif et de la Cour des comptes ont la leur. Depuis 1999, le traitement de base des magistrats suit la grille des agents de l'État : l'indemnité de magistrature et les avantages d'un emploi fonctionnel attachés au grade sont ce qui distingue leur rémunération.",
  "source": "Décret n° 85-814 du 7 juin 1985",
  "terme": "Indemnité de magistrature"
 },
 "indemnite-de-permanence-magistrats": {
  "autre": "منحة الاستمرار",
  "definition": "Indemnité spécifique instituée au profit des magistrats de l'ordre judiciaire (décret n° 2001-2125, art. 1er), en contrepartie des séances de permanence qu'ils assurent en dehors de l'horaire administratif (art. 2). Servie mensuellement depuis le 1er janvier 2002, selon le grade, elle est soumise à l'impôt sur le revenu et aux retenues au titre de la retraite, de la prévoyance sociale et du capital décès (art. 3).",
  "source": "Décret n° 2001-2125 du 10 septembre 2001, art. 1er à 3",
  "terme": "Indemnité de permanence (magistrats)"
 },
 "indemnite-de-poste": {
  "autre": "منحة المركز",
  "definition": "Indemnité versée aux agents du ministère des affaires étrangères en service à l'étranger, en sus des émoluments de leur grade (décret n° 73-167 du 6 avril 1973). Son taux dépend de la zone du poste, parmi trois zones, et de la tranche d'indice de l'agent (décret n° 73-168 du 6 avril 1973).",
  "source": "Décret n° 73-167 du 6 avril 1973, art. 5",
  "terme": "Indemnité de poste"
 },
 "indemnite-de-representation": {
  "autre": "منحة التمثيل",
  "definition": "Indemnité annuelle allouée aux agents du ministère des affaires étrangères qui dirigent une mission à l'étranger : ambassadeur chef de mission, consul général ou chargé d'affaires dirigeant une mission diplomatique, consul dirigeant un consulat (décret n° 73-167 du 6 avril 1973). Son montant, fonction de la qualité du chef de mission, est fixé par arrêté du Premier ministre.",
  "source": "Décret n° 73-167 du 6 avril 1973, art. 7",
  "terme": "Indemnité de représentation"
 },
 "indemnite-de-responsabilite": {
  "autre": "منحة المسؤولية",
  "definition": "Élément de la deuxième modalité de rémunération d'un chef d'entreprise publique, servi chaque mois avec le traitement de base et l'indemnité de logement, selon la catégorie de l'entreprise. Il réunit les quatre indemnités que prévoyait le décret n°2014-12 (représentation, gestion, frais liés à la responsabilité, indemnité spéciale ou complémentaire) et il est soumis à l'impôt sur le revenu et aux retenues de sécurité sociale.",
  "source": "Décret gouvernemental n° 2015-2217 du 11 décembre 2015, art. 4",
  "terme": "Indemnité de responsabilité"
 },
 "indemnite-encadrement-recherche": {
  "autre": "منحة التأطير والبحث",
  "definition": "Indemnité instituée au profit du corps de l'enseignement supérieur par le décret n° 85-1405 du 8 novembre 1985, et servie aux enseignants chercheurs des universités selon leur grade. Ses taux sont augmentés par des décrets successifs, notamment en 2011 et de 2020 à 2021 ; l'augmentation générale des salaires de 2026 à 2028 est servie aux enseignants chercheurs par son intermédiaire.",
  "source": "Décret n° 85-1405 du 8 novembre 1985",
  "terme": "Indemnité d'encadrement et de recherche"
 },
 "indemnite-parlementaire": {
  "autre": "المنحة البرلمانية",
  "definition": "Indemnité mensuelle versée au président et aux membres de l'assemblée parlementaire pendant leur mandat. Le décret-loi n° 60-9 du 18 février 1960 l'institue et en fixe le montant forfaitaire ; le fonctionnaire élu ne la cumule pas avec son traitement. De 1960 à 1988, la loi fixe son montant ; depuis la loi de finances pour 1989 (art. 72 à 74), un décret le fixe, et l'indemnité peut, à la demande du parlementaire, être calculée sur la base des salaires et indemnités de son grade d'origine dans la fonction publique ou les entreprises publiques. La règle est étendue aux membres de la Chambre des conseillers en 2005.",
  "source": "Décret-loi n° 60-9 du 18 février 1960",
  "terme": "Indemnité parlementaire"
 },
 "indemnite-provisoire-complementaire": {
  "autre": "المنحة الوقتية التكميلية",
  "definition": "Indemnité instituée en 1982 au profit des personnels militaires et des personnels de la police nationale, de la sûreté nationale, de la garde nationale, de la protection civile et des services pénitentiaires et du travail rééducatif (décret n° 82-515 du 16 mars 1982). Elle est commune aux militaires et aux corps de sécurité intérieure, et ne se confond pas avec l'indemnité complémentaire provisoire servie aux agents civils.",
  "source": "Décret n° 82-515 du 16 mars 1982",
  "terme": "Indemnité provisoire complémentaire (militaires et forces de sécurité intérieure)"
 },
 "indemnite-specifique": {
  "autre": "المنحة الخصوصية",
  "definition": "Indemnité propre à chaque corps, s'ajoutant au traitement de base. La recomposition de 2007 (décret n°2007-267) a transféré une partie des indemnités spécifiques de corps vers le traitement de base, à effet du 1ᵉʳ avril 2007.",
  "terme": "Indemnité spécifique"
 },
 "irpp": {
  "acronyme": "IRPP",
  "autre": "الضريبة على دخل الأشخاص الطبيعيين",
  "definition": "Impôt direct et progressif frappant le revenu net global des personnes physiques, retenu à la source sur les salaires (code de l'IRPP et de l'IS, loi n°89-114).",
  "source": "Loi n° 89-114 du 30 décembre 1989",
  "terme": "Impôt sur le revenu des personnes physiques"
 },
 "magistrat": {
  "autre": "القاضي",
  "definition": "Membre d'un corps de magistrats doté d'un statut propre, distinct du statut général de la fonction publique. Le droit tunisien connaît trois statuts distincts : les magistrats de l'ordre judiciaire (loi n°67-29 du 14 juillet 1967), les magistrats du Tribunal administratif (loi n°72-67 du 1ᵉʳ août 1972) et les membres de la Cour des comptes (décret-loi n°70-6 du 26 septembre 1970). Depuis 1999, leurs échelons correspondent aux niveaux de rémunération de la sous-catégorie A1 de la grille des agents de l'État ; ce qui leur est propre tient à leurs indemnités, dont l'indemnité de magistrature.",
  "source": "Loi n° 67-29 du 14 juillet 1967",
  "terme": "Magistrat"
 },
 "mission-budgetaire": {
  "autre": "المهمة",
  "definition": "Ensemble de programmes qui concourent à des politiques publiques déterminées, et des crédits mis à la disposition de chaque chef de mission.",
  "source": "Loi organique n° 2019-15 du 13 février 2019, art. 1er",
  "terme": "Mission budgétaire"
 },
 "niveau-de-remuneration": {
  "autre": "مستوى التأجير",
  "definition": "Rang de la grille des salaires des agents de l'État établie en 1997, à laquelle correspond, dans chaque catégorie ou sous-catégorie de grades, un traitement de base en dinars. Des décrets de concordance, pris corps par corps en 1999 et 2000, font correspondre chaque échelon de chaque grade à un niveau de rémunération et remplacent les classements indiciaires antérieurs. L'agent promu à un grade de la catégorie immédiatement supérieure est reclassé au niveau dont le traitement de base est immédiatement supérieur à celui qu'il percevait (décret n° 97-1832, art. 10, rédaction du décret n° 2007-268). Les militaires et les forces de sécurité intérieure ont une grille de niveaux qui leur est propre.",
  "source": "Décret n° 97-1832 du 16 septembre 1997",
  "terme": "Niveau de rémunération"
 },
 "ouvrier-de-l-etat": {
  "autre": "عامل الدولة",
  "definition": "Agent public relevant du statut du personnel ouvrier de l'État, des collectivités publiques locales et des établissements publics à caractère administratif (décret n°73-384). Distincts des fonctionnaires depuis le statut des ouvriers permanents de 1956, les ouvriers ont toujours été rémunérés sur une grille propre ; ils sont classés par « unités » et apparaissent à ce titre dans les accords salariaux.",
  "terme": "Ouvrier de l'État"
 },
 "pensions-civiles-militaires": {
  "autre": "الجرايات المدنية والعسكرية",
  "definition": "Régime de retraite commun aux agents civils et militaires du secteur public, géré par la Caisse nationale de retraite et de prévoyance sociale (CNRPS) : il n'existe pas de caisse militaire distincte. Ce régime est fixé par la loi n°85-12 du 5 mars 1985 portant régime des pensions civiles et militaires de retraite et des survivants dans le secteur public, modifiée notamment par la loi n°2019-37. Au sein de ce régime commun, le volet militaire connaît des paramètres dérogatoires (durées de services et âges de jouissance différenciés selon le grade).",
  "source": "Loi n° 85-12 du 5 mars 1985",
  "terme": "Pensions civiles et militaires"
 },
 "point-indice": {
  "autre": "قيمة النقطة الاستدلالية",
  "definition": "Notion héritée du modèle français de carrière, qui n'opère pas en Tunisie depuis le 1er janvier 1998. Jusqu'au 31 décembre 1997, des décrets « fixant le traitement global annuel » tenaient ce rôle, en donnant sa valeur en dinars au chiffre indiciaire de chaque emploi. Depuis, aucun texte ne publie de « valeur du point » qui, appliquée à un indice, déterminerait le traitement de base : la grille annexée au décret n°97-1832 fixe les montants directement en dinars (art. 2 bis, inséré par le décret n°2007-268). Le terme subsiste dans le vocabulaire et dans certains décrets de classement des corps.",
  "terme": "Valeur du point d'indice"
 },
 "prime-de-depart-volontaire": {
  "autre": "منحة المغادرة",
  "definition": "Indemnité forfaitaire de départ que l'employeur d'origine verse, en une seule fois et immédiatement, à l'agent public dont la demande de départ volontaire est acceptée (loi n° 2018-5, art. 5). Elle est égale à trente-six salaires mensuels nets, calculés sur le dernier salaire mensuel net perçu, et ne peut dépasser 50 % des salaires nets que l'agent aurait perçus jusqu'à l'âge légal de mise à la retraite. Elle est exonérée de l'impôt sur le revenu et de la retenue à la source.",
  "source": "Loi n° 2018-5 du 23 janvier 2018, art. 5",
  "terme": "Prime de départ volontaire"
 },
 "prime-de-rendement": {
  "autre": "منحة المردودية",
  "definition": "Composante indemnitaire de la rémunération du régime indiciaire, s'ajoutant au traitement de base et aux indemnités spécifiques ; ces composantes sont souvent exclusives les unes des autres.",
  "terme": "Prime de rendement"
 },
 "prime-de-risque": {
  "autre": "منحة الخطر",
  "definition": "Prime mensuelle attribuée aux agents des services douaniers. Depuis le 1er septembre 2013, son montant est le même pour tous les grades, des sous-catégories A1, A2 et A3 aux catégories B, C et D (décret n° 2013-3798, art. 1er) ; il remplace les taux par grade fixés en 1997. Les militaires et les forces de sécurité intérieure perçoivent une indemnité de risque qui leur est propre.",
  "source": "Décret n° 2013-3798 du 25 septembre 2013, art. 1er",
  "terme": "Prime de risque"
 },
 "promotion": {
  "autre": "الترقية",
  "definition": "Accession du fonctionnaire au grade immédiatement supérieur à celui dont il est titulaire (loi n°83-112, art. 28). Elle emprunte deux voies : le concours interne, l'examen professionnel ou le cycle de formation ; ou le choix, sur liste d'aptitude établie après consultation de la commission administrative paritaire. À la différence de l'avancement d'échelon, automatique et lié à l'ancienneté, la promotion fait intervenir la sélection et la manière de servir.",
  "source": "Loi n° 83-112 du 12 décembre 1983, art. 28",
  "terme": "Promotion"
 },
 "recrutement-direct": {
  "autre": "الانتداب المباشر",
  "definition": "Recrutement dans le secteur public sans concours, par dérogation au concours externe sur dossiers et sur épreuves. La loi n° 2012-4 (art. 3) le réserve à un membre de chaque famille des martyrs de la révolution, aux blessés de la révolution et aux bénéficiaires de l'amnistie générale, ou, en cas d'empêchement, à un membre de leur famille. La loi n° 2020-38 le prévoit, par tranches annuelles consécutives, pour les diplômés du supérieur au chômage depuis dix ans et plus, les diplômés chômeurs de 35 ans et plus et un membre de chaque famille dont tous les membres sont au chômage (art. 1er à 3).",
  "source": "Loi n° 2012-4 du 22 juin 2012, art. 3",
  "terme": "Recrutement direct"
 },
 "regime-conventionnel-public": {
  "autre": "النظام الاتفاقي العمومي",
  "definition": "Catégorie d'analyse retenue dans ce précis pour les entreprises publiques non financières. La loi n° 85-78 régit les agents permanents des offices, des établissements industriels et commerciaux et des sociétés à capital entièrement public par des statuts particuliers approuvés par décret. Elle prévoit aussi, à titre transitoire, une option entre statut et convention sectorielle pour certaines sociétés à capital partiellement public.",
  "source": "Loi n° 85-78 du 5 août 1985, art. 1-2 et 75",
  "terme": "Régime conventionnel public"
 },
 "regime-indiciaire": {
  "autre": "النظام الاستدلالي للتأجير",
  "definition": "Régime de rémunération des agents de l'État, des collectivités locales et des établissements publics à caractère administratif, régis par le statut général (loi n°83-112), fondé sur un grade et un échelon. Depuis le 1er janvier 1998, à chaque couple grade × échelon correspond un traitement de base mensuel fixé directement en dinars par la grille annexée au décret n°97-1832 ; depuis le 1er avril 2007, une partie des indemnités spécifiques y est intégrée (décret n°2007-268, art. 2 bis). Le régime doit son nom au mécanisme en vigueur jusqu'au 31 décembre 1997, où un chiffre indiciaire attaché à l'emploi était converti en dinars par un décret distinct ; depuis, aucune « valeur du point » n'opère, et le point d'indice ne subsiste que dans le vocabulaire et dans certains décrets de classement des corps.",
  "terme": "Régime indiciaire"
 },
 "regime-marche-controle": {
  "autre": "نظام السوق الموجَّه",
  "definition": "Catégorie d'analyse retenue dans ce précis pour les entreprises publiques financières : banques et sociétés d'assurance. La rémunération des agents s'y fixe par la convention collective de leur branche, commune aux établissements publics et privés : celle des banques et établissements financiers, révisée et agréée le 17 février 2014 ; celle des assurances, agréée le 24 décembre 1975 pour le secteur entier, révisée en 1983 et suivie de quinze avenants de 1989 à 2022. La rémunération des directeurs généraux des banques publiques relève du décret gouvernemental n°2015-968 du 6 août 2015 : le conseil d'administration l'approuve, sur les éléments fixés par un comité de rémunération. Celle des chefs des autres entreprises publiques et sociétés à majorité publique relève du décret gouvernemental n°2015-2217 du 11 décembre 2015. La convention des assurances ne nomme aucune société.",
  "terme": "Régime de marché contrôlé"
 },
 "regime-statutaire-autonome": {
  "autre": "النظام الأساسي الخاص",
  "definition": "Catégorie retenue dans ce précis pour les corps régis par un statut propre, distinct du statut général de la fonction publique : magistrats, militaires, forces de sécurité intérieure et agents des douanes. Chaque corps reçoit un traitement ou une solde de base, placé depuis 1999-2000 sur une grille de niveaux de rémunération — la grille des agents de l'État pour les magistrats et les douanes, une grille propre aux militaires et aux forces de sécurité intérieure —, et des indemnités fixées corps par corps. Pour les trois premiers, le détachement procède d'une clause d'exclusion de champ, et non d'une sortie progressive : l'article premier de la loi n°83-112 portant statut général les écarte de son champ d'application et les renvoie à leurs textes propres — loi n°67-29 (magistrats de l'ordre judiciaire), loi n°67-20 (militaires), loi n°82-70 (forces de sécurité intérieure). L'autonomie des agents des douanes repose sur leur statut général propre (loi n°95-46 du 15 mai 1995).",
  "source": "Loi n° 83-112 du 12 décembre 1983, art. 1er",
  "terme": "Régime statutaire autonome"
 },
 "remuneration-dirigeants-entreprises-publiques": {
  "autre": "تأجير رؤساء المؤسسات والمنشآت العمومية",
  "definition": "Rémunération des chefs d'entreprises et d'établissements publics et des sociétés à majorité publique, c'est-à-dire des sociétés dont des participants publics et des entreprises publiques détiennent 50 % du capital ou plus. Le décret gouvernemental n°2015-2217 du 11 décembre 2015 en fixe le régime : classement de l'entreprise en six catégories, deux modalités de rémunération au choix du dirigeant, avantages en nature, exclusivité de la rémunération. Les directeurs généraux des banques publiques en sont exclus : ils relèvent du décret gouvernemental n°2015-968 du 6 août 2015. Le décret de 2015 abroge le décret n°90-1855 (1990) et le décret n°2014-12 (2014) ; le décret n°78-885 (1978) ouvre la suite de ces textes.",
  "source": "Décret gouvernemental n° 2015-2217 du 11 décembre 2015",
  "terme": "Rémunération des dirigeants d'entreprises publiques"
 },
 "retenue-a-la-source": {
  "autre": "الخصم من المورد",
  "definition": "Prélèvement de l'impôt opéré par celui qui paie une somme, pour le compte de celui qui la reçoit ; le montant retenu est reversé au Trésor et imputé sur l'impôt dû par ce dernier, sauf quand la loi la rend libératoire ou définitive et non restituable (code, art. 52 et 54). En matière d'impôt sur le revenu des personnes physiques, l'employeur l'opère lors du paiement du traitement et des indemnités imposables (code de l'IRPP et de l'IS, loi n°89-114). En matière de taxe sur la valeur ajoutée, l'État, les collectivités locales, les entreprises et les établissements publics retiennent une part de la taxe facturée par leurs fournisseurs : 50 % à compter de 1998, 25 % à compter de 2016.",
  "source": "Loi n° 89-114 du 30 décembre 1989",
  "terme": "Retenue à la source"
 },
 "salaire-d-efficience": {
  "autre": "أجر الكفاءة",
  "definition": "Salaire fixé au-dessus de celui qui suffirait à pourvoir l'emploi, pour accroître l'effort ou l'intégrité de l'agent : plus le salaire est élevé, plus l'agent perd s'il est révoqué, et plus une faute ou un pot-de-vin lui coûte. L'effet dépend de la probabilité de détection et de la sanction ; quand la détection est rare ou les pots-de-vin élevés, le salaire qui élimine la corruption devient très élevé.",
  "source": "Bureaucratic corruption and the rate of temptation: do wages in the civil service affect corruption, and by how much?",
  "terme": "Salaire d'efficience"
 },
 "service-fait": {
  "autre": "قاعدة الخدمة المنجزة",
  "definition": "Règle selon laquelle le droit à rémunération de l'agent public naît de l'exécution effective du service, et non de sa seule qualité d'agent. Posée par le statut général — les agents « ont droit, après service fait, à une rémunération » (loi n°83-112, art. 13) —, elle prolonge un principe général des finances publiques : aucun paiement ne peut être effectué qu'au véritable créancier justifiant de ses droits et pour l'acquittement d'un service fait (Code de la comptabilité publique, art. 41).",
  "source": "Loi n° 83-112 du 12 décembre 1983, art. 13",
  "terme": "Service fait"
 },
 "service-national": {
  "autre": "الخدمة الوطنية",
  "definition": "Obligation de tout citoyen âgé de vingt ans, qui y demeure tenu jusqu'à trente-cinq ans, ayant pour but la préparation du citoyen à la défense de la patrie et sa participation au développement global du pays (loi n° 2004-1, art. 1er et 2). Il revêt l'une de deux formes : le service militaire actif, ou le service national en dehors des unités des forces armées, auprès des forces de sécurité intérieure, par affectation individuelle dans les administrations et les entreprises ou dans la coopération technique (art. 3 et 4). Il succède au service militaire de la loi n° 67-19.",
  "source": "Loi n° 2004-1 du 14 janvier 2004, art. 1er à 4",
  "terme": "Service national"
 },
 "solde-militaire": {
  "autre": "أجور العسكريين",
