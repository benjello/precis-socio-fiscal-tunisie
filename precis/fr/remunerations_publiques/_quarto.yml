project:
  type: book
  output-dir: public

lang: fr

book:
  title: "Les rémunérations dans le secteur public"
  author: "Mahdi Ben Jelloul"
  repo-url: https://github.com/benjello/precis-socio-fiscal-tunisie/
  repo-subdir: precis/fr/remunerations_publiques
  repo-branch: master
  repo-actions: [edit, issue]
  downloads: [pdf]
  chapters:
    - index.qmd
    - _regime_indiciaire.qmd
    - _regime_statutaire_autonome.qmd
    - _regime_conventionnel.qmd
    - _regime_marche_controle.qmd
  appendices:
    - _glossaire.qmd
    - _references.qmd

bibliography:
  - references.json
  - ../references.json
  - ../references.bib

# Sans style déclaré, citeproc met le titre intégral en position d'auteur, faute d'`author`
# sur les entrées `legislation`. Ce style emploie `title-short`.
csl: ../precis.csl

format:
  html:
    theme: cosmo
    number-depth: 4
    toc: true
    toc-depth: 4
  pdf:
    documentclass: scrreprt
    toc: true
    toc-depth: 4
    number-sections: true
    number-depth: 4
