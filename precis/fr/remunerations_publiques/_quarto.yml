project:
  type: book
  output-dir: public

lang: fr

# Surcharge des libellés d'interface Quarto en arabe (lang: ar ne les traduit
# pas tous). Customisation propre au livre AR.
language:
  toc-title-document: "Table des matières"
  toc-title-website: "Sur cette page"
  repo-action-links-edit: "Modifier cette page"
  repo-action-links-issue: "Signaler un problème"
  repo-action-links-source: "Voir le code source"

book:
  title: "Les rémunérations dans le secteur public"
  author: "Mahdi Ben Jelloul"
  repo-url: https://github.com/benjello/precis-socio-fiscal-tunisie/
  repo-subdir: precis/fr/remunerations_publiques
  repo-branch: master
  repo-actions: [edit, issue]
  chapters:
    - index.qmd
    - _regime_indiciaire.qmd
    - _regime_statutaire_autonome.qmd
    - _regime_conventionnel.qmd
    - _regime_marche_controle.qmd
  appendices:
    - _glossaire.qmd
    - _references.qmd

bibliography:
  - references.json
  - ../references.json
  - ../references.bib

format:
  html:
    theme: cosmo
    number-depth: 3
    toc: true
  pdf:
    documentclass: scrreprt
    toc: true
    number-sections: true
