caveats: [« INTERVENTIONS » N'EST PAS « COMPENSATION » : la colonne dépasse chaque année le poste « transport » (réseau ferroviaire rapide, météorologie, entretien du réseau ferré, apurements de dettes en 2017) ; rapprochement établi pour 2016 seulement, à 0,5 MD près. AUCUN RACCORD avec transport-soutien-par-societe. Toutes les éditions gardées (`derniere_edition` ne préfère pas) ; loi de finances et réalisations d'une même année diffèrent. Édition LF 2020 saisie à l'image : groupes de chiffres imprimés à l'envers, restaurés et prouvés par les sommes (`imprime`, `restauration`) ; en-têtes déplacés dans ses tableaux de 2018 et 2019 (`colonne_imprimee` ≠ `nature`). Éditions arabes : couche texte contrôlée par les identités (ligne et bloc), deux pages relues à l'image. Écarts imprimés d'un millier de dinars déclarés. Éditions LF 2021 et LF 2023 non transcrites., LE PIB N'EST JAMAIS CHAÎNÉ : segment_pib change en 1986, 1992, 1997, 2002, 2005, 2010 et 2025 ; une part du PIB se trace par segments. 1984-1985 : PIB de la Banque mondiale, bases accolées non raccordées ; 1986-1991 : PIB du ministère des Finances, base 1983 PRÉSUMÉE ; 2002-2004 et 2025 : valeur propre au ministère, rattachée à aucune base ; 2010-2014 : base 2015 rétropolée par l'INS. Les dépenses de l'État sont des RÉALISATIONS : rapportée à elles, une prévision de loi de finances donne un ordre de grandeur, non une exécution. AUCUNE DÉPENSE DE L'ÉTAT AVANT 1986.]
