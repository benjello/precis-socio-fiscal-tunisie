caveats: [SÉRIES HORS CATALOGUE : valeurs relevées dans les sources citées, non encore versées au catalogue de données ; chaque ligne garde sa source et sa page. numérateur : gestion et développement de l'Éducation et de l'Enseignement supérieur (tableaux 16.8 et 16.10 de l'Annuaire statistique) ; recherche scientifique exclue ; formation professionnelle exclue. réserve de périmètre : depuis 2019, la recherche n'a plus de ligne de gestion et se trouve comprise dans la gestion de l'Enseignement supérieur ; elle n'en est pas déduite, faute de source qui l'isole ; la série change donc de périmètre entre 2018 et 2019, et les deux segments ne sont pas reliés. lignes de la recherche identifiables (gestion 2009-2018, développement 2009-2023) : copiées hors total, jamais ajoutées au numérateur. part de l'État : dénominateur = dépenses de gestion hors intérêts + dépenses de développement hors principal, lues aux mêmes pages ; commence en 2009 (rupture du développement entre 2008 et 2009). part du PIB : PIB nominal de la série denominateurs-depenses-etat-pib (INS, base 2015, années 2010-2014 rétropolées par l'INS) ; le segment antérieur, en base 1997, n'est pas calculé. contrôle : le numérateur de la note documentaire (recherche comprise) redonne ses deux parts à 0,01 point près ; les parts publiées ici sont recalculées hors recherche. 2017 provisoire (dernière année de l'édition 2013-2017, reprise par les éditions suivantes) : la baisse de 2017 à 2018 tient au stade du chiffre]
