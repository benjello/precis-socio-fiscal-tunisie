caveats: [RUPTURE DE CHAMP EN 2006 : à cette date les recettes des branches de l'assurance maladie et de la réparation des accidents du travail et des maladies professionnelles reviennent à la CNAM, et les cotisations encaissées tombent de 1 351 à 993 MD sans qu'aucun taux ait baissé. La série n'est pas homogène de part et d'autre, et la note figure sur la planche elle-même. MONTANTS COURANTS, non déflatés : une évolution de niveau ne se lit pas sans indice de prix. Les valeurs sont des étiquettes de graphique en TEXTE PIVOTÉ, qui se lisent de bas en haut : assemblées à l'envers elles rendent des nombres crédibles mais absents du document (1 134 devient 1 341). Le contrôle est que les 21 valeurs assemblées reconstituent exactement l'ensemble lu par le flux, qui ne dépend d'aucun ordre. La datation vient de l'abscisse, et 2020 est confirmée par différence entre millésimes : le montant présent dans la planche de 2020 et absent de celle de 2019 est celui de 2020. NE JAMAIS TRIER : la série recule DEUX fois, en 2006 et en 2020 (3 430 MD après 3 445) ; un tri croissant effacerait les deux retournements. Le millésime 2019 n'existe qu'en arabe, la série française du site sautant du tableau 7 au tableau 9.]
