caveats: [RUPTURE DE CHAMP EN 2006 : à cette date les recettes des branches de l'assurance maladie et de la réparation des accidents du travail et des maladies professionnelles reviennent à la CNAM, et les cotisations encaissées tombent de 1 351 à 993 MD sans qu'aucun taux ait baissé. La série n'est pas homogène de part et d'autre, et la note figure sur la planche elle-même. MONTANTS COURANTS, non déflatés : une évolution de niveau ne se lit pas sans indice de prix. Les valeurs sont des étiquettes de graphique en TEXTE PIVOTÉ, qui se lisent de bas en haut : assemblées à l'envers elles rendent des nombres crédibles mais absents du document (1 134 devient 1 341). Le contrôle est que les 21 valeurs assemblées reconstituent exactement l'ensemble lu par le flux, qui ne dépend d'aucun ordre. La datation vient de l'abscisse, et 2020 est confirmée par différence entre millésimes : le montant présent dans la planche de 2020 et absent de celle de 2019 est celui de 2020. NE JAMAIS TRIER : la série recule DEUX fois, en 2006 et en 2020 (3 430 MD après 3 445) ; un tri croissant effacerait les deux retournements. Le millésime 2019 n'existe qu'en arabe, la série française du site sautant du tableau 7 au tableau 9., CE N'EST PAS LE TOTAL DES DÉPENSES. La planche est un histogramme empilé à six composantes dont le total n'est étiqueté que sur quelques colonnes et ne boucle pas partout : en 2015 l'étiquette haute affiche 2 250,7 alors que la seule composante Pensions de cette colonne vaut déjà 2 346,8. Un total inférieur à l'une de ses parts n'est pas un total ; la série des dépenses totales n'est donc pas extraite de cette planche. La composante Pensions, elle, est étiquetée sur les vingt et une colonnes. PIÈGE DE LECTURE : le chiffre des mille est détaché et rendu AU-DESSOUS du reste de l'étiquette (« 079,2 » puis « 1 ») ; assemblé naïvement il produit « 11 » ou « 22 », nombres absurdes qui ne lèvent aucune exception. Le millésime 2018 redonne les vingt premières années avec ZÉRO désaccord, et 2020 est exactement l'année qu'il ne porte pas. La croissance monotone est CONSTATÉE, jamais imposée : aucun tri n'est appliqué. MONTANTS COURANTS, non déflatés. Comparer cette branche aux cotisations tous régimes n'est pas un solde : c'est un taux de couverture.]
