caveats: [SCAN SANS COUCHE TEXTE, valeurs océrisées et contrôlées par les IDENTITÉS COMPTABLES (sous-totaux, totaux, résultat = ressources − emplois, ensemble = somme des régimes) ; colonne `statut` sur chaque valeur (lu, lu_corrige, deduit_identite, masque_reliure). LA RELIURE MASQUE une colonne d'années sur la plupart des tableaux (1999 surtout, 2000 sur certains) : 430 cellules sont rétablies par une identité à une seule inconnue et 68 par le solveur fragments + identités (chiffres visibles lus case par case ; valeur unique compatible avec eux et avec toutes les identités ; validé sans erreur sur 771 valeurs connues masquées à l'identique), jamais devinées dans la colonne `valeur` ; 360 y restent vides, listées avec leur fragment visible dans cnss_retrospective_valeurs_a_retrouver.csv (221 à lire sur l'original, le reste s'en déduit). ESTIMATIONS PROVISOIRES : en attendant l'original, ces 360 cellules (1999 surtout, quelques-unes de 2000) reçoivent une estimation tracée (colonnes `estimation`, `methode_estimation`, `incertitude` ; tendance de la ligne, candidats compatibles avec les chiffres visibles, mise en cohérence avec les identités comptables), et `valeur_ou_estimation` réunit valeurs et estimations pour l'exploitation directe : les valeurs 1999 — et certaines de 2000 — de cette colonne sont donc pour partie des ESTIMATIONS, à ne pas citer comme données publiées. Estimations publiées et versionnées dans cnss_retrospective_estimations.csv, remplacées quand l'original est relu. Quatorze identités s'écartent de 2 mD entre valeurs imprimées vérifiées à l'image (totaux 2004 de tableaux jumeaux, emplois 1996) : écarts de la source, laissés tels quels. Unité : milliers de dinars (les cotisations 2000-2004 recoupent la série cnss-cotisations, en millions, à 1 % près). Comptabilité « Bilans » (droits constatés) : ne pas confondre avec les cotisations encaissées. Montants courants, non déflatés., RUPTURE DE CHAMP EN 2006 : à cette date les recettes des branches de l'assurance maladie et de la réparation des accidents du travail et des maladies professionnelles reviennent à la CNAM, et les cotisations encaissées tombent de 1 351 à 993 MD sans qu'aucun taux ait baissé. La série n'est pas homogène de part et d'autre, et la note figure sur la planche elle-même. MONTANTS COURANTS, non déflatés : une évolution de niveau ne se lit pas sans indice de prix. Les valeurs sont des étiquettes de graphique en TEXTE PIVOTÉ, qui se lisent de bas en haut : assemblées à l'envers elles rendent des nombres crédibles mais absents du document (1 134 devient 1 341). Le contrôle est que les 21 valeurs assemblées reconstituent exactement l'ensemble lu par le flux, qui ne dépend d'aucun ordre. La datation vient de l'abscisse, et 2020 est confirmée par différence entre millésimes : le montant présent dans la planche de 2020 et absent de celle de 2019 est celui de 2020. NE JAMAIS TRIER : la série recule DEUX fois, en 2006 et en 2020 (3 430 MD après 3 445) ; un tri croissant effacerait les deux retournements. Le millésime 2019 n'existe qu'en arabe, la série française du site sautant du tableau 7 au tableau 9., sources/minfinances-recettes-fiscales.md]
