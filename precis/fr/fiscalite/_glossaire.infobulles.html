  "autre": "النفقات الجبائية",
  "definition": "Au sens du rapport annexé au projet de loi de finances pour 2021, dispositions légales qui dérogent au système fiscal de référence et allègent la charge fiscale d'une catégorie de contribuables ou de certaines opérations ou activités, au prix d'un manque de ressources pour le Trésor, afin d'atteindre des objectifs économiques, sociaux, culturels ou environnementaux. La loi organique du budget range « un rapport sur les dépenses fiscales et les avantages financiers octroyés » parmi les documents qui accompagnent le projet de loi de finances (art. 46).",
  "source": "Rapport sur les dépenses fiscales et les avantages financiers, annexe au projet de loi de finances, rapport annexé au projet de loi de finances pour 2021, section 1, § 2",
  "terme": "Dépenses fiscales"
 },
 "detournement-creation-commerce": {
  "autre": "تحويل التجارة وإنشاء التجارة",
  "definition": "Les deux effets d'un accord commercial préférentiel sur les échanges. L'accord crée du commerce quand les importations du partenaire remplacent une production intérieure plus coûteuse ; il en détourne quand elles remplacent les importations d'un fournisseur extérieur plus efficace. Dans un pays qui taxait ces importations, le détournement se paie aussi en recette douanière perdue.",
  "source": "Regional Trade Agreements, p. 4",
  "terme": "Détournement et création de commerce"
 },
 "djemaia-habous": {
  "autre": "جمعية الأحباس",
  "definition": "",
  "source": "Décret du 31 mai 1956 (20 chaoual 1375), portant prise en charge par l'État des dépenses à caractère religieux ou social de la djemaïa des habous, transférant les biens habous publics au domaine de l'État et prononçant la mise en liquidation de la djemaïa des habous",
  "terme": "Djemaïa des habous"
 },
 "droit-a-deduction-tva": {
  "autre": "حق الطرح",
  "definition": "Droit, pour l'assujetti, de retrancher de la TVA due sur ses opérations taxables celle qui a grevé ses achats, ses importations et les biens et services nécessaires à son exploitation, immobilisations comprises. L'imputation est globale ; ce qui n'a pu être imputé est reporté sur les mois suivants et forme le crédit de TVA.",
  "source": "Loi n° 88-61 du 2 juin 1988, art. 9",
  "terme": "Droit à déduction"
 },
 "droit-apport": {
  "autre": "معلوم تسجيل الحصص",
  "definition": "Droit d'enregistrement proportionnel dû sur les actes de formation et de prorogation d'une société, assis sur la valeur des apports (n° 55 du tarif annexé au décret organique sur l'enregistrement du 19 avril 1912 ; taux du décret n° 68-104 et de la loi de finances pour 1969). Le tarif du code des droits d'enregistrement et de timbre de 1993 ne le comporte plus : les actes de société y supportent un droit fixe par acte.",
  "source": "Décret n° 68-104 du 20 avril 1968",
  "terme": "Droit d'apport"
 },
 "droit-compensateur-provisoire": {
  "autre": "المعلوم التكميلي المؤقت",
  "definition": "Droit dû, en plus des droits de douane, à l'importation de certaines matières et produits quelle que soit leur origine, liquidé et contrôlé comme les droits de douane. Institué au 2 janvier 1991, appelé droit complémentaire provisoire à partir de 1994, il est supprimé à compter du 31 décembre 1997. Il est distinct du droit compensateur qui frappe les importations subventionnées.",
  "source": "Loi n° 90-111 du 31 décembre 1990, art. 26",
  "terme": "Droit compensateur provisoire"
 },
 "droit-complementaire-immeubles": {
  "autre": "معلوم التسجيل التكميلي",
  "definition": "",
  "source": "Loi n° 2016-78 du 17 décembre 2016, art. 29",
  "terme": "Droit complémentaire"
 },
 "droit-consolide": {
  "autre": "المعاليم الديوانية المثبتة",
  "definition": "Taux de droit de douane inscrit dans la liste d'engagements de la Tunisie au GATT, puis à l'Organisation mondiale du commerce, et que le taux appliqué ne peut dépasser. Les lois de finances réservent ces taux quand elles relèvent les droits ; celle pour 2005 a soumis des produits agricoles et textiles aux taux consolidés à l'issue de l'Uruguay Round.",
  "source": "Loi n° 2004-90 du 31 décembre 2004, art. 28",
  "terme": "Droit consolidé"
 },
 "droit-de-consommation": {
  "autre": "المعلوم على الاستهلاك",
  "definition": "Impôt indirect frappant, à l'importation comme à la fabrication locale, des produits que la loi ne définit pas par leur nature mais désigne un à un par leur position tarifaire, dans un tableau qui lui est annexé. Institué par la loi n° 88-62 du 2 juin 1988, le même jour que le code de la TVA. Il ne se superpose pas simplement à la taxe sur la valeur ajoutée : il entre dans l'assiette de celle-ci, la TVA se liquidant sur un prix droit de consommation compris.",
  "source": "Loi n° 88-62 du 2 juin 1988, art. 1er",
  "terme": "Droit de consommation"
 },
 "droit-fixe-enregistrement": {
  "autre": "المعلوم القار",
  "definition": "Droit d'enregistrement d'un montant déterminé, indépendant de la valeur de l'acte, dû par acte ou par page (code des droits d'enregistrement et de timbre, art. 23 et 24). Il frappe les actes que le tarif ne taxe pas à proportion de leur valeur : actes de sociétés, actes sans tarif propre, certains baux, et les mutations que la loi place sous ce régime. Son montant est relevé par les lois de finances.",
  "source": "Loi n° 93-53 du 17 mai 1993, art. 23",
  "terme": "Droit fixe"
 },
 "droit-forfaitaire-simplifie-tva": {
  "autre": "الأداء التقديري المبسط",
  "definition": "Régime historique institué par la loi de finances pour 1990 pour certains petits professionnels et artisans. Son montant dépendait du nombre de salariés et de la zone d'activité, avec des barèmes propres aux cafés de première catégorie et aux coiffeurs pour hommes. Il a été abrogé par la loi de finances pour 1993.",
  "source": "Loi n° 89-115 du 30 décembre 1989, art. 26",
  "terme": "Droit forfaitaire simplifié"
 },
 "droit-inscription-fonciere": {
  "autre": "معلوم الترسيم العقاري",
  "definition": "",
  "terme": "Droit d'inscription foncière"
 },
 "droit-mutation": {
  "autre": "معلوم نقل الملكية",
  "definition": "",
  "terme": "Droit de mutation"
 },
 "droit-progressif-terrains": {
  "autre": "المعلوم التصاعدي",
  "definition": "",
  "terme": "Droit progressif (terrains d'habitat)"
 },
 "droit-proportionnel-enregistrement": {
  "autre": "المعلوم النسبي",
  "definition": "Droit d'enregistrement égal à un pourcentage de la valeur, du prix ou du montant que l'acte constate (code des droits d'enregistrement et de timbre, art. 20) : mutations d'immeubles et de fonds de commerce, baux, ventes publiques de meubles, jugements, marchés. Il ne peut être inférieur au minimum de perception.",
  "source": "Loi n° 93-53 du 17 mai 1993, art. 20",
  "terme": "Droit proportionnel"
 },
 "droit-timbre": {
  "autre": "معلوم الطابع الجبائي",
  "definition": "Impôt dû sur un document, quel que soit l'acte ou l'opération qu'il constate : actes et registres, effets de commerce, factures, recharges téléphoniques, passeports, cartes et autres documents administratifs. Son tarif, fixé par l'article 117 du code des droits d'enregistrement et de timbre, est un montant par feuille, par document ou par copie, ou un montant par dinar payé. Il se paie par timbres mobiles ou selon les autres modes que fixe le code (art. 119 à 128).",
  "source": "Loi n° 93-53 du 17 mai 1993, art. 117",
  "terme": "Droit de timbre"
 },
 "droits-actes-transactions": {
  "autre": "معاليم على العقود والمبادلات",
  "definition": "Rubrique des recettes fiscales au tableau A des lois de finances, dont le périmètre change en 2020. Jusqu'en 2019, c'est le titre d'un groupe qui réunit le droit de timbre, les droits de mutation, les autres droits d'enregistrement et la taxe unique sur les assurances. Depuis 2020, c'est une ligne (18-02) de la catégorie « Autres impôts et taxes », à côté du droit de timbre (18-01) et de la taxe unique sur les assurances (18-04). Notion budgétaire, sans définition légale.",
  "source": "Loi n° 2019-78 du 23 décembre 2019, tableau A, p. 4441",
  "terme": "Droits sur les actes et transactions"
 },
 "droits-de-douane": {
  "autre": "المعاليم الديوانية",
  "definition": "Droits dus à l'importation des marchandises, au taux que fixe le tarif des droits de douane pour chaque position tarifaire, sauf dérogations prévues par les traités et conventions commerciaux en vigueur. Depuis la loi n° 89-113, il n'existe pas de tarif de droits de douane à l'exportation. Les droits sont liquidés sur la valeur en douane, au tarif en vigueur à la date d'enregistrement de la déclaration en détail.",
  "source": "Loi n° 89-113 du 30 décembre 1989, art. 1",
  "terme": "Droits de douane"
 },
 "droits-enregistrement": {
  "autre": "معاليم التسجيل",
  "definition": "Impôts perçus à l'occasion de la formalité de l'enregistrement d'un acte, d'une mutation ou d'un jugement : mutations d'immeubles et de fonds de commerce, successions et donations, actes de sociétés, marchés, baux, jugements. Ils prennent la forme d'un droit proportionnel ou progressif, assis sur la valeur, ou d'un droit fixe, par acte ou par page. Ils forment la première partie du code des droits d'enregistrement et de timbre de 1993.",
  "source": "Loi n° 93-53 du 17 mai 1993, art. 1 à 116",
  "terme": "Droits d'enregistrement"
 },
 "duree-constatation-credit-tva": {
  "autre": "مدة تسجيل فائض الأداء على القيمة المضافة بالتصاريح",
  "definition": "Nombre de déclarations consécutives sur lesquelles le crédit de TVA doit apparaître avant que sa restitution puisse être demandée : douze mois en 1988 pour le crédit de droit commun, six mois depuis 1999. Depuis 2007, une seule déclaration mensuelle suffit pour l'exportation, les ventes en suspension et la retenue à la source, trois mois pour l'investissement, six mois dans les autres cas. Le terme vient de la doctrine administrative, non du code.",
  "source": "Note commune n° 14/2007 — Commentaire des dispositions des articles 15 et 16 de la loi n° 2006-80 du 18 décembre 2006, relatives à l'amélioration de la restitution du crédit de la taxe sur la valeur ajoutée",
  "terme": "Durée de constatation du crédit de TVA"
 },
 "effet-cascade": {
  "autre": "الأثر التراكمي",
  "definition": "Cumul d'un impôt prélevé à chaque étape d'une chaîne de production, sans crédit pour l'impôt payé aux étapes antérieures, de sorte que la charge finale dépend du nombre d'étapes. Selon Matheson (2011), un impôt sur les transactions intermédiaires se cumule ainsi selon l'intensité en transactions de chaque secteur, et pousse les entreprises à s'intégrer verticalement pour l'éviter.",
  "source": "Taxing Financial Transactions: Issues and Evidence, p. 25",
  "terme": "Effet cascade"
 },
 "effet-de-verrouillage": {
  "autre": "أثر التجميد",
  "definition": "Incitation à conserver un bien dont la valeur a augmenté, pour différer l'impôt sur la plus-value, dû seulement à la cession. Selon la Mirrlees Review (2011), cet effet naît de l'imposition de la plus-value à sa réalisation, sans ajustement qui la rende équivalente à une imposition à mesure que la plus-value se forme.",
  "source": "Tax by Design: The Mirrlees Review, p. 296",
  "terme": "Effet de verrouillage"
 },
 "entrepositaire": {
  "autre": "أرباب المخازن",
  "definition": "Personne qui détient en entrepôt des boissons alcoolisées, des vins ou des bières. L'article 2 de la loi n° 88-62 range les entrepositaires et les commerçants de gros de ces produits parmi les assujettis au droit de consommation, aux côtés des fabricants de bière, des embouteilleurs de vin et des fabricants de tout autre produit soumis ; une cinquième catégorie a été ajoutée en 2008, la Société tunisienne de l'électricité et du gaz, au titre du gaz naturel carburant. L'importateur ne figure pas dans cette énumération, alors même que le dédouanement est un fait générateur : à l'importation, le dispositif tient par la liquidation en douane plutôt que par la qualité d'assujetti, et aucun des textes lus ne commente cette articulation. L'article 4 neutralise par ailleurs l'effet du droit sur les marges des entrepositaires, qui le retransmettent à leurs clients pour les mêmes montants.",
  "source": "Loi n° 88-62 du 2 juin 1988, art. 2-4",
  "terme": "Entrepositaire"
 },
 "entreprise-totalement-exportatrice": {
  "autre": "المؤسسات المصدرة كليا",
  "definition": "Entreprises qui vendent la totalité de leurs marchandises ou de leurs produits, ou rendent la totalité de leurs services, à l'étranger, et celles qui rendent la totalité de leurs services en Tunisie pour un usage à l'étranger (article 69 du code de l'impôt sur le revenu des personnes physiques et de l'impôt sur les sociétés, dans la rédaction de la loi n° 2017-8). Le même article les autorise à écouler sur le marché local une part de leur production dans la limite de 30 % de leur chiffre d'affaires à l'export de l'année précédente. La notion vient du code d'incitations aux investissements de 1993 (article 10) ; l'article 69 est abrogé par la loi de finances pour 2019 (article 37).",
  "source": "Loi n° 2017-8 du 14 février 2017, art. 1er (art. 69 nouveau du code de l'IRPP et de l'IS)",
  "terme": "Entreprises totalement exportatrices"
 },
 "enzel": {
  "autre": "الإنزال",
  "definition": "",
  "terme": "Enzel"
 },
 "evasion-tarifaire": {
  "autre": "التهرب من المعاليم الديوانية",
  "definition": "Soustraction aux droits de douane par une déclaration inexacte des importations, notamment par la minoration des prix unitaires déclarés. Elle se mesure par l'écart entre les exportations vers la Tunisie que déclarent les pays partenaires et les importations des mêmes produits déclarées en douane.",
  "source": "Political Connections and Tariff Evasion: Evidence from Tunisia",
  "terme": "Évasion tarifaire"
 },
 "exoneration-tva": {
  "autre": "الإعفاء",
  "definition": "Dispense de taxe accordée à une opération qui entre pourtant dans le champ d'application. Elle se distingue du hors-champ, qui n'y entre pas, et prive en principe du droit à déduction.",
  "source": "Loi n° 88-61 du 2 juin 1988, art. 4",
  "terme": "Exonération de TVA"
 },
 "facturation-identique": {
  "autre": "الفوترة بنفس المبلغ",
  "definition": "Obligation faite aux commerçants assujettis à la taxe sur la valeur ajoutée qui commercialisent des produits soumis au droit de consommation de facturer à leurs clients le droit supporté lors de l'acquisition des mêmes produits, ce droit étant alors déductible. Ajoutée à l'article 5 de la loi n° 88-62 par l'article 34 de la loi de finances pour 1990, elle prolonge en aval le mécanisme d'imputation. L'article 4 de la loi de 1988 posait déjà une règle voisine pour les boissons alcoolisées, retransmises aux clients pour les mêmes montants supportés.",
  "source": "Loi n° 89-115 du 30 décembre 1989, art. 34",
  "terme": "Facturation à l'identique"
 },
 "fait-generateur-droit-consommation": {
  "autre": "الحدث المتولد عنه المعلوم على الاستهلاك",
  "definition": "Événement qui rend le droit de consommation exigible. L'article 3 de la loi n° 88-62 n'en retient que deux : le dédouanement du produit à l'importation, la livraison du produit en régime intérieur. La rédaction est plus étroite que celle du code de la taxe sur la valeur ajoutée — ni livraison à soi-même, ni prestation de service, ni travaux immobiliers —, l'impôt étant assis sur des produits et non sur des opérations de toute nature.",
  "source": "Loi n° 88-62 du 2 juin 1988, art. 3",
  "terme": "Fait générateur du droit de consommation"
 },
 "fait-generateur-tva": {
  "autre": "الحدث المنشئ للأداء",
  "definition": "Événement qui rend la taxe exigible : la livraison pour les biens, l'encaissement du prix pour les services, le dédouanement à l'importation. À distinguer de la date à laquelle la taxe est payée.",
  "source": "Loi n° 88-61 du 2 juin 1988, art. 5",
  "terme": "Fait générateur de la TVA"
 },
 "fodec": {
  "autre": "المعلوم لفائدة صندوق تنمية القدرة التنافسية في قطاعات الصناعة والخدمات والصناعات التقليدية",
  "definition": "Taxe professionnelle dont le produit est affecté au fonds de développement de la compétitivité dans les secteurs industriel, de services et de l'artisanat, compte spécial du Trésor. Elle est due sur les produits fabriqués localement ou importés et sur les services d'une liste fixée par décret : sur le chiffre d'affaires hors taxe sur la valeur ajoutée des fabricants et des prestataires, et sur la valeur en douane des importations. Les produits et services exportés en sont exonérés. Créée en 1995 sur une liste de produits industriels, elle est étendue aux services en 2011.",
  "source": "Loi n° 2010-58 du 17 décembre 2010, art. 14-16",
  "terme": "Taxe au profit du fonds de développement de la compétitivité dans les secteurs industriel, de services et de l'artisanat"
 },
 "fonds-de-commerce": {
  "autre": "الأصول التجارية",
  "definition": "Élément du patrimoine d'un commerçant. Sa mutation à titre onéreux est soumise à un droit d'enregistrement proportionnel (code des droits d'enregistrement et de timbre, art. 20). L'article 88 de la loi de finances pour 2026 range les fonds de commerce parmi les biens soumis à l'impôt sur la fortune, à côté des immeubles et des meubles, et en exclut ceux qui sont effectivement exploités.",
  "source": "Loi n° 2025-17 du 12 décembre 2025, art. 88 § 3",
  "terme": "Fonds de commerce"
 },
 "fonds-special-tresor": {
  "autre": "الحسابات الخاصة في الخزينة",
  "definition": "Compte du Trésor auquel la loi de finances affecte des recettes et dont elle arrête chaque année les prévisions dans un tableau annexé. La loi de finances pour 1971 (art. 48) fait de la Caisse générale de compensation un fonds spécial du Trésor, auquel reviennent les taxes et redevances de compensation.",
  "source": "Loi n° 70-66 du 31 décembre 1970, art. 48",
  "terme": "Fonds spéciaux du Trésor"
 },
 "formalite-enregistrement": {
  "autre": "إجراء التسجيل",
  "definition": "Présentation d'un acte, d'une déclaration ou d'un jugement au receveur de l'enregistrement, qui perçoit les droits dus. Le code des droits d'enregistrement et de timbre (art. 1 à 15) dresse la liste des actes obligatoirement enregistrés et fixe les délais ; un acte qui n'y figure pas peut être présenté volontairement.",
  "source": "Loi n° 93-53 du 17 mai 1993, art. 1 à 15",
  "terme": "Formalité de l'enregistrement"
 },
 "frais-professionnels": {
  "autre": "المصاريف المهنية",
  "definition": "Déduction forfaitaire opérée sur les traitements et salaires pour la détermination du revenu net, fixée à 10 % du reliquat après déduction des retenues sociales obligatoires. L'article 14 § 2 de la loi de finances pour 2017 en a plafonné le montant à 2 000 dinars par an.",
  "source": "Code de l'IRPP et de l'IS, art. 26, § I",
  "terme": "Frais professionnels"
 },
 "gel-credit-tva": {
  "autre": "تجميد فائض الأداء على القيمة المضافة (1998)",
  "definition": "Mesure ponctuelle de la loi de finances pour 1999, qui n'est plus en vigueur : le crédit de TVA dégagé au 31 décembre 1998 cesse d'ouvrir droit à déduction à partir du 1er janvier 1999 et devient une créance remboursée par sixièmes semestriels, à condition d'avoir été demandée avant le 30 juin 1999. En sont exclus les crédits de l'exportation, des ventes en suspension, de la retenue à la source sur les marchés publics et des investissements de création et de mise à niveau.",
  "source": "Loi n° 98-111 du 28 décembre 1998, art. 53 à 55",
  "terme": "Gel du crédit de TVA (1998)"
 },
 "habitation-principale": {
  "autre": "المسكن الرئيسي",
  "definition": "Logement où le redevable a son habitation principale, exclu de l'impôt sur la fortune immobilière puis de l'impôt sur la fortune, avec, depuis 2026, le mobilier qui y est utilisé. La loi ne la définit pas ; l'administration l'entend quelle qu'en soit la valeur ou la surface, dépendances comprises, la preuve se faisant par une attestation des services compétents.",
  "source": "Décret-loi n° 2022-79 du 22 décembre 2022, art. 23 § 3",
  "terme": "Habitation principale"
 },
 "habous": {
  "autre": "الأحباس",
  "definition": "",
  "source": "Décret du 18 juillet 1957 (20 doul hidja 1376), portant abolition du régime des habous privés et mixtes, art. 4",
  "terme": "Habous"
 },
 "immatriculation-fonciere": {
  "autre": "التسجيل العقاري",
  "definition": "",
  "source": "Loi du 1er juillet 1885 (19 ramadan 1302) sur la propriété foncière, art. 18-22",
  "terme": "Immatriculation foncière"
 },
 "immeubles-non-immatricules": {
  "autre": "العقارات غير المرسمة",
  "definition": "",
  "terme": "Immeubles non immatriculés"
 },
 "impot-foncier-2014": {
  "autre": "الضريبة العقارية (2014)",
  "definition": "Impôt sur les immeubles détenus par les personnes physiques, droits qui s'y rattachent compris, égal à une fois et demie la taxe sur les immeubles bâtis ou la taxe sur les immeubles non bâtis, institué par l'article 55 de la loi de finances pour 2014. L'article 38 de la loi de finances complémentaire pour 2014 en a supprimé les dispositions à compter du 1er janvier 2014.",
  "source": "Loi n° 2013-54 du 30 décembre 2013, art. 55",
  "terme": "Impôt foncier (2014)"
 },
 "impot-fortune": {
  "autre": "الضريبة على الثروة",
  "definition": "Impôt dû au 1er janvier de chaque année par les personnes physiques sur la valeur, nette des dettes que le texte admet en déduction, de leurs immeubles, fonds de commerce et meubles, y compris ceux de leurs enfants mineurs à charge, lorsqu'elle atteint 3 millions de dinars. Institué par l'article 88 de la loi de finances pour 2026 à compter du 1er janvier 2026, il abroge et remplace l'impôt sur la fortune immobilière de 2023. Il n'est codifié dans aucun code ; sa procédure relève du code des droits et procédures fiscaux.",
  "source": "Loi n° 2025-17 du 12 décembre 2025, art. 88",
  "terme": "Impôt sur la fortune"
 },
 "impot-fortune-immobiliere": {
  "autre": "الضريبة على الثروة العقارية",
  "definition": "Impôt exigible au 1er janvier de chaque année, de 2023 à 2025, sur les immeubles des personnes physiques, y compris ceux de leurs enfants mineurs sous leur tutelle, dont la valeur, nette des dettes que le texte admet en déduction, atteignait 3 millions de dinars ; son taux était de 0,5 %. Institué par l'article 23 du décret-loi n° 2022-79 portant loi de finances pour 2023, il a été abrogé et remplacé, à compter du 1er janvier 2026, par l'impôt sur la fortune.",
  "source": "Décret-loi n° 2022-79 du 22 décembre 2022, art. 23",
  "terme": "Impôt sur la fortune immobilière"
 },
 "impot-societes": {
  "acronyme": "IS",
  "autre": "الضريبة على الشركات",
  "definition": "Impôt direct frappant les bénéfices des personnes morales, régi par le code de l'impôt sur le revenu des personnes physiques et de l'impôt sur les sociétés, promulgué par la loi n° 89-114 du 30 décembre 1989 et applicable aux bénéfices réalisés à compter du 1er janvier 1990. Il partage ce code avec l'impôt sur le revenu, dont il reprend par renvoi une partie des règles d'assiette. Il a remplacé l'impôt sur les bénéfices des sociétés de l'article 9 de la loi n° 85-109 du 31 décembre 1985.",
  "source": "Loi n° 89-114 du 30 décembre 1989, art. 1er et 45",
  "terme": "Impôt sur les sociétés"
 },
 "impot-transactions": {
  "autre": "الأداء على المعاملات",
  "definition": "Impôt assis sur l'échange d'un bien — action, immeuble, terrain — plutôt que sur sa détention ou sur le revenu qu'il procure (transactions tax). Selon la Mirrlees Review (2011), un tel impôt réduit le nombre des échanges profitables aux deux parties, de sorte que les biens ne sont plus nécessairement détenus par ceux qui leur accordent le plus de valeur ; il pèse d'autant plus sur un bien que celui-ci change souvent de mains. Le droit de mutation sur les immeubles en est un exemple.",
  "source": "Tax by Design: The Mirrlees Review, p. 151-152 et 403",
  "terme": "Impôt sur les transactions"
 },
 "impots-directs": {
  "autre": "الأداءات المباشرة",
  "definition": "Impôts qui atteignent, avec une certaine périodicité, une matière imposable stable ou régulièrement renouvelée, comme un revenu ou un bénéfice. En Tunisie, l'impôt sur le revenu des personnes physiques et l'impôt sur les sociétés ; le même critère y rattache l'impôt sur la fortune, dû chaque année sur le patrimoine détenu au 1er janvier. La loi organique du budget les énumérait, sans les définir, parmi les recettes de l'État, sous l'intitulé « impôts directs ordinaires » à partir de 1996, jusqu'à la loi organique du budget de 2019.",
  "source": "Droit. Axe 4 : Droit fiscal, p. 14-16",
  "terme": "Impôts directs"
 },
 "impots-indirects": {
  "autre": "الأداءات والمعاليم غير المباشرة",
  "definition": "Impôts qui frappent des opérations intermittentes ou successives, à l'occasion de la production, de l'échange ou de la consommation d'un bien. En Tunisie, la taxe sur la valeur ajoutée, les droits de consommation, les droits de douane, les droits d'enregistrement et le timbre. La loi organique du budget les énumérait, sans les définir, parmi les recettes de l'État, sous l'intitulé « impôts et taxes indirects ordinaires » à partir de 1996, jusqu'à la loi organique du budget de 2019.",
  "source": "Droit. Axe 4 : Droit fiscal, p. 14-16",
  "terme": "Impôts indirects"
 },
 "imputation-droit-consommation": {
  "autre": "خصم المعلوم على الاستهلاك",
  "definition": "Faculté reconnue aux assujettis d'imputer sur le droit de consommation dû celui qui a grevé leurs acquisitions auprès d'autres assujettis et leurs propres importations de matières ou produits entrant intégralement dans la composition du produit final soumis ; le reliquat non imputé sur un mois est reporté sur les mois suivants. Le mécanisme est voisin de la déduction de taxe sur la valeur ajoutée, mais plus étroit, puisqu'il suppose l'incorporation intégrale de la matière au produit final. C'est par lui que le droit de consommation se distingue d'une accise ordinaire.",
  "source": "Loi n° 88-62 du 2 juin 1988, art. 5",
  "terme": "Imputation du droit de consommation"
 },
 "incidence-fiscale": {
  "autre": "توزيع العبء الجبائي",
  "definition": "Répartition de la charge réelle d'un impôt entre les agents — acheteurs et vendeurs, employeurs et salariés —, distincte de la désignation de la personne légalement redevable. Selon la Mirrlees Review (2011), supporte l'impôt celui dont il réduit le bien-être, qui n'est pas nécessairement celui qui le verse ; selon Alm, Annez et Modi (2004), la répartition d'un droit de mutation entre acheteur et vendeur dépend des élasticités de la demande et de l'offre.",
  "source": "Tax by Design: The Mirrlees Review, p. 27-28",
  "terme": "Incidence fiscale"
 },
 "irpp": {
  "acronyme": "IRPP",
  "autre": "الضريبة على دخل الأشخاص الطبيعيين",
  "definition": "Impôt direct et progressif frappant le revenu net global des personnes physiques, retenu à la source sur les salaires (code de l'IRPP et de l'IS, loi n°89-114).",
  "source": "Loi n° 89-114 du 30 décembre 1989",
  "terme": "Impôt sur le revenu des personnes physiques"
 },
 "liquidite-marche": {
  "autre": "السيولة",
  "definition": "Facilité avec laquelle un titre s'achète ou se vend rapidement, en quantité, sans que l'opération déplace sensiblement son prix. Selon Matheson (2011), un droit sur les transferts de titres renchérit chaque échange et réduit la liquidité du marché.",
  "source": "Taxing Financial Transactions: Issues and Evidence, p. 16",
  "terme": "Liquidité"
 },
 "livraison-a-soi-meme": {
  "autre": "التسليم للنفس",
  "definition": "Opération par laquelle un assujetti utilise pour ses propres besoins un bien qu'il a produit. Elle est imposable, afin de ne pas avantager celui qui produit sur celui qui achète.",
  "source": "Loi n° 88-61 du 2 juin 1988, art. 1er § II-9 et 10 ; art. 5 § 4",
  "terme": "Livraison à soi-même"
 },
 "livre-foncier": {
  "autre": "السجل العقاري",
  "definition": "",
  "source": "Loi du 1er juillet 1885 (19 ramadan 1302) sur la propriété foncière, art. 21",
  "terme": "Livre foncier"
 },
 "melk": {
  "autre": "الملك",
  "definition": "",
  "source": "Pour une nouvelle stratégie de l'habitat : accès au foncier. Rapport provisoire, diagnostics et recommandations, p. 6",
  "terme": "Melk"
 },
 "minimum-impot": {
  "autre": "الضريبة الدنيا",
  "definition": "Montant plancher d'impôt annuel, calculé en pourcentage du chiffre d'affaires ou des recettes brutes, en deçà duquel l'impôt liquidé selon le barème ne peut descendre pour les activités commerciales et non commerciales (article 44 § II du code de l'IRPP et de l'IS). Il ne se confond pas avec le minimum de l'article 12 bis de la loi n° 89-114, qui borne l'effet de certaines déductions et s'assied sur l'impôt dû sans elles.",
  "source": "Code de l'IRPP et de l'IS, art. 44, § II",
  "terme": "Minimum d'impôt"
 },
 "minimum-impot-chiffre-affaires": {
  "autre": "الضريبة الدنيا",
  "definition": "Plancher de l'impôt annuel, prévu au paragraphe II de l'article 49 du code : une fraction du chiffre d'affaires brut, assortie d'un montant minimal exigible même en l'absence de chiffre d'affaires. Il ne se confond ni avec le minimum d'impôt de l'article 12 bis de la loi n° 89-114, qui plafonne les avantages fiscaux et s'assied sur l'impôt théorique, ni avec celui de l'article 44 § II, qui en est l'équivalent du côté de l'impôt sur le revenu.",
  "source": "Code de l'IRPP et de l'IS, art. 49 § II",
  "terme": "Minimum d'impôt sur le chiffre d'affaires"
 },
 "minimum-perception-douane": {
  "autre": "الحد الأدنى القانوني للاستخلاص",
  "definition": "Taux minimal de droits de douane perçu à l'importation nonobstant les exonérations que prévoient certaines lois et conventions. Fixé par la loi de finances pour 1987 pour les droits en tarif minimum ad valorem, il peut, selon le code des douanes de 2008, être suspendu par décret avec les droits de douane (art. 6).",
  "source": "Loi n° 86-106 du 31 décembre 1986, art. 27",
  "terme": "Minimum légal de perception"
 },
 "minimum-perception-enregistrement": {
  "autre": "الاستخلاص الأدنى",
  "definition": "",
  "source": "Loi n° 2016-78 du 17 décembre 2016, art. 69",
  "terme": "Minimum de perception"
 },
 "opcvm": {
  "acronyme": "OPCVM",
  "autre": "مؤسسة التوظيف الجماعي في الأوراق المالية",
  "definition": "Organisme qui place collectivement en valeurs mobilières l'épargne de ses actionnaires ou porteurs de parts : société d'investissement à capital variable (SICAV) ou fonds commun de placement (FCP). Selon l'administration, à compter de 2002, les revenus de capitaux mobiliers des fonds communs de placement en valeurs mobilières supportent une retenue de 20 %, définitive et libératoire (note commune n° 45/2002).",
  "source": "Note commune n° 45/2002",
  "terme": "Organisme de placement collectif en valeurs mobilières"
 },
 "option-assujettissement": {
  "autre": "الاختيار للخضوع للأداء",
  "definition": "Faculté ouverte à certaines personnes placées hors du champ de la taxe de s'y soumettre volontairement, afin notamment d'exercer le droit à déduction.",
  "source": "Loi n° 88-61 du 2 juin 1988, art. 2 § I-3",
  "terme": "Option pour la qualité d'assujetti"
 },
 "origine-des-marchandises": {
  "autre": "منشأ البضائع",
  "definition": "Pays dont une marchandise est réputée provenir, et d'après lequel les droits de douane sont perçus à l'importation. Hors les définitions propres aux accords commerciaux, le code des douanes de 2008 tient pour originaires d'un pays les marchandises « entièrement obtenues » dans ce pays ; pour une marchandise obtenue avec des produits importés d'un autre pays, un décret fixe les règles selon le critère de la transformation substantielle. Les règles d'origine des accords préférentiels décident quelles importations bénéficient du taux réduit.",
  "source": "Loi n° 2008-34 du 2 juin 2008, art. 21",
  "terme": "Origine des marchandises"
 },
 "perte-seche": {
  "autre": "الخسارة الصافية في الرفاه",
  "definition": "Part du coût d'un impôt, pour les consommateurs et les producteurs, qui excède la recette qu'il procure. Selon la Mirrlees Review (2011), en élevant les prix et en réduisant les quantités échangées, l'impôt impose des pertes dont la somme dépasse presque toujours la recette ; l'écart croît avec la sensibilité de l'offre et de la demande au prix.",
  "source": "Tax by Design: The Mirrlees Review, p. 29",
  "terme": "Perte sèche"
 },
 "plus-value-cession-titres": {
  "autre": "القيمة الزائدة المتأتية من التفويت في السندات",
  "definition": "Gain réalisé par une personne physique, hors de son activité professionnelle, en cédant des actions ou des parts sociales : prix de cession diminué de la valeur d'acquisition, après imputation des moins-values de même nature de l'année. Depuis 2004, c'est un revenu de valeurs mobilières, imposé à un taux proportionnel hors barème (loi de finances pour 2004, art. 61 à 63).",
  "source": "Loi n° 2003-80 du 29 décembre 2003, art. 61 à 63",
  "terme": "Plus-value de cession de titres"
 },
 "plus-value-immobiliere": {
  "autre": "القيمة الزائدة العقارية",
  "definition": "",
  "source": "Code de l'IRPP et de l'IS, art. 27",
  "terme": "Plus-value immobilière"
 },
 "plus-value-nominale": {
  "autre": "القيمة الزائدة الاسمية",
  "definition": "Écart entre le prix de cession d'un bien et son prix d'acquisition, l'un et l'autre en dinars courants (nominal gain). La plus-value réelle (real gain) est cet écart corrigé de la hausse générale des prix pendant la détention. Selon la Mirrlees Review (2011), un impôt qui frappe la plus-value nominale, sans correction de l'inflation, a un taux effectif très sensible à l'inflation.",
  "source": "Tax by Design: The Mirrlees Review, p. 325 et 489",
  "terme": "Plus-value nominale"
 },
 "position-tarifaire": {
  "autre": "البند التعريفي",
  "definition": "Numéro du tarif douanier par lequel le tableau annexé désigne les produits soumis au droit de consommation ; le tableau de 1988 en fait le titre de sa première colonne, « NT ». La position est soit entière (02-03), soit extraite et préfixée « Ex », le libellé précisant alors quelle partie de la position est retenue et quelles exclusions s'y attachent. Le champ du droit de consommation est ainsi défini par une liste douanière, et non par une catégorie économique.",
  "source": "Loi n° 88-62 du 2 juin 1988, tableau annexé, colonne « NT »",
  "terme": "Position tarifaire"
 },
 "prime-investissement": {
  "autre": "منحة الاستثمار",
  "definition": "Prime accordée aux projets d'intérêt national dans la limite du tiers du coût d'investissement, y compris les dépenses des travaux d'infrastructures intra-muros ; son plafond est fixé par décret gouvernemental (loi n° 2016-71, article 20). Elle ne se confond pas avec les quatre primes de l'article 19 de la même loi, nommées chacune par son objet — augmentation de la valeur ajoutée et de la compétitivité, développement de la capacité d'employabilité, développement régional, développement durable.",
  "source": "Loi n° 2016-71 du 30 septembre 2016, art. 20",
  "terme": "Prime d'investissement"
 },
 "projet-interet-national": {
  "autre": "المشاريع ذات الأهمية الوطنية",
  "definition": "Projets désignés par décret gouvernemental d'après la taille de leur investissement ou leur capacité d'employabilité, et qui satisfont à l'un au moins des objectifs de l'article premier de la loi de l'investissement. Ils bénéficient d'une déduction des bénéfices de l'assiette de l'impôt sur les sociétés dans la limite de dix années, d'une prime d'investissement dans la limite du tiers du coût d'investissement et de la participation de l'État aux dépenses des travaux d'infrastructure ; ces incitations sont octroyées à chaque projet par décret gouvernemental (loi n° 2016-71, article 20).",
  "source": "Loi n° 2016-71 du 30 septembre 2016, art. 20",
  "terme": "Projets d'intérêt national"
 },
 "promoteur-immobilier": {
  "autre": "الباعث العقاري",
  "definition": "Opérateur immobilier dont certaines ventes relèvent de règles propres de TVA. Les ventes de lots de terrain par les promoteurs immobiliers entrent dans le champ de la taxe en 2017 ; leurs ventes de logements relèvent ensuite des exonérations ou des taux prévus par le code.",
  "source": "Loi n° 2016-78 du 17 décembre 2016, art. 20",
  "terme": "Promoteur immobilier"
 },
 "prorata-deduction-tva": {
  "autre": "النسبة المائوية للطرح",
  "definition": "Fraction de la TVA d'amont que l'assujetti partiel peut déduire : rapport entre les recettes soumises à la taxe, augmentées de celles de l'exportation et des ventes en suspension, et l'ensemble des recettes, exonérées ou hors champ comprises. Calculé sur l'année précédente, il est arrêté en fin d'année civile sur les éléments de l'année.",
  "source": "Loi n° 88-61 du 2 juin 1988, art. 9, § II et III",
  "terme": "Pourcentage de déduction"
 },
 "protection-effective": {
  "autre": "الحماية الفعلية",
  "definition": "Protection que la structure des droits de douane assure à la valeur ajoutée d'une branche, et non au prix de son produit : elle tient compte à la fois des droits sur le produit et des droits sur les intrants importés. Son taux rapporte l'écart entre la valeur ajoutée aux prix intérieurs et la valeur ajoutée aux prix mondiaux à cette dernière ; il dépasse le taux nominal quand les intrants sont moins taxés que le produit.",
  "source": "République tunisienne. Vers le 21e siècle. Mémorandum économique. Volume II : annexes, annexe 2, p. 16",
  "terme": "Protection effective"
 },
 "recettes-fiscales": {
  "autre": "المداخيل الجبائية",
  "definition": "Ensemble des impôts, droits et taxes perçus par l'État, à l'exclusion des recettes non fiscales. Les documents budgétaires tunisiens les distinguent des recettes non fiscales, qui proviennent notamment de la redevance de transit du gaz.",
  "terme": "Recettes fiscales"
 },
 "redevance-prestations-douanieres": {
  "autre": "الأتاوة على الخدمات الديوانية",
  "definition": "Prélèvement que la douane perçoit sur les déclarations en douane, en plus des droits. Institué en 1988 sur la valeur en douane, il est assis depuis 1994 sur le montant des droits et taxes liquidés à l'importation, avec un minimum de perception par article ; une redevance fixe frappe en outre chaque déclaration de transit terrestre.",
  "source": "Loi n° 98-111 du 28 décembre 1998, art. 32",
  "terme": "Redevance de prestations douanières"
 },
 "regime-forfaitaire": {
  "autre": "النظام التقديري",
  "definition": "Régime d'imposition des entreprises individuelles réalisant des bénéfices industriels et commerciaux dans un établissement unique, sous conditions d'activité et de chiffre d'affaires : l'impôt y est déterminé forfaitairement à partir du chiffre d'affaires annuel, et non du bénéfice réel. Institué au § IV de l'article 44 du code, il a été transféré aux articles 44 bis à 44 sexies.",
  "source": "Code de l'IRPP et de l'IS, art. 44, § IV",
  "terme": "Régime forfaitaire d'imposition"
 },
 "regime-forfaitaire-optionnel": {
  "autre": "النظام التقديري الاختياري",
  "definition": "Régime ouvert sur option, ajouté à l'article 44 ter du code par l'article 91 de la loi de finances pour 2026, aux contribuables dont le chiffre d'affaires annuel n'excède pas 100 000 dinars : l'impôt y est forfaitisé en deux classes (4 000 et 5 000 dinars par an, réduits de moitié dans les campagnes et villages) et libératoire dans la limite du chiffre d'affaires déclaré spontanément. Terme français provisoire : seul le texte arabe du JORT est publié à ce jour.",
  "source": "Loi n° 2025-17 du 12 décembre 2025, art. 91",
  "terme": "Régime forfaitaire optionnel"
 },
 "regime-suspensif-tva": {
  "autre": "نظام توقيف العمل بالأداء على القيمة المضافة",
  "definition": "Régime permettant, dans les cas et conditions prévus par le code, d'importer ou d'acquérir localement des biens et services sans paiement de la TVA lors de l'opération. Il bénéficie notamment à certaines entreprises exportatrices pour leurs acquisitions ouvrant droit à déduction.",
  "source": "Loi n° 88-61 du 2 juin 1988, art. 11",
  "terme": "Régime suspensif de la taxe sur la valeur ajoutée"
 },
 "regimes-douaniers-suspensifs": {
  "autre": "الأنظمة التوقيفية والأنظمة الديوانية الاقتصادية",
  "definition": "Régimes qui permettent de stocker, transformer, utiliser ou faire circuler des marchandises en suspension des droits de douane, des taxes intérieures et de tout autre droit ou taxe dont elles sont passibles. Le code des douanes de 2008 en énumère sept, avec l'exportation temporaire : le transit, l'entrepôt douanier, la transformation sous douane, le perfectionnement actif, l'admission temporaire, le perfectionnement passif et l'exportation temporaire.",
  "source": "Loi n° 2008-34 du 2 juin 2008, art. 137-138",
  "terme": "Régimes suspensifs et régimes douaniers économiques"
 },
 "regroupement-seuil": {
  "autre": "التجمّع عند العتبة",
  "definition": "Accumulation des observations — revenus, prix déclarés — à un seuil de l'impôt ou juste au-dessous. Kleven (2016) décrit une méthode qui mesure par ce regroupement la réponse au seuil. Selon Best et Kleven (2018), le regroupement des prix de vente sous un seuil mêle une réponse réelle, sur le prix convenu, et une éventuelle sous-déclaration.",
  "source": "Bunching, p. 436",
  "terme": "Regroupement"
 },
 "regularisation-deductions-tva": {
  "autre": "تعديل الطرح",
  "definition": "Correction de la déduction initiale lorsque la situation change : variation de plus de cinq centièmes du pourcentage de déduction pour les biens amortissables, cession, changement d'affectation, cessation d'activité ou abandon de la qualité d'assujetti. La taxe déduite est alors reversée, diminuée d'un cinquième par année de détention pour les équipements et le matériel, et d'un dixième pour les bâtiments.",
  "source": "Loi n° 88-61 du 2 juin 1988, art. 9, § III et IV",
  "terme": "Régularisation des déductions"
 },
 "restitution-credit-tva": {
  "autre": "إرجاع فائض الأداء على القيمة المضافة",
  "definition": "Remboursement par le Trésor du crédit de TVA que l'imputation n'a pu absorber, organisé par l'article 15 du code. Hors exportation et ventes en suspension, elle a été partielle jusqu'en 2006 (20 % du crédit en 1988, 50 % en 1999) ; elle est intégrale dans tous les cas depuis le 1er janvier 2007. Ses délais relèvent du code des droits et procédures fiscaux depuis 2002.",
  "source": "Loi n° 2006-80 du 18 décembre 2006, art. 15",
  "terme": "Restitution du crédit de taxe sur la valeur ajoutée"
 },
 "retenue-a-la-source": {
  "autre": "الخصم من المورد",
  "definition": "Prélèvement de l'impôt opéré par celui qui paie une somme, pour le compte de celui qui la reçoit ; le montant retenu est reversé au Trésor et imputé sur l'impôt dû par ce dernier, sauf quand la loi la rend libératoire ou définitive et non restituable (code, art. 52 et 54). En matière d'impôt sur le revenu des personnes physiques, l'employeur l'opère lors du paiement du traitement et des indemnités imposables (code de l'IRPP et de l'IS, loi n°89-114). En matière de taxe sur la valeur ajoutée, l'État, les collectivités locales, les entreprises et les établissements publics retiennent une part de la taxe facturée par leurs fournisseurs : 50 % à compter de 1998, 25 % à compter de 2016.",
  "source": "Loi n° 89-114 du 30 décembre 1989",
  "terme": "Retenue à la source"
 },
 "retenue-definitive-non-restituable": {
  "autre": "الخصم من المورد النهائي وغير القابل للإرجاع",
  "definition": "Retenue à la source qui n'est jamais rendue au bénéficiaire, quel que soit son régime fiscal, même lorsqu'elle dépasse l'impôt qu'il doit ou qu'il n'en doit pas. Le décret-loi n° 2020-30 (art. 12) qualifie ainsi la retenue de 35 % sur les revenus des dépôts à terme dont le taux de rémunération dépasse, au 1er janvier de l'année, le taux moyen du marché monétaire diminué d'un point.",
  "source": "Décret-loi n° 2020-30 du 10 juin 2020, art. 12",
  "terme": "Retenue à la source définitive et non restituable"
 },
 "retenue-liberatoire": {
  "autre": "الخصم من المورد التحرري",
  "definition": "Retenue à la source qui éteint l'impôt sur le revenu dû sur la somme à laquelle elle s'applique : ce revenu n'entre pas dans le revenu global déclaré, et la retenue n'est pas imputée sur l'impôt dû. Le code de 1990 la prévoit pour les revenus des bons de caisse au porteur dont le bénéficiaire n'est pas révélé à l'administration et pour les revenus servis aux personnes non résidentes ou non établies en Tunisie (art. 52-II) ; les autres retenues sont imputables (art. 54).",
  "source": "Code de l'IRPP et de l'IS, art. 52-II et 54",
  "terme": "Retenue à la source libératoire"
 },
 "revenus-capitaux-mobiliers": {
  "autre": "مداخيل رؤوس الأموال المنقولة",
  "definition": "Revenus d'un prêt d'argent, rangés avec les revenus de valeurs mobilières dans la sixième catégorie de l'impôt sur le revenu : intérêts et autres produits des obligations, effets publics et autres titres d'emprunt négociables, intérêts des créances, des dépôts de sommes d'argent et des cautionnements en numéraire, produits des comptes courants (code de 1990, art. 34).",
  "source": "Code de l'IRPP et de l'IS, art. 34",
  "terme": "Revenus de capitaux mobiliers"
 },
 "revenus-fonciers": {
  "autre": "المداخيل العقارية",
  "definition": "Catégorie définie par subsidiarité : y entrent les revenus des immeubles et des droits immobiliers lorsqu'ils ne relèvent pas d'une autre catégorie. Le revenu net des propriétés bâties se détermine forfaitairement.",
  "source": "Code de l'IRPP et de l'IS, art. 27",
  "terme": "Revenus fonciers"
 },
 "revenus-valeurs-mobilieres": {
  "autre": "مداخيل الأوراق المالية",
  "definition": "Revenus qu'une personne tire de sa qualité d'associé ou d'actionnaire, rangés avec les revenus de capitaux mobiliers dans la sixième catégorie de l'impôt sur le revenu : bénéfices distribués par les sociétés passibles de l'impôt sur les sociétés et sommes assimilées à des revenus distribués, comme les jetons de présence (code de 1990, art. 29 à 33). Depuis 2004, la plus-value de cession d'actions et de parts sociales en fait aussi partie (loi de finances pour 2004, art. 61).",
  "source": "Code de l'IRPP et de l'IS, art. 29 à 33",
  "terme": "Revenus de valeurs mobilières"
 },
 "seuil-a-changement-de-taux": {
  "autre": "عتبة تغيّر النسبة",
  "definition": "Valeur de l'assiette à laquelle le taux marginal de l'impôt change, sans que le montant dû change au seuil même : seule la part de l'assiette qui dépasse le seuil est imposée au nouveau taux. Les limites des tranches d'un barème progressif sont des seuils de ce type. Kleven (2016) le nomme kink.",
  "source": "Bunching, p. 436",
  "terme": "Seuil à changement de taux"
 },
 "seuil-a-saut": {
  "autre": "العتبة ذات القفزة",
  "definition": "Valeur de l'assiette à laquelle le montant de l'impôt augmente d'un coup, par un changement de son taux moyen : franchir le seuil, même de peu, suffit à accroître l'impôt dû de ce saut. Kleven (2016) distingue ce seuil (notch) du seuil à changement de taux (kink). Dans son modèle, en l'absence de frictions, un seuil à saut laisse juste au-dessus du seuil une zone vide, où aucun contribuable ne choisit de se placer.",
  "source": "Bunching, p. 436 et 441-442",
  "terme": "Seuil à saut"
 },
 "smig": {
  "acronyme": "SMIG",
  "autre": "الأجر الأدنى المضمون لمختلف المهن",
  "definition": "Rémunération horaire ou mensuelle minimale légale applicable aux salariés des secteurs non agricoles régis par le code du travail. L'État le fixe par décret depuis le 1er janvier 1974. Il est fixé à l'heure et au mois, pour deux régimes de durée du travail : 48 heures et 40 heures par semaine.",
  "source": "Décret gouvernemental n° 2017-668 du 5 juin 2017",
  "terme": "Salaire minimum interprofessionnel garanti"
 },
 "sous-declaration": {
  "autre": "التصريح بأقلّ من القيمة الحقيقية",
  "definition": "Déclaration à l'administration fiscale d'une valeur inférieure à la valeur réelle ; pour une vente d'immeuble, d'un prix inférieur au prix convenu entre les parties. Selon Norregaard (2013, FMI), un droit de mutation élevé incite l'acheteur et le vendeur à s'entendre pour minorer le prix, et la sous-déclaration prive l'administration des ventes comme source d'information à jour sur les valeurs de marché.",
  "source": "Taxing Immovable Property: Revenue Potential and Implementation Challenges, p. 29",
  "terme": "Sous-déclaration"
 },
 "suspension-droit-consommation": {
  "autre": "توقيف العمل بالمعلوم على الاستهلاك",
  "definition": "Régime par lequel le droit de consommation n'est pas exigé lors d'une opération qui, sans lui, y serait soumise. L'article 6 bis de la loi n° 88-62, ajouté par l'article 22 de la loi de finances pour 2018, en institue un cas : les véhicules tout terrain importés par les concessionnaires au profit des agences de voyages.",
  "source": "Loi n° 88-62 du 2 juin 1988, art. 6 bis",
  "terme": "Suspension du droit de consommation"
 },
 "systeme-fiscal-de-reference": {
  "autre": "النظام الجبائي المرجعي",
  "definition": "Au sens du rapport annexé au projet de loi de finances pour 2021, les dispositions de base de chaque impôt, au regard desquelles une mesure est dite dérogatoire et comptée parmi les dépenses fiscales. Le rapport retient l'approche qu'il appelle juridique : le régime de référence y est « l'ensemble des dispositions essentielles prévues par le droit commun », identifié pour chaque type d'impôt.",
  "source": "Rapport sur les dépenses fiscales et les avantages financiers, annexe au projet de loi de finances, rapport annexé au projet de loi de finances pour 2021, section II, § 1",
  "terme": "Système fiscal de référence"
 },
 "systeme-harmonise": {
  "acronyme": "SH",
  "autre": "النظام المنسق لتعيين وترميز البضائع",
  "definition": "Nomenclature internationale des marchandises, établie par la convention conclue à Bruxelles le 14 juin 1983, que la Tunisie ratifie en 1987. Le tarif des droits de douane la suit depuis la loi n° 89-113 ; le code des douanes de 2008 classe les marchandises sous réserve de ses règles générales d'interprétation (art. 19).",
  "source": "Loi n° 87-2 du 6 février 1987",
  "terme": "Système harmonisé de désignation et de codification des marchandises"
 },
 "tableau-a-tva": {
  "autre": "الجدول « أ »",
  "definition": "Annexe du code énumérant les produits et opérations exonérés de la taxe. Toute modification passe par une loi, le plus souvent une loi de finances.",
  "source": "Loi n° 88-61 du 2 juin 1988, tableau A",
  "terme": "Tableau A du code de la TVA"
 },
 "tableau-annexe-loi-88-62": {
  "autre": "الجدول المدرج بملحق القانون عدد 62 لسنة 1988",
  "definition": "Liste des produits soumis au droit de consommation, annexée à la loi n° 88-62 du 2 juin 1988. Elle porte à la fois le champ d'application et les taux : trois colonnes — numéro du tarif douanier, désignation des produits, droit applicable — et des renvois qui ajoutent des règles de fond. Modifier le tableau, c'est donc modifier le champ. Celui de 1988 a été abrogé et remplacé en entier deux fois, par l'article 44 de la loi de finances pour 2016 puis par l'article 45 de la loi de finances pour 2018 : pour l'état en vigueur, la source est la version consolidée du code, et non le texte de 1988.",
  "source": "Loi n° 88-62 du 2 juin 1988, tableau annexé",
  "terme": "Tableau annexé à la loi n° 88-62"
 },
 "tableau-b-bis-tva": {
  "autre": "الجدول « ب مكرر »",
  "definition": "Annexe créée par la loi de finances pour 2002, qui portait un taux intermédiaire, et abrogée par la loi de finances pour 2017. Dispositif historique : il ne s'applique plus.",
  "source": "Loi n° 2001-123 du 28 décembre 2001, art. 82 à 84",
  "terme": "Tableau B bis du code de la TVA"
 },
 "tableau-b-tva": {
  "autre": "الجدول « ب »",
  "definition": "Annexe du code énumérant les produits et services soumis au taux réduit. L'électricité et les carburants y figuraient en 1988 ; ils en sont sortis par l'article 40 de la loi n° 95-109.",
  "source": "Loi n° 88-61 du 2 juin 1988, tableau B ; art. 7 § 1",
  "terme": "Tableau B du code de la TVA"
 },
 "tableau-c-tva": {
  "autre": "الجدول « ج »",
  "definition": "Annexe du code énumérant les produits soumis au taux majoré. Supprimée au 1er janvier 2007 par l'article 13 de la loi n° 2006-80. Dispositif historique.",
  "source": "Loi n° 88-61 du 2 juin 1988, tableau C",
  "terme": "Tableau C du code de la TVA"
 },
 "tarif-autonome": {
  "autre": "التعريفة الحرة",
  "definition": "Tarif de droit commun des droits de douane, que fixe la loi tunisienne, par opposition aux taux consolidés dans le cadre de l'Organisation mondiale du commerce et aux taux préférentiels des accords commerciaux. Les lois de finances emploient ce terme quand elles modifient ces taux.",
  "source": "Loi n° 2004-90 du 31 décembre 2004, art. 28",
  "terme": "Tarif autonome"
 },
 "tarif-des-droits-de-douane": {
  "autre": "تعريفة المعاليم الديوانية عند التوريد",
  "definition": "Texte de loi qui fixe, pour chaque position de la nomenclature, le taux des droits de douane dus à l'importation. Le tarif en vigueur est celui de la loi n° 89-113, en deux parties, des dispositions préliminaires et le tableau des taux ; les lois de finances le modifient. Il remplace les tarifs des lois de 1959 et de 1973, qui comportaient aussi un tarif à l'exportation.",
  "source": "Loi n° 89-113 du 30 décembre 1989, art. 1",
  "terme": "Tarif des droits de douane à l'importation"
 },
 "tarif-minimum-tarif-general": {
  "autre": "التعريفة الدنيا والتعريفة العامة",
  "definition": "Les deux colonnes du tarif des droits à l'importation des lois de 1959 et de 1973, en vigueur jusqu'au 31 décembre 1989. Le tarif minimum s'applique conformément aux stipulations des traités, conventions et arrangements internationaux ; le tarif général est fixé au triple du tarif minimum.",
  "source": "Loi n° 59-95 du 20 août 1959, art. 1",
  "terme": "Tarif minimum, tarif général"
 },
 "taux-ad-valorem": {
  "autre": "نسبة من القيمة",
  "definition": "Taux exprimé en pourcentage d'une valeur, par opposition au taux spécifique. Lorsque le tableau annexé soumet un produit à un taux ad valorem, l'assiette du droit de consommation est, à l'importation, la valeur en douane et, en régime intérieur, le prix de vente tous frais, droits et taxes compris, à l'exclusion du droit de consommation lui-même et de la taxe sur la valeur ajoutée.",
  "source": "Loi n° 88-62 du 2 juin 1988, art. 4-a",
  "terme": "Taux ad valorem"
 },
 "taux-majore-tva": {
  "autre": "النسبة المرتفعة",
  "definition": "Taux supérieur au taux normal, appliqué aux produits du tableau C de 1988 à 2006. Supprimé au 1er janvier 2007. Dispositif historique.",
  "source": "Loi n° 88-61 du 2 juin 1988, art. 7",
  "terme": "Taux majoré de la TVA"
 },
 "taux-marginal": {
  "autre": "النسبة الحدية",
  "definition": "Taux d'un barème appliqué par tranche, pour la tranche où tombe la dernière unité de l'assiette (revenu, part successorale) : c'est le taux qui frappe un dinar de plus. Il se distingue du taux moyen, qui rapporte l'impôt total à l'assiette, et du taux de la tranche atteinte appliqué à toute la valeur, comme le droit complémentaire de 2017 ou l'impôt sur la fortune : là, le taux de la tranche atteinte frappe la valeur entière, et non la seule fraction comprise dans la tranche. (marginal rate)",
  "source": "Code de l'IRPP et de l'IS, art. 44 § I",
  "terme": "Taux marginal"
 },
 "taux-moyen": {
  "autre": "النسبة المتوسطة",
  "definition": "Impôt total dû rapporté à l'assiette (revenu net imposable, part recueillie) : la part de l'assiette que prélève le barème. Dans un barème par tranche, il est inférieur au taux marginal dès que l'assiette dépasse la première tranche, et tend vers lui quand l'assiette croît. Il n'est pas défini pour une assiette nulle. (average rate)",
  "terme": "Taux moyen"
 },
 "taux-normal-tva": {
  "autre": "النسبة العادية",
  "definition": "Taux de droit commun, applicable à toute opération imposable qu'un texte ne range pas ailleurs. Fixé à 17 % en 1988, porté à 18 % puis à 19 %.",
  "source": "Loi n° 88-61 du 2 juin 1988, art. 7 § 1",
  "terme": "Taux normal de la TVA"
 },
 "taux-npf": {
  "acronyme": "NPF",
  "autre": "نسبة الدولة الأولى بالرعاية",
  "definition": "Taux de droit de douane qu'un membre de l'Organisation mondiale du commerce applique aux importations des autres membres en l'absence de préférence : le taux de droit commun. Les examens des politiques commerciales du GATT et de l'OMC calculent les moyennes du tarif sur ces taux, ligne par ligne.",
  "source": "Examen des politiques commerciales. Tunisie. Rapport du Secrétariat, § 3.23",
  "terme": "Taux de la nation la plus favorisée"
 },
 "taux-perception-implicite": {
  "autre": "نسبة الاستخلاص الضمنية",
  "definition": "Rapport entre les droits de douane perçus, redevance de prestations douanières comprise, et la valeur des importations : la part de la valeur importée que l'État perçoit en droits. Il mesure ce qui est perçu, là où une moyenne des taux du tarif mesure les taux affichés.",
  "terme": "Taux de perception implicite"
 },
 "taux-reduit-tva": {
  "autre": "النسبة المخفضة",
  "definition": "Taux inférieur au taux normal, applicable aux produits et services que le tableau B énumère. L'article 8 du code borne à l'année civile toute réduction accordée par décret, d'où des reconductions annuelles.",
  "source": "Loi n° 88-61 du 2 juin 1988, art. 7 § 2",
  "terme": "Taux réduit de la TVA"
 },
 "taux-specifique": {
  "autre": "نسبة نوعية",
  "definition": "Taux assis non sur une valeur mais sur une quantité — volume ou poids —, par opposition au taux ad valorem. Le tableau annexé mêle les deux techniques dès 1988 : le droit de consommation n'est donc ni une taxe ad valorem ni une accise spécifique, mais mixte dès l'origine. Un tarif spécifique ne suit pas les prix ; il ne varie qu'à chaque révision du tableau, de sorte qu'une longue stabilité nominale y équivaut à une érosion réelle.",
  "source": "Loi n° 88-62 du 2 juin 1988, art. 4-b",
  "terme": "Taux spécifique"
 },
 "taxe-a-la-production": {
  "autre": "الأداء على الإنتاج",
  "definition": "Taxe sur le chiffre d'affaires antérieure à la TVA, abrogée par l'article 2 de la loi n° 88-61. Les recettes qu'elle produisait figurent avant 1988 sous la rubrique « TVA » des statistiques du ministère des Finances. Dispositif historique.",
  "source": "Loi n° 88-61 du 2 juin 1988, art. 2",
  "terme": "Taxe à la production"
 },
 "taxe-bieres-vins-boissons-alcoolisees": {
  "autre": "الأداء على الجعة والخمور والمشروبات الكحولية الأخرى",
  "definition": "Taxe instituée par les articles 4 à 11 de la loi n° 84-2 du 21 mars 1984, portant loi de finances complémentaire pour la gestion 1984, en remplacement de la taxe parafiscale unique sur les vins, bières et boissons alcoolisées. Ces articles ont été abrogés par l'article 7 de la loi n° 88-62 du 2 juin 1988, qui lui substitue le droit de consommation. Dispositif historique.",
  "source": "Loi n° 88-62 du 2 juin 1988, art. 7",
  "terme": "Taxe sur les bières, vins et autres boissons alcoolisées"
 },
 "taxe-conjoncturelle": {
  "autre": "معلوم ظرفي",
  "definition": "Prélèvement temporaire au profit du budget de l'État, dû par les banques et les établissements financiers, sauf les établissements de paiement, et par les sociétés d'assurance et de réassurance. Il est assis sur les bénéfices servant de base à l'impôt sur les sociétés, payé avec cet impôt, non déductible de son assiette, et suit son contrôle et son contentieux. Institué pour les déclarations de 2018 et de 2019, il est repris pour celles de 2024 et de 2025.",
  "source": "Loi n° 2017-66 du 18 décembre 2017, art. 52",
  "terme": "Taxe conjoncturelle"
 },
 "taxe-effet-equivalent": {
  "autre": "الأداءات ذات الأثر المماثل",
  "definition": "Prélèvement qui, sans être un droit de douane, frappe une marchandise à raison de son importation ou de son exportation. L'accord d'association de 1995 interdit d'en instituer de nouvelles dans les échanges entre les parties (art. 8) ; le code des douanes de 2008 permet de rembourser, à l'exportation, les droits de douane et taxes d'effet équivalent perçus à l'importation de la marchandise ou des matières premières qui la composent (art. 298).",
  "source": "Accord euro-méditerranéen établissant une association entre la Communauté européenne et ses États membres, d'une part, et la République tunisienne, d'autre part, art. 8",
  "terme": "Taxe d'effet équivalent"
 },
 "taxe-forfaitaire-annuelle-tva": {
  "autre": "الأداء السنوي التقديري",
  "definition": "Régime historique institué par la loi de finances pour 1990 pour certaines entreprises individuelles à établissement unique dont le chiffre d'affaires ne dépassait pas les plafonds prévus. La taxe était fixée annuellement par un barème selon l'activité et le chiffre d'affaires. Elle a été abrogée par la loi de finances pour 1993.",
  "source": "Loi n° 89-115 du 30 décembre 1989, art. 24 et 25",
  "terme": "Taxe forfaitaire annuelle"
 },
 "taxe-forfaitaire-mensuelle-transports": {
  "autre": "أداء تقديري شهري على القيمة المضافة",
  "definition": "Taxe mensuelle applicable aux opérations de transport terrestre, sauf le transport de personnes par voiture de louage ou taxi. Elle est calculée selon la charge utile ou le nombre de places offertes et s'impute sur la TVA due par les assujettis relevant du régime réel.",
  "source": "Loi n° 97-88 du 29 décembre 1997, art. 29",
  "terme": "Taxe forfaitaire mensuelle sur la valeur ajoutée"
 },
 "taxe-formalites-douanieres": {
  "autre": "الأداء على الإجراءات الديوانية",
  "definition": "Taxe perçue sur les déclarations en douane, à l'importation et à l'exportation, instituée par le décret du 24 décembre 1936 portant fixation du budget de l'exercice 1937. Une part de son produit à l'importation a été versée à la Caisse générale de compensation. Elle est supprimée au 2 janvier 1988, et la redevance de prestations douanières lui succède.",
  "source": "Loi n° 87-83 du 31 décembre 1987, art. 48",
  "terme": "Taxe de formalités douanières"
 },
 "taxe-prestations-de-service": {
  "autre": "الأداء على الخدمات",
  "definition": "Taxe sur le chiffre d'affaires antérieure à la TVA, frappant les services, abrogée par l'article 2 de la loi n° 88-61. Dispositif historique.",
  "source": "Loi n° 88-61 du 2 juin 1988, art. 2",
  "terme": "Taxe sur les prestations de service"
 },
 "taxe-protection-environnement": {
  "autre": "المعلوم للمحافظة على البيئة",
  "definition": "Taxe dont le produit est affecté au fonds de dépollution, compte spécial du Trésor. Elle est due sur les produits énumérés au tableau annexé à l'article 58 de la loi de finances pour 2003, sur le chiffre d'affaires hors taxe sur la valeur ajoutée des fabricants et sur la valeur en douane des produits importés. Le tableau est complété par des lois de finances ultérieures.",
  "source": "Loi n° 2002-101 du 17 décembre 2002, art. 58-59",
  "terme": "Taxe pour la protection de l'environnement"
 },
 "taxe-unique-assurances": {
  "acronyme": "TUA",
  "autre": "المعلوم الوحيد على التأمين",
  "definition": "Taxe due sur « les contrats d'assurance ou de rente viagère conclus avec des entreprises d'assurance », à un taux qui diffère selon que le risque relève de la navigation maritime et aérienne ou d'une autre branche. Instituée par la loi de finances pour 1997 (art. 34), elle forme la troisième partie du code des droits d'enregistrement et de timbre, « autres taxes » (art. 144 à 149) : elle n'est ni un droit d'enregistrement ni un droit de timbre. L'assurance-vie, la réassurance et d'autres branches en sont exonérées (art. 145).",
  "source": "Loi n° 96-113 du 30 décembre 1996, art. 34",
  "terme": "Taxe unique sur les assurances"
 },
 "taxe-unique-compensation-carburants": {
  "autre": "المعلوم الوحيد التعويضي على منتوجات النفط",
  "definition": "Taxe perçue au profit de la Caisse générale de compensation, en laquelle le décret n° 70-622 du 31 décembre 1970 (art. 5) consolide, à compter du 1er janvier 1971, trois prélèvements sur les carburants : la taxe de péréquation de 1957, la taxe de compensation de 1964 et quatre centimes additionnels au droit de consommation. Le tableau annexé à la loi n° 88-62 du 2 juin 1988, qui refond le droit de consommation, y renvoie encore.",
  "source": "Décret n° 70-622 du 31 décembre 1970, art. 5",
  "terme": "Taxe unique de compensation sur les produits pétroliers"
 },
 "terres-collectives": {
  "autre": "الأراضي الاشتراكية",
  "definition": "",
  "source": "Loi n° 57-16 du 28 septembre 1957, fixant le régime organique des terres collectives, art. 1",
  "terme": "Terres collectives"
 },
 "territorialite-tva": {
  "autre": "مبدأ الإقليمية",
  "definition": "Règle qui soumet à la taxe les affaires faites en Tunisie. Une vente y est réputée faite lorsque la livraison y a lieu ; un service, lorsqu'il y est exploité ou utilisé.",
  "source": "Loi n° 88-61 du 2 juin 1988, art. 3",
  "terme": "Territorialité de la TVA"
 },
 "timbre-avocat": {
  "autre": "طابع المحاماة",
  "definition": "Timbre institué par la loi n° 93-53 (art. 6), qui promulgue le code des droits d'enregistrement et de timbre, « au profit de la Caisse de Prévoyance et de Retraite des avocats ». Son produit revient à cette caisse et non au budget de l'État ; son montant est fixé par décret.",
  "source": "Loi n° 93-53 du 17 mai 1993, art. 6",
  "terme": "Timbre d'avocat"
 },
 "timbre-dimension": {
  "autre": "معلوم الطابع حسب حجم الورق",
  "definition": "Droit de timbre dû sur un acte écrit selon le format du papier employé, du petit papier au grand registre, quel que soit le contenu de l'acte. Il relève du décret organique sur le timbre du 20 avril 1912, et ses montants sont relevés par décret puis par loi de finances (décret n° 65-222, art. 1 ; loi de finances pour 1969, art. 12). Le tarif du code des droits d'enregistrement et de timbre de 1993 ne le comporte plus : le timbre des actes y est dû par feuille.",
  "source": "Décret n° 65-222 du 5 mai 1965, art. 1",
  "terme": "Timbre de dimension"
 },
 "timbre-mobile": {
  "autre": "الطابع غير القار",
  "definition": "Vignette émise par l'État, que l'on appose sur un document pour acquitter le droit de timbre ; on l'appelle couramment timbre fiscal. C'est l'un des modes de paiement du droit de timbre que fixe le code des droits d'enregistrement et de timbre, à côté du papier timbré, du paiement sur état et du visa du receveur.",
  "source": "Loi n° 93-53 du 17 mai 1993, art. 121-122",
  "terme": "Timbre mobile"
 },
 "timbre-proportionnel": {
  "autre": "معلوم الطابع النسبي",
