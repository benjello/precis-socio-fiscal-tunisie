 "impot-fortune-immobiliere": {
  "autre": "الضريبة على الثروة العقارية",
  "definition": "Impôt exigible au 1er janvier de chaque année, de 2023 à 2025, sur les immeubles des personnes physiques, y compris ceux de leurs enfants mineurs sous leur tutelle, dont la valeur, nette des dettes que le texte admet en déduction, atteignait 3 millions de dinars ; son taux était de 0,5 %. Institué par l'article 23 du décret-loi n° 2022-79 portant loi de finances pour 2023, il a été abrogé et remplacé, à compter du 1er janvier 2026, par l'impôt sur la fortune.",
  "source": "Décret-loi n° 2022-79 du 22 décembre 2022, art. 23",
  "terme": "Impôt sur la fortune immobilière"
 },
 "impot-societes": {
  "acronyme": "IS",
  "autre": "الضريبة على الشركات",
  "definition": "Impôt direct frappant les bénéfices des personnes morales, régi par le code de l'impôt sur le revenu des personnes physiques et de l'impôt sur les sociétés, promulgué par la loi n° 89-114 du 30 décembre 1989 et applicable aux bénéfices réalisés à compter du 1er janvier 1990. Il partage ce code avec l'impôt sur le revenu, dont il reprend par renvoi une partie des règles d'assiette. Il a remplacé l'impôt sur les bénéfices des sociétés de l'article 9 de la loi n° 85-109 du 31 décembre 1985.",
  "source": "Loi n° 89-114 du 30 décembre 1989, art. 1er et 45",
  "terme": "Impôt sur les sociétés"
 },
 "impots-directs": {
  "autre": "الأداءات المباشرة",
  "definition": "Impôts qui atteignent, avec une certaine périodicité, une matière imposable stable ou régulièrement renouvelée, comme un revenu ou un bénéfice. En Tunisie, l'impôt sur le revenu des personnes physiques et l'impôt sur les sociétés ; le même critère y rattache l'impôt sur la fortune, dû chaque année sur le patrimoine détenu au 1er janvier. La loi organique du budget les énumérait, sans les définir, parmi les recettes de l'État, sous l'intitulé « impôts directs ordinaires » à partir de 1996, jusqu'à la loi organique du budget de 2019.",
  "source": "Droit. Axe 4 : Droit fiscal, p. 14-16",
  "terme": "Impôts directs"
 },
 "impots-indirects": {
  "autre": "الأداءات والمعاليم غير المباشرة",
  "definition": "Impôts qui frappent des opérations intermittentes ou successives, à l'occasion de la production, de l'échange ou de la consommation d'un bien. En Tunisie, la taxe sur la valeur ajoutée, les droits de consommation, les droits de douane, les droits d'enregistrement et le timbre. La loi organique du budget les énumérait, sans les définir, parmi les recettes de l'État, sous l'intitulé « impôts et taxes indirects ordinaires » à partir de 1996, jusqu'à la loi organique du budget de 2019.",
  "source": "Droit. Axe 4 : Droit fiscal, p. 14-16",
  "terme": "Impôts indirects"
 },
 "imputation-droit-consommation": {
  "autre": "خصم المعلوم على الاستهلاك",
  "definition": "Faculté reconnue aux assujettis d'imputer sur le droit de consommation dû celui qui a grevé leurs acquisitions auprès d'autres assujettis et leurs propres importations de matières ou produits entrant intégralement dans la composition du produit final soumis ; le reliquat non imputé sur un mois est reporté sur les mois suivants. Le mécanisme est voisin de la déduction de taxe sur la valeur ajoutée, mais plus étroit, puisqu'il suppose l'incorporation intégrale de la matière au produit final. C'est par lui que le droit de consommation se distingue d'une accise ordinaire.",
  "source": "Loi n° 88-62 du 2 juin 1988, art. 5",
  "terme": "Imputation du droit de consommation"
 },
 "irpp": {
  "acronyme": "IRPP",
  "autre": "الضريبة على دخل الأشخاص الطبيعيين",
  "definition": "Impôt direct et progressif frappant le revenu net global des personnes physiques, retenu à la source sur les salaires (code de l'IRPP et de l'IS, loi n°89-114).",
  "source": "Loi n° 89-114 du 30 décembre 1989",
  "terme": "Impôt sur le revenu des personnes physiques"
 },
 "livraison-a-soi-meme": {
  "autre": "التسليم للنفس",
  "definition": "Opération par laquelle un assujetti utilise pour ses propres besoins un bien qu'il a produit. Elle est imposable, afin de ne pas avantager celui qui produit sur celui qui achète.",
  "source": "Loi n° 88-61 du 2 juin 1988, art. 1er § II-9 et 10 ; art. 5 § 4",
  "terme": "Livraison à soi-même"
 },
 "minimum-impot": {
  "autre": "الضريبة الدنيا",
  "definition": "Montant plancher d'impôt annuel, calculé en pourcentage du chiffre d'affaires ou des recettes brutes, en deçà duquel l'impôt liquidé selon le barème ne peut descendre pour les activités commerciales et non commerciales (article 44 § II du code de l'IRPP et de l'IS).",
  "source": "Code de l'IRPP et de l'IS, art. 44, § II",
  "terme": "Minimum d'impôt"
 },
 "minimum-impot-chiffre-affaires": {
  "autre": "الضريبة الدنيا",
  "definition": "Plancher de l'impôt annuel, prévu au paragraphe II de l'article 49 du code : une fraction du chiffre d'affaires brut, assortie d'un montant minimal exigible même en l'absence de chiffre d'affaires. Il ne se confond ni avec le minimum d'impôt de l'article 12 bis de la loi n° 89-114, qui plafonne les avantages fiscaux et s'assied sur l'impôt théorique, ni avec celui de l'article 44 § II, qui en est l'équivalent du côté de l'impôt sur le revenu.",
  "source": "Code de l'IRPP et de l'IS, art. 49 § II",
  "terme": "Minimum d'impôt sur le chiffre d'affaires"
 },
 "option-assujettissement": {
  "autre": "الاختيار للخضوع للأداء",
  "definition": "Faculté ouverte à certaines personnes placées hors du champ de la taxe de s'y soumettre volontairement, afin notamment d'exercer le droit à déduction.",
  "source": "Loi n° 88-61 du 2 juin 1988, art. 2 § I-3",
  "terme": "Option pour la qualité d'assujetti"
 },
 "position-tarifaire": {
  "autre": "البند التعريفي",
  "definition": "Numéro du tarif douanier par lequel le tableau annexé désigne les produits soumis au droit de consommation ; le tableau de 1988 en fait le titre de sa première colonne, « NT ». La position est soit entière (02-03), soit extraite et préfixée « Ex », le libellé précisant alors quelle partie de la position est retenue et quelles exclusions s'y attachent. Le champ du droit de consommation est ainsi défini par une liste douanière, et non par une catégorie économique.",
  "source": "Loi n° 88-62 du 2 juin 1988, tableau annexé, colonne « NT »",
  "terme": "Position tarifaire"
 },
 "prime-investissement": {
  "autre": "منحة الاستثمار",
  "definition": "Prime accordée aux projets d'intérêt national dans la limite du tiers du coût d'investissement, y compris les dépenses des travaux d'infrastructures intra-muros ; son plafond est fixé par décret gouvernemental (loi n° 2016-71, article 20). Elle ne se confond pas avec les quatre primes de l'article 19 de la même loi, nommées chacune par son objet — augmentation de la valeur ajoutée et de la compétitivité, développement de la capacité d'employabilité, développement régional, développement durable.",
  "source": "Loi n° 2016-71 du 30 septembre 2016, art. 20",
  "terme": "Prime d'investissement"
 },
 "projet-interet-national": {
  "autre": "المشاريع ذات الأهمية الوطنية",
  "definition": "Projets désignés par décret gouvernemental d'après la taille de leur investissement ou leur capacité d'employabilité, et qui satisfont à l'un au moins des objectifs de l'article premier de la loi de l'investissement. Ils bénéficient d'une déduction des bénéfices de l'assiette de l'impôt sur les sociétés dans la limite de dix années, d'une prime d'investissement dans la limite du tiers du coût d'investissement et de la participation de l'État aux dépenses des travaux d'infrastructure ; ces incitations sont octroyées à chaque projet par décret gouvernemental (loi n° 2016-71, article 20).",
  "source": "Loi n° 2016-71 du 30 septembre 2016, art. 20",
  "terme": "Projets d'intérêt national"
 },
 "promoteur-immobilier": {
  "autre": "الباعث العقاري",
  "definition": "Opérateur immobilier dont certaines ventes relèvent de règles propres de TVA. Les ventes de lots de terrain par les promoteurs immobiliers entrent dans le champ de la taxe en 2017 ; leurs ventes de logements relèvent ensuite des exonérations ou des taux prévus par le code.",
  "source": "Loi n° 2016-78 du 17 décembre 2016, art. 20",
  "terme": "Promoteur immobilier"
 },
 "prorata-deduction-tva": {
  "autre": "النسبة المائوية للطرح",
  "definition": "Fraction de la TVA d'amont que l'assujetti partiel peut déduire : rapport entre les recettes soumises à la taxe, augmentées de celles de l'exportation et des ventes en suspension, et l'ensemble des recettes, exonérées ou hors champ comprises. Calculé sur l'année précédente, il est arrêté en fin d'année civile sur les éléments de l'année.",
  "source": "Loi n° 88-61 du 2 juin 1988, art. 9, § II et III",
  "terme": "Pourcentage de déduction"
 },
 "recettes-fiscales": {
  "autre": "المداخيل الجبائية",
  "definition": "Ensemble des impôts, droits et taxes perçus par l'État, à l'exclusion des recettes non fiscales. Les documents budgétaires tunisiens les distinguent des recettes non fiscales, qui proviennent notamment de la redevance de transit du gaz.",
  "terme": "Recettes fiscales"
 },
 "regime-forfaitaire": {
  "autre": "النظام التقديري",
  "definition": "Régime d'imposition des entreprises individuelles réalisant des bénéfices industriels et commerciaux dans un établissement unique, sous conditions d'activité et de chiffre d'affaires : l'impôt y est déterminé forfaitairement à partir du chiffre d'affaires annuel, et non du bénéfice réel. Institué au § IV de l'article 44 du code, il a été transféré aux articles 44 bis à 44 sexies.",
  "source": "Code de l'IRPP et de l'IS, art. 44, § IV",
  "terme": "Régime forfaitaire d'imposition"
 },
 "regime-forfaitaire-optionnel": {
  "autre": "النظام التقديري الاختياري",
  "definition": "Régime ouvert sur option, ajouté à l'article 44 ter du code par l'article 91 de la loi de finances pour 2026, aux contribuables dont le chiffre d'affaires annuel n'excède pas 100 000 dinars : l'impôt y est forfaitisé en deux classes (4 000 et 5 000 dinars par an, réduits de moitié dans les campagnes et villages) et libératoire dans la limite du chiffre d'affaires déclaré spontanément. Terme français provisoire : seul le texte arabe du JORT est publié à ce jour.",
  "source": "Loi n° 2025-17 du 12 décembre 2025, art. 91",
  "terme": "Régime forfaitaire optionnel"
 },
 "regime-suspensif-tva": {
  "autre": "نظام توقيف العمل بالأداء على القيمة المضافة",
  "definition": "Régime permettant, dans les cas et conditions prévus par le code, d'importer ou d'acquérir localement des biens et services sans paiement de la TVA lors de l'opération. Il bénéficie notamment à certaines entreprises exportatrices pour leurs acquisitions ouvrant droit à déduction.",
  "source": "Loi n° 88-61 du 2 juin 1988, art. 11",
  "terme": "Régime suspensif de la taxe sur la valeur ajoutée"
 },
 "regularisation-deductions-tva": {
  "autre": "تعديل الطرح",
  "definition": "Correction de la déduction initiale lorsque la situation change : variation de plus de cinq centièmes du pourcentage de déduction pour les biens amortissables, cession, changement d'affectation, cessation d'activité ou abandon de la qualité d'assujetti. La taxe déduite est alors reversée, diminuée d'un cinquième par année de détention pour les équipements et le matériel, et d'un dixième pour les bâtiments.",
  "source": "Loi n° 88-61 du 2 juin 1988, art. 9, § III et IV",
  "terme": "Régularisation des déductions"
 },
 "restitution-credit-tva": {
  "autre": "إرجاع فائض الأداء على القيمة المضافة",
  "definition": "Remboursement par le Trésor du crédit de TVA que l'imputation n'a pu absorber, organisé par l'article 15 du code. Hors exportation et ventes en suspension, elle a été partielle jusqu'en 2006 (20 % du crédit en 1988, 50 % en 1999) ; elle est intégrale dans tous les cas depuis le 1er janvier 2007. Ses délais relèvent du code des droits et procédures fiscaux depuis 2002.",
  "source": "Loi n° 2006-80 du 18 décembre 2006, art. 15",
  "terme": "Restitution du crédit de taxe sur la valeur ajoutée"
 },
 "retenue-a-la-source": {
  "autre": "الخصم من المورد",
  "definition": "Prélèvement de l'impôt opéré par celui qui paie une somme, pour le compte de celui qui la reçoit ; le montant retenu est reversé au Trésor et imputé sur l'impôt dû par ce dernier. En matière d'impôt sur le revenu des personnes physiques, l'employeur l'opère lors du paiement du traitement et des indemnités imposables (code de l'IRPP et de l'IS, loi n°89-114). En matière de taxe sur la valeur ajoutée, l'État, les collectivités locales, les entreprises et les établissements publics retiennent une part de la taxe facturée par leurs fournisseurs : 50 % à compter de 1998, 25 % à compter de 2016.",
  "source": "Loi n° 89-114 du 30 décembre 1989",
  "terme": "Retenue à la source"
 },
 "revenus-fonciers": {
  "autre": "المداخيل العقارية",
  "definition": "Catégorie définie par subsidiarité : y entrent les revenus des immeubles et des droits immobiliers lorsqu'ils ne relèvent pas d'une autre catégorie. Le revenu net des propriétés bâties se détermine forfaitairement.",
  "source": "Code de l'IRPP et de l'IS, art. 27",
  "terme": "Revenus fonciers"
 },
 "smig": {
  "acronyme": "SMIG",
  "autre": "الأجر الأدنى المضمون لمختلف المهن",
  "definition": "Rémunération horaire ou mensuelle minimale légale applicable aux salariés des secteurs non agricoles.",
  "source": "Décret gouvernemental n° 2017-668 du 5 juin 2017",
  "terme": "Salaire minimum interprofessionnel garanti"
 },
 "suspension-droit-consommation": {
  "autre": "توقيف العمل بالمعلوم على الاستهلاك",
  "definition": "Régime par lequel le droit de consommation n'est pas exigé lors d'une opération qui, sans lui, y serait soumise. L'article 6 bis de la loi n° 88-62, ajouté par l'article 22 de la loi de finances pour 2018, en institue un cas : les véhicules tout terrain importés par les concessionnaires au profit des agences de voyages.",
  "source": "Loi n° 88-62 du 2 juin 1988, art. 6 bis",
  "terme": "Suspension du droit de consommation"
 },
 "systeme-fiscal-de-reference": {
  "autre": "النظام الجبائي المرجعي",
  "definition": "Au sens du rapport annexé au projet de loi de finances pour 2021, les dispositions de base de chaque impôt, au regard desquelles une mesure est dite dérogatoire et comptée parmi les dépenses fiscales. Le rapport retient l'approche qu'il appelle juridique : le régime de référence y est « l'ensemble des dispositions essentielles prévues par le droit commun », identifié pour chaque type d'impôt.",
  "source": "Rapport sur les dépenses fiscales et les avantages financiers, annexe au projet de loi de finances, rapport annexé au projet de loi de finances pour 2021, section II, § 1",
  "terme": "Système fiscal de référence"
 },
 "tableau-a-tva": {
  "autre": "الجدول « أ »",
  "definition": "Annexe du code énumérant les produits et opérations exonérés de la taxe. Toute modification passe par une loi, le plus souvent une loi de finances.",
  "source": "Loi n° 88-61 du 2 juin 1988, tableau A",
  "terme": "Tableau A du code de la TVA"
 },
 "tableau-annexe-loi-88-62": {
  "autre": "الجدول المدرج بملحق القانون عدد 62 لسنة 1988",
  "definition": "Liste des produits soumis au droit de consommation, annexée à la loi n° 88-62 du 2 juin 1988. Elle porte à la fois le champ d'application et les taux : trois colonnes — numéro du tarif douanier, désignation des produits, droit applicable — et des renvois qui ajoutent des règles de fond. Modifier le tableau, c'est donc modifier le champ. Celui de 1988 a été abrogé et remplacé en entier deux fois, par l'article 44 de la loi de finances pour 2016 puis par l'article 45 de la loi de finances pour 2018 : pour l'état en vigueur, la source est la version consolidée du code, et non le texte de 1988.",
  "source": "Loi n° 88-62 du 2 juin 1988, tableau annexé",
  "terme": "Tableau annexé à la loi n° 88-62"
 },
 "tableau-b-bis-tva": {
  "autre": "الجدول « ب مكرر »",
  "definition": "Annexe créée par la loi de finances pour 2002, qui portait un taux intermédiaire, et abrogée par la loi de finances pour 2017. Dispositif historique : il ne s'applique plus.",
  "source": "Loi n° 2001-123 du 28 décembre 2001, art. 82 à 84",
  "terme": "Tableau B bis du code de la TVA"
 },
 "tableau-b-tva": {
  "autre": "الجدول « ب »",
  "definition": "Annexe du code énumérant les produits et services soumis au taux réduit. L'électricité et les carburants y figuraient en 1988 ; ils en sont sortis par l'article 40 de la loi n° 95-109.",
  "source": "Loi n° 88-61 du 2 juin 1988, tableau B ; art. 7 § 1",
  "terme": "Tableau B du code de la TVA"
 },
 "tableau-c-tva": {
  "autre": "الجدول « ج »",
  "definition": "Annexe du code énumérant les produits soumis au taux majoré. Supprimée au 1er janvier 2007 par l'article 13 de la loi n° 2006-80. Dispositif historique.",
  "source": "Loi n° 88-61 du 2 juin 1988, tableau C",
  "terme": "Tableau C du code de la TVA"
 },
 "taux-ad-valorem": {
  "autre": "نسبة من القيمة",
  "definition": "Taux exprimé en pourcentage d'une valeur, par opposition au taux spécifique. Lorsque le tableau annexé soumet un produit à un taux ad valorem, l'assiette du droit de consommation est, à l'importation, la valeur en douane et, en régime intérieur, le prix de vente tous frais, droits et taxes compris, à l'exclusion du droit de consommation lui-même et de la taxe sur la valeur ajoutée.",
  "source": "Loi n° 88-62 du 2 juin 1988, art. 4-a",
  "terme": "Taux ad valorem"
 },
 "taux-majore-tva": {
  "autre": "النسبة المرتفعة",
  "definition": "Taux supérieur au taux normal, appliqué aux produits du tableau C de 1988 à 2006. Supprimé au 1er janvier 2007. Dispositif historique.",
  "source": "Loi n° 88-61 du 2 juin 1988, art. 7",
  "terme": "Taux majoré de la TVA"
 },
 "taux-marginal": {
  "autre": "النسبة الحدية",
  "definition": "Taux d'imposition applicable à la dernière tranche de revenu ; dans un barème progressif, il s'applique à l'euro (au dinar) supplémentaire.",
  "source": "Code de l'IRPP et de l'IS, art. 44 § I",
  "terme": "Taux marginal"
 },
 "taux-normal-tva": {
  "autre": "النسبة العادية",
  "definition": "Taux de droit commun, applicable à toute opération imposable qu'un texte ne range pas ailleurs. Fixé à 17 % en 1988, porté à 18 % puis à 19 %.",
  "source": "Loi n° 88-61 du 2 juin 1988, art. 7 § 1",
  "terme": "Taux normal de la TVA"
 },
 "taux-reduit-tva": {
  "autre": "النسبة المخفضة",
  "definition": "Taux inférieur au taux normal, applicable aux produits et services que le tableau B énumère. L'article 8 du code borne à l'année civile toute réduction accordée par décret, d'où des reconductions annuelles.",
  "source": "Loi n° 88-61 du 2 juin 1988, art. 7 § 2",
  "terme": "Taux réduit de la TVA"
 },
 "taux-specifique": {
  "autre": "نسبة نوعية",
  "definition": "Taux assis non sur une valeur mais sur une quantité — volume ou poids —, par opposition au taux ad valorem. Le tableau annexé mêle les deux techniques dès 1988 : le droit de consommation n'est donc ni une taxe ad valorem ni une accise spécifique, mais mixte dès l'origine. Un tarif spécifique ne suit pas les prix ; il ne varie qu'à chaque révision du tableau, de sorte qu'une longue stabilité nominale y équivaut à une érosion réelle.",
  "source": "Loi n° 88-62 du 2 juin 1988, art. 4-b",
  "terme": "Taux spécifique"
 },
 "taxe-a-la-production": {
  "autre": "الأداء على الإنتاج",
  "definition": "Taxe sur le chiffre d'affaires antérieure à la TVA, abrogée par l'article 2 de la loi n° 88-61. Les recettes qu'elle produisait figurent avant 1988 sous la rubrique « TVA » des statistiques du ministère des Finances. Dispositif historique.",
  "source": "Loi n° 88-61 du 2 juin 1988, art. 2",
  "terme": "Taxe à la production"
 },
 "taxe-bieres-vins-boissons-alcoolisees": {
  "autre": "الأداء على الجعة والخمور والمشروبات الكحولية الأخرى",
  "definition": "Taxe instituée par les articles 4 à 11 de la loi n° 84-2 du 21 mars 1984, portant loi de finances complémentaire pour la gestion 1984, en remplacement de la taxe parafiscale unique sur les vins, bières et boissons alcoolisées. Ces articles ont été abrogés par l'article 7 de la loi n° 88-62 du 2 juin 1988, qui lui substitue le droit de consommation. Dispositif historique.",
  "source": "Loi n° 88-62 du 2 juin 1988, art. 7",
  "terme": "Taxe sur les bières, vins et autres boissons alcoolisées"
 },
 "taxe-forfaitaire-annuelle-tva": {
  "autre": "الأداء السنوي التقديري",
  "definition": "Régime historique institué par la loi de finances pour 1990 pour certaines entreprises individuelles à établissement unique dont le chiffre d'affaires ne dépassait pas les plafonds prévus. La taxe était fixée annuellement par un barème selon l'activité et le chiffre d'affaires. Elle a été abrogée par la loi de finances pour 1993.",
  "source": "Loi n° 89-115 du 30 décembre 1989, art. 24 et 25",
  "terme": "Taxe forfaitaire annuelle"
 },
 "taxe-forfaitaire-mensuelle-transports": {
  "autre": "أداء تقديري شهري على القيمة المضافة",
  "definition": "Taxe mensuelle applicable aux opérations de transport terrestre, sauf le transport de personnes par voiture de louage ou taxi. Elle est calculée selon la charge utile ou le nombre de places offertes et s'impute sur la TVA due par les assujettis relevant du régime réel.",
  "source": "Loi n° 97-88 du 29 décembre 1997, art. 29",
  "terme": "Taxe forfaitaire mensuelle sur la valeur ajoutée"
 },
 "taxe-prestations-de-service": {
  "autre": "الأداء على الخدمات",
  "definition": "Taxe sur le chiffre d'affaires antérieure à la TVA, frappant les services, abrogée par l'article 2 de la loi n° 88-61. Dispositif historique.",
  "source": "Loi n° 88-61 du 2 juin 1988, art. 2",
  "terme": "Taxe sur les prestations de service"
 },
 "taxe-unique-compensation-carburants": {
  "autre": "المعلوم الوحيد التعويضي على منتوجات النفط",
