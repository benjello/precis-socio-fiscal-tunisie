perimetre: >-
  Articles « droits de douane » et « redevances sur prestations douanières » du tableau A des
  lois de finances initiales, 2001-2026 ; réalisations 2018-2024 de la Cour des comptes.
  La rubrique « droits de douane » du ministère des Finances comprend les redevances.
caveats: >-
  Prévisions et réalisations ne se confondent pas. Nomenclature du tableau A changée en 2020,
  avec raccord : 17-01 = 21-01 ; 17-02 = 21-02 + 21-03. Articles 21-02 de 2009 et de 2013
  imprimés avec le libellé « droits de douane à l'exportation », lus comme la redevance à
  l'importation. Depuis 1994, la redevance à l'importation est assise sur les droits et taxes liquidés
  en douane (loi de finances pour 1994, art. 75).
