# Manifeste des tarifs relevés du droit de consommation.
#
# Fichier TENU À LA MAIN — il n'est produit par aucun générateur. Il accompagne
# tarifs-releves-droits-consommation.csv, dont il énonce la provenance et, surtout,
# les LIMITES DE COUVERTURE. Le titre dit « tarifs relevés » et non « produits taxés » :
# le relevé est partiel, et le manifeste dit où il s'arrête.
#
# Le CSV est en FORMAT LONG : une ligne par (tableau, produit, colonne). Les quatre
# états que le chapitre écrivait en prose dans ses cellules — ligne inexistante,
# ligne scindée, non établi, sans objet — sont portés par le champ `statut`, la
# cellule `valeur` restant vide. Le rendu les restitue à l'identique.

format: long
cle_de_ligne: [tableau, ordre, colonne]
statuts:
  lu: valeur lue dans le texte cité
  consolidé: valeur lue dans un état consolidé du code, non dans le texte d'origine
  ligne inexistante: le produit ne figurait pas au tarif à cette date
  ligne scindée: la ligne a été remplacée par plusieurs lignes à cette date
  non établi: la valeur n'a pas été vérifiée sur pièce
  sans objet: ligne née d'une scission postérieure, sans antécédent à cette date

tableaux:

  advalorem-1988:
    titre: Taux ad valorem du tableau annexé de 1988 — exemples relevés
    ancre: tbl-dc-advalorem-1988
    lignes: 18
    sources: [loi-88-62-droit-consommation]
    couverture: PARTIELLE
    couverture_detail: >-
      Relevé sur les pages 847-849 et 855-856 du fascicule, seules pages relues sur le
      fac-similé. Les pages 850-854, qui concernent notamment les textiles et divers
      ouvrages manufacturés, ne sont pas établies : aucun taux n'en est cité.

  specifiques-1988:
    titre: Tarifs spécifiques du tableau annexé de 1988
    ancre: tbl-dc-specifiques-1988
    lignes: 18
    sources: [loi-88-62-droit-consommation]
    couverture: COMPLÈTE pour les positions relevées
    couverture_detail: >-
      Tableau annexé, p. 848-849. Les explosifs préparés (position 36-02) sont hors
      relevé : ils relèvent d'une formule particulière exposée au renvoi (3) du tableau,
      non d'un tarif.

  transfert-2007:
    titre: Les cinq positions ajoutées au tableau annexé au 1er janvier 2007
    ancre: tbl-dc-transfert-2007
    lignes: 5
    sources: [loi-2006-80-reduction-taux, dgi-nc-24-2007]
    couverture: COMPLÈTE
    couverture_detail: >-
      Les cinq lignes ajoutées par l'article 14, toutes au taux de 10 %. Effet au
      1er janvier 2007, énoncé par l'article 19 de la loi — seule date d'effet de loi de
      finances lue dans le texte pour ce chapitre.

  en-vigueur-2023:
    titre: Tableau des produits soumis au droit de consommation, état consolidé de 2023
    ancre: tbl-dc-en-vigueur
    lignes: 81
    postes: 40
    sources: [dgelf-code-tva-2023]
    couverture: COMPLÈTE
    couverture_detail: >-
      Les quarante postes du tableau annexé, pages 92 à 96 du code consolidé de la TVA et
      du droit de consommation, édition 2023, et les quatre-vingt-un tarifs qu'ils portent.
      Relevé par extraction géométrique des coordonnées du PDF, puis CONTRÔLÉ POSTE PAR
      POSTE contre une table de référence établie à la lecture des cinq images : quarante
      postes, quatre-vingt-un tarifs, zéro écart. Les comptes seuls ne suffisaient pas —
      une première extraction en rendait exactement quatre-vingt-un en rattachant des
      tarifs au mauvais poste, faute d'avoir vu trois postes en tête de page.
      AUCUNE DATE D'EFFET n'est portée : c'est un état consolidé, non une entrée en
      vigueur. Les notes de bas de page rattachent chaque modification à sa loi de
      finances ; elles ne sont pas dépouillées ici.

  petroliers:
    titre: Tarif du droit de consommation sur les produits pétroliers, 1988-2023
    ancre: tbl-dc-petroliers
    lignes: 19
    colonnes: [1988, 1991, 1999, Consolidé 2023]
    sources:
      - loi-88-62-droit-consommation
      - decret-91-550-tarif-petroliers
      - decret-99-894-tarif-petroliers
      - dgelf-code-tva-2023
      - loi-2007-70-lf-2008
    couverture: COMPLÈTE sauf une cellule
    couverture_detail: >-
      La colonne 1991 porte les tarifs applicables à compter du 5 février 1991 ; la
      colonne 1999, ceux applicables à compter du 22 avril 1999 ; la colonne 2023 décrit
      un état consolidé et non une entrée en vigueur, d'où une date d'effet vide. Le
      pétrole lampant 2023 est « non établi » : la ligne ne figure ni parmi les tarifs
      inchangés ni parmi les tarifs relevés de l'état consolidé. La ligne « gaz naturel
      carburant » vient de loi-2007-70-lf-2008, art. 58.

  alcools-tarifs:
    titre: Tarif du droit de consommation sur les bières, vins et alcools, 1997-2021
    ancre: tbl-dc-alcools-tarifs
    lignes: 60
    colonnes: [4 août 1997, 21 février 2013, 24 novembre 2015, 1er janvier 2018, 1er janvier 2021]
    sources:
      - decret-97-1368-regime-alcools
      - decret-2013-929-alcools
      - decret-gouv-2015-1768-annexes-alcools
      - lf-2018
      - lf-2021
    couverture: PARTIELLE
    couverture_detail: >-
      Douze lignes des positions 22-03 à 22-08, aux cinq dates où l'une d'elles change :
      annexes I à III du décret n° 97-1368 (JORT n° 59, p. 1316), tableaux du décret
      n° 2013-929, annexe du décret gouvernemental n° 2015-1768, tableaux annexés aux lois
      de finances pour 2018 (art. 45) et 2021 (art. 20). Le tableau annexé à la loi de
      finances pour 2016 (art. 44) reprend les valeurs de la colonne du 24 novembre 2015 ;
      il n'a donc pas de colonne propre. La colonne du 21 février 2013 porte, pour les
      positions 22-05, 22-06 et Ex 22-08, la mention « sans modification » du décret :
      la valeur affichée est celle de l'annexe III de 1997. La colonne de 2021 reprend, pour
      les lignes que l'article 20 ne vise pas, la valeur du tableau de 2018. Sont hors relevé :
      la bière à pression et en vrac de 1997 et 2013, les lignes Ex 21-06 et Ex 33-02, et
      quatre des cinq lignes de la position 22-07. Les valeurs de 1997 des spiritueux sont
      celles de l'annexe III ; le décret n'en indique pas l'assiette, qui est celle de la loi
      n° 88-62. Les lois de finances antérieures à 2018 n'ont pas été dépouillées une à une
      pour ces positions.

  capsule-fiscale:
    titre: Tarif de la capsule fiscale sur les vins, 1997-2022
    ancre: tbl-dc-capsule
    lignes: 18
    colonnes: [Annexe IV de 1997, 13 août 2007, 25 juin 2022]
    sources:
      - decret-97-1368-regime-alcools
      - decret-2007-1977-alcools
      - decret-pres-2022-545-capsule-vins
    couverture: COMPLÈTE
    couverture_detail: >-
      Les six catégories de l'annexe IV et leurs trois états successifs. La date d'effet de
      l'annexe de 1997 est vide : l'application de la capsule dépend d'un avis de
      l'administration aux embouteilleurs (art. 44 du décret), dont la date ne se lit pas
      au JORT. Les dates de 2007 et de 2022 sont celles de l'exécution des décrets, cinq
      jours après le dépôt du fascicule.

# La désignation des positions varie selon les textes : le tableau de 1988 porte la
# position entière « 27-10 », tandis que les décrets de 1991 et de 1999 désignent les
# mêmes produits par la position extraite « Ex 27-10 ». Le CSV retient la position entière.
#
# Les positions 27-09 à 27-11 apparaissent dans DEUX tableaux (specifiques-1988 et la
# colonne 1988 de petroliers). C'est voulu : les deux tableaux servent deux propos
# distincts dans le chapitre, et leurs quatorze valeurs 1988 coïncident.
#
# DEUX GRAPHIES, TOUTES DEUX AUTHENTIQUES — À NE PAS UNIFIER.
# Le même produit est orthographié « gas-oil » dans specifiques-1988 et « gaz-oil » dans
# petroliers. Ce n'est PAS une erreur de transcription : les deux tableaux sont fidèles à
# deux textes qui écrivent différemment.
#   - Loi n° 88-62, tableau annexé, position 27-10 : « — Gas-oil », avec le tarif
#     2d,887/hl. VÉRIFIÉ SUR L'IMAGE du fac-similé, JORT n° 39 du 10 juin 1988, folio 849
#     (et non 848 : le bloc pétrolier commence à la page suivante ; le folio se lit en
#     pied de page).
#   - Décret n° 91-550, tableau de l'article premier : « Gaz-oil 4,7456D/hl », lu dans le
#     JORT n° 29 du 30 avril 1991. Les valeurs voisines corroborent le relevé (essence
#     super 18,9456 D/hl, pétrole lampant 2,9839 D/hl).
# Unifier les deux graphies ferait dire à l'un des deux textes ce qu'il n'écrit pas.
#
#   - Décret n° 99-894, tarif complet : « gaz-oil », lu à l'image du JORT n° 33 du
#     23 avril 1999, p. 624-625 (la couche texte de ce fascicule est corrompue : le
#     relevé ne peut pas se faire par recherche, seulement à l'image).
#   - Code consolidé 2023 : « Gaz-oil », et « Gaz-oil d'une teneur en poids de soufre
#     réduite » pour la ligne née après 1999. Contexte tarifaire vérifié — l'unique
#     « gas-oil » du même code désigne des appareils de filtration pour matériel de
#     chemins de fer, et non un poste du tarif.
#
# Les quatre colonnes sont donc établies : 1988 écrit « Gas-oil », les trois autres
# « Gaz-oil ». Le libellé de la ligne « petroliers » suit la graphie majoritaire de ses
# sources, et c'est « specifiques-1988 » qui porte celle de 1988.
#
# CORROBORATION INDÉPENDANTE des valeurs : la note commune n° 7 de 2015 (commentaire des
# articles 44, 45 et 57 de la loi n° 2015-53) donne « Gaz-oil normal … 5,8309 D/HL
# 12,116 D/HL », soit à la fois le tarif de 1999 et celui de l'état consolidé, dans un
# document étranger aux deux textes cités.
