caveats: [Indices de prix de transaction (ventes enregistrées), par type de bien ; pas d'indice général dans cette série. Rupture de méthode : la publication a été interrompue en 2022-2023 pour révision, puis reprise au T1 2024 avec toute la série recalculée selon la nouvelle méthodologie ; elle ne se raccorde pas à la série de l'ancienne méthodologie (au T4 2021, terrains 152,75 contre 147,18, appartements 148,48 contre 149,84, maisons 135,81 contre 136,71). Les prix sont déclarés et leurs valeurs sont révisables : un même trimestre diffère légèrement d'une édition du classeur à l'autre (T1 2000, terrains : 39,909 dans l'édition du T4 2025, 39,891 dans celle du T1 2024). Les valeurs données sont celles de l'édition du T4 2025., Indices de prix de transaction (ventes enregistrées), par type de bien, avec un indice général que la série révisée ne publie pas. Ancienne méthodologie : la série s'arrête au T4 2021, la publication ayant été interrompue ensuite pour révision. Elle ne se raccorde pas à la série révisée (au T4 2021, terrains 147,18 contre 152,75, appartements 149,84 contre 148,48, maisons 136,71 contre 135,81). Les prix sont déclarés et les valeurs révisables. Les valeurs données sont celles de l'édition du T4 2021, la dernière avant l'interruption., DEUX INDICES RACCORDÉS EN 1970 : l'indice du coût de la vie en base 100 en 1962 (131,6 en 1970) est ramené à la base 1970. Les valeurs 1962-1975 sont RELEVÉES À LA MAIN dans les rapports de la BCT, dont la couche texte est une océrisation abîmée (« 12S,O » pour 125,0) ; chacune est recoupée par la variation énoncée en prose, et la source de chaque valeur est dans la colonne `source`. L'annuaire 1995-2001 imprime 108,2 pour 1985 au lieu de 288,0 : ligne écartée, valeur prise dans l'annuaire 1998-2002. Le plus récent annuaire fait foi (2001 : 640,5 au lieu de 645,4 provisoire). Au-delà de 2003, employer `bct-ipc-base2015`., EXTRAIT DU RAPPORT ANNUEL, ET NON DU BULLETIN : l'intitulé du BSF (« base 100 en 2010 ») est périmé et ses valeurs récentes sont en base 2015 — voir docs/tables-a-extraire-pdf.md §1. L'ANNÉE DE BASE 2015 = 100 EST POSÉE PAR DÉFINITION, non lue : aucun rapport ne tabule son année de base, tous ne publiant que les millésimes récents. Série RECONSTITUÉE en recollant huit rapports, de 2018 à 2025 (ceux de 2021 et de 2025 coupent le libellé sur trois lignes ; ils sont lus depuis le 2026-10-08), chacun n'en publiant que trois millésimes ; toutes les années communes concordent, et le script LÈVE en cas de divergence — un indice de prix ne se révise pas d'une publication à l'autre, contrairement aux effectifs. La colonne `rapports_concordants` compte les rapports qui impriment la valeur : 2025 (186,3) n'en a qu'UN, le Rapport annuel 2025 (tableau 2-1, p. 57), qui reprend 2024 (176,8) sans le réviser. ÉCART AU TAUX IMPRIMÉ EN 2025 : 186,3 ÷ 176,8 donne +5,37 %, soit 5,4 au dixième, quand le même rapport imprime 5,3 % d'inflation moyenne ; l'arrondi des deux indices permet 5,32 à 5,43 %, et un taux imprimé 5,3 recouvre 5,25 à 5,35 % : les deux ne se rejoignent qu'à la limite (5,32 à 5,35). Le rapport ne dit pas comment il calcule le taux moyen ; écart signalé, non expliqué, rien n'est corrigé. S'ARRÊTE EN 2025 : aucune déflation n'est possible au-delà, ce qui laisse sans équivalent réel les tranches d'augmentation programmées jusqu'en 2028. Déflater une date en cours d'année par l'indice ANNUEL MOYEN est une approximation.]
