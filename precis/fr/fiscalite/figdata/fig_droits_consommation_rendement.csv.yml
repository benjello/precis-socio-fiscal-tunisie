caveats: [sources/minfinances-recettes-fiscales.md, LE PIB DU MINISTÈRE (`pib_minfin_MDT`) N'EST PAS D'UNE SEULE BASE : base 1983 jusqu'en 1996 (présumée avant 1992), base 1997 en 1997-2001 et 2005-2009, valeurs propres au ministère en 2002-2004 et 2025, base 2015 de l'INS de 2010 à 2024 (rétropolée par l'INS pour 2010-2014). RUPTURES DE SÉRIE (colonne `rupture`) : 1997 (niveau + 9,8 %), 2002, 2005, 2010 (niveau + 4,9 %), 2025. Tracer toute part du PIB par segments (`segment_pib`), jamais d'un trait continu. `pib_cnat_MDT` est le PIB de la série `masse-salariale-ratios` : il n'est celui des Comptes de la nation que pour 2010-2024, et ses valeurs ont changé en octobre 2026 : 2012-2014 (base 1997 → base 2015 rétropolée : 70 354,4 → 73 895,4 ; 75 144,1 → 79 096,6 ; 80 865,5 → 85 345,7) et 2023-2024 (dernière édition des Comptes de la nation : 149 733,8 → 149 793,6 ; 159 760,6 → 159 852,7) ; il est égal à `pib_minfin_MDT` de 1990 à 2025, sauf 2023-2024 où le ministère garde l'édition 2020-2024. Voir sources/minfinances-recettes-fiscales.md., TROIS BASES, JAMAIS RACCORDÉES : filtrer `base`, ne jamais tracer d'un trait d'une base à l'autre. L'écart entre bases n'est pas constant (voir `pib-courant-recouvrements`). `retropole` : oui pour la base 2015 en 2010-2014 et la base 1997 en 1997-2004, non pour une année publiée dans une édition de sa base, « non précisé par la source » pour la base 1983 et le ministère. Aucune base dite avant 1992 ; rien en base 1997 après 2017 ni en base 2015 avant 2010. Le classeur de l'INS est hors git. Voir docs/pib-courant-par-base.md.]
