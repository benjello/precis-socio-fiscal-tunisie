caveats: [Les états de janvier 2008 et de janvier 2014 sont ceux de deux recueils non officiels du code, qui ne valent pas Journal officiel et n'ont pas été rapprochées de lui numéro par numéro. L'état du 1er janvier 2026 est celui de l'édition du code publiée par le ministère des Finances à jour au 1er janvier 2025, complétée par la loi de finances pour 2026. Dix-huit lignes portent un taux que la loi n'écrit pas : l'opération ne figure dans aucun tableau et relève du taux normal par la règle générale de l'article 7. La série ne couvre ni les opérations hors du champ de la taxe, ni l'exonération à la revente au détail, ni les régimes suspensifs ; une catégorie absente des tableaux à une date n'a pas de ligne, ce qui ne vaut pas taux normal. Un régime appliqué entre deux dates repères n'apparaît pas.]
