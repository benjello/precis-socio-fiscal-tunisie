caveats: [Le taux de perception implicite est un calcul du précis, non une valeur publiée : rubrique « droits de douane » du ministère (redevances comprises) divisée par les importations CAF. Les moyennes simples des rapports extérieurs diffèrent par la définition (neuf ou onze chiffres, droits complémentaires provisoires compris ou non) ; elles ne sont pas des taux de perception., sources/minfinances-recettes-fiscales.md, STATISTIQUE PUBLIQUE, non budgétaire. L'ANNUAIRE NE DÉFINIT PAS LES DEUX RÉGIMES dans les pages lues ; le libellé arabe est « régime non résident » (نظام غير مقيم), qui n'est pas la notion d'entreprise totalement exportatrice du code de 1993 : ne pas assimiler sans source. PART NON PUBLIÉE : part_off_shore_pct = 100 × régime off shore / ensemble, tels qu'imprimés, arrondie au dixième. ARBITRAGE : chaque année est imprimée dans une à trois éditions ; la série retient la dernière (même source, même tableau, millésimes successifs) ; nb_editions_differentes compte les éditions antérieures aux chiffres différents — 2001, 2002, 2004 (exportations 12 054,9 puis 12 403,8), 2005, 2007, 2014, 2021 ; toutes les attestations sont dans ins-commerce-exterieur-par-regime-editions. LA DERNIÈRE ANNÉE D'UNE ÉDITION EST SOUVENT RÉVISÉE PAR LA SUIVANTE (dix des treize attestations révisées) : 2023, imprimée dans la seule édition 2019-2023 (`nb_editions` = 1), peut l'être encore. EN 2004 ET 2005 LA RÉVISION PORTE SUR LE SEUL RÉGIME OFF SHORE (+ 2 à + 4 %), le régime général ne bougeant pas ; 2003 et les années antérieures ne sont imprimées dans aucune édition postérieure à cette révision : la source ne dit pas s'il s'agit de chiffres provisoires devenus définitifs ou d'un changement de méthode — ne pas tracer la part d'un trait continu à travers 2003-2004 sans le dire. Régime général + régime off shore = ensemble à 0,1 près (arrondis). RELU À L'IMAGE : en-têtes et trois lignes de total des 22 éditions. Ventilation par groupement sectoriel non transcrite. Montants courants ; aucun ratio au PIB. Série arrêtée à 2023 (édition 2019-2023).]
