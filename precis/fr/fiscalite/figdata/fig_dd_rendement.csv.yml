caveats: [Prévisions et réalisations ne se confondent pas. La nomenclature du tableau A change en 2020 et la série se raccorde : 17-01 = 21-01 ; 17-02 = 21-02 + 21-03. Les articles 21-02 de 2009 et de 2013 sont imprimés avec le libellé « droits de douane à l'exportation » et lus comme la redevance à l'importation. La rubrique « droits de douane » du ministère comprend la redevance., LE PIB N'EST JAMAIS CHAÎNÉ : segment_pib change en 1986, 1992, 1997, 2002, 2005, 2010 et 2025 ; une part du PIB se trace par segments. 1984-1985 : PIB de la Banque mondiale, bases accolées non raccordées ; 1986-1991 : PIB du ministère des Finances, base 1983 PRÉSUMÉE ; 2002-2004 et 2025 : valeur propre au ministère, rattachée à aucune base ; 2010-2014 : base 2015 rétropolée par l'INS. Les dépenses de l'État sont des RÉALISATIONS : rapportée à elles, une prévision de loi de finances donne un ordre de grandeur, non une exécution. AUCUNE DÉPENSE DE L'ÉTAT AVANT 1986.]
