project:
  type: book
  output-dir: public

lang: fr

book:
  title: "Fiscalité"
  author: "Mahdi Ben Jelloul"
  repo-url: https://github.com/benjello/precis-socio-fiscal-tunisie/
  repo-subdir: precis/fr/fiscalite
  repo-branch: master
  repo-actions: [edit, issue]
  downloads: [pdf]
  chapters:
    - index.qmd
    - part: "L'imposition directe"
      chapters:
        - _impot_revenu.qmd
        - _impot_societes.qmd
    - part: "L'imposition indirecte"
      chapters:
        - _tva.qmd
        - _droits_consommation.qmd
  appendices:
    - _glossaire.qmd

bibliography:
  - references.json
  - ../references.json
  - ../references.bib

format:
  html:
    theme: cosmo
    number-depth: 4
    toc: true
    toc-depth: 4
  pdf:
    documentclass: scrreprt
    toc: true
    toc-depth: 4
    number-sections: true
    number-depth: 4
