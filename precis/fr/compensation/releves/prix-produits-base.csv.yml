# Manifeste du relevé des prix des produits de base que la série engendrée ne porte pas.
#
# Fichier TENU À LA MAIN — il n'est produit par aucun générateur. Il accompagne
# prix-produits-base.csv, que lit precis/fr/compensation/figures/produits_base.py.
#
# CE QUI RESTE ICI, ET POURQUOI. Les prix au public fixés par décret ou par arrêté et publiés
# au Journal officiel de 1974 à 1991 (pain, farine, semoule, pâtes, couscous, sucre, huile,
# lait, café) ne sont plus relevés ici : les figures les lisent dans la série engendrée
# precis/_seriescache/compensation-prix-administres.csv, avec leurs textes et leurs liens.
# Ce relevé ne garde que ce que cette série ne porte pas, sans doublon avec elle :
#   - les trois prix tirés des rapports annuels de la Banque centrale (gros pain avant le
#     31 mai 1975 et en 1980, huile avant le 31 mai 1975), qui ne sont pas fixés par un texte
#     lu et n'ont pas de date d'effet établie ;
#   - les prix de la farine et de la semoule des décrets n° 75-352 et 79-413, fixés à un autre
#     stade que le public (rendus au chef-lieu de la délégation ou à la fabrique), dans les
#     données, non tracés ;
#   - le poids du gros pain et de la baguette fixé en 2016 et en 2020, sans prix.
# La figure réunit les deux sources ligne par ligne (fonction _prix du module).
#
# D'OÙ VIENNENT LES VALEURS. Des rapports annuels de la Banque centrale (statut
# « rapport BCT »), des décrets de 1975 et 1979 et des arrêtés de 2016 et 2020 lus au Journal
# officiel (notes docs/notes/compensation-produits-base-documentaliste.md et
# docs/notes/compensation-produits-base-complements-2026-11-17.md).

format: long
cle_de_ligne: [serie, rang]

colonnes:
  serie: pain_gros, pain_petit (baguette en 2016 et 2020), farine (panifiable), semoule, huile (mélangée) ; mêmes noms que les courbes de la figure
  rang: ordre de la ligne dans la série
  date_effet: date d'effet (AAAA-MM-JJ), vide si elle n'est pas établie
  annee: année de la ligne
  regle_date: énoncée (par le texte), calculée (règle d'entrée en vigueur), publication (date du fascicule, faute de mieux), non établie
  valeur: millimes la pièce (pain), millimes le kilo (farine, semoule), millimes le litre (huile) ; vide pour une ligne de poids seul
  poids_g: poids du pain, en grammes
  texte: référence du texte (numéro, date, fascicule et pages du Journal officiel) ou du rapport
  cle: clé de citation, vide si la notice n'est pas encore versée
  url: fascicule du Journal officiel sur pist.tn (édition française)
  statut: rapport BCT, poids seul (texte qui fixe le poids, non le prix), autre stade (prix rendu au chef-lieu de délégation ou à la fabrique, non au public ; dans les données, non tracé)
  remarque: variété, unité d'origine, règle de date

sources:
  - arrete-2016-06-22-pain
  - arrete-2020-11-13-pain
  - bct-ra-1975
  - bct-ra-1983
  - decret75-352
  - decret79-413

couverture: PARTIELLE dans le temps
couverture_detail: >-
  Trois prix des rapports de la Banque centrale (1975, 1980), quatre prix à un autre stade
  que le public (1975, 1979) et le poids du pain de 2016 et de 2020. Les prix au public de
  1974 à 1991 sont dans la série engendrée compensation-prix-administres.

reserves:
  pain_1980: >-
    Le prix de 80 millimes du gros pain en 1980 vient du rapport de la Banque centrale pour
    1983 ; la date d'effet n'est pas établie. La figure le trace en pointillé du 1er janvier
    1981 à l'arrêté du 28 décembre 1983 (effet au 1er janvier 1984).
  stade_1975_1979: >-
    Les prix de la farine et de la semoule des décrets n° 75-352 et 79-413 sont « au quintal
    net, nu, rendu au chef lieu de la délégation » (farines) ou « rendu fabrique ou magasin »
    (semoules de 1975) : ce ne sont pas des prix au public. Statut « autre stade », non tracés ;
    la valeur est convertie en millimes le kilo (1 D le quintal = 10 millimes le kilo).
  poids_2016_2020: >-
    Les arrêtés de 2016 et de 2020 fixent le poids du gros pain (400 g) et de la baguette
    (220 g), sans prix au public.
