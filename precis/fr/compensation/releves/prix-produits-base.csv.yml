# Manifeste du relevé des prix administrés des produits de base, 1974-2020.
#
# Fichier TENU À LA MAIN — il n'est produit par aucun générateur. Il accompagne
# prix-produits-base.csv, que lit precis/fr/compensation/figures/produits_base.py.
#
# D'OÙ VIENNENT LES VALEURS. Des arrêtés et décrets de prix lus au Journal officiel
# (notes docs/notes/compensation-produits-base-documentaliste.md et
# docs/notes/compensation-produits-base-complements-2026-11-17.md, § 2, 3.4 et 12 ;
# docs/notes/compensation-arretes-lisibles-2026-11-17.md, § 2, fascicules lus à l'image), et,
# pour trois valeurs, des rapports annuels de la Banque centrale (statut « rapport BCT »).

format: long
cle_de_ligne: [serie, rang]

colonnes:
  serie: pain_gros, pain_petit (petit pain puis baguette), farine (panifiable), farine_ps7, semoule, pates, couscous, sucre (en poudre), huile (mélangée, puis de graines), lait_uht, lait_pasteurise
  rang: ordre de la ligne dans la série
  date_effet: date d'effet (AAAA-MM-JJ), vide si elle n'est pas établie
  annee: année de la ligne
  regle_date: énoncée (par le texte), calculée (règle d'entrée en vigueur), publication (date du fascicule, faute de mieux), non établie, loi, ou fin de série (fin de l'année de la dernière valeur publiée)
  valeur: millimes la pièce (pain), millimes le kilo (dérivés, sucre), millimes le litre (huile, lait) ; vide si la valeur n'est pas établie
  poids_g: poids du pain, en grammes
  texte: référence du texte (numéro, date, fascicule et pages du Journal officiel) ou du rapport
  cle: clé de citation, vide si la notice n'est pas encore versée
  url: fascicule du Journal officiel sur pist.tn (édition française)
  statut: texte, rapport BCT, non établi (un texte change la valeur, qui n'est pas établie), fin (dernière valeur publiée close), poids seul (texte qui fixe le poids, non le prix), autre stade (prix rendu au chef-lieu de délégation ou à la fabrique, non au public ; dans les données, non tracé)
  remarque: variété, unité d'origine, règle de date

