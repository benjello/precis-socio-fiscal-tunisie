couverture: PARTIELLE dans le temps
couverture_detail: >-
  Les prix au public s'arrêtent à 1991 : aucun prix de vente au public du pain et des
  dérivés n'est publié après le 1er janvier 1992. Une ligne
  « non établi » marque un texte qui change la valeur sans qu'elle soit relevée : la série
  s'interrompt à sa date.

reserves:
  pain_par_kilo: >-
    Le poids du pain change le 30 août 1986 et le 12 août 1989 sans que le prix change ; le
    prix au kilo est calculé (prix ÷ poids), non lu.
  pain_1980: >-
    Le prix de 80 millimes du gros pain en 1980 vient du rapport de la Banque centrale pour
    1983 ; la date d'effet n'est pas établie.
  varietes: >-
    La semoule, les pâtes et le couscous changent de variété en 1983 (PS-10) ; les valeurs
    sont celles de la variété courante que nomme chaque texte.
  stade_1975_1979: >-
    Les prix de la farine et de la semoule des décrets n° 75-352 et 79-413 sont « au quintal
    net, nu, rendu au chef lieu de la délégation » (farines) ou « rendu fabrique ou magasin »
    (semoules de 1975) : ce ne sont pas des prix au public. Statut « autre stade », non tracés.
  farine_ps7: >-
    La farine PS-7 est une autre farine que la farine panifiable (PS-2, puis PS) : série à part,
    jamais raccordée. Son seul prix au public relevé est celui du 12 août 1989.
  semoule_unite: >-
    La semoule est fixée au quintal jusqu'en 1989, au kilo en vrac en 1991 ; la valeur est
    convertie en millimes le kilo (1 D le quintal = 10 millimes le kilo).
  lait_1982: >-
    L'arrêté du 21 novembre 1982 dit « lait régénéré », sans « demi-écrémé » ; ceux de 1989 et
    de 1991 disent « demi-écrémé ». Les prix sont raccordés, à comparabilité incertaine.
  dates_d_effet: >-
    Dates reprises telles que les articles 1er les énoncent, même antérieures à la signature ou
    à la publication (sucre 1980, 1988, 1990 ; huile 1980 ; lait 1982). Écarts du texte même :
    huile 1986, 7 décembre (art. 1er) et 10 décembre (art. 2, stocks) ; lait 1991, 22 juillet
    (art. 1er) et « d'application immédiate » (art. 3) ; sucre 1991, l'art. 2 imprime « 17 juin
    1990 ». La date de l'art. 1er est retenue.
