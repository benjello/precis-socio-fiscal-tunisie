caveats: [La subvention d'exploitation des comptes n'est pas la ligne budgétaire : jusqu'en 2014 elle comprend la subvention indirecte, c'est-à-dire le gaz valorisé à sa valeur économique. Elle égale le soutien total du rapport de contrôle, à l'arrondi imprimé près. Rupture de 2015. Aucune valeur après 2016. Dinars courants., UN SEUL PIB PAR ANNÉE, QUI CHANGE DE BASE : tracer la part du PIB par segments de `segment_pib` (ruptures en 1986, 1997, 2002, 2005, 2010 et 2025), jamais d'un trait continu ni en groupant par `base_pib` ; de 2010 à 2024 le PIB est celui de l'INS en base 2015 (rétropolé pour 2010-2014), avant 2010 et en 2025 celui du ministère des Finances, avant 1986 celui de la Banque mondiale ; `rupture_pib` porte les libellés partagés avec `masse-salariale-ratios` ; pour comparer les bases entre elles, lire `compensation-ratios`. Filtrer `famille` : les familles ne se raccordent pas, et `nature` sépare le budgétaire des rapports extérieurs. Dépenses de l'État hors service de la dette. Carburants : périmètre élargi en 2015 (colonne `rupture`), la baisse de 2015 tenant au prix du baril. 2025 et 2026 sont des lois de finances (`etat_norme`). Voir docs/compensation-depense-par-poste.md et docs/compensation-ratios.md.]
