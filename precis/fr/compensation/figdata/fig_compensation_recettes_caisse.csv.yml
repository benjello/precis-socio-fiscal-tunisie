caveats: [Deux familles et deux dépenses en regard (colonnes `famille`, `famille_depense`) : ne pas les relier. Trous en 1987-1990, 1997 et 2000-2008. PIB : celui du ministère, par segments de `segment_pib` ; Banque mondiale en 1984-1985. Voir docs/compensation-depense-par-poste.md., UN SEUL PIB PAR ANNÉE, QUI CHANGE DE BASE : tracer la part du PIB par segments de `segment_pib` (ruptures en 1986, 1997, 2002, 2005, 2010, 2015 et 2025), jamais d'un trait continu ni en groupant par `base_pib` ; pour comparer les bases entre elles, lire `compensation-ratios`. Filtrer `famille` : les familles ne se raccordent pas, et `nature` sépare le budgétaire des rapports extérieurs. Dépenses de l'État hors service de la dette. Carburants : rupture de périmètre en 2015. 2025 et 2026 sont des lois de finances (`etat_norme`). Voir docs/compensation-depense-par-poste.md et docs/compensation-ratios.md.]
