caveats: [Le prix de juin 1994 de la basse et de la moyenne pression (17,1 et 14 millimes) est relayé sans date d'effet ; il est rattaché à juin 1994 par un calcul, non par une lecture. La hausse de 1993 n'a pas de mois : le prix de 1992 est arrêté au 1er janvier 1993, par convention. Les grilles de la basse pression de 2004 et de 2006, exprimées par mètre cube, et celles de septembre 2012 et de mars 2013 ne sont pas reprises ; celles de la moyenne pression de septembre 2012 et de mars 2013 ne sont pas établies. Jusqu'en avril 2014, le prix de la haute pression au-delà de son premier niveau, et jusqu'en 2008 celui de son premier niveau, est une formule indexée sur le fuel lourd : aucune valeur n'est tracée. À partir du 1er septembre 2018, les grilles de la basse pression distinguent les ménages. Une bande grise s'ouvre à une date de relèvement que donne une pièce du chapitre (rapport annuel de la STEG, rapport extérieur, grille d'un autre niveau de tension), pour ce niveau, pour l'ensemble des tarifs ou pour la basse tension, sans que la grille de ce niveau soit établie : le niveau précédent s'arrête à cette date, aucune valeur n'est reconstituée ; ces dates sont des lignes « grille non établie » de l'onglet « Données », chacune avec sa pièce. Monnaie de 2025 : valeurs calculées, non observées. La référence est l'indice annuel moyen de 2025, le dernier indice annuel publié (base 100 en 2015, 186,3, que relaie la Banque centrale) ; elle sera actualisée à la publication de l'indice annuel suivant. Le coefficient d'une année est l'indice annuel moyen de 2025 divisé par celui de cette année ; une date d'effet en cours d'année est ramenée par l'indice annuel moyen de son année d'effet, et une grille qui dure plusieurs années est ramenée année par année (la valeur de la grille baisse en monnaie de 2025 tant qu'elle ne change pas). Les indices annuels sont ceux de l'INS en base 1970 jusqu'en 2023, prolongés pour 2024 et 2025 par la variation de l'indice en base 2015 que relaie la Banque centrale (indice de 2025 : 2 092,7 en base 1970, par ce raccord) ; sur 2015-2023, où les deux bases sont publiées, leur rapport varie de 0,3 %. Les familles et les ruptures de la figure ne sont pas raccordées par ce changement d'unité., DEUX INDICES RACCORDÉS EN 1970 : l'indice du coût de la vie en base 100 en 1962 (131,6 en 1970) est ramené à la base 1970. Les valeurs 1962-1975 sont RELEVÉES À LA MAIN dans les rapports de la BCT, dont la couche texte est une océrisation abîmée (« 12S,O » pour 125,0) ; chacune est recoupée par la variation énoncée en prose, et la source de chaque valeur est dans la colonne `source`. L'annuaire 1995-2001 imprime 108,2 pour 1985 au lieu de 288,0 : ligne écartée, valeur prise dans l'annuaire 1998-2002. Le plus récent annuaire fait foi (2001 : 640,5 au lieu de 645,4 provisoire). Au-delà de 2003, employer `bct-ipc-base2015`., EXTRAIT DU RAPPORT ANNUEL, ET NON DU BULLETIN : l'intitulé du BSF (« base 100 en 2010 ») est périmé et ses valeurs récentes sont en base 2015 — voir docs/tables-a-extraire-pdf.md §1. L'ANNÉE DE BASE 2015 = 100 EST POSÉE PAR DÉFINITION, non lue : aucun rapport ne tabule son année de base, tous ne publiant que les millésimes récents. Série RECONSTITUÉE en recollant huit rapports, de 2018 à 2025 (ceux de 2021 et de 2025 coupent le libellé sur trois lignes ; ils sont lus depuis le 2026-10-08), chacun n'en publiant que trois millésimes ; toutes les années communes concordent, et le script LÈVE en cas de divergence — un indice de prix ne se révise pas d'une publication à l'autre, contrairement aux effectifs. La colonne `rapports_concordants` compte les rapports qui impriment la valeur : 2025 (186,3) n'en a qu'UN, le Rapport annuel 2025 (tableau 2-1, p. 57), qui reprend 2024 (176,8) sans le réviser. ÉCART AU TAUX IMPRIMÉ EN 2025 : 186,3 ÷ 176,8 donne +5,37 %, soit 5,4 au dixième, quand le même rapport imprime 5,3 % d'inflation moyenne ; l'arrondi des deux indices permet 5,32 à 5,43 %, et un taux imprimé 5,3 recouvre 5,25 à 5,35 % : les deux ne se rejoignent qu'à la limite (5,32 à 5,35). Le rapport ne dit pas comment il calcule le taux moyen ; écart signalé, non expliqué, rien n'est corrigé. S'ARRÊTE EN 2025 : aucune déflation n'est possible au-delà, ce qui laisse sans équivalent réel les tranches d'augmentation programmées jusqu'en 2028. Déflater une date en cours d'année par l'indice ANNUEL MOYEN est une approximation.]
