caveats: [Trois séries qui ne se raccordent pas. Le prix de cession est un prix administré, constant, non un prix d'achat. Le prix moyen de la STEG porte sur toutes les sources de gaz et son numérateur comprend le fuel et le gazole. Ruptures : 2007 (la STEG comptabilise le gaz à sa valeur économique) et 2015 (fin du prix de cession). Aucune valeur avant 1993 ni après 2023. Dinars courants. Monnaie de 2025 : valeurs calculées, non observées. La référence est l'indice annuel moyen de 2025, le dernier indice annuel publié (base 100 en 2015, 186,3, que relaie la Banque centrale) ; elle sera actualisée à la publication de l'indice annuel suivant. Le coefficient d'une année est l'indice annuel moyen de 2025 divisé par celui de cette année ; une date d'effet en cours d'année est ramenée par l'indice annuel moyen de son année d'effet, et une grille qui dure plusieurs années est ramenée année par année (la valeur de la grille baisse en monnaie de 2025 tant qu'elle ne change pas). Les indices annuels sont ceux de l'INS en base 1970 jusqu'en 2023, prolongés pour 2024 et 2025 par la variation de l'indice en base 2015 que relaie la Banque centrale (indice de 2025 : 2 092,7 en base 1970, par ce raccord) ; sur 2015-2023, où les deux bases sont publiées, leur rapport varie de 0,3 %. Les familles et les ruptures de la figure ne sont pas raccordées par ce changement d'unité., DEUX INDICES RACCORDÉS EN 1970 : l'indice du coût de la vie en base 100 en 1962 (131,6 en 1970) est ramené à la base 1970. Les valeurs 1962-1975 sont RELEVÉES À LA MAIN dans les rapports de la BCT, dont la couche texte est une océrisation abîmée (« 12S,O » pour 125,0) ; chacune est recoupée par la variation énoncée en prose, et la source de chaque valeur est dans la colonne `source`. L'annuaire 1995-2001 imprime 108,2 pour 1985 au lieu de 288,0 : ligne écartée, valeur prise dans l'annuaire 1998-2002. Le plus récent annuaire fait foi (2001 : 640,5 au lieu de 645,4 provisoire). Au-delà de 2003, employer `bct-ipc-base2015`., EXTRAIT DU RAPPORT ANNUEL, ET NON DU BULLETIN : l'intitulé du BSF (« base 100 en 2010 ») est périmé et ses valeurs récentes sont en base 2015 — voir docs/tables-a-extraire-pdf.md §1. L'ANNÉE DE BASE 2015 = 100 EST POSÉE PAR DÉFINITION, non lue : aucun rapport ne tabule son année de base, tous ne publiant que les millésimes récents. Série RECONSTITUÉE en recollant huit rapports, de 2018 à 2025 (ceux de 2021 et de 2025 coupent le libellé sur trois lignes ; ils sont lus depuis le 2026-10-08), chacun n'en publiant que trois millésimes ; toutes les années communes concordent, et le script LÈVE en cas de divergence — un indice de prix ne se révise pas d'une publication à l'autre, contrairement aux effectifs. La colonne `rapports_concordants` compte les rapports qui impriment la valeur : 2025 (186,3) n'en a qu'UN, le Rapport annuel 2025 (tableau 2-1, p. 57), qui reprend 2024 (176,8) sans le réviser. ÉCART AU TAUX IMPRIMÉ EN 2025 : 186,3 ÷ 176,8 donne +5,37 %, soit 5,4 au dixième, quand le même rapport imprime 5,3 % d'inflation moyenne ; l'arrondi des deux indices permet 5,32 à 5,43 %, et un taux imprimé 5,3 recouvre 5,25 à 5,35 % : les deux ne se rejoignent qu'à la limite (5,32 à 5,35). Le rapport ne dit pas comment il calcule le taux moyen ; écart signalé, non expliqué, rien n'est corrigé. S'ARRÊTE EN 2025 : aucune déflation n'est possible au-delà, ce qui laisse sans équivalent réel les tranches d'augmentation programmées jusqu'en 2028. Déflater une date en cours d'année par l'indice ANNUEL MOYEN est une approximation.]
