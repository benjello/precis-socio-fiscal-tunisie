caveats: [La grandeur qui pèse sur le budget est la dotation, non les charges. Rupture de 1987 : les recettes de la Caisse sont intégrées au budget, la dotation passe de 68 à 189 millions de dinars sans hausse des charges. Dotation non donnée par le rapport en 1988-1990, 2000-2001, 2003, 2006, 2008-2009 et 2011 : laissée vide, jamais déduite des charges. Charges par produit incomplètes pour 1985, 1992, 1993 et 1995. Le champ des produits change. La part du PIB se lit par segments.]
