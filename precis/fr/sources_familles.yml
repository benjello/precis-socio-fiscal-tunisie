# Table producteur -> famille de source, pour l'annexe engendrée « Les sources de
# données chiffrées » (precis/fr/annexe-sources.qmd, engendrée par
# precis/fr/figures/annexe_sources.py).
#
# COMMENT LA FAMILLE EST ASSIGNÉE. Pour chaque source (une entrée de
# references.json citée par un manifeste de figure), on lit son producteur
# (`publisher`, ou à défaut l'auteur) et on cherche, dans l'ordre des familles
# ci-dessous, la première dont une des sous-chaînes `producteurs` apparaît dans le
# producteur (comparaison insensible à la casse et aux accents). La première qui
# correspond l'emporte ; si aucune ne correspond, la source tombe dans « Autres
# sources chiffrées » (défaut, émise en dernier).
#
# CAS PARTICULIER DES LOIS DE FINANCES. Une source du ministère des Finances dont
# le titre est une ANNEXE chiffrée à une loi de finances (titre contenant à la fois
# « annexe » et « loi de finances ») est reclassée dans « Annexes chiffrées des lois
# de finances », quelle que soit la règle de producteur. La règle vit dans le script
# (fonction `_famille`), la liste `producteurs` de cette famille reste donc vide.
#
# AJOUT D'UN PRODUCTEUR. Ajouter une sous-chaîne discriminante à la bonne famille,
# ici et à un seul endroit ; ne rien recopier dans le script ni dans la page.
# L'ordre des familles est celui de l'affichage (le plus central/officiel d'abord).

familles:
  - nom: "Rapports du ministère des Finances"
    producteurs:
      - "ministere des finances"
      - "ministere de l'economie, des finances"
      - "controle general des finances"

  - nom: "Annexes chiffrées des lois de finances"
    producteurs: []   # peuplée par la règle « annexe … loi de finances » du script

  - nom: "Cour des comptes"
    producteurs:
      - "cour des comptes"
      - "cour de discipline financiere"

  - nom: "Banque centrale (BCT)"
    producteurs:
      - "banque centrale de tunisie"

  - nom: "Publications statistiques (INS)"
    producteurs:
      - "institut national de la statistique"

  - nom: "Caisses sociales (CNSS, CNAM, CNRPS)"
    producteurs:
      - "caisse nationale de securite sociale"
      - "caisse nationale d'assurance maladie"
      - "caisse nationale de retraite et de prevoyance sociale"

  - nom: "États financiers d'entreprises (Bourse, CMF, Registre national)"
    producteurs:
      - "bourse de tunis"
      - "registre national"
      - "societe tunisienne de l'electricite"
      - "societe tunisienne de l'air"
      - "entreprise tunisienne d'activites petrolieres"
      - "societe de transport des hydrocarbures"
      - "banque de tunisie et des emirats"
      - "banque de l'habitat"
      - "banque nationale agricole"
      - "societe tunisienne de banque"
      - "societe tunisienne d'assurances"
      - "societe tunisienne de reassurance"
      - "les ciments de bizerte"
      - "societe tunisienne des marches de gros"
      - "societe nationale des telecommunications"

  - nom: "Bases internationales (Banque mondiale, FMI, OCDE, BAD)"
    producteurs:
      - "banque mondiale"
      - "world bank"
      - "banque internationale pour la reconstruction"
      - "fonds monetaire international"
      - "banque africaine de developpement"
      - "organisation de cooperation et de developpement"
      - "organisation mondiale du commerce"
      - "gatt"
      - "organisation internationale du travail"
      - "organisation mondiale de la sante"
      - "unicef"
      - "united nations"
      - "agence francaise de developpement"

  - nom: "Autres sources chiffrées"
    producteurs: []   # défaut (ministères sectoriels, agences, divers)
