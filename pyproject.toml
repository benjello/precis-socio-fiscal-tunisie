[project]
name = "precis-tunisie"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "itables>=2.2.4",
    "jupyter>=1.1.1",
    "matplotlib>=3.8",
    "pandas>=2",
    "pyyaml>=6",
]

# Le build du site est AUTONOME : il ne dépend pas de l'entrepôt `tunisia-data`,
# qui n'est donc PAS déclaré ici (une source path épinglée dans uv.lock ferait
# échouer `uv sync` en CI où le repo privé est absent).
# Les figures lisent les séries via la couche `scripts/figtools.py`, qui retombe
# sur le snapshot versionné `precis/_seriescache/` quand l'entrepôt est absent.
# Pour *régénérer* ce snapshot (étape « produire »), un dev installe l'entrepôt
# éditable à la demande dans l'environnement, puis lance refresh_cache :
#     uv pip install -e ../tunisia-data
#     PYTHONPATH=scripts uv run python -c "import figtools; figtools.refresh_cache('id', ...)"

